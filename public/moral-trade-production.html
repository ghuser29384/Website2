<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Moral Trade — discover reciprocal commitments and shared gains through an interactive walkthrough.">
  <title>Moral Trade</title>
  <style>
    html, body { margin: 0; min-height: 100%; background: #11120f; color: #f2eee6; font-family: system-ui, sans-serif; }
    main { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    p { max-width: 40rem; line-height: 1.5; }
  </style>
</head>
<body>
  <main><p id="loading">Loading Moral Trade…</p></main>
  <script>
    (async function loadMoralTrade() {
      try {
        const firstVisit = new URLSearchParams(window.location.search).get("first_visit") === "1";
        const response = await fetch("/moral-trade-interactive-walkthroughs.html", {
          cache: "no-store",
          credentials: "same-origin"
        });
        if (!response.ok) throw new Error(`Walkthrough source returned ${response.status}`);

        let html = await response.text();
        const oldConcept = '{ id: "two-moves", short: "Third option", title: "The Third Option", caption: "A cinematic two-person exchange" },';
        const newConcept = '{ id: "two-moves", short: "Third option", title: "Welcome to Moral Trade", caption: "A cinematic two-person exchange" },';
        if (!html.includes(oldConcept)) throw new Error("Walkthrough concept marker was not found");

        html = html.replace(oldConcept, newConcept);

        const walkthroughRoutes = [
          ['href: "https://moraltrade.org/create?mode=back"', 'href: "/create?source=walkthrough&mode=back"'],
          ['href: "https://moraltrade.org/create"', 'href: "/create?source=walkthrough&mode=trade"'],
          ['href: "https://moraltrade.org/offers"', 'href: "/discover?source=walkthrough&domain=offers&view=list"'],
          ['href: "https://moraltrade.org/pools"', 'href: "/discover?source=walkthrough&domain=pools&view=threshold"']
        ];
        walkthroughRoutes.forEach(([from, to]) => {
          html = html.replaceAll(from, to);
        });
        html = html.replaceAll(' target="_blank" rel="noreferrer"', '');

        const firstVisitStyles = firstVisit
          ? `<style>
              .mtw-first-visit-skip-form{position:fixed;top:19px;right:72px;z-index:200;margin:0}
              .mtw-first-visit-skip-button{min-width:64px;min-height:42px;padding:0 16px;border:1px solid rgba(244,240,232,.34);border-radius:999px;background:rgba(17,18,15,.88);color:#f4f0e8;box-shadow:0 10px 28px rgba(0,0,0,.18);backdrop-filter:blur(14px);font:650 14px/1 system-ui,sans-serif;cursor:pointer}
              .mtw-first-visit-skip-button:hover{border-color:rgba(244,240,232,.72);background:rgba(39,40,35,.96)}
              .mtw-first-visit-skip-button:focus-visible{outline:3px solid #9db0ff;outline-offset:4px}
              @media(max-width:740px){.mtw-first-visit-skip-form{top:13px;right:61px}.mtw-first-visit-skip-button{min-width:58px;padding:0 12px;font-size:13px}}
            </style>`
          : "";
        const firstVisitControl = firstVisit
          ? '<form action="/" class="mtw-first-visit-skip-form" method="get"><button aria-label="Skip walkthrough" class="mtw-first-visit-skip-button" type="submit">Skip</button></form>'
          : "";

        html = html.replace(
          "</head>",
          `${firstVisitStyles}<link rel="stylesheet" href="/walkthrough-profile-enhancement.css"></head>`
        );
        html = html.replace("<body>", `<body>${firstVisitControl}`);
        html = html.replace(
          "</body>",
          '<script src="/walkthrough-profile-enhancement.js"><\/script></body>'
        );

        document.open();
        document.write(html);
        document.close();
      } catch (error) {
        const loading = document.getElementById("loading");
        if (loading) loading.textContent = "Unable to load Moral Trade. Please refresh.";
        console.error(error);
      }
    })();
  </script>
  <noscript><main><p>JavaScript is required to use Moral Trade.</p></main></noscript>
</body>
</html>
