<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Moral Trade — redirect opposed donations, form coalitions, and discover reciprocal commitments through an interactive walkthrough.">
  <link rel="icon" type="image/png" sizes="512x512" href="/brand/moral-trade-mark.png?v=20260730">
  <link rel="shortcut icon" type="image/png" sizes="512x512" href="/brand/moral-trade-mark.png?v=20260730">
  <link rel="apple-touch-icon" sizes="512x512" href="/brand/moral-trade-mark.png?v=20260730">
  <title>Moral Trade</title>
  <style>
    html, body { margin: 0; min-height: 100%; background: #11120f; color: #f2eee6; font-family: system-ui, sans-serif; }
    main { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    p { max-width: 40rem; line-height: 1.5; }
  </style>
</head>
<body>
  <main><p id="loading">Loading Moral Trade…</p></main>
  <script>
    (async function loadMoralTrade() {
      try {
        const accountPromise = fetch("/api/live-account", {
          credentials: "same-origin",
          headers: { Accept: "application/json" },
        })
          .then((response) => (response.ok ? response.json() : { authenticated: false }))
          .catch(() => ({ authenticated: false }));
        const [response, liveAccount] = await Promise.all([
          fetch("/moral-trade-interactive-walkthroughs.html", {
            cache: "no-store",
            credentials: "same-origin",
          }),
          accountPromise,
        ]);
        if (!response.ok) throw new Error(`Walkthrough source returned ${response.status}`);

        let html = await response.text();
        const oldConcept = '{ id: "two-moves", short: "Third option", title: "The Third Option", caption: "A cinematic two-person exchange" },';
        const newConcept = '{ id: "two-moves", short: "Third option", title: "Welcome to Moral Trade", caption: "A cinematic two-person exchange" },';
        if (!html.includes(oldConcept)) throw new Error("Walkthrough concept marker was not found");

        html = html.replace(oldConcept, newConcept);

        const walkthroughRoutes = [
          ['href: "https://moraltrade.org/create?mode=back"', 'href: "/create?source=walkthrough&mode=back"'],
          ['href: "https://moraltrade.org/create"', 'href: "/create?source=walkthrough&mode=trade"'],
          ['href: "https://moraltrade.org/offers"', 'href: "/discover?source=walkthrough&domain=offers&view=list"'],
          ['href: "https://moraltrade.org/pools"', 'href: "/discover?source=walkthrough&domain=pools&view=threshold"']
        ];
        walkthroughRoutes.forEach(([from, to]) => {
          html = html.replaceAll(from, to);
        });
        html = html.replaceAll(' target="_blank" rel="noreferrer"', '');

        const accountJson = JSON.stringify(liveAccount)
          .replace(/</g, "\\u003c")
          .replace(/>/g, "\\u003e")
          .replace(/&/g, "\\u0026")
          .replace(/\u2028/g, "\\u2028")
          .replace(/\u2029/g, "\\u2029");
        const faviconLinks = [
          '<link rel="icon" type="image/png" sizes="512x512" href="/brand/moral-trade-mark.png?v=20260730">',
          '<link rel="shortcut icon" type="image/png" sizes="512x512" href="/brand/moral-trade-mark.png?v=20260730">',
          '<link rel="apple-touch-icon" sizes="512x512" href="/brand/moral-trade-mark.png?v=20260730">',
        ].join("");
        const accountScripts = [
          `<script>window.__MT_LIVE_ACCOUNT_BOOTSTRAP__=${accountJson};<\/script>`,
          '<script src="/moral-trade-account-identity.js"><\/script>',
          '<script src="/moral-trade-live-account.js"><\/script>',
        ].join("");
        const headEnhancements = [
          faviconLinks,
          '<link rel="stylesheet" href="/walkthrough-profile-enhancement.css">',
          '<link rel="stylesheet" href="/moral-trade-input-assist.css">',
          accountScripts,
        ].join("");

        html = html.replace("</head>", `${headEnhancements}</head>`);
        html = html.replace(
          "</body>",
          '<script src="/walkthrough-profile-enhancement.js"><\/script><script src="/moral-trade-brand.js"><\/script><script src="/moral-trade-input-assist.js"><\/script></body>'
        );

        document.open();
        document.write(html);
        document.close();
      } catch (error) {
        const loading = document.getElementById("loading");
        if (loading) loading.textContent = "Unable to load Moral Trade. Please refresh.";
        console.error(error);
      }
    })();
  </script>
  <noscript><main><p>JavaScript is required to use Moral Trade.</p></main></noscript>
</body>
</html>
