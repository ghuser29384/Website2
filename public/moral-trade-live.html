<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Moral Trade — decide, allocate, negotiate, and verify reciprocal commitments."><title>Moral Trade — Live</title><style>html,body{margin:0;background:#f5f2e9;color:#111;font-family:system-ui,sans-serif}main{min-height:100vh;display:grid;place-items:center;padding:24px}p{max-width:40rem;line-height:1.5}</style></head><body><main><p id="loading">Loading Moral Trade…</p></main><script>(async()=>{try{const a=await Promise.all(Array.from({length:6},(_,i)=>fetch(`https://moral-trade-live.vercel.app/c${i}.txt`).then(r=>{if(!r.ok)throw Error(`chunk ${i}`);return r.text()})));const b=Uint8Array.from(atob(a.join('')),c=>c.charCodeAt(0));const s=new Blob([b]).stream().pipeThrough(new DecompressionStream('gzip'));const h=await new Response(s).text();document.open();document.write(h);document.close()}catch(e){document.getElementById('loading').textContent='Unable to load the interface. Please refresh.';console.error(e)}})();</script><noscript><main><p>JavaScript is required to use Moral Trade.</p></main></noscript></body></html>
