<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Moral Trade — decide, allocate, negotiate, and verify reciprocal commitments.">
  <link rel="icon" type="image/png" sizes="512x512" href="/brand/moral-trade-mark.png?v=20260730">
  <link rel="shortcut icon" type="image/png" sizes="512x512" href="/brand/moral-trade-mark.png?v=20260730">
  <link rel="apple-touch-icon" sizes="512x512" href="/brand/moral-trade-mark.png?v=20260730">
  <title>Moral Trade — Live</title>
  <style>
    html,body{margin:0;background:#f5f2e9;color:#111;font-family:system-ui,sans-serif}
    main{min-height:100vh;display:grid;place-items:center;padding:24px}
    p{max-width:40rem;line-height:1.5}
  </style>
</head>
<body>
  <!-- The root URL remains the live Feed; Trade creation routes through /trades/new. -->
  <main><p id="loading">Loading Moral Trade…</p></main>
  <script>
    (async () => {
      if (window.location.hash === '#trade') {
        window.location.replace('/trades/new');
        return;
      }

      try {
        const stripLegacyNowFocus = (source) => {
          const startMarker = 'function nowFocus(){';
          const endMarker = '\nfunction story(';
          const start = source.indexOf(startMarker);
          const end = source.indexOf(endMarker, start);
          if (start < 0 || end < 0) throw new Error('live Now source markers');

          const loadingState = `function nowFocus(){
 return '<div class="focus-layout" data-mt-live-now="adaptive" data-mt-live-now-state="loading"><main><section class="panel black urgent"><div><div class="eyebrow orange">Loading your profile</div><h2>Finding live moral opportunities that match your priorities and action preferences.</h2><p class="muted">No generic or demo suggestions are shown.</p></div></section></main></div>';
}`;
          const withoutFocus = `${source.slice(0, start)}${loadingState}${source.slice(end)}`;
          const planStartMarker = 'function nowPlan(){';
          const planEndMarker = '\nfunction field(';
          const planStart = withoutFocus.indexOf(planStartMarker);
          const planEnd = withoutFocus.indexOf(planEndMarker, planStart);
          if (planStart < 0 || planEnd < 0) throw new Error('live Plan source markers');
          const loadingPlan = `function nowPlan(){
 return '<div class="plan-grid" data-mt-live-route-planner="loading"><aside class="panel plan-control"><div class="eyebrow orange">Private route profile</div><p class="muted">Loading your limits…</p></aside><main><section class="panel route"><div class="eyebrow orange">Checking live routes</div><h2>Loading private limits and current opportunities.</h2><p class="muted">No fixed or fallback route is shown.</p></section></main><aside class="stack"><section class="panel"><div class="eyebrow">Route tools</div><p class="muted">Loading only when useful…</p></section></aside></div>';
}`;
          return `${withoutFocus.slice(0, planStart)}${loadingPlan}${withoutFocus.slice(planEnd)}`;
        };
        const retireLegacyTradeBuilder = (source) => {
          const startMarker = 'function clauseBuilder(){';
          const endMarker = '\nfunction exchangeBuilder(){';
          const start = source.indexOf(startMarker);
          const end = source.indexOf(endMarker, start);
          if (start < 0 || end <= start) throw new Error('legacy Trade builder source markers');

          const retiredBuilder = `function clauseBuilder(){
 return '<div class="builder-layout" data-mt-legacy-trade-builder="retired"><main><section class="panel"><div class="eyebrow">Create a trade</div><h2>Trade creation has moved.</h2><p>Use the all-trades creation page for every new commitment, exchange, redirect, or collective action.</p><a class="btn primary" href="/trades/new">Open Create →</a></section></main></div>';
}`;
          return `${source.slice(0, start)}${retiredBuilder}${source.slice(end)}`;
        };
        const names = ['0a','0b','0c','0d','1','2','3','4a','4b','4c','4d','5a','5b','5c','5d'];
        const unavailableLiveNow = (payload = {}) => ({
          ...payload,
          authenticated: payload.authenticated === true,
          recommendations: Array.isArray(payload.recommendations) ? payload.recommendations : [],
          status: payload.status || 'unavailable',
          routePlanner: {
            status: 'unavailable',
            checkedAt: new Date().toISOString(),
            profile: {},
            needsMoreInput: [],
            routes: [],
            comparison: null,
            candidateCount: 0,
          },
        });
        const accountPromise = fetch('/api/live-account', {
          credentials: 'same-origin',
          headers: { Accept: 'application/json' },
        })
          .then((response) => (response.ok ? response.json() : { authenticated: false }))
          .catch(() => ({ authenticated: false }));
        const liveNowPromise = fetch('/api/live-now', {
          credentials: 'same-origin',
          headers: { Accept: 'application/json' },
        })
          .then(async (response) => {
            if (!response.ok) return unavailableLiveNow();
            const payload = await response.json();
            return payload && typeof payload === 'object' && payload.routePlanner
              ? payload
              : unavailableLiveNow(payload);
          })
          .catch(() => unavailableLiveNow());
        const [chunks, liveAccount, liveNow] = await Promise.all([
          Promise.all(
            names.map((name) =>
              fetch(`/mt-live-0d0e0f03-${name}.txt`).then((response) => {
                if (!response.ok) throw new Error(`chunk ${name}`);
                return response.text();
              }),
            ),
          ),
          accountPromise,
          liveNowPromise,
        ]);
        const compressed = Uint8Array.from(atob(chunks.join('')), (character) => character.charCodeAt(0));
        const raw = await new Response(
          new Blob([compressed]).stream().pipeThrough(new DecompressionStream('gzip')),
        ).arrayBuffer();
        const digest = [...new Uint8Array(await crypto.subtle.digest('SHA-256', raw))]
          .map((value) => value.toString(16).padStart(2, '0'))
          .join('');

        if (digest !== '0d0e0f030dfca8329e3f72ba42b5811c72d338166f96a5231445b9fc4956124e') {
          throw new Error('integrity');
        }

        const source = retireLegacyTradeBuilder(
          stripLegacyNowFocus(new TextDecoder().decode(raw)),
        );
        const accountJson = JSON.stringify(liveAccount)
          .replace(/</g, '\\u003c')
          .replace(/>/g, '\\u003e')
          .replace(/&/g, '\\u0026')
          .replace(/\u2028/g, '\\u2028')
          .replace(/\u2029/g, '\\u2029');
        const liveNowJson = JSON.stringify(liveNow)
          .replace(/</g, '\\u003c')
          .replace(/>/g, '\\u003e')
          .replace(/&/g, '\\u0026')
          .replace(/\u2028/g, '\\u2028')
          .replace(/\u2029/g, '\\u2029');
        const faviconLinks = [
          '<link rel="icon" type="image/png" sizes="512x512" href="/brand/moral-trade-mark.png?v=20260730">',
          '<link rel="shortcut icon" type="image/png" sizes="512x512" href="/brand/moral-trade-mark.png?v=20260730">',
          '<link rel="apple-touch-icon" sizes="512x512" href="/brand/moral-trade-mark.png?v=20260730">',
        ].join('');
        const enhancementStyles = [
          '<link id="mt-inline-itinerary-editor-styles" rel="stylesheet" href="/moral-trade-live-itinerary-editor.css">',
          '<link id="mt-plan-resources-styles" rel="stylesheet" href="/moral-trade-live-plan-resources.css">',
          '<link id="mt-custom-route-styles" rel="stylesheet" href="/moral-trade-live-custom-route.css">',
          '<link id="mt-adaptive-feed-styles" rel="stylesheet" href="/moral-trade-live-feed.css">',
          '<link id="mt-feed-create-phase1-styles" rel="stylesheet" href="/moral-trade-live-feed-create.css">',
          '<link id="mt-reciprocal-feed-diagnostics-styles" rel="stylesheet" href="/moral-trade-live-feed-diagnostics.css">',
          '<link id="mt-pareto-feed-learning-styles" rel="stylesheet" href="/moral-trade-live-learning-diagnostics.css">',
          '<link id="mt-home-offer-cta-styles" rel="stylesheet" href="/moral-trade-live-home-offer.css">',
          '<link id="mt-live-route-recommendations-styles" rel="stylesheet" href="/moral-trade-live-route-recommendations.css">',
          '<link id="mt-input-assist-styles" rel="stylesheet" href="/moral-trade-input-assist.css">',
          '<link id="mt-live-offer-structure-styles" rel="stylesheet" href="/moral-trade-live-offer-structure.css">',
        ].join('');
        const accountScripts = [
          `<script>window.__MT_LIVE_ACCOUNT_BOOTSTRAP__=${accountJson};<\/script>`,
          `<script>window.__MT_LIVE_NOW_BOOTSTRAP__=${liveNowJson};<\/script>`,
          '<script src="/moral-trade-account-identity.js"><\/script>',
          '<script src="/moral-trade-live-account.js"><\/script>',
        ].join('');
        const headEnhancements = `${faviconLinks}${enhancementStyles}${accountScripts}`;
        const accountAwareSource = source.includes('</head>')
          ? source.replace('</head>', `${headEnhancements}</head>`)
          : `${headEnhancements}${source}`;
        const enhancementScripts = [
          '<script src="/moral-trade-live-create-router.js"><\/script>',
          '<script src="/moral-trade-live-navigation.js"><\/script>',
          '<script src="/moral-trade-live-local-time.js"><\/script>',
          '<script src="/moral-trade-live-route-resources.js"><\/script>',
          '<script src="/moral-trade-live-plan-reset.js"><\/script>',
          '<script src="/moral-trade-live-custom-route.js"><\/script>',
          '<script src="/moral-trade-live-itinerary-editor.js"><\/script>',
          '<script src="/moral-trade-brand.js"><\/script>',
          '<script src="/moral-trade-live-verification.js"><\/script>',
          '<script src="/moral-trade-live-templates.js"><\/script>',
          '<script src="/moral-trade-live-now.js"><\/script>',
          '<script src="/moral-trade-live-feed-identity.js"><\/script>',
          '<script src="/moral-trade-live-feed-create.js"><\/script>',
          '<script src="/moral-trade-live-feed-diagnostics.js"><\/script>',
          '<script src="/moral-trade-live-learning-diagnostics.js"><\/script>',
          '<script src="/moral-trade-live-route-recommendations.js"><\/script>',
          '<script src="/moral-trade-live-priority-route.js"><\/script>',
          '<script src="/moral-trade-requester-identity.js"><\/script>',
          '<script src="/moral-trade-live-command-center.js"><\/script>',
          '<script src="/moral-trade-input-assist.js"><\/script>',
          '<script src="/moral-trade-live-token-autocomplete.js"><\/script>',
          '<script src="/moral-trade-live-offer-structure.js"><\/script>',
        ].join('');
        const enhancedSource = accountAwareSource.includes('</body>')
          ? accountAwareSource.replace('</body>', `${enhancementScripts}</body>`)
          : `${accountAwareSource}${enhancementScripts}`;

        document.open();
        document.write(enhancedSource);
        document.close();
      } catch (error) {
        document.getElementById('loading').textContent = 'Unable to load the interface. Please refresh.';
        console.error(error);
      }
    })();
  </script>
  <noscript><main><p>JavaScript is required to use Moral Trade.</p></main></noscript>
</body>
</html>
