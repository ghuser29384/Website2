<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Moral Trade — decide, allocate, negotiate, and verify reciprocal commitments.">
  <link rel="icon" type="image/png" sizes="512x512" href="/brand/moral-trade-mark.png?v=20260730">
  <link rel="shortcut icon" type="image/png" sizes="512x512" href="/brand/moral-trade-mark.png?v=20260730">
  <link rel="apple-touch-icon" sizes="512x512" href="/brand/moral-trade-mark.png?v=20260730">
  <title>Moral Trade — Live</title>
  <style>
    html,body{margin:0;background:#f5f2e9;color:#111;font-family:system-ui,sans-serif}
    main{min-height:40vh;padding:24px;max-width:1180px;margin:auto}
    .boot-nav{display:flex;flex-wrap:wrap;gap:24px;align-items:center;padding:20px 24px;background:#111214;color:white}
    .boot-nav a{color:inherit;text-decoration:none;min-height:44px;display:inline-flex;align-items:center}
    .boot-nav a:focus-visible{outline:2px solid #3158ff;outline-offset:4px}
    .boot-nav .boot-brand{font-size:24px;margin-right:auto}
    p{max-width:40rem;line-height:1.5}
  </style>
</head>
<body>
  <!-- The root URL remains the live Feed; Trade creation routes through /trades/new. -->
  <nav class="boot-nav" aria-label="Primary navigation">
    <a class="boot-brand" href="/">Moral Trade</a>
    <a href="/feed">Feed</a><a href="/discover">Discover</a>
    <a href="/messages">Messages</a><a href="/commitments">Commitments</a>
  </nav>
  <main><p id="loading" role="status">Loading your feed…</p><a href="/discover">Browse live proposals</a></main>
  <script>
    (async () => {
      if (window.location.hash === '#trade') {
        window.location.replace('/trades/new');
        return;
      }

      if (window.location.hash === '#activity') {
        window.location.replace('/commitments');
        return;
      }

      try {
        const unavailableLiveNow = (payload = {}) => ({
          ...payload,
          authenticated: payload.authenticated === true,
          recommendations: Array.isArray(payload.recommendations) ? payload.recommendations : [],
          status: payload.status || 'unavailable',
          routePlanner: {
            status: 'unavailable',
            checkedAt: new Date().toISOString(),
            profile: {},
            needsMoreInput: [],
            routes: [],
            comparison: null,
            candidateCount: 0,
          },
        });
        // Optional account/feed reads must not gate the usable shell. All reads
        // are bounded; failures stay unavailable, not fabricated signed-out data.
        async function readJson(url, fallback) {
          const controller = new AbortController();
          const timer = setTimeout(() => controller.abort(), 8000);
          try {
            const response = await fetch(url, { credentials: 'same-origin',
              headers: { Accept: 'application/json' }, signal: controller.signal });
            if (!response.ok) return fallback;
            const payload = await response.json();
            return payload && typeof payload === 'object' ? payload : fallback;
          } catch { return fallback; }
          finally { clearTimeout(timer); }
        }
        const accountPromise = readJson('/api/live-account', { status: 'unavailable' });
        const liveNowPromise = readJson('/api/live-now', unavailableLiveNow());
        const coreController = new AbortController();
        const coreTimer = setTimeout(() => coreController.abort(), 8000);
        let raw;
        try {
          const response = await fetch('/moral-trade-live-core.txt', { signal: coreController.signal });
          if (!response.ok) throw new Error('live core');
          raw = await response.arrayBuffer();
        } finally { clearTimeout(coreTimer); }
        const digest = [...new Uint8Array(await crypto.subtle.digest('SHA-256', raw))]
          .map((value) => value.toString(16).padStart(2, '0'))
          .join('');

        if (digest !== '243a83373eb3802119be04209019c228c0abe7016eae12367cf88b24f22a471d') {
          throw new Error('integrity');
        }

        const source = new TextDecoder().decode(raw);
        window.__MT_LIVE_ACCOUNT_BOOTSTRAP__ = { status: 'loading' };
        window.__MT_LIVE_NOW_BOOTSTRAP__ = { status: 'loading' };
        const faviconLinks = [
          '<link rel="icon" type="image/png" sizes="512x512" href="/brand/moral-trade-mark.png?v=20260730">',
          '<link rel="shortcut icon" type="image/png" sizes="512x512" href="/brand/moral-trade-mark.png?v=20260730">',
          '<link rel="apple-touch-icon" sizes="512x512" href="/brand/moral-trade-mark.png?v=20260730">',
        ].join('');
        const enhancementStyles = [
          '<link id="mt-adaptive-feed-styles" rel="stylesheet" href="/moral-trade-live-feed.css">',
          '<link id="mt-feed-create-phase1-styles" rel="stylesheet" href="/moral-trade-live-feed-create.css">',
          '<link id="mt-reciprocal-feed-diagnostics-styles" rel="stylesheet" href="/moral-trade-live-feed-diagnostics.css">',
          '<link id="mt-pareto-feed-learning-styles" rel="stylesheet" href="/moral-trade-live-learning-diagnostics.css">',
          '<link id="mt-home-offer-cta-styles" rel="stylesheet" href="/moral-trade-live-home-offer.css">',
          '<link id="mt-live-route-recommendations-styles" rel="stylesheet" href="/moral-trade-live-route-recommendations.css">',
          '<link id="mt-input-assist-styles" rel="stylesheet" href="/moral-trade-input-assist.css">',
          '<link id="mt-refined-header-styles" rel="stylesheet" href="/moral-trade-refined-header.css">',
          '<link id="mt-proportions-styles" rel="stylesheet" href="/moral-trade-proportions.css">',
        ].join('');
        const accountScripts = [
          '<script src="/moral-trade-account-identity.js"><\/script>',
          '<script src="/moral-trade-live-account.js"><\/script>',
        ].join('');
        const headEnhancements = `${faviconLinks}${enhancementStyles}${accountScripts}`;
        const accountAwareSource = source.includes('</head>')
          ? source.replace('</head>', `${headEnhancements}</head>`)
          : `${headEnhancements}${source}`;
        const enhancementScripts = [
          '<script src="/moral-trade-live-create-router.js"><\/script>',
          '<script src="/moral-trade-live-navigation.js"><\/script>',
          '<script src="/moral-trade-live-local-time.js"><\/script>',
          '<script src="/moral-trade-brand.js"><\/script>',
          '<script src="/moral-trade-live-templates.js"><\/script>',
          '<script src="/moral-trade-live-priority-route.js"><\/script>',
          '<script src="/moral-trade-requester-identity.js"><\/script>',
          '<script src="/moral-trade-live-command-center.js"><\/script>',
          '<script src="/moral-trade-input-assist.js"><\/script>',
        ].join('');
        const enhancedSource = accountAwareSource.includes('</body>')
          ? accountAwareSource.replace('</body>', `${enhancementScripts}</body>`)
          : `${accountAwareSource}${enhancementScripts}`;

        document.open();
        document.write(enhancedSource);
        document.close();

        const shellReady = document.readyState === 'loading'
          ? new Promise((resolve) => document.addEventListener('DOMContentLoaded', resolve, { once: true }))
          : Promise.resolve();
        void accountPromise.then((payload) => {
          window.__MT_LIVE_ACCOUNT_BOOTSTRAP__ = payload;
          window.dispatchEvent(new CustomEvent('mt:live-account-ready', { detail: payload }));
        });
        function loadEnhancement(src) {
          return new Promise((resolve, reject) => {
            const script = document.createElement('script');
            const timer = setTimeout(() => { script.remove(); reject(new Error('feed enhancement timeout')); }, 8000);
            script.src = src;
            script.onload = () => { clearTimeout(timer); resolve(); };
            script.onerror = () => { clearTimeout(timer); reject(new Error('feed enhancement unavailable')); };
            document.body.appendChild(script);
          });
        }
        void liveNowPromise.then(async (payload) => {
          await shellReady;
          window.__MT_LIVE_NOW_BOOTSTRAP__ = payload.routePlanner ? payload : unavailableLiveNow(payload);
          // These modules take a bootstrap snapshot. Load them once, in their
          // established order, after this independent request settles.
          for (const src of [
            '/moral-trade-live-now.js',
            '/moral-trade-live-feed-identity.js',
            '/moral-trade-live-feed-create.js',
            '/moral-trade-live-feed-diagnostics.js',
            '/moral-trade-live-learning-diagnostics.js',
            '/moral-trade-live-route-recommendations.js',
          ]) await loadEnhancement(src);
        }).catch(() => {
          const main = document.getElementById('app');
          if (main) main.innerHTML = '<section role="alert"><p>The feed could not be loaded. Refresh to retry.</p><a href="/discover">Browse live proposals</a></section>';
        });
      } catch (error) {
        const loading = document.getElementById('loading');
        if (loading) loading.textContent = 'Unable to load the interface. Please refresh, or use the navigation above.';
        console.error(error);
      }
    })();
  </script>
  <noscript><main><p>JavaScript is required to use Moral Trade.</p></main></noscript>
</body>
</html>
