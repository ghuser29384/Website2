<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#050505">
  <meta name="description" content="Explore Moral Trade offers, threshold pools, and trusted counterparties through transparent, inspectable discovery views.">
  <link rel="canonical" href="https://moraltrade.org/discover">
  <link rel="icon" type="image/png" sizes="512x512" href="/brand/moral-trade-mark.png?v=20260730">
  <link rel="shortcut icon" type="image/png" sizes="512x512" href="/brand/moral-trade-mark.png?v=20260730">
  <link rel="apple-touch-icon" sizes="512x512" href="/brand/moral-trade-mark.png?v=20260730">
  <title>Moral Trade — Discover</title>
  <style>
    html,body{margin:0;min-height:100%;background:#f7f5ef;color:#0b0b0a;font-family:system-ui,sans-serif}
    main{min-height:100vh;display:grid;place-items:center;padding:24px}
    p{max-width:42rem;line-height:1.5}
  </style>
</head>
<body>
  <main><p id="loading">Loading Discover…</p></main>
  <script src="/moral-trade-discover-local-time.js"></script>
  <script>
    (async () => {
      try {
        const paths = [
          "/discover/payload/0.txt",
          "/discover/payload/1.txt",
          "/discover/payload/2.txt",
          "/discover/payload/3.txt",
          "/discover/payload/4.txt",
          "/discover/payload/5.txt",
          "/discover/payload/6.txt",
        ];
        const accountPromise = fetch("/api/live-account", {
          credentials: "same-origin",
          headers: { Accept: "application/json" },
        })
          .then((response) => (response.ok ? response.json() : { authenticated: false }))
          .catch(() => ({ authenticated: false }));
        const [parts, liveAccount] = await Promise.all([
          Promise.all(
            paths.map(async (path) => {
              const response = await fetch(path, { cache: "force-cache" });
              if (!response.ok) throw new Error(`Discover payload ${path} returned ${response.status}`);
              return response.text();
            }),
          ),
          accountPromise,
        ]);
        const bytes = Uint8Array.from(atob(parts.join("")), (character) => character.charCodeAt(0));
        const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
        const source = await new Response(stream).text();
        const localTimeRuntime = window.MoralTradeDiscoverLocalTime;
        if (!localTimeRuntime) throw new Error("Discover local-time runtime did not load");
        const localizedSource = localTimeRuntime.transformSource(source);
        const accountJson = JSON.stringify(liveAccount)
          .replace(/</g, "\\u003c")
          .replace(/>/g, "\\u003e")
          .replace(/&/g, "\\u0026")
          .replace(/\u2028/g, "\\u2028")
          .replace(/\u2029/g, "\\u2029");
        const faviconLinks = [
          '<link rel="icon" type="image/png" sizes="512x512" href="/brand/moral-trade-mark.png?v=20260730">',
          '<link rel="shortcut icon" type="image/png" sizes="512x512" href="/brand/moral-trade-mark.png?v=20260730">',
          '<link rel="apple-touch-icon" sizes="512x512" href="/brand/moral-trade-mark.png?v=20260730">',
        ].join("");
        const headScripts = [
          faviconLinks,
          '<link rel="stylesheet" href="/moral-trade-input-assist.css">',
          '<script src="/moral-trade-discover-local-time.js"></scr' + 'ipt>',
          `<script>window.__MT_LIVE_ACCOUNT_BOOTSTRAP__=${accountJson};</scr` + 'ipt>',
          '<script src="/moral-trade-account-identity.js"></scr' + 'ipt>',
          '<script src="/moral-trade-live-account.js"></scr' + 'ipt>',
        ].join("");
        if (!localizedSource.includes("</head>")) {
          throw new Error("Discover payload is missing its closing head tag");
        }
        const replacementSource = localizedSource.replace("</head>", `${headScripts}</head>`);
        const enhancementScripts = [
          '<script src="/moral-trade-discover-navigation.js"></scr' + 'ipt>',
          '<script src="/moral-trade-discover-value-hover.js"></scr' + 'ipt>',
          '<script src="/moral-trade-brand.js"></scr' + 'ipt>',
          '<script src="/moral-trade-requester-identity.js"></scr' + 'ipt>',
          '<script src="/moral-trade-input-assist.js"></scr' + 'ipt>',
          '<script src="/moral-trade-smart-query.js"></scr' + 'ipt>',
        ].join("");
        const enhancedSource = replacementSource.includes("</body>")
          ? replacementSource.replace("</body>", `${enhancementScripts}</body>`)
          : `${replacementSource}${enhancementScripts}`;

        document.open();
        document.write(enhancedSource);
        document.close();
      } catch (error) {
        const loading = document.getElementById("loading");
        if (loading) loading.textContent = "Unable to load Discover. Please refresh.";
        console.error(error);
      }
    })();
  </script>
  <noscript><main><p>JavaScript is required to use Discover.</p></main></noscript>
</body>
</html>
