    :root {
      --shell: #11120f;
      --shell-soft: #1a1b18;
      --paper: #f2eee6;
      --ink: #151613;
      --blue: #5169c7;
      --blue-bright: #3f65ff;
      --moss: #65785b;
      --apricot: #d88c61;
      --butter: #e7cf77;
      --line: rgba(21, 22, 19, .18);
      --radius: 26px;
      --ease: cubic-bezier(.22, 1, .36, 1);
      --serif: "MT Serif", Georgia, "Times New Roman", serif;
      --sans: "MT Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; }

    html { background: var(--shell); }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      background: var(--shell);
      color: #f4f0e8;
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    button, a { font: inherit; }

    button { color: inherit; }

    button:focus-visible,
    a:focus-visible {
      outline: 3px solid #9db0ff;
      outline-offset: 4px;
    }

    .lab {
      width: min(1600px, 100%);
      min-height: 100vh;
      margin: 0 auto;
      padding: 14px;
      display: grid;
      grid-template-rows: auto minmax(650px, 1fr) auto;
      gap: 10px;
    }

    .labbar,
    .labfooter {
      display: flex;
      align-items: center;
      min-height: 58px;
      gap: 20px;
      padding: 0 8px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      min-width: 170px;
      color: inherit;
      text-decoration: none;
      font-weight: 650;
      letter-spacing: -.02em;
    }

    .brand svg { width: 33px; height: 33px; flex: none; }

    .concept-switcher {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      flex: 1;
    }

    .concept-tab {
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: rgba(244, 240, 232, .58);
      padding: 9px 13px;
      cursor: pointer;
      transition: background 180ms ease, color 180ms ease, transform 180ms ease;
    }

    .concept-tab:hover { color: #fff; transform: translateY(-1px); }

    .concept-tab[aria-selected="true"] {
      background: #f1ede5;
      color: var(--ink);
    }

    .concept-tab span:first-child {
      margin-right: 6px;
      font-variant-numeric: tabular-nums;
      opacity: .55;
    }

    .icon-button,
    .footer-button {
      border: 1px solid rgba(244, 240, 232, .22);
      background: transparent;
      color: #f4f0e8;
      cursor: pointer;
      transition: border-color 180ms ease, background 180ms ease, transform 180ms ease;
    }

    .icon-button {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      font-size: 19px;
    }

    .icon-button:hover,
    .footer-button:hover {
      border-color: rgba(244, 240, 232, .72);
      background: rgba(255,255,255,.07);
      transform: translateY(-1px);
    }

    .experience {
      position: relative;
      min-height: 650px;
      overflow: hidden;
      border-radius: var(--radius);
      isolation: isolate;
      box-shadow: 0 28px 70px rgba(0,0,0,.26);
    }

    .experience::after {
      position: absolute;
      inset: 0;
      z-index: 50;
      pointer-events: none;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: inherit;
      content: "";
    }

    .experience[data-concept="two-moves"] { background: #efe8dc; color: #1b1b17; }
    .experience[data-concept="crowd"] { background: #111d2f; color: #f2efe8; }
    .experience[data-concept="redirect"] { background: #eee8dd; color: #191915; }
    .experience[data-concept="mix"] { background: #eae5da; color: #191a17; }
    .experience[data-concept="match"] { background: #dfe8dc; color: #132019; }

    .stage {
      position: relative;
      width: 100%;
      min-height: 650px;
      height: 100%;
    }

    .scene {
      position: absolute;
      inset: 0;
      display: grid;
      align-content: center;
      padding: clamp(34px, 5vw, 78px);
      animation: scene-in 640ms var(--ease) both;
    }

    .scene::before {
      position: absolute;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      content: "";
      opacity: .38;
      background-image: radial-gradient(circle at 20% 20%, currentColor 0 1px, transparent 1px);
      background-size: 22px 22px;
      mask-image: linear-gradient(90deg, rgba(0,0,0,.26), transparent 42%);
    }

    @keyframes scene-in {
      from { opacity: 0; transform: translateY(16px) scale(.995); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .scene-head {
      position: relative;
      z-index: 4;
      width: min(820px, 100%);
    }

    .scene-title {
      max-width: 13ch;
      margin: 0;
      font-family: var(--serif);
      font-size: clamp(46px, 7vw, 104px);
      font-weight: 400;
      letter-spacing: -.065em;
      line-height: .9;
    }

    .scene-title.is-sans {
      font-family: var(--sans);
      font-weight: 700;
      letter-spacing: -.075em;
      line-height: .88;
    }

    .scene-line {
      max-width: 560px;
      margin: 24px 0 0;
      font-size: clamp(17px, 2vw, 24px);
      line-height: 1.32;
      letter-spacing: -.025em;
      opacity: .72;
    }

    .scene-prompt {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 20px;
      font-size: 13px;
      font-weight: 650;
      letter-spacing: .08em;
      text-transform: uppercase;
      opacity: .62;
    }

    .scene-prompt::before {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
      content: "";
      animation: prompt-pulse 1.8s ease-in-out infinite;
    }

    @keyframes prompt-pulse {
      0%, 100% { transform: scale(.75); opacity: .45; }
      50% { transform: scale(1); opacity: 1; }
    }

    .choice-row {
      position: relative;
      z-index: 4;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      width: min(980px, 100%);
      margin-top: 42px;
    }

    .choice {
      position: relative;
      min-height: 156px;
      padding: 20px;
      overflow: hidden;
      border: 1px solid currentColor;
      border-radius: 2px;
      background: transparent;
      color: inherit;
      cursor: pointer;
      text-align: left;
      transition: transform 220ms var(--ease), background 220ms ease, color 220ms ease;
    }

    .choice::after {
      position: absolute;
      right: 16px;
      bottom: 12px;
      content: "↗";
      font-size: 22px;
      transition: transform 220ms var(--ease);
    }

    .choice:hover { transform: translateY(-6px); }
    .choice:hover::after { transform: translate(4px, -4px); }

    .choice strong {
      display: block;
      max-width: 11ch;
      margin-top: 36px;
      font-size: clamp(20px, 2.4vw, 34px);
      font-weight: 600;
      letter-spacing: -.045em;
      line-height: 1;
    }

    .choice small { display: block; max-width: 26ch; margin-top: 10px; opacity: .62; line-height: 1.35; }

    .choice-icon {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      font-size: 29px;
      line-height: 1;
    }

    .choice.is-blue:hover { background: #5069cb; color: white; }
    .choice.is-moss:hover { background: #667a5f; color: white; }
    .choice.is-apricot:hover { background: #d78f68; color: #171713; }

    .primary-action,
    .secondary-action,
    .conversion-link {
      position: relative;
      z-index: 5;
      display: inline-flex;
      align-items: center;
      justify-content: space-between;
      gap: 28px;
      min-height: 56px;
      border: 0;
      text-decoration: none;
      cursor: pointer;
      transition: transform 200ms var(--ease), filter 200ms ease;
    }

    .primary-action {
      width: fit-content;
      margin-top: 34px;
      padding: 0 22px;
      background: var(--blue-bright);
      color: white;
      font-weight: 650;
    }

    .primary-action:hover,
    .conversion-link:hover { transform: translateY(-3px); filter: brightness(1.05); }

    .primary-action:disabled { opacity: .35; cursor: not-allowed; transform: none; }

    .secondary-action {
      min-height: 42px;
      padding: 0;
      border-bottom: 1px solid currentColor;
      background: transparent;
      color: inherit;
    }

    .step-mark {
      position: absolute;
      top: clamp(24px, 4vw, 50px);
      right: clamp(24px, 4vw, 52px);
      z-index: 8;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 650;
      letter-spacing: .08em;
      text-transform: uppercase;
      opacity: .52;
    }

    .step-mark span {
      width: 24px;
      height: 3px;
      background: currentColor;
      opacity: .22;
    }

    .step-mark span.is-done { opacity: 1; }

    .labfooter { justify-content: space-between; }

    .footer-button {
      min-height: 40px;
      border-radius: 999px;
      padding: 0 15px;
    }

    .concept-caption {
      display: flex;
      gap: 12px;
      align-items: baseline;
      min-width: 0;
      color: rgba(244, 240, 232, .62);
      font-size: 13px;
    }

    .concept-caption strong { color: #f4f0e8; font-size: 15px; }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    /* Concept 1: Two Moves */
    .cause-sun {
      position: absolute;
      width: min(44vw, 560px);
      aspect-ratio: 1;
      right: -7%;
      bottom: -28%;
      border-radius: 50%;
      background: #d8a37f;
      animation: sun-rise 1.1s var(--ease) both;
    }

    .cause-sun::before,
    .cause-sun::after {
      position: absolute;
      border-radius: 50%;
      content: "";
    }

    .cause-sun::before { inset: 14%; border: 1px solid rgba(21,22,19,.28); }
    .cause-sun::after { inset: 30%; background: #efcf91; }

    @keyframes sun-rise { from { transform: translateY(34%) scale(.8); } to { transform: none; } }

    .cause-picker-scene {
      grid-template-columns: minmax(280px, .64fr) minmax(0, 1.36fr);
      gap: clamp(28px, 5vw, 76px);
      align-items: center;
    }

    .cause-picker-scene .cause-sun { opacity: .42; }

    .cause-intro {
      position: relative;
      z-index: 4;
    }

    .cause-intro .scene-title { max-width: 7ch; }

    .cause-grid {
      position: relative;
      z-index: 5;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
    }

    .cause-choice {
      --cause-fill: #667a5f;
      --cause-fill-ink: #fff;
      position: relative;
      min-height: 88px;
      padding: 14px 34px 14px 14px;
      overflow: hidden;
      border: 1px solid rgba(25,26,23,.34);
      background: rgba(249,247,240,.76);
      color: inherit;
      cursor: pointer;
      text-align: left;
      transition: opacity 180ms ease, transform 220ms var(--ease), background 220ms ease, color 220ms ease, border-color 220ms ease, box-shadow 220ms ease;
    }

    .cause-choice::before {
      display: block;
      width: 9px;
      height: 9px;
      margin-bottom: 13px;
      border-radius: 50%;
      background: var(--cause-fill);
      content: "";
    }

    .cause-choice::after {
      position: absolute;
      right: 13px;
      top: 12px;
      content: "↗";
      font-size: 17px;
      opacity: .42;
      transition: transform 220ms var(--ease), opacity 220ms ease;
    }

    .cause-choice strong {
      display: block;
      font-size: clamp(15px, 1.35vw, 20px);
      font-weight: 600;
      letter-spacing: -.035em;
      line-height: 1.06;
    }

    .cause-choice.is-blue { --cause-fill: #5f73ad; --cause-fill-ink: #fff; }
    .cause-choice.is-moss { --cause-fill: #6f8067; --cause-fill-ink: #fff; }
    .cause-choice.is-apricot { --cause-fill: #c98262; --cause-fill-ink: #171713; }
    .cause-choice.is-sand { --cause-fill: #ddc889; --cause-fill-ink: #171713; }

    .cause-choice:hover,
    .cause-choice:focus-visible {
      z-index: 2;
      border-color: var(--cause-fill);
      background: var(--cause-fill);
      color: var(--cause-fill-ink);
      box-shadow: 0 18px 34px rgba(42,42,35,.14);
      transform: translateY(-6px);
    }

    .cause-choice:hover::before,
    .cause-choice:focus-visible::before { background: currentColor; }
    .cause-choice:hover::after,
    .cause-choice:focus-visible::after { opacity: 1; transform: translate(3px, -3px); }
    .cause-grid:has(.cause-choice:hover) .cause-choice:not(:hover) { opacity: .55; }

    .meeting-scene {
      grid-template-columns: minmax(0, 1fr) minmax(280px, .72fr);
      gap: clamp(30px, 6vw, 90px);
      align-items: center;
    }

    .portrait-wrap {
      position: relative;
      width: min(430px, 100%);
      aspect-ratio: 1;
      justify-self: end;
    }

    .portrait-wrap::before {
      position: absolute;
      inset: 4% 0 0 5%;
      border: 1px solid currentColor;
      border-radius: 50%;
      content: "";
      opacity: .22;
    }

    .portrait-wrap svg { position: relative; width: 100%; height: 100%; }

    .cause-stamp {
      position: absolute;
      right: -2%;
      bottom: 10%;
      display: grid;
      place-items: center;
      width: 124px;
      aspect-ratio: 1;
      padding: 12px;
      border-radius: 50%;
      background: #5169c7;
      color: white;
      text-align: center;
      font-size: 12px;
      font-weight: 650;
      line-height: 1.1;
      transform: rotate(8deg);
      animation: stamp-in 700ms 360ms var(--ease) both;
    }

    @keyframes stamp-in { from { opacity: 0; transform: rotate(-18deg) scale(.25); } to { opacity: 1; transform: rotate(8deg) scale(1); } }

    .move-board {
      position: relative;
      z-index: 3;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 72px minmax(0, 1fr);
      gap: 16px;
      align-items: stretch;
      width: min(1060px, 100%);
      margin: 40px auto 0;
    }

    .move-card {
      min-height: 250px;
      padding: clamp(22px, 3vw, 38px);
      border: 1px solid currentColor;
      background: transparent;
      color: inherit;
      cursor: pointer;
      text-align: left;
      transition: transform 240ms var(--ease), background 240ms ease, color 240ms ease;
    }

    .move-card:hover { transform: translateY(-7px); }
    .move-card[aria-pressed="true"] { background: #1a1b17; color: #f5f0e7; transform: translateY(-10px); }

    .move-card span { display: block; font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; opacity: .56; }
    .move-card strong { display: block; max-width: 12ch; margin-top: 52px; font-family: var(--serif); font-size: clamp(30px, 4vw, 56px); font-weight: 400; letter-spacing: -.05em; line-height: .98; }
    .move-card small { display: block; margin-top: 18px; font-size: 15px; opacity: .64; }

    .move-join {
      align-self: center;
      display: grid;
      place-items: center;
      height: 72px;
      border: 1px solid currentColor;
      border-radius: 50%;
      font-size: 26px;
      transition: transform 520ms var(--ease), background 220ms ease, color 220ms ease;
    }

    .move-board.is-ready .move-join { background: var(--blue-bright); color: white; transform: rotate(180deg) scale(1.08); }

    /* Keep the final action inside the cinematic panel on wide, short screens. */
    @media (min-width: 901px) {
      .move-scene { padding-block: clamp(24px, 4vh, 54px); }
      .move-scene .scene-prompt { margin-bottom: clamp(10px, 2vh, 20px); }
      .move-scene .scene-title { font-size: clamp(46px, min(7vw, 11vh), 104px); }
      .move-scene .move-board { margin-top: clamp(18px, 3vh, 40px); }
      .move-scene .move-card { padding-block: clamp(22px, 3vh, 38px); }
      .move-scene .move-card strong {
        margin-top: clamp(20px, 4vh, 52px);
        font-size: clamp(30px, min(4vw, 5.5vh), 56px);
      }
      .move-scene .primary-action { margin-top: clamp(16px, 3vh, 34px); }
    }

    /* Shared success and conversion */
    .success-scene { align-content: center; }

    .success-burst {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .success-burst i {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--particle, #5169c7);
      animation: burst 1100ms var(--delay, 0ms) var(--ease) both;
    }

    @keyframes burst {
      from { opacity: 0; transform: translate(-50%, -50%) scale(.2); }
      18% { opacity: 1; }
      to { opacity: 0; transform: translate(calc(-50% + var(--x)), calc(-50% + var(--y))) scale(1.6); }
    }

    .success-copy { position: relative; z-index: 4; width: min(900px, 100%); }
    .success-copy .scene-title { max-width: 10ch; }

    .conversion-deck {
      position: relative;
      z-index: 4;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 1px;
      width: min(980px, 100%);
      margin-top: 44px;
      background: currentColor;
      border: 1px solid currentColor;
    }

    .conversion-link {
      min-height: 96px;
      padding: 20px;
      background: #f0ebe2;
      color: #171713;
      text-align: left;
    }

    .conversion-link strong { display: block; font-size: clamp(18px, 2vw, 25px); letter-spacing: -.03em; }
    .conversion-link small { display: block; margin-top: 6px; color: #5c5b55; }
    .conversion-link > span:last-child { font-size: 23px; }
    .conversion-link.is-primary { background: var(--blue-bright); color: white; }
    .conversion-link.is-primary small { color: rgba(255,255,255,.72); }

    /* Concept 2: Crowd */
    .crowd-scene::before {
      opacity: .16;
      background-size: 34px 34px;
      mask-image: none;
    }

    .crowd-field {
      position: absolute;
      inset: 0 0 0 42%;
      overflow: hidden;
      mask-image: radial-gradient(circle at 55% 48%, black 0 58%, transparent 84%);
    }

    .crowd-dot {
      position: absolute;
      left: var(--left);
      top: var(--top);
      width: var(--size);
      height: var(--size);
      border: 1px solid rgba(239,235,225,.35);
      border-radius: 50%;
      background: transparent;
      transition: background 420ms ease, box-shadow 420ms ease, transform 420ms var(--ease), opacity 420ms ease;
      transition-delay: var(--delay);
      opacity: .42;
    }

    .crowd-field.is-growing .crowd-dot {
      background: var(--dot-color);
      border-color: transparent;
      box-shadow: 0 0 18px color-mix(in srgb, var(--dot-color) 70%, transparent);
      transform: scale(1.3);
      opacity: 1;
    }

    .crowd-condition {
      position: relative;
      z-index: 5;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 1px;
      width: min(880px, 100%);
      margin-top: 28px;
      border: 1px solid rgba(242,239,232,.42);
      background: rgba(242,239,232,.42);
    }

    .crowd-condition span {
      display: flex;
      align-items: flex-start;
      min-height: 100px;
      padding: 16px;
      background: rgba(17,29,47,.9);
      font-size: clamp(14px, 1.3vw, 17px);
      line-height: 1.32;
      letter-spacing: -.02em;
    }

    .crowd-condition span:last-child {
      background: #e4c76f;
      color: #171713;
      font-weight: 650;
    }

    .crowd-field .crowd-dot.is-you {
      width: 28px;
      height: 28px;
      margin: -8px 0 0 -8px;
      border: 3px solid #fff;
      background: #e9c96f;
      box-shadow: 0 0 0 11px rgba(233,201,111,.14), 0 0 40px rgba(233,201,111,.54);
      opacity: 1;
    }

    .pledge-choices { max-width: 620px; grid-template-columns: repeat(3, 1fr); }
    .pledge-choices .choice { min-height: 116px; }
    .pledge-choices .choice strong { margin-top: 18px; font-family: var(--serif); font-size: clamp(34px, 4vw, 54px); }

    .crowd-alternative {
      position: relative;
      z-index: 5;
      display: inline-flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      width: fit-content;
      min-height: 48px;
      margin-top: 14px;
      padding: 0 17px;
      border: 1px solid rgba(244,240,232,.62);
      background: transparent;
      color: inherit;
      cursor: pointer;
      font-weight: 650;
      transition: background 200ms ease, color 200ms ease, transform 200ms var(--ease);
    }

    .crowd-alternative:hover {
      background: #f0ebe2;
      color: #171713;
      transform: translateY(-2px);
    }

    .threshold-panel {
      position: relative;
      z-index: 5;
      width: min(640px, 100%);
      margin-top: 44px;
    }

    .threshold-top { display: flex; justify-content: space-between; align-items: baseline; gap: 20px; }
    .threshold-top strong { font-size: clamp(28px, 4vw, 52px); font-weight: 500; letter-spacing: -.055em; }
    .threshold-top span { opacity: .62; }

    .threshold-track {
      position: relative;
      height: 16px;
      margin-top: 17px;
      border: 1px solid rgba(244,240,232,.52);
    }

    .threshold-fill {
      position: absolute;
      inset: 0 auto 0 0;
      width: var(--progress);
      background: #e4c66c;
      transition: width 1500ms var(--ease);
    }

    .threshold-line { position: absolute; top: -7px; right: 0; width: 2px; height: 28px; background: #fff; }

    .project-silhouette {
      position: absolute;
      right: 5%;
      bottom: 0;
      width: min(46vw, 670px);
      height: 42%;
      border-top: 1px solid rgba(244,240,232,.35);
      opacity: .5;
    }

    .project-silhouette::before,
    .project-silhouette::after {
      position: absolute;
      bottom: 0;
      content: "";
      background: rgba(244,240,232,.09);
      border: 1px solid rgba(244,240,232,.28);
    }

    .project-silhouette::before { left: 12%; width: 29%; height: 68%; border-radius: 100px 100px 0 0; }
    .project-silhouette::after { right: 9%; width: 45%; height: 96%; clip-path: polygon(0 28%, 25% 0, 56% 22%, 75% 8%, 100% 35%, 100% 100%, 0 100%); }

    .crowd-success .project-silhouette { opacity: 1; filter: drop-shadow(0 -20px 45px rgba(232,198,107,.18)); }

    /* Concept 3: Career leap */
    .career-scene { background: linear-gradient(118deg, #111d2f 0%, #17271f 72%); }

    .career-scene::before {
      opacity: .18;
      background-size: 30px 30px;
      mask-image: radial-gradient(circle at 72% 48%, black 0 42%, transparent 78%);
    }

    .career-offers {
      position: relative;
      z-index: 4;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 116px minmax(0, 1fr);
      align-items: stretch;
      gap: 14px;
      width: min(1040px, 100%);
      margin-top: 38px;
    }

    .career-offer {
      position: relative;
      display: grid;
      align-content: space-between;
      min-height: 230px;
      padding: 24px;
      border: 1px solid rgba(242,238,229,.52);
      background: rgba(10,18,14,.24);
      color: inherit;
      text-align: left;
    }

    button.career-offer {
      cursor: pointer;
      transition: transform 220ms var(--ease), background 220ms ease, border-color 220ms ease;
    }

    button.career-offer:hover {
      border-color: #e6cb70;
      background: rgba(230,203,112,.12);
      transform: translateY(-6px);
    }

    button.career-offer::after {
      position: absolute;
      right: 18px;
      top: 16px;
      content: "↗";
      color: #e6cb70;
      font-size: 22px;
    }

    .career-offer > span {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .09em;
      text-transform: uppercase;
      opacity: .58;
    }

    .career-offer strong {
      display: block;
      margin-top: 28px;
      font-family: var(--serif);
      font-size: clamp(44px, 5vw, 68px);
      font-weight: 400;
      letter-spacing: -.06em;
      line-height: .9;
    }

    .career-offer b {
      display: block;
      margin-top: 12px;
      font-size: clamp(20px, 2vw, 28px);
      letter-spacing: -.035em;
    }

    .career-offer small { display: block; margin-top: 8px; max-width: 30ch; opacity: .62; line-height: 1.35; }

    .career-gap {
      display: grid;
      align-content: center;
      justify-items: center;
      gap: 9px;
      text-align: center;
    }

    .career-gap::before,
    .career-gap::after { width: 1px; height: 42px; background: currentColor; content: ""; opacity: .28; }
    .career-gap strong { font-size: 24px; letter-spacing: -.04em; }
    .career-gap span { max-width: 9ch; font-size: 12px; line-height: 1.25; opacity: .58; }

    .career-rule {
      position: relative;
      z-index: 5;
      width: min(760px, 100%);
      margin-top: 28px;
      padding: 17px 19px;
      border-left: 4px solid #e6cb70;
      background: rgba(242,238,229,.08);
      font-size: clamp(16px, 1.6vw, 20px);
      line-height: 1.35;
      letter-spacing: -.02em;
    }

    .career-equation {
      position: relative;
      z-index: 5;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, .72fr) auto minmax(0, 1fr);
      align-items: stretch;
      gap: 10px;
      width: min(940px, 100%);
      margin-top: 40px;
    }

    .career-equation > div {
      display: grid;
      align-content: center;
      min-height: 126px;
      padding: 18px;
      border: 1px solid rgba(242,238,229,.46);
      background: rgba(10,18,14,.2);
    }

    .career-equation strong { font-size: clamp(28px, 3.6vw, 48px); letter-spacing: -.055em; }
    .career-equation span { margin-top: 7px; font-size: 13px; opacity: .58; }
    .career-equation > b { align-self: center; color: #e6cb70; font-size: 28px; font-weight: 400; }
    .career-equation .career-total { border-color: #e6cb70; background: #e6cb70; color: #17271f; }
    .career-equation .career-total span { opacity: .7; }

    .career-threshold-panel { width: min(760px, 100%); margin-top: 42px; }
    .career-threshold-panel .threshold-fill { background: #e6cb70; }
    .career-threshold-panel .threshold-line { background: #f2eee5; }
    .career-threshold-panel.is-crossing .threshold-fill {
      animation: career-threshold-fill 1500ms var(--ease) both;
    }

    @keyframes career-threshold-fill {
      from { width: var(--start-progress); }
      to { width: var(--progress); }
    }

    .career-success-grid {
      position: absolute;
      right: 4%;
      bottom: 0;
      width: min(44vw, 620px);
      height: 78%;
      border-left: 1px solid rgba(242,238,229,.18);
      background: repeating-linear-gradient(0deg, transparent 0 58px, rgba(242,238,229,.08) 58px 59px);
      opacity: .78;
    }

    .career-success-grid::before {
      position: absolute;
      left: 12%;
      right: 7%;
      bottom: 14%;
      height: 12px;
      background: #e6cb70;
      box-shadow: 0 0 48px rgba(230,203,112,.34);
      content: "";
      transform: rotate(-18deg);
      transform-origin: left center;
    }

    .career-conversion .conversion-link { background: #f0ebe2; }
    .career-conversion .conversion-link.is-primary { background: #e6cb70; color: #17271f; }
    .career-conversion .conversion-link.is-primary small { color: rgba(23,39,31,.68); }

    @media (min-width: 901px) {
      .career-scene { padding-block: clamp(28px, 4vh, 54px); }
      .career-scene .scene-prompt { margin-bottom: clamp(10px, 2vh, 20px); }
      .career-scene .scene-title { font-size: clamp(46px, min(7vw, 10.5vh), 96px); }
      .career-scene .career-offers { margin-top: clamp(20px, 3.5vh, 38px); }
      .career-scene .career-offer { min-height: clamp(176px, 27vh, 230px); padding: clamp(18px, 2.6vh, 24px); }
      .career-scene .career-offer strong { margin-top: clamp(16px, 3vh, 28px); }
      .career-scene .career-equation { margin-top: clamp(22px, 4vh, 40px); }
      .career-scene .career-rule { margin-top: clamp(18px, 3vh, 28px); }
      .career-scene .primary-action { margin-top: clamp(18px, 3vh, 34px); }
    }

    /* Concept 4: Redirect */
    .stream-stage { overflow: hidden; }

    .stream {
      position: absolute;
      top: var(--stream-top);
      left: -8%;
      width: 116%;
      height: 88px;
      border-top: 2px solid currentColor;
      border-bottom: 2px solid currentColor;
      transform: rotate(var(--stream-angle));
      transform-origin: center;
      color: var(--stream-color);
      transition: transform 850ms var(--ease), top 850ms var(--ease), opacity 450ms ease;
    }

    .stream::before {
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(90deg, transparent 0 42px, currentColor 42px 45px, transparent 45px 78px);
      content: "";
      opacity: .24;
      animation: stream-flow 1.4s linear infinite;
    }

    @keyframes stream-flow { to { transform: translateX(78px); } }

    .stream-label {
      position: absolute;
      left: 10%;
      top: 50%;
      display: flex;
      align-items: center;
      gap: 18px;
      transform: translateY(-50%);
      color: currentColor;
      font-size: 18px;
      font-weight: 650;
    }

    .stream-label strong { font-family: var(--serif); font-size: 50px; font-weight: 400; }

    .stream-a .stream-label { left: 60%; }

    .stream-a { --stream-top: 28%; --stream-angle: 7deg; --stream-color: #536bc8; }
    .stream-b { --stream-top: 60%; --stream-angle: -7deg; --stream-color: #d67d55; }

    .collision {
      position: absolute;
      left: 50%;
      top: 50%;
      display: grid;
      place-items: center;
      width: 140px;
      aspect-ratio: 1;
      border: 1px solid currentColor;
      border-radius: 50%;
      background: #eee8dd;
      transform: translate(-50%, -50%);
      font-family: var(--serif);
      font-size: 27px;
      text-align: center;
      line-height: 1;
      z-index: 3;
    }

    .stream-copy {
      position: absolute;
      left: clamp(30px, 5vw, 76px);
      bottom: clamp(28px, 5vw, 70px);
      z-index: 6;
      max-width: 540px;
      padding: 18px 24px;
      background: #eee8dd;
    }

    .stream-b .stream-label { right: 10%; left: auto; }

    .stream-copy .scene-title { font-size: clamp(42px, 6vw, 84px); }

    .shared-causes {
      position: relative;
      z-index: 6;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      width: min(880px, 100%);
      margin: 34px auto 0;
    }

    .shared-cause {
      min-height: 150px;
      border: 1px solid currentColor;
      background: rgba(238,232,221,.88);
      color: inherit;
      cursor: pointer;
      font-size: 20px;
      font-weight: 600;
      transition: background 200ms ease, color 200ms ease, transform 200ms var(--ease);
    }

    .shared-cause:hover { background: #171713; color: #f2eee6; transform: translateY(-6px); }
    .shared-cause span { display: block; margin-bottom: 18px; font-size: 35px; }

    .redirected .stream-a,
    .redirected .stream-b { top: 49%; transform: rotate(0deg); }

    .redirected .stream-b { opacity: 0; }

    .redirect-target {
      position: absolute;
      right: 8%;
      top: 50%;
      z-index: 6;
      display: grid;
      place-items: center;
      width: min(28vw, 310px);
      aspect-ratio: 1;
      border-radius: 50%;
      background: #e8c86e;
      color: #171713;
      transform: translateY(-50%);
      text-align: center;
      animation: target-in 900ms 240ms var(--ease) both;
    }

    .redirect-target strong { display: block; font-family: var(--serif); font-size: clamp(42px, 6vw, 78px); font-weight: 400; letter-spacing: -.06em; }
    .redirect-target span { display: block; max-width: 11ch; margin-top: 8px; font-size: 17px; }

    @keyframes target-in { from { opacity: 0; transform: translateY(-50%) scale(.45); } to { opacity: 1; transform: translateY(-50%) scale(1); } }

    /* Concept 4: Find the mix */
    .mix-scene {
      background:
        radial-gradient(circle at 16% 8%, rgba(96,117,171,.18), transparent 31%),
        radial-gradient(circle at 88% 84%, rgba(197,127,94,.16), transparent 35%),
        #eae5da;
    }

    .mix-layout {
      position: relative;
      z-index: 3;
      display: grid;
      grid-template-columns: minmax(230px, .68fr) minmax(0, 1.32fr);
      gap: clamp(28px, 5vw, 76px);
      align-items: center;
    }

    .meters {
      display: grid;
      gap: 30px;
      margin-top: 44px;
    }

    .meter-head { display: flex; justify-content: space-between; gap: 15px; margin-bottom: 10px; }
    .meter-head strong { font-weight: 600; }
    .meter-head span { opacity: .62; }

    .meter-track { position: relative; height: 10px; background: rgba(25,26,23,.13); }
    .meter-fill { height: 100%; width: var(--meter); background: var(--meter-color); transition: width 550ms var(--ease); }
    .meter-mid { position: absolute; left: 50%; top: -5px; width: 1px; height: 20px; background: rgba(25,26,23,.48); }

    .mixes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }

    .mix-card {
      position: relative;
      min-height: 390px;
      padding: 18px;
      border: 1px solid rgba(25,26,23,.34);
      background: rgba(249,247,240,.45);
      color: inherit;
      cursor: pointer;
      text-align: left;
      box-shadow: 0 16px 34px rgba(35,34,29,.04);
      transition: transform 230ms var(--ease), background 230ms ease, border-color 230ms ease, color 230ms ease, box-shadow 230ms ease;
    }

    .mix-card:nth-child(1) { background: #e6d8ce; }
    .mix-card:nth-child(2) { background: #dfe1d2; }
    .mix-card:nth-child(3) { background: #d9dfeb; }
    .mix-card:hover {
      z-index: 2;
      border-color: rgba(25,26,23,.72);
      box-shadow: 0 22px 42px rgba(35,34,29,.12);
      transform: translateY(-7px);
    }
    .mix-card[aria-pressed="true"] {
      z-index: 3;
      border-color: #5368a5;
      background: #5368a5;
      color: #fff;
      box-shadow: 0 26px 48px rgba(69,83,132,.22);
      transform: translateY(-10px);
    }
    .mix-card.is-shaking { animation: shake 420ms ease; }

    @keyframes shake { 20%, 60% { transform: translateX(-7px); } 40%, 80% { transform: translateX(7px); } }

    .mix-number { font-size: 13px; opacity: .52; }
    .mix-side { margin-top: 54px; }
    .mix-side + .mix-side { margin-top: 28px; padding-top: 22px; border-top: 1px solid currentColor; }
    .mix-side span { display: block; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; opacity: .52; }
    .mix-side strong { display: block; margin-top: 7px; font-family: var(--serif); font-size: clamp(25px, 3vw, 38px); font-weight: 400; letter-spacing: -.04em; line-height: 1; }

    .mix-verdict {
      min-height: 26px;
      margin-top: 24px;
      color: #855744;
      font-size: 14px;
    }

    .experience[data-concept="mix"] .primary-action,
    .experience[data-concept="mix"] .conversion-link.is-primary {
      background: #5368a5;
    }

    .mix-actions {
      position: relative;
      z-index: 5;
      display: flex;
      align-items: center;
      flex-wrap: nowrap;
      gap: 12px;
      margin-top: 34px;
    }

    .mix-actions .primary-action { margin-top: 0; }

    .mix-alternative {
      width: min(205px, 100%);
      min-height: 56px;
      padding: 0 12px;
      border: 1px solid currentColor;
      background: transparent;
      color: inherit;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      line-height: 1.2;
      text-align: left;
      white-space: nowrap;
      transition: transform 200ms var(--ease), opacity 200ms ease;
    }

    .mix-alternative:hover { opacity: .65; transform: translateY(-2px); }

    .equalizer {
      position: absolute;
      inset: 0;
      display: flex;
      justify-content: space-around;
      align-items: end;
      gap: 5px;
      padding: 6% 3% 0;
      opacity: .1;
      pointer-events: none;
    }

    .equalizer i {
      width: 1px;
      height: var(--h);
      background: #5368a5;
      transform-origin: bottom;
      animation: equalize var(--speed) ease-in-out infinite alternate;
    }

    .equalizer i:nth-child(3n + 2) { background: #70806a; }
    .equalizer i:nth-child(3n) { background: #c77f5f; }

    @keyframes equalize { to { transform: scaleY(.18); opacity: .35; } }

    /* Concept 5: Match */
    .match-scene { overflow: hidden; }

    .match-orbit {
      position: absolute;
      right: -12%;
      top: -20%;
      width: min(62vw, 780px);
      aspect-ratio: 1;
      border: 1px solid rgba(19,32,25,.22);
      border-radius: 50%;
      animation: orbit-in 1s var(--ease) both;
    }

    .match-orbit::before,
    .match-orbit::after {
      position: absolute;
      inset: 17%;
      border: 1px solid rgba(19,32,25,.18);
      border-radius: 50%;
      content: "";
    }

    .match-orbit::after { inset: 34%; background: #e7c970; border: 0; }

    @keyframes orbit-in { from { transform: scale(.5) rotate(-25deg); opacity: 0; } to { transform: scale(1) rotate(0); opacity: 1; } }

    .offer-choices { max-width: 940px; }

    .match-stack {
      position: relative;
      z-index: 5;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      width: min(1040px, 100%);
      margin: 38px auto 0;
      perspective: 900px;
    }

    .match-card {
      position: relative;
      min-height: 400px;
      padding: 20px;
      border: 1px solid #132019;
      background: #edf0e7;
      color: #132019;
      cursor: pointer;
      text-align: left;
      transform: rotate(var(--tilt));
      transition: transform 260ms var(--ease), background 220ms ease, color 220ms ease;
      animation: deal-in 700ms var(--delay) var(--ease) both;
    }

    @keyframes deal-in { from { opacity: 0; transform: translateY(80px) rotate(calc(var(--tilt) * 2)); } to { opacity: 1; transform: rotate(var(--tilt)); } }

    .match-card:hover { z-index: 3; transform: translateY(-13px) rotate(0); background: #132019; color: #f2eee6; }
    .match-card[aria-pressed="true"] { z-index: 4; transform: translateY(-18px) rotate(0) scale(1.03); background: #4f66c4; color: white; }

    .avatar-mini {
      display: grid;
      place-items: center;
      width: 54px;
      height: 54px;
      border: 1px solid currentColor;
      border-radius: 50%;
      font-family: var(--serif);
      font-size: 25px;
    }

    .match-name { margin: 14px 0 0; font-size: 25px; font-weight: 650; letter-spacing: -.04em; }
    .match-exchange { margin-top: 46px; }
    .match-exchange div + div { margin-top: 22px; padding-top: 18px; border-top: 1px solid currentColor; }
    .match-exchange span { display: block; font-size: 11px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; opacity: .55; }
    .match-exchange strong { display: block; margin-top: 6px; font-family: var(--serif); font-size: clamp(24px, 2.6vw, 36px); font-weight: 400; letter-spacing: -.04em; line-height: 1; }
    .match-card small { position: absolute; left: 20px; bottom: 20px; opacity: .56; }

    .match-success-visual {
      position: absolute;
      right: 7%;
      top: 50%;
      width: min(38vw, 470px);
      aspect-ratio: 1;
      border: 1px solid currentColor;
      border-radius: 50%;
      transform: translateY(-50%);
    }

    .match-success-visual::before {
      position: absolute;
      inset: 16%;
      border-radius: 50%;
      background: #e6c96f;
      content: "";
      animation: match-pulse 1.6s var(--ease) infinite alternate;
    }

    .match-success-visual::after {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 78%;
      height: 14%;
      background: #132019;
      clip-path: polygon(0 34%, 82% 34%, 82% 0, 100% 50%, 82% 100%, 82% 66%, 0 66%);
      content: "";
      transform: translate(-50%, -50%) rotate(-38deg);
    }

    @keyframes match-pulse { to { transform: scale(1.08); } }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      z-index: 100;
      max-width: min(520px, calc(100vw - 32px));
      padding: 12px 16px;
      border-radius: 999px;
      background: #f3eee5;
      color: #171713;
      box-shadow: 0 16px 46px rgba(0,0,0,.26);
      transform: translate(-50%, 30px);
      opacity: 0;
      pointer-events: none;
      transition: transform 240ms var(--ease), opacity 240ms ease;
      font-size: 14px;
    }

    .toast.is-visible { transform: translate(-50%, 0); opacity: 1; }

    @media (max-width: 900px) {
      .lab { grid-template-rows: auto minmax(720px, 1fr) auto; padding: 8px; }
      .labbar { flex-wrap: wrap; min-height: 98px; padding: 8px; }
      .brand { min-width: 0; }
      .concept-switcher { order: 3; flex-basis: 100%; justify-content: flex-start; overflow-x: auto; padding-bottom: 2px; }
      .concept-tab { flex: 0 0 auto; }
      .experience, .stage { min-height: 720px; }
      .experience[data-concept="two-moves"],
      .experience[data-concept="two-moves"] .stage { min-height: 900px; }
      .experience[data-concept="crowd"],
      .experience[data-concept="crowd"] .stage { min-height: 900px; }
      .experience[data-concept="mix"],
      .experience[data-concept="mix"] .stage { min-height: 900px; }
      .meeting-scene, .mix-layout, .cause-picker-scene { grid-template-columns: 1fr; }
      .cause-picker-scene { align-content: start; }
      .cause-intro .scene-title { max-width: 10ch; font-size: clamp(48px, 9vw, 78px); }
      .cause-grid { margin-top: 26px; }
      .portrait-wrap { position: absolute; right: -3%; bottom: -10%; width: 47%; opacity: .72; }
      .cause-stamp { width: 104px; }
      .move-board { grid-template-columns: 1fr; gap: 8px; }
      .move-card { min-height: 150px; }
      .move-card strong { margin-top: 24px; }
      .move-join { width: 54px; height: 54px; justify-self: center; transform: rotate(90deg); }
      .move-board.is-ready .move-join { transform: rotate(270deg); }
      .crowd-field { inset: 0 0 0 26%; opacity: .68; }
      .project-silhouette { width: 60vw; }
      .career-offers { grid-template-columns: minmax(0, 1fr) 86px minmax(0, 1fr); }
      .career-gap strong { font-size: 20px; }
      .career-equation { gap: 7px; }
      .career-equation > div { padding: 14px; }
      .stream-label strong { font-size: 38px; }
      .mixes, .match-stack { grid-template-columns: repeat(3, minmax(210px, 1fr)); overflow-x: auto; padding-bottom: 16px; scroll-snap-type: x mandatory; }
      .mix-card, .match-card { scroll-snap-align: center; }
      .match-success-visual { opacity: .38; right: -12%; }
    }

    @media (max-width: 640px) {
      .lab { display: block; padding: 0; }
      .labbar { min-height: 112px; padding: 10px 12px; }
      .brand span { display: none; }
      .experience { min-height: 760px; border-radius: 0; }
      .stage { min-height: 760px; }
      .experience[data-concept="two-moves"],
      .experience[data-concept="two-moves"] .stage { min-height: 900px; }
      .experience[data-concept="crowd"],
      .experience[data-concept="crowd"] .stage { min-height: 1120px; }
      .experience[data-concept="mix"],
      .experience[data-concept="mix"] .stage { min-height: 1080px; }
      .scene { padding: 72px 20px 34px; align-content: start; }
      .scene-title { font-size: clamp(44px, 14vw, 70px); }
      .scene-line { font-size: 17px; margin-top: 18px; }
      .choice-row { grid-template-columns: 1fr; gap: 7px; margin-top: 26px; }
      .choice { min-height: 104px; }
      .choice strong { margin-top: 14px; font-size: 24px; }
      .choice small { display: none; }
      .choice-icon { position: absolute; right: 18px; top: 17px; }
      .step-mark { top: 22px; right: 18px; }
      .meeting-scene { align-content: start; }
      .cause-picker-scene { gap: 0; }
      .cause-picker-scene .cause-sun { opacity: .25; }
      .cause-intro .scene-title { max-width: 8ch; font-size: 52px; }
      .cause-intro .scene-line { max-width: 31ch; }
      .cause-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; margin-top: 22px; }
      .cause-choice { min-height: 68px; padding: 10px 28px 10px 11px; }
      .cause-choice::before { width: 7px; height: 7px; margin-bottom: 8px; }
      .cause-choice strong { font-size: 16px; }
      .cause-choice::after { right: 10px; top: 8px; font-size: 15px; }
      .portrait-wrap { width: 70%; bottom: -4%; right: -12%; }
      .move-board { margin-top: 24px; }
      .move-card { min-height: 128px; }
      .move-card strong { font-size: 27px; }
      .conversion-deck { grid-template-columns: 1fr; margin-top: 28px; }
      .conversion-link { min-height: 72px; }
      .success-copy .scene-title { font-size: 54px; }
      .crowd-field { inset: 30% 0 0 0; }
      .pledge-choices { grid-template-columns: repeat(3, 1fr); }
      .pledge-choices .choice { min-height: 88px; padding: 12px; }
      .pledge-choices .choice strong { font-size: 36px; }
      .crowd-condition { grid-template-columns: 1fr; margin-top: 20px; }
      .crowd-condition span { min-height: 0; padding: 11px 13px; font-size: 14px; }
      .project-silhouette { width: 90vw; height: 28%; }
      .career-scene .scene-title { font-size: 50px; }
      .career-offers { grid-template-columns: 1fr; gap: 8px; margin-top: 24px; }
      .career-offer { min-height: 154px; padding: 17px; }
      .career-offer strong { margin-top: 14px; font-size: 42px; }
      .career-offer b { font-size: 20px; }
      .career-gap { grid-template-columns: 1fr auto 1fr; gap: 10px; padding: 4px 0; }
      .career-gap::before,
      .career-gap::after { width: 100%; height: 1px; }
      .career-gap strong { font-size: 18px; }
      .career-gap span { display: none; }
      .career-rule { margin-top: 20px; padding: 14px 15px; font-size: 16px; }
      .career-equation { grid-template-columns: 1fr; gap: 7px; margin-top: 24px; }
      .career-equation > div { min-height: 92px; padding: 14px 16px; }
      .career-equation > b { justify-self: center; line-height: .7; }
      .career-threshold-panel { margin-top: 26px; }
      .career-success-grid { width: 82vw; height: 48%; opacity: .46; }
      .stream { height: 62px; }
      .stream-label { font-size: 14px; }
      .stream-label strong { font-size: 31px; }
      .stream-a .stream-label { left: 38%; }
      .collision { width: 92px; font-size: 20px; }
      .stream-copy { left: 20px; bottom: 36px; right: 20px; }
      .shared-causes { grid-template-columns: 1fr; margin-top: 24px; }
      .shared-cause { min-height: 84px; }
      .shared-cause span { display: inline; margin-right: 12px; }
      .redirect-target { width: 180px; right: 2%; top: 24%; }
      .mix-layout { align-content: start; }
      .meters { margin-top: 24px; gap: 18px; }
      .mixes, .match-stack { margin-top: 25px; }
      .mix-card { min-height: 330px; }
      .mix-actions { display: grid; gap: 12px; }
      .mix-alternative { width: auto; justify-self: start; text-align: left; white-space: normal; }
      .match-card { min-height: 340px; }
      .match-orbit { width: 90vw; right: -38%; top: -8%; opacity: .55; }
      .labfooter { min-height: 64px; padding: 10px 12px; }
      .concept-caption span { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }


/* Donation Redirect: rescue opposed donations, then amplify one side through a coalition trade. */
.redirect-comparison-scene,
.coalition-scene,
.group-deal-scene,
.coalition-settlement-scene {
  align-content: center;
}

.redirect-comparison-scene .scene-title,
.coalition-scene .scene-title,
.group-deal-scene .scene-title,
.coalition-settlement-scene .scene-title {
  max-width: 15ch;
  font-size: clamp(40px, 5.4vw, 80px);
}

.stream-stage .stream-label span {
  max-width: 210px;
  line-height: 1.05;
}

.impact-options {
  width: min(1080px, 100%);
  margin-top: 26px;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px;
}

.impact-option {
  min-height: 190px;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  border: 1px solid rgba(25, 25, 21, 0.16);
  border-radius: 22px;
  background: rgba(255, 255, 255, 0.42);
}

.impact-option.is-group-buy {
  border-color: rgba(45, 85, 61, 0.45);
  background: #dce8da;
  box-shadow: 0 18px 38px rgba(29, 58, 39, 0.1);
  transform: translateY(-7px);
}

.impact-option > span,
.group-deal-card > span,
.coalition-profile > span,
.governance-panel > span {
  font-size: 11px;
  font-weight: 750;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  opacity: 0.58;
}

.impact-option strong {
  margin-top: auto;
  font-family: var(--serif);
  font-size: clamp(28px, 3vw, 44px);
  font-weight: 400;
  letter-spacing: -0.04em;
}

.impact-option b {
  font-size: 17px;
}

.impact-option small,
.group-deal-card small,
.governance-choices small {
  line-height: 1.35;
  opacity: 0.64;
}

.example-note,
.fallback-note {
  width: min(900px, 100%);
  margin: 16px 0 0;
  font-size: 13px;
  line-height: 1.4;
  opacity: 0.65;
}

.coalition-layout,
.settlement-layout {
  position: relative;
  z-index: 2;
  display: grid;
  grid-template-columns: minmax(280px, 0.82fr) minmax(430px, 1.18fr);
  align-items: center;
  gap: clamp(30px, 6vw, 92px);
}

.coalition-card,
.governance-panel {
  padding: clamp(20px, 3vw, 34px);
  border: 1px solid rgba(25, 25, 21, 0.16);

  background: rgba(255, 255, 255, 0.55);

.coalition-profile {

  gap: 5px;
}

.coalition-profile strong {

  font-size: 29px;

}

.priority-list {
  margin-top: 20px;
  display: grid;
  gap: 11px;
}

.priority-list > div {
  display: grid;

    function stepMark(current, total) {
      let bars = "";
      for (let i = 0; i < total; i += 1) bars += '<span class="' + (i <= current ? "is-done" : "") + '"></span>';
      return '<div class="step-mark" aria-label="Step ' + (current + 1) + ' of ' + total + '">' + bars + '</div>';
    }

    function burstMarkup(count = 34) {
      const colors = ["#526cff", "#657a5f", "#d88d64", "#e5c968"];
      let items = "";
      for (let i = 0; i < count; i += 1) {
        const angle = (Math.PI * 2 * i) / count;
        const distance = 160 + (i % 7) * 35;
        const x = Math.round(Math.cos(angle) * distance) + "px";
        const y = Math.round(Math.sin(angle) * distance) + "px";
        items += '<i style="--x:' + x + ';--y:' + y + ';--delay:' + ((i % 5) * 28) + 'ms;--particle:' + colors[i % colors.length] + '"></i>';
      }
      return '<div class="success-burst" aria-hidden="true">' + items + '</div>';
    }

    function switchConcept(index) {
      state.conceptIndex = (index + concepts.length) % concepts.length;
      resetConcept();
      render();

    function switchToConcept(id) {
      const index = concepts.findIndex(function(concept) { return concept.id === id; });
      if (index >= 0) switchConcept(index);
    }

    function moveThroughGuidedFlow(offset) {
      const currentId = concepts[state.conceptIndex].id;
      const currentPosition = guidedFlow.indexOf(currentId);
      const nextPosition = (currentPosition + offset + guidedFlow.length) % guidedFlow.length;
      switchToConcept(guidedFlow[nextPosition]);
    }

    function focusStageHeading() {
      const heading = stage.querySelector(".scene-title");
      if (!heading) return;
      heading.setAttribute("tabindex", "-1");
      heading.focus({ preventScroll: true });

    document.addEventListener("click", function(event) {
      const control = event.target.closest("[data-action]");
      if (!control) return;
      const action = control.dataset.action;

      if (action === "home") { event.preventDefault(); switchConcept(0); }
      if (action === "switch-concept") switchConcept(Number(control.dataset.index));
      if (action === "restart") { resetConcept(); render(); showToast("Concept restarted"); }
      if (action === "previous-concept") moveThroughGuidedFlow(-1);
      if (action === "next-concept") moveThroughGuidedFlow(1);

      if (action === "choose-cause") { state.cause = control.dataset.value; state.step = 1; render(); }
      if (action === "show-trade") { state.step = 2; render(); }
      if (action === "toggle-move") {
        const move = control.dataset.value;
        if (state.moves.has(move)) state.moves.delete(move); else state.moves.add(move);
        render();
      }
      if (action === "complete-trade" && state.moves.size === 2) { state.step = 3; render(); }
      if (action === "continue-to-mix") switchToConcept("mix");

      if (action === "choose-amount") { state.amount = control.dataset.value; state.step = 1; render(); }
      if (action === "wake-crowd") {
        state.step = 2;
        state.crowdGrowing = true;
        render();
        schedule(function() { state.crowdGrowing = false; state.step = 3; render(); }, 2300);

      if (action === "show-career-gap") { state.step = 4; render(); focusStageHeading(); }
      if (action === "choose-impact-job") { state.step = 5; render(); focusStageHeading(); }
      if (action === "fund-career-gap") {
        state.step = 6;
        state.careerFunding = true;
        render();
        focusStageHeading();
        const delay = window.matchMedia("(prefers-reduced-motion: reduce)").matches ? 180 : 1800;
        schedule(function() { state.careerFunding = false; state.step = 7; render(); focusStageHeading(); }, delay);
      }

      if (action === "show-basic-redirect") { state.step = 1; render(); focusStageHeading(); }
      if (action === "show-amplification") { state.step = 2; render(); focusStageHeading(); }
      if (action === "notify-coalition") { state.step = 3; render(); focusStageHeading(); }
      if (action === "form-coalition") { state.step = 4; render(); focusStageHeading(); }
      if (action === "accept-group-trade") { state.step = 5; render(); focusStageHeading(); }
      if (action === "choose-coalition-rule") { state.coalitionRule = control.dataset.value; render(); }
      if (action === "release-coalition" && state.coalitionRule) { state.step = 6; render(); focusStageHeading(); }

      if (action === "choose-mix") {
        state.mix = control.dataset.value;
        state.mixAttempt = state.mix === "three" ? 0 : 1;
        render();
        if (state.mix === "three") {
          const mixActions = stage.querySelector(".mix-actions");
          if (mixActions) mixActions.scrollIntoView({ block: "center" });
        }
        if (state.mix !== "three") schedule(function() { state.mixAttempt = 0; render(); }, 480);
      }
      if (action === "open-redirect") switchToConcept("redirect");
      if (action === "open-crowd") switchToConcept("crowd");
      if (action === "offer-trade") switchToConcept("match");

      if (action === "choose-offer") { state.offer = control.dataset.value; state.step = 1; render(); }
      if (action === "choose-match") { state.match = control.dataset.value; render(); }
      if (action === "open-match") { state.step = 2; render(); }
    });

    document.addEventListener("keydown", function(event) {
      if (event.altKey && event.key === "ArrowRight") moveThroughGuidedFlow(1);
      if (event.altKey && event.key === "ArrowLeft") moveThroughGuidedFlow(-1);
      if (event.key.toLowerCase() === "r" && !event.metaKey && !event.ctrlKey && !event.altKey) {
        const tag = document.activeElement && document.activeElement.tagName;
        if (tag !== "INPUT" && tag !== "TEXTAREA") { resetConcept(); render(); }
      }
    });

    render();
  </script>
</body>
</html>
