name: Homepage and Now feed QA

on:
  pull_request:
    paths:
      - "src/app/home-process-polish.css"
      - "src/app/home-mode-hover-colors.css"
      - "src/app/layout.tsx"
      - "public/moral-trade-live*"
      - "src/app/api/live-now/**"
      - "src/components/recommendations/**"
      - "src/lib/live-now-recommendations*"
      - "src/lib/recommendation-learning*"
      - "src/live-now-data.test.ts"
      - "src/live-now-priority-route.test.ts"
      - "tests/exact-live-now-recommendations.spec.ts"
      - ".github/workflows/home-process-visual-qa.yml"
  push:
    branches:
      - polish-home-process-section

permissions:
  contents: read

jobs:
  home-process-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint adaptive feed TypeScript
        run: |
          npx eslint \
            src/app/api/live-now/feedback/route.ts \
            src/app/api/live-now/route.ts \
            src/app/layout.tsx \
            src/components/recommendations/recommendation-learning-tracker.tsx \
            src/lib/live-now-recommendations.test.ts \
            src/lib/live-now-recommendations.ts \
            src/lib/recommendation-learning.test.ts \
            src/lib/recommendation-learning.ts \
            src/live-now-data.test.ts \
            src/live-now-priority-route.test.ts \
            tests/exact-live-now-recommendations.spec.ts

      - name: Run adaptive feed unit tests
        run: |
          node --import tsx --test \
            src/lib/live-now-recommendations.test.ts \
            src/lib/recommendation-learning.test.ts \
            src/live-now-data.test.ts \
            src/live-now-priority-route.test.ts

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run adaptive feed browser QA
        run: npm run test:e2e -- tests/exact-live-now-recommendations.spec.ts
