name: One-use DAC psql fixture environment repair 20260818

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/one-use-dac-psql-env-forwarding-repair-20260818.yml"

permissions:
  contents: write

concurrency:
  group: one-use-dac-psql-fixture-environment-repair-20260818
  cancel-in-progress: false

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out current repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/dac-public-goods-foundation-reconciliation-20260818
          fetch-depth: 0

      - name: Forward only the run-generated fixture password into the PostgreSQL client container
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path(".github/workflows/mpgf-dac-product-lifecycle-gates.yml")
          source = path.read_text()
          old = '''                    exec docker run --rm -i \\
                      -v "$PWD:/workspace" \\
                      -w /workspace \\
                      postgres:17 psql "$@"
          '''.replace("                    ", "")
          new = '''                    exec docker run --rm -i \\
                      -e MPGF_DAC_PRODUCT_QA_PASSWORD \\
                      -v "$PWD:/workspace" \\
                      -w /workspace \\
                      postgres:17 psql "$@"
          '''.replace("                    ", "")
          if source.count(old) != 1:
              raise SystemExit("Expected exactly one containerized psql wrapper without fixture env forwarding.")
          if source.count("-e MPGF_DAC_PRODUCT_QA_PASSWORD") != 0:
              raise SystemExit("Fixture password forwarding already exists unexpectedly.")
          source = source.replace(old, new)
          if source.count("-e MPGF_DAC_PRODUCT_QA_PASSWORD") != 1:
              raise SystemExit("Expected exactly one narrowly scoped fixture-password forwarding flag.")
          path.write_text(source)
          PY

          git diff --check
          git diff -- .github/workflows/mpgf-dac-product-lifecycle-gates.yml

      - name: Commit normally and remove this one-use controller
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-use-dac-psql-env-forwarding-repair-20260818.yml
          git add .github/workflows/mpgf-dac-product-lifecycle-gates.yml
          git commit -m "ci(mpgf): forward run-owned fixture password to psql container"
          git push origin HEAD:fix/dac-public-goods-foundation-reconciliation-20260818
