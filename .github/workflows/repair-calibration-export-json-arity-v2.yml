name: Restage calibration export JSON arity repair

on:
  push:
    branches:
      - feature/evidence-credibility-calibration-export-v1-20260812
    paths:
      - .github/workflows/repair-calibration-export-json-arity-v2.yml

permissions:
  contents: write

concurrency:
  group: repair-calibration-export-json-arity-v2-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  restage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Make the payload terminator lookup local to the observation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path(".github/workflows/repair-calibration-export-json-arity.yml")
          source = path.read_text(encoding="utf-8")
          old = "if source.count(start_marker) != 1 or source.count(end_marker) != 1:"
          new = "if source.count(start_marker) != 1:"
          if source.count(old) != 1:
              raise SystemExit("Expected exactly one over-broad payload marker check.")
          path.write_text(source.replace(old, new), encoding="utf-8")
          PY
          git diff --check
          grep -q "if source.count(start_marker) != 1:" \
            .github/workflows/repair-calibration-export-json-arity.yml

      - name: Commit the corrected controller and remove this restager
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/repair-calibration-export-json-arity.yml
          git rm .github/workflows/repair-calibration-export-json-arity-v2.yml
          git commit -m "ops: narrow calibration export payload marker"
          git push origin "HEAD:${GITHUB_REF_NAME}"
