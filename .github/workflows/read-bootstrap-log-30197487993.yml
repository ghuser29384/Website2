name: Read bootstrap failure excerpt

on:
  push:
    branches:
      - ops/read-bootstrap-log-30197487993
    paths:
      - .github/workflows/read-bootstrap-log-30197487993.yml
      - .github/scripts/read-bootstrap-log-30197487993.py
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/read-bootstrap-log-30197487993.yml
      - .github/scripts/read-bootstrap-log-30197487993.py

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  extract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Download, sanitize, and post the failing step excerpt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/ghuser29384/Website2/ops/read-bootstrap-log-30197487993/.github/scripts/read-bootstrap-log-30197487993.py \
            --output "$RUNNER_TEMP/read-bootstrap-log.py"
          python3 "$RUNNER_TEMP/read-bootstrap-log.py"
