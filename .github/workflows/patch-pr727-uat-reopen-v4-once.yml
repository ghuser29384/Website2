name: Patch PR 727 UAT suggestion reopening v4

on:
  push:
    branches:
      - ops/pr727-production-create-uat-final-20260817
    paths:
      - .github/workflows/patch-pr727-uat-reopen-v4-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Guard and patch one exact keyboard block
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'ghuser29384/Website2'
          test "$GITHUB_REF_NAME" = 'ops/pr727-production-create-uat-final-20260817'
          test "$(git rev-parse HEAD^)" = 'aa316919f24b47599330512e91760c8cfc77a14f'
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/patch-pr727-uat-reopen-v4-once.yml'
          git diff --check HEAD^ HEAD
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/create-production-uat.mjs')
          source = path.read_text(encoding='utf-8')
          start_marker = '  await focusedAfterTab.press("Shift+Tab");\n'
          end_marker = '\n  const state = await create.locator("body").evaluate(() => {'
          if source.count(start_marker) != 1:
              raise SystemExit(f'Expected one start marker, found {source.count(start_marker)}')
          start = source.index(start_marker)
          end = source.index(end_marker, start)
          replacement = "\n".join([
              '  await focusedAfterTab.press("Shift+Tab");',
              '  await expect(input).toBeFocused();',
              '  await input.fill("Revie");',
              '  await input.fill("Review");',
              '  await expect(create.locator("#actionSuggestions")).toBeVisible();',
              '  await input.press("ArrowDown");',
              '  await expect(activeSuggestion).toHaveCount(1);',
              '',
          ])
          updated = source[:start] + replacement + source[end:]
          if updated.count('await input.fill("Revie");') != 1:
              raise SystemExit('Reopen contract missing or duplicated')
          path.write_text(updated, encoding='utf-8')
          PY
          node --check .github/scripts/create-production-uat.mjs
          grep -Fq 'await input.fill("Revie");' .github/scripts/create-production-uat.mjs
          grep -Fq 'await expect(create.locator("#actionSuggestions")).toBeVisible();' .github/scripts/create-production-uat.mjs
          git diff --check
          test "$(git diff --name-only)" = '.github/scripts/create-production-uat.mjs'
      - name: Commit and push only the harness correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/scripts/create-production-uat.mjs
          test "$(git diff --cached --name-only)" = '.github/scripts/create-production-uat.mjs'
          git diff --cached --check
          git commit -m 'Reopen Create suggestions before geometry checks'
          git push origin HEAD:ops/pr727-production-create-uat-final-20260817
