name: Repair MPGF review-freeze SQL ambiguity 2026-08-06

on:
  push:
    branches:
      - fix/mpgf-pool-review-freeze-20260806
    paths:
      - ".github/workflows/repair-mpgf-review-freeze-ambiguity-20260806.yml"

permissions:
  contents: write

concurrency:
  group: repair-mpgf-review-freeze-ambiguity-20260806
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_PARENT: 34f402fe50821f0796114882810fa06f8c519748
      TARGET_BRANCH: fix/mpgf-pool-review-freeze-20260806
      CONTROLLER_PATH: .github/workflows/repair-mpgf-review-freeze-ambiguity-20260806.yml

    steps:
      - name: Check out exact controller commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          ref: ${{ github.sha }}

      - name: Qualify proposal-version columns and add a permanent contract assertion
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          changed="$(git diff-tree --no-commit-id --name-only -r HEAD | sed '/^$/d')"
          test "$changed" = "$CONTROLLER_PATH"

          python3 - <<'PY'
          from pathlib import Path

          migration_path = Path("supabase/migrations/20260806110000_mpgf_pool_review_freeze.sql")
          migration = migration_path.read_text()
          old = (
              "  select terms_sha256 into recorded_hash\n"
              "  from public.mpgf_pool_proposal_versions\n"
              "  where proposal_id = p_proposal_id\n"
              "    and terms_version = proposal_row.terms_version;\n"
          )
          new = (
              "  select proposal_version.terms_sha256 into recorded_hash\n"
              "  from public.mpgf_pool_proposal_versions as proposal_version\n"
              "  where proposal_version.proposal_id = p_proposal_id\n"
              "    and proposal_version.terms_version = proposal_row.terms_version;\n"
          )
          if migration.count(old) != 1:
              raise SystemExit(f"Expected exactly one ambiguous approval query, found {migration.count(old)}")
          migration = migration.replace(old, new)

          old_assignment = "      approved_terms_version = terms_version,\n"
          new_assignment = "      approved_terms_version = proposal_row.terms_version,\n"
          if migration.count(old_assignment) != 1:
              raise SystemExit(
                  f"Expected exactly one unqualified approved-version assignment, found {migration.count(old_assignment)}"
              )
          migration_path.write_text(migration.replace(old_assignment, new_assignment))

          test_path = Path("src/lib/mpgf/pool-review-freeze-migration.test.ts")
          test_source = test_path.read_text()
          anchor = "    \"recorded_hash <> current_hash\",\n"
          addition = (
              "    \"from public.mpgf_pool_proposal_versions as proposal_version\",\n"
              "    \"proposal_version.terms_sha256\",\n"
              "    \"approved_terms_version = proposal_row.terms_version\",\n"
          )
          if test_source.count(anchor) != 1:
              raise SystemExit(f"Expected one migration-contract anchor, found {test_source.count(anchor)}")
          test_path.write_text(test_source.replace(anchor, anchor + addition))
          PY

          git diff --check
          git diff -- \
            supabase/migrations/20260806110000_mpgf_pool_review_freeze.sql \
            src/lib/mpgf/pool-review-freeze-migration.test.ts

      - name: Commit and push non-workflow repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            supabase/migrations/20260806110000_mpgf_pool_review_freeze.sql \
            src/lib/mpgf/pool-review-freeze-migration.test.ts
          git diff --cached --check
          git commit -m "Qualify MPGF review freeze version columns"
          git push origin "HEAD:$TARGET_BRANCH"
