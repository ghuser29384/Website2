name: Direct Donation Upgrade current-main source export

on:
  push:
    branches:
      - integration/direct-donation-upgrade-current-main-20260807
    paths:
      - .github/workflows/direct-donation-upgrade-current-main-source-export-20260807.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: direct-donation-upgrade-current-main-source-export-20260807
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      APP_BASE: 87b093751a4c2de909555abdb7f181061bb36390
      FEATURE_HEAD: c7cd82bd78608435155a4d047eda883e693e55cd
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify identities and package source snapshots
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --short)"
          git cat-file -e "$APP_BASE^{commit}"
          git cat-file -e "$FEATURE_HEAD^{commit}"
          merge_base="$(git merge-base "$APP_BASE" "$FEATURE_HEAD")"

          out="$RUNNER_TEMP/direct-upgrade-source"
          mkdir -p "$out"
          printf '%s\n' "$GITHUB_SHA" > "$out/exporter-head.txt"
          printf '%s\n' "$APP_BASE" > "$out/app-base.txt"
          printf '%s\n' "$FEATURE_HEAD" > "$out/feature-head.txt"
          printf '%s\n' "$merge_base" > "$out/merge-base.txt"
          git rev-parse "$APP_BASE^{tree}" > "$out/app-base-tree.txt"
          git rev-parse "$FEATURE_HEAD^{tree}" > "$out/feature-tree.txt"
          git rev-parse "$merge_base^{tree}" > "$out/merge-base-tree.txt"

          git archive --format=zip --output="$out/current-main-$APP_BASE.zip" "$APP_BASE"
          git archive --format=zip --output="$out/direct-upgrade-feature-$FEATURE_HEAD.zip" "$FEATURE_HEAD"
          git archive --format=zip --output="$out/direct-upgrade-merge-base-$merge_base.zip" "$merge_base"
          sha256sum "$out"/*.zip > "$out/source-sha256.txt"

      - name: Upload exact source snapshots
        uses: actions/upload-artifact@v4
        with:
          name: direct-donation-upgrade-current-main-source-${{ github.run_id }}
          path: ${{ runner.temp }}/direct-upgrade-source
          retention-days: 7
