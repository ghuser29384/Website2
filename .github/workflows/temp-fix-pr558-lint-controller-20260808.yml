name: Temporary repair PR 558 public-terms QA fixture

on:
  push:
    branches:
      - temp/fix-pr558-lint-controller-20260808

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      EXPECTED_HEAD_SHA: d10b836900e862d46640b3c826f219a9f1fe87e0
      TARGET_BRANCH: fix/mpgf-dac-product-lifecycle-20260807
      EXPECTED_QA_POOLER_HOST: aws-0-us-west-1.pooler.supabase.com
      EXPECTED_QA_REF: hvmxfjjbdcgjjudmthdz
      PGSSLMODE: require
      QA_SUPABASE_DB_URL: ${{ secrets.QA_SUPABASE_DB_URL }}

    steps:
      - name: Check out the exact PR head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Verify exact head and repair only the observed constraint mismatch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          python3 - <<'PY'
          from pathlib import Path

          path = Path("supabase/tests/mpgf_dac_public_terms_api.sql")
          source = path.read_text()

          old_policy = '    "eligibilityPolicy":{"policyVersion":"mpgf_failure_bonus_eligibility_v0_1"},\n'
          new_policy = (
              '    "eligibilityPolicy":{\n'
              '      "policyVersion":"mpgf_failure_bonus_eligibility_v0_1",\n'
              '      "contributorIdentityRule":"verified_unique_person",\n'
              '      "contributionTimingRule":"captured_before_deadline",\n'
              '      "relatedPartyRule":"exclude_creator_and_related_parties",\n'
              '      "paymentIntegrityRule":"exclude_duplicate_reversed_disputed_or_fraudulent",\n'
              '      "bonusBasis":"eligible_contribution",\n'
              '      "maxParticipants":100,\n'
              '      "maxBonusPerParticipantCents":2500\n'
              '    },\n'
          )
          if source.count(old_policy) != 1:
              raise SystemExit("Expected exactly one incomplete schedule eligibility policy.")
          source = source.replace(old_policy, new_policy)

          old_rationale = '      "rationale":"Synthetic provisional quote",\n'
          new_rationale = (
              '      "rationale":"Provisional threshold 1 experience-rated quote; '
              'operator approval remains required.",\n'
          )
          if source.count(old_rationale) != 1:
              raise SystemExit("Expected exactly one non-canonical provisional rationale.")
          source = source.replace(old_rationale, new_rationale)

          if source.count('"contributorIdentityRule":"verified_unique_person"') != 2:
              raise SystemExit("The proposal and schedule must contain the same full eligibility policy.")
          if source.count("Provisional threshold 1 experience-rated quote; operator approval remains required.") != 1:
              raise SystemExit("The canonical pending-review rationale was not installed exactly once.")

          path.write_text(source)
          PY

          git diff --check
          git diff -- supabase/tests/mpgf_dac_public_terms_api.sql

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes postgresql-client > /dev/null

      - name: Verify the exact TLS-only isolated QA target
        shell: bash
        run: |
          set -euo pipefail
          test -n "${QA_SUPABASE_DB_URL:-}"
          python3 - <<'PY'
          import os
          from urllib.parse import parse_qs, urlparse

          parsed = urlparse(os.environ["QA_SUPABASE_DB_URL"])
          ssl_modes = parse_qs(parsed.query).get("sslmode", ["require"])
          valid = (
              parsed.scheme in {"postgres", "postgresql"}
              and os.environ["EXPECTED_QA_REF"] in (parsed.username or "")
              and parsed.hostname == os.environ["EXPECTED_QA_POOLER_HOST"]
              and parsed.port == 5432
              and parsed.path == "/postgres"
              and ssl_modes == ["require"]
              and bool(parsed.password)
          )
          if not valid:
              raise SystemExit("Refusing a database URL outside the exact TLS-only Moral Trade QA target.")
          PY

      - name: Prove the repaired rollback-only public-terms regression
        shell: bash
        run: |
          set -euo pipefail
          psql "$QA_SUPABASE_DB_URL" \
            --no-psqlrc \
            --set ON_ERROR_STOP=1 \
            --file supabase/tests/mpgf_dac_public_terms_api.sql

      - name: Commit the narrowly scoped fixture repair and update the PR branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/tests/mpgf_dac_public_terms_api.sql
          git commit -m "test(mpgf): align public terms fixture with frozen schedule constraints"
          git push origin "HEAD:${TARGET_BRANCH}"
