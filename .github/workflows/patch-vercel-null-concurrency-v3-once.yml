name: One-time Vercel null-concurrency verifier repair v3

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-vercel-null-concurrency-v3-once.yml

permissions:
  contents: write

concurrency:
  group: patch-vercel-null-concurrency-v3-once
  cancel-in-progress: false

env:
  CONTROLLER_PATH: .github/workflows/patch-vercel-null-concurrency-v3-once.yml
  TARGET_BRANCH: fix/vercel-disabled-concurrency-null-20260802
  EXPECTED_HEAD: 49282e712228187e56bcfc75a8e051e103214e9b

jobs:
  patch:
    if: github.repository == 'ghuser29384/Website2' && github.actor == 'ghuser29384'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out exact target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Guard exact target source state
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'ghuser29384/Website2'
          test "$(git branch --show-current)" = "$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')" = "$EXPECTED_HEAD"
          git diff --quiet

      - name: Remove the one-time controller from main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          blob_sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/$CONTROLLER_PATH?ref=main" --jq .sha)"
          jq -n --arg message 'Remove one-time Vercel null-concurrency verifier repair v3' --arg sha "$blob_sha" --arg branch main '{message:$message,sha:$sha,branch:$branch}' \
            | gh api --method DELETE "repos/$GITHUB_REPOSITORY/contents/$CONTROLLER_PATH" --input - >/dev/null

      - name: Apply exact verifier and regression-test patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          implementation = Path('scripts/vercel-admin-cost-controls.mjs')
          text = implementation.read_text(encoding='utf-8')
          old = '  if (config.elasticConcurrencyEnabled !== false) {'
          new = '  if (config.elasticConcurrencyEnabled === true) {'
          if text.count(old) != 1:
              raise SystemExit(f'unexpected verifier condition inventory: {text.count(old)}')
          implementation.write_text(text.replace(old, new, 1), encoding='utf-8')

          tests = Path('scripts/vercel-admin-cost-controls.test.mjs')
          test_text = tests.read_text(encoding='utf-8')
          needle = (
              '  assert.equal(verifyCanonicalSettings(canonical), true);\n'
              '  assert.equal(verifyCanonicalLive(canonical), true);'
          )
          insertion = (
              '  assert.equal(verifyCanonicalSettings(canonical), true);\n'
              '  assert.equal(\n'
              '    verifyCanonicalSettings({\n'
              '      ...canonical,\n'
              '      resourceConfig: {\n'
              '        ...canonical.resourceConfig,\n'
              '        elasticConcurrencyEnabled: null,\n'
              '      },\n'
              '    }),\n'
              '    true,\n'
              '  );\n'
              '  assert.equal(verifyCanonicalLive(canonical), true);'
          )
          if test_text.count(needle) != 1:
              raise SystemExit(f'unexpected verifier test insertion point inventory: {test_text.count(needle)}')
          tests.write_text(test_text.replace(needle, insertion, 1), encoding='utf-8')
          PY

          printf '%s\n' \
            scripts/vercel-admin-cost-controls.mjs \
            scripts/vercel-admin-cost-controls.test.mjs \
            | sort > /tmp/expected-files.txt
          git diff --name-only | sort > /tmp/actual-files.txt
          diff -u /tmp/expected-files.txt /tmp/actual-files.txt
          git diff --check
          grep -Fq 'if (config.elasticConcurrencyEnabled === true)' scripts/vercel-admin-cost-controls.mjs
          grep -Fq 'elasticConcurrencyEnabled: null' scripts/vercel-admin-cost-controls.test.mjs

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Run focused Vercel control-plane tests
        shell: bash
        run: |
          set -o pipefail
          npm run test:vercel-controls 2>&1 | tee vercel-null-concurrency-tests.log

      - name: Commit and publish exact repository-only repair
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')" = "$EXPECTED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/vercel-admin-cost-controls.mjs scripts/vercel-admin-cost-controls.test.mjs
          git diff --cached --name-only | sort > /tmp/staged-files.txt
          diff -u /tmp/expected-files.txt /tmp/staged-files.txt
          git diff --cached --check
          git commit -m 'Accept Vercel null as disabled elastic concurrency'
          candidate_sha="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_HEAD"
          git push --force-with-lease="refs/heads/$TARGET_BRANCH:$EXPECTED_HEAD" origin "HEAD:refs/heads/$TARGET_BRANCH"
          echo "candidate_sha=$candidate_sha" >> "$GITHUB_OUTPUT"

      - name: Upload focused evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vercel-null-concurrency-verifier-v3-${{ github.run_id }}
          path: vercel-null-concurrency-tests.log
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce successful publication
        if: always()
        shell: bash
        run: test "${{ job.status }}" = 'success'
