name: Friendly copy and Create visuals production 2026-10-02

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/friendly-visual-production-20261002.yml

permissions:
  actions: write
  contents: read

concurrency:
  group: friendly-visual-production-20261002
  cancel-in-progress: false

env:
  CONTROLLER_PATH: .github/workflows/friendly-visual-production-20261002.yml
  RELEASE_WORKFLOW: vercel-release.yml
  RELEASE_REF: main
  RELEASE_TARGET: production
  EXPECTED_TRIGGER_PARENT: 4b584002a70d7d3c0cfd06ccae81048637fc2c76

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact controller commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Verify exact one-file trigger and approved public assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'ghuser29384/Website2'
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$(git rev-parse HEAD^1)" = "$EXPECTED_TRIGGER_PARENT"
          changed="$(git diff --name-only HEAD^1 HEAD | sed '/^$/d')"
          test "$changed" = "$CONTROLLER_PATH"
          printf '%s\n' \
            'bdbe6570196ece61fee4b91469cb3febfbfeb976a724e62dacd75a74156112b8  public/moral-trade-live-now.js' \
            '0418a6158bce9bf19affb094d8b0105538345fc87e2fda257e302e86e284f60d  public/moral-trade-create/index.html' \
            '8b60d0073a655a2a2a412d780262a629a2a937d1c62449d3841f6e995a1dfcb1  public/moral-trade-create/ui-repairs.css' \
            | sha256sum --check --strict
          test "$RELEASE_TARGET" = 'production'
          test "$RELEASE_REF" = 'main'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          remote_sha="$(git ls-remote origin "refs/heads/$RELEASE_REF" | awk '{print $1}')"
          test "$remote_sha" = "$GITHUB_SHA"
          workflow_state="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$RELEASE_WORKFLOW" --jq .state)"
          test "$workflow_state" = 'active'

      - name: Dispatch exact gated production release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            --arg workflow_ref main \
            --arg release_ref "$RELEASE_REF" \
            --arg target "$RELEASE_TARGET" \
            --arg expected_sha "$GITHUB_SHA" \
            '{ref:$workflow_ref,inputs:{ref:$release_ref,target:$target,expected_sha:$expected_sha,synthetic_auth_fixture_url:""}}' \
            | gh api --method POST \
                -H 'Accept: application/vnd.github+json' \
                -H 'X-GitHub-Api-Version: 2022-11-28' \
                "repos/$GITHUB_REPOSITORY/actions/workflows/$RELEASE_WORKFLOW/dispatches" \
                --input - >/dev/null
