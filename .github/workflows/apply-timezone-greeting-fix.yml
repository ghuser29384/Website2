name: Apply and verify timezone greeting patch

on:
  pull_request:
    branches:
      - feat/returning-homepage-match-deck

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/timezone-aware-home-greeting-20260717
          fetch-depth: 0

      - name: Apply the timezone patch
        run: |
          cat > /tmp/timezone-greeting.patch.b64 <<'PATCH'
          
          PATCH
          base64 --decode /tmp/timezone-greeting.patch.b64 > /tmp/timezone-greeting.patch
          git apply --check /tmp/timezone-greeting.patch
          git apply /tmp/timezone-greeting.patch

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Lint changed files
        run: >-
          npx eslint
          src/components/home/home-page.tsx
          src/components/home/local-date-greeting.tsx
          tests/returning-homepage.spec.ts
          tests/returning-homepage-timezone.spec.ts

      - name: Build production application
        run: npm run build

      - name: Run returning-homepage regressions
        run: >-
          npx playwright test
          tests/returning-homepage.spec.ts
          tests/returning-homepage-timezone.spec.ts
          --reporter=line

      - name: Capture timezone QA screenshots
        run: |
          mkdir -p /tmp/timezone-greeting-qa
          npm start -- -H 127.0.0.1 -p 3210 > /tmp/timezone-greeting-qa/server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:3210/ >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3210/ >/dev/null

          node <<'NODE'
          const { chromium } = require("@playwright/test");

          async function capture(browser, options) {
            const context = await browser.newContext({
              timezoneId: options.timezoneId,
              viewport: options.viewport,
            });
            await context.addCookies([
              {
                name: "mt_walkthrough_seen",
                value: "1",
                url: "http://127.0.0.1:3210",
              },
            ]);
            const page = await context.newPage();
            const errors = [];
            page.on("console", (message) => {
              if (message.type() === "error") errors.push(message.text());
            });
            page.on("pageerror", (error) => errors.push(error.message));
            await page.clock.setFixedTime(new Date(options.instant));
            await page.goto("http://127.0.0.1:3210/", { waitUntil: "domcontentloaded" });

            const greeting = page.getByTestId("local-date-greeting");
            await greeting.waitFor({ state: "visible" });
            await page.waitForFunction(
              () => document.querySelector('[data-testid="local-date-greeting"]')?.getAttribute("data-ready") === "true",
            );
            const actualDate = await greeting.locator("time").textContent();
            const actualGreeting = await greeting.locator("span").textContent();
            if (actualDate !== options.expectedDate || actualGreeting !== options.expectedGreeting) {
              throw new Error(
                `${options.label}: expected ${options.expectedDate} / ${options.expectedGreeting}, got ${actualDate} / ${actualGreeting}`,
              );
            }
            if (errors.length) {
              throw new Error(`${options.label}: console errors: ${errors.join(" | ")}`);
            }
            await page.screenshot({ path: options.path, fullPage: false });
            await context.close();
          }

          (async () => {
            const browser = await chromium.launch();
            try {
              await capture(browser, {
                label: "Los Angeles desktop",
                timezoneId: "America/Los_Angeles",
                viewport: { width: 1487, height: 1058 },
                instant: "2026-07-17T01:30:00.000Z",
                expectedDate: "Thursday, July 16, 2026",
                expectedGreeting: "Good evening, Alex.",
                path: "/tmp/timezone-greeting-qa/los-angeles-desktop.png",
              });
              await capture(browser, {
                label: "Tokyo mobile",
                timezoneId: "Asia/Tokyo",
                viewport: { width: 390, height: 844 },
                instant: "2026-07-17T01:30:00.000Z",
                expectedDate: "Friday, July 17, 2026",
                expectedGreeting: "Good morning, Alex.",
                path: "/tmp/timezone-greeting-qa/tokyo-mobile.png",
              });
            } finally {
              await browser.close();
            }
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Upload QA evidence
        uses: actions/upload-artifact@v4
        with:
          name: timezone-greeting-qa
          path: /tmp/timezone-greeting-qa
          if-no-files-found: error
          retention-days: 7

      - name: Commit the verified fix
        run: |
          rm .github/workflows/apply-timezone-greeting-fix.yml
          rm .github/workflows/export-timezone-fix-branch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix returning homepage timezone greeting"
          git push origin HEAD:fix/timezone-aware-home-greeting-20260717
