name: Get Started live release integration QA

on:
  push:
    branches: [ops/get-started-live-release-20260926]
    paths:
      - .github/workflows/get-started-live-release-qa.yml

permissions:
  contents: read

concurrency:
  group: get-started-live-release-20260926
  cancel-in-progress: false

env:
  EXPECTED_MAIN_SHA: ed0bc4a53a2ea91cee1a66fef8831d3181f53f13
  EXPECTED_OLD_CANDIDATE_SHA: f30b9c53e5849933cfe2e5fd6e119a825580bb57
  CANDIDATE_BRANCH: fix/get-started-choice-router-20260926
  NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3210
  SITE_URL: http://127.0.0.1:3210
  VERCEL: '1'
  PLAYWRIGHT_HTML_OPEN: never

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      candidate_sha: ${{ steps.fix.outputs.sha }}
    steps:
      - name: Check out exact integrated candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_OLD_CANDIDATE_SHA }}
          fetch-depth: 2

      - name: Repair the exact rendered Feed date and greeting hooks
        id: fix
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = ghuser29384/Website2
          test "$(git rev-parse HEAD)" = "$EXPECTED_OLD_CANDIDATE_SHA"
          remote_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          remote_candidate="$(git ls-remote origin "refs/heads/$CANDIDATE_BRANCH" | awk '{print $1}')"
          test "$remote_main" = "$EXPECTED_MAIN_SHA"
          test "$remote_candidate" = "$EXPECTED_OLD_CANDIDATE_SHA"
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, expected=1):
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{path}: expected {expected} occurrences of {old!r}, found {count}")
              file.write_text(text.replace(old, new))

          replace(
              "public/moral-trade-live-local-time.js",
              'document.querySelectorAll(".head .date")',
              'document.querySelectorAll(".head .date, .h .date")',
          )
          replace(
              "public/moral-trade-live-account.js",
              'document.querySelector(".head .date span.muted")',
              'document.querySelector(".head .date span.muted, .h .date span.muted")',
          )
          replace(
              "public/moral-trade-account-identity.js",
              'document.querySelectorAll("header p,header span,.head .date span.muted")',
              'document.querySelectorAll("header p,header span,.head .date span.muted,.h .date span.muted")',
          )
          replace(
              "tests/exact-live-local-time.spec.ts",
              'page.locator(".head .date")',
              'page.locator(".head .date, .h .date")',
              expected=2,
          )
          replace(
              "tests/returning-homepage-timezone.spec.ts",
              'page.locator(".head .date")',
              'page.locator(".head .date, .h .date")',
              expected=2,
          )
          replace(
              "tests/returning-homepage.spec.ts",
              'page.locator(".head .date")',
              'page.locator(".head .date, .h .date")',
          )
          replace(
              "tests/homepage-narrow-header.spec.ts",
              'page.locator(".head .date")',
              'page.locator(".head .date, .h .date")',
          )
          replace(
              "tests/homepage-narrow-header.spec.ts",
              'page.locator(\'.head button[data-action="create"]\')',
              'page.locator(\'.head button[data-action="create"], .h button[data-action="create"]\')',
          )
          PY
          git diff --check
          changed="$(git diff --name-only | sed '/^$/d')"
          test "$(printf '%s\n' "$changed" | wc -l)" -eq 7
          for required in \
            public/moral-trade-account-identity.js \
            public/moral-trade-live-account.js \
            public/moral-trade-live-local-time.js \
            tests/exact-live-local-time.spec.ts \
            tests/homepage-narrow-header.spec.ts \
            tests/returning-homepage-timezone.spec.ts \
            tests/returning-homepage.spec.ts; do
            printf '%s\n' "$changed" | grep -Fx "$required" >/dev/null
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- $changed
          git commit -m 'Restore live Feed date and greeting updates'
          git push origin "HEAD:refs/heads/$CANDIDATE_BRANCH"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  qa:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      EXPECTED_CANDIDATE_SHA: ${{ needs.prepare.outputs.candidate_sha }}
    steps:
      - name: Check exact remote identities
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = ghuser29384/Website2
          remote_main="$(git ls-remote https://github.com/$GITHUB_REPOSITORY.git refs/heads/main | awk '{print $1}')"
          remote_candidate="$(git ls-remote https://github.com/$GITHUB_REPOSITORY.git "refs/heads/$CANDIDATE_BRANCH" | awk '{print $1}')"
          test "$remote_main" = "$EXPECTED_MAIN_SHA"
          test "$remote_candidate" = "$EXPECTED_CANDIDATE_SHA"

      - name: Check out exact integrated candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_CANDIDATE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Record immutable source evidence
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_CANDIDATE_SHA"
          git cat-file -e "$EXPECTED_MAIN_SHA^{commit}"
          mkdir -p get-started-release-evidence
          git rev-parse HEAD > get-started-release-evidence/commit.txt
          git rev-parse HEAD^{tree} > get-started-release-evidence/tree.txt
          git diff "$EXPECTED_MAIN_SHA" --check
          git diff "$EXPECTED_MAIN_SHA" --stat > get-started-release-evidence/diff-stat.txt
          git diff "$EXPECTED_MAIN_SHA" --binary > get-started-release-evidence/source.patch

      - name: Install locked dependencies
        run: npm ci

      - name: Focused source contracts
        shell: bash
        run: |
          set -euo pipefail
          node --import tsx --test \
            src/lib/start-entry-router.test.ts \
            src/lib/action-first-positioning.test.ts \
            src/lib/public-route-smoke.test.ts \
            src/sitewide-account-identity.test.ts \
            2>&1 | tee get-started-release-evidence/focused-unit.log

      - name: Complete repository tests
        shell: bash
        run: |
          set -euo pipefail
          npm test 2>&1 | tee get-started-release-evidence/unit.log

      - name: Complete lint and typecheck
        shell: bash
        run: |
          set -euo pipefail
          npm run lint -- --quiet 2>&1 | tee get-started-release-evidence/lint.log
          npx tsc --noEmit 2>&1 | tee get-started-release-evidence/types.log

      - name: Production build
        shell: bash
        run: |
          set -euo pipefail
          npm run build 2>&1 | tee get-started-release-evidence/build.log

      - name: Install locked Chromium
        run: npx playwright install --with-deps chromium

      - name: Render Get Started and header behavior
        shell: bash
        run: |
          set -euo pipefail
          npx playwright test \
            tests/start-entry-router.spec.ts \
            tests/refined-header.spec.ts \
            tests/sitewide-canonical-visual-fidelity.spec.ts \
            tests/pilot-copy.spec.ts \
            tests/meta-explanatory-copy.spec.ts \
            tests/exact-live-local-time.spec.ts \
            tests/homepage-narrow-header.spec.ts \
            tests/returning-homepage-timezone.spec.ts \
            tests/returning-homepage.spec.ts \
            --workers=1 --reporter=line \
            2>&1 | tee get-started-release-evidence/focused-browser.log
          mkdir -p get-started-release-evidence/screenshots
          find test-results -name '*.png' -exec cp '{}' get-started-release-evidence/screenshots/ ';'

      - name: Complete unchanged release browser suite
        shell: bash
        run: |
          set -euo pipefail
          npm run test:e2e:release -- --reporter=line \
            2>&1 | tee get-started-release-evidence/release-browser.log

      - name: Upload exact release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: get-started-live-release-${{ env.EXPECTED_CANDIDATE_SHA }}
          path: |
            get-started-release-evidence
            test-results
          retention-days: 14
