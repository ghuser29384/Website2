            --build-env "SUPABASE_SERVICE_ROLE_KEY=" \
            --build-env "NEXT_PUBLIC_SUPABASE_ANON_KEY=" \
            --build-env "SUPABASE_ANON_KEY=" \
            --build-env "SUPABASE_URL=" \
            --build-env "SUPABASE_PROJECT_REF=" \
            --build-env "SUPABASE_DB_URL=" \
            --build-env "DATABASE_URL=" \
            --build-env "POSTGRES_URL=" \
            --build-env "POSTGRES_PRISMA_URL=" \
            --build-env "POSTGRES_URL_NON_POOLING=" \
