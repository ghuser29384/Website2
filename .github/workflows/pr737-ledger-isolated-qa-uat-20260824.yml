          LEDGER_PHASE: complete
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.QA_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: https://hvmxfjjbdcgjjudmthdz.supabase.co
        working-directory: app
        run: |
          set -euo pipefail
          export COMPACT_UAT_PASSWORD="$(tr -d '\r\n' < "$RUNNER_TEMP/pr737-uat-password")"
          export VERCEL_AUTOMATION_BYPASS_SECRET="$(cat "$RUNNER_TEMP/pr737-vercel-bypass")"
          echo "::add-mask::$COMPACT_UAT_PASSWORD"
          echo "::add-mask::$VERCEL_AUTOMATION_BYPASS_SECRET"
          npx playwright test \
            pr737-ledger-uat/ledger-phase.spec.ts \
            --config pr737-ledger-uat/playwright.config.ts \
            --reporter=line \
            2>&1 | tee ../evidence/complete-browser.log

      - name: Apply late partial-refund supersession phase
        id: refund_fixture
        shell: bash
        env:
          QA_SUPABASE_DB_URL: ${{ secrets.QA_SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          psql "$QA_SUPABASE_DB_URL" --no-psqlrc --tuples-only --no-align --set ON_ERROR_STOP=1 \
            --file controller/ops/pr737-ledger-uat/refund-supersession-fixture.sql \
            | tee evidence/refund-supersession-fixture.txt
          grep -Fxq 'hosted_refund_active_observation|1' evidence/refund-supersession-fixture.txt
          grep -Fxq 'hosted_refund_shadow_obligation|1' evidence/refund-supersession-fixture.txt

      - name: Verify refund supersession at four viewports
        id: refund_browser
        shell: bash
        env:
          COMPACT_UAT_BASE_URL: ${{ steps.deploy.outputs.deployment_url }}
          EXPECTED_COVERAGE: complete
          EXPECTED_ELIGIBLE_CENTS: "10000"
          EXPECTED_OBLIGATION_CENTS: "1000"
          EXPECTED_SOURCE_COUNT: "1"
          LEDGER_PHASE: refund
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.QA_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: https://hvmxfjjbdcgjjudmthdz.supabase.co
        working-directory: app
        run: |
          set -euo pipefail
          export COMPACT_UAT_PASSWORD="$(tr -d '\r\n' < "$RUNNER_TEMP/pr737-uat-password")"
          export VERCEL_AUTOMATION_BYPASS_SECRET="$(cat "$RUNNER_TEMP/pr737-vercel-bypass")"
          echo "::add-mask::$COMPACT_UAT_PASSWORD"
          echo "::add-mask::$VERCEL_AUTOMATION_BYPASS_SECRET"
          npx playwright test \
            pr737-ledger-uat/ledger-phase.spec.ts \
            --config pr737-ledger-uat/playwright.config.ts \
            --reporter=line \
            2>&1 | tee ../evidence/refund-browser.log

      - name: Apply late chargeback supersession phase
        id: chargeback_fixture
        shell: bash
        env:
          QA_SUPABASE_DB_URL: ${{ secrets.QA_SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          psql "$QA_SUPABASE_DB_URL" --no-psqlrc --tuples-only --no-align --set ON_ERROR_STOP=1 \
            --file controller/ops/pr737-ledger-uat/chargeback-supersession-fixture.sql \
            | tee evidence/chargeback-supersession-fixture.txt
          grep -Fxq 'hosted_chargeback_active_observation|1' evidence/chargeback-supersession-fixture.txt
          grep -Fxq 'hosted_chargeback_shadow_obligation|1' evidence/chargeback-supersession-fixture.txt

      - name: Verify chargeback supersession at four viewports
        id: chargeback_browser
        shell: bash
        env:
          COMPACT_UAT_BASE_URL: ${{ steps.deploy.outputs.deployment_url }}
          EXPECTED_COVERAGE: complete
          EXPECTED_ELIGIBLE_CENTS: "9000"
          EXPECTED_OBLIGATION_CENTS: "900"
          EXPECTED_SOURCE_COUNT: "1"
          LEDGER_PHASE: chargeback
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.QA_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: https://hvmxfjjbdcgjjudmthdz.supabase.co
        working-directory: app
        run: |
          set -euo pipefail
          export COMPACT_UAT_PASSWORD="$(tr -d '\r\n' < "$RUNNER_TEMP/pr737-uat-password")"
          export VERCEL_AUTOMATION_BYPASS_SECRET="$(cat "$RUNNER_TEMP/pr737-vercel-bypass")"
          echo "::add-mask::$COMPACT_UAT_PASSWORD"
          echo "::add-mask::$VERCEL_AUTOMATION_BYPASS_SECRET"
          npx playwright test \
            pr737-ledger-uat/ledger-phase.spec.ts \
            --config pr737-ledger-uat/playwright.config.ts \
            --reporter=line \
            2>&1 | tee ../evidence/chargeback-browser.log

      - name: Close exact hosted-UAT inspection window
        id: window
        if: always() && steps.baseline.outputs.uat_start != ''
        shell: bash
        run: |
          set -euo pipefail
          echo "uat_end=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Prove no money, authorization, activation, or electorate before cleanup
        id: no_money
        shell: bash
        env:
          QA_SUPABASE_DB_URL: ${{ secrets.QA_SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          psql "$QA_SUPABASE_DB_URL" --no-psqlrc --tuples-only --no-align --set ON_ERROR_STOP=1 \
            --file controller/ops/pr663-uat712/no-money-before-cleanup.sql \
            > evidence/no-money-before-cleanup.txt
          metric() { grep -E "^$1=" evidence/no-money-before-cleanup.txt | tail -n 1 | cut -d= -f2; }
          test "$(metric synthetic_users_before_cleanup)" = "3"
          test "$(metric payment_refs_before_cleanup)" = "0"
          test "$(metric activation_records_before_cleanup)" = "0"
          test "$(metric electorate_records_before_cleanup)" = "0"
          test "$(metric authorization_records_before_cleanup)" = "0"
          test "$(metric scheduled_records_before_cleanup)" = "0"
          test "$(metric settlement_records_before_cleanup)" = "0"
          test "$(metric qualification_records_before_cleanup)" = "0"
          test "$(metric readiness_records_before_cleanup)" = "0"
          test "$(metric eligibility_dependency_rows_before_cleanup)" = "0"
          test "$(metric coverage_records_before_cleanup)" -gt 0
          test "$(metric outflow_records_before_cleanup)" = "3"
          test "$(metric obligation_records_before_cleanup)" -ge 4

      - name: Unconditionally remove fixtures, sessions, Compact schema, and ledger schema
        id: cleanup
        if: always() && steps.fixtures.outputs.cleanup_authorized == 'true'
        shell: bash
        env:
          QA_SUPABASE_DB_URL: ${{ secrets.QA_SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          cleanup_log="$RUNNER_TEMP/pr737-cleanup.log"
          if ! psql "$QA_SUPABASE_DB_URL" --no-psqlrc --set ON_ERROR_STOP=1 \
            --file controller/ops/pr737-ledger-uat/cleanup.sql > "$cleanup_log" 2>&1; then
            sed -E \
              -e 's#postgres(ql)?://[^[:space:]]+#postgresql://[REDACTED]#g' \
              -e 's/[A-Za-z0-9_=-]{40,}/[REDACTED]/g' \
              "$cleanup_log" > evidence/cleanup-failure.txt
            cat evidence/cleanup-failure.txt
            exit 1
          fi
          rm -f "$cleanup_log" "$RUNNER_TEMP/pr737-uat-password"
          psql "$QA_SUPABASE_DB_URL" --no-psqlrc --tuples-only --no-align --set ON_ERROR_STOP=1 \
            --file controller/ops/pr737-ledger-uat/residue-proof.sql \
            > evidence/zero-residue.txt
          grep -Fxq 'public_compact_relations=0' evidence/zero-residue.txt
          grep -Fxq 'public_compact_functions=0' evidence/zero-residue.txt
          grep -Fxq 'private_ledger_relations=0' evidence/zero-residue.txt
          grep -Fxq 'private_ledger_functions=0' evidence/zero-residue.txt
          grep -Fxq 'fixture_users=0' evidence/zero-residue.txt
          grep -Fxq 'fixture_profiles=0' evidence/zero-residue.txt

      - name: Inspect deployment-scoped runtime logs for the exact UAT window
        id: runtime_logs
        if: always() && steps.deployment.outputs.deployment_id != '' && steps.baseline.outputs.uat_start != '' && steps.window.outputs.uat_end != ''
        shell: bash
        env:
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.deployment_id }}
          UAT_END: ${{ steps.window.outputs.uat_end }}
          UAT_START: ${{ steps.baseline.outputs.uat_start }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        working-directory: app
        run: |
          set -euo pipefail
          npx --yes "vercel@$VERCEL_LOG_CLI_VERSION" logs "$DEPLOYMENT_ID" \
            --since "$UAT_START" \
            --until "$UAT_END" \
            --limit 1000 \
            --json \
            --token "$VERCEL_TOKEN" \
            | node uat712/summarize-vercel-logs.mjs \
            > ../evidence/vercel-runtime-log-summary.json
          test "$(jq -r '.entries' ../evidence/vercel-runtime-log-summary.json)" -gt 0
          test "$(jq -r '.errors' ../evidence/vercel-runtime-log-summary.json)" = "0"
          test "$(jq -r '.warnings' ../evidence/vercel-runtime-log-summary.json)" = "0"
          test "$(jq -r '.http5xx' ../evidence/vercel-runtime-log-summary.json)" = "0"
          test "$(jq -r '.paymentSignals' ../evidence/vercel-runtime-log-summary.json)" = "0"
          test "$(jq -r '.privateLeakSignals' ../evidence/vercel-runtime-log-summary.json)" = "0"

      - name: Delete the one-use Preview and prove teardown
        id: teardown
        if: always() && steps.deployment.outputs.deployment_id != ''
        shell: bash
        env:
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.deployment_id }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { writeFile } from "node:fs/promises";
          const response = await fetch(`https://api.vercel.com/v13/deployments/${process.env.DEPLOYMENT_ID}?teamId=${process.env.VERCEL_ORG_ID}`, {
            method: "DELETE",
            headers: { Authorization: `Bearer ${process.env.VERCEL_TOKEN}` },
          });
          if (!response.ok) throw new Error(`One-use Preview deletion failed with HTTP ${response.status}.`);
          const data = await response.json();
          if ((data.uid ?? process.env.DEPLOYMENT_ID) !== process.env.DEPLOYMENT_ID) {
            throw new Error("Deleted deployment identity mismatch.");
          }
          await writeFile("evidence/deployment-teardown.json", `${JSON.stringify({
            deploymentId: process.env.DEPLOYMENT_ID,
            deleted: true,
            state: data.state ?? "DELETED",
            aliasesRetained: false,
          }, null, 2)}\n`);
          NODE
          rm -f "$RUNNER_TEMP/pr737-vercel-bypass"

      - name: Reverify PR freeze after all hosted work
        id: final_freeze
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" \
            | jq -e --arg head "$CANDIDATE_HEAD_SHA" --arg base "$CANDIDATE_BASE_SHA" '
                .state == "open"
                and .draft == true
                and .merged == false
                and .head.sha == $head
                and .base.sha == $base
                and .changed_files == 16
              ' > /dev/null
          test "$(git -C app rev-parse HEAD)" = "$CANDIDATE_HEAD_SHA"
          test "$(git -C app rev-parse HEAD^{tree})" = "$CANDIDATE_TREE_SHA"

      - name: Build final redacted evidence ledger
        id: evidence
        if: always()
        shell: bash
        env:
          CLEANUP_OUTCOME: ${{ steps.cleanup.outcome }}
          COMPLETE_BROWSER_OUTCOME: ${{ steps.complete_browser.outcome }}
          COMPLETE_FIXTURE_OUTCOME: ${{ steps.complete_fixture.outcome }}
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.deployment_id }}
          DEPLOYMENT_OUTCOME: ${{ steps.deployment.outcome }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
          FINAL_FREEZE_OUTCOME: ${{ steps.final_freeze.outcome }}
          INCOMPLETE_BROWSER_OUTCOME: ${{ steps.incomplete_browser.outcome }}
          INCOMPLETE_FIXTURE_OUTCOME: ${{ steps.incomplete_fixture.outcome }}
          NO_MONEY_OUTCOME: ${{ steps.no_money.outcome }}
          REFUND_BROWSER_OUTCOME: ${{ steps.refund_browser.outcome }}
          REFUND_FIXTURE_OUTCOME: ${{ steps.refund_fixture.outcome }}
          RUNTIME_LOG_OUTCOME: ${{ steps.runtime_logs.outcome }}
          TEARDOWN_OUTCOME: ${{ steps.teardown.outcome }}
          BASELINE_OUTCOME: ${{ steps.baseline.outcome }}
          CHARGEBACK_BROWSER_OUTCOME: ${{ steps.chargeback_browser.outcome }}
          CHARGEBACK_FIXTURE_OUTCOME: ${{ steps.chargeback_fixture.outcome }}
        run: |
          set -euo pipefail
          mkdir -p evidence app/test-results
          conclusion=uat_failed
          if [[ \
            "$DEPLOYMENT_OUTCOME" = success \
            && "$BASELINE_OUTCOME" = success \
            && "$INCOMPLETE_FIXTURE_OUTCOME" = success \
            && "$INCOMPLETE_BROWSER_OUTCOME" = success \
            && "$COMPLETE_FIXTURE_OUTCOME" = success \
            && "$COMPLETE_BROWSER_OUTCOME" = success \
            && "$REFUND_FIXTURE_OUTCOME" = success \
            && "$REFUND_BROWSER_OUTCOME" = success \
            && "$CHARGEBACK_FIXTURE_OUTCOME" = success \
            && "$CHARGEBACK_BROWSER_OUTCOME" = success \
            && "$NO_MONEY_OUTCOME" = success \
            && "$CLEANUP_OUTCOME" = success \
            && "$RUNTIME_LOG_OUTCOME" = success \
            && "$TEARDOWN_OUTCOME" = success \
            && "$FINAL_FREEZE_OUTCOME" = success \
          ]]; then
            conclusion=uat_pass
          fi

          jq -n \
            --arg conclusion "$conclusion" \
            --arg head "$CANDIDATE_HEAD_SHA" \
            --arg tree "$CANDIDATE_TREE_SHA" \
            --arg base "$CANDIDATE_BASE_SHA" \
            --arg deploymentId "$DEPLOYMENT_ID" \
            --arg deploymentUrl "$DEPLOYMENT_URL" \
            --arg runUrl "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg baseline "$BASELINE_OUTCOME" \
            --arg incomplete "$INCOMPLETE_BROWSER_OUTCOME" \
            --arg complete "$COMPLETE_BROWSER_OUTCOME" \
            --arg refund "$REFUND_BROWSER_OUTCOME" \
            --arg chargeback "$CHARGEBACK_BROWSER_OUTCOME" \
            --arg noMoney "$NO_MONEY_OUTCOME" \
            --arg cleanup "$CLEANUP_OUTCOME" \
            --arg logs "$RUNTIME_LOG_OUTCOME" \
            --arg teardown "$TEARDOWN_OUTCOME" \
            --arg freeze "$FINAL_FREEZE_OUTCOME" \
            '{
              conclusion:$conclusion,
              candidate:{head:$head,tree:$tree,base:$base,changedFiles:16},
              deployment:{id:$deploymentId,url:$deploymentUrl,target:null,aliases:[],protected:true,noindex:true,deletedAfterUse:($teardown == "success")},
              controllerRun:$runUrl,
              phaseOutcomes:{baselineUnavailable:$baseline,incomplete:$incomplete,complete:$complete,refundSupersession:$refund,chargebackSupersession:$chargeback},
              safetyOutcomes:{noMoney:$noMoney,zeroResidue:$cleanup,runtimeLogs:$logs,oneUseTeardown:$teardown,finalCandidateFreeze:$freeze},
              viewports:["1440x900","1024x768","390x844","320x568"],
              forbiddenActions:{merge:false,readyForReview:false,mainMutation:false,productionData:false,persistentProductionOrStagingMigration:false,identityProvider:false,paymentProvider:false,activation:false,electorate:false,moneyMovement:false,canonicalAlias:false,productionRelease:false}
            }' > evidence/result-summary.json

          export COMPACT_UAT_PASSWORD="$(cat "$RUNNER_TEMP/pr737-uat-password" 2>/dev/null || true)"
          export VERCEL_AUTOMATION_BYPASS_SECRET="$(cat "$RUNNER_TEMP/pr737-vercel-bypass" 2>/dev/null || true)"
          if find app/test-results -type f -name '*trace*.zip' -print -quit | grep -q .; then
            node controller/ops/pr663-uat712/redact-traces.mjs app/test-results evidence \
              > evidence/final-evidence-secret-scan.txt
          else
            ALLOW_NO_TRACE=1 node controller/ops/pr663-uat712/redact-traces.mjs app/test-results evidence \
              > evidence/final-evidence-secret-scan.txt
          fi
          if rg -l --fixed-strings "$FORBIDDEN_PROD_REF" evidence app/test-results; then
            echo 'Forbidden production project reference remained in retained evidence.' >&2
            exit 1
          fi
          find evidence app/test-results -type f ! -path 'evidence/sha256-manifest.txt' -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            > evidence/sha256-manifest.txt
          echo "conclusion=$conclusion" >> "$GITHUB_OUTPUT"

      - name: Upload redacted PR 737 hosted-UAT evidence
        id: artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr737-authoritative-ledger-isolated-qa-uat-${{ github.run_id }}-${{ env.CANDIDATE_HEAD_SHA }}
          path: |
            evidence
            app/test-results
          if-no-files-found: error
          retention-days: 30

      - name: Publish the terminal hosted-UAT result
        if: always()
        shell: bash
        env:
          ARTIFACT_DIGEST: ${{ steps.artifact.outputs.artifact-digest }}
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
          RESULT: ${{ steps.evidence.outputs.conclusion }}
        run: |
          set -euo pipefail
          result="${RESULT:-uat_failed}"
          body="$(cat <<EOF
          <!-- pr737-ledger-hosted-uat-final:$GITHUB_RUN_ID -->
          ## PR #737 protected isolated-QA hosted UAT

          - Conclusion: **$result**
          - Controller run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          - Frozen candidate: \`$CANDIDATE_HEAD_SHA\`
          - Frozen tree: \`$CANDIDATE_TREE_SHA\`
          - Exact non-hosted authorization: ledger \`$LEDGER_QA_RUN_ID\`; Compact \`$COMPACT_QA_RUN_ID\`; evidence/payment \`$PAYMENT_QA_RUN_ID\`; visual \`$VISUAL_QA_RUN_ID\`; controller \`$NONHOSTED_CONTROLLER_RUN_ID\`
          - Hosted phases: unavailable baseline, explicit incomplete coverage, complete synthetic aggregate, late partial-refund supersession, and late chargeback supersession
          - Viewports: 1440×900, 1024×768, 390×844, and 320×568
          - Preview boundary: protected, Preview target only, unaliased, noindex, QA ref only, runtime service role absent, provider credentials absent, payment modes disabled
          - Teardown: synthetic sessions/users/fixtures and Compact/ledger schema removed; one-use Preview deleted
          - Artifact: ${ARTIFACT_URL:-unavailable} (ID ${ARTIFACT_ID:-unavailable}; digest ${ARTIFACT_DIGEST:-unavailable})

          No merge, ready-for-review transition, \`main\` mutation, production/private-data access, persistent staging/production migration, production or canonical deployment, identity/payment-provider enablement, Compact/electorate activation, or money movement was authorized or performed.
          EOF
          )"
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$body"
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$body"
          test "$result" = "uat_pass"
