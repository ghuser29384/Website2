name: PR 737 authoritative-ledger protected isolated-QA UAT r3 20260824

on:
  push:
    branches:
      - ops/pr737-ledger-isolated-qa-uat-r2-20260824
    paths:
      - ".github/workflows/pr737-ledger-isolated-qa-uat-20260824.yml"
      - "ops/pr737-ledger-uat/**"

concurrency:
  group: pr737-ledger-isolated-qa-uat-r3-20260824
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  deployments: read
  issues: write
  pull-requests: write

jobs:
  hosted-ledger-uat:
    name: Exact candidate protected Preview, phased ledger UAT, and zero residue
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    env:
      GH_TOKEN: ${{ github.token }}
      CONTROLLER_BRANCH: ops/pr737-ledger-isolated-qa-uat-r2-20260824
      CANDIDATE_BRANCH: feature/compact-authoritative-outflow-ledger-v1-20260816
      CANDIDATE_BASE_SHA: f46178aaad6d2fbd911cc365e2963bb7c73a0098
      CANDIDATE_HEAD_SHA: 5a3d9fee0bbe0c092655aa88c1863b2a9cf8b5ea
      CANDIDATE_TREE_SHA: a9382bf0f20cfb1789ca991466bd27604c839a98
      PR_NUMBER: "737"
      ISSUE_NUMBER: "734"
      NONHOSTED_CONTROLLER_RUN_ID: "32776988523"
      LEDGER_QA_RUN_ID: "32747587559"
      COMPACT_QA_RUN_ID: "32777007325"
      PAYMENT_QA_RUN_ID: "32777017986"
      VISUAL_QA_RUN_ID: "32777029097"
      EXPECTED_QA_REF: hvmxfjjbdcgjjudmthdz
      FORBIDDEN_PROD_REF: jnpoxvalyjtdghnperyu
      EXPECTED_QA_POOLER_HOST: aws-0-us-west-1.pooler.supabase.com
      VERCEL_ORG_ID: team_ySu6sF3Uho1E1GnJtCQPVEuJ
      VERCEL_PROJECT_ID: prj_Em3j7Uj7RatX2R1ZYhla3XSHRde7
      VERCEL_CLI_VERSION: 50.38.1
      VERCEL_LOG_CLI_VERSION: 58.9.5
      CONDITIONAL_PAYMENTS_MODE: disabled
      TRADE_DONATION_POOL_ENABLED: "false"
      TRADE_DONATION_POOL_MODE: disabled
      DIRECT_DONATION_UPGRADES_ENABLED: "false"
      DIRECT_DONATION_UPGRADE_MODE: disabled
      MPGF_REAL_MONEY_ENABLED: "false"
      MPGF_REAL_MONEY_ACCEPTANCE_ENABLED: "false"
      MPGF_TEST_PAYMENT_ENABLED: "false"
      EVERY_ORG_PLEDGE_DONATIONS_ENABLED: "false"
      PGSSLMODE: require

    steps:
      - name: Check out the one-use controller
        uses: actions/checkout@v4
        with:
          path: controller
          fetch-depth: 0

      - name: Check out the exact PR 737 candidate
        uses: actions/checkout@v4
        with:
          path: app
          fetch-depth: 0
          ref: ${{ env.CANDIDATE_HEAD_SHA }}

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Verify exact frozen candidate and successful non-hosted authorization
        id: exact_state
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$CONTROLLER_BRANCH"
          test "$(git -C app rev-parse HEAD)" = "$CANDIDATE_HEAD_SHA"
          test "$(git -C app rev-parse HEAD^{tree})" = "$CANDIDATE_TREE_SHA"
          test "$(git -C app merge-base "$CANDIDATE_BASE_SHA" "$CANDIDATE_HEAD_SHA")" = "$CANDIDATE_BASE_SHA"
          test "$(git -C app diff --name-only "$CANDIDATE_BASE_SHA...$CANDIDATE_HEAD_SHA" | wc -l | tr -d ' ')" = "16"
          test -z "$(git -C app status --porcelain)"
          git -C app diff --check "$CANDIDATE_BASE_SHA" "$CANDIDATE_HEAD_SHA"

          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > "$RUNNER_TEMP/pr737.json"
          jq -e --arg head "$CANDIDATE_HEAD_SHA" --arg base "$CANDIDATE_BASE_SHA" '
            .state == "open"
            and .draft == true
            and .merged == false
            and .head.sha == $head
            and .base.sha == $base
            and .changed_files == 16
          ' "$RUNNER_TEMP/pr737.json" > /dev/null

          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" \
            --jq '.[].filename' | sort > "$RUNNER_TEMP/actual-files.txt"
          cat > "$RUNNER_TEMP/expected-files.txt" <<'FILES'
          .github/workflows/compact-authoritative-outflow-ledger-qa.yml
          .github/workflows/mpgf-public-goods-compacts-qa.yml
          docs/mpgf/compact-authoritative-outflow-ledger-v1.md
          scripts/test-compact-authoritative-outflow-concurrency.sh
          src/components/mpgf/mpgf-public-goods-compacts.tsx
          src/lib/mpgf/compact-authoritative-outflow-contract.test.ts
          src/lib/mpgf/compact-authoritative-outflow-phase-order-contract.test.ts
          src/lib/mpgf/compact-authoritative-outflow.test.ts
          src/lib/mpgf/compact-authoritative-outflow.ts
          supabase/migrations/20260816141500_compact_authoritative_outflow_ledger_v1.sql
          supabase/migrations/20260816141501_compact_authoritative_outflow_freeze_v1.sql
          supabase/migrations/20260816141502_compact_authoritative_outflow_hardening_v1.sql
          supabase/migrations/20260816141503_compact_authoritative_outflow_replay_fix_v1.sql
          supabase/tests/compact_authoritative_outflow_ledger_authorization.sql
          supabase/tests/compact_authoritative_outflow_ledger_core.sql
          tests/mpgf-public-goods-compacts.spec.ts
          FILES
          sort -o "$RUNNER_TEMP/expected-files.txt" "$RUNNER_TEMP/expected-files.txt"
          diff -u "$RUNNER_TEMP/expected-files.txt" "$RUNNER_TEMP/actual-files.txt"

          check_candidate_run() {
            local run_id="$1"
            local expected_name="$2"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" \
              | jq -e --arg head "$CANDIDATE_HEAD_SHA" --arg name "$expected_name" '
                  .head_sha == $head
                  and .name == $name
                  and .status == "completed"
                  and .conclusion == "success"
                ' > /dev/null
          }
          check_candidate_run "$LEDGER_QA_RUN_ID" "Compact authoritative outflow ledger QA"
          check_candidate_run "$COMPACT_QA_RUN_ID" "MPGF public-goods compacts QA"
          check_candidate_run "$PAYMENT_QA_RUN_ID" "Evidence payment release QA"
          check_candidate_run "$VISUAL_QA_RUN_ID" "Sitewide canonical visual system"

          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$NONHOSTED_CONTROLLER_RUN_ID" \
            | jq -e '
                .name == "PR 737 exact-head non-hosted controller r5"
                and .status == "completed"
                and .conclusion == "success"
              ' > /dev/null
          gh api "repos/$GITHUB_REPOSITORY/commits/$CANDIDATE_HEAD_SHA/status" \
            | jq -e --arg run "/actions/runs/$NONHOSTED_CONTROLLER_RUN_ID" '
                [.statuses[]
                  | select(
                      .context == "release-classification"
                      and .state == "success"
                      and (.target_url | contains($run))
                    )]
                | length >= 1
              ' > /dev/null

          pr_body="$(jq -r '.body' "$RUNNER_TEMP/pr737.json")"
          PR_BODY="$pr_body" node app/scripts/validate-release-pr-body.mjs

          github_deployments="$(gh api "repos/$GITHUB_REPOSITORY/deployments?sha=$CANDIDATE_HEAD_SHA&per_page=100" | jq 'length')"
          test "$github_deployments" = "0"

          mkdir -p evidence
          jq -n \
            --arg head "$CANDIDATE_HEAD_SHA" \
            --arg tree "$CANDIDATE_TREE_SHA" \
            --arg base "$CANDIDATE_BASE_SHA" \
            --arg controllerRun "$NONHOSTED_CONTROLLER_RUN_ID" \
            --arg ledgerRun "$LEDGER_QA_RUN_ID" \
            --arg compactRun "$COMPACT_QA_RUN_ID" \
            --arg paymentRun "$PAYMENT_QA_RUN_ID" \
            --arg visualRun "$VISUAL_QA_RUN_ID" \
            '{
              candidate:{head:$head,tree:$tree,base:$base,changedFiles:16,open:true,draft:true,merged:false},
              exactHeadRuns:{controller:$controllerRun,ledger:$ledgerRun,compact:$compactRun,payment:$paymentRun,visual:$visualRun,allSuccessful:true},
              releaseClassification:"success",
              githubDeploymentsBefore:0
            }' > evidence/exact-state.json

          start_body="$(cat <<EOF
          <!-- pr737-ledger-hosted-uat-start:$GITHUB_RUN_ID -->
          ## PR #737 protected isolated-QA hosted UAT started

          - Controller run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          - Frozen candidate: \`$CANDIDATE_HEAD_SHA\`
          - Frozen tree: \`$CANDIDATE_TREE_SHA\`
          - Non-hosted authorization: controller \`$NONHOSTED_CONTROLLER_RUN_ID\`; all four exact-head gates successful

          The run is fail-closed and one-use. It is not authorized to merge, mark ready, access production data, create a production or canonical deployment, persist a production/staging migration, enable a payment or identity provider, activate a Compact/electorate, or move money.
          EOF
          )"
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$start_body"

      - name: Install exact dependencies and browser/database clients
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix app ci
          sudo apt-get update -qq
          sudo apt-get install --yes postgresql-client zip unzip ripgrep > /dev/null
          cd app
          npx playwright install --with-deps chromium

      - name: Prove exact isolated-QA credentials and zero pre-existing residue
        id: qa_preflight
        shell: bash
        env:
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.QA_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: https://hvmxfjjbdcgjjudmthdz.supabase.co
          QA_SUPABASE_DB_URL: ${{ secrets.QA_SUPABASE_DB_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.QA_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          test -n "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY"
          test -n "$QA_SUPABASE_DB_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          python3 - <<'PY'
          import os
          from urllib.parse import parse_qs, urlparse

          value = os.environ["QA_SUPABASE_DB_URL"]
          if os.environ["FORBIDDEN_PROD_REF"] in value:
              raise SystemExit("Production project reference is forbidden.")
          parsed = urlparse(value)
          valid = (
              parsed.scheme in {"postgres", "postgresql"}
              and os.environ["EXPECTED_QA_REF"] in (parsed.username or "")
              and parsed.hostname == os.environ["EXPECTED_QA_POOLER_HOST"]
              and parsed.port == 5432
              and parsed.path == "/postgres"
              and parse_qs(parsed.query).get("sslmode", ["require"]) == ["require"]
              and bool(parsed.password)
          )
          if not valid:
              raise SystemExit("Refusing a database URL outside the exact TLS-only QA target.")
          PY

          tls_description="$(psql "$QA_SUPABASE_DB_URL" --no-psqlrc -X -c '\conninfo' 2>&1)"
          [[ "$tls_description" == *"SSL connection"* ]]
          unset tls_description
          sentinel_contract="$(psql "$QA_SUPABASE_DB_URL" --no-psqlrc -Atqc "
            select coalesce(
              count(*) = 1
              and bool_and(singleton)
              and bool_and(environment = 'qa')
              and bool_and(project_ref = 'hvmxfjjbdcgjjudmthdz')
              and bool_and(sentinel_id is not null)
              and bool_and(sentinel_sha256 ~ '^[a-f0-9]{64}$')
              and bool_and(provisioned_out_of_band),
              false
            )::text
            from moraltrade_qa.environment_identity
            where singleton;")"
          test "$sentinel_contract" = "true"

          psql "$QA_SUPABASE_DB_URL" --no-psqlrc --tuples-only --no-align \
            --file controller/ops/pr663-uat712/schema-absence.sql \
            > evidence/schema-absence-before.txt
          grep -Fxq 'compact_relations_before=0' evidence/schema-absence-before.txt
          grep -Fxq 'compact_functions_before=0' evidence/schema-absence-before.txt
          grep -Fxq 'eligibility_dependency_before=0' evidence/schema-absence-before.txt
          grep -Fxq 'synthetic_users_before=0' evidence/schema-absence-before.txt
          grep -Fxq 'synthetic_profiles_before=0' evidence/schema-absence-before.txt

          private_relations="$(psql "$QA_SUPABASE_DB_URL" --no-psqlrc -Atqc "
            select count(*)
            from pg_catalog.pg_class c
            join pg_catalog.pg_namespace n on n.oid=c.relnamespace
            where n.nspname='moral_trade_private'
              and c.relname like 'compact_outflow_%'
              and c.relkind in ('r','p','v','m');")"
          private_functions="$(psql "$QA_SUPABASE_DB_URL" --no-psqlrc -Atqc "
            select count(*)
            from pg_catalog.pg_proc p
            join pg_catalog.pg_namespace n on n.oid=p.pronamespace
            where n.nspname='moral_trade_private'
              and (
                p.proname like 'compact_outflow_%'
                or p.proname like 'assign_compact_outflow_%'
                or p.proname like 'reject_compact_outflow_%'
                or p.proname like 'require_compact_outflow_%'
              );")"
          test "$private_relations" = "0"
          test "$private_functions" = "0"

          cd app
          node --input-type=module <<'NODE'
          import { createClient } from "@supabase/supabase-js";
          const url = process.env.NEXT_PUBLIC_SUPABASE_URL;
          if (!url.includes(process.env.EXPECTED_QA_REF) || url.includes(process.env.FORBIDDEN_PROD_REF)) {
            throw new Error("Public QA URL guard failed.");
          }
          const settings = await fetch(`${url}/auth/v1/settings`, {
            headers: { apikey: process.env.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY },
          });
          if (!settings.ok) throw new Error("QA publishable-key contract failed.");
          const service = createClient(url, process.env.SUPABASE_SERVICE_ROLE_KEY, {
            auth: { autoRefreshToken: false, detectSessionInUrl: false, persistSession: false },
          });
          const result = await service.auth.admin.listUsers({ page: 1, perPage: 1 });
          if (result.error) throw new Error("QA service-role contract failed.");
          console.log("qa_api_credentials=passed");
          NODE
          cd ..

          jq -n --arg ref "$EXPECTED_QA_REF" '{
            qaProjectRef:$ref,
            databaseUrlExact:true,
            tlsRequired:true,
            sentinelContract:true,
            publishableKeyContract:true,
            workflowOnlyServiceRoleContract:true,
            productionProjectExcluded:true,
            compactSchemaBefore:0,
            ledgerSchemaBefore:0,
            syntheticUsersBefore:0,
            secretValuesRetained:false
          }' > evidence/qa-binding-before.json

      - name: Audit canonical Vercel project, protection, and exact-SHA inventory
        id: vercel_preflight
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          node --input-type=module <<'NODE'
          import { writeFile } from "node:fs/promises";
          const token = process.env.VERCEL_TOKEN;
          const team = process.env.VERCEL_ORG_ID;
          const projectId = process.env.VERCEL_PROJECT_ID;
          const headers = { Authorization: `Bearer ${token}` };
          const projectResponse = await fetch(`https://api.vercel.com/v9/projects/${projectId}?teamId=${team}`, { headers });
          if (!projectResponse.ok) throw new Error("Canonical Vercel project lookup failed.");
          const project = await projectResponse.json();
          if (project.id !== projectId || project.accountId !== team) {
            throw new Error("Vercel project/team identity drifted.");
          }
          const environmentResponse = await fetch(`https://api.vercel.com/v9/projects/${projectId}/env?teamId=${team}`, { headers });
          if (!environmentResponse.ok) throw new Error("Vercel Preview environment audit failed.");
          const environment = await environmentResponse.json();
          const previewKeys = (environment.envs ?? [])
            .filter((entry) => !entry.target || entry.target.includes("preview"))
            .map((entry) => String(entry.key));
          const allowedModes = new Set([
            "CONDITIONAL_PAYMENTS_MODE",
            "TRADE_DONATION_POOL_ENABLED",
            "TRADE_DONATION_POOL_MODE",
            "DIRECT_DONATION_UPGRADES_ENABLED",
            "DIRECT_DONATION_UPGRADE_MODE",
            "MPGF_REAL_MONEY_ENABLED",
            "MPGF_REAL_MONEY_ACCEPTANCE_ENABLED",
            "MPGF_TEST_PAYMENT_ENABLED",
            "EVERY_ORG_PLEDGE_DONATIONS_ENABLED",
          ]);
          const blankedKeys = new Set([
            "SUPABASE_SERVICE_ROLE_KEY",
            "NEXT_PUBLIC_SUPABASE_ANON_KEY",
            "SUPABASE_ANON_KEY",
            "SUPABASE_URL",
            "SUPABASE_PROJECT_REF",
            "SUPABASE_DB_URL",
            "DATABASE_URL",
            "POSTGRES_URL",
            "POSTGRES_PRISMA_URL",
            "POSTGRES_URL_NON_POOLING",
            "STRIPE_PLATFORM_ACCOUNT_ID",
            "STRIPE_SECRET_KEY",
            "STRIPE_WEBHOOK_SECRET",
          ]);
          const qaOverrides = new Set([
            "NEXT_PUBLIC_SUPABASE_URL",
            "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY",
          ]);
          const providerCredential = /(STRIPE|EVERY_?ORG|PAYMENT|CUSTODY|SETTLEMENT|RESERVE|PAYOUT|PAYPAL|BRAINTREE|ADYEN|SQUARE).*(SECRET|KEY|TOKEN|ACCOUNT|CREDENTIAL|URL|ID)$/i;
          const dataCredential = /(SUPABASE|DATABASE|POSTGRES)/i;
          const unexpectedProvider = previewKeys.filter(
            (key) => providerCredential.test(key) && !allowedModes.has(key) && !blankedKeys.has(key),
          );
          const unexpectedData = previewKeys.filter(
            (key) => dataCredential.test(key) && !blankedKeys.has(key) && !qaOverrides.has(key),
          );
          if (unexpectedProvider.length || unexpectedData.length) {
            throw new Error("Preview environment contains an unhandled provider or database credential name.");
          }
          const bypass = Object.entries(project.protectionBypass ?? {}).find(
            ([, value]) => value?.scope === "automation-bypass",
          );
          if (!bypass) throw new Error("Protected automation boundary is unavailable.");

          const deploymentsResponse = await fetch(`https://api.vercel.com/v6/deployments?projectId=${projectId}&teamId=${team}&limit=100`, { headers });
          if (!deploymentsResponse.ok) throw new Error("Vercel deployment preflight failed.");
          const deployments = await deploymentsResponse.json();
          const exact = (deployments.deployments ?? []).filter(
            (deployment) =>
              (deployment.meta?.githubCommitSha ?? deployment.gitSource?.sha ?? "") ===
              process.env.CANDIDATE_HEAD_SHA,
          );
          if (exact.length !== 0) {
            throw new Error("An exact-candidate Vercel deployment already exists; refusing duplicate hosted UAT.");
          }

          await writeFile("evidence/vercel-preflight.json", `${JSON.stringify({
            projectId,
            teamId: team,
            exactCandidateDeploymentsBefore: 0,
            deploymentProtectionAvailable: true,
            previewEnvironmentKeyCount: previewKeys.length,
            paymentModesForcedDisabled: [...allowedModes].sort(),
            inheritedCredentialKeysBlanked: [...blankedKeys].sort(),
            qaKeysOverridden: [...qaOverrides].sort(),
            unexpectedProviderCredentialKeys: [],
            unexpectedDatabaseCredentialKeys: [],
            secretValuesRetained: false,
          }, null, 2)}\n`);
          NODE

      - name: Re-run focused exact-candidate source contracts
        shell: bash
        working-directory: app
        run: |
          set -euo pipefail
          node --import tsx --test \
            src/lib/mpgf/compact-authoritative-outflow.test.ts \
            src/lib/mpgf/compact-authoritative-outflow-contract.test.ts \
            src/lib/mpgf/compact-authoritative-outflow-phase-order-contract.test.ts \
            | tee ../evidence/focused-ledger-tests.log
          npx eslint \
            src/components/mpgf/mpgf-public-goods-compacts.tsx \
            src/lib/mpgf/compact-authoritative-outflow.ts \
            src/lib/mpgf/compact-authoritative-outflow.test.ts \
            src/lib/mpgf/compact-authoritative-outflow-contract.test.ts \
            src/lib/mpgf/compact-authoritative-outflow-phase-order-contract.test.ts \
            tests/mpgf-public-goods-compacts.spec.ts \
            | tee ../evidence/focused-ledger-eslint.log
          npx tsc --noEmit | tee ../evidence/exact-candidate-typescript.log
          git diff --check "$CANDIDATE_BASE_SHA" "$CANDIDATE_HEAD_SHA"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_HEAD_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$CANDIDATE_TREE_SHA"
          test -z "$(git status --porcelain)"

      - name: Build the exact candidate with public QA and disabled-payment configuration only
        id: build
        shell: bash
        env:
          NEXT_PUBLIC_SITE_URL: https://preview.invalid
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.QA_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: https://hvmxfjjbdcgjjudmthdz.supabase.co
          SITE_URL: https://preview.invalid
          VERCEL_GIT_COMMIT_REF: feature/compact-authoritative-outflow-ledger-v1-20260816
          VERCEL_GIT_COMMIT_SHA: ${{ env.CANDIDATE_HEAD_SHA }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        working-directory: app
        run: |
          set -euo pipefail
          mkdir -p .vercel
          node --input-type=module <<'NODE'
          import { writeFile } from "node:fs/promises";
          const response = await fetch(`https://api.vercel.com/v9/projects/${process.env.VERCEL_PROJECT_ID}?teamId=${process.env.VERCEL_ORG_ID}`, {
            headers: { Authorization: `Bearer ${process.env.VERCEL_TOKEN}` },
          });
          if (!response.ok) throw new Error("Canonical Vercel project settings lookup failed.");
          const project = await response.json();
          if (project.id !== process.env.VERCEL_PROJECT_ID || project.accountId !== process.env.VERCEL_ORG_ID) {
            throw new Error("Canonical Vercel project settings identity drifted.");
          }
          const settings = {
            createdAt: project.createdAt,
            framework: project.framework,
            devCommand: project.devCommand,
            installCommand: project.installCommand,
            buildCommand: project.buildCommand,
            outputDirectory: project.outputDirectory,
            rootDirectory: project.rootDirectory,
            directoryListing: project.directoryListing,
            nodeVersion: project.nodeVersion,
          };
          await writeFile(".vercel/project.json", `${JSON.stringify({
            orgId: process.env.VERCEL_ORG_ID,
            projectId: process.env.VERCEL_PROJECT_ID,
            projectName: project.name,
            settings,
          }, null, 2)}\n`);
          const forbidden = Object.keys(process.env).filter((key) =>
            /^(?:SUPABASE_SERVICE_ROLE_KEY|QA_SUPABASE_DB_URL|DATABASE_URL|POSTGRES_URL|STRIPE_SECRET_KEY|STRIPE_WEBHOOK_SECRET)$/i.test(key),
          );
          if (forbidden.length) throw new Error("Build process unexpectedly received a private database or provider credential.");
          NODE
          test -z "$(find .vercel -maxdepth 1 -type f -name '.env*' -print -quit)"
          rm -rf .next .vercel/output
          npx --yes "vercel@$VERCEL_CLI_VERSION" build --yes --token="$VERCEL_TOKEN" \
            | tee ../evidence/vercel-build.log
          node ../controller/ops/pr737-ledger-uat/inject-runtime-attestation.mjs
          STATIC_SOURCE_DIR=public \
          STATIC_BUILD_DIR=.vercel/output/static \
          STATIC_EVIDENCE_DIR=../evidence \
          STATIC_CRITICAL_ASSET=moral-trade-live-create-router.js \
            node scripts/vercel-static-artifact-integrity.mjs \
            | tee ../evidence/static-artifact-integrity.log
          test "$(git rev-parse HEAD)" = "$CANDIDATE_HEAD_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$CANDIDATE_TREE_SHA"
          test -z "$(git status --porcelain)"

      - name: Revalidate frozen PR immediately before deployment
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" \
            | jq -e --arg head "$CANDIDATE_HEAD_SHA" '
                .state == "open"
