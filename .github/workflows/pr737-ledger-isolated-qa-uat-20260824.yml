      - name: Prove Preview identity, protection, noindex, QA binding, and provider absence
        id: deployment
        shell: bash
        env:
          COMPACT_UAT_BASE_URL: ${{ steps.deploy.outputs.deployment_url }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.QA_SUPABASE_PUBLISHABLE_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          deployment_id="$(node --input-type=module <<'NODE'
          const hostname = new URL(process.env.COMPACT_UAT_BASE_URL).hostname;
          const response = await fetch(`https://api.vercel.com/v13/deployments/${encodeURIComponent(hostname)}?teamId=${process.env.VERCEL_ORG_ID}`, {
            headers: { Authorization: `Bearer ${process.env.VERCEL_TOKEN}` },
          });
          if (!response.ok) throw new Error("Deployment lookup failed.");
          const data = await response.json();
          const deploymentId = data.id ?? data.uid;
          if (!deploymentId || `https://${data.url}` !== process.env.COMPACT_UAT_BASE_URL) {
            throw new Error("Exact deployment ID/URL was not found.");
          }
          process.stdout.write(deploymentId);
          NODE
          )"
          [[ "$deployment_id" =~ ^dpl_[A-Za-z0-9]+$ ]]
          echo "deployment_id=$deployment_id" >> "$GITHUB_OUTPUT"

          bypass="$(node --input-type=module <<'NODE'
          const response = await fetch(`https://api.vercel.com/v9/projects/${process.env.VERCEL_PROJECT_ID}?teamId=${process.env.VERCEL_ORG_ID}`, {
            headers: { Authorization: `Bearer ${process.env.VERCEL_TOKEN}` },
          });
          if (!response.ok) throw new Error("Automation boundary lookup failed.");
          const project = await response.json();
          const entry = Object.entries(project.protectionBypass ?? {}).find(
            ([, value]) => value?.scope === "automation-bypass",
          );
          if (!entry) throw new Error("Automation boundary is absent.");
          process.stdout.write(entry[0]);
          NODE
          )"
          test -n "$bypass"
          echo "::add-mask::$bypass"
          printf '%s' "$bypass" > "$RUNNER_TEMP/pr737-vercel-bypass"
          chmod 600 "$RUNNER_TEMP/pr737-vercel-bypass"

          unauth_status="$(curl -sS -o /dev/null -w '%{http_code}' --max-redirs 0 "$COMPACT_UAT_BASE_URL/")"
          case "$unauth_status" in
            302|303|307|308|401|403) ;;
            *) echo "Protected Preview unexpectedly returned HTTP $unauth_status without authorization." >&2; exit 1 ;;
          esac

          node --input-type=module - "$deployment_id" <<'NODE'
          import { writeFile } from "node:fs/promises";
          const deploymentId = process.argv[2];
          const response = await fetch(`https://api.vercel.com/v13/deployments/${deploymentId}?teamId=${process.env.VERCEL_ORG_ID}`, {
            headers: { Authorization: `Bearer ${process.env.VERCEL_TOKEN}` },
          });
          if (!response.ok) throw new Error("Exact deployment metadata lookup failed.");
          const data = await response.json();
          const aliases = data.alias ?? data.aliases ?? [];
          const sha = data.meta?.githubCommitSha ?? data.gitSource?.sha ?? "";
          if (data.id !== deploymentId || data.projectId !== process.env.VERCEL_PROJECT_ID) {
            throw new Error("Wrong Vercel deployment/project.");
          }
          if (data.readyState !== "READY" || data.target !== null || aliases.length !== 0) {
            throw new Error("Deployment is not READY, Preview-only, and unaliased.");
          }
          if (sha !== process.env.CANDIDATE_HEAD_SHA) throw new Error("Deployment SHA mismatch.");
          if (data.meta?.uatIssue !== process.env.ISSUE_NUMBER || data.meta?.pullRequest !== process.env.PR_NUMBER) {
            throw new Error("Deployment ownership metadata mismatch.");
          }
          if (aliases.some((value) => /(^|\.)moraltrade\.org$/i.test(value))) {
            throw new Error("Production alias is forbidden.");
          }
          await writeFile("evidence/deployment-metadata.json", `${JSON.stringify({
            id: data.id,
            url: process.env.COMPACT_UAT_BASE_URL,
            projectId: data.projectId,
            readyState: data.readyState,
            target: data.target,
            aliases,
            candidateSha: sha,
            candidateTree: process.env.CANDIDATE_TREE_SHA,
            protected: true,
            runtimeAttestation: "/api/pr737/runtime-attestation",
            applicationSourceTreeUnchanged: true,
          }, null, 2)}\n`);
          NODE

          cookie_jar="$RUNNER_TEMP/pr737-vercel-bypass.cookies"
          attestation_headers="$RUNNER_TEMP/pr737-attestation-headers"
          attestation_body="$RUNNER_TEMP/pr737-attestation-body"
          attestation_meta="$(curl -sS \
            --location \
            --max-redirs 5 \
            --cookie-jar "$cookie_jar" \
            --cookie "$cookie_jar" \
            -D "$attestation_headers" \
            -o "$attestation_body" \
            -w '%{http_code}\n%{url_effective}\n%{content_type}' \
            -H "x-vercel-protection-bypass: $bypass" \
            -H "x-vercel-set-bypass-cookie: true" \
            "$COMPACT_UAT_BASE_URL/api/pr737/runtime-attestation")"
          mapfile -t attestation_fields <<< "$attestation_meta"
          attestation_status="${attestation_fields[0]:-}"
          attestation_url="${attestation_fields[1]:-}"
          attestation_type="${attestation_fields[2]:-}"

          if [[ "$attestation_status" != "200" ]] \
            || [[ "${attestation_type,,}" != application/json* ]] \
            || ! jq -e --arg ref "$EXPECTED_QA_REF" '
                 .schemaVersion == 1
                 and .scope == "pr737-ledger-controller-only-protected-preview"
                 and .ok == true
                 and .runtimeEnvironment == "preview"
                 and .qaProjectRef == $ref
                 and .qaPublicUrlExact == true
                 and .qaPublishableKeyConfigured == true
                 and .serviceRoleAbsent == true
                 and .qaApiRead == true
                 and .paymentModesDisabled == true
                 and .productionProjectPresent == false
                 and (.nonemptyProviderCredentialKeys | length) == 0
                 and .secretValuesReturned == false
               ' "$attestation_body" > /dev/null; then
            body_sha256="$(sha256sum "$attestation_body" | awk '{print $1}')"
            body_bytes="$(wc -c < "$attestation_body" | tr -d ' ')"
            safe_effective_url="$(python3 - "$attestation_url" <<'PYURL'
          import sys
          from urllib.parse import urlparse
          value = urlparse(sys.argv[1])
          print(f'{value.scheme}://{value.hostname or "unknown"}{value.path}')
          PYURL
          )"
            jq -n \
              --arg status "$attestation_status" \
              --arg contentType "$attestation_type" \
              --arg effectiveUrl "$safe_effective_url" \
              --arg bodySha256 "$body_sha256" \
              --argjson bodyBytes "$body_bytes" \
              '{
                ok:false,
                status:$status,
                contentType:$contentType,
                effectiveUrl:$effectiveUrl,
                bodySha256:$bodySha256,
                bodyBytes:$bodyBytes,
                bodyRetained:false,
                secretsRetained:false
              }' > evidence/runtime-attestation-failure.json
            cat evidence/runtime-attestation-failure.json >&2
            exit 1
          fi
          jq '.' "$attestation_body" > evidence/runtime-attestation.json

          headers_file="$RUNNER_TEMP/pr737-page-headers"
          body_file="$RUNNER_TEMP/pr737-page-body"
          page_meta="$(curl -sS \
            --location \
            --max-redirs 5 \
            --cookie-jar "$cookie_jar" \
            --cookie "$cookie_jar" \
            -D "$headers_file" \
            -o "$body_file" \
            -w '%{http_code}\n%{url_effective}\n%{content_type}' \
            -H "x-vercel-protection-bypass: $bypass" \
            -H "x-vercel-set-bypass-cookie: true" \
            "$COMPACT_UAT_BASE_URL/mpgf/compacts")"
          mapfile -t page_fields <<< "$page_meta"
          status="${page_fields[0]:-}"
          page_url="${page_fields[1]:-}"
          page_type="${page_fields[2]:-}"
          test "$status" = "200"
          test "$(python3 - "$COMPACT_UAT_BASE_URL" "$page_url" <<'PYURL'
          import sys
          from urllib.parse import urlparse
          print(str(urlparse(sys.argv[1]).hostname == urlparse(sys.argv[2]).hostname).lower())
          PYURL
          )" = "true"
          [[ "${page_type,,}" == text/html* ]]
          grep -Fq 'Prior-month transaction coverage' "$body_file"
          grep -Fq 'Shadow calculated 10% amount' "$body_file"
          if grep -Fq "$FORBIDDEN_PROD_REF" "$body_file"; then
            echo 'Protected page retained the forbidden production project reference.' >&2
            exit 1
          fi
          robots_header="$(awk 'BEGIN{IGNORECASE=1} /^x-robots-tag:/ {sub(/^[^:]+:[[:space:]]*/, ""); gsub(/\r/, ""); print; exit}' "$headers_file")"
          if [[ "${robots_header,,}" != *noindex* ]] \
            && ! grep -Eiq '<meta[^>]+name=["'"']robots["'"'][^>]+content=["'"'][^"'"']*noindex' "$body_file"; then
            echo 'Preview noindex protection was not proved.' >&2
            exit 1
          fi
          jq -n \
            --argjson unauth "$unauth_status" \
            --arg robots "${robots_header:-meta-robots-noindex}" \
            '{
              protectedUnauthenticatedStatus:$unauth,
              redirectsFollowed:true,
              bypassCookiePersisted:true,
              noindex:true,
              noindexEvidence:$robots,
              rawHeadersRetained:false,
              rawBodiesRetained:false
            }' > evidence/protection-and-noindex.json
          rm -f \
            "$cookie_jar" \
            "$attestation_headers" \
            "$attestation_body" \
            "$headers_file" \
            "$body_file"

      - name: Apply reviewed Compact and ledger migrations and create synthetic identities
        id: fixtures
        shell: bash
        env:
          COMPACT_UAT_PASSWORD: placeholder-will-be-replaced
          QA_SUPABASE_DB_URL: ${{ secrets.QA_SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          echo "cleanup_authorized=true" >> "$GITHUB_OUTPUT"
          test "$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.head.sha')" = "$CANDIDATE_HEAD_SHA"

          psql "$QA_SUPABASE_DB_URL" --no-psqlrc --tuples-only --no-align --set ON_ERROR_STOP=1 \
            --file controller/ops/pr663-uat712/schema-absence.sql \
            > "$RUNNER_TEMP/schema-absence-immediate.txt"
          grep -Fxq 'compact_relations_before=0' "$RUNNER_TEMP/schema-absence-immediate.txt"
          grep -Fxq 'compact_functions_before=0' "$RUNNER_TEMP/schema-absence-immediate.txt"
          grep -Fxq 'eligibility_dependency_before=0' "$RUNNER_TEMP/schema-absence-immediate.txt"
          grep -Fxq 'synthetic_users_before=0' "$RUNNER_TEMP/schema-absence-immediate.txt"
          grep -Fxq 'synthetic_profiles_before=0' "$RUNNER_TEMP/schema-absence-immediate.txt"

          sources=(
            controller/ops/pr663-uat712/eligibility-dependency.sql
            app/supabase/migrations/20260813163052_mpgf_public_goods_compacts.sql
            app/supabase/migrations/20260814031500_mpgf_public_goods_compacts_state_hardening.sql
            app/supabase/migrations/20260816141500_compact_authoritative_outflow_ledger_v1.sql
            app/supabase/migrations/20260816141501_compact_authoritative_outflow_freeze_v1.sql
            app/supabase/migrations/20260816141502_compact_authoritative_outflow_hardening_v1.sql
            app/supabase/migrations/20260816141503_compact_authoritative_outflow_replay_fix_v1.sql
            controller/ops/pr663-uat712/fixture.sql
            controller/ops/pr737-ledger-uat/incomplete-coverage-fixture.sql
            controller/ops/pr737-ledger-uat/complete-coverage-fixture.sql
            controller/ops/pr737-ledger-uat/refund-supersession-fixture.sql
            controller/ops/pr737-ledger-uat/chargeback-supersession-fixture.sql
          )
          sha256sum "${sources[@]}" > evidence/reviewed-hosted-database-sources.sha256

          for source in "${sources[@]:0:7}"; do
            log="$RUNNER_TEMP/$(basename "$source").log"
            if ! psql "$QA_SUPABASE_DB_URL" --no-psqlrc --set ON_ERROR_STOP=1 --file "$source" > "$log" 2>&1; then
              sed -E \
                -e 's#postgres(ql)?://[^[:space:]]+#postgresql://[REDACTED]#g' \
                -e 's/[A-Za-z0-9_=-]{40,}/[REDACTED]/g' \
                "$log" > evidence/database-setup-failure.txt
              cat evidence/database-setup-failure.txt
              exit 1
            fi
            rm -f "$log"
          done

          relation_count="$(psql "$QA_SUPABASE_DB_URL" --no-psqlrc -Atqc "
            select count(*) from pg_class c join pg_namespace n on n.oid=c.relnamespace
            where n.nspname='public' and c.relkind in ('r','p')
              and c.relname like 'mpgf_public_goods_%';")"
          private_relation_count="$(psql "$QA_SUPABASE_DB_URL" --no-psqlrc -Atqc "
            select count(*) from pg_class c join pg_namespace n on n.oid=c.relnamespace
            where n.nspname='moral_trade_private' and c.relkind in ('r','p')
              and c.relname like 'compact_outflow_%';")"
          test "$relation_count" = "18"
          test "$private_relation_count" = "6"
          test "$(psql "$QA_SUPABASE_DB_URL" --no-psqlrc -Atqc "select count(*) from public.mpgf_public_goods_compacts;")" = "3"
          test "$(psql "$QA_SUPABASE_DB_URL" --no-psqlrc -Atqc "select count(*) from public.mpgf_public_goods_compacts where status='active' or activation_execution_enabled or activated_at is not null;")" = "0"

          qa_password="$(openssl rand -hex 32)"
          echo "::add-mask::$qa_password"
          printf '%s' "$qa_password" > "$RUNNER_TEMP/pr737-uat-password"
          chmod 600 "$RUNNER_TEMP/pr737-uat-password"
          export COMPACT_UAT_PASSWORD="$qa_password"
          fixture_log="$RUNNER_TEMP/pr737-fixture.log"
          if ! psql "$QA_SUPABASE_DB_URL" --no-psqlrc --set ON_ERROR_STOP=1 \
            --file controller/ops/pr663-uat712/fixture.sql > "$fixture_log" 2>&1; then
            sed -E \
              -e 's#postgres(ql)?://[^[:space:]]+#postgresql://[REDACTED]#g' \
              -e 's/[A-Za-z0-9_=-]{40,}/[REDACTED]/g' \
              "$fixture_log" > evidence/fixture-failure.txt
            cat evidence/fixture-failure.txt
            exit 1
          fi
          rm -f "$fixture_log"

          printf 'public_compact_relations=18\nprivate_ledger_relations=6\nfounding_charters=3\nsynthetic_users=3\nactive_compacts=0\n' \
            > evidence/fixture-summary.txt

