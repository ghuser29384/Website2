name: Harden blind-audit scope guard

on:
  push:
    branches:
      - feature/evidence-credibility-blind-audit-v1-20260812
    paths:
      - .github/workflows/harden-blind-audit-scope-guard.yml

permissions:
  contents: write

concurrency:
  group: harden-blind-audit-scope-guard-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Make negative guards explicit and runtime-scoped
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path(".github/workflows/evidence-credibility-blind-audit-qa.yml")
          source = path.read_text(encoding="utf-8")

          production_pattern = re.compile(
              r'''          ! grep -R "jnpoxvalyjtdghnperyu" \\
(?:.*\n)*?            supabase/tests/evidence_credibility_blind_audit_\*\.sql\n'''
          )
          production_replacement = '''          if grep -R "jnpoxvalyjtdghnperyu" \\
            docs/moral-trade/evidence-credibility-blind-audit-v1.md \\
            src/app/admin/evidence-calibration/audits/page.tsx \\
            src/app/api/review/evidence-calibration/file/route.ts \\
            src/app/evidence-credibility-audit-actions.ts \\
            src/app/review/evidence-calibration/page.tsx \\
            supabase/migrations/20260812022000_evidence_credibility_blind_audit_v1.sql \\
            supabase/tests/evidence_credibility_blind_audit_*.sql; then
            echo "Production project reference found in a runtime or durable policy file."
            exit 1
          fi
'''
          source, count = production_pattern.subn(
              production_replacement,
              source,
              count=1,
          )
          if count != 1:
              raise SystemExit("Expected one production-reference guard block.")

          effect_pattern = re.compile(
              r'''          ! grep -Eqi \\
            "update\[\[:space:\]\]\+public\\\.credibility_shadow_controls\|insert\[\[:space:\]\]\+into\[\[:space:\]\]\+public\\\.credibility_events\|insert\[\[:space:\]\]\+into\[\[:space:\]\]\+public\\\.credibility_restrictions" \\
            supabase/migrations/20260812022000_evidence_credibility_blind_audit_v1\.sql\n'''
          )
          effect_replacement = '''          if grep -Eqi \\
            "update[[:space:]]+public\\.credibility_shadow_controls|insert[[:space:]]+into[[:space:]]+public\\.credibility_events|insert[[:space:]]+into[[:space:]]+public\\.credibility_restrictions" \\
            supabase/migrations/20260812022000_evidence_credibility_blind_audit_v1.sql; then
            echo "The blind-audit migration contains an active-effect write."
            exit 1
          fi
'''
          source, count = effect_pattern.subn(effect_replacement, source, count=1)
          if count != 1:
              raise SystemExit("Expected one active-effect negative guard block.")

          path.write_text(source, encoding="utf-8")
          PY
          git diff --check
          grep -q "Production project reference found in a runtime or durable policy file" \
            .github/workflows/evidence-credibility-blind-audit-qa.yml
          grep -q "The blind-audit migration contains an active-effect write" \
            .github/workflows/evidence-credibility-blind-audit-qa.yml

      - name: Commit durable guard and remove controller
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/evidence-credibility-blind-audit-qa.yml
          git rm .github/workflows/harden-blind-audit-scope-guard.yml
          git commit -m "ci: make blind-audit negative guards fail closed"
          git push origin "HEAD:${GITHUB_REF_NAME}"
