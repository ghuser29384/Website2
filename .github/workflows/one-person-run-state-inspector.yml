name: One-person run-state inspector

on:
  issue_comment:
    types: [created]

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  inspect:
    if: >-
      github.repository == 'ghuser29384/Website2' &&
      github.event.issue.pull_request != null &&
      github.event.issue.number == 379 &&
      github.event.comment.body == '/inspect-one-person-run-state-20260801'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect run and workflow queue
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          run_id=30684423148
          workflow_id=324883174
          {
            echo 'Target run:'
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" \
              --jq '{id,name,event,status,conclusion,head_branch,head_sha,run_number,run_attempt,created_at,updated_at,run_started_at,path,display_title,actor:.actor.login,triggering_actor:.triggering_actor.login}'
            echo
            echo 'Recent runs for this workflow:'
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow_id/runs?per_page=20" \
              --jq '.workflow_runs[] | [.id,.run_number,.run_attempt,.event,.status,(.conclusion // "pending"),.head_branch,.head_sha,.created_at,.updated_at] | @tsv'
            echo
            echo 'Queued repository runs:'
            gh api "repos/$GITHUB_REPOSITORY/actions/runs?status=queued&per_page=50" \
              --jq '.workflow_runs[] | [.id,.name,.event,.head_branch,.head_sha,.created_at] | @tsv'
          } > /tmp/run-state.txt
          body=$'One-person workflow run-state inspection:\n\n```text\n'"$(head -c 14000 /tmp/run-state.txt)"$'\n```'
          gh pr comment 379 --repo "$GITHUB_REPOSITORY" --body "$body"
      - name: Remove temporary inspector
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          path='.github/workflows/one-person-run-state-inspector.yml'
          sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/$path?ref=main" --jq .sha 2>/dev/null || true)"
          if [[ -n "$sha" ]]; then
            jq -n --arg message 'Remove temporary one-person run-state inspector' --arg sha "$sha" --arg branch main '{message:$message,sha:$sha,branch:$branch}' \
              | gh api --method DELETE "repos/$GITHUB_REPOSITORY/contents/$path" --input - >/dev/null
          fi
