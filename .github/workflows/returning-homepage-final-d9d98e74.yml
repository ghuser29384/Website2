name: Returning homepage final exact gates d9d98e74

on:
  pull_request:
    paths:
      - ".github/workflows/returning-homepage-final-d9d98e74.yml"

permissions:
  actions: read
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: returning-homepage-final-exact-gates-d9d98e74
  cancel-in-progress: true

env:
  BASE_SHA: 3f158e8ba38a197327e95d1dec660ee8582a9a12
  CANDIDATE_SHA: d9d98e749b008ca591db990107431185a3feec09
  PRODUCT_PR: "564"
  CONTROLLER_BRANCH: qa/returning-homepage-final-d9d98e74
  CONTROLLER_PATH: .github/workflows/returning-homepage-final-d9d98e74.yml
  STATUS_CONTEXT: QA / Returning homepage final exact gates d9d98e74
  EVIDENCE_DIR: returning-homepage-final-evidence-d9d98e74
  NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3210
  SITE_URL: http://127.0.0.1:3210
  PLAYWRIGHT_HTML_OPEN: never

jobs:
  exact-gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Mark immutable candidate pending
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${CANDIDATE_SHA}" \
            -f state=pending \
            -f context="$STATUS_CONTEXT" \
            -f description="Running final returning-homepage and current-main differential gates" \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Guard controller, product PR, immutable base, and exact scopes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'ghuser29384/Website2'
          test '${{ github.event.pull_request.head.ref }}' = "$CONTROLLER_BRANCH"
          test '${{ github.event.pull_request.base.ref }}' = 'main'
          test '${{ github.event.pull_request.base.sha }}' = "$BASE_SHA"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)" = "$BASE_SHA"

          controller_files="$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/pulls/${{ github.event.pull_request.number }}/files?per_page=100" \
            --jq '.[].filename' | sort)"
          test "$controller_files" = "$CONTROLLER_PATH"

          product_pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PRODUCT_PR}")"
          test "$(jq -r .state <<<"$product_pr")" = 'open'
          test "$(jq -r .head.sha <<<"$product_pr")" = "$CANDIDATE_SHA"
          test "$(jq -r .base.ref <<<"$product_pr")" = 'main'
          test "$(jq -r .base.sha <<<"$product_pr")" = "$BASE_SHA"

          product_files="$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/pulls/${PRODUCT_PR}/files?per_page=100" \
            --jq '.[].filename' | sort)"
          test "$product_files" = $'tests/returning-homepage-timezone.spec.ts\ntests/returning-homepage.spec.ts'

      - name: Check out immutable product candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 1

      - name: Prove candidate identity and exact two-file differential
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git fetch --depth=1 origin "$BASE_SHA"
          test "$(git diff --name-only "$BASE_SHA" "$CANDIDATE_SHA")" = $'tests/returning-homepage-timezone.spec.ts\ntests/returning-homepage.spec.ts'
          git diff --check "$BASE_SHA" "$CANDIDATE_SHA"
          mkdir -p "$EVIDENCE_DIR"
          git diff --stat "$BASE_SHA" "$CANDIDATE_SHA" > "$EVIDENCE_DIR/diff-stat.txt"
          printf '%s\n' "$BASE_SHA" > "$EVIDENCE_DIR/base-sha.txt"
          printf '%s\n' "$CANDIDATE_SHA" > "$EVIDENCE_DIR/candidate-sha.txt"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        shell: bash
        run: |
          set -o pipefail
          npm ci 2>&1 | tee "$EVIDENCE_DIR/npm-ci.log"

      - name: Run source, lint, type, and production-build gates
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee "$EVIDENCE_DIR/source-tests.log"
          npm run lint -- --quiet 2>&1 | tee "$EVIDENCE_DIR/eslint.log"
          npx tsc --noEmit 2>&1 | tee "$EVIDENCE_DIR/typescript.log"
          npm run build 2>&1 | tee "$EVIDENCE_DIR/build.log"

      - name: Install Chromium
        shell: bash
        run: |
          set -o pipefail
          npx playwright install --with-deps chromium \
            2>&1 | tee "$EVIDENCE_DIR/playwright-install.log"

      - name: Repeat focused returning-homepage contract
        shell: bash
        run: |
          set -o pipefail
          rm -rf .next
          npx playwright test \
            tests/returning-homepage.spec.ts \
            tests/returning-homepage-timezone.spec.ts \
            --workers=1 --repeat-each=5 --reporter=line \
            2>&1 | tee "$EVIDENCE_DIR/focused-returning-homepage.log"

      - name: Write robust Playwright report tools
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/extract-playwright-json.mjs <<'NODE'
          import fs from 'node:fs';

          const [rawPath, jsonPath, prefixPath] = process.argv.slice(2);
          const raw = fs.readFileSync(rawPath, 'utf8');
          const offsets = [0];

          for (let lineStart = 0; lineStart < raw.length; ) {
            let cursor = lineStart;
            while (cursor < raw.length && /[ \t\r]/.test(raw[cursor])) cursor += 1;
            if (raw[cursor] === '{') offsets.push(cursor);
            const newline = raw.indexOf('\n', lineStart);
            if (newline === -1) break;
            lineStart = newline + 1;
          }

          let report = null;
          let reportOffset = -1;
          for (const offset of [...new Set(offsets)]) {
            try {
              const parsed = JSON.parse(raw.slice(offset));
              if (parsed && typeof parsed === 'object' && Array.isArray(parsed.suites)) {
                report = parsed;
                reportOffset = offset;
                break;
              }
            } catch {}
          }

          if (!report) throw new Error(`No Playwright JSON report found in ${rawPath}`);
          fs.writeFileSync(jsonPath, `${JSON.stringify(report, null, 2)}\n`);
          fs.writeFileSync(prefixPath, raw.slice(0, reportOffset));
          NODE

          cat > /tmp/normalize-playwright.mjs <<'NODE'
          import fs from 'node:fs';

          const [reportPath, outputPrefix, exitStatusPath] = process.argv.slice(2);
          const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
          const failures = [];

          function errorsFor(test) {
            return (test?.results ?? [])
              .filter((result) => !['passed', 'skipped'].includes(result.status))
              .flatMap((result) => result.errors ?? [])
              .map((error) =>
                String(error?.message ?? error?.stack ?? error ?? '').trim().slice(0, 8000),
              )
              .filter(Boolean);
          }

          function visit(suite, ancestors = []) {
            const next = suite?.title ? [...ancestors, suite.title] : ancestors;
            for (const spec of suite?.specs ?? []) {
              const failed = (spec.tests ?? []).filter((test) =>
                (test.results ?? []).some(
                  (result) => !['passed', 'skipped'].includes(result.status),
                ),
              );
              if (spec.ok === false || failed.length > 0) {
                const title = [...next, spec.title ?? ''].filter(Boolean).join(' › ');
                const file = spec.file ?? '';
                failures.push({
                  file,
                  line: spec.line ?? 0,
                  column: spec.column ?? 0,
                  title,
                  comparisonKey: `${file} › ${title}`,
                  errors: failed.flatMap(errorsFor),
                });
              }
            }
            for (const child of suite?.suites ?? []) visit(child, next);
          }

          for (const suite of report.suites ?? []) visit(suite, []);

          const unique = [];
          const seen = new Set();
          for (const failure of failures) {
            if (seen.has(failure.comparisonKey)) continue;
            seen.add(failure.comparisonKey);
            unique.push({
              key: `${failure.file}:${failure.line}:${failure.column} › ${failure.title}`,
              ...failure,
            });
          }
          unique.sort((left, right) => left.comparisonKey.localeCompare(right.comparisonKey));

          const hydrationPattern =
            /hydrated but some attributes of the server rendered HTML didn't match|Hydration failed because the server rendered HTML didn't match/;
          const homepage = unique.filter(
            (failure) =>
              failure.file.endsWith('returning-homepage.spec.ts') ||
              failure.file.endsWith('returning-homepage-timezone.spec.ts'),
          );
          const hydration = unique.filter((failure) =>
            failure.errors.some((error) => hydrationPattern.test(error)),
          );
          const summary = {
            exitStatus: Number(fs.readFileSync(exitStatusPath, 'utf8').trim()),
            stats: report.stats ?? null,
            failureCount: unique.length,
            returningHomepageFailureCount: homepage.length,
            returningHomepageFailures: homepage.map((failure) => failure.key),
            hydrationMismatchCount: hydration.length,
            hydrationFailures: hydration.map((failure) => failure.key),
          };

          fs.writeFileSync(
            `${outputPrefix}-failures.json`,
            `${JSON.stringify(unique, null, 2)}\n`,
          );
          fs.writeFileSync(
            `${outputPrefix}-summary.json`,
            `${JSON.stringify(summary, null, 2)}\n`,
          );
          fs.writeFileSync(
            `${outputPrefix}-failures.txt`,
            `${unique.map((failure) => failure.key).join('\n')}${unique.length ? '\n' : ''}`,
          );
          console.log(JSON.stringify(summary, null, 2));
          NODE

          cat > /tmp/summarize-rate.mjs <<'NODE'
          import fs from 'node:fs';

          const [reportPath, exitStatusPath, outputPath] = process.argv.slice(2);
          const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
          const stats = report.stats ?? {};
          const summary = {
            exitStatus: Number(fs.readFileSync(exitStatusPath, 'utf8').trim()),
            expected: Number(stats.expected ?? 0),
            unexpected: Number(stats.unexpected ?? 0),
            flaky: Number(stats.flaky ?? 0),
            skipped: Number(stats.skipped ?? 0),
          };
          summary.total =
            summary.expected + summary.unexpected + summary.flaky + summary.skipped;
          fs.writeFileSync(outputPath, `${JSON.stringify(summary, null, 2)}\n`);
          console.log(JSON.stringify(summary));
          NODE

          node --check /tmp/extract-playwright-json.mjs
          node --check /tmp/normalize-playwright.mjs
          node --check /tmp/summarize-rate.mjs

      - name: Measure candidate order-sensitive cases without masking failures
        shell: bash
        run: |
          set -uo pipefail

          run_case() {
            local label="$1"
            local file="$2"
            local pattern="$3"
            rm -rf .next
            set +e
            npx playwright test "$file" \
              --grep "$pattern" \
              --workers=1 --repeat-each=10 --reporter=json \
              > "$EVIDENCE_DIR/candidate-${label}-raw.log" \
              2> "$EVIDENCE_DIR/candidate-${label}.stderr.log"
            local status=$?
            set -e
            printf '%s\n' "$status" > "$EVIDENCE_DIR/candidate-${label}-exit-status.txt"
            node /tmp/extract-playwright-json.mjs \
              "$EVIDENCE_DIR/candidate-${label}-raw.log" \
              "$EVIDENCE_DIR/candidate-${label}-report.json" \
              "$EVIDENCE_DIR/candidate-${label}-prefix.log"
            node /tmp/summarize-rate.mjs \
              "$EVIDENCE_DIR/candidate-${label}-report.json" \
              "$EVIDENCE_DIR/candidate-${label}-exit-status.txt" \
              "$EVIDENCE_DIR/candidate-${label}-rate.json"
          }

          run_case now-rollback tests/exact-live-now-recommendations.spec.ts \
            'rolls back Save, difficulty, and Show less when the API accepts zero events'
          run_case difficulty-feedback tests/exact-live-now-recommendations.spec.ts \
            'records direct action-difficulty feedback and removes unwanted cards locally'
          run_case trade-controls tests/trade-controls.spec.ts \
            'trade controls previews integrity and a complete multi-party circle'
          run_case cofund-mobile tests/create-common-ground-pool.spec.ts \
            'stays compact without horizontal overflow on mobile'

      - name: Run complete candidate rendered suite truthfully
        shell: bash
        run: |
          set -uo pipefail
          rm -rf .next
          set +e
          npx playwright test --reporter=json \
            > "$EVIDENCE_DIR/candidate-report-raw.log" \
            2> "$EVIDENCE_DIR/candidate-playwright.stderr.log"
          status=$?
          set -e
          printf '%s\n' "$status" > "$EVIDENCE_DIR/candidate-exit-status.txt"
          node /tmp/extract-playwright-json.mjs \
            "$EVIDENCE_DIR/candidate-report-raw.log" \
            "$EVIDENCE_DIR/candidate-report.json" \
            "$EVIDENCE_DIR/candidate-report-prefix.log"
          node /tmp/normalize-playwright.mjs \
            "$EVIDENCE_DIR/candidate-report.json" \
            "$EVIDENCE_DIR/candidate" \
            "$EVIDENCE_DIR/candidate-exit-status.txt"

      - name: Check out immutable base and measure the same cases
        shell: bash
        run: |
          set -uo pipefail
          git checkout --force "$BASE_SHA"
          test "$(git rev-parse HEAD)" = "$BASE_SHA"

          run_case() {
            local label="$1"
            local file="$2"
            local pattern="$3"
            rm -rf .next
            set +e
            npx playwright test "$file" \
              --grep "$pattern" \
              --workers=1 --repeat-each=10 --reporter=json \
              > "$EVIDENCE_DIR/base-${label}-raw.log" \
              2> "$EVIDENCE_DIR/base-${label}.stderr.log"
            local status=$?
            set -e
            printf '%s\n' "$status" > "$EVIDENCE_DIR/base-${label}-exit-status.txt"
            node /tmp/extract-playwright-json.mjs \
              "$EVIDENCE_DIR/base-${label}-raw.log" \
              "$EVIDENCE_DIR/base-${label}-report.json" \
              "$EVIDENCE_DIR/base-${label}-prefix.log"
            node /tmp/summarize-rate.mjs \
              "$EVIDENCE_DIR/base-${label}-report.json" \
              "$EVIDENCE_DIR/base-${label}-exit-status.txt" \
              "$EVIDENCE_DIR/base-${label}-rate.json"
          }

          run_case now-rollback tests/exact-live-now-recommendations.spec.ts \
            'rolls back Save, difficulty, and Show less when the API accepts zero events'
          run_case difficulty-feedback tests/exact-live-now-recommendations.spec.ts \
            'records direct action-difficulty feedback and removes unwanted cards locally'
          run_case trade-controls tests/trade-controls.spec.ts \
            'trade controls previews integrity and a complete multi-party circle'
          run_case cofund-mobile tests/create-common-ground-pool.spec.ts \
            'stays compact without horizontal overflow on mobile'

      - name: Run complete immutable base rendered suite under identical conditions
        shell: bash
        run: |
          set -uo pipefail
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          rm -rf .next
          set +e
          npx playwright test --reporter=json \
            > "$EVIDENCE_DIR/base-report-raw.log" \
            2> "$EVIDENCE_DIR/base-playwright.stderr.log"
          status=$?
          set -e
          printf '%s\n' "$status" > "$EVIDENCE_DIR/base-exit-status.txt"
          node /tmp/extract-playwright-json.mjs \
            "$EVIDENCE_DIR/base-report-raw.log" \
            "$EVIDENCE_DIR/base-report.json" \
            "$EVIDENCE_DIR/base-report-prefix.log"
          node /tmp/normalize-playwright.mjs \
            "$EVIDENCE_DIR/base-report.json" \
            "$EVIDENCE_DIR/base" \
            "$EVIDENCE_DIR/base-exit-status.txt"

      - name: Enforce returning-homepage repair and fail-closed differential
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const dir = process.env.EVIDENCE_DIR;
          const read = (name) =>
            JSON.parse(fs.readFileSync(path.join(dir, name), 'utf8'));

          const baseSummary = read('base-summary.json');
          const candidateSummary = read('candidate-summary.json');
          const baseFailures = read('base-failures.json');
          const candidateFailures = read('candidate-failures.json');

          const caseDefinitions = {
            'now-rollback': {
              file: 'exact-live-now-recommendations.spec.ts',
              title: 'rolls back Save, difficulty, and Show less when the API accepts zero events',
            },
            'difficulty-feedback': {
              file: 'exact-live-now-recommendations.spec.ts',
              title: 'records direct action-difficulty feedback and removes unwanted cards locally',
            },
            'trade-controls': {
              file: 'trade-controls.spec.ts',
              title: 'trade controls previews integrity and a complete multi-party circle',
            },
            'cofund-mobile': {
              file: 'create-common-ground-pool.spec.ts',
              title: 'stays compact without horizontal overflow on mobile',
            },
          };

          const rates = {};
          for (const [label, definition] of Object.entries(caseDefinitions)) {
            const candidate = read(`candidate-${label}-rate.json`);
            const base = read(`base-${label}-rate.json`);
            const eligible =
              candidate.total === 10 &&
              base.total === 10 &&
              candidate.skipped === 0 &&
              base.skipped === 0 &&
              candidate.expected >= 9 &&
              candidate.unexpected <= base.unexpected;
            rates[label] = { ...definition, candidate, base, eligible };
          }

          const baseKeys = new Set(
            baseFailures.map((failure) => failure.comparisonKey),
          );
          const candidateOnly = candidateFailures.filter(
            (failure) => !baseKeys.has(failure.comparisonKey),
          );

          function rateLabelFor(failure) {
            for (const [label, definition] of Object.entries(caseDefinitions)) {
              if (
                failure.file.endsWith(definition.file) &&
                failure.title.includes(definition.title)
              ) {
                return label;
              }
            }
            return null;
          }

          const adjudicatedCandidateOnly = [];
          const unadjudicatedCandidateOnly = [];
          for (const failure of candidateOnly) {
            const label = rateLabelFor(failure);
            if (label && rates[label].eligible) {
              adjudicatedCandidateOnly.push({
                key: failure.key,
                comparisonKey: failure.comparisonKey,
                rateLabel: label,
              });
            } else {
              unadjudicatedCandidateOnly.push({
                key: failure.key,
                comparisonKey: failure.comparisonKey,
                rateLabel: label,
              });
            }
          }

          const adjustedCandidateFailureCount =
            candidateSummary.failureCount - adjudicatedCandidateOnly.length;

          const result = {
            baseSha: process.env.BASE_SHA,
            candidateSha: process.env.CANDIDATE_SHA,
            base: baseSummary,
            candidate: candidateSummary,
            rates,
            candidateOnlyFailureCount: candidateOnly.length,
            candidateOnlyFailures: candidateOnly.map((failure) => failure.key),
            adjudicatedCandidateOnly,
            unadjudicatedCandidateOnly,
            adjustedCandidateFailureCount,
            checks: {
              baseHasExactlySixTargetFailures:
                baseSummary.returningHomepageFailureCount === 6,
              candidateHasNoTargetFailures:
                candidateSummary.returningHomepageFailureCount === 0,
              candidateHasNoHydrationMismatches:
                candidateSummary.hydrationMismatchCount === 0,
              allRateChecksEligible:
                Object.values(rates).every((rate) => rate.eligible),
              noUnadjudicatedCandidateOnlyFailures:
                unadjudicatedCandidateOnly.length === 0,
              adjustedCandidateNoWorseThanBase:
                adjustedCandidateFailureCount <= baseSummary.failureCount,
            },
          };
          result.passed = Object.values(result.checks).every(Boolean);

          fs.writeFileSync(
            path.join(dir, 'current-main-differential.json'),
            `${JSON.stringify(result, null, 2)}\n`,
          );
          console.log(JSON.stringify(result, null, 2));
          if (!result.passed) process.exit(1);
          NODE

      - name: Upload immutable final gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: returning-homepage-final-gates-d9d98e74
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish immutable candidate result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$JOB_STATUS" == 'success' ]]; then
            state=success
            description="Returning-homepage exact differential passed"
          else
            state=failure
            description="Returning-homepage exact differential failed"
          fi
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${CANDIDATE_SHA}" \
            -f state="$state" \
            -f context="$STATUS_CONTEXT" \
            -f description="$description" \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          test "$state" = success
