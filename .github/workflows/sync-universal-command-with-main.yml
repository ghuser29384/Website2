name: Finalize universal Command from trusted feature base

on:
  pull_request:
    branches:
      - feat/universal-command-workspace

permissions:
  contents: write

concurrency:
  group: finalize-universal-command-from-child-pr
  cancel-in-progress: false

jobs:
  finalize-verify-push:
    if: github.head_ref == 'trigger/finalize-universal-command'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/universal-command-workspace
          fetch-depth: 0

      - name: Merge current main and apply final guardrails
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
          python .github/finalize-command.py
          git rm -f --ignore-unmatch \
            .github/finalize-command.py \
            .github/workflows/finalize-command-public-good-safety.yml \
            .github/workflows/sync-universal-command-with-main.yml
          git status --short

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --check public/moral-trade-live-command-center.js
      - run: npx eslint src/app/api/command src/app/command/page.tsx src/components/command src/lib/command src/app/mpgf/pools/new/page.tsx src/components/mpgf/mpgf-console.tsx src/lib/site-search.ts src/lib/site.ts src/lib/command-center-handoff.test.ts tests/exact-live-command-center.spec.ts
      - run: node --import tsx --test src/lib/command/*.test.ts src/lib/command-center-handoff.test.ts
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- tests/exact-live-command-center.spec.ts

      - name: Restore registered QA workflow and push verified feature branch
        shell: bash
        run: |
          set -euo pipefail
          git checkout HEAD -- next-env.d.ts
          git checkout origin/main -- .github/workflows/smart-query-qa.yml
          git add -A
          git commit -m "Finalize universal Command safety and main synchronization"
          git push origin HEAD:feat/universal-command-workspace
