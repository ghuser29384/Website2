name: Finalize universal Command from trusted feature base

on:
  pull_request:
    branches:
      - feat/universal-command-workspace

permissions:
  contents: read

concurrency:
  group: finalize-universal-command-from-child-pr
  cancel-in-progress: false

jobs:
  finalize-verify-package:
    if: github.head_ref == 'trigger/finalize-universal-command'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/universal-command-workspace
          fetch-depth: 0

      - name: Merge current main and apply final guardrails
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
          python .github/finalize-command.py
          git status --short

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --check public/moral-trade-live-command-center.js
      - run: npx eslint src/app/api/command src/app/command/page.tsx src/components/command src/lib/command src/app/mpgf/pools/new/page.tsx src/components/mpgf/mpgf-console.tsx src/lib/site-search.ts src/lib/site.ts src/lib/command-center-handoff.test.ts tests/exact-live-command-center.spec.ts
      - run: node --import tsx --test src/lib/command/*.test.ts src/lib/command-center-handoff.test.ts
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- tests/exact-live-command-center.spec.ts

      - name: Package verified application files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verified-command
          cp --parents \
            src/app/mpgf/pools/new/page.tsx \
            src/components/mpgf/mpgf-console.tsx \
            src/lib/command/capabilities.ts \
            src/lib/command/executor.ts \
            src/lib/command/executor.test.ts \
            verified-command/
          git rev-parse origin/main > verified-command/main-sha.txt
          git rev-parse origin/feat/universal-command-workspace > verified-command/feature-head-sha.txt
          git diff --check origin/feat/universal-command-workspace -- \
            src/app/mpgf/pools/new/page.tsx \
            src/components/mpgf/mpgf-console.tsx \
            src/lib/command/capabilities.ts \
            src/lib/command/executor.ts \
            src/lib/command/executor.test.ts

      - uses: actions/upload-artifact@v4
        with:
          name: verified-universal-command-finalization
          path: verified-command
          if-no-files-found: error
          retention-days: 1
