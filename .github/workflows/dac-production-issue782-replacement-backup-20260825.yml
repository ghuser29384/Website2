name: Issue 782 replacement encrypted production backup

on:
  push:
    branches:
      - ops/dac-production-canonical-uat-26d1fe43-20260824
    paths:
      - ".github/workflows/dac-production-issue782-replacement-backup-20260825.yml"

permissions:
  actions: read
  contents: read

concurrency:
  group: moraltrade-issue782-production-backup
  cancel-in-progress: false

env:
  CONTROLLER_BRANCH: ops/dac-production-canonical-uat-26d1fe43-20260824
  CONTROLLER_PATH: .github/workflows/dac-production-issue782-replacement-backup-20260825.yml
  EXPECTED_MAIN_SHA: 26d1fe436dbf9a4440bfafd501ddf8db944a1127
  EXPECTED_MAIN_TREE: 47fe96dfc881f1c57dea711283fc3db36a44e053
  EXPECTED_PROJECT_REF: jnpoxvalyjtdghnperyu
  EXPECTED_POOLER_HOST: aws-1-us-west-2.pooler.supabase.com
  EXPECTED_POOLER_USER: postgres.jnpoxvalyjtdghnperyu
  EXPECTED_DEPLOYMENT_ID: dpl_GbKHA9YfvjEW3iqymgY4uzp7MWsX
  EXPECTED_VERCEL_PROJECT_ID: prj_Em3j7Uj7RatX2R1ZYhla3XSHRde7
  VERCEL_TEAM_ID: team_ySu6sF3Uho1E1GnJtCQPVEuJ
  POSTGRES_IMAGE: postgres:17
  BACKUP_DIR: issue782-replacement-backup-evidence

jobs:
  replacement-backup:
    name: Exact-state encrypted backup and decryptability proof
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PROD_SUPABASE_DB_URL: ${{ secrets.PROD_SUPABASE_DB_URL }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out exact controller
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Guard exact source and controller-only scope
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "ghuser29384/Website2"
          test "$GITHUB_REF_NAME" = "$CONTROLLER_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git merge-base HEAD "$EXPECTED_MAIN_SHA")" = "$EXPECTED_MAIN_SHA"
          test "$(git rev-parse "$EXPECTED_MAIN_SHA^{tree}")" = "$EXPECTED_MAIN_TREE"
          remote_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$remote_main" = "$EXPECTED_MAIN_SHA"
          test "$(git diff --name-only "$EXPECTED_MAIN_SHA" HEAD)" = "$CONTROLLER_PATH"
          git diff --check "$EXPECTED_MAIN_SHA" HEAD
          mkdir -p "$BACKUP_DIR"
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg controllerBranch "$CONTROLLER_BRANCH" \
            --arg controllerSha "$GITHUB_SHA" \
            --arg mainSha "$EXPECTED_MAIN_SHA" \
            --arg mainTree "$EXPECTED_MAIN_TREE" \
            --arg remoteMain "$remote_main" \
            --arg checkedAt "$(date -u +%FT%TZ)" \
            '{repository:$repository,controllerBranch:$controllerBranch,controllerSha:$controllerSha,mainSha:$mainSha,mainTree:$mainTree,remoteMain:$remoteMain,controllerOnlyDiff:true,checkedAt:$checkedAt}' \
            > "$BACKUP_DIR/source-identity.json"

      - name: Re-prove immutable release and post-cutover evidence
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/32226007777" > "$RUNNER_TEMP/release-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/32226007777/artifacts" > "$RUNNER_TEMP/release-artifacts.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/32226071677" > "$RUNNER_TEMP/post-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/32226071677/artifacts" > "$RUNNER_TEMP/post-artifacts.json"
          jq -e --arg sha "$EXPECTED_MAIN_SHA" '.status=="completed" and .conclusion=="success" and .head_sha==$sha and .name=="Gated Vercel release"' "$RUNNER_TEMP/release-run.json" >/dev/null
          jq -e --arg digest 'sha256:28a52dc6bd81c69e4a800e13398ecf57b6a2a14df465571e319c485b9519a98b' '.total_count==1 and .artifacts[0].id==9355876787 and .artifacts[0].expired==false and .artifacts[0].digest==$digest' "$RUNNER_TEMP/release-artifacts.json" >/dev/null
          jq -e '.status=="completed" and .conclusion=="success" and .id==32226071677' "$RUNNER_TEMP/post-run.json" >/dev/null
          jq -e --arg digest 'sha256:6291a9377a9f284993cd524fb6a80b6cf367d42c3eba2a008fe46fab01abd01e' '.total_count==1 and .artifacts[0].id==9355560933 and .artifacts[0].expired==false and .artifacts[0].digest==$digest' "$RUNNER_TEMP/post-artifacts.json" >/dev/null
          jq -n \
            --argjson releaseRunId 32226007777 \
            --argjson releaseArtifactId 9355876787 \
            --arg releaseDigest 'sha256:28a52dc6bd81c69e4a800e13398ecf57b6a2a14df465571e319c485b9519a98b' \
            --argjson postRunId 32226071677 \
            --argjson postArtifactId 9355560933 \
            --arg postDigest 'sha256:6291a9377a9f284993cd524fb6a80b6cf367d42c3eba2a008fe46fab01abd01e' \
            --arg verifiedAt "$(date -u +%FT%TZ)" \
            '{release:{runId:$releaseRunId,artifactId:$releaseArtifactId,digest:$releaseDigest,success:true,expired:false},postCutover:{runId:$postRunId,artifactId:$postArtifactId,digest:$postDigest,success:true,expired:false},verifiedAt:$verifiedAt}' \
            > "$BACKUP_DIR/prior-evidence.json"

      - name: Guard exact deployment and canonical aliases
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          curl -fsS -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v13/deployments/$EXPECTED_DEPLOYMENT_ID?teamId=$VERCEL_TEAM_ID" \
            > "$RUNNER_TEMP/deployment.json"
          jq -e \
            --arg id "$EXPECTED_DEPLOYMENT_ID" \
            --arg project "$EXPECTED_VERCEL_PROJECT_ID" \
            --arg sha "$EXPECTED_MAIN_SHA" '
              ((.id // .uid)==$id)
              and ((.projectId // .project.id // "")==$project)
              and ((.readyState // .state // "")=="READY")
              and (.target=="production")
              and (.meta.githubCommitOrg=="ghuser29384")
              and (.meta.githubCommitRepo=="Website2")
              and (.meta.githubCommitSha==$sha)
              and ((.aliasError // null)==null)
              and ((.alias // .aliases // []) | any(.=="moraltrade.org"))
              and ((.alias // .aliases // []) | any(.=="www.moraltrade.org"))
            ' "$RUNNER_TEMP/deployment.json" >/dev/null
          mkdir -p "$BACKUP_DIR/aliases"
          for alias_name in moraltrade.org www.moraltrade.org; do
            key="${alias_name//./-}"
            curl -fsS -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v4/aliases/$alias_name?projectId=$EXPECTED_VERCEL_PROJECT_ID&teamId=$VERCEL_TEAM_ID" \
              > "$RUNNER_TEMP/alias-${key}.json"
            jq -e --arg alias "$alias_name" --arg project "$EXPECTED_VERCEL_PROJECT_ID" --arg deployment "$EXPECTED_DEPLOYMENT_ID" '
              (.alias==$alias) and (.projectId==$project) and ((.deploymentId // .deployment.id // .deployment.uid // "")==$deployment)
            ' "$RUNNER_TEMP/alias-${key}.json" >/dev/null
            jq '{alias,projectId,deploymentId:(.deploymentId // .deployment.id // .deployment.uid)}' "$RUNNER_TEMP/alias-${key}.json" > "$BACKUP_DIR/aliases/${key}.json"
          done
          jq -n \
            --arg deploymentId "$EXPECTED_DEPLOYMENT_ID" \
            --arg projectId "$EXPECTED_VERCEL_PROJECT_ID" \
            --arg mainSha "$EXPECTED_MAIN_SHA" \
            --arg verifiedAt "$(date -u +%FT%TZ)" \
            '{deploymentId:$deploymentId,projectId:$projectId,mainSha:$mainSha,target:"production",ready:true,aliases:["moraltrade.org","www.moraltrade.org"],verifiedAt:$verifiedAt}' \
            > "$BACKUP_DIR/deployment.json"

      - name: Validate exact TLS-only production target
        shell: bash
        run: |
          set -euo pipefail
          test -n "${PROD_SUPABASE_DB_URL:-}"
          echo "::add-mask::$PROD_SUPABASE_DB_URL"
          URL_TO_CHECK="$PROD_SUPABASE_DB_URL" node <<'NODE'
          const url = new URL(process.env.URL_TO_CHECK);
          const valid =
            ["postgres:", "postgresql:"].includes(url.protocol) &&
            decodeURIComponent(url.username) === process.env.EXPECTED_POOLER_USER &&
            url.hostname === process.env.EXPECTED_POOLER_HOST &&
            url.port === "5432" &&
            url.pathname === "/postgres" &&
            url.searchParams.get("sslmode") === "require" &&
            Boolean(url.password) &&
            !url.href.includes("hvmxfjjbdcgjjudmthdz");
          if (!valid) throw new Error("Refusing a database URL outside the exact TLS-only production target.");
          NODE

      - name: Pull PostgreSQL 17 tools
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$POSTGRES_IMAGE"
          docker image inspect "$POSTGRES_IMAGE" --format '{{index .RepoDigests 0}}' > "$BACKUP_DIR/postgres-image.txt"

      - name: Execute read-only migration schema RLS grant and zero-state guard
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          cat > "$RUNNER_TEMP/guard.sql" <<'SQL'
          \set ON_ERROR_STOP on
          set statement_timeout = '60s';
          begin transaction read only;
          do $guard$
          declare
            expected jsonb := '[
              {"version":"20260806110000","name":"mpgf_pool_review_freeze","hash":"0913419d665fd69b3a80ea3e5c39a89111721e414b7520f0defc11f6965ecc3c"},
              {"version":"20260806143000","name":"mpgf_pool_publication_materialization","hash":"ee8ab4a2c52893ff9f2d8dfcbf7dc25370768af80e5401978f7c4b09e8cab9e8"},
              {"version":"20260806173000","name":"mpgf_dac_pledge_intent_ledger","hash":"36f558549361a1c0747dab5ecd545c74efbd42be14f6d634cb28e8b01f7c1e9c"},
              {"version":"20260807050000","name":"mpgf_dac_success_lapse","hash":"83d9432f90fb808302249b5b572029d68bfc9aa2be32afbaba710f8e341d0948"},
              {"version":"20260807100000","name":"mpgf_dac_public_terms_api","hash":"356d220c009dd6213b761712a30ce0124d95f075d5fdab5c44da3398a6265a0f"},
              {"version":"20260812073000","name":"mpgf_dac_terminal_event_constraint_reconciliation","hash":"a19653e57a20dff8d01e1dd54b4b77304fe0712fe3356820953945e7b9999cd2"},
              {"version":"20260812074500","name":"mpgf_dac_terminal_schema_reconciliation","hash":"d8dc2a55840425357c8859b87d26fba0415bb1a50c8e739518a88b9686142cbb"},
              {"version":"20260815010000","name":"mpgf_pool_lifecycle_event_ordering","hash":"1d60c1abc73c8842cdcd9694c77d0e29dac4fe1de98a496714c0f2f2f5619766"},
              {"version":"20260815011000","name":"mpgf_dac_terminal_guard_reconciliation","hash":"c64d521c6adb7a865d9ec5e2f25e70adb09f08f91e0f1bc0ec0610977aafd108"},
              {"version":"20260818173000","name":"mpgf_dac_public_goods_foundation_reconciliation","hash":"e89a199cbdbb767d88a03585764bce774f533449519b67d04c082683f0638aa0"},
              {"version":"20260818174000","name":"mpgf_dac_public_aggregate_column_privacy","hash":"0c3e7596f5f6b0d69d9438347f82ad79b6d0663511d3aec7cf333681fef9f581"}
            ]'::jsonb;
            item jsonb;
            observed_name text;
            observed_hash text;
            table_name text;
            row_count bigint;
          begin
            for item in select value from jsonb_array_elements(expected)
            loop
              select name,
                     case when statements is null or array_length(statements,1) is null then null
                          else encode(extensions.digest(convert_to(statements[1], 'UTF8'), 'sha256'),'hex') end
                into observed_name, observed_hash
              from supabase_migrations.schema_migrations
              where version = item->>'version';
              if not found or observed_name is distinct from item->>'name' or observed_hash is distinct from item->>'hash' then
                raise exception 'migration registry drift for %', item->>'version';
              end if;
            end loop;
            if (select count(*) from supabase_migrations.schema_migrations where version in (select value->>'version' from jsonb_array_elements(expected))) <> 11 then
              raise exception 'expected exactly eleven DAC registry rows';
            end if;
            foreach table_name in array array[
              'mpgf_pool_proposals','mpgf_pool_reviewers','mpgf_pool_proposal_versions','mpgf_pool_lifecycle_events',
              'mpgf_public_goods_match_pools','mpgf_public_goods_rounds','mpgf_public_goods_campaigns','mpgf_public_goods_pledges',
              'mpgf_dac_pledge_intents','mpgf_dac_pledge_events','mpgf_dac_campaign_outcomes'
            ] loop
              if to_regclass('public.'||table_name) is null then
                raise exception 'missing table %', table_name;
              end if;
              if not exists (
                select 1
                from pg_class c
                join pg_namespace n on n.oid=c.relnamespace
                where n.nspname='public' and c.relname=table_name and c.relrowsecurity
              ) then
                raise exception 'RLS disabled on %', table_name;
              end if;
              execute format('select count(*) from public.%I', table_name) into row_count;
              if row_count <> 0 then
                raise exception 'nonzero authorized aggregate state on %', table_name;
              end if;
            end loop;
            if to_regprocedure('public.mpgf_approve_and_freeze_pool_proposal(uuid,uuid,text)') is null
               or to_regprocedure('public.mpgf_publish_pool_proposal(uuid,text,text,uuid,text)') is null
               or to_regprocedure('public.mpgf_create_dac_pledge(text,bigint,text,text,text)') is null
               or to_regprocedure('public.mpgf_review_dac_pledge_eligibility(uuid,uuid,text,integer,text)') is null
               or to_regprocedure('public.mpgf_finalize_dac_campaign(text,uuid,text)') is null
               or to_regprocedure('public.mpgf_public_dac_campaign_terms(text)') is null then
              raise exception 'required DAC function missing';
            end if;
            if has_table_privilege('anon','public.mpgf_public_goods_campaigns','SELECT')
               or has_table_privilege('authenticated','public.mpgf_public_goods_campaigns','SELECT')
               or has_table_privilege('anon','public.mpgf_dac_campaign_outcomes','SELECT')
               or has_table_privilege('authenticated','public.mpgf_dac_campaign_outcomes','SELECT') then
              raise exception 'unexpected table-level public select';
            end if;
            if not has_column_privilege('anon','public.mpgf_public_goods_campaigns','id','SELECT')
               or not has_column_privilege('authenticated','public.mpgf_public_goods_campaigns','id','SELECT')
               or has_column_privilege('anon','public.mpgf_public_goods_campaigns','published_by','SELECT')
               or has_column_privilege('authenticated','public.mpgf_public_goods_campaigns','published_by','SELECT')
               or not has_column_privilege('anon','public.mpgf_dac_campaign_outcomes','outcome_status','SELECT')
               or has_column_privilege('anon','public.mpgf_dac_campaign_outcomes','outcome_json','SELECT') then
              raise exception 'public/private column grant drift';
            end if;
            if (select count(*) from public.mpgf_public_goods_pledges where payment_intent_ref is not null or status='captured') <> 0 then
              raise exception 'payment reference drift';
            end if;
          end
          $guard$;
          select jsonb_build_object(
            'migrationRows',11,
            'requiredTables',11,
            'rlsEnabled',true,
            'requiredFunctions',6,
            'safeColumnReads',true,
            'privateColumnDenial',true,
            'authorizedAggregateRows',0,
            'paymentReferences',0,
            'checkedAt',clock_timestamp()
          );
          rollback;
          SQL
          docker run --rm -i "$POSTGRES_IMAGE" psql "$PROD_SUPABASE_DB_URL" \
            --no-psqlrc --set ON_ERROR_STOP=1 --tuples-only --no-align \
            < "$RUNNER_TEMP/guard.sql" | tee "$BACKUP_DIR/database-guard.json"
          jq -e '.paymentReferences==0 and .authorizedAggregateRows==0 and .migrationRows==11 and .requiredFunctions==6' "$BACKUP_DIR/database-guard.json" >/dev/null

      - name: Create consistent PostgreSQL custom archive
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          docker run --rm "$POSTGRES_IMAGE" pg_dump \
            --dbname="$PROD_SUPABASE_DB_URL" \
            --format=custom \
            --compress=9 \
            --no-owner \
            --no-privileges \
            > "$BACKUP_DIR/moraltrade-production-issue782-postcutover.dump"
          test -s "$BACKUP_DIR/moraltrade-production-issue782-postcutover.dump"
          sha256sum "$BACKUP_DIR/moraltrade-production-issue782-postcutover.dump" > "$BACKUP_DIR/plaintext-backup.sha256"

      - name: Verify archive structure
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -i "$POSTGRES_IMAGE" pg_restore --list \
            < "$BACKUP_DIR/moraltrade-production-issue782-postcutover.dump" \
            > "$BACKUP_DIR/restore-list.txt"
          test "$(wc -l < "$BACKUP_DIR/restore-list.txt")" -gt 100
          grep -Eq 'TABLE|SCHEMA|FUNCTION' "$BACKUP_DIR/restore-list.txt"

      - name: Encrypt and prove byte-exact decryptability
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          backup_key="$(printf '%s\0%s' "$PROD_SUPABASE_DB_URL" 'moraltrade-issue782-postcutover-backup-v1' | sha256sum | awk '{print $1}')"
          test "${#backup_key}" -eq 64
          echo "::add-mask::$backup_key"
          export BACKUP_KEY="$backup_key"
          openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -salt \
            -in "$BACKUP_DIR/moraltrade-production-issue782-postcutover.dump" \
            -out "$BACKUP_DIR/moraltrade-production-issue782-postcutover.dump.enc" \
            -pass env:BACKUP_KEY
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 \
            -in "$BACKUP_DIR/moraltrade-production-issue782-postcutover.dump.enc" \
            -out "$RUNNER_TEMP/roundtrip.dump" \
            -pass env:BACKUP_KEY
          cmp --silent "$BACKUP_DIR/moraltrade-production-issue782-postcutover.dump" "$RUNNER_TEMP/roundtrip.dump"
          rm -f "$RUNNER_TEMP/roundtrip.dump"
          sha256sum "$BACKUP_DIR/moraltrade-production-issue782-postcutover.dump.enc" > "$BACKUP_DIR/encrypted-backup.sha256"

      - name: Write manifest and remove plaintext
        shell: bash
        run: |
          set -euo pipefail
          plaintext_sha="$(awk '{print $1}' "$BACKUP_DIR/plaintext-backup.sha256")"
          encrypted_sha="$(awk '{print $1}' "$BACKUP_DIR/encrypted-backup.sha256")"
          plaintext_bytes="$(stat -c %s "$BACKUP_DIR/moraltrade-production-issue782-postcutover.dump")"
          encrypted_bytes="$(stat -c %s "$BACKUP_DIR/moraltrade-production-issue782-postcutover.dump.enc")"
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg mainSha "$EXPECTED_MAIN_SHA" \
            --arg mainTree "$EXPECTED_MAIN_TREE" \
            --arg projectRef "$EXPECTED_PROJECT_REF" \
            --arg deploymentId "$EXPECTED_DEPLOYMENT_ID" \
            --arg plaintextSha256 "$plaintext_sha" \
            --arg encryptedSha256 "$encrypted_sha" \
            --argjson plaintextBytes "$plaintext_bytes" \
            --argjson encryptedBytes "$encrypted_bytes" \
            --arg createdAt "$(date -u +%FT%TZ)" \
            '{repository:$repository,releaseMainSha:$mainSha,releaseMainTree:$mainTree,sourceProjectRef:$projectRef,deploymentId:$deploymentId,format:"PostgreSQL 17 custom archive",encryption:"AES-256-CBC, PBKDF2-SHA256, 600000 iterations",keyRetainedInArtifact:false,plaintextSha256:$plaintextSha256,encryptedSha256:$encryptedSha256,plaintextBytes:$plaintextBytes,encryptedBytes:$encryptedBytes,archiveListVerified:true,decryptRoundTripVerified:true,productionMutation:false,createdAt:$createdAt}' \
            > "$BACKUP_DIR/backup-manifest.json"
          rm -f "$BACKUP_DIR/moraltrade-production-issue782-postcutover.dump"
          test ! -e "$BACKUP_DIR/moraltrade-production-issue782-postcutover.dump"
          test -s "$BACKUP_DIR/moraltrade-production-issue782-postcutover.dump.enc"

      - name: Scan retained textual evidence for credentials
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > "$BACKUP_DIR/privacy-scan.json"
          from pathlib import Path
          import json
          import re
          root = Path('issue782-replacement-backup-evidence')
          files = [p for p in root.rglob('*') if p.is_file() and p.suffix in {'.json', '.txt', '.sha256'}]
          patterns = {
              'database_url': re.compile(rb'postgres(?:ql)?://[^\s"\']+', re.I),
              'jwt': re.compile(rb'eyJ[A-Za-z0-9_-]{12,}\.[A-Za-z0-9_-]{12,}\.[A-Za-z0-9_-]{8,}'),
              'bearer': re.compile(rb'Bearer\s+[A-Za-z0-9._~+/-]{20,}', re.I),
              'private_key': re.compile(rb'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----'),
              'provider_secret': re.compile(rb'(?:sk_(?:live|test)_|whsec_)[A-Za-z0-9_-]{8,}', re.I),
          }
          findings = []
          for file in files:
              data = file.read_bytes()
              for label, pattern in patterns.items():
                  if pattern.search(data):
                      findings.append({'type': label, 'file': str(file)})
          result = {'filesScanned': len(files), 'findings': findings}
          print(json.dumps(result, sort_keys=True))
          if findings:
              raise SystemExit('Credential-like material found in retained backup evidence.')
          PY
          jq -e '.findings==[]' "$BACKUP_DIR/privacy-scan.json" >/dev/null
          rm -f "$RUNNER_TEMP/guard.sql" "$RUNNER_TEMP"/*-run.json "$RUNNER_TEMP"/*-artifacts.json "$RUNNER_TEMP/deployment.json" "$RUNNER_TEMP"/alias-*.json

      - name: Upload encrypted backup and verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: moraltrade-issue782-postcutover-backup-${{ github.run_id }}-${{ env.EXPECTED_MAIN_SHA }}
          path: ${{ env.BACKUP_DIR }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Record completion
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '### Issue 782 replacement production backup verified'
            echo "- exact main: \`$EXPECTED_MAIN_SHA\`"
            echo "- exact tree: \`$EXPECTED_MAIN_TREE\`"
            echo "- deployment: \`$EXPECTED_DEPLOYMENT_ID\`"
            echo "- project: \`$EXPECTED_PROJECT_REF\`"
            echo '- migration/schema/RLS/grant/zero-state drift guard: passed'
            echo '- exact reviewed DAC function set: passed'
            echo '- archive structure: verified'
            echo '- encrypted decrypt round trip: verified'
            echo '- plaintext retained: no'
            echo '- production mutation: none'
          } >> "$GITHUB_STEP_SUMMARY"
