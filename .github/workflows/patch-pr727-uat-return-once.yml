name: Patch PR 727 production UAT step return once

on:
  push:
    branches:
      - ops/pr727-production-create-uat-final-20260817
    paths:
      - .github/workflows/patch-pr727-uat-return-once.yml

permissions:
  contents: write

concurrency:
  group: patch-pr727-production-uat-step-return
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact controller
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Guard one-shot parent and patch only the UAT harness
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'ghuser29384/Website2'
          test "$GITHUB_REF_NAME" = 'ops/pr727-production-create-uat-final-20260817'
          test "$(git rev-parse HEAD^)" = '22a3aa6d4570f72adc460731e34dfdbcf303b490'
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/patch-pr727-uat-return-once.yml'
          git diff --check HEAD^ HEAD

          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/scripts/create-production-uat.mjs')
          source = path.read_text(encoding='utf-8')
          start_marker = 'async function returnToCause(create) {'
          end_marker = '\n\nasync function chooseCauseAndInspect'
          if source.count(start_marker) != 1:
              raise SystemExit('Expected one returnToCause helper.')
          start = source.index(start_marker)
          end = source.index(end_marker, start)
          replacement = '''async function returnToCause(create) {
            const causeHeading = create.getByRole("heading", {
              level: 1,
              name: "What do you want to improve?",
            });
            if (await causeHeading.isVisible()) return;

            const suggestions = create.locator("#actionSuggestions");
            if (await suggestions.isVisible()) {
              await create.locator("#requestActionInput").press("Escape");
              await expect(suggestions).toBeHidden();
            }

            await create.locator("body").press("Escape");
            await expect(causeHeading).toBeVisible();
          }'''
          replacement = '\n'.join(line[10:] if line.startswith('          ') else line for line in replacement.splitlines())
          updated = source[:start] + replacement + source[end:]
          if '.back-link' in updated:
              raise SystemExit('Stale global Back to Trade selector remains in the UAT harness.')
          if updated.count('await create.locator("body").press("Escape");') != 1:
              raise SystemExit('Semantic step-return contract missing or duplicated.')
          path.write_text(updated, encoding='utf-8')
          PY

          node --check .github/scripts/create-production-uat.mjs
          ! grep -Fq '.back-link' .github/scripts/create-production-uat.mjs
          grep -Fq 'await create.locator("body").press("Escape");' .github/scripts/create-production-uat.mjs
          grep -Fq 'await expect(suggestions).toBeHidden();' .github/scripts/create-production-uat.mjs
          git diff --check
          test "$(git diff --name-only)" = '.github/scripts/create-production-uat.mjs'

      - name: Commit and push only the corrected UAT harness
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/scripts/create-production-uat.mjs
          test "$(git diff --cached --name-only)" = '.github/scripts/create-production-uat.mjs'
          git diff --cached --check
          git commit -m 'Correct production Create UAT step-return semantics'
          git push origin HEAD:ops/pr727-production-create-uat-final-20260817
