name: Route planner simplification production 2026-10-04

on:
  pull_request:
    branches: [main]
    paths:
      - public/moral-trade-live-route-recommendations.js
      - public/moral-trade-live-route-planner-compact.css
      - src/live-now-data.test.ts
      - tests/exact-live-route-recommendations.spec.ts
      - .github/workflows/route-planner-simplification-production-20261004.yml
  push:
    branches:
      - main
    paths:
      - .github/workflows/route-planner-simplification-production-20261004.yml

permissions:
  actions: write
  contents: read

concurrency:
  group: route-planner-simplification-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify repository and production build
        env:
          VERCEL: '1'
          NEXT_PUBLIC_SITE_URL: https://www.moraltrade.org
          SITE_URL: https://www.moraltrade.org
        run: |
          npm test
          node --import tsx --test src/live-now-data.test.ts
          npm run lint -- --quiet
          npx tsc --noEmit
          npm run build
      - run: npx playwright install --with-deps chromium
      - name: Verify route planner interactions and responsive layout
        env:
          PLAYWRIGHT_USE_PRODUCTION_SERVER: '1'
        run: npx playwright test tests/exact-live-route-recommendations.spec.ts --reporter=line
  dispatch:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact release candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Verify approved route planner simplification
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'ghuser29384/Website2'
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git hash-object 'public/moral-trade-live-route-recommendations.js')" = '69c7121ff5eb4ec3766442b9da2928ce2db78087'
          test "$(git hash-object 'public/moral-trade-live-route-planner-compact.css')" = 'b16f4cfef365c5308e33f62106864f5ea9456adc'
          test "$(git hash-object 'src/live-now-data.test.ts')" = 'c591443ca68d14ca4ef6159e1942eb4c6da3d922'
          test "$(git hash-object 'tests/exact-live-route-recommendations.spec.ts')" = '745c31f836825a5d9044fe93eb7b30f0bbde285d'
          git diff --check HEAD^
          remote_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$remote_sha" = "$GITHUB_SHA"

      - name: Dispatch the existing gated production release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/vercel-release.yml" --jq .state)" = 'active'
          jq -n --arg sha "$GITHUB_SHA" \
            '{ref:"main",inputs:{ref:"main",target:"production",expected_sha:$sha,synthetic_auth_fixture_url:""}}' \
            | gh api --method POST \
                -H 'Accept: application/vnd.github+json' \
                -H 'X-GitHub-Api-Version: 2022-11-28' \
                "repos/$GITHUB_REPOSITORY/actions/workflows/vercel-release.yml/dispatches" \
                --input - >/dev/null
