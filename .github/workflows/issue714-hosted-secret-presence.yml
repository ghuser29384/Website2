name: Issue 714 hosted QA secret capability presence

on:
  push:
    branches:
      - ops/issue714-pr698-sync-diagnostic-20260824
    paths:
      - .github/workflows/issue714-hosted-secret-presence.yml

permissions:
  contents: read

env:
  VERCEL_TOKEN_VALUE: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_AUTOMATION_BYPASS_SECRET_VALUE: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
  SUPABASE_ACCESS_TOKEN_VALUE: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_DB_PASSWORD_VALUE: ${{ secrets.SUPABASE_DB_PASSWORD }}
  SUPABASE_PROJECT_REF_VALUE: ${{ secrets.SUPABASE_PROJECT_REF }}
  SUPABASE_SERVICE_ROLE_KEY_VALUE: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  SUPABASE_QA_SERVICE_ROLE_KEY_VALUE: ${{ secrets.SUPABASE_QA_SERVICE_ROLE_KEY }}
  TEST_INBOX_API_KEY_VALUE: ${{ secrets.TEST_INBOX_API_KEY }}
  MAILSLURP_API_KEY_VALUE: ${{ secrets.MAILSLURP_API_KEY }}
  MAILOSAUR_API_KEY_VALUE: ${{ secrets.MAILOSAUR_API_KEY }}
  RESEND_API_KEY_VALUE: ${{ secrets.RESEND_API_KEY }}

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Report presence only
        shell: bash
        run: |
          set -euo pipefail
          report() {
            local name="$1" value="$2"
            if [[ -n "$value" ]]; then
              printf '%s=present\n' "$name"
            else
              printf '%s=absent\n' "$name"
            fi
          }
          report VERCEL_TOKEN "$VERCEL_TOKEN_VALUE"
          report VERCEL_AUTOMATION_BYPASS_SECRET "$VERCEL_AUTOMATION_BYPASS_SECRET_VALUE"
          report SUPABASE_ACCESS_TOKEN "$SUPABASE_ACCESS_TOKEN_VALUE"
          report SUPABASE_DB_PASSWORD "$SUPABASE_DB_PASSWORD_VALUE"
          report SUPABASE_PROJECT_REF "$SUPABASE_PROJECT_REF_VALUE"
          report SUPABASE_SERVICE_ROLE_KEY "$SUPABASE_SERVICE_ROLE_KEY_VALUE"
          report SUPABASE_QA_SERVICE_ROLE_KEY "$SUPABASE_QA_SERVICE_ROLE_KEY_VALUE"
          report TEST_INBOX_API_KEY "$TEST_INBOX_API_KEY_VALUE"
          report MAILSLURP_API_KEY "$MAILSLURP_API_KEY_VALUE"
          report MAILOSAUR_API_KEY "$MAILOSAUR_API_KEY_VALUE"
          report RESEND_API_KEY "$RESEND_API_KEY_VALUE"
