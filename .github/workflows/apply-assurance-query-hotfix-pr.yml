name: Temporary apply — assurance query routing hotfix via PR

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/apply-assurance-query-hotfix-pr.yml"

permissions:
  contents: write

concurrency:
  group: assurance-query-hotfix-materializer-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out exact hotfix branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/discover-assurance-query-routing-20260731

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Materialize, verify, and commit product hotfix
        shell: bash
        run: |
          set -euo pipefail
          expected_base="4aa983db63506f8b60ae6d2aa51cf6abc1107087"
          git merge-base --is-ancestor "$expected_base" HEAD

          python scripts/apply-assurance-query-hotfix.py
          node scripts/pack-discover-payload.mjs
          node --check public/moral-trade-smart-query.js
          node --import tsx --test src/lib/smart-query.test.ts
          npm run verify:discover
          npx eslint \
            src/lib/smart-query.ts \
            src/lib/smart-query.test.ts \
            tests/discover-cofund.spec.ts
          git diff --check

          rm -f scripts/apply-assurance-query-hotfix.py

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/lib/smart-query.ts \
            src/lib/smart-query.test.ts \
            public/moral-trade-smart-query.js \
            src/discover/moral-trade-discover.source.html \
            public/discover/payload \
            tests/discover-cofund.spec.ts \
            scripts/apply-assurance-query-hotfix.py
          git commit -m "Route assurance-contract searches to standalone Pools"
          git push origin HEAD:fix/discover-assurance-query-routing-20260731
