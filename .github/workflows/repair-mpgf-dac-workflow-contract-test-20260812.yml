name: Repair MPGF DAC workflow contract test

on:
  push:
    branches:
      - ops/repair-mpgf-dac-workflow-contract-test-20260812
    paths:
      - ".github/workflows/repair-mpgf-dac-workflow-contract-test-20260812.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-mpgf-dac-workflow-contract-test-20260812
  cancel-in-progress: false

env:
  TARGET_BRANCH: integration/mpgf-dac-lifecycle-current-main-20260812
  EXPECTED_HEAD_SHA: 0222c4e89800086d13c55395c8f6ac3df9a42a59

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repair controller
        uses: actions/checkout@v4
        with:
          ref: ops/repair-mpgf-dac-workflow-contract-test-20260812
          fetch-depth: 1

      - name: Preserve and validate deterministic repair script
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/repair-mpgf-dac-workflow-contract-test-20260814.py /tmp/repair-mpgf-dac-workflow-contract-test.py
          python3 -m py_compile /tmp/repair-mpgf-dac-workflow-contract-test.py

      - name: Check out exact PR 640 candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          clean: true

      - name: Apply only the stale workflow-contract repair
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          python3 /tmp/repair-mpgf-dac-workflow-contract-test.py
          git diff --check
          test "$(git diff --name-only)" = "src/lib/mpgf/dac-product-lifecycle.test.ts"
          git diff -- src/lib/mpgf/dac-product-lifecycle.test.ts

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Prove the repaired focused contracts
        shell: bash
        run: |
          set -euo pipefail
          node --import tsx --test \
            src/lib/mpgf/dac-lifecycle-model.test.ts \
            src/lib/mpgf/dac-public-terms-migration.test.ts \
            src/lib/mpgf/dac-terminal-event-reconciliation-migration.test.ts \
            src/lib/mpgf/dac-terminal-schema-reconciliation-migration.test.ts \
            src/lib/mpgf/dac-product-lifecycle.test.ts

      - name: Commit and publish the narrowly scoped repair
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          git diff --check
          test "$(git diff --name-only)" = "src/lib/mpgf/dac-product-lifecycle.test.ts"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/mpgf/dac-product-lifecycle.test.ts
          git commit -m "test(mpgf): serialize shared-QA lifecycle proofs"
          git push origin "HEAD:${TARGET_BRANCH}"
