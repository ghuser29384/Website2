name: Patch Collective-in-Create QA product head

on:
  pull_request:
    branches:
      - feature/collective-commitments-in-create-20260729
    paths:
      - ".github/workflows/patch-collective-in-create-qa-head.yml"

permissions:
  contents: write

concurrency:
  group: patch-collective-in-create-qa-head-20260729
  cancel-in-progress: false

jobs:
  patch:
    if: >-
      github.event.pull_request.head.repo.full_name == 'ghuser29384/Website2' &&
      github.head_ref == 'qa/collective-in-create-20260729'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Update exact product boundary and retire patcher
        shell: bash
        run: |
          set -euo pipefail
          old='3ff0e2a6b5a4a9b344a388a255623f15f436ade2'
          new='78c75560674f4f8442e796005cc2faf1054e7a5b'
          file='.github/workflows/collective-in-create-qa.yml'
          test "$(grep -Foc "$old" "$file")" = "1"
          sed -i "s/$old/$new/" "$file"
          test "$(grep -Foc "$new" "$file")" = "1"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-collective-in-create-qa-head.yml
          git add "$file"
          git diff --cached --check
          git commit -m "Test the updated Collective-in-Create product head"
          git push origin HEAD:qa/collective-in-create-20260729
