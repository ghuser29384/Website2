name: One-time Vercel and Supabase consolidation

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/background-schema-history-inspection.yml"
      - "scripts/ops/consolidate-vercel-projects.sh"

permissions:
  contents: read

jobs:
  consolidate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel@56.4.0

      - name: Run one-time encrypted consolidation
        shell: bash
        run: bash scripts/ops/consolidate-vercel-projects.sh

      - name: Upload redacted consolidation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vercel-project-consolidation-report
          path: vercel-project-consolidation-report.json
          if-no-files-found: warn
          retention-days: 7
