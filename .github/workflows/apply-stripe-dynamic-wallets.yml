name: Apply Stripe dynamic payment methods

on:
  push:
    branches:
      - feat/stripe-dynamic-wallets-20260716

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/stripe-dynamic-wallets-20260716
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply payment-method integration
        shell: python
        run: |
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str) -> None:
              file_path = Path(path)
              source = file_path.read_text()
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match in {path}, found {count}: {old!r}")
              file_path.write_text(source.replace(old, new))

          replace_exact(
              "src/lib/payments/conditional-mandates.ts",
              '      payment_method_types: ["card"],\n',
              '      // Stripe dynamically selects eligible Dashboard-enabled methods for this setup flow.\n'
              '      // Card wallets, Link, and PayPal appear only when supported for the account and flow.\n',
          )
          replace_exact(
              "src/lib/payments/conditional-mandates.ts",
              "Your card will not be charged now.",
              "Your selected payment method will not be charged now.",
          )

          replace_exact(
              "src/app/donation-offsets/payments/page.tsx",
              '    "Save a payment method, inspect frozen donation-offset conditions, and monitor compensated settlement.",',
              '    "Save an eligible payment method through Stripe Checkout, inspect frozen donation-offset conditions, and monitor compensated settlement.",',
          )
          replace_exact(
              "src/app/donation-offsets/payments/page.tsx",
              '          description="Moral Trade saves a Stripe payment method without charging it. When both participants have matching mandates and the reviewed terms are unchanged, the platform charges each side off-session and transfers both amounts to the approved destination. If paired capture or transfer fails, successful charges are reversed or refunded."',
              '          description="Stripe Checkout dynamically offers Card, Apple Pay, Google Pay, and Link when eligible; PayPal appears only for supported Stripe account regions and flows. Moral Trade saves the selected method without charging it. When both participants have matching mandates and the reviewed terms are unchanged, the platform charges each side off-session and transfers both amounts to the approved destination. If paired capture or transfer fails, successful charges are reversed or refunded."',
          )
          replace_exact(
              "src/app/donation-offsets/payments/page.tsx",
              '            <article className="panel concept-card">\n              <h3>No charge at setup</h3>',
              '            <article className="panel concept-card">\n'
              '              <h3>Methods selected by Stripe</h3>\n'
              '              <p>\n'
              '                Card, Apple Pay, Google Pay, and Link appear when eligible. PayPal requires a\n'
              '                supported Stripe account region and, for Connect, Stripe approval.\n'
              '              </p>\n'
              '            </article>\n'
              '            <article className="panel concept-card">\n'
              '              <h3>No charge at setup</h3>',
          )
          replace_exact(
              "src/app/donation-offsets/payments/page.tsx",
              "Card networks cannot make two independent charges and two transfers one database",
              "Payment networks cannot make two independent charges and two transfers one database",
          )

          replace_exact(
              ".env.example",
              "STRIPE_WEBHOOK_SECRET=\n",
              "STRIPE_WEBHOOK_SECRET=\n"
              "# Stripe-hosted Checkout uses Dashboard-managed dynamic payment methods. Keep cards and\n"
              "# Link enabled; Apple Pay and Google Pay appear as eligible card wallets. PayPal requires\n"
              "# an eligible Stripe account region and Stripe approval for Connect marketplace use.\n",
          )

          Path("src/lib/payments/checkout-payment-methods.test.ts").write_text('''import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          import test from "node:test";

          const mandates = readFileSync("src/lib/payments/conditional-mandates.ts", "utf8");
          const workspace = readFileSync("src/app/donation-offsets/payments/page.tsx", "utf8");
          const environmentExample = readFileSync(".env.example", "utf8");

          test("Stripe Checkout uses dynamic payment methods instead of a card-only allow-list", () => {
            assert.match(mandates, /mode: "setup"/);
            assert.doesNotMatch(mandates, /payment_method_types\s*:/);
            assert.match(mandates, /Stripe dynamically selects eligible Dashboard-enabled methods/);
            assert.match(mandates, /Your selected payment method will not be charged now/);
          });

          test("the payment workspace accurately discloses wallet and PayPal eligibility", () => {
            assert.match(workspace, /Card, Apple Pay, Google Pay, and Link when eligible/);
            assert.match(workspace, /PayPal appears only for supported Stripe account regions and flows/);
            assert.match(workspace, /PayPal requires a[\s\S]*supported Stripe account region/);
            assert.match(environmentExample, /Dashboard-managed dynamic payment methods/);
          });

          test("live money remains fail-closed by default", () => {
            assert.match(environmentExample, /CONDITIONAL_PAYMENTS_MODE=disabled/);
            assert.match(environmentExample, /MPGF_REAL_MONEY_ENABLED=false/);
            assert.match(environmentExample, /MPGF_REAL_MONEY_ACCEPTANCE_ENABLED=false/);
          });
          '''.replace("          ", ""))

          Path("docs/stripe-checkout-payment-methods.md").write_text('''# Stripe-hosted payment methods

          ## Status

          Moral Trade delegates payment-method selection to Stripe-hosted Checkout. The application no longer sends a card-only `payment_method_types` allow-list for conditional payment authorization.

          Stripe can therefore display the methods enabled in the Stripe Dashboard that are eligible for the customer, account country, currency, device, and Checkout mode. The intended set is:

          - Card
          - Apple Pay, surfaced as an eligible card wallet
          - Google Pay, surfaced as an eligible card wallet
          - Link
          - PayPal, only where the Stripe account region and Connect configuration support it

          The conditional authorization flow remains a Checkout Session in `setup` mode. It saves the selected reusable method without charging it. Authoritative payment state continues to come from signed Stripe webhooks, and later settlement remains subject to the existing condition hash, idempotency, refund, transfer, destination, and operational-readiness gates.

          ## Dashboard activation

          1. Enable Cards and Link in Stripe payment-method settings.
          2. Leave dynamic payment methods enabled so Stripe can choose eligible methods per session.
          3. Test Apple Pay on an eligible Apple device and browser, and Google Pay on an eligible browser/device profile.
          4. Request PayPal activation only for a Stripe account in a supported region. Connect marketplace use also requires Stripe approval.
          5. Exercise SetupIntent success/failure, signed-webhook replay, off-session capture, refund, dispute, and Connect transfer paths in test mode before changing any live gate.

          ## Current live-money boundary

          `CONDITIONAL_PAYMENTS_MODE` remains `disabled` by default, and the existing live acceptance gates remain fail-closed. This deployment does not claim that a Hong Kong Stripe account can offer PayPal through Stripe, does not enable live money, and does not alter the separate Every.org donation handoff.
          '''.replace("          ", ""))

          Path(".github/workflows/apply-stripe-dynamic-wallets.yml").unlink()

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Build production application
        run: npm run build

      - name: Commit verified implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Enable Stripe dynamic payment methods"
          git push origin HEAD:feat/stripe-dynamic-wallets-20260716
