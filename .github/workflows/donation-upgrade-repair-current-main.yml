# Temporary migration repair. Remove before merge.
name: Repair Donation Upgrade destination-review migration

on:
  push:
    branches:
      - feature/donation-upgrade-approved-fallbacks-20260731
    paths:
      - .github/workflows/donation-upgrade-repair-current-main.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/donation-upgrade-repair-current-main.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: donation-upgrade-destination-review-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/donation-upgrade-approved-fallbacks-20260731
          fetch-depth: 0

      - name: Remove the duplicated truncated function block
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('supabase/migrations/20260731084000_donation_upgrade_destination_review_and_gate_evidence.sql')
          text = path.read_text()
          marker = 'create or replace function public.submit_conditional_payment_destination_request('
          positions = []
          start = 0
          while True:
              index = text.find(marker, start)
              if index < 0:
                  break
              positions.append(index)
              start = index + len(marker)
          if len(positions) != 2:
              raise SystemExit(f'Expected exactly two submit-function markers before repair, found {len(positions)}')
          text = text[:positions[0]] + text[positions[1]:]
          text = text.replace("'environment', p_environm,", "'environment', p_environment,")
          path.write_text(text)

          repaired = path.read_text()
          assertions = {
              marker: 1,
              'create or replace function public.guard_conditional_destination_request_identity()': 1,
              'create or replace function public.prevent_conditional_destination_review_event_mutation()': 1,
              'create or replace function public.review_conditional_payment_destination_request(': 1,
              'create or replace function public.review_trade_donation_pool_gate(': 1,
              "'schemaVersion', 'conditional-payment-destination-identity-v1'": 1,
              "'environment', p_environment,": 1,
          }
          for needle, expected in assertions.items():
              actual = repaired.count(needle)
              if actual != expected:
                  raise SystemExit(f'Expected {expected} occurrences of {needle!r}, found {actual}')
          for forbidden in ('conditional-payment-destination-_at', 'p_environm,'):
              if forbidden in repaired:
                  raise SystemExit(f'Corruption marker remains: {forbidden}')
          if not repaired.endswith('\n'):
              raise SystemExit('Migration must end with a newline')
          PY
          git diff --check
          sha256sum supabase/migrations/20260731084000_donation_upgrade_destination_review_and_gate_evidence.sql

      - name: Commit repaired migration
        shell: bash
        run: |
          set -euo pipefail
          git add supabase/migrations/20260731084000_donation_upgrade_destination_review_and_gate_evidence.sql
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Repair Donation Upgrade destination-review migration"
          git push origin HEAD:feature/donation-upgrade-approved-fallbacks-20260731
