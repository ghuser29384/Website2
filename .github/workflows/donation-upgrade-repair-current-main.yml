# Temporary migration materializer. Remove before merge.
name: Materialize Donation Upgrade destination-review migration

on:
  push:
    branches:
      - feature/donation-upgrade-approved-fallbacks-20260731
    paths:
      - .github/workflows/donation-upgrade-repair-current-main.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/donation-upgrade-repair-current-main.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: donation-upgrade-destination-review-materializer
  cancel-in-progress: false

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/donation-upgrade-approved-fallbacks-20260731
          fetch-depth: 0

      - name: Reconstruct and verify the migration
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t chunks < <(find .github/donation-upgrade-followup-payload -maxdepth 1 -type f -name 'chunk-*' | sort)
          test "${#chunks[@]}" -eq 5
          cat "${chunks[@]}" | base64 --decode > supabase/migrations/20260731084000_donation_upgrade_destination_review_and_gate_evidence.sql
          echo "eaafc865fccdd20d307b9959828804a3777eb6ba8fb020a78916688b49e6c243  supabase/migrations/20260731084000_donation_upgrade_destination_review_and_gate_evidence.sql" | sha256sum --check --strict
          grep -F "create table if not exists public.conditional_payment_destination_requests" supabase/migrations/20260731084000_donation_upgrade_destination_review_and_gate_evidence.sql
          grep -F "create or replace function public.review_trade_donation_pool_gate" supabase/migrations/20260731084000_donation_upgrade_destination_review_and_gate_evidence.sql
          git diff --check

      - name: Commit exact migration
        shell: bash
        run: |
          set -euo pipefail
          git add supabase/migrations/20260731084000_donation_upgrade_destination_review_and_gate_evidence.sql
          if git diff --cached --quiet; then
            echo "Migration already materialized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add Donation Upgrade destination review and gate evidence"
          git push origin HEAD:feature/donation-upgrade-approved-fallbacks-20260731
