# One-use release-candidate cleanup. This workflow removes itself.
name: Finalize Donation Upgrade release-candidate hygiene

on:
  push:
    branches:
      - feature/donation-upgrade-approved-fallbacks-20260731
    paths:
      - .github/workflows/donation-upgrade-repair-current-main.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: donation-upgrade-release-candidate-hygiene
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/donation-upgrade-approved-fallbacks-20260731
          fetch-depth: 0

      - name: Verify current-main integration and materialized migrations
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git merge-base origin/main HEAD)" = "$(git rev-parse origin/main)"
          test "$(git hash-object supabase/migrations/20260725152000_cross_user_pooled_trade_donations.sql)" = "c3900dfa480da614a18e8b1b4f298b15780c3377"
          test "$(git hash-object supabase/migrations/20260731084000_donation_upgrade_destination_review_and_gate_evidence.sql)" = "ba97544e190b533473d0d12f2e276b3f81fe38c8"
          test "$(grep -cF 'create or replace function public.submit_conditional_payment_destination_request(' supabase/migrations/20260731084000_donation_upgrade_destination_review_and_gate_evidence.sql)" = "1"
          test "$(grep -cF 'create or replace function public.review_trade_donation_pool_gate(' supabase/migrations/20260731084000_donation_upgrade_destination_review_and_gate_evidence.sql)" = "1"

      - name: Install permanent pooled-settlement PR gate and remove one-use infrastructure
        shell: bash
        run: |
          set -euo pipefail
          cat > .github/workflows/donation-upgrade-final-gates.yml <<'YAML'
          name: Pooled donation settlement gates

          on:
            pull_request:
              branches:
                - main
              paths:
                - .env.example
                - docs/trade-donation-pooled-settlement-runbook.md
                - src/app/admin/trade-donation-pools/**
                - src/app/api/connectors/every-org/**
                - src/app/api/stripe/webhook/route.ts
                - src/app/trade-donation-actions-base.ts
                - src/app/trade-donation-pool-actions.ts
                - src/components/core-trade/trade-agreement-stage.tsx
                - src/components/core-trade/trade-donation-agreement-stage.tsx
                - src/components/core-trade/trade-donation-pool-agreement-stage.tsx
                - src/lib/payments/trade-donation-pool-webhook.ts
                - src/lib/trade-donation-pool*.ts
                - supabase/migrations/20260725152000_cross_user_pooled_trade_donations.sql
                - supabase/migrations/20260731084000_donation_upgrade_destination_review_and_gate_evidence.sql
                - .github/workflows/donation-upgrade-final-gates.yml
            workflow_dispatch:

          permissions:
            contents: read

          concurrency:
            group: pooled-donation-settlement-gates-${{ github.event.pull_request.number || github.ref }}
            cancel-in-progress: true

          jobs:
            validate:
              runs-on: ubuntu-24.04
              timeout-minutes: 90
              steps:
                - uses: actions/checkout@v4
                  with:
                    fetch-depth: 0

                - uses: actions/setup-node@v4
                  with:
                    node-version: 24
                    cache: npm

                - name: Install exact dependencies
                  run: npm ci

                - name: Focused pooled-settlement tests
                  run: node --import tsx --test src/lib/trade-donation-pool.test.ts src/lib/trade-donation-pool-source-contract.test.ts

                - name: Complete repository tests
                  run: npm test

                - name: Absolute TypeScript gate
                  run: npx tsc --noEmit

                - name: Absolute ESLint gate
                  run: npm run lint

                - name: Production build with money movement disabled
                  env:
                    NEXT_PUBLIC_SITE_URL: https://www.moraltrade.org
                    VERCEL: "1"
                    VERCEL_ENV: preview
                    CONDITIONAL_PAYMENTS_MODE: disabled
                    TRADE_DONATION_POOL_MODE: disabled
                    TRADE_DONATION_POOL_ENABLED: "false"
                  run: npm run build

                - name: Migration integrity and exact diff hygiene
                  shell: bash
                  run: |
                    set -euo pipefail
                    test "$(grep -cF 'create or replace function public.submit_conditional_payment_destination_request(' supabase/migrations/20260731084000_donation_upgrade_destination_review_and_gate_evidence.sql)" = "1"
                    test "$(grep -cF 'create or replace function public.review_trade_donation_pool_gate(' supabase/migrations/20260731084000_donation_upgrade_destination_review_and_gate_evidence.sql)" = "1"
                    ! grep -F 'conditional-payment-destination-_at' supabase/migrations/20260731084000_donation_upgrade_destination_review_and_gate_evidence.sql
                    ! grep -F 'p_environm,' supabase/migrations/20260731084000_donation_upgrade_destination_review_and_gate_evidence.sql
                    git fetch origin main
                    git diff --check "$(git merge-base origin/main HEAD)"...HEAD
          YAML

          git rm -f \
            .github/donation-upgrade-final-gate-trigger.txt \
            .github/donation-upgrade-followup-payload/chunk-00 \
            .github/donation-upgrade-followup-payload/chunk-01 \
            .github/donation-upgrade-followup-payload/chunk-02 \
            .github/donation-upgrade-followup-payload/chunk-03 \
            .github/donation-upgrade-followup-payload/chunk-04 \
            .github/workflows/donation-upgrade-materialize-current-main.yml \
            .github/workflows/export-donation-upgrade-candidate.yml \
            .github/workflows/donation-upgrade-repair-current-main.yml

          git add .github/workflows/donation-upgrade-final-gates.yml
          git diff --check

          remaining="$(git diff --cached --name-only | sort)"
          expected="$(cat <<'FILES' | sort
          .github/donation-upgrade-final-gate-trigger.txt
          .github/donation-upgrade-followup-payload/chunk-00
          .github/donation-upgrade-followup-payload/chunk-01
          .github/donation-upgrade-followup-payload/chunk-02
          .github/donation-upgrade-followup-payload/chunk-03
          .github/donation-upgrade-followup-payload/chunk-04
          .github/workflows/donation-upgrade-final-gates.yml
          .github/workflows/donation-upgrade-materialize-current-main.yml
          .github/workflows/donation-upgrade-repair-current-main.yml
          .github/workflows/export-donation-upgrade-candidate.yml
          FILES
          )"
          test "$remaining" = "$expected"

      - name: Commit final hygiene delta
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Finalize Donation Upgrade release-candidate hygiene"
          git push origin HEAD:feature/donation-upgrade-approved-fallbacks-20260731
