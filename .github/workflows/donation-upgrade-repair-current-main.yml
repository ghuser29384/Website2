# Temporary exact-branch TypeScript repair. Remove before merge.
name: Repair Donation Upgrade route typing

on:
  push:
    branches:
      - feature/donation-upgrade-approved-fallbacks-20260731
    paths:
      - .github/workflows/donation-upgrade-repair-current-main.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: donation-upgrade-route-typing-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/donation-upgrade-approved-fallbacks-20260731
          fetch-depth: 0

      - name: Type the footer route list as strings
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("src/lib/public-route-smoke.test.ts")
          text = path.read_text()
          old = '  const footerHrefs = FOOTER_LINK_GROUPS.flatMap((group) => group.links.map((link) => link.href));\n'
          new = '''  const footerHrefs: string[] = FOOTER_LINK_GROUPS.flatMap((group) =>
            group.links.map((link) => String(link.href)),
          );
          '''
          if old in text:
              if text.count(old) != 1:
                  raise SystemExit("Unexpected footer route declaration count")
              path.write_text(text.replace(old, new, 1))
          elif new not in text:
              raise SystemExit("Footer route declaration does not match either expected state")
          PY
          git diff --check

      - name: Commit the repair
        shell: bash
        run: |
          set -euo pipefail
          git add src/lib/public-route-smoke.test.ts
          if git diff --cached --quiet; then
            echo "Repair already present."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Type public footer routes as strings"
          git push origin HEAD:feature/donation-upgrade-approved-fallbacks-20260731
