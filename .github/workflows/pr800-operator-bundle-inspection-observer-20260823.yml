name: PR800 operator bundle inspection observer

on:
  push:
    branches:
      - ops/pr800-operator-bundle-inspection-observer-20260823
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_WORKFLOW: pr800-operator-bundle-inspection-20260823.yml
      TARGET_BRANCH: ops/pr800-operator-bundle-inspection-20260823
    steps:
      - name: Observe latest inventory run
        shell: bash
        run: |
          set -euo pipefail
          latest=''
          for attempt in $(seq 1 60); do
            response="$(gh api --method GET \
              "repos/$GITHUB_REPOSITORY/actions/workflows/$TARGET_WORKFLOW/runs" \
              -f branch="$TARGET_BRANCH" \
              -f per_page=10)"
            latest="$(jq -c '.workflow_runs | sort_by(.created_at) | reverse | .[0] // empty' <<<"$response")"
            if [[ -n "$latest" ]] && [[ "$(jq -r '.status' <<<"$latest")" = completed ]]; then
              break
            fi
            sleep 15
          done
          test -n "$latest"
          run_id="$(jq -r '.id' <<<"$latest")"
          status="$(jq -r '.status' <<<"$latest")"
          conclusion="$(jq -r '.conclusion // "none"' <<<"$latest")"
          html_url="$(jq -r '.html_url' <<<"$latest")"
          body="<!-- pr800-operator-bundle-inspection-observer -->
          PR #800 operator transport inventory: run \`$run_id\`, status \`$status\`, conclusion \`$conclusion\`: $html_url"
          gh issue comment 709 --repo "$GITHUB_REPOSITORY" --body "$body"
          test "$status" = completed
          test "$conclusion" = success
