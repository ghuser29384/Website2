name: Diagnose Profile release browser failure
on:
  push:
    branches: [ops/profile-account-release-20260926]
    paths: [.github/workflows/profile-account-release-log.yml]
permissions:
  actions: read
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const repo = { owner: 'ghuser29384', repo: 'Website2' };
            const run = (await github.rest.actions.getWorkflowRun({ ...repo, run_id: 36211503829 })).data;
            if (run.head_sha !== 'e24a91d848d595f68d668da7386d6fd810760afa' || run.conclusion !== 'failure') throw new Error('Unexpected release identity');
            const response = await github.rest.actions.downloadJobLogsForWorkflowRun({ ...repo, job_id: 108318846654 });
            const text = typeof response.data === 'string' ? response.data : Buffer.from(response.data).toString('utf8');
            const lines = text.split('\n');
            const start = lines.findIndex(line => line.includes('Run complete rendered browser gate'));
            const excerpt = lines.slice(start >= 0 ? start : -1000).join('\n');
            fs.mkdirSync(process.env.RUNNER_TEMP + '/profile-release-diagnosis', { recursive: true });
            fs.writeFileSync(process.env.RUNNER_TEMP + '/profile-release-diagnosis/browser-gate.log', excerpt);
            fs.writeFileSync(process.env.RUNNER_TEMP + '/profile-release-diagnosis/identity.json', JSON.stringify({ sourceSha: run.head_sha, runId: run.id, jobId: 108318846654, conclusion: run.conclusion }, null, 2));
      - uses: actions/upload-artifact@v4
        with:
          name: profile-release-browser-failure-36211503829
          path: ${{ runner.temp }}/profile-release-diagnosis
          retention-days: 7
