name: Gated Vercel release

on:
  workflow_dispatch:
    inputs:
      target:
        description: Deployment environment
        required: true
        type: choice
        options:
          - preview
          - production
      ref:
        description: Exact approved branch to release
        required: true
        type: string
        default: main
      expected_sha:
        description: Full 40-character commit SHA proved by the repository gates
        required: true
        type: string
      validation_runs:
        description: Compact JSON array of successful exact-head validation workflow runs
        required: true
        type: string

permissions:
  actions: read
  checks: read
  contents: read
  statuses: read

concurrency:
  group: gated-vercel-${{ inputs.target }}
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: team_ySu6sF3Uho1E1GnJtCQPVEuJ
  VERCEL_PROJECT_ID: prj_Em3j7Uj7RatX2R1ZYhla3XSHRde7
  RELEASE_PREVIEW_BRANCH: release/vercel-preview
  VERCEL_CLI_VERSION: 50.38.1

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Check out the exact approved candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Guard repository, branch, and immutable candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'ghuser29384/Website2'
          test "${{ inputs.expected_sha }}" = "$(git rev-parse HEAD)"
          test "${#EXPECTED_SHA}" -eq 40
          remote_sha="$(git ls-remote origin "refs/heads/${{ inputs.ref }}" | awk '{print $1}')"
          test "$remote_sha" = "${{ inputs.expected_sha }}"

          case "${{ inputs.target }}" in
            production)
              test "${{ inputs.ref }}" = 'main'
              ;;
            preview)
              test "${{ inputs.ref }}" = "$RELEASE_PREVIEW_BRANCH"
              ;;
            *)
              echo 'Unsupported release target.' >&2
              exit 1
              ;;
          esac

          git diff --check HEAD^
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}

      - name: Require successful exact-head validation runs
        id: validations
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          GH_TOKEN: ${{ github.token }}
          VALIDATION_RUNS: ${{ inputs.validation_runs }}
        run: |
          set -euo pipefail
          requirements_file="$RUNNER_TEMP/release-validation-requirements.json"
          readback_file="$RUNNER_TEMP/release-validation-readback.ndjson"
          evidence_file="$RUNNER_TEMP/release-validation-evidence.json"

          printf '%s' "$VALIDATION_RUNS" \
            | jq -e '
                type == "array"
                and length >= 3
                and all(.[];
                  type == "object"
                  and ((keys | sort) == ["gate", "id", "workflow"])
                  and (.id | type == "number" and . > 0 and . == floor)
                  and (.workflow | type == "string" and length > 0)
                  and (.gate
                    | type == "string"
                    and test("^(classification|engineering|rendered|database|compatibility|security)$"))
                )
                and (([.[].id] | length) == ([.[].id] | unique | length))
                and ((["classification", "engineering", "rendered"] - [.[].gate]) | length == 0)
              ' > "$requirements_file"

          : > "$readback_file"
          while IFS= read -r requirement; do
            run_id="$(jq -r '.id' <<<"$requirement")"
            expected_workflow="$(jq -r '.workflow' <<<"$requirement")"
            gate="$(jq -r '.gate' <<<"$requirement")"
            run_json="$(gh api \
              -H 'Accept: application/vnd.github+json' \
              "repos/$GITHUB_REPOSITORY/actions/runs/$run_id")"

            actual_repository="$(jq -r '.repository.full_name // ""' <<<"$run_json")"
            actual_head_repository="$(jq -r '.head_repository.full_name // .repository.full_name // ""' <<<"$run_json")"
            actual_sha="$(jq -r '.head_sha // ""' <<<"$run_json")"
            actual_workflow="$(jq -r '.name // ""' <<<"$run_json")"
            actual_status="$(jq -r '.status // ""' <<<"$run_json")"
            actual_conclusion="$(jq -r '.conclusion // ""' <<<"$run_json")"
            actual_event="$(jq -r '.event // ""' <<<"$run_json")"
            actual_attempt="$(jq -r '.run_attempt // 1' <<<"$run_json")"
            actual_url="$(jq -r '.html_url // ""' <<<"$run_json")"

            test "$actual_repository" = "$GITHUB_REPOSITORY"
            test "$actual_head_repository" = "$GITHUB_REPOSITORY"
            test "$actual_sha" = "$EXPECTED_SHA"
            test "$actual_workflow" = "$expected_workflow"
            test "$actual_status" = 'completed'
            test "$actual_conclusion" = 'success'
            case "$actual_event" in
              pull_request|push|workflow_dispatch)
                ;;
              *)
                echo "Unsupported validation event for run $run_id: $actual_event" >&2
                exit 1
                ;;
            esac

            jq -n \
              --arg gate "$gate" \
              --arg workflow "$actual_workflow" \
              --arg sha "$actual_sha" \
              --arg event "$actual_event" \
              --arg url "$actual_url" \
              --argjson id "$run_id" \
              --argjson attempt "$actual_attempt" \
              '{
                gate: $gate,
                workflow: $workflow,
                id: $id,
                attempt: $attempt,
                headSha: $sha,
                event: $event,
                conclusion: "success",
                url: $url
              }' >> "$readback_file"
          done < <(jq -c '.[]' "$requirements_file")

          jq -s 'sort_by(.gate, .workflow, .id)' "$readback_file" > "$evidence_file"
          test "$(jq 'length' "$evidence_file")" = "$(jq 'length' "$requirements_file")"
          echo "evidence_file=$evidence_file" >> "$GITHUB_OUTPUT"

          {
            echo '### Exact-head validation evidence'
            echo
            jq -r '.[] | "- \(.gate): \(.workflow) run `\(.id)` (attempt \(.attempt))"' "$evidence_file"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload exact-head validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: gated-vercel-validation-${{ github.run_id }}
          path: ${{ steps.validations.outputs.evidence_file }}
          if-no-files-found: error
          retention-days: 30

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Run complete repository quality gates
        shell: bash
        env:
          NEXT_PUBLIC_SITE_URL: https://www.moraltrade.org
          SITE_URL: https://www.moraltrade.org
          VERCEL: '1'
          VERCEL_ENV: ${{ inputs.target }}
        run: |
          set -euo pipefail
          npm test
          npm run lint -- --quiet
          npx tsc --noEmit
          npm run build

      - name: Link only the canonical Vercel project
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' \
            "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json

      - name: Pull exact deployment environment
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes "vercel@$VERCEL_CLI_VERSION" pull \
            --yes \
            --environment="${{ inputs.target }}" \
            --token="$VERCEL_TOKEN"

      - name: Build the Vercel artifact on GitHub Actions compute
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          if [[ '${{ inputs.target }}' == 'production' ]]; then
            npx --yes "vercel@$VERCEL_CLI_VERSION" build \
              --prod \
              --token="$VERCEL_TOKEN"
          else
            npx --yes "vercel@$VERCEL_CLI_VERSION" build \
              --token="$VERCEL_TOKEN"
          fi

      - name: Upload the already-built artifact exactly once
        id: deploy
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          if [[ '${{ inputs.target }}' == 'production' ]]; then
            deployment_url="$(npx --yes "vercel@$VERCEL_CLI_VERSION" deploy \
              --prebuilt \
              --prod \
              --token="$VERCEL_TOKEN")"
          else
            deployment_url="$(npx --yes "vercel@$VERCEL_CLI_VERSION" deploy \
              --prebuilt \
              --token="$VERCEL_TOKEN")"
          fi
          test -n "$deployment_url"
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"
          printf 'Deployment URL: %s\n' "$deployment_url"

      - name: Record immutable release evidence
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '### Gated Vercel release'
            echo
            echo "- Target: \`${{ inputs.target }}\`"
            echo "- Ref: \`${{ inputs.ref }}\`"
            echo "- Commit: \`${{ inputs.expected_sha }}\`"
            echo "- Project: \`$VERCEL_PROJECT_ID\`"
            echo "- Deployment: ${{ steps.deploy.outputs.deployment_url }}"
            echo '- Build location: GitHub Actions (`vercel build` + `vercel deploy --prebuilt`)'
            echo '- Exact-head validation evidence: `gated-vercel-validation-${{ github.run_id }}`'
          } >> "$GITHUB_STEP_SUMMARY"
