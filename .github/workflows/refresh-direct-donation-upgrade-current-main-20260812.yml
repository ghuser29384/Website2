name: Refresh direct Donation Upgrade onto current main

on:
  push:
    branches:
      - integration/direct-donation-upgrade-current-main-20260807
    paths:
      - .github/workflows/refresh-direct-donation-upgrade-current-main-20260812.yml

permissions:
  contents: write

concurrency:
  group: refresh-direct-donation-upgrade-current-main-20260812
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: integration/direct-donation-upgrade-current-main-20260807
          fetch-depth: 0
          persist-credentials: true

      - name: Merge exact current main and remove one-use workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ghuser29384"
          git config user.email "262476329+ghuser29384@users.noreply.github.com"
          git fetch origin main
          echo "main=$(git rev-parse origin/main)"
          echo "before=$(git rev-parse HEAD)"
          git merge --no-edit origin/main
          git rm .github/workflows/refresh-direct-donation-upgrade-current-main-20260812.yml
          git commit -m "Remove one-use Donation Upgrade refresh workflow"
          git push origin HEAD:integration/direct-donation-upgrade-current-main-20260807
          echo "after=$(git rev-parse HEAD)"
