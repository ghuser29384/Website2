name: PR 212 final-gate status snapshot

on:
  push:
    branches:
      - agent/pr212-final-status-20260731
    paths:
      - .github/workflows/pr212-final-gate-status-snapshot.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Snapshot exact target workflow status
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ops/pr212-integrated-final-gate-snapshot
          gh run list --repo "$GITHUB_REPOSITORY" --workflow pr212-integrated-final-gate.yml --branch agent/pr212-main-integration-ops-20260730 --limit 50 --json databaseId,headSha,status,conclusion,createdAt,url > ops/pr212-integrated-final-gate-snapshot/runs.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops/pr212-integrated-final-gate-snapshot/runs.json
          git commit -m "Snapshot PR 212 integrated final gate"
          git push origin HEAD:agent/pr212-final-status-20260731
