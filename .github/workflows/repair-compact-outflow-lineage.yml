name: Repair Compact outflow lineage

on:
  push:
    branches:
      - feature/compact-authoritative-outflow-ledger-v1-20260816
    paths:
      - .github/workflows/repair-compact-outflow-lineage.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
      - name: Make supersession lineage explicit and deterministic
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          query_pattern = re.compile(
              r"(?P<indent>\s*)select obligation\.id into supersedes_obligation_id\n"
              r"(?P=indent)from public\.mpgf_public_goods_obligation_snapshots obligation\n"
              r"(?P=indent)where obligation\.participant_id = p_participant_id\n"
              r"(?P=indent)  and obligation\.cycle_key = p_cycle_key\n"
              r"(?P=indent)order by obligation\.frozen_at desc, obligation\.id desc limit 1;"
          )
          for name in [
              'supabase/migrations/20260816141501_compact_authoritative_outflow_freeze_v1.sql',
              'supabase/migrations/20260816141502_compact_authoritative_outflow_hardening_v1.sql',
          ]:
              path = Path(name)
              source = path.read_text(encoding='utf-8')
              matches = list(query_pattern.finditer(source))
              if len(matches) != 1:
                  raise SystemExit(f'{name}: expected one supersession query, found {len(matches)}')
              match = matches[0]
              indent = match.group('indent')
              replacement = (
                  f'{indent}select obligation.id into supersedes_obligation_id\n'
                  f'{indent}from public.mpgf_public_goods_obligation_snapshots obligation\n'
                  f'{indent}where obligation.participant_id = p_participant_id\n'
                  f'{indent}  and obligation.cycle_key = p_cycle_key\n'
                  f'{indent}  and not exists (\n'
                  f'{indent}    select 1\n'
                  f'{indent}    from public.mpgf_public_goods_obligation_snapshots successor\n'
                  f'{indent}    where successor.supersedes_id = obligation.id\n'
                  f'{indent}  )\n'
                  f'{indent}order by obligation.frozen_at desc, obligation.id desc limit 1;'
              )
              path.write_text(query_pattern.sub(replacement, source, count=1), encoding='utf-8')

          test_path = Path('supabase/tests/compact_authoritative_outflow_ledger_core.sql')
          test_source = test_path.read_text(encoding='utf-8')
          for diagnostic in [
              '\\set VERBOSITY verbose\n',
              '\\echo ledger-core:start\n',
              '\\echo ledger-core:auth-users-inserted\n',
              '\\echo ledger-core:profiles-inserted\n',
          ]:
              test_source = test_source.replace(diagnostic, '')
          start = test_source.index("do $test$\ndeclare result jsonb; latest public.mpgf_public_goods_obligation_snapshots%rowtype;\nbegin\n  result := public.freeze_mpgf_public_goods_financial_cycle_v2(\n    '6b000000-0000-4000-8000-000000000001','2026-08'\n  );\n  if (result->>'eligibleNetSettledOutflowCents')::bigint <> 8000")
          end = test_source.index('$test$;', start) + len('$test$;')
          replacement = """do $test$
declare
  result jsonb;
  latest public.mpgf_public_goods_obligation_snapshots%rowtype;
  leaf_count integer;
begin
  result := public.freeze_mpgf_public_goods_financial_cycle_v2(
    '6b000000-0000-4000-8000-000000000001','2026-08'
  );
  if (result->>'eligibleNetSettledOutflowCents')::bigint <> 8000
     or (result->>'obligationCents')::bigint <> 800 then
    raise exception 'Late adjustment was not reflected in the superseding amount: %', result;
  end if;
  select count(*)::integer into leaf_count
  from public.mpgf_public_goods_obligation_snapshots obligation
  where obligation.participant_id='6b000000-0000-4000-8000-000000000001'
    and obligation.cycle_key='2026-08'
    and not exists (
      select 1 from public.mpgf_public_goods_obligation_snapshots successor
      where successor.supersedes_id = obligation.id
    );
  if leaf_count <> 1 then
    raise exception 'Obligation supersession produced % current leaves instead of one.', leaf_count;
  end if;
  select * into latest
  from public.mpgf_public_goods_obligation_snapshots obligation
  where obligation.participant_id='6b000000-0000-4000-8000-000000000001'
    and obligation.cycle_key='2026-08'
    and not exists (
      select 1 from public.mpgf_public_goods_obligation_snapshots successor
      where successor.supersedes_id = obligation.id
    );
  if latest.supersedes_id is null then
    raise exception 'Late adjustment did not preserve explicit obligation supersession.';
  end if;
end;
$test$;"""
          test_path.write_text(test_source[:start] + replacement + test_source[end:], encoding='utf-8')
          PY
          git diff --check
          ! grep -q 'ledger-core:' supabase/tests/compact_authoritative_outflow_ledger_core.sql
          grep -q 'successor.supersedes_id = obligation.id' supabase/migrations/20260816141502_compact_authoritative_outflow_hardening_v1.sql
      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            supabase/migrations/20260816141501_compact_authoritative_outflow_freeze_v1.sql \
            supabase/migrations/20260816141502_compact_authoritative_outflow_hardening_v1.sql \
            supabase/tests/compact_authoritative_outflow_ledger_core.sql
          git commit -m "fix: preserve Compact outflow obligation lineage"
          git push origin "HEAD:${GITHUB_REF_NAME}"
