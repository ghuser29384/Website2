name: One-time canonical Vercel Git disconnect

on:
  push:
    branches:
      - ops/vercel-canonical-git-disconnect-20260802
    paths:
      - .github/workflows/vercel-canonical-git-disconnect-once.yml

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: vercel-canonical-git-disconnect-once
  cancel-in-progress: false

env:
  CONTROLLER_PATH: .github/workflows/vercel-canonical-git-disconnect-once.yml
  CONTROLLER_BRANCH: ops/vercel-canonical-git-disconnect-20260802
  VERCEL_ORG_ID: team_ySu6sF3Uho1E1GnJtCQPVEuJ
  CANONICAL_PROJECT_ID: prj_Em3j7Uj7RatX2R1ZYhla3XSHRde7
  VERCEL_CLI_VERSION: 50.38.1
  PRODUCTION_BASE_URL: https://www.moraltrade.org

jobs:
  disconnect:
    if: github.repository == 'ghuser29384/Website2' && github.actor == 'ghuser29384'
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Check out exact operations commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          token: ${{ github.token }}

      - name: Guard exact one-file operations scope
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'ghuser29384/Website2'
          test "$GITHUB_REF" = "refs/heads/$CONTROLLER_BRANCH"
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          test -n "$VERCEL_TOKEN"
          changed="$(git diff-tree --no-commit-id --name-only -r HEAD | sed '/^$/d')"
          test "$changed" = "$CONTROLLER_PATH"

      - name: Remove the controller from its operations branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          blob_sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/$CONTROLLER_PATH?ref=$CONTROLLER_BRANCH" --jq .sha)"
          jq -n \
            --arg message 'Remove one-time canonical Vercel Git disconnect controller' \
            --arg sha "$blob_sha" \
            --arg branch "$CONTROLLER_BRANCH" \
            '{message:$message,sha:$sha,branch:$branch}' \
            | gh api --method DELETE \
                "repos/$GITHUB_REPOSITORY/contents/$CONTROLLER_PATH" \
                --input - >/dev/null

      - name: Capture redacted canonical project state before disconnect
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            --header 'Accept: application/json' \
            "https://api.vercel.com/v9/projects/$CANONICAL_PROJECT_ID?teamId=$VERCEL_ORG_ID" \
            > /tmp/canonical-before-raw.json
          jq '{
            id,
            name,
            live,
            link: (if .link == null then null else {type: .link.type, org: .link.org, repo: .link.repo, productionBranch: .link.productionBranch} end),
            domains: [.alias[]?.domain, .targets.production.alias[]?] | flatten | map(select(type == "string")) | unique,
            resourceConfig: {
              buildMachineType: .resourceConfig.buildMachineType,
              elasticConcurrencyEnabled: .resourceConfig.elasticConcurrencyEnabled,
              buildQueue: (.resourceConfig.buildQueue.configuration // .resourceConfig.buildQueue)
            }
          }' /tmp/canonical-before-raw.json > canonical-git-disconnect-before.json

      - name: Disconnect canonical project from GitHub automatic deployments
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          if jq -e '.link == null' canonical-git-disconnect-before.json >/dev/null; then
            echo 'Canonical project was already disconnected from Git.' | tee canonical-git-disconnect-command.log
          else
            mkdir -p .vercel
            printf '{"orgId":"%s","projectId":"%s"}\n' \
              "$VERCEL_ORG_ID" "$CANONICAL_PROJECT_ID" > .vercel/project.json
            printf 'y\n' | npx --yes "vercel@$VERCEL_CLI_VERSION" git disconnect \
              --token="$VERCEL_TOKEN" \
              --scope=ellen-s \
              2>&1 | tee canonical-git-disconnect-command.log
          fi

      - name: Verify disconnected low-cost canonical project state
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            --header 'Accept: application/json' \
            "https://api.vercel.com/v9/projects/$CANONICAL_PROJECT_ID?teamId=$VERCEL_ORG_ID" \
            > /tmp/canonical-after-raw.json
          jq '{
            id,
            name,
            live,
            link: (if .link == null then null else {type: .link.type, org: .link.org, repo: .link.repo, productionBranch: .link.productionBranch} end),
            domains: [.alias[]?.domain, .targets.production.alias[]?] | flatten | map(select(type == "string")) | unique,
            resourceConfig: {
              buildMachineType: .resourceConfig.buildMachineType,
              elasticConcurrencyEnabled: .resourceConfig.elasticConcurrencyEnabled,
              buildQueue: (.resourceConfig.buildQueue.configuration // .resourceConfig.buildQueue)
            }
          }' /tmp/canonical-after-raw.json > canonical-git-disconnect-after.json

          test "$(jq -r .id canonical-git-disconnect-after.json)" = "$CANONICAL_PROJECT_ID"
          test "$(jq -r .name canonical-git-disconnect-after.json)" = 'moraltrade-site'
          test "$(jq -r '.link == null' canonical-git-disconnect-after.json)" = 'true'
          test "$(jq -r .resourceConfig.buildMachineType canonical-git-disconnect-after.json)" = 'standard'
          test "$(jq -r .resourceConfig.buildQueue canonical-git-disconnect-after.json)" = 'WAIT_FOR_NAMESPACE_QUEUE'
          test "$(jq -r '.resourceConfig.elasticConcurrencyEnabled != true' canonical-git-disconnect-after.json)" = 'true'

      - name: Smoke-test canonical production and all commitments tabs
        shell: bash
        run: |
          set -euo pipefail
          : > canonical-git-disconnect-smoke.tsv
          deployment_id=''
          for entry in \
            '/|Moral Trade' \
            '/commitments|Additional resources you caused.' \
            '/commitments?tab=ledger|Ledger' \
            '/commitments?tab=completed|Completed' \
            '/commitments?tab=calendar|Calendar'
          do
            path="${entry%%|*}"
            marker="${entry#*|}"
            body="$(mktemp)"
            headers="$(mktemp)"
            ok=false
            for attempt in $(seq 1 20); do
              status="$(curl --silent --show-error --location \
                --output "$body" --dump-header "$headers" \
                --write-out '%{http_code}' \
                --max-time 20 \
                "$PRODUCTION_BASE_URL$path" || true)"
              if [[ "$status" == '200' ]] && grep -Fq "$marker" "$body"; then
                ok=true
                break
              fi
              sleep 5
            done
            test "$ok" = true
            current_id="$(sed -n 's/.*data-dpl-id="\([^"]*\)".*/\1/p' "$body" | head -n1)"
            test -n "$current_id"
            if [[ -z "$deployment_id" ]]; then
              deployment_id="$current_id"
            else
              test "$current_id" = "$deployment_id"
            fi
            printf '%s\t%s\t%s\t%s\n' "$path" "$status" "$current_id" "$marker" \
              >> canonical-git-disconnect-smoke.tsv
          done
          printf '%s\n' "$deployment_id" > canonical-git-disconnect-deployment-id.txt

      - name: Upload redacted disconnect and smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-vercel-git-disconnect-${{ github.run_id }}
          path: |
            canonical-git-disconnect-before.json
            canonical-git-disconnect-command.log
            canonical-git-disconnect-after.json
            canonical-git-disconnect-smoke.tsv
            canonical-git-disconnect-deployment-id.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Report outcome to Vercel control-plane PR
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [[ "${{ job.status }}" == 'success' ]]; then
            deployment_id="$(cat canonical-git-disconnect-deployment-id.txt)"
            gh pr comment 422 --repo "$GITHUB_REPOSITORY" --body "Post-payment recovery is verified and automatic Git deployment has been removed from the canonical project. moraltrade-site is Standard-build, namespace-queued, not elastically concurrent, Git-disconnected, and serving the canonical root plus Portfolio, Ledger, Completed, and Calendar routes from deployment \`$deployment_id\`. The manual exact-SHA GitHub Actions release workflow remains the only deployment path. Evidence: $run_url"
          else
            gh pr comment 422 --repo "$GITHUB_REPOSITORY" --body "The canonical Git-disconnect and post-payment smoke verification did not complete successfully. No final control-plane completion claim is made. Evidence: $run_url"
          fi

      - name: Enforce verified disconnect and production smoke
        if: always()
        shell: bash
        run: test "${{ job.status }}" = 'success'
