name: PR 658 pilot-route browser diagnostic

on:
  push:
    branches:
      - diag/pr658-pilot-route-browser-20260815

permissions:
  contents: read

concurrency:
  group: pr658-pilot-route-browser-diagnostic
  cancel-in-progress: false

env:
  EXPECTED_SHA: 75fd512e6cf82e2c51df53e211b854c0263109c3

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out the exact blocked production candidate
        uses: actions/checkout@v4
        with:
          ref: 75fd512e6cf82e2c51df53e211b854c0263109c3
          fetch-depth: 0

      - name: Prove immutable candidate and clean source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git status --porcelain)" = ""
          git diff --check HEAD^

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Build with the blocked release environment
        shell: bash
        env:
          NEXT_PUBLIC_SITE_URL: https://www.moraltrade.org
          SITE_URL: https://www.moraltrade.org
          VERCEL: '1'
          VERCEL_ENV: production
        run: |
          set -euo pipefail
          npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Create an ephemeral route-state diagnostic
        shell: bash
        run: |
          set -euo pipefail
          cat > tests/pr658-pilot-route-diagnostic.spec.ts <<'EOF'
          import { expect, test } from "@playwright/test";

          test("records the final /pilot route state", async ({ page }, testInfo) => {
            const documentResponses: Array<{
              status: number;
              url: string;
              headers: Record<string, string>;
            }> = [];

            page.on("response", async (response) => {
              const request = response.request();
              if (request.resourceType() !== "document") return;
              documentResponses.push({
                status: response.status(),
                url: response.url(),
                headers: await response.allHeaders(),
              });
            });

            await page.goto("/pilot", { waitUntil: "networkidle" });

            const state = {
              finalUrl: page.url(),
              title: await page.title(),
              h1: await page.locator("h1").allTextContents(),
              h2: await page.locator("h2").allTextContents(),
              bodyText: (await page.locator("body").innerText()).slice(0, 4000),
              documentResponses,
            };

            await testInfo.attach("route-state.json", {
              body: Buffer.from(JSON.stringify(state, null, 2)),
              contentType: "application/json",
            });
            await testInfo.attach("route-state.png", {
              body: await page.screenshot({ fullPage: true }),
              contentType: "image/png",
            });

            await expect(page).toHaveURL(/\/start(?:\?.*)?$/);
            await expect(
              page.getByRole("heading", { name: "Choose a real first action." }),
            ).toBeVisible();
          });
          EOF

      - name: Reproduce in isolation and in the complete release suite
        shell: bash
        env:
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3210
          SITE_URL: http://127.0.0.1:3210
          PLAYWRIGHT_HTML_OPEN: never
        run: |
          set -uo pipefail
          mkdir -p diagnostic-evidence

          set +e
          npx playwright test \
            --config=playwright.release.config.ts \
            tests/pr658-pilot-route-diagnostic.spec.ts \
            --repeat-each=20 \
            --reporter=line,html \
            2>&1 | tee diagnostic-evidence/isolated.log
          isolated_status=${PIPESTATUS[0]}
          set -e

          mkdir -p diagnostic-evidence/isolated
          if [[ -d test-results ]]; then mv test-results diagnostic-evidence/isolated/; fi
          if [[ -d playwright-report ]]; then mv playwright-report diagnostic-evidence/isolated/; fi
          rm -f tests/pr658-pilot-route-diagnostic.spec.ts

          set +e
          npx playwright test \
            --config=playwright.release.config.ts \
            --reporter=line,html \
            2>&1 | tee diagnostic-evidence/full-release.log
          full_status=${PIPESTATUS[0]}
          set -e

          mkdir -p diagnostic-evidence/full-release
          if [[ -d test-results ]]; then mv test-results diagnostic-evidence/full-release/; fi
          if [[ -d playwright-report ]]; then mv playwright-report diagnostic-evidence/full-release/; fi

          printf '{"expectedSha":"%s","isolatedStatus":%s,"fullReleaseStatus":%s}\n' \
            "$EXPECTED_SHA" "$isolated_status" "$full_status" \
            | tee diagnostic-evidence/result.json

          if [[ "$isolated_status" -ne 0 || "$full_status" -ne 0 ]]; then
            exit 1
          fi

      - name: Upload complete diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr658-pilot-route-browser-diagnostic-${{ github.run_id }}
          path: diagnostic-evidence
          if-no-files-found: error
          retention-days: 30
