name: Audit remediation candidate QA
on:
  push:
    branches: [ops/audit-source-20260926]
    paths: [.github/workflows/audit-source-20260926.yml]
permissions:
  contents: write
concurrency:
  group: audit-remediation-candidate-20260926
  cancel-in-progress: false
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      MORAL_TRADE_DISABLE_DEP_REPAIR: '1'
      NEXT_TELEMETRY_DISABLED: '1'
      PLAYWRIGHT_HTML_OPEN: never
      PLAYWRIGHT_USE_PRODUCTION_SERVER: '1'
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3210
      SITE_URL: http://127.0.0.1:3210
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: controller
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: f58ee041dfd909cad7699ed67485cc0a7db95933
          path: candidate
          fetch-depth: 0
          persist-credentials: false
          show-progress: false
      - name: Verify the exact patch and allowed paths
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = ghuser29384/Website2
          test "$GITHUB_REF" = refs/heads/ops/audit-source-20260926
          test "$(git rev-parse HEAD)" = f58ee041dfd909cad7699ed67485cc0a7db95933
          python3 ../controller/.github/audit-publish.py
      - name: Publish only the isolated fix branch
        working-directory: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branch=fix/audit-truth-locale-20260926
          test -z "$(git ls-remote origin "refs/heads/$branch")"
          git config user.name 'ghuser29384'
          git config user.email '262476329+ghuser29384@users.noreply.github.com'
          git switch -c "$branch"
          git commit -m 'Correct interface language, proposal facts, and commitment summaries'
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin "HEAD:refs/heads/$branch"
          git rev-parse HEAD | tee ../evidence/candidate-sha.txt
          git rev-parse 'HEAD^{tree}' > ../evidence/candidate-tree.txt
          git diff --stat HEAD^ HEAD > ../evidence/scope.txt
          printf 'Candidate `%s` published on `%s`. No main merge or deployment.\n' "$(git rev-parse HEAD)" "$branch" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: candidate/package-lock.json
      - name: Install exact locked dependencies
        working-directory: candidate
        run: npm ci --no-audit --no-fund
      - name: Unit tests and source contracts
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          npm test 2>&1 | tee ../evidence/unit-tests.log
          node --import tsx --test src/commitments-portfolio-wiring.test.ts src/live-account-data.test.ts src/lib/local-date-time.test.ts 2>&1 | tee ../evidence/source-tests.log
      - name: Lint
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          npm run lint -- --quiet 2>&1 | tee ../evidence/lint.log
      - name: Production build and TypeScript
        working-directory: candidate
        env:
          VERCEL: '1'
        shell: bash
        run: |
          set -euo pipefail
          npm run build 2>&1 | tee ../evidence/build.log
          npx tsc --noEmit --pretty false 2>&1 | tee ../evidence/typescript.log
      - name: Install Chromium
        working-directory: candidate
        run: npx playwright install --with-deps chromium
      - name: Isolated account and partial-data browser checks
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          npx playwright test --config=playwright.audit.config.ts --reporter=line 2>&1 | tee ../evidence/audit-browser.log
      - name: Complete current release browser suite
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          npm run test:e2e:release -- --reporter=line 2>&1 | tee ../evidence/release-browser.log
      - name: Collect rendered evidence
        if: always()
        shell: bash
        run: |
          mkdir -p evidence
          if test -d candidate/test-results; then cp -r candidate/test-results evidence/; fi
          if test -d candidate/playwright-report; then cp -r candidate/playwright-report evidence/; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-remediation-qa-${{ github.run_id }}
          path: evidence
          retention-days: 14
