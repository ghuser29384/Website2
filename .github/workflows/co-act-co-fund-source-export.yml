name: Export exact Co-Act and Co-Fund candidate source

on:
  pull_request:
    paths:
      - ".github/workflows/co-act-co-fund-source-export.yml"

permissions:
  contents: read

jobs:
  export:
    if: github.event.pull_request.number == 420
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Archive tracked source and exact refs
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar.gz --output=/tmp/co-act-co-fund-exact-source.tar.gz HEAD
          sha256sum /tmp/co-act-co-fund-exact-source.tar.gz > /tmp/co-act-co-fund-exact-source.sha256
          git rev-parse HEAD > /tmp/co-act-co-fund-exact-head.txt
          git rev-parse origin/main > /tmp/co-act-co-fund-observed-main.txt

      - name: Upload exact source
        uses: actions/upload-artifact@v4
        with:
          name: co-act-co-fund-exact-source-${{ github.run_id }}
          path: |
            /tmp/co-act-co-fund-exact-source.tar.gz
            /tmp/co-act-co-fund-exact-source.sha256
            /tmp/co-act-co-fund-exact-head.txt
            /tmp/co-act-co-fund-observed-main.txt
          retention-days: 1
