name: Repair MPGF compact reacceptance semantics

on:
  push:
    branches:
      - agent/mpgf-public-goods-compacts
    paths:
      - .github/workflows/repair-mpgf-compact-reacceptance.yml

permissions:
  contents: write

concurrency:
  group: repair-mpgf-compact-reacceptance-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Repair revoked-before-activation state and reacceptance
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          migration_path = Path(
              "supabase/migrations/20260813163052_mpgf_public_goods_compacts.sql"
          )
          migration = migration_path.read_text(encoding="utf-8")

          old_branch = (
              "  elsif membership_record.status = 'revoked' "
              "and compact_record.status = 'recruiting' then"
          )
          if migration.count(old_branch) != 1:
              raise SystemExit("Expected one recruiting-only revoked reacceptance branch.")
          migration = migration.replace(
              old_branch,
              "  elsif membership_record.status = 'revoked' then",
              1,
          )

          old_status = """        status = 'pending_activation',
              accepted_at = action_at,
              activated_at = null,
          """
          new_status = """        status = case
                  when compact_record.status = 'active' then 'active'
                  else 'pending_activation'
                end,
              accepted_at = action_at,
              activated_at = case
                when compact_record.status = 'active' then action_at
                else null
              end,
          """
          if migration.count(old_status) != 1:
              raise SystemExit("Expected one revoked-membership status reset block.")
          migration = migration.replace(old_status, new_status, 1)
          migration_path.write_text(migration, encoding="utf-8")

          hardening_path = Path(
              "supabase/migrations/20260814023000_mpgf_public_goods_compacts_state_hardening.sql"
          )
          hardening = hardening_path.read_text(encoding="utf-8")
          old_count_rule = "accepted_member_count <= activation_threshold_members"
          if hardening.count(old_count_rule) != 1:
              raise SystemExit("Expected one recruiting activation-count rule.")
          hardening = hardening.replace(
              old_count_rule,
              "accepted_member_count < activation_threshold_members",
              1,
          )
          hardening_path.write_text(hardening, encoding="utf-8")

          state_path = Path("src/lib/mpgf/public-goods-compacts-state.ts")
          state = state_path.read_text(encoding="utf-8")
          old_revoked = """  if (value.status === \"revoked\") {
            return (
              compact.status === \"recruiting\" &&
              value.activatedAt === null &&
          """
          new_revoked = """  if (value.status === \"revoked\") {
            return (
              value.activatedAt === null &&
          """
          if state.count(old_revoked) != 1:
              raise SystemExit("Expected one revoked-membership validation branch.")
          state = state.replace(old_revoked, new_revoked, 1)
          state_path.write_text(state, encoding="utf-8")

          state_test_path = Path("src/lib/mpgf/public-goods-compacts-state.test.ts")
          state_test = state_test_path.read_text(encoding="utf-8")
          marker = 'test("an effective prospective exit is rendered as exited rather than still binding", () => {'
          if state_test.count(marker) != 1:
              raise SystemExit("Expected one prospective-exit test marker.")
          new_test = '''test("a revoked recruiting acceptance remains safe after later compact activation", () => {
            const state = buildRecruitingDatabaseState();
            const compact = state.compacts[0];

            compact.membership = {
              id: "20000000-0000-4000-8000-000000000001",
              compactId: compact.id as string,
              compactPublicKey: compact.publicKey,
              constitutionVersionAccepted: compact.constitutionVersion,
              acknowledgements: MPGF_PUBLIC_GOODS_COMPACT_REQUIRED_ACKNOWLEDGEMENTS,
              declaredEligibleMonthlySpendingCents: 12_345,
              scheduledMonthlyContributionCents: 123,
              status: "revoked",
              acceptedAt: "2026-01-01T00:00:00.000Z",
              activatedAt: null,
              revokedAt: "2026-01-15T00:00:00.000Z",
              exitRequestedAt: null,
              exitEffectiveAt: null,
            };
            activateFutureFlourishing(state);

            const normalized =
              validateAndNormalizeMpgfPublicGoodsCompactsDatabaseState(state, NOW);

            assert.ok(normalized);
            assert.equal(normalized.compacts[0].membership?.status, "revoked");
          });

          '''
          state_test = state_test.replace(marker, new_test + marker, 1)
          state_test_path.write_text(state_test, encoding="utf-8")

          lifecycle_path = Path("supabase/tests/mpgf_public_goods_compacts_lifecycle.sql")
          lifecycle = lifecycle_path.read_text(encoding="utf-8")
          activation_marker = (
              "-- Activate Animal Welfare in-fixture, then prove late joins bind "
              "immediately without moving money."
          )
          if lifecycle.count(activation_marker) != 1:
              raise SystemExit("Expected one Animal Welfare late-join marker.")
          preactivation_test = r'''-- A person who revokes while recruiting remains eligible to join after activation.
          set local role authenticated;
          select set_config('request.jwt.claim.sub','6a000000-0000-4000-8000-000000000003',true);
          select set_config('request.jwt.claim.role','authenticated',true);
          do $test$
          declare
            response jsonb;
          begin
            response := public.join_mpgf_public_goods_compact(
              'animal-welfare',
              'mpgf-public-goods-compact/founding-v1',
              50000,
              '{"voluntaryChoice":true,"exactConstitution":true,"activationAndNoProjectOptOut":true,"noPaymentMandate":true}'::jsonb,
              'qa.join.c.pre.0001'
            );
            if response->>'membershipStatus' <> 'pending_activation' then
              raise exception 'Pre-activation acceptance did not remain pending.';
            end if;

            response := public.request_mpgf_public_goods_compact_exit(
              'animal-welfare',
              'qa.exit.c.pre.0001'
            );
            if response->>'membershipStatus' <> 'revoked'
              or not (response->>'revokedImmediately')::boolean
            then
              raise exception 'Pre-activation revocation was not immediate.';
            end if;
          end;
          $test$;
          reset role;

          do $test$
          begin
            begin
              update public.mpgf_public_goods_compacts
              set accepted_member_count = activation_threshold_members
              where id = '10000000-0000-4000-8000-000000000003';
              raise exception 'A recruiting compact was allowed to remain at its activation threshold.';
            exception when check_violation then null;
            end;
          end;
          $test$;

          '''
          lifecycle = lifecycle.replace(
              activation_marker,
              preactivation_test +
              "-- Activate Animal Welfare in-fixture, then prove a revoked recruiting acceptance can rejoin and bind immediately without moving money.",
              1,
          )
          lifecycle_path.write_text(lifecycle, encoding="utf-8")
          PY

          git diff --check
          grep -q "membership_record.status = 'revoked' then" \
            supabase/migrations/20260813163052_mpgf_public_goods_compacts.sql
          grep -q "accepted_member_count < activation_threshold_members" \
            supabase/migrations/20260814023000_mpgf_public_goods_compacts_state_hardening.sql
          grep -q "a revoked recruiting acceptance remains safe" \
            src/lib/mpgf/public-goods-compacts-state.test.ts
          grep -q "qa.join.c.pre.0001" \
            supabase/tests/mpgf_public_goods_compacts_lifecycle.sql

      - name: Install exact dependencies
        run: npm ci

      - name: Run focused contracts and strict TypeScript
        shell: bash
        run: |
          set -euo pipefail
          node --import tsx --test \
            src/lib/mpgf/public-goods-compacts.test.ts \
            src/lib/mpgf/public-goods-compacts-state.test.ts \
            src/lib/mpgf/public-goods-compacts-contract.test.ts \
            src/lib/mpgf/public-goods-compacts-hardening-contract.test.ts
          npx tsc --noEmit

      - name: Commit durable repair and remove controller
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/lib/mpgf/public-goods-compacts-state.ts \
            src/lib/mpgf/public-goods-compacts-state.test.ts \
            supabase/migrations/20260813163052_mpgf_public_goods_compacts.sql \
            supabase/migrations/20260814023000_mpgf_public_goods_compacts_state_hardening.sql \
            supabase/tests/mpgf_public_goods_compacts_lifecycle.sql
          git rm .github/workflows/repair-mpgf-compact-reacceptance.yml
          git commit -m "fix: allow revoked compact acceptances to rejoin after activation"
          git push origin "HEAD:${GITHUB_REF_NAME}"
