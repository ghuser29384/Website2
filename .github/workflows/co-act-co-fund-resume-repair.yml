name: Repair Co-Act and Co-Fund authentication resume v3

on:
  push:
    branches:
      - feature/co-act-co-fund-create-v3-20260803
    paths:
      - ".github/workflows/co-act-co-fund-resume-repair.yml"

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: co-act-co-fund-resume-repair-v3
  cancel-in-progress: false

env:
  TARGET_BRANCH: feature/co-act-co-fund-create-v3-20260803
  EXPECTED_PARENT: 65c93d141811c349d53af03e09a7e6c380654e99
  CONTROLLER_PATH: .github/workflows/co-act-co-fund-resume-repair.yml

jobs:
  repair:
    if: >-
      github.repository == 'ghuser29384/Website2' &&
      github.ref == 'refs/heads/feature/co-act-co-fund-create-v3-20260803'
    runs-on: ubuntu-24.04
    timeout-minutes: 75

    steps:
      - name: Check out exact trigger
        uses: actions/checkout@v4
        with:
          ref: feature/co-act-co-fund-create-v3-20260803
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact one-file controller trigger
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')" = "$GITHUB_SHA"
          test "$(git diff --name-only "$EXPECTED_PARENT" "$GITHUB_SHA")" = "$CONTROLLER_PATH"

      - name: Implement durable authentication-resume preservation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          client_path = Path("src/lib/create-interface/group-contribution-client.ts")
          client = client_path.read_text(encoding="utf-8")

          def replace_once(old: str, new: str, label: str) -> None:
              global client
              count = client.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one {label}; found {count}")
              client = client.replace(old, new, 1)

          replace_once(
              'import { sanitizeGroupContributionDraft } from "./group-contribution-draft-sanitize";\n',
              'import { sanitizeGroupContributionDraft } from "./group-contribution-draft-sanitize";\n'
              'import { parseGroupContributionProposalPayload } from "./group-contribution-payload";\n',
              "resume parser import",
          )
          replace_once(
              'const STORAGE_KEY = "mt:create:group-contribution-drafts:v1";\n'
              'const PAYLOAD_FIELD = "groupContributionTerms";',
              'const STORAGE_KEY = "mt:create:group-contribution-drafts:v1";\n'
              'const RESUME_STORAGE_KEY = "mt:create:group-contribution-resume:v1";\n'
              'const PAYLOAD_FIELD = "groupContributionTerms";',
              "resume storage key",
          )
          replace_once(
              '''export interface GroupContributionProposalPayload {
            schemaVersion: 1;
            execution: "proposal-only";
            options: ProposalOptionPayload[];
          }

          interface PublicGroupContributionApi {''',
              '''export interface GroupContributionProposalPayload {
            schemaVersion: 1;
            execution: "proposal-only";
            options: ProposalOptionPayload[];
          }

          interface GroupContributionResumeSnapshot {
            version: 1;
            proposal: GroupContributionProposalPayload;
            drafts: StoredDrafts;
          }

          interface PublicGroupContributionApi {''',
              "resume snapshot interface",
          )
          replace_once(
              'let scanQueued = false;\nlet submitGuardInstalled = false;',
              'let scanQueued = false;\n'
              'let submitGuardInstalled = false;\n'
              'let resumedProposal: GroupContributionProposalPayload | null = null;',
              "resume state declaration",
          )
          replace_once(
              '  activeWindow = targetWindow;\n'
              '  activeDocument = targetDocument;\n'
              '  scanQueued = false;',
              '  activeWindow = targetWindow;\n'
              '  activeDocument = targetDocument;\n'
              '  resumedProposal = readStoredResumeProposal();\n'
              '  scanQueued = false;',
              "resume activation",
          )
          replace_once(
              '  const root = locateOfferStepRoot();\n'
              '  if (!root) return;\n\n'
              '  const candidates = locateOptionCards(root);',
              '  const root = locateOfferStepRoot();\n'
              '  if (!root) {\n'
              '    if (resumedProposal) writeProposalPayload(false);\n'
              '    return;\n'
              '  }\n\n'
              '  const candidates = locateOptionCards(root);',
              "summary-screen scan fallback",
          )
          replace_once(
              'function readProposalPayload(): GroupContributionProposalPayload {\n'
              '  const options: ProposalOptionPayload[] = [];',
              'function readProposalPayload(): GroupContributionProposalPayload {\n'
              '  if (mounted.size === 0 && resumedProposal) return resumedProposal;\n\n'
              '  const options: ProposalOptionPayload[] = [];',
              "resume payload fallback",
          )
          replace_once(
              'function writeProposalPayload(): void {\n'
              '  persistDrafts();',
              'function writeProposalPayload(persistCurrentDrafts = true): void {\n'
              '  if (persistCurrentDrafts) persistDrafts();',
              "conditional draft persistence",
          )
          replace_once(
              '''    return originalFetch(input, {
                ...init,
                body: JSON.stringify({ ...payload, groupContributionTerms: proposal }),
              });''',
              '''    persistResumeSnapshot(proposal);
              const response = await originalFetch(input, {
                ...init,
                body: JSON.stringify({ ...payload, groupContributionTerms: proposal }),
              });
              if (response.ok) clearResumeSnapshot();
              return response;''',
              "publish resume lifecycle",
          )

          persist_anchor = 'function persistDrafts(): void {\n'
          helpers = dedent('''\
          function isResumeRequest(): boolean {
            try {
              return new URL(window.location.href).searchParams.get("resume") === "create";
            } catch {
              return false;
            }
          }

          function resumeStorages(): Storage[] {
            const storages: Storage[] = [];
            const append = (storage: Storage | null | undefined) => {
              if (storage && !storages.includes(storage)) storages.push(storage);
            };

            try {
              append(window.sessionStorage);
            } catch {
              // Storage may be disabled by the browser or embedding policy.
            }
            try {
              append(window.top?.sessionStorage);
            } catch {
              // Cross-origin or restricted top-level storage is ignored.
            }
            try {
              append(activeWindow?.sessionStorage);
            } catch {
              // The Create iframe storage is a fallback, not the durable bridge.
            }
            return storages;
          }

          function persistResumeSnapshot(proposal: GroupContributionProposalPayload): void {
            if (proposal.options.length === 0) return;
            persistDrafts();
            const snapshot: GroupContributionResumeSnapshot = {
              version: 1,
              proposal,
              drafts: readStoredDrafts(),
            };
            const serialized = JSON.stringify(snapshot);
            for (const storage of resumeStorages()) {
              try {
                storage.setItem(RESUME_STORAGE_KEY, serialized);
              } catch {
                // Continue so another same-origin storage can preserve the handoff.
              }
            }
            resumedProposal = proposal;
          }

          function clearResumeSnapshot(): void {
            resumedProposal = null;
            for (const storage of resumeStorages()) {
              try {
                storage.removeItem(RESUME_STORAGE_KEY);
              } catch {
                // The server receipt is durable even if local cleanup is unavailable.
              }
            }
          }

          function restoreResumeDrafts(
            candidate: unknown,
            allowedKeys: ReadonlySet<string>,
          ): void {
            if (!isRecord(candidate) || candidate.version !== 1 || !isRecord(candidate.drafts)) {
              return;
            }

            const drafts: Record<string, GroupContributionDraftState> = {};
            for (const [key, draft] of Object.entries(candidate.drafts).slice(0, MAX_LOCAL_DRAFTS)) {
              if (!allowedKeys.has(key) || !isRecord(draft)) continue;
              drafts[key] = draft as unknown as GroupContributionDraftState;
            }

            try {
              const restored: StoredDrafts = { version: 1, drafts };
              createWindow().localStorage.setItem(STORAGE_KEY, JSON.stringify(restored));
            } catch {
              // Summary restoration still works when editable local drafts cannot be restored.
            }
          }

          function readStoredResumeProposal(): GroupContributionProposalPayload | null {
            if (!isResumeRequest()) return null;

            for (const storage of resumeStorages()) {
              let raw: string | null = null;
              try {
                raw = storage.getItem(RESUME_STORAGE_KEY);
              } catch {
                continue;
              }
              if (!raw) continue;

              try {
                const snapshot = JSON.parse(raw) as unknown;
                if (
                  !isRecord(snapshot) ||
                  snapshot.version !== 1 ||
                  !isRecord(snapshot.proposal) ||
                  !Array.isArray(snapshot.proposal.options)
                ) {
                  continue;
                }

                const contributionKinds = new Map<string, UnderlyingContributionKind>();
                for (const option of snapshot.proposal.options) {
                  if (
                    !isRecord(option) ||
                    typeof option.optionKey !== "string" ||
                    !isRecord(option.terms)
                  ) {
                    contributionKinds.clear();
                    break;
                  }
                  if (option.terms.mode === "co-act") {
                    if (!permitsGroupContributionMode(PROPOSAL_FLAGS, "co-act")) {
                      contributionKinds.clear();
                      break;
                    }
                    contributionKinds.set(option.optionKey, "nonfinancial");
                  } else if (option.terms.mode === "co-fund") {
                    if (!permitsGroupContributionMode(PROPOSAL_FLAGS, "co-fund")) {
                      contributionKinds.clear();
                      break;
                    }
                    contributionKinds.set(option.optionKey, "financial");
                  } else {
                    contributionKinds.clear();
                    break;
                  }
                }
                if (contributionKinds.size !== snapshot.proposal.options.length) continue;

                const serializedProposal = JSON.stringify(snapshot.proposal);
                const result = parseGroupContributionProposalPayload(
                  serializedProposal,
                  contributionKinds,
                );
                if (!result.ok || result.value.options.length === 0) continue;

                restoreResumeDrafts(
                  snapshot.drafts,
                  new Set(result.value.options.map((option) => option.optionKey)),
                );
                return result.value;
              } catch {
                continue;
              }
            }
            return null;
          }

          function persistDrafts(): void {
          ''')
          if client.count(persist_anchor) != 1:
              raise SystemExit(
                  f"Expected one resume-helper insertion point; found {client.count(persist_anchor)}"
              )
          client = client.replace(persist_anchor, helpers, 1)
          client_path.write_text(client, encoding="utf-8")

          browser_path = Path("tests/create-group-contribution-proposal.spec.ts")
          browser = browser_path.read_text(encoding="utf-8")
          if 'getByRole("textbox", { name: "Duration", exact: true })' not in browser:
              raise SystemExit("The exact Duration locator repair is missing")

          old_resume_assertion = '''  await expect(resumed.getByText("CO-ACT · PROPOSAL ONLY")).toBeVisible();

            await resumed.getByRole("button", { name: "Change contributions" }).click();'''
          new_resume_assertion = '''  await expect(resumed.getByText("CO-ACT · PROPOSAL ONLY")).toBeVisible();

            const topLevelResumeSnapshot = await page.evaluate(
              (key) => window.sessionStorage.getItem(key),
              "mt:create:group-contribution-resume:v1",
            );
            expect(topLevelResumeSnapshot).not.toBeNull();

            const resumedPayloadRaw = await resumed
              .locator("input[name='groupContributionTerms']")
              .inputValue();
            const resumedPayload = JSON.parse(resumedPayloadRaw) as {
              execution: string;
              options: Array<{
                optionKey: string;
                terms: {
                  mode: string;
                  participantLimit: number;
                  counterpartyParticipation: string;
                };
              }>;
            };
            const resumedTerms = resumedPayload.options.find(
              (option) => option.optionKey === "behavior:1",
            )?.terms;
            expect(resumedPayload.execution).toBe("proposal-only");
            expect(resumedTerms?.mode).toBe("co-act");
            expect(resumedTerms?.participantLimit).toBe(17);
            expect(resumedTerms?.counterpartyParticipation).toBe("explicitly-included");

            await resumed.getByRole("button", { name: "Change contributions" }).click();'''
          if browser.count(old_resume_assertion) != 1:
              raise SystemExit(
                  f"Expected one authentication-resume assertion anchor; found {browser.count(old_resume_assertion)}"
              )
          browser_path.write_text(
              browser.replace(old_resume_assertion, new_resume_assertion, 1),
              encoding="utf-8",
          )

          stability_path = Path(
              "src/lib/create-interface/group-contribution-client-stability.test.ts"
          )
          stability = stability_path.read_text(encoding="utf-8")
          test_name = 'test("authentication resume bridges the top-level context and restores validated drafts"'
          if test_name in stability:
              raise SystemExit("The authentication-resume stability test already exists")
          stability += dedent('''\

          test("authentication resume bridges the top-level context and restores validated drafts", () => {
            const storages = functionBody("resumeStorages");
            assert.match(storages, /window\.sessionStorage/);
            assert.match(storages, /window\.top\?\.sessionStorage/);
            assert.match(storages, /activeWindow\?\.sessionStorage/);

            const scan = functionBody("scanForOptions");
            assert.match(scan, /if \(!root\)[\\s\\S]*resumedProposal[\\s\\S]*writeProposalPayload\(false\)/);

            const payload = functionBody("readProposalPayload");
            assert.match(payload, /mounted\.size === 0 && resumedProposal/);

            const publish = functionBody("installPublishBridge");
            assert.match(publish, /persistResumeSnapshot\(proposal\)/);
            assert.match(publish, /response\.ok[\\s\\S]*clearResumeSnapshot\(\)/);

            const restore = functionBody("readStoredResumeProposal");
            assert.match(restore, /parseGroupContributionProposalPayload/);
            assert.match(restore, /restoreResumeDrafts/);
            assert.match(restore, /permitsGroupContributionMode/);
            assert.match(restore, /result\.ok/);
          });
          ''')
          stability_path.write_text(stability, encoding="utf-8")
          PY

          git rm "$CONTROLLER_PATH"
          git diff --check

      - name: Install dependencies
        run: npm ci

      - name: Run focused contracts
        run: >-
          node --import tsx --test
          src/lib/create-interface/group-contribution*.test.ts
          src/lib/create-interface/persistence.test.ts
          src/lib/create-interface/source-contract.test.ts
          src/lib/create-interface/validation.test.ts

      - name: Run complete repository tests
        run: npm test

      - name: Run changed-file ESLint and TypeScript
        shell: bash
        run: |
          set -euo pipefail
          npx eslint \
            src/lib/create-interface/group-contribution-client.ts \
            src/lib/create-interface/group-contribution-client-stability.test.ts \
            tests/create-group-contribution-proposal.spec.ts
          npx tsc --noEmit

      - name: Build production application
        env:
          NEXT_PUBLIC_SITE_URL: https://www.moraltrade.org
          VERCEL: "1"
          VERCEL_ENV: preview
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run exact real-iframe proposal workflow
        id: playwright
        shell: bash
        env:
          CREATE_ROUTE_CAPTURE: "1"
        run: |
          set -o pipefail
          npx playwright test tests/create-group-contribution-proposal.spec.ts --reporter=line \
            2>&1 | tee playwright.log

      - name: Upload rendered evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: co-act-co-fund-resume-repair-${{ github.run_id }}
          path: |
            playwright.log
            test-results
            playwright-report
          if-no-files-found: warn
          retention-days: 14

      - name: Commit and publish proven repair
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          cat > /tmp/expected-paths.txt <<'EOF'
          .github/workflows/co-act-co-fund-resume-repair.yml
          src/lib/create-interface/group-contribution-client-stability.test.ts
          src/lib/create-interface/group-contribution-client.ts
          tests/create-group-contribution-proposal.spec.ts
          EOF
          sed -i 's/^          //' /tmp/expected-paths.txt
          sort -u /tmp/expected-paths.txt -o /tmp/expected-paths.txt
          git diff --cached --name-only | sort -u > /tmp/actual-paths.txt
          diff -u /tmp/expected-paths.txt /tmp/actual-paths.txt
          git diff --cached --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Restore Co-Act and Co-Fund terms after authentication'
          test "$(git rev-parse HEAD^)" = "$GITHUB_SHA"
          test ! -e "$CONTROLLER_PATH"
          git push --force-with-lease="refs/heads/$TARGET_BRANCH:$GITHUB_SHA" \
            origin "HEAD:refs/heads/$TARGET_BRANCH"

      - name: Report controller failure with bounded evidence
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          {
            printf '%s\n' "The bounded Co-Act/Co-Fund authentication-resume repair failed in Actions run \`$GITHUB_RUN_ID\`. No durable product repair was pushed."
            if test -s playwright.log; then
              printf '%s\n\n' "The last Playwright lines were:"
              printf '%s\n' '```text'
              tail -n 160 playwright.log \
                | sed -E 's/((token|secret|password|client[_-]?secret)[=:][^[:space:]]+)/[redacted]/Ig' \
                | head -c 45000
              printf '\n%s\n' '```'
            fi
          } > /tmp/pr477-resume-failure.md
          gh pr comment 477 --repo "$GITHUB_REPOSITORY" --body-file /tmp/pr477-resume-failure.md
