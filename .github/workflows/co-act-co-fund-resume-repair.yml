name: Resolve Co-Act and Co-Fund rendered blockers once

on:
  push:
    branches:
      - feature/co-act-co-fund-create-v3-20260803
    paths:
      - ".github/workflows/co-act-co-fund-resume-repair.yml"

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: co-act-co-fund-resolve-blocker-${{ github.sha }}
  cancel-in-progress: false

env:
  TARGET_BRANCH: feature/co-act-co-fund-create-v3-20260803
  EXPECTED_PARENT: d6561445b9f3715af88c517eb77ddedbe0305104
  CONTROLLER_PATH: .github/workflows/co-act-co-fund-resume-repair.yml
  REPAIR_SCRIPT: .github/scripts/co-act-co-fund-resolve-blocker.py
  RESUME_CONTEXT_SCRIPT: .github/scripts/co-act-co-fund-resume-context-hotfix.py

jobs:
  repair-and-prove:
    if: >-
      github.repository == 'ghuser29384/Website2' &&
      github.ref == 'refs/heads/feature/co-act-co-fund-create-v3-20260803'
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out exact controller trigger
        uses: actions/checkout@v4
        with:
          ref: feature/co-act-co-fund-create-v3-20260803
          fetch-depth: 0
          persist-credentials: true

      - name: Verify bounded one-file trigger
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')" = "$GITHUB_SHA"
          test "$(git diff --name-only "$EXPECTED_PARENT" "$GITHUB_SHA")" = "$CONTROLLER_PATH"
          test -f "$REPAIR_SCRIPT"
          test -f "$RESUME_CONTEXT_SCRIPT"

      - name: Record bounded repair start
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh pr comment 477 --repo "$GITHUB_REPOSITORY" --body "Started bounded server-safe top-level authentication-resume repair in Actions run \`$GITHUB_RUN_ID\` at controller commit \`$GITHUB_SHA\`. The workflow will push source changes only if focused contracts, the full test suite, ESLint, TypeScript, the production build, and the exact rendered Playwright workflow all pass. The PR remains draft; no merge or deployment is authorized."

      - name: Apply bounded source repair
        shell: bash
        run: |
          set -euo pipefail
          python3 "$REPAIR_SCRIPT"
          python3 "$RESUME_CONTEXT_SCRIPT"

          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          html_path = Path("public/moral-trade-create/index.html")
          html = html_path.read_text(encoding="utf-8")

          old_snapshot = 'CREATE_DRAFT_STORAGE.setItem(CREATE_DRAFT_STORAGE_KEY, JSON.stringify({ ...state, published: false }));'
          new_snapshot = '''CREATE_DRAFT_STORAGE.setItem(
                  CREATE_DRAFT_STORAGE_KEY,
                  JSON.stringify({ ...state, step: 4, offerPhase: "details", published: false }),
                );'''
          snapshot_count = html.count(old_snapshot)
          if snapshot_count != 1:
              raise SystemExit(
                  f"Expected exactly one authentication resume snapshot; found {snapshot_count}"
              )
          html = html.replace(old_snapshot, new_snapshot, 1)

          old_restore_cleanup = (
              '        Object.assign(state, saved, { published: false, publishedId: "", publishedUrl: "" });\n'
              '        CREATE_DRAFT_STORAGE.removeItem(CREATE_DRAFT_STORAGE_KEY);\n'
              '        return true;'
          )
          new_restore_cleanup = (
              '        Object.assign(state, saved, { published: false, publishedId: "", publishedUrl: "" });\n'
              '        // Keep the snapshot until a durable receipt or explicit reset. The srcDoc iframe can remount during route hydration.\n'
              '        return true;'
          )
          cleanup_count = html.count(old_restore_cleanup)
          if cleanup_count != 1:
              raise SystemExit(
                  f"Expected exactly one eager authentication-resume cleanup; found {cleanup_count}"
              )
          html = html.replace(old_restore_cleanup, new_restore_cleanup, 1)
          html_path.write_text(html, encoding="utf-8")

          contract_path = Path("src/lib/create-interface/source-contract.test.ts")
          contract = contract_path.read_text(encoding="utf-8")
          old_assertion = (
              '  assert.match(html, /CREATE_DRAFT_STORAGE\\.setItem\\(CREATE_DRAFT_STORAGE_KEY/);\n'
          )
          new_assertions = (
              '  assert.match(html, /CREATE_DRAFT_STORAGE\\.setItem\\(\\s*CREATE_DRAFT_STORAGE_KEY/);\n'
              '  assert.match(html, /step: 4, offerPhase: "details", published: false/);\n'
          )
          assertion_count = contract.count(old_assertion)
          if assertion_count != 1:
              raise SystemExit(
                  f"Expected exactly one single-line resume-storage assertion; found {assertion_count}"
              )
          contract = contract.replace(old_assertion, new_assertions, 1)

          remount_test_name = "authentication resume snapshot survives an iframe remount until durable receipt"
          if remount_test_name in contract:
              raise SystemExit("The iframe-remount authentication-resume contract already exists")
          contract += dedent('''\

          test("authentication resume snapshot survives an iframe remount until durable receipt", () => {
            const start = html.indexOf("function restoreDraftForResume()");
            const end = html.indexOf("\\n    function renderSubmittedReceipt", start);
            assert.ok(start >= 0 && end > start);
            const restoreSource = html.slice(start, end);
            assert.match(restoreSource, /Object\\.assign\\(state, saved/);
            assert.doesNotMatch(
              restoreSource,
              /CREATE_DRAFT_STORAGE\\.removeItem\\(CREATE_DRAFT_STORAGE_KEY\\)/,
            );
          });
          ''')
          contract_path.write_text(contract, encoding="utf-8")
          PY

          git rm "$CONTROLLER_PATH" "$REPAIR_SCRIPT" "$RESUME_CONTEXT_SCRIPT"

          cat > /tmp/expected-files <<'EOF'
          .github/scripts/co-act-co-fund-resolve-blocker.py
          .github/scripts/co-act-co-fund-resume-context-hotfix.py
          .github/workflows/co-act-co-fund-resume-repair.yml
          public/moral-trade-create/index.html
          src/components/create/create-interface-frame.tsx
          src/lib/create-interface/group-contribution-client-stability.test.ts
          src/lib/create-interface/group-contribution-client.ts
          src/lib/create-interface/source-contract.test.ts
          tests/create-group-contribution-proposal.spec.ts
          EOF
          git diff HEAD --name-only | sort > /tmp/actual-files
          sort -o /tmp/expected-files /tmp/expected-files
          diff -u /tmp/expected-files /tmp/actual-files
          git diff HEAD --check

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run focused Co-Act and Co-Fund contracts
        run: >-
          node --import tsx --test
          src/lib/create-interface/group-contribution*.test.ts
          src/lib/create-interface/persistence.test.ts
          src/lib/create-interface/source-contract.test.ts
          src/lib/create-interface/validation.test.ts

      - name: Run complete repository tests
        run: npm test

      - name: Run absolute ESLint
        run: npm run lint

      - name: Run absolute TypeScript check
        run: npx tsc --noEmit

      - name: Build the production application
        env:
          NEXT_PUBLIC_SITE_URL: https://www.moraltrade.org
          VERCEL: "1"
          VERCEL_ENV: preview
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run exact rendered proposal workflow
        env:
          CREATE_ROUTE_CAPTURE: "1"
        run: npx playwright test tests/create-group-contribution-proposal.spec.ts

      - name: Verify bounded final diff
        shell: bash
        run: |
          set -euo pipefail
          rm -rf test-results playwright-report
          git diff HEAD --check
          cat > /tmp/expected-files <<'EOF'
          .github/scripts/co-act-co-fund-resolve-blocker.py
          .github/scripts/co-act-co-fund-resume-context-hotfix.py
          .github/workflows/co-act-co-fund-resume-repair.yml
          public/moral-trade-create/index.html
          src/components/create/create-interface-frame.tsx
          src/lib/create-interface/group-contribution-client-stability.test.ts
          src/lib/create-interface/group-contribution-client.ts
          src/lib/create-interface/source-contract.test.ts
          tests/create-group-contribution-proposal.spec.ts
          EOF
          git diff HEAD --name-only | sort > /tmp/actual-files
          sort -o /tmp/expected-files /tmp/expected-files
          diff -u /tmp/expected-files /tmp/actual-files
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')" = "$GITHUB_SHA"

      - name: Commit and push proven repair
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Co-Act/Co-Fund rendered persistence and auth resume"
          REPAIR_SHA="$(git rev-parse HEAD)"
          echo "repair_sha=$REPAIR_SHA" >> "$GITHUB_OUTPUT"
          git push origin "HEAD:$TARGET_BRANCH"

      - name: Record PASS on the draft pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REPAIR_SHA: ${{ steps.commit.outputs.repair_sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh pr comment 477 --repo "$GITHUB_REPOSITORY" --body "Resolved the rendered blockers on commit \`$REPAIR_SHA\`: Co-Fund monetary inputs remain stable across sequential edits, and proposal-only Co-Act/Co-Fund state returns to the final review screen after the authentication handoff, including a srcDoc iframe remount during route hydration. Focused contracts, complete tests, ESLint, TypeScript, production build, and the exact four-test Playwright workflow all passed. The PR remains draft and proposal-only; it was not merged or deployed."

      - name: Record bounded repair failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh pr comment 477 --repo "$GITHUB_REPOSITORY" --body "Bounded server-safe top-level-context blocker repair run \`$GITHUB_RUN_ID\` failed before a source commit was pushed. The draft branch therefore remains at the controller commit. Failure evidence is attached to the run where available; no merge or deployment occurred."

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: co-act-co-fund-resolve-blocker-${{ github.run_id }}
          path: |
            test-results
            playwright-report
          if-no-files-found: warn
          retention-days: 14

# Retry lazy server-safe resume context d6561445b9f3715af88c517eb77ddedbe0305104
