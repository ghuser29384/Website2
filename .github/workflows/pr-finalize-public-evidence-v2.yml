name: PR finalize public evidence v2

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write
  actions: read

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/public-evidence-desk-v2
          fetch-depth: 0

      - name: Reconcile current main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main

      - name: Execute finalizer payload
        id: finalizer
        continue-on-error: true
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/finalize-public-evidence-v2.yml').read_text().splitlines()
          start = source.index("          python - <<'PY'") + 1
          end = source.index("          PY", start)
          payload = []
          for line in source[start:end]:
              if not line.startswith('          '):
                  raise RuntimeError(f'Unexpected finalizer indentation: {line!r}')
              payload.append(line[10:])
          Path('/tmp/finalize-public-evidence.py').write_text('\n'.join(payload) + '\n')
          PY
          set +e
          python /tmp/finalize-public-evidence.py 2>&1 | tee /tmp/finalize-public-evidence.log
          status=${PIPESTATUS[0]}
          set -e
          exit "$status"

      - name: Upload finalizer diagnostics
        if: steps.finalizer.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: public-evidence-finalizer-diagnostics
          path: /tmp/finalize-public-evidence.log
          if-no-files-found: error

      - name: Stop after finalizer failure
        if: steps.finalizer.outcome == 'failure'
        run: exit 1

      - name: Remove temporary materialization workflows
        if: steps.finalizer.outcome == 'success'
        shell: bash
        run: |
          rm -f .github/workflows/materialize-public-evidence-v2.yml
          rm -f .github/workflows/finalize-public-evidence-v2.yml
          rm -f .github/workflows/pr-finalize-public-evidence-v2.yml
          rm -f .github/finalize-public-evidence-error.txt

      - name: Install dependencies
        if: steps.finalizer.outcome == 'success'
        run: npm ci

      - name: Install Playwright Chromium
        if: steps.finalizer.outcome == 'success'
        run: npx playwright install --with-deps chromium

      - name: Lint
        if: steps.finalizer.outcome == 'success'
        run: npm run lint

      - name: Unit tests
        if: steps.finalizer.outcome == 'success'
        run: npm test

      - name: Production build
        if: steps.finalizer.outcome == 'success'
        run: npm run build

      - name: Evidence interaction tests
        if: steps.finalizer.outcome == 'success'
        run: npx playwright test tests/public-evidence.spec.ts --reporter=line

      - name: Commit integrated implementation
        if: steps.finalizer.outcome == 'success'
        shell: bash
        run: |
          git add -A
          git commit -m "Integrate public-safe evidence into the current trade flow"
          git push origin HEAD:feature/public-evidence-desk-v2
