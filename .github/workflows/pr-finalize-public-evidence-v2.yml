name: PR finalize public evidence v2

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write
  pull-requests: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/public-evidence-desk-v2
          fetch-depth: 0

      - name: Reconcile current main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main

      - name: Execute finalizer payload
        id: finalizer
        continue-on-error: true
        shell: bash
        run: |
          set +e
          (
            python - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/finalize-public-evidence-v2.yml').read_text().splitlines()
          start = source.index("          python - <<'PY'") + 1
          end = source.index("          PY", start)
          payload = []
          for line in source[start:end]:
              if line == "":
                  payload.append("")
                  continue
              if not line.startswith('          '):
                  raise RuntimeError(f'Unexpected finalizer indentation: {line!r}')
              payload.append(line[10:])
          Path('/tmp/finalize-public-evidence.py').write_text('\n'.join(payload) + '\n')
          PY
            python /tmp/finalize-public-evidence.py
          ) 2>&1 | tee /tmp/finalize-public-evidence.log
          status=${PIPESTATUS[0]}
          set -e
          exit "$status"

      - name: Post finalizer diagnostics
        if: steps.finalizer.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo '### Public evidence finalizer failure'
            echo
            echo '```text'
            tail -n 80 /tmp/finalize-public-evidence.log
            echo '```'
          } > /tmp/public-evidence-finalizer-comment.md
          gh pr comment 120 --body-file /tmp/public-evidence-finalizer-comment.md
          exit 1

      - name: Stabilize evidence hydration and strict selectors
        if: steps.finalizer.outcome == 'success'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          page_path = Path("src/app/evidence/[[...recordId]]/page.tsx")
          page = page_path.read_text()
          old = "  select(selected);applyZoom();\n})();"
          if page.count(old) != 1:
              raise RuntimeError(f"Expected one initial evidence mutation, found {page.count(old)}")
          page_path.write_text(page.replace(old, "})();", 1))

          test_path = Path("tests/public-evidence.spec.ts")
          test_source = test_path.read_text()
          old = "    await page.locator('[data-pe-open-evidence=\"payment\"]').click();"
          new = "    await page.locator('[data-pe-open-evidence=\"payment\"]').first().click();"
          if test_source.count(old) != 1:
              raise RuntimeError(f"Expected one payment timeline selector, found {test_source.count(old)}")
          test_path.write_text(test_source.replace(old, new, 1))
          PY

      - name: Install dependencies
        if: steps.finalizer.outcome == 'success'
        run: npm ci

      - name: Install Playwright Chromium
        if: steps.finalizer.outcome == 'success'
        run: npx playwright install --with-deps chromium

      - name: Run release checks
        id: checks
        if: steps.finalizer.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          (
            set -e
            npx eslint \
              'src/app/evidence/[[...recordId]]/page.tsx' \
              'src/app/trade-agreements/[agreementId]/page.tsx' \
              src/app/core-trade-actions.ts \
              src/app/trades/new/page.tsx \
              src/app/sitemap.ts \
              src/components/core-trade/trade-draft-workbench.tsx \
              src/lib/public-evidence-policy.test.ts \
              src/lib/site.ts \
              src/lib/site-search.ts \
              tests/public-evidence.spec.ts
            node --import tsx --test src/lib/public-evidence-policy.test.ts
            npm run build
            npx playwright test tests/public-evidence.spec.ts --reporter=line
          ) 2>&1 | tee /tmp/public-evidence-release-checks.log
          status=${PIPESTATUS[0]}
          set -e
          exit "$status"

      - name: Post release-check diagnostics
        if: steps.finalizer.outcome == 'success' && steps.checks.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo '### Public evidence release-check failure'
            echo
            echo '```text'
            tail -n 180 /tmp/public-evidence-release-checks.log
            echo '```'
          } > /tmp/public-evidence-checks-comment.md
          gh pr comment 120 --body-file /tmp/public-evidence-checks-comment.md
          exit 1

      - name: Commit integrated implementation
        if: steps.finalizer.outcome == 'success' && steps.checks.outcome == 'success'
        shell: bash
        run: |
          git add src config tests supabase
          git commit -m "Integrate public-safe evidence into the current trade flow"
          git push origin HEAD:feature/public-evidence-desk-v2
