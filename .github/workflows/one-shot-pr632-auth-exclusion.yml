name: One-shot PR 632 authentication exclusion repair

on:
  push:
    branches:
      - fix/sitewide-canonical-visual-system-final-20260810
    paths:
      - ".github/workflows/one-shot-pr632-auth-exclusion.yml"

permissions:
  contents: write

concurrency:
  group: one-shot-pr632-auth-exclusion
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the exact PR branch
        uses: actions/checkout@v4
        with:
          ref: fix/sitewide-canonical-visual-system-final-20260810
          fetch-depth: 0

      - name: Apply authentication exclusion
        run: python .github/scripts/pr632-auth-exclusion-repair.py

      - name: Verify and commit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          node --import tsx --test src/sitewide-canonical-visual-system.test.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/canonical-visual-system.css src/app/canonical-visual-system-remediation.css src/sitewide-canonical-visual-system.test.ts tests/sitewide-canonical-visual-system.spec.ts
          git commit -m "Exclude authentication routes from sitewide visual alignment"
          git push origin HEAD:fix/sitewide-canonical-visual-system-final-20260810
