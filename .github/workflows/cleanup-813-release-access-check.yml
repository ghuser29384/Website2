name: Cleanup 813 release access check

on:
  push:
    branches:
      - ops/cleanup-813-release-access-check-20260919
    paths:
      - .github/workflows/cleanup-813-release-access-check.yml

permissions:
  contents: read

concurrency:
  group: cleanup-813-release-access-check
  cancel-in-progress: false

jobs:
  inspect:
    if: github.repository == 'ghuser29384/Website2' && github.ref == 'refs/heads/ops/cleanup-813-release-access-check-20260919'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify release token can read the exact Vercel project
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs';

          const token = process.env.VERCEL_TOKEN;
          if (!token) throw new Error('Release token is absent. No deployment was attempted.');

          const team = 'team_ySu6sF3Uho1E1GnJtCQPVEuJ';
          const project = 'prj_Em3j7Uj7RatX2R1ZYhla3XSHRde7';
          const expectedName = 'moraltrade-site';
          const probes = [
            ['project_scoped', 'https://api.vercel.com/v9/projects/' + project],
            ['project_team_param', 'https://api.vercel.com/v9/projects/' + project + '?teamId=' + team],
          ];

          const results = [];
          let authorized = false;

          for (const [check, url] of probes) {
            try {
              const response = await fetch(url, {
                method: 'GET',
                headers: { Authorization: 'Bearer ' + token },
                redirect: 'error',
                signal: AbortSignal.timeout(20000),
              });

              const result = { check, status: response.status };
              if (response.ok) {
                const body = await response.json();
                result.exactProject = body.id === project && body.name === expectedName;
                result.exactOwner = body.accountId == null ? 'not_returned' : body.accountId === team;
                if (result.exactProject && (result.exactOwner === true || result.exactOwner === 'not_returned')) {
                  authorized = true;
                }
              } else {
                await response.body?.cancel();
              }
              results.push(result);
            } catch {
              results.push({ check, status: 'request_failed' });
            }
          }

          const safe = { purpose: 'Read-only credential verification for PR 813', authorized, results, productionMutations: 0 };
          console.log(JSON.stringify(safe));
          appendFileSync(
            process.env.GITHUB_STEP_SUMMARY,
            '# Cleanup 813 release credential check\n\n' +
            'Read-only project probes using the repository Actions secret. No credential value, environment value, or raw response body is retained. ' +
            'The unscoped probe supports current Vercel scoped tokens, while the second probe preserves the legacy team-parameter check.\n\n' +
            'JSON: ' + JSON.stringify(safe) + '\n'
          );

          if (!authorized) process.exitCode = 1;
          JS
