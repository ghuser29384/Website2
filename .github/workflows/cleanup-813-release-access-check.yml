name: Cleanup 813 Vercel token-shape diagnosis

on:
  push:
    branches:
      - ops/cleanup-813-release-access-check-20260919
    paths:
      - .github/workflows/cleanup-813-release-access-check.yml

permissions:
  contents: read

jobs:
  inspect:
    if: github.repository == 'ghuser29384/Website2' && github.ref == 'refs/heads/ops/cleanup-813-release-access-check-20260919'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Classify token shape without exposing it
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          node --input-type=module <<'JS'
          const t = process.env.VERCEL_TOKEN || '';
          const shape = {
            present: t.length > 0,
            beginsWithVcp: t.startsWith('vcp'),
            beginsWithVci: t.startsWith('vci'),
            beginsWithVca: t.startsWith('vca'),
            beginsWithVck: t.startsWith('vck'),
            hasWhitespaceAtEnds: t.trim() !== t,
            containsWhitespace: /\s/.test(t),
            lengthBucket: t.length < 20 ? '<20' : t.length < 40 ? '20-39' : t.length < 80 ? '40-79' : '80+',
            productionMutations: 0
          };
          console.log(JSON.stringify(shape));
          JS
