name: A1 diagnostic artifact cleanup

on:
  pull_request:
    branches:
      - main
    paths:
      - .a1-production-smoke/**

permissions:
  actions: write
  contents: read

jobs:
  delete-exposed-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete exposed artifact and its workflow run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"
          artifact_id="8630630045"
          run_id="30197721148"

          artifact_status="$(
            curl -sS -o /tmp/delete-artifact.json -w '%{http_code}' \
              -X DELETE \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$repo/actions/artifacts/$artifact_id"
          )"
          case "$artifact_status" in
            204|404) ;;
            *)
              echo "::error::Artifact deletion returned HTTP $artifact_status"
              exit 1
              ;;
          esac

          run_status="$(
            curl -sS -o /tmp/delete-run.json -w '%{http_code}' \
              -X DELETE \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$repo/actions/runs/$run_id"
          )"
          case "$run_status" in
            204|404) ;;
            *)
              echo "::error::Workflow-run deletion returned HTTP $run_status"
              exit 1
              ;;
          esac

          echo "Deleted diagnostic artifact $artifact_id and workflow run $run_id."
