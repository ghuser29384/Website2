name: Conditional payments CI

on:
  push:
    branches:
      - payments/conditional-offset-settlement
  pull_request:
    paths:
      - "src/lib/payments/**"
      - "src/app/api/payments/conditional/**"
      - "src/app/donation-offsets/payments/**"
      - "supabase/migrations/*conditional_payment*"
      - "supabase/migrations/*conditional_payments*"
      - ".github/workflows/conditional-payments-ci.yml"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run conditional-payment and pooled-settlement tests
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node --import tsx --test \
            src/lib/payments/conditional-state.test.ts \
            src/lib/payments/checkout-payment-methods.test.ts \
            src/lib/trade-donation-pool.test.ts \
            src/lib/trade-donation-pool-source-contract.test.ts \
            src/lib/moral-trade/pooled-settlement-trigger-privilege-migration.test.ts \
            2>&1 | tee conditional-payments-test-output.txt

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conditional-payments-test-output
          path: conditional-payments-test-output.txt
          if-no-files-found: error
          retention-days: 7

      - name: Run complete repository test suite
        run: npm test

      - name: Lint conditional-payment and pooled-settlement integration
        run: >-
          npx eslint
          src/lib/payments/conditional-mandates.ts
          src/lib/payments/checkout-payment-methods.test.ts
          src/app/donation-offsets/payments/page.tsx
          src/lib/trade-donation-pool-source-contract.test.ts
          src/lib/moral-trade/pooled-settlement-trigger-privilege-migration.test.ts

      - name: Run strict TypeScript
        run: npx tsc --noEmit

      - name: Check exact diff formatting
        run: git diff --check HEAD^

      - name: Build application
        env:
          CONDITIONAL_PAYMENTS_MODE: disabled
        run: npm run build

      - name: Enforce focused test result
        if: steps.tests.outcome != 'success'
        run: exit 1
