name: Implement fiscal-sponsor funding posture

on:
  push:
    branches:
      - feat/fiscal-sponsor-funding-20260716
  pull_request:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/fiscal-sponsor-funding-20260716
          fetch-depth: 1
          show-progress: false

      - name: Apply fiscal-sponsor funding posture
        run: |
          set -o pipefail
          {
            python scripts/fix-fiscal-sponsor-patch.py
            python scripts/apply-fiscal-sponsor-funding.py
            rm scripts/fix-fiscal-sponsor-patch.py
          } 2>&1 | tee /tmp/fiscal-sponsor-patch.log

      - name: Report patch failure
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.existsSync('/tmp/fiscal-sponsor-patch.log')
              ? fs.readFileSync('/tmp/fiscal-sponsor-patch.log', 'utf8')
              : 'Patch failed without a captured log.';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Fiscal-sponsor patch failed:\n\n\`\`\`text\n${output.slice(-12000)}\n\`\`\``,
            });

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/fiscal-sponsor-tests.log

      - name: Report test failure
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('/tmp/fiscal-sponsor-tests.log')) return;
            const lines = fs.readFileSync('/tmp/fiscal-sponsor-tests.log', 'utf8').split(/\r?\n/);
            const interesting = [];
            for (let index = 0; index < lines.length; index += 1) {
              const line = lines[index];
              if (/^not ok\b|AssertionError|ERR_ASSERTION|at TestContext|^# (tests|pass|fail|duration_ms)\b/.test(line)) {
                interesting.push(...lines.slice(Math.max(0, index - 2), Math.min(lines.length, index + 5)));
              }
            }
            const concise = [...new Set(interesting)].slice(-240).join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Fiscal-sponsor test suite failed:\n\n\`\`\`text\n${concise || 'No concise failure lines found.'}\n\`\`\``,
            });

      - name: Persist concise test failure
        if: failure() && github.event_name == 'pull_request'
        run: |
          mkdir -p diagnostics
          node <<'NODE'
          const fs = require('fs');
          const lines = fs.readFileSync('/tmp/fiscal-sponsor-tests.log', 'utf8').split(/\r?\n/);
          const interesting = [];
          for (let index = 0; index < lines.length; index += 1) {
            const line = lines[index];
            if (/^not ok\b|AssertionError|ERR_ASSERTION|at TestContext|^# (tests|pass|fail|duration_ms)\b/.test(line)) {
              interesting.push(...lines.slice(Math.max(0, index - 2), Math.min(lines.length, index + 8)));
            }
          }
          fs.writeFileSync(
            'diagnostics/fiscal-sponsor-test-failure.txt',
            [...new Set(interesting)].slice(-400).join('\n') || 'No concise failure lines found.\n',
          );
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f diagnostics/fiscal-sponsor-test-failure.txt
          git commit -m "Record fiscal-sponsor test failure" -- diagnostics/fiscal-sponsor-test-failure.txt
          git push origin HEAD:feat/fiscal-sponsor-funding-20260716

      - name: Lint changed funding surfaces
        run: |
          set -o pipefail
          npx eslint \
            src/lib/funding.ts \
            src/lib/funding.test.ts \
            src/app/api/funding/readiness/route.ts \
            src/app/support/page.tsx \
            src/app/donate/page.tsx \
            src/app/status/page.tsx \
            src/app/sitemap.ts \
            src/lib/site.ts \
            src/components/mpgf/mpgf-page-frame.tsx \
            src/components/mpgf/mpgf-console.tsx \
            src/lib/mpgf/data.ts \
            src/lib/mpgf/public-goods-every-org.ts \
            src/app/mpgf/page.tsx \
            src/app/mpgf/contribute/page.tsx \
            src/app/mpgf/real-money-terms/page.tsx \
            2>&1 | tee /tmp/fiscal-sponsor-lint.log

      - name: Report lint failure
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('/tmp/fiscal-sponsor-lint.log')) return;
            const output = fs.readFileSync('/tmp/fiscal-sponsor-lint.log', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Fiscal-sponsor lint failed:\n\n\`\`\`text\n${output.slice(-12000)}\n\`\`\``,
            });

      - name: Build production application
        env:
          CONDITIONAL_PAYMENTS_MODE: disabled
          MORAL_TRADE_FUNDING_MODE: external_charities_only
          MPGF_REAL_MONEY_ENABLED: 'false'
          MPGF_REAL_MONEY_ACCEPTANCE_ENABLED: 'false'
        run: |
          set -o pipefail
          npm run build 2>&1 | tee /tmp/fiscal-sponsor-build.log

      - name: Report build failure
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('/tmp/fiscal-sponsor-build.log')) return;
            const output = fs.readFileSync('/tmp/fiscal-sponsor-build.log', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Fiscal-sponsor production build failed:\n\n\`\`\`text\n${output.slice(-12000)}\n\`\`\``,
            });

      - name: Commit verified funding posture
        run: |
          rm -f diagnostics/fiscal-sponsor-test-failure.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Adopt fiscal-sponsor funding posture"
          git push origin HEAD:feat/fiscal-sponsor-funding-20260716
