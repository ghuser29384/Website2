name: Apply and verify universal Command

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: universal-command-implementation
  cancel-in-progress: false

jobs:
  apply-verify-push:
    if: github.head_ref == 'feat/universal-command-workspace'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: feat/universal-command-workspace
          fetch-depth: 1
          show-progress: false

      - name: Apply implementation and remove one-shot machinery
        shell: bash
        run: |
          set -euo pipefail
          cat .github/universal-command-patch/part-* > /tmp/universal-command.patch.gz.b64
          echo "c59276c826d3e0819a77007e7e40bb94c741df606a9b0216ee6e1d196b287ea1  /tmp/universal-command.patch.gz.b64" | sha256sum --check
          base64 --decode /tmp/universal-command.patch.gz.b64 | gunzip > /tmp/universal-command.patch
          echo "d9e880695fcd21498fa3f49a799f4273982a52941747f1c9b49f59103a72e51e  /tmp/universal-command.patch" | sha256sum --check
          if ! git apply --check --verbose /tmp/universal-command.patch > patch-apply.log 2>&1; then
            cat patch-apply.log
            exit 1
          fi
          git apply /tmp/universal-command.patch
          python <<'PY'
          from pathlib import Path

          env_path = Path('.env.example')
          env_text = env_path.read_text()
          addition = '''
          # Universal Command planning. The model may propose typed capability calls but cannot
          # directly mutate application, payment, or agreement state. Set false to force the
          # deterministic planner even when an API key is configured.
          MORAL_TRADE_COMMAND_MODEL=gpt-5-mini
          MORAL_TRADE_COMMAND_LLM_ENABLED=true
          '''.lstrip()
          if 'MORAL_TRADE_COMMAND_MODEL=' not in env_text:
              if env_text and not env_text.endswith('\n'):
                  env_text += '\n'
              env_text += addition
              env_path.write_text(env_text)

          page_path = Path('src/app/command/page.tsx')
          page_text = page_path.read_text()
          page_text = page_text.replace(
              'import { getCommandSession, listCommandSessions } from "@/lib/command/persistence";\n',
              'import { getCommandSession, listCommandSessions } from "@/lib/command/persistence";\nimport type { CommandSessionView } from "@/lib/command/types";\n',
          )
          page_text = page_text.replace(
              '  let initialSessions = [] as Awaited<ReturnType<typeof listCommandSessions>>;\n  let initialSession = null as Awaited<ReturnType<typeof getCommandSession>>;\n',
              '  let initialSessions: CommandSessionView[] = [];\n  let initialSession: CommandSessionView | null = null;\n',
          )
          page_path.write_text(page_text)

          executor_path = Path('src/lib/command/executor.ts')
          executor_text = executor_path.read_text().replace(
              '  if (capability.permissionTier === "prohibited" || capability.executionMode === "blocked") {\n',
              '  if (capability.executionMode === "blocked") {\n',
          )
          executor_text = executor_text.replace(
              'blockers: [`Executor missing for ${capability.key}.`],',
              'blockers: ["Executor missing for an unregistered capability."],',
          )
          executor_path.write_text(executor_text)
          PY
          git rm -rf --ignore-unmatch \
            .github/universal-command-patch \
            .github/universal-command.patch.gz.b64 \
            .github/workflows/apply-universal-command.yml \
            .github/workflows/export-universal-command-source.yml
          git status --short

      - name: Upload patch diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: universal-command-patch-error
          path: patch-apply.log
          if-no-files-found: warn
          retention-days: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check browser script syntax
        run: node --check public/moral-trade-live-command-center.js

      - name: Lint changed application code
        run: |
          npx eslint \
            src/app/api/command \
            src/app/command/page.tsx \
            src/components/command \
            src/lib/command \
            src/app/mpgf/pools/new/page.tsx \
            src/components/mpgf/mpgf-console.tsx \
            src/lib/site-search.ts \
            src/lib/site.ts \
            src/lib/command-center-handoff.test.ts \
            tests/exact-live-command-center.spec.ts

      - name: Run focused Command tests
        run: node --import tsx --test src/lib/command/*.test.ts src/lib/command-center-handoff.test.ts

      - name: Build production application
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee universal-command-build.log

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: universal-command-build-error
          path: universal-command-build.log
          if-no-files-found: error
          retention-days: 1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run exact Command browser QA
        run: npm run test:e2e -- tests/exact-live-command-center.spec.ts

      - name: Commit verified implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build the universal Moral Trade Command workspace"
          git push origin HEAD:feat/universal-command-workspace
