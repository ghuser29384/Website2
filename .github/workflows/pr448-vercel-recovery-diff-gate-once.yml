name: Verify PR 448 recovery diff gate once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/pr448-vercel-recovery-diff-gate-once.yml

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pr448-vercel-recovery-diff-gate-once
  cancel-in-progress: false

env:
  CANDIDATE_SHA: 7cd518850a530c1fdb9674955ef2d5e76512b41e
  BASE_SHA: 2b264b3b7b62358f051cf0ea93e2792f6c0d695b
  CONTROLLER_PATH: .github/workflows/pr448-vercel-recovery-diff-gate-once.yml
  PR_NUMBER: 448

jobs:
  verify:
    if: github.repository == 'ghuser29384/Website2' && github.actor == 'ghuser29384'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out exact controller commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          token: ${{ github.token }}

      - name: Guard one-time controller scope
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          test "$(git diff-tree --no-commit-id --name-only -r HEAD | sed '/^$/d')" = "$CONTROLLER_PATH"

      - name: Verify exact candidate ancestry and diff
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$BASE_SHA" "$CANDIDATE_SHA" --depth=20
          git cat-file -e "$BASE_SHA^{commit}"
          git cat-file -e "$CANDIDATE_SHA^{commit}"
          git diff --check "$BASE_SHA" "$CANDIDATE_SHA"
          expected="$(cat <<'EOF'
          .github/workflows/vercel-admin-cost-controls.yml
          docs/operations/vercel-cost-controls.md
          scripts/vercel-admin-cost-controls.mjs
          scripts/vercel-admin-cost-controls.test.mjs
          scripts/vercel-admin-workflow.test.mjs
          EOF
          )"
          actual="$(git diff --name-only "$BASE_SHA" "$CANDIDATE_SHA" | sort)"
          test "$actual" = "$expected"
          test "$(git rev-list --count "$BASE_SHA..$CANDIDATE_SHA")" -ge 1
          test "$(git rev-list --count "$CANDIDATE_SHA..$BASE_SHA")" = 0

      - name: Report corrected gate result to PR 448
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [[ '${{ job.status }}' == 'success' ]]; then
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Corrected exact-diff gate passed for candidate \`$CANDIDATE_SHA\` against base \`$BASE_SHA\`: candidate ancestry, whitespace hygiene, and the exact five-file allowlist were verified. Combined with run 30705324334, focused Vercel-control tests, all 851 repository tests, ESLint, TypeScript, and the optimized production build have passed on the same candidate. Evidence: $run_url"
          else
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Corrected exact-diff gate failed for candidate \`$CANDIDATE_SHA\` against base \`$BASE_SHA\`. No readiness claim is made. Evidence: $run_url"
          fi

      - name: Remove one-time controller
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          blob_sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/$CONTROLLER_PATH?ref=main" --jq .sha 2>/dev/null || true)"
          if [[ -n "$blob_sha" ]]; then
            jq -n \
              --arg message 'Remove one-time PR 448 diff gate controller' \
              --arg sha "$blob_sha" \
              --arg branch main \
              '{message:$message,sha:$sha,branch:$branch}' \
              | gh api --method DELETE \
                  "repos/$GITHUB_REPOSITORY/contents/$CONTROLLER_PATH" \
                  --input - >/dev/null
          fi
