name: PR 558 exact preview dispatch controller

on:
  push:
    branches:
      - ops/dispatch-pr558-preview-20260808

permissions:
  contents: read
  actions: write

concurrency:
  group: pr558-exact-preview-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_RELEASE_SHA: 067908e87e7bbb4894d35f0d3afd430fabdf5f3b
      RELEASE_BRANCH: release/vercel-preview
      RELEASE_WORKFLOW_ID: "325045339"

    steps:
      - name: Check out the controller branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact immutable release branch
        shell: bash
        run: |
          set -euo pipefail
          remote_sha="$(git ls-remote origin "refs/heads/$RELEASE_BRANCH" | awk '{print $1}')"
          test "$remote_sha" = "$EXPECTED_RELEASE_SHA"
          test "${#EXPECTED_RELEASE_SHA}" -eq 40
          printf 'release_branch=%s\nrelease_sha=%s\n' \
            "$RELEASE_BRANCH" "$EXPECTED_RELEASE_SHA" \
            | tee pr558-preview-dispatch.txt

      - name: Verify no other gated Vercel release is active
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          active="$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/$RELEASE_WORKFLOW_ID/runs?status=in_progress&per_page=20" \
            --jq '.total_count')"
          test "$active" = "0"

      - name: Dispatch exact canonical Vercel preview
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/actions/workflows/$RELEASE_WORKFLOW_ID/dispatches" \
            -f ref="$RELEASE_BRANCH" \
            -f 'inputs[target]=preview' \
            -f "inputs[ref]=$RELEASE_BRANCH" \
            -f "inputs[expected_sha]=$EXPECTED_RELEASE_SHA"
