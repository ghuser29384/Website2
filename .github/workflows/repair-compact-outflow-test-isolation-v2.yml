name: Repair Compact outflow test isolation v2

on:
  push:
    branches:
      - feature/compact-authoritative-outflow-ledger-v1-20260816
    paths:
      - .github/workflows/repair-compact-outflow-test-isolation-v2.yml

permissions:
  contents: write

concurrency:
  group: repair-compact-outflow-test-isolation-v2-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      STACK_BASE_SHA: f46178aaad6d2fbd911cc365e2963bb7c73a0098
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Verify frozen scope and ordered-phase workflow
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base "$STACK_BASE_SHA" HEAD)" = "$STACK_BASE_SHA"
          workflow=.github/workflows/compact-authoritative-outflow-ledger-qa.yml
          for marker in \
            'Prepare exact split migration chain' \
            'Run legacy Compact regressions before ledger migrations' \
            'Apply authoritative outflow ledger migrations' \
            'Run database lint and final-ledger lifecycle suites' \
            'Execute ordered rollback-only authority lifecycle'; do
            grep -q "$marker" "$workflow"
          done
          git diff --name-only "$STACK_BASE_SHA"...HEAD | sort > /tmp/files.txt
          grep -qx '.github/workflows/repair-compact-outflow-test-isolation-v2.yml' /tmp/files.txt
          if grep -Ev '^(\.github/workflows/(compact-authoritative-outflow-ledger-qa|repair-compact-outflow-test-isolation-v2)\.yml|docs/mpgf/compact-authoritative-outflow-ledger-v1\.md|scripts/test-compact-authoritative-outflow-concurrency\.sh|src/components/mpgf/mpgf-public-goods-compacts\.tsx|src/lib/mpgf/compact-authoritative-outflow(-contract\.test|\.test)?\.ts|supabase/migrations/2026081614150[0-3]_compact_authoritative_outflow_.*\.sql|supabase/tests/compact_authoritative_outflow_ledger_(authorization|core)\.sql|tests/mpgf-public-goods-compacts\.spec\.ts)$' /tmp/files.txt; then
            echo 'Unexpected file outside the frozen ledger plus repair-controller scope.'
            exit 1
          fi

      - name: Isolate every regression suite deterministically
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/compact-authoritative-outflow-ledger-qa.yml')
          source = path.read_text(encoding='utf-8')

          # Normalize test bodies by removing only transaction-control lines;
          # comments, psql settings, assertions, and fixture SQL remain intact.
          old_normalizer = '''              lines = source_path.read_text(encoding='utf-8').splitlines()
              while lines and (not lines[0].strip() or lines[0].strip().startswith('--')):
                  lines.pop(0)
              if lines and lines[0].strip().lower() == 'begin;':
                  lines.pop(0)
              while lines and not lines[-1].strip():
                  lines.pop()
              if lines and lines[-1].strip().lower() == 'rollback;':
                  lines.pop()
              (output / name).write_text('\\n'.join(lines) + '\\n', encoding='utf-8')
'''
          new_normalizer = '''              lines = source_path.read_text(encoding='utf-8').splitlines()
              lines = [
                  line for line in lines
                  if line.strip().lower() not in {'begin;', 'commit;', 'rollback;'}
              ]
              (output / name).write_text('\\n'.join(lines) + '\\n', encoding='utf-8')
'''
          if source.count(old_normalizer) != 1:
              raise SystemExit(f'Expected one clean-runtime test normalizer; found {source.count(old_normalizer)}.')
          source = source.replace(old_normalizer, new_normalizer)

          old_rollback_normalizer = '''              lines = source_path.read_text(encoding='utf-8').splitlines()
              while lines and (not lines[0].strip() or lines[0].strip().startswith('--')):
                  lines.pop(0)
              if lines and lines[0].strip().lower() == 'begin;':
                  lines.pop(0)
              while lines and not lines[-1].strip():
                  lines.pop()
              if lines and lines[-1].strip().lower() == 'rollback;':
                  lines.pop()
              (test_output / name).write_text('\\n'.join(lines) + '\\n', encoding='utf-8')
'''
          new_rollback_normalizer = '''              lines = source_path.read_text(encoding='utf-8').splitlines()
              lines = [
                  line for line in lines
                  if line.strip().lower() not in {'begin;', 'commit;', 'rollback;'}
              ]
              (test_output / name).write_text('\\n'.join(lines) + '\\n', encoding='utf-8')
'''
          if source.count(old_rollback_normalizer) != 1:
              raise SystemExit(f'Expected one isolated-QA test normalizer; found {source.count(old_rollback_normalizer)}.')
          source = source.replace(old_rollback_normalizer, new_rollback_normalizer)

          def replace_section(start_marker: str, end_marker: str, replacement: str) -> None:
              nonlocal_source = None
              global source
              start = source.find(start_marker)
              if start < 0:
                  raise SystemExit(f'Missing start marker: {start_marker}')
              end = source.find(end_marker, start)
              if end < 0:
                  raise SystemExit(f'Missing end marker: {end_marker}')
              source = source[:start] + replacement + source[end:]

          preledger = '''      - name: Run legacy Compact regressions before ledger migrations
        shell: bash
        run: |
          set -euo pipefail
          : > compact-outflow-clean/pre-ledger-regressions.log
          for suite in \
            mpgf_public_goods_compacts_lifecycle \
            mpgf_public_goods_compacts_historical_freeze; do
            psql "$LOCAL_SUPABASE_DB_URL" --no-psqlrc --set ON_ERROR_STOP=1 <<SQL \
              | tee -a compact-outflow-clean/pre-ledger-regressions.log
          begin;
          \\i compact-outflow-clean/normalized-tests/${suite}.sql
          rollback;
          SQL
          done

'''
          replace_section(
              '      - name: Run legacy Compact regressions before ledger migrations\n',
              '      - name: Apply authoritative outflow ledger migrations\n',
              preledger,
          )

          finalledger = '''      - name: Run database lint and final-ledger lifecycle suites
        shell: bash
        run: |
          set -euo pipefail
          supabase db lint --db-url "$LOCAL_SUPABASE_DB_URL" --schema public --level warning --fail-on none \
            2>&1 | tee compact-outflow-clean/supabase-db-lint.log
          supabase db lint --db-url "$LOCAL_SUPABASE_DB_URL" --schema moral_trade_private --level warning --fail-on none \
            2>&1 | tee compact-outflow-clean/private-db-lint.log
          node scripts/verify-mpgf-public-goods-compacts-db-lint.mjs compact-outflow-clean/supabase-db-lint.log \
            | tee compact-outflow-clean/supabase-db-lint-owned-gate.json
          : > compact-outflow-clean/final-ledger-lifecycle.log
          for suite in \
            compact_authoritative_outflow_ledger_core \
            compact_authoritative_outflow_ledger_authorization; do
            psql "$LOCAL_SUPABASE_DB_URL" --no-psqlrc --set ON_ERROR_STOP=1 <<SQL \
              | tee -a compact-outflow-clean/final-ledger-lifecycle.log
          begin;
          \\i compact-outflow-clean/normalized-tests/${suite}.sql
          rollback;
          SQL
          done

'''
          replace_section(
              '      - name: Run database lint and final-ledger lifecycle suites\n',
              '      - name: Run genuinely concurrent canonical freeze\n',
              finalledger,
          )

          isolated = '''      - name: Execute ordered rollback-only authority lifecycle
        shell: bash
        run: |
          set -o pipefail
          psql "$QA_SUPABASE_DB_URL" --no-psqlrc --set ON_ERROR_STOP=1 <<'SQL' \
            | tee compact-outflow-rollback/lifecycle.log
          begin;
          \i supabase/migrations/20260607_moral_trade_release_gate_policy_snapshots.sql
          \i supabase/migrations/20260607_zzzzz_moral_trade_participant_eligibility_records.sql
          \i compact-outflow-rollback/migrations/20260813163052_mpgf_public_goods_compacts.sql
          \i compact-outflow-rollback/migrations/20260814031500_mpgf_public_goods_compacts_state_hardening.sql
          savepoint legacy_lifecycle;
          \i compact-outflow-rollback/normalized-tests/mpgf_public_goods_compacts_lifecycle.sql
          rollback to savepoint legacy_lifecycle;
          release savepoint legacy_lifecycle;
          savepoint legacy_historical;
          \i compact-outflow-rollback/normalized-tests/mpgf_public_goods_compacts_historical_freeze.sql
          rollback to savepoint legacy_historical;
          release savepoint legacy_historical;
          \i compact-outflow-rollback/migrations/20260816141500_compact_authoritative_outflow_ledger_v1.sql
          \i compact-outflow-rollback/migrations/20260816141501_compact_authoritative_outflow_freeze_v1.sql
          \i compact-outflow-rollback/migrations/20260816141502_compact_authoritative_outflow_hardening_v1.sql
          \i compact-outflow-rollback/migrations/20260816141503_compact_authoritative_outflow_replay_fix_v1.sql
          savepoint ledger_core;
          \i compact-outflow-rollback/normalized-tests/compact_authoritative_outflow_ledger_core.sql
          rollback to savepoint ledger_core;
          release savepoint ledger_core;
          savepoint ledger_authorization;
          \i compact-outflow-rollback/normalized-tests/compact_authoritative_outflow_ledger_authorization.sql
          rollback to savepoint ledger_authorization;
          release savepoint ledger_authorization;
          rollback;
          SQL

'''
          replace_section(
              '      - name: Execute ordered rollback-only authority lifecycle\n',
              '      - name: Prove rollback and zero fixture residue\n',
              isolated,
          )

          path.write_text(source, encoding='utf-8')
          PY
          git diff --check
          grep -q 'savepoint legacy_lifecycle' .github/workflows/compact-authoritative-outflow-ledger-qa.yml
          grep -q 'savepoint ledger_authorization' .github/workflows/compact-authoritative-outflow-ledger-qa.yml
          grep -q 'for suite in' .github/workflows/compact-authoritative-outflow-ledger-qa.yml

      - name: Commit repair and remove controller
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/compact-authoritative-outflow-ledger-qa.yml
          git rm .github/workflows/repair-compact-outflow-test-isolation-v2.yml
          git commit -m 'ci: isolate Compact outflow regression fixtures'
          git push origin "HEAD:${GITHUB_REF_NAME}"
