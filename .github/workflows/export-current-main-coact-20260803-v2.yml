name: Export current main for Co-Act reconstruction v2

on:
  push:
    branches:
      - ops/export-current-main-coact-20260803
    paths:
      - .github/workflows/export-current-main-coact-20260803-v2.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  export-and-clean:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/export-current-main-coact-20260803
          fetch-depth: 0
          persist-credentials: true

      - name: Archive tracked source only
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > /tmp/current-main-export-head.txt
          git rev-parse origin/main > /tmp/current-main-export-main.txt
          git archive --format=tar.gz --output=/tmp/current-main-source.tar.gz HEAD
          sha256sum /tmp/current-main-source.tar.gz > /tmp/current-main-source.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: current-main-coact-source-${{ github.run_id }}
          path: |
            /tmp/current-main-source.tar.gz
            /tmp/current-main-source.sha256
            /tmp/current-main-export-head.txt
            /tmp/current-main-export-main.txt
          retention-days: 1

      - name: Report artifact pointer
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh pr comment 420 --repo "$GITHUB_REPOSITORY" --body "Current-main reconstruction export is ready. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. Artifact: \`current-main-coact-source-${GITHUB_RUN_ID}\`."

      - name: Remove exporter
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/export-current-main-coact-20260803-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Remove temporary current-main source exporter v2'
          git push origin HEAD:ops/export-current-main-coact-20260803
