name: Smart query QA

on:
  pull_request:
    paths:
      - "src/lib/smart-query*"
      - "src/app/api/query/**"
      - "src/app/offers/**"
      - "src/app/people/**"
      - "src/app/wish-registry/**"
      - "src/app/evidence/**"
      - "src/app/pools/**"
      - "src/app/mpgf/pools/**"
      - "src/components/layout/site-topbar.tsx"
      - "src/components/search/**"
      - "public/moral-trade-smart-query.js"
      - "public/moral-trade-discover.html"
      - "tests/smart-query*.spec.ts"
      - "tests/discover-query-audit.spec.ts"
      - ".github/workflows/smart-query-qa.yml"
  push:
    branches:
      - feat/smart-query-pipeline

permissions:
  contents: read

jobs:
  smart-query-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Inventory query surfaces
        run: |
          mkdir -p test-results
          rg -n --glob '!public/discover/payload/**' --glob '!public/mt-live-*' --glob '!package-lock.json' \
            'role="search"|type="search"|name="(search|q|query|sort|filter)"|searchParams|URLSearchParams|\.order\(' \
            src public tests > test-results/query-surface-audit.txt || true

      - name: Install dependencies
        run: npm ci

      - name: Lint smart query code
        run: |
          set -o pipefail
          npx eslint \
            src/lib/smart-query.ts \
            src/lib/smart-query-clarification.ts \
            src/lib/smart-query-llm.ts \
            src/lib/smart-query.test.ts \
            src/app/api/query/interpret/route.ts \
            src/components/search/smart-query-form.tsx \
            tests/discover-query-audit.spec.ts 2>&1 | tee test-results/smart-query-lint.txt

      - name: Test deterministic and semantic query interpretation
        run: |
          set -o pipefail
          node --import tsx --test src/lib/smart-query.test.ts 2>&1 | tee test-results/smart-query-test.txt

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Audit rendered Discover query controls
        run: npx playwright test tests/discover-query-audit.spec.ts --reporter=line

      - name: Upload query audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smart-query-audit
          path: |
            test-results/discover-query-audit.json
            test-results/discover-inline-source.js
            test-results/query-surface-audit.txt
            test-results/smart-query-lint.txt
            test-results/smart-query-test.txt
          if-no-files-found: warn
          retention-days: 7
