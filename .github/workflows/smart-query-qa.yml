name: Smart query QA

on:
  pull_request:
    paths:
      - "src/lib/smart-query*"
      - "src/lib/discover-search*"
      - "src/lib/smart-discovery-ranking.ts"
      - "src/lib/smart-evidence-ranking*"
      - "src/lib/smart-people-ranking.ts"
      - "src/lib/site-search-smart.ts"
      - "src/lib/live-discover-navigation.test.ts"
      - "src/discover/**"
      - "src/app/api/query/**"
      - "src/app/api/discover/**"
      - "src/app/layout.tsx"
      - "src/app/offers/**"
      - "src/app/people/**"
      - "src/app/wish-registry/**"
      - "src/app/evidence/**"
      - "src/app/pools/**"
      - "src/app/mpgf/pools/**"
      - "src/components/layout/site-topbar.tsx"
      - "src/components/search/**"
      - "public/discover/payload/**"
      - "public/moral-trade-smart-query.js"
      - "public/moral-trade-discover-search-preflight.js"
      - "public/moral-trade-discover-search.js"
      - "public/moral-trade-discover.html"
      - "scripts/pack-discover-payload.mjs"
      - "scripts/discover-two-sided-contract.test.mjs"
      - "scripts/discover-cofund-contract.test.mjs"
      - "scripts/discover-live-search-loader-contract.test.mjs"
      - "tests/smart-query*.spec.ts"
      - "tests/discover-query-audit.spec.ts"
      - "tests/discover-live-search.spec.ts"
      - "tests/discover-preflight-filter.spec.ts"
      - "tests/discover-payload-cache.spec.ts"
      - "tests/discover-cofund.spec.ts"
      - "tests/offers-directory-layout.spec.ts"
      - "package.json"
      - ".github/workflows/smart-query-qa.yml"
  push:
    branches:
      - feat/smart-query-pipeline

permissions:
  contents: read

# Only the newest branch head should consume the full build and browser-test budget.
concurrency:
  group: smart-query-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smart-query-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Inventory query surfaces
        run: |
          mkdir -p qa-results
          set +e
          grep -RInE \
            --include='*.ts' \
            --include='*.tsx' \
            --include='*.js' \
            --include='*.mjs' \
            --include='*.html' \
            --exclude='package-lock.json' \
            --exclude-dir='payload' \
            --exclude='mt-live-*' \
            'role="search"|type="search"|name="(search|q|query|sort|filter)"|searchParams|URLSearchParams|\.order\(' \
            src public tests > qa-results/query-surface-audit.txt
          status=$?
          set -e
          if [ "$status" -gt 1 ]; then
            exit "$status"
          fi

      - name: Install dependencies
        run: npm ci

      - name: Lint smart query code and integrated surfaces
        run: |
          set -o pipefail
          npx eslint \
            src/lib/smart-query.ts \
            src/lib/smart-query-clarification.ts \
            src/lib/smart-query-facets.ts \
            src/lib/smart-query-llm.ts \
            src/lib/smart-query-llm-gate.ts \
            src/lib/smart-query-llm-gate.test.ts \
            src/lib/smart-query-llm-timeout.test.ts \
            src/lib/smart-query-llm-generation.test.ts \
            src/lib/smart-query-personalization.ts \
            src/lib/smart-query-records.ts \
            src/lib/smart-query-scoring.ts \
            src/lib/smart-query-surface-policy.ts \
            src/lib/smart-query.test.ts \
            src/lib/discover-search.ts \
            src/lib/discover-search-plan.ts \
            src/lib/discover-search.test.ts \
            src/lib/smart-discovery-ranking.ts \
            src/lib/smart-evidence-ranking.ts \
            src/lib/smart-evidence-ranking.test.ts \
            src/lib/smart-people-ranking.ts \
            src/lib/site-search-smart.ts \
            src/lib/live-discover-navigation.test.ts \
            src/app/api/query/interpret/route.ts \
            src/app/api/discover/search/route.ts \
            src/app/layout.tsx \
            src/app/offers/page.tsx \
            src/app/offers/offer-plane-inline-mount.tsx \
            src/app/offers/offer-visual-card.tsx \
            src/app/people/page.tsx \
            src/app/pools/page.tsx \
            src/app/mpgf/pools/page.tsx \
            src/app/wish-registry/page.tsx \
            'src/app/evidence/[[...recordId]]/page.tsx' \
            src/components/layout/site-topbar.tsx \
            src/components/search/smart-query-auto-enhancer.tsx \
            src/components/search/smart-query-form.tsx \
            tests/discover-query-audit.spec.ts \
            tests/discover-live-search.spec.ts \
            tests/discover-preflight-filter.spec.ts \
            tests/discover-payload-cache.spec.ts \
            tests/discover-cofund.spec.ts \
            tests/offers-directory-layout.spec.ts 2>&1 | tee qa-results/smart-query-lint.txt

      - name: Test deterministic query interpretation and Discover loader semantics
        run: |
          set -o pipefail
          node --import tsx --test \
            src/lib/smart-query.test.ts \
            src/lib/smart-query-llm-gate.test.ts \
            src/lib/smart-query-llm-timeout.test.ts \
            src/lib/smart-query-llm-generation.test.ts \
            src/lib/smart-evidence-ranking.test.ts \
            src/lib/live-discover-navigation.test.ts 2>&1 | tee qa-results/smart-query-test.txt

      - name: Verify canonical Discover payload, Co-Fund, live-search, and two-sided contracts
        run: |
          set -o pipefail
          npm run verify:discover 2>&1 | tee qa-results/discover-contracts.txt

      - name: Build production application
        run: |
          set -o pipefail
          npm run build 2>&1 | tee qa-results/smart-query-build.txt

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run rendered Discover and live Offers desktop and mobile QA
        run: |
          set -o pipefail
          npx playwright test \
            tests/discover-query-audit.spec.ts \
            tests/discover-live-search.spec.ts \
            tests/discover-preflight-filter.spec.ts \
            tests/discover-payload-cache.spec.ts \
            tests/discover-cofund.spec.ts \
            tests/offers-directory-layout.spec.ts \
            --reporter=line 2>&1 | tee qa-results/smart-query-e2e.txt

      - name: Upload Discover and live Offers QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: discover-live-search-cofund-offers-qa
          path: |
            test-results/discover-*
            test-results/offers-directory-*
            qa-results/query-surface-audit.txt
            qa-results/smart-query-lint.txt
            qa-results/smart-query-test.txt
            qa-results/discover-contracts.txt
            qa-results/smart-query-build.txt
            qa-results/smart-query-e2e.txt
          if-no-files-found: warn
          retention-days: 7
