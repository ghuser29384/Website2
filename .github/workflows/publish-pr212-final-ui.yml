name: Publish PR 212 final institutional UI

on:
  push:
    branches:
      - ops/pr212-final-ui-publish-20260730
    paths:
      - .github/workflows/publish-pr212-final-ui.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-pr212-final-institutional-ui
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      FEATURE_BRANCH: feat/institutional-trade-system
      PAYLOAD_BRANCH: ops/pr212-final-ui-publish-20260730
      EXPECTED_HEAD: 9ec3bd79618a704469bc4f3547d2d8a1e4dc2730
      EXPECTED_BASE64_SHA256: 46352b4f6e89992c17e15e0505587d98d964d218e22612f96f2615fe3f810354
      EXPECTED_GZIP_SHA256: 3afa3f3226a5e014c3173979aa2f50e8796ce473859ab680b6663e6d01a9fd86
      EXPECTED_PATCH_SHA256: 62e1fa2b4976d50a1b22897437d80d3b8581e90b0445f4524fd6e9f9ba313fae
    steps:
      - name: Check out exact feature head
        uses: actions/checkout@v4
        with:
          ref: feat/institutional-trade-system
          fetch-depth: 0

      - name: Reconstruct and verify the exact patch
        shell: bash
        run: |
          set -euo pipefail
          actual_head="$(git rev-parse HEAD)"
          if [[ "$actual_head" != "$EXPECTED_HEAD" ]]; then
            echo "PR #212 moved: expected $EXPECTED_HEAD, got $actual_head" >&2
            exit 1
          fi

          git fetch origin "refs/heads/${PAYLOAD_BRANCH}:refs/remotes/origin/${PAYLOAD_BRANCH}"
          payload=/tmp/pr212-final.patch.gz.b64
          normalized_payload=/tmp/pr212-final.patch.gz.normalized.b64
          gzip_file=/tmp/pr212-final.patch.gz
          patch=/tmp/pr212-final.patch
          chunk_dir=/tmp/pr212-final-payload-chunks
          rm -rf "$chunk_dir"
          mkdir -p "$chunk_dir"
          : > "$payload"
          for number in $(seq 0 10); do
            index="$(printf '%03d' "$number")"
            chunk_path="${chunk_dir}/chunk-${index}.b64"
            git show "refs/remotes/origin/${PAYLOAD_BRANCH}:.github/pr212-final-payload.chunk-${index}" > "$chunk_path"
            cat "$chunk_path" >> "$payload"
          done

          python - "$chunk_dir" "$payload" "$normalized_payload" "$gzip_file" <<'PY'
          from __future__ import annotations

          import base64
          import hashlib
          import os
          from pathlib import Path
          import sys

          chunk_dir, source_path, normalized_path, decoded_path = map(Path, sys.argv[1:])
          expected_base64 = os.environ["EXPECTED_BASE64_SHA256"]
          expected_gzip = os.environ["EXPECTED_GZIP_SHA256"]
          alphabet = b"ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/"
          whitespace = b" \t\r\n\v\f"

          chunks: list[bytes] = []
          boundaries = [0]
          for path in sorted(chunk_dir.glob("chunk-*.b64")):
              raw_chunk = path.read_bytes()
              clean_chunk = bytes(byte for byte in raw_chunk if byte not in whitespace)
              invalid = [(index, byte) for index, byte in enumerate(clean_chunk) if byte not in alphabet + b"="]
              if invalid:
                  raise SystemExit(f"{path.name} contains invalid base64 bytes: {invalid[:20]}")
              padding_positions = [index for index, byte in enumerate(clean_chunk) if byte == ord("=")]
              print(
                  f"{path.name}: bytes={len(clean_chunk)} sha256={hashlib.sha256(clean_chunk).hexdigest()} "
                  f"padding={padding_positions[:10]}"
              )
              chunks.append(clean_chunk)
              boundaries.append(boundaries[-1] + len(clean_chunk))

          reconstructed = b"".join(chunks)
          source_path.write_bytes(reconstructed)
          print(f"Reconstructed bytes: {len(reconstructed)}")
          print(f"Reconstructed SHA-256: {hashlib.sha256(reconstructed).hexdigest()}")
          print(f"Chunk boundaries: {boundaries}")

          def decode_and_check(candidate: bytes) -> bytes | None:
              try:
                  decoded = base64.b64decode(candidate, validate=True)
              except Exception:
                  return None
              if hashlib.sha256(decoded).hexdigest() != expected_gzip:
                  return None
              return decoded

          candidates: list[tuple[str, bytes, bytes]] = []

          # First try the reconstructed payload as a single canonical base64 string.
          no_whitespace = reconstructed
          if b"=" not in no_whitespace[:-2]:
              remainder = len(no_whitespace) % 4
              if remainder != 1:
                  canonical = no_whitespace + b"=" * ((4 - remainder) % 4)
                  decoded = decode_and_check(canonical)
                  if decoded is not None:
                      candidates.append(("canonical reconstructed payload", canonical, decoded))

          # The stored transport was assembled through multiple connector writes. If a
          # single base64 character was omitted at a chunk boundary and an unrelated tail
          # was appended after the original terminal padding, recover only a candidate
          # whose decoded bytes match the pre-recorded exact gzip SHA-256.
          first_padding = reconstructed.find(b"=")
          if first_padding >= 0 and first_padding < len(reconstructed) - 2:
              core = reconstructed[:first_padding]
              padding_end = first_padding
              while padding_end < len(reconstructed) and reconstructed[padding_end] == ord("="):
                  padding_end += 1
              tail = reconstructed[padding_end:]
              print(
                  f"Internal padding begins at {first_padding}; padding run length={padding_end-first_padding}; "
                  f"discarded-tail-bytes-if-recovered={len(tail)}; tail-sha256={hashlib.sha256(tail).hexdigest()}"
              )
              insertion_positions = set()
              for boundary in boundaries:
                  for delta in (-2, -1, 0, 1, 2):
                      position = boundary + delta
                      if 0 <= position <= len(core):
                          insertion_positions.add(position)
              for position in sorted(insertion_positions):
                  for character in alphabet:
                      repaired_core = core[:position] + bytes((character,)) + core[position:]
                      remainder = len(repaired_core) % 4
                      if remainder == 1:
                          continue
                      candidate = repaired_core + b"=" * ((4 - remainder) % 4)
                      decoded = decode_and_check(candidate)
                      if decoded is not None:
                          candidates.append(
                              (
                                  f"single-character boundary recovery at offset {position} with {chr(character)!r}",
                                  candidate,
                                  decoded,
                              )
                          )

          # The exact gzip hash makes any accepted recovery unique and fail-closed.
          unique: dict[bytes, tuple[str, bytes]] = {}
          for description, candidate, decoded in candidates:
              unique.setdefault(decoded, (description, candidate))
          if len(unique) != 1:
              descriptions = [description for description, _, _ in candidates]
              raise SystemExit(
                  f"Expected exactly one payload whose decoded SHA-256 is {expected_gzip}; "
                  f"found {len(unique)}. Candidate descriptions: {descriptions}"
              )

          decoded, (description, candidate) = next(iter(unique.items()))
          candidate_sha = hashlib.sha256(candidate).hexdigest()
          print(f"Accepted recovery: {description}")
          print(f"Accepted base64 bytes: {len(candidate)}")
          print(f"Accepted base64 SHA-256: {candidate_sha}")
          print(f"Expected base64 SHA-256: {expected_base64}")
          print(f"Decoded gzip bytes: {len(decoded)}")
          print(f"Decoded gzip SHA-256: {hashlib.sha256(decoded).hexdigest()}")
          normalized_path.write_bytes(candidate)
          decoded_path.write_bytes(decoded)
          PY

          echo "${EXPECTED_GZIP_SHA256}  ${gzip_file}" | sha256sum --check --strict
          gzip --decompress --stdout "$gzip_file" > "$patch"
          echo "${EXPECTED_PATCH_SHA256}  ${patch}" | sha256sum --check --strict

          git apply --check --binary "$patch"
          git apply --binary "$patch"
          git diff --check

          cat > /tmp/expected-files.txt <<'FILES'
          .github/scripts/institutional-trade-qa-e2e.mjs
          .github/workflows/institutional-trade-qa.yml
          src/app/institutions/[organizationId]/deals/[dealId]/page.tsx
          src/app/institutions/[organizationId]/page.tsx
          src/app/institutions/actions.ts
          src/app/institutions/individual/deals/[dealId]/page.tsx
          src/app/institutions/individual/page.tsx
          src/app/institutions/institutions.module.css
          src/components/institutions/institutional-deal-workspace.tsx
          src/components/institutions/institutional-organization-administration.tsx
          src/institutional-individual-capacity.test.ts
          src/institutional-product-completeness.test.ts
          src/institutional-trade-migration.test.ts
          src/institutional-trade-wiring.test.ts
          src/lib/institutional-data.ts
          supabase/migrations/20260726123000_institutional_trade_system.sql
          FILES
          git diff --name-only | sort > /tmp/actual-files.txt
          sort -o /tmp/expected-files.txt /tmp/expected-files.txt
          diff -u /tmp/expected-files.txt /tmp/actual-files.txt

          mkdir -p /tmp/pr212-final-publication-evidence
          cp /tmp/expected-files.txt /tmp/pr212-final-publication-evidence/expected-files.txt
          cp /tmp/actual-files.txt /tmp/pr212-final-publication-evidence/actual-files.txt
          {
            printf 'expected_base64_sha256=%s\n' "$EXPECTED_BASE64_SHA256"
            sha256sum "$payload" "$normalized_payload" "$gzip_file" "$patch"
          } > /tmp/pr212-final-publication-evidence/payload-hashes.txt
          git diff --stat > /tmp/pr212-final-publication-evidence/diff-stat.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies with transient-registry retry
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            if npm ci; then exit 0; fi
            if (( attempt == 4 )); then exit 1; fi
            sleep $((attempt * 20))
          done

      - name: Run institutional source and domain tests
        shell: bash
        run: |
          set -euo pipefail
          node --import tsx --test \
            src/institutional-individual-capacity.test.ts \
            src/institutional-product-completeness.test.ts \
            src/institutional-trade-migration.test.ts \
            src/institutional-trade-wiring.test.ts \
            src/lib/institutional-trade.test.ts \
            src/lib/institutional-webhooks.test.ts
          node --check .github/scripts/institutional-trade-qa-e2e.mjs

      - name: Require absolute TypeScript success
        run: npx tsc --noEmit --pretty false

      - name: Require absolute ESLint success
        run: npm run lint

      - name: Require absolute production build success
        run: npm run build

      - name: Commit exact implementation to PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete institutional trade interfaces and authenticated workflows"
          git push origin HEAD:"${FEATURE_BRANCH}"
          git rev-parse HEAD | tee /tmp/pr212-final-publication-evidence/published-commit.txt

      - name: Upload publication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr212-final-ui-publication-${{ github.run_id }}
          path: /tmp/pr212-final-publication-evidence
          if-no-files-found: warn
          retention-days: 7
