name: Read PR 158 browser v3 failure

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/read-pr158-browser-v3-log.yml"
      - ".github/scripts/read-pr158-browser-v3-log.py"

permissions:
  actions: read
  contents: read

jobs:
  extract:
    if: >-
      github.event.pull_request.head.repo.full_name == 'ghuser29384/Website2' &&
      github.head_ref == 'ops/read-pr158-browser-v3-log-20260727'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Extract sanitized desktop, mobile, and enforcement logs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/read-pr158-browser-v3-log.py > pr158-browser-v3-failure.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pr158-browser-v3-failure-${{ github.run_id }}
          path: pr158-browser-v3-failure.txt
          if-no-files-found: error
          retention-days: 1
