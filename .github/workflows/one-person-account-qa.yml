name: One-person account QA

on:
  pull_request:
    paths:
      - ".github/workflows/one-person-account-qa.yml"
      - "docs/one-person-one-account.md"
      - "scripts/test-one-person-concurrency.sh"
      - "src/app/account/identity/**"
      - "src/app/admin/identity/**"
      - "src/app/api/identity/**"
      - "src/app/auth/confirm/route.ts"
      - "src/app/identity/**"
      - "src/app/signup/page.tsx"
      - "src/components/auth/auth-card.tsx"
      - "src/lib/identity/**"
      - "supabase/migrations/20260731072000_one_person_one_account.sql"
      - "supabase/migrations/20260801153000_one_person_profile_badge_projection_trigger.sql"
      - "supabase/tests/one_person_one_account.sql"
      - "tests/one-person-account-authenticated.spec.ts"
      - "package.json"
  workflow_dispatch:
    inputs:
      expect_auth_hook:
        description: "Require the QA Before User Created hook test"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: one-person-account-qa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repository-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact feature boundary and diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git diff --check origin/main...HEAD
          cat > /tmp/one-person-expected-paths.txt <<'EOF'
          .env.example
          .github/workflows/one-person-account-qa.yml
          docs/one-person-one-account.md
          package.json
          scripts/test-one-person-concurrency.sh
          src/app/account/identity/page.tsx
          src/app/actions.ts
          src/app/admin/identity/page.tsx
          src/app/api/identity/provider/route.ts
          src/app/api/identity/qa/complete/route.ts
          src/app/auth/confirm/route.ts
          src/app/identity/actions.ts
          src/app/identity/identity.module.css
          src/app/identity/page.tsx
          src/app/identity/recovery/page.tsx
          src/app/identity/status/page.tsx
          src/app/signup/page.tsx
          src/components/auth/auth-card.tsx
          src/lib/identity/one-person-account.test.ts
          src/lib/identity/one-person-account.ts
          src/lib/identity/server.ts
          supabase/migrations/20260731072000_one_person_one_account.sql
          supabase/migrations/20260801153000_one_person_profile_badge_projection_trigger.sql
          supabase/tests/one_person_one_account.sql
          tests/one-person-account-authenticated.spec.ts
          EOF
          sed -i 's/^          //' /tmp/one-person-expected-paths.txt
          sort -u /tmp/one-person-expected-paths.txt -o /tmp/one-person-expected-paths.txt
          git diff --name-only origin/main...HEAD | sort -u | tee one-person-changed-paths.txt
          diff -u /tmp/one-person-expected-paths.txt one-person-changed-paths.txt
          test ! -e .github/one-person-bootstrap
          test ! -e .github/workflows/materialize-one-person-account.yml
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install exact dependencies
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            if npm ci; then exit 0; fi
            if (( attempt == 4 )); then exit 1; fi
            sleep $((attempt * 20))
          done
      - name: Focused one-person-account tests
        run: set -o pipefail; npm run test:one-person-account 2>&1 | tee one-person-focused.txt
      - name: Complete repository tests
        run: set -o pipefail; npm test 2>&1 | tee one-person-unit.txt
      - name: TypeScript
        run: set -o pipefail; npx tsc --noEmit 2>&1 | tee one-person-typescript.txt
      - name: ESLint
        run: set -o pipefail; npm run lint -- --quiet 2>&1 | tee one-person-eslint.txt
      - name: Production build
        env:
          NEXT_PUBLIC_SITE_URL: https://www.moraltrade.org
          SITE_URL: https://www.moraltrade.org
          VERCEL: "1"
          VERCEL_ENV: preview
        run: set -o pipefail; npm run build 2>&1 | tee one-person-build.txt
      - name: Upload repository evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: one-person-account-repository-gates-${{ github.run_id }}
          path: |
            one-person-changed-paths.txt
            one-person-focused.txt
            one-person-unit.txt
            one-person-typescript.txt
            one-person-eslint.txt
            one-person-build.txt
            .next/build-manifest.json
            .next/routes-manifest.json
          if-no-files-found: warn

  isolated-qa:
    needs: repository-gates
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      QA_PROJECT_REF: hvmxfjjbdcgjjudmthdz
      MORALTRADE_QA_DATABASE_URL: ${{ secrets.QA_SUPABASE_DB_URL }}
      NEXT_PUBLIC_SUPABASE_URL: https://hvmxfjjbdcgjjudmthdz.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.QA_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.QA_SUPABASE_SERVICE_ROLE_KEY }}
      QA_TEST_PASSWORD: ${{ secrets.QA_TEST_PASSWORD }}
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3210
      SITE_URL: http://127.0.0.1:3210
      ADMIN_EMAILS: ${{ secrets.QA_ADMIN_EMAILS }}
      ONE_PERSON_ACCOUNT_PROVIDER_MODE: qa_mock
      ONE_PERSON_ACCOUNT_PROVIDER_NAME: MoralTrade QA
      ONE_PERSON_ACCOUNT_REGISTRATION_ENFORCEMENT_ENABLED: "true"
      ONE_PERSON_ACCOUNT_PARTICIPATION_ENFORCEMENT_ENABLED: "true"
      ONE_PERSON_ACCOUNT_MANUAL_LINKING_ENABLED: "true"
      ONE_PERSON_ACCOUNT_QA_RUN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}
      ONE_PERSON_ACCOUNT_EXPECT_AUTH_HOOK: ${{ inputs.expect_auth_hook || 'false' }}
      VERCEL_ENV: preview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install exact dependencies
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            if npm ci; then exit 0; fi
            if (( attempt == 4 )); then exit 1; fi
            sleep $((attempt * 20))
          done
      - name: Derive domain-separated QA-only identity secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${QA_TEST_PASSWORD:-}" || { echo "Missing required QA secret: QA_TEST_PASSWORD" >&2; exit 1; }
          qa_secret="$(printf 'one-person-qa-api:%s' "$QA_TEST_PASSWORD" | sha256sum | awk '{print $1}')"
          dedupe_key="$(printf 'one-person-qa-dedupe:%s' "$QA_TEST_PASSWORD" | sha256sum | awk '{print $1}')"
          echo "::add-mask::$qa_secret"
          echo "::add-mask::$dedupe_key"
          echo "ONE_PERSON_ACCOUNT_QA_SECRET=$qa_secret" >> "$GITHUB_ENV"
          echo "ONE_PERSON_ACCOUNT_DEDUPE_KEY=$dedupe_key" >> "$GITHUB_ENV"
      - name: Validate isolated QA target and credentials
        shell: bash
        run: |
          set -euo pipefail
          for name in MORALTRADE_QA_DATABASE_URL NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY SUPABASE_SERVICE_ROLE_KEY ONE_PERSON_ACCOUNT_QA_SECRET ONE_PERSON_ACCOUNT_DEDUPE_KEY; do
            test -n "${!name:-}" || { echo "Missing required QA secret: $name" >&2; exit 1; }
          done
          test "$QA_PROJECT_REF" = "hvmxfjjbdcgjjudmthdz"
          test "$NEXT_PUBLIC_SUPABASE_URL" = "https://hvmxfjjbdcgjjudmthdz.supabase.co"
          [[ "$MORALTRADE_QA_DATABASE_URL" == *"hvmxfjjbdcgjjudmthdz"* ]] || {
            echo "Database URL does not target isolated MoralTrade QA." >&2
            exit 1
          }
          [[ "$MORALTRADE_QA_DATABASE_URL" != *"jnpoxvalyjtdghnperyu"* ]] || {
            echo "Production database URL detected; refusing to continue." >&2
            exit 1
          }
      - name: Install PostgreSQL and evidence tooling
        run: sudo apt-get update && sudo apt-get install -y postgresql-client jq
      - name: Apply additive migrations once to isolated QA
        shell: bash
        run: |
          set -euo pipefail
          identity_migration=supabase/migrations/20260731072000_one_person_one_account.sql
          profile_migration=supabase/migrations/20260801153000_one_person_profile_badge_projection_trigger.sql
          test "$(grep -cF '$one_person_migration_relation_locks$' "$identity_migration" || true)" -eq 0
          sha256sum "$identity_migration" "$profile_migration" | tee one-person-migrations.sha256
          present="$(psql "$MORALTRADE_QA_DATABASE_URL" -v ON_ERROR_STOP=1 -qAtc "select to_regclass('moral_trade_private.person_account_release_gates') is not null")"
          if [[ "$present" == "t" ]]; then
            echo "One-person-account schema already exists in isolated QA; verifying instead of replaying persistent migrations."
          else
            psql "$MORALTRADE_QA_DATABASE_URL" -v ON_ERROR_STOP=1 -f "$identity_migration" | tee one-person-identity-migration.txt
            psql "$MORALTRADE_QA_DATABASE_URL" -v ON_ERROR_STOP=1 -f "$profile_migration" | tee one-person-profile-migration.txt
          fi
          psql "$MORALTRADE_QA_DATABASE_URL" -v ON_ERROR_STOP=1 -qAt <<'SQL' | tee one-person-schema-inventory.txt
          select jsonb_build_object(
            'releaseGates', to_regclass('moral_trade_private.person_account_release_gates') is not null,
            'personAccounts', to_regclass('moral_trade_private.person_accounts') is not null,
            'identitySubjects', to_regclass('moral_trade_private.identity_subjects') is not null,
            'registrationGrants', to_regclass('moral_trade_private.person_registration_grants') is not null,
            'beforeUserCreatedHook', to_regprocedure('public.one_person_before_user_created_hook(jsonb)') is not null,
            'customAccessTokenHook', to_regprocedure('public.one_person_custom_access_token_hook(jsonb)') is not null,
            'cleanupFixture', to_regprocedure('public.cleanup_one_person_qa_fixture_v1(uuid,text)') is not null,
            'cleanupSession', to_regprocedure('public.cleanup_one_person_qa_session_v1(uuid,text)') is not null,
            'profileBadgeTrigger', exists (
              select 1
              from pg_catalog.pg_trigger trigger_row
              join pg_catalog.pg_class relation on relation.oid = trigger_row.tgrelid
              join pg_catalog.pg_namespace namespace on namespace.oid = relation.relnamespace
              where namespace.nspname = 'public'
                and relation.relname = 'profiles'
                and trigger_row.tgname = 'sync_identity_badge_from_profile'
                and not trigger_row.tgisinternal
            )
          );
          SQL
          grep -q '"releaseGates": true' one-person-schema-inventory.txt
          grep -q '"beforeUserCreatedHook": true' one-person-schema-inventory.txt
          grep -q '"profileBadgeTrigger": true' one-person-schema-inventory.txt
      - name: Normalize isolated QA release gates to disabled
        shell: bash
        run: |
          set -euo pipefail
          psql "$MORALTRADE_QA_DATABASE_URL" -v ON_ERROR_STOP=1 -qAt <<'SQL' | tee one-person-gates-before.json
          select public.configure_person_account_release_v1('qa_mock', true, false, false, null);
          SQL
          jq -e '
            .providerMode == "qa_mock" and
            .providerReady == true and
            .registrationEnforcementEnabled == false and
            .participationEnforcementEnabled == false
          ' one-person-gates-before.json >/dev/null
      - name: Replay relation-isolated migrations under adversarial lock order with rollback
        shell: bash
        run: |
          set -euo pipefail
          identity_migration=supabase/migrations/20260731072000_one_person_one_account.sql
          profile_migration=supabase/migrations/20260801153000_one_person_profile_badge_projection_trigger.sql

          python3 - <<'PY'
          from pathlib import Path

          source_path = Path("supabase/migrations/20260731072000_one_person_one_account.sql")
          lines = source_path.read_text(encoding="utf-8").splitlines()
          try:
              start = next(index for index, line in enumerate(lines) if line.strip() == "begin;")
          except StopIteration as exc:
              raise SystemExit("identity migration begin statement not found") from exc

          end = len(lines) - 1
          while end >= 0 and not lines[end].strip():
              end -= 1
          if end <= start or lines[end].strip() != "commit;":
              raise SystemExit("identity migration final commit statement not found")

          reset = r'''do $reset_one_person_replay_triggers$
          declare
            item record;
          begin
            for item in
              select * from (values
                ('person_account_release_gates', 'person_account_release_gates_touch_updated_at'),
                ('identity_subjects', 'identity_subjects_touch_updated_at'),
                ('preaccount_verification_sessions', 'preaccount_verification_sessions_touch_updated_at'),
                ('person_accounts', 'person_accounts_touch_updated_at'),
                ('preaccount_guardian_consents', 'preaccount_guardian_consents_touch_updated_at'),
                ('guardian_relationships', 'guardian_relationships_touch_updated_at'),
                ('account_merge_cases', 'account_merge_cases_touch_updated_at'),
                ('identity_verification_events', 'identity_verification_events_append_only'),
                ('account_security_events', 'account_security_events_append_only'),
                ('identity_dedupe_keys', 'identity_dedupe_keys_no_delete')
              ) as configured(table_name, trigger_name)
            loop
              if to_regclass('moral_trade_private.' || item.table_name) is not null then
                execute format(
                  'drop trigger if exists %I on moral_trade_private.%I',
                  item.trigger_name,
                  item.table_name
                );
              end if;
            end loop;
          end;
          $reset_one_person_replay_triggers$;'''

          body = "\n".join(lines[start + 1 : end]).rstrip() + "\n"
          replay = (
              "\\set ON_ERROR_STOP on\n"
              "begin;\n"
              "set local statement_timeout = '180s';\n"
              "set local lock_timeout = '150s';\n\n"
              + reset
              + "\n\n"
              + body
              + "\nrollback;\n"
          )
          Path("/tmp/one-person-identity-replay.sql").write_text(replay, encoding="utf-8")

          profile_source = Path(
              "supabase/migrations/20260801153000_one_person_profile_badge_projection_trigger.sql"
          ).read_text(encoding="utf-8").rstrip()
          if not profile_source.endswith("commit;"):
              raise SystemExit("profile migration final commit statement not found")
          Path("/tmp/one-person-profile-replay.sql").write_text(
              profile_source[:-len("commit;")] + "rollback;\n",
              encoding="utf-8",
          )
          PY

          sha256sum /tmp/one-person-identity-replay.sql /tmp/one-person-profile-replay.sql             | tee one-person-replays.sha256
          cat > /tmp/one-person-lock-blocker.sql <<'SQL'
          \set ON_ERROR_STOP on
          begin;
          set local statement_timeout = '180s';
          lock table public.profiles in access share mode;
          select pg_advisory_lock(93791, 379);
          select 'blocker-profile-lock-acquired';
          select pg_sleep(2);
          lock table auth.users in row exclusive mode;
          select 'blocker-auth-lock-acquired';
          select pg_sleep(2);
          commit;
          select pg_advisory_unlock(93791, 379);
          SQL

          blocker_pid=''
          cleanup_blocker() {
            if [[ -n "$blocker_pid" ]] && kill -0 "$blocker_pid" 2>/dev/null; then
              kill "$blocker_pid" 2>/dev/null || true
              wait "$blocker_pid" 2>/dev/null || true
            fi
          }
          trap cleanup_blocker EXIT

          psql "$MORALTRADE_QA_DATABASE_URL"             -v ON_ERROR_STOP=1             -f /tmp/one-person-lock-blocker.sql             > one-person-lock-blocker.txt 2>&1 &
          blocker_pid=$!

          blocker_ready=false
          for attempt in $(seq 1 200); do
            readiness="$(psql "$MORALTRADE_QA_DATABASE_URL" -v ON_ERROR_STOP=1 -qAtc               "select pg_try_advisory_lock(93791, 379)")"
            if [[ "$readiness" == "f" ]]; then
              blocker_ready=true
              break
            fi
            sleep 0.1
          done
          if [[ "$blocker_ready" != "true" ]]; then
            echo "The adversarial blocker did not acquire its profile lock." >&2
            cat one-person-lock-blocker.txt >&2 || true
            exit 1
          fi

          set +e
          psql "$MORALTRADE_QA_DATABASE_URL"             -v ON_ERROR_STOP=1             -f /tmp/one-person-identity-replay.sql             2>&1 | tee one-person-identity-replay.txt
          identity_status=${PIPESTATUS[0]}
          wait "$blocker_pid"
          blocker_status=$?
          blocker_pid=''
          set -e

          if [[ "$identity_status" -ne 0 || "$blocker_status" -ne 0 ]]; then
            echo "Identity replay status: $identity_status; blocker status: $blocker_status" >&2
            cat one-person-lock-blocker.txt >&2 || true
            exit 1
          fi
          grep -Fq 'blocker-profile-lock-acquired' one-person-lock-blocker.txt
          grep -Fq 'blocker-auth-lock-acquired' one-person-lock-blocker.txt
          grep -Fq 'ROLLBACK' one-person-identity-replay.txt
          if grep -Fqi 'deadlock detected' one-person-identity-replay.txt one-person-lock-blocker.txt; then
            echo "The relation-isolated identity migration encountered a deadlock." >&2
            exit 1
          fi

          psql "$MORALTRADE_QA_DATABASE_URL"             -v ON_ERROR_STOP=1             -f /tmp/one-person-profile-replay.sql             2>&1 | tee one-person-profile-replay.txt
          grep -Fq 'ROLLBACK' one-person-profile-replay.txt
      - name: SQL regression with release gates initially disabled
        run: set -o pipefail; psql "$MORALTRADE_QA_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/tests/one_person_one_account.sql 2>&1 | tee one-person-sql.txt
      - name: Enable QA-only release gates for the rendered test window
        shell: bash
        run: |
          set -euo pipefail
          psql "$MORALTRADE_QA_DATABASE_URL" -v ON_ERROR_STOP=1 -qAt <<'SQL' | tee one-person-gates-enabled.json
          select public.configure_person_account_release_v1('qa_mock', true, true, true, null);
          SQL
          jq -e '
            .providerMode == "qa_mock" and
            .providerReady == true and
            .registrationEnforcementEnabled == true and
            .participationEnforcementEnabled == true
          ' one-person-gates-enabled.json >/dev/null
      - name: Concurrent duplicate registration
        run: set -o pipefail; scripts/test-one-person-concurrency.sh 2>&1 | tee one-person-concurrency.txt
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Authenticated desktop and mobile tests
        run: set -o pipefail; npx playwright test tests/one-person-account-authenticated.spec.ts --reporter=line 2>&1 | tee one-person-browser.txt
      - name: Prove every one-person synthetic residue count is zero
        shell: bash
        run: |
          set -euo pipefail
          psql "$MORALTRADE_QA_DATABASE_URL" -v ON_ERROR_STOP=1 -qAt <<'SQL' | tee one-person-residue.json
          select jsonb_build_object(
            'authUsers', (
              select count(*) from auth.users
              where lower(coalesce(raw_user_meta_data ->> 'qa_fixture', 'false')) = 'true'
            ),
            'qaSessions', (
              select count(*) from moral_trade_private.preaccount_verification_sessions
              where provider_mode = 'qa_mock'
            ),
            'qaSubjects', (
              select count(*) from moral_trade_private.identity_subjects
              where latest_provider_name = 'MoralTrade QA'
            ),
            'qaGrants', (
              select count(*)
              from moral_trade_private.person_registration_grants g
              join moral_trade_private.preaccount_verification_sessions s
                on s.id = g.verification_session_id
              where s.provider_mode = 'qa_mock'
            ),
            'qaVerificationEvents', (
              select count(*)
              from moral_trade_private.identity_verification_events e
              join moral_trade_private.preaccount_verification_sessions s
                on s.id = e.verification_session_id
              where s.provider_mode = 'qa_mock'
            ),
            'qaDedupeKeys', (
              select count(*)
              from moral_trade_private.identity_dedupe_keys k
              join moral_trade_private.identity_subjects s
                on s.id = k.identity_subject_id
              where s.latest_provider_name = 'MoralTrade QA'
            ),
            'qaDuplicateCases', (
              select count(*)
              from moral_trade_private.identity_duplicate_cases d
              left join moral_trade_private.preaccount_verification_sessions s
                on s.id = d.verification_session_id
              where s.provider_mode = 'qa_mock'
                 or d.reason_code like 'qa_%'
            )
          );
          SQL
          jq -e 'to_entries | all(.value == 0)' one-person-residue.json >/dev/null
      - name: Restore QA release gates to disabled
        if: always()
        run: |
          if [[ -n "${MORALTRADE_QA_DATABASE_URL:-}" ]]; then
            psql "$MORALTRADE_QA_DATABASE_URL" -v ON_ERROR_STOP=1 -qAt <<'SQL' || true
          select public.configure_person_account_release_v1('qa_mock', true, false, false, null);
          SQL
          fi
      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: one-person-account-isolated-qa-${{ github.run_id }}
          path: |
            one-person-migrations.sha256
            one-person-identity-migration.txt
            one-person-profile-migration.txt
            one-person-schema-inventory.txt
            one-person-gates-before.json
            one-person-replays.sha256
            one-person-identity-replay.txt
            one-person-profile-replay.txt
            one-person-lock-blocker.txt
            one-person-sql.txt
            one-person-gates-enabled.json
            one-person-concurrency.txt
            one-person-browser.txt
            one-person-residue.json
            test-results/**
          if-no-files-found: warn
