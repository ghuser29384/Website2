name: Truthful simplification final validation 20260925
on:
  push:
    branches: [ops/feature-pruning-audit-20260925]
    paths: [.github/workflows/truthful-simplification-final-validation-20260925.yml]
permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3210
      SITE_URL: http://127.0.0.1:3210
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dafd327dda09e561fdb44ddc44653fd1c997dfac
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Focused truthfulness and control contracts
        run: |
          set -euo pipefail
          mkdir -p /tmp/truthful-final-quality
          git rev-parse HEAD HEAD^{tree} > /tmp/truthful-final-quality/identity.txt
          node --import tsx --test             src/lib/truthful-product-defaults.test.ts             src/lib/trade-input-assist.test.ts             src/lib/public-route-smoke.test.ts             src/lib/public-offers.test.ts             src/lib/mpgf.test.ts             src/lib/mpgf/assurance-funding-receipt.test.ts             src/lib/mpgf/public-goods-round-board.test.ts             src/lib/mpgf/public-goods-pivotality.test.ts             2>&1 | tee /tmp/truthful-final-quality/focused.log
      - name: Full repository unit suite
        run: |
          set -euo pipefail
          npm test 2>&1 | tee /tmp/truthful-final-quality/unit.log
      - name: Full lint
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          npm run lint -- --quiet 2>&1 | tee /tmp/truthful-final-quality/lint.log
      - name: Typecheck
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          npx tsc --noEmit 2>&1 | tee /tmp/truthful-final-quality/types.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: truthful-final-quality-${{ github.run_id }}
          path: /tmp/truthful-final-quality/
          retention-days: 14

  rendered:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3210
      SITE_URL: http://127.0.0.1:3210
      PLAYWRIGHT_HTML_OPEN: never
      PLAYWRIGHT_USE_PRODUCTION_SERVER: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dafd327dda09e561fdb44ddc44653fd1c997dfac
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Production build
        id: build
        run: |
          set -euo pipefail
          mkdir -p /tmp/truthful-final-rendered
          git rev-parse HEAD HEAD^{tree} > /tmp/truthful-final-rendered/identity.txt
          npm run build 2>&1 | tee /tmp/truthful-final-rendered/build.log
      - run: npx playwright install --with-deps chromium
      - name: Add non-committed rendered audit contract
        shell: bash
        run: |
          cat > tests/__truthful-product-audit.spec.ts <<'EOF'
          import { expect, test } from "@playwright/test";

          test("MPGF entry separates examples from current live state", async ({ page, request }) => {
            await page.goto("/mpgf");
            await expect(page.getByRole("link", { name: "Browse candidate pools" })).toBeVisible();
            await expect(page.getByRole("link", { name: "Open worked demonstration" })).toBeVisible();
            await expect(page.getByText("View current round", { exact: true })).toHaveCount(0);
            await expect(page.getByLabel("Your possible net pledge")).toHaveValue("");
            await expect(page.getByLabel("Your estimated chance this pledge would be decisive (%)")).toHaveValue("");
            await expect(page.getByText("No probability is assumed for you.", { exact: false })).toBeVisible();
            await expect(page.getByText(/Your 20% estimate/)).toHaveCount(0);

            const response = await request.get("/api/mpgf/rounds");
            expect(response.ok()).toBeTruthy();
            const payload = await response.json();
            expect(payload.rounds).toEqual([]);
            expect(payload.examples).toHaveLength(1);
            expect(payload.examples[0]).toMatchObject({
              status: "demonstration",
              isDemonstration: true,
              countdownSeconds: null,
            });
          });

          test("old MPGF round is unmistakably non-live", async ({ page }) => {
            await page.goto("/mpgf/rounds/mpgf-assurance-round-demo-2026-05");
            await expect(page.getByText("Worked demonstration only.", { exact: false })).toBeVisible();
            await expect(page.getByText("Worked demonstration · not live", { exact: true })).toBeVisible();
            await expect(page.getByText("Likely near threshold", { exact: true })).toHaveCount(0);
          });

          test("ordinary creation hides expert failure-formula mechanics", async ({ page }) => {
            await page.goto("/moral-trade-create/index.html");
            await expect(page.getByText("Simple templates only in ordinary creation.", { exact: false })).toBeVisible();
            await expect(page.locator("#failureTimingPanel")).toBeHidden();
            await expect(page.locator('input[name="poolFailureBonusType"][value="function"]')).toBeDisabled();
          });
          EOF
      - name: Targeted rendered audit
        run: |
          set -euo pipefail
          npx playwright test tests/__truthful-product-audit.spec.ts --workers=1 --reporter=line --output=truthful-final-targeted-results 2>&1 | tee /tmp/truthful-final-rendered/targeted.log
      - name: Full unchanged release browser gate
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          rm -f tests/__truthful-product-audit.spec.ts
          npm run test:e2e:release -- --reporter=line 2>&1 | tee /tmp/truthful-final-rendered/release.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: truthful-final-rendered-${{ github.run_id }}
          path: |
            /tmp/truthful-final-rendered/
            truthful-final-targeted-results/
            test-results/
          retention-days: 14
