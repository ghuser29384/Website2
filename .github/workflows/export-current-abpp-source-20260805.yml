name: Export current account-bound participant picker source

on:
  push:
    branches:
      - feature/account-bound-participant-picker-20260805
    paths:
      - .github/workflows/export-current-abpp-source-20260805.yml

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4
        with:
          ref: feature/account-bound-participant-picker-20260805
          fetch-depth: 1

      - name: Package exact source outside the repository
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee /tmp/source-head.txt
          tar \
            --exclude=.git \
            --exclude=node_modules \
            --exclude=.next \
            --exclude=playwright-report \
            --exclude=test-results \
            --exclude=.github/workflows/export-current-abpp-source-20260805.yml \
            -czf /tmp/current-abpp-source.tgz .
          sha256sum /tmp/current-abpp-source.tgz | tee /tmp/current-abpp-source.sha256

      - name: Upload exact source
        uses: actions/upload-artifact@v4
        with:
          name: current-abpp-source-${{ github.sha }}
          path: |
            /tmp/current-abpp-source.tgz
            /tmp/current-abpp-source.sha256
            /tmp/source-head.txt
          if-no-files-found: error
          retention-days: 2
