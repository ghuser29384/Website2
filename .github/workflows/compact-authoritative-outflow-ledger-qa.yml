name: Compact authoritative outflow ledger QA

on:
  pull_request:
    branches:
      - agent/mpgf-public-goods-compacts
    paths:
      - .github/workflows/compact-authoritative-outflow-ledger-qa.yml
      - docs/mpgf/compact-authoritative-outflow-ledger-v1.md
      - scripts/test-compact-authoritative-outflow-concurrency.sh
      - src/components/mpgf/mpgf-public-goods-compacts.tsx
      - src/lib/mpgf/compact-authoritative-outflow*.ts
      - supabase/migrations/2026081614150*_compact_authoritative_outflow_*.sql
      - supabase/tests/compact_authoritative_outflow_ledger_*.sql
      - tests/mpgf-public-goods-compacts.spec.ts
  push:
    branches:
      - feature/compact-authoritative-outflow-ledger-v1-20260816
  workflow_dispatch:
    inputs:
      confirm_target:
        description: Enter hvmxfjjbdcgjjudmthdz to confirm isolated QA
        required: true
        default: hvmxfjjbdcgjjudmthdz
        type: string

permissions:
  contents: read

concurrency:
  group: compact-authoritative-outflow-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  STACK_BASE_SHA: f46178aaad6d2fbd911cc365e2963bb7c73a0098

jobs:
  source-and-rendered:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.EXPECTED_HEAD_SHA }}

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Guard exact stacked scope and safety boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test "$(git merge-base "$STACK_BASE_SHA" HEAD)" = "$STACK_BASE_SHA"

          cat > /tmp/expected-files.txt <<'EOF'
          .github/workflows/compact-authoritative-outflow-ledger-qa.yml
          docs/mpgf/compact-authoritative-outflow-ledger-v1.md
          scripts/test-compact-authoritative-outflow-concurrency.sh
          src/components/mpgf/mpgf-public-goods-compacts.tsx
          src/lib/mpgf/compact-authoritative-outflow-contract.test.ts
          src/lib/mpgf/compact-authoritative-outflow.test.ts
          src/lib/mpgf/compact-authoritative-outflow.ts
          supabase/migrations/20260816141500_compact_authoritative_outflow_ledger_v1.sql
          supabase/migrations/20260816141501_compact_authoritative_outflow_freeze_v1.sql
          supabase/migrations/20260816141502_compact_authoritative_outflow_hardening_v1.sql
          supabase/migrations/20260816141503_compact_authoritative_outflow_replay_fix_v1.sql
          supabase/tests/compact_authoritative_outflow_ledger_authorization.sql
          supabase/tests/compact_authoritative_outflow_ledger_core.sql
          tests/mpgf-public-goods-compacts.spec.ts
          EOF
          sed -i 's/^          //' /tmp/expected-files.txt
          sort -o /tmp/expected-files.txt /tmp/expected-files.txt
          git diff --name-only "$STACK_BASE_SHA"...HEAD | sort > /tmp/actual-files.txt
          diff -u /tmp/expected-files.txt /tmp/actual-files.txt
          test "$(wc -l < /tmp/actual-files.txt)" -eq 14

          test "$(find supabase/migrations -maxdepth 1 -type f -name '2026081614150*_compact_authoritative_outflow_*.sql' | wc -l)" -eq 4
          test "$(find supabase/tests -maxdepth 1 -type f -name 'compact_authoritative_outflow_ledger_*.sql' | wc -l)" -eq 2
          ! grep -R "jnpoxvalyjtdghnperyu" $(cat /tmp/actual-files.txt)
          ! grep -R -E "automaticCollectionEnabled[[:space:]]*[:=][[:space:]]*true|moneyMoved[[:space:]]*[:=][[:space:]]*true|activation_execution_enabled[[:space:]]*=[[:space:]]*true" $(cat /tmp/actual-files.txt)
          ! grep -R -E "createServiceClient|SUPABASE_SERVICE_ROLE_KEY|STRIPE_SECRET_KEY|EVERY_ORG" src/components src/lib/mpgf
          git diff --check

      - name: Install exact dependencies
        run: npm ci

      - name: Run focused ledger and Compact contracts
        shell: bash
        run: |
          set -o pipefail
          node --import tsx --test \
            src/lib/mpgf/compact-authoritative-outflow.test.ts \
            src/lib/mpgf/compact-authoritative-outflow-contract.test.ts \
            src/lib/mpgf/public-goods-compacts.test.ts \
            src/lib/mpgf/public-goods-compacts-state.test.ts \
            src/lib/mpgf/public-goods-compacts-contract.test.ts \
            src/lib/mpgf/public-goods-compacts-hardening-contract.test.ts \
            2>&1 | tee compact-outflow-focused.log

      - name: Run complete repository tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee compact-outflow-repository-tests.log

      - name: Run repository-wide ESLint
        shell: bash
        run: |
          set -o pipefail
          npm run lint -- --quiet 2>&1 | tee compact-outflow-eslint.log

      - name: Run strict TypeScript
        shell: bash
        run: |
          set -o pipefail
          npx tsc --noEmit 2>&1 | tee compact-outflow-typescript.log

      - name: Build production application
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee compact-outflow-build.log

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run four-viewport truthful Compact rendering
        shell: bash
        run: |
          set -o pipefail
          npx playwright test tests/mpgf-public-goods-compacts.spec.ts \
            --workers=1 --reporter=line 2>&1 | tee compact-outflow-playwright.log

      - name: Preserve exact-head source evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --short --untracked-files=no)"
          mkdir -p compact-outflow-source-evidence
          git rev-parse HEAD > compact-outflow-source-evidence/head-sha.txt
          git rev-parse "$STACK_BASE_SHA" > compact-outflow-source-evidence/base-sha.txt
          cp /tmp/actual-files.txt compact-outflow-source-evidence/changed-files.txt
          xargs -d '\n' sha256sum < /tmp/actual-files.txt > compact-outflow-source-evidence/file-sha256.txt
          git status --short > compact-outflow-source-evidence/status.txt

      - name: Upload exact-head source and rendered evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compact-authoritative-outflow-source-${{ github.run_id }}-${{ env.EXPECTED_HEAD_SHA }}
          if-no-files-found: error
          retention-days: 30
          path: |
            compact-outflow-source-evidence
            compact-outflow-focused.log
            compact-outflow-repository-tests.log
            compact-outflow-eslint.log
            compact-outflow-typescript.log
            compact-outflow-build.log
            compact-outflow-playwright.log
            test-results/mpgf-public-goods-compacts-*.png

  clean-ephemeral-database:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      LOCAL_SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      HISTORICAL_BASELINE_COMMIT: 4c95052ff97d55b42486cac47b7430896946f124
      HISTORICAL_BASELINE_SHA256: 5fa7f1f21f7a8fc5720ca695d9e6d90eef7eefc1dd97632a2b5ff665c321464a
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.EXPECTED_HEAD_SHA }}

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies and pinned Supabase CLI
        run: |
          npm ci
          sudo apt-get update -qq
          sudo apt-get install --yes postgresql-client > /dev/null
        shell: bash

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.114.0

      - name: Prepare exact migration chain
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          mkdir -p compact-outflow-clean/post-baseline-migrations
          git show "$HISTORICAL_BASELINE_COMMIT:supabase/schema.sql" > compact-outflow-clean/historical-baseline.sql
          test "$(sha256sum compact-outflow-clean/historical-baseline.sql | cut -d ' ' -f 1)" = "$HISTORICAL_BASELINE_SHA256"
          git diff --name-only --diff-filter=AM "$HISTORICAL_BASELINE_COMMIT"..HEAD -- 'supabase/migrations/*.sql' \
            | LC_ALL=C sort | tee compact-outflow-clean/post-baseline-migrations.txt
          while IFS= read -r migration_path; do
            test -f "$migration_path"
            cp "$migration_path" compact-outflow-clean/post-baseline-migrations/
          done < compact-outflow-clean/post-baseline-migrations.txt
          for version in 20260816141500 20260816141501 20260816141502 20260816141503; do
            test "$(find supabase/migrations -maxdepth 1 -type f -name "${version}_*.sql" | wc -l)" -eq 1
          done
          find supabase/migrations -maxdepth 1 -type f -name '*.sql' -print | LC_ALL=C sort | xargs sha256sum > compact-outflow-clean/migration-source.sha256
          git rev-parse HEAD > compact-outflow-clean/head-sha.txt

      - name: Start clean ephemeral PostgreSQL 17 Supabase runtime
        shell: bash
        run: |
          set -euo pipefail
          mv supabase/migrations "$RUNNER_TEMP/repository-migrations"
          mkdir supabase/migrations
          supabase init --force
          sed -i 's/major_version = 15/major_version = 17/' supabase/config.toml
          supabase start --exclude gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor --log-level error --yes > /dev/null
          rmdir supabase/migrations
          mv "$RUNNER_TEMP/repository-migrations" supabase/migrations

      - name: Apply baseline and every production-compatible migration
        shell: bash
        run: |
          set -o pipefail
          SUPABASE_MIGRATION_TEST_DB_URL="$LOCAL_SUPABASE_DB_URL" \
          SUPABASE_MIGRATION_BASELINE_SQL=compact-outflow-clean/historical-baseline.sql \
          SUPABASE_MIGRATION_SKIP_BASENAMES=20260811152545_commitments_impact_study_instrumentation_qa_only.sql,20260811152958_commitments_impact_study_instrumentation_child_trigger_fix.sql,20260811161238_commitments_impact_study_instrumentation_review_remediation_core.sql,20260811161445_commitments_impact_study_instrumentation_review_remediation_instance_validator.sql,20260811161708_commitments_impact_study_instrumentation_review_remediation_child_validators.sql,20260811161948_commitments_impact_study_instrumentation_review_remediation_rpcs.sql,20260811162054_commitments_impact_study_instrumentation_review_remediation_privileges.sql,20260811171544_commitments_impact_study_blocked_probe_service_role.sql \
            bash scripts/apply-supabase-migrations-in-order.sh compact-outflow-clean/post-baseline-migrations \
            2>&1 | tee compact-outflow-clean/full-migration-chain.log
          test "$(grep -c '^skipping_environment_bound_migration=' compact-outflow-clean/full-migration-chain.log)" -eq 8
          for migration in 20260816141500 20260816141501 20260816141502 20260816141503; do
            grep --fixed-strings --quiet "applying_migration=${migration}_" compact-outflow-clean/full-migration-chain.log
          done

      - name: Generate and compare exact public runtime types
        shell: bash
        run: |
          set -euo pipefail
          supabase gen types typescript --db-url "$LOCAL_SUPABASE_DB_URL" --schema public > compact-outflow-clean/generated-database.types.ts
          node scripts/verify-mpgf-public-goods-compacts-generated-types.mjs \
            compact-outflow-clean/generated-database.types.ts src/lib/supabase/database.types.ts \
            | tee compact-outflow-clean/generated-type-comparison.json

      - name: Run database lint and ledger lifecycle suites
        shell: bash
        run: |
          set -o pipefail
          supabase db lint --db-url "$LOCAL_SUPABASE_DB_URL" --schema public --level warning --fail-on none \
            2>&1 | tee compact-outflow-clean/supabase-db-lint.log
          node scripts/verify-mpgf-public-goods-compacts-db-lint.mjs compact-outflow-clean/supabase-db-lint.log \
            | tee compact-outflow-clean/supabase-db-lint-owned-gate.json
          psql "$LOCAL_SUPABASE_DB_URL" --no-psqlrc --set ON_ERROR_STOP=1 <<'SQL' \
            | tee compact-outflow-clean/database-lifecycle.log
          begin;
          \i supabase/tests/mpgf_public_goods_compacts_lifecycle.sql
          \i supabase/tests/mpgf_public_goods_compacts_historical_freeze.sql
          \i supabase/tests/compact_authoritative_outflow_ledger_core.sql
          \i supabase/tests/compact_authoritative_outflow_ledger_authorization.sql
          rollback;
          SQL

      - name: Run genuinely concurrent canonical freeze
        shell: bash
        run: |
          set -o pipefail
          chmod +x scripts/test-compact-authoritative-outflow-concurrency.sh
          COMPACT_OUTFLOW_TEST_DB_URL="$LOCAL_SUPABASE_DB_URL" \
            bash scripts/test-compact-authoritative-outflow-concurrency.sh \
            2>&1 | tee compact-outflow-clean/database-concurrency.log

      - name: Prove no payment or activation state was created
        shell: bash
        run: |
          set -euo pipefail
          psql "$LOCAL_SUPABASE_DB_URL" --no-psqlrc --tuples-only --no-align --set ON_ERROR_STOP=1 <<'SQL' \
            | sed '/^[[:space:]]*$/d' | tee compact-outflow-clean/no-money-readback.txt
          select 'activation|' || count(*) from public.mpgf_public_goods_compacts where status='active'
          union all select 'electorate|' || count(*) from public.mpgf_public_goods_voting_snapshots
          union all select 'payment_refs|' || count(*) from public.mpgf_public_goods_dormant_authorization_snapshots where provider_reference is not null
          order by 1;
          SQL
          grep -qx 'activation|0' compact-outflow-clean/no-money-readback.txt
          grep -qx 'electorate|0' compact-outflow-clean/no-money-readback.txt
          grep -qx 'payment_refs|0' compact-outflow-clean/no-money-readback.txt

      - name: Stop and erase ephemeral runtime
        if: always()
        run: supabase stop --no-backup --yes > /dev/null 2>&1 || true
        shell: bash

      - name: Upload clean database evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compact-authoritative-outflow-clean-${{ github.run_id }}-${{ env.EXPECTED_HEAD_SHA }}
          if-no-files-found: error
          retention-days: 30
          path: compact-outflow-clean

  isolated-qa-rollback:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.confirm_target == 'hvmxfjjbdcgjjudmthdz')
      || github.event_name == 'push'
      || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      EXPECTED_QA_POOLER_HOST: aws-0-us-west-1.pooler.supabase.com
      EXPECTED_QA_REF: hvmxfjjbdcgjjudmthdz
      PGSSLMODE: require
      QA_SUPABASE_DB_URL: ${{ secrets.QA_SUPABASE_DB_URL }}
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.EXPECTED_HEAD_SHA }}

      - name: Verify exact isolated QA target
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test -n "${QA_SUPABASE_DB_URL:-}"
          python3 - <<'PY'
          import os
          from urllib.parse import parse_qs, urlparse
          parsed = urlparse(os.environ['QA_SUPABASE_DB_URL'])
          ssl_modes = parse_qs(parsed.query).get('sslmode', ['require'])
          valid = (
              parsed.scheme in {'postgres','postgresql'}
              and os.environ['EXPECTED_QA_REF'] in (parsed.username or '')
              and parsed.hostname == os.environ['EXPECTED_QA_POOLER_HOST']
              and parsed.port == 5432
              and parsed.path == '/postgres'
              and ssl_modes == ['require']
              and bool(parsed.password)
          )
          if not valid:
              raise SystemExit('Refusing a database URL outside the exact TLS-only MoralTrade QA target.')
          PY

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes postgresql-client > /dev/null

      - name: Record zero-residue and money baselines
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p compact-outflow-rollback
          psql "$QA_SUPABASE_DB_URL" --no-psqlrc --tuples-only --no-align --set ON_ERROR_STOP=1 <<'SQL' \
            | sed '/^[[:space:]]*$/d' > compact-outflow-rollback/before.txt
          select 'public_relations|' || count(*) from pg_catalog.pg_class c join pg_catalog.pg_namespace n on n.oid=c.relnamespace
            where n.nspname='public' and c.relname like 'mpgf_public_goods_%'
          union all select 'private_relations|' || count(*) from pg_catalog.pg_class c join pg_catalog.pg_namespace n on n.oid=c.relnamespace
            where n.nspname='moral_trade_private' and c.relname like 'compact_outflow_%'
          union all select 'fixture_users|' || count(*) from auth.users where email like 'ledger-%@example.test'
          union all select 'active_compacts|' || coalesce((select count(*) from public.mpgf_public_goods_compacts where status='active'),0)
          union all select 'payment_mandates|' || coalesce((select count(*) from public.conditional_payment_mandates),0)
          order by 1;
          SQL

      - name: Prepare rollback-only migration files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p compact-outflow-rollback/migrations
          python3 - <<'PY'
          from pathlib import Path
          sources = [
              Path('supabase/migrations/20260813163052_mpgf_public_goods_compacts.sql'),
              Path('supabase/migrations/20260814031500_mpgf_public_goods_compacts_state_hardening.sql'),
              Path('supabase/migrations/20260816141500_compact_authoritative_outflow_ledger_v1.sql'),
              Path('supabase/migrations/20260816141501_compact_authoritative_outflow_freeze_v1.sql'),
              Path('supabase/migrations/20260816141502_compact_authoritative_outflow_hardening_v1.sql'),
              Path('supabase/migrations/20260816141503_compact_authoritative_outflow_replay_fix_v1.sql'),
          ]
          output = Path('compact-outflow-rollback/migrations')
          for source in sources:
              lines = source.read_text(encoding='utf-8').splitlines()
              body = [line for line in lines if line.strip().lower() not in {'begin;','commit;'}]
              (output / source.name).write_text('\n'.join(body) + '\n', encoding='utf-8')
          PY
          sha256sum supabase/migrations/2026081614150*_compact_authoritative_outflow_*.sql \
            supabase/tests/compact_authoritative_outflow_ledger_*.sql \
            > compact-outflow-rollback/source-sha256.txt

      - name: Execute complete rollback-only authority lifecycle
        shell: bash
        run: |
          set -o pipefail
          psql "$QA_SUPABASE_DB_URL" --no-psqlrc --set ON_ERROR_STOP=1 <<'SQL' \
            | tee compact-outflow-rollback/lifecycle.log
          begin;
          \i supabase/migrations/20260607_moral_trade_release_gate_policy_snapshots.sql
          \i supabase/migrations/20260607_zzzzz_moral_trade_participant_eligibility_records.sql
          \i compact-outflow-rollback/migrations/20260813163052_mpgf_public_goods_compacts.sql
          \i compact-outflow-rollback/migrations/20260814031500_mpgf_public_goods_compacts_state_hardening.sql
          \i compact-outflow-rollback/migrations/20260816141500_compact_authoritative_outflow_ledger_v1.sql
          \i compact-outflow-rollback/migrations/20260816141501_compact_authoritative_outflow_freeze_v1.sql
          \i compact-outflow-rollback/migrations/20260816141502_compact_authoritative_outflow_hardening_v1.sql
          \i compact-outflow-rollback/migrations/20260816141503_compact_authoritative_outflow_replay_fix_v1.sql
          \i supabase/tests/mpgf_public_goods_compacts_lifecycle.sql
          \i supabase/tests/mpgf_public_goods_compacts_historical_freeze.sql
          \i supabase/tests/compact_authoritative_outflow_ledger_core.sql
          \i supabase/tests/compact_authoritative_outflow_ledger_authorization.sql
          rollback;
          SQL

      - name: Prove rollback, no money, and zero fixture residue
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          psql "$QA_SUPABASE_DB_URL" --no-psqlrc --tuples-only --no-align --set ON_ERROR_STOP=1 <<'SQL' \
            | sed '/^[[:space:]]*$/d' > compact-outflow-rollback/after.txt
          select 'public_relations|' || count(*) from pg_catalog.pg_class c join pg_catalog.pg_namespace n on n.oid=c.relnamespace
            where n.nspname='public' and c.relname like 'mpgf_public_goods_%'
          union all select 'private_relations|' || count(*) from pg_catalog.pg_class c join pg_catalog.pg_namespace n on n.oid=c.relnamespace
            where n.nspname='moral_trade_private' and c.relname like 'compact_outflow_%'
          union all select 'fixture_users|' || count(*) from auth.users where email like 'ledger-%@example.test'
          union all select 'active_compacts|' || coalesce((select count(*) from public.mpgf_public_goods_compacts where status='active'),0)
          union all select 'payment_mandates|' || coalesce((select count(*) from public.conditional_payment_mandates),0)
          order by 1;
          SQL
          diff -u compact-outflow-rollback/before.txt compact-outflow-rollback/after.txt
          git rev-parse HEAD > compact-outflow-rollback/head-sha.txt

      - name: Upload isolated rollback evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compact-authoritative-outflow-rollback-${{ github.run_id }}-${{ env.EXPECTED_HEAD_SHA }}
          if-no-files-found: error
          retention-days: 30
          path: compact-outflow-rollback
