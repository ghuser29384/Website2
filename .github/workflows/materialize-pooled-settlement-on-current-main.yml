name: Validate pooled settlement on exact current main

on:
  push:
    branches:
      - ops/inspect-pooled-settlement-payload-20260731
    paths:
      - ".github/workflows/materialize-pooled-settlement-on-current-main.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: validate-pooled-settlement-current-main-20260731
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      OUTPUT_DIR: pooled-settlement-materialization
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out operator branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false

      - name: Reconstruct reviewed PR 208 payload
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$OUTPUT_DIR" /tmp/payload-source /tmp/integration
          git fetch --no-tags origin \
            '+refs/heads/main:refs/remotes/origin/exact-main' \
            '+refs/heads/feat/cross-user-pooled-settlement:refs/remotes/origin/pooled-settlement-source'
          git worktree add --detach /tmp/payload-source refs/remotes/origin/pooled-settlement-source

          cat /tmp/payload-source/.github/pooled-settlement-payload-fixes/chunk-02/part-* \
            > /tmp/payload-source/.github/pooled-settlement-payload/chunk-02
          cat /tmp/payload-source/.github/pooled-settlement-payload-fixes/chunk-05/part-* \
            > /tmp/payload-source/.github/pooled-settlement-payload/chunk-05
          echo 'd5d4a6ef7f8cce78ec7f3ce3148436f494edc55d01dfc1805db916bb52bb4783  /tmp/payload-source/.github/pooled-settlement-payload/chunk-02' | sha256sum --check --strict
          echo '99e87a7fb46096e65ebaa5b7f39155aca8a26e8cf7912df1a59a711b5251e0c8  /tmp/payload-source/.github/pooled-settlement-payload/chunk-05' | sha256sum --check --strict
          mapfile -t chunks < <(find /tmp/payload-source/.github/pooled-settlement-payload -maxdepth 1 -type f -name 'chunk-*' | sort)
          test "${#chunks[@]}" -eq 8
          cat "${chunks[@]}" | base64 --decode > /tmp/pooled-settlement-payload.tgz
          echo 'a39d6e2a4e0205dd9cc2d10a050ffc87d0db3b806ead2c1991d74fbf94b81d4f  /tmp/pooled-settlement-payload.tgz' | sha256sum --check --strict
          tar -tzf /tmp/pooled-settlement-payload.tgz > "$OUTPUT_DIR/payload-manifest.txt"
          cp /tmp/pooled-settlement-payload.tgz "$OUTPUT_DIR/candidate-source.tgz"
          sha256sum "$OUTPUT_DIR/candidate-source.tgz" > "$OUTPUT_DIR/candidate-source.sha256"

      - name: Apply payload to exact current main
        shell: bash
        run: |
          set -euo pipefail
          exact_main="$(git rev-parse refs/remotes/origin/exact-main)"
          git worktree add --detach /tmp/integration "$exact_main"
          tar -xzf /tmp/pooled-settlement-payload.tgz -C /tmp/integration

          test -f /tmp/integration/supabase/migrations/20260725152000_cross_user_pooled_trade_donations.sql
          test -f /tmp/integration/src/lib/trade-donation-pool.ts
          test -f /tmp/integration/docs/trade-donation-pooled-settlement-runbook.md
          git -C /tmp/integration diff --check

          git -C /tmp/integration add -A
          git -C /tmp/integration config user.name 'github-actions[bot]'
          git -C /tmp/integration config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C /tmp/integration commit -m 'Add pooled Every.org settlement rail for donation-backed commitments'
          candidate_sha="$(git -C /tmp/integration rev-parse HEAD)"
          candidate_tree="$(git -C /tmp/integration rev-parse HEAD^{tree})"
          printf 'exact_main=%s\nlocal_candidate_sha=%s\nlocal_candidate_tree=%s\n' \
            "$exact_main" "$candidate_sha" "$candidate_tree" > "$OUTPUT_DIR/refs.txt"
          git -C /tmp/integration show --stat --oneline --decorate --no-renames HEAD \
            > "$OUTPUT_DIR/commit-stat.txt"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        working-directory: /tmp/integration
        shell: bash
        run: npm ci

      - name: Run focused pooled-settlement tests
        id: focused
        continue-on-error: true
        working-directory: /tmp/integration
        shell: bash
        run: |
          set -o pipefail
          node --import tsx --test \
            src/lib/trade-donation-pool.test.ts \
            src/lib/trade-donation-pool-source-contract.test.ts \
            2>&1 | tee "$GITHUB_WORKSPACE/$OUTPUT_DIR/focused-tests.log"

      - name: Run complete test suite
        id: tests
        continue-on-error: true
        working-directory: /tmp/integration
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee "$GITHUB_WORKSPACE/$OUTPUT_DIR/test.log"

      - name: Run absolute TypeScript check
        id: typescript
        continue-on-error: true
        working-directory: /tmp/integration
        shell: bash
        run: |
          set -o pipefail
          npx tsc --noEmit 2>&1 | tee "$GITHUB_WORKSPACE/$OUTPUT_DIR/typescript.log"

      - name: Run absolute ESLint
        id: lint
        continue-on-error: true
        working-directory: /tmp/integration
        shell: bash
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee "$GITHUB_WORKSPACE/$OUTPUT_DIR/lint.log"

      - name: Run production build
        id: build
        continue-on-error: true
        working-directory: /tmp/integration
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee "$GITHUB_WORKSPACE/$OUTPUT_DIR/build.log"

      - name: Summarize validation results
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            --arg focused '${{ steps.focused.outcome }}' \
            --arg tests '${{ steps.tests.outcome }}' \
            --arg typescript '${{ steps.typescript.outcome }}' \
            --arg lint '${{ steps.lint.outcome }}' \
            --arg build '${{ steps.build.outcome }}' \
            '{focused_tests:$focused,complete_tests:$tests,typescript:$typescript,eslint:$lint,production_build:$build,all_passed:([$focused,$tests,$typescript,$lint,$build] | all(. == "success"))}' \
            > "$OUTPUT_DIR/validation-summary.json"
          if [[ -d /tmp/integration/.git ]]; then
            git -C /tmp/integration status --short > "$OUTPUT_DIR/worktree-status-after-validation.txt"
          else
            echo 'integration worktree was not created' > "$OUTPUT_DIR/worktree-status-after-validation.txt"
          fi
          cat "$OUTPUT_DIR/validation-summary.json"

      - name: Upload validation evidence and exact source payload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pooled-settlement-current-main-validation-${{ github.run_id }}
          path: pooled-settlement-materialization
          if-no-files-found: error
          retention-days: 14

      - name: Post result to canonical activation issue
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '### Pooled-settlement validation against exact current main'
            echo
            echo "- run: $GITHUB_RUN_ID"
            echo "- operator commit: \`$GITHUB_SHA\`"
            for file in refs.txt candidate-source.sha256 validation-summary.json commit-stat.txt worktree-status-after-validation.txt; do
              echo; echo "#### $file"; echo '```'
              if [[ -f "$OUTPUT_DIR/$file" ]]; then cat "$OUTPUT_DIR/$file"; else echo 'not produced'; fi
              echo '```'
            done
            for file in focused-tests.log test.log typescript.log lint.log build.log; do
              echo; echo "#### tail: $file"; echo '```'
              if [[ -f "$OUTPUT_DIR/$file" ]]; then tail -n 80 "$OUTPUT_DIR/$file"; else echo 'not produced'; fi
              echo '```'
            done
          } > /tmp/comment.md
          gh issue comment 337 --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md

      - name: Enforce all validation gates
        if: always()
        shell: bash
        run: |
          jq -e '.all_passed == true' "$OUTPUT_DIR/validation-summary.json" >/dev/null
