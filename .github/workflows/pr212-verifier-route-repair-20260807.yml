name: PR 212 independent verifier route repair

on:
  push:
    branches:
      - ops/pr212-verifier-route-repair-20260807
    paths:
      - .github/workflows/pr212-verifier-route-repair-20260807.yml
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: pr212-verifier-route-repair-20260807
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      EXPECTED_HEAD: 3284fffd54edceaa4943e68e82aa860b9f272a8c
      FEATURE_BRANCH: feat/institutional-trade-system
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out exact feature head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.FEATURE_BRANCH }}
          fetch-depth: 0

      - name: Verify exact head and repair verifier navigation
        shell: bash
        run: |
          set -euo pipefail
          actual_head="$(git rev-parse HEAD)"
          if [[ "$actual_head" != "$EXPECTED_HEAD" ]]; then
            echo "Feature branch moved: expected $EXPECTED_HEAD, got $actual_head" >&2
            exit 1
          fi

          python - <<'PY'
          from pathlib import Path

          path = Path('.github/scripts/institutional-trade-qa-e2e.mjs')
          text = path.read_text()
          old = 'await verifierPage.goto(`${baseUrl}/institutions/${value.orgA.id}/deals/${value.deal.id}`);'
          new = 'await verifierPage.goto(`${baseUrl}/institutions/individual/deals/${value.deal.id}`);'
          count = text.count(old)
          if count != 2:
              raise SystemExit(f'Expected exactly two verifier organization-route navigations, found {count}.')
          path.write_text(text.replace(old, new))
          PY

          git diff --check
          node --check .github/scripts/institutional-trade-qa-e2e.mjs

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies with transient-registry retry
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            if npm ci; then exit 0; fi
            if (( attempt == 4 )); then exit 1; fi
            sleep $((attempt * 20))
          done

      - name: Run focused verifier-route contracts
        run: node --import tsx --test src/institutional-verifier-access-route.test.ts src/institutional-trade-wiring.test.ts

      - name: Commit and push the verified repair
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/scripts/institutional-trade-qa-e2e.mjs
          git commit -m "Use the independent route for verifier deal access"
          new_head="$(git rev-parse HEAD)"
          git push origin "HEAD:${FEATURE_BRANCH}"
          echo "new_head=$new_head" >> "$GITHUB_OUTPUT"

      - name: Record repair on PR 212
        shell: bash
        run: |
          gh pr comment 212 --repo "$GITHUB_REPOSITORY" --body "Published the narrow verifier-route repair at \`${{ steps.publish.outputs.new_head }}\`. Independent verifiers now exercise the exact personal/independent deal route before and after assignment acceptance; the organization route remains membership-gated. Focused route and wiring contracts passed. PR remains draft and unmerged; complete exact-head isolated-QA is still required."
