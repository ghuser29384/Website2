name: Apply pooled-settlement release payload

on:
  push:
    branches:
      - feat/cross-user-pooled-settlement
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: apply-pooled-settlement-release
  cancel-in-progress: true

jobs:
  apply:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/cross-user-pooled-settlement
          fetch-depth: 0

      - name: Reconstruct and validate release payload
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t chunks < <(find .github/pooled-settlement-payload -maxdepth 1 -type f -name 'chunk-*' | sort)
          test "${#chunks[@]}" -eq 8
          cat "${chunks[@]}" > /tmp/pooled-settlement-payload.b64
          base64 --decode /tmp/pooled-settlement-payload.b64 > /tmp/pooled-settlement-payload.tgz
          tar -tzf /tmp/pooled-settlement-payload.tgz >/dev/null
          tar -xzf /tmp/pooled-settlement-payload.tgz
          test -f supabase/migrations/20260725152000_cross_user_pooled_trade_donations.sql
          test -f src/lib/trade-donation-pool.ts
          test -f docs/trade-donation-pooled-settlement-runbook.md
          grep -q "cross-user pooled settlement" docs/trade-donation-pooled-settlement-runbook.md
          git diff --check

      - name: Replace transport files with the release
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/pooled-settlement-payload
          rm .github/workflows/temporary-pooled-settlement-source.yml
          git diff --check
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add cross-user pooled settlement"
          git push origin HEAD:feat/cross-user-pooled-settlement
