# Triggered for final reconstruction on 2026-07-31.
name: Apply pooled-settlement release payload

on:
  push:
    branches:
      - feat/cross-user-pooled-settlement
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: apply-pooled-settlement-release
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/cross-user-pooled-settlement
          fetch-depth: 0

      - name: Repair, reconstruct, and verify release payload
        shell: bash
        run: |
          set -euo pipefail
          cat .github/pooled-settlement-payload-fixes/chunk-02/part-* > .github/pooled-settlement-payload/chunk-02
          cat .github/pooled-settlement-payload-fixes/chunk-05/part-* > .github/pooled-settlement-payload/chunk-05
          echo "d5d4a6ef7f8cce78ec7f3ce3148436f494edc55d01dfc1805db916bb52bb4783  .github/pooled-settlement-payload/chunk-02" | sha256sum --check --strict
          echo "99e87a7fb46096e65ebaa5b7f39155aca8a26e8cf7912df1a59a711b5251e0c8  .github/pooled-settlement-payload/chunk-05" | sha256sum --check --strict
          mapfile -t chunks < <(find .github/pooled-settlement-payload -maxdepth 1 -type f -name 'chunk-*' | sort)
          test "${#chunks[@]}" -eq 8
          cat "${chunks[@]}" > /tmp/pooled-settlement-payload.b64
          base64 --decode /tmp/pooled-settlement-payload.b64 > /tmp/pooled-settlement-payload.tgz
          echo "a39d6e2a4e0205dd9cc2d10a050ffc87d0db3b806ead2c1991d74fbf94b81d4f  /tmp/pooled-settlement-payload.tgz" | sha256sum --check --strict
          tar -tzf /tmp/pooled-settlement-payload.tgz >/dev/null
          tar -xzf /tmp/pooled-settlement-payload.tgz
          test -f supabase/migrations/20260725152000_cross_user_pooled_trade_donations.sql
          test -f src/lib/trade-donation-pool.ts
          test -f docs/trade-donation-pooled-settlement-runbook.md
          grep -qi "cross-user pooled settlement" docs/trade-donation-pooled-settlement-runbook.md
          git diff --check

      - name: Replace transport files with the engineering release
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/pooled-settlement-payload
          rm -rf .github/pooled-settlement-payload-fixes
          rm .github/workflows/temporary-pooled-settlement-source.yml
          git diff --check
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add cross-user pooled settlement"
          git push origin HEAD:feat/cross-user-pooled-settlement
