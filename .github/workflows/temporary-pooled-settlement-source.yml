name: Diagnose pooled-settlement release payload

on:
  push:
    branches:
      - feat/cross-user-pooled-settlement
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: diagnose-pooled-settlement-release
  cancel-in-progress: true

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/cross-user-pooled-settlement
          fetch-depth: 0

      - name: Diagnose payload
        shell: bash
        run: |
          set +e
          set -u
          report=/tmp/pooled-settlement-diagnostic.txt
          : > "$report"
          mapfile -t chunks < <(find .github/pooled-settlement-payload -maxdepth 1 -type f -name 'chunk-*' | sort)
          echo "chunk_count=${#chunks[@]}" >> "$report"
          for chunk in "${chunks[@]}"; do
            printf '%s bytes=' "$chunk" >> "$report"
            wc -c < "$chunk" | tr -d '\n' >> "$report"
            printf ' sha256=' >> "$report"
            sha256sum "$chunk" | awk '{print $1}' >> "$report"
          done
          cat "${chunks[@]}" > /tmp/pooled-settlement-payload.b64
          printf 'combined_b64_bytes=' >> "$report"
          wc -c < /tmp/pooled-settlement-payload.b64 | tr -d '\n' >> "$report"
          printf ' combined_b64_sha256=' >> "$report"
          sha256sum /tmp/pooled-settlement-payload.b64 | awk '{print $1}' >> "$report"
          base64 --decode /tmp/pooled-settlement-payload.b64 > /tmp/pooled-settlement-payload.tgz 2>/tmp/base64.err
          base64_status=$?
          echo "base64_status=$base64_status" >> "$report"
          sed 's/^/base64_stderr=/' /tmp/base64.err >> "$report"
          printf 'tgz_bytes=' >> "$report"
          wc -c < /tmp/pooled-settlement-payload.tgz | tr -d '\n' >> "$report"
          printf ' tgz_sha256=' >> "$report"
          sha256sum /tmp/pooled-settlement-payload.tgz | awk '{print $1}' >> "$report"
          gzip -t /tmp/pooled-settlement-payload.tgz 2>/tmp/gzip.err
          gzip_status=$?
          echo "gzip_status=$gzip_status" >> "$report"
          sed 's/^/gzip_stderr=/' /tmp/gzip.err >> "$report"
          tar -tzf /tmp/pooled-settlement-payload.tgz >/tmp/tar.list 2>/tmp/tar.err
          tar_status=$?
          echo "tar_status=$tar_status" >> "$report"
          sed 's/^/tar_stderr=/' /tmp/tar.err >> "$report"
          echo "tar_first_entries:" >> "$report"
          head -20 /tmp/tar.list >> "$report" || true
          exit 0

      - uses: actions/upload-artifact@v4
        with:
          name: pooled-settlement-diagnostic
          path: /tmp/pooled-settlement-diagnostic.txt
          if-no-files-found: error
          retention-days: 1
