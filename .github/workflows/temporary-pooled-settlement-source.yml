name: Temporary pooled-settlement source package

on:
  push:
    branches:
      - feat/cross-user-pooled-settlement
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package repository source
        run: |
          tar --exclude=.git --exclude=node_modules --exclude=.next -czf /tmp/repository-source.tgz .
          cp /tmp/repository-source.tgz repository-source.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: pooled-settlement-source
          path: repository-source.tgz
          if-no-files-found: error
          retention-days: 1
