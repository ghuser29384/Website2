name: Diagnose repaired pooled-settlement payload

on:
  push:
    branches:
      - feat/cross-user-pooled-settlement
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: diagnose-repaired-pooled-settlement-release
  cancel-in-progress: true

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/cross-user-pooled-settlement
          fetch-depth: 0

      - name: Diagnose repaired payload
        shell: bash
        run: |
          set +e
          report=/tmp/pooled-settlement-diagnostic.txt
          : > "$report"
          for file in .github/pooled-settlement-payload-fixes/chunk-02/part-* .github/pooled-settlement-payload-fixes/chunk-05/part-*; do
            printf '%s bytes=' "$file" >> "$report"
            wc -c < "$file" | tr -d '\n' >> "$report"
            printf ' sha256=' >> "$report"
            sha256sum "$file" | awk '{print $1}' >> "$report"
          done
          cat .github/pooled-settlement-payload-fixes/chunk-02/part-* > /tmp/chunk-02
          cat .github/pooled-settlement-payload-fixes/chunk-05/part-* > /tmp/chunk-05
          printf 'repaired_chunk_02_bytes=' >> "$report"
          wc -c < /tmp/chunk-02 | tr -d '\n' >> "$report"
          printf ' sha256=' >> "$report"
          sha256sum /tmp/chunk-02 | awk '{print $1}' >> "$report"
          printf 'repaired_chunk_05_bytes=' >> "$report"
          wc -c < /tmp/chunk-05 | tr -d '\n' >> "$report"
          printf ' sha256=' >> "$report"
          sha256sum /tmp/chunk-05 | awk '{print $1}' >> "$report"
          cp /tmp/chunk-02 .github/pooled-settlement-payload/chunk-02
          cp /tmp/chunk-05 .github/pooled-settlement-payload/chunk-05
          mapfile -t chunks < <(find .github/pooled-settlement-payload -maxdepth 1 -type f -name 'chunk-*' | sort)
          cat "${chunks[@]}" > /tmp/payload.b64
          base64 --decode /tmp/payload.b64 > /tmp/payload.tgz 2>/tmp/base64.err
          echo "base64_status=$?" >> "$report"
          sed 's/^/base64_stderr=/' /tmp/base64.err >> "$report"
          printf 'tgz_bytes=' >> "$report"
          wc -c < /tmp/payload.tgz | tr -d '\n' >> "$report"
          printf ' sha256=' >> "$report"
          sha256sum /tmp/payload.tgz | awk '{print $1}' >> "$report"
          gzip -t /tmp/payload.tgz 2>/tmp/gzip.err
          echo "gzip_status=$?" >> "$report"
          sed 's/^/gzip_stderr=/' /tmp/gzip.err >> "$report"
          tar -tzf /tmp/payload.tgz >/tmp/tar.list 2>/tmp/tar.err
          echo "tar_status=$?" >> "$report"
          sed 's/^/tar_stderr=/' /tmp/tar.err >> "$report"
          head -20 /tmp/tar.list >> "$report" || true
          exit 0

      - uses: actions/upload-artifact@v4
        with:
          name: repaired-pooled-settlement-diagnostic
          path: /tmp/pooled-settlement-diagnostic.txt
          if-no-files-found: error
          retention-days: 1
