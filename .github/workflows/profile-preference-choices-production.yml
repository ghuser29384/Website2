name: Publish choice-based profile preferences

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/profile-preference-choices-production.yml

permissions:
  contents: read

jobs:
  dispatch:
    permissions:
      actions: write
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Verify the exact profile preference change
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'ghuser29384/Website2'
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git hash-object src/components/profile/complete-profile-review.tsx)" = '5ee416e1760922c7971e32c4c145c1872153ebfc'
          test "$(git hash-object src/components/profile/matching-preference-choices.tsx)" = 'd4bd27405e6397ca157fd7ae0c6abacf8d56e907'
          test "$(git hash-object src/components/profile/profile-setup.module.css)" = '735720e3afc3892f36331e169c83a62661011f37'
          test "$(git hash-object src/lib/profile-matching-choices.ts)" = '1e5ce1c5bc56816dd1a4f94dcef660ef31b62c91'
          test "$(git hash-object src/lib/profile-matching-choices.test.ts)" = 'e51d588a8e310c5fc1810678b4330cad9050315f'
          test "$(git hash-object tests/complete-profile-review.spec.ts)" = '653fe04342b3fa9a700cabbeaee943a978dc5d9c'
          git diff --check HEAD^
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$GITHUB_SHA"
      - name: Run the existing gated production release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/vercel-release.yml" --jq .state)" = 'active'
          jq -n --arg sha "$GITHUB_SHA" \
            '{ref:"main",inputs:{ref:"main",target:"production",expected_sha:$sha,synthetic_auth_fixture_url:""}}' \
            | gh api --method POST \
                -H 'Accept: application/vnd.github+json' \
                -H 'X-GitHub-Api-Version: 2022-11-28' \
                "repos/$GITHUB_REPOSITORY/actions/workflows/vercel-release.yml/dispatches" \
                --input - >/dev/null
