name: Multi-threshold exact release gates

# Temporarily repurposed to publish the deterministic SQL repair exposed by isolated QA.
on:
  pull_request:
    branches:
      - feature/mpgf-multi-threshold-failure-bonus-editor-20260726
    paths:
      - ".github/workflows/multi-threshold-exact-release-gates.yml"

permissions:
  contents: write

jobs:
  publish-sql-alias-repair:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'qa/multi-threshold-exact-release-gates-20260727'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_HEAD: 3359135612d8335b98a643bc7d65c8e4616551f8
      EXPECTED_MIGRATION_BLOB: c5a8a57197a12671970a3f85257c32b3dc64c9ba
      PRODUCT_BRANCH: feature/mpgf-multi-threshold-failure-bonus-editor-20260726
      MIGRATION_PATH: supabase/migrations/20260726170500_mpgf_multi_threshold_failure_bonus_editor.sql

    steps:
      - name: Validate exact execution target
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "ghuser29384/Website2"
          test "$GITHUB_HEAD_REF" = "qa/multi-threshold-exact-release-gates-20260727"

      - name: Check out exact product branch
        uses: actions/checkout@v4
        with:
          ref: feature/mpgf-multi-threshold-failure-bonus-editor-20260726
          fetch-depth: 0

      - name: Verify exact SQL repair target
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git hash-object "$MIGRATION_PATH")" = "$EXPECTED_MIGRATION_BLOB"
          test -z "$(git status --porcelain)"

      - name: Qualify premium-quote references inside the approval RPC
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("supabase/migrations/20260726170500_mpgf_multi_threshold_failure_bonus_editor.sql")
          source = path.read_text()
          replacements = [
              (
                  """    from public.mpgf_failure_bonus_premium_quotes
    where pool_proposal_id = proposal_row.id
      and status = 'pending_review'
  ) <> threshold_count then""",
                  """    from public.mpgf_failure_bonus_premium_quotes pending_quote
    where pending_quote.pool_proposal_id = proposal_row.id
      and pending_quote.status = 'pending_review'
  ) <> threshold_count then""",
              ),
              (
                  """    from public.mpgf_failure_bonus_premium_quotes
    where pool_proposal_id = proposal_row.id
      and threshold_index = (threshold_item ->> 'thresholdIndex')::integer
      and status = 'pending_review'
    for update;""",
                  """    from public.mpgf_failure_bonus_premium_quotes quote_candidate
    where quote_candidate.pool_proposal_id = proposal_row.id
      and quote_candidate.threshold_index = (threshold_item ->> 'thresholdIndex')::integer
      and quote_candidate.status = 'pending_review'
    for update;""",
              ),
              (
                  """  update public.mpgf_failure_bonus_premium_quotes
  set status = 'approved',
      provisional = false,
      rationale = operator_rationale,
      approved_by = reviewer_id_input,
      approved_at = approved_timestamp
  where pool_proposal_id = proposal_row.id
    and status = 'pending_review';""",
                  """  update public.mpgf_failure_bonus_premium_quotes approved_quote
  set status = 'approved',
      provisional = false,
      rationale = operator_rationale,
      approved_by = reviewer_id_input,
      approved_at = approved_timestamp
  where approved_quote.pool_proposal_id = proposal_row.id
    and approved_quote.status = 'pending_review';""",
              ),
          ]
          for old, new in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one exact SQL repair target, found {count}: {old.splitlines()[0]}")
              source = source.replace(old, new, 1)
          path.write_text(source)
          PY
          test "$(git diff --name-only)" = "$MIGRATION_PATH"
          git diff --check
          grep -n "pending_quote.pool_proposal_id\|quote_candidate.pool_proposal_id\|approved_quote.pool_proposal_id" "$MIGRATION_PATH"

      - name: Commit and publish the SQL repair
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "Moral Trade release automation"
          git config user.email "actions@users.noreply.github.com"
          git add "$MIGRATION_PATH"
          git commit -m "Qualify failure-bonus approval quote references"
          git push origin "HEAD:${PRODUCT_BRANCH}"
