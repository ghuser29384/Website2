name: Read PR 158 atomic patch failure

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/read-pr158-atomic-patch-log.yml"
      - ".github/scripts/read-pr158-atomic-patch-log.py"

permissions:
  actions: read
  contents: read

jobs:
  extract:
    if: >-
      github.event.pull_request.head.repo.full_name == 'ghuser29384/Website2' &&
      github.head_ref == 'ops/apply-pr158-atomic-acceptance-20260726'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out diagnostic script
        uses: actions/checkout@v4
      - name: Capture sanitized failure excerpt
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/read-pr158-atomic-patch-log.py > patch-failure.txt
      - name: Upload sanitized failure excerpt
        uses: actions/upload-artifact@v4
        with:
          name: pr158-atomic-patch-failure-${{ github.run_id }}
          path: patch-failure.txt
          if-no-files-found: error
          retention-days: 1
