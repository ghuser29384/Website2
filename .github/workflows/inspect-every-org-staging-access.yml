name: Inspect Every.org staging access

on:
  push:
    branches:
      - feature/direct-verified-donation-upgrade-20260731
    paths:
      - .github/workflows/inspect-every-org-staging-access.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inspect-every-org-staging-access
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Playwright
        run: |
          set -euo pipefail
          mkdir -p /tmp/every-org-inspect
          cd /tmp/every-org-inspect
          npm init -y >/dev/null
          npm install --no-save playwright@1.58.2 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Inspect public staging entry points
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/every-org-inspect
          cat > inspect.mjs <<'NODE'
          import { chromium } from "playwright";
          import { writeFile } from "node:fs/promises";

          const targets = [
            ["developer", "https://staging.every.org/developer"],
            ["login", "https://staging.every.org/login"],
            ["signup", "https://staging.every.org/signup"],
            ["home", "https://staging.every.org/"],
          ];

          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({ viewport: { width: 1440, height: 1000 } });
          const report = [];

          for (const [label, url] of targets) {
            const page = await context.newPage();
            const consoleErrors = [];
            const failedRequests = [];
            page.on("console", (message) => {
              if (message.type() === "error") consoleErrors.push(message.text());
            });
            page.on("requestfailed", (request) => {
              failedRequests.push({ url: request.url(), error: request.failure()?.errorText ?? "unknown" });
            });
            let navigationError = null;
            try {
              await page.goto(url, { waitUntil: "domcontentloaded", timeout: 60_000 });
              await page.waitForTimeout(4_000);
            } catch (error) {
              navigationError = String(error);
            }
            const snapshot = await page.evaluate(() => ({
              url: location.href,
              title: document.title,
              text: document.body?.innerText ?? "",
              forms: [...document.forms].map((form) => ({
                action: form.action,
                method: form.method,
                inputs: [...form.querySelectorAll("input, select, textarea, button")].map((element) => ({
                  tag: element.tagName.toLowerCase(),
                  type: element.getAttribute("type"),
                  name: element.getAttribute("name"),
                  id: element.id,
                  ariaLabel: element.getAttribute("aria-label"),
                  placeholder: element.getAttribute("placeholder"),
                  text: element.textContent?.trim() ?? "",
                })),
              })),
              links: [...document.querySelectorAll("a[href]")].map((link) => ({
                text: link.textContent?.trim() ?? "",
                href: link.href,
              })),
              buttons: [...document.querySelectorAll("button")].map((button) => ({
                text: button.textContent?.trim() ?? "",
                ariaLabel: button.getAttribute("aria-label"),
              })),
            }));
            report.push({ label, requestedUrl: url, navigationError, consoleErrors, failedRequests, ...snapshot });
            await writeFile(`${label}.html`, await page.content());
            await page.screenshot({ path: `${label}.png`, fullPage: true });
            await page.close();
          }

          await writeFile("report.json", JSON.stringify(report, null, 2));
          await browser.close();
          NODE
          node inspect.mjs
          cp report.json "$GITHUB_WORKSPACE/every-org-staging-access-report.json"
          cp *.html *.png "$GITHUB_WORKSPACE/"

      - name: Upload staging access inspection
        uses: actions/upload-artifact@v4
        with:
          name: every-org-staging-access-${{ github.run_id }}
          path: |
            every-org-staging-access-report.json
            developer.html
            developer.png
            login.html
            login.png
            signup.html
            signup.png
            home.html
            home.png
          retention-days: 3
