name: Export MPGF lifecycle UI base once

on:
  push:
    branches:
      - feature/mpgf-self-service-lifecycle-ui-20260807
    paths:
      - .github/workflows/export-mpgf-lifecycle-ui-base-once.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record and archive exact source
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          export_dir="$RUNNER_TEMP/mpgf-lifecycle-ui-base"
          mkdir -p "$export_dir"
          git rev-parse HEAD > "$export_dir/head.txt"
          git status --short > "$export_dir/status.txt"
          tar \
            --exclude=.git \
            --exclude=node_modules \
            --exclude=.next \
            --exclude=test-results \
            --exclude=playwright-report \
            -czf "$export_dir/source.tar.gz" .
          sha256sum "$export_dir/source.tar.gz" > "$export_dir/source.sha256"

      - name: Upload exact source archive
        uses: actions/upload-artifact@v4
        with:
          name: mpgf-lifecycle-ui-base-${{ github.run_id }}
          path: ${{ runner.temp }}/mpgf-lifecycle-ui-base
          if-no-files-found: error
          retention-days: 7
