name: PR 212 release controller

on:
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: pr212-release-controller
  cancel-in-progress: false

jobs:
  repair-and-verify:
    if: >-
      github.event.issue.pull_request != null &&
      github.event.issue.number == 212 &&
      github.event.comment.body == '/run-pr212-repair-7f3c91ab'
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_HEAD: a631d65aa46fa1415f5eb7440bb109f67d0d466b
      QA_WORKFLOW_PATH: .github/workflows/institutional-trade-qa.yml
      CONTROLLER_PATH: .github/workflows/pr212-release-controller.yml
      TARGET_BRANCH: feat/institutional-trade-system
      QA_CONFIRM_TARGET: hvmxfjjbdcgjjudmthdz
    steps:
      - name: Check out the exact PR branch
        uses: actions/checkout@v4
        with:
          ref: feat/institutional-trade-system
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Repair the stale assertion and remove the ineffective branch workflow
        id: repair
        shell: bash
        run: |
          set -euo pipefail
          current_head="$(git rev-parse HEAD)"
          if [[ "$current_head" != "$EXPECTED_HEAD" ]]; then
            echo "PR head moved: expected $EXPECTED_HEAD, found $current_head" >&2
            exit 1
          fi

          python - <<'PY'
          from pathlib import Path

          path = Path('.github/scripts/institutional-trade-qa-e2e.mjs')
          text = path.read_text()
          old = r'/baseline organization\/program scope must exactly match/i,'
          new = r'/baseline profile or organization\/program scope must exactly match the deal party/i,'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one stale baseline assertion, found {count}.')
          path.write_text(text.replace(old, new))
          PY

          node --check .github/scripts/institutional-trade-qa-e2e.mjs
          rm -f .github/workflows/pr212-qa-assertion-repair.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/scripts/institutional-trade-qa-e2e.mjs .github/workflows/pr212-qa-assertion-repair.yml
          git diff --cached --check
          git commit -m 'Fix institutional baseline scope assertion'
          fix_sha="$(git rev-parse HEAD)"
          git push origin "HEAD:${TARGET_BRANCH}"
          echo "fix_sha=$fix_sha" >> "$GITHUB_OUTPUT"

      - name: Temporarily register the exact QA workflow on the default branch
        id: register
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          if gh api "repos/${repo}/contents/${QA_WORKFLOW_PATH}?ref=main" >/tmp/existing-qa-workflow.json 2>/dev/null; then
            existing_sha="$(jq -r .sha /tmp/existing-qa-workflow.json)"
            echo "qa_blob_sha=$existing_sha" >> "$GITHUB_OUTPUT"
            echo "qa_created=false" >> "$GITHUB_OUTPUT"
          else
            encoded="$(base64 -w0 "$QA_WORKFLOW_PATH")"
            payload="$(jq -n --arg message 'Temporarily register PR #212 institutional QA workflow' --arg content "$encoded" --arg branch main '{message:$message,content:$content,branch:$branch}')"
            response="$(gh api --method PUT "repos/${repo}/contents/${QA_WORKFLOW_PATH}" --input - <<<"$payload")"
            echo "qa_blob_sha=$(jq -r .content.sha <<<"$response")" >> "$GITHUB_OUTPUT"
            echo "qa_created=true" >> "$GITHUB_OUTPUT"
          fi

          for attempt in $(seq 1 30); do
            if gh workflow view "$QA_WORKFLOW_PATH" --repo "$repo" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo "The institutional QA workflow did not become dispatchable." >&2
          exit 1

      - name: Dispatch the exact-head institutional QA workflow
        id: dispatch
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          fix_sha='${{ steps.repair.outputs.fix_sha }}'
          gh workflow run "$QA_WORKFLOW_PATH" --repo "$repo" --ref "$TARGET_BRANCH" -f "confirm_target=$QA_CONFIRM_TARGET"

          run_json=''
          for attempt in $(seq 1 60); do
            run_json="$(gh run list --repo "$repo" --workflow "$QA_WORKFLOW_PATH" --branch "$TARGET_BRANCH" --event workflow_dispatch --limit 20 --json databaseId,headSha,status,conclusion,url,createdAt | jq -c --arg sha "$fix_sha" 'map(select(.headSha == $sha)) | sort_by(.createdAt) | reverse | .[0] // empty')"
            if [[ -n "$run_json" ]]; then
              break
            fi
            sleep 2
          done
          if [[ -z "$run_json" ]]; then
            echo "Could not locate the dispatched exact-head QA run for $fix_sha." >&2
            exit 1
          fi

          run_id="$(jq -r .databaseId <<<"$run_json")"
          run_url="$(jq -r .url <<<"$run_json")"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "run_url=$run_url" >> "$GITHUB_OUTPUT"
          gh pr comment 212 --repo "$repo" --body "PR #212 assertion repair committed at \`$fix_sha\`. Exact-head institutional QA dispatched as run **$run_id**: $run_url"

      - name: Wait for the complete QA gate
        id: wait
        shell: bash
        run: |
          set +e
          repo="$GITHUB_REPOSITORY"
          run_id='${{ steps.dispatch.outputs.run_id }}'
          gh run watch "$run_id" --repo "$repo" --exit-status
          status=$?
          conclusion="$(gh run view "$run_id" --repo "$repo" --json conclusion --jq .conclusion 2>/dev/null || echo unknown)"
          echo "conclusion=$conclusion" >> "$GITHUB_OUTPUT"
          if [[ "$status" -eq 0 ]]; then
            gh pr comment 212 --repo "$repo" --body "Exact-head institutional QA run **$run_id** completed successfully. The branch remains unmerged pending current-main integration and final release review."
          else
            gh pr comment 212 --repo "$repo" --body "Exact-head institutional QA run **$run_id** concluded **$conclusion**. Production promotion remains blocked; inspect the run evidence before any merge."
          fi
          exit "$status"

      - name: Remove temporary default-branch workflows
        if: always()
        shell: bash
        run: |
          set +e
          repo="$GITHUB_REPOSITORY"

          qa_json="$(gh api "repos/${repo}/contents/${QA_WORKFLOW_PATH}?ref=main" 2>/dev/null)"
          if [[ -n "$qa_json" ]]; then
            qa_sha="$(jq -r .sha <<<"$qa_json")"
            payload="$(jq -n --arg message 'Remove temporary PR #212 institutional QA registration' --arg sha "$qa_sha" --arg branch main '{message:$message,sha:$sha,branch:$branch}')"
            gh api --method DELETE "repos/${repo}/contents/${QA_WORKFLOW_PATH}" --input - <<<"$payload" || true
          fi

          controller_json="$(gh api "repos/${repo}/contents/${CONTROLLER_PATH}?ref=main" 2>/dev/null)"
          if [[ -n "$controller_json" ]]; then
            controller_sha="$(jq -r .sha <<<"$controller_json")"
            payload="$(jq -n --arg message 'Remove temporary PR #212 release controller' --arg sha "$controller_sha" --arg branch main '{message:$message,sha:$sha,branch:$branch}')"
            gh api --method DELETE "repos/${repo}/contents/${CONTROLLER_PATH}" --input - <<<"$payload" || true
          fi
