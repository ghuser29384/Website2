name: PR 212 pool-trigger repair controller

on:
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: pr212-pool-trigger-repair
  cancel-in-progress: false

jobs:
  repair-and-verify:
    if: >-
      github.event.issue.pull_request != null &&
      github.event.issue.number == 212 &&
      github.event.comment.body == '/run-pr212-pool-trigger-fix-b29f4c6d'
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_HEAD: 8c14907dedfafc1af3af185cb740df2f60480a57
      QA_WORKFLOW_PATH: .github/workflows/institutional-trade-qa.yml
      CONTROLLER_PATH: .github/workflows/pr212-release-controller.yml
      TARGET_BRANCH: feat/institutional-trade-system
      QA_CONFIRM_TARGET: hvmxfjjbdcgjjudmthdz
      PATCH_MIGRATION: supabase/migrations/20260731173000_fix_institutional_pool_record_status_access.sql
      REGRESSION_TEST: src/institutional-pool-record-trigger.test.ts
    steps:
      - name: Check out the exact PR branch
        uses: actions/checkout@v4
        with:
          ref: feat/institutional-trade-system
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Add a record-safe pool trigger patch and regression gate
        id: repair
        shell: bash
        run: |
          set -euo pipefail
          current_head="$(git rev-parse HEAD)"
          if [[ "$current_head" != "$EXPECTED_HEAD" ]]; then
            echo "PR head moved: expected $EXPECTED_HEAD, found $current_head" >&2
            exit 1
          fi
          if [[ -e "$PATCH_MIGRATION" || -e "$REGRESSION_TEST" ]]; then
            echo "Expected new patch files to be absent at the exact starting head." >&2
            exit 1
          fi

          cat > "$PATCH_MIGRATION" <<'SQL'
          -- Keep the shared pool-integrity trigger record-safe across pool tables.
          -- institutional_pool_votes intentionally has no status column, so direct
          -- NEW.status access in a compound boolean expression can fail before the
          -- table-name guard is honored by PostgreSQL's expression planner.
          create or replace function public.institutional_validate_pool_record()
          returns trigger language plpgsql set search_path=pg_catalog,public as $$
          declare pool_row public.institutional_pool_terms; account_row public.institutional_budget_accounts; reservation_row public.institutional_budget_reservations;
          begin
           select * into pool_row from public.institutional_pool_terms where deal_id=new.deal_id;
           if not found then raise exception 'Pool terms do not exist for the deal.' using errcode='23503'; end if;
           if new.terms_hash<>pool_row.terms_hash then raise exception 'Pool record is not bound to the current exact terms.' using errcode='23514'; end if;
           if not exists(select 1 from public.institutional_deal_parties p where p.deal_id=new.deal_id and p.party_capacity='organization' and p.organization_id=new.organization_id and p.program_id is not distinct from new.program_id) then
            raise exception 'Pool organization/program is not an eligible exact-scope organization deal party.' using errcode='23514';
           end if;
           if tg_table_name='institutional_pool_contributions' and (to_jsonb(new)->>'status') in('committed','paid') then
            if new.budget_reservation_id is null or new.finance_authority_grant_id is null or new.committed_by is null then
             raise exception 'Committed pool contribution requires a financial reservation, finance authority, and committing actor.' using errcode='23514';
            end if;
            select * into reservation_row from public.institutional_budget_reservations where id=new.budget_reservation_id;
            if not found or reservation_row.deal_id<>new.deal_id or reservation_row.amount_cents<new.amount_cents or reservation_row.status not in('approved','committed') then
             raise exception 'Pool contribution financial reservation is invalid for this deal and amount.' using errcode='23514';
            end if;
            select * into account_row from public.institutional_budget_accounts where id=reservation_row.budget_account_id;
            if account_row.organization_id<>new.organization_id or account_row.program_id is distinct from new.program_id then
             raise exception 'Pool contribution reservation must belong to the exact organization/program.' using errcode='23514';
            end if;
            if not exists(select 1 from public.institutional_authority_grants g where g.id=new.finance_authority_grant_id and g.profile_id=new.committed_by
             and g.organization_id=new.organization_id and g.program_id is not distinct from new.program_id and 'finance:reserve'=any(g.permissions)
             and g.revoked_at is null and g.valid_from<=timezone('utc',now()) and (g.valid_until is null or g.valid_until>timezone('utc',now()))
             and (g.amount_limit_cents is null or g.amount_limit_cents>=new.amount_cents)) then
             raise exception 'Pool contribution lacks valid exact-scope finance reservation authority.' using errcode='42501';
            end if;
            if not exists(select 1 from public.institutional_approvals a where a.deal_id=new.deal_id and a.organization_id=new.organization_id
             and a.program_id is not distinct from new.program_id and a.approval_kind='pool_participation' and a.decision='approve'
             and a.decided_by is not null and a.decided_by<>new.committed_by) then
             raise exception 'Financial reservation cannot substitute for independent pool participation approval.' using errcode='42501';
            end if;
           elsif tg_table_name='institutional_pool_anchors' and (to_jsonb(new)->>'status')='committed' then
            if not exists(select 1 from public.institutional_pool_contributions c where c.id=new.contribution_id and c.deal_id=new.deal_id
             and c.organization_id=new.organization_id and c.program_id is not distinct from new.program_id and c.status in('committed','paid') and c.amount_cents>=new.amount_cents) then
             raise exception 'Anchor commitment requires an eligible committed contribution for the same exact scope.' using errcode='23514';
            end if;
           elsif tg_table_name='institutional_pool_underwritings' and (to_jsonb(new)->>'status')='committed' then
            if new.budget_reservation_id is null or not exists(select 1 from public.institutional_budget_reservations r
             join public.institutional_budget_accounts a on a.id=r.budget_account_id where r.id=new.budget_reservation_id and r.deal_id=new.deal_id
             and r.amount_cents>=new.maximum_amount_cents and r.status in('approved','committed') and a.organization_id=new.organization_id and a.program_id is not distinct from new.program_id) then
             raise exception 'Committed underwriting requires a sufficient exact-scope financial reservation.' using errcode='23514';
            end if;
           elsif tg_table_name='institutional_pool_votes' then
            if not exists(select 1 from public.institutional_authority_grants g where g.id=new.authority_grant_id and g.profile_id=new.voter_profile_id
             and g.organization_id=new.organization_id and g.program_id is not distinct from new.program_id and 'pool:approve'=any(g.permissions)
             and g.revoked_at is null and g.valid_from<=timezone('utc',now()) and (g.valid_until is null or g.valid_until>timezone('utc',now()))) then
             raise exception 'Pool vote requires valid exact-scope pool approval authority.' using errcode='42501';
            end if;
           end if;
           return new;
          end $$;
          SQL

          cat > "$REGRESSION_TEST" <<'TS'
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          import test from "node:test";

          const patch = readFileSync(
            "supabase/migrations/20260731173000_fix_institutional_pool_record_status_access.sql",
            "utf8",
          );

          test("shared institutional pool trigger reads optional status through a record-safe projection", () => {
            assert.match(patch, /create or replace function public\.institutional_validate_pool_record\(\)/i);
            assert.match(patch, /to_jsonb\(new\)->>'status'/i);
            assert.doesNotMatch(
              patch,
              /tg_table_name\s*=\s*'institutional_pool_(?:contributions|anchors|underwritings)'\s+and\s+new\.status/i,
            );
            assert.match(patch, /elsif tg_table_name='institutional_pool_votes'[\s\S]*Pool vote requires valid exact-scope pool approval authority/i);
          });
          TS

          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/institutional-trade-qa.yml')
          text = path.read_text()

          test_anchor = "            src/institutional-trade-migration.test.ts \\\n"
          test_insert = test_anchor + "            src/institutional-pool-record-trigger.test.ts \\\n"
          if text.count(test_anchor) != 1:
              raise SystemExit('Could not locate the unique source-contract test insertion point.')
          text = text.replace(test_anchor, test_insert)

          migration_anchor = '''          migration=supabase/migrations/20260726123000_institutional_trade_system.sql
          sha256sum "$migration" | tee institutional-qa-artifacts/institutional-migration.sha256
'''
          migration_replacement = '''          migration=supabase/migrations/20260726123000_institutional_trade_system.sql
          pool_patch=supabase/migrations/20260731173000_fix_institutional_pool_record_status_access.sql
          sha256sum "$migration" | tee institutional-qa-artifacts/institutional-migration.sha256
          sha256sum "$pool_patch" | tee institutional-qa-artifacts/institutional-pool-trigger-patch.sha256
'''
          if text.count(migration_anchor) != 1:
              raise SystemExit('Could not locate the unique institutional migration setup block.')
          text = text.replace(migration_anchor, migration_replacement)

          apply_anchor = '''          fi
          psql "$QA_SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -P pager=off <<'SQL' | tee institutional-qa-artifacts/institutional-schema-inventory.txt
'''
          apply_replacement = '''          fi
          echo "Compiling the additive pool-trigger patch inside a rollback-only transaction."
          psql "$QA_SUPABASE_DB_URL" -v ON_ERROR_STOP=1 <<SQL
          begin;
          \\i $pool_patch
          rollback;
          SQL
          echo "Applying the additive pool-trigger patch atomically to isolated QA."
          psql "$QA_SUPABASE_DB_URL" -v ON_ERROR_STOP=1 --single-transaction --file "$pool_patch"
          psql "$QA_SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -P pager=off <<'SQL' | tee institutional-qa-artifacts/institutional-schema-inventory.txt
'''
          if text.count(apply_anchor) != 1:
              raise SystemExit('Could not locate the unique migration-to-inventory boundary.')
          path.write_text(text.replace(apply_anchor, apply_replacement))
          PY

          node --import tsx --test "$REGRESSION_TEST"
          node --check .github/scripts/institutional-trade-qa-e2e.mjs
          git diff --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$PATCH_MIGRATION" "$REGRESSION_TEST" "$QA_WORKFLOW_PATH"
          git commit -m 'Fix shared institutional pool trigger status access'
          fix_sha="$(git rev-parse HEAD)"
          git push origin "HEAD:${TARGET_BRANCH}"
          echo "fix_sha=$fix_sha" >> "$GITHUB_OUTPUT"

      - name: Temporarily register the exact QA workflow on the default branch
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          encoded="$(base64 -w0 "$QA_WORKFLOW_PATH")"
          payload="$(jq -n --arg message 'Temporarily register PR #212 institutional QA workflow' --arg content "$encoded" --arg branch main '{message:$message,content:$content,branch:$branch}')"
          gh api --method PUT "repos/${repo}/contents/${QA_WORKFLOW_PATH}" --input - <<<"$payload" >/tmp/register-response.json

          for attempt in $(seq 1 30); do
            if gh workflow view "$QA_WORKFLOW_PATH" --repo "$repo" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo "The institutional QA workflow did not become dispatchable." >&2
          exit 1

      - name: Dispatch the repaired exact-head institutional QA workflow
        id: dispatch
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          fix_sha='${{ steps.repair.outputs.fix_sha }}'
          gh workflow run "$QA_WORKFLOW_PATH" --repo "$repo" --ref "$TARGET_BRANCH" -f "confirm_target=$QA_CONFIRM_TARGET"

          run_json=''
          for attempt in $(seq 1 60); do
            run_json="$(gh run list --repo "$repo" --workflow "$QA_WORKFLOW_PATH" --branch "$TARGET_BRANCH" --event workflow_dispatch --limit 20 --json databaseId,headSha,status,conclusion,url,createdAt | jq -c --arg sha "$fix_sha" 'map(select(.headSha == $sha)) | sort_by(.createdAt) | reverse | .[0] // empty')"
            if [[ -n "$run_json" ]]; then
              break
            fi
            sleep 2
          done
          if [[ -z "$run_json" ]]; then
            echo "Could not locate the dispatched exact-head QA run for $fix_sha." >&2
            exit 1
          fi

          run_id="$(jq -r .databaseId <<<"$run_json")"
          run_url="$(jq -r .url <<<"$run_json")"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "run_url=$run_url" >> "$GITHUB_OUTPUT"
          gh pr comment 212 --repo "$repo" --body "Added the record-safe institutional pool-trigger patch at \`$fix_sha\`. Exact-head institutional QA dispatched as run **$run_id**: $run_url"

      - name: Wait for the complete QA gate
        id: wait
        shell: bash
        run: |
          set +e
          repo="$GITHUB_REPOSITORY"
          run_id='${{ steps.dispatch.outputs.run_id }}'
          gh run watch "$run_id" --repo "$repo" --exit-status
          status=$?
          conclusion="$(gh run view "$run_id" --repo "$repo" --json conclusion --jq .conclusion 2>/dev/null || echo unknown)"
          if [[ "$status" -eq 0 ]]; then
            gh pr comment 212 --repo "$repo" --body "Exact-head institutional QA run **$run_id** completed successfully after the pool-trigger repair. The branch remains unmerged pending current-main integration and final release review."
          else
            gh pr comment 212 --repo "$repo" --body "Exact-head institutional QA run **$run_id** concluded **$conclusion** after the pool-trigger repair. Production promotion remains blocked; the new evidence must be inspected before any merge."
          fi
          exit "$status"

      - name: Remove temporary default-branch workflows
        if: always()
        shell: bash
        run: |
          set +e
          repo="$GITHUB_REPOSITORY"
          for path in "$QA_WORKFLOW_PATH" "$CONTROLLER_PATH"; do
            json="$(gh api "repos/${repo}/contents/${path}?ref=main" 2>/dev/null)"
            if [[ -n "$json" ]]; then
              sha="$(jq -r .sha <<<"$json")"
              payload="$(jq -n --arg message "Remove temporary PR #212 workflow: ${path}" --arg sha "$sha" --arg branch main '{message:$message,sha:$sha,branch:$branch}')"
              gh api --method DELETE "repos/${repo}/contents/${path}" --input - <<<"$payload" || true
            fi
          done
