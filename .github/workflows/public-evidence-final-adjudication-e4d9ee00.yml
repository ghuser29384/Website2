name: Public Evidence final adjudication e4d9ee00

on:
  pull_request:
    paths:
      - ".github/workflows/public-evidence-final-adjudication-e4d9ee00.yml"

permissions:
  actions: read
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: public-evidence-final-adjudication-e4d9ee00
  cancel-in-progress: true

env:
  BASE_SHA: 1fd98472897330bc5256fe17e223cb0ac34deac4
  CANDIDATE_SHA: e4d9ee00441e10f37e2f32ffeca43855635a59e8
  PRODUCT_PR: "560"
  CONTROLLER_BRANCH: qa/public-evidence-final-adjudication-e4d9ee00
  CONTROLLER_PATH: .github/workflows/public-evidence-final-adjudication-e4d9ee00.yml
  PRIOR_RUN: "31249206919"
  PRIOR_ARTIFACT_ID: "9019799344"
  PRIOR_ARTIFACT_NAME: public-evidence-final-gates-e4d9ee00
  PRIOR_ARTIFACT_DIGEST: sha256:192c5fae8d95aa1cf3e2e412b785ae4d057a16b336123002d3589998058f986e
  STATUS_CONTEXT: QA / Public Evidence final adjudication
  EVIDENCE_DIR: public-evidence-final-adjudication-e4d9ee00
  NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3210
  SITE_URL: http://127.0.0.1:3210
  PLAYWRIGHT_HTML_OPEN: never

jobs:
  adjudicate:
    runs-on: ubuntu-24.04
    timeout-minutes: 55

    steps:
      - name: Mark immutable candidate pending
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${CANDIDATE_SHA}" \
            -f state=pending \
            -f context="$STATUS_CONTEXT" \
            -f description="Adjudicating the sole final public-Evidence differential failure" \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Guard controller, product PR, and immutable current main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'ghuser29384/Website2'
          test '${{ github.event.pull_request.head.ref }}' = "$CONTROLLER_BRANCH"
          test '${{ github.event.pull_request.base.ref }}' = 'main'
          test '${{ github.event.pull_request.base.sha }}' = "$BASE_SHA"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)" = "$BASE_SHA"

          controller_files="$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/pulls/${{ github.event.pull_request.number }}/files?per_page=100" \
            --jq '.[].filename')"
          test "$controller_files" = "$CONTROLLER_PATH"

          product_pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PRODUCT_PR}")"
          test "$(jq -r .state <<<"$product_pr")" = 'open'
          test "$(jq -r .head.sha <<<"$product_pr")" = "$CANDIDATE_SHA"
          test "$(jq -r .base.sha <<<"$product_pr")" = "$BASE_SHA"
          test "$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/pulls/${PRODUCT_PR}/files?per_page=100" \
            --jq '.[].filename')" = 'tests/public-evidence.spec.ts'

      - name: Download and verify the complete prior exact evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR" prior-evidence
          artifact="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${PRIOR_ARTIFACT_ID}")"
          test "$(jq -r .name <<<"$artifact")" = "$PRIOR_ARTIFACT_NAME"
          test "$(jq -r .digest <<<"$artifact")" = "$PRIOR_ARTIFACT_DIGEST"
          test "$(jq -r .workflow_run.id <<<"$artifact")" = "$PRIOR_RUN"
          gh run download "$PRIOR_RUN" --repo "$GITHUB_REPOSITORY" \
            --name "$PRIOR_ARTIFACT_NAME" --dir prior-evidence

          prior="$(find prior-evidence -name current-main-differential.json -print -quit)"
          test -n "$prior"
          cp "$prior" "$EVIDENCE_DIR/prior-current-main-differential.json"
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const report = JSON.parse(
            fs.readFileSync(path.join(process.env.EVIDENCE_DIR, 'prior-current-main-differential.json'), 'utf8'),
          );
          const expectedKey =
            'exact-live-now-recommendations.spec.ts:322:7 › exact-live-now-recommendations.spec.ts › adaptive moral-opportunity Now feed › records direct action-difficulty feedback and removes unwanted cards locally';
          const valid =
            report.baseSha === process.env.BASE_SHA &&
            report.candidateSha === process.env.CANDIDATE_SHA &&
            report.base.publicEvidenceFailureCount === 4 &&
            report.candidate.publicEvidenceFailureCount === 0 &&
            report.candidate.hydrationMismatchCount === 0 &&
            report.base.failureCount === 41 &&
            report.candidate.failureCount === 37 &&
            report.candidateOnlyFailureCount === 1 &&
            report.candidateOnlyFailures?.[0] === expectedKey &&
            report.orderSensitiveAdjudication?.nowRollback?.eligible === true &&
            report.orderSensitiveAdjudication?.tradeControls?.eligible === true &&
            report.orderSensitiveAdjudication?.cofundMobile?.eligible === true;
          if (!valid) {
            console.error(JSON.stringify(report, null, 2));
            process.exit(1);
          }
          NODE

      - name: Check out immutable product candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 1

      - name: Prove candidate identity and one-file differential
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git fetch --depth=1 origin "$BASE_SHA"
          test "$(git diff --name-only "$BASE_SHA" "$CANDIDATE_SHA")" = 'tests/public-evidence.spec.ts'
          git diff --check "$BASE_SHA" "$CANDIDATE_SHA"
          printf '%s\n' "$BASE_SHA" > "$EVIDENCE_DIR/base-sha.txt"
          printf '%s\n' "$CANDIDATE_SHA" > "$EVIDENCE_DIR/candidate-sha.txt"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies and Chromium
        shell: bash
        run: |
          set -o pipefail
          npm ci 2>&1 | tee "$EVIDENCE_DIR/npm-ci.log"
          npx playwright install --with-deps chromium \
            2>&1 | tee "$EVIDENCE_DIR/playwright-install.log"

      - name: Write prefix-tolerant Playwright stats extractor
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/extract-stats.mjs <<'NODE'
          import fs from 'node:fs';
          const [rawPath, reportPath, statsPath, prefixPath] = process.argv.slice(2);
          const raw = fs.readFileSync(rawPath, 'utf8');
          const starts = [0];
          for (let line = 0; line < raw.length; ) {
            let cursor = line;
            while (/[ \t\r]/.test(raw[cursor] ?? '')) cursor += 1;
            if (raw[cursor] === '{') starts.push(cursor);
            const next = raw.indexOf('\n', line);
            if (next === -1) break;
            line = next + 1;
          }
          let report = null;
          let offset = -1;
          for (const start of [...new Set(starts)]) {
            try {
              const parsed = JSON.parse(raw.slice(start));
              if (parsed && Array.isArray(parsed.suites)) {
                report = parsed;
                offset = start;
                break;
              }
            } catch {}
          }
          if (!report) throw new Error(`No Playwright JSON report in ${rawPath}`);
          fs.writeFileSync(reportPath, `${JSON.stringify(report, null, 2)}\n`);
          fs.writeFileSync(statsPath, `${JSON.stringify(report.stats ?? {}, null, 2)}\n`);
          fs.writeFileSync(prefixPath, raw.slice(0, offset));
          NODE
          node --check /tmp/extract-stats.mjs

      - name: Measure the candidate difficulty-feedback case ten times
        shell: bash
        run: |
          set -uo pipefail
          rm -rf .next
          set +e
          npx playwright test tests/exact-live-now-recommendations.spec.ts \
            --grep 'records direct action-difficulty feedback and removes unwanted cards locally' \
            --workers=1 --repeat-each=10 --reporter=json \
            > "$EVIDENCE_DIR/candidate-difficulty-raw.log" \
            2> "$EVIDENCE_DIR/candidate-difficulty.stderr.log"
          status=$?
          set -e
          printf '%s\n' "$status" > "$EVIDENCE_DIR/candidate-difficulty-exit-status.txt"
          node /tmp/extract-stats.mjs \
            "$EVIDENCE_DIR/candidate-difficulty-raw.log" \
            "$EVIDENCE_DIR/candidate-difficulty-report.json" \
            "$EVIDENCE_DIR/candidate-difficulty-stats.json" \
            "$EVIDENCE_DIR/candidate-difficulty-prefix.log"

      - name: Check out immutable base and measure the same case ten times
        shell: bash
        run: |
          set -uo pipefail
          git checkout --force "$BASE_SHA"
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          rm -rf .next
          set +e
          npx playwright test tests/exact-live-now-recommendations.spec.ts \
            --grep 'records direct action-difficulty feedback and removes unwanted cards locally' \
            --workers=1 --repeat-each=10 --reporter=json \
            > "$EVIDENCE_DIR/base-difficulty-raw.log" \
            2> "$EVIDENCE_DIR/base-difficulty.stderr.log"
          status=$?
          set -e
          printf '%s\n' "$status" > "$EVIDENCE_DIR/base-difficulty-exit-status.txt"
          node /tmp/extract-stats.mjs \
            "$EVIDENCE_DIR/base-difficulty-raw.log" \
            "$EVIDENCE_DIR/base-difficulty-report.json" \
            "$EVIDENCE_DIR/base-difficulty-stats.json" \
            "$EVIDENCE_DIR/base-difficulty-prefix.log"

      - name: Enforce final fail-closed adjudication
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const read = (name) => JSON.parse(fs.readFileSync(path.join(process.env.EVIDENCE_DIR, name), 'utf8'));
          const prior = read('prior-current-main-differential.json');
          const candidate = read('candidate-difficulty-stats.json');
          const base = read('base-difficulty-stats.json');
          const completed = (stats) =>
            Number(stats.expected ?? 0) + Number(stats.unexpected ?? 0) +
            Number(stats.flaky ?? 0) + Number(stats.skipped ?? 0);
          const failures = (stats) => Number(stats.unexpected ?? 0) + Number(stats.flaky ?? 0);
          const eligible =
            completed(candidate) === 10 &&
            completed(base) === 10 &&
            Number(candidate.expected ?? 0) >= 9 &&
            failures(candidate) <= failures(base);
          const final = {
            baseSha: process.env.BASE_SHA,
            candidateSha: process.env.CANDIDATE_SHA,
            priorRun: Number(process.env.PRIOR_RUN),
            priorArtifactId: Number(process.env.PRIOR_ARTIFACT_ID),
            prior,
            difficultyFeedbackAdjudication: { candidate, base, eligible },
            adjustedCandidateFailureCount: prior.candidate.failureCount - 1,
            unadjudicatedCandidateOnlyFailureCount: eligible ? 0 : 1,
            passed:
              eligible &&
              prior.base.publicEvidenceFailureCount === 4 &&
              prior.candidate.publicEvidenceFailureCount === 0 &&
              prior.candidate.hydrationMismatchCount === 0 &&
              prior.candidateOnlyFailureCount === 1 &&
              prior.candidate.failureCount - 1 <= prior.base.failureCount,
          };
          fs.writeFileSync(
            path.join(process.env.EVIDENCE_DIR, 'final-adjudication.json'),
            `${JSON.stringify(final, null, 2)}\n`,
          );
          console.log(JSON.stringify(final, null, 2));
          if (!final.passed) process.exit(1);
          NODE

          {
            echo '## Public Evidence final adjudication'
            echo
            echo "- Prior base failures: \`$(jq -r '.prior.base.failureCount' "$EVIDENCE_DIR/final-adjudication.json")\`"
            echo "- Prior candidate failures: \`$(jq -r '.prior.candidate.failureCount' "$EVIDENCE_DIR/final-adjudication.json")\`"
            echo "- Adjusted candidate failures: \`$(jq -r '.adjustedCandidateFailureCount' "$EVIDENCE_DIR/final-adjudication.json")\`"
            echo "- Base public Evidence failures: \`$(jq -r '.prior.base.publicEvidenceFailureCount' "$EVIDENCE_DIR/final-adjudication.json")\`"
            echo "- Candidate public Evidence failures: \`$(jq -r '.prior.candidate.publicEvidenceFailureCount' "$EVIDENCE_DIR/final-adjudication.json")\`"
            echo "- Candidate direct passes: \`$(jq -r '.difficultyFeedbackAdjudication.candidate.expected' "$EVIDENCE_DIR/final-adjudication.json")/10\`"
            echo "- Base direct passes: \`$(jq -r '.difficultyFeedbackAdjudication.base.expected' "$EVIDENCE_DIR/final-adjudication.json")/10\`"
            echo "- Unadjudicated candidate-only failures: \`$(jq -r '.unadjudicatedCandidateOnlyFailureCount' "$EVIDENCE_DIR/final-adjudication.json")\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload immutable adjudication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-evidence-final-adjudication-e4d9ee00
          path: public-evidence-final-adjudication-e4d9ee00
          if-no-files-found: error
          retention-days: 14

      - name: Publish immutable candidate result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$JOB_STATUS" == 'success' ]]; then
            state=success
            description="Final public Evidence differential and adjudication passed"
          else
            state=failure
            description="Public Evidence final adjudication failed"
          fi
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${CANDIDATE_SHA}" \
            -f state="$state" \
            -f context="$STATUS_CONTEXT" \
            -f description="$description" \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          test "$state" = success
