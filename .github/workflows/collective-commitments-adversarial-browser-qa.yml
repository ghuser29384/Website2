name: Collective commitments adversarial browser QA

on:
  pull_request:
    branches:
      - feature/collective-identity-threshold-commitments-20260726
    paths:
      - ".github/scripts/collective-commitments-adversarial-browser-qa.mjs"
      - ".github/workflows/collective-commitments-adversarial-browser-qa.yml"
      - "src/app/collective-commitments/actions.ts"
      - "src/collective-commitments-wiring.test.ts"
      - "src/components/collective-commitments/collective-commitment-form.tsx"
      - "src/components/collective-commitments/collective-signature-controls.tsx"
      - "src/lib/collective-commitments/action-state.ts"
      - "supabase/migrations/20260727030000_fix_collective_manifest_jsonb_alias.sql"
      - "supabase/migrations/20260727043000_fix_collective_manifest_materialized_rows.sql"
      - "supabase/migrations/20260727044500_fix_collective_manifest_typed_recordset.sql"
      - "supabase/tests/collective_identity_threshold_commitments.sql"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: collective-commitments-adversarial-browser-qa-20260727
  cancel-in-progress: false

jobs:
  repair-regress-and-test:
    if: >-
      github.event.pull_request.head.repo.full_name == 'ghuser29384/Website2' &&
      github.head_ref == 'qa/collective-commitments-adversarial-browser-20260727'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      EXPECTED_REPOSITORY: ghuser29384/Website2
      EXPECTED_PRODUCT_HEAD: 053ed422da9c5cf8c03b1c24c1bb7f2af81386e8
      PRODUCT_BRANCH: feature/collective-identity-threshold-commitments-20260726
      EXPECTED_QA_REF: hvmxfjjbdcgjjudmthdz
      QA_SUPABASE_URL: https://hvmxfjjbdcgjjudmthdz.supabase.co
      NEXT_PUBLIC_SUPABASE_URL: https://hvmxfjjbdcgjjudmthdz.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.QA_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.QA_SUPABASE_SERVICE_ROLE_KEY }}
      QA_SUPABASE_DB_URL: ${{ secrets.QA_SUPABASE_DB_URL }}
      QA_TEST_PASSWORD: ${{ secrets.QA_TEST_PASSWORD }}
      BROWSER_QA_BASE_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      SITE_URL: http://127.0.0.1:3000
      VERCEL_ENV: preview
      NEXT_PUBLIC_VERCEL_ENV: preview
      COLLECTIVE_COMMITMENTS_ENABLED: "true"
      COLLECTIVE_COMMITMENT_MIN_DEADLINE_MINUTES: "1"
      TRADE_DONATION_POOL_ENABLED: "false"
      TRADE_DONATION_POOL_MODE: disabled
      ALIAS_REPAIR_VERSION: "20260727030000"
      ALIAS_REPAIR_NAME: fix_collective_manifest_jsonb_alias
      ALIAS_REPAIR_SHA256: 14b16e3bef4a4572b036175c420f89bbbf7046ba258b70f9ad1fd1af9109a07a
      MATERIALIZED_REPAIR_VERSION: "20260727043000"
      MATERIALIZED_REPAIR_NAME: fix_collective_manifest_materialized_rows
      MATERIALIZED_REPAIR_SHA256: 25db69d65b79e36221b3d5250ae4b223521ca34e4e171ef611d527e422f7a8b8
      TYPED_RECORDSET_REPAIR_VERSION: "20260727044500"
      TYPED_RECORDSET_REPAIR_NAME: fix_collective_manifest_typed_recordset
      TYPED_RECORDSET_REPAIR_SHA256: 9b8b9cc4e72cecf8b4342aeb4a05d95ccf52e59aa3ee1b426911a7db6ad32e27
      REGRESSION_SHA256: 19f3045dae12e41c3b5669481aa25ae7d0b9672b70cb3e5539be70dea4eb7039
      ARTIFACT_DIR: ${{ github.workspace }}/collective-commitments-browser-qa-artifacts
      BROWSER_QA_ARTIFACT_DIR: ${{ github.workspace }}/collective-commitments-browser-qa-artifacts

    steps:
      - name: Validate exact repository, branch, and required secrets
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY"
          test "$GITHUB_HEAD_REF" = "qa/collective-commitments-adversarial-browser-20260727"
          test "$QA_SUPABASE_URL" = "https://${EXPECTED_QA_REF}.supabase.co"
          for name in NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY SUPABASE_SERVICE_ROLE_KEY QA_SUPABASE_DB_URL QA_TEST_PASSWORD; do
            test -n "${!name:-}" || { echo "Missing required GitHub Actions secret: $name" >&2; exit 1; }
          done

      - name: Check out exact QA branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify exact product base and QA-only diff
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base "$EXPECTED_PRODUCT_HEAD" HEAD)" = "$EXPECTED_PRODUCT_HEAD"
          changed="$(git diff --name-only "$EXPECTED_PRODUCT_HEAD"...HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/scripts/collective-commitments-adversarial-browser-qa.mjs' \
            '.github/workflows/collective-commitments-adversarial-browser-qa.yml' \
            'src/app/collective-commitments/actions.ts' \
            'src/collective-commitments-wiring.test.ts' \
            'src/components/collective-commitments/collective-commitment-form.tsx' \
            'src/components/collective-commitments/collective-signature-controls.tsx' \
            'src/lib/collective-commitments/action-state.ts' \
            'supabase/migrations/20260727030000_fix_collective_manifest_jsonb_alias.sql' \
            'supabase/migrations/20260727043000_fix_collective_manifest_materialized_rows.sql' \
            'supabase/migrations/20260727044500_fix_collective_manifest_typed_recordset.sql' \
            'supabase/tests/collective_identity_threshold_commitments.sql' | sort)"
          if [[ "$changed" != "$expected" ]]; then
            echo "Unexpected QA-branch diff:" >&2
            printf '%s\n' "$changed" >&2
            exit 1
          fi
          mkdir -p "$ARTIFACT_DIR"
          printf '%s\n' "$changed" > "$ARTIFACT_DIR/exact-diff.txt"
          cp src/app/collective-commitments/actions.ts "$RUNNER_TEMP/collective-commitments-actions.ts"
          cp src/collective-commitments-wiring.test.ts "$RUNNER_TEMP/collective-commitments-wiring.test.ts"
          cp src/components/collective-commitments/collective-commitment-form.tsx \
            "$RUNNER_TEMP/collective-commitment-form.tsx"
          cp src/components/collective-commitments/collective-signature-controls.tsx \
            "$RUNNER_TEMP/collective-signature-controls.tsx"
          cp src/lib/collective-commitments/action-state.ts \
            "$RUNNER_TEMP/collective-commitment-action-state.ts"
          cp supabase/migrations/20260727030000_fix_collective_manifest_jsonb_alias.sql \
            "$RUNNER_TEMP/20260727030000_fix_collective_manifest_jsonb_alias.sql"
          cp supabase/migrations/20260727043000_fix_collective_manifest_materialized_rows.sql \
            "$RUNNER_TEMP/20260727043000_fix_collective_manifest_materialized_rows.sql"
          cp supabase/migrations/20260727044500_fix_collective_manifest_typed_recordset.sql \
            "$RUNNER_TEMP/20260727044500_fix_collective_manifest_typed_recordset.sql"
          cp supabase/tests/collective_identity_threshold_commitments.sql \
            "$RUNNER_TEMP/collective_identity_threshold_commitments.sql"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies and run focused source gates
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          node --import tsx --test \
            src/lib/collective-commitments/types.test.ts \
            src/collective-commitments-wiring.test.ts \
            2>&1 | tee "$ARTIFACT_DIR/focused-tests.log"
          npx eslint \
            .github/scripts/collective-commitments-adversarial-browser-qa.mjs \
            src/collective-commitments-wiring.test.ts \
            src/lib/collective-commitments/action-state.ts \
            src/lib/collective-commitments/config.ts \
            src/lib/collective-commitments/crypto.ts \
            src/lib/collective-commitments/service.ts \
            src/app/collective-commitments/actions.ts \
            src/app/collective-commitments/page.tsx \
            src/app/collective-commitments/new/page.tsx \
            src/app/collective-commitments/identity/page.tsx \
            'src/app/collective-commitments/[commitmentId]/page.tsx' \
            src/components/collective-commitments/collective-commitment-form.tsx \
            src/components/collective-commitments/collective-signature-controls.tsx \
            2>&1 | tee "$ARTIFACT_DIR/focused-eslint.log"
          git diff --check "$EXPECTED_PRODUCT_HEAD" HEAD

      - name: Generate isolated runtime secrets
        shell: bash
        run: |
          set -euo pipefail
          master_key="$(openssl rand -base64 32 | tr -d '\n')"
          cron_secret="$(openssl rand -hex 32)"
          echo "::add-mask::$master_key"
          echo "::add-mask::$cron_secret"
          echo "COLLECTIVE_COMMITMENT_MASTER_KEY=$master_key" >> "$GITHUB_ENV"
          echo "CRON_SECRET=$cron_secret" >> "$GITHUB_ENV"

      - name: Validate exact QA database target and install PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from urllib.parse import urlparse
          parsed = urlparse(os.environ["QA_SUPABASE_DB_URL"])
          expected = os.environ["EXPECTED_QA_REF"]
          if expected not in (parsed.username or ""):
              raise SystemExit("Refusing a database URL outside exact MoralTrade QA.")
          if parsed.hostname != "aws-0-us-west-1.pooler.supabase.com":
              raise SystemExit(f"Refusing unexpected database host: {parsed.hostname}")
          if parsed.port != 5432 or parsed.path != "/postgres":
              raise SystemExit("Refusing unexpected database connection parameters.")
          PY
          sudo apt-get update -qq
          sudo apt-get install --yes postgresql-client > /dev/null

      - name: Verify exact forward migrations in MoralTrade QA
        shell: bash
        run: |
          set -euo pipefail
          verify_or_apply() {
            local version="$1" name="$2" digest="$3" label="$4"
            local migration="supabase/migrations/${version}_${name}.sql"
            local state
            echo "${digest}  ${migration}" | sha256sum --check --strict
            state="$(psql "$QA_SUPABASE_DB_URL" --no-psqlrc --tuples-only --no-align --set ON_ERROR_STOP=1 <<SQL
          select case
            when current_database() <> 'postgres' then 'FAIL:database'
            when not exists (
              select 1 from supabase_migrations.schema_migrations
              where version='20260726171000' and name='collective_identity_threshold_commitments'
            ) then 'FAIL:original_migration_missing'
            when exists (
              select 1 from supabase_migrations.schema_migrations
              where version='${version}' and name='${name}'
                and statements[1] like '%sha256 ${digest}%'
            ) then 'EXACT'
            when exists (
              select 1 from supabase_migrations.schema_migrations where version='${version}'
            ) then 'FAIL:digest_or_name_mismatch'
            else 'ABSENT'
          end;
          SQL
          )"
            state="$(tr -d '[:space:]' <<< "$state")"
            if [[ "$state" == "EXACT" ]]; then
              printf '%s=EXACT\n' "$label" | tee "$ARTIFACT_DIR/${label}.txt"
              return
            fi
            if [[ "$state" != "ABSENT" ]]; then
              echo "$label preflight failed: $state" >&2
              exit 1
            fi
            apply_file="$RUNNER_TEMP/${label}.sql"
            python3 - "$migration" "$apply_file" <<'PY'
          from pathlib import Path
          import sys
          lines = Path(sys.argv[1]).read_text().splitlines()
          begins = [i for i, line in enumerate(lines) if line.strip().lower() == "begin;"]
          commits = [i for i, line in enumerate(lines) if line.strip().lower() == "commit;"]
          if len(begins) != 1 or len(commits) != 1 or begins[0] >= commits[0]:
              raise SystemExit(f"Unexpected migration transaction boundaries: begin={begins}, commit={commits}")
          Path(sys.argv[2]).write_text("\n".join(
              line for i, line in enumerate(lines) if i not in {begins[0], commits[0]}
          ) + "\n")
          PY
            cat >> "$apply_file" <<SQL
          insert into supabase_migrations.schema_migrations (
            version, statements, name, created_by, idempotency_key
          ) values (
            '${version}',
            array['Guarded ${label}; sha256 ${digest}'],
            '${name}',
            'github-actions-collective-adversarial-qa',
            'collective-${version}-${digest}'
          );
          SQL
            psql "$QA_SUPABASE_DB_URL" --no-psqlrc --set ON_ERROR_STOP=1 \
              --single-transaction --file "$apply_file" \
              2>&1 | tee "$ARTIFACT_DIR/${label}-apply.log"
          }

          verify_or_apply "$ALIAS_REPAIR_VERSION" "$ALIAS_REPAIR_NAME" "$ALIAS_REPAIR_SHA256" alias-repair
          verify_or_apply "$MATERIALIZED_REPAIR_VERSION" "$MATERIALIZED_REPAIR_NAME" "$MATERIALIZED_REPAIR_SHA256" materialized-repair
          verify_or_apply "$TYPED_RECORDSET_REPAIR_VERSION" "$TYPED_RECORDSET_REPAIR_NAME" "$TYPED_RECORDSET_REPAIR_SHA256" typed-recordset-repair

      - name: Run complete transactional database regression
        shell: bash
        run: |
          set -euo pipefail
          test_file="supabase/tests/collective_identity_threshold_commitments.sql"
          echo "${REGRESSION_SHA256}  ${test_file}" | sha256sum --check --strict
          psql "$QA_SUPABASE_DB_URL" --no-psqlrc --set ON_ERROR_STOP=1 \
            --file "$test_file" 2>&1 | tee "$ARTIFACT_DIR/database-regression.log"
          for marker in \
            "PASS: duplicate-human and duplicate-account signatures are rejected" \
            "PASS: withdrawal and re-signing preserve exact private counts" \
            "PASS: incomplete or altered reveal manifests publish zero identities" \
            "PASS: exact manifest activation publishes all names atomically and only opted-in affiliations" \
            "PASS: activation and expiry erase private ciphertext and per-commitment keys" \
            "PASS: frozen terms and direct sensitive-table access are denied"; do
            grep -Fq "$marker" "$ARTIFACT_DIR/database-regression.log"
          done

      - name: Verify repaired function and privilege inventory
        shell: bash
        run: |
          set -euo pipefail
          inventory="$ARTIFACT_DIR/database-inventory.txt"
          psql "$QA_SUPABASE_DB_URL" --no-psqlrc --tuples-only --no-align --set ON_ERROR_STOP=1 <<'SQL' > "$inventory"
          select case
            when pg_get_functiondef(
              'public.activate_collective_commitment_v1(uuid,uuid,jsonb,text)'::regprocedure
            ) !~* 'jsonb_to_recordset\(p_manifest\)[[:space:]]+as[[:space:]]+manifest_record'
              then 'FAIL:typed_manifest_recordset_missing'
            when has_table_privilege('authenticated', 'public.collective_identity_credentials', 'select') then 'FAIL:credential_select'
            when has_table_privilege('authenticated', 'public.collective_commitment_private_signatures', 'select') then 'FAIL:private_select'
            when has_table_privilege('authenticated', 'public.collective_commitment_keys', 'select') then 'FAIL:key_select'
            when has_function_privilege('authenticated', 'public.activate_collective_commitment_v1(uuid,uuid,jsonb,text)', 'execute') then 'FAIL:activation_execute'
            when not has_function_privilege('service_role', 'public.activate_collective_commitment_v1(uuid,uuid,jsonb,text)', 'execute') then 'FAIL:service_activation_execute'
            else 'PASS'
          end;
          SQL
          test "$(tr -d '[:space:]' < "$inventory")" = "PASS"

      - name: Build exact candidate against isolated QA configuration
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee "$ARTIFACT_DIR/build.log"

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Start exact candidate locally
        shell: bash
        run: |
          set -euo pipefail
          nohup npm start -- --hostname 127.0.0.1 --port 3000 \
            > "$ARTIFACT_DIR/server.log" 2>&1 &
          echo "APP_PID=$!" >> "$GITHUB_ENV"
          for _ in $(seq 1 120); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/collective-commitments >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$ARTIFACT_DIR/server.log" >&2
          exit 1

      - name: Run authenticated multi-user adversarial browser suite
        shell: bash
        run: |
          set -o pipefail
          node .github/scripts/collective-commitments-adversarial-browser-qa.mjs \
            2>&1 | tee "$ARTIFACT_DIR/browser-qa.log"

      - name: Verify audit, exact cleanup, and runtime boundary
        shell: bash
        run: |
          set -euo pipefail
          audit="$ARTIFACT_DIR/audit.json"
          test -s "$audit"
          jq -e '.outcome == "pass"' "$audit" >/dev/null
          jq -e '[.checks[] | select(.outcome != "pass")] | length == 0' "$audit" >/dev/null
          jq -e '.cleanup.remaining | to_entries | all(
            if (.value | type) == "array" then (.value | length) == 0 else .value == 0 end
          )' "$audit" >/dev/null
          jq -e '.sessions | length >= 7' "$audit" >/dev/null
          if grep -E \
            'Missing COLLECTIVE_COMMITMENT_MASTER_KEY|permission denied for table profiles|operator does not exist: text ->>|Unhandled|FATAL' \
            "$ARTIFACT_DIR/server.log"; then
            echo "Detected a prohibited runtime failure." >&2
            exit 1
          fi

      - name: Publish tested repair to product branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ghuser29384"
          git config user.email "262476329+ghuser29384@users.noreply.github.com"
          git fetch origin "$PRODUCT_BRANCH"
          remote_head="$(git rev-parse "origin/$PRODUCT_BRANCH")"
          if [[ "$remote_head" != "$EXPECTED_PRODUCT_HEAD" ]]; then
            echo "Refusing moved product branch. Expected $EXPECTED_PRODUCT_HEAD, found $remote_head." >&2
            exit 1
          fi
          git checkout -B "$PRODUCT_BRANCH" "origin/$PRODUCT_BRANCH"
          cp "$RUNNER_TEMP/collective-commitments-actions.ts" src/app/collective-commitments/actions.ts
          cp "$RUNNER_TEMP/collective-commitments-wiring.test.ts" src/collective-commitments-wiring.test.ts
          cp "$RUNNER_TEMP/collective-commitment-form.tsx" \
            src/components/collective-commitments/collective-commitment-form.tsx
          cp "$RUNNER_TEMP/collective-signature-controls.tsx" \
            src/components/collective-commitments/collective-signature-controls.tsx
          cp "$RUNNER_TEMP/collective-commitment-action-state.ts" \
            src/lib/collective-commitments/action-state.ts
          cp "$RUNNER_TEMP/20260727030000_fix_collective_manifest_jsonb_alias.sql" \
            supabase/migrations/20260727030000_fix_collective_manifest_jsonb_alias.sql
          cp "$RUNNER_TEMP/20260727043000_fix_collective_manifest_materialized_rows.sql" \
            supabase/migrations/20260727043000_fix_collective_manifest_materialized_rows.sql
          cp "$RUNNER_TEMP/20260727044500_fix_collective_manifest_typed_recordset.sql" \
            supabase/migrations/20260727044500_fix_collective_manifest_typed_recordset.sql
          cp "$RUNNER_TEMP/collective_identity_threshold_commitments.sql" \
            supabase/tests/collective_identity_threshold_commitments.sql
          git add \
            src/app/collective-commitments/actions.ts \
            src/collective-commitments-wiring.test.ts \
            src/components/collective-commitments/collective-commitment-form.tsx \
            src/components/collective-commitments/collective-signature-controls.tsx \
            src/lib/collective-commitments/action-state.ts \
            supabase/migrations/20260727030000_fix_collective_manifest_jsonb_alias.sql \
            supabase/migrations/20260727043000_fix_collective_manifest_materialized_rows.sql \
            supabase/migrations/20260727044500_fix_collective_manifest_typed_recordset.sql \
            supabase/tests/collective_identity_threshold_commitments.sql
          git diff --cached --check
          git commit -m "Fix collective activation and server-action redirects"
          git push origin HEAD:"$PRODUCT_BRANCH"
          echo "FINAL_PRODUCT_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Record sanitized successful result
        shell: bash
        run: |
          set -euo pipefail
          cat > "$ARTIFACT_DIR/result.txt" <<RESULT
          product_head_before=${EXPECTED_PRODUCT_HEAD}
          product_head_after=${FINAL_PRODUCT_HEAD}
          qa_project=${EXPECTED_QA_REF}
          alias_repair_migration_version=${ALIAS_REPAIR_VERSION}
          materialized_rows_repair_migration_version=${MATERIALIZED_REPAIR_VERSION}
          typed_recordset_repair_migration_version=${TYPED_RECORDSET_REPAIR_VERSION}
          database_regression=PASS
          server_action_runtime=PASS
          successful_mutation_redirects=PASS
          authenticated_browser_qa=PASS
          duplicate_human=PASS
          simultaneous_final_signatures=PASS
          withdrawal_and_resigning=PASS
          stale_credential_invalidation=PASS
          exact_reveal_manifest=PASS
          expiry_erasure=PASS
          outsider_denial=PASS
          every_proposition_class=PASS
          synthetic_cleanup=PASS
          production_changed=NO
          RESULT

      - name: Upload complete QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collective-commitments-adversarial-browser-qa-${{ github.run_id }}
          path: collective-commitments-browser-qa-artifacts
          if-no-files-found: warn
          retention-days: 14

      - name: Stop local application
        if: always()
        shell: bash
        run: |
          if [[ -n "${APP_PID:-}" ]]; then
            kill "$APP_PID" 2>/dev/null || true
          fi
