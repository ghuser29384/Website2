name: Export exact collective QA branch source

on:
  pull_request:
    branches:
      - feature/collective-identity-threshold-commitments-20260726
    paths:
      - ".github/workflows/collective-commitments-adversarial-browser-qa.yml"

permissions:
  contents: read

concurrency:
  group: export-exact-collective-qa-source-20260727
  cancel-in-progress: false

jobs:
  export:
    if: >-
      github.event.pull_request.head.repo.full_name == 'ghuser29384/Website2' &&
      github.head_ref == 'qa/collective-commitments-adversarial-browser-20260727'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_REPOSITORY: ghuser29384/Website2
      EXPECTED_BRANCH: qa/collective-commitments-adversarial-browser-20260727
      EXPECTED_PRODUCT_BASE: 053ed422da9c5cf8c03b1c24c1bb7f2af81386e8

    steps:
      - name: Validate exact execution boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY"
          test "$GITHUB_HEAD_REF" = "$EXPECTED_BRANCH"

      - name: Check out exact pull-request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify ancestry and package source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base "$EXPECTED_PRODUCT_BASE" HEAD)" = "$EXPECTED_PRODUCT_BASE"
          archive="$RUNNER_TEMP/collective-qa-source.tar.gz"
          tar \
            --exclude=.git \
            --exclude=node_modules \
            --exclude=.next \
            --exclude=test-results \
            --exclude=collective-qa-source.tar.gz \
            -czf "$archive" .
          cp "$archive" collective-qa-source.tar.gz
          sha256sum collective-qa-source.tar.gz > collective-qa-source.sha256
          git rev-parse HEAD > collective-qa-source-head.txt

      - name: Upload exact source
        uses: actions/upload-artifact@v4
        with:
          name: collective-qa-source-${{ github.run_id }}
          path: |
            collective-qa-source.tar.gz
            collective-qa-source.sha256
            collective-qa-source-head.txt
          if-no-files-found: error
          retention-days: 2
