name: Harden blind-audit validation v3

on:
  push:
    branches:
      - feature/evidence-credibility-blind-audit-v1-20260812
    paths:
      - .github/workflows/harden-blind-audit-validation-v3.yml

permissions:
  contents: write

concurrency:
  group: harden-blind-audit-validation-v3-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Apply target-specific validation robustly
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          migration_path = Path(
              "supabase/migrations/20260812022000_evidence_credibility_blind_audit_v1.sql"
          )
          migration = migration_path.read_text(encoding="utf-8")

          if "evidence_credibility_calibration_labels_finality_check" not in migration:
              marker = (
                  "  constraint evidence_credibility_calibration_labels_absolute_error_check\n"
              )
              if migration.count(marker) != 1:
                  raise SystemExit("Expected one absolute-error constraint marker.")
              constraints = """  constraint evidence_credibility_calibration_labels_finality_check
            check (final_finality_reason in (
              'review_final', 'replacement_success', 'terminal_rejection',
              'replacement_expired', 'appeal_affirmed', 'appeal_overturned',
              'permissible_exit', 'force_majeure', 'mutual_cancellation',
              'unjustified_abandonment', 'unresolved_dispute', 'late_cure',
              'confirmed', 'adjudicated_paid', 'adjudicated_unpaid', 'not_due',
              'permissible_cancellation', 'late_payment_cure',
              'administrative_correction'
            )),
          constraint evidence_credibility_calibration_labels_integrity_check
            check (final_integrity_finding in (
              'not_assessed', 'supported_honest', 'reckless_misleading',
              'deliberate_fabrication', 'not_applicable'
            )),
          constraint evidence_credibility_calibration_labels_responsiveness_check
            check (final_responsiveness_finding in (
              'not_assessed', 'on_time', 'late_cure', 'missed_deadline',
              'excused', 'not_applicable'
            )),
          constraint evidence_credibility_calibration_labels_dispute_check
            check (final_dispute_conduct_finding in (
              'not_assessed', 'cooperative', 'obstructive', 'retaliatory',
              'evidence_destruction', 'abusive_appeal', 'not_applicable'
            )),
          """
              migration = migration.replace(marker, constraints + marker)

          if "Choose a permitted independent evidence finality." not in migration:
              pattern = re.compile(
                  r"  if draw_row\.target_type = 'settlement_decision'\s+"
                  r"and p_final_status = 'eligible'\s+"
                  r"and p_final_outcome not in \(0, 1\) then\s+"
                  r"raise exception 'Independent settlement outcomes must be paid or still due\.';\s+"
                  r"end if;",
                  re.MULTILINE,
              )
              replacement = """  if draw_row.target_type = 'evidence_decision' then
            if p_final_finality_reason not in (
              'review_final', 'replacement_success', 'terminal_rejection',
              'replacement_expired', 'appeal_affirmed', 'appeal_overturned',
              'permissible_exit', 'force_majeure', 'mutual_cancellation',
              'unjustified_abandonment', 'unresolved_dispute', 'late_cure',
              'administrative_correction'
            ) then
              raise exception 'Choose a permitted independent evidence finality.';
            end if;
            if p_final_integrity_finding not in (
                 'not_assessed', 'supported_honest', 'reckless_misleading',
                 'deliberate_fabrication'
               )
               or p_final_responsiveness_finding not in (
                 'not_assessed', 'on_time', 'late_cure', 'missed_deadline', 'excused'
               )
               or p_final_dispute_conduct_finding not in (
                 'not_assessed', 'cooperative', 'obstructive', 'retaliatory',
                 'evidence_destruction', 'abusive_appeal'
               ) then
              raise exception 'Choose permitted independent evidence findings.';
            end if;
          elsif draw_row.target_type = 'settlement_decision' then
            if p_final_finality_reason not in (
              'confirmed', 'adjudicated_paid', 'adjudicated_unpaid', 'not_due',
              'unresolved_dispute', 'permissible_cancellation',
              'late_payment_cure', 'administrative_correction'
            ) then
              raise exception 'Choose a permitted independent settlement finality.';
            end if;
            if p_final_integrity_finding <> 'not_applicable'
               or p_final_responsiveness_finding <> 'not_applicable'
               or p_final_dispute_conduct_finding <> 'not_applicable' then
              raise exception 'Settlement labels must leave evidence-conduct findings not applicable.';
            end if;
            if p_final_status = 'eligible' and p_final_outcome not in (0, 1) then
              raise exception 'Independent settlement outcomes must be paid or still due.';
            end if;
          else
            raise exception 'The calibration target type is invalid.';
          end if;"""
              migration, count = pattern.subn(replacement, migration, count=1)
              if count != 1:
                  raise SystemExit("Expected one settlement-only validation block.")

          migration_path.write_text(migration, encoding="utf-8")

          auth_path = Path(
              "supabase/tests/evidence_credibility_blind_audit_authorization.sql"
          )
          auth = auth_path.read_text(encoding="utf-8")
          if "cross join lateral" in auth:
              start = auth.index(
                  "insert into public.trade_review_role_grants(profile_id, role, active, granted_by)"
              )
              end_marker = "set active = true, revoked_at = null, granted_by = excluded.granted_by;"
              end = auth.index(end_marker, start) + len(end_marker)
              replacement = """insert into public.trade_review_role_grants(
            profile_id, role, active, granted_by
          )
          select payer.profile_id, 'administrator', true, payer.profile_id
          from qa_auth_actors payer
          where payer.actor_role = 'payer'
          on conflict(profile_id, role) do update
          set active = true, revoked_at = null, granted_by = excluded.granted_by;

          insert into public.trade_review_role_grants(
            profile_id, role, active, granted_by
          )
          select reviewer.profile_id, 'reviewer', true, payer.profile_id
          from qa_auth_actors reviewer
          cross join qa_auth_actors payer
          where reviewer.actor_role in (
            'original_reviewer', 'audit_reviewer', 'unassigned_reviewer'
          )
            and payer.actor_role = 'payer'
          on conflict(profile_id, role) do update
          set active = true, revoked_at = null, granted_by = excluded.granted_by;"""
              auth = auth[:start] + replacement + auth[end:]
              auth_path.write_text(auth, encoding="utf-8")
          PY
          git diff --check
          grep -q "Choose a permitted independent evidence finality" \
            supabase/migrations/20260812022000_evidence_credibility_blind_audit_v1.sql
          grep -q "Settlement labels must leave evidence-conduct findings not applicable" \
            supabase/migrations/20260812022000_evidence_credibility_blind_audit_v1.sql
          ! grep -q "cross join lateral" \
            supabase/tests/evidence_credibility_blind_audit_authorization.sql

      - name: Commit durable hardening and remove controllers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            supabase/migrations/20260812022000_evidence_credibility_blind_audit_v1.sql \
            supabase/tests/evidence_credibility_blind_audit_authorization.sql
          for controller in \
            .github/workflows/harden-blind-audit-validation.yml \
            .github/workflows/harden-blind-audit-validation-v2.yml \
            .github/workflows/harden-blind-audit-validation-v3.yml; do
            test ! -e "$controller" || git rm "$controller"
          done
          git commit -m "fix: validate blind-audit labels by target"
          git push origin "HEAD:${GITHUB_REF_NAME}"
