name: Sync PR 326 with current main

# Triggered after the temporary one-person materialization controller was removed.
on:
  push:
    branches:
      - qa/marketplace-delta-exact-head-repair-20260731
    paths:
      - ".github/workflows/pr326-sync-current-main.yml"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pr326-sync-current-main-20260731
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PRODUCT_BRANCH: agent/marketplace-delta-current-main-20260729
    steps:
      - name: Check out QA controller branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait for a stable main and product pair
        shell: bash
        run: |
          set -euo pipefail
          last_main=""
          last_product=""
          stable_intervals=0
          required_stable_intervals=4
          while (( stable_intervals < required_stable_intervals )); do
            main_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
            product_sha="$(git ls-remote origin "refs/heads/$PRODUCT_BRANCH" | awk '{print $1}')"
            if [[ -z "$main_sha" || -z "$product_sha" ]]; then
              echo "Could not read main or product ref." >&2
              exit 1
            fi
            if [[ "$main_sha" == "$last_main" && "$product_sha" == "$last_product" ]]; then
              stable_intervals=$((stable_intervals + 1))
            else
              last_main="$main_sha"
              last_product="$product_sha"
              stable_intervals=0
            fi
            if (( stable_intervals < required_stable_intervals )); then
              echo "Waiting for stable refs: ${stable_intervals}/${required_stable_intervals}." >&2
              sleep 30
            fi
          done
          printf 'Stable synchronization window: main=%s product=%s\n' "$last_main" "$last_product"

      - name: Merge a stable current main snapshot into PR 326
        id: sync
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            git fetch --no-tags origin main "$PRODUCT_BRANCH"
            main_sha="$(git rev-parse origin/main)"
            product_sha="$(git rev-parse "origin/$PRODUCT_BRANCH")"

            pr_json="$RUNNER_TEMP/pr-326-${attempt}.json"
            curl --fail-with-body --silent --show-error \
              --header "Authorization: Bearer $GITHUB_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/pulls/326" \
              --output "$pr_json"
            [[ "$(jq -r '.state' "$pr_json")" == "open" ]]
            [[ "$(jq -r '.base.ref' "$pr_json")" == "main" ]]
            [[ "$(jq -r '.head.ref' "$pr_json")" == "$PRODUCT_BRANCH" ]]
            [[ "$(jq -r '.head.sha' "$pr_json")" == "$product_sha" ]]

            git checkout -B "$PRODUCT_BRANCH" "origin/$PRODUCT_BRANCH"
            if ! git merge --no-ff --no-edit origin/main -m "Merge current main into marketplace delta PR"; then
              git merge --abort || true
              echo "Current main does not merge cleanly into PR #326." >&2
              exit 1
            fi
            git diff --check "$product_sha...HEAD"
            new_head="$(git rev-parse HEAD)"

            git fetch --no-tags origin main "$PRODUCT_BRANCH"
            final_main="$(git rev-parse origin/main)"
            final_product="$(git rev-parse "origin/$PRODUCT_BRANCH")"
            if [[ "$final_main" != "$main_sha" || "$final_product" != "$product_sha" ]]; then
              echo "Refs moved during sync attempt ${attempt}; retrying." >&2
              git reset --hard "$final_product"
              sleep 15
              continue
            fi

            git push --force-with-lease="refs/heads/$PRODUCT_BRANCH:$product_sha" \
              origin "HEAD:refs/heads/$PRODUCT_BRANCH"
            printf 'main_sha=%s\nproduct_before=%s\nnew_head=%s\n' \
              "$main_sha" "$product_sha" "$new_head" >> "$GITHUB_OUTPUT"

            body="Synced PR #326 with exact main \`$main_sha\` via merge commit \`$new_head\`. The product delta and current-main application state are ready for a new exact-head evidence gate."
            jq -n --arg body "$body" '{body:$body}' > "$RUNNER_TEMP/comment.json"
            curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Authorization: Bearer $GITHUB_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "Content-Type: application/json" \
              --data-binary "@$RUNNER_TEMP/comment.json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/326/comments" \
              --output /dev/null
            exit 0
          done

          echo "Could not obtain a stable main/product pair after five attempts." >&2
          exit 1
        env:
          GITHUB_TOKEN: ${{ github.token }}
