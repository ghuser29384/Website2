name: Coordinate PR 326 exact-head validation

on:
  push:
    branches:
      - qa/marketplace-delta-exact-head-repair-20260731
    paths:
      - ".github/workflows/pr326-sync-current-main.yml"

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: pr326-sync-current-main-20260731
  cancel-in-progress: true

jobs:
  coordinate:
    runs-on: ubuntu-24.04
    timeout-minutes: 115
    env:
      PRODUCT_BRANCH: agent/marketplace-delta-current-main-20260729
      QA_BRANCH: qa/marketplace-delta-exact-head-repair-20260731
      TRIGGER_PATH: .github/qa/marketplace-delta-cleanup-now
    steps:
      - name: Check out QA controller branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Keep the product branch current and trigger only stable exact-head pairs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          last_observed_pair=""
          last_triggered_pair=""
          stable_intervals=0
          required_stable_intervals=4

          post_comment() {
            local body="$1"
            jq -n --arg body "$body" '{body:$body}' > "$RUNNER_TEMP/comment.json"
            curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Authorization: Bearer $GITHUB_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "Content-Type: application/json" \
              --data-binary "@$RUNNER_TEMP/comment.json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/326/comments" \
              --output /dev/null
          }

          trigger_exact_gate() {
            local main_sha="$1"
            local product_sha="$2"
            local api_url="https://api.github.com/repos/$GITHUB_REPOSITORY/contents/$TRIGGER_PATH"
            local current="$RUNNER_TEMP/current-trigger.json"
            curl --fail-with-body --silent --show-error --get \
              --header "Authorization: Bearer $GITHUB_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --data-urlencode "ref=$QA_BRANCH" \
              "$api_url" --output "$current"
            local blob_sha payload content
            blob_sha="$(jq -r '.sha' "$current")"
            content="audit-trigger-main-${main_sha}-product-${product_sha}-coordinator-${GITHUB_RUN_ID}"
            payload="$RUNNER_TEMP/trigger-payload.json"
            jq -n \
              --arg message "Trigger exact-head marketplace audit for synchronized PR 326" \
              --arg content "$(printf '%s\n' "$content" | base64 -w0)" \
              --arg sha "$blob_sha" \
              --arg branch "$QA_BRANCH" \
              '{message:$message,content:$content,sha:$sha,branch:$branch}' > "$payload"
            curl --fail-with-body --silent --show-error \
              --request PUT \
              --header "Authorization: Bearer $GITHUB_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "Content-Type: application/json" \
              --data-binary "@$payload" \
              "$api_url" --output /dev/null
          }

          for tick in $(seq 1 220); do
            git fetch --no-tags origin main "$PRODUCT_BRANCH"
            main_sha="$(git rev-parse origin/main)"
            product_sha="$(git rev-parse "origin/$PRODUCT_BRANCH")"

            pr_json="$RUNNER_TEMP/pr-326.json"
            curl --fail-with-body --silent --show-error \
              --header "Authorization: Bearer $GITHUB_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/pulls/326" \
              --output "$pr_json"
            [[ "$(jq -r '.state' "$pr_json")" == "open" ]]
            [[ "$(jq -r '.base.ref' "$pr_json")" == "main" ]]
            [[ "$(jq -r '.head.ref' "$pr_json")" == "$PRODUCT_BRANCH" ]]
            [[ "$(jq -r '.head.sha' "$pr_json")" == "$product_sha" ]]

            if ! git merge-base --is-ancestor "$main_sha" "$product_sha"; then
              before="$product_sha"
              git checkout -B "$PRODUCT_BRANCH" "origin/$PRODUCT_BRANCH"
              if ! git merge --no-ff --no-edit "$main_sha" -m "Merge current main into marketplace delta PR"; then
                git merge --abort || true
                echo "Current main does not merge cleanly into PR #326." >&2
                exit 1
              fi
              git diff --check "$before...HEAD"
              merged="$(git rev-parse HEAD)"

              git fetch --no-tags origin main "$PRODUCT_BRANCH"
              if [[ "$(git rev-parse origin/main)" != "$main_sha" ]] || \
                 [[ "$(git rev-parse "origin/$PRODUCT_BRANCH")" != "$before" ]]; then
                echo "Refs moved while preparing synchronization; retrying on the next interval." >&2
                git reset --hard "origin/$PRODUCT_BRANCH"
                stable_intervals=0
                last_observed_pair=""
                sleep 30
                continue
              fi

              git push --force-with-lease="refs/heads/$PRODUCT_BRANCH:$before" \
                origin "HEAD:refs/heads/$PRODUCT_BRANCH"
              product_sha="$merged"
              post_comment "Synced PR #326 with exact main \`$main_sha\` via merge commit \`$product_sha\`. The coordinator will trigger the exact-head evidence gate after this pair remains stable."
              stable_intervals=0
              last_observed_pair=""
            fi

            pair="${main_sha}:${product_sha}"
            if [[ "$pair" == "$last_observed_pair" ]]; then
              stable_intervals=$((stable_intervals + 1))
            else
              last_observed_pair="$pair"
              stable_intervals=0
            fi

            echo "Observed exact pair $pair; stable intervals ${stable_intervals}/${required_stable_intervals}."
            if (( stable_intervals >= required_stable_intervals )) && [[ "$pair" != "$last_triggered_pair" ]]; then
              trigger_exact_gate "$main_sha" "$product_sha"
              last_triggered_pair="$pair"
              post_comment "Triggered a new exact-head evidence gate for main \`$main_sha\` and PR head \`$product_sha\` after a stable synchronization window."
            fi

            sleep 30
          done
        env:
          GITHUB_TOKEN: ${{ github.token }}
