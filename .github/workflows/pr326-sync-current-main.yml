name: Sync PR 326 with current main

on:
  push:
    branches:
      - qa/marketplace-delta-exact-head-repair-20260731
    paths:
      - ".github/workflows/pr326-sync-current-main.yml"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pr326-sync-current-main-20260731
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PRODUCT_BRANCH: agent/marketplace-delta-current-main-20260729
      EXPECTED_PRODUCT_HEAD: 8b66c3d290e8a7779139a85080bedaa90c53e358
      EXPECTED_MAIN_HEAD: 349b44c89d2602a4195fd115f1632b307664adab
    steps:
      - name: Check out QA controller branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge exact current main into PR 326 branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main "$PRODUCT_BRANCH"
          actual_main="$(git rev-parse origin/main)"
          actual_product="$(git rev-parse "origin/$PRODUCT_BRANCH")"
          if [[ "$actual_main" != "$EXPECTED_MAIN_HEAD" ]]; then
            echo "Main moved: expected $EXPECTED_MAIN_HEAD, got $actual_main" >&2
            exit 1
          fi
          if [[ "$actual_product" != "$EXPECTED_PRODUCT_HEAD" ]]; then
            echo "Product branch moved: expected $EXPECTED_PRODUCT_HEAD, got $actual_product" >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$PRODUCT_BRANCH" "origin/$PRODUCT_BRANCH"
          git merge --no-ff --no-edit origin/main -m "Merge current main into marketplace delta PR"
          git diff --check "$EXPECTED_PRODUCT_HEAD...HEAD"

          new_head="$(git rev-parse HEAD)"
          git push origin "HEAD:refs/heads/$PRODUCT_BRANCH"
          printf 'new_head=%s\n' "$new_head" >> "$GITHUB_OUTPUT"

          body="Synced PR #326 with exact main \`$EXPECTED_MAIN_HEAD\` via merge commit \`$new_head\`. The product changes and current-main TypeScript repairs are now tested together by the exact-head evidence gate."
          jq -n --arg body "$body" '{body:$body}' > "$RUNNER_TEMP/comment.json"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "Content-Type: application/json" \
            --data-binary "@$RUNNER_TEMP/comment.json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/326/comments" \
            --output /dev/null
        env:
          GITHUB_TOKEN: ${{ github.token }}
