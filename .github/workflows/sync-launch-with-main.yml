name: Synchronize launch branch with current main

on:
  push:
    branches:
      - launch/verify-and-harden-20260723
    paths:
      - .github/workflows/sync-launch-with-main.yml

permissions:
  contents: write

concurrency:
  group: sync-launch-with-main
  cancel-in-progress: false

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out launch branch with full history
        uses: actions/checkout@v4
        with:
          ref: launch/verify-and-harden-20260723
          fetch-depth: 0

      - name: Merge current main and preserve the hardened bilateral workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main launch/verify-and-harden-20260723

          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e

          conflicts="$(git diff --name-only --diff-filter=U || true)"
          if [[ -n "$conflicts" ]]; then
            unexpected="$(printf '%s\n' "$conflicts" | grep -Ev '^(scripts/vercel-ignore-build\.mjs|src/lib/vercel-build-ownership\.test\.ts|vercel\.json|src/app/trades/new/page\.tsx)$' || true)"
            if [[ -n "$unexpected" ]]; then
              echo "Unexpected merge conflicts:" >&2
              printf '%s\n' "$unexpected" >&2
              exit 1
            fi

            for path in scripts/vercel-ignore-build.mjs src/lib/vercel-build-ownership.test.ts vercel.json; do
              if printf '%s\n' "$conflicts" | grep -Fxq "$path"; then
                git checkout --ours -- "$path"
                git add "$path"
              fi
            done
          elif [[ $merge_status -ne 0 ]]; then
            echo "Merge failed without a reported file conflict." >&2
            exit 1
          fi

          cat > src/app/trades/new/page.tsx <<'EOF'
          import { randomUUID } from "node:crypto";
          import type { Metadata } from "next";

          import { saveCoreOfferAction } from "@/app/core-trade-actions";
          import {
            HardenedTradeDraftWorkbench,
            type TradeDraftValues,
          } from "@/components/core-trade/trade-draft-workbench-hardened";
          import { TradeDraftSignInGate } from "@/components/core-trade/trade-draft-workbench";
          import { getViewer } from "@/lib/app-data";
          import { getFormMessage } from "@/lib/form-state";
          import {
            getPledgeTemplateInitialValues,
            getTradeDraftTemplateLabel,
          } from "@/lib/trade-template-library";

          export const dynamic = "force-dynamic";
          export const revalidate = 0;

          export const metadata: Metadata = {
            title: "Create a trade",
            description:
              "Build one bounded Moral Trade proposal through progressive terms, then save privately or submit it once for review.",
            robots: { index: false, follow: false },
          };

          interface NewTradePageProps {
            searchParams: Promise<Record<string, string | string[] | undefined>>;
          }

          function valueOf(value: string | string[] | undefined) {
            return Array.isArray(value) ? value[0] ?? "" : value ?? "";
          }

          const VICTORIA_EXAMPLE: Partial<TradeDraftValues> = {
            offeredCause: "Global poverty reduction",
            requestedCause: "Animal welfare",
            proposedAction:
              "Donate 1% of income to an agreed global-poverty charity for the stated term.",
            requestedAction: "Follow a vegetarian diet for the stated term.",
            noTradeBaseline:
              "Without an agreement, I keep my current giving and the counterparty keeps their current diet.",
            duration: "12 months",
            evidenceRule:
              "Donation receipt for the giving commitment and participant attestation for the diet commitment.",
            maximumBurden: "The stated 1% donation and the stated 12-month dietary commitment only.",
            privacyScope:
              "Agreement evidence is private to the two participants and the operator. Publishing any evidence requires a separate, explicit redaction and publication step.",
            exitConditions:
              "Either participant may end future obligations by notifying the other; completed periods remain recorded.",
          };

          const WORKBENCH_GRID = `
            #main-content > form {
              min-height: 0;
            }
          `;

          export default async function NewTradePage({ searchParams }: NewTradePageProps) {
            const [viewer, resolvedSearchParams] = await Promise.all([getViewer(), searchParams]);
            const templateId = valueOf(resolvedSearchParams.template);
            const structure = valueOf(resolvedSearchParams.structure);
            const acceptsCommandHandoff =
              valueOf(resolvedSearchParams.handoff) === "command-center";
            const returnParams = new URLSearchParams();
            if (templateId) returnParams.set("template", templateId);
            if (structure) returnParams.set("structure", structure);
            if (acceptsCommandHandoff) returnParams.set("handoff", "command-center");
            const returnTo = `/trades/new${returnParams.size ? `?${returnParams.toString()}` : ""}`;

            if (!viewer) {
              return <TradeDraftSignInGate returnTo={returnTo} />;
            }

            const example = valueOf(resolvedSearchParams.example);
            const templateValues = getPledgeTemplateInitialValues(templateId);
            const templateLabel = templateValues ? getTradeDraftTemplateLabel(templateId) : null;

            return (
              <>
                <style>{WORKBENCH_GRID}</style>
                <HardenedTradeDraftWorkbench
                  acceptCommandHandoff={acceptsCommandHandoff}
                  formMessage={getFormMessage(resolvedSearchParams)}
                  initialValues={templateValues ?? (example === "seed-victoria" ? VICTORIA_EXAMPLE : undefined)}
                  saveAction={saveCoreOfferAction}
                  submissionKey={randomUUID()}
                  templateLabel={templateLabel}
                />
              </>
            );
          }
          EOF
          sed -i 's/^          //' src/app/trades/new/page.tsx
          git add src/app/trades/new/page.tsx

          for temporary_path in \
            .github/launch-sync-trigger.txt \
            .github/workflows/sync-launch-with-main.yml \
            .github/workflows/sync-launch-pr-trigger.yml \
            .github/workflows/sync-launch-branch-one-shot.yml \
            .github/workflows/sync-launch-pr-target.yml; do
            if [[ -e "$temporary_path" ]]; then
              git rm -f "$temporary_path"
            fi
          done

          unresolved="$(git diff --name-only --diff-filter=U || true)"
          if [[ -n "$unresolved" ]]; then
            echo "Unresolved conflicts remain:" >&2
            printf '%s\n' "$unresolved" >&2
            exit 1
          fi

          git add -A
          git status --short
          git commit -m "Merge current main into launch verification branch"
          git push origin HEAD:launch/verify-and-harden-20260723
