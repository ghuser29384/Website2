name: PR 558 reviewer action refresh controller

on:
  push:
    branches:
      - ops/pr558-reviewer-action-refresh-20260808

permissions:
  contents: write

concurrency:
  group: pr558-reviewer-action-refresh-controller
  cancel-in-progress: false

jobs:
  patch-and-push:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the exact PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/mpgf-dac-product-lifecycle-20260807

      - name: Force a distinct post-mutation reviewer URL
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "fef40a64931b81a8f6d880f9dd0d03125758563b"
          python3 - <<'PY'
          from pathlib import Path

          actions_path = Path("src/app/mpgf/admin/actions.ts")
          actions = actions_path.read_text()
          stale_redirect = '  redirect("/mpgf/admin/dac-lifecycle");'
          distinct_redirect = '  redirect(`/mpgf/admin/dac-lifecycle?reviewed=${encodeURIComponent(pledgeId)}`);'
          if actions.count(stale_redirect) != 1:
              raise SystemExit("Expected exactly one same-route reviewer redirect.")
          actions = actions.replace(stale_redirect, distinct_redirect, 1)
          actions_path.write_text(actions)

          test_path = Path("src/lib/mpgf/dac-product-lifecycle.test.ts")
          test_source = test_path.read_text()
          stale_regression = '/revalidateMpgfDacLifecycleRoutes\\(\\{ campaignId \\}\\);\\s*redirect\\("\\/mpgf\\/admin\\/dac-lifecycle"\\);/'
          distinct_regression = '/revalidateMpgfDacLifecycleRoutes\\(\\{ campaignId \\}\\);\\s*redirect\\(`\\/mpgf\\/admin\\/dac-lifecycle\\?reviewed=\\$\\{encodeURIComponent\\(pledgeId\\)\\}`\\);/'
          if test_source.count(stale_regression) != 1:
              raise SystemExit("Expected exactly one same-route reviewer redirect regression.")
          test_source = test_source.replace(stale_regression, distinct_regression, 1)
          test_path.write_text(test_source)
          PY

          git diff --check
          git diff -- src/app/mpgf/admin/actions.ts src/lib/mpgf/dac-product-lifecycle.test.ts

      - name: Install exact dependencies
        run: npm ci

      - name: Run focused lifecycle regression
        run: node --import tsx --test src/lib/mpgf/dac-product-lifecycle.test.ts

      - name: Commit and push the repaired PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/mpgf/admin/actions.ts src/lib/mpgf/dac-product-lifecycle.test.ts
          git diff --cached --check
          git commit -m "fix(mpgf): force a distinct reviewer refresh URL"
          git push origin HEAD:fix/mpgf-dac-product-lifecycle-20260807
