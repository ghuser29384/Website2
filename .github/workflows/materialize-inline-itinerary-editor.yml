name: Materialize inline itinerary editor

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Materialize production files
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const zlib = require('node:zlib');
          const crypto = require('node:crypto');
          const parts = Array.from({ length: 8 }, (_, index) =>
            `tmp/inline-itinerary-editor-payload-${String(index).padStart(2, '0')}.txt`,
          );
          try {
            const encoded = parts.map((file) => fs.readFileSync(file, 'utf8')).join('').trim();
            const decoded = zlib.gunzipSync(Buffer.from(encoded, 'base64'));
            const digest = crypto.createHash('sha256').update(decoded).digest('hex');
            if (digest !== 'c5c6017b4c63d39ae3e6715f562bfad272531e8e7e8ede71466cfba821eebe94') {
              throw new Error(`payload integrity mismatch: ${digest}`);
            }
            const files = JSON.parse(decoded.toString('utf8'));
            for (const [filePath, content] of Object.entries(files)) {
              fs.mkdirSync(path.dirname(filePath), { recursive: true });
              fs.writeFileSync(filePath, content);
            }
            fs.rmSync('tmp/inline-itinerary-editor-payload.txt', { force: true });
            for (const file of parts) fs.rmSync(file, { force: true });
            fs.rmSync('tmp/materialize-trigger.txt', { force: true });
            fs.rmSync('tmp/materialize-error.txt', { force: true });
            fs.rmSync('.github/workflows/materialize-inline-itinerary-editor.yml');
          } catch (error) {
            fs.writeFileSync('tmp/materialize-error.txt', `${error.stack || error}\n`);
          }
          NODE
      - name: Commit production implementation or diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          if test -f tmp/materialize-error.txt; then
            git commit -m "Record itinerary materialization diagnostic"
          else
            git commit -m "Add the inline itinerary editor"
          fi
          git push origin HEAD:${{ github.head_ref }}
