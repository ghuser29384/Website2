name: Quiet UI final release diagnostics
on:
  push:
    branches: [ops/quiet-ui-source-review-20260926]
    paths: [.github/workflows/quiet-ui-finalize.yml]
permissions:
  contents: read
concurrency:
  group: quiet-ui-final-diagnostics
  cancel-in-progress: false
env:
  CI: 'true'
  NEXT_TELEMETRY_DISABLED: '1'
  NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3210
  SITE_URL: http://127.0.0.1:3210
jobs:
  diagnose:
    if: github.actor == 'ghuser29384'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ea9f882fbd665f898ecd210bcddbfd6fc338d8f9
          persist-credentials: false
      - run: mkdir -p evidence && git rev-parse HEAD HEAD^{tree} > evidence/revision.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Isolate overflow without clipping content or waiting for background networking
        shell: bash
        run: |
          set -euo pipefail
          npm run start -- -H 127.0.0.1 -p 3210 > evidence/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:3210/ >/dev/null; then break; fi
            sleep 1
          done
          node --input-type=module <<'JS'
          import { chromium, expect } from '@playwright/test';
          import { writeFileSync } from 'node:fs';
          const browser = await chromium.launch();
          const report = [];
          async function measure(page) {
            return page.evaluate(() => {
              const describe = element => {
                const r = element.getBoundingClientRect();
                const s = getComputedStyle(element);
                return { tag: element.tagName, id: element.id, className: element.className,
                  text: element.textContent?.trim().slice(0, 180), x: r.x, y: r.y, right: r.right, width: r.width,
                  clientWidth: element.clientWidth, scrollWidth: element.scrollWidth,
                  display: s.display, minWidth: s.minWidth, maxWidth: s.maxWidth,
                  whiteSpace: s.whiteSpace, overflow: s.overflow, overflowWrap: s.overflowWrap,
                  fontFamily: s.fontFamily, fontSize: s.fontSize };
              };
              const offenders = [...document.querySelectorAll('body *')].filter(el => {
                // The specification's intentionally scrollable tables are not page overflow.
                if (el.closest('.mpgf-table')) return false;
                const r = el.getBoundingClientRect();
                return r.width > 0 && (r.right > innerWidth + 1 || r.left < -1 ||
                  (el.clientWidth > 0 && el.scrollWidth > el.clientWidth + 1));
              });
              return { innerWidth, scrollWidth: document.documentElement.scrollWidth, fontStatus: document.fonts.status,
                offenderCount: offenders.length,
                offenders: offenders.slice(0, 80).map(el => ({ element: describe(el), parent: el.parentElement && describe(el.parentElement) })) };
            });
          }
          try {
            for (const fonts of ['normal', 'unavailable']) {
              for (const width of [1440, 390]) {
                const page = await browser.newPage({ viewport: { width, height: 1000 } });
                if (fonts === 'unavailable') {
                  await page.route(/\.(woff2?|ttf|otf)(\?|$)/, route => route.abort('failed'));
                }
                await page.context().addCookies([
                  { name: 'mt_walkthrough_seen', value: '1', url: 'http://127.0.0.1:3210' },
                  { name: 'mt_analytics_opt_out', value: '1', url: 'http://127.0.0.1:3210' },
                ]);
                const errors = [];
                page.on('pageerror', e => errors.push(e.message));
                await page.goto('http://127.0.0.1:3210/moral-trade/technical-spec', { waitUntil: 'domcontentloaded' });
                await expect(page.getByRole('heading').first()).toBeVisible();
                await page.evaluate(() => Promise.race([document.fonts.ready, new Promise(resolve => setTimeout(resolve, 1000))]));
                const before = await measure(page);
                // Diagnostic experiment only. The source and actual tests remain unchanged.
                await page.addStyleTag({ content: '.protocol-contract-card { overflow-wrap: anywhere; }' });
                const after = await measure(page);
                report.push({ fonts, width, errors, before, after });
                writeFileSync('evidence/overflow.json', JSON.stringify(report, null, 2));
                await page.screenshot({ path: `evidence/technical-spec-experiment-${fonts}-${width}.png`, timeout: 10000 });
                await page.close();
              }
            }
          } finally {
            await browser.close();
            writeFileSync('evidence/overflow.json', JSON.stringify(report, null, 2));
          }
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quiet-ui-final-diagnostics
          path: evidence/
          retention-days: 7
          if-no-files-found: warn
