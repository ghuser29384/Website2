          Path("src/lib/walkthrough-profile.ts").write_text(r'''import {
  COHORT_CAUSES,
  FIRST_ACTIONS,
  ONBOARDING_GOALS,
  PARTICIPANT_KINDS,
} from "@/lib/growth";

export const WALKTHROUGH_PROFILE_COOKIE_NAME = "mt_walkthrough_profile_draft";
export const WALKTHROUGH_PROFILE_STORAGE_KEY = "mt_walkthrough_profile_draft";
export const WALKTHROUGH_PROFILE_MAX_AGE_SECONDS = 60 * 60 * 24 * 7;

const WALKTHROUGH_OFFER_TYPES = ["Money", "Time", "A pledge"] as const;
const causeAreaSet = new Set<string>(COHORT_CAUSES);
const offerTypeSet = new Set<string>(WALKTHROUGH_OFFER_TYPES);
const participantKindSet = new Set<string>(PARTICIPANT_KINDS.map((item) => item.value));
const goalSet = new Set<string>(ONBOARDING_GOALS.map((item) => item.value));
const firstActionSet = new Set<string>(FIRST_ACTIONS.map((item) => item.value));

const WALKTHROUGH_CAUSE_AREA_MAP: Record<string, (typeof COHORT_CAUSES)[number]> = {
  "Wild animal suffering": "Animal welfare",
  "Factory farming": "Animal welfare",
  "Global health": "Public health",
  Climate: "Climate",
  "Existential risk": "Existential risk",
  "Future flourishing": "Future flourishing",
  "S-risks": "Future flourishing",
  "Global poverty": "Global poverty",
  "Concentration of power": "Cause prioritization",
  "Priorities research": "Cause prioritization",
  "Biological risks": "Existential risk",
  "AI safety": "Existential risk",
  "Space governance": "Future flourishing",
  "Building altruism": "Community service",
};

type SearchParams = Record<string, string | string[] | undefined>;

export type WalkthroughOfferType = (typeof WALKTHROUGH_OFFER_TYPES)[number];
export type WalkthroughCauseArea = (typeof COHORT_CAUSES)[number];

export interface WalkthroughProfileDraft {
  version: 1;
  source: "walkthrough";
  originalCause: string;
  causeArea: WalkthroughCauseArea;
  offerType: WalkthroughOfferType;
  matchName: string;
  matchGet: string;
  matchGive: string;
  participantKind: (typeof PARTICIPANT_KINDS)[number]["value"];
  primaryGoal: (typeof ONBOARDING_GOALS)[number]["value"];
  firstAction: (typeof FIRST_ACTIONS)[number]["value"];
  createdAt: string;
}

function clean(value: unknown, maxLength = 160) {
  return String(value ?? "")
    .replace(/\s+/g, " ")
    .trim()
    .slice(0, maxLength);
}

function readSearchParam(searchParams: SearchParams | undefined, key: string) {
  const value = searchParams?.[key];
  return Array.isArray(value) ? clean(value[0]) : clean(value);
}

export function mapWalkthroughCauseToCauseArea(cause: string): WalkthroughCauseArea {
  return WALKTHROUGH_CAUSE_AREA_MAP[clean(cause)] ?? "Cause prioritization";
}

export function createWalkthroughProfileDraft(input: {
  originalCause?: unknown;
  causeArea?: unknown;
  offerType?: unknown;
  matchName?: unknown;
  matchGet?: unknown;
  matchGive?: unknown;
  participantKind?: unknown;
  primaryGoal?: unknown;
  firstAction?: unknown;
  createdAt?: unknown;
}): WalkthroughProfileDraft | null {
  const originalCause = clean(input.originalCause) || "Cause prioritization";
  const explicitCauseArea = clean(input.causeArea);
  const causeArea = (causeAreaSet.has(explicitCauseArea)
    ? explicitCauseArea
    : mapWalkthroughCauseToCauseArea(originalCause)) as WalkthroughCauseArea;
  const offerType = clean(input.offerType);
  const matchName = clean(input.matchName);

  if (!offerTypeSet.has(offerType) || !matchName) {
    return null;
  }

  const participantKind = clean(input.participantKind);
  const primaryGoal = clean(input.primaryGoal);
  const firstAction = clean(input.firstAction);
  const createdAt = clean(input.createdAt, 64);

  return {
    version: 1,
    source: "walkthrough",
    originalCause,
    causeArea,
    offerType: offerType as WalkthroughOfferType,
    matchName,
    matchGet: clean(input.matchGet),
    matchGive: clean(input.matchGive),
    participantKind: (participantKindSet.has(participantKind)
      ? participantKind
      : "individual") as WalkthroughProfileDraft["participantKind"],
    primaryGoal: (goalSet.has(primaryGoal)
      ? primaryGoal
      : "find_counterparty") as WalkthroughProfileDraft["primaryGoal"],
    firstAction: (firstActionSet.has(firstAction)
      ? firstAction
      : "create_broad_preview") as WalkthroughProfileDraft["firstAction"],
    createdAt: createdAt || new Date().toISOString(),
  };
}

export function encodeWalkthroughProfileDraft(draft: WalkthroughProfileDraft) {
  return encodeURIComponent(JSON.stringify(draft));
}

export function parseWalkthroughProfileDraft(value: string | null | undefined) {
  if (!value) return null;

  try {
    const parsed = JSON.parse(decodeURIComponent(value)) as Record<string, unknown>;
    return createWalkthroughProfileDraft(parsed);
  } catch {
    return null;
  }
}

export function getWalkthroughProfileDraft({
  cookieValue,
  searchParams,
}: {
  cookieValue?: string | null;
  searchParams?: SearchParams;
}) {
  const source = readSearchParam(searchParams, "source");
  const hasQueryDraft =
    source === "walkthrough" ||
    Boolean(readSearchParam(searchParams, "offer_type")) ||
    Boolean(readSearchParam(searchParams, "match_name"));

  if (hasQueryDraft) {
    const queryDraft = createWalkthroughProfileDraft({
      originalCause: readSearchParam(searchParams, "walkthrough_cause"),
      causeArea: readSearchParam(searchParams, "cause_area"),
      offerType: readSearchParam(searchParams, "offer_type"),
      matchName: readSearchParam(searchParams, "match_name"),
      matchGet: readSearchParam(searchParams, "match_get"),
      matchGive: readSearchParam(searchParams, "match_give"),
    });

    if (queryDraft) return queryDraft;
  }

  return parseWalkthroughProfileDraft(cookieValue);
}

export function buildWalkthroughOnboardingPath(draft: WalkthroughProfileDraft) {
  const query = new URLSearchParams({
    source: "walkthrough",
    cause_area: draft.causeArea,
    walkthrough_cause: draft.originalCause,
    offer_type: draft.offerType,
    match_name: draft.matchName,
    match_get: draft.matchGet,
    match_give: draft.matchGive,
  });

  return `/onboarding?${query.toString()}`;
}
''')

          Path("src/lib/walkthrough-profile.test.ts").write_text(r'''import assert from "node:assert/strict";
import test from "node:test";

import {
  buildWalkthroughOnboardingPath,
  createWalkthroughProfileDraft,
  encodeWalkthroughProfileDraft,
  getWalkthroughProfileDraft,
  mapWalkthroughCauseToCauseArea,
  parseWalkthroughProfileDraft,
} from "@/lib/walkthrough-profile";

test("maps walkthrough causes to onboarding cause areas", () => {
  assert.equal(mapWalkthroughCauseToCauseArea("AI safety"), "Existential risk");
  assert.equal(mapWalkthroughCauseToCauseArea("Factory farming"), "Animal welfare");
  assert.equal(mapWalkthroughCauseToCauseArea("Global health"), "Public health");
});

test("round-trips a private walkthrough starter profile", () => {
  const draft = createWalkthroughProfileDraft({
    originalCause: "AI safety",
    offerType: "Money",
    matchName: "Rae",
    matchGet: "30 vegetarian days",
    matchGive: "$20 to malaria prevention",
    createdAt: "2026-07-17T16:00:00.000Z",
  });

  assert.ok(draft);
  assert.equal(draft.causeArea, "Existential risk");
  assert.deepEqual(parseWalkthroughProfileDraft(encodeWalkthroughProfileDraft(draft)), draft);
  assert.match(buildWalkthroughOnboardingPath(draft), /^\/onboarding\?source=walkthrough&/);
});

test("query values take precedence over an older cookie draft", () => {
  const cookieDraft = createWalkthroughProfileDraft({
    originalCause: "Climate",
    offerType: "Time",
    matchName: "Asha",
  });
  assert.ok(cookieDraft);

  const draft = getWalkthroughProfileDraft({
    cookieValue: encodeWalkthroughProfileDraft(cookieDraft),
    searchParams: {
      source: "walkthrough",
      cause_area: "Animal welfare",
      walkthrough_cause: "Factory farming",
      offer_type: "A pledge",
      match_name: "Noor",
    },
  });

  assert.equal(draft?.causeArea, "Animal welfare");
  assert.equal(draft?.offerType, "A pledge");
  assert.equal(draft?.matchName, "Noor");
});
''')

          Path("src/app/onboarding/page.tsx").write_text(r'''import type { Metadata } from "next";
