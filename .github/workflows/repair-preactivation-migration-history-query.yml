name: Repair pre-activation migration-history projection

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
    paths:
      - .github/workflows/repair-preactivation-migration-history-query.yml

permissions:
  contents: write

concurrency:
  group: repair-preactivation-migration-history-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'database/preactivation-schema-baseline-20260818'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Replace reserved output aliases and verify the generator
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/database/generate-preactivation-baseline.sh')
          text = path.read_text()
          old = """  to_jsonb(m) ->> 'version' as version,
            coalesce(to_jsonb(m) ->> 'name', '') as name,"""
          new = """  to_jsonb(m) ->> 'version' as migration_version,
            coalesce(to_jsonb(m) ->> 'name', '') as migration_name,"""
          if text.count(old) != 1:
              raise SystemExit(f'Expected one migration-history projection, found {text.count(old)}.')
          path.write_text(text.replace(old, new))
          PY
          bash -n scripts/database/generate-preactivation-baseline.sh
          git diff --check

      - name: Commit and push normally
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/database/generate-preactivation-baseline.sh
          git commit -m 'Fix sanitized migration-history projection'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
