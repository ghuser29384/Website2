name: PR 402 current-main release controller

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: pr402-current-main-release
  cancel-in-progress: false

env:
  TARGET_BRANCH: fix/discover-pledge-clarity-20260801
  EXPECTED_HEAD: 8f7eb81e843b982ec89e1ea5cc37deaf508f8f90
  CONTROLLER_PATH: .github/workflows/pr402-current-main-controller.yml

jobs:
  integrate-and-validate:
    if: >-
      github.repository == 'ghuser29384/Website2' &&
      github.event.issue.pull_request != null &&
      github.event.issue.number == 402 &&
      github.event.comment.body == '/sync-and-gate-pr402-20260801'
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out the exact feature head
        uses: actions/checkout@v4
        with:
          ref: fix/discover-pledge-clarity-20260801
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Guard exact repository and feature head
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'ghuser29384/Website2'
          test "$(git branch --show-current)" = "$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')" = "$EXPECTED_HEAD"

      - name: Remove this temporary controller from main and pin the clean base
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          controller_sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/$CONTROLLER_PATH?ref=main" --jq .sha)"
          jq -n \
            --arg message 'Remove temporary PR 402 release controller' \
            --arg sha "$controller_sha" \
            --arg branch main \
            '{message:$message,sha:$sha,branch:$branch}' \
            | gh api --method DELETE "repos/$GITHUB_REPOSITORY/contents/$CONTROLLER_PATH" --input - >/dev/null
          git fetch origin main
          base_sha="$(git rev-parse origin/main)"
          test -n "$base_sha"
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"

      - name: Merge the pinned clean main without committing
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-commit --no-ff "${{ steps.base.outputs.base_sha }}"
          test ! -e "$CONTROLLER_PATH"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Repack and verify Discover
        shell: bash
        run: |
          set -euo pipefail
          node scripts/pack-discover-payload.mjs
          npm run verify:discover

      - name: Run focused and complete repository gates
        shell: bash
        env:
          NEXT_PUBLIC_SITE_URL: https://www.moraltrade.org
          VERCEL: '1'
          VERCEL_ENV: preview
        run: |
          set -euo pipefail
          node --import tsx --test src/discover-pledge-clarity.test.ts
          npm test
          npm run lint -- --quiet
          npm run build

      - name: Run rendered desktop and mobile pledge-clarity gates
        shell: bash
        run: |
          set -euo pipefail
          npx playwright install --with-deps chromium
          npx playwright test tests/discover-pledge-clarity.spec.ts --reporter=line
          test -s test-results/discover-pledge-clarity-desktop.png
          test -s test-results/discover-pledge-clarity-mobile.png

      - name: Verify the pinned main base stayed current
        shell: bash
        env:
          PINNED_BASE: ${{ steps.base.outputs.base_sha }}
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$PINNED_BASE"

      - name: Publish the exact integrated candidate
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          git commit -m 'Merge current main into Discover pledge clarity'
          candidate_sha="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^1)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD^2)" = "${{ steps.base.outputs.base_sha }}"
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')" = "$EXPECTED_HEAD"
          git push --force-with-lease="refs/heads/$TARGET_BRANCH:$EXPECTED_HEAD" origin "HEAD:refs/heads/$TARGET_BRANCH"
          echo "candidate_sha=$candidate_sha" >> "$GITHUB_OUTPUT"

      - name: Upload rendered evidence
        uses: actions/upload-artifact@v4
        with:
          name: pr402-current-main-${{ steps.publish.outputs.candidate_sha }}
          path: |
            test-results/discover-pledge-clarity-desktop.png
            test-results/discover-pledge-clarity-mobile.png
          if-no-files-found: error
          retention-days: 30

      - name: Report success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh pr comment 402 --repo "$GITHUB_REPOSITORY" --body "Current-main integration and exact-head release gates passed. Pushed candidate \`${{ steps.publish.outputs.candidate_sha }}\` on clean base \`${{ steps.base.outputs.base_sha }}\`. Focused contracts, complete tests, ESLint, production build/TypeScript, and desktop/mobile Playwright all passed. PR remains draft pending final-head integrated Discover QA and deployable Vercel previews."

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh pr comment 402 --repo "$GITHUB_REPOSITORY" --body "Current-main integration controller failed in run \`$GITHUB_RUN_ID\`. The temporary main controller was removed before validation. No feature push occurred unless every exact-head guard and release gate passed."
