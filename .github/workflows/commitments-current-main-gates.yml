name: Commitments current-main exact gates

on:
  push:
    branches:
      - feature/commitments-live-portfolio-20260731
    paths:
      - ".github/workflows/commitments-current-main-gates.yml"
      - "src/app/commitments/**"
      - "src/components/commitments/**"
      - "src/lib/commitments-portfolio.ts"
      - "src/commitments-portfolio-wiring.test.ts"
      - "tests/commitments-live-portfolio.spec.ts"

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: commitments-current-main-exact-gates
  cancel-in-progress: true

jobs:
  release-gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      EXPECTED_HEAD: ${{ github.sha }}
      HEAD_BRANCH: feature/commitments-live-portfolio-20260731
      INTEGRATED_BASE: 2a18d9bf45ac1463a3eceb0b641e612abc90ab06
      GH_TOKEN: ${{ github.token }}
      NEXT_PUBLIC_SUPABASE_URL: https://hvmxfjjbdcgjjudmthdz.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_Sai3NlSapbvkmXa3EQrx9A_W9oNEYE8
      NEXT_PUBLIC_SITE_URL: https://www.moraltrade.org
    steps:
      - name: Check out exact current-main candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Guard exact repository, branch, head, and base
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "ghuser29384/Website2"
          test "$GITHUB_REF_NAME" = "$HEAD_BRANCH"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git merge-base --is-ancestor "$INTEGRATED_BASE" HEAD
          test "$(git rev-parse HEAD^)" = "$INTEGRATED_BASE"
          gh pr comment 395 --body "Exact current-main Commitments gates started for \`$EXPECTED_HEAD\` on base \`$INTEGRATED_BASE\`. PR remains draft; production is unchanged."

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies with retry
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            if npm ci; then exit 0; fi
            if (( attempt == 4 )); then exit 1; fi
            sleep $((attempt * 20))
          done

      - name: Run focused Commitments and Discover contracts
        shell: bash
        run: |
          set -o pipefail
          node --import tsx --test \
            src/commitments-portfolio-wiring.test.ts \
            src/lib/discover-search.test.ts \
            2>&1 | tee commitments-focused-tests.log

      - name: Run changed-source ESLint
        shell: bash
        run: |
          set -o pipefail
          npx eslint \
            src/app/commitments/page.tsx \
            src/components/commitments/commitments-local-greeting.tsx \
            src/components/commitments/impact-share-button.tsx \
            src/lib/commitments-portfolio.ts \
            src/commitments-portfolio-wiring.test.ts \
            tests/commitments-live-portfolio.spec.ts \
            src/lib/discover-search.test.ts \
            2>&1 | tee commitments-focused-lint.log

      - name: Run complete repository tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee repository-tests.log

      - name: Run complete repository lint
        shell: bash
        run: |
          set -o pipefail
          npm run lint -- --quiet 2>&1 | tee repository-lint.log

      - name: Run TypeScript absolute gate
        shell: bash
        run: |
          set -o pipefail
          npx tsc --noEmit 2>&1 | tee repository-typecheck.log

      - name: Build production application
        shell: bash
        env:
          VERCEL: "1"
          VERCEL_ENV: preview
        run: |
          set -o pipefail
          npm run build 2>&1 | tee production-build.log

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start exact production build
        shell: bash
        run: |
          set -euo pipefail
          npm run start -- -H 127.0.0.1 -p 3210 > commitments-server.log 2>&1 &
          echo "$!" > commitments-server.pid
          for attempt in $(seq 1 75); do
            if curl --fail --silent --show-error http://127.0.0.1:3210/commitments > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          tail -n 250 commitments-server.log
          exit 1

      - name: Run rendered desktop, mobile, and narrow-mobile QA
        shell: bash
        run: |
          set -o pipefail
          npx playwright test tests/commitments-live-portfolio.spec.ts --reporter=line 2>&1 | tee commitments-browser.log

      - name: Verify exact current-main diff and fixture exclusion
        shell: bash
        run: |
          set -euo pipefail
          cat > expected-paths.txt <<'EOF'
          .github/workflows/commitments-current-main-gates.yml
          src/app/commitments/commitments.module.css
          src/app/commitments/page.tsx
          src/commitments-portfolio-wiring.test.ts
          src/components/commitments/commitments-local-greeting.tsx
          src/components/commitments/impact-share-button.tsx
          src/lib/commitments-portfolio.ts
          tests/commitments-live-portfolio.spec.ts
          EOF
          sed -i 's/^          //' expected-paths.txt
          sort -u expected-paths.txt -o expected-paths.txt
          git diff --check "$INTEGRATED_BASE"...HEAD 2>&1 | tee commitments-diff.log
          git diff --name-only "$INTEGRATED_BASE"...HEAD | sort -u > actual-paths.txt
          diff -u expected-paths.txt actual-paths.txt
          ! grep -R --line-number -E '\$18,760|Counteroffer received|Salary-gap pool at 81%|Factory-farming redirect' \
            src/app/commitments src/components/commitments src/lib/commitments-portfolio.ts

      - name: Upload exact gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: commitments-current-main-gates-${{ github.run_id }}-${{ github.sha }}
          path: |
            commitments-*.log
            repository-tests.log
            repository-lint.log
            repository-typecheck.log
            production-build.log
            expected-paths.txt
            actual-paths.txt
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 30

      - name: Remove temporary gate workflow after success
        shell: bash
        run: |
          set -euo pipefail
          tested_head="$EXPECTED_HEAD"
          rm -f .github/workflows/commitments-current-main-gates.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u -- .github/workflows/commitments-current-main-gates.yml
          git diff --cached --check
          git commit -m "Remove temporary Commitments current-main gate workflow"
          git push origin HEAD:"$HEAD_BRANCH"
          clean_head="$(git rev-parse HEAD)"
          gh pr comment 395 --body "Commitments exact current-main gates passed on \`$tested_head\` against base \`$INTEGRATED_BASE\`: focused Commitments and Discover contracts, complete tests, complete lint, TypeScript, production build, exact path/diff checks, and rendered Playwright at 1440×900, 390×844, and 320×568. The temporary workflow was removed in cleanup head \`$clean_head\`; permanent product and test files are unchanged. PR remains draft pending final latest-main and deployment checks. Production is unchanged."

      - name: Report exact-gate failure
        if: failure()
        shell: bash
        run: |
          gh pr comment 395 --body "Commitments exact current-main gates failed for \`$EXPECTED_HEAD\` on base \`$INTEGRATED_BASE\`. Production is unchanged. Inspect run \`${{ github.run_id }}\` and its evidence before retrying."
