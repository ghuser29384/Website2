name: Read PR 158 core-version regression failure

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/read-pr158-core-version-regression-log.yml"
      - ".github/scripts/read-pr158-core-version-regression-log.py"

permissions:
  actions: read
  contents: read

jobs:
  extract:
    if: >-
      github.event.pull_request.head.repo.full_name == 'ghuser29384/Website2' &&
      github.head_ref == 'ops/fix-pr158-core-version-linking-20260726'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out diagnostic
        uses: actions/checkout@v4
      - name: Capture sanitized regression failure
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/read-pr158-core-version-regression-log.py > core-version-regression-failure.txt
      - name: Upload sanitized regression failure
        uses: actions/upload-artifact@v4
        with:
          name: pr158-core-version-regression-failure-${{ github.run_id }}
          path: core-version-regression-failure.txt
          if-no-files-found: error
          retention-days: 1
