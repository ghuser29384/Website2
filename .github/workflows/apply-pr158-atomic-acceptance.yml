name: Apply PR 158 atomic acceptance repair

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/apply-pr158-atomic-acceptance.yml"
      - ".github/scripts/apply-pr158-atomic-acceptance.py"

permissions:
  contents: write

jobs:
  patch:
    if: >-
      github.event.pull_request.head.repo.full_name == 'ghuser29384/Website2' &&
      github.head_ref == 'ops/apply-pr158-atomic-acceptance-20260726'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out temporary patch branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Capture patch script outside the worktree
        run: cp .github/scripts/apply-pr158-atomic-acceptance.py "$RUNNER_TEMP/apply-pr158-atomic-acceptance.py"

      - name: Check out and guard exact PR 158 head
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin agent/dynamic-marketplace-clearing-rounds
          git checkout -B agent/dynamic-marketplace-clearing-rounds origin/agent/dynamic-marketplace-clearing-rounds
          actual="$(git rev-parse HEAD)"
          expected="01993080cbc734e9da4932fc1be2d5319392fe18"
          if [[ "$actual" != "$expected" ]]; then
            echo "Refusing moved PR #158 head. Expected $expected, found $actual." >&2
            exit 1
          fi

      - name: Apply migration, atomic RPC, actions, and tests
        run: python3 "$RUNNER_TEMP/apply-pr158-atomic-acceptance.py"

      - name: Refresh marketplace public-route smoke contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/lib/public-route-smoke.test.ts")
          source = path.read_text(encoding="utf-8")
          block_start = source.index(
              'test("marketplace pilot copy separates live offers from worked examples", () => {'
          )
          block_end = source.index(
              'test("worked examples have canonical detail pages and sitemap coverage", () => {',
              block_start,
          )
          replacement = '''test("marketplace participant menus separate live liquidity from examples", () => {
            const offersPage = readRepoFile("src/app/offers/page.tsx");
            const intro = readRepoFile("src/app/offers/offers-market-intro.tsx");
            const directory = readRepoFile("src/app/offers/offers-market-directory.tsx");
            const secondary = readRepoFile("src/app/offers/offers-market-secondary.tsx");
            const participantMenu = readRepoFile(
              "src/components/marketplace/participant-offer-menu.tsx",
            );
            const workedExamplesPage = readRepoFile("src/app/worked-examples/page.tsx");

            assert.match(offersPage, /OffersMarketIntro/);
            assert.match(offersPage, /OffersMarketDirectory/);
            assert.match(offersPage, /OffersMarketSecondarySections/);
            assert.match(offersPage, /buildParticipantOfferFamilies/);
            assert.match(offersPage, /getMarketplaceFamilyMetrics/);
            assert.match(intro, /Live marketplace/);
            assert.match(intro, /Construct a concrete trade from live participant menus/);
            assert.match(intro, /A match is never guaranteed/);
            assert.match(intro, /distinct participants/);
            assert.match(intro, /distinct offer families/);
            assert.match(intro, /available combinations/);
            assert.match(directory, /Participant menus/);
            assert.match(directory, /SmartQueryForm/);
            assert.match(directory, /Hard constraints are applied before semantic relevance/);
            assert.match(directory, /Pagination applies to participants rather than generated pairings/);
            assert.match(directory, /No participant menus satisfy every hard constraint/);
            assert.match(participantMenu, /Propose match/);
            assert.match(participantMenu, /Counteroffer/);
            assert.match(participantMenu, /Remove saved/);
            assert.match(participantMenu, /Ask a question/);
            assert.match(secondary, /No published completions/);
            assert.match(secondary, /Worked example · not live · not completed/);
            assert.match(secondary, /No example is counted as/);
            assert.match(workedExamplesPage, /They are\s+not live marketplace demand/);
            assert.equal(directory.includes("WORKED_EXAMPLE"), false);
            assert.equal(directory.includes("Victoria"), false);
            assert.equal(intro.includes("guaranteed match"), false);
          });

          '''
          source = source[:block_start] + replacement + source[block_end:]

          old_fixture = '''test("worked examples have canonical detail pages and sitemap coverage", () => {
            const offersPage = readRepoFile("src/app/offers/page.tsx");
          '''
          new_fixture = '''test("worked examples have canonical detail pages and sitemap coverage", () => {
            const workedExamplesPage = readRepoFile("src/app/worked-examples/page.tsx");
          '''
          old_assertion = '  assert.match(offersPage, /\\/offers\\/examples\\/\\$\\{offer\\.id\\}/);\n'
          new_assertion = '  assert.match(workedExamplesPage, /\\/offers\\/examples\\/\\$\\{offer\\.id\\}/);\n'
          if source.count(old_fixture) != 1 or source.count(old_assertion) != 1:
              raise SystemExit("Worked-example canonical-link assertion did not match exactly once.")
          source = source.replace(old_fixture, new_fixture, 1).replace(old_assertion, new_assertion, 1)

          old_create_assertions = '''  assert.match(createRoute, /Create trade/);
            assert.match(createRoute, /NewOfferPage/);
          '''
          new_create_assertions = '''  assert.match(createRoute, /CreateRouteChooser/);
            assert.match(createRoute, /readCreateMode/);
            assert.match(createRoute, /BackCreateRoute/);
          '''
          if source.count(old_create_assertions) != 1:
              raise SystemExit("Stale create-route assertions did not match exactly once.")
          source = source.replace(old_create_assertions, new_create_assertions, 1)

          path.write_text(source, encoding="utf-8")
          PY

      - name: Install dependencies
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Run exact release checks
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm test
          npm run lint
          npm run build
          git diff --check

      - name: Commit and push only the tested repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ghuser29384"
          git config user.email "262476329+ghuser29384@users.noreply.github.com"
          git add \
            .github/workflows/dynamic-marketplace-qa.yml \
            src/app/actions.ts \
            src/app/offers/marketplace-interest-acceptance.test.ts \
            src/lib/public-route-smoke.test.ts \
            supabase/migrations/20260726143000_restore_agreement_completion_contract_and_atomic_acceptance.sql \
            supabase/tests/marketplace_interest_acceptance_atomicity.sql
          git commit -m "Make marketplace agreement acceptance atomic"
          git push origin HEAD:agent/dynamic-marketplace-clearing-rounds
          echo "FINAL_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Report tested commit
        run: echo "Pushed tested PR #158 repair at $FINAL_SHA"
