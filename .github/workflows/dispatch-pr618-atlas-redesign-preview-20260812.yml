name: Dispatch PR 618 Atlas redesign protected Preview

on:
  push:
    branches:
      - feature/bottleneck-atlas-feed-20260811
    paths:
      - .github/workflows/dispatch-pr618-atlas-redesign-preview-20260812.yml

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: dispatch-pr618-atlas-redesign-preview-20260812
  cancel-in-progress: false

env:
  EXPECTED_CANDIDATE_SHA: 9fca4034b2c70a40a69c84c36d3042b399a46d65
  PRODUCT_REF: feature/bottleneck-atlas-feed-20260811
  RELEASE_REF: release/vercel-preview

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_CANDIDATE_SHA }}
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Guard exact candidate and release target
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'ghuser29384/Website2'
          test "$(git rev-parse HEAD)" = "$EXPECTED_CANDIDATE_SHA"
          test "$(git ls-remote origin "refs/heads/$PRODUCT_REF" | awk '{print $1}')" = "$EXPECTED_CANDIDATE_SHA"
          release_sha="$(git ls-remote origin "refs/heads/$RELEASE_REF" | awk '{print $1}')"
          test -n "$release_sha"
          test "$(git merge-base "$release_sha" "$EXPECTED_CANDIDATE_SHA")" = "$release_sha"

      - name: Fast-forward the protected Preview ref
        shell: bash
        run: |
          set -euo pipefail
          git push origin "HEAD:$RELEASE_REF"
          test "$(git ls-remote origin "refs/heads/$RELEASE_REF" | awk '{print $1}')" = "$EXPECTED_CANDIDATE_SHA"

      - name: Dispatch permanent gated Preview workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run vercel-release.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f target=preview \
            -f ref="$RELEASE_REF" \
            -f expected_sha="$EXPECTED_CANDIDATE_SHA"

      - name: Record dispatch on PR 618
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh pr comment 618 --repo "$GITHUB_REPOSITORY" --body "## Bottleneck Atlas redesign Preview dispatched\n\n- Candidate: \`$EXPECTED_CANDIDATE_SHA\`\n- Release ref: \`$RELEASE_REF\`\n- Target: protected Preview only\n- Visual QA: passed on the identical application tree in run 31616030300\n- Production changed: no\n\nThe redesign uses progressive disclosure: one sample trade pattern is expanded, field groups contain collapsed field details, and the five-step method is moved behind a disclosure control."

# One-use dispatcher. Delete before merge.
