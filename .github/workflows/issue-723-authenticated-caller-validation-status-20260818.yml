name: Issue 723 authenticated caller validation status 20260818

on:
  push:
    branches:
      - qa/745-authenticated-caller-validation-status-20260818
    paths:
      - .github/workflows/issue-723-authenticated-caller-validation-status-20260818.yml
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: issue-723-authenticated-caller-status-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      EXPECTED_PRODUCT_HEAD: 495f714b6dd4753ad78cf3d41945cffc84923876
      WORKFLOW_PATH: .github/workflows/issue-723-authenticated-caller-validation-status-20260818.yml
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out exact validation revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Verify exact product parent and workflow-only delta
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PRODUCT_HEAD"
          test "$(git diff --name-only "$EXPECTED_PRODUCT_HEAD" HEAD)" = "$WORKFLOW_PATH"
          git diff --check "$EXPECTED_PRODUCT_HEAD" HEAD
          grep -F 'Submit and accept separate performance evidence before final completion.' src/app/trade-donation-actions-base.ts
          ! grep -F 'performance evidence befor final completion' src/app/trade-donation-actions-base.ts

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Run focused authenticated-caller contracts
        run: node --import tsx --test src/lib/moral-trade/trade-donation-confirmation-authenticated-caller.test.ts

      - name: Run complete repository tests
        run: npm test

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint -- --quiet

      - name: Build with payment features disabled
        env:
          CONDITIONAL_PAYMENTS_MODE: disabled
          TRADE_DONATION_POOL_ENABLED: "false"
          TRADE_DONATION_POOL_MODE: disabled
          EVERY_ORG_PLEDGE_DONATIONS_ENABLED: "false"
          NEXT_PUBLIC_SITE_URL: https://www.moraltrade.org
          VERCEL: "1"
          VERCEL_ENV: preview
        run: npm run build

      - name: Publish exact-run status locator
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          state=failure
          description="Corrected issue 723 product validation failed"
          if [[ "$JOB_STATUS" == "success" ]]; then
            state=success
            description="Corrected issue 723 product validation passed"
          elif [[ "$JOB_STATUS" == "cancelled" ]]; then
            state=error
            description="Corrected issue 723 product validation was cancelled"
          fi
          export STATUS_STATE="$state"
          export STATUS_DESCRIPTION="$description"
          export STATUS_TARGET_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          node --input-type=module <<'NODE' > /tmp/status.json
          const payload = {
            state: process.env.STATUS_STATE,
            target_url: process.env.STATUS_TARGET_URL,
            description: process.env.STATUS_DESCRIPTION,
            context: "qa/issue-723-product-validation",
          };
          process.stdout.write(JSON.stringify(payload));
          NODE
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data-binary @/tmp/status.json \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"
