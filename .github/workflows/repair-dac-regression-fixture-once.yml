name: Repair DAC regression fixture once

on:
  push:
    branches:
      - fix/mpgf-dac-pledge-intent-ledger-20260806
    paths:
      - .github/workflows/repair-dac-regression-fixture-once.yml

permissions:
  contents: write

concurrency:
  group: repair-dac-regression-fixture-once
  cancel-in-progress: false

env:
  TARGET_BRANCH: fix/mpgf-dac-pledge-intent-ledger-20260806
  EXPECTED_PARENT: 07cd8c1a395e321b5b3ff2609d237cd9e21245c8
  CONTROLLER_PATH: .github/workflows/repair-dac-regression-fixture-once.yml
  REGRESSION_PATH: supabase/tests/mpgf_dac_pledge_intent_ledger.sql

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact target
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 2

      - name: Guard and repair the exact pending-quote rationale
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git diff-tree --no-commit-id --name-only -r HEAD)" = "$CONTROLLER_PATH"

          python3 - <<'PY'
          from pathlib import Path

          path = Path("supabase/tests/mpgf_dac_pledge_intent_ledger.sql")
          text = path.read_text()
          old = '"rationale":"Synthetic pending QA quote"'
          new = '"rationale":"Provisional threshold 1 experience-rated quote; operator approval remains required."'
          if text.count(old) != 1:
              raise SystemExit(f"Expected exactly one stale rationale, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1))
          PY

          git diff --check
          git diff -- "$REGRESSION_PATH"
          grep -Fq '"rationale":"Provisional threshold 1 experience-rated quote; operator approval remains required."' "$REGRESSION_PATH"
          ! grep -Fq '"rationale":"Synthetic pending QA quote"' "$REGRESSION_PATH"

      - name: Commit only the regression repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$REGRESSION_PATH"
          test "$(git diff --cached --name-only)" = "$REGRESSION_PATH"
          git diff --cached --check
          git commit -m "Match DAC QA fixture to approved premium quote contract"
          git push origin "HEAD:$TARGET_BRANCH"
