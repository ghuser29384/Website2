name: Focused masthead rendering diagnostic
on:
  push:
    branches: [ops/header-source-qa-20260925]
    paths: [.github/workflows/header-source-qa-20260925.yml]
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3210
      SITE_URL: http://127.0.0.1:3210
      VERCEL: '1'
      VERCEL_ENV: preview
      PLAYWRIGHT_HTML_OPEN: never
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bcfa87725d08ea229a9bc27bf03a659594169ac2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Run only affected masthead rendering and interaction checks
        run: |
          set -euo pipefail
          mkdir -p header-diagnostic
          git rev-parse HEAD > header-diagnostic/commit.txt
          npx playwright test --config=playwright.release.config.ts tests/refined-header.spec.ts tests/homepage-narrow-header.spec.ts --reporter=line 2>&1 | tee header-diagnostic/browser.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: masthead-focused-bcfa8772
          path: |
            header-diagnostic
            test-results
          retention-days: 3
