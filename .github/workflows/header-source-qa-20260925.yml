name: Header source snapshot and QA

on:
  push:
    branches: [ops/header-source-qa-20260925]
    paths: [.github/workflows/header-source-qa-20260925.yml]

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 079d5bbc6224bc6e9770d33622f6cab7e4baac01
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install exact locked dependencies without application credentials
        run: npm ci
      - name: Archive dependencies for isolated local verification
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = ghuser29384/Website2
          test "$(git rev-parse HEAD)" = 079d5bbc6224bc6e9770d33622f6cab7e4baac01
          mkdir -p /tmp/header-dependencies
          tar -czf /tmp/header-dependencies/dependencies.tar.gz node_modules
          sha256sum package-lock.json > /tmp/header-dependencies/package-lock.sha256
          sha256sum /tmp/header-dependencies/dependencies.tar.gz > /tmp/header-dependencies/dependencies.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: header-locked-dependencies-079d5bbc
          path: /tmp/header-dependencies
          retention-days: 1
          compression-level: 0
