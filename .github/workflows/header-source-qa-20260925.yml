name: Final masthead production-mode verification
on:
  push:
    branches: [ops/header-source-qa-20260925]
    paths: [.github/workflows/header-source-qa-20260925.yml]
permissions:
  contents: read
jobs:
  stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.stage.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: transport
          persist-credentials: false
      - name: Validate the exact reviewed patches
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = ghuser29384/Website2
          base64 --decode transport/.github/header-final-polish.patch.gz.b64 | gzip -d > /tmp/header-polish.patch
          base64 --decode transport/.github/header-nav-regressions.patch.gz.b64 | gzip -d > /tmp/header-regressions.patch
          echo 'c36e922cd22aecc2eb75418a66d20577044b0dc79cc8cbc79d25b1d9b29e5729  /tmp/header-polish.patch' | sha256sum -c -
          echo '84c5c28611ec0d4315b2ce2cba971ff0beccd598affc79a2ca234e4700161ef4  /tmp/header-regressions.patch' | sha256sum -c -
      - uses: actions/checkout@v4
        with:
          ref: fix/refined-masthead-20260925
          path: candidate
          fetch-depth: 0
      - name: Publish only five scoped candidate files
        id: stage
        working-directory: candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = bcfa87725d08ea229a9bc27bf03a659594169ac2
          test "$(git ls-remote origin refs/heads/fix/refined-masthead-20260925 | cut -f1)" = bcfa87725d08ea229a9bc27bf03a659594169ac2
          git apply --check /tmp/header-polish.patch /tmp/header-regressions.patch
          git apply /tmp/header-polish.patch /tmp/header-regressions.patch
          git diff --check
          git add public/moral-trade-refined-header.css src/components/layout/site-topbar.tsx tests/refined-header.spec.ts tests/contact-page-layout.spec.ts tests/walkthrough.spec.ts
          test "$(git diff --cached --name-only | wc -l)" -eq 5
          git diff --cached --check
          git diff --cached --stat
          git config user.name ghuser29384
          git config user.email 262476329+ghuser29384@users.noreply.github.com
          git commit -m 'Polish native header styling and stabilize keyboard disclosure'
          git push origin HEAD:refs/heads/fix/refined-masthead-20260925
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git config --local --unset-all http.https://github.com/.extraheader || true
  quality:
    needs: stage
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3210
      SITE_URL: http://127.0.0.1:3210
      VERCEL: '1'
      VERCEL_ENV: production
      PLAYWRIGHT_HTML_OPEN: never
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.stage.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Record exact candidate
        run: |
          set -euo pipefail
          mkdir -p header-evidence
          git rev-parse HEAD | tee header-evidence/commit.txt
          git diff deff62e0877e014bee49edab96c996aae448cbc8 --stat > header-evidence/diff-stat.txt
          git archive --format=tar.gz HEAD > header-evidence/source.tar.gz
          git diff --check deff62e0877e014bee49edab96c996aae448cbc8
      - run: npm ci
      - name: All repository quality gates
        id: gates
        run: |
          set -euo pipefail
          npm test 2>&1 | tee header-evidence/unit.log
          npm run lint -- --quiet 2>&1 | tee header-evidence/lint.log
          npx tsc --noEmit 2>&1 | tee header-evidence/types.log
          npm run build 2>&1 | tee header-evidence/build.log
      - run: npx playwright install --with-deps chromium
      - name: Focused affected behavior in real production build
        run: |
          set -euo pipefail
          npx playwright test --config=playwright.release.config.ts tests/refined-header.spec.ts tests/homepage-narrow-header.spec.ts tests/contact-page-layout.spec.ts tests/walkthrough.spec.ts tests/sitewide-canonical-visual-system.spec.ts --reporter=line 2>&1 | tee header-evidence/focused-browser.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: masthead-focused-final-${{ needs.stage.outputs.sha }}
          path: |
            header-evidence
            test-results
          retention-days: 7
      - name: Complete unchanged release browser suite
        if: ${{ !cancelled() && steps.gates.outcome == 'success' }}
        run: |
          set -euo pipefail
          npm run test:e2e:release -- --reporter=line 2>&1 | tee header-evidence/release-browser.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: masthead-complete-final-${{ needs.stage.outputs.sha }}
          path: |
            header-evidence
            test-results
          retention-days: 7
