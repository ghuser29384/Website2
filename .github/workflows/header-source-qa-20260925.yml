name: Refined masthead candidate verification
on:
  push:
    branches: [ops/header-source-qa-20260925]
    paths: [.github/workflows/header-source-qa-20260925.yml]
permissions:
  contents: read
concurrency:
  group: refined-masthead-candidate-20260925
  cancel-in-progress: false
jobs:
  stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.stage.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: transport
          persist-credentials: false
      - name: Verify exact rendered-audit correction
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = ghuser29384/Website2
          cat transport/.github/header-correction/{0,1} | base64 --decode | gzip -d > /tmp/header-correction.patch
          echo '6b4ac195f4baae31f4637b202f0acd05d4fcd3fdefb4a8c51e486810101f8800  /tmp/header-correction.patch' | sha256sum -c -
      - uses: actions/checkout@v4
        with:
          ref: fix/refined-masthead-20260925
          path: candidate
          fetch-depth: 0
      - name: Apply only reviewed presentation and navigation regressions
        id: stage
        working-directory: candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = a1c1b0e16a882c9b2204d3c1c32cb5f55401d6fc
          test "$(git ls-remote origin refs/heads/fix/refined-masthead-20260925 | cut -f1)" = a1c1b0e16a882c9b2204d3c1c32cb5f55401d6fc
          git apply --check /tmp/header-correction.patch
          git apply /tmp/header-correction.patch
          git diff --check
          git add public/moral-trade-refined-header.css tests/create-entry-routing.spec.ts tests/exact-live-now-recommendations.spec.ts tests/homepage-narrow-header.spec.ts tests/public-routes.spec.ts tests/refined-header.spec.ts tests/sitewide-canonical-visual-system.spec.ts
          test "$(git diff --cached --name-only | wc -l)" -eq 7
          git diff --cached --check
          git diff --cached --stat
          git config user.name ghuser29384
          git config user.email 262476329+ghuser29384@users.noreply.github.com
          git commit -m 'Resolve rendered native header overrides and preserve semantic navigation tests'
          git push origin HEAD:refs/heads/fix/refined-masthead-20260925
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git config --local --unset-all http.https://github.com/.extraheader || true
  quality:
    needs: stage
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3210
      SITE_URL: http://127.0.0.1:3210
      VERCEL: '1'
      VERCEL_ENV: preview
      PLAYWRIGHT_HTML_OPEN: never
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.stage.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Record exact integrated candidate
        run: |
          set -euo pipefail
          mkdir -p header-evidence
          git rev-parse HEAD | tee header-evidence/commit.txt
          git diff deff62e0877e014bee49edab96c996aae448cbc8 --stat > header-evidence/diff-stat.txt
          git archive --format=tar.gz HEAD > header-evidence/source.tar.gz
          git diff --check deff62e0877e014bee49edab96c996aae448cbc8
      - run: npm ci
      - name: Repository tests, lint, TypeScript, production build
        id: gates
        run: |
          set -euo pipefail
          npm test 2>&1 | tee header-evidence/unit.log
          npm run lint -- --quiet 2>&1 | tee header-evidence/lint.log
          npx tsc --noEmit 2>&1 | tee header-evidence/types.log
          npm run build 2>&1 | tee header-evidence/build.log
      - run: npx playwright install --with-deps chromium
      - name: Actual application header and navigation render checks
        run: |
          set -euo pipefail
          npx playwright test --config=playwright.release.config.ts tests/refined-header.spec.ts tests/homepage-narrow-header.spec.ts tests/discover-home-visual-alignment.spec.ts tests/public-routes.spec.ts tests/returning-homepage.spec.ts tests/sitewide-canonical-visual-system.spec.ts tests/create-entry-routing.spec.ts tests/exact-live-now-recommendations.spec.ts --reporter=line 2>&1 | tee header-evidence/header-browser.log
      - name: Preserve focused screenshots before the broader suite
        if: always()
        run: cp -a test-results header-evidence/focused-test-results 2>/dev/null || true
      - name: Complete release browser regression suite
        if: ${{ !cancelled() && steps.gates.outcome == 'success' }}
        run: |
          set -euo pipefail
          npm run test:e2e:release -- --reporter=line 2>&1 | tee header-evidence/release-browser.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: refined-masthead-candidate-${{ needs.stage.outputs.sha }}
          path: |
            header-evidence
            test-results
          retention-days: 7
