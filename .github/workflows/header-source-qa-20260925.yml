name: Refined masthead candidate verification
on:
  push:
    branches: [ops/header-source-qa-20260925]
    paths: [.github/workflows/header-source-qa-20260925.yml]
permissions:
  contents: read
concurrency:
  group: refined-masthead-candidate-bcfa8772
  cancel-in-progress: false
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3210
      SITE_URL: http://127.0.0.1:3210
      VERCEL: '1'
      VERCEL_ENV: preview
      PLAYWRIGHT_HTML_OPEN: never
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bcfa87725d08ea229a9bc27bf03a659594169ac2
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Record exact integrated candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = bcfa87725d08ea229a9bc27bf03a659594169ac2
          mkdir -p header-evidence
          git rev-parse HEAD | tee header-evidence/commit.txt
          git diff deff62e0877e014bee49edab96c996aae448cbc8 --stat > header-evidence/diff-stat.txt
          git archive --format=tar.gz HEAD > header-evidence/source.tar.gz
          git diff --check deff62e0877e014bee49edab96c996aae448cbc8
      - run: npm ci
      - name: Repository tests, lint, TypeScript, production build
        id: gates
        run: |
          set -euo pipefail
          npm test 2>&1 | tee header-evidence/unit.log
          npm run lint -- --quiet 2>&1 | tee header-evidence/lint.log
          npx tsc --noEmit 2>&1 | tee header-evidence/types.log
          npm run build 2>&1 | tee header-evidence/build.log
      - run: npx playwright install --with-deps chromium
      - name: Actual application header and navigation render checks
        run: |
          set -euo pipefail
          npx playwright test --config=playwright.release.config.ts tests/refined-header.spec.ts tests/homepage-narrow-header.spec.ts tests/discover-home-visual-alignment.spec.ts tests/public-routes.spec.ts tests/returning-homepage.spec.ts tests/sitewide-canonical-visual-system.spec.ts tests/create-entry-routing.spec.ts tests/exact-live-now-recommendations.spec.ts tests/operational-retirement.spec.ts --reporter=line 2>&1 | tee header-evidence/header-browser.log
      - name: Preserve focused screenshots before the broader suite
        if: always()
        run: cp -a test-results header-evidence/focused-test-results 2>/dev/null || true
      - name: Complete release browser regression suite
        if: ${{ !cancelled() && steps.gates.outcome == 'success' }}
        run: |
          set -euo pipefail
          npm run test:e2e:release -- --reporter=line 2>&1 | tee header-evidence/release-browser.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: refined-masthead-candidate-bcfa87725d08ea229a9bc27bf03a659594169ac2
          path: |
            header-evidence
            test-results
          retention-days: 7
