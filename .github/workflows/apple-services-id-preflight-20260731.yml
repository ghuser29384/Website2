name: Temporary Apple Services ID preflight 20260731

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out diagnostic branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Probe registered Apple return URLs without entering credentials
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/apple-services-id .tmp
          cat > .tmp/apple-services-id-preflight.mjs <<'EOF'
          import { chromium } from "@playwright/test";
          import { writeFile } from "node:fs/promises";

          const clientId = "org.moraltrade.web";
          const candidates = [
            {
              name: "supabase-callback",
              redirectUri: "https://jnpoxvalyjtdghnperyu.supabase.co/auth/v1/callback",
            },
            {
              name: "production-confirm",
              redirectUri: "https://www.moraltrade.org/auth/confirm",
            },
            {
              name: "production-apple-callback",
              redirectUri: "https://www.moraltrade.org/auth/apple/callback",
            },
          ];
          const invalidPattern =
            /invalid[_ -]?(request|client)|invalid web redirect|sign up not completed|unauthorized[_ -]?client/i;
          const browser = await chromium.launch();
          const results = [];

          try {
            for (const candidate of candidates) {
              const context = await browser.newContext({
                viewport: { width: 1280, height: 900 },
              });
              const page = await context.newPage();
              const url = new URL("https://appleid.apple.com/auth/authorize");
              url.searchParams.set("client_id", clientId);
              url.searchParams.set("redirect_uri", candidate.redirectUri);
              url.searchParams.set("response_type", "code id_token");
              url.searchParams.set("response_mode", "form_post");
              url.searchParams.set("scope", "name email");
              url.searchParams.set("state", `preflight-${candidate.name}`);
              url.searchParams.set("nonce", `preflight-${candidate.name}`);

              let navigationError = null;
              let responseStatus = null;
              try {
                const response = await page.goto(url.toString(), {
                  waitUntil: "domcontentloaded",
                  timeout: 30_000,
                });
                responseStatus = response?.status() ?? null;
                await page.waitForTimeout(8_000);
              } catch (error) {
                navigationError = error instanceof Error ? error.message : String(error);
              }

              const title = await page.title().catch(() => "");
              const bodyText = await page
                .locator("body")
                .innerText({ timeout: 5_000 })
                .catch(() => "");
              const frames = page.frames().map((frame) => {
                try {
                  const frameUrl = new URL(frame.url());
                  return `${frameUrl.hostname}${frameUrl.pathname}`;
                } catch {
                  return "unparseable-frame";
                }
              });
              const finalUrl = (() => {
                try {
                  const parsed = new URL(page.url());
                  return `${parsed.hostname}${parsed.pathname}`;
                } catch {
                  return "unparseable-url";
                }
              })();
              const hasPasswordInput = (await page.locator('input[type="password"]').count()) > 0;
              const hasEmailInput =
                (await page.locator('input[type="email"], input[name*="accountName" i]').count()) > 0;
              const invalid = invalidPattern.test(`${title}\n${bodyText}\n${navigationError ?? ""}`);

              await page.screenshot({
                path: `artifacts/apple-services-id/${candidate.name}.png`,
                fullPage: false,
              });

              results.push({
                name: candidate.name,
                redirectHostAndPath: new URL(candidate.redirectUri).host + new URL(candidate.redirectUri).pathname,
                responseStatus,
                finalUrl,
                title,
                invalid,
                hasEmailInput,
                hasPasswordInput,
                frames,
                navigationError,
                bodyExcerpt: bodyText.replace(/\s+/g, " ").slice(0, 500),
              });
              await context.close();
            }
          } finally {
            await browser.close();
          }

          await writeFile(
            "artifacts/apple-services-id/report.json",
            `${JSON.stringify(results, null, 2)}\n`,
            "utf8",
          );
          console.log(JSON.stringify(results, null, 2));
          EOF
          node .tmp/apple-services-id-preflight.mjs
          rm -rf .tmp

      - name: Upload sanitized Apple preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apple-services-id-preflight
          path: artifacts/apple-services-id
          if-no-files-found: error
          retention-days: 1
