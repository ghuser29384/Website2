name: Payment methods source inspection
on:
  push:
    branches: [ops/payment-methods-source-20260926]
    paths: [.github/workflows/payment-methods-source-20260926.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2678dc3ea33b17c0375a1bd5bccbb1c4990b4b16
          persist-credentials: false
      - name: Export immutable source only
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = ghuser29384/Website2
          test "$(git rev-parse HEAD)" = 2678dc3ea33b17c0375a1bd5bccbb1c4990b4b16
          mkdir -p /tmp/payment-methods-source
          git archive --format=zip HEAD -o /tmp/payment-methods-source/source.zip
          git rev-parse HEAD HEAD^{tree} > /tmp/payment-methods-source/source-identity.txt
          sha256sum /tmp/payment-methods-source/source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: payment-methods-source-${{ github.run_id }}
          path: /tmp/payment-methods-source
          retention-days: 3
