name: Verify public evidence production

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - .github/workflows/verify-public-evidence-production.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Confirm public routes resolve on the canonical domain
        shell: bash
        run: |
          curl --fail --location --silent --show-error --retry 12 --retry-delay 10 \
            https://www.moraltrade.org/evidence > /tmp/evidence-directory.html
          curl --fail --location --silent --show-error --retry 12 --retry-delay 10 \
            https://www.moraltrade.org/evidence/example > /tmp/evidence-example.html
          grep -F "Inspect the proof behind every trade." /tmp/evidence-directory.html
          grep -F "Illustrative interface record" /tmp/evidence-example.html
          grep -F "Proof timeline" /tmp/evidence-example.html

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify production interactions and responsive behavior
        env:
          MORALTRADE_BASE_URL: https://www.moraltrade.org
        run: npx playwright test tests/public-evidence.spec.ts --reporter=line
