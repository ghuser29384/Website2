name: Complete Profile exact production release

on:
  pull_request:
    paths:
      - ".github/workflows/complete-profile-production-release-979726c0.yml"

permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: complete-profile-production-release-979726c0
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      MERGE_SHA: 979726c0a479843eca3c727512b477a340ebe9c6
      CANDIDATE_SHA: 68cf2136ce62b823024963e83503f7af96f229ee
      PRODUCT_PR: "405"
      EXACT_GATE_CONTEXT: QA / Complete Profile root-prefetch exact gates
      ADJUDICATION_CONTEXT: QA / Complete Profile E2E adjudication
      PREVIEW_CONTEXT: QA / Complete Profile CLI preview smoke
      STATUS_CONTEXT: QA / Complete Profile exact production release
      VERCEL_ORG_ID: team_ySu6sF3Uho1E1GnJtCQPVEuJ
      VERCEL_PROJECT_ID: prj_Em3j7Uj7RatX2R1ZYhla3XSHRde7
      VERCEL_CLI_VERSION: 50.38.1
      CANONICAL_ORIGIN: https://www.moraltrade.org
      APEX_ORIGIN: https://moraltrade.org
      CANARY_OUTPUT_DIR: complete-profile-production-release-evidence

    steps:
      - name: Mark the immutable production release pending
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${MERGE_SHA}" \
            -f state=pending \
            -f context="$STATUS_CONTEXT" \
            -f description="Building, deploying, and canarying the immutable Complete Profile release" \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Guard merge identity, current main, and prerequisite evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'ghuser29384/Website2'
          product_pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PRODUCT_PR}")"
          test "$(jq -r .state <<<"$product_pr")" = 'closed'
          test "$(jq -r .merged <<<"$product_pr")" = 'true'
          test "$(jq -r .head.sha <<<"$product_pr")" = "$CANDIDATE_SHA"
          test "$(jq -r .merge_commit_sha <<<"$product_pr")" = "$MERGE_SHA"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)" = "$MERGE_SHA"

          statuses="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${CANDIDATE_SHA}/status")"
          latest_state() {
            jq -r --arg context "$1" \
              '[.statuses[] | select(.context == $context)] | sort_by(.updated_at) | last | .state // empty' \
              <<<"$statuses"
          }
          test "$(latest_state "$EXACT_GATE_CONTEXT")" = 'success'
          test "$(latest_state "$ADJUDICATION_CONTEXT")" = 'success'
          test "$(latest_state "$PREVIEW_CONTEXT")" = 'success'

      - name: Check out the immutable merged main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.MERGE_SHA }}
          fetch-depth: 1

      - name: Prove the merged tree equals the validated candidate tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$MERGE_SHA"
          git fetch --depth=1 origin "$CANDIDATE_SHA"
          git diff --quiet "$CANDIDATE_SHA" "$MERGE_SHA"
          mkdir -p "$CANARY_OUTPUT_DIR"
          jq -n \
            --arg mergeSha "$MERGE_SHA" \
            --arg candidateSha "$CANDIDATE_SHA" \
            '{mergeSha:$mergeSha,candidateSha:$candidateSha,treesEquivalent:true}' \
            > "$CANARY_OUTPUT_DIR/identity.json"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if npm ci 2>&1 | tee "$CANARY_OUTPUT_DIR/npm-ci.log"; then exit 0; fi
            if [[ "$attempt" == '3' ]]; then exit 1; fi
            sleep $((attempt * 20))
          done

      - name: Reconfirm source, lint, type, and production build gates
        shell: bash
        run: |
          set -o pipefail
          node --check .github/scripts/complete-profile-production-canary.mjs \
            2>&1 | tee "$CANARY_OUTPUT_DIR/canary-syntax.log"
          npm test 2>&1 | tee "$CANARY_OUTPUT_DIR/source-tests.log"
          npm run lint 2>&1 | tee "$CANARY_OUTPUT_DIR/eslint.log"
          npx tsc --noEmit 2>&1 | tee "$CANARY_OUTPUT_DIR/typescript.log"
          npm run build 2>&1 | tee "$CANARY_OUTPUT_DIR/build.log"

      - name: Reconfirm the changed rendered surface
        env:
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3210
          SITE_URL: http://127.0.0.1:3210
          PLAYWRIGHT_HTML_OPEN: never
        shell: bash
        run: |
          set -o pipefail
          npx playwright install --with-deps chromium \
            2>&1 | tee "$CANARY_OUTPUT_DIR/playwright-install.log"
          npx playwright test tests/complete-profile-review.spec.ts --reporter=line \
            2>&1 | tee "$CANARY_OUTPUT_DIR/complete-profile-playwright.log"

      - name: Recheck main immediately before production deployment
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)" = "$MERGE_SHA"

      - name: Link only the canonical Vercel project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' \
            "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json

      - name: Build the exact production output on GitHub Actions compute
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_GIT_COMMIT_SHA: ${{ env.MERGE_SHA }}
          VERCEL_GIT_COMMIT_REF: main
          VERCEL_GIT_REPO_SLUG: Website2
          VERCEL_GIT_REPO_OWNER: ghuser29384
        shell: bash
        run: |
          set -o pipefail
          npx --yes "vercel@$VERCEL_CLI_VERSION" pull \
            --yes --environment=production --token="$VERCEL_TOKEN" \
            2>&1 | tee "$CANARY_OUTPUT_DIR/vercel-pull.log"
          npx --yes "vercel@$VERCEL_CLI_VERSION" build \
            --prod --token="$VERCEL_TOKEN" \
            2>&1 | tee "$CANARY_OUTPUT_DIR/vercel-build.log"

      - name: Upload the exact prebuilt output to production once
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_GIT_COMMIT_SHA: ${{ env.MERGE_SHA }}
          VERCEL_GIT_COMMIT_REF: main
          VERCEL_GIT_REPO_SLUG: Website2
          VERCEL_GIT_REPO_OWNER: ghuser29384
        shell: bash
        run: |
          set -euo pipefail
          deployment_output="$(npx --yes "vercel@$VERCEL_CLI_VERSION" deploy \
            --prebuilt --prod --token="$VERCEL_TOKEN" \
            2> >(tee "$CANARY_OUTPUT_DIR/vercel-deploy.stderr" >&2))"
          printf '%s\n' "$deployment_output" > "$CANARY_OUTPUT_DIR/vercel-deploy.stdout"
          deployment_url="$(printf '%s\n' "$deployment_output" | grep -E '^https://[^ ]+\.vercel\.app/?$' | tail -1)"
          test -n "$deployment_url"
          deployment_url="${deployment_url%/}"
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$deployment_url" > "$CANARY_OUTPUT_DIR/deployment-url.txt"

      - name: Verify the exact READY production deployment in Vercel
        id: deployment
        env:
          VERCEL_TOKEN_VALUE: ${{ secrets.VERCEL_TOKEN }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
        shell: bash
        run: |
          set -euo pipefail
          deployment_host="${DEPLOYMENT_URL#https://}"
          detail=''
          for attempt in $(seq 1 60); do
            detail="$(curl -fsS \
              -H "Authorization: Bearer ${VERCEL_TOKEN_VALUE}" \
              "https://api.vercel.com/v13/deployments/${deployment_host}?teamId=${VERCEL_ORG_ID}")"
            state="$(jq -r '.readyState // .state // "UNKNOWN"' <<<"$detail")"
            [[ "$state" == 'READY' ]] && break
            if [[ "$state" == 'ERROR' || "$state" == 'CANCELED' ]]; then
              echo "Production deployment reached terminal state $state." >&2
              exit 1
            fi
            sleep 5
          done

          state="$(jq -r '.readyState // .state // "UNKNOWN"' <<<"$detail")"
          deployment_id="$(jq -r '.uid // .id // empty' <<<"$detail")"
          project_id="$(jq -r '.projectId // .project.id // empty' <<<"$detail")"
          target="$(jq -r '.target // empty' <<<"$detail")"
          deployed_sha="$(jq -r '.meta.githubCommitSha // empty' <<<"$detail")"
          test "$state" = 'READY'
          test -n "$deployment_id"
          test "$project_id" = "$VERCEL_PROJECT_ID"
          test "$target" = 'production'
          test "$deployed_sha" = "$MERGE_SHA"

          echo "deployment_id=$deployment_id" >> "$GITHUB_OUTPUT"
          echo "deployment_url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"
          jq -n \
            --arg expectedSha "$MERGE_SHA" \
            --arg deploymentUrl "$DEPLOYMENT_URL" \
            --arg deploymentId "$deployment_id" \
            --arg projectId "$project_id" \
            --arg state "$state" \
            --arg target "$target" \
            --arg deployedSha "$deployed_sha" \
            '{expectedSha:$expectedSha,deploymentUrl:$deploymentUrl,deploymentId:$deploymentId,projectId:$projectId,state:$state,target:$target,deployedSha:$deployedSha}' \
            > "$CANARY_OUTPUT_DIR/deployment.json"

      - name: Verify the exact deployment through both production domains
        env:
          EXPECTED_DEPLOYMENT_ID: ${{ steps.deployment.outputs.deployment_id }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          verified=false
          for attempt in $(seq 1 40); do
            test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)" = "$MERGE_SHA"

            www_status="$(curl -sS \
              --cookie 'mt_walkthrough_seen=1' \
              -D "$CANARY_OUTPUT_DIR/www-returning.headers" \
              -o "$CANARY_OUTPUT_DIR/www-returning.html" \
              -w '%{http_code}' \
              "$CANONICAL_ORIGIN/complete-profile")"
            apex_status="$(curl -sS \
              -D "$CANARY_OUTPUT_DIR/apex.headers" \
              -o /dev/null \
              -w '%{http_code}' \
              "$APEX_ORIGIN/complete-profile")"
            tr -d '\r' < "$CANARY_OUTPUT_DIR/www-returning.headers" \
              > "$CANARY_OUTPUT_DIR/www-returning.normalized.headers"
            tr -d '\r' < "$CANARY_OUTPUT_DIR/apex.headers" \
              > "$CANARY_OUTPUT_DIR/apex.normalized.headers"

            if [[ "$www_status" == '200' ]] \
              && grep -Fq "$EXPECTED_DEPLOYMENT_ID" "$CANARY_OUTPUT_DIR/www-returning.html" \
              && grep -Fq 'Spend 100 sparks of attention.' "$CANARY_OUTPUT_DIR/www-returning.html" \
              && grep -Fqx 'x-matched-path: /complete-profile' "$CANARY_OUTPUT_DIR/www-returning.normalized.headers" \
              && [[ "$apex_status" == '308' ]] \
              && grep -Eq '^location: https://www\.moraltrade\.org/complete-profile([?].*)?$' "$CANARY_OUTPUT_DIR/apex.normalized.headers"; then
              verified=true
              break
            fi
            sleep 15
          done
          test "$verified" = true
          jq -n \
            --arg expectedSha "$MERGE_SHA" \
            --arg expectedDeploymentId "$EXPECTED_DEPLOYMENT_ID" \
            --arg wwwStatus "$www_status" \
            --arg apexStatus "$apex_status" \
            '{expectedSha:$expectedSha,expectedDeploymentId:$expectedDeploymentId,wwwStatus:($wwwStatus|tonumber),apexStatus:($apexStatus|tonumber),verified:true}' \
            > "$CANARY_OUTPUT_DIR/domain-verification.json"

      - name: Run the permanent six-scenario Complete Profile canary
        env:
          EXPECTED_SHA: ${{ env.MERGE_SHA }}
          EXPECTED_DEPLOYMENT_ID: ${{ steps.deployment.outputs.deployment_id }}
        shell: bash
        run: node .github/scripts/complete-profile-production-canary.mjs

      - name: Upload production release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: complete-profile-production-release-979726c0
          path: complete-profile-production-release-evidence
          if-no-files-found: error
          retention-days: 14

      - name: Publish the exact production release result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$JOB_STATUS" == 'success' ]]; then
            state=success
            description="Exact production deployment passed both aliases and all six canary scenarios"
          else
            state=failure
            description="Exact Complete Profile production release failed; inspect evidence"
          fi
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${MERGE_SHA}" \
            -f state="$state" \
            -f context="$STATUS_CONTEXT" \
            -f description="$description" \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          test "$state" = success
