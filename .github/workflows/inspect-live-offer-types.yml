name: Inspect live offer picker

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2c8f62b62b479a1925f2eed4c60bd2ee381deeae
      - name: Extract the production Live source and relevant picker context
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { gunzipSync } = require('node:zlib');

          const names = ['0a','0b','0c','0d','1','2','3','4a','4b','4c','4d','5a','5b','5c','5d'];
          const encoded = names
            .map((name) => fs.readFileSync(`public/mt-live-0d0e0f03-${name}.txt`, 'utf8'))
            .join('');
          const source = gunzipSync(Buffer.from(encoded, 'base64')).toString('utf8');
          fs.writeFileSync('production-live-source.html', source);

          const needles = [
            'Find a trade partner',
            'What are you offering?',
            'MONEY',
            'ACTION',
            'data-page="trade"',
          ];
          const contexts = [];
          for (const needle of needles) {
            let cursor = 0;
            let count = 0;
            while (count < 12) {
              const index = source.toLowerCase().indexOf(needle.toLowerCase(), cursor);
              if (index < 0) break;
              console.log(`NEEDLE ${JSON.stringify(needle)} OCCURRENCE ${count + 1} INDEX ${index}`);
              contexts.push(`\n===== ${needle} occurrence ${count + 1} @ ${index} =====\n${source.slice(Math.max(0, index - 6000), Math.min(source.length, index + 14000))}\n`);
              cursor = index + needle.length;
              count += 1;
            }
          }

          const unique = [...new Set(contexts)];
          fs.writeFileSync('production-live-offer-picker-context.txt', unique.join('\n'));
          console.log(`SOURCE_LENGTH ${source.length}`);
          console.log(`CONTEXT_BLOCKS ${unique.length}`);
          console.log(unique.join('\n').slice(0, 90000));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: production-live-offer-picker-source
          path: |
            production-live-source.html
            production-live-offer-picker-context.txt
          if-no-files-found: error
          retention-days: 1
