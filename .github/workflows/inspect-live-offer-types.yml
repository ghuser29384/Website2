name: Inspect live offer picker

on:
  push:
    branches:
      - agent/inspect-live-offer-types-20260723
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Find the source matching the reported picker across Live history and branch heads
        shell: bash
        run: |
          mkdir -p tmp/live-picker-inspection
          node <<'NODE'
          const fs = require('node:fs');
          const { execFileSync } = require('node:child_process');
          const { gunzipSync } = require('node:zlib');

          function git(args, options = {}) {
            return execFileSync('git', args, {
              encoding: 'utf8',
              maxBuffer: 100 * 1024 * 1024,
              ...options,
            });
          }

          const outputDir = 'tmp/live-picker-inspection';
          const needles = [
            'Find a trade partner',
            'What are you offering?',
            'Avery Kim',
            'Research Lead',
          ];
          const report = [];
          let found = null;

          const wrapperCommits = [...new Set(
            git(['log', '--all', '--format=%H', '--', 'public/moral-trade-live.html'])
              .trim()
              .split(/\s+/)
              .filter(Boolean),
          )];
          report.push(`WRAPPER_COMMITS ${wrapperCommits.length}`);

          for (const sha of wrapperCommits) {
            try {
              const wrapper = git(['show', `${sha}:public/moral-trade-live.html`]);
              const namesMatch = wrapper.match(/const names\s*=\s*\[([^\]]+)\]/s);
              const prefixMatch = wrapper.match(/\/mt-live-([^/`$]+)-\$\{name\}\.txt/);
              if (!namesMatch || !prefixMatch) {
                report.push(`${sha} wrapper-unrecognized`);
                continue;
              }

              const names = [...namesMatch[1].matchAll(/['"]([^'"]+)['"]/g)].map((match) => match[1]);
              const prefix = prefixMatch[1];
              const encoded = names.map((name) => git([
                'show',
                `${sha}:public/mt-live-${prefix}-${name}.txt`,
              ])).join('');
              const source = gunzipSync(Buffer.from(encoded, 'base64')).toString('utf8');
              const matches = needles.filter((needle) => source.toLowerCase().includes(needle.toLowerCase()));
              report.push(`${sha} prefix=${prefix} chunks=${names.length} source=${source.length} matches=${matches.join('|') || 'none'}`);

              if (!found && matches.length >= 2) {
                found = { sha, source, matches, prefix };
              }
            } catch (error) {
              report.push(`${sha} ERROR ${String(error.message || error).replace(/\s+/g, ' ').slice(0, 500)}`);
            }
          }

          const branchHeads = [...new Set(
            git(['for-each-ref', '--format=%(objectname)', 'refs/remotes/origin'])
              .trim()
              .split(/\s+/)
              .filter(Boolean),
          )];
          report.push(`BRANCH_HEADS ${branchHeads.length}`);
          for (const sha of branchHeads) {
            for (const needle of needles) {
              try {
                const output = git(['grep', '-I', '-n', '-F', needle, sha, '--', ':!*.txt']);
                if (output.trim()) report.push(`GIT_GREP ${sha} ${needle}\n${output.trim()}`);
              } catch (error) {
                if (error.status !== 1) {
                  report.push(`GIT_GREP_ERROR ${sha} ${needle} ${String(error.message || error).replace(/\s+/g, ' ').slice(0, 300)}`);
                }
              }
            }
          }

          fs.writeFileSync(`${outputDir}/live-history-scan.txt`, report.join('\n') + '\n');

          if (found) {
            fs.writeFileSync(`${outputDir}/reported-picker-live-source.html`, found.source);
            const lower = found.source.toLowerCase();
            const contexts = [];
            for (const needle of [...needles, 'money', 'action', 'offer']) {
              let cursor = 0;
              let count = 0;
              while (count < 12) {
                const index = lower.indexOf(needle.toLowerCase(), cursor);
                if (index < 0) break;
                contexts.push(`\n===== ${needle} occurrence ${count + 1} @ ${index} =====\n${found.source.slice(Math.max(0, index - 6000), Math.min(found.source.length, index + 14000))}\n`);
                cursor = index + needle.length;
                count += 1;
              }
            }
            fs.writeFileSync(`${outputDir}/reported-picker-context.txt`, [...new Set(contexts)].join('\n'));
            fs.writeFileSync(`${outputDir}/reported-picker-commit.txt`, `${found.sha}\nprefix=${found.prefix}\n${found.matches.join('\n')}\n`);
          } else {
            fs.writeFileSync(`${outputDir}/reported-picker-commit.txt`, 'NOT_FOUND\n');
          }
          NODE
      - name: Commit the inspection result to the temporary branch
        shell: bash
        run: |
          git config user.name "moral-trade-inspection-bot"
          git config user.email "moral-trade-inspection-bot@users.noreply.github.com"
          git add tmp/live-picker-inspection
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Record live picker source scan [skip ci]"
          git push origin HEAD:agent/inspect-live-offer-types-20260723
