name: Profile Dashboard live navigation diagnostics
on:
  push:
    branches: [ops/profile-dashboard-integration-20260927]
    paths: [.github/workflows/profile-dashboard-live-diagnostics-20260927.yml]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2678dc3ea33b17c0375a1bd5bccbb1c4990b4b16
          persist-credentials: false
      - name: Confirm the recorded production release without modifying it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/profile-live-diagnostics
          test "$(git rev-parse HEAD)" = 2678dc3ea33b17c0375a1bd5bccbb1c4990b4b16
          gh api repos/ghuser29384/Website2/actions/runs/36300477247 > /tmp/profile-live-diagnostics/release.json
          jq -e '.status == "completed" and .conclusion == "success" and .head_sha == "2678dc3ea33b17c0375a1bd5bccbb1c4990b4b16"' /tmp/profile-live-diagnostics/release.json >/dev/null
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Exercise every viewport and identify all failing network requests
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { writeFile } from 'node:fs/promises';
          import { chromium, request } from '@playwright/test';
          const out = '/tmp/profile-live-diagnostics';
          const report = { startedAt: new Date().toISOString(), redirects: [], viewports: [] };
          const browser = await chromium.launch();
          const api = await request.newContext();
          try {
            for (const origin of ['https://moraltrade.org', 'https://www.moraltrade.org']) {
              const response = await api.get(`${origin}/profile`, { maxRedirects: 0 });
              report.redirects.push({ url: `${origin}/profile`, status: response.status(), location: response.headers().location });
              assert.equal(response.status(), 308);
            }
            for (const width of [1440, 390, 320]) {
              const context = await browser.newContext({ viewport: { width, height: 900 } });
              await context.addCookies([{ name: 'mt_analytics_opt_out', value: '1', url: 'https://www.moraltrade.org' }]);
              const page = await context.newPage();
              const result = { width, pageErrors: [], consoleErrors: [], failedResponses: [], failedRequests: [], functionalPassed: false };
              page.on('pageerror', error => result.pageErrors.push(error.message));
              page.on('console', message => {
                if (message.type() === 'error') result.consoleErrors.push({ text: message.text(), location: message.location() });
              });
              page.on('response', response => {
                if (response.status() >= 400) {
                  const request = response.request();
                  const headers = request.headers();
                  result.failedResponses.push({ url: response.url(), status: response.status(), method: request.method(), resourceType: request.resourceType(), rsc: headers.rsc ?? null, prefetch: headers['next-router-prefetch'] ?? null });
                }
              });
              page.on('requestfailed', request => result.failedRequests.push({ url: request.url(), resourceType: request.resourceType(), error: request.failure()?.errorText }));
              try {
                await page.goto('https://www.moraltrade.org/profile', { waitUntil: 'domcontentloaded', timeout: 45000 });
                await page.waitForURL(url => url.pathname === '/login' && url.searchParams.get('returnTo') === '/dashboard', { timeout: 30000 });
                await page.getByRole('heading', { name: 'Welcome back', exact: true }).waitFor();
                assert.match(await page.title(), /Log in/);
                assert.equal(await page.getByTestId('profile-account').count(), 0);
                assert.equal(await page.locator('nextjs-portal').count(), 0);
                assert.ok(await page.evaluate(() => document.documentElement.scrollWidth <= innerWidth + 1));
                result.loginUrl = page.url();
                await page.screenshot({ path: `${out}/profile-login-${width}.png` });
                await page.goto('https://www.moraltrade.org/contact', { waitUntil: 'domcontentloaded', timeout: 45000 });
                const header = page.locator('.mt-refined-header').first();
                const more = header.locator('summary').filter({ hasText: 'More' });
                await more.click();
                const profile = header.getByRole('link', { name: 'Profile', exact: true });
                assert.equal(await profile.count(), 1);
                assert.equal(await profile.getAttribute('href'), '/dashboard');
                assert.equal(await header.getByRole('link', { name: 'Dashboard', exact: true }).count(), 0);
                await page.screenshot({ path: `${out}/profile-menu-${width}.png` });
                await profile.click();
                await page.waitForURL(url => url.pathname === '/login' && url.searchParams.get('returnTo') === '/dashboard', { timeout: 30000 });
                await page.getByRole('heading', { name: 'Welcome back', exact: true }).waitFor();
                assert.equal(await page.locator('nextjs-portal').count(), 0);
                assert.deepEqual(result.pageErrors, []);
                result.functionalPassed = true;
                result.interaction = 'Profile alias -> Login; Contact -> More -> unique Profile link -> Login with Dashboard return destination';
              } catch (error) {
                result.functionalError = String(error);
                await page.screenshot({ path: `${out}/failure-${width}.png` }).catch(() => {});
              } finally {
                report.viewports.push(result);
                await context.close();
              }
            }
          } finally {
            report.finishedAt = new Date().toISOString();
            await writeFile(`${out}/results.json`, JSON.stringify(report, null, 2));
            console.log(JSON.stringify(report, null, 2));
            await api.dispose();
            await browser.close();
          }
          assert.equal(report.viewports.length, 3);
          assert.ok(report.viewports.every(result => result.functionalPassed), 'At least one functional navigation check failed; inspect evidence.');
          // Preserve the original strict console check, but collect every viewport
          // and the request identities before reporting failure. Nothing is hidden.
          assert.ok(report.viewports.every(result => result.consoleErrors.length === 0), 'Live console errors remain; request-level evidence is retained for triage.');
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: profile-dashboard-live-diagnostics
          path: /tmp/profile-live-diagnostics
          retention-days: 7
