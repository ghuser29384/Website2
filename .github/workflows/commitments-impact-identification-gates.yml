name: Commitments impact-identification protocol gates

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - "docs/commitments/impact-identification/**"
      - "scripts/validate-commitments-impact-identification.mjs"
      - ".github/workflows/commitments-impact-identification-gates.yml"
  push:
    branches:
      - research/commitments-impact-identification-20260811

permissions:
  contents: read

concurrency:
  group: commitments-impact-identification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate protocol artifacts and enforce exact-package changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate exact artifacts
        shell: bash
        run: |
          set -o pipefail
          node scripts/validate-commitments-impact-identification.mjs \
            2>&1 | tee protocol-validation.log

      - name: Prove fail-closed negative cases
        shell: bash
        run: |
          set -o pipefail
          node scripts/validate-commitments-impact-identification.mjs --self-test \
            2>&1 | tee protocol-negative-self-tests.log

      - name: Enforce exact protocol-package diff only when immutable protocol artifacts change
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          base="$(git merge-base HEAD origin/main)"
          git diff --check "$base" "$GITHUB_SHA" -- \
            .github/workflows/commitments-impact-identification-gates.yml \
            docs/commitments/impact-identification \
            scripts/validate-commitments-impact-identification.mjs \
            | tee diff-check.log
          git diff --name-only "$base" "$GITHUB_SHA" | sort > actual-files.txt

          cat > immutable-protocol-files.txt <<'FILES'
          docs/commitments/impact-identification/causal-identification-and-calibration-preregistration-v2.md
          docs/commitments/impact-identification/evidence-to-product-mapping.v2.json
          docs/commitments/impact-identification/master-protocol.v2.json
          docs/commitments/impact-identification/protocol.schema.json
          docs/commitments/impact-identification/study-templates/co_fund.v2.json
          docs/commitments/impact-identification/study-templates/donation_redirect.v2.json
          docs/commitments/impact-identification/study-templates/donation_upgrade.v2.json
          docs/commitments/impact-identification/study-templates/threshold_funding.v2.json
          docs/commitments/impact-identification/study-templates/threshold_sign_on.v2.json
          docs/commitments/impact-identification/study-templates/trade.v2.json
          scripts/validate-commitments-impact-identification.mjs
          FILES
0          sort -o immutable-protocol-files.txt immutable-protocol-files.txt

          changed_immutable="$(comm -12 immutable-protocol-files.txt actual-files.txt)"
          if test -z "$changed_immutable"; then
            echo "immutable_protocol_artifacts_changed=false" | tee protocol-diff-mode.log
            exit 0
          fi

          echo "immutable_protocol_artifacts_changed=true" | tee protocol-diff-mode.log
          printf '%s\n' "$changed_immutable" | tee -a protocol-diff-mode.log

          cat > required-files.txt <<'FILES'
          .github/workflows/commitments-impact-identification-gates.yml
          docs/commitments/impact-identification/causal-identification-and-calibration-preregistration-v2.md
          docs/commitments/impact-identification/evidence-to-product-mapping.v2.json
          docs/commitments/impact-identification/master-protocol.v2.json
          docs/commitments/impact-identification/protocol.schema.json
          docs/commitments/impact-identification/study-templates/co_fund.v2.json
          docs/commitments/impact-identification/study-templates/donation_redirect.v2.json
          docs/commitments/impact-identification/study-templates/donation_upgrade.v2.json
          docs/commitments/impact-identification/study-templates/threshold_funding.v2.json
          docs/commitments/impact-identification/study-templates/threshold_sign_on.v2.json
          docs/commitments/impact-identification/study-templates/trade.v2.json
          scripts/validate-commitments-impact-identification.mjs
          FILES
          sort -o required-files.txt required-files.txt
          diff -u required-files.txt actual-files.txt

      - name: Upload protocol evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: commitments-impact-identification-${{ github.run_id }}
          path: |
            protocol-validation.log
            protocol-negative-self-tests.log
            diff-check.log
            immutable-protocol-files.txt
            protocol-diff-mode.log
            required-files.txt
            actual-files.txt
          if-no-files-found: warn
          retention-days: 30
