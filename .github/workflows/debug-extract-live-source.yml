name: Debug extract live source

on:
  push:
    branches:
      - debug/extract-live-source-20260723
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract exact live payload
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const zlib = require('node:zlib');

          const names = ['0a','0b','0c','0d','1','2','3','4a','4b','4c','4d','5a','5b','5c','5d'];
          const encoded = names
            .map((name) => fs.readFileSync(path.join('public', `mt-live-0d0e0f03-${name}.txt`), 'utf8').trim())
            .join('');
          const source = zlib.gunzipSync(Buffer.from(encoded, 'base64')).toString('utf8');

          fs.mkdirSync('debug-live-source', { recursive: true });
          fs.writeFileSync('debug-live-source/moral-trade-live-source.html', source);
          fs.copyFileSync('public/moral-trade-input-assist.js', 'debug-live-source/moral-trade-input-assist.js');
          fs.copyFileSync('public/moral-trade-input-assist.css', 'debug-live-source/moral-trade-input-assist.css');
          fs.copyFileSync('public/moral-trade-input-standards.json', 'debug-live-source/moral-trade-input-standards.json');

          const terms = [
            'Build a trade',
            'Structured clauses',
            'Two-sided exchange table',
            'Potential matches',
            'function trade',
            'tradeHome',
            'contenteditable',
            'input',
            'textarea',
            'data-page="trade"',
            'I will give',
            'Only if they',
            'Proof via',
          ];
          const snippets = [];
          for (const term of terms) {
            let cursor = 0;
            let count = 0;
            while (cursor < source.length && count < 25) {
              const index = source.toLowerCase().indexOf(term.toLowerCase(), cursor);
              if (index < 0) break;
              const start = Math.max(0, index - 1200);
              const end = Math.min(source.length, index + term.length + 2200);
              snippets.push(`\n===== ${term} @ ${index} =====\n${source.slice(start, end)}\n`);
              cursor = index + term.length;
              count += 1;
            }
          }
          fs.writeFileSync('debug-live-source/snippets.txt', snippets.join('\n'));
          console.log(`Extracted ${source.length} characters and ${snippets.length} snippets.`);
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: debug-live-source
          path: debug-live-source
          if-no-files-found: error
          retention-days: 1

  diagnose-pr-179:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/exact-live-trade-autocomplete-20260723
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Capture source and adaptive test output
        shell: bash
        run: |
          mkdir -p diagnostics
          set +e
          node --import tsx --test src/lib/exact-live-autocomplete.test.ts > diagnostics/exact-live-source-test.txt 2>&1
          echo $? > diagnostics/exact-live-source-test.exit
          node --import tsx --test \
            src/lib/live-now-recommendations.test.ts \
            src/lib/recommendation-learning.test.ts \
            src/live-now-data.test.ts \
            src/live-now-priority-route.test.ts > diagnostics/adaptive-tests.txt 2>&1
          echo $? > diagnostics/adaptive-tests.exit
          npx eslint \
            public/moral-trade-live-token-autocomplete.js \
            src/lib/exact-live-autocomplete.test.ts \
            tests/exact-live-autocomplete.spec.ts > diagnostics/eslint.txt 2>&1
          echo $? > diagnostics/eslint.exit
          cat diagnostics/exact-live-source-test.txt
          cat diagnostics/adaptive-tests.txt
          cat diagnostics/eslint.txt
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Capture exact-live autocomplete E2E output
        shell: bash
        run: |
          set +e
          npm run test:e2e -- tests/exact-live-autocomplete.spec.ts > diagnostics/exact-live-e2e.txt 2>&1
          echo $? > diagnostics/exact-live-e2e.exit
          cat diagnostics/exact-live-e2e.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pr-179-diagnostics
          path: |
            diagnostics
            test-results
            playwright-report
          if-no-files-found: error
          retention-days: 1

  diagnose-pr-179-base:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c1c83a92e19b7d17a58c3a8ebeac15cb6dfee144
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Capture base test output
        shell: bash
        run: |
          mkdir -p base-diagnostics
          set +e
          node --import tsx --test src/live-now-priority-route.test.ts > base-diagnostics/live-now-priority-route.txt 2>&1
          echo $? > base-diagnostics/live-now-priority-route.exit
          cat base-diagnostics/live-now-priority-route.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pr-179-base-diagnostics
          path: base-diagnostics
          if-no-files-found: error
          retention-days: 1
