name: Guided Start draft revision and preview
on:
  push:
    branches: [ops/start-simplification-20260926]
    paths: [.github/workflows/start-guided-revision-qa.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.apply.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9d0293f8292e46b2a731eec16ffc42f9e2ff97e2
          path: transport
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: cf9ef979eca2574596ed41c91fca10044f1db9b8
          path: candidate
          fetch-depth: 1
      - name: Publish only the reviewed child of the existing draft
        id: apply
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: candidate
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = ghuser29384/Website2
          test "$(git rev-parse HEAD)" = cf9ef979eca2574596ed41c91fca10044f1db9b8
          test "$(git ls-remote origin refs/heads/fix/start-simplification-20260926 | cut -f1)" = cf9ef979eca2574596ed41c91fca10044f1db9b8
          python ../transport/.github/start-guided-edit.py "$PWD"
          git add -- src/app/start/page.tsx src/app/start/start.module.css src/lib/action-first-positioning.test.ts src/lib/public-route-smoke.test.ts src/lib/start-paths.test.ts src/lib/start-paths.ts tests/meta-explanatory-copy.spec.ts tests/pilot-copy.spec.ts tests/sitewide-canonical-visual-fidelity.spec.ts tests/start-page.spec.ts src/components/walkthrough/quick-walkthrough.tsx src/components/walkthrough/quick-walkthrough.css src/lib/quick-walkthrough.ts
          test "$(git diff --cached --name-only | wc -l)" -eq 13
          git diff --cached --check
          git diff --cached --binary > /tmp/guided-start.patch
          echo '2cc757cd4291c1428c74d96004cc965847e27a8f9e28e1370a0d20e86b8ccdf0  /tmp/guided-start.patch' | sha256sum -c -
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Replace Start chooser with a short voluntary trade walkthrough'
          git push origin HEAD:refs/heads/fix/start-simplification-20260926
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  verify:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      EXPECTED_SHA: ${{ needs.prepare.outputs.sha }}
      VERCEL: '1'
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3210
      SITE_URL: http://127.0.0.1:3210
      PLAYWRIGHT_HTML_OPEN: never
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 9d0293f8292e46b2a731eec16ffc42f9e2ff97e2
          path: transport
          persist-credentials: false
          sparse-checkout: .github/start-guided-preview.cjs
          sparse-checkout-cone-mode: false
      - name: Isolate preview tooling and record exact source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          cp transport/.github/start-guided-preview.cjs /tmp/start-guided-preview.cjs
          rm -rf transport
          mkdir -p start-guided-evidence
          git rev-parse HEAD > start-guided-evidence/commit.txt
          git rev-parse HEAD^{tree} > start-guided-evidence/tree.txt
          git diff HEAD^ --check
          git diff HEAD^ --binary > start-guided-evidence/revision.patch
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Focused and complete unit tests
        run: |
          set -euo pipefail
          node --import tsx --test src/lib/start-paths.test.ts src/lib/action-first-positioning.test.ts src/lib/public-route-smoke.test.ts 2>&1 | tee start-guided-evidence/focused-unit.log
          npm test 2>&1 | tee start-guided-evidence/unit.log
      - name: Complete lint and typecheck
        run: |
          set -euo pipefail
          npm run lint -- --quiet 2>&1 | tee start-guided-evidence/lint.log
          npx tsc --noEmit 2>&1 | tee start-guided-evidence/types.log
      - name: Production build
        id: build
        run: |
          set -euo pipefail
          npm run build 2>&1 | tee start-guided-evidence/build.log
      - name: Install locked Chromium
        id: chromium
        run: npx playwright install --with-deps chromium
      - name: Actual rendered flow and affected regression tests
        run: |
          set -euo pipefail
          npx playwright test tests/start-page.spec.ts tests/sitewide-canonical-visual-fidelity.spec.ts tests/pilot-copy.spec.ts tests/meta-explanatory-copy.spec.ts --workers=1 --reporter=line 2>&1 | tee start-guided-evidence/browser.log
      - name: Capture actual application and export the interactive review page
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.chromium.outcome == 'success' }}
        run: |
          set -euo pipefail
          node /tmp/start-guided-preview.cjs "$PWD" 2>&1 | tee start-guided-evidence/export.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guided-start-${{ needs.prepare.outputs.sha }}
          path: |
            start-guided-evidence
            test-results
          retention-days: 7
