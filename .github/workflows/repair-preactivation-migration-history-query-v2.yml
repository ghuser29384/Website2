name: Repair pre-activation migration-history projection v2

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
    paths:
      - .github/workflows/repair-preactivation-migration-history-query-v2.yml

permissions:
  contents: write

concurrency:
  group: repair-preactivation-migration-history-v2-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'database/preactivation-schema-baseline-20260818'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Replace reserved aliases in the exact migration-history projection
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('scripts/database/generate-preactivation-baseline.sh')
          text = path.read_text()
          pattern = re.compile(
              r"(to_jsonb\(m\)\s*->>\s*'version')\s+as\s+version,\n"
              r"(\s*coalesce\(to_jsonb\(m\)\s*->>\s*'name',\s*''\))\s+as\s+name,"
          )
          replacement = r"\1 as migration_version,\n\2 as migration_name,"
          updated, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'Expected one migration-history projection, found {count}.')
          path.write_text(updated)
          PY
          bash -n scripts/database/generate-preactivation-baseline.sh
          git diff --check

      - name: Commit and push normally
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/database/generate-preactivation-baseline.sh
          git commit -m 'Fix sanitized migration-history projection'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
