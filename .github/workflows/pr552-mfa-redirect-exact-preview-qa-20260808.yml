name: PR 552 redirect-backed exact Preview MFA lifecycle

on:
  push:
    branches:
      - ops/pr552-mfa-redirect-exact-preview-qa-20260808
    paths:
      - .github/workflows/pr552-mfa-redirect-exact-preview-qa-20260808.yml

permissions:
  actions: write
  contents: read

concurrency:
  group: pr552-mfa-redirect-exact-preview-qa-20260808
  cancel-in-progress: false

env:
  TARGET_BRANCH: hotfix/dashboard-account-security-visible-20260807
  SUPERSEDED_QA_BRANCH: ops/pr552-mfa-refresh-exact-preview-qa-20260808
  TOOLS_COMMIT: 633952ca7e4c56259ac6ae14d9b1ef3aa292e575
  HARNESS_COMMIT: 928a81e30c6eae8f35e56513ac6f0f1a428fd825
  HARNESS_BLOB: 394366c478fc01d93d6c7f245aba496986f56762
  EXPECTED_SUPABASE_REF: jnpoxvalyjtdghnperyu
  NEXT_PUBLIC_SUPABASE_URL: https://jnpoxvalyjtdghnperyu.supabase.co
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_Pcmy5vefKiaEhuYTOSU75Q_NklsZOrT
  VERCEL_ORG_ID: team_ySu6sF3Uho1E1GnJtCQPVEuJ
  VERCEL_PROJECT_ID: prj_Em3j7Uj7RatX2R1ZYhla3XSHRde7
  VERCEL_CLI_VERSION: 50.38.1
  EXPECTED_RELEASE_REASON: pr552-dashboard-account-security-preview-mfa-redirect-fixed
  OUTPUT_DIR: pr552-mfa-redirect-exact-preview-qa

jobs:
  verify-deploy-and-exercise:
    name: Verify redirect-backed candidate and exercise exact MFA lifecycle
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      PROD_SUPABASE_DB_URL: ${{ secrets.PROD_SUPABASE_DB_URL }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      PLAYWRIGHT_HTML_OPEN: never
    steps:
      - name: Check out the controller repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cancel only superseded in-progress QA runs
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          response="$(curl -fsS \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/ghuser29384/Website2/actions/runs?branch=${SUPERSEDED_QA_BRANCH}&per_page=50")"
          while read -r run_id; do
            [[ -n "$run_id" ]] || continue
            curl -fsS -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/ghuser29384/Website2/actions/runs/${run_id}/cancel" \
              >/dev/null || true
          done < <(jq -r '.workflow_runs[] | select(.status != "completed") | .id' <<<"$response")

      - name: Wait for and lock the redirect-backed PR head
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'ghuser29384/Website2'
          mkdir -p "$OUTPUT_DIR"
          candidate=''
          for attempt in $(seq 1 240); do
            response="$(curl -fsS \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              'https://api.github.com/repos/ghuser29384/Website2/pulls/552')"
            test "$(jq -r '.state' <<<"$response")" = 'open'
            test "$(jq -r '.draft' <<<"$response")" = 'true'
            test "$(jq -r '.head.ref' <<<"$response")" = "$TARGET_BRANCH"
            test "$(jq -r '.head.repo.full_name' <<<"$response")" = 'ghuser29384/Website2'
            test "$(jq -r '.base.ref' <<<"$response")" = 'main'
            sha="$(jq -r '.head.sha' <<<"$response")"
            git fetch --no-tags origin "$sha" main
            component="$RUNNER_TEMP/pr552-redirect-candidate-panel.tsx"
            actions="$RUNNER_TEMP/pr552-redirect-candidate-actions.ts"
            focused="$RUNNER_TEMP/pr552-redirect-candidate-test.ts"
            gate="$RUNNER_TEMP/pr552-redirect-candidate-gate.yml"
            git show "${sha}:src/components/dashboard/background-account-security-panel.tsx" > "$component"
            git show "${sha}:src/app/background-networking/actions.ts" > "$actions"
            git show "${sha}:src/dashboard-account-security-visibility.test.ts" > "$focused"
            git show "${sha}:.github/workflows/dashboard-account-security-hotfix-gates.yml" > "$gate"
            if grep -Fq 'data-mfa-verification-refresh="router-refresh"' "$component" \
              && grep -Fq 'router.refresh();' "$component" \
              && grep -Fq 'redirectWithMessage(returnTo, "message", "MFA verified for this session.");' "$actions" \
              && grep -Fq 'successful MFA verification redirects through a freshly rendered dashboard' "$focused" \
              && grep -Fq 'src/app/background-networking/actions.ts' "$gate" \
              && grep -Fq 'src/components/layout/site-topbar.tsx' "$gate"; then
              candidate="$sha"
              break
            fi
            sleep 4
          done
          test -n "$candidate"
          git checkout --detach "$candidate"
          test "$(git rev-parse HEAD)" = "$candidate"
          base="$(git merge-base HEAD origin/main)"
          git merge-base --is-ancestor "$base" HEAD
          git diff --check "$base" HEAD | tee "$OUTPUT_DIR/diff-check.log"
          git diff --name-only "$base" HEAD | sort > "$OUTPUT_DIR/candidate-files.txt"
          cat > "$OUTPUT_DIR/expected-candidate-files.txt" <<'FILES'
          .github/workflows/dashboard-account-security-hotfix-gates.yml
          src/app/background-networking/actions.ts
          src/app/dashboard/dashboard-account-security.css
          src/app/dashboard/layout.tsx
          src/app/dashboard/page.tsx
          src/components/dashboard/background-account-security-panel.tsx
          src/components/layout/site-topbar.tsx
          src/dashboard-account-security-visibility.test.ts
          src/proxy.test.ts
          src/proxy.ts
          tests/dashboard-account-security-visibility.spec.ts
          FILES
          diff -u "$OUTPUT_DIR/expected-candidate-files.txt" "$OUTPUT_DIR/candidate-files.txt"
          printf '%s\n' "$candidate" | tee "$OUTPUT_DIR/candidate-sha.txt"
          printf '%s\n' "$base" | tee "$OUTPUT_DIR/base-sha.txt"
          echo "CANDIDATE_SHA=$candidate" >> "$GITHUB_ENV"
          echo "BASE_SHA=$base" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies and browser runtime
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq postgresql-client

      - name: Run focused source and routing contracts
        shell: bash
        run: |
          set -o pipefail
          node --import tsx --test \
            src/dashboard-account-security-visibility.test.ts \
            src/proxy.test.ts \
            2>&1 | tee "$OUTPUT_DIR/focused.log"

      - name: Run complete repository tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee "$OUTPUT_DIR/repository-tests.log"

      - name: Run complete ESLint
        shell: bash
        run: |
          set -o pipefail
          npm run lint -- --quiet 2>&1 | tee "$OUTPUT_DIR/lint.log"

      - name: Run TypeScript
        shell: bash
        run: |
          set -o pipefail
          npx tsc --noEmit 2>&1 | tee "$OUTPUT_DIR/typescript.log"

      - name: Run optimized application build
        shell: bash
        env:
          NEXT_PUBLIC_SITE_URL: https://www.moraltrade.org
          SITE_URL: https://www.moraltrade.org
          VERCEL: "1"
          VERCEL_ENV: preview
        run: |
          set -o pipefail
          npm run build 2>&1 | tee "$OUTPUT_DIR/application-build.log"

      - name: Run rendered desktop and mobile gate
        shell: bash
        env:
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3210
          SITE_URL: http://127.0.0.1:3210
        run: |
          set -o pipefail
          npm run test:e2e -- tests/dashboard-account-security-visibility.spec.ts --reporter=line \
            2>&1 | tee "$OUTPUT_DIR/rendered.log"

      - name: Pull canonical Preview environment
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          echo "::add-mask::$VERCEL_TOKEN"
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' \
            "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          npx --yes "vercel@$VERCEL_CLI_VERSION" pull \
            --yes --environment=preview --token="$VERCEL_TOKEN" \
            2>&1 | tee "$OUTPUT_DIR/vercel-pull.log"

      - name: Build and upload the exact candidate as Preview only
        shell: bash
        run: |
          set -o pipefail
          npx --yes "vercel@$VERCEL_CLI_VERSION" build --token="$VERCEL_TOKEN" \
            2>&1 | tee "$OUTPUT_DIR/vercel-build.log"
          set -euo pipefail
          deployment_url="$(npx --yes "vercel@$VERCEL_CLI_VERSION" deploy \
            --prebuilt \
            --meta "githubCommitOrg=ghuser29384" \
            --meta "githubCommitRepo=Website2" \
            --meta "githubCommitSha=$CANDIDATE_SHA" \
            --meta "moralTradeCandidateSha=$CANDIDATE_SHA" \
            --meta "releaseReason=$EXPECTED_RELEASE_REASON" \
            --token="$VERCEL_TOKEN" \
            2> >(tee "$OUTPUT_DIR/vercel-deploy.stderr.log" >&2))"
          case "$deployment_url" in https://*.vercel.app) ;; *) exit 1 ;; esac
          preview_host="${deployment_url#https://}"
          deployment_json="$OUTPUT_DIR/exact-deployment.json"
          ready=''
          for attempt in $(seq 1 90); do
            curl -fsS \
              -H "Authorization: Bearer ${VERCEL_TOKEN}" \
              "https://api.vercel.com/v13/deployments/${preview_host}?teamId=${VERCEL_ORG_ID}" \
              > "$deployment_json"
            state="$(jq -r '.readyState // .state // empty' "$deployment_json")"
            if [[ "$state" = 'READY' ]]; then
              ready=1
              break
            fi
            if [[ "$state" = 'ERROR' || "$state" = 'CANCELED' ]]; then
              jq . "$deployment_json"
              exit 1
            fi
            sleep 4
          done
          test "$ready" = '1'
          deployment_id="$(jq -r '.uid // .id // empty' "$deployment_json")"
          test -n "$deployment_id"
          jq -e \
            --arg deploymentId "$deployment_id" \
            --arg projectId "$VERCEL_PROJECT_ID" \
            --arg sha "$CANDIDATE_SHA" \
            --arg url "$preview_host" \
            --arg releaseReason "$EXPECTED_RELEASE_REASON" '
              ((.uid // .id) == $deploymentId)
              and ((.projectId // .project.id // "") == $projectId)
              and ((.readyState // .state // "") == "READY")
              and ((.target // null) == null)
              and ((.aliasError // null) == null)
              and (.url == $url)
              and (.meta.githubCommitOrg == "ghuser29384")
              and (.meta.githubCommitRepo == "Website2")
              and (.meta.githubCommitSha == $sha)
              and (.meta.moralTradeCandidateSha == $sha)
              and (.meta.releaseReason == $releaseReason)
            ' "$deployment_json" >/dev/null
          printf '%s\n' "$deployment_url" | tee "$OUTPUT_DIR/preview-origin.txt"
          printf '%s\n' "$deployment_id" | tee "$OUTPUT_DIR/deployment-id.txt"
          echo "PREVIEW_ORIGIN=$deployment_url" >> "$GITHUB_ENV"
          echo "DEPLOYMENT_ID=$deployment_id" >> "$GITHUB_ENV"

      - name: Materialize and patch immutable authenticated MFA harness
        shell: bash
        run: |
          set -euo pipefail
          tools_dir="$RUNNER_TEMP/pr552-mfa-redirect-tools"
          mkdir -p "$tools_dir" .qa-runtime .qa-private
          git cat-file -e "${TOOLS_COMMIT}^{commit}"
          git cat-file -e "${HARNESS_COMMIT}^{commit}"
          patcher="$tools_dir/patcher.py"
          runner="$tools_dir/runner.sh"
          harness=".qa-runtime/pr552-authenticated-preview-mfa-db.mjs"
          git show "${TOOLS_COMMIT}:.github/scripts/pr552-patch-authenticated-preview-harness-v11.py" > "$patcher"
          git show "${TOOLS_COMMIT}:.github/scripts/pr552-run-authenticated-preview-mfa-v11.sh" > "$runner"
          git show "${HARNESS_COMMIT}:.github/scripts/pr552-authenticated-preview-mfa-db.mjs" > "$harness"
          test "$(git hash-object "$harness")" = "$HARNESS_BLOB"
          chmod 700 "$runner"
          python3 -m py_compile "$patcher"
          bash -n "$runner"
          CANDIDATE_SHA="$CANDIDATE_SHA" DEPLOYMENT_ID="$DEPLOYMENT_ID" \
            python3 "$patcher" "$harness"
          node --check "$harness"
          sha256sum "$patcher" "$runner" "$harness" > "$OUTPUT_DIR/authenticated-tools.sha256"
          echo "PATCHER_PATH=$patcher" >> "$GITHUB_ENV"
          echo "RUNNER_PATH=$runner" >> "$GITHUB_ENV"
          echo "HARNESS_PATH=$harness" >> "$GITHUB_ENV"
          echo "PRIVATE_STATE_PATH=.qa-private/pr552-mfa-redirect-private-state.json" >> "$GITHUB_ENV"

      - name: Exercise desktop and mobile MFA with guaranteed exact cleanup
        shell: bash
        run: |
          set -euo pipefail
          test -n "${PROD_SUPABASE_DB_URL:-}"
          export CANDIDATE_SHA DEPLOYMENT_ID PREVIEW_ORIGIN EXPECTED_RELEASE_REASON EXPECTED_SUPABASE_REF
          export VERCEL_ORG_ID VERCEL_PROJECT_ID VERCEL_TOKEN PROD_SUPABASE_DB_URL
          export HARNESS_PATH PRIVATE_STATE_PATH OUTPUT_DIR RUNNER_TEMP
          bash "$RUNNER_PATH"

      - name: Publish verified evidence summary
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          summary="$OUTPUT_DIR/verified-summary.json"
          test -s "$summary"
          jq -e \
            --arg sha "$CANDIDATE_SHA" \
            --arg deploymentId "$DEPLOYMENT_ID" '
              .candidateSha == $sha
              and .deploymentId == $deploymentId
              and .desktop.verifiedFactors == 1
              and .desktop.sessionLevel == "aal2"
              and .mobile.verifiedFactors == 1
              and .mobile.sessionLevel == "aal2"
              and .exactSingleNewFactor == true
              and .temporaryUserAbsent == true
              and .independentCleanupProvedAbsence == true
              and .vercelBypassRevoked == true
            ' "$summary" >/dev/null
          {
            echo '## PR 552 redirect-backed exact Preview MFA lifecycle'
            echo
            echo "- Candidate: \`$CANDIDATE_SHA\`"
            echo "- Deployment: \`$DEPLOYMENT_ID\`"
            echo "- Preview: \`$PREVIEW_ORIGIN\`"
            echo '- Full repository and rendered gates: passed'
            echo '- Desktop enrollment and AAL2 verification: passed'
            echo '- Fresh mobile-session AAL2 verification: passed'
            echo '- Exactly one new factor created; only that factor removed: passed'
            echo '- Temporary user independently absent after cleanup: passed'
            echo '- One-use Vercel bypass revoked and count restored: passed'
            echo '- Preview only; no production alias or target changed.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Archive immutable evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr552-mfa-redirect-exact-preview-qa-${{ github.run_id }}
          path: |
            pr552-mfa-redirect-exact-preview-qa/
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 30
