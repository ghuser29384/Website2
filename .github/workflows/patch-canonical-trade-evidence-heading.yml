name: Patch canonical Trade integration evidence assertion

on:
  pull_request:
    branches:
      - main
    types:
      - reopened
    paths:
      - .ops/patch-canonical-trade-evidence-heading-trigger.txt

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'cleanup/canonical-trade-entry-20260730'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact branch
        uses: actions/checkout@v4
        with:
          ref: cleanup/canonical-trade-entry-20260730
          fetch-depth: 0

      - name: Update the stale Evidence-page heading assertion
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/exact-live-now-recommendations.spec.ts")
          source = path.read_text()
          old = '    await expect(page.getByRole("heading", { name: "Evidence", exact: true })).toBeVisible();'
          new = '''    await expect(
              page.getByRole("heading", {
                level: 1,
                name: "Verified outcomes, without public evidence dossiers.",
                exact: true,
              }),
            ).toBeVisible();'''
          if source.count(old) != 1:
              raise SystemExit(f"Expected exactly one stale Evidence heading assertion, found {source.count(old)}")
          path.write_text(source.replace(old, new))
          PY

          node --import tsx --test src/lib/create-interface/unified-entry-routes.test.ts
          npx eslint tests/exact-live-now-recommendations.spec.ts

      - name: Commit the test repair and remove temporary patch files
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/patch-canonical-trade-evidence-heading.yml
          rm -f .ops/patch-canonical-trade-evidence-heading-trigger.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/exact-live-now-recommendations.spec.ts \
            .github/workflows/patch-canonical-trade-evidence-heading.yml \
            .ops/patch-canonical-trade-evidence-heading-trigger.txt
          git commit -m "Align Feed navigation QA with the current Evidence page"
          git push origin HEAD:cleanup/canonical-trade-entry-20260730
