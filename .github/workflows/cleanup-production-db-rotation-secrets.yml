name: Clean up production database rotation secrets

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/cleanup-production-db-rotation-secrets.yml

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      REPO_ADMIN_TOKEN: ${{ secrets.REPO_ADMIN_TOKEN }}
    steps:
      - name: Delete temporary repository secrets
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${REPO_ADMIN_TOKEN:-}" ]; then
            echo "::error::REPO_ADMIN_TOKEN is missing."
            exit 1
          fi
          echo "::add-mask::$REPO_ADMIN_TOKEN"

          status="$(curl -sS -o /tmp/github-key.json -w '%{http_code}' \
            -H "Authorization: Bearer $REPO_ADMIN_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/secrets/public-key" || true)"
          rm -f /tmp/github-key.json
          if [ "$status" != "200" ]; then
            echo "::error::REPO_ADMIN_TOKEN cannot manage repository Actions secrets (HTTP $status)."
            exit 1
          fi

          GH_TOKEN="$REPO_ADMIN_TOKEN" gh secret delete SUPABASE_ACCESS_TOKEN --repo "$GITHUB_REPOSITORY"
          GH_TOKEN="$REPO_ADMIN_TOKEN" gh secret delete REPO_ADMIN_TOKEN --repo "$GITHUB_REPOSITORY"

          remaining="$(GH_TOKEN="$REPO_ADMIN_TOKEN" gh secret list --repo "$GITHUB_REPOSITORY" \
            --json name --jq '[.[] | select(.name == "SUPABASE_ACCESS_TOKEN" or .name == "REPO_ADMIN_TOKEN")] | length')"
          test "$remaining" = "0"

          {
            echo '### Temporary rotation repository secrets deleted'
            echo
            echo '- `SUPABASE_ACCESS_TOKEN` was removed from GitHub Actions.'
            echo '- `REPO_ADMIN_TOKEN` was removed from GitHub Actions.'
            echo '- The underlying account tokens must still be revoked at their issuers.'
          } >> "$GITHUB_STEP_SUMMARY"
