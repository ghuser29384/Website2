name: Observe PR 212 integrated post-cleanup gate

on:
  push:
    branches:
      - agent/pr212-main-integration-ops-20260730
    paths:
      - .github/workflows/pr212-integrated-postcleanup-observer.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_WORKFLOW: pr212-integrated-postcleanup-gate.yml
      TARGET_HEAD: 44f0733b0843418e3bfd6e952b27a4038637779b
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Poll exact gate and record terminal result
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ops/pr212-integrated-postcleanup
          run_id=""
          status=""
          conclusion=""
          for attempt in $(seq 1 480); do
            gh run list --repo "$GITHUB_REPOSITORY" --workflow "$TARGET_WORKFLOW" --branch agent/pr212-main-integration-ops-20260730 --limit 30 --json databaseId,headSha,status,conclusion,createdAt,url > /tmp/runs.json
            run_id="$(jq -r --arg head "$TARGET_HEAD" '[.[] | select(.headSha == $head)] | sort_by(.createdAt) | reverse | .[0].databaseId // empty' /tmp/runs.json)"
            status="$(jq -r --arg head "$TARGET_HEAD" '[.[] | select(.headSha == $head)] | sort_by(.createdAt) | reverse | .[0].status // empty' /tmp/runs.json)"
            conclusion="$(jq -r --arg head "$TARGET_HEAD" '[.[] | select(.headSha == $head)] | sort_by(.createdAt) | reverse | .[0].conclusion // empty' /tmp/runs.json)"
            if [[ -n "$run_id" && "$status" == "completed" ]]; then break; fi
            sleep 10
          done

          if [[ -n "$run_id" ]]; then
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" > /tmp/run.json
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100" > /tmp/jobs.json
            gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --log-failed > /tmp/failed.log 2>&1 || true
          else
            printf '%s\n' '{}' > /tmp/run.json
            printf '%s\n' '{"jobs":[]}' > /tmp/jobs.json
            printf '%s\n' 'No exact post-cleanup gate run found.' > /tmp/failed.log
          fi

          jq -n --arg run_id "$run_id" --arg status "$status" --arg conclusion "$conclusion" --slurpfile runs /tmp/runs.json --slurpfile run /tmp/run.json --slurpfile jobs /tmp/jobs.json '{run_id:$run_id,status:$status,conclusion:$conclusion,runs:$runs[0],run:$run[0],jobs:$jobs[0].jobs}' > ops/pr212-integrated-postcleanup/status.json
          tail -n 1200 /tmp/failed.log > ops/pr212-integrated-postcleanup/failed-log.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops/pr212-integrated-postcleanup
          git commit -m "Record PR 212 integrated post-cleanup gate"
          git push origin HEAD:agent/pr212-main-integration-ops-20260730

          [[ -n "$run_id" && "$status" == "completed" ]] || exit 1
