name: PR800 v5 controller materializer snapshot

on:
  push:
    branches:
      - ops/pr800-adjudication-observer-20260822
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_WORKFLOW: pr800-v5-controller-materializer-20260822.yml
      TARGET_BRANCH: ops/pr800-v5-controller-materializer-20260822
    steps:
      - name: Record materializer runs
        shell: bash
        run: |
          set -euo pipefail
          response="$(gh api --method GET \
            "repos/$GITHUB_REPOSITORY/actions/workflows/$TARGET_WORKFLOW/runs" \
            -f branch="$TARGET_BRANCH" \
            -f per_page=10)"
          summary="$(jq -r '[.workflow_runs[] | {id, head_sha, status, conclusion, html_url}] | tostring' <<<"$response")"
          body="<!-- pr800-v5-controller-materializer-snapshot -->
          PR #800 v5 controller materializer runs: \`$summary\`"
          gh issue comment 709 --repo "$GITHUB_REPOSITORY" --body "$body"
