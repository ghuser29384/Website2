            files.append(path); data=path.read_bytes()
            for label,pattern in patterns.items():
              if pattern.search(data): findings.append({'type':label,'path':str(path)})
          result={'textFilesScanned':len(files),'imageFilesRetained':len([p for p in root.rglob('*') if p.is_file() and p.suffix.lower() in {'.png','.jpg','.jpeg','.webp'}]),'findings':findings}
          print(json.dumps(result,sort_keys=True))
          if findings: raise SystemExit('Credential-like material in retained evidence')
          PY
          jq -e '.findings==[]' "$EVIDENCE_DIR/privacy-scan.json" >/dev/null
          find "$EVIDENCE_DIR" -type f -print0 | sort -z | xargs -0 sha256sum > "$EVIDENCE_DIR/files.sha256"
          sha256sum "$EVIDENCE_DIR/files.sha256" | awk '{print $1}' > "$EVIDENCE_DIR/evidence-tree.sha256"
          echo "I782_PRIVACY_SAFE=true" >> "$GITHUB_ENV"

      - name: Upload immutable privacy-scanned completion evidence
        if: always() && env.I782_PRIVACY_SAFE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: issue782-canonical-production-uat-${{ github.run_id }}-${{ env.EXPECTED_MAIN_SHA }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 30

      - name: Record successful bounded sequence
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '### Issue 782 bounded canonical production UAT passed'
            echo
            echo "- exact main: \`$EXPECTED_MAIN_SHA\`"
            echo "- temporary deployment: \`$I782_TEMP_DEPLOYMENT_ID\` (deleted after UAT)"
            echo "- restoration deployment: \`$RESTORE_DEPLOYMENT_ID\`"
            echo '- pre-alias Auth/Create/non-payment-DAC acceptance: passed'
            echo '- canonical Auth/Create/non-payment-DAC acceptance: passed'
            echo '- canonical aliases restored: yes'
            echo '- temporary ADMIN_EMAILS removed: yes'
            echo '- exact-owned synthetic residue: 0'
            echo '- payment/provider references and signals: 0'
          } >> "$GITHUB_STEP_SUMMARY"
