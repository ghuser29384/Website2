name: Dashboard Sparks rendered QA
on:
  push:
    branches: [ops/dashboard-sparks-default-20260925]
    paths: [.github/workflows/dashboard-sparks-rendered-qa.yml]
permissions:
  contents: read
concurrency:
  group: dashboard-sparks-rendered-20260925
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3210
      SITE_URL: http://127.0.0.1:3210
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54331
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: dashboard-local-fixture-key
      DASHBOARD_SPARKS_FIXTURE: '1'
      PLAYWRIGHT_HTML_OPEN: never
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f1669819cfaeb9af30a175b38b26320308798e2e
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Verify exact scope and unchanged production policies
        run: |
          set -euo pipefail
          mkdir -p /tmp/dashboard-sparks-evidence/source
          test "$(git rev-parse HEAD)" = f1669819cfaeb9af30a175b38b26320308798e2e
          git merge-base --is-ancestor ef3b1b595f6bddd1e660e3215ca19e57254234f3 HEAD
          git diff --check ef3b1b595f6bddd1e660e3215ca19e57254234f3
          git diff --name-only ef3b1b595f6bddd1e660e3215ca19e57254234f3 > /tmp/dashboard-sparks-evidence/changed-files.txt
          python3 - <<'PY'
          from pathlib import Path
          actual = set(Path('/tmp/dashboard-sparks-evidence/changed-files.txt').read_text().splitlines())
          expected = {'src/app/dashboard/page.tsx', 'src/app/dashboard/loading.tsx', 'src/app/dashboard/dashboard-account-security.css', 'src/app/profile/priorities/page.tsx', 'src/components/profile/profile-priorities-view.tsx', 'src/components/profile/profile-priority-editor.tsx', 'src/components/dashboard/dashboard-tools.tsx', 'src/components/dashboard/dashboard-tools.module.css', 'src/lib/dashboard-view.ts', 'src/lib/dashboard-view.test.ts', 'src/lib/dashboard-loading.test.ts', 'tests/dashboard-sparks.spec.ts', 'src/dashboard-account-security-visibility.test.ts', 'tests/dashboard-account-security-visibility.spec.ts', '.github/workflows/dashboard-account-security-hotfix-gates.yml'}
          assert actual == expected, actual ^ expected
          PY
          git diff --exit-code ef3b1b595f6bddd1e660e3215ca19e57254234f3 -- .github/workflows/vercel-release.yml src/lib/supabase src/app/profile/priorities/actions.ts supabase package.json package-lock.json src/lib/app-data.ts
          git rev-parse HEAD > /tmp/dashboard-sparks-evidence/commit.txt
          git diff ef3b1b595f6bddd1e660e3215ca19e57254234f3 > /tmp/dashboard-sparks-evidence/source.patch
          while IFS= read -r file; do cp --parents "$file" /tmp/dashboard-sparks-evidence/source/; done < /tmp/dashboard-sparks-evidence/changed-files.txt
      - run: npm ci
      - name: Focused regressions
        run: node --import tsx --test src/dashboard-account-security-visibility.test.ts src/proxy.test.ts src/lib/dashboard-view.test.ts src/lib/dashboard-loading.test.ts src/lib/profile-priorities.test.ts > /tmp/dashboard-sparks-evidence/focused-tests.log 2>&1
      - name: Full repository tests
        run: npm test > /tmp/dashboard-sparks-evidence/full-tests.log 2>&1
      - name: Lint
        run: npm run lint -- --quiet > /tmp/dashboard-sparks-evidence/lint.log 2>&1
      - name: Typecheck
        run: npx tsc --noEmit > /tmp/dashboard-sparks-evidence/typecheck.log 2>&1
      - name: Production build
        run: npm run build > /tmp/dashboard-sparks-evidence/build.log 2>&1
      - name: Rendered Dashboard flow with isolated local account data
        run: |
          set -euo pipefail
          npx playwright install --with-deps chromium > /tmp/dashboard-sparks-evidence/browser-install.log 2>&1
          cat > /tmp/dashboard-sparks-qa.config.mjs <<'JS'
          export default {
            testDir: `${process.env.GITHUB_WORKSPACE}/tests`,
            testMatch: ['dashboard-sparks.spec.ts', 'dashboard-account-security-visibility.spec.ts'],
            timeout: 60000,
            expect: { timeout: 15000 },
            retries: 0,
            workers: 1,
            use: { baseURL: 'http://127.0.0.1:3210', headless: true, trace: 'retain-on-failure', screenshot: 'only-on-failure' },
            outputDir: '/tmp/dashboard-sparks-evidence/playwright',
          };
          JS
          npm run start -- --hostname 127.0.0.1 --port 3210 > /tmp/dashboard-sparks-evidence/server.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3210/manifest.webmanifest >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3210/manifest.webmanifest >/dev/null
          npx playwright test --config=/tmp/dashboard-sparks-qa.config.mjs --reporter=line > /tmp/dashboard-sparks-evidence/browser.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dashboard-sparks-rendered-qa
          path: /tmp/dashboard-sparks-evidence
          retention-days: 14
