name: PR 552 exact custom-domain production finalizer

on:
  push:
    branches:
      - ops/pr552-alias-finalizer-20260809
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: pr552-exact-custom-domain-finalizer
  cancel-in-progress: false

env:
  CONTROLLER_BRANCH: ops/pr552-alias-finalizer-20260809
  TARGET_SHA: bb3b0e4608b7282aecc9d1fe11b5cb310c409347
  TARGET_DEPLOYMENT_ID: dpl_6VxCNaMke5Mpe7qZjPhD4tdkuyrx
  TARGET_DEPLOYMENT_HOST: moraltrade-site-n12ni5u3j-ellen-s.vercel.app
  ROLLBACK_SHA: 3f158e8ba38a197327e95d1dec660ee8582a9a12
  ROLLBACK_DEPLOYMENT_ID: dpl_B4ct7W3LgbENhXdwgP1ZHtvgAKLp
  ROLLBACK_DEPLOYMENT_HOST: moraltrade-site-r4259n3zo-ellen-s.vercel.app
  VERCEL_PROJECT_ID: prj_Em3j7Uj7RatX2R1ZYhla3XSHRde7
  VERCEL_TEAM_ID: team_ySu6sF3Uho1E1GnJtCQPVEuJ
  VERCEL_CLI_VERSION: 50.38.1
  CANONICAL_ORIGIN: https://www.moraltrade.org
  APEX_ORIGIN: https://moraltrade.org
  OUTPUT_DIR: pr552-alias-finalizer-evidence
  STATUS_CONTEXT: QA / PR552 exact custom-domain release

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Check out the one-use controller
        uses: actions/checkout@v4
        with:
          ref: ops/pr552-alias-finalizer-20260809
          fetch-depth: 0

      - name: Guard exact main parent and controller-only diff
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'ghuser29384/Website2'
          test "$(git branch --show-current)" = "$CONTROLLER_BRANCH"
          test "$(git rev-parse HEAD^)" = "$TARGET_SHA"
          test "$(git rev-parse origin/main)" = "$TARGET_SHA"
          git diff --check "$TARGET_SHA" HEAD
          git diff --name-only "$TARGET_SHA" HEAD | sort > controller-files.txt
          printf '%s\n' '.github/workflows/pr552-alias-finalizer-20260809.yml' > expected-controller-files.txt
          diff -u expected-controller-files.txt controller-files.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies and Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium

      - name: Prove immutable target, rollback deployment, and current alias ownership
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          rm -rf "$OUTPUT_DIR"
          mkdir -p "$OUTPUT_DIR/aliases-before" "$OUTPUT_DIR/aliases-after"

          curl -fsS \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            "https://api.vercel.com/v13/deployments/${TARGET_DEPLOYMENT_ID}?teamId=${VERCEL_TEAM_ID}" \
            > "$OUTPUT_DIR/target-deployment.json"
          jq -e \
            --arg id "$TARGET_DEPLOYMENT_ID" \
            --arg host "$TARGET_DEPLOYMENT_HOST" \
            --arg project "$VERCEL_PROJECT_ID" \
            --arg sha "$TARGET_SHA" '
              ((.uid // .id) == $id)
              and (.url == $host)
              and ((.projectId // .project.id // "") == $project)
              and (.target == "production")
              and ((.readyState // .state // "") == "READY")
              and ((.aliasError // null) == null)
              and (.meta.githubCommitOrg == "ghuser29384")
              and (.meta.githubCommitRepo == "Website2")
              and (.meta.githubCommitSha == $sha)
              and (.meta.moralTradeCandidateSha == $sha)
              and (.meta.releaseReason == "pr552-account-security-production-after-serial-differential")
            ' "$OUTPUT_DIR/target-deployment.json" >/dev/null

          curl -fsS \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            "https://api.vercel.com/v13/deployments/${ROLLBACK_DEPLOYMENT_ID}?teamId=${VERCEL_TEAM_ID}" \
            > "$OUTPUT_DIR/rollback-deployment.json"
          jq -e \
            --arg id "$ROLLBACK_DEPLOYMENT_ID" \
            --arg host "$ROLLBACK_DEPLOYMENT_HOST" \
            --arg project "$VERCEL_PROJECT_ID" \
            --arg sha "$ROLLBACK_SHA" '
              ((.uid // .id) == $id)
              and (.url == $host)
              and ((.projectId // .project.id // "") == $project)
              and (.target == "production")
              and ((.readyState // .state // "") == "READY")
              and ((.aliasError // null) == null)
              and (.meta.githubCommitSha == $sha)
            ' "$OUTPUT_DIR/rollback-deployment.json" >/dev/null

          for alias_name in moraltrade.org www.moraltrade.org; do
            alias_key="${alias_name//./-}"
            curl -fsS \
              -H "Authorization: Bearer ${VERCEL_TOKEN}" \
              "https://api.vercel.com/v4/aliases/${alias_name}?projectId=${VERCEL_PROJECT_ID}&teamId=${VERCEL_TEAM_ID}" \
              > "$OUTPUT_DIR/aliases-before/${alias_key}.json"
            jq -e \
              --arg alias "$alias_name" \
              --arg project "$VERCEL_PROJECT_ID" \
              --arg deployment "$ROLLBACK_DEPLOYMENT_ID" '
                (.alias == $alias)
                and (.projectId == $project)
                and ((.deploymentId // .deployment.id // .deployment.uid // "") == $deployment)
              ' "$OUTPUT_DIR/aliases-before/${alias_key}.json" >/dev/null
          done

          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' \
            "$VERCEL_TEAM_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json

      - name: Move both aliases, run the exact live canary, or roll back automatically
        shell: bash
        run: |
          set -euo pipefail
          release_committed=false
          rollback_attempted=false

          set_alias() {
            local deployment_host="$1"
            local alias_name="$2"
            npx --yes "vercel@${VERCEL_CLI_VERSION}" alias set \
              "$deployment_host" \
              "$alias_name" \
              --token="$VERCEL_TOKEN"
          }

          poll_aliases() {
            local expected_deployment="$1"
            local phase="$2"
            local phase_dir="$OUTPUT_DIR/${phase}"
            mkdir -p "$phase_dir"

            for attempt in $(seq 1 40); do
              local ready=true
              for alias_name in moraltrade.org www.moraltrade.org; do
                local alias_key="${alias_name//./-}"
                local alias_path="$phase_dir/${alias_key}.json"
                if ! curl -fsS \
                  -H "Authorization: Bearer ${VERCEL_TOKEN}" \
                  "https://api.vercel.com/v4/aliases/${alias_name}?projectId=${VERCEL_PROJECT_ID}&teamId=${VERCEL_TEAM_ID}" \
                  > "$alias_path"; then
                  ready=false
                  break
                fi
                if ! jq -e \
                  --arg alias "$alias_name" \
                  --arg project "$VERCEL_PROJECT_ID" \
                  --arg deployment "$expected_deployment" '
                    (.alias == $alias)
                    and (.projectId == $project)
                    and ((.deploymentId // .deployment.id // .deployment.uid // "") == $deployment)
                  ' "$alias_path" >/dev/null; then
                  ready=false
                  break
                fi
              done
              if [[ "$ready" == true ]]; then
                return 0
              fi
              sleep 5
            done
            return 1
          }

          rollback() {
            local original_status=$?
            if [[ "$release_committed" != true ]]; then
              rollback_attempted=true
              echo 'Release verification failed; restoring both custom domains to the proven rollback deployment.' >&2
              set +e
              set_alias "$ROLLBACK_DEPLOYMENT_HOST" moraltrade.org
              rollback_apex=$?
              set_alias "$ROLLBACK_DEPLOYMENT_HOST" www.moraltrade.org
              rollback_www=$?
              poll_aliases "$ROLLBACK_DEPLOYMENT_ID" aliases-rollback
              rollback_poll=$?
              set -e
              jq -n \
                --argjson apexCode "$rollback_apex" \
                --argjson wwwCode "$rollback_www" \
                --argjson pollCode "$rollback_poll" \
                --arg completedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                '{apexCode:$apexCode,wwwCode:$wwwCode,pollCode:$pollCode,completedAt:$completedAt}' \
                > "$OUTPUT_DIR/rollback-result.json"
              if [[ "$rollback_apex" -ne 0 || "$rollback_www" -ne 0 || "$rollback_poll" -ne 0 ]]; then
                echo 'CRITICAL: automatic alias rollback did not verify cleanly.' >&2
              fi
            fi
            exit "$original_status"
          }
          trap rollback EXIT

          {
            echo "targetDeployment=$TARGET_DEPLOYMENT_ID"
            echo "targetSha=$TARGET_SHA"
            echo "startedAt=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > "$OUTPUT_DIR/release-start.txt"

          set_alias "$TARGET_DEPLOYMENT_HOST" moraltrade.org \
            2>&1 | tee "$OUTPUT_DIR/alias-set-apex.log"
          set_alias "$TARGET_DEPLOYMENT_HOST" www.moraltrade.org \
            2>&1 | tee "$OUTPUT_DIR/alias-set-www.log"
          poll_aliases "$TARGET_DEPLOYMENT_ID" aliases-after

          curl -fsS \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            "https://api.vercel.com/v13/deployments/${TARGET_DEPLOYMENT_ID}?teamId=${VERCEL_TEAM_ID}" \
            > "$OUTPUT_DIR/target-deployment-after-alias.json"
          jq -e \
            --arg id "$TARGET_DEPLOYMENT_ID" \
            --arg project "$VERCEL_PROJECT_ID" \
            --arg sha "$TARGET_SHA" '
              ((.uid // .id) == $id)
              and ((.projectId // .project.id // "") == $project)
              and (.target == "production")
              and ((.readyState // .state // "") == "READY")
              and ((.aliasError // null) == null)
              and (.meta.githubCommitSha == $sha)
            ' "$OUTPUT_DIR/target-deployment-after-alias.json" >/dev/null

          CANARY_OUTPUT_DIR="$OUTPUT_DIR/complete-profile-canary" \
          EXPECTED_SHA="$TARGET_SHA" \
          EXPECTED_DEPLOYMENT_ID="$TARGET_DEPLOYMENT_ID" \
          CANONICAL_ORIGIN="$CANONICAL_ORIGIN" \
          APEX_ORIGIN="$APEX_ORIGIN" \
            node .github/scripts/complete-profile-production-canary.mjs

          jq -e '
            (.status == "passed")
            and (([.scenarios[] | select(.status == "passed")] | length) == 6)
            and ((.pageErrors // []) | length == 0)
            and ((.consoleErrors // []) | length == 0)
          ' "$OUTPUT_DIR/complete-profile-canary/report.json" >/dev/null

          canonical_dashboard_status="$(curl -sS -L --max-time 60 \
            -D "$OUTPUT_DIR/www-dashboard.headers" \
            -o "$OUTPUT_DIR/www-dashboard.html" \
            -w '%{http_code}' \
            "$CANONICAL_ORIGIN/dashboard#account-security")"
          test "$canonical_dashboard_status" = '200'
          grep -Fq 'Moral Trade' "$OUTPUT_DIR/www-dashboard.html"

          poll_aliases "$TARGET_DEPLOYMENT_ID" aliases-final
          release_committed=true
          trap - EXIT

          jq -n \
            --arg targetDeploymentId "$TARGET_DEPLOYMENT_ID" \
            --arg targetSha "$TARGET_SHA" \
            --arg rollbackDeploymentId "$ROLLBACK_DEPLOYMENT_ID" \
            --arg completedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson scenariosPassed "$(jq '[.scenarios[] | select(.status == "passed")] | length' "$OUTPUT_DIR/complete-profile-canary/report.json")" \
            '{status:"passed",targetDeploymentId:$targetDeploymentId,targetSha:$targetSha,rollbackDeploymentId:$rollbackDeploymentId,scenariosPassed:$scenariosPassed,aliasesVerified:true,completedAt:$completedAt}' \
            > "$OUTPUT_DIR/final-report.json"

      - name: Publish exact release status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "$OUTPUT_DIR/final-report.json" ]] \
            && jq -e '.status == "passed"' "$OUTPUT_DIR/final-report.json" >/dev/null; then
            state=success
            description='Exact deployment now serves both domains and passed the six-scenario canary'
          else
            state=failure
            description='Custom-domain finalizer failed; automatic rollback evidence must be inspected'
          fi
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            -f state="$state" \
            -f context="$STATUS_CONTEXT" \
            -f description="$description" \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Summarize release
        if: always()
        shell: bash
        run: |
          {
            echo '## PR 552 exact custom-domain finalizer'
            echo
            echo "- Target SHA: \`$TARGET_SHA\`"
            echo "- Target deployment: \`$TARGET_DEPLOYMENT_ID\`"
            echo "- Rollback deployment: \`$ROLLBACK_DEPLOYMENT_ID\`"
            if [[ -f "$OUTPUT_DIR/final-report.json" ]]; then
              echo "- Result: \`$(jq -r '.status' "$OUTPUT_DIR/final-report.json")\`"
              echo "- Complete Profile scenarios: \`$(jq -r '.scenariosPassed' "$OUTPUT_DIR/final-report.json")/6\`"
            elif [[ -f "$OUTPUT_DIR/rollback-result.json" ]]; then
              echo '- Result: `failed; rollback attempted`'
              echo "- Rollback verification code: \`$(jq -r '.pollCode' "$OUTPUT_DIR/rollback-result.json")\`"
            else
              echo '- Result: `failed before alias mutation`'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload exact release and rollback evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr552-alias-finalizer-${{ github.run_id }}
          path: |
            pr552-alias-finalizer-evidence
            controller-files.txt
            expected-controller-files.txt
          if-no-files-found: warn
          retention-days: 30
