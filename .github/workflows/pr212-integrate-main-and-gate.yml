name: PR 212 integrate pinned main and gate

on:
  push:
    branches:
      - agent/pr212-main-integration-ops-20260730
    paths:
      - .github/workflows/pr212-integrate-main-and-gate.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pr212-integrate-pinned-main
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      REPOSITORY: ghuser29384/Website2
      CLEAN_BRANCH: agent/pr212-clean-reconstruction-20260730
      CLEAN_HEAD: e9ba649a4e6bfffcbaac572fb2c5e52f83e3f01e
      PINNED_MAIN: 36650b48f9e664ea6d67c0840cf6a803060e8d7c
      INTEGRATED_BRANCH: agent/pr212-main-integrated-20260731
    steps:
      - name: Check out exact clean reconstruction on integration branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.INTEGRATED_BRANCH }}
          fetch-depth: 0

      - name: Verify immutable integration inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CLEAN_HEAD"
          git fetch --no-tags origin main "$CLEAN_BRANCH" "$INTEGRATED_BRANCH"
          test "$(git rev-parse "origin/${CLEAN_BRANCH}")" = "$CLEAN_HEAD"
          test "$(git rev-parse origin/main)" = "$PINNED_MAIN"
          git merge-base --is-ancestor bb32b5c5a58442f97bef642be58ed01a57f0d91b "$CLEAN_HEAD"
          git merge-base --is-ancestor bb32b5c5a58442f97bef642be58ed01a57f0d91b "$PINNED_MAIN"

      - name: Merge pinned main and resolve only the reviewed conflicts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          set +e
          git merge --no-ff --no-commit "$PINNED_MAIN" > /tmp/merge-stdout.txt 2> /tmp/merge-stderr.txt
          merge_status=$?
          set -e

          git diff --name-only --diff-filter=U | sort > /tmp/conflicts.txt
          cat > /tmp/expected-conflicts.txt <<'FILES'
          src/app/offers/offer-visual-directory-mount.tsx
          src/components/profile/complete-profile-connections.tsx
          src/lib/crawlability.test.ts
          src/lib/public-route-smoke.test.ts
          FILES
          sort -o /tmp/expected-conflicts.txt /tmp/expected-conflicts.txt
          diff -u /tmp/expected-conflicts.txt /tmp/conflicts.txt
          test "$merge_status" -ne 0

          # Decisions 1A and 2A: retain current-main runtime and test behavior.
          git checkout "$PINNED_MAIN" -- \
            src/app/offers/offer-visual-directory-mount.tsx \
            src/components/profile/complete-profile-connections.tsx \
            src/lib/crawlability.test.ts \
            src/lib/public-route-smoke.test.ts

          # Decision 3A: remove only stale non-institutional clean changes that are not
          # required for institutional behavior or absolute repository gates.
          git checkout "$PINNED_MAIN" -- \
            src/app/complete-profile/page.tsx \
            src/app/how-it-works/page.tsx \
            src/app/offers/offer-plane-inline-mount.tsx

          test -z "$(git diff --name-only --diff-filter=U)"
          ! git grep -nE '^(<<<<<<<|=======|>>>>>>>)' -- . ':!package-lock.json'

      - name: Apply narrow current-main TypeScript corrections required by the absolute gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          public_route = Path("src/lib/public-route-smoke.test.ts")
          text = public_route.read_text()
          old = '''function flattenPrimaryNavHrefs() {
            return getPrimaryNavLinks(false).flatMap((link) =>
              "items" in link && link.items
                ? link.items.map((item) => item.href)
                : "href" in link && link.href
                  ? [link.href]
                  : [],
            );
          }
          '''
          new = '''interface RegressionPrimaryNavItem {
            href: string;
          }

          interface RegressionPrimaryNavEntry {
            href?: string;
            items?: readonly RegressionPrimaryNavItem[];
          }

          function flattenPrimaryNavHrefs(): string[] {
            const links = getPrimaryNavLinks(false) as readonly RegressionPrimaryNavEntry[];
            return links.flatMap((link) =>
              link.items?.map((item) => item.href) ?? (link.href ? [link.href] : []),
            );
          }
          '''
          if text.count(old) != 1:
              raise SystemExit(f"Expected one current-main nav flattener, found {text.count(old)}")
          public_route.write_text(text.replace(old, new))

          failure_bonus = Path("src/lib/mpgf/failure-bonus-operator.test.ts")
          text = failure_bonus.read_text()
          old = '  if (!result.ok) throw new Error(result.errors.join(" "));\n'
          new = '  if (!result.ok) throw new Error("Expected a valid failure-bonus quote.");\n'
          if text.count(old) != 1:
              raise SystemExit(f"Expected one unreachable error access, found {text.count(old)}")
          failure_bonus.write_text(text.replace(old, new))

          training = Path("src/lib/recommendation-training-execution.test.ts")
          text = training.read_text()
          replacements = [
              (
                  '    { VERCEL_DEPLOYMENT_ID: "dpl_canonical" },\n',
                  '    { NODE_ENV: "test", VERCEL_DEPLOYMENT_ID: "dpl_canonical" },\n',
                  1,
              ),
              (
                  '    canonicalRuntime,\n    {},\n',
                  '    canonicalRuntime,\n    { NODE_ENV: "test" },\n',
                  2,
              ),
          ]
          for old, new, expected in replacements:
              if text.count(old) != expected:
                  raise SystemExit(f"Expected {expected} occurrences of {old!r}, found {text.count(old)}")
              text = text.replace(old, new)
          training.write_text(text)
          PY

          git add -A
          git diff --cached --check

      - name: Enforce reviewed post-audit diff inventory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p pr212-main-integration-evidence
          cat > /tmp/expected-main-diff.txt <<'FILES'
          .env.example
          .github/scripts/institutional-differential-typecheck.sh
          .github/scripts/institutional-trade-qa-e2e.mjs
          .github/workflows/institutional-trade-qa.yml
          .github/workflows/pr212-clean-reconstruction-gates.yml
          src/app/admin/institutional-deal-desk/page.tsx
          src/app/admin/page.tsx
          src/app/institutions/[organizationId]/deals/[dealId]/page.tsx
          src/app/institutions/[organizationId]/page.tsx
          src/app/institutions/actions.ts
          src/app/institutions/consents/[consentId]/page.tsx
          src/app/institutions/individual/deals/[dealId]/page.tsx
          src/app/institutions/individual/page.tsx
          src/app/institutions/institutions.module.css
          src/app/institutions/new/page.tsx
          src/app/institutions/page.tsx
          src/app/institutions/verifier-assignments/[assignmentId]/page.tsx
          src/components/institutions/institutional-deal-workspace.tsx
          src/components/institutions/institutional-organization-administration.tsx
          src/components/institutions/institutional-pool-workspace.tsx
          src/components/institutions/institutional-ui.tsx
          src/institutional-authorization-snapshot.test.ts
          src/institutional-individual-capacity.test.ts
          src/institutional-product-completeness.test.ts
          src/institutional-trade-migration.test.ts
          src/institutional-trade-wiring.test.ts
          src/lib/discovery-ranking.test.ts
          src/lib/funding.test.ts
          src/lib/institutional-data.ts
          src/lib/institutional-feature-gates.ts
          src/lib/institutional-trade.test.ts
          src/lib/institutional-trade.ts
          src/lib/institutional-webhooks.test.ts
          src/lib/institutional-webhooks.ts
          src/lib/mpgf/failure-bonus-operator.test.ts
          src/lib/payments/conditional-state.test.ts
          src/lib/public-route-smoke.test.ts
          src/lib/recommendation-training-execution.test.ts
          src/lib/x-profile-connector.test.ts
          supabase/migrations/20260726123000_institutional_trade_system.sql
          tsconfig.json
          FILES
          sort -o /tmp/expected-main-diff.txt /tmp/expected-main-diff.txt
          git diff --cached --name-only "$PINNED_MAIN" | sort > /tmp/actual-main-diff.txt
          diff -u /tmp/expected-main-diff.txt /tmp/actual-main-diff.txt

          {
            echo "clean_head=$CLEAN_HEAD"
            echo "pinned_main=$PINNED_MAIN"
            echo "merge_base=$(git merge-base "$CLEAN_HEAD" "$PINNED_MAIN")"
            echo "conflict_policy=take current main for both runtime conflicts and both test conflicts"
            echo "non_institutional_policy=preserve current main unless a narrow correction is required for absolute TypeScript, ESLint, or build success"
            echo
            echo "=== RETAINED DIFF RELATIVE TO PINNED MAIN ==="
            cat /tmp/actual-main-diff.txt
            echo
            echo "=== RESET TO PINNED MAIN ==="
            printf '%s\n' \
              src/app/complete-profile/page.tsx \
              src/app/how-it-works/page.tsx \
              src/app/offers/offer-plane-inline-mount.tsx \
              src/app/offers/offer-visual-directory-mount.tsx \
              src/components/profile/complete-profile-connections.tsx \
              src/lib/crawlability.test.ts
            echo
            echo "=== RETAINED SO ABSOLUTE GATES REMAIN GREEN ==="
            printf '%s\n' \
              src/lib/discovery-ranking.test.ts \
              src/lib/funding.test.ts \
              src/lib/mpgf/failure-bonus-operator.test.ts \
              src/lib/payments/conditional-state.test.ts \
              src/lib/public-route-smoke.test.ts \
              src/lib/recommendation-training-execution.test.ts \
              src/lib/x-profile-connector.test.ts \
              tsconfig.json
          } > pr212-main-integration-evidence/audit.txt
          cp /tmp/merge-stdout.txt pr212-main-integration-evidence/merge-stdout.txt
          cp /tmp/merge-stderr.txt pr212-main-integration-evidence/merge-stderr.txt
          cp /tmp/conflicts.txt pr212-main-integration-evidence/conflicts.txt
          git diff --cached --stat "$PINNED_MAIN" > pr212-main-integration-evidence/diff-stat.txt
          git diff --cached --binary "$PINNED_MAIN" > pr212-main-integration-evidence/integrated-versus-main.diff

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies with transient-registry retry
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            if npm ci; then exit 0; fi
            if (( attempt == 4 )); then exit 1; fi
            sleep $((attempt * 20))
          done

      - name: Run institutional and conflict-adjacent source contracts
        shell: bash
        run: |
          set -euo pipefail
          node --import tsx --test \
            src/institutional-authorization-snapshot.test.ts \
            src/institutional-individual-capacity.test.ts \
            src/institutional-product-completeness.test.ts \
            src/institutional-trade-migration.test.ts \
            src/institutional-trade-wiring.test.ts \
            src/lib/institutional-trade.test.ts \
            src/lib/institutional-webhooks.test.ts \
            src/lib/crawlability.test.ts \
            src/lib/public-route-smoke.test.ts
          node --check .github/scripts/institutional-trade-qa-e2e.mjs

      - name: Require absolute TypeScript success
        run: npx tsc --noEmit --pretty false

      - name: Require absolute ESLint success
        run: npm run lint

      - name: Require absolute production build success
        run: npm run build

      - name: Commit and publish the integrated branch
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git commit -m "Integrate PR 212 reconstruction with pinned current main"
          integrated_head="$(git rev-parse HEAD)"
          integrated_tree="$(git rev-parse HEAD^{tree})"
          {
            echo "integrated_head=$integrated_head"
            echo "integrated_tree=$integrated_tree"
          } | tee pr212-main-integration-evidence/integrated-commit.txt
          git push origin "HEAD:${INTEGRATED_BRANCH}"

      - name: Upload merge and gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr212-main-integrated-${{ github.run_id }}
          path: pr212-main-integration-evidence
          if-no-files-found: warn
          retention-days: 14
