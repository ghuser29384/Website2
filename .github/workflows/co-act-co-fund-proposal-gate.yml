name: Co-Act and Co-Fund proposal gate

on:
  push:
    branches:
      - feature/co-act-co-fund-create-v2-20260801

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: co-act-co-fund-proposal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4
        with:
          ref: feature/co-act-co-fund-create-v2-20260801
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Normalize numeric input step attributes
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/lib/create-interface/group-contribution-client.ts')
          text = path.read_text()
          text = text.replace(
              'state.baselineQuantity, 0, 1_000_000, "number")',
              'state.baselineQuantity, 0, 1_000_000, "any")',
          )
          text = text.replace(
              '0, 0, 100, "number", true)',
              '0, 0, 100, "1", true)',
          )
          text = text.replace(
              'state.redistributionMaximumQuantity, 0, 1_000_000, "number")',
              'state.redistributionMaximumQuantity, 0, 1_000_000, "any")',
          )
          path.write_text(text)
          PY

      - name: Focused domain contracts
        run: node --import tsx --test src/lib/create-interface/group-contribution.test.ts src/lib/create-interface/group-contribution-draft.test.ts

      - name: Focused lint
        run: npx eslint src/instrumentation-client.ts src/lib/create-interface/group-contribution.ts src/lib/create-interface/group-contribution-draft.ts src/lib/create-interface/group-contribution-client.ts src/lib/create-interface/group-contribution.test.ts src/lib/create-interface/group-contribution-draft.test.ts

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Complete repository tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Remove temporary gate and commit normalized product source
        run: |
          rm .github/workflows/co-act-co-fund-proposal-gate.yml
          git add src/instrumentation-client.ts src/lib/create-interface/group-contribution.ts src/lib/create-interface/group-contribution-draft.ts src/lib/create-interface/group-contribution-client.ts src/lib/create-interface/group-contribution.test.ts src/lib/create-interface/group-contribution-draft.test.ts .github/workflows/co-act-co-fund-proposal-gate.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Validate proposal-only group contribution controls'
          git push origin HEAD:feature/co-act-co-fund-create-v2-20260801
