name: Custom Route current diagnostic c2d90782

on:
  pull_request:
    paths:
      - ".github/workflows/custom-route-current-diagnostic-c2d90782.yml"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: custom-route-current-diagnostic-c2d90782
  cancel-in-progress: true

env:
  PRODUCT_SHA: c2d907827c4c7086fb66973bbe3d9619f1856f99
  CONTROLLER_BRANCH: qa/custom-route-current-diagnostic-c2d90782
  CONTROLLER_PATH: .github/workflows/custom-route-current-diagnostic-c2d90782.yml
  EVIDENCE_DIR: custom-route-current-diagnostic-c2d90782
  NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3210
  SITE_URL: http://127.0.0.1:3210
  PLAYWRIGHT_HTML_OPEN: never

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 55

    steps:
      - name: Guard immutable product and one-file controller scope
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'ghuser29384/Website2'
          test '${{ github.event.pull_request.head.ref }}' = "$CONTROLLER_BRANCH"
          test '${{ github.event.pull_request.base.ref }}' = 'main'
          test '${{ github.event.pull_request.base.sha }}' = "$PRODUCT_SHA"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)" = "$PRODUCT_SHA"
          actual_files="$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/pulls/${{ github.event.pull_request.number }}/files?per_page=100" \
            --jq '.[].filename')"
          test "$actual_files" = "$CONTROLLER_PATH"

      - name: Check out immutable current main
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PRODUCT_SHA }}
          fetch-depth: 1

      - name: Prove checkout and replacement source boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          test -f public/moral-trade-live-custom-route.js
          test -f public/moral-trade-live-route-recommendations.js
          test -f tests/exact-live-custom-route.spec.ts
          grep -F 'if (window.__MT_LIVE_NOW_BOOTSTRAP__?.routePlanner) return;' \
            public/moral-trade-live-custom-route.js
          mkdir -p "$EVIDENCE_DIR"
          printf '%s\n' "$PRODUCT_SHA" > "$EVIDENCE_DIR/product-sha.txt"
          sed -n '1,20p' public/moral-trade-live-custom-route.js \
            > "$EVIDENCE_DIR/custom-route-source-boundary.txt"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies and Chromium
        shell: bash
        run: |
          set -o pipefail
          npm ci 2>&1 | tee "$EVIDENCE_DIR/npm-ci.log"
          npx playwright install --with-deps chromium \
            2>&1 | tee "$EVIDENCE_DIR/playwright-install.log"

      - name: Write bounded replacement diagnostic
        shell: bash
        run: |
          set -euo pipefail
          cat > tests/custom-route-current-diagnostic-c2d90782.spec.ts <<'TS'
          import { mkdir, writeFile } from "node:fs/promises";
          import path from "node:path";

          import { expect, test, type Page } from "@playwright/test";

          const evidenceDir = process.env.EVIDENCE_DIR ?? "custom-route-current-diagnostic-c2d90782";

          type PlannerStatus = "ready" | "signed_out";

          function routePlanner(status: PlannerStatus) {
            return {
              status,
              checkedAt: "2026-08-08T08:00:00.000Z",
              profile:
                status === "ready"
                  ? {
                      goal: "Reduce preventable animal suffering",
                      causePriorities: ["Animal welfare"],
                      moneyBudgetCents: 4_000,
                      timeBudgetMinutes: 60,
                      actionBudgetCount: 3,
                      horizon: "month",
                      routeFormats: ["direct", "personal"],
                      evidencePreference: "high",
                      uncertaintyPreference: "balanced",
                      interactionPreference: "open",
                      privacyPreference: "private",
                      plannedDonationBaseline: false,
                      plannedDonationCents: 0,
                      otherwiseBaseline: "I would make no additional donation this month.",
                      calibrationCount: 0,
                      interviewCompleted: false,
                    }
                  : {},
              needsMoreInput: [],
              routes:
                status === "ready"
                  ? [
                      {
                        id: "best-fit",
                        label: "Best fit",
                        summary: "Fund a verified animal-welfare review",
                        metrics: { fit: 91, friction: 24, evidence: 88, coordination: 72 },
                        steps: [
                          {
                            sourceId: "offer-animal",
                            sourceType: "offer",
                            title: "Open animal-welfare review offer",
                            detail: "Review the current verified terms.",
                            href: "/offers/offer-animal",
                            costCents: 1_000,
                            timeMinutes: 10,
                            evidenceLabel: "Public receipt",
                            live: true,
                            why: "Fits the stated goal, limits, and evidence preference.",
                          },
                        ],
                        uncertainties: ["The source may close before you act."],
                      },
                    ]
                  : [],
              comparison: null,
              candidateCount: status === "ready" ? 1 : 0,
            };
          }

          async function mockState(page: Page, status: PlannerStatus) {
            const authenticated = status === "ready";
            await page.route("**/api/live-account", async (route) => {
              await route.fulfill({
                contentType: "application/json",
                body: JSON.stringify({
                  authenticated,
                  profile: authenticated
                    ? { displayName: "Diagnostic user", username: "diagnostic" }
                    : null,
                }),
              });
            });
            await page.route("**/api/live-now**", async (route) => {
              await route.fulfill({
                contentType: "application/json",
                body: JSON.stringify({
                  authenticated,
                  generatedAt: "2026-08-08T08:00:00.000Z",
                  matchingOpportunityCount: 0,
                  profile: {
                    causes: authenticated ? ["Animal welfare"] : [],
                    weightedCauses: [],
                    openToPayment: authenticated ? true : null,
                    openToPledges: authenticated ? true : null,
                    signalSources: authenticated ? ["profile_priority"] : [],
                    learningEnabled: true,
                  },
                  recentChanges: [],
                  recommendations: [],
                  ownedOpportunities: [],
                  ownedOpportunityCount: 0,
                  status: authenticated ? "no_matches" : "signed_out",
                  routePlanner: routePlanner(status),
                }),
              });
            });
          }

          async function openPlan(page: Page) {
            await page.goto("/moral-trade-live.html#now", { waitUntil: "domcontentloaded" });
            await expect(page.locator("main#app")).toBeVisible({ timeout: 30_000 });
            await page.getByRole("button", { name: "Plan resources" }).click();
            await expect(page.locator('[data-mt-live-route-planner="true"]')).toBeVisible({
              timeout: 30_000,
            });
          }

          async function record(page: Page, label: string) {
            await mkdir(evidenceDir, { recursive: true });
            const state = await page.evaluate(() => {
              const bootstrap = Reflect.get(window, "__MT_LIVE_NOW_BOOTSTRAP__") as
                | { routePlanner?: { status?: string } }
                | undefined;
              const controls = [...document.querySelectorAll("button, a[href], input, select")].map(
                (element) => ({
                  tag: element.tagName.toLowerCase(),
                  text: (element.textContent ?? "").replace(/\s+/g, " ").trim().slice(0, 300),
                  ariaLabel: element.getAttribute("aria-label"),
                  href: element instanceof HTMLAnchorElement ? element.getAttribute("href") : null,
                }),
              );

              return {
                url: location.href,
                title: document.title,
                bodyText: (document.body.textContent ?? "").replace(/\s+/g, " ").trim().slice(0, 12_000),
                routePlannerStatus: bootstrap?.routePlanner?.status ?? null,
                routePlannerVisible: Boolean(
                  document.querySelector('[data-mt-live-route-planner="true"]'),
                ),
                routeCardCount: document.querySelectorAll("[data-mt-live-route-card]").length,
                composerCount: document.querySelectorAll("[data-mt-live-route-composer]").length,
                legacyWorkbenchFlag: Reflect.get(window, "__MT_CUSTOM_ROUTE_WORKBENCH__") ?? null,
                legacyCustomRouteCount: document.querySelectorAll("[data-mt-custom-route]").length,
                legacyResourceMixCount: document.querySelectorAll(
                  '[data-mt-custom-route="resource-mix"]',
                ).length,
                customRouteControls: controls.filter((control) =>
                  /custom route/i.test(`${control.ariaLabel ?? ""} ${control.text}`),
                ),
                legacyLocalStorage: localStorage.getItem("moraltrade.plan-resources.v1"),
                controls,
                dimensions: {
                  innerWidth: window.innerWidth,
                  clientWidth: document.documentElement.clientWidth,
                  scrollWidth: document.documentElement.scrollWidth,
                },
              };
            });
            await writeFile(
              path.join(evidenceDir, `${label}.json`),
              `${JSON.stringify(state, null, 2)}\n`,
              "utf8",
            );
            await page.screenshot({ path: path.join(evidenceDir, `${label}.png`), fullPage: true });
          }

          test("records the authoritative signed-out Plan state despite legacy local storage", async ({
            page,
          }) => {
            await mockState(page, "signed_out");
            await page.addInitScript(() => {
              localStorage.setItem(
                "moraltrade.plan-resources.v1",
                JSON.stringify({ activePeriod: "month", legacyDiagnostic: true }),
              );
            });
            await openPlan(page);
            await expect(page.getByText("Sign in to see your routes.", { exact: true })).toBeVisible();
            await expect(page.getByRole("button", { name: "Custom route", exact: true })).toHaveCount(0);
            await expect(page.locator("[data-mt-custom-route]")).toHaveCount(0);
            await record(page, "signed-out-plan");
          });

          test("records the authenticated authoritative planner and retired legacy workbench", async ({
            page,
          }) => {
            await mockState(page, "ready");
            await openPlan(page);
            await expect(page.locator('[data-mt-live-route-card="best-fit"]')).toBeVisible();
            await expect(page.getByText("Fund a verified animal-welfare review", { exact: true })).toBeVisible();
            await expect(page.getByRole("button", { name: "Custom route", exact: true })).toHaveCount(0);
            await expect(page.locator("[data-mt-custom-route]")).toHaveCount(0);
            await record(page, "ready-planner-desktop");
          });

          test("keeps the authoritative planner within the mobile viewport", async ({ page }) => {
            await page.setViewportSize({ width: 390, height: 844 });
            await mockState(page, "ready");
            await openPlan(page);
            await expect(page.locator('[data-mt-live-route-card="best-fit"]')).toBeVisible();
            const widths = await page.evaluate(() => ({
              inner: window.innerWidth,
              scroll: document.documentElement.scrollWidth,
            }));
            expect(widths.scroll).toBeLessThanOrEqual(widths.inner + 1);
            await record(page, "ready-planner-mobile");
          });
          TS

          npx playwright test tests/custom-route-current-diagnostic-c2d90782.spec.ts --list \
            > "$EVIDENCE_DIR/test-list.txt"

      - name: Run current replacement diagnostic
        shell: bash
        run: |
          set -o pipefail
          rm -rf .next
          npx playwright test tests/custom-route-current-diagnostic-c2d90782.spec.ts \
            --workers=1 --reporter=line \
            2>&1 | tee "$EVIDENCE_DIR/playwright.log"

      - name: Upload immutable diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: custom-route-current-diagnostic-c2d90782
          path: |
            custom-route-current-diagnostic-c2d90782
            test-results
          if-no-files-found: error
          retention-days: 14
