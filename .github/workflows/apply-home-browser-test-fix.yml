name: Apply compact-feed browser test correction

on:
  push:
    branches:
      - feat/smart-query-pipeline
    paths:
      - ".github/workflows/apply-home-browser-test-fix.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out latest feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/smart-query-pipeline
          fetch-depth: 0

      - name: Update the progressive-disclosure assertion
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/exact-live-now-recommendations.spec.ts')
          source = path.read_text('utf-8')
          before = '''    await expect(personalized.getByRole("button", { name: "Easy for me" })).toHaveCount(1);
              await expect(personalized.getByRole("button", { name: "Hard for me" })).toHaveCount(1);'''
          after = '''    const tuneRecommendation = personalized.locator(
                'summary[aria-label="Tune this recommendation"]',
              );
              await expect(tuneRecommendation).toHaveCount(1);
              await tuneRecommendation.click();
              await expect(personalized.getByRole("button", { name: "Easy for me" })).toBeVisible();
              await expect(personalized.getByRole("button", { name: "Hard for me" })).toBeVisible();'''
          if source.count(before) != 1:
              raise SystemExit(f'Expected one stale assertion block, found {source.count(before)}')
          path.write_text(source.replace(before, after), 'utf-8')
          PY

      - name: Commit corrected browser test
        run: |
          git config user.name "moral-trade-query-bot"
          git config user.email "moral-trade-query-bot@users.noreply.github.com"
          git add tests/exact-live-now-recommendations.spec.ts
          git commit -m "Open compact feed controls before asserting feedback actions"
          git push origin HEAD:feat/smart-query-pipeline
