name: PR 796 refund foundation one-use materializer

on:
  push:
    branches:
      - feature/direct-donation-upgrade-refund-safety-709-20260821
    paths:
      - ".github/workflows/pr796-refund-foundation-materialize-20260821.yml"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: read

concurrency:
  group: pr796-refund-foundation-materializer
  cancel-in-progress: true

jobs:
  validate-and-materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: refund_qa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d refund_qa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      GH_TOKEN: ${{ github.token }}
      SCRIPT_DIR: .github/pr796-refund-materializer

    steps:
      - name: Report bounded run start
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/issues/796/comments" \
            --method POST \
            -f body="PR #796 refund-foundation materializer run $GITHUB_RUN_ID started on controller head $GITHUB_SHA. No product or validation claim is made until the run completes."

      - name: Check out exact materializer head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Reconstruct and execute pinned materializer
        id: materialize
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          printf '%s  %s\n' \
            200e64438018ad6e2c62e1a1389f6e1878b5fc28ff7f7230bcf86d638f8cb84a "$SCRIPT_DIR/part-00" \
            ad09d61b79a8d29f0af7911c18dc676f0b7608e02f31d811487c740c75bd0055 "$SCRIPT_DIR/part-01" \
            | sha256sum --check
          cat "$SCRIPT_DIR"/part-* > pr796-materialize.b64
          printf '%s  %s\n' \
            01c9f37e8fef593d94a71e63f1e004d5d47e8e386d7820f7ff989d2dad2d4909 \
            pr796-materialize.b64 | sha256sum --check
          base64 --decode pr796-materialize.b64 | gzip --decompress \
            > pr796-materialize.sh
          printf '%s  %s\n' \
            b54e631da5e628480426228f0119f880af0ca8a5574239b2db2880823bc4b120 \
            pr796-materialize.sh | sha256sum --check
          bash -n pr796-materialize.sh
          bash pr796-materialize.sh

      - name: Package sanitized evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            printf 'deploymentAttempted=false\n'
            printf 'providerRequestAttempted=false\n'
            printf 'checkoutAttempted=false\n'
            printf 'donationAttempted=false\n'
            printf 'remoteDatabaseAddressed=false\n'
            printf 'productionChanged=false\n'
          } > pr796-non-actions.txt
          if [[ -f supabase/migrations/20260821140000_direct_donation_upgrade_provider_refunds.sql \
             && -f supabase/tests/direct_donation_upgrade_provider_refunds.sql ]]; then
            zip -q pr796-refund-foundation-source.zip \
              supabase/migrations/20260821140000_direct_donation_upgrade_provider_refunds.sql \
              supabase/tests/direct_donation_upgrade_provider_refunds.sql \
              src/lib/provider-refund-contract.test.ts \
              docs/provider-review/every-org-donation-upgrade-review-packet.md
            sha256sum pr796-refund-foundation-source.zip \
              > pr796-source-bundle-sha256.txt
          fi

      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr796-refund-foundation-${{ github.run_id }}
          path: |
            pr796-npm-ci.log
            pr796-focused-tests.log
            pr796-repository-tests.log
            pr796-typecheck.log
            pr796-lint.log
            pr796-build.log
            pr796-bootstrap.log
            pr796-migration-chain.log
            pr796-refund-regression.log
            pr796-post-regression-residue.json
            pr796-gate-summary.txt
            materializer-trigger-paths.txt
            materializer-expected-trigger-paths.txt
            pr796-exact-source.txt
            pr796-source-sha256.txt
            pr796-final-expected-paths.txt
            pr796-final-actual-paths.txt
            pr796-final-identity.txt
            pr796-remote-paths.txt
            pr796-non-actions.txt
            pr796-refund-foundation-source.zip
            pr796-source-bundle-sha256.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Report bounded run outcome
        if: always()
        env:
          MATERIALIZE_OUTCOME: ${{ steps.materialize.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          local_head="$(git rev-parse HEAD 2>/dev/null || printf unknown)"
          gh api "repos/$GITHUB_REPOSITORY/issues/796/comments" \
            --method POST \
            -f body="PR #796 refund-foundation materializer run $GITHUB_RUN_ID completed with materialize outcome $MATERIALIZE_OUTCOME and local head $local_head. Inspect the run and sanitized artifact before making any product claim. No deployment, provider request, checkout, donation, remote database, or production action was attempted."

      - name: Require successful controller-free materialization
        if: always()
        env:
          MATERIALIZE_OUTCOME: ${{ steps.materialize.outcome }}
        run: test "$MATERIALIZE_OUTCOME" = success
