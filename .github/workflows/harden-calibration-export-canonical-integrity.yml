name: Harden calibration export canonical integrity

on:
  push:
    branches:
      - feature/evidence-credibility-calibration-export-v1-20260812
    paths:
      - .github/workflows/harden-calibration-export-canonical-integrity.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out export branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/evidence-credibility-calibration-export-v1-20260812

      - name: Add byte-reproducible canonical payloads
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              source = path.read_text(encoding="utf-8")
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement target, found {count}")
              path.write_text(source.replace(old, new), encoding="utf-8")

          migration = Path("supabase/migrations/20260812043000_evidence_credibility_calibration_export_v1.sql")
          replace_once(
              migration,
              """  rows_digest text,\n  manifest_hash text,\n  created_at timestamptz\n)\nlanguage plpgsql\nstable\nsecurity definer\nset search_path = ''\nas $function$\nbegin\n  perform moral_trade_private.require_calibration_audit_administrator();\n\n  return query\n  select\n    export_record.id,\n    export_record.export_schema_version,\n    export_record.analysis_plan_version,\n    export_record.analysis_plan_hash,\n    export_record.source_cutoff_at,\n    export_record.pseudonymization_key_commitment,\n    export_record.row_count,\n    export_record.rows_digest,\n    export_record.manifest_hash,\n    export_record.created_at\n""",
              """  rows_digest text,\n  manifest_hash text,\n  manifest_payload text,\n  created_at timestamptz\n)\nlanguage plpgsql\nstable\nsecurity definer\nset search_path = ''\nas $function$\nbegin\n  perform moral_trade_private.require_calibration_audit_administrator();\n\n  return query\n  select\n    export_record.id,\n    export_record.export_schema_version,\n    export_record.analysis_plan_version,\n    export_record.analysis_plan_hash,\n    export_record.source_cutoff_at,\n    export_record.pseudonymization_key_commitment,\n    export_record.row_count,\n    export_record.rows_digest,\n    export_record.manifest_hash,\n    jsonb_build_object(\n      'exportSchemaVersion', export_record.export_schema_version,\n      'analysisPlanVersion', export_record.analysis_plan_version,\n      'analysisPlanHash', export_record.analysis_plan_hash,\n      'sourceCutoffAt', export_record.source_cutoff_at,\n      'pseudonymizationKeyCommitment', export_record.pseudonymization_key_commitment,\n      'rowCount', export_record.row_count,\n      'rowsDigest', export_record.rows_digest,\n      'rawEvidenceIncluded', false,\n      'rawIdentityIncluded', false,\n      'exactPaymentDataIncluded', false,\n      'shadowOnly', true\n    )::text,\n    export_record.created_at\n""",
          )
          replace_once(
              migration,
              """returns table (\n  row_number integer,\n  row_hash text,\n  observation jsonb\n)\nlanguage plpgsql\nstable\nsecurity definer\nset search_path = ''\nas $function$\nbegin\n  perform moral_trade_private.require_calibration_audit_administrator();\n  if p_limit < 1 or p_limit > 1000 or p_offset < 0 then\n    raise exception 'Invalid calibration-export row page.';\n  end if;\n\n  return query\n  select\n    export_row.row_number,\n    export_row.row_hash,\n    export_row.observation\n""",
              """returns table (\n  row_number integer,\n  row_hash text,\n  observation jsonb,\n  observation_text text\n)\nlanguage plpgsql\nstable\nsecurity definer\nset search_path = ''\nas $function$\nbegin\n  perform moral_trade_private.require_calibration_audit_administrator();\n  if p_limit < 1 or p_limit > 1000 or p_offset < 0 then\n    raise exception 'Invalid calibration-export row page.';\n  end if;\n\n  return query\n  select\n    export_row.row_number,\n    export_row.row_hash,\n    export_row.observation,\n    export_row.observation::text\n""",
          )

          route = Path("src/app/api/admin/evidence-calibration/exports/[exportId]/route.ts")
          replace_once(
              route,
              """  const expectedRows = Number(manifest.row_count ?? 0);\n  if (!Number.isInteger(expectedRows) || expectedRows < 1) {\n    return errorResponse(409, \"The immutable calibration export manifest is malformed.\");\n  }\n\n  const encoder = new TextEncoder();\n""",
              """  const expectedRows = Number(manifest.row_count ?? 0);\n  const manifestCanonical =\n    typeof manifest.manifest_payload === \"string\"\n      ? manifest.manifest_payload\n      : null;\n  if (\n    !Number.isInteger(expectedRows) ||\n    expectedRows < 1 ||\n    !manifestCanonical\n  ) {\n    return errorResponse(409, \"The immutable calibration export manifest is malformed.\");\n  }\n\n  const encoder = new TextEncoder();\n""",
          )
          replace_once(
              route,
              """              manifestHash: manifest.manifest_hash,\n              createdAt: manifest.created_at,\n              rawEvidenceIncluded: false,\n""",
              """              manifestHash: manifest.manifest_hash,\n              manifestCanonical,\n              createdAt: manifest.created_at,\n              rawEvidenceIncluded: false,\n""",
          )
          replace_once(
              route,
              """            const row = asRecord(value);\n            if (!row) throw new Error(\"The immutable export contains a malformed row.\");\n            controller.enqueue(\n              encoder.encode(\n                `${JSON.stringify({\n                  recordType: \"observation\",\n                  rowNumber: row.row_number,\n                  rowHash: row.row_hash,\n                  observation: row.observation,\n                })}\\n`,\n              ),\n            );\n""",
              """            const row = asRecord(value);\n            const observationCanonical =\n              row && typeof row.observation_text === \"string\"\n                ? row.observation_text\n                : null;\n            if (!row || !observationCanonical) {\n              throw new Error(\"The immutable export contains a malformed row.\");\n            }\n            const observation = asRecord(JSON.parse(observationCanonical));\n            if (!observation) {\n              throw new Error(\"The immutable export contains a malformed observation.\");\n            }\n            controller.enqueue(\n              encoder.encode(\n                `${JSON.stringify({\n                  recordType: \"observation\",\n                  rowNumber: row.row_number,\n                  rowHash: row.row_hash,\n                  observation,\n                  observationCanonical,\n                })}\\n`,\n              ),\n            );\n""",
          )

          document = Path("docs/moral-trade/evidence-credibility-calibration-export-v1.md")
          replace_once(
              document,
              """- Line 1 has `recordType = \"manifest\"`.\n- Each subsequent line has `recordType = \"observation\"`, its row number, row hash, and stored observation.\n- The route pages through the immutable rows, checks the emitted count against the manifest, and never uses a service-role client.\n\nThe route performs identity-bound RPC authorization before creating the stream.\n""",
              """- Line 1 has `recordType = \"manifest\"` and includes `manifestCanonical`, the exact PostgreSQL JSONB text whose SHA-256 is `manifestHash`.\n- Each subsequent line has `recordType = \"observation\"`, its row number, row hash, parsed observation, and `observationCanonical`, the exact PostgreSQL JSONB text whose SHA-256 is the row hash.\n- The ordered SHA-256 row hashes, joined with `|`, reproduce `rowsDigest`.\n- The route pages through the immutable rows, checks the emitted count against the manifest, and never uses a service-role client.\n\nThe canonical strings are intentionally retained alongside parsed JSON because ordinary JSON parsing can discard numeric scale and object serialization details. An offline package can therefore verify every row, the ordered dataset digest, and the manifest byte-for-byte without production credentials. The route performs identity-bound RPC authorization before creating the stream.\n""",
          )
          replace_once(
              document,
              """8. row hashes, rows digest, and manifest hash are reproducible;\n""",
              """8. row hashes, rows digest, and manifest hash are reproducible from the downloaded canonical payload strings;\n""",
          )

          contract = Path("src/lib/evidence-credibility-calibration-export-schema-contract.test.ts")
          replace_once(
              contract,
              """test(\"row and manifest integrity are cryptographically bound\", () => {\n""",
              """test(\"row and manifest integrity are cryptographically bound and export-verifiable\", () => {\n""",
          )
          replace_once(
              contract,
              """  assert.match(createExport, /'exactPaymentDataIncluded', false/i);\n});\n\ntest(\"download authorization precedes streaming and never escalates to service role\", () => {\n""",
              """  assert.match(createExport, /'exactPaymentDataIncluded', false/i);\n  assert.match(manifestProjection, /manifest_payload text/i);\n  assert.match(manifestProjection, /jsonb_build_object\\([\\s\\S]*'shadowOnly', true[\\s\\S]*\\)::text/i);\n  assert.match(rowProjection, /observation_text text/i);\n  assert.match(rowProjection, /export_row\\.observation::text/i);\n  assert.match(route, /manifestCanonical/i);\n  assert.match(route, /observationCanonical/i);\n  assert.match(route, /JSON\\.parse\\(observationCanonical\\)/i);\n});\n\ntest(\"download authorization precedes streaming and never escalates to service role\", () => {\n""",
          )

          core = Path("supabase/tests/evidence_credibility_calibration_export_core.sql")
          replace_once(
              core,
              """rollback;\n""",
              """do $test$\ndeclare\n  projected_manifest record;\n  projected_row record;\n  export_id_value uuid := (\n    select object_id from qa_export_objects where object_name = 'export'\n  );\nbegin\n  select * into projected_manifest\n  from public.get_evidence_credibility_calibration_export_manifest_v1(export_id_value);\n  if not found\n     or projected_manifest.manifest_payload is null\n     or encode(\n       extensions.digest(\n         convert_to(projected_manifest.manifest_payload, 'UTF8'),\n         'sha256'\n       ),\n       'hex'\n     ) <> projected_manifest.manifest_hash then\n    raise exception 'The downloaded canonical manifest payload is not self-verifying.';\n  end if;\n\n  select * into projected_row\n  from public.list_evidence_credibility_calibration_export_rows_v1(\n    export_id_value, 1000, 0\n  );\n  if not found\n     or projected_row.observation_text is null\n     or projected_row.observation_text::jsonb is distinct from projected_row.observation\n     or encode(\n       extensions.digest(\n         convert_to(projected_row.observation_text, 'UTF8'),\n         'sha256'\n       ),\n       'hex'\n     ) <> projected_row.row_hash then\n    raise exception 'The downloaded canonical observation payload is not self-verifying.';\n  end if;\nend;\n$test$;\n\nrollback;\n""",
          )
          PY

          git diff --check
          grep -q "manifestCanonical" src/app/api/admin/evidence-calibration/exports/[exportId]/route.ts
          grep -q "observationCanonical" src/app/api/admin/evidence-calibration/exports/[exportId]/route.ts
          grep -q "manifest_payload text" supabase/migrations/20260812043000_evidence_credibility_calibration_export_v1.sql
          grep -q "observation_text text" supabase/migrations/20260812043000_evidence_credibility_calibration_export_v1.sql

      - name: Commit hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/moral-trade/evidence-credibility-calibration-export-v1.md \
            src/app/api/admin/evidence-calibration/exports/[exportId]/route.ts \
            src/lib/evidence-credibility-calibration-export-schema-contract.test.ts \
            supabase/migrations/20260812043000_evidence_credibility_calibration_export_v1.sql \
            supabase/tests/evidence_credibility_calibration_export_core.sql
          git commit -m "fix: make calibration export self-verifying offline"
          git push origin HEAD:feature/evidence-credibility-calibration-export-v1-20260812
