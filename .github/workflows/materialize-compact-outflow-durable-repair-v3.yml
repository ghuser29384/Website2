name: Materialize Compact outflow durable repair v3

on:
  push:
    branches:
      - feature/compact-authoritative-outflow-ledger-v1-20260816
    paths:
      - .github/workflows/materialize-compact-outflow-durable-repair-v3.yml

permissions:
  contents: write

concurrency:
  group: materialize-compact-outflow-durable-repair-v3-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out exact materializer commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Verify bounded authorized lineage
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor de3b6e5480a43cf536c655cc3ad1c69786352382 HEAD
          test "$(git diff --name-only HEAD^...HEAD)" = ".github/workflows/materialize-compact-outflow-durable-repair-v3.yml"

      - name: Materialize durable source repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          assignments = "\n".join([
              "on conflict (id) do update set",
              "  email = excluded.email,",
              "  display_name = excluded.display_name,",
              "  bio = excluded.bio,",
              "  affiliation = excluded.affiliation,",
              "  username = excluded.username,",
              "  account_kind = excluded.account_kind,",
              "  accepts_group_invitations = excluded.accepts_group_invitations,",
              "  public_invitation_mentions_enabled = excluded.public_invitation_mentions_enabled",
          ])

          def make_profile_fixture_idempotent(path: str, end_marker: str) -> None:
              target = Path(path)
              source = target.read_text(encoding="utf-8")
              start = source.index("insert into public.profiles (")
              end = source.index(end_marker, start)
              block = source[start:end]
              if assignments not in block:
                  stripped = block.rstrip()
                  if not stripped.endswith(";"):
                      raise SystemExit(f"{path}: profile fixture does not end in semicolon")
                  block = stripped[:-1] + "\n" + assignments + ";"
                  target.write_text(source[:start] + block + source[end:], encoding="utf-8")

          make_profile_fixture_idempotent(
              "supabase/tests/compact_authoritative_outflow_ledger_core.sql",
              "\n\\echo ledger-core:profiles-inserted",
          )
          make_profile_fixture_idempotent(
              "supabase/tests/compact_authoritative_outflow_ledger_authorization.sql",
              "\n\ninsert into public.trade_review_role_grants",
          )

          phase_order = '''import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          import { join } from "node:path";
          import test from "node:test";

          const workflow = readFileSync(
            join(
              process.cwd(),
              ".github/workflows/compact-authoritative-outflow-ledger-qa.yml",
            ),
            "utf8",
          );

          function position(marker: string): number {
            const index = workflow.indexOf(marker);
            assert.notEqual(index, -1, `Missing workflow phase: ${marker}`);
            return index;
          }

          test("clean reconstruction proves legacy Compact behavior before ledger hardening", () => {
            const preLedgerApply = position(
              "Apply baseline and every production-compatible pre-ledger migration",
            );
            const legacyRegression = position(
              "Run legacy Compact regressions before ledger authority hardening",
            );
            const ledgerApply = position(
              "Apply the four authoritative-ledger migrations in order",
            );
            const finalLedgerSuites = position(
              "Run final authoritative-ledger lifecycle and authorization suites",
            );

            assert.ok(preLedgerApply < legacyRegression);
            assert.ok(legacyRegression < ledgerApply);
            assert.ok(ledgerApply < finalLedgerSuites);
            assert.match(
              workflow,
              /grep -Ev '\\/2026081614150\\[0-3\\]_compact_authoritative_outflow_\\.\\*\\\\\\.sql\\$'/,
            );
            assert.match(workflow, /test "\\$\\(wc -l < compact-outflow-clean\\/ledger-migrations\\.txt\\)" -eq 4/);
          });

          test("isolated QA keeps both schema phases in one outer rollback", () => {
            const orderedLifecycle = position(
              "Execute ordered rollback-only legacy and authoritative-ledger lifecycles",
            );
            const rollbackProof = position("Prove rollback and zero fixture residue");
            const orderedBody = workflow.slice(orderedLifecycle, rollbackProof);

            assert.match(orderedBody, /begin;/);
            assert.match(orderedBody, /savepoint legacy_compact_lifecycle;/);
            assert.match(
              orderedBody,
              /rollback to savepoint legacy_compact_lifecycle;/,
            );
            assert.match(
              orderedBody,
              /mpgf_public_goods_compacts_historical_freeze\\.sql/,
            );
            assert.match(
              orderedBody,
              /20260816141500_compact_authoritative_outflow_ledger_v1\\.sql/,
            );
            assert.match(orderedBody, /savepoint authoritative_ledger_core;/);
            assert.match(
              orderedBody,
              /compact_authoritative_outflow_ledger_authorization\\.sql/,
            );
            assert.match(orderedBody, /\\n          rollback;\\n          SQL/);

            const legacyTest = orderedBody.indexOf(
              "mpgf_public_goods_compacts_lifecycle.sql",
            );
            const firstLedgerMigration = orderedBody.indexOf(
              "20260816141500_compact_authoritative_outflow_ledger_v1.sql",
            );
            const ledgerTest = orderedBody.indexOf(
              "compact_authoritative_outflow_ledger_core.sql",
            );
            assert.ok(legacyTest >= 0 && legacyTest < firstLedgerMigration);
            assert.ok(firstLedgerMigration < ledgerTest);
          });

          test("rollback suites are normalized without weakening their source envelopes", () => {
            assert.match(
              workflow,
              /expected one rollback-only transaction envelope/i,
            );
            assert.match(workflow, /unexpected nested begin/i);
            assert.match(workflow, /unexpected nested rollback/i);
            assert.match(
              workflow,
              /compact-outflow-rollback\\/test-bodies\\/compact_authoritative_outflow_ledger_core\\.sql/,
            );
          });
          '''
          phase_order = "\n".join(line[10:] if line.startswith("          ") else line for line in phase_order.splitlines()) + "\n"
          phase_path = Path("src/lib/mpgf/compact-authoritative-outflow-phase-order-contract.test.ts")
          phase_path.parent.mkdir(parents=True, exist_ok=True)
          phase_path.write_text(phase_order, encoding="utf-8")

          path = Path(".github/workflows/compact-authoritative-outflow-ledger-qa.yml")
          source = path.read_text(encoding="utf-8")
          manifest_anchor = "          src/lib/mpgf/compact-authoritative-outflow-contract.test.ts\n"
          manifest_line = "          src/lib/mpgf/compact-authoritative-outflow-phase-order-contract.test.ts\n"
          if manifest_line not in source:
              source = source.replace(manifest_anchor, manifest_anchor + manifest_line, 1)
          focused_anchor = "            src/lib/mpgf/compact-authoritative-outflow-contract.test.ts \\\n"
          focused_line = "            src/lib/mpgf/compact-authoritative-outflow-phase-order-contract.test.ts \\\n"
          if focused_line not in source:
              source = source.replace(focused_anchor, focused_anchor + focused_line, 1)
          source = source.replace('test "$(wc -l < /tmp/actual.txt)" -eq 14', 'test "$(wc -l < /tmp/actual.txt)" -eq 15', 1)
          controller_anchor = '          for controller in .github/workflows/repair-compact-outflow-*.yml; do\n            test ! -e "$controller"\n          done'
          if 'materialize-compact-outflow-durable-repair-v3.yml' not in source:
              source = source.replace(
                  controller_anchor,
                  '          test ! -e .github/workflows/materialize-compact-outflow-durable-repair-v2.yml\n'
                  '          test ! -e .github/workflows/materialize-compact-outflow-durable-repair-v3.yml\n'
                  + controller_anchor,
                  1,
              )
          for old, new in [
              ('psql "$DB_URL" --no-psqlrc --set ON_ERROR_STOP=1 <<\'SQL\' | tee db-evidence/pre-ledger-lifecycle.log', 'psql "$DB_URL" --no-psqlrc --set ON_ERROR_STOP=1 2>&1 <<\'SQL\' | tee db-evidence/pre-ledger-lifecycle.log'),
              ('psql "$DB_URL" --no-psqlrc --set ON_ERROR_STOP=1 <<\'SQL\' | tee db-evidence/ledger-lifecycle.log', 'psql "$DB_URL" --no-psqlrc --set ON_ERROR_STOP=1 2>&1 <<\'SQL\' | tee db-evidence/ledger-lifecycle.log'),
              ('psql "$QA_DB_URL" --no-psqlrc --set ON_ERROR_STOP=1 <<\'SQL\' | tee rollback-evidence/lifecycle.log', 'psql "$QA_DB_URL" --no-psqlrc --set ON_ERROR_STOP=1 2>&1 <<\'SQL\' | tee rollback-evidence/lifecycle.log'),
          ]:
              if old in source:
                  source = source.replace(old, new, 1)
          path.write_text(source, encoding="utf-8")
          PY

          git diff --check
          grep -Fq 'on conflict (id) do update set' supabase/tests/compact_authoritative_outflow_ledger_core.sql
          grep -Fq 'on conflict (id) do update set' supabase/tests/compact_authoritative_outflow_ledger_authorization.sql
          grep -Fq 'compact-authoritative-outflow-phase-order-contract.test.ts' .github/workflows/compact-authoritative-outflow-ledger-qa.yml
          grep -Fq -- '-eq 15' .github/workflows/compact-authoritative-outflow-ledger-qa.yml
          test -f src/lib/mpgf/compact-authoritative-outflow-phase-order-contract.test.ts

      - name: Publish content-addressed Git blobs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p materialized-repair
          : > materialized-repair/blob-shas.tsv
          for path in \
            .github/workflows/compact-authoritative-outflow-ledger-qa.yml \
            src/lib/mpgf/compact-authoritative-outflow-phase-order-contract.test.ts \
            supabase/tests/compact_authoritative_outflow_ledger_core.sql \
            supabase/tests/compact_authoritative_outflow_ledger_authorization.sql
          do
            encoded="$(base64 -w0 "$path")"
            sha="$(jq -n --arg content "$encoded" '{content:$content,encoding:"base64"}' | gh api --method POST "repos/$GITHUB_REPOSITORY/git/blobs" --input - | jq -r .sha)"
            test -n "$sha"
            printf '%s\t%s\n' "$path" "$sha" | tee -a materialized-repair/blob-shas.tsv
            cp --parents "$path" materialized-repair/
          done
          git rev-parse HEAD > materialized-repair/materializer-head.txt
          git rev-parse HEAD^{tree} > materialized-repair/materializer-tree.txt
          git rev-parse HEAD^ > materialized-repair/materializer-parent.txt
          sha256sum \
            .github/workflows/compact-authoritative-outflow-ledger-qa.yml \
            src/lib/mpgf/compact-authoritative-outflow-phase-order-contract.test.ts \
            supabase/tests/compact_authoritative_outflow_ledger_core.sql \
            supabase/tests/compact_authoritative_outflow_ledger_authorization.sql \
            > materialized-repair/file-sha256.txt

      - name: Upload materialized repair evidence
        uses: actions/upload-artifact@v4
        with:
          name: compact-outflow-materialized-repair-v3-${{ github.run_id }}-${{ github.sha }}
          retention-days: 30
          if-no-files-found: error
          path: materialized-repair
