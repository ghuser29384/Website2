name: Remove expired controllers from PR 477

on:
  push:
    branches:
      - ops/dispatch-pr477-vercel-preview-20260806
    paths:
      - .github/workflows/repair-pr477-proposal-gate-20260806.yml

permissions:
  contents: write

concurrency:
  group: remove-expired-controllers-pr477-20260806
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TARGET_BRANCH: feature/co-act-co-fund-create-v3-20260803
      EXPECTED_HEAD: 5474599a26606a3ca4bad094b44af89d26a84073
    steps:
      - name: Check out the exact PR 477 candidate
        uses: actions/checkout@v4
        with:
          ref: feature/co-act-co-fund-create-v3-20260803
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Remove expired one-shot controllers
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'ghuser29384/Website2'
          test "$(git branch --show-current)" = "$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

          git rm \
            .github/workflows/pr212-current-main-qa-controller.yml \
            .github/workflows/pr212-push-qa-snapshot-20260804.yml \
            .github/workflows/one-person-browser-redirect-repair-controller-v2.yml

          actual="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/one-person-browser-redirect-repair-controller-v2.yml' \
            '.github/workflows/pr212-current-main-qa-controller.yml' \
            '.github/workflows/pr212-push-qa-snapshot-20260804.yml' \
            | sort)"
          test "$actual" = "$expected"
          git diff --cached --check

      - name: Commit and push the cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Remove expired one-shot controllers'
          git push origin "HEAD:$TARGET_BRANCH"
