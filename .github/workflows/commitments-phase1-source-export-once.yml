name: Commitments Phase 1 source export once

on:
  push:
    branches:
      - feature/commitments-phase1-export-once-20260806
    paths:
      - .github/workflows/commitments-phase1-source-export-once.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Archive tracked source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git archive --format=zip --output=website2-source.zip HEAD

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: commitments-phase1-source-${{ github.sha }}
          path: website2-source.zip
          if-no-files-found: error
          retention-days: 2
