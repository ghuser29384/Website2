name: Build isolated canonical QA preview for PR 326 v2

on:
  push:
    branches:
      - qa/marketplace-delta-exact-head-repair-20260731
    paths:
      - ".github/workflows/pr326-isolated-qa-preview-v2-20260804.yml"

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: pr326-isolated-qa-preview-v2-20260804
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PRODUCT_SHA: 3f6abe2e830eaca3903fa1040dd05a1ed34ae4ef
      PRODUCT_BRANCH: agent/marketplace-delta-current-main-20260729
      RELEASE_RUN_ID: '30918911259'
      VERCEL_ORG_ID: team_ySu6sF3Uho1E1GnJtCQPVEuJ
      VERCEL_PROJECT_ID: prj_Em3j7Uj7RatX2R1ZYhla3XSHRde7
      VERCEL_CLI_VERSION: 50.38.1
      QA_URL: https://hvmxfjjbdcgjjudmthdz.supabase.co
      CONTROLLER_PATH: .github/workflows/pr326-isolated-qa-preview-v2-20260804.yml
    steps:
      - name: Cancel the superseded terminal-wait controller
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?per_page=100")"
          jq -r '.workflow_runs[] | select(.name == "Build isolated canonical QA preview for PR 326") | select(.status == "in_progress" or .status == "queued") | .id' <<<"$runs" \
            | while read -r run_id; do
                [[ -z "$run_id" ]] && continue
                gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/cancel" >/dev/null || true
                echo "Cancelled superseded run $run_id"
              done

      - name: Require exact repository quality gates, not the unrelated global rendered baseline
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for _ in $(seq 1 180); do
            jobs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN_ID/jobs?per_page=100")"
            row="$(jq -r '
              [.jobs[] | select(.name == "release") | .steps[]
               | select(.name == "Run complete repository quality gates")]
              | .[0]
              | if . == null then "missing\tpending" else [.status,(.conclusion // "pending")] | @tsv end
            ' <<<"$jobs")"
            IFS=$'\t' read -r status conclusion <<<"$row"
            echo "quality_step status=$status conclusion=$conclusion"
            if [[ "$status" == completed ]]; then
              [[ "$conclusion" == success ]]
              exit
            fi
            sleep 5
          done
          echo "Exact repository quality step did not complete in time." >&2
          exit 1

      - name: Check out the immutable product candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PRODUCT_SHA }}
          fetch-depth: 0

      - name: Verify exact product identity
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          pr_json="$(gh api "repos/$GITHUB_REPOSITORY/pulls/326")"
          test "$(jq -r '.state' <<<"$pr_json")" = open
          test "$(jq -r '.head.sha' <<<"$pr_json")" = "$PRODUCT_SHA"
          test "$(git ls-remote origin "refs/heads/$PRODUCT_BRANCH" | awk '{print $1}')" = "$PRODUCT_SHA"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Link only the canonical project and pull preview defaults
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          npx --yes "vercel@$VERCEL_CLI_VERSION" pull --yes --environment=preview --token="$VERCEL_TOKEN" >/dev/null

      - name: Build the QA artifact on GitHub Actions compute
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          QA_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.QA_SUPABASE_PUBLISHABLE_KEY }}
          QA_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.QA_SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.QA_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.QA_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.QA_SUPABASE_SERVICE_ROLE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$QA_SUPABASE_PUBLISHABLE_KEY"
          test -n "$QA_SUPABASE_SERVICE_ROLE_KEY"
          npx --yes "vercel@$VERCEL_CLI_VERSION" build \
            --build-env "NEXT_PUBLIC_SUPABASE_URL=$QA_URL" \
            --build-env "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$QA_SUPABASE_PUBLISHABLE_KEY" \
            --build-env "SUPABASE_SERVICE_ROLE_KEY=$QA_SUPABASE_SERVICE_ROLE_KEY" \
            --token="$VERCEL_TOKEN"

      - name: Deploy the prebuilt artifact with deployment-scoped QA values
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          QA_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.QA_SUPABASE_PUBLISHABLE_KEY }}
          QA_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.QA_SUPABASE_SERVICE_ROLE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/deploy-output.txt"
          npx --yes "vercel@$VERCEL_CLI_VERSION" deploy \
            --prebuilt \
            --env "NEXT_PUBLIC_SUPABASE_URL=$QA_URL" \
            --env "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$QA_SUPABASE_PUBLISHABLE_KEY" \
            --env "SUPABASE_SERVICE_ROLE_KEY=$QA_SUPABASE_SERVICE_ROLE_KEY" \
            --meta "qaRole=candidate-moraltrade" \
            --meta "qaSourceSha=$PRODUCT_SHA" \
            --meta "qaSourceRef=$PRODUCT_BRANCH" \
            --meta "qaGateRun=$GITHUB_RUN_ID" \
            --token="$VERCEL_TOKEN" 2>&1 | tee "$output"
          deployment_url="$(grep -Eo 'https://[A-Za-z0-9.-]+\.vercel\.app' "$output" | tail -1)"
          test -n "$deployment_url"
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Verify immutable deployment metadata and publish evidence
        env:
          GH_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
        shell: bash
        run: |
          set -euo pipefail
          host="${DEPLOYMENT_URL#https://}"
          response="$RUNNER_TEMP/deployments.json"
          row=""
          for _ in $(seq 1 180); do
            curl --fail-with-body --silent --show-error \
              --header "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&limit=100&teamId=$VERCEL_ORG_ID" \
              --output "$response"
            row="$(jq -c --arg host "$host" --arg sha "$PRODUCT_SHA" '
              [.deployments[] | select(
                .url == $host
                and (.state // .readyState) == "READY"
                and .meta.qaRole == "candidate-moraltrade"
                and .meta.qaSourceSha == $sha
                and (.target // "preview") != "production"
              )] | sort_by(.created) | reverse | .[0] // empty
            ' "$response")"
            if [[ -n "$row" ]]; then break; fi
            state="$(jq -r --arg host "$host" '[.deployments[] | select(.url == $host)][0].state // "pending"' "$response")"
            [[ "$state" != ERROR && "$state" != CANCELED ]]
            sleep 5
          done
          test -n "$row"
          deployment_id="$(jq -r '.uid // .id' <<<"$row")"
          test "$deployment_id" != null
          mkdir -p qa-preview-evidence
          jq -n --arg id "$deployment_id" --arg url "$DEPLOYMENT_URL" --arg sha "$PRODUCT_SHA" \
            --arg project "$VERCEL_PROJECT_ID" --arg qa_ref hvmxfjjbdcgjjudmthdz \
            '{deploymentId:$id,url:$url,sourceSha:$sha,projectId:$project,qaRef:$qa_ref,target:"preview",runtimeEnvironment:"deployment-scoped"}' \
            > qa-preview-evidence/deployment.json
          gh pr comment 326 --repo "$GITHUB_REPOSITORY" \
            --body "Isolated canonical QA preview is READY for exact candidate \`$PRODUCT_SHA\`: deployment \`$deployment_id\`, URL \`$DEPLOYMENT_URL\`. Build and runtime Supabase values were supplied only to this deployment; project-level preview environment values were not changed."
          gh pr comment 359 --repo "$GITHUB_REPOSITORY" \
            --body "PR #326 isolated canonical QA preview: \`$deployment_id\` at \`$DEPLOYMENT_URL\` for exact candidate \`$PRODUCT_SHA\`."

      - name: Upload isolated deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr326-isolated-canonical-qa-preview-v2-${{ github.run_id }}
          path: qa-preview-evidence
          if-no-files-found: warn
          retention-days: 14

      - name: Remove temporary v2 controller
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/$CONTROLLER_PATH?ref=qa/marketplace-delta-exact-head-repair-20260731" --jq .sha 2>/dev/null || true)"
          if [[ -n "$sha" ]]; then
            jq -n --arg message 'Remove temporary PR 326 isolated QA preview v2 controller' --arg sha "$sha" --arg branch 'qa/marketplace-delta-exact-head-repair-20260731' '{message:$message,sha:$sha,branch:$branch}' \
              | gh api --method DELETE "repos/$GITHUB_REPOSITORY/contents/$CONTROLLER_PATH" --input - >/dev/null
          fi
