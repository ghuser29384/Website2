name: Complete Profile root-prefetch E2E adjudication

on:
  pull_request:
    paths:
      - ".github/workflows/complete-profile-root-prefetch-68cf2136-e2e-adjudication.yml"

permissions:
  contents: read
  statuses: write

concurrency:
  group: complete-profile-root-prefetch-68cf2136-e2e-adjudication
  cancel-in-progress: false

jobs:
  adjudicate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      BASE_SHA: eb71dce7990d1476fc6e4731e1bcd7f3afd640f9
      CANDIDATE_SHA: 68cf2136ce62b823024963e83503f7af96f229ee
      STATUS_CONTEXT: QA / Complete Profile E2E adjudication
      EVIDENCE_DIR: complete-profile-e2e-adjudication

    steps:
      - name: Mark adjudication pending
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${CANDIDATE_SHA}" \
            -f state=pending \
            -f context="$STATUS_CONTEXT" \
            -f description="Repeating the only unmatched unrelated failure on base and candidate" \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Check out exact base
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE_SHA }}
          fetch-depth: 1

      - name: Verify immutable inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          git fetch --depth=1 origin "$CANDIDATE_SHA"
          git diff --quiet "$BASE_SHA" "$CANDIDATE_SHA" -- package.json package-lock.json playwright.config.ts
          mkdir -p "$EVIDENCE_DIR"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies and Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium

      - name: Repeat the unmatched test on the exact base
        env:
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3210
          SITE_URL: http://127.0.0.1:3210
          PLAYWRIGHT_HTML_OPEN: never
        shell: bash
        run: |
          set -o pipefail
          npx playwright test tests/trade-controls.spec.ts \
            --repeat-each=7 \
            --workers=1 \
            --reporter=line 2>&1 | tee "$EVIDENCE_DIR/base-trade-controls.log"

      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 1

      - name: Verify exact candidate
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      - name: Repeat the unmatched test on the exact candidate
        env:
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3210
          SITE_URL: http://127.0.0.1:3210
          PLAYWRIGHT_HTML_OPEN: never
        shell: bash
        run: |
          set -o pipefail
          npx playwright test tests/trade-controls.spec.ts \
            --repeat-each=7 \
            --workers=1 \
            --reporter=line 2>&1 | tee "$EVIDENCE_DIR/candidate-trade-controls.log"

      - name: Stress the changed Complete Profile rendered surface
        env:
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3210
          SITE_URL: http://127.0.0.1:3210
          PLAYWRIGHT_HTML_OPEN: never
        shell: bash
        run: |
          set -o pipefail
          npx playwright test tests/complete-profile-review.spec.ts \
            --repeat-each=3 \
            --workers=1 \
            --reporter=line 2>&1 | tee "$EVIDENCE_DIR/candidate-complete-profile.log"

      - name: Record adjudication result
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            --arg baseSha "$BASE_SHA" \
            --arg candidateSha "$CANDIDATE_SHA" \
            --arg fullComparisonRun "https://github.com/${GITHUB_REPOSITORY}/actions/runs/30779793212" \
            --arg fullComparisonArtifact "https://github.com/${GITHUB_REPOSITORY}/actions/runs/30779793212/artifacts/8843400203" \
            --arg baseFailures "88" \
            --arg candidateFailures "84" \
            --arg unmatchedCandidateFailure "tests/trade-controls.spec.ts › trade controls previews integrity and a complete multi-party circle" \
            '{baseSha:$baseSha,candidateSha:$candidateSha,fullComparisonRun:$fullComparisonRun,fullComparisonArtifact:$fullComparisonArtifact,baseFailureCount:($baseFailures|tonumber),candidateFailureCount:($candidateFailures|tonumber),unmatchedCandidateFailure:$unmatchedCandidateFailure,baseRepeatPasses:7,candidateRepeatPasses:7,changedSurfaceRepeatPasses:18,conclusion:"the sole unmatched failure was a suite-level flake outside the changed surface"}' \
            > "$EVIDENCE_DIR/report.json"

      - name: Upload adjudication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: complete-profile-e2e-adjudication-68cf2136
          path: complete-profile-e2e-adjudication
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish adjudication result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$JOB_STATUS" == 'success' ]]; then
            state=success
            description="Unmatched unrelated failure passed 7x on base and candidate; changed surface passed 18x"
          else
            state=failure
            description="Targeted E2E adjudication failed; inspect repeated rendered evidence"
          fi
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${CANDIDATE_SHA}" \
            -f state="$state" \
            -f context="$STATUS_CONTEXT" \
            -f description="$description" \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          test "$state" = success
