name: Run authoritative pre-activation baseline generation now

on:
  push:
    branches:
      - database/preactivation-schema-baseline-clean-20260819
    paths:
      - .github/workflows/run-preactivation-baseline-generation-now.yml

permissions:
  contents: write

concurrency:
  group: run-preactivation-baseline-generation-now
  cancel-in-progress: false

env:
  TARGET_BRANCH: database/preactivation-schema-baseline-clean-20260819
  EXPECTED_PARENT: 923c3b76222081ece4d84090e1bc408b25d7da02
  SOURCE_MAIN: 26d1fe436dbf9a4440bfafd501ddf8db944a1127
  PROD_POOLER_HOST: aws-1-us-west-2.pooler.supabase.com
  PROD_POOLER_USER: postgres.jnpoxvalyjtdghnperyu
  PROD_SUPABASE_DB_URL: ${{ secrets.PROD_SUPABASE_DB_URL }}

jobs:
  generate-validate-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: database/preactivation-schema-baseline-clean-20260819
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Guard exact branch state
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          git fetch --no-tags origin main "$TARGET_BRANCH"
          test "$(git rev-parse origin/main)" = "$SOURCE_MAIN"
          test "$(git rev-parse "origin/$TARGET_BRANCH")" = "$(git rev-parse HEAD)"
          test -z "$(git status --porcelain)"
          echo "SOURCE_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies and PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Generate through the enforced production read-only boundary
        shell: bash
        run: |
          set -euo pipefail
          test -n "${PROD_SUPABASE_DB_URL:-}"
          bash scripts/database/generate-preactivation-baseline.sh

      - name: Verify source and clean-room contracts
        shell: bash
        run: |
          set -euo pipefail
          node --import tsx --test src/lib/database-preactivation-baseline-contract.test.ts
          npx eslint src/lib/database-preactivation-baseline-contract.test.ts
          git diff --check
          scripts/database/validate-preactivation-baseline.sh \
            "$GITHUB_WORKSPACE/artifacts/preactivation-baseline-clean-room"

      - name: Run complete repository gates
        shell: bash
        run: |
          set -euo pipefail
          npm test
          npm run lint -- --quiet
          npx tsc --noEmit --pretty false
          npm run build

      - name: Commit the validated immutable baseline and remove this runner
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/run-preactivation-baseline-generation-now.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            supabase/baseline/pre_activation \
            src/lib/database-preactivation-baseline-contract.test.ts \
            .github/workflows/run-preactivation-baseline-generation-now.yml
          git commit -m "Capture authoritative pre-activation Supabase baseline"
          git push origin "HEAD:$TARGET_BRANCH"
          printf 'result_head=%s\nresult_tree=%s\n' \
            "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})" \
            > artifacts/preactivation-baseline-clean-room/result-git.txt

      - name: Package privacy-safe evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          GENERATED="${RUNNER_TEMP}/preactivation-baseline-${GITHUB_RUN_ID}"
          mkdir -p evidence/generation evidence/clean-room
          if [[ -d "$GENERATED/manifests" ]]; then cp -R "$GENERATED/manifests" evidence/generation/; fi
          if [[ -d "$GENERATED/logs" ]]; then cp -R "$GENERATED/logs" evidence/generation/; fi
          if [[ -d artifacts/preactivation-baseline-clean-room ]]; then
            cp -R artifacts/preactivation-baseline-clean-room/. evidence/clean-room/
          fi
          if grep -RIl \
              'postgresql\?://\|eyJ[A-Za-z0-9_-]\{20,\}' \
              evidence 2>/dev/null > evidence/credential-scan-matches.txt; then
            test ! -s evidence/credential-scan-matches.txt
          fi
          find evidence -type f -print0 | sort -z | xargs -0 -r sha256sum \
            > evidence/artifact-sha256.txt

      - name: Upload generation and clean-room evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preactivation-baseline-authoritative-${{ github.run_id }}
          path: evidence
          if-no-files-found: warn
          retention-days: 21
