name: Validate live-only Discover cleanup
on:
  push:
    branches: [cleanup/discover-live-only-20260923]
    paths: [.github/workflows/discover-cleanup-validation.yml]
permissions:
  contents: write
concurrency:
  group: discover-live-only-cleanup
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      BASE_SHA: ded28e1024b98dcd800249e36e9787378f7802d4
      TARGET_BRANCH: cleanup/discover-live-only-20260923
      EVIDENCE: /tmp/discover-evidence
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Guard and apply exact inspected product changes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = ghuser29384/Website2
          test "$GITHUB_REF" = "refs/heads/$TARGET_BRANCH"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE_SHA"
          test "$(git diff --name-only "$BASE_SHA" HEAD)" = .github/workflows/discover-cleanup-validation.yml
          mkdir -p "$EVIDENCE"
          python - <<'PY'
          import subprocess,textwrap
          controller=subprocess.check_output(['git','show','f47341d332a085b9e80b272ccea0f9d0059873c0:.github/workflows/discover-cleanup-validation.yml'],text=True)
          begin="          python - <<'PY'\n"
          end="\n          PY\n"
          assert controller.count(begin)==1 and controller.count(end)==1
          code=textwrap.dedent(controller.split(begin,1)[1].split(end,1)[0])
          exec(compile(code,'<sha-verified-discover-foundation>','exec'))
          sha='fe8afb03c1fa0ebbc0b974344b48e3840c86bf37'
          req=urllib.request.Request(f'https://api.github.com/repos/ghuser29384/Website2/git/blobs/{sha}',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(req,timeout=30) as response:
              record=json.load(response)
          data=base64.b64decode(record['content'])
          assert blob(data)==sha
          repairs=json.loads(data)
          assert len(repairs)==5
          outputs={}
          for change in repairs:
              name=change['path']
              assert name in ['public/moral-trade-discover.html','public/moral-trade-discover-search.js','public/moral-trade-input-assist.js','tests/discover-live-search.spec.ts','tests/discover-home-visual-alignment.spec.ts']
              old=Path(name).read_bytes()
              assert blob(old)==change['old'], 'Repair source drift: '+name
              lines=old.decode().splitlines(keepends=True)
              for begin,end,text in reversed(change['hunks']):
                  assert 0<=begin<=end<=len(lines)
                  lines[begin:end]=[text]
              output=''.join(lines).encode()
              assert blob(output)==change['new'], 'Repair output mismatch: '+name
              outputs[name]=output
          for name,data in outputs.items(): Path(name).write_bytes(data)
          subprocess.run(['git','add','--',*outputs.keys()],check=True)
          expected=Path(os.environ['EVIDENCE'],'expected-paths.txt')
          names=set(expected.read_text().splitlines())|{'public/moral-trade-input-assist.js'}
          assert len(names)==48
          expected.write_text('\n'.join(sorted(names))+'\n')
          print('Verified 48-path candidate, including opt-in Enter handling and page-range recovery.')
          PY
          git diff --check "$BASE_SHA"
          git diff --name-only "$BASE_SHA" | sort > "$EVIDENCE/actual-paths.txt"
          diff -u "$EVIDENCE/expected-paths.txt" "$EVIDENCE/actual-paths.txt"
          git diff --stat "$BASE_SHA" | tee "$EVIDENCE/diff-stat.txt"
          git diff --binary "$BASE_SHA" > "$EVIDENCE/discover-cleanup.patch"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install exact dependencies
        run: npm ci
      - name: Focused discovery contracts
        shell: bash
        run: |
          set -euo pipefail
          npm run verify:discover | tee "$EVIDENCE/discover-contracts.txt"
      - name: Full repository tests
        shell: bash
        run: |
          set -euo pipefail
          npm test | tee "$EVIDENCE/unit-tests.txt"
      - name: Repository lint and TypeScript
        shell: bash
        run: |
          set -euo pipefail
          npm run lint -- --quiet | tee "$EVIDENCE/lint.txt"
          npx tsc --noEmit --pretty false | tee "$EVIDENCE/typecheck.txt"
      - name: Production build without provider credentials
        shell: bash
        env:
          NEXT_PUBLIC_SITE_URL: https://www.moraltrade.org
          SITE_URL: https://www.moraltrade.org
          VERCEL: '1'
          VERCEL_ENV: production
        run: |
          set -euo pipefail
          npm run build | tee "$EVIDENCE/build.txt"
      - name: Focused browser regression gate
        shell: bash
        env:
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3210
          SITE_URL: http://127.0.0.1:3210
          PLAYWRIGHT_HTML_OPEN: never
        run: |
          set -euo pipefail
          npx playwright install --with-deps chromium
          npx playwright test --config=playwright.release.config.ts tests/discover-live-search.spec.ts tests/discover-home-visual-alignment.spec.ts --reporter=line --max-failures=2 | tee "$EVIDENCE/focused-browser.txt"
      - name: Full rendered release gate and responsive screenshots
        shell: bash
        env:
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3210
          SITE_URL: http://127.0.0.1:3210
          PLAYWRIGHT_HTML_OPEN: never
        run: |
          set -euo pipefail
          npm run test:e2e:release -- --reporter=line | tee "$EVIDENCE/browser-tests.txt"
      - name: Publish validated candidate to isolated branch only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE_SHA"
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)" = "$GITHUB_SHA"
          git diff --exit-code
          git diff --cached --name-only "$BASE_SHA" | sort > "$EVIDENCE/final-paths.txt"
          diff -u "$EVIDENCE/expected-paths.txt" "$EVIDENCE/final-paths.txt"
          git diff --check "$BASE_SHA"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Replace prototype Discover with one live trade directory'
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          git rev-parse HEAD > "$EVIDENCE/product-head.txt"
          git rev-parse HEAD^{tree} > "$EVIDENCE/product-tree.txt"
      - name: Preserve validation evidence and browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: discover-live-only-${{ github.run_id }}
          path: |
            /tmp/discover-evidence/
            test-results/
          retention-days: 7
          if-no-files-found: warn
