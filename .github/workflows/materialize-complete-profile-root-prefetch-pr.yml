name: Materialize Complete Profile root-prefetch cleanup on PR

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/materialize-complete-profile-root-prefetch-pr.yml"

permissions:
  contents: write

concurrency:
  group: materialize-complete-profile-root-prefetch-pr-20260801
  cancel-in-progress: false

jobs:
  materialize:
    if: github.head_ref == 'fix/complete-profile-root-prefetch-20260801'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out cleanup branch
        uses: actions/checkout@v4
        with:
          ref: fix/complete-profile-root-prefetch-20260801
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Materialize the exact cleanup
        run: |
          set -euo pipefail
          python3 .github/scripts/materialize-complete-profile-root-prefetch.py
          rm .github/scripts/materialize-complete-profile-root-prefetch.py
          rm .github/workflows/materialize-complete-profile-root-prefetch.yml
          rm .github/workflows/materialize-complete-profile-root-prefetch-pr.yml
          git diff --check
          node --check .github/scripts/complete-profile-production-canary.mjs

      - name: Commit and push cleanup
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Stop Complete Profile home-link RSC prefetch"
          git push origin HEAD:fix/complete-profile-root-prefetch-20260801
