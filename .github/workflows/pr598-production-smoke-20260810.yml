name: PR 598 production smoke

on:
  push:
    branches:
      - ops/release-pr598-production-20260810
    paths:
      - ".github/workflows/pr598-production-smoke-20260810.yml"

permissions:
  contents: read

concurrency:
  group: pr598-production-smoke-20260810
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      EXPECTED_MAIN_SHA: 0778577c98c7a86417057caeb939c01f77e22c89
      PRODUCTION_ORIGIN: https://www.moraltrade.org
      DEPLOYMENT_URL: https://moraltrade-site-izz3psr7y-ellen-s.vercel.app

    steps:
      - name: Check out the exact released source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_MAIN_SHA }}
          fetch-depth: 1

      - name: Verify immutable release identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN_SHA"
          remote_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$remote_main" = "$EXPECTED_MAIN_SHA"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies and Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium

      - name: Verify canonical routes and apex transfer
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE' | tee pr598-production-route-smoke.log
          import assert from "node:assert/strict";

          const canonical = process.env.PRODUCTION_ORIGIN;
          const deployment = process.env.DEPLOYMENT_URL;
          const routes = [
            "/",
            "/moral-trade-live.html",
            "/create",
            "/commitments",
            "/discover",
            "/trades/new",
            "/status",
          ];

          for (const route of routes) {
            const response = await fetch(`${canonical}${route}`, { redirect: "follow" });
            assert.ok(response.status >= 200 && response.status < 400, `${route} returned ${response.status}`);
            assert.equal(new URL(response.url).hostname, "www.moraltrade.org", `${route} left canonical host`);
            const body = await response.text();
            assert.ok(body.length > 100, `${route} returned an unexpectedly small body`);
            assert.doesNotMatch(body, /Internal Server Error|This page did not finish rendering/i);
            console.log(`${route}\t${response.status}\t${response.url}\t${body.length}`);
          }

          const apex = await fetch("https://moraltrade.org/moral-trade-live.html", { redirect: "manual" });
          assert.ok([301, 302, 307, 308].includes(apex.status), `apex returned ${apex.status}`);
          const location = apex.headers.get("location") ?? "";
          assert.match(location, /^https:\/\/www\.moraltrade\.org\/moral-trade-live\.html/);
          console.log(`apex\t${apex.status}\t${location}`);

          const immutable = await fetch(`${deployment}/moral-trade-live.html`, { redirect: "follow" });
          assert.ok(immutable.status >= 200 && immutable.status < 400, `deployment returned ${immutable.status}`);
          const immutableBody = await immutable.text();
          assert.ok(immutableBody.length > 100);
          assert.doesNotMatch(immutableBody, /Internal Server Error/i);
          console.log(`deployment\t${immutable.status}\t${immutable.url}\t${immutableBody.length}`);
          NODE

      - name: Configure production-only Playwright smoke
        shell: bash
        run: |
          cat > playwright.production-smoke.config.ts <<'TS'
          import { defineConfig } from "@playwright/test";

          export default defineConfig({
            testDir: "./tests",
            timeout: 60_000,
            expect: { timeout: 15_000 },
            fullyParallel: false,
            workers: 1,
            retries: 0,
            use: {
              baseURL: "https://www.moraltrade.org",
              storageState: {
                cookies: [
                  {
                    domain: "www.moraltrade.org",
                    expires: -1,
                    httpOnly: true,
                    name: "mt_walkthrough_seen",
                    path: "/",
                    sameSite: "Lax",
                    secure: true,
                    value: "1",
                  },
                ],
                origins: [],
              },
              trace: "retain-on-failure",
              screenshot: "only-on-failure",
            },
          });
          TS

      - name: Verify released Command Center and release-owned surfaces
        shell: bash
        env:
          PLAYWRIGHT_HTML_OPEN: never
        run: |
          set -euo pipefail
          npx playwright test \
            tests/exact-live-command-center.spec.ts \
            tests/commitments-live-portfolio.spec.ts \
            tests/exact-live-local-time.spec.ts \
            tests/exact-live-route-recommendations.spec.ts \
            tests/exact-live-verification.spec.ts \
            tests/moral-trade-brand.spec.ts \
            --config=playwright.production-smoke.config.ts \
            --reporter=line \
            | tee pr598-production-browser-smoke.log

      - name: Record immutable smoke evidence
        if: always()
        shell: bash
        run: |
          {
            echo '### PR #598 production smoke'
            echo
            echo "- Commit: \`$EXPECTED_MAIN_SHA\`"
            echo "- Canonical origin: \`$PRODUCTION_ORIGIN\`"
            echo "- Immutable deployment: \`$DEPLOYMENT_URL\`"
            echo '- Scope: route availability, apex transfer, Command Center draft handoff, Commitments, verification, local-time, route-planner, and brand contracts'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload production smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr598-production-smoke-${{ github.run_id }}
          path: |
            pr598-production-*.log
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 30
