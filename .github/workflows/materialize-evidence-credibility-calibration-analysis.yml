name: Materialize evidence credibility calibration analysis

on:
  push:
    branches:
      - research/evidence-credibility-calibration-analysis-v1-20260812
    paths:
      - .github/workflows/materialize-evidence-credibility-calibration-analysis.yml

permissions:
  contents: write

concurrency:
  group: materialize-evidence-credibility-calibration-analysis
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out analysis branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: research/evidence-credibility-calibration-analysis-v1-20260812

      - name: Verify and extract staged payload
        shell: bash
        run: |
          set -euo pipefail
          test "$(find .calibration-materialization -maxdepth 1 -type f -name 'chunk-*' | wc -l)" -eq 6
          cat .calibration-materialization/chunk-* | base64 --decode > /tmp/calibration-analysis-payload.tar.gz
          echo "9990c65b166d86259601396ddd013d11110496edd3d0e2566df317c4b99df775  /tmp/calibration-analysis-payload.tar.gz" | sha256sum -c -

          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import tarfile

          archive = Path('/tmp/calibration-analysis-payload.tar.gz')
          with tarfile.open(archive, 'r:gz') as handle:
              members = handle.getmembers()
              for member in members:
                  name = PurePosixPath(member.name)
                  if name.is_absolute() or '..' in name.parts:
                      raise SystemExit(f'Unsafe archive member: {member.name}')
                  if not (member.isdir() or member.isfile()):
                      raise SystemExit(f'Unsupported archive member: {member.name}')
              handle.extractall('.', members=members)
          PY

          node - <<'NODE'
          const { readFileSync, writeFileSync } = require('node:fs');
          const path = 'package.json';
          const packageJson = JSON.parse(readFileSync(path, 'utf8'));
          packageJson.scripts['analyze:evidence-credibility'] =
            'node --import tsx scripts/evidence-credibility-calibration-analysis.ts';
          writeFileSync(path, `${JSON.stringify(packageJson, null, 2)}\n`);
          NODE

          test -f analysis/evidence-credibility-calibration-v1/README.md
          test -f analysis/evidence-credibility-calibration-v1/plan.json
          test -f analysis/evidence-credibility-calibration-v1/plan.sha256
          test -f docs/moral-trade/evidence-credibility-calibration-analysis-plan-v1.md
          test -f scripts/evidence-credibility-calibration-analysis.ts
          test -f src/lib/evidence-credibility-calibration-analysis.ts
          test -f src/lib/evidence-credibility-calibration-analysis.test.ts
          (
            cd analysis/evidence-credibility-calibration-v1
            sha256sum -c plan.sha256
          )
          grep -q '"analyze:evidence-credibility"' package.json
          grep -q 'activationAuthorized: false' src/lib/evidence-credibility-calibration-analysis.ts
          grep -q 'Synthetic results are never empirical evidence' docs/moral-trade/evidence-credibility-calibration-analysis-plan-v1.md
          rm -rf .calibration-materialization
          git diff --check

      - name: Commit durable research package
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            analysis/evidence-credibility-calibration-v1 \
            docs/moral-trade/evidence-credibility-calibration-analysis-plan-v1.md \
            package.json \
            scripts/evidence-credibility-calibration-analysis.ts \
            src/lib/evidence-credibility-calibration-analysis.ts \
            src/lib/evidence-credibility-calibration-analysis.test.ts
          git add -u .calibration-materialization
          git commit -m "feat: add preregistered offline credibility calibration analysis"
          git push origin HEAD:research/evidence-credibility-calibration-analysis-v1-20260812
