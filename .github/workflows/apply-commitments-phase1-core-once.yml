name: Apply Commitments Phase 1 core once

on:
  push:
    branches:
      - feature/commitments-phase1-export-once-20260806
    paths:
      - .github/workflows/apply-commitments-phase1-core-once.yml

permissions:
  contents: write

concurrency:
  group: apply-commitments-phase1-core-once
  cancel-in-progress: false

env:
  TARGET_BRANCH: feature/commitments-phase1-impact-accounting-20260806

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Apply the reviewed core files
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/phase1-core.tar.gz.b64" <<'PAYLOAD'

PAYLOAD
          base64 --decode "$RUNNER_TEMP/phase1-core.tar.gz.b64" > "$RUNNER_TEMP/phase1-core.tar.gz"
          tar -xzf "$RUNNER_TEMP/phase1-core.tar.gz" -C "$GITHUB_WORKSPACE"
          git diff --check
          test -f src/lib/impact-accounting.ts
          test -f src/lib/impact-model-governance.ts

      - name: Commit and push exact target branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/lib/impact-accounting.ts \
            src/lib/impact-accounting.test.ts \
            src/lib/impact-model-governance.ts \
            src/lib/impact-model-governance-server.ts \
            src/lib/impact-model-governance.test.ts
          git commit -m 'Add Commitments Phase 1 impact accounting core'
          git push origin "HEAD:${TARGET_BRANCH}"
