name: Audit canonical smoke acceptance
on:
  push:
    branches: [ops/audit-source-20260926]
    paths: [.github/workflows/audit-canonical-smoke-20260927.yml]
permissions:
  contents: read
  actions: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_RELEASE_SHA: 4db5ef744c8cebab1940f70ef6bab499a6a61860
      RELEASE_RUN_ID: '36299252812'
      MORAL_TRADE_DISABLE_DEP_REPAIR: '1'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: controller
          persist-credentials: false
      - name: Require the exact completed gated release; never deploy or dispatch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = ghuser29384/Website2
          mkdir -p /tmp/audit-live-evidence
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN_ID" > /tmp/audit-live-evidence/release-run.json
          jq -e --arg sha "$EXPECTED_RELEASE_SHA" '.head_sha == $sha and .event == "workflow_dispatch" and .path == ".github/workflows/vercel-release.yml" and .status == "completed" and .conclusion == "success"' /tmp/audit-live-evidence/release-run.json >/dev/null
      - uses: actions/checkout@v4
        with:
          ref: 4db5ef744c8cebab1940f70ef6bab499a6a61860
          path: candidate
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: candidate/package-lock.json
      - name: Prepare read-only browser acceptance with source-confirmed field selectors
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_RELEASE_SHA"
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          python3 - <<'PY'
          from pathlib import Path
          source=Path('../controller/.github/audit-live-smoke-20260927.mjs').read_text()
          replacements={
            "await expect(page.getByRole('navigation', {name:'Primary', exact:true})).toBeVisible({timeout:45000});": "await expect(page.locator('header [data-mt-primary-links=\"true\"]')).toBeVisible({timeout:45000});",
            "await expect(page.getByLabel('Sort', {exact:true})).toBeVisible();": "await expect(filters.locator('label').filter({hasText:'Sort'}).locator('select[name=\"sort\"]')).toBeVisible();",
          }
          assert 'header [data-mt-primary-links="true"]' in Path('tests/home-bootstrap-resilience.spec.ts').read_text()
          assert '<select defaultValue={sort} name="sort">' in Path('src/app/offers/page.tsx').read_text()
          for old,new in replacements.items():
            assert source.count(old)==1
            source=source.replace(old,new)
          Path('/tmp/audit-canonical-smoke.mjs').write_text(source)
          Path('/tmp/audit-live-evidence/selector-correction.txt').write_text('The first smoke verified five exact asset hashes, desktop/mobile Commitments privacy/tabs, and the outcome filter, then failed on an over-specific accessible-name match for Sort. This rerun checks the actual named native select within its visible Sort label inside the opened filter, and the existing homepage navigation hook. All route, asset, privacy, overflow and browser-exception assertions remain enabled. No product source, database or deployment changed.\n')
          PY
      - name: Execute every canonical route, asset and interaction check again
        working-directory: candidate
        run: node /tmp/audit-canonical-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-canonical-acceptance-${{ github.run_id }}
          path: /tmp/audit-live-evidence
          retention-days: 14
