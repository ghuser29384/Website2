name: Materialize Donation Upgrade pooled settlement on current main

on:
  push:
    branches:
      - feature/donation-upgrade-approved-fallbacks-20260731
    paths:
      - .github/workflows/donation-upgrade-materialize-current-main.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: donation-upgrade-materialize-current-main
  cancel-in-progress: false

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact current-main feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/donation-upgrade-approved-fallbacks-20260731
          fetch-depth: 0

      - name: Fetch materialized pooled-settlement source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feat/cross-user-pooled-settlement
          paths=(
            .env.example
            docs/trade-donation-pooled-settlement-runbook.md
            src/app/admin/page.tsx
            src/app/admin/trade-donation-pools/page.tsx
            src/app/api/connectors/every-org/[secret]/route.ts
            src/app/api/stripe/webhook/route.ts
            src/app/trade-donation-actions-base.ts
            src/app/trade-donation-pool-actions.ts
            src/components/core-trade/trade-agreement-stage.tsx
            src/components/core-trade/trade-donation-agreement-stage.tsx
            src/components/core-trade/trade-donation-pool-agreement-stage.tsx
            src/lib/payments/trade-donation-pool-webhook.ts
            src/lib/trade-donation-pool-source-contract.test.ts
            src/lib/trade-donation-pool.test.ts
            src/lib/trade-donation-pool.ts
            supabase/migrations/20260725152000_cross_user_pooled_trade_donations.sql
          )
          for path in "${paths[@]}"; do
            mkdir -p "$(dirname "$path")"
            git show "origin/feat/cross-user-pooled-settlement:$path" > "$path"
          done
          git diff --check
          test -f src/lib/trade-donation-pool.ts
          test -f supabase/migrations/20260725152000_cross_user_pooled_trade_donations.sql

      - name: Commit the exact engineering candidate
        shell: bash
        run: |
          set -euo pipefail
          git add \
            .env.example \
            docs/trade-donation-pooled-settlement-runbook.md \
            src/app/admin/page.tsx \
            src/app/admin/trade-donation-pools/page.tsx \
            'src/app/api/connectors/every-org/[secret]/route.ts' \
            src/app/api/stripe/webhook/route.ts \
            src/app/trade-donation-actions-base.ts \
            src/app/trade-donation-pool-actions.ts \
            src/components/core-trade/trade-agreement-stage.tsx \
            src/components/core-trade/trade-donation-agreement-stage.tsx \
            src/components/core-trade/trade-donation-pool-agreement-stage.tsx \
            src/lib/payments/trade-donation-pool-webhook.ts \
            src/lib/trade-donation-pool-source-contract.test.ts \
            src/lib/trade-donation-pool.test.ts \
            src/lib/trade-donation-pool.ts \
            supabase/migrations/20260725152000_cross_user_pooled_trade_donations.sql
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Integrate Donation Upgrade pooled settlement on current main"
          git push origin HEAD:feature/donation-upgrade-approved-fallbacks-20260731
