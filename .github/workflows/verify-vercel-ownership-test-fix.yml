name: Verify Vercel ownership test repair

on:
  push:
    branches:
      - fix/vercel-build-ownership-tests-20260801
    paths:
      - src/lib/vercel-build-ownership.test.ts
      - .github/workflows/verify-vercel-ownership-test-fix.yml
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: verify-vercel-ownership-test-repair
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Publish pending verification status
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            --arg state pending \
            --arg target_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg description "Running exact Vercel ownership test repair gates" \
            --arg context "vercel-ownership-test-repair" \
            '{state:$state,target_url:$target_url,description:$description,context:$context}' \
            | gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" --input - >/dev/null

      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Focused Vercel ownership tests
        run: node --import tsx --test src/lib/vercel-build-ownership.test.ts scripts/vercel-ignore-build.test.mjs

      - name: Complete repository tests
        run: npm test

      - name: Absolute TypeScript
        run: npx tsc --noEmit

      - name: Repository-wide ESLint
        run: npm run lint

      - name: Production build
        env:
          NEXT_PUBLIC_SITE_URL: https://www.moraltrade.org
          VERCEL: "1"
          VERCEL_ENV: preview
          DIRECT_DONATION_UPGRADES_ENABLED: "false"
          DIRECT_DONATION_UPGRADE_MODE: disabled
          CONDITIONAL_PAYMENTS_MODE: disabled
          TRADE_DONATION_POOL_ENABLED: "false"
          TRADE_DONATION_POOL_MODE: disabled
        run: npm run build

      - name: Exact repository-only diff
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          base="$(git merge-base origin/main HEAD)"
          git diff --check "$base"...HEAD
          mapfile -t paths < <(git diff --name-only "$base"...HEAD | sort)
          printf '%s\n' "${paths[@]}"
          expected=(
            .github/workflows/verify-vercel-ownership-test-fix.yml
            src/lib/vercel-build-ownership.test.ts
          )
          [[ "${#paths[@]}" -eq "${#expected[@]}" ]]
          for i in "${!expected[@]}"; do
            [[ "${paths[$i]}" == "${expected[$i]}" ]]
          done
          git rev-parse HEAD
          git rev-parse HEAD^{tree}

      - name: Publish final verification status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          state=success
          description="Exact Vercel ownership test repair gates passed"
          if [[ "$JOB_STATUS" != "success" ]]; then
            state=failure
            description="Exact Vercel ownership test repair gates failed"
          fi
          jq -n \
            --arg state "$state" \
            --arg target_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg description "$description" \
            --arg context "vercel-ownership-test-repair" \
            '{state:$state,target_url:$target_url,description:$description,context:$context}' \
            | gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" --input - >/dev/null
          [[ "$state" == "success" ]]
