name: Verify Vercel ownership test repair

on:
  push:
    branches:
      - fix/vercel-build-ownership-tests-20260801
    paths:
      - src/lib/vercel-build-ownership.test.ts
      - .github/workflows/verify-vercel-ownership-test-fix.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-vercel-ownership-test-repair
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Focused Vercel ownership tests
        run: node --import tsx --test src/lib/vercel-build-ownership.test.ts scripts/vercel-ignore-build.test.mjs

      - name: Complete repository tests
        run: npm test

      - name: Absolute TypeScript
        run: npx tsc --noEmit

      - name: Repository-wide ESLint
        run: npm run lint

      - name: Production build
        env:
          NEXT_PUBLIC_SITE_URL: https://www.moraltrade.org
          VERCEL: "1"
          VERCEL_ENV: preview
          DIRECT_DONATION_UPGRADES_ENABLED: "false"
          DIRECT_DONATION_UPGRADE_MODE: disabled
          CONDITIONAL_PAYMENTS_MODE: disabled
          TRADE_DONATION_POOL_ENABLED: "false"
          TRADE_DONATION_POOL_MODE: disabled
        run: npm run build

      - name: Exact repository-only diff
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          base="$(git merge-base origin/main HEAD)"
          git diff --check "$base"...HEAD
          mapfile -t paths < <(git diff --name-only "$base"...HEAD | sort)
          printf '%s\n' "${paths[@]}"
          expected=(
            .github/workflows/verify-vercel-ownership-test-fix.yml
            src/lib/vercel-build-ownership.test.ts
          )
          [[ "${#paths[@]}" -eq "${#expected[@]}" ]]
          for i in "${!expected[@]}"; do
            [[ "${paths[$i]}" == "${expected[$i]}" ]]
          done
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
