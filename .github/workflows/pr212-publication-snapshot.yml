name: PR 212 publication snapshot

on:
  push:
    branches:
      - ops/pr212-complete-ui-status-20260730
    paths:
      - .github/workflows/pr212-publication-snapshot.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_HEAD: e8ebb1aa132db61d6566091175015f1aadb3d978
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Snapshot exact publication run
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ops/pr212-final-publication
          gh run list --repo "$GITHUB_REPOSITORY" --workflow publish-pr212-final-ui.yml --branch ops/pr212-final-ui-publish-20260730 --limit 50 --json databaseId,headSha,status,conclusion,createdAt,event,url,displayTitle > /tmp/runs.json
          jq --arg head "$TARGET_HEAD" '{target_head:$head,exact_head_runs:[.[] | select(.headSha == $head)],all_runs:.}' /tmp/runs.json > ops/pr212-final-publication/snapshot.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops/pr212-final-publication/snapshot.json
          git commit -m "Snapshot PR 212 final publication run"
          git push origin HEAD:ops/pr212-complete-ui-status-20260730
