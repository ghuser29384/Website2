name: Integrate and validate Threshold Sign-On release candidate

on:
  push:
    branches:
      - ops/threshold-sign-on-merge-report-v2-20260730
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/threshold-sign-on-integration-report.yml"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: threshold-sign-on-integration-and-validation-20260730
  cancel-in-progress: false

jobs:
  integrate-validate-publish:
    if: >-
      github.event_name == 'push' ||
      (github.event.pull_request.head.repo.full_name == 'ghuser29384/Website2' &&
       github.head_ref == 'ops/threshold-sign-on-merge-report-v2-20260730')
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      EXPECTED_REPOSITORY: ghuser29384/Website2
      EXPECTED_MAIN: a0400cc79993dc4ad2f5a6dc65d9a3b8f72f65c3
      EXPECTED_FEATURE: e33c7040d643b5af6e337c02ff3b986f7cf9b235
      FEATURE_BRANCH: feature/collective-commitments-in-create-20260729
      NEXT_PUBLIC_SUPABASE_URL: https://hvmxfjjbdcgjjudmthdz.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.QA_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.QA_SUPABASE_SERVICE_ROLE_KEY }}
      QA_SUPABASE_DB_URL: ${{ secrets.QA_SUPABASE_DB_URL }}
      COLLECTIVE_COMMITMENTS_ENABLED: "true"
      COLLECTIVE_COMMITMENT_MIN_DEADLINE_MINUTES: "1"
      TRADE_DONATION_POOL_ENABLED: "false"
      TRADE_DONATION_POOL_MODE: disabled
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      SITE_URL: http://127.0.0.1:3000
      VERCEL_ENV: preview
      NEXT_PUBLIC_VERCEL_ENV: preview
      ARTIFACT_DIR: ${{ github.workspace }}/threshold-sign-on-integration

    steps:
      - name: Validate exact boundary and secrets
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY"
          branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          test "$branch" = "ops/threshold-sign-on-merge-report-v2-20260730"
          for name in NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY SUPABASE_SERVICE_ROLE_KEY QA_SUPABASE_DB_URL; do
            test -n "${!name:-}" || { echo "Missing required secret: $name" >&2; exit 1; }
          done

      - name: Check out operations head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Merge exact main into product branch and apply user-facing rename
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ARTIFACT_DIR"
          git fetch origin main "$FEATURE_BRANCH"
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse origin/$FEATURE_BRANCH)" = "$EXPECTED_FEATURE"
          git checkout -B "$FEATURE_BRANCH" "$EXPECTED_FEATURE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if ! git merge --no-ff "$EXPECTED_MAIN" -m "Merge current main for Threshold Sign-On release"; then
            git status --short | tee "$ARTIFACT_DIR/merge-conflicts.txt"
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          patterns = [
              "Collective Commitments",
              "Collective Commitment",
              "Collective commitments",
              "Collective commitment",
              "collective commitments",
              "collective commitment",
          ]
          replacements = {
              "Collective Commitments": "Threshold Sign-Ons",
              "Collective Commitment": "Threshold Sign-On",
              "Collective commitments": "Threshold sign-ons",
              "Collective commitment": "Threshold Sign-On",
              "collective commitments": "threshold sign-ons",
              "collective commitment": "threshold sign-on",
          }
          result = subprocess.run(
              [
                  "git", "grep", "-Il", "-e", patterns[0], "-e", patterns[1],
                  "-e", patterns[2], "-e", patterns[3], "-e", patterns[4], "-e", patterns[5],
                  "--", ".", ":!supabase/migrations/**", ":!.github/**",
              ],
              check=False,
              text=True,
              capture_output=True,
          )
          changed = []
          for raw in result.stdout.splitlines():
              path = Path(raw)
              try:
                  text = path.read_text()
              except UnicodeDecodeError:
                  continue
              updated = text
              for old, new in replacements.items():
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated)
                  changed.append(raw)
          print("Renamed user-facing terminology in:")
          print("\n".join(changed))
          if not changed:
              raise SystemExit("No Threshold Sign-On user-facing rename was applied.")
          PY

          if git grep -n -I -E '(Collective|collective) [Cc]ommitments?' -- . ':!supabase/migrations/**' ':!.github/**'; then
            echo "Legacy user-facing Collective Commitment terminology remains." >&2
            exit 1
          fi
          if git grep -n -I -E 'Threshold Signatures?' -- . ':!.github/**'; then
            echo "The cryptographically ambiguous Threshold Signature name must not be used." >&2
            exit 1
          fi
          git grep -n -I 'Threshold Sign-On' -- src docs public > "$ARTIFACT_DIR/threshold-sign-on-occurrences.txt"
          test -s "$ARTIFACT_DIR/threshold-sign-on-occurrences.txt"
          git diff --check
          git add --all
          git commit -m "Rename Collective Commitments to Threshold Sign-On"
          printf '%s\n' \
            "main=${EXPECTED_MAIN}" \
            "feature_before=${EXPECTED_FEATURE}" \
            "candidate=$(git rev-parse HEAD)" \
            > "$ARTIFACT_DIR/exact-boundary.txt"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Generate isolated runtime secrets
        shell: bash
        run: |
          set -euo pipefail
          master_key="$(openssl rand -base64 32 | tr -d '\n')"
          cron_secret="$(openssl rand -hex 32)"
          echo "::add-mask::$master_key"
          echo "::add-mask::$cron_secret"
          echo "COLLECTIVE_COMMITMENT_MASTER_KEY=$master_key" >> "$GITHUB_ENV"
          echo "CRON_SECRET=$cron_secret" >> "$GITHUB_ENV"

      - name: Install dependencies and run candidate test suite
        shell: bash
        run: |
          set -uo pipefail
          npm ci
          set +e
          npm test > "$ARTIFACT_DIR/candidate-tests.log" 2>&1
          candidate_status=$?
          set -e
          echo "CANDIDATE_TEST_STATUS=$candidate_status" >> "$GITHUB_ENV"
          cat "$ARTIFACT_DIR/candidate-tests.log"

      - name: Run exact-main test baseline when candidate is not fully green
        if: env.CANDIDATE_TEST_STATUS != '0'
        shell: bash
        run: |
          set -uo pipefail
          base_dir="$RUNNER_TEMP/exact-main"
          git worktree add --detach "$base_dir" "$EXPECTED_MAIN"
          cd "$base_dir"
          npm ci
          set +e
          npm test > "$ARTIFACT_DIR/base-tests.log" 2>&1
          base_status=$?
          set -e
          echo "BASE_TEST_STATUS=$base_status" >> "$GITHUB_ENV"
          cat "$ARTIFACT_DIR/base-tests.log"

      - name: Enforce exact-base full-test policy and test-count non-regression
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os, re

          candidate = Path(os.environ["ARTIFACT_DIR"]) / "candidate-tests.log"
          base = Path(os.environ["ARTIFACT_DIR"]) / "base-tests.log"

          def parse(path: Path):
              text = path.read_text(errors="replace")
              failures = set()
              for match in re.finditer(r"^not ok\s+\d+\s+-\s+(.+?)(?:\s+#.*)?$", text, re.M):
                  failures.add(match.group(1).strip())
              totals = [int(value) for value in re.findall(r"^# tests\s+(\d+)\s*$", text, re.M)]
              return failures, (totals[-1] if totals else None)

          candidate_failures, candidate_total = parse(candidate)
          if os.environ.get("CANDIDATE_TEST_STATUS") == "0":
              if candidate_failures:
                  raise SystemExit(f"Candidate exited green but reported failures: {candidate_failures}")
              print(f"Candidate full suite passed with {candidate_total} tests.")
              raise SystemExit(0)

          if not base.exists():
              raise SystemExit("Candidate failed but exact-main baseline log is missing.")
          base_failures, base_total = parse(base)
          new_failures = sorted(candidate_failures - base_failures)
          if new_failures:
              raise SystemExit(f"Candidate introduced new failing tests: {new_failures}")
          if candidate_total is None or base_total is None or candidate_total < base_total:
              raise SystemExit(
                  f"Test-count regression: candidate={candidate_total}, exact-main={base_total}"
              )
          print(
              f"No new test failures; candidate tests={candidate_total}, exact-main tests={base_total}."
          )
          PY

      - name: Run absolute TypeScript, ESLint, and production-build gates
        shell: bash
        run: |
          set -o pipefail
          npx tsc --noEmit 2>&1 | tee "$ARTIFACT_DIR/typescript.log"
          npm run lint 2>&1 | tee "$ARTIFACT_DIR/eslint.log"
          npm run build 2>&1 | tee "$ARTIFACT_DIR/build.log"

      - name: Validate exact QA database and run complete transactional regression
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from urllib.parse import urlparse
          parsed = urlparse(os.environ["QA_SUPABASE_DB_URL"])
          if "hvmxfjjbdcgjjudmthdz" not in (parsed.username or ""):
              raise SystemExit("Refusing database outside exact MoralTrade QA.")
          if parsed.hostname != "aws-0-us-west-1.pooler.supabase.com" or parsed.port != 5432:
              raise SystemExit("Refusing unexpected database connection parameters.")
          PY
          sudo apt-get update -qq
          sudo apt-get install --yes postgresql-client > /dev/null
          psql "$QA_SUPABASE_DB_URL" --no-psqlrc --set ON_ERROR_STOP=1 \
            --file supabase/tests/collective_identity_threshold_commitments.sql \
            2>&1 | tee "$ARTIFACT_DIR/database-regression.log"
          for marker in \
            "PASS: duplicate-human and duplicate-account signatures are rejected" \
            "PASS: withdrawal and re-signing preserve exact private counts" \
            "PASS: incomplete or altered reveal manifests publish zero identities" \
            "PASS: exact manifest activation publishes all names atomically and only opted-in affiliations" \
            "PASS: activation and expiry erase private ciphertext and per-commitment keys" \
            "PASS: frozen terms and direct sensitive-table access are denied"; do
            grep -Fq "$marker" "$ARTIFACT_DIR/database-regression.log"
          done

      - name: Publish exact passing candidate to product branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$FEATURE_BRANCH"
          test "$(git rev-parse origin/$FEATURE_BRANCH)" = "$EXPECTED_FEATURE"
          git push origin "HEAD:$FEATURE_BRANCH"
          printf '%s\n' \
            "candidate_head=$(git rev-parse HEAD)" \
            "full_test_policy=PASS" \
            "typescript=PASS" \
            "eslint=PASS" \
            "production_build=PASS" \
            "database_regression=PASS" \
            "production_changed=NO" \
            > "$ARTIFACT_DIR/result.txt"

      - name: Comment result on product PR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          candidate="$(git rev-parse HEAD)"
          gh pr comment 286 --repo "$EXPECTED_REPOSITORY" --body "Latest main \`${EXPECTED_MAIN}\` was integrated, the user-facing feature was renamed to **Threshold Sign-On**, and exact candidate \`${candidate}\` passed the complete test policy, absolute TypeScript, absolute ESLint, production build, and transactional QA database regression. Production remains unchanged pending exact-head rendered Preview and production gates."

      - name: Upload integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: threshold-sign-on-integration-${{ github.run_id }}
          path: threshold-sign-on-integration
          if-no-files-found: warn
          retention-days: 14
