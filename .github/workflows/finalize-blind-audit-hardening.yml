name: Finalize blind-audit hardening workflow

on:
  push:
    branches:
      - feature/evidence-credibility-blind-audit-v1-20260812
    paths:
      - .github/workflows/finalize-blind-audit-hardening.yml

permissions:
  contents: write

concurrency:
  group: finalize-blind-audit-hardening-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Bind the hardening migration into exact-head QA
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path(".github/workflows/evidence-credibility-blind-audit-qa.yml")
          source = path.read_text(encoding="utf-8")
          base = "supabase/migrations/20260812022000_evidence_credibility_blind_audit_v1.sql"
          hardening = "supabase/migrations/20260812022001_evidence_credibility_blind_audit_hardening.sql"

          path_line = f"      - {base}\n"
          replacement = path_line + f"      - {hardening}\n"
          if source.count(path_line) != 2:
              raise SystemExit("Expected the base migration in both path filters.")
          source = source.replace(path_line, replacement)

          manifest_line = f"          {base}\n"
          if source.count(manifest_line) != 1:
              raise SystemExit("Expected one base migration in the exact manifest.")
          source = source.replace(
              manifest_line,
              manifest_line + f"          {hardening}\n",
          )

          old_count = '          test "$(wc -l < /tmp/actual-files.txt)" -eq 10\n'
          if source.count(old_count) != 1:
              raise SystemExit("Expected one ten-file scope assertion.")
          source = source.replace(
              old_count,
              '          test "$(wc -l < /tmp/actual-files.txt)" -eq 11\n',
          )

          old_migration_assertion = (
              '          test "$(find supabase/migrations -maxdepth 1 -type f '
              "-name '20260812022000_evidence_credibility_blind_audit_v1.sql' "
              '| wc -l)" -eq 1\n'
          )
          if source.count(old_migration_assertion) != 1:
              raise SystemExit("Expected one migration-count assertion.")
          source = source.replace(
              old_migration_assertion,
              f'          test -f {base}\n          test -f {hardening}\n',
          )

          runtime_line = f"            {base} \\\n"
          if source.count(runtime_line) != 1:
              raise SystemExit("Expected one runtime production-reference migration line.")
          source = source.replace(
              runtime_line,
              runtime_line + f"            {hardening} \\\n",
          )

          old_effect_target = f"            {base}; then\n"
          if source.count(old_effect_target) != 1:
              raise SystemExit("Expected one active-effect migration target.")
          source = source.replace(
              old_effect_target,
              f"            {base} \\\n            {hardening}; then\n",
          )

          source_hash_line = f"            {base} \\\n"
          if source.count(source_hash_line) != 1:
              raise SystemExit("Expected one source artifact migration line.")
          source = source.replace(
              source_hash_line,
              source_hash_line + f"            {hardening} \\\n",
          )

          old_variable = f'          migration="{base}"\n'
          if source.count(old_variable) != 1:
              raise SystemExit("Expected one database migration variable.")
          source = source.replace(
              old_variable,
              f'          migration_core="{base}"\n'
              f'          migration_hardening="{hardening}"\n',
          )

          old_include = "          \\i ${migration}\n"
          if source.count(old_include) != 1:
              raise SystemExit("Expected one database migration include.")
          source = source.replace(
              old_include,
              "          \\i ${migration_core}\n"
              "          \\i ${migration_hardening}\n",
          )

          database_hash_line = f"            {base} \\\n"
          if source.count(database_hash_line) != 1:
              raise SystemExit("Expected one database artifact migration line.")
          source = source.replace(
              database_hash_line,
              database_hash_line + f"            {hardening} \\\n",
          )

          path.write_text(source, encoding="utf-8")
          PY
          git diff --check
          grep -q "20260812022001_evidence_credibility_blind_audit_hardening.sql" \
            .github/workflows/evidence-credibility-blind-audit-qa.yml
          grep -q '\\i ${migration_hardening}' \
            .github/workflows/evidence-credibility-blind-audit-qa.yml

      - name: Commit the durable workflow update and remove this controller
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/evidence-credibility-blind-audit-qa.yml
          git rm .github/workflows/finalize-blind-audit-hardening.yml
          git commit -m "ci: validate blind-audit hardening migration"
          git push origin "HEAD:${GITHUB_REF_NAME}"
