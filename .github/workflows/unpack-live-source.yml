name: Unpack live source for inspection

on:
  push:
    branches:
      - agent/inspect-live-source-20260718

permissions:
  contents: write

jobs:
  unpack:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Unpack retained live source
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const zlib = require('node:zlib');
          const names = ['0a','0b','0c','0d','1','2','3','4a','4b','4c','4d','5a','5b','5c','5d'];
          const encoded = names.map((name) => fs.readFileSync(`public/mt-live-0d0e0f03-${name}.txt`, 'utf8')).join('');
          const source = zlib.gunzipSync(Buffer.from(encoded, 'base64')).toString('utf8');
          fs.mkdirSync('tmp', { recursive: true });
          fs.writeFileSync('tmp/live-source.html', source);

          const lines = source.split(/\r?\n/);
          const patterns = [
            /Your itinerary/i,
            /function\s+nowPage/i,
            /function\s+renderNow/i,
            /const\s+state\s*=/i,
            /let\s+state\s*=/i,
            /itinerary\s*:/i,
            /data-page=["']now/i,
            /function\s+render\s*\(/i,
          ];
          const windows = [];
          const used = new Set();
          for (const pattern of patterns) {
            lines.forEach((line, index) => {
              if (!pattern.test(line)) return;
              const start = Math.max(0, index - 28);
              const end = Math.min(lines.length, index + 42);
              const key = `${start}:${end}`;
              if (used.has(key)) return;
              used.add(key);
              windows.push(`\n===== ${pattern} at line ${index + 1} =====\n` + lines.slice(start, end).map((value, offset) => `${start + offset + 1}: ${value}`).join('\n'));
            });
          }
          fs.writeFileSync('tmp/live-source-snippets.txt', windows.join('\n'));
          NODE
      - name: Commit inspection artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp/live-source.html tmp/live-source-snippets.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh live source inspection artifacts"
          git push
