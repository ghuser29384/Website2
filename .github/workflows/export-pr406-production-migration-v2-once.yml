name: Export exact PR 406 production migration v2 once

on:
  push:
    branches:
      - ops/export-pr406-production-migration-20260804
    paths:
      - .github/workflows/export-pr406-production-migration-v2-once.yml

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: export-pr406-production-migration-v2-once
  cancel-in-progress: false

env:
  CONTROLLER_BRANCH: ops/export-pr406-production-migration-20260804
  CONTROLLER_PATH: .github/workflows/export-pr406-production-migration-v2-once.yml
  EXPECTED_MAIN: 732d79fb47ffdce2cecb6672735adb20a09f1098
  MIGRATION_PATH: supabase/migrations/20260801030000_mpgf_pledge_impact_live_foundation.sql
  EXPECTED_BLOB: c83ab30d7a84b2c97a70181fb5ba909cbebb75f4

jobs:
  export:
    if: github.repository == 'ghuser29384/Website2'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out immutable merged main
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_MAIN }}
          fetch-depth: 0

      - name: Guard and package exact merged migration
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$EXPECTED_MAIN"
          test "$(git rev-parse "HEAD:$MIGRATION_PATH")" = "$EXPECTED_BLOB"
          wc -l "$MIGRATION_PATH" | tee migration-line-count.txt
          git hash-object "$MIGRATION_PATH" | tee migration-git-blob.txt
          sha256sum "$MIGRATION_PATH" | tee migration-sha256.txt

      - name: Remove one-time controller
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          blob_sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/$CONTROLLER_PATH?ref=$CONTROLLER_BRANCH" --jq .sha)"
          jq -n \
            --arg message 'Remove one-time PR 406 migration export v2 controller' \
            --arg sha "$blob_sha" \
            --arg branch "$CONTROLLER_BRANCH" \
            '{message:$message,sha:$sha,branch:$branch}' \
            | gh api --method DELETE "repos/$GITHUB_REPOSITORY/contents/$CONTROLLER_PATH" --input - >/dev/null

      - name: Upload exact migration source
        uses: actions/upload-artifact@v4
        with:
          name: pr406-production-migration-${{ github.run_id }}
          path: |
            supabase/migrations/20260801030000_mpgf_pledge_impact_live_foundation.sql
            migration-line-count.txt
            migration-git-blob.txt
            migration-sha256.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish export run receipt
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          gh pr comment 406 --repo "$GITHUB_REPOSITORY" --body "Exact merged production migration source exported from \`$EXPECTED_MAIN\` with Git blob \`$EXPECTED_BLOB\`. Run \`$GITHUB_RUN_ID\`: $run_url"
