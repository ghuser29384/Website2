name: Apply PR 212 absolute TypeScript repair

on:
  push:
    branches:
      - ops/pr212-absolute-gates-20260729
    paths:
      - .github/workflows/apply-pr212-typescript-repair.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-pr212-typescript-repair
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      EXPECTED_HEAD: 9ad919bc281a9f701d4a5adfb518055c864393b3
      EXPECTED_PATCH_SHA256: 7ad9ef54459296e38cd234c6938a1f5dbe72edd36fed8e0772e7cbc363314173
    steps:
      - name: Check out exact PR branch
        uses: actions/checkout@v4
        with:
          ref: feat/institutional-trade-system
          fetch-depth: 0

      - name: Verify head and apply exact repair patch
        shell: bash
        run: |
          set -euo pipefail
          actual_head="$(git rev-parse HEAD)"
          if [[ "$actual_head" != "$EXPECTED_HEAD" ]]; then
            echo "PR #212 moved: expected $EXPECTED_HEAD, got $actual_head" >&2
            exit 1
          fi

          cat > /tmp/pr212-typescript-repair.patch.gz.b64 <<'PATCH'
          
          PATCH
          base64 --decode /tmp/pr212-typescript-repair.patch.gz.b64 | gzip --decompress > /tmp/pr212-typescript-repair.patch
          echo "${EXPECTED_PATCH_SHA256}  /tmp/pr212-typescript-repair.patch" | sha256sum --check --strict
          git apply --check /tmp/pr212-typescript-repair.patch
          git apply /tmp/pr212-typescript-repair.patch
          git diff --check

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            if npm ci; then exit 0; fi
            if (( attempt == 4 )); then exit 1; fi
            sleep $((attempt * 20))
          done

      - name: Require absolute TypeScript success
        run: npx tsc --noEmit --pretty false

      - name: Commit exact repair to PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/app/how-it-works/page.tsx \
            src/lib/crawlability.test.ts \
            src/lib/discovery-ranking.test.ts \
            src/lib/funding.test.ts \
            src/lib/payments/conditional-state.test.ts \
            src/lib/public-route-smoke.test.ts \
            src/lib/x-profile-connector.test.ts \
            tsconfig.json
          git commit -m "Repair repository-wide TypeScript errors"
          git push origin HEAD:feat/institutional-trade-system
