name: Configure release classification ruleset once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/configure-release-classification-ruleset-once.yml

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: configure-release-classification-ruleset-once
  cancel-in-progress: false

env:
  CONTROLLER_PATH: .github/workflows/configure-release-classification-ruleset-once.yml
  RULESET_NAME: Require release classification
  REQUIRED_CONTEXT: release-classification
  GITHUB_ACTIONS_INTEGRATION_ID: '15368'

jobs:
  configure:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out the exact controller commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Guard repository, branch, actor, and scope
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'ghuser29384/Website2'
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$GITHUB_ACTOR" = 'ghuser29384'
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          changed="$(git diff-tree --no-commit-id --name-only -r HEAD | sed '/^$/d')"
          test "$changed" = "$CONTROLLER_PATH"

      - name: Select an administration-capable credential
        shell: bash
        env:
          DEFAULT_TOKEN: ${{ github.token }}
          GH_ADMIN_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
          GITHUB_ADMIN_TOKEN: ${{ secrets.GITHUB_ADMIN_TOKEN }}
          REPOSITORY_ADMIN_TOKEN: ${{ secrets.REPOSITORY_ADMIN_TOKEN }}
          REPO_ADMIN_TOKEN: ${{ secrets.REPO_ADMIN_TOKEN }}
          ADMIN_TOKEN_SECRET: ${{ secrets.ADMIN_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_PAT: ${{ secrets.GITHUB_PAT }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          token="$DEFAULT_TOKEN"
          source='github.token'
          for candidate in \
            GH_ADMIN_TOKEN \
            GITHUB_ADMIN_TOKEN \
            REPOSITORY_ADMIN_TOKEN \
            REPO_ADMIN_TOKEN \
            ADMIN_TOKEN_SECRET \
            GH_PAT \
            GITHUB_PAT \
            PERSONAL_ACCESS_TOKEN
          do
            value="${!candidate:-}"
            if [[ -n "$value" ]]; then
              token="$value"
              source="$candidate"
              break
            fi
          done
          echo "::add-mask::$token"
          {
            echo "RULESET_ADMIN_TOKEN=$token"
            echo "RULESET_ADMIN_TOKEN_SOURCE=$source"
          } >> "$GITHUB_ENV"

      - name: Remove the one-time controller before enabling enforcement
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          blob_sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/$CONTROLLER_PATH?ref=main" --jq .sha)"
          jq -n \
            --arg message 'Remove release classification ruleset controller' \
            --arg sha "$blob_sha" \
            --arg branch main \
            '{message:$message,sha:$sha,branch:$branch}' \
            | gh api --method DELETE \
                "repos/$GITHUB_REPOSITORY/contents/$CONTROLLER_PATH" \
                --input - >/dev/null

      - name: Create or update the required-status ruleset
        id: apply
        shell: bash
        run: |
          set -euo pipefail
          api='https://api.github.com'
          accept='Accept: application/vnd.github+json'
          version='X-GitHub-Api-Version: 2022-11-28'
          auth="Authorization: Bearer $RULESET_ADMIN_TOKEN"
          repo_path="repos/$GITHUB_REPOSITORY"

          jq -n \
            --arg name "$RULESET_NAME" \
            --arg context "$REQUIRED_CONTEXT" \
            --argjson integration_id "$GITHUB_ACTIONS_INTEGRATION_ID" \
            '{
              name: $name,
              target: "branch",
              enforcement: "active",
              bypass_actors: [
                {
                  actor_id: $integration_id,
                  actor_type: "Integration",
                  bypass_mode: "always"
                }
              ],
              conditions: {
                ref_name: {
                  include: ["refs/heads/main"],
                  exclude: []
                }
              },
              rules: [
                {
                  type: "required_status_checks",
                  parameters: {
                    do_not_enforce_on_create: true,
                    required_status_checks: [
                      {
                        context: $context,
                        integration_id: $integration_id
                      }
                    ],
                    strict_required_status_checks_policy: false
                  }
                }
              ]
            }' > release-classification-ruleset-request.json

          list_code="$(curl --silent --show-error \
            --header "$accept" \
            --header "$auth" \
            --header "$version" \
            --output release-classification-rulesets-before.json \
            --write-out '%{http_code}' \
            "$api/$repo_path/rulesets?per_page=100")"
          echo "list_code=$list_code" >> "$GITHUB_OUTPUT"

          if [[ "$list_code" != '200' ]]; then
            jq -n \
              --arg source "$RULESET_ADMIN_TOKEN_SOURCE" \
              --arg list_code "$list_code" \
              '{verified:false,credential_source:$source,list_http_status:$list_code,reason:"Administration-write credential unavailable or unauthorized"}' \
              > release-classification-ruleset-result.json
            echo 'verified=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ruleset_id="$(jq -r --arg name "$RULESET_NAME" '.[] | select(.name == $name) | .id' release-classification-rulesets-before.json | head -n1)"
          if [[ -n "$ruleset_id" ]]; then
            method=PUT
            endpoint="$api/$repo_path/rulesets/$ruleset_id"
          else
            method=POST
            endpoint="$api/$repo_path/rulesets"
          fi

          apply_code="$(curl --silent --show-error \
            --request "$method" \
            --header "$accept" \
            --header "$auth" \
            --header "$version" \
            --header 'Content-Type: application/json' \
            --data-binary @release-classification-ruleset-request.json \
            --output release-classification-ruleset-apply.json \
            --write-out '%{http_code}' \
            "$endpoint")"
          echo "apply_code=$apply_code" >> "$GITHUB_OUTPUT"
          if [[ "$apply_code" != '200' && "$apply_code" != '201' ]]; then
            jq -n \
              --arg source "$RULESET_ADMIN_TOKEN_SOURCE" \
              --arg list_code "$list_code" \
              --arg apply_code "$apply_code" \
              '{verified:false,credential_source:$source,list_http_status:$list_code,apply_http_status:$apply_code,reason:"Ruleset mutation was rejected"}' \
              > release-classification-ruleset-result.json
            echo 'verified=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ruleset_id="$(jq -r '.id' release-classification-ruleset-apply.json)"
          verify_code="$(curl --silent --show-error \
            --header "$accept" \
            --header "$auth" \
            --header "$version" \
            --output release-classification-ruleset-after.json \
            --write-out '%{http_code}' \
            "$api/$repo_path/rulesets/$ruleset_id")"
          echo "verify_code=$verify_code" >> "$GITHUB_OUTPUT"

          verified=false
          if [[ "$verify_code" == '200' ]] && jq -e \
            --arg name "$RULESET_NAME" \
            --arg context "$REQUIRED_CONTEXT" \
            --argjson integration_id "$GITHUB_ACTIONS_INTEGRATION_ID" \
            '
              .name == $name and
              .target == "branch" and
              .enforcement == "active" and
              (.conditions.ref_name.include | index("refs/heads/main")) != null and
              any(.bypass_actors[]?; .actor_type == "Integration" and .actor_id == $integration_id and .bypass_mode == "always") and
              any(.rules[]?;
                .type == "required_status_checks" and
                .parameters.strict_required_status_checks_policy == false and
                any(.parameters.required_status_checks[]?;
                  .context == $context and .integration_id == $integration_id
                )
              )
            ' release-classification-ruleset-after.json >/dev/null
          then
            verified=true
          fi

          jq -n \
            --arg source "$RULESET_ADMIN_TOKEN_SOURCE" \
            --arg ruleset_id "$ruleset_id" \
            --arg list_code "$list_code" \
            --arg apply_code "$apply_code" \
            --arg verify_code "$verify_code" \
            --argjson verified "$verified" \
            '{verified:$verified,credential_source:$source,ruleset_id:$ruleset_id,list_http_status:$list_code,apply_http_status:$apply_code,verify_http_status:$verify_code}' \
            > release-classification-ruleset-result.json
          echo "verified=$verified" >> "$GITHUB_OUTPUT"

      - name: Upload redacted ruleset evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-classification-ruleset-${{ github.run_id }}
          path: |
            release-classification-ruleset-request.json
            release-classification-rulesets-before.json
            release-classification-ruleset-apply.json
            release-classification-ruleset-after.json
            release-classification-ruleset-result.json
          if-no-files-found: warn
          retention-days: 30

      - name: Report exact result to the implementation and canary pull requests
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED: ${{ steps.apply.outputs.verified }}
        run: |
          set -euo pipefail
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          result="$(jq -c . release-classification-ruleset-result.json 2>/dev/null || echo '{}')"
          if [[ "$VERIFIED" == 'true' ]]; then
            body="The active repository ruleset now requires the GitHub-Actions-sourced \`release-classification\` context for updates to \`main\`, while allowing the GitHub Actions integration to perform authorized maintenance. Redacted verification: \`$result\`. Evidence: $run_url"
          else
            body="The release-classification workflow is proven stable, but automatic ruleset activation could not be verified. Redacted result: \`$result\`. Evidence: $run_url"
          fi
          gh pr comment 428 --repo "$GITHUB_REPOSITORY" --body "$body"
          gh pr comment 432 --repo "$GITHUB_REPOSITORY" --body "$body"

      - name: Enforce verified ruleset state
        if: always()
        env:
          VERIFIED: ${{ steps.apply.outputs.verified }}
        run: test "$VERIFIED" = 'true'
