name: PR 737 one-use rollback join repair

on:
  pull_request:
    branches: [agent/mpgf-public-goods-compacts]
    paths:
      - .github/workflows/pr737-fix-rollback-join-once.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pr737-fix-rollback-join-once
  cancel-in-progress: false

env:
  EXPECTED_PARENT: 627766b4096461c455c7e924d83b99068570f8be
  TARGET_BRANCH: feature/compact-authoritative-outflow-ledger-v1-20260816
  TARGET_PATH: .github/workflows/compact-authoritative-outflow-ledger-qa.yml
  CONTROLLER_PATH: .github/workflows/pr737-fix-rollback-join-once.yml

jobs:
  repair:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.number == 737 && github.event.pull_request.head.ref == 'feature/compact-authoritative-outflow-ledger-v1-20260816')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Apply exact repair and remove this controller
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git diff --name-only "$EXPECTED_PARENT"..HEAD)" = "$CONTROLLER_PATH"
          remote_head="$(git ls-remote --heads origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$remote_head" = "$(git rev-parse HEAD)"

          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path(os.environ["TARGET_PATH"])
          text = path.read_text()
          bad = "select 'public_relations|' || count(*) from pg_class c join pg_namespace n on n.oid=c.nspname where n.nspname='public' and c.relname like 'mpgf_public_goods_%'"
          good = "select 'public_relations|' || count(*) from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname='public' and c.relname like 'mpgf_public_goods_%'"
          if text.count(bad) != 1:
              raise SystemExit(f"expected exactly one bad join, found {text.count(bad)}")
          repaired = text.replace(bad, good, 1)
          if repaired.count(bad) != 0:
              raise SystemExit("bad join remains after repair")
          if repaired.count(good) != 2:
              raise SystemExit(f"expected exactly two canonical joins, found {repaired.count(good)}")
          path.write_text(repaired)
          PY

          rm "$CONTROLLER_PATH"
          git diff --check
          test "$(git diff --name-only "$EXPECTED_PARENT")" = "$TARGET_PATH"
          test "$(git diff --numstat "$EXPECTED_PARENT" -- "$TARGET_PATH")" = $'1\t1\t.github/workflows/compact-authoritative-outflow-ledger-qa.yml'
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$TARGET_PATH" "$CONTROLLER_PATH"
          git commit -m "ci: restore rollback namespace join"
          git push origin "HEAD:$TARGET_BRANCH"
