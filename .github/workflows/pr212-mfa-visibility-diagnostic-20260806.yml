name: PR 212 MFA visibility diagnostic 20260806

on:
  push:
    branches:
      - ops/pr212-mfa-visibility-diagnostic-20260806
    paths:
      - .github/workflows/pr212-mfa-visibility-diagnostic-20260806.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: pr212-mfa-visibility-diagnostic-20260806
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      EXPECTED_HEAD: dbbb0afbb42ef9a1636be073bb1d47343badd98b
      QA_PROJECT_REF: hvmxfjjbdcgjjudmthdz
      NEXT_PUBLIC_SUPABASE_URL: https://hvmxfjjbdcgjjudmthdz.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.QA_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.QA_SUPABASE_SERVICE_ROLE_KEY }}
      QA_TEST_PASSWORD: ${{ secrets.QA_TEST_PASSWORD }}
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      SITE_URL: http://127.0.0.1:3000
      INSTITUTIONAL_TRADES_ENABLED: "true"
      INSTITUTIONAL_POOLS_ENABLED: "true"
      INSTITUTIONAL_ENTERPRISE_API_ENABLED: "true"
      INSTITUTIONAL_WEBHOOKS_ENABLED: "true"
      INSTITUTIONAL_E2E_BASE_URL: http://127.0.0.1:3000
      INSTITUTIONAL_E2E_OUTPUT_DIR: institutional-e2e-diagnostic
      CRON_SECRET: qa-institutional-cron-not-production
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Clone the exact PR 212 head without marketplace actions
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm --version
          git init target
          git -C target remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C target fetch --depth=1 origin "$EXPECTED_HEAD"
          git -C target checkout --detach FETCH_HEAD
          actual="$(git -C target rev-parse HEAD)"
          [[ "$actual" == "$EXPECTED_HEAD" ]] || {
            echo "PR #212 moved or checkout drifted: expected $EXPECTED_HEAD, found $actual" >&2
            exit 1
          }
          [[ "$NEXT_PUBLIC_SUPABASE_URL" == *"$QA_PROJECT_REF"* ]]
          [[ "$NEXT_PUBLIC_SUPABASE_URL" != *"jnpoxvalyjtdghnperyu"* ]]

      - name: Install dependencies with retry
        shell: bash
        working-directory: target
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            if npm ci; then exit 0; fi
            if (( attempt == 4 )); then exit 1; fi
            sleep $((attempt * 20))
          done

      - name: Install Chromium
        working-directory: target
        run: npx playwright install --with-deps chromium

      - name: Add fail-closed MFA visibility evidence locally
        shell: bash
        working-directory: target
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          target = Path('.github/scripts/institutional-trade-qa-e2e.mjs')
          text = target.read_text(encoding='utf-8')
          needle = '  await panel.scrollIntoViewIfNeeded();\n'
          if text.count(needle) != 1:
              raise SystemExit(f'Expected one ensureMfa scroll line, found {text.count(needle)}.')

          diagnostic_lines = [
              '  const panelCount = await page.locator("article#account-security").count();',
              '  const visibilityDiagnostic = await page.locator("article#account-security").evaluateAll((elements) =>',
              '    elements.map((element) => {',
              '      const ancestry = [];',
              '      let node = element;',
              '      while (node) {',
              '        const style = window.getComputedStyle(node);',
              '        const rect = node.getBoundingClientRect();',
              '        ancestry.push({',
              '          tag: node.tagName,',
              '          id: node.id || null,',
              '          className: typeof node.className === "string" ? node.className : null,',
              '          hidden: Boolean(node.hidden),',
              '          ariaHidden: node.getAttribute("aria-hidden"),',
              '          open: node.tagName === "DETAILS" ? Boolean(node.open) : null,',
              '          display: style.display,',
              '          visibility: style.visibility,',
              '          opacity: style.opacity,',
              '          contentVisibility: style.contentVisibility,',
              '          overflow: style.overflow,',
              '          position: style.position,',
              '          rect: { x: rect.x, y: rect.y, width: rect.width, height: rect.height },',
              '        });',
              '        node = node.parentElement;',
              '      }',
              '      return ancestry;',
              '    }),',
              '  );',
              '  await writeFile(',
              '    path.join(outputDir, `mfa-${user.role}-visibility.json`),',
              '    JSON.stringify({',
              '      runId,',
              '      role: user.role,',
              '      url: page.url(),',
              '      title: await page.title(),',
              '      panelCount,',
              '      visibilityDiagnostic,',
              '      bodyText: (await page.locator("body").innerText()).slice(0, 6000),',
              '    }, null, 2),',
              '  );',
              '  await page.screenshot({',
              '    path: path.join(outputDir, `mfa-${user.role}-before-scroll.png`),',
              '    fullPage: true,',
              '  });',
          ]
          diagnostic = '\n'.join(diagnostic_lines) + '\n'
          target.write_text(text.replace(needle, diagnostic + needle, 1), encoding='utf-8')
          PY
          node --check .github/scripts/institutional-trade-qa-e2e.mjs
          git diff --check

      - name: Build exact feature head
        working-directory: target
        run: npm run build

      - name: Start application
        shell: bash
        working-directory: target
        run: |
          set -euo pipefail
          npm run start > institutional-diagnostic-server.log 2>&1 &
          echo $! > institutional-diagnostic-server.pid
          for attempt in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat institutional-diagnostic-server.log >&2
          exit 1

      - name: Run isolated authenticated diagnostic
        id: e2e
        shell: bash
        working-directory: target
        run: |
          set +e
          node .github/scripts/institutional-trade-qa-e2e.mjs 2>&1 | tee institutional-e2e-diagnostic.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish computed visibility evidence on PR 212
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          status="${{ steps.e2e.outputs.status || 'not-run' }}"
          evidence_file="target/institutional-e2e-diagnostic/mfa-verifier-visibility.json"
          if [[ -f "$evidence_file" ]]; then
            evidence="$(jq -c '{role,url,title,panelCount,visibilityDiagnostic,bodyText:(.bodyText[0:1800])}' "$evidence_file")"
          else
            evidence='{"diagnostic":"visibility evidence file was not produced"}'
          fi
          server_tail="$(tail -n 80 target/institutional-diagnostic-server.log 2>/dev/null || true)"
          e2e_tail="$(tail -n 120 target/institutional-e2e-diagnostic.log 2>/dev/null || true)"
          body_file="$(mktemp)"
          cat > "$body_file" <<EOF
          <!-- pr212-mfa-visibility-diagnostic-20260806 -->
          ## PR #212 MFA visibility diagnostic

          - Exact feature head: \`$EXPECTED_HEAD\`
          - Diagnostic run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          - Authenticated E2E exit status: \`$status\`

          <details><summary>Computed visibility evidence</summary>

          \`\`\`json
          $evidence
          \`\`\`
          </details>

          <details><summary>E2E log tail</summary>

          \`\`\`
          $e2e_tail
          \`\`\`
          </details>

          <details><summary>Server log tail</summary>

          \`\`\`
          $server_tail
          \`\`\`
          </details>

          This pure-shell diagnostic bypasses the transient GitHub marketplace-action download outage. It modifies only an ephemeral checkout and runs against isolated QA. PR #212 remains draft and unmerged; production database, deployment, payment, custody, payout, and feature flags are unchanged.
          EOF
          gh pr comment 212 --repo "$GITHUB_REPOSITORY" --body-file "$body_file"
