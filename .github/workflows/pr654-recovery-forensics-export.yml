name: PR654 recovery forensics export

on:
  push:
    branches:
      - qa/pr654-recovery-forensics-export-20260816
    paths:
      - .github/workflows/pr654-recovery-forensics-export.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out QA harness
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: harness
          fetch-depth: 1
          persist-credentials: false

      - name: Check out exact product head with full history
        uses: actions/checkout@v4
        with:
          ref: f0ea581e8956f7987e58dd2240a7e0249bf7cb06
          path: product
          fetch-depth: 0
          persist-credentials: false

      - name: Export product tree and lineage evidence
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/pr654-recovery-export"
          mkdir -p "$evidence/history" "$evidence/schema-history" "$evidence/manifests"
          cd "$GITHUB_WORKSPACE/product"

          test "$(git rev-parse HEAD)" = "f0ea581e8956f7987e58dd2240a7e0249bf7cb06"
          test -z "$(git symbolic-ref -q --short HEAD || true)"
          test -z "$(git status --porcelain)"

          git ls-remote origin \
            refs/heads/qa/pooled-settlement-payer-fix-candidate-20260813 \
            refs/heads/main \
            > "$evidence/manifests/remote-refs.txt"

          tar --exclude=.git -czf "$evidence/product-tree.tar.gz" .
          sha256sum "$evidence/product-tree.tar.gz" > "$evidence/product-tree.tar.gz.sha256"

          git log --all --follow --date=iso-strict \
            --format='%H%x09%P%x09%aI%x09%s' -- supabase/schema.sql \
            > "$evidence/history/schema-sql-log.tsv"
          git log --all --reverse --follow --date=iso-strict \
            --format='%H%x09%P%x09%aI%x09%s' -- supabase/schema.sql \
            > "$evidence/history/schema-sql-log-reverse.tsv"
          git log --all -p --follow -- supabase/schema.sql \
            > "$evidence/history/schema-sql-patch-history.txt"

          while IFS=$'\t' read -r commit rest; do
            test -n "$commit" || continue
            if git cat-file -e "$commit:supabase/schema.sql" 2>/dev/null; then
              git show "$commit:supabase/schema.sql" \
                > "$evidence/schema-history/${commit}.sql"
            fi
          done < "$evidence/history/schema-sql-log.tsv"

          git log --all --date=iso-strict \
            --format='%H%x09%P%x09%aI%x09%s' -- supabase/migrations \
            > "$evidence/history/migrations-log.tsv"
          git log --all --reverse --date=iso-strict \
            --format='%H%x09%P%x09%aI%x09%s' -- supabase/migrations \
            > "$evidence/history/migrations-log-reverse.tsv"
          git log --all --diff-filter=A --date=iso-strict \
            --format='%H%x09%P%x09%aI%x09%s' -- \
            supabase/migrations/20260422_background_networking_non_ai.sql \
            > "$evidence/history/first-migration-introduction.tsv"
          git blame --line-porcelain supabase/migrations/README.md \
            > "$evidence/history/migrations-readme-blame.txt" || true

          git grep -n -I -E \
            'supabase/schema\.sql|schema\.sql|db reset|migration repair|migration baseline|Supabase SQL editor|full rebuilt schema|base schema|bootstrap' \
            -- . > "$evidence/history/repository-baseline-references.txt" || true

          for needle in \
            'create table if not exists public.profiles' \
            'create table if not exists public.offers' \
            'create table if not exists public.match_suggestions' \
            'function public.set_updated_at'
          do
            safe="$(printf '%s' "$needle" | tr ' /().' '______')"
            git log --all -S"$needle" --date=iso-strict \
              --format='%H%x09%P%x09%aI%x09%s' -- supabase \
              > "$evidence/history/${safe}.tsv" || true
          done

          first_commit="$(cut -f1 "$evidence/history/first-migration-introduction.tsv" | head -1)"
          first_parent="$(cut -f2 "$evidence/history/first-migration-introduction.tsv" | head -1 | awk '{print $1}')"
          printf 'first_commit=%s\nfirst_parent=%s\n' "$first_commit" "$first_parent" \
            > "$evidence/history/first-migration-identity.txt"
          for commit in "$first_parent" "$first_commit"; do
            test -n "$commit" || continue
            git ls-tree -r --name-only "$commit" -- supabase \
              > "$evidence/history/supabase-tree-${commit}.txt" || true
            if git cat-file -e "$commit:supabase/schema.sql" 2>/dev/null; then
              git show "$commit:supabase/schema.sql" \
                > "$evidence/schema-history/first-migration-context-${commit}.sql"
            fi
          done

          python3 - <<'PY' > "$evidence/manifests/migration-inventory.json"
          from collections import defaultdict
          from pathlib import Path
          import hashlib
          import json
          import re

          root = Path('supabase/migrations')
          rows = []
          by_version = defaultdict(list)
          for path in sorted(p for p in root.iterdir() if p.is_file()):
              match = re.match(r'^(\d+)_', path.name)
              version = match.group(1) if match else ''
              if version:
                  by_version[version].append(path.name)
              data = path.read_bytes()
              rows.append({
                  'name': path.name,
                  'version': version,
                  'standard14': bool(re.fullmatch(r'\d{14}', version)),
                  'sql': path.suffix.lower() == '.sql',
                  'size': len(data),
                  'sha256': hashlib.sha256(data).hexdigest(),
              })
          print(json.dumps({
              'rows': rows,
              'duplicates': {k: v for k, v in by_version.items() if len(v) > 1},
          }, indent=2, sort_keys=True))
          PY

          tar -C "$(dirname "$evidence")" -czf \
            "$GITHUB_WORKSPACE/pr654-recovery-export.tar.gz" \
            "$(basename "$evidence")"
          sha256sum "$GITHUB_WORKSPACE/pr654-recovery-export.tar.gz" \
            > "$GITHUB_WORKSPACE/pr654-recovery-export.tar.gz.sha256"

      - name: Upload export
        uses: actions/upload-artifact@v4
        with:
          name: pr654-recovery-export-${{ github.run_id }}
          path: |
            pr654-recovery-export.tar.gz
            pr654-recovery-export.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
