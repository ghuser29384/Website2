name: Issue 714 PR 698 merge diagnostic

on:
  push:
    branches:
      - ops/issue714-pr698-merge-diagnostic-20260817

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out PR branch with complete history
        uses: actions/checkout@v4
        with:
          ref: agent/issue-675-activation-routing-canonical-walkthrough
          fetch-depth: 0

      - name: Verify exact inputs and simulate normal merge
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_MAIN='c2d7be6a895f1bb8c9ced1b257eb8b4381d50ac3'
          EXPECTED_HEAD='8f1ddb8b15204536155b669d8d3d1f76498e7e78'
          ACTUAL_HEAD="$(git rev-parse HEAD)"
          git fetch --no-tags origin main
          ACTUAL_MAIN="$(git rev-parse origin/main)"
          printf 'expected_head=%s\nactual_head=%s\nexpected_main=%s\nactual_main=%s\n' \
            "$EXPECTED_HEAD" "$ACTUAL_HEAD" "$EXPECTED_MAIN" "$ACTUAL_MAIN" | tee /tmp/issue714-merge-diagnostic.txt
          test "$ACTUAL_HEAD" = "$EXPECTED_HEAD"
          test "$ACTUAL_MAIN" = "$EXPECTED_MAIN"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          set +e
          git merge --no-commit --no-ff "$EXPECTED_MAIN" >/tmp/merge.stdout 2>/tmp/merge.stderr
          MERGE_STATUS=$?
          set -e

          {
            printf '\nmerge_status=%s\n\n' "$MERGE_STATUS"
            printf '%s\n' '--- merge stdout ---'
            cat /tmp/merge.stdout
            printf '%s\n' '--- merge stderr ---'
            cat /tmp/merge.stderr
            printf '%s\n' '--- unmerged paths ---'
            git diff --name-only --diff-filter=U || true
            printf '%s\n' '--- index status ---'
            git status --short
            printf '%s\n' '--- conflict hunks ---'
            git diff --cc || true
          } >> /tmp/issue714-merge-diagnostic.txt

          cat /tmp/issue714-merge-diagnostic.txt
          git merge --abort || true

      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: issue714-pr698-merge-diagnostic
          path: /tmp/issue714-merge-diagnostic.txt
          if-no-files-found: error
          retention-days: 7
