name: Issue 714 PR 698 private log and cookie hardening

on:
  push:
    branches:
      - ops/issue714-pr698-merge-diagnostic-20260817

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact PR candidate
        uses: actions/checkout@v4
        with:
          ref: agent/issue-675-activation-routing-canonical-walkthrough
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Guard exact inputs
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_HEAD='b490707ca1eecc46f2f747f2cc32864fbd1a2831'
          EXPECTED_MAIN='c2d7be6a895f1bb8c9ced1b257eb8b4381d50ac3'
          TARGET_BRANCH='agent/issue-675-activation-routing-canonical-walkthrough'
          git fetch --no-tags origin main "$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse "origin/$TARGET_BRANCH")" = "$EXPECTED_HEAD"
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-list --count HEAD..origin/main)" = '0'

      - name: Scope the handoff cookie and sanitize Complete Profile logs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              source = file.read_text()
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one exact match, found {count}")
              file.write_text(source.replace(old, new, 1))

          replace_once(
              "src/lib/walkthrough-profile.ts",
              'export const WALKTHROUGH_PROFILE_MAX_AGE_SECONDS = 60 * 60 * 24 * 7;\n',
              'export const WALKTHROUGH_PROFILE_MAX_AGE_SECONDS = 60 * 60 * 4;\n',
          )
          replace_once(
              "src/app/walkthrough/actions.ts",
              '''    path: "/",
              sameSite: "lax",
          ''',
              '''    path: "/complete-profile",
              sameSite: "lax",
          ''',
          )

          actions = "src/app/complete-profile/actions.ts"
          replace_once(
              actions,
              '''function read(formData: FormData, key: string) {
            const value = formData.get(key);
            return typeof value === "string" ? value : "";
          }

          ''',
              '''function read(formData: FormData, key: string) {
            const value = formData.get(key);
            return typeof value === "string" ? value : "";
          }

          function getSafeErrorCode(error: unknown) {
            if (!error || typeof error !== "object" || !("code" in error)) {
              return "unknown";
            }

            const code = (error as { code?: unknown }).code;
            return typeof code === "string" && /^[A-Za-z0-9_-]{1,32}$/.test(code)
              ? code
              : "unknown";
          }

          ''',
          )
          replacements = {
              'console.error("Failed to encrypt complete-profile preferences", error);':
                  'console.error("Failed to encrypt complete-profile preferences", { code: getSafeErrorCode(error) });',
              'console.error("Failed to update complete profile identity", profileError);':
                  'console.error("Failed to update complete profile identity", { code: getSafeErrorCode(profileError) });',
              'console.error("Failed to save complete profile onboarding", onboardingError);':
                  'console.error("Failed to save complete profile onboarding", { code: getSafeErrorCode(onboardingError) });',
              'console.error("Failed to save complete profile matching preferences", wishProfileError);':
                  'console.error("Failed to save complete profile matching preferences", { code: getSafeErrorCode(wishProfileError) });',
              'console.error("Failed to attach ranked priorities to profile synthesis", synthesisError);':
                  'console.error("Failed to attach ranked priorities to profile synthesis", { code: getSafeErrorCode(synthesisError) });',
          }
          for old, new in replacements.items():
              replace_once(actions, old, new)
          replace_once(
              actions,
              '''    console.error("Failed to persist completed profile activation", {
                message: transitionError?.message ?? "Unexpected activation stage",
                profileId: viewer.authUser.id,
                transitionedStage,
              });
          ''',
              '''    console.error("Failed to persist completed profile activation", {
                reason: transitionError ? "transition_error" : "unexpected_stage",
              });
          ''',
          )
          replace_once(
              actions,
              '''  if (profileSource === "walkthrough") {
            const cookieStore = await cookies();
            cookieStore.delete(WALKTHROUGH_PROFILE_COOKIE_NAME);
          }
          ''',
              '''  if (profileSource === "walkthrough") {
            const cookieStore = await cookies();
            cookieStore.delete(WALKTHROUGH_PROFILE_COOKIE_NAME);
            cookieStore.set(WALKTHROUGH_PROFILE_COOKIE_NAME, "", {
              expires: new Date(0),
              httpOnly: true,
              path: "/complete-profile",
              sameSite: "lax",
              secure: process.env.NODE_ENV === "production",
            });
          }
          ''',
          )

          test_path = Path("src/walkthrough-private-handoff.test.ts")
          source = test_path.read_text()
          old = '''  const actionSource = readFileSync("src/app/walkthrough/actions.ts", "utf8");
            const pageSource = readFileSync("src/app/complete-profile/page.tsx", "utf8");

            assert.doesNotMatch(actionSource, /profileId:/);
            assert.doesNotMatch(actionSource, /message:\\s*transitionError/);
            assert.match(actionSource, /buildWalkthroughCompleteProfilePath\\(draft\\)/);
            assert.match(pageSource, /hasWalkthroughPrivateQuery\\(resolvedSearchParams\\)/);
            assert.match(pageSource, /const baseReturnTo = "\\/complete-profile"/);
            assert.doesNotMatch(pageSource, /buildCompleteProfilePath/);
            assert.doesNotMatch(pageSource, /walkthrough_cause/);
            assert.doesNotMatch(pageSource, /match_get/);
            assert.doesNotMatch(pageSource, /match_give/);
          });
          '''
          new = '''  const actionSource = readFileSync("src/app/walkthrough/actions.ts", "utf8");
            const completeActionSource = readFileSync("src/app/complete-profile/actions.ts", "utf8");
            const pageSource = readFileSync("src/app/complete-profile/page.tsx", "utf8");

            assert.doesNotMatch(actionSource, /profileId:/);
            assert.doesNotMatch(actionSource, /message:\\s*transitionError/);
            assert.match(actionSource, /path:\\s*"\\/complete-profile"/);
            assert.match(actionSource, /buildWalkthroughCompleteProfilePath\\(draft\\)/);
            assert.doesNotMatch(completeActionSource, /profileId:/);
            assert.doesNotMatch(completeActionSource, /message:\\s*transitionError/);
            assert.doesNotMatch(completeActionSource, /console\\.error\\([^;]+,\\s*(?:error|profileError|onboardingError|wishProfileError|synthesisError)\\);/s);
            assert.match(completeActionSource, /getSafeErrorCode/);
            assert.match(completeActionSource, /path:\\s*"\\/complete-profile"/);
            assert.match(pageSource, /hasWalkthroughPrivateQuery\\(resolvedSearchParams\\)/);
            assert.match(pageSource, /const baseReturnTo = "\\/complete-profile"/);
            assert.doesNotMatch(pageSource, /buildCompleteProfilePath/);
            assert.doesNotMatch(pageSource, /walkthrough_cause/);
            assert.doesNotMatch(pageSource, /match_get/);
            assert.doesNotMatch(pageSource, /match_give/);
          });
          '''
          if source.count(old) != 1:
              raise SystemExit("private-handoff test: expected one exact source-wiring block")
          test_path.write_text(source.replace(old, new, 1))
          PY
          git diff --check
          git status --short

      - name: Install exact dependencies
        run: npm ci

      - name: Run focused privacy and activation gates
        shell: bash
        run: |
          set -euo pipefail
          node --import tsx --test \
            src/walkthrough-private-handoff.test.ts \
            src/walkthrough-next-canonical.test.ts \
            src/lib/account-activation.test.ts \
            src/lib/auth-routes.test.ts
          npx eslint \
            src/lib/walkthrough-profile.ts \
            src/app/walkthrough/actions.ts \
            src/app/complete-profile/actions.ts \
            src/walkthrough-private-handoff.test.ts
          npx tsc --noEmit --pretty false

      - name: Commit and push the bounded hardening
        shell: bash
        run: |
          set -euo pipefail
          TARGET_BRANCH='agent/issue-675-activation-routing-canonical-walkthrough'
          EXPECTED_PARENT='b490707ca1eecc46f2f747f2cc32864fbd1a2831'
          test "$(git rev-parse HEAD)" = "$EXPECTED_PARENT"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/lib/walkthrough-profile.ts \
            src/app/walkthrough/actions.ts \
            src/app/complete-profile/actions.ts \
            src/walkthrough-private-handoff.test.ts
          git diff --cached --check
          git commit -m 'Scope activation drafts and sanitize setup logs'
          NEW_HEAD="$(git rev-parse HEAD)"
          NEW_TREE="$(git rev-parse HEAD^{tree})"
          test -z "$(git status --porcelain)"
          git push origin "HEAD:$TARGET_BRANCH"
          {
            printf 'parent=%s\nhead=%s\ntree=%s\n' "$EXPECTED_PARENT" "$NEW_HEAD" "$NEW_TREE"
            printf 'main=%s\nahead=%s\nbehind=%s\n' \
              "$(git rev-parse origin/main)" \
              "$(git rev-list --count origin/main..HEAD)" \
              "$(git rev-list --count HEAD..origin/main)"
            printf 'privacy_log_hardening_pushed=true\n'
          } | tee /tmp/issue714-private-log-report.txt

      - name: Upload hardening evidence
        uses: actions/upload-artifact@v4
        with:
          name: issue714-private-log-hardening
          path: /tmp/issue714-private-log-report.txt
          if-no-files-found: error
          retention-days: 14
