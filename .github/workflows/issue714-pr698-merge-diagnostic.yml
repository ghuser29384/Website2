name: Issue 714 PR 698 private handoff repair

on:
  push:
    branches:
      - ops/issue714-pr698-merge-diagnostic-20260817

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact synchronized PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/issue-675-activation-routing-canonical-walkthrough
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Guard exact synchronized inputs
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_HEAD='f36539cfff205ac2507b4109469700b6ad3e4ace'
          EXPECTED_MAIN='c2d7be6a895f1bb8c9ced1b257eb8b4381d50ac3'
          TARGET_BRANCH='agent/issue-675-activation-routing-canonical-walkthrough'
          git fetch --no-tags origin main "$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse "origin/$TARGET_BRANCH")" = "$EXPECTED_HEAD"
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-list --count HEAD..origin/main)" = '0'

      - name: Implement private Walkthrough handoff and privacy regressions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              source = file.read_text()
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one exact match, found {count}")
              file.write_text(source.replace(old, new, 1))

          profile_path = "src/lib/walkthrough-profile.ts"
          replace_once(
              profile_path,
              '''function readSearchParam(searchParams: SearchParams | undefined, key: string) {
            const value = searchParams?.[key];
            return Array.isArray(value) ? clean(value[0]) : clean(value);
          }
          ''',
              '''export const WALKTHROUGH_PRIVATE_QUERY_KEYS = [
            "source",
            "cause_area",
            "walkthrough_cause",
            "offer_type",
            "match_name",
            "match_get",
            "match_give",
            "participant_kind",
            "primary_goal",
            "first_action",
          ] as const;

          export function hasWalkthroughPrivateQuery(searchParams: SearchParams | undefined) {
            if (!searchParams) return false;

            return WALKTHROUGH_PRIVATE_QUERY_KEYS.some((key) => {
              const value = searchParams[key];
              return Array.isArray(value)
                ? value.some((item) => clean(item).length > 0)
                : clean(value).length > 0;
            });
          }
          ''',
          )
          replace_once(
              profile_path,
              '''export function getWalkthroughProfileDraft({
            cookieValue,
            searchParams,
          }: {
            cookieValue?: string | null;
            searchParams?: SearchParams;
          }) {
            const source = readSearchParam(searchParams, "source");
            const hasQueryDraft =
              source === "walkthrough" ||
              Boolean(readSearchParam(searchParams, "offer_type")) ||
              Boolean(readSearchParam(searchParams, "match_name"));

            if (hasQueryDraft) {
              const queryDraft = createWalkthroughProfileDraft({
                originalCause: readSearchParam(searchParams, "walkthrough_cause"),
                causeArea: readSearchParam(searchParams, "cause_area"),
                offerType: readSearchParam(searchParams, "offer_type"),
                matchName: readSearchParam(searchParams, "match_name"),
                matchGet: readSearchParam(searchParams, "match_get"),
                matchGive: readSearchParam(searchParams, "match_give"),
              });

              if (queryDraft) return queryDraft;
            }

            return parseWalkthroughProfileDraft(cookieValue);
          }
          ''',
              '''export function getWalkthroughProfileDraft({
            cookieValue,
          }: {
            cookieValue?: string | null;
            searchParams?: SearchParams;
          }) {
            return parseWalkthroughProfileDraft(cookieValue);
          }
          ''',
          )
          replace_once(
              profile_path,
              '''export function buildWalkthroughOnboardingPath(draft: WalkthroughProfileDraft) {
            const query = new URLSearchParams({
              source: "walkthrough",
              cause_area: draft.causeArea,
              walkthrough_cause: draft.originalCause,
              offer_type: draft.offerType,
              match_name: draft.matchName,
              match_get: draft.matchGet,
              match_give: draft.matchGive,
            });

            return `/onboarding?${query.toString()}`;
          }

          export function buildWalkthroughCompleteProfilePath(draft: WalkthroughProfileDraft) {
            const query = new URLSearchParams({
              source: "walkthrough",
              cause_area: draft.causeArea,
              walkthrough_cause: draft.originalCause,
              offer_type: draft.offerType,
              match_name: draft.matchName,
              match_get: draft.matchGet,
              match_give: draft.matchGive,
            });

            return `/complete-profile?${query.toString()}`;
          }
          ''',
              '''export function buildWalkthroughOnboardingPath(draft: WalkthroughProfileDraft) {
            void draft;
            return "/onboarding";
          }

          export function buildWalkthroughCompleteProfilePath(draft: WalkthroughProfileDraft) {
            void draft;
            return "/complete-profile";
          }
          ''',
          )

          actions_path = "src/app/walkthrough/actions.ts"
          replace_once(
              actions_path,
              '''    console.error("Failed to persist walkthrough activation", {
                message: transitionError?.message ?? "Unexpected activation stage",
                profileId: viewer.authUser.id,
                transitionedStage,
              });
          ''',
              '''    console.error("Failed to persist walkthrough activation", {
                reason: transitionError ? "transition_error" : "unexpected_stage",
              });
          ''',
          )

          page_path = "src/app/complete-profile/page.tsx"
          replace_once(
              page_path,
              '''  getCompleteProfileDraft,
            type WalkthroughProfileDraft,
            WALKTHROUGH_PROFILE_COOKIE_NAME,
          ''',
              '''  getCompleteProfileDraft,
            hasWalkthroughPrivateQuery,
            WALKTHROUGH_PROFILE_COOKIE_NAME,
          ''',
          )
          replace_once(
              page_path,
              '''function buildCompleteProfilePath(draft: WalkthroughProfileDraft) {
            if (draft.source === "direct") return "/complete-profile";

            const query = new URLSearchParams({
              source: "walkthrough",
              cause_area: draft.causeArea,
              walkthrough_cause: draft.originalCause,
              offer_type: draft.offerType,
              match_name: draft.matchName,
              match_get: draft.matchGet,
              match_give: draft.matchGive,
            });

            return `/complete-profile?${query.toString()}`;
          }

          ''',
              '''''',
          )
          replace_once(
              page_path,
              '''export default async function CompleteProfilePage({ searchParams }: CompleteProfilePageProps) {
            const resolvedSearchParams = await searchParams;
            const cookieStore = await cookies();
          ''',
              '''export default async function CompleteProfilePage({ searchParams }: CompleteProfilePageProps) {
            const resolvedSearchParams = await searchParams;

            if (hasWalkthroughPrivateQuery(resolvedSearchParams)) {
              const safeParams = new URLSearchParams();
              if (readSearchParam(resolvedSearchParams.username_required) === "1") {
                safeParams.set("username_required", "1");
              }
              if (readSearchParam(resolvedSearchParams.sources) === "x") {
                safeParams.set("sources", "x");
              }
              if (readSearchParam(resolvedSearchParams.panel) === "connections") {
                safeParams.set("panel", "connections");
              }
              if (readSearchParam(resolvedSearchParams.next) === "/feed") {
                safeParams.set("next", "/feed");
              }
              const cleanQuery = safeParams.toString();
              redirect(`/complete-profile${cleanQuery ? `?${cleanQuery}` : ""}`);
            }

            const cookieStore = await cookies();
          ''',
          )
          replace_once(
              page_path,
              '''  const profileDraft = getCompleteProfileDraft({
              allowDirect: activationState.kind === "available",
              cookieValue: cookieStore.get(WALKTHROUGH_PROFILE_COOKIE_NAME)?.value,
              searchParams: resolvedSearchParams,
            });
          ''',
              '''  const profileDraft = getCompleteProfileDraft({
              allowDirect: activationState.kind === "available",
              cookieValue: cookieStore.get(WALKTHROUGH_PROFILE_COOKIE_NAME)?.value,
            });
          ''',
          )
          replace_once(
              page_path,
              '''  const baseReturnTo = buildCompleteProfilePath(profileDraft);
          ''',
              '''  const baseReturnTo = "/complete-profile";
          ''',
          )

          browser_path = "tests/complete-profile-review.spec.ts"
          browser = Path(browser_path).read_text()
          old_prefix = '''import { expect, test } from "@playwright/test";

          const completeProfilePath =
            "/complete-profile?source=walkthrough&cause_area=Animal%20welfare&walkthrough_cause=Factory%20farming&offer_type=Money&match_name=Mina%20Park&match_get=Fund%20a%20verified%20animal-welfare%20review&match_give=Replace%20eight%20car%20trips%20with%20transit";

          test("a local Walkthrough draft cannot unlock Complete Profile without persisted activation", async ({ page }) => {
            await page.goto(completeProfilePath);

            await expect(page).toHaveURL(/\\/walkthrough$/);
            await expect(page.getByLabel("Profile setup: priorities")).toHaveCount(0);
          });
          '''
          new_prefix = '''import { expect, test } from "@playwright/test";

          const privateQueryKeys = [
            "source",
            "cause_area",
            "walkthrough_cause",
            "offer_type",
            "match_name",
            "match_get",
            "match_give",
          ];
          const legacyCompleteProfilePath =
            "/complete-profile?source=walkthrough&cause_area=private-sentinel-a&walkthrough_cause=private-sentinel-b&offer_type=Money&match_name=private-sentinel-c&match_get=private-sentinel-d&match_give=private-sentinel-e";

          test("a legacy query-bearing Walkthrough draft is normalized and cannot unlock Complete Profile", async ({ page }) => {
            const navigations: string[] = [];
            page.on("request", (request) => {
              if (request.isNavigationRequest() && request.frame() === page.mainFrame()) {
                navigations.push(request.url());
              }
            });

            await page.goto(legacyCompleteProfilePath);

            await expect(page).toHaveURL(/\\/walkthrough$/);
            await expect(page.getByLabel("Profile setup: priorities")).toHaveCount(0);
            expect(navigations[0]).toContain("/complete-profile?");
            expect(navigations.length).toBeGreaterThanOrEqual(2);

            for (const navigation of navigations.slice(1)) {
              for (const key of privateQueryKeys) {
                expect(navigation).not.toContain(`${key}=`);
              }
              expect(navigation).not.toContain("private-sentinel");
            }

            const referrer = await page.evaluate(() => document.referrer);
            for (const key of privateQueryKeys) {
              expect(referrer).not.toContain(`${key}=`);
            }
            expect(referrer).not.toContain("private-sentinel");

            const hrefs = await page.locator("a[href]").evaluateAll((links) =>
              links.map((link) => (link as HTMLAnchorElement).href),
            );
            for (const href of hrefs) {
              for (const key of privateQueryKeys) {
                expect(href).not.toContain(`${key}=`);
              }
              expect(href).not.toContain("private-sentinel");
            }
          });
          '''
          if browser.count(old_prefix) != 1:
              raise SystemExit(f"{browser_path}: could not replace exact browser privacy prefix")
          Path(browser_path).write_text(browser.replace(old_prefix, new_prefix, 1))

          Path("src/walkthrough-private-handoff.test.ts").write_text('''import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          import test from "node:test";

          import {
            buildWalkthroughCompleteProfilePath,
            buildWalkthroughOnboardingPath,
            createWalkthroughProfileDraft,
            encodeWalkthroughProfileDraft,
            getCompleteProfileDraft,
            getWalkthroughProfileDraft,
            hasWalkthroughPrivateQuery,
            WALKTHROUGH_PRIVATE_QUERY_KEYS,
          } from "@/lib/walkthrough-profile";

          const privateDraft = createWalkthroughProfileDraft({
            originalCause: "private-sentinel-cause",
            causeArea: "Animal welfare",
            offerType: "Money",
            matchName: "private-sentinel-name",
            matchGet: "private-sentinel-request",
            matchGive: "private-sentinel-offer",
            participantKind: "individual",
            primaryGoal: "find_counterparty",
            firstAction: "create_broad_preview",
            createdAt: "2026-08-17T00:00:00.000Z",
          });

          if (!privateDraft) throw new Error("Synthetic private Walkthrough draft did not validate.");

          test("Walkthrough handoff builders emit clean paths only", () => {
            assert.equal(buildWalkthroughCompleteProfilePath(privateDraft), "/complete-profile");
            assert.equal(buildWalkthroughOnboardingPath(privateDraft), "/onboarding");

            for (const key of WALKTHROUGH_PRIVATE_QUERY_KEYS) {
              assert.doesNotMatch(buildWalkthroughCompleteProfilePath(privateDraft), new RegExp(`${key}=`));
              assert.doesNotMatch(buildWalkthroughOnboardingPath(privateDraft), new RegExp(`${key}=`));
            }
            assert.doesNotMatch(buildWalkthroughCompleteProfilePath(privateDraft), /private-sentinel/);
            assert.doesNotMatch(buildWalkthroughOnboardingPath(privateDraft), /private-sentinel/);
          });

          test("query parameters cannot supply or override a private Walkthrough draft", () => {
            const cookieValue = encodeWalkthroughProfileDraft(privateDraft);
            const queryDraft = {
              source: "walkthrough",
              cause_area: "Existential risk",
              walkthrough_cause: "private-query-cause",
              offer_type: "Time",
              match_name: "private-query-name",
              match_get: "private-query-request",
              match_give: "private-query-offer",
            };

            assert.equal(hasWalkthroughPrivateQuery(queryDraft), true);
            assert.equal(hasWalkthroughPrivateQuery({ username_required: "1", next: "/feed" }), false);

            const fromWalkthrough = getWalkthroughProfileDraft({
              cookieValue,
              searchParams: queryDraft,
            });
            const fromCompleteProfile = getCompleteProfileDraft({
              cookieValue,
              searchParams: queryDraft,
            });

            assert.equal(fromWalkthrough?.matchName, privateDraft.matchName);
            assert.equal(fromCompleteProfile?.matchName, privateDraft.matchName);
            assert.notEqual(fromWalkthrough?.matchName, queryDraft.match_name);
            assert.notEqual(fromCompleteProfile?.matchName, queryDraft.match_name);
          });

          test("activation source wiring keeps identifiers and private draft values out of logs and return paths", () => {
            const actionSource = readFileSync("src/app/walkthrough/actions.ts", "utf8");
            const pageSource = readFileSync("src/app/complete-profile/page.tsx", "utf8");

            assert.doesNotMatch(actionSource, /profileId:/);
            assert.doesNotMatch(actionSource, /message:\\s*transitionError/);
            assert.match(actionSource, /buildWalkthroughCompleteProfilePath\\(draft\\)/);
            assert.match(pageSource, /hasWalkthroughPrivateQuery\\(resolvedSearchParams\\)/);
            assert.match(pageSource, /const baseReturnTo = "\\/complete-profile"/);
            assert.doesNotMatch(pageSource, /buildCompleteProfilePath/);
            assert.doesNotMatch(pageSource, /walkthrough_cause/);
            assert.doesNotMatch(pageSource, /match_get/);
            assert.doesNotMatch(pageSource, /match_give/);
          });
          ''')
          PY

          git diff --check
          git status --short

      - name: Install exact dependencies
        run: npm ci

      - name: Run focused private-handoff and activation tests
        shell: bash
        run: |
          set -euo pipefail
          node --import tsx --test \
            src/walkthrough-private-handoff.test.ts \
            src/walkthrough-next-canonical.test.ts \
            src/lib/account-activation.test.ts \
            src/lib/auth-routes.test.ts
          npx eslint \
            src/lib/walkthrough-profile.ts \
            src/app/walkthrough/actions.ts \
            src/app/complete-profile/page.tsx \
            src/walkthrough-private-handoff.test.ts \
            tests/complete-profile-review.spec.ts
          npx tsc --noEmit --pretty false

      - name: Commit and push the reviewed repair
        shell: bash
        run: |
          set -euo pipefail
          TARGET_BRANCH='agent/issue-675-activation-routing-canonical-walkthrough'
          EXPECTED_PARENT='f36539cfff205ac2507b4109469700b6ad3e4ace'
          test "$(git rev-parse HEAD)" = "$EXPECTED_PARENT"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/lib/walkthrough-profile.ts \
            src/app/walkthrough/actions.ts \
            src/app/complete-profile/page.tsx \
            src/walkthrough-private-handoff.test.ts \
            tests/complete-profile-review.spec.ts
          git diff --cached --check
          git commit -m 'Keep Walkthrough drafts out of URLs and logs'
          NEW_HEAD="$(git rev-parse HEAD)"
          NEW_TREE="$(git rev-parse HEAD^{tree})"
          test -z "$(git status --porcelain)"
          git push origin "HEAD:$TARGET_BRANCH"
          {
            printf 'parent=%s\nhead=%s\ntree=%s\n' "$EXPECTED_PARENT" "$NEW_HEAD" "$NEW_TREE"
            printf 'main=%s\nahead=%s\nbehind=%s\n' \
              "$(git rev-parse origin/main)" \
              "$(git rev-list --count origin/main..HEAD)" \
              "$(git rev-list --count HEAD..origin/main)"
            printf 'privacy_repair_pushed=true\n'
          } | tee /tmp/issue714-private-handoff-report.txt

      - name: Upload privacy-repair evidence
        uses: actions/upload-artifact@v4
        with:
          name: issue714-private-handoff-repair
          path: /tmp/issue714-private-handoff-report.txt
          if-no-files-found: error
          retention-days: 14
