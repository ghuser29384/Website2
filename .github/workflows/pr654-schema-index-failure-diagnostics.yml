name: PR654 schema index failure diagnostics

on:
  push:
    branches:
      - qa/pr654-migration-history-cleanup-gates-20260815
    paths:
      - .github/workflows/pr654-schema-index-failure-diagnostics.yml
      - .github/scripts/pr654-schema-index-failure-diagnostics.sh
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr654-schema-index-failure-diagnostics
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      EXPECTED_PRODUCT_HEAD: f0ea581e8956f7987e58dd2240a7e0249bf7cb06
      EXPECTED_BASE: 75fd512e6cf82e2c51df53e211b854c0263109c3
      PRODUCT_BRANCH: qa/pooled-settlement-payer-fix-candidate-20260813
      SUPABASE_CLI_VERSION: 2.110.0
    steps:
      - name: Check out QA-only diagnostics
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: harness
          fetch-depth: 1
          persist-credentials: false

      - name: Check out exact product head detached
        uses: actions/checkout@v4
        with:
          ref: f0ea581e8956f7987e58dd2240a7e0249bf7cb06
          path: product
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
          cache: npm
          cache-dependency-path: product/package-lock.json

      - name: Capture exact schema index failure
        id: diagnostic
        continue-on-error: true
        working-directory: product
        shell: bash
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/pr654-schema-index-failure-diagnostics
        run: bash ../harness/.github/scripts/pr654-schema-index-failure-diagnostics.sh

      - name: Upload credential-free diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr654-schema-index-failure-diagnostics-${{ github.run_id }}
          path: |
            pr654-schema-index-failure-diagnostics.tar.gz
            pr654-schema-index-failure-diagnostics.tar.gz.sha256
            pr654-schema-index-failure-diagnostics-summary.txt
          if-no-files-found: error
          retention-days: 14

      - name: Enforce diagnostic harness integrity
        if: always()
        shell: bash
        run: |
          if [[ "${{ steps.diagnostic.outcome }}" != "success" ]]; then
            echo "Schema diagnostic harness itself failed; inspect the evidence artifact."
            exit 1
          fi
