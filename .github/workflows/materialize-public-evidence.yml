name: Materialize public evidence rollout

on:
  push:
    branches:
      - feature/public-evidence-desk
    paths:
      - scripts/public-evidence-payload.part-01
      - scripts/public-evidence-payload.part-02
      - .github/workflows/materialize-public-evidence.yml

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/public-evidence-desk
          fetch-depth: 0

      - name: Rebuild source files
        shell: bash
        run: |
          set -euo pipefail
          cat scripts/public-evidence-payload.part-01 scripts/public-evidence-payload.part-02 \
            | base64 --decode > /tmp/public-evidence-changes.tar.xz
          echo "c705a2c1701ccf9829d3fd1b97276f50e0ad019b687c8c97046bf250bed8b8c0  /tmp/public-evidence-changes.tar.xz" \
            | sha256sum --check
          tar -xJf /tmp/public-evidence-changes.tar.xz

      - name: Commit materialized implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            'src/app/evidence/[[...recordId]]/page.tsx' \
            src/app/trades/new/page.tsx \
            src/lib/site.ts \
            config/measurement/public-route-baseline.json \
            supabase/migrations/20260718130000_public_trade_evidence.sql
          git rm -- \
            scripts/public-evidence-payload.part-01 \
            scripts/public-evidence-payload.part-02 \
            .github/workflows/materialize-public-evidence.yml
          git commit -m "Add integrated public evidence desk and proof timeline"
          git push origin HEAD:feature/public-evidence-desk
