name: Repair legal review packet whitespace

on:
  push:
    branches:
      - integration/direct-donation-upgrade-current-main-20260807
    paths:
      - .github/workflows/fix-legal-review-packet-whitespace-20260807.yml

permissions:
  contents: write

concurrency:
  group: fix-legal-review-packet-whitespace-20260807
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TARGET_BRANCH: integration/direct-donation-upgrade-current-main-20260807
      EXPECTED_PARENT: 9802cfe3a723d29a804b5b910292fefa17b081e9
    steps:
      - name: Check out exact controller head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Strip trailing whitespace and publish the narrow repair
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"

          python3 - <<'PY'
          from pathlib import Path

          paths = [
              Path("docs/legal-review/f1-founder-activity-review-packet.md"),
              Path("docs/legal-review/payments-charitable-funds-flow-review-packet.md"),
          ]
          for path in paths:
              text = path.read_text(encoding="utf-8")
              repaired = "\n".join(line.rstrip() for line in text.splitlines()) + "\n"
              path.write_text(repaired, encoding="utf-8")
          PY

          git diff --check
          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" = 2
          test "${changed[0]}" = "docs/legal-review/f1-founder-activity-review-packet.md"
          test "${changed[1]}" = "docs/legal-review/payments-charitable-funds-flow-review-packet.md"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/legal-review/f1-founder-activity-review-packet.md \
                  docs/legal-review/payments-charitable-funds-flow-review-packet.md
          git commit -m 'Remove trailing whitespace from legal review packets'

          remote="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$remote" = "$GITHUB_SHA"
          git push origin "HEAD:$TARGET_BRANCH"
