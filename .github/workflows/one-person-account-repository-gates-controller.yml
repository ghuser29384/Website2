name: One-person account repository gates controller

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: one-person-account-repository-gates-controller
  cancel-in-progress: false

env:
  FEATURE_BRANCH: feature/one-person-one-account-20260731
  EXPECTED_FEATURE_SHA: 29d7517f7fd28e4d40de92f900e377883478ebea
  CONTROLLER_PATH: .github/workflows/one-person-account-repository-gates-controller.yml

jobs:
  repository-gates:
    if: >-
      github.repository == 'ghuser29384/Website2' &&
      github.event.issue.pull_request != null &&
      github.event.issue.number == 379 &&
      github.event.comment.body == '/run-one-person-repository-gates-20260801-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          ref: 29d7517f7fd28e4d40de92f900e377883478ebea
          fetch-depth: 0

      - name: Guard exact candidate and feature boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'ghuser29384/Website2'
          test "$(git rev-parse HEAD)" = "$EXPECTED_FEATURE_SHA"
          test "$(git ls-remote origin "refs/heads/$FEATURE_BRANCH" | awk '{print $1}')" = "$EXPECTED_FEATURE_SHA"
          test ! -e .github/one-person-bootstrap
          test ! -e .github/workflows/materialize-one-person-account.yml
          git diff --check origin/main...HEAD
          git diff --name-only origin/main...HEAD | sort -u | tee one-person-changed-paths.txt
          test "$(wc -l < one-person-changed-paths.txt)" -eq 24

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies with transient retry
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            if npm ci; then exit 0; fi
            if (( attempt == 4 )); then exit 1; fi
            sleep $((attempt * 20))
          done

      - name: Run focused identity tests
        shell: bash
        run: |
          set -o pipefail
          npm run test:one-person-account 2>&1 | tee one-person-focused-tests.txt

      - name: Run complete repository tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee one-person-repository-tests.txt

      - name: Run TypeScript absolute gate
        shell: bash
        run: |
          set -o pipefail
          npx tsc --noEmit 2>&1 | tee one-person-typescript.txt

      - name: Run ESLint absolute gate
        shell: bash
        run: |
          set -o pipefail
          npm run lint -- --quiet 2>&1 | tee one-person-eslint.txt

      - name: Build production application
        env:
          NEXT_PUBLIC_SITE_URL: https://www.moraltrade.org
          SITE_URL: https://www.moraltrade.org
          VERCEL: '1'
          VERCEL_ENV: preview
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee one-person-build.txt

      - name: Upload exact-head repository evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: one-person-account-repository-gates-${{ github.run_id }}
          path: |
            one-person-changed-paths.txt
            one-person-focused-tests.txt
            one-person-repository-tests.txt
            one-person-typescript.txt
            one-person-eslint.txt
            one-person-build.txt
            .next/build-manifest.json
            .next/routes-manifest.json
          if-no-files-found: warn

      - name: Comment success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh pr comment 379 --repo "$GITHUB_REPOSITORY" --body "Exact-head repository gates passed for one-person-account candidate \`$EXPECTED_FEATURE_SHA\` in run $GITHUB_RUN_ID: focused tests, complete tests, TypeScript, ESLint, production build, exact 24-path boundary, and diff hygiene all passed. PR remains draft pending isolated-QA, Auth configuration, and browser gates."

      - name: Comment failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh pr comment 379 --repo "$GITHUB_REPOSITORY" --body "Exact-head one-person-account repository gates failed for candidate \`$EXPECTED_FEATURE_SHA\` in run $GITHUB_RUN_ID. Inspect the job logs and evidence artifact before changing the same draft branch."

      - name: Remove temporary controller
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/$CONTROLLER_PATH?ref=main" --jq .sha 2>/dev/null || true)"
          if [[ -n "$sha" ]]; then
            jq -n --arg message 'Remove temporary one-person repository gates controller' --arg sha "$sha" --arg branch main '{message:$message,sha:$sha,branch:$branch}' \
              | gh api --method DELETE "repos/$GITHUB_REPOSITORY/contents/$CONTROLLER_PATH" --input - >/dev/null
          fi
