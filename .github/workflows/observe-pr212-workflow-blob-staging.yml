name: Observe PR 212 workflow-blob staging

on:
  push:
    branches:
      - agent/pr212-clean-reconstruction-staging-20260730
    paths:
      - .github/workflows/observe-pr212-workflow-blob-staging.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_WORKFLOW: stage-pr212-tested-workflow-blobs.yml
      TARGET_HEAD: 6bd7bc9567fd72cb51d67786b6d2e6aa929ed4d7
      STAGING_BRANCH: agent/pr212-clean-reconstruction-staging-20260730
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pr212-clean-reconstruction-staging-20260730
          fetch-depth: 0

      - name: Record target workflow terminal state
        shell: bash
        run: |
          set -euo pipefail
          output=ops/pr212-clean-reconstruction/workflow-blob-staging
          mkdir -p "$output"
          run_id=""
          status=""
          conclusion=""
          for attempt in $(seq 1 100); do
            gh run list --repo "$GITHUB_REPOSITORY" --workflow "$TARGET_WORKFLOW" --branch "$STAGING_BRANCH" --limit 20 --json databaseId,headSha,status,conclusion,createdAt,url > /tmp/runs.json
            run_id="$(jq -r --arg head "$TARGET_HEAD" '[.[] | select(.headSha == $head)] | sort_by(.createdAt) | reverse | .[0].databaseId // empty' /tmp/runs.json)"
            status="$(jq -r --arg head "$TARGET_HEAD" '[.[] | select(.headSha == $head)] | sort_by(.createdAt) | reverse | .[0].status // empty' /tmp/runs.json)"
            conclusion="$(jq -r --arg head "$TARGET_HEAD" '[.[] | select(.headSha == $head)] | sort_by(.createdAt) | reverse | .[0].conclusion // empty' /tmp/runs.json)"
            if [[ -n "$run_id" && "$status" == "completed" ]]; then break; fi
            sleep 10
          done
          if [[ -n "$run_id" ]]; then
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100" > "$output/jobs.json"
            gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --log-failed > "$output/failed-log.txt" 2>&1 || true
          else
            printf '%s\n' '{"jobs":[]}' > "$output/jobs.json"
            printf '%s\n' 'No exact run found.' > "$output/failed-log.txt"
          fi
          jq -n --arg head "$TARGET_HEAD" --arg run_id "$run_id" --arg status "$status" --arg conclusion "$conclusion" --slurpfile runs /tmp/runs.json '{head:$head,run_id:$run_id,status:$status,conclusion:$conclusion,runs:$runs[0]}' > "$output/report.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$output"
          git commit -m "Record PR 212 workflow-blob staging result"
          git push origin "HEAD:refs/heads/${STAGING_BRANCH}"
