name: Fix Home Feed ESLint baseline parser

on:
  push:
    branches:
      - qa/home-authenticated-feed-20260727

permissions:
  contents: write

jobs:
  fix:
    if: ${{ contains(github.event.head_commit.message, '[run-eslint-parser-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Accept ESLint's multiline diagnostic format
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/qa-home-authenticated-feed-v3.yml')
          text = path.read_text(encoding='utf-8')
          old = '''                  match = re.match(r"^\\s*(\\d+):(\\d+)\\s+error\\s+(.+?)\\s{2,}(\\S+)\\s*$", line)
                  if match:
                      row, column, message, rule = match.groups()
                      errors[f"{current}:{row}:{column}:{rule}:{message}"] += 1'''
          new = '''                  match = re.match(r"^\\s*(\\d+):(\\d+)\\s+error\\s+(.+?)\\s*$", line)
                  if match:
                      row, column, message = match.groups()
                      errors[f"{current}:{row}:{column}:{message}"] += 1'''
          if old not in text:
              raise SystemExit('expected ESLint parser block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git rm .github/workflows/fix-home-feed-eslint-parser.yml
      - name: Publish corrected verification workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/qa-home-authenticated-feed-v3.yml
          git commit -m "Accept multiline ESLint baseline diagnostics [eslint-parser-fixed]"
          git push origin HEAD:refs/heads/qa/home-authenticated-feed-20260727
