name: PR 757 exact production release controller

on:
  push:
    branches:
      - ops/pr757-exact-release-controller-pr-20260818
    paths:
      - .github/workflows/complete-profile-production-canary.yml

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: pr757-exact-production-release-controller
  cancel-in-progress: false

env:
  CONTROLLER_BRANCH: ops/pr757-exact-release-controller-pr-20260818
  CONTROLLER_PATH: .github/workflows/complete-profile-production-canary.yml
  EXPECTED_MAIN_SHA: f9ae5480ae7c20176f24c5f8b678088b5823fc39
  RELEASE_WORKFLOW: vercel-release.yml
  RELEASE_NOT_BEFORE: '2026-08-18T05:55:29Z'
  EVIDENCE_PR: '757'

jobs:
  dispatch-and-observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Check out exact controller head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Guard exact repository state and controller-only scope
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'ghuser29384/Website2'
          test "$GITHUB_REF_NAME" = "$CONTROLLER_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$EXPECTED_MAIN_SHA"
          test "$(git diff --name-only "$EXPECTED_MAIN_SHA" HEAD)" = "$CONTROLLER_PATH"
          git diff --check "$EXPECTED_MAIN_SHA" HEAD
          test "$(git show "$EXPECTED_MAIN_SHA:.github/workflows/vercel-release.yml" | sed -n '1p')" = 'name: Gated Vercel release'

      - name: Adopt an existing exact run or dispatch exactly once
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          find_exact_runs() {
            local listing candidate_id candidate
            listing="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$RELEASE_WORKFLOW/runs?event=workflow_dispatch&branch=main&per_page=100")"
            while IFS= read -r candidate_id; do
              [[ -n "$candidate_id" ]] || continue
              candidate="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$candidate_id")"
              if [[ "$(jq -r '.head_sha' <<<"$candidate")" = "$EXPECTED_MAIN_SHA" \
                && "$(jq -r '.event' <<<"$candidate")" = 'workflow_dispatch' \
                && "$(jq -r '.head_branch' <<<"$candidate")" = 'main' \
                && "$(jq -r '.created_at' <<<"$candidate")" > "$RELEASE_NOT_BEFORE" \
                && "$(jq -r '.inputs.target // empty' <<<"$candidate")" = 'production' \
                && "$(jq -r '.inputs.ref // empty' <<<"$candidate")" = 'main' \
                && "$(jq -r '.inputs.expected_sha // empty' <<<"$candidate")" = "$EXPECTED_MAIN_SHA" \
                && -z "$(jq -r '.inputs.synthetic_auth_fixture_url // empty' <<<"$candidate")" ]]; then
                printf '%s\n' "$candidate_id"
              fi
            done < <(jq -r '.workflow_runs | sort_by(.created_at) | reverse[] | .id' <<<"$listing")
          }

          mapfile -t exact_runs < <(find_exact_runs)
          if (( ${#exact_runs[@]} > 1 )); then
            printf 'Refusing duplicate exact production runs: %s\n' "${exact_runs[*]}" >&2
            exit 1
          fi

          disposition='adopted-existing'
          run_id="${exact_runs[0]:-}"
          if [[ -z "$run_id" ]]; then
            disposition='dispatched-new'
            jq -n \
              --arg workflow_ref main \
              --arg release_ref main \
              --arg target production \
              --arg expected_sha "$EXPECTED_MAIN_SHA" \
              --arg fixture '' \
              '{ref:$workflow_ref,inputs:{target:$target,ref:$release_ref,expected_sha:$expected_sha,synthetic_auth_fixture_url:$fixture}}' \
              | gh api --method POST \
                  -H 'Accept: application/vnd.github+json' \
                  -H 'X-GitHub-Api-Version: 2022-11-28' \
                  "repos/$GITHUB_REPOSITORY/actions/workflows/$RELEASE_WORKFLOW/dispatches" \
                  --input - >/dev/null

            for _ in $(seq 1 60); do
              mapfile -t exact_runs < <(find_exact_runs)
              if (( ${#exact_runs[@]} == 1 )); then
                run_id="${exact_runs[0]}"
                break
              fi
              if (( ${#exact_runs[@]} > 1 )); then
                printf 'Duplicate exact production runs appeared after dispatch: %s\n' "${exact_runs[*]}" >&2
                exit 1
              fi
              sleep 2
            done
          fi

          test -n "$run_id"
          run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id")"
          run_url="$(jq -r '.html_url' <<<"$run")"
          body="$(cat <<EOF
PR757_EXACT_RELEASE_RUN
controller_run_id=$GITHUB_RUN_ID
controller_head=$GITHUB_SHA
disposition=$disposition
run_id=$run_id
run_url=$run_url
head_sha=$EXPECTED_MAIN_SHA
head_branch=main
event=workflow_dispatch
status=$(jq -r '.status' <<<"$run")
conclusion=$(jq -r '.conclusion // "pending"' <<<"$run")
input_target=production
input_ref=main
input_expected_sha=$EXPECTED_MAIN_SHA
input_synthetic_auth_fixture_url=<empty>
EOF
)"
          gh pr comment "$EVIDENCE_PR" --repo "$GITHUB_REPOSITORY" --body "$body"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Await and record exact release conclusion
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.release.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          for _ in $(seq 1 300); do
            run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID")"
            test "$(jq -r '.head_sha' <<<"$run")" = "$EXPECTED_MAIN_SHA"
            test "$(jq -r '.event' <<<"$run")" = 'workflow_dispatch'
            test "$(jq -r '.head_branch' <<<"$run")" = 'main'
            status="$(jq -r '.status' <<<"$run")"
            [[ "$status" = completed ]] && break
            test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$EXPECTED_MAIN_SHA"
            sleep 10
          done

          run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID")"
          status="$(jq -r '.status' <<<"$run")"
          conclusion="$(jq -r '.conclusion // "pending"' <<<"$run")"
          jobs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs?per_page=100")"
          job_summary="$(jq -r '[.jobs[] | "job_id=" + (.id|tostring) + " name=" + .name + " status=" + .status + " conclusion=" + (.conclusion // "pending")] | join("\n")' <<<"$jobs")"
          body="$(cat <<EOF
PR757_EXACT_RELEASE_FINAL
run_id=$RUN_ID
run_url=$(jq -r '.html_url' <<<"$run")
head_sha=$EXPECTED_MAIN_SHA
status=$status
conclusion=$conclusion
created_at=$(jq -r '.created_at' <<<"$run")
updated_at=$(jq -r '.updated_at' <<<"$run")
$job_summary
EOF
)"
          gh pr comment "$EVIDENCE_PR" --repo "$GITHUB_REPOSITORY" --body "$body"
          test "$status" = completed
          test "$conclusion" = success
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$EXPECTED_MAIN_SHA"

# One-use controller. Never merge; close and delete after the exact release sequence.
