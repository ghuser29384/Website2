name: Complete Profile production canary

on:
  pull_request:
    paths:
      - ".github/scripts/complete-profile-production-canary.mjs"
      - ".github/workflows/complete-profile-production-canary.yml"
      - "scripts/complete-profile-production-canary-workflow.test.mjs"
  push:
    branches:
      - main
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: complete-profile-production-canary-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'production' }}
  cancel-in-progress: true

env:
  STATUS_CONTEXT: QA / Complete Profile production canary
  VERCEL_PROJECT_ID: prj_Em3j7Uj7RatX2R1ZYhla3XSHRde7
  VERCEL_TEAM_ID: team_ySu6sF3Uho1E1GnJtCQPVEuJ
  CANONICAL_ORIGIN: https://www.moraltrade.org
  APEX_ORIGIN: https://moraltrade.org
  CANARY_OUTPUT_DIR: complete-profile-production-canary

jobs:
  source-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Parse and test the production canary controls
        run: |
          set -euo pipefail
          node --check .github/scripts/complete-profile-production-canary.mjs
          node --test scripts/complete-profile-production-canary-workflow.test.mjs
          ruby -e 'require "yaml"; YAML.parse_file(ARGV.fetch(0)) or abort("invalid YAML")' \
            .github/workflows/complete-profile-production-canary.yml

      - name: Run complete repository quality gates
        env:
          NEXT_PUBLIC_SITE_URL: https://www.moraltrade.org
          SITE_URL: https://www.moraltrade.org
          VERCEL: "1"
          VERCEL_ENV: preview
        run: |
          set -euo pipefail
          npm test
          npm run lint -- --quiet
          npx tsc --noEmit
          npm run build

  production-canary:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CONTROL_SHA: ${{ github.sha }}

    steps:
      - name: Check out the canary control revision
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTROL_SHA }}
          fetch-depth: 0

      - name: Verify the exact control checkout
        run: test "$(git rev-parse HEAD)" = "${CONTROL_SHA}"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Resolve the READY production deployment currently serving both canonical aliases
        id: deployment
        env:
          VERCEL_TOKEN_VALUE: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN_VALUE"
          mkdir -p "$CANARY_OUTPUT_DIR/alias-readback"

          selected_detail=''
          deployment_id=''
          apex_deployment_id=''
          canonical_deployment_id=''

          for attempt in $(seq 1 40); do
            apex_deployment_id=''
            canonical_deployment_id=''
            aliases_resolved=true

            for alias_name in moraltrade.org www.moraltrade.org; do
              alias_key="${alias_name//./-}"
              alias_path="$CANARY_OUTPUT_DIR/alias-readback/${alias_key}.json"
              alias_api="https://api.vercel.com/v4/aliases/${alias_name}?projectId=${VERCEL_PROJECT_ID}&teamId=${VERCEL_TEAM_ID}"

              if ! curl -fsS \
                -H "Authorization: Bearer ${VERCEL_TOKEN_VALUE}" \
                "$alias_api" \
                > "$alias_path"; then
                aliases_resolved=false
                break
              fi

              resolved_alias="$(jq -r '.alias // empty' "$alias_path")"
              resolved_project="$(jq -r '.projectId // empty' "$alias_path")"
              resolved_deployment="$(jq -r '.deploymentId // .deployment.id // .deployment.uid // empty' "$alias_path")"

              if [[ "$resolved_alias" != "$alias_name" ]] \
                || [[ "$resolved_project" != "$VERCEL_PROJECT_ID" ]] \
                || [[ -z "$resolved_deployment" ]]; then
                aliases_resolved=false
                break
              fi

              if [[ "$alias_name" == "moraltrade.org" ]]; then
                apex_deployment_id="$resolved_deployment"
              else
                canonical_deployment_id="$resolved_deployment"
              fi
            done

            if [[ "$aliases_resolved" != "true" ]] \
              || [[ -z "$apex_deployment_id" ]] \
              || [[ "$apex_deployment_id" != "$canonical_deployment_id" ]]; then
              sleep 15
              continue
            fi

            deployment_id="$apex_deployment_id"
            detail_path="$CANARY_OUTPUT_DIR/deployment-detail.json"
            detail_api="https://api.vercel.com/v13/deployments/${deployment_id}?teamId=${VERCEL_TEAM_ID}"

            if ! curl -fsS \
              -H "Authorization: Bearer ${VERCEL_TOKEN_VALUE}" \
              "$detail_api" \
              > "$detail_path"; then
              sleep 15
              continue
            fi

            if jq -e \
              --arg project_id "$VERCEL_PROJECT_ID" \
              --arg deployment_id "$deployment_id" '
                ((.uid // .id) == $deployment_id)
                and (.target == "production")
                and ((.readyState // .state // "") == "READY")
                and ((.projectId // .project.id // "") == $project_id)
                and ((.aliasError // null) == null)
                and (.meta.githubCommitOrg == "ghuser29384")
                and (.meta.githubCommitRepo == "Website2")
                and (.meta.githubCommitSha | test("^[0-9a-f]{40}$"))
              ' "$detail_path" >/dev/null; then
              selected_detail="$detail_path"
              break
            fi

            sleep 15
          done

          if [[ -z "$selected_detail" ]]; then
            echo "No READY production deployment currently serves both canonical aliases." >&2
            exit 1
          fi

          deployment_url="https://$(jq -r '.url' "$selected_detail")"
          deployed_sha="$(jq -r '.meta.githubCommitSha' "$selected_detail")"

          test -n "$deployment_id"
          test "$deployment_id" != "null"
          git cat-file -e "${deployed_sha}^{commit}"
          git merge-base --is-ancestor "$deployed_sha" "$CONTROL_SHA"

          jq \
            --arg controlSha "$CONTROL_SHA" \
            --arg deployedSha "$deployed_sha" \
            --arg deploymentId "$deployment_id" \
            --arg deploymentUrl "$deployment_url" \
            --arg apexDeploymentId "$apex_deployment_id" \
            --arg canonicalDeploymentId "$canonical_deployment_id" '
              {
                controlSha: $controlSha,
                deployedSha: $deployedSha,
                deploymentId: $deploymentId,
                deploymentUrl: $deploymentUrl,
                state: (.readyState // .state),
                target,
                aliasError,
                projectId: (.projectId // .project.id),
                aliasOwnership: {
                  apexDeploymentId: $apexDeploymentId,
                  canonicalDeploymentId: $canonicalDeploymentId
                },
                github: {
                  org: .meta.githubCommitOrg,
                  repo: .meta.githubCommitRepo,
                  sha: .meta.githubCommitSha
                }
              }
            ' "$selected_detail" > "$CANARY_OUTPUT_DIR/deployment.json"

          {
            echo "deployment_id=$deployment_id"
            echo "deployment_url=$deployment_url"
            echo "deployed_sha=$deployed_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Mark the deployed commit pending
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYED_SHA: ${{ steps.deployment.outputs.deployed_sha }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${DEPLOYED_SHA}" \
            -f state=pending \
            -f context="${STATUS_CONTEXT}" \
            -f description="Running the Complete Profile canary on the live production aliases" \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Verify the Complete Profile route through both production domains
        shell: bash
        run: |
          set -euo pipefail

          verified=false
          for attempt in $(seq 1 40); do
            www_status="$(curl -sS \
              --cookie 'mt_walkthrough_seen=1' \
              -D "$CANARY_OUTPUT_DIR/www-returning.headers" \
              -o "$CANARY_OUTPUT_DIR/www-returning.html" \
              -w '%{http_code}' \
              "$CANONICAL_ORIGIN/complete-profile")"

            apex_status="$(curl -sS \
              -D "$CANARY_OUTPUT_DIR/apex.headers" \
              -o /dev/null \
              -w '%{http_code}' \
              "$APEX_ORIGIN/complete-profile")"

            tr -d '\r' < "$CANARY_OUTPUT_DIR/www-returning.headers" \
              > "$CANARY_OUTPUT_DIR/www-returning.normalized.headers"
            tr -d '\r' < "$CANARY_OUTPUT_DIR/apex.headers" \
              > "$CANARY_OUTPUT_DIR/apex.normalized.headers"

            if [[ "$www_status" == "200" ]] \
              && grep -Fq 'Spend 100 sparks of attention.' "$CANARY_OUTPUT_DIR/www-returning.html" \
              && grep -Fqx 'x-matched-path: /complete-profile' "$CANARY_OUTPUT_DIR/www-returning.normalized.headers" \
              && [[ "$apex_status" == "308" ]] \
              && grep -Eq '^location: https://www\.moraltrade\.org/complete-profile([?].*)?$' "$CANARY_OUTPUT_DIR/apex.normalized.headers"; then
              verified=true
              break
            fi

            sleep 15
          done

          if [[ "$verified" != "true" ]]; then
            echo "The live aliases did not serve the expected Complete Profile route and canonical redirect." >&2
            exit 1
          fi

          jq -n \
            --arg controlSha "$CONTROL_SHA" \
            --arg deployedSha "${{ steps.deployment.outputs.deployed_sha }}" \
            --arg deploymentId "${{ steps.deployment.outputs.deployment_id }}" \
            --arg wwwStatus "$www_status" \
            --arg apexStatus "$apex_status" '
              {
                controlSha: $controlSha,
                deployedSha: $deployedSha,
                deploymentId: $deploymentId,
                wwwStatus: $wwwStatus,
                apexStatus: $apexStatus,
                routeVerified: true,
                aliasMetadataVerified: true
              }
            ' > "$CANARY_OUTPUT_DIR/domain-verification.json"

      - name: Run the rendered first-time and returning-user canary
        env:
          EXPECTED_SHA: ${{ steps.deployment.outputs.deployed_sha }}
          EXPECTED_DEPLOYMENT_ID: ${{ steps.deployment.outputs.deployment_id }}
        run: node .github/scripts/complete-profile-production-canary.mjs

      - name: Reconfirm the exact deployment still serves both production aliases
        env:
          VERCEL_TOKEN_VALUE: ${{ secrets.VERCEL_TOKEN }}
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.deployment_id }}
          DEPLOYED_SHA: ${{ steps.deployment.outputs.deployed_sha }}
        shell: bash
        run: |
          set -euo pipefail

          for alias_name in moraltrade.org www.moraltrade.org; do
            alias_key="${alias_name//./-}"
            alias_path="$CANARY_OUTPUT_DIR/alias-readback/${alias_key}-after-canary.json"
            alias_api="https://api.vercel.com/v4/aliases/${alias_name}?projectId=${VERCEL_PROJECT_ID}&teamId=${VERCEL_TEAM_ID}"

            curl -fsS \
              -H "Authorization: Bearer ${VERCEL_TOKEN_VALUE}" \
              "$alias_api" \
              > "$alias_path"

            jq -e \
              --arg alias_name "$alias_name" \
              --arg project_id "$VERCEL_PROJECT_ID" \
              --arg deployment_id "$DEPLOYMENT_ID" '
                (.alias == $alias_name)
                and (.projectId == $project_id)
                and ((.deploymentId // .deployment.id // .deployment.uid // "") == $deployment_id)
              ' "$alias_path" >/dev/null
          done

          detail_api="https://api.vercel.com/v13/deployments/${DEPLOYMENT_ID}?teamId=${VERCEL_TEAM_ID}"
          curl -fsS \
            -H "Authorization: Bearer ${VERCEL_TOKEN_VALUE}" \
            "$detail_api" \
            > "$CANARY_OUTPUT_DIR/deployment-after-canary.json"

          jq -e \
            --arg project_id "$VERCEL_PROJECT_ID" \
            --arg deployment_id "$DEPLOYMENT_ID" \
            --arg deployed_sha "$DEPLOYED_SHA" '
              ((.uid // .id) == $deployment_id)
              and (.target == "production")
              and ((.readyState // .state // "") == "READY")
              and ((.projectId // .project.id // "") == $project_id)
              and ((.aliasError // null) == null)
              and (.meta.githubCommitSha == $deployed_sha)
            ' "$CANARY_OUTPUT_DIR/deployment-after-canary.json" >/dev/null

      - name: Summarize the canary
        if: always()
        run: |
          {
            echo '## Complete Profile production canary'
            echo
            echo "- Control commit: \`$CONTROL_SHA\`"
            echo "- Deployed commit: \`${{ steps.deployment.outputs.deployed_sha }}\`"
            echo "- Deployment: \`${{ steps.deployment.outputs.deployment_id }}\`"
            if [[ -f "$CANARY_OUTPUT_DIR/report.json" ]]; then
              echo "- Result: \`$(jq -r '.status // "unknown"' "$CANARY_OUTPUT_DIR/report.json")\`"
              echo "- Scenarios passed: \`$(jq '[.scenarios[] | select(.status == "passed")] | length' "$CANARY_OUTPUT_DIR/report.json")/6\`"
              echo "- Expected cancelled prefetches: \`$(jq -r '.expectedPrefetchAbortCount // 0' "$CANARY_OUTPUT_DIR/report.json")\`"
            else
              echo '- Result: `failed before the rendered canary completed`'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload canary evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: complete-profile-production-canary-${{ steps.deployment.outputs.deployed_sha || github.sha }}
          path: complete-profile-production-canary
          if-no-files-found: error
          retention-days: 14

      - name: Publish the canary result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          DEPLOYED_SHA: ${{ steps.deployment.outputs.deployed_sha }}
        shell: bash
        run: |
          status_sha="${DEPLOYED_SHA:-$CONTROL_SHA}"
          if [[ "$JOB_STATUS" == "success" ]]; then
            state=success
            description="Live production deployment passed all six Complete Profile canary scenarios"
          else
            state=failure
            description="Complete Profile production canary failed; inspect the run evidence"
          fi

          gh api "repos/${GITHUB_REPOSITORY}/statuses/${status_sha}" \
            -f state="$state" \
            -f context="${STATUS_CONTEXT}" \
            -f description="$description" \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
