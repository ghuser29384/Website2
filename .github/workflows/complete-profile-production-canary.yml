name: Complete Profile production canary

on:
  push:
    branches:
      - main
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: complete-profile-production-canary-${{ github.sha }}
  cancel-in-progress: true

jobs:
  production-canary:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      EXPECTED_SHA: ${{ github.sha }}
      STATUS_CONTEXT: QA / Complete Profile production canary
      VERCEL_PROJECT_ID: prj_Em3j7Uj7RatX2R1ZYhla3XSHRde7
      VERCEL_TEAM_ID: team_ySu6sF3Uho1E1GnJtCQPVEuJ
      CANONICAL_ORIGIN: https://www.moraltrade.org
      APEX_ORIGIN: https://moraltrade.org
      CANARY_OUTPUT_DIR: complete-profile-production-canary

    steps:
      - name: Mark the exact commit pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${EXPECTED_SHA}" \
            -f state=pending \
            -f context="${STATUS_CONTEXT}" \
            -f description="Waiting for the exact production deployment and running the Complete Profile canary" \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Check out the exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 1

      - name: Verify the exact checkout
        run: test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Resolve the exact READY production deployment
        id: deployment
        env:
          VERCEL_TOKEN_VALUE: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN_VALUE"
          mkdir -p "$CANARY_OUTPUT_DIR"

          api="https://api.vercel.com/v6/deployments?projectId=${VERCEL_PROJECT_ID}&target=production&limit=100&teamId=${VERCEL_TEAM_ID}"
          deployment=''

          for attempt in $(seq 1 300); do
            if curl -fsS \
              -H "Authorization: Bearer ${VERCEL_TOKEN_VALUE}" \
              "$api" \
              > /tmp/moraltrade-production-deployments.json; then
              deployment="$(jq -c --arg sha "$EXPECTED_SHA" '
                [.deployments[]
                  | select(.target == "production")
                  | select(.meta.githubCommitSha == $sha)]
                | sort_by(.created)
                | reverse
                | .[0] // empty
              ' /tmp/moraltrade-production-deployments.json)"
            fi

            latest_main="$(git ls-remote origin refs/heads/main | cut -f1)"

            if [[ -n "$deployment" ]]; then
              state="$(jq -r '.state // "UNKNOWN"' <<<"$deployment")"
              if [[ "$state" == "READY" ]]; then
                break
              fi
              if [[ "$state" == "ERROR" ]]; then
                echo "The exact production deployment reached terminal state ERROR." >&2
                exit 1
              fi
              if [[ "$state" == "CANCELED" && "$latest_main" != "$EXPECTED_SHA" ]]; then
                echo "superseded=true" >> "$GITHUB_OUTPUT"
                jq -n \
                  --arg expectedSha "$EXPECTED_SHA" \
                  --arg latestMain "$latest_main" \
                  --arg state "$state" \
                  '{expectedSha:$expectedSha,latestMain:$latestMain,state:$state,superseded:true}' \
                  > "$CANARY_OUTPUT_DIR/deployment.json"
                exit 0
              fi
            elif [[ "$attempt" -ge 60 && "$latest_main" != "$EXPECTED_SHA" ]]; then
              echo "superseded=true" >> "$GITHUB_OUTPUT"
              jq -n \
                --arg expectedSha "$EXPECTED_SHA" \
                --arg latestMain "$latest_main" \
                '{expectedSha:$expectedSha,latestMain:$latestMain,state:"not-created",superseded:true}' \
                > "$CANARY_OUTPUT_DIR/deployment.json"
              exit 0
            fi

            sleep 15
          done

          if [[ -z "$deployment" ]]; then
            echo "No production deployment was found for exact commit $EXPECTED_SHA." >&2
            exit 1
          fi

          state="$(jq -r '.state // "UNKNOWN"' <<<"$deployment")"
          if [[ "$state" != "READY" ]]; then
            echo "The exact production deployment did not become READY; final state: $state." >&2
            exit 1
          fi

          deployment_id="$(jq -r .id <<<"$deployment")"
          deployment_url="https://$(jq -r .url <<<"$deployment")"
          echo "superseded=false" >> "$GITHUB_OUTPUT"
          echo "deployment_id=$deployment_id" >> "$GITHUB_OUTPUT"
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"

          jq -n \
            --arg expectedSha "$EXPECTED_SHA" \
            --arg deploymentId "$deployment_id" \
            --arg deploymentUrl "$deployment_url" \
            --arg state "$state" \
            '{expectedSha:$expectedSha,deploymentId:$deploymentId,deploymentUrl:$deploymentUrl,state:$state,superseded:false}' \
            > "$CANARY_OUTPUT_DIR/deployment.json"

      - name: Verify the exact deployment through both production domains
        id: domains
        if: steps.deployment.outputs.superseded != 'true'
        env:
          EXPECTED_DEPLOYMENT_ID: ${{ steps.deployment.outputs.deployment_id }}
        run: |
          set -euo pipefail

          verified=false
          for attempt in $(seq 1 40); do
            www_status="$(curl -sS \
              --cookie 'mt_walkthrough_seen=1' \
              -D "$CANARY_OUTPUT_DIR/www-returning.headers" \
              -o "$CANARY_OUTPUT_DIR/www-returning.html" \
              -w '%{http_code}' \
              "$CANONICAL_ORIGIN/complete-profile")"

            apex_status="$(curl -sS \
              -D "$CANARY_OUTPUT_DIR/apex.headers" \
              -o /dev/null \
              -w '%{http_code}' \
              "$APEX_ORIGIN/complete-profile")"

            tr -d '\r' < "$CANARY_OUTPUT_DIR/www-returning.headers" \
              > "$CANARY_OUTPUT_DIR/www-returning.normalized.headers"
            tr -d '\r' < "$CANARY_OUTPUT_DIR/apex.headers" \
              > "$CANARY_OUTPUT_DIR/apex.normalized.headers"

            if [[ "$www_status" == "200" ]] \
              && grep -Fq "$EXPECTED_DEPLOYMENT_ID" "$CANARY_OUTPUT_DIR/www-returning.html" \
              && grep -Fq 'Spend 100 sparks of attention.' "$CANARY_OUTPUT_DIR/www-returning.html" \
              && grep -Fqx 'x-matched-path: /complete-profile' "$CANARY_OUTPUT_DIR/www-returning.normalized.headers" \
              && [[ "$apex_status" == "308" ]] \
              && grep -Eq '^location: https://www\.moraltrade\.org/complete-profile([?].*)?$' "$CANARY_OUTPUT_DIR/apex.normalized.headers"; then
              verified=true
              break
            fi

            sleep 15
          done

          if [[ "$verified" != "true" ]]; then
            latest_main="$(git ls-remote origin refs/heads/main | cut -f1)"
            if [[ "$latest_main" != "$EXPECTED_SHA" ]]; then
              echo "superseded=true" >> "$GITHUB_OUTPUT"
              jq -n \
                --arg expectedSha "$EXPECTED_SHA" \
                --arg expectedDeploymentId "$EXPECTED_DEPLOYMENT_ID" \
                --arg latestMain "$latest_main" \
                '{expectedSha:$expectedSha,expectedDeploymentId:$expectedDeploymentId,latestMain:$latestMain,verified:false,superseded:true}' \
                > "$CANARY_OUTPUT_DIR/domain-verification.json"
              exit 0
            fi

            echo "The exact READY deployment never became live on both production domains." >&2
            exit 1
          fi

          echo "superseded=false" >> "$GITHUB_OUTPUT"
          jq -n \
            --arg expectedSha "$EXPECTED_SHA" \
            --arg expectedDeploymentId "$EXPECTED_DEPLOYMENT_ID" \
            --arg wwwStatus "$www_status" \
            --arg apexStatus "$apex_status" \
            '{expectedSha:$expectedSha,expectedDeploymentId:$expectedDeploymentId,wwwStatus:$wwwStatus,apexStatus:$apexStatus,verified:true,superseded:false}' \
            > "$CANARY_OUTPUT_DIR/domain-verification.json"

      - name: Run the rendered first-time and returning-user canary
        if: >-
          steps.deployment.outputs.superseded != 'true' &&
          steps.domains.outputs.superseded != 'true'
        env:
          EXPECTED_DEPLOYMENT_ID: ${{ steps.deployment.outputs.deployment_id }}
        run: node .github/scripts/complete-profile-production-canary.mjs

      - name: Summarize the canary
        if: always()
        run: |
          {
            echo '## Complete Profile production canary'
            echo
            echo "- Commit: \`$EXPECTED_SHA\`"
            echo "- Deployment: \`${{ steps.deployment.outputs.deployment_id }}\`"
            if [[ "${{ steps.deployment.outputs.superseded }}" == "true" || "${{ steps.domains.outputs.superseded }}" == "true" ]]; then
              echo '- Result: `superseded before becoming the live production alias`'
            elif [[ -f "$CANARY_OUTPUT_DIR/report.json" ]]; then
              echo "- Result: \`$(jq -r '.status // "unknown"' "$CANARY_OUTPUT_DIR/report.json")\`"
              echo "- Scenarios passed: \`$(jq '[.scenarios[] | select(.status == "passed")] | length' "$CANARY_OUTPUT_DIR/report.json")/6\`"
              echo "- Known root-prefetch 404s: \`$(jq -r '.knownRootPrefetch404Count // 0' "$CANARY_OUTPUT_DIR/report.json")\`"
            else
              echo '- Result: `failed before the rendered canary`'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload canary evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: complete-profile-production-canary-${{ github.sha }}
          path: complete-profile-production-canary
          if-no-files-found: error
          retention-days: 14

      - name: Publish the canary result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          DEPLOYMENT_SUPERSEDED: ${{ steps.deployment.outputs.superseded }}
          DOMAIN_SUPERSEDED: ${{ steps.domains.outputs.superseded }}
        run: |
          if [[ "$JOB_STATUS" != "success" ]]; then
            state=failure
            description="Complete Profile production canary failed; inspect the run evidence"
          elif [[ "$DEPLOYMENT_SUPERSEDED" == "true" || "$DOMAIN_SUPERSEDED" == "true" ]]; then
            state=success
            description="Commit was superseded before becoming the live production alias"
          else
            state=success
            description="Exact production deployment passed all six Complete Profile canary scenarios"
          fi

          gh api "repos/${GITHUB_REPOSITORY}/statuses/${EXPECTED_SHA}" \
            -f state="$state" \
            -f context="${STATUS_CONTEXT}" \
            -f description="$description" \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
