name: Complete Profile production canary

on:
  pull_request:
    paths:
      - ".github/scripts/complete-profile-production-canary.mjs"
      - ".github/workflows/complete-profile-production-canary.yml"
      - "scripts/vercel-release-workflow.test.mjs"
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Optional exact deployed Git SHA to verify; otherwise use the latest READY production deployment
        required: false
        type: string

permissions:
  contents: read
  statuses: write

concurrency:
  group: complete-profile-production-canary-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  source-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4
      - name: Parse the production canary script
        run: node --check .github/scripts/complete-profile-production-canary.mjs
      - name: Verify the permanent release workflow contracts
        run: node --test scripts/vercel-release-workflow.test.mjs

  production-canary:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      STATUS_CONTEXT: QA / Complete Profile production canary
      VERCEL_PROJECT_ID: prj_Em3j7Uj7RatX2R1ZYhla3XSHRde7
      VERCEL_TEAM_ID: team_ySu6sF3Uho1E1GnJtCQPVEuJ
      CANONICAL_ORIGIN: https://www.moraltrade.org
      APEX_ORIGIN: https://moraltrade.org
      CANARY_OUTPUT_DIR: complete-profile-production-canary

    steps:
      - name: Resolve the exact live READY production deployment
        id: deployment
        env:
          VERCEL_TOKEN_VALUE: ${{ secrets.VERCEL_TOKEN }}
          REQUESTED_SHA: ${{ inputs.expected_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN_VALUE"
          mkdir -p "$CANARY_OUTPUT_DIR"

          deployments="$(curl -fsS \
            -H "Authorization: Bearer ${VERCEL_TOKEN_VALUE}" \
            "https://api.vercel.com/v6/deployments?projectId=${VERCEL_PROJECT_ID}&target=production&limit=100&teamId=${VERCEL_TEAM_ID}")"

          deployment="$(jq -c --arg sha "${REQUESTED_SHA:-}" '
            [.deployments[]
              | select(.target == "production")
              | select(.state == "READY")
              | select(($sha == "") or (.meta.githubCommitSha == $sha))]
            | sort_by(.created)
            | reverse
            | .[0] // empty
          ' <<<"$deployments")"

          if [[ -z "$deployment" ]]; then
            if [[ -n "${REQUESTED_SHA:-}" ]]; then
              echo "No READY production deployment was found for requested SHA $REQUESTED_SHA." >&2
            else
              echo "No READY production deployment was found for the canonical project." >&2
            fi
            exit 1
          fi

          deployment_id="$(jq -r '.uid // .id // empty' <<<"$deployment")"
          deployment_url="https://$(jq -r '.url // empty' <<<"$deployment")"
          expected_sha="$(jq -r '.meta.githubCommitSha // empty' <<<"$deployment")"
          test -n "$deployment_id"
          test -n "$expected_sha"

          detail="$(curl -fsS \
            -H "Authorization: Bearer ${VERCEL_TOKEN_VALUE}" \
            "https://api.vercel.com/v13/deployments/${deployment_id}?teamId=${VERCEL_TEAM_ID}")"

          state="$(jq -r '.readyState // .state // "UNKNOWN"' <<<"$detail")"
          detail_id="$(jq -r '.uid // .id // empty' <<<"$detail")"
          project_id="$(jq -r '.projectId // .project.id // empty' <<<"$detail")"
          target="$(jq -r '.target // empty' <<<"$detail")"
          detail_sha="$(jq -r '.meta.githubCommitSha // empty' <<<"$detail")"
          detail_url="https://$(jq -r '.url // empty' <<<"$detail")"

          test "$state" = 'READY'
          test "$detail_id" = "$deployment_id"
          test "$project_id" = "$VERCEL_PROJECT_ID"
          test "$target" = 'production'
          test "$detail_sha" = "$expected_sha"
          test "$detail_url" = "$deployment_url"
          if [[ -n "${REQUESTED_SHA:-}" ]]; then
            test "$expected_sha" = "$REQUESTED_SHA"
          fi

          echo "deployment_id=$deployment_id" >> "$GITHUB_OUTPUT"
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"
          echo "expected_sha=$expected_sha" >> "$GITHUB_OUTPUT"

          jq -n \
            --arg expectedSha "$expected_sha" \
            --arg deploymentId "$deployment_id" \
            --arg deploymentUrl "$deployment_url" \
            --arg projectId "$project_id" \
            --arg state "$state" \
            --arg target "$target" \
            --argjson aliases "$(jq -c '.alias // []' <<<"$detail")" \
            '{expectedSha:$expectedSha,deploymentId:$deploymentId,deploymentUrl:$deploymentUrl,projectId:$projectId,state:$state,target:$target,aliases:$aliases}' \
            > "$CANARY_OUTPUT_DIR/deployment.json"

      - name: Mark the exact deployed commit pending
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ steps.deployment.outputs.expected_sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${EXPECTED_SHA}" \
            -f state=pending \
            -f context="$STATUS_CONTEXT" \
            -f description="Verifying the exact live production deployment and running the Complete Profile canary" \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Check out the exact deployed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.deployment.outputs.expected_sha }}
          fetch-depth: 1

      - name: Verify the exact checkout
        env:
          EXPECTED_SHA: ${{ steps.deployment.outputs.expected_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify the exact deployment through both production domains
        id: domains
        env:
          VERCEL_TOKEN_VALUE: ${{ secrets.VERCEL_TOKEN }}
          EXPECTED_SHA: ${{ steps.deployment.outputs.expected_sha }}
          EXPECTED_DEPLOYMENT_ID: ${{ steps.deployment.outputs.deployment_id }}
        shell: bash
        run: |
          set -euo pipefail
          verified=false
          detail=''
          www_status='000'
          apex_status='000'

          for attempt in $(seq 1 40); do
            detail="$(curl -fsS \
              -H "Authorization: Bearer ${VERCEL_TOKEN_VALUE}" \
              "https://api.vercel.com/v13/deployments/${EXPECTED_DEPLOYMENT_ID}?teamId=${VERCEL_TEAM_ID}")"

            aliases_ready=false
            if jq -e --arg alias 'moraltrade.org' '(.alias // []) | index($alias) != null' <<<"$detail" >/dev/null \
              && jq -e --arg alias 'www.moraltrade.org' '(.alias // []) | index($alias) != null' <<<"$detail" >/dev/null; then
              aliases_ready=true
            fi

            : > "$CANARY_OUTPUT_DIR/www-returning.headers"
            : > "$CANARY_OUTPUT_DIR/apex.headers"
            set +e
            www_status="$(curl -sS --max-time 60 \
              --cookie 'mt_walkthrough_seen=1' \
              -D "$CANARY_OUTPUT_DIR/www-returning.headers" \
              -o "$CANARY_OUTPUT_DIR/www-returning.html" \
              -w '%{http_code}' \
              "$CANONICAL_ORIGIN/complete-profile")"
            www_curl_status=$?
            apex_status="$(curl -sS --max-time 60 \
              -D "$CANARY_OUTPUT_DIR/apex.headers" \
              -o /dev/null \
              -w '%{http_code}' \
              "$APEX_ORIGIN/complete-profile")"
            apex_curl_status=$?
            set -e

            tr -d '\r' < "$CANARY_OUTPUT_DIR/www-returning.headers" \
              > "$CANARY_OUTPUT_DIR/www-returning.normalized.headers"
            tr -d '\r' < "$CANARY_OUTPUT_DIR/apex.headers" \
              > "$CANARY_OUTPUT_DIR/apex.normalized.headers"

            if [[ "$aliases_ready" == 'true' ]] \
              && [[ "$www_curl_status" -eq 0 ]] \
              && [[ "$apex_curl_status" -eq 0 ]] \
              && [[ "$www_status" == '200' ]] \
              && grep -Fq 'Spend 100 sparks of attention.' "$CANARY_OUTPUT_DIR/www-returning.html" \
              && grep -Fqx 'x-matched-path: /complete-profile' "$CANARY_OUTPUT_DIR/www-returning.normalized.headers" \
              && [[ "$apex_status" == '308' ]] \
              && grep -Eq '^location: https://www\.moraltrade\.org/complete-profile([?].*)?$' "$CANARY_OUTPUT_DIR/apex.normalized.headers"; then
              verified=true
              break
            fi

            sleep 15
          done

          if [[ "$verified" != 'true' ]]; then
            echo "The exact READY deployment was not bound to both production aliases with the expected routes." >&2
            exit 1
          fi

          jq -n \
            --arg expectedSha "$EXPECTED_SHA" \
            --arg expectedDeploymentId "$EXPECTED_DEPLOYMENT_ID" \
            --arg wwwStatus "$www_status" \
            --arg apexStatus "$apex_status" \
            --argjson aliases "$(jq -c '.alias // []' <<<"$detail")" \
            '{expectedSha:$expectedSha,expectedDeploymentId:$expectedDeploymentId,wwwStatus:($wwwStatus|tonumber),apexStatus:($apexStatus|tonumber),aliases:$aliases,verified:true}' \
            > "$CANARY_OUTPUT_DIR/domain-verification.json"

      - name: Run the rendered first-time and returning-user canary
        env:
          EXPECTED_SHA: ${{ steps.deployment.outputs.expected_sha }}
          EXPECTED_DEPLOYMENT_ID: ${{ steps.deployment.outputs.deployment_id }}
        run: node .github/scripts/complete-profile-production-canary.mjs

      - name: Summarize the canary
        if: always()
        env:
          EXPECTED_SHA: ${{ steps.deployment.outputs.expected_sha }}
          EXPECTED_DEPLOYMENT_ID: ${{ steps.deployment.outputs.deployment_id }}
        shell: bash
        run: |
          {
            echo '## Complete Profile production canary'
            echo
            echo "- Commit: \`$EXPECTED_SHA\`"
            echo "- Deployment: \`$EXPECTED_DEPLOYMENT_ID\`"
            if [[ -f "$CANARY_OUTPUT_DIR/report.json" ]]; then
              echo "- Result: \`$(jq -r '.status // "unknown"' "$CANARY_OUTPUT_DIR/report.json")\`"
              echo "- Scenarios passed: \`$(jq '[.scenarios[] | select(.status == "passed")] | length' "$CANARY_OUTPUT_DIR/report.json")/6\`"
              echo "- Expected cancelled prefetches: \`$(jq -r '.expectedPrefetchAbortCount // 0' "$CANARY_OUTPUT_DIR/report.json")\`"
            else
              echo '- Result: `failed before the rendered canary`'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload canary evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: complete-profile-production-canary-${{ steps.deployment.outputs.expected_sha }}
          path: complete-profile-production-canary
          if-no-files-found: error
          retention-days: 14

      - name: Publish the canary result
        if: always() && steps.deployment.outputs.expected_sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          EXPECTED_SHA: ${{ steps.deployment.outputs.expected_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$JOB_STATUS" == 'success' ]]; then
            state=success
            description="Exact live production deployment passed all six Complete Profile canary scenarios"
          else
            state=failure
            description="Complete Profile production canary failed; inspect the exact run evidence"
          fi

          gh api "repos/${GITHUB_REPOSITORY}/statuses/${EXPECTED_SHA}" \
            -f state="$state" \
            -f context="$STATUS_CONTEXT" \
            -f description="$description" \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          test "$state" = success
