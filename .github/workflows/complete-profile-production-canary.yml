name: PR 757 exact production release controller

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    branches:
      - main
    paths:
      - .github/workflows/complete-profile-production-canary.yml

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: pr757-exact-production-release-controller
  cancel-in-progress: false

env:
  CONTROLLER_BRANCH: ops/pr757-exact-release-controller-pr-20260818
  CONTROLLER_PATH: .github/workflows/complete-profile-production-canary.yml
  EXPECTED_MAIN_SHA: f9ae5480ae7c20176f24c5f8b678088b5823fc39
  RELEASE_WORKFLOW: vercel-release.yml
  RELEASE_NOT_BEFORE: '2026-08-18T05:55:29Z'

jobs:
  dispatch:
    if: ${{ github.event.pull_request.head.ref == 'ops/pr757-exact-release-controller-pr-20260818' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact controller head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Guard the one-file controller and exact remote main
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'ghuser29384/Website2'
          test "${{ github.event.pull_request.base.ref }}" = 'main'
          test "${{ github.event.pull_request.base.sha }}" = "$EXPECTED_MAIN_SHA"
          test "${{ github.event.pull_request.head.ref }}" = "$CONTROLLER_BRANCH"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_MAIN_SHA"
          test "$(git diff --name-only HEAD^ HEAD)" = "$CONTROLLER_PATH"
          git diff --check HEAD^ HEAD
          remote_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$remote_main" = "$EXPECTED_MAIN_SHA"
          test "$(git show "$EXPECTED_MAIN_SHA:.github/workflows/vercel-release.yml" | sed -n '1p')" = 'name: Gated Vercel release'

      - name: Adopt or dispatch exactly one guarded production release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          find_exact_run() {
            local listing candidate_id candidate
            listing="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$RELEASE_WORKFLOW/runs?event=workflow_dispatch&branch=main&per_page=50")"
            while IFS= read -r candidate_id; do
              [[ -n "$candidate_id" ]] || continue
              candidate="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$candidate_id")"
              if [[ "$(jq -r '.head_sha' <<<"$candidate")" = "$EXPECTED_MAIN_SHA" \
                && "$(jq -r '.event' <<<"$candidate")" = 'workflow_dispatch' \
                && "$(jq -r '.head_branch' <<<"$candidate")" = 'main' \
                && "$(jq -r '.created_at' <<<"$candidate")" > "$RELEASE_NOT_BEFORE" \
                && "$(jq -r '.inputs.target // empty' <<<"$candidate")" = 'production' \
                && "$(jq -r '.inputs.ref // empty' <<<"$candidate")" = 'main' \
                && "$(jq -r '.inputs.expected_sha // empty' <<<"$candidate")" = "$EXPECTED_MAIN_SHA" \
                && -z "$(jq -r '.inputs.synthetic_auth_fixture_url // empty' <<<"$candidate")" ]]; then
                printf '%s\n' "$candidate_id"
                return 0
              fi
            done < <(jq -r '.workflow_runs | sort_by(.created_at) | reverse[] | .id' <<<"$listing")
            return 1
          }

          disposition='adopted-existing'
          run_id="$(find_exact_run || true)"
          if [[ -z "$run_id" ]]; then
            disposition='dispatched-new'
            jq -n \
              --arg workflow_ref 'main' \
              --arg release_ref 'main' \
              --arg target 'production' \
              --arg expected_sha "$EXPECTED_MAIN_SHA" \
              --arg fixture '' \
              '{ref:$workflow_ref,inputs:{target:$target,ref:$release_ref,expected_sha:$expected_sha,synthetic_auth_fixture_url:$fixture}}' \
              | gh api --method POST \
                  -H 'Accept: application/vnd.github+json' \
                  -H 'X-GitHub-Api-Version: 2022-11-28' \
                  "repos/$GITHUB_REPOSITORY/actions/workflows/$RELEASE_WORKFLOW/dispatches" \
                  --input - >/dev/null

            for _ in $(seq 1 60); do
              run_id="$(find_exact_run || true)"
              [[ -n "$run_id" ]] && break
              sleep 2
            done
          fi

          test -n "$run_id"
          run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id")"
          test "$(jq -r '.head_sha' <<<"$run")" = "$EXPECTED_MAIN_SHA"
          test "$(jq -r '.event' <<<"$run")" = 'workflow_dispatch'
          test "$(jq -r '.head_branch' <<<"$run")" = 'main'
          test "$(jq -r '.inputs.target' <<<"$run")" = 'production'
          test "$(jq -r '.inputs.ref' <<<"$run")" = 'main'
          test "$(jq -r '.inputs.expected_sha' <<<"$run")" = "$EXPECTED_MAIN_SHA"
          test -z "$(jq -r '.inputs.synthetic_auth_fixture_url // empty' <<<"$run")"

          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "run_url=$(jq -r '.html_url' <<<"$run")" >> "$GITHUB_OUTPUT"
          echo "status=$(jq -r '.status' <<<"$run")" >> "$GITHUB_OUTPUT"
          echo "conclusion=$(jq -r '.conclusion // "pending"' <<<"$run")" >> "$GITHUB_OUTPUT"
          echo "disposition=$disposition" >> "$GITHUB_OUTPUT"

      - name: Record exact release identity on PR 757
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.release.outputs.run_id }}
          RUN_URL: ${{ steps.release.outputs.run_url }}
          RUN_STATUS: ${{ steps.release.outputs.status }}
          RUN_CONCLUSION: ${{ steps.release.outputs.conclusion }}
          DISPOSITION: ${{ steps.release.outputs.disposition }}
        shell: bash
        run: |
          set -euo pipefail
          body="$(cat <<EOF
PR757_EXACT_RELEASE_RUN
controller_run_id=$GITHUB_RUN_ID
controller_head=${{ github.event.pull_request.head.sha }}
disposition=$DISPOSITION
run_id=$RUN_ID
run_url=$RUN_URL
head_sha=$EXPECTED_MAIN_SHA
head_branch=main
event=workflow_dispatch
status=$RUN_STATUS
conclusion=$RUN_CONCLUSION
dispatch_ref=main
input_target=production
input_ref=main
input_expected_sha=$EXPECTED_MAIN_SHA
input_synthetic_auth_fixture_url=<empty>
EOF
)"
          gh pr comment 757 --repo "$GITHUB_REPOSITORY" --body "$body"
