name: Locate stale PR 552 discover route

on:
  push:
    branches:
      - ops/pr552-authenticated-preview-mfa-db-qa-v10-20260808
    paths:
      - .github/workflows/pr552-locate-stale-discover-route-20260808.yml

permissions:
  contents: read

jobs:
  locate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Locate exact and constructed stale routes
        shell: bash
        run: |
          set -euo pipefail
          search_roots=(src public tests .github)
          echo '=== exact URL ==='
          grep -RInF --exclude-dir=.git --exclude-dir=node_modules 'discover?domain=offers&view=list' "${search_roots[@]}" || true
          echo '=== domain=offers ==='
          grep -RInF --exclude-dir=.git --exclude-dir=node_modules 'domain=offers' "${search_roots[@]}" || true
          echo '=== domain tokens ==='
          grep -RInE --exclude-dir=.git --exclude-dir=node_modules 'domain.{0,24}offers|offers.{0,24}domain' "${search_roots[@]}" || true
          echo '=== view=list ==='
          grep -RInF --exclude-dir=.git --exclude-dir=node_modules 'view=list' "${search_roots[@]}" || true
          echo '=== view/list tokens ==='
          grep -RInE --exclude-dir=.git --exclude-dir=node_modules 'view.{0,24}list|list.{0,24}view' "${search_roots[@]}" || true
          echo '=== discover references ==='
          grep -RInE --exclude-dir=.git --exclude-dir=node_modules '/discover|["'"']discover["'"']' "${search_roots[@]}" || true
          echo '=== offers navigation references ==='
          grep -RInE --exclude-dir=.git --exclude-dir=node_modules 'href.{0,80}offers|offers.{0,80}href|router\.(push|replace).{0,80}offers' "${search_roots[@]}" || true
