name: Verify approved Create proportions release once
on:
  push:
    branches: [ops/release-create-825-20260925]
    paths: [.github/workflows/ops-release-create-825-once.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: ops-release-create-825-20260925
  cancel-in-progress: false
jobs:
  observe-and-verify:
    if: github.repository == 'ghuser29384/Website2'
    runs-on: ubuntu-24.04
    timeout-minutes: 125
    steps:
      - name: Check out the exact read-only observer
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Observe the existing exact release and verify public assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess, time, urllib.request
          repo = 'ghuser29384/Website2'
          sha = '0f37928e9a0a6aaec6ce24c2a989fd409a4019c0'
          run_id = 36197251864
          own_path = '.github/workflows/ops-release-create-825-once.yml'
          evidence = pathlib.Path('create-825-release-evidence')
          evidence.mkdir()
          def require(ok, message):
              if not ok:
                  raise SystemExit(message)
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          def api(path):
              request = urllib.request.Request('https://api.github.com/repos/' + repo + '/' + path,
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                           'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(request, timeout=40) as response:
                  return json.load(response)
          require(os.environ['GITHUB_REPOSITORY'] == repo, 'Wrong repository')
          require(os.environ['GITHUB_REF'] == 'refs/heads/ops/release-create-825-20260925', 'Wrong branch')
          require(git('rev-parse', 'HEAD') == os.environ['GITHUB_SHA'], 'Wrong observer head')
          require(git('show', '-s', '--format=%P', 'HEAD') == 'a834ead3cf0721932461e0437c07f1eb2ab14e3c', 'Wrong observer parent')
          require(git('show', '-s', '--format=%P', 'HEAD^') == sha, 'Wrong initial dispatcher parent')
          require(git('diff', '--name-only', sha, 'HEAD') == own_path, 'Unexpected observer scope')
          subprocess.run(['git', 'diff', '--check', sha, 'HEAD'], check=True)
          for path, blob in {
              'public/moral-trade-create/ui-repairs.css': '812b5982ecc2e3801ce8334b2ed6eb8f594d7326',
              'tests/create-route-ui-regression.spec.ts': '88623d469486e274cd0150eaf42d6d3ede11bbcd',
              '.github/workflows/vercel-release.yml': 'e219e99d25279161b89eee80fc410912c3561a19',
          }.items():
              require(git('rev-parse', sha + ':' + path) == blob, 'Approved source changed: ' + path)
          # GET requests only: the Contact release already dispatched this exact main.
          receipt = {'source_sha': sha, 'pr': 825, 'release_run_id': run_id,
                     'release_url': f'https://github.com/{repo}/actions/runs/{run_id}',
                     'observer_run_id': os.environ['GITHUB_RUN_ID'], 'dispatch_performed_by_observer': False}
          (evidence / 'observation.json').write_text(json.dumps(receipt, indent=2) + '\n')
          deadline = time.monotonic() + 6900
          while time.monotonic() < deadline:
              run = api('actions/runs/' + str(run_id))
              require(run['head_sha'] == sha and run['workflow_id'] == 325045339
                  and run['event'] == 'workflow_dispatch' and run['head_branch'] == 'main', 'Release identity mismatch')
              if run['status'] == 'completed':
                  receipt['release_conclusion'] = run['conclusion']
                  (evidence / 'observation.json').write_text(json.dumps(receipt, indent=2) + '\n')
                  require(run['conclusion'] == 'success', 'Existing gated release failed; no deployment success is inferred')
                  break
              time.sleep(20)
          else:
              raise SystemExit('Observation deadline reached; inspect the recorded release')
          expected_css = subprocess.check_output(['git', 'show', sha + ':public/moral-trade-create/ui-repairs.css'])
          records = []
          for host in ('moraltrade.org', 'www.moraltrade.org'):
              matched = False
              for attempt in range(30):
                  url = f'https://{host}/moral-trade-create/ui-repairs.css?integrity={sha}-{run_id}-{attempt}'
                  request = urllib.request.Request(url, headers={'Cache-Control': 'no-cache'})
                  with urllib.request.urlopen(request, timeout=30) as response:
                      content = response.read()
                      require(response.status == 200 and response.headers.get_content_type() == 'text/css', 'Bad stylesheet response')
                      require(response.url.startswith('https://' + host + '/')
                          or response.url.startswith('https://www.moraltrade.org/'), 'Unexpected redirect')
                  if content == expected_css:
                      matched = True
                      break
                  time.sleep(5)
              require(matched, 'Live CSS does not match approved source on ' + host)
              (evidence / (host + '-ui-repairs.css')).write_bytes(content)
              record = {'host': host, 'css_matches_approved_source': True,
                        'css_sha256': hashlib.sha256(content).hexdigest(),
                        'css_git_blob': hashlib.sha1(b'blob ' + str(len(content)).encode() + b'\0' + content).hexdigest()}
              with urllib.request.urlopen('https://' + host + '/create', timeout=30) as response:
                  html = response.read().decode('utf-8')
                  record['anonymous_create_status'] = response.status
                  record['anonymous_create_final_url'] = response.url
                  record['sign_in_boundary_visible'] = 'Sign in' in html and 'name="next" value="/create"' in html
                  require(response.status == 200 and record['sign_in_boundary_visible'], 'Unexpected anonymous Create response')
              records.append(record)
          receipt['canonical_public_checks'] = records
          receipt['authenticated_production_interactions_tested'] = False
          (evidence / 'verification.json').write_text(json.dumps(receipt, indent=2) + '\n')
          print(json.dumps(receipt), flush=True)
          PY
      - name: Retain public release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: create-825-release-${{ github.run_id }}
          path: create-825-release-evidence
          if-no-files-found: error
          retention-days: 30
