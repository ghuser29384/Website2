name: Fix DAC terminal pledger selectors once

on:
  push:
    branches:
      - fix/mpgf-dac-success-lapse-20260807
    paths:
      - .github/workflows/fix-dac-terminal-pledger-selectors-once.yml

permissions:
  contents: write

concurrency:
  group: fix-dac-terminal-pledger-selectors-once
  cancel-in-progress: false

env:
  TARGET_BRANCH: fix/mpgf-dac-success-lapse-20260807
  EXPECTED_PARENT: 86ea39d050e6c83db23d5b5f4ba8f356715af6ab
  CONTROLLER_PATH: .github/workflows/fix-dac-terminal-pledger-selectors-once.yml
  REGRESSION_PATH: supabase/tests/mpgf_dac_success_lapse.sql

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact target
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 2

      - name: Guard and disambiguate exact first-pledger selectors
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git diff-tree --no-commit-id --name-only -r HEAD)" = "$CONTROLLER_PATH"
          printf '%s' '' | base64 --decode | python3
          git diff --check
          test "$(grep -Fc 'and amount_cents = 6000' "$REGRESSION_PATH")" = "4"

      - name: Commit the repair and remove this controller in the same exact-head commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm "$CONTROLLER_PATH"
          git add "$REGRESSION_PATH"
          test "$(git diff --cached --name-only | sort | tr '\n' ' ')" = "$CONTROLLER_PATH $REGRESSION_PATH "
          git diff --cached --check
          git commit -m "Disambiguate DAC terminal pledge fixture selectors"
          git push origin "HEAD:$TARGET_BRANCH"
