name: Materialize Every.org webhook route-ID product slice v8

on:
  push:
    branches:
      - fix/every-org-webhook-route-id-708-20260818

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: every-org-webhook-route-id-708-v8-20260820
  cancel-in-progress: false

env:
  EXPECTED_REPOSITORY: ghuser29384/Website2
  EXPECTED_BRANCH: fix/every-org-webhook-route-id-708-20260818
  EXPECTED_EXISTING_HEAD: 59ce2af3b000f100149c6270e47d55052a01d020
  EXPECTED_PARENT: 0207a58410480b6edd1bb5a1496bc8ce7c66d6f6
  EXPECTED_PARENT_TREE: 360c4ac6949f1f83adc4e9dbf428b55f3870aea6
  EXPECTED_PARENT_BRANCH: fix/every-org-staging-api-host-708-v3-20260816
  EXPECTED_VALIDATED_TREE: c7415c58d6abf2b4e665e94837c7f0a683323a0d
  THIS_WORKFLOW: .github/workflows/run-every-org-webhook-route-id-708-v8-20260820.yml
  TRIGGER_FILE: .github/run-every-org-webhook-route-id-708-v8.trigger
  PATCH_PROGRAM: .github/scripts/apply-every-org-webhook-route-id-708-v5.py

jobs:
  materialize:
    if: github.event.head_commit.message == 'Run Every.org webhook route-ID materialization v8'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact trigger commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Guard exact topology and validated predecessor
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY"
          test "$GITHUB_REF_NAME" = "$EXPECTED_BRANCH"
          test "$GITHUB_ACTOR" = ghuser29384
          test "$(git rev-parse HEAD^^)" = "$EXPECTED_EXISTING_HEAD"
          test "$(git diff --name-only "$EXPECTED_EXISTING_HEAD" HEAD^)" = "$THIS_WORKFLOW"
          test "$(git diff --name-only HEAD^ HEAD)" = "$TRIGGER_FILE"
          test "$(cat "$TRIGGER_FILE")" = 'RUN_EVERY_ORG_WEBHOOK_ROUTE_ID_MATERIALIZATION_V8'
          test "$(git show -s --format=%T "$EXPECTED_PARENT")" = "$EXPECTED_PARENT_TREE"
          git fetch --no-tags origin "$EXPECTED_PARENT_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_PARENT"
          git merge-base --is-ancestor "$EXPECTED_PARENT" "$EXPECTED_EXISTING_HEAD"
          git merge-base --is-ancestor "$EXPECTED_PARENT" HEAD
          test -f "$PATCH_PROGRAM"
          test -z "$(git status --porcelain)"
          mkdir -p "$RUNNER_TEMP/evidence"
          {
            echo "trigger_actor=$GITHUB_ACTOR"
            echo "trigger_sha=$GITHUB_SHA"
            echo "validated_predecessor_run=32322506424"
            echo "validated_predecessor_local_commit=3ea58c6a72b8d916689a672a89f8a3cfb9309dc5"
            echo "validated_target_tree=$EXPECTED_VALIDATED_TREE"
          } > "$RUNNER_TEMP/evidence/trigger.txt"

      - name: Reproduce the exact validated final tree
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 -B "$PATCH_PROGRAM" \
            2>&1 | tee "$RUNNER_TEMP/evidence/route-id-patch.log"

          mapfile -t temporary_paths < <(
            git ls-files \
              | grep -E '(every-org-webhook-route-id|route-id-hardening|708-v[2-8])' \
              | grep -v '^src/lib/every-org-webhook-route-id-source-contract\.test\.ts$' \
              || true
          )
          printf '%s\n' "${temporary_paths[@]}" \
            | sed '/^$/d' \
            | tee "$RUNNER_TEMP/evidence/removed-temporary-paths.txt"
          for path in "${temporary_paths[@]}"; do
            git rm -f -- "$path"
          done
          find . -path ./.git -prune -o -type d -name __pycache__ -exec rm -rf {} +
          find . -path ./.git -prune -o -type f -name '*.pyc' -exec rm -f {} +
          git add -A
          git diff --cached --check

          cat > "$RUNNER_TEMP/evidence/expected-durable-paths.txt" <<'EOF'
          .env.example
          .github/workflows/direct-donation-upgrade-rendered-qa.yml
          docs/direct-verified-donation-upgrade.md
          docs/every-org-pledge-donation-connector.md
          src/app/api/connectors/every-org/[routeId]/route.ts
          src/app/api/connectors/every-org/[secret]/route.ts
          src/lib/direct-donation-upgrade-source-contract.test.ts
          src/lib/direct-donation-upgrade.test.ts
          src/lib/direct-donation-upgrade.ts
          src/lib/every-org-partner-webhook-auth.test.ts
          src/lib/every-org-partner-webhook-auth.ts
          src/lib/every-org-webhook-route-id-source-contract.test.ts
          src/lib/trade-donation.test.ts
          src/lib/trade-donation.ts
          EOF
          LC_ALL=C sort -o "$RUNNER_TEMP/evidence/expected-durable-paths.txt" "$RUNNER_TEMP/evidence/expected-durable-paths.txt"
          LC_ALL=C git diff --cached --name-only --no-renames "$EXPECTED_PARENT" | sort > "$RUNNER_TEMP/evidence/actual-durable-paths.txt"
          diff -u "$RUNNER_TEMP/evidence/expected-durable-paths.txt" "$RUNNER_TEMP/evidence/actual-durable-paths.txt"

          reproduced_tree="$(git write-tree)"
          test "$reproduced_tree" = "$EXPECTED_VALIDATED_TREE"
          echo "reproduced_tree=$reproduced_tree" | tee "$RUNNER_TEMP/evidence/reproduced-tree.txt"
          cp .github/workflows/direct-donation-upgrade-rendered-qa.yml \
            "$RUNNER_TEMP/evidence/direct-donation-upgrade-rendered-qa.final.yml"
          git diff --cached "$EXPECTED_PARENT" > "$RUNNER_TEMP/evidence/final-product.diff"
          git diff --cached --name-status -M "$EXPECTED_PARENT" > "$RUNNER_TEMP/evidence/name-status.txt"
          git diff --cached --stat "$EXPECTED_PARENT" > "$RUNNER_TEMP/evidence/diff-stat.txt"

      - name: Slice out workflow-file mutations for connector finalization
        shell: bash
        run: |
          set -euo pipefail
          git restore --source="$GITHUB_SHA" --staged --worktree -- .github/workflows
          git add -A
          test -z "$(git diff --cached --name-only HEAD | grep '^\.github/workflows/' || true)"
          test -n "$(git diff --cached --name-only HEAD)"
          git diff --cached --check
          git diff --cached --name-status -M HEAD \
            | tee "$RUNNER_TEMP/evidence/pushed-slice-name-status.txt"
          {
            echo '.github/workflows/direct-donation-upgrade-rendered-qa.yml UPDATE'
            echo '.github/workflows/repair-every-org-webhook-route-id-708-20260818.yml DELETE'
            echo '.github/workflows/run-every-org-webhook-route-id-708-v2-20260818.yml DELETE'
            echo '.github/workflows/run-every-org-webhook-route-id-708-v3-20260818.yml DELETE'
            echo '.github/workflows/run-every-org-webhook-route-id-708-v4-20260818.yml DELETE'
            echo '.github/workflows/run-every-org-webhook-route-id-708-v5-20260818.yml DELETE'
            echo '.github/workflows/run-every-org-webhook-route-id-708-v6-20260819.yml DELETE'
            echo '.github/workflows/run-every-org-webhook-route-id-708-v7-20260820.yml DELETE'
            echo '.github/workflows/run-every-org-webhook-route-id-708-v8-20260820.yml DELETE'
          } > "$RUNNER_TEMP/evidence/connector-finalization-manifest.txt"

      - name: Commit and push non-workflow product slice
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name ghuser29384
          git config user.email 262476329+ghuser29384@users.noreply.github.com
          git commit -m 'Materialize Every.org route-ID product slice'
          final_sha="$(git rev-parse HEAD)"
          final_tree="$(git show -s --format=%T HEAD)"
          git push origin "HEAD:$EXPECTED_BRANCH"
          {
            echo "pushed_slice_sha=$final_sha"
            echo "pushed_slice_tree=$final_tree"
          } | tee "$RUNNER_TEMP/evidence/pushed-slice-identity.txt"
          echo "final_sha=$final_sha" >> "$GITHUB_OUTPUT"
          echo "final_tree=$final_tree" >> "$GITHUB_OUTPUT"

      - name: Verify pushed slice
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$EXPECTED_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "${{ steps.commit.outputs.final_sha }}"
          test "$(git show -s --format=%T FETCH_HEAD)" = "${{ steps.commit.outputs.final_tree }}"
          test -z "$(git status --porcelain)"

      - name: Comment exact handoff on PR 760
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          gh pr comment 760 --repo "$GITHUB_REPOSITORY" --body "Successor materialization run [$GITHUB_RUN_ID]($run_url) reproduced the already fully validated target tree \`$EXPECTED_VALIDATED_TREE\` exactly, then pushed only the non-workflow product slice as \`${{ steps.commit.outputs.final_sha }}\`. Workflow-file cleanup and the one durable workflow update remain a bounded connector finalization; no deployment, provider invocation, database mutation, checkout, donation, payment, refund, secret mutation, merge, close, or ready-for-review transition occurred."

      - name: Upload exact handoff evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: every-org-webhook-route-id-materialization-v8-${{ github.run_id }}
          path: ${{ runner.temp }}/evidence
          if-no-files-found: warn
          retention-days: 30

      - name: Comment failure on PR 760
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          gh pr comment 760 --repo "$GITHUB_REPOSITORY" --body "Route-ID materialization successor run [$GITHUB_RUN_ID]($run_url) failed before a complete connector handoff. Inspect the failed step and sanitized artifact; no final-tree claim is made."
