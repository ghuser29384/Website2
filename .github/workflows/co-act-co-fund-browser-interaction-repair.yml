name: Repair Co-Act and Co-Fund Shadow DOM interactions

on:
  push:
    branches:
      - feature/co-act-co-fund-create-v2-20260801
    paths:
      - .github/workflows/co-act-co-fund-browser-interaction-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/co-act-co-fund-create-v2-20260801
          fetch-depth: 0
          persist-credentials: true

      - name: Defer state-dependent Shadow DOM replacement until the event completes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/lib/create-interface/group-contribution-client.ts')
          text = path.read_text()

          old = '''let scanQueued = false;
          let submitGuardInstalled = false;'''
          new = '''let scanQueued = false;
          let submitGuardInstalled = false;
          const pendingRenders = new Set<string>();'''
          if old not in text:
              raise SystemExit('Could not locate render-state declarations')
          text = text.replace(old, new, 1)

          old = '''  mounted.clear();
          activeWindow = targetWindow;'''
          new = '''  mounted.clear();
          pendingRenders.clear();
          activeWindow = targetWindow;'''
          if old not in text:
              raise SystemExit('Could not locate document activation reset')
          text = text.replace(old, new, 1)

          old = '''    button.addEventListener("click", () => {
                const mode = button.dataset.mode as GroupDraftMode;
                entry.state.mode = mode;
                entry.state.primaryText =
                  readPrimaryText(entry.card, entry.underlying) || entry.state.primaryText;
                renderMountedOption(entry);
                writeProposalPayload();
              });'''
          new = '''    button.addEventListener("click", () => {
                const mode = button.dataset.mode as GroupDraftMode;
                entry.state.mode = mode;
                entry.state.primaryText =
                  readPrimaryText(entry.card, entry.underlying) || entry.state.primaryText;
                entry.state = normalizeDraft(entry.state);
                writeProposalPayload();
                scheduleMountedOptionRender(entry);
              });'''
          if old not in text:
              raise SystemExit('Could not locate mode-button listener')
          text = text.replace(old, new, 1)

          old = '''        if (rerender) renderMountedOption(entry);
                else updateValidationStatus(entry);'''
          new = '''        if (rerender) scheduleMountedOptionRender(entry);
                else updateValidationStatus(entry);'''
          if old not in text:
              raise SystemExit('Could not locate control rerender path')
          text = text.replace(old, new, 1)

          anchor = '''function updateStateFromControl(
            state: GroupContributionDraftState,'''
          helper = '''function scheduleMountedOptionRender(entry: MountedOption): void {
            if (pendingRenders.has(entry.key)) return;
            pendingRenders.add(entry.key);
            const targetWindow = createWindow();
            targetWindow.setTimeout(() => {
              pendingRenders.delete(entry.key);
              if (mounted.get(entry.key) !== entry || !entry.host.isConnected) return;
              renderMountedOption(entry);
            }, 0);
          }

          function updateStateFromControl(
            state: GroupContributionDraftState,'''
          if anchor not in text:
              raise SystemExit('Could not locate updateStateFromControl insertion point')
          text = text.replace(anchor, helper, 1)

          path.write_text(text)
          PY
          git diff --check

      - name: Commit product repair and remove one-shot controller
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/co-act-co-fund-browser-interaction-repair.yml
          git add src/lib/create-interface/group-contribution-client.ts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Stabilize Co-Act and Co-Fund Shadow DOM interactions'
          git push origin HEAD:feature/co-act-co-fund-create-v2-20260801

