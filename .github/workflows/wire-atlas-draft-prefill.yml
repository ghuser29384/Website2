name: Wire Bottleneck Atlas draft handoff

on:
  push:
    branches:
      - feature/bottleneck-atlas-feed-20260811
    paths:
      - .github/scripts/wire-atlas-draft-prefill.py
      - .github/workflows/wire-atlas-draft-prefill.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python .github/scripts/wire-atlas-draft-prefill.py
      - run: npm ci
      - name: Focused tests
        run: >-
          node --import tsx --test
          src/lib/bottleneck-atlas.test.ts
          src/lib/opportunity-synthesis.test.ts
          src/bottleneck-atlas-feed-wiring.test.ts
      - name: Focused lint
        run: >-
          npx eslint
          public/moral-trade-live-now.js
          src/lib/bottleneck-atlas.ts
          src/lib/opportunity-synthesis.ts
          src/lib/bottleneck-atlas.test.ts
          src/lib/opportunity-synthesis.test.ts
          src/bottleneck-atlas-feed-wiring.test.ts
          src/app/bottleneck-atlas/page.tsx
          src/app/suggested-opportunities/[templateId]/page.tsx
          src/app/trades/new/page.tsx
          src/app/api/bottleneck-atlas/route.ts
          src/app/api/live-now/route.ts
          src/app/api/live-now/feedback/route.ts
          src/lib/site.ts
      - name: Typecheck
        run: npx tsc --noEmit --pretty false
      - name: Production build
        run: npm run build
      - name: Commit role-specific draft handoff
        run: |
          if git diff --quiet; then
            echo "No draft-handoff changes were produced." >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/scripts/wire-atlas-draft-prefill.py
          rm -f .github/workflows/wire-atlas-draft-prefill.yml
          git add -A
          git commit -m "Prefill private drafts from Bottleneck Atlas candidates"
          git push origin HEAD:${GITHUB_REF_NAME}
