name: Commitments Reciprocal Trade study-planning gates

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/commitments-trade-study-planning-gates.yml"
      - "docs/commitments/impact-identification/study-candidates/trade-bilateral-encouragement-planning-v1/**"
      - "scripts/commitments-trade-study/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/commitments-trade-study-planning-gates.yml"
      - "docs/commitments/impact-identification/study-candidates/trade-bilateral-encouragement-planning-v1/**"
      - "scripts/commitments-trade-study/**"

permissions:
  contents: read

concurrency:
  group: commitments-trade-study-planning-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate frozen planning package and no-launch boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate study candidate, frozen code, and adversarial boundaries
        shell: bash
        run: |
          set -euo pipefail
          node scripts/commitments-trade-study/validate-planning-package.mjs \
            2>&1 | tee trade-study-package-validation.log

      - name: Reproduce deterministic precision report
        shell: bash
        run: |
          set -euo pipefail
          node scripts/commitments-trade-study/precision.mjs --check \
            2>&1 | tee trade-study-precision-check.log

      - name: Enforce exact planning-package file scope
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          base="$(git merge-base HEAD origin/main)"
          git diff --check "$base" "$GITHUB_SHA" | tee trade-study-diff-check.log
          git diff --name-only "$base" "$GITHUB_SHA" | sort > actual-files.txt
          cat > expected-files.txt <<'FILES'
          .github/workflows/commitments-trade-study-planning-gates.yml
          docs/commitments/impact-identification/study-candidates/trade-bilateral-encouragement-planning-v1/README.md
          docs/commitments/impact-identification/study-candidates/trade-bilateral-encouragement-planning-v1/eligible-population-planning-envelope.json
          docs/commitments/impact-identification/study-candidates/trade-bilateral-encouragement-planning-v1/precision-report.json
          docs/commitments/impact-identification/study-candidates/trade-bilateral-encouragement-planning-v1/precision-spec.json
          docs/commitments/impact-identification/study-candidates/trade-bilateral-encouragement-planning-v1/study-instance.json
          scripts/commitments-trade-study/analysis.mjs
          scripts/commitments-trade-study/assignment.mjs
          scripts/commitments-trade-study/precision.mjs
          scripts/commitments-trade-study/precision-core.mjs
          scripts/commitments-trade-study/validate-planning-package.mjs
          FILES
          sort -o expected-files.txt expected-files.txt
          diff -u expected-files.txt actual-files.txt

      - name: Upload exact planning evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: commitments-trade-study-planning-${{ github.run_id }}
          path: |
            trade-study-package-validation.log
            trade-study-precision-check.log
            trade-study-diff-check.log
            expected-files.txt
            actual-files.txt
            docs/commitments/impact-identification/study-candidates/trade-bilateral-encouragement-planning-v1/precision-spec.json
            docs/commitments/impact-identification/study-candidates/trade-bilateral-encouragement-planning-v1/precision-report.json
            docs/commitments/impact-identification/study-candidates/trade-bilateral-encouragement-planning-v1/study-instance.json
            scripts/commitments-trade-study/precision-core.mjs
          if-no-files-found: warn
