name: Export synchronized Co-Act and Co-Fund source

on:
  push:
    branches:
      - feature/co-act-co-fund-create-v2-20260801
    paths:
      - .github/workflows/export-co-act-co-fund-working-tree.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  export-and-clean:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/co-act-co-fund-create-v2-20260801
          fetch-depth: 0
          persist-credentials: true

      - name: Archive tracked source
        shell: bash
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          main_sha="$(git rev-parse origin/main)"
          git archive --format=tar.gz --output=/tmp/co-act-co-fund-working-tree.tar.gz HEAD
          sha256sum /tmp/co-act-co-fund-working-tree.tar.gz > /tmp/co-act-co-fund-working-tree.sha256
          printf '%s\n' "$head_sha" > /tmp/co-act-co-fund-working-tree-head.txt
          printf '%s\n' "$main_sha" > /tmp/co-act-co-fund-working-tree-main.txt

      - uses: actions/upload-artifact@v4
        with:
          name: co-act-co-fund-working-tree-${{ github.run_id }}
          path: |
            /tmp/co-act-co-fund-working-tree.tar.gz
            /tmp/co-act-co-fund-working-tree.sha256
            /tmp/co-act-co-fund-working-tree-head.txt
            /tmp/co-act-co-fund-working-tree-main.txt
          retention-days: 1

      - name: Remove exporter from feature branch
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/export-co-act-co-fund-working-tree.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Remove temporary Co-Act and Co-Fund source exporter'
          git push origin HEAD:feature/co-act-co-fund-create-v2-20260801

      - name: Report artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh pr comment 420 --repo "$GITHUB_REPOSITORY" --body "Synchronized tracked-source export completed. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. Artifact: \`co-act-co-fund-working-tree-${GITHUB_RUN_ID}\`. The exporter removed itself after upload."
