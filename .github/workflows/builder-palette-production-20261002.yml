name: Seven-step builder palette production 2026-10-02

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/builder-palette-production-20261002.yml

permissions:
  actions: write
  contents: read

concurrency:
  group: builder-palette-production-20261002
  cancel-in-progress: false

env:
  CONTROLLER_PATH: .github/workflows/builder-palette-production-20261002.yml
  RELEASE_WORKFLOW: vercel-release.yml
  RELEASE_REF: main
  RELEASE_TARGET: production
  EXPECTED_TRIGGER_PARENT: 416b152ceb354c61abafcf1a616b3932a3db6ff4

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact controller commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Verify exact one-file trigger and approved public assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'ghuser29384/Website2'
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$(git rev-parse HEAD^1)" = "$EXPECTED_TRIGGER_PARENT"
          changed="$(git diff --name-only HEAD^1 HEAD | sed '/^$/d')"
          test "$changed" = "$CONTROLLER_PATH"
          printf '%s\n' \
            'bdbe6570196ece61fee4b91469cb3febfbfeb976a724e62dacd75a74156112b8  public/moral-trade-live-now.js' \
            '17edb4f3586baaf1dbd8329e8cbed4f444312ebbe778761288504da383b82c32  public/moral-trade-create/index.html' \
            'ba7b3c992da61f4024255386eeb9e668b93072799e2b220f9cb87373ccf9b22a  public/moral-trade-create/ui-repairs.css' \
            '98aa32dbb7ec477d10702616841c40583198d22fc8f37769be5f3a8543f9e164  src/lib/create-interface/group-contribution-client.ts' \
            '57a3c910b0cdde59f75c9c1f1422c5eb3d4e114132c652a44aa1694bf542827f  src/components/core-trade/trade-draft-workbench.module.css' \
            'ec40c2a0f50da3f304693c2aa9b58e38c0086b22c52cb2bfc00c0360fa43b014  src/components/core-trade/trade-draft-workbench.tsx' \
            | sha256sum --check --strict
          test "$RELEASE_TARGET" = 'production'
          test "$RELEASE_REF" = 'main'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          remote_sha="$(git ls-remote origin "refs/heads/$RELEASE_REF" | awk '{print $1}')"
          test "$remote_sha" = "$GITHUB_SHA"
          workflow_state="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$RELEASE_WORKFLOW" --jq .state)"
          test "$workflow_state" = 'active'

      - name: Dispatch exact gated production release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            --arg workflow_ref main \
            --arg release_ref "$RELEASE_REF" \
            --arg target "$RELEASE_TARGET" \
            --arg expected_sha "$GITHUB_SHA" \
            '{ref:$workflow_ref,inputs:{ref:$release_ref,target:$target,expected_sha:$expected_sha,synthetic_auth_fixture_url:""}}' \
            | gh api --method POST \
                -H 'Accept: application/vnd.github+json' \
                -H 'X-GitHub-Api-Version: 2022-11-28' \
                "repos/$GITHUB_REPOSITORY/actions/workflows/$RELEASE_WORKFLOW/dispatches" \
                --input - >/dev/null
