name: One-time permanent Vercel verifier readback

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/vercel-permanent-verifier-readback-once.yml

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: vercel-permanent-verifier-readback-once
  cancel-in-progress: false

env:
  CONTROLLER_PATH: .github/workflows/vercel-permanent-verifier-readback-once.yml

jobs:
  verify:
    if: github.repository == 'ghuser29384/Website2' && github.actor == 'ghuser29384'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out exact controller commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          token: ${{ github.token }}

      - name: Guard exact one-time scope
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'ghuser29384/Website2'
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          test -n "$VERCEL_TOKEN"
          changed="$(git diff-tree --no-commit-id --name-only -r HEAD | sed '/^$/d')"
          test "$changed" = "$CONTROLLER_PATH"
          grep -Fq 'if (config.elasticConcurrencyEnabled === true)' scripts/vercel-admin-cost-controls.mjs

      - name: Remove one-time controller from main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          blob_sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/$CONTROLLER_PATH?ref=main" --jq .sha)"
          jq -n --arg message 'Remove one-time permanent Vercel verifier readback controller' --arg sha "$blob_sha" --arg branch main '{message:$message,sha:$sha,branch:$branch}' \
            | gh api --method DELETE "repos/$GITHUB_REPOSITORY/contents/$CONTROLLER_PATH" --input - >/dev/null

      - name: Run permanent account-state verifier
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_COST_CONTROL_MODE: verify
          VERCEL_COST_CONTROL_REPORT: vercel-permanent-verifier-readback.json
          REQUIRE_WEBSITE2_DISCONNECTED: 'true'
          REQUIRE_OBSOLETE_ABSENT: 'true'
          REQUIRE_CANONICAL_LIVE: 'false'
        run: node scripts/vercel-admin-cost-controls.mjs

      - name: Re-run permanent canonical route smoke
        shell: bash
        env:
          VERCEL_COST_CONTROL_MODE: smoke
          VERCEL_COST_CONTROL_REPORT: vercel-permanent-verifier-smoke.json
          VERCEL_PRODUCTION_BASE_URL: https://www.moraltrade.org
          VERCEL_PRODUCTION_SMOKE_ATTEMPTS: '6'
          VERCEL_PRODUCTION_SMOKE_INTERVAL_MS: '5000'
          VERCEL_PRODUCTION_SMOKE_TIMEOUT_MS: '15000'
        run: node scripts/vercel-admin-cost-controls.mjs

      - name: Upload permanent-verifier evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vercel-permanent-verifier-${{ github.run_id }}
          path: |
            vercel-permanent-verifier-readback.json
            vercel-permanent-verifier-smoke.json
          if-no-files-found: warn
          retention-days: 30

      - name: Report permanent-verifier result to PR 422
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [[ "${{ job.status }}" == 'success' ]]; then
            gh pr comment 422 --repo "$GITHUB_REPOSITORY" --body "The merged permanent Vercel verifier now passes against the restored account readback, including Vercel's \`null\` representation for disabled/default elastic concurrency. It also reconfirmed both projects are Git-disconnected, obsolete projects are absent, Standard and serialized queue settings are active, and all canonical production routes pass. Evidence: $run_url"
          else
            gh pr comment 422 --repo "$GITHUB_REPOSITORY" --body "The merged permanent Vercel verifier readback did not complete successfully. Inspect evidence: $run_url"
          fi

      - name: Enforce verified permanent state
        if: always()
        shell: bash
        run: test "${{ job.status }}" = 'success'
