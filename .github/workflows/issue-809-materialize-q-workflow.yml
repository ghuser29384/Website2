name: Issue 809 materialize permanent Q workflow

on:
  push:
    branches:
      - automation/issue-809-q-workflow-20260826
    paths:
      - .github/workflows/issue-809-materialize-q-workflow.yml

permissions:
  contents: write

concurrency:
  group: issue-809-q-workflow-materializer
  cancel-in-progress: false

jobs:
  materialize-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      Q_BRANCH: qa/issue-809-run-owned-evaluator-harness-20260826
      EXPECTED_Q_HEAD: 2de66239ca0daf6d36040027ec4615d2b025cb4e
    steps:
      - name: Check out automation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: automation/issue-809-q-workflow-20260826

      - name: Preserve corrected materializer and fetch exact Q
        shell: bash
        run: |
          set -euo pipefail
          cp .github/workflows/issue-809-materialize-q-workflow-v2.yml \
            /tmp/issue-809-materializer-v2.yml
          git fetch --no-tags origin "$Q_BRANCH:refs/remotes/origin/issue-809-q"
          test "$(git rev-parse refs/remotes/origin/issue-809-q)" = "$EXPECTED_Q_HEAD"
          git switch -c "$Q_BRANCH" refs/remotes/origin/issue-809-q

      - name: Execute the corrected materializer source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          lines = Path('/tmp/issue-809-materializer-v2.yml').read_text().splitlines()
          start = next(
              index for index, line in enumerate(lines)
              if line.strip() == "python3 - <<'PY'"
          ) + 1
          end = next(
              index for index in range(start, len(lines))
              if lines[index].strip() == 'PY'
          )
          script_lines = []
          for line in lines[start:end]:
              script_lines.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/issue-809-materialize-q.py').write_text(
              '\n'.join(script_lines) + '\n'
          )
          PY
          python3 /tmp/issue-809-materialize-q.py

      - name: Validate permanent workflow and source gates
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          nl -ba .github/workflows/evidence-payment-release-qa.yml \
            | sed -n '390,430p'
          ruby -e "require 'yaml'; abort('invalid YAML') unless YAML.parse_file('.github/workflows/evidence-payment-release-qa.yml')"
          node --test \
            scripts/evidence-payment-qa-namespace.test.mjs \
            scripts/evaluator-core-loop-qa-run-ownership.test.mjs
          npx eslint tests/evaluator-core-loop-authenticated.spec.ts
          npx tsc --noEmit --pretty false
          git diff --check
          test "$(git diff --name-only | tr -d '\r')" = '.github/workflows/evidence-payment-release-qa.yml'

      - name: Commit permanent workflow to Q branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/evidence-payment-release-qa.yml
          git commit -m "qa: add permanent issue #809 evaluator integration gate"
          git push origin "HEAD:refs/heads/$Q_BRANCH"
