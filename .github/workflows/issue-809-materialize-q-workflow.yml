name: Issue 809 materialize permanent Q workflow

on:
  push:
    branches:
      - automation/issue-809-q-workflow-20260826
    paths:
      - .github/workflows/issue-809-materialize-q-workflow.yml

permissions:
  contents: write

concurrency:
  group: issue-809-q-workflow-materializer
  cancel-in-progress: false

jobs:
  materialize-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      Q_BRANCH: qa/issue-809-run-owned-evaluator-harness-20260826
      EXPECTED_Q_HEAD: 2de66239ca0daf6d36040027ec4615d2b025cb4e
    steps:
      - name: Check out automation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: automation/issue-809-q-workflow-20260826

      - name: Preserve validated fragment and fetch exact Q
        shell: bash
        run: |
          set -euo pipefail
          cp .github/issue-809-evaluator-job.fragment.yml \
            /tmp/issue-809-evaluator-job.fragment.yml
          git fetch --no-tags origin "$Q_BRANCH:refs/remotes/origin/issue-809-q"
          test "$(git rev-parse refs/remotes/origin/issue-809-q)" = "$EXPECTED_Q_HEAD"
          git switch -c "$Q_BRANCH" refs/remotes/origin/issue-809-q

      - name: Add exact paths and evaluator job
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/evidence-payment-release-qa.yml')
          text = path.read_text()
          if '\n  evaluator-core-loop-gate:\n' in text:
              raise SystemExit('Permanent evaluator job already exists.')
          marker = '      - "tests/evidence-weighted-payment-authenticated.spec.ts"\n'
          if marker not in text:
              raise SystemExit('Exact path marker missing.')
          additions = (
              '      - "scripts/evaluator-core-loop-qa-run-ownership.test.mjs"\n'
              '      - "docs/evaluator-core-loop-audit.md"\n'
              '      - "src/app/actions.ts"\n'
              '      - "src/app/api/live-now/feedback/**"\n'
              '      - "src/components/core-trade/full-navigation-action-form.tsx"\n'
              '      - "src/components/core-trade/trade-agreement-stage-base.tsx"\n'
              '      - "src/components/marketplace/participant-offer-group.tsx"\n'
              '      - "src/lib/evidence-weighted-payment-lifecycle.test.ts"\n'
              '      - "src/lib/marketplace-delta-contract.test.ts"\n'
              '      - "src/lib/trade-evidence-reviewer-rls-contract.test.ts"\n'
              '      - "supabase/migrations/20260814050000_trade_evidence_assigned_reviewer_rls.sql"\n'
              '      - "supabase/migrations/20260815010000_trade_evidence_reviewer_role_aal2.sql"\n'
              '      - "supabase/tests/evaluator_core_loop_*.sql"\n'
              '      - "tests/evaluator-core-loop-authenticated.spec.ts"\n'
          )
          fragment = Path('/tmp/issue-809-evaluator-job.fragment.yml').read_text()
          if not fragment.startswith('  evaluator-core-loop-gate:\n'):
              raise SystemExit('Validated fragment has the wrong root.')
          text = text.replace(marker, marker + additions, 1)
          path.write_text(text.rstrip() + '\n\n' + fragment.rstrip() + '\n')
          PY

      - name: Validate permanent workflow and source gates
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          ruby -e "require 'yaml'; abort('invalid YAML') unless YAML.parse_file('.github/workflows/evidence-payment-release-qa.yml')"
          node --test \
            scripts/evidence-payment-qa-namespace.test.mjs \
            scripts/evaluator-core-loop-qa-run-ownership.test.mjs
          npx eslint tests/evaluator-core-loop-authenticated.spec.ts
          npx tsc --noEmit --pretty false
          git diff --check
          test "$(git diff --name-only | tr -d '\r')" = '.github/workflows/evidence-payment-release-qa.yml'

      - name: Commit permanent workflow to Q branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/evidence-payment-release-qa.yml
          git commit -m "qa: add permanent issue #809 evaluator integration gate"
          git push origin "HEAD:refs/heads/$Q_BRANCH"
