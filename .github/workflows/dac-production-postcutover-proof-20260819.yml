name: Prove completed DAC production database cutover

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/dac-production-postcutover-proof-20260819.yml"

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: moraltrade-dac-production-postcutover-proof
  cancel-in-progress: false

env:
  EXPECTED_MAIN_SHA: 26d1fe436dbf9a4440bfafd501ddf8db944a1127
  EXPECTED_MAIN_TREE: 47fe96dfc881f1c57dea711283fc3db36a44e053
  EXPECTED_PROJECT_REF: jnpoxvalyjtdghnperyu
  EXPECTED_POOLER_HOST: aws-1-us-west-2.pooler.supabase.com
  EXPECTED_POOLER_USER: postgres.jnpoxvalyjtdghnperyu
  BACKUP_RUN_ID: "32147479359"
  BACKUP_RUN_HEAD: 97b7f19f3feb5c9227bfcf7b49c9eaae15164ab0
  BACKUP_ARTIFACT_ID: "9328374066"
  BACKUP_ARTIFACT_DIGEST: sha256:d096c8bad473e9babea3f3fb55747cc78bcf02493ff9378a08e5cbffa7aff54b
  POSTGRES_IMAGE: postgres:17
  EVIDENCE_DIR: dac-production-postcutover-evidence

jobs:
  prove:
    name: Read-only exact registry, schema, privacy, grants, and zero-data proof
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PROD_SUPABASE_DB_URL: ${{ secrets.PROD_SUPABASE_DB_URL }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out exact released source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_MAIN_SHA }}
          fetch-depth: 0

      - name: Guard source identity and create evidence directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          test "$GITHUB_REPOSITORY" = "ghuser29384/Website2"
          test "${{ github.event.pull_request.number }}" = "780"
          test "${{ github.event.pull_request.head.ref }}" = "ops/dac-production-migration-resume-20260818"
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_MAIN_TREE"
          remote_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$remote_main" = "$EXPECTED_MAIN_SHA"
          {
            printf 'main_sha=%s\n' "$EXPECTED_MAIN_SHA"
            printf 'main_tree=%s\n' "$EXPECTED_MAIN_TREE"
            printf 'remote_main=%s\n' "$remote_main"
            printf 'checked_at=%s\n' "$(date -u +%FT%TZ)"
          } | tee "$EVIDENCE_DIR/source-identity.txt"

      - name: Re-prove encrypted backup availability and digest
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$BACKUP_RUN_ID" \
            > "$RUNNER_TEMP/backup-run.json"
          curl -fsS \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$BACKUP_ARTIFACT_ID" \
            > "$RUNNER_TEMP/backup-artifact.json"
          jq -e --arg head "$BACKUP_RUN_HEAD" '
            .status == "completed" and .conclusion == "success" and .head_sha == $head
          ' "$RUNNER_TEMP/backup-run.json" >/dev/null
          jq -e \
            --argjson id "$BACKUP_ARTIFACT_ID" \
            --arg digest "$BACKUP_ARTIFACT_DIGEST" \
            '.id == $id and .expired == false and .digest == $digest' \
            "$RUNNER_TEMP/backup-artifact.json" >/dev/null
          jq -n \
            --arg runId "$BACKUP_RUN_ID" \
            --arg artifactId "$BACKUP_ARTIFACT_ID" \
            --arg digest "$BACKUP_ARTIFACT_DIGEST" \
            --arg verifiedAt "$(date -u +%FT%TZ)" \
            '{runId:$runId,artifactId:$artifactId,digest:$digest,completedSuccessfully:true,expired:false,verifiedAt:$verifiedAt}' \
            > "$EVIDENCE_DIR/backup-proof.json"

      - name: Validate and mask exact TLS-only production database target
        shell: bash
        run: |
          set -euo pipefail
          test -n "${PROD_SUPABASE_DB_URL:-}"
          echo "::add-mask::$PROD_SUPABASE_DB_URL"
          URL_TO_CHECK="$PROD_SUPABASE_DB_URL" node <<'NODE'
          const url = new URL(process.env.URL_TO_CHECK);
          const valid =
            ["postgres:", "postgresql:"].includes(url.protocol) &&
            decodeURIComponent(url.username) === process.env.EXPECTED_POOLER_USER &&
            url.hostname === process.env.EXPECTED_POOLER_HOST &&
            url.port === "5432" &&
            url.pathname === "/postgres" &&
            url.searchParams.get("sslmode") === "require" &&
            Boolean(url.password) &&
            !url.href.includes("hvmxfjjbdcgjjudmthdz");
          if (!valid) throw new Error("Refusing a database URL outside the exact production target.");
          NODE

      - name: Pull PostgreSQL 17 client
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$POSTGRES_IMAGE"
          docker image inspect "$POSTGRES_IMAGE" --format '{{index .RepoDigests 0}}' \
            | tee "$EVIDENCE_DIR/postgres-image.txt"

      - name: Run read-only terminal database acceptance
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/proof.sql" <<'SQL'
          \set ON_ERROR_STOP on
          set statement_timeout = '60s';
          begin transaction read only;
          do $proof$
          declare
            expected jsonb := '[
              {"version":"20260806110000","name":"mpgf_pool_review_freeze","sha":"0913419d665fd69b3a80ea3e5c39a89111721e414b7520f0defc11f6965ecc3c"},
              {"version":"20260818173000","name":"mpgf_dac_public_goods_foundation_reconciliation","sha":"e89a199cbdbb767d88a03585764bce774f533449519b67d04c082683f0638aa0"},
              {"version":"20260806143000","name":"mpgf_pool_publication_materialization","sha":"ee8ab4a2c52893ff9f2d8dfcbf7dc25370768af80e5401978f7c4b09e8cab9e8"},
              {"version":"20260806173000","name":"mpgf_dac_pledge_intent_ledger","sha":"36f558549361a1c0747dab5ecd545c74efbd42be14f6d634cb28e8b01f7c1e9c"},
              {"version":"20260807050000","name":"mpgf_dac_success_lapse","sha":"83d9432f90fb808302249b5b572029d68bfc9aa2be32afbaba710f8e341d0948"},
              {"version":"20260807100000","name":"mpgf_dac_public_terms_api","sha":"356d220c009dd6213b761712a30ce0124d95f075d5fdab5c44da3398a6265a0f"},
              {"version":"20260812073000","name":"mpgf_dac_terminal_event_constraint_reconciliation","sha":"a19653e57a20dff8d01e1dd54b4b77304fe0712fe3356820953945e7b9999cd2"},
              {"version":"20260812074500","name":"mpgf_dac_terminal_schema_reconciliation","sha":"d8dc2a55840425357c8859b87d26fba0415bb1a50c8e739518a88b9686142cbb"},
              {"version":"20260815010000","name":"mpgf_pool_lifecycle_event_ordering","sha":"1d60c1abc73c8842cdcd9694c77d0e29dac4fe1de98a496714c0f2f2f5619766"},
              {"version":"20260815011000","name":"mpgf_dac_terminal_guard_reconciliation","sha":"c64d521c6adb7a865d9ec5e2f25e70adb09f08f91e0f1bc0ec0610977aafd108"},
              {"version":"20260818174000","name":"mpgf_dac_public_aggregate_column_privacy","sha":"0c3e7596f5f6b0d69d9438347f82ad79b6d0663511d3aec7cf333681fef9f581"}
            ]'::jsonb;
            item jsonb;
            actual_name text;
            actual_sha text;
            rel text;
            role_name text;
            col text;
            n bigint;
            safe_campaign text[] := array['id','round_id','slug','title','destination_type','destination_ref','cause_tags','public_summary','threshold_amount_cents','threshold_supporters','deadline_at','verification_method','baseline_rule','exit_rule','review_status','pool_proposal_id','threshold_visibility','progress_visibility','published_terms_version','published_terms_sha256','published_at','created_at'];
            private_campaign text[] := array['pool_alternative_id','challenge_window_ends_at','first_accepted_pledge_at','published_by'];
            safe_outcome text[] := array['id','campaign_id','pool_proposal_id','terms_version','terms_sha256','outcome_status','eligible_amount_cents','eligible_supporter_count','threshold_amount_cents','threshold_supporters','deadline_at','evaluated_at','outcome_sha256','created_at'];
            private_outcome text[] := array['finalized_by','reason','outcome_json'];
          begin
            for item in select value from jsonb_array_elements(expected) loop
              select m.name,
                     encode(extensions.digest(convert_to(m.statements[1], 'UTF8'), 'sha256'),'hex')
                into actual_name, actual_sha
              from supabase_migrations.schema_migrations m
              where m.version=item->>'version';
              if not found or actual_name is distinct from item->>'name' or actual_sha is distinct from item->>'sha' then
                raise exception 'migration mismatch for %', item->>'version';
              end if;
            end loop;
            if (select count(*) from supabase_migrations.schema_migrations m where m.version in (select x->>'version' from jsonb_array_elements(expected) x)) <> 11 then
              raise exception 'expected eleven exact registry rows';
            end if;

            foreach rel in array array['mpgf_pool_proposals','mpgf_pool_reviewers','mpgf_pool_proposal_versions','mpgf_pool_lifecycle_events','mpgf_public_goods_match_pools','mpgf_public_goods_rounds','mpgf_public_goods_campaigns','mpgf_public_goods_pledges','mpgf_dac_pledge_intents','mpgf_dac_pledge_events','mpgf_dac_campaign_outcomes'] loop
              if to_regclass('public.'||rel) is null then raise exception 'missing table %', rel; end if;
              if not exists (select 1 from pg_class c where c.oid=to_regclass('public.'||rel) and c.relrowsecurity) then raise exception 'RLS disabled %', rel; end if;
              execute format('select count(*) from public.%I',rel) into n;
              if n<>0 then raise exception 'unexpected rows in %',rel; end if;
            end loop;

            if to_regprocedure('public.mpgf_begin_pool_proposal_review(uuid,uuid,text)') is null
               or to_regprocedure('public.mpgf_approve_and_freeze_pool_proposal(uuid,uuid,text)') is null
               or to_regprocedure('public.mpgf_publish_pool_proposal(uuid,text,text,uuid,text)') is null
               or to_regprocedure('public.mpgf_create_dac_pledge(text,bigint,text,text,text)') is null
               or to_regprocedure('public.mpgf_review_dac_pledge_eligibility(uuid,uuid,text,integer,text)') is null
               or to_regprocedure('public.mpgf_finalize_dac_campaign(text,uuid,text)') is null
               or to_regprocedure('public.mpgf_public_dac_campaign_terms(text)') is null then
              raise exception 'required function missing';
            end if;
            if exists (select 1 from pg_proc p join pg_namespace ns on ns.oid=p.pronamespace where ns.nspname='public' and p.proname in ('mpgf_begin_pool_proposal_review','mpgf_approve_and_freeze_pool_proposal','mpgf_publish_pool_proposal','mpgf_create_dac_pledge','mpgf_review_dac_pledge_eligibility','mpgf_finalize_dac_campaign') and (not p.prosecdef or not coalesce(p.proconfig,array[]::text[]) @> array['search_path=pg_catalog, public'])) then
              raise exception 'privileged function contract mismatch';
            end if;

            if has_table_privilege('anon','public.mpgf_public_goods_campaigns','SELECT')
               or has_table_privilege('authenticated','public.mpgf_public_goods_campaigns','SELECT')
               or has_table_privilege('anon','public.mpgf_dac_campaign_outcomes','SELECT')
               or has_table_privilege('authenticated','public.mpgf_dac_campaign_outcomes','SELECT') then
              raise exception 'table-level public aggregate SELECT remains';
            end if;
            foreach role_name in array array['anon','authenticated'] loop
              foreach col in array safe_campaign loop if not has_column_privilege(role_name,'public.mpgf_public_goods_campaigns',col,'SELECT') then raise exception 'safe campaign column denied'; end if; end loop;
              foreach col in array private_campaign loop if has_column_privilege(role_name,'public.mpgf_public_goods_campaigns',col,'SELECT') then raise exception 'private campaign column exposed'; end if; end loop;
              foreach col in array safe_outcome loop if not has_column_privilege(role_name,'public.mpgf_dac_campaign_outcomes',col,'SELECT') then raise exception 'safe outcome column denied'; end if; end loop;
              foreach col in array private_outcome loop if has_column_privilege(role_name,'public.mpgf_dac_campaign_outcomes',col,'SELECT') then raise exception 'private outcome column exposed'; end if; end loop;
            end loop;

            if has_table_privilege('anon','public.mpgf_public_goods_pledges','INSERT')
               or has_table_privilege('authenticated','public.mpgf_dac_pledge_intents','INSERT')
               or has_table_privilege('authenticated','public.mpgf_dac_pledge_events','INSERT')
               or has_table_privilege('authenticated','public.mpgf_dac_campaign_outcomes','INSERT') then
              raise exception 'unexpected direct mutation grant';
            end if;
            if not has_function_privilege('anon','public.mpgf_public_dac_campaign_terms(text)','EXECUTE')
               or not has_function_privilege('authenticated','public.mpgf_create_dac_pledge(text,bigint,text,text,text)','EXECUTE') then
              raise exception 'required RPC grant missing';
            end if;
            select count(*) into n from public.mpgf_public_goods_pledges where payment_intent_ref is not null;
            if n<>0 then raise exception 'payment references exist'; end if;
          end;
          $proof$;
          select jsonb_build_object('projectRef','jnpoxvalyjtdghnperyu','releaseMainSha','26d1fe436dbf9a4440bfafd501ddf8db944a1127','releaseMainTree','47fe96dfc881f1c57dea711283fc3db36a44e053','registeredExactMigrations',11,'requiredTables',11,'requiredFunctionsPresent',true,'securityDefinerSearchPathVerified',true,'rlsVerified',true,'columnPrivacyVerified',true,'leastPrivilegeVerified',true,'dacAndPublicGoodsRows',0,'paymentReferences',0,'verifiedAt',clock_timestamp())::text;
          rollback;
          SQL
          docker run --rm -v "$RUNNER_TEMP:/work:ro" "$POSTGRES_IMAGE" \
            psql "$PROD_SUPABASE_DB_URL" --no-psqlrc --set ON_ERROR_STOP=1 --tuples-only --no-align --quiet --file /work/proof.sql \
            | tr -d '\r' | awk 'NF {line=$0} END {print line}' > "$EVIDENCE_DIR/postcutover-state.json"
          jq -e '.registeredExactMigrations==11 and .requiredTables==11 and .requiredFunctionsPresent and .securityDefinerSearchPathVerified and .rlsVerified and .columnPrivacyVerified and .leastPrivilegeVerified and .dacAndPublicGoodsRows==0 and .paymentReferences==0' "$EVIDENCE_DIR/postcutover-state.json" >/dev/null

      - name: Exercise safe reads and private-column denial as public roles
        shell: bash
        run: |
          set -euo pipefail
          for role in anon authenticated; do
            docker run --rm "$POSTGRES_IMAGE" psql "$PROD_SUPABASE_DB_URL" --no-psqlrc --set ON_ERROR_STOP=1 --quiet \
              --command "begin read only; set local role $role; select id,slug,title,threshold_amount_cents,published_terms_version from public.mpgf_public_goods_campaigns limit 0; select id,campaign_id,outcome_status,outcome_sha256 from public.mpgf_dac_campaign_outcomes limit 0; rollback;"
            set +e
            docker run --rm "$POSTGRES_IMAGE" psql "$PROD_SUPABASE_DB_URL" --no-psqlrc --set ON_ERROR_STOP=1 --quiet \
              --command "begin read only; set local role $role; select published_by from public.mpgf_public_goods_campaigns limit 0; rollback;" > "$RUNNER_TEMP/${role}-campaign-private.log" 2>&1
            campaign_status=$?
            docker run --rm "$POSTGRES_IMAGE" psql "$PROD_SUPABASE_DB_URL" --no-psqlrc --set ON_ERROR_STOP=1 --quiet \
              --command "begin read only; set local role $role; select finalized_by from public.mpgf_dac_campaign_outcomes limit 0; rollback;" > "$RUNNER_TEMP/${role}-outcome-private.log" 2>&1
            outcome_status=$?
            set -e
            test "$campaign_status" -ne 0
            test "$outcome_status" -ne 0
          done
          jq -n --arg checkedAt "$(date -u +%FT%TZ)" '{anonSafeReads:true,authenticatedSafeReads:true,anonPrivateColumnsDenied:true,authenticatedPrivateColumnsDenied:true,checkedAt:$checkedAt}' > "$EVIDENCE_DIR/direct-data-plane.json"

      - name: Recheck main and scan retained evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$EXPECTED_MAIN_SHA"
          if grep -RIlE '(postgres(ql)?://|sk_(live|test)_|whsec_|BEGIN [A-Z ]*PRIVATE KEY)' "$EVIDENCE_DIR"; then
            echo 'Credential-like material found in retained evidence.' >&2
            exit 1
          fi

      - name: Upload immutable postcutover evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moraltrade-dac-production-postcutover-${{ github.run_id }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 30

      - name: Record successful postcutover acceptance
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '### DAC production database postcutover acceptance passed'
            echo
            echo "- Exact main: \`$EXPECTED_MAIN_SHA\`"
            echo "- Main tree: \`$EXPECTED_MAIN_TREE\`"
            echo '- Exact migration registry rows: 11/11'
            echo '- Required tables/functions, SECURITY DEFINER search paths, and RLS: verified'
            echo '- Public safe-column reads and private-column denial: verified'
            echo '- DAC/public-goods rows: 0'
            echo '- Payment references: 0'
            echo '- This proof was read-only and changed no application deployment or alias'
          } >> "$GITHUB_STEP_SUMMARY"

# One-use proof only. Never merge; close after retained success evidence.
