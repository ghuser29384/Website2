name: Configure Vercel protection bypass and smoke preview

on:
  push:
    branches:
      - feat/universal-command-workspace

permissions:
  contents: read
  statuses: write

concurrency:
  group: vercel-protection-bypass-smoke
  cancel-in-progress: true

jobs:
  configure-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VERCEL_TEAM_ID: team_ySu6sF3Uho1E1GnJtCQPVEuJ
      WEBSITE2_PROJECT_ID: prj_uhfNhPo00nQrcbG0dk2zLWo7UmdK
      MORALTRADE_PROJECT_ID: prj_Em3j7Uj7RatX2R1ZYhla3XSHRde7
      COMMAND_BRANCH: feat/universal-command-workspace
      STATUS_CONTEXT: Command protected-preview smoke
    steps:
      - name: Publish pending status
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "$(jq -nc \
              --arg state pending \
              --arg context "$STATUS_CONTEXT" \
              --arg description 'Configuring bypass and testing protected previews' \
              --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
              '{state:$state,context:$context,description:$description,target_url:$target_url}')" >/dev/null

      - name: Check out exact feature head
        uses: actions/checkout@v4
        with:
          ref: feat/universal-command-workspace
          fetch-depth: 1

      - name: Select configured Vercel access token
        env:
          TOKEN_PRIMARY: ${{ secrets.VERCEL_TOKEN }}
          TOKEN_ACCESS: ${{ secrets.VERCEL_ACCESS_TOKEN }}
          TOKEN_API: ${{ secrets.VERCEL_API_TOKEN }}
          TOKEN_CLI: ${{ secrets.VERCEL_CLI_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          token="${TOKEN_PRIMARY:-${TOKEN_ACCESS:-${TOKEN_API:-${TOKEN_CLI:-}}}}"
          if [[ -z "$token" ]]; then
            echo "::error title=Vercel token required::No supported Vercel token secret is available."
            exit 1
          fi
          echo "::add-mask::$token"
          echo "VERCEL_AUTH_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Configure project-specific automation bypass secrets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p preview-diagnostics
          website_secret="$(openssl rand -hex 16)"
          moraltrade_secret="$(openssl rand -hex 16)"
          echo "::add-mask::$website_secret"
          echo "::add-mask::$moraltrade_secret"
          echo "WEBSITE2_BYPASS_SECRET=$website_secret" >> "$GITHUB_ENV"
          echo "MORALTRADE_BYPASS_SECRET=$moraltrade_secret" >> "$GITHUB_ENV"

          configure_bypass() {
            local label="$1"
            local project_id="$2"
            local secret="$3"
            local response_file="preview-diagnostics/${label}-bypass-response.json"

            call_api() {
              local payload="$1"
              curl --silent --show-error --retry 4 --retry-all-errors \
                --output "$response_file" --write-out '%{http_code}' \
                --request PATCH \
                "https://api.vercel.com/v1/projects/${project_id}/protection-bypass?teamId=${VERCEL_TEAM_ID}" \
                --header "Authorization: Bearer ${VERCEL_AUTH_TOKEN}" \
                --header 'Content-Type: application/json' \
                --data "$payload"
            }

            status="$(call_api "$(jq -nc --arg secret "$secret" '{generate:{secret:$secret,note:"Universal Command direct preview smoke"}}')")"
            if [[ "$status" != "200" ]]; then
              echo "::error title=Vercel bypass generation failed::Project ${project_id} returned HTTP ${status}."
              jq -r '.error.message // .message // "No API error message returned."' "$response_file" || true
              exit 1
            fi

            status="$(call_api "$(jq -nc --arg secret "$secret" '{update:{secret:$secret,isEnvVar:true,note:"Universal Command direct preview smoke"}}')")"
            if [[ "$status" != "200" ]]; then
              echo "::error title=Vercel bypass binding failed::Project ${project_id} returned HTTP ${status}."
              jq -r '.error.message // .message // "No API error message returned."' "$response_file" || true
              exit 1
            fi

            jq '{protectionBypassCount:(.protectionBypass | length), scopes:[.protectionBypass[]?.scope], envBindings:[.protectionBypass[]?.isEnvVar]}' \
              "$response_file" > "preview-diagnostics/${label}-bypass-summary.json"
            rm -f "$response_file"
          }

          configure_bypass website2 "$WEBSITE2_PROJECT_ID" "$website_secret"
          configure_bypass moraltrade "$MORALTRADE_PROJECT_ID" "$moraltrade_secret"

      - name: Resolve READY previews for exact feature head
        shell: bash
        run: |
          set -euo pipefail
          expected_sha="$(git rev-parse HEAD)"
          if [[ "$expected_sha" != "$GITHUB_SHA" ]]; then
            echo "::error title=Feature head moved::Checked out ${expected_sha}, event identifies ${GITHUB_SHA}."
            exit 1
          fi
          echo "EXPECTED_FEATURE_SHA=$expected_sha" >> "$GITHUB_ENV"

          wait_for_preview() {
            local project_id="$1"
            local output_name="$2"
            local response_file="$(mktemp)"
            for attempt in $(seq 1 90); do
              curl --silent --show-error --retry 3 --retry-all-errors \
                --output "$response_file" \
                "https://api.vercel.com/v7/deployments?projectId=${project_id}&teamId=${VERCEL_TEAM_ID}&branch=${COMMAND_BRANCH}&sha=${expected_sha}&state=READY&limit=1" \
                --header "Authorization: Bearer ${VERCEL_AUTH_TOKEN}"
              deployment_url="$(jq -r '.deployments[0].url // .data.deployments[0].url // .data[0].url // empty' "$response_file")"
              if [[ -n "$deployment_url" && "$deployment_url" != "null" ]]; then
                echo "${output_name}=https://${deployment_url}" >> "$GITHUB_ENV"
                rm -f "$response_file"
                return 0
              fi
              sleep 10
            done
            echo "::error title=Preview did not become READY::No exact READY deployment for ${project_id} at ${expected_sha}."
            exit 1
          }

          wait_for_preview "$WEBSITE2_PROJECT_ID" WEBSITE2_PREVIEW_URL
          wait_for_preview "$MORALTRADE_PROJECT_ID" MORALTRADE_PREVIEW_URL

      - name: Probe bypassed health endpoints
        id: probes
        shell: bash
        run: |
          set -u
          probe() {
            local label="$1"
            local base_url="$2"
            local secret="$3"
            local code
            code="$(curl --silent --show-error --location-trusted --max-redirs 0 \
              --dump-header "preview-diagnostics/${label}-health-headers.txt" \
              --output "preview-diagnostics/${label}-health-body.txt" \
              --write-out '%{http_code}' \
              --header "x-vercel-protection-bypass: ${secret}" \
              --header 'x-vercel-set-bypass-cookie: true' \
              "${base_url}/api/command/health" || true)"
            echo "${label}_code=${code:-000}" >> "$GITHUB_OUTPUT"
          }
          probe website2 "$WEBSITE2_PREVIEW_URL" "$WEBSITE2_BYPASS_SECRET"
          probe moraltrade "$MORALTRADE_PREVIEW_URL" "$MORALTRADE_BYPASS_SECRET"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Create direct preview smoke suite
        shell: bash
        run: |
          mkdir -p .preview-smoke
          cat > .preview-smoke/playwright.config.ts <<'TS'
          import { defineConfig } from '@playwright/test';
          const secret = process.env.VERCEL_AUTOMATION_BYPASS_SECRET;
          const baseURL = process.env.SMOKE_BASE_URL;
          if (!secret || !baseURL) throw new Error('Smoke URL and bypass secret are required.');
          export default defineConfig({
            testDir: '.',
            testMatch: /preview\.spec\.ts/,
            timeout: 45_000,
            expect: { timeout: 8_000 },
            workers: 1,
            reporter: 'line',
            use: {
              baseURL,
              extraHTTPHeaders: {
                'x-vercel-protection-bypass': secret,
                'x-vercel-set-bypass-cookie': 'true',
              },
              trace: 'off',
              screenshot: 'only-on-failure',
            },
          });
          TS

          cat > .preview-smoke/preview.spec.ts <<'TS'
          import { expect, test } from '@playwright/test';
          const command = '$5 donation to animal welfare if you eat 1 vegetarian meal';
          const pendingKey = 'moral-trade.command.pending.v1';

          test('health and signed-out API boundary', async ({ request }) => {
            const health = await request.get('/api/command/health');
            expect(health.status()).toBe(200);
            expect(await health.json()).toMatchObject({
              ok: true,
              persistenceConfigured: true,
              directModelStateChanges: false,
              confirmationPolicy: 'typed-capability-registry',
            });
            const sessions = await request.get('/api/command/sessions');
            expect(sessions.status()).toBe(401);
            expect(await sessions.json()).toMatchObject({ ok: false, error: 'Authentication required.' });
          });

          test('Command sign-in gate has no server errors', async ({ page, baseURL }) => {
            if (baseURL) await page.context().addCookies([{ name: 'mt_walkthrough_seen', value: '1', url: baseURL }]);
            const serverErrors: string[] = [];
            page.on('response', response => {
              if (response.status() >= 500) serverErrors.push(`${response.status()} ${response.url()}`);
            });
            await page.goto('/command', { waitUntil: 'domcontentloaded' });
            await expect(page.getByRole('heading', { name: 'Sign in to use Command.' })).toBeVisible();
            await expect(page.getByText(/cannot bypass consent, review, payment, or safety controls/i)).toBeVisible();
            expect(serverErrors).toEqual([]);
          });

          test('drawer request survives navigation', async ({ page, baseURL }) => {
            if (baseURL) await page.context().addCookies([{ name: 'mt_walkthrough_seen', value: '1', url: baseURL }]);
            await page.goto('/moral-trade-live.html', { waitUntil: 'domcontentloaded' });
            await page.getByRole('button', { name: /Command$/ }).click();
            const input = page.getByLabel('Ask Moral Trade Command');
            await expect(input).toBeVisible();
            await input.fill(command);
            await page.getByRole('button', { name: 'Send request to the Command workspace' }).click();
            await expect(page).toHaveURL(/\/command\?source=drawer$/);
            await expect(page.getByRole('heading', { name: 'Sign in to use Command.' })).toBeVisible();
            await expect(page.getByText('Draft created with editable exact terms.')).toHaveCount(0);
            expect(await page.evaluate(key => sessionStorage.getItem(key), pendingKey)).toBe(command);
          });

          test('trade and public-good sign-in returns preserve terms', async ({ page }) => {
            const tradeReturnTo = '/trades/new?handoff=command-center';
            await page.goto(tradeReturnTo, { waitUntil: 'domcontentloaded' });
            await expect(page.getByRole('heading', { name: 'Sign in to build a trade.' })).toBeVisible();
            await expect(page.getByRole('link', { name: 'Create account' })).toHaveAttribute(
              'href', `/signup?returnTo=${encodeURIComponent(tradeReturnTo)}`,
            );
            const params = new URLSearchParams({
              template: 'threshold-coalition', title: 'Animal welfare pool', cause: 'Animal welfare',
              participants: '100', contribution: '20', threshold: '80', source: 'command',
            });
            const poolReturnTo = `/mpgf/pools/new?${params.toString()}`;
            await page.goto(poolReturnTo, { waitUntil: 'domcontentloaded' });
            await expect(page.getByRole('heading', { name: 'Sign in to build a trade.' })).toBeVisible();
            await expect(page.getByRole('link', { name: 'Create account' })).toHaveAttribute(
              'href', `/signup?returnTo=${encodeURIComponent(poolReturnTo)}`,
            );
            await expect(page.getByRole('link', { name: 'Sign in' })).toHaveAttribute(
              'href', `/login?returnTo=${encodeURIComponent(poolReturnTo)}`,
            );
          });
          TS

      - name: Smoke website2 protected preview
        id: smoke_website2
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          SMOKE_BASE_URL="$WEBSITE2_PREVIEW_URL" VERCEL_AUTOMATION_BYPASS_SECRET="$WEBSITE2_BYPASS_SECRET" \
            npx playwright test .preview-smoke/preview.spec.ts --config .preview-smoke/playwright.config.ts \
            2>&1 | tee preview-diagnostics/website2-playwright.log

      - name: Smoke moraltrade-site protected preview
        id: smoke_moraltrade
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          SMOKE_BASE_URL="$MORALTRADE_PREVIEW_URL" VERCEL_AUTOMATION_BYPASS_SECRET="$MORALTRADE_BYPASS_SECRET" \
            npx playwright test .preview-smoke/preview.spec.ts --config .preview-smoke/playwright.config.ts \
            2>&1 | tee preview-diagnostics/moraltrade-playwright.log

      - name: Record public-safe evidence
        if: always()
        env:
          WEBSITE_PROBE: ${{ steps.probes.outputs.website2_code }}
          MORALTRADE_PROBE: ${{ steps.probes.outputs.moraltrade_code }}
          WEBSITE_SMOKE: ${{ steps.smoke_website2.outcome }}
          MORALTRADE_SMOKE: ${{ steps.smoke_moraltrade.outcome }}
        shell: bash
        run: |
          jq -nc \
            --arg featureSha "${EXPECTED_FEATURE_SHA:-$GITHUB_SHA}" \
            --arg website2Preview "${WEBSITE2_PREVIEW_URL:-}" \
            --arg moraltradePreview "${MORALTRADE_PREVIEW_URL:-}" \
            --arg website2Probe "$WEBSITE_PROBE" \
            --arg moraltradeProbe "$MORALTRADE_PROBE" \
            --arg website2Smoke "$WEBSITE_SMOKE" \
            --arg moraltradeSmoke "$MORALTRADE_SMOKE" \
            '{featureSha:$featureSha,website2Preview:$website2Preview,moraltradePreview:$moraltradePreview,protectionBypassConfigured:true,website2Probe:$website2Probe,moraltradeProbe:$moraltradeProbe,website2Smoke:$website2Smoke,moraltradeSmoke:$moraltradeSmoke}' \
            > preview-diagnostics/summary.json

      - name: Upload public-safe diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vercel-protected-preview-smoke-evidence
          path: preview-diagnostics
          if-no-files-found: error
          retention-days: 14

      - name: Enforce direct preview smoke result
        env:
          WEBSITE_PROBE: ${{ steps.probes.outputs.website2_code }}
          MORALTRADE_PROBE: ${{ steps.probes.outputs.moraltrade_code }}
          WEBSITE_SMOKE: ${{ steps.smoke_website2.outcome }}
          MORALTRADE_SMOKE: ${{ steps.smoke_moraltrade.outcome }}
        shell: bash
        run: |
          test "$WEBSITE_PROBE" = 200
          test "$MORALTRADE_PROBE" = 200
          test "$WEBSITE_SMOKE" = success
          test "$MORALTRADE_SMOKE" = success

      - name: Publish final status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          if [[ "$JOB_STATUS" == "success" ]]; then
            state=success
            description='Protected previews passed direct smoke verification'
          else
            state=failure
            description='Protected-preview configuration or smoke verification failed'
          fi
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "$(jq -nc \
              --arg state "$state" \
              --arg context "$STATUS_CONTEXT" \
              --arg description "$description" \
              --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
              '{state:$state,context:$context,description:$description,target_url:$target_url}')" >/dev/null
