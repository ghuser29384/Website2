name: Retry production Stripe guard

on:
  push:
    branches:
      - fix/block-stripe-test-mode-in-production-20260716
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/block-stripe-test-mode-in-production-20260716
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply production payment guard
        run: python scripts/apply-production-stripe-guard.py

      - name: Install dependencies
        run: npm ci

      - name: Run focused payment tests
        run: >-
          node --import tsx --test
          src/lib/payments/conditional-state.test.ts
          src/lib/payments/checkout-payment-methods.test.ts

      - name: Lint changed integration
        run: >-
          npx eslint
          src/lib/payments/conditional-state.ts
          src/lib/payments/conditional-state.test.ts
          src/app/donation-offsets/payments/page.tsx

      - name: Build production application
        env:
          CONDITIONAL_PAYMENTS_MODE: disabled
        run: npm run build

      - name: Commit verified guard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Block Stripe test mode on the production site"
          git push origin HEAD:fix/block-stripe-test-mode-in-production-20260716
