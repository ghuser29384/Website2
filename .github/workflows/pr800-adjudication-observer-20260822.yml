name: PR800 adjudication observer

on:
  push:
    branches:
      - ops/pr800-adjudication-observer-20260822
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: pr800-adjudication-observer
  cancel-in-progress: true

jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_WORKFLOW: pr800-refund-foundation-adjudication-20260822.yml
      TARGET_BRANCH: ops/pr800-refund-foundation-adjudication-20260822
      TARGET_CONTROLLER_SHA: 46cd7ee1fff9f8543044842c84e05da1f2d7b43e
    steps:
      - name: Observe exact adjudication run to completion
        shell: bash
        run: |
          set -euo pipefail
          latest=''
          for attempt in $(seq 1 150); do
            response="$(gh api --method GET \
              "repos/$GITHUB_REPOSITORY/actions/workflows/$TARGET_WORKFLOW/runs" \
              -f branch="$TARGET_BRANCH" \
              -f per_page=30)"
            latest="$(jq -c \
              --arg sha "$TARGET_CONTROLLER_SHA" \
              '[.workflow_runs[] | select(.head_sha == $sha)] | sort_by(.created_at) | reverse | .[0] // empty' \
              <<<"$response")"
            if [[ -n "$latest" ]]; then
              status="$(jq -r '.status' <<<"$latest")"
              if [[ "$status" = completed ]]; then
                break
              fi
            fi
            sleep 30
          done

          if [[ -z "$latest" ]]; then
            body='<!-- pr800-adjudication-observer -->
          ## PR #800 adjudication observer

          No adjudication workflow run was found for the exact isolated controller head.'
            gh issue comment 709 --repo "$GITHUB_REPOSITORY" --body "$body"
            exit 1
          fi

          run_id="$(jq -r '.id' <<<"$latest")"
          status="$(jq -r '.status' <<<"$latest")"
          conclusion="$(jq -r '.conclusion // "none"' <<<"$latest")"
          head_sha="$(jq -r '.head_sha' <<<"$latest")"
          html_url="$(jq -r '.html_url' <<<"$latest")"
          body="<!-- pr800-adjudication-observer -->
          ## PR #800 adjudication observer

          - adjudication run: \`$run_id\`
          - status: \`$status\`
          - conclusion: \`$conclusion\`
          - controller head: \`$head_sha\`
          - run: $html_url"
          gh issue comment 709 --repo "$GITHUB_REPOSITORY" --body "$body"
          test "$status" = completed
          test "$conclusion" = success
