name: Repair Compact outflow scope guard v5

on:
  push:
    branches:
      - feature/compact-authoritative-outflow-ledger-v1-20260816
    paths:
      - .github/workflows/repair-compact-outflow-scope-guard-v5.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Restrict active-effect and credential scans
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/compact-authoritative-outflow-ledger-qa.yml')
          source = path.read_text(encoding='utf-8')

          old_active = '''          if grep -R -E "automaticCollectionEnabled[[:space:]]*[:=][[:space:]]*true|moneyMoved[[:space:]]*[:=][[:space:]]*true|activation_execution_enabled[[:space:]]*=[[:space:]]*true" $(cat /tmp/actual-files.txt); then
            echo "An active collection or activation effect was introduced."
            exit 1
          fi
'''
          new_active = '''          if grep -E "automaticCollectionEnabled[[:space:]]*[:=][[:space:]]*true|moneyMoved[[:space:]]*[:=][[:space:]]*true|activation_execution_enabled[[:space:]]*=[[:space:]]*true" \\
            docs/mpgf/compact-authoritative-outflow-ledger-v1.md \\
            src/components/mpgf/mpgf-public-goods-compacts.tsx \\
            src/lib/mpgf/compact-authoritative-outflow.ts \\
            supabase/migrations/2026081614150*_compact_authoritative_outflow_*.sql; then
            echo "An active collection or activation effect was introduced."
            exit 1
          fi
'''
          old_credentials = '''          if grep -R -E "createServiceClient|SUPABASE_SERVICE_ROLE_KEY|STRIPE_SECRET_KEY|EVERY_ORG" \\
            src/components/mpgf/mpgf-public-goods-compacts.tsx \\
            src/lib/mpgf/compact-authoritative-outflow*.ts; then
            echo "Application/runtime credential or service-role use is forbidden."
            exit 1
          fi
'''
          new_credentials = '''          if grep -E "createServiceClient|SUPABASE_SERVICE_ROLE_KEY|STRIPE_SECRET_KEY|EVERY_ORG" \\
            src/components/mpgf/mpgf-public-goods-compacts.tsx \\
            src/lib/mpgf/compact-authoritative-outflow.ts; then
            echo "Application/runtime credential or service-role use is forbidden."
            exit 1
          fi
'''
          old_controller = '          test ! -e .github/workflows/repair-compact-outflow-qa.yml\n'
          new_controller = '''          for controller in \\
            .github/workflows/repair-compact-outflow-qa.yml \\
            .github/workflows/repair-compact-outflow-validation-v2.yml \\
            .github/workflows/repair-compact-outflow-scope-guard-v3.yml \\
            .github/workflows/repair-compact-outflow-scope-guard-v4.yml \\
            .github/workflows/repair-compact-outflow-scope-guard-v5.yml; do
            test ! -e "$controller"
          done
'''

          for old, new, label in [
              (old_active, new_active, 'active-effect block'),
              (old_credentials, new_credentials, 'credential block'),
              (old_controller, new_controller, 'controller assertion'),
          ]:
              if source.count(old) != 1:
                  raise SystemExit(f'Expected one {label}; found {source.count(old)}.')
              source = source.replace(old, new)

          path.write_text(source, encoding='utf-8')
          PY
          git diff --check
          grep -q 'src/lib/mpgf/compact-authoritative-outflow.ts' .github/workflows/compact-authoritative-outflow-ledger-qa.yml
          grep -q 'repair-compact-outflow-scope-guard-v5.yml' .github/workflows/compact-authoritative-outflow-ledger-qa.yml

      - name: Commit durable repair and remove controller
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/compact-authoritative-outflow-ledger-qa.yml
          git rm .github/workflows/repair-compact-outflow-scope-guard-v5.yml
          git commit -m "ci: scope Compact outflow guards to runtime files"
          git push origin "HEAD:${GITHUB_REF_NAME}"
