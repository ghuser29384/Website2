name: Publish reviewed audit integration
on:
  push:
    branches: [ops/audit-source-20260926]
    paths: [.github/workflows/audit-publish-integrated-20260927.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 49f36f1cb0ac4c60cb22e3a6134797215870e678
          persist-credentials: false
          fetch-depth: 0
          show-progress: false
      - name: Reproduce the reviewed tree and retain the existing CI selector
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = ghuser29384/Website2
          test "$(git rev-parse HEAD)" = 49f36f1cb0ac4c60cb22e3a6134797215870e678
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = 2241422b6eec8c38a1fad4b3e3a9c9fb7c2bba49
          git config user.name ghuser29384
          git config user.email 262476329+ghuser29384@users.noreply.github.com
          git merge --no-commit --no-ff 2241422b6eec8c38a1fad4b3e3a9c9fb7c2bba49
          test "$(git write-tree)" = 345a7622d1a2c5df64e19b4b22ec89e6ff726bf3
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          path=Path('tests/sitewide-canonical-visual-system.spec.ts')
          text=path.read_text()
          old='Commitments uses one navigation system and preserves tab interaction'
          new='Commitments uses the approved single-navigation layout and preserves tab interaction'
          assert text.count(old)==1
          path.write_text(text.replace(old,new))
          assert hashlib.sha256(path.read_bytes()).hexdigest()=='eb9a8d7f92b85049085432e7983cae14f36915bded3213c1f9a780bddef0a807'
          PY
          git add tests/sitewide-canonical-visual-system.spec.ts
          git diff --cached --check
          git commit -m 'Integrate released Priorities and planner changes; preserve the Commitments CI selector'
          test "$(git rev-parse HEAD^1)" = 49f36f1cb0ac4c60cb22e3a6134797215870e678
          test "$(git rev-parse HEAD^2)" = 2241422b6eec8c38a1fad4b3e3a9c9fb7c2bba49
      - name: Publish to a staging branch only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branch=work/audit-integrated-20260927
          test -z "$(git ls-remote origin "refs/heads/$branch")"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin "HEAD:refs/heads/$branch"
          mkdir -p /tmp/evidence
          git rev-parse HEAD > /tmp/evidence/commit.txt
          git rev-parse 'HEAD^{tree}' > /tmp/evidence/tree.txt
          git diff --stat HEAD^2 HEAD > /tmp/evidence/scope.txt
          printf 'Staged `%s` only; no main merge, deployment or alias change.\n' "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: audit-integration-published-${{ github.run_id }}
          path: /tmp/evidence
          retention-days: 7
