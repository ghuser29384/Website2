name: Temporary repair PR 558 browser assertions

on:
  push:
    branches:
      - temp/fix-pr558-browser-assertions-20260808

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_HEAD_SHA: f3e1dd119e3f76c5e37a904b5228f7981f584ab7
      TARGET_BRANCH: fix/mpgf-dac-product-lifecycle-20260807

    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Replace only the two brittle exact-leaf assertions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          python3 - <<'PY'
          from pathlib import Path

          path = Path("tests/mpgf-dac-product-lifecycle.spec.ts")
          source = path.read_text()
          old = (
              '  await expect(page.getByText("10%", { exact: true }).first()).toBeVisible();\n'
              '  await expect(page.getByText("$102.01", { exact: true }).first()).toBeVisible();\n'
          )
          new = (
              '  await expect(page.getByText(/The approved failure-bonus rate is 10%/)).toBeVisible();\n'
              '  await expect(page.getByText(/The gross success requirement is \\$102\\.01\\./)).toBeVisible();\n'
          )
          if source.count(old) != 1:
              raise SystemExit("Expected exactly one pair of brittle exact-leaf DAC assertions.")
          repaired = source.replace(old, new)
          if 'getByText("10%", { exact: true })' in repaired:
              raise SystemExit("Brittle exact percentage assertion remains.")
          if 'getByText("$102.01", { exact: true })' in repaired:
              raise SystemExit("Brittle exact gross-requirement assertion remains.")
          path.write_text(repaired)
          PY
          git diff --check
          git diff -- tests/mpgf-dac-product-lifecycle.spec.ts

      - name: Commit the scoped assertion repair to PR branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/mpgf-dac-product-lifecycle.spec.ts
          git commit -m "test(mpgf): assert rendered DAC terms semantically"
          git push origin "HEAD:${TARGET_BRANCH}"
