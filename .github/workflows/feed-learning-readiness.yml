name: Feed learned-ranking readiness

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/feed-learning-readiness.yml
      - docs/feed/learned-ranking-readiness.md
      - public/moral-trade-live-learning-diagnostics.js
      - src/app/api/jobs/recommendation-training/**
      - src/app/api/live-now-a1/**
      - src/app/recommendation-outcome-actions.ts
      - src/feed-learned-ranking-release-gate.test.ts
      - src/lib/feed/learned-ranking-readiness.test.ts
      - src/lib/feed/learned-ranking-readiness.ts
      - src/lib/pareto-feed-runtime.ts
      - src/lib/pareto-recommendation-model.test.ts
      - src/lib/pareto-recommendation-model.ts
      - src/lib/recommendation-training*.ts
      - src/pareto-recommendation-wiring.test.ts
  push:
    branches:
      - main
      - feat/feed-learned-ranking-readiness-20260817
    paths:
      - .github/workflows/feed-learning-readiness.yml
      - docs/feed/learned-ranking-readiness.md
      - public/moral-trade-live-learning-diagnostics.js
      - src/app/api/jobs/recommendation-training/**
      - src/app/api/live-now-a1/**
      - src/app/recommendation-outcome-actions.ts
      - src/feed-learned-ranking-release-gate.test.ts
      - src/lib/feed/learned-ranking-readiness.test.ts
      - src/lib/feed/learned-ranking-readiness.ts
      - src/lib/pareto-feed-runtime.ts
      - src/lib/pareto-recommendation-model.test.ts
      - src/lib/pareto-recommendation-model.ts
      - src/lib/recommendation-training*.ts
      - src/pareto-recommendation-wiring.test.ts
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: feed-learning-readiness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  exact-head-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - name: Check out exact head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.EXPECTED_HEAD_SHA }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Guard exact head and bounded candidate scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          git diff --check

          if [ "${{ github.event_name }}" = "pull_request" ] && [ "$HEAD_BRANCH" = "feat/feed-learned-ranking-readiness-20260817" ]; then
            cat > /tmp/expected-files.txt <<'EOF'
          .github/workflows/feed-learning-readiness.yml
          docs/feed/learned-ranking-readiness.md
          src/feed-learned-ranking-release-gate.test.ts
          src/lib/feed/learned-ranking-readiness.test.ts
          src/lib/feed/learned-ranking-readiness.ts
          EOF
            sed -i 's/^          //' /tmp/expected-files.txt
            sort -o /tmp/expected-files.txt /tmp/expected-files.txt
            git diff --name-only "$BASE_SHA"...HEAD | sort > /tmp/actual-files.txt
            diff -u /tmp/expected-files.txt /tmp/actual-files.txt
            test "$(wc -l < /tmp/actual-files.txt)" -eq 5
            git diff --check "$BASE_SHA"...HEAD
          fi

      - name: Install dependencies
        run: npm ci

      - name: Focused readiness and release guards
        shell: bash
        run: |
          set -o pipefail
          node --import tsx --test \
            src/lib/feed/learned-ranking-readiness.test.ts \
            src/feed-learned-ranking-release-gate.test.ts \
            2>&1 | tee focused.log

      - name: Complete repository tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee repository-tests.log

      - name: Repository-wide ESLint
        shell: bash
        run: |
          set -o pipefail
          npm run lint -- --quiet 2>&1 | tee eslint.log

      - name: Strict TypeScript
        shell: bash
        run: |
          set -o pipefail
          npx tsc --noEmit --pretty false 2>&1 | tee typescript.log

      - name: Production build
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log

      - name: Preserve exact-head evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p feed-learning-readiness-evidence
          git rev-parse HEAD > feed-learning-readiness-evidence/head-sha.txt
          git rev-parse HEAD^{tree} > feed-learning-readiness-evidence/tree-sha.txt
          git status --short --untracked-files=no > feed-learning-readiness-evidence/tracked-status.txt
          sha256sum \
            .github/workflows/feed-learning-readiness.yml \
            docs/feed/learned-ranking-readiness.md \
            src/feed-learned-ranking-release-gate.test.ts \
            src/lib/feed/learned-ranking-readiness.test.ts \
            src/lib/feed/learned-ranking-readiness.ts \
            > feed-learning-readiness-evidence/file-sha256.txt
          for log in focused.log repository-tests.log eslint.log typescript.log build.log; do
            if [ -f "$log" ]; then cp "$log" feed-learning-readiness-evidence/; fi
          done

      - name: Upload exact-head evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feed-learning-readiness-${{ github.run_id }}-${{ env.EXPECTED_HEAD_SHA }}
          retention-days: 30
          if-no-files-found: error
          path: feed-learning-readiness-evidence
