name: Patch calibration export event weight v2

on:
  push:
    branches:
      - feature/evidence-credibility-calibration-export-v1-20260812
    paths:
      - .github/workflows/patch-calibration-export-event-weight-v2.yml

permissions:
  contents: write

concurrency:
  group: patch-calibration-export-event-weight-v2-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Make nonnumerical observations weightless
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "supabase/migrations/20260812043000_evidence_credibility_calibration_export_v1.sql"
          )
          source = path.read_text(encoding="utf-8")

          old_count = "select count(*)::integer\n          from public.credibility_shadow_events prior_event"
          new_count = "select greatest(1, count(*)::integer)\n          from public.credibility_shadow_events prior_event"
          if source.count(old_count) != 1:
              raise SystemExit("Expected one counterparty-sequence count.")
          source = source.replace(old_count, new_count)

          start_marker = "        'provisionalEventWeightAtDecision', round("
          end_marker = "        'decisionDateUtc',"
          start = source.index(start_marker)
          end = source.index(end_marker, start)
          replacement = "\n".join([
              "        'provisionalEventWeightAtDecision', case",
              "          when tokenized.original_status = 'eligible' then round(",
              "            tokenized.recency_weight_at_decision",
              "            * tokenized.provenance_weight",
              "            * tokenized.decision_confidence_weight",
              "            * (1::numeric / sqrt(tokenized.counterparty_sequence_at_decision::numeric))",
              "            * tokenized.context_similarity",
              "            * tokenized.stake_weight,",
              "            8",
              "          )",
              "          else null",
              "        end,",
              "",
          ])
          source = source[:start] + replacement + source[end:]
          path.write_text(source, encoding="utf-8")
          PY
          git diff --check
          grep -q "when tokenized.original_status = 'eligible' then round" \
            supabase/migrations/20260812043000_evidence_credibility_calibration_export_v1.sql

      - name: Commit durable repair and remove controllers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/20260812043000_evidence_credibility_calibration_export_v1.sql
          for controller in \
            .github/workflows/patch-calibration-export-event-weight.yml \
            .github/workflows/patch-calibration-export-event-weight-v2.yml; do
            test ! -e "$controller" || git rm "$controller"
          done
          git commit -m "fix: exclude nonnumerical observations from export weights"
          git push origin "HEAD:${GITHUB_REF_NAME}"
