name: PR 726 Compact v2 current-main integration protected Preview UAT 20260816

on:
  push:
    branches:
      - ops/pr726-compact-v2-integration-qa-preview-20260816
    paths:
      - ".github/workflows/pr726-compact-v2-integration-qa-preview-20260816.yml"
      - "ops/pr663-uat712/**"

concurrency:
  group: pr726-compact-v2-integration-qa-preview-20260816
  cancel-in-progress: false

permissions:
  contents: read

env:
  CANDIDATE_BASE_SHA: 26d5a2f15fe49392d9af4b17c372dc630d690b12
  CANDIDATE_HEAD_SHA: f46178aaad6d2fbd911cc365e2963bb7c73a0098
  CANDIDATE_TREE_SHA: 80772fa5e02c357eb59fc83286f3a668447de25d
  CANDIDATE_FIRST_PARENT: 206dca2ab96f61a6870da2bfd09987687a7b56e9
  CANDIDATE_SECOND_PARENT: 26d5a2f15fe49392d9af4b17c372dc630d690b12
  CANDIDATE_AHEAD_COUNT: "83"
  CANDIDATE_CHANGED_FILES: "43"
  COMPACT_SOURCE_SHA: 7dd480bebfe44fd967b353794c14e45d2f2db922
  COMPACT_SOURCE_TREE: b4248c749c702c808260c774920aaa80055f1cc0
  CANONICAL_VISUAL_RUN_ID: "31924922561"
  COMPACT_QA_RUN_ID: "31924922538"
  CREATE_ADAPTER_RUN_ID: "31924922549"
  EVIDENCE_PAYMENT_RUN_ID: "31924922560"
  SMART_QUERY_RUN_ID: "31924922550"
  DASHBOARD_SCOPE_RUN_ID: "31924922553"
  CONTROLLER_BRANCH: ops/pr726-compact-v2-integration-qa-preview-20260816
  EXPECTED_QA_POOLER_HOST: aws-0-us-west-1.pooler.supabase.com
  EXPECTED_QA_REF: hvmxfjjbdcgjjudmthdz
  FORBIDDEN_PROD_REF: jnpoxvalyjtdghnperyu
  VERCEL_CLI_VERSION: 50.38.1
  VERCEL_LOG_CLI_VERSION: 58.9.5
  VERCEL_ORG_ID: team_ySu6sF3Uho1E1GnJtCQPVEuJ
  VERCEL_PROJECT_ID: prj_Em3j7Uj7RatX2R1ZYhla3XSHRde7
  CONDITIONAL_PAYMENTS_MODE: disabled
  TRADE_DONATION_POOL_ENABLED: "false"
  TRADE_DONATION_POOL_MODE: disabled
  DIRECT_DONATION_UPGRADES_ENABLED: "false"
  DIRECT_DONATION_UPGRADE_MODE: disabled
  MPGF_REAL_MONEY_ENABLED: "false"
  MPGF_REAL_MONEY_ACCEPTANCE_ENABLED: "false"
  MPGF_TEST_PAYMENT_ENABLED: "false"
  EVERY_ORG_PLEDGE_DONATIONS_ENABLED: "false"
  PGSSLMODE: require

jobs:
  compact-integration-uat:
    name: Exact integration Preview, multi-user UAT, logs, and zero residue
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Check out the one-use controller only
        uses: actions/checkout@v4
        with:
          path: controller
          fetch-depth: 0

      - name: Check out the exact PR 726 integration candidate
        uses: actions/checkout@v4
        with:
          path: app
          fetch-depth: 0
          ref: ${{ env.CANDIDATE_HEAD_SHA }}

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Revalidate exact GitHub, Git, and release-classification state
        id: exact_state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$CONTROLLER_BRANCH"
          test "$(git -C app rev-parse HEAD)" = "$CANDIDATE_HEAD_SHA"
          test "$(git -C app rev-parse HEAD^{tree})" = "$CANDIDATE_TREE_SHA"
          test "$(git -C app rev-parse HEAD^1)" = "$CANDIDATE_FIRST_PARENT"
          test "$(git -C app rev-parse HEAD^2)" = "$CANDIDATE_SECOND_PARENT"
          test "$(git -C app merge-base origin/main HEAD)" = "$CANDIDATE_BASE_SHA"
          test "$(git -C app rev-list --count "$CANDIDATE_BASE_SHA..HEAD")" = "$CANDIDATE_AHEAD_COUNT"
          test "$(git -C app diff --name-only "$CANDIDATE_BASE_SHA...HEAD" | wc -l | tr -d ' ')" = "$CANDIDATE_CHANGED_FILES"
          test "$(git -C app status --porcelain)" = ""
          git -C app merge-base --is-ancestor "$COMPACT_SOURCE_SHA" "$CANDIDATE_HEAD_SHA"
          test "$(git -C app rev-parse "$COMPACT_SOURCE_SHA^{tree}")" = "$COMPACT_SOURCE_TREE"
          observed_main_sha="$(git -C app rev-parse origin/main)"

          gh api repos/ghuser29384/Website2/pulls/726 > "$RUNNER_TEMP/pr726.json"
          gh api repos/ghuser29384/Website2/pulls/663 > "$RUNNER_TEMP/pr663.json"
          if jq -e '.mergeable == null' "$RUNNER_TEMP/pr726.json" >/dev/null; then sleep 2; gh api repos/ghuser29384/Website2/pulls/726 > "$RUNNER_TEMP/pr726.json"; fi
          if jq -e '.mergeable == null' "$RUNNER_TEMP/pr663.json" >/dev/null; then sleep 2; gh api repos/ghuser29384/Website2/pulls/663 > "$RUNNER_TEMP/pr663.json"; fi
          gh api repos/ghuser29384/Website2/issues/725 > "$RUNNER_TEMP/issue725.json"

          jq -e --arg head "$CANDIDATE_HEAD_SHA" --arg base "$CANDIDATE_BASE_SHA" '
            .state == "open" and .draft == true and .merged == false and .mergeable == true
            and .head.sha == $head and .base.sha == $base
          ' "$RUNNER_TEMP/pr726.json" >/dev/null
          jq -e --arg head "$COMPACT_SOURCE_SHA" '
            .state == "open" and .draft == true and .merged == false and .mergeable == true
            and .head.sha == $head
          ' "$RUNNER_TEMP/pr663.json" >/dev/null
          jq -e '.state == "open"' "$RUNNER_TEMP/issue725.json" >/dev/null

          pr_body="$(jq -r '.body // ""' "$RUNNER_TEMP/pr726.json")"
          grep -Fq 'Runtime-affecting' <<<"$pr_body"
          grep -Fq 'Do not merge or deploy yet; blockers remain' <<<"$pr_body"
          if grep -Fq '[x] **Explicit production release' <<<"$pr_body"; then
            echo 'PR 726 incorrectly authorizes production release.' >&2
            exit 1
          fi

          for binding in \
            "$COMPACT_QA_RUN_ID:MPGF public-goods compacts QA" \
            "$CANONICAL_VISUAL_RUN_ID:Sitewide canonical visual system" \
            "$EVIDENCE_PAYMENT_RUN_ID:Evidence payment release QA" \
            "$SMART_QUERY_RUN_ID:Smart query QA" \
            "$CREATE_ADAPTER_RUN_ID:Moral Trade Create adapter gates"; do
            run_id="${binding%%:*}"
            expected_name="${binding#*:}"
            gh api "repos/ghuser29384/Website2/actions/runs/$run_id" > "$RUNNER_TEMP/run-$run_id.json"
            jq -e --arg head "$CANDIDATE_HEAD_SHA" --arg name "$expected_name" '
              .head_sha == $head and .name == $name and .status == "completed" and .conclusion == "success"
            ' "$RUNNER_TEMP/run-$run_id.json" >/dev/null
          done

          gh api "repos/ghuser29384/Website2/actions/runs/$DASHBOARD_SCOPE_RUN_ID" > "$RUNNER_TEMP/dashboard-scope-run.json"
          jq -e --arg head "$CANDIDATE_HEAD_SHA" '
            .head_sha == $head and .name == "Dashboard Account security hotfix gates"
            and .status == "completed" and .conclusion == "failure"
          ' "$RUNNER_TEMP/dashboard-scope-run.json" >/dev/null

          github_deployments="$(gh api "repos/ghuser29384/Website2/deployments?sha=$CANDIDATE_HEAD_SHA&per_page=100" | jq 'length')"
          test "$github_deployments" = "0"

          mkdir -p evidence
          git -C app diff --name-only "$CANDIDATE_BASE_SHA...$CANDIDATE_HEAD_SHA" > evidence/changed-files.txt
          git -C app diff --check "$CANDIDATE_BASE_SHA" "$CANDIDATE_HEAD_SHA"
          jq -n \
            --arg head "$CANDIDATE_HEAD_SHA" \
            --arg tree "$CANDIDATE_TREE_SHA" \
            --arg base "$CANDIDATE_BASE_SHA" \
            --arg firstParent "$CANDIDATE_FIRST_PARENT" \
            --arg secondParent "$CANDIDATE_SECOND_PARENT" \
            --arg compactSource "$COMPACT_SOURCE_SHA" \
            --arg compactTree "$COMPACT_SOURCE_TREE" \
            --arg observedMain "$observed_main_sha" \
            --arg compactRun "$COMPACT_QA_RUN_ID" \
            --arg canonicalRun "$CANONICAL_VISUAL_RUN_ID" \
            --arg paymentRun "$EVIDENCE_PAYMENT_RUN_ID" \
            --arg smartRun "$SMART_QUERY_RUN_ID" \
            --arg createRun "$CREATE_ADAPTER_RUN_ID" \
            --arg dashboardScopeRun "$DASHBOARD_SCOPE_RUN_ID" \
            '{
              pr726:{open:true,draft:true,merged:false,mergeable:true,head:$head,tree:$tree,base:$base,firstParent:$firstParent,secondParent:$secondParent,ahead:83,changedFiles:43,observedMainAtControllerStart:$observedMain},
              pr663:{open:true,draft:true,merged:false,mergeable:true,head:$compactSource,tree:$compactTree,modifiedByController:false},
              releaseClassification:{runtimeAffecting:true,disposition:"do_not_merge_or_deploy",gate:"controller_exact_state"},
              exactHeadRuns:{compactQa:$compactRun,canonicalVisual:$canonicalRun,evidencePaymentQa:$paymentRun,smartQuery:$smartRun,createAdapter:$createRun,allApplicableSuccessful:true},
              narrowWorkflowNonProductFailure:{run:$dashboardScopeRun,reason:"integration PR intentionally exceeds Dashboard-only changed-file allowlist; substantive tests, lint, types, build, and rendered job passed"},
              githubDeploymentsBefore:0
            }' > evidence/exact-state.json

      - name: Install exact dependencies and browser/database clients
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix app ci
          sudo apt-get update -qq
          sudo apt-get install --yes postgresql-client zip unzip > /dev/null
          cd app
          npx playwright install --with-deps chromium

      - name: Re-run exact-head repository and release-browser gates
        shell: bash
        working-directory: app
        env:
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3210
          SITE_URL: http://127.0.0.1:3210
          PLAYWRIGHT_HTML_OPEN: never
        run: |
          set -euo pipefail
          node --import tsx --test \
            src/lib/mpgf/public-goods-compacts.test.ts \
            src/lib/mpgf/public-goods-compacts-state.test.ts \
            src/lib/mpgf/public-goods-compacts-contract.test.ts \
            src/lib/mpgf/public-goods-compacts-hardening-contract.test.ts \
            | tee ../evidence/focused-candidate-tests.log
          npm test | tee ../evidence/repository-tests.log
          npm run lint -- --quiet | tee ../evidence/eslint.log
          npx tsc --noEmit --pretty false | tee ../evidence/typescript.log
          npm run build | tee ../evidence/production-build.log
          npx playwright test --config=playwright.release.config.ts --reporter=line \
            | tee ../evidence/release-browser.log
          test "$(git rev-parse HEAD)" = "$CANDIDATE_HEAD_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$CANDIDATE_TREE_SHA"
          git diff --quiet

      - name: Prove exact QA credentials and zero Compact residue before mutation
        id: qa_preflight
        shell: bash
        env:
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.QA_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: https://hvmxfjjbdcgjjudmthdz.supabase.co
          QA_SUPABASE_DB_URL: ${{ secrets.QA_SUPABASE_DB_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.QA_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          test -n "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY"
          test -n "$QA_SUPABASE_DB_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          python3 - <<'PY'
          import os
          from urllib.parse import parse_qs, urlparse
          value = os.environ["QA_SUPABASE_DB_URL"]
          if os.environ["FORBIDDEN_PROD_REF"] in value:
              raise SystemExit("Production project reference is forbidden.")
          parsed = urlparse(value)
          valid = (
              parsed.scheme in {"postgres", "postgresql"}
              and os.environ["EXPECTED_QA_REF"] in (parsed.username or "")
              and parsed.hostname == os.environ["EXPECTED_QA_POOLER_HOST"]
              and parsed.port == 5432
              and parsed.path == "/postgres"
              and parse_qs(parsed.query).get("sslmode", ["require"]) == ["require"]
              and bool(parsed.password)
          )
          if not valid:
              raise SystemExit("Refusing a database URL outside the exact TLS-only QA target.")
          PY
          sentinel_contract="$(psql "$QA_SUPABASE_DB_URL" --no-psqlrc -Atqc "
            select coalesce(
              count(*) = 1 and bool_and(singleton) and bool_and(environment = 'qa')
              and bool_and(project_ref = 'hvmxfjjbdcgjjudmthdz')
              and bool_and(sentinel_id is not null)
              and bool_and(sentinel_sha256 ~ '^[a-f0-9]{64}$')
              and bool_and(provisioned_out_of_band), false
            )::text
            from moraltrade_qa.environment_identity where singleton;")"
          test "$sentinel_contract" = "true"
          tls_description="$(psql "$QA_SUPABASE_DB_URL" --no-psqlrc -X -c '\conninfo' 2>&1)"
          [[ "$tls_description" == *"SSL connection"* ]]
          unset tls_description
          psql "$QA_SUPABASE_DB_URL" --no-psqlrc --tuples-only --no-align \
            --file controller/ops/pr663-uat712/schema-absence.sql \
            > evidence/schema-absence-before.txt
          grep -Fxq 'compact_relations_before=0' evidence/schema-absence-before.txt
          grep -Fxq 'compact_functions_before=0' evidence/schema-absence-before.txt
          grep -Fxq 'eligibility_dependency_before=0' evidence/schema-absence-before.txt
          grep -Fxq 'synthetic_users_before=0' evidence/schema-absence-before.txt
          grep -Fxq 'synthetic_profiles_before=0' evidence/schema-absence-before.txt
          cd app
          node --input-type=module <<'NODE'
          import { createClient } from "@supabase/supabase-js";
          const qaRef = process.env.EXPECTED_QA_REF;
          const prodRef = process.env.FORBIDDEN_PROD_REF;
          const url = process.env.NEXT_PUBLIC_SUPABASE_URL;
          if (!url.includes(qaRef) || url.includes(prodRef)) throw new Error("Public QA URL guard failed.");
          const settings = await fetch(`${url}/auth/v1/settings`, { headers: { apikey: process.env.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY } });
          if (!settings.ok) throw new Error("QA publishable-key contract failed.");
          const service = createClient(url, process.env.SUPABASE_SERVICE_ROLE_KEY, { auth: { autoRefreshToken:false, detectSessionInUrl:false, persistSession:false } });
          const result = await service.auth.admin.listUsers({ page:1, perPage:1 });
          if (result.error) throw new Error("QA service-role contract failed.");
          NODE
          cd ..
          jq -n --arg ref "$EXPECTED_QA_REF" '{qaProjectRef:$ref,databaseUrlExact:true,tlsRequired:true,sentinelContract:true,publishableKeyContract:true,workflowOnlyServiceRoleContract:true,productionProjectExcluded:true,compactSchemaBefore:0,syntheticUsersBefore:0,secretValuesRetained:false}' > evidence/qa-binding-before.json

      - name: Audit canonical Vercel project and Preview credential boundary
        id: vercel_preflight
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          node --input-type=module <<'NODE'
          import { appendFile, writeFile } from "node:fs/promises";
          const headers = { Authorization: `Bearer ${process.env.VERCEL_TOKEN}` };
          const projectResponse = await fetch(`https://api.vercel.com/v9/projects/${process.env.VERCEL_PROJECT_ID}?teamId=${process.env.VERCEL_ORG_ID}`, { headers });
          if (!projectResponse.ok) throw new Error("Canonical Vercel project lookup failed.");
          const project = await projectResponse.json();
          if (project.id !== process.env.VERCEL_PROJECT_ID || project.accountId !== process.env.VERCEL_ORG_ID) throw new Error("Vercel identity drifted.");
          const envResponse = await fetch(`https://api.vercel.com/v9/projects/${process.env.VERCEL_PROJECT_ID}/env?teamId=${process.env.VERCEL_ORG_ID}`, { headers });
          if (!envResponse.ok) throw new Error("Vercel Preview environment audit failed.");
          const env = await envResponse.json();
          const keys = (env.envs ?? []).filter((entry) => !entry.target || entry.target.includes("preview")).map((entry) => String(entry.key));
          const allowedModes = new Set(["CONDITIONAL_PAYMENTS_MODE","TRADE_DONATION_POOL_ENABLED","TRADE_DONATION_POOL_MODE","DIRECT_DONATION_UPGRADES_ENABLED","DIRECT_DONATION_UPGRADE_MODE","MPGF_REAL_MONEY_ENABLED","MPGF_REAL_MONEY_ACCEPTANCE_ENABLED","MPGF_TEST_PAYMENT_ENABLED","EVERY_ORG_PLEDGE_DONATIONS_ENABLED"]);
          const blanked = new Set(["SUPABASE_SERVICE_ROLE_KEY","NEXT_PUBLIC_SUPABASE_ANON_KEY","SUPABASE_ANON_KEY","SUPABASE_URL","SUPABASE_PROJECT_REF","SUPABASE_DB_URL","DATABASE_URL","POSTGRES_URL","POSTGRES_PRISMA_URL","POSTGRES_URL_NON_POOLING","STRIPE_PLATFORM_ACCOUNT_ID","STRIPE_SECRET_KEY","STRIPE_WEBHOOK_SECRET"]);
          const qaOverrides = new Set(["NEXT_PUBLIC_SUPABASE_URL","NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY"]);
          const provider = /(STRIPE|EVERY_?ORG|PAYMENT|CUSTODY|SETTLEMENT|RESERVE|PAYOUT|PAYPAL|BRAINTREE|ADYEN|SQUARE).*(SECRET|KEY|TOKEN|ACCOUNT|CREDENTIAL|URL|ID)$/i;
          const data = /(SUPABASE|DATABASE|POSTGRES)/i;
          const unexpectedProvider = keys.filter((key) => provider.test(key) && !allowedModes.has(key) && !blanked.has(key));
          const unexpectedData = keys.filter((key) => data.test(key) && !blanked.has(key) && !qaOverrides.has(key));
          if (unexpectedProvider.length || unexpectedData.length) throw new Error("Unhandled Preview credential name exists.");
          const bypass = Object.entries(project.protectionBypass ?? {}).find(([, value]) => value?.scope === "automation-bypass");
          if (!bypass) throw new Error("Protected automation boundary is unavailable.");
          const deploymentsResponse = await fetch(`https://api.vercel.com/v6/deployments?projectId=${process.env.VERCEL_PROJECT_ID}&teamId=${process.env.VERCEL_ORG_ID}&limit=100`, { headers });
          if (!deploymentsResponse.ok) throw new Error("Deployment inventory lookup failed.");
          const deployments = await deploymentsResponse.json();
          const exact = (deployments.deployments ?? []).filter((deployment) => (deployment.meta?.githubCommitSha ?? deployment.gitSource?.sha ?? "") === process.env.CANDIDATE_HEAD_SHA);
          if (exact.length !== 0) throw new Error("Exact integration SHA already has a Vercel deployment; one-use controller refuses reuse.");
          await appendFile(process.env.GITHUB_OUTPUT, "existing_url=\n");
          await writeFile("evidence/vercel-preflight.json", `${JSON.stringify({projectId:project.id,teamId:project.accountId,exactCandidateDeploymentsBefore:0,deploymentProtectionAvailable:true,previewEnvironmentKeyCount:keys.length,paymentModesForcedDisabled:[...allowedModes].sort(),inheritedCredentialKeysBlanked:[...blanked].sort(),qaKeysOverridden:[...qaOverrides].sort(),unexpectedProviderCredentialKeys:[],unexpectedDatabaseCredentialKeys:[],secretValuesRetained:false},null,2)}\n`);
          NODE

      - name: Build the exact candidate with only public QA and disabled-payment configuration
        shell: bash
        working-directory: app
        env:
          NEXT_PUBLIC_SITE_URL: https://preview.invalid
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.QA_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: https://hvmxfjjbdcgjjudmthdz.supabase.co
          SITE_URL: https://preview.invalid
          VERCEL_GIT_COMMIT_REF: integration/pr663-compact-v2-current-main-20260815
          VERCEL_GIT_COMMIT_SHA: ${{ env.CANDIDATE_HEAD_SHA }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p .vercel
          node --input-type=module <<'NODE'
          import { writeFile } from "node:fs/promises";
          const response = await fetch(`https://api.vercel.com/v9/projects/${process.env.VERCEL_PROJECT_ID}?teamId=${process.env.VERCEL_ORG_ID}`, { headers:{Authorization:`Bearer ${process.env.VERCEL_TOKEN}`} });
          if (!response.ok) throw new Error("Canonical Vercel project settings lookup failed.");
          const project = await response.json();
          if (project.id !== process.env.VERCEL_PROJECT_ID || project.accountId !== process.env.VERCEL_ORG_ID) throw new Error("Vercel project identity drifted.");
          const settings = {createdAt:project.createdAt,framework:project.framework,devCommand:project.devCommand,installCommand:project.installCommand,buildCommand:project.buildCommand,outputDirectory:project.outputDirectory,rootDirectory:project.rootDirectory,directoryListing:project.directoryListing,nodeVersion:project.nodeVersion};
          await writeFile(".vercel/project.json", `${JSON.stringify({orgId:process.env.VERCEL_ORG_ID,projectId:process.env.VERCEL_PROJECT_ID,projectName:project.name,settings},null,2)}\n`);
          const forbidden = Object.keys(process.env).filter((key) => /^(?:SUPABASE_SERVICE_ROLE_KEY|QA_SUPABASE_DB_URL|DATABASE_URL|POSTGRES_URL|STRIPE_SECRET_KEY|STRIPE_WEBHOOK_SECRET)$/i.test(key));
          if (forbidden.length) throw new Error("Build unexpectedly received private database/provider credentials.");
          NODE
          test -z "$(find .vercel -maxdepth 1 -type f -name '.env*' -print -quit)"
          rm -rf .next .vercel/output
          npx --yes "vercel@$VERCEL_CLI_VERSION" build --yes --token="$VERCEL_TOKEN" | tee ../evidence/vercel-build.log
          node ../controller/ops/pr663-uat712/inject-runtime-attestation.mjs
          STATIC_SOURCE_DIR=public STATIC_BUILD_DIR=.vercel/output/static STATIC_EVIDENCE_DIR=../evidence STATIC_CRITICAL_ASSET=moral-trade-live-create-router.js \
            node scripts/vercel-static-artifact-integrity.mjs | tee ../evidence/static-artifact-integrity.log
          test "$(git rev-parse HEAD)" = "$CANDIDATE_HEAD_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$CANDIDATE_TREE_SHA"
          git diff --quiet

      - name: Revalidate exact integration head before deployment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/ghuser29384/Website2/pulls/726 --jq '.head.sha')" = "$CANDIDATE_HEAD_SHA"
          test "$(gh api repos/ghuser29384/Website2/pulls/663 --jq '.head.sha')" = "$COMPACT_SOURCE_SHA"

      - name: Deploy the prebuilt candidate once as an unaliased Preview
        id: deploy
        shell: bash
        working-directory: app
        env:
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.QA_SUPABASE_PUBLISHABLE_KEY }}
          VERCEL_GIT_COMMIT_REF: integration/pr663-compact-v2-current-main-20260815
          VERCEL_GIT_COMMIT_SHA: ${{ env.CANDIDATE_HEAD_SHA }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          deployment_url="$(npx --yes "vercel@$VERCEL_CLI_VERSION" deploy \
            --prebuilt --token="$VERCEL_TOKEN" \
            --meta "githubCommitSha=$CANDIDATE_HEAD_SHA" \
            --meta "githubCommitRef=integration/pr663-compact-v2-current-main-20260815" \
            --meta "uatIssue=725" \
            --env "NEXT_PUBLIC_SITE_URL=https://preview.invalid" \
            --env "SITE_URL=https://preview.invalid" \
            --env "NEXT_PUBLIC_SUPABASE_URL=https://hvmxfjjbdcgjjudmthdz.supabase.co" \
            --env "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" \
            --env "SUPABASE_SERVICE_ROLE_KEY=" --env "NEXT_PUBLIC_SUPABASE_ANON_KEY=" --env "SUPABASE_ANON_KEY=" \
            --env "SUPABASE_URL=" --env "SUPABASE_PROJECT_REF=" --env "SUPABASE_DB_URL=" --env "DATABASE_URL=" \
            --env "POSTGRES_URL=" --env "POSTGRES_PRISMA_URL=" --env "POSTGRES_URL_NON_POOLING=" \
            --env "CONDITIONAL_PAYMENTS_MODE=disabled" --env "TRADE_DONATION_POOL_ENABLED=false" \
            --env "TRADE_DONATION_POOL_MODE=disabled" --env "DIRECT_DONATION_UPGRADES_ENABLED=false" \
            --env "DIRECT_DONATION_UPGRADE_MODE=disabled" --env "MPGF_REAL_MONEY_ENABLED=false" \
            --env "MPGF_REAL_MONEY_ACCEPTANCE_ENABLED=false" --env "MPGF_TEST_PAYMENT_ENABLED=false" \
            --env "EVERY_ORG_PLEDGE_DONATIONS_ENABLED=false" --env "STRIPE_PLATFORM_ACCOUNT_ID=" \
            --env "STRIPE_SECRET_KEY=" --env "STRIPE_WEBHOOK_SECRET=" \
            --build-env "NEXT_PUBLIC_SITE_URL=https://preview.invalid" --build-env "SITE_URL=https://preview.invalid" \
            --build-env "NEXT_PUBLIC_SUPABASE_URL=https://hvmxfjjbdcgjjudmthdz.supabase.co" \
            --build-env "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" \
            --build-env "SUPABASE_SERVICE_ROLE_KEY=" --build-env "NEXT_PUBLIC_SUPABASE_ANON_KEY=" \
            --build-env "SUPABASE_ANON_KEY=" --build-env "SUPABASE_URL=" --build-env "SUPABASE_PROJECT_REF=" \
            --build-env "SUPABASE_DB_URL=" --build-env "DATABASE_URL=" --build-env "POSTGRES_URL=" \
            --build-env "POSTGRES_PRISMA_URL=" --build-env "POSTGRES_URL_NON_POOLING=" \
            --build-env "CONDITIONAL_PAYMENTS_MODE=disabled" --build-env "TRADE_DONATION_POOL_ENABLED=false" \
            --build-env "TRADE_DONATION_POOL_MODE=disabled" --build-env "DIRECT_DONATION_UPGRADES_ENABLED=false" \
            --build-env "DIRECT_DONATION_UPGRADE_MODE=disabled" --build-env "MPGF_REAL_MONEY_ENABLED=false" \
            --build-env "MPGF_REAL_MONEY_ACCEPTANCE_ENABLED=false" --build-env "MPGF_TEST_PAYMENT_ENABLED=false" \
            --build-env "EVERY_ORG_PLEDGE_DONATIONS_ENABLED=false" --build-env "STRIPE_PLATFORM_ACCOUNT_ID=" \
            --build-env "STRIPE_SECRET_KEY=" --build-env "STRIPE_WEBHOOK_SECRET=")"
          deployment_url="$(printf '%s\n' "$deployment_url" | tr -d '\r' | tail -n 1)"
          [[ "$deployment_url" =~ ^https://[A-Za-z0-9.-]+$ ]]
          printf '%s\n' "$deployment_url" > ../evidence/deployment-url.txt
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Prove deployment metadata, protection, noindex, and QA binding before fixtures
        id: deployment
        shell: bash
        env:
          COMPACT_UAT_BASE_URL: ${{ steps.deploy.outputs.deployment_url }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.QA_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: https://hvmxfjjbdcgjjudmthdz.supabase.co
          UAT712_EVIDENCE_DIR: ../evidence
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/ghuser29384/Website2/pulls/726 --jq '.head.sha')" = "$CANDIDATE_HEAD_SHA"
          deployment_id="$(node --input-type=module <<'NODE'
          const hostname = new URL(process.env.COMPACT_UAT_BASE_URL).hostname;
          const response = await fetch(`https://api.vercel.com/v13/deployments/${encodeURIComponent(hostname)}?teamId=${process.env.VERCEL_ORG_ID}`, {headers:{Authorization:`Bearer ${process.env.VERCEL_TOKEN}`}});
          if (!response.ok) throw new Error("Deployment lookup failed.");
          const data = await response.json();
          const id = data.id ?? data.uid;
          if (!id || `https://${data.url}` !== process.env.COMPACT_UAT_BASE_URL) throw new Error("Exact deployment ID/URL not found.");
          process.stdout.write(id);
          NODE
          )"
          [[ "$deployment_id" =~ ^dpl_[A-Za-z0-9]+$ ]]
          echo "deployment_id=$deployment_id" >> "$GITHUB_OUTPUT"
          node --input-type=module - "$deployment_id" <<'NODE'
          import { writeFile } from "node:fs/promises";
          const id = process.argv[2];
          const response = await fetch(`https://api.vercel.com/v13/deployments/${id}?teamId=${process.env.VERCEL_ORG_ID}`, {headers:{Authorization:`Bearer ${process.env.VERCEL_TOKEN}`}});
          if (!response.ok) throw new Error("Exact deployment metadata lookup failed.");
          const data = await response.json();
          const aliases = data.alias ?? data.aliases ?? [];
          const sha = data.meta?.githubCommitSha ?? data.gitSource?.sha ?? "";
          if (data.id !== id || data.projectId !== process.env.VERCEL_PROJECT_ID) throw new Error("Wrong deployment/project.");
          if (data.readyState !== "READY" || data.target !== null || aliases.length !== 0) throw new Error("Deployment is not READY, Preview-only, and unaliased.");
          if (sha !== process.env.CANDIDATE_HEAD_SHA || data.meta?.uatIssue !== "725") throw new Error("Deployment metadata mismatch.");
          if (aliases.some((value) => /(^|\.)moraltrade\.org$/i.test(value))) throw new Error("Production alias is forbidden.");
          await writeFile("evidence/deployment-metadata.json", `${JSON.stringify({id:data.id,url:process.env.COMPACT_UAT_BASE_URL,projectId:data.projectId,readyState:data.readyState,target:data.target,aliases,candidateSha:sha,candidateTree:process.env.CANDIDATE_TREE_SHA,protected:true,noindex:true,runtimeAttestation:"/api/uat712/runtime-attestation",applicationSourceTreeUnchanged:true},null,2)}\n`);
          NODE
          unauth_status="$(curl -sS -o /dev/null -w '%{http_code}' --max-redirs 0 "$COMPACT_UAT_BASE_URL/")"
          case "$unauth_status" in 302|303|307|308|401|403) ;; *) echo "Protected Preview unexpectedly returned HTTP $unauth_status." >&2; exit 1;; esac
          bypass="$(node --input-type=module <<'NODE'
          const response = await fetch(`https://api.vercel.com/v9/projects/${process.env.VERCEL_PROJECT_ID}?teamId=${process.env.VERCEL_ORG_ID}`, {headers:{Authorization:`Bearer ${process.env.VERCEL_TOKEN}`}});
          if (!response.ok) throw new Error("Automation boundary lookup failed.");
          const project = await response.json();
          const entry = Object.entries(project.protectionBypass ?? {}).find(([,value]) => value?.scope === "automation-bypass");
          if (!entry) throw new Error("Automation boundary absent.");
          process.stdout.write(entry[0]);
          NODE
          )"
          test -n "$bypass"
          echo "::add-mask::$bypass"
          export VERCEL_AUTOMATION_BYPASS_SECRET="$bypass"
          cd app
          node ../controller/ops/pr663-uat712/preflight.mjs

      - name: Apply fail-closed dependency, reviewed Compact migrations, and synthetic identities
        id: fixtures
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          QA_SUPABASE_DB_URL: ${{ secrets.QA_SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          test "$(gh api repos/ghuser29384/Website2/pulls/726 --jq '.head.sha')" = "$CANDIDATE_HEAD_SHA"
          psql "$QA_SUPABASE_DB_URL" --no-psqlrc --tuples-only --no-align --set ON_ERROR_STOP=1 --file controller/ops/pr663-uat712/schema-absence.sql > "$RUNNER_TEMP/schema-absence-immediate.txt"
          grep -Fxq 'compact_relations_before=0' "$RUNNER_TEMP/schema-absence-immediate.txt"
          grep -Fxq 'compact_functions_before=0' "$RUNNER_TEMP/schema-absence-immediate.txt"
          grep -Fxq 'eligibility_dependency_before=0' "$RUNNER_TEMP/schema-absence-immediate.txt"
          grep -Fxq 'synthetic_users_before=0' "$RUNNER_TEMP/schema-absence-immediate.txt"
          grep -Fxq 'synthetic_profiles_before=0' "$RUNNER_TEMP/schema-absence-immediate.txt"
          echo "cleanup_authorized=true" >> "$GITHUB_OUTPUT"
          psql "$QA_SUPABASE_DB_URL" --no-psqlrc --set ON_ERROR_STOP=1 --file controller/ops/pr663-uat712/eligibility-dependency.sql > "$RUNNER_TEMP/dependency.log" 2>&1 || { node controller/ops/pr663-uat712/sanitize-database-diagnostic.mjs "$RUNNER_TEMP/dependency.log" evidence/database-dependency-failure.txt dependency uat712/eligibility-dependency.sql persistent_qa_cleanup_pending=true; exit 1; }
          migrations=(app/supabase/migrations/20260813163052_mpgf_public_goods_compacts.sql app/supabase/migrations/20260814031500_mpgf_public_goods_compacts_state_hardening.sql)
          sha256sum "${migrations[@]}" controller/ops/pr663-uat712/eligibility-dependency.sql controller/ops/pr663-uat712/fixture.sql > evidence/reviewed-database-sources.sha256
          for migration in "${migrations[@]}"; do
            psql "$QA_SUPABASE_DB_URL" --no-psqlrc --set ON_ERROR_STOP=1 --file "$migration" > "$RUNNER_TEMP/$(basename "$migration").log" 2>&1 || { node controller/ops/pr663-uat712/sanitize-database-diagnostic.mjs "$RUNNER_TEMP/$(basename "$migration").log" evidence/database-migration-failure.txt migration "$(basename "$migration")" persistent_qa_cleanup_pending=true; exit 1; }
          done
          test "$(psql "$QA_SUPABASE_DB_URL" --no-psqlrc -Atqc "select count(*) from public.mpgf_public_goods_compacts;")" = "3"
          test "$(psql "$QA_SUPABASE_DB_URL" --no-psqlrc -Atqc "select count(*) from public.mpgf_public_goods_compacts where status='active' or activation_execution_enabled or activated_at is not null;")" = "0"
          qa_password="$(openssl rand -hex 32)"
          echo "::add-mask::$qa_password"
          printf '%s' "$qa_password" > "$RUNNER_TEMP/uat712-password"
          chmod 600 "$RUNNER_TEMP/uat712-password"
          export COMPACT_UAT_PASSWORD="$qa_password"
          psql "$QA_SUPABASE_DB_URL" --no-psqlrc --set ON_ERROR_STOP=1 --file controller/ops/pr663-uat712/fixture.sql > "$RUNNER_TEMP/fixture.log" 2>&1 || { node controller/ops/pr663-uat712/sanitize-database-diagnostic.mjs "$RUNNER_TEMP/fixture.log" evidence/fixture-failure.txt fixture uat712/fixture.sql persistent_qa_cleanup_pending=true; exit 1; }
          printf 'eligibility_dependency_relations=1\neligibility_dependency_rows=0\ncompact_relations_applied=18\nfounding_charters=3\nsynthetic_users=3\nactive_compacts=0\n' > evidence/fixture-summary.txt

      - name: Execute signed-in multi-user protected-Preview UAT
        id: uat
        shell: bash
        working-directory: app
        env:
          COMPACT_UAT_BASE_URL: ${{ steps.deploy.outputs.deployment_url }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.QA_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: https://hvmxfjjbdcgjjudmthdz.supabase.co
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -uo pipefail
          mkdir -p ../evidence test-results
          cp -R ../controller/ops/pr663-uat712 uat712
          export COMPACT_UAT_PASSWORD="$(tr -d '\r\n' < "$RUNNER_TEMP/uat712-password")"
          test -n "$COMPACT_UAT_PASSWORD"
          echo "::add-mask::$COMPACT_UAT_PASSWORD"
          bypass="$(node --input-type=module <<'NODE'
          const response = await fetch(`https://api.vercel.com/v9/projects/${process.env.VERCEL_PROJECT_ID}?teamId=${process.env.VERCEL_ORG_ID}`, {headers:{Authorization:`Bearer ${process.env.VERCEL_TOKEN}`}});
          if (!response.ok) throw new Error("Automation boundary lookup failed.");
          const project = await response.json();
          const entry = Object.entries(project.protectionBypass ?? {}).find(([,value]) => value?.scope === "automation-bypass");
          if (!entry) throw new Error("Automation boundary absent.");
          process.stdout.write(entry[0]);
          NODE
          )"
          test -n "$bypass"
          echo "::add-mask::$bypass"
          export VERCEL_AUTOMATION_BYPASS_SECRET="$bypass"
          uat_start="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "uat_start=$uat_start" >> "$GITHUB_OUTPUT"
          set +e
          npx playwright test uat712/compact-uat.spec.ts --config uat712/playwright.config.ts --reporter=line 2>&1 | tee ../evidence/playwright.log
          test_status="${PIPESTATUS[0]}"
          node uat712/redact-traces.mjs test-results ../evidence > ../evidence/trace-redaction.txt 2> "$RUNNER_TEMP/trace-redaction.err"
          redaction_status="$?"
          set -e
          uat_end="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "uat_end=$uat_end" >> "$GITHUB_OUTPUT"
          jq -n --arg start "$uat_start" --arg end "$uat_end" --argjson testStatus "$test_status" --argjson redactionStatus "$redaction_status" '{window:{startUtc:$start,endUtc:$end},testStatus:$testStatus,traceRedactionStatus:$redactionStatus}' > ../evidence/uat-window.json
          test "$test_status" = "0"
          test "$redaction_status" = "0"

      - name: Prove no-money, no-activation, and no-electorate state before cleanup
        id: before_cleanup
        if: always() && steps.fixtures.outputs.cleanup_authorized == 'true'
        shell: bash
        env:
          QA_SUPABASE_DB_URL: ${{ secrets.QA_SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          if test "$(psql "$QA_SUPABASE_DB_URL" --no-psqlrc -Atqc "select pg_catalog.to_regclass('public.mpgf_public_goods_compacts') is not null;")" != "t"; then printf 'compact_schema_before_cleanup=absent\n' > evidence/no-money-before-cleanup.txt; exit 1; fi
          psql "$QA_SUPABASE_DB_URL" --no-psqlrc --tuples-only --no-align --set ON_ERROR_STOP=1 --file controller/ops/pr663-uat712/no-money-before-cleanup.sql > evidence/no-money-before-cleanup.txt 2> "$RUNNER_TEMP/no-money.err" || { node controller/ops/pr663-uat712/sanitize-database-diagnostic.mjs "$RUNNER_TEMP/no-money.err" evidence/no-money-proof-failure.txt no_money_proof uat712/no-money-before-cleanup.sql read_only_query=true; exit 1; }
          for expected in synthetic_users_before_cleanup=3 payment_refs_before_cleanup=0 activation_records_before_cleanup=0 electorate_records_before_cleanup=0 authorization_records_before_cleanup=0 coverage_records_before_cleanup=0 outflow_records_before_cleanup=0 obligation_records_before_cleanup=0 scheduled_records_before_cleanup=0 settlement_records_before_cleanup=0 qualification_records_before_cleanup=0 readiness_records_before_cleanup=0 eligibility_dependency_rows_before_cleanup=0; do grep -Fxq "$expected" evidence/no-money-before-cleanup.txt; done

      - name: Unconditionally remove fixtures, sessions, and Compact schema and prove zero residue
        id: cleanup
        if: always() && steps.fixtures.outputs.cleanup_authorized == 'true'
        shell: bash
        env:
          QA_SUPABASE_DB_URL: ${{ secrets.QA_SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          psql "$QA_SUPABASE_DB_URL" --no-psqlrc --set ON_ERROR_STOP=1 --file controller/ops/pr663-uat712/cleanup.sql > "$RUNNER_TEMP/cleanup.log" 2>&1 || { node controller/ops/pr663-uat712/sanitize-database-diagnostic.mjs "$RUNNER_TEMP/cleanup.log" evidence/cleanup-failure.txt cleanup uat712/cleanup.sql cleanup_complete=false; exit 1; }
          rm -f "$RUNNER_TEMP/cleanup.log" "$RUNNER_TEMP/uat712-password"
          psql "$QA_SUPABASE_DB_URL" --no-psqlrc --tuples-only --no-align --set ON_ERROR_STOP=1 --file controller/ops/pr663-uat712/residue-proof.sql > evidence/zero-residue.txt 2> "$RUNNER_TEMP/residue.err" || { node controller/ops/pr663-uat712/sanitize-database-diagnostic.mjs "$RUNNER_TEMP/residue.err" evidence/residue-proof-failure.txt residue_proof uat712/residue-proof.sql read_only_query=true; exit 1; }
          for expected in fixture_residue=0 synthetic_users=0 payment_refs=0 activation_records=0 electorate_records=0 compact_relations=0 compact_functions=0 eligibility_dependency_relations=0; do grep -Fxq "$expected" evidence/zero-residue.txt; done

      - name: Inspect deployment-scoped runtime logs for the exact UAT window
        id: runtime_logs
        if: always() && steps.deployment.outputs.deployment_id != '' && steps.uat.outputs.uat_start != ''
        shell: bash
        working-directory: app
        env:
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.deployment_id }}
          UAT_END: ${{ steps.uat.outputs.uat_end }}
          UAT_START: ${{ steps.uat.outputs.uat_start }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes "vercel@$VERCEL_LOG_CLI_VERSION" logs "$DEPLOYMENT_ID" --since "$UAT_START" --until "$UAT_END" --limit 1000 --json --token "$VERCEL_TOKEN" | node uat712/summarize-vercel-logs.mjs > ../evidence/vercel-runtime-log-summary.json
          test "$(jq -r '.entries' ../evidence/vercel-runtime-log-summary.json)" -gt 0
          test "$(jq -r '.errors' ../evidence/vercel-runtime-log-summary.json)" = "0"
          test "$(jq -r '.warnings' ../evidence/vercel-runtime-log-summary.json)" = "0"
          test "$(jq -r '.http5xx' ../evidence/vercel-runtime-log-summary.json)" = "0"
          test "$(jq -r '.paymentSignals' ../evidence/vercel-runtime-log-summary.json)" = "0"
          test "$(jq -r '.privateLeakSignals' ../evidence/vercel-runtime-log-summary.json)" = "0"

      - name: Reassess frozen-main relationship after UAT
        id: drift
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          git -C app fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          final_main="$(git -C app rev-parse origin/main)"
          if [[ "$final_main" = "$CANDIDATE_BASE_SHA" ]]; then
            drift_status=none
            : > evidence/final-main-drift-files.txt
          else
            drift_status=present
            git -C app diff --name-only "$CANDIDATE_BASE_SHA...$final_main" > evidence/final-main-drift-files.txt
          fi
          jq -n --arg locked "$CANDIDATE_BASE_SHA" --arg final "$final_main" --arg status "$drift_status" '{lockedMain:$locked,finalMain:$final,status:$status}' > evidence/final-main-drift.json

      - name: Build final evidence ledger, classify, and rescan retained artifacts
        id: evidence
        if: always()
        shell: bash
        env:
          BEFORE_CLEANUP_OUTCOME: ${{ steps.before_cleanup.outcome }}
          CLEANUP_OUTCOME: ${{ steps.cleanup.outcome }}
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.deployment_id }}
          DEPLOYMENT_OUTCOME: ${{ steps.deployment.outcome }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
          RUNTIME_LOG_OUTCOME: ${{ steps.runtime_logs.outcome }}
          UAT_OUTCOME: ${{ steps.uat.outcome }}
        run: |
          set -euo pipefail
          mkdir -p evidence app/test-results
          if [[ "$DEPLOYMENT_OUTCOME" = success && "$UAT_OUTCOME" = success && "$BEFORE_CLEANUP_OUTCOME" = success && "$CLEANUP_OUTCOME" = success && "$RUNTIME_LOG_OUTCOME" = success ]]; then conclusion=uat_pass_with_nonblocking_notes; else conclusion=uat_failed; fi
          jq -n --arg conclusion "$conclusion" --arg head "$CANDIDATE_HEAD_SHA" --arg tree "$CANDIDATE_TREE_SHA" --arg base "$CANDIDATE_BASE_SHA" --arg first "$CANDIDATE_FIRST_PARENT" --arg second "$CANDIDATE_SECOND_PARENT" --arg deploymentId "$DEPLOYMENT_ID" --arg deploymentUrl "$DEPLOYMENT_URL" --arg runUrl "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --arg uat "$UAT_OUTCOME" --arg cleanup "$CLEANUP_OUTCOME" --arg logs "$RUNTIME_LOG_OUTCOME" '{conclusion:$conclusion,candidate:{head:$head,tree:$tree,base:$base,parents:[$first,$second]},deployment:{id:$deploymentId,url:$deploymentUrl,target:null,aliases:[],protected:true,noindex:true},controllerRun:$runUrl,stepOutcomes:{uat:$uat,cleanup:$cleanup,runtimeLogs:$logs},hostedLimitations:["No authoritative ledger, verified-unique-person primitive, dormant authorization, settlement, active Compact, frozen electorate, or exit finalizer was fabricated.","Cent allocation and 0.99/1.00 qualification arithmetic are supported by exact-head rollback QA rather than invented hosted authority."],forbiddenActions:{merge:false,readyForReview:false,mainMutation:false,productionData:false,persistentMigration:false,activation:false,electorate:false,paymentProvider:false,canonicalAlias:false,productionRelease:false}}' > evidence/result-summary.json
          if [[ "${{ steps.uat.outcome }}" = success ]]; then node controller/ops/pr663-uat712/redact-traces.mjs app/test-results evidence > evidence/final-evidence-secret-scan.txt; else ALLOW_NO_TRACE=1 node controller/ops/pr663-uat712/redact-traces.mjs app/test-results evidence > evidence/final-evidence-secret-scan.txt; fi
          if rg -l --fixed-strings "$FORBIDDEN_PROD_REF" evidence app/test-results; then echo 'Forbidden production project reference remained in retained evidence.' >&2; exit 1; fi
          find evidence app/test-results -type f ! -path 'evidence/sha256-manifest.txt' -print0 | sort -z | xargs -0 sha256sum > evidence/sha256-manifest.txt
          git -C controller diff --check
          git -C app diff --check "$CANDIDATE_BASE_SHA" "$CANDIDATE_HEAD_SHA"
          test "$(git -C app rev-parse HEAD)" = "$CANDIDATE_HEAD_SHA"

      - name: Upload redacted integration UAT evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr726-compact-v2-integration-qa-uat-${{ github.run_id }}-${{ env.CANDIDATE_HEAD_SHA }}
          path: |
            evidence
            app/test-results
          if-no-files-found: error
          retention-days: 30
