name: Cleanup blind-audit hardening controllers

on:
  push:
    branches:
      - feature/evidence-credibility-blind-audit-v1-20260812
    paths:
      - .github/workflows/cleanup-blind-audit-hardening-controllers.yml

permissions:
  contents: write

concurrency:
  group: cleanup-blind-audit-hardening-controllers-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Repair assignment replay and remove failed one-use controllers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "supabase/migrations/20260812022001_evidence_credibility_blind_audit_hardening.sql"
          )
          source = path.read_text(encoding="utf-8")
          old = """    if existing_assignment.draw_id is distinct from p_draw_id
               or existing_assignment.reviewer_id is distinct from p_reviewer_id
               or existing_assignment.expires_at is distinct from p_expires_at then
          """
          new = """    if existing_assignment.draw_id is distinct from p_draw_id
               or existing_assignment.reviewer_id is distinct from p_reviewer_id then
          """
          if source.count(old) != 1:
              raise SystemExit("Expected exactly one assignment-replay comparison block.")
          path.write_text(source.replace(old, new), encoding="utf-8")
          PY
          git diff --check
          ! grep -q "existing_assignment.expires_at is distinct from p_expires_at" \
            supabase/migrations/20260812022001_evidence_credibility_blind_audit_hardening.sql

      - name: Commit durable repair and remove controllers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/20260812022001_evidence_credibility_blind_audit_hardening.sql
          for controller in \
            .github/workflows/finalize-blind-audit-hardening.yml \
            .github/workflows/finalize-blind-audit-hardening-v2.yml \
            .github/workflows/cleanup-blind-audit-hardening-controllers.yml; do
            test ! -e "$controller" || git rm "$controller"
          done
          git commit -m "fix: make blind-audit assignment replay expiry-stable"
          git push origin "HEAD:${GITHUB_REF_NAME}"
