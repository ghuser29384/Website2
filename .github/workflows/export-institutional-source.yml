name: Export institutional source

on:
  push:
    branches:
      - feat/institutional-trade-system
    paths:
      - .github/workflows/export-institutional-source.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/export-institutional-source.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Package source
        run: |
          tar \
            --exclude=.git \
            --exclude=node_modules \
            --exclude=.next \
            --exclude=output \
            -czf /tmp/website2-institutional-source.tar.gz .

      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: website2-institutional-source
          path: /tmp/website2-institutional-source.tar.gz
          if-no-files-found: error
          retention-days: 1
