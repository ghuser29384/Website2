name: One-use PR 743 root prefetch repair v2

on:
  push:
    branches:
      - ops/pr743-protected-preview-20260817
    paths:
      - .github/workflows/pr743-root-prefetch-repair-v2-20260817.yml

permissions:
  contents: write

concurrency:
  group: pr743-root-prefetch-repair-v2
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      TARGET_BRANCH: integration/pr665-current-main-20260817
      EXPECTED_MAIN_SHA: 7e993158363710e5fe2c3eaa1cbccdb5cd56c235
      EXPECTED_HEAD_SHA: 8fb215b27c07c1bbc25f5bec84e323e8eb1c2a37

    steps:
      - name: Check out exact current candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Guard source identities
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "ghuser29384/Website2"
          test "$(git branch --show-current)" = "$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$EXPECTED_MAIN_SHA"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | awk '{print $1}')" = "$EXPECTED_HEAD_SHA"
          test "$(git merge-base "$EXPECTED_MAIN_SHA" HEAD)" = "$EXPECTED_MAIN_SHA"

      - name: Apply exact root-prefetch repair and source contract
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 --decode > /tmp/pr743-root-prefetch-repair.py
          python3 /tmp/pr743-root-prefetch-repair.py

      - name: Run focused executable verification
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          node --import tsx --test src/auth-resolution-wiring.test.ts src/proxy.test.ts
          npx eslint src/auth-resolution-wiring.test.ts src/components/core-trade/trade-draft-workbench.tsx
          git diff --check
          test "$(git diff --name-only | sort)" = "$(printf '%s\n' src/auth-resolution-wiring.test.ts src/components/core-trade/trade-draft-workbench.tsx | sort)"

      - name: Commit and push without rewriting history
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | awk '{print $1}')" = "$EXPECTED_HEAD_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/auth-resolution-wiring.test.ts src/components/core-trade/trade-draft-workbench.tsx
          git commit -m "Prevent trade surfaces from prefetching rewritten root"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          printf 'new_head=%s\nnew_tree=%s\n' "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})" | tee pr743-root-prefetch-repair-v2.txt

      - name: Upload repair identity
        uses: actions/upload-artifact@v4
        with:
          name: pr743-root-prefetch-repair-v2-${{ github.run_id }}
          path: pr743-root-prefetch-repair-v2.txt
          retention-days: 30
