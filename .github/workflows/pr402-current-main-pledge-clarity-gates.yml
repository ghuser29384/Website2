name: PR 402 current-main pledge clarity gates

on:
  push:
    branches:
      - fix/discover-pledge-clarity-20260801
    paths:
      - ".github/workflows/pr402-current-main-pledge-clarity-gates.yml"
      - "src/discover/**"
      - "src/discover-pledge-clarity.test.ts"
      - "public/discover/payload/**"
      - "tests/discover-pledge-clarity.spec.ts"

permissions:
  contents: write

concurrency:
  group: pr402-current-main-pledge-clarity-gates
  cancel-in-progress: true

jobs:
  validate-and-clean:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4
        with:
          ref: fix/discover-pledge-clarity-20260801
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Guard repository and branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'ghuser29384/Website2'
          test "$(git branch --show-current)" = 'fix/discover-pledge-clarity-20260801'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Verify deterministic Discover payload
        shell: bash
        run: |
          set -o pipefail
          npm run verify:discover 2>&1 | tee discover-contracts.log

      - name: Run focused and complete repository gates
        shell: bash
        env:
          NEXT_PUBLIC_SITE_URL: https://www.moraltrade.org
          VERCEL: "1"
          VERCEL_ENV: preview
        run: |
          set -o pipefail
          node --import tsx --test src/discover-pledge-clarity.test.ts \
            2>&1 | tee pledge-clarity-focused.log
          npm test 2>&1 | tee repository-tests.log
          npm run lint -- --quiet 2>&1 | tee repository-lint.log
          npm run build 2>&1 | tee production-build.log

      - name: Run desktop and mobile pledge-clarity Playwright
        shell: bash
        run: |
          set -euo pipefail
          npx playwright install --with-deps chromium
          npx playwright test tests/discover-pledge-clarity.spec.ts --reporter=line \
            2>&1 | tee pledge-clarity-playwright.log
          test -s test-results/discover-pledge-clarity-desktop.png
          test -s test-results/discover-pledge-clarity-mobile.png

      - name: Verify exact product diff
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          base="$(git merge-base HEAD origin/main)"
          git diff --check "$base" HEAD | tee diff-check.log
          git diff --name-only "$base" HEAD | sort > actual-files-with-gate.txt
          cat > expected-files-with-gate.txt <<'EOF'
          .github/workflows/pr402-current-main-pledge-clarity-gates.yml
          public/discover/payload/0.txt
          public/discover/payload/1.txt
          public/discover/payload/2.txt
          public/discover/payload/3.txt
          public/discover/payload/4.txt
          public/discover/payload/5.txt
          public/discover/payload/6.txt
          public/discover/payload/manifest.json
          src/discover-pledge-clarity.test.ts
          src/discover/moral-trade-discover.source.html
          tests/discover-pledge-clarity.spec.ts
          EOF
          sort -o expected-files-with-gate.txt expected-files-with-gate.txt
          diff -u expected-files-with-gate.txt actual-files-with-gate.txt

      - name: Upload exact rendered evidence
        uses: actions/upload-artifact@v4
        with:
          name: pr402-current-main-${{ github.run_id }}
          path: |
            discover-contracts.log
            pledge-clarity-focused.log
            repository-tests.log
            repository-lint.log
            production-build.log
            pledge-clarity-playwright.log
            diff-check.log
            actual-files-with-gate.txt
            test-results/discover-pledge-clarity-desktop.png
            test-results/discover-pledge-clarity-mobile.png
          if-no-files-found: error
          retention-days: 30

      - name: Remove this temporary gate and publish the clean head
        shell: bash
        run: |
          set -euo pipefail
          expected_head="$(git rev-parse HEAD)"
          test "$(git ls-remote origin refs/heads/fix/discover-pledge-clarity-20260801 | awk '{print $1}')" = "$expected_head"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/pr402-current-main-pledge-clarity-gates.yml
          git commit -m 'Remove temporary PR 402 current-main gate'
          clean_head="$(git rev-parse HEAD)"
          git fetch origin main
          base="$(git merge-base HEAD origin/main)"
          git diff --name-only "$base" HEAD | sort > /tmp/clean-files.txt
          cat > /tmp/expected-clean-files.txt <<'EOF'
          public/discover/payload/0.txt
          public/discover/payload/1.txt
          public/discover/payload/2.txt
          public/discover/payload/3.txt
          public/discover/payload/4.txt
          public/discover/payload/5.txt
          public/discover/payload/6.txt
          public/discover/payload/manifest.json
          src/discover-pledge-clarity.test.ts
          src/discover/moral-trade-discover.source.html
          tests/discover-pledge-clarity.spec.ts
          EOF
          sort -o /tmp/expected-clean-files.txt /tmp/expected-clean-files.txt
          diff -u /tmp/expected-clean-files.txt /tmp/clean-files.txt
          git push --force-with-lease="refs/heads/fix/discover-pledge-clarity-20260801:$expected_head" \
            origin HEAD:refs/heads/fix/discover-pledge-clarity-20260801
          echo "Clean final head: $clean_head"
