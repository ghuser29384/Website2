name: Materialize and dispatch protected Preview acceptance v3

on:
  push:
    branches:
      - ops/evidence-credibility-shadow-preview-acceptance-20260812
    paths:
      - .github/workflows/materialize-and-dispatch-protected-preview-v3.yml

permissions:
  actions: write
  contents: write

concurrency:
  group: materialize-and-dispatch-protected-preview-v3
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Build a corrected v3 workflow from the durable v2 controller
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path('.github/workflows/evidence-credibility-shadow-protected-preview-acceptance-v2.yml')
          target_path = Path('.github/workflows/evidence-credibility-shadow-protected-preview-acceptance-v3.yml')
          lines = source_path.read_text(encoding='utf-8').splitlines()

          lines[0] = 'name: Evidence credibility protected Preview acceptance v3'
          lines = [
              line.replace(
                  '.github/workflows/evidence-credibility-shadow-protected-preview-acceptance-v2.yml',
                  '.github/workflows/evidence-credibility-shadow-protected-preview-acceptance-v3.yml',
              )
              for line in lines
          ]

          help_matches = [
              index for index, line in enumerate(lines)
              if 'npx vercel@latest curl --help' in line
          ]
          if len(help_matches) != 1:
              raise SystemExit(f'Expected one Vercel curl help line, found {len(help_matches)}.')
          help_index = help_matches[0]
          if not lines[help_index].rstrip().endswith('|| true'):
              lines[help_index] = lines[help_index].rstrip() + ' || true'

          starts = [
              index for index, line in enumerate(lines)
              if line.strip() == 'npx vercel@latest curl "$DEPLOYMENT_URL/login" \\'
          ]
          if len(starts) != 1:
              raise SystemExit(f'Expected one Vercel curl request block, found {len(starts)}.')
          start = starts[0]
          end = None
          for index in range(start, min(start + 20, len(lines))):
              if '2> ../preview-evidence/vercel-curl-stderr.txt' in lines[index]:
                  end = index
                  break
          if end is None:
              raise SystemExit('Could not locate the end of the Vercel curl block.')

          replacement = [
              '          npx vercel@latest curl "$DEPLOYMENT_URL/login" \\',
              '            --token="$VERCEL_TOKEN" \\',
              '            -- \\',
              "            --header 'x-vercel-set-bypass-cookie: true' \\",
              '            --dump-header /tmp/vercel-bypass-headers.txt \\',
              '            --output /tmp/vercel-bypass-body.html \\',
              '            2> ../preview-evidence/vercel-curl-stderr.txt',
          ]
          lines[start:end + 1] = replacement
          target_path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          git diff --check
          grep -q -- '--dump-header /tmp/vercel-bypass-headers.txt' \
            .github/workflows/evidence-credibility-shadow-protected-preview-acceptance-v3.yml
          grep -q 'curl --help.*|| true' \
            .github/workflows/evidence-credibility-shadow-protected-preview-acceptance-v3.yml

      - name: Commit v3 and remove failed repair controllers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/evidence-credibility-shadow-protected-preview-acceptance-v3.yml
          for controller in \
            .github/workflows/repair-and-dispatch-protected-preview-v2.yml \
            .github/workflows/materialize-and-dispatch-protected-preview-v3.yml; do
            test ! -e "$controller" || git rm "$controller"
          done
          git commit -m "fix: pass native curl arguments after the Vercel separator"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Dispatch v3 from the durable branch head
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/dispatch.json
          import json, os
          print(json.dumps({'ref': os.environ['GITHUB_REF_NAME']}))
          PY
          curl --fail-with-body \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/evidence-credibility-shadow-protected-preview-acceptance-v3.yml/dispatches" \
            --data-binary @/tmp/dispatch.json
