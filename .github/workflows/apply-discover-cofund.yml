name: Temporary apply — Discover Co-Funds

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - .github/workflows/apply-discover-cofund.yml
  push:
    branches:
      - feat/discover-cofund-offers-20260731
    paths:
      - .github/workflows/apply-discover-cofund.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]' && (github.event_name != 'pull_request' || github.head_ref == 'feat/discover-cofund-offers-20260731')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out staged feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Apply, generate, verify, and commit Co-Funds
        shell: bash
        run: |
          set -euo pipefail
          expected_base="85660ffc07f6125bd28028a89480c85927d03ae8"
          git merge-base --is-ancestor "$expected_base" HEAD

          cat .github/patches/discover-cofund.patch.b64.* \
            | base64 --decode \
            | gzip --decompress > /tmp/discover-cofund.patch
          echo "1bc7cd848f9b9a5e1b3d7beeb3dbc3a836bc1e9d582b3fb767f20c4df5504116  /tmp/discover-cofund.patch" \
            | sha256sum --check

          git apply --check /tmp/discover-cofund.patch
          git apply /tmp/discover-cofund.patch
          node scripts/pack-discover-payload.mjs
          node --check public/moral-trade-smart-query.js
          npm run verify:discover
          git diff --check

          # The Actions token cannot create, update, or delete workflow files. Preserve
          # the current Smart Query workflow here and leave this temporary workflow for
          # the authenticated GitHub connector to retire after the product commit lands.
          git checkout "$expected_base" -- .github/workflows/smart-query-qa.yml
          rm -f .github/patches/discover-cofund.patch.b64.*
          rmdir .github/patches 2>/dev/null || true

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Co-Funds to Discover offers"
          git push origin HEAD:feat/discover-cofund-offers-20260731
