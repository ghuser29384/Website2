name: Run post-payment Vercel recovery once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/vercel-post-payment-recovery-once.yml

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: vercel-post-payment-recovery
  cancel-in-progress: false

env:
  CONTROLLER_PATH: .github/workflows/vercel-post-payment-recovery-once.yml
  PR_NUMBER: 448

jobs:
  recover:
    if: github.repository == 'ghuser29384/Website2' && github.actor == 'ghuser29384'
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Check out exact recovery commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          token: ${{ github.token }}

      - name: Guard exact one-time scope
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'ghuser29384/Website2'
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$GITHUB_ACTOR" = 'ghuser29384'
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          test -n "$VERCEL_TOKEN"
          changed="$(git diff-tree --no-commit-id --name-only -r HEAD | sed '/^$/d')"
          test "$changed" = "$CONTROLLER_PATH"

      - name: Capture redacted pre-recovery Vercel state
        id: audit
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_COST_CONTROL_MODE: audit
          VERCEL_COST_CONTROL_REPORT: vercel-cost-controls-before.json
        run: node scripts/vercel-admin-cost-controls.mjs

      - name: Apply low-cost settings and unpause moraltrade-site
        id: apply
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_COST_CONTROL_MODE: apply
          VERCEL_COST_CONTROL_REPORT: vercel-cost-controls-apply.json
          DELETE_OBSOLETE_PROJECTS: 'true'
          RESUME_CANONICAL_PROJECT: 'true'
        run: node scripts/vercel-admin-cost-controls.mjs

      - name: Verify account controls and live project state
        id: verify
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_COST_CONTROL_MODE: verify
          VERCEL_COST_CONTROL_REPORT: vercel-cost-controls-after.json
          REQUIRE_WEBSITE2_DISCONNECTED: 'true'
          REQUIRE_OBSOLETE_ABSENT: 'true'
          REQUIRE_CANONICAL_LIVE: 'true'
        run: node scripts/vercel-admin-cost-controls.mjs

      - name: Smoke-test canonical production routes
        id: smoke
        shell: bash
        env:
          VERCEL_COST_CONTROL_MODE: smoke
          VERCEL_COST_CONTROL_REPORT: vercel-production-smoke.json
          VERCEL_PRODUCTION_BASE_URL: https://www.moraltrade.org
          VERCEL_PRODUCTION_SMOKE_ATTEMPTS: '30'
          VERCEL_PRODUCTION_SMOKE_INTERVAL_MS: '10000'
          VERCEL_PRODUCTION_SMOKE_TIMEOUT_MS: '15000'
        run: node scripts/vercel-admin-cost-controls.mjs

      - name: Upload redacted recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vercel-post-payment-recovery-${{ github.run_id }}
          path: |
            vercel-cost-controls-before.json
            vercel-cost-controls-apply.json
            vercel-cost-controls-after.json
            vercel-production-smoke.json
          if-no-files-found: warn
          retention-days: 30

      - name: Record outcome on PR 448
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [[ '${{ steps.audit.outcome }}' == 'success' && '${{ steps.apply.outcome }}' == 'success' && '${{ steps.verify.outcome }}' == 'success' && '${{ steps.smoke.outcome }}' == 'success' ]]; then
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Post-payment account recovery and canonical route smoke passed. A separate runtime-error and 5xx audit is still required before declaring the outage fully resolved. Evidence: $run_url"
          else
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Post-payment Vercel recovery did not complete successfully. No production-restoration claim is made. Step outcomes: audit=${{ steps.audit.outcome }}, apply=${{ steps.apply.outcome }}, verify=${{ steps.verify.outcome }}, smoke=${{ steps.smoke.outcome }}. Evidence: $run_url"
          fi

      - name: Remove one-time recovery controller
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          blob_sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/$CONTROLLER_PATH?ref=main" --jq .sha 2>/dev/null || true)"
          if [[ -n "$blob_sha" ]]; then
            jq -n \
              --arg message 'Remove one-time post-payment Vercel recovery controller' \
              --arg sha "$blob_sha" \
              --arg branch main \
              '{message:$message,sha:$sha,branch:$branch}' \
              | gh api --method DELETE \
                  "repos/$GITHUB_REPOSITORY/contents/$CONTROLLER_PATH" \
                  --input - >/dev/null
          fi

      - name: Enforce verified recovery
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test '${{ steps.audit.outcome }}' = 'success'
          test '${{ steps.apply.outcome }}' = 'success'
          test '${{ steps.verify.outcome }}' = 'success'
          test '${{ steps.smoke.outcome }}' = 'success'
