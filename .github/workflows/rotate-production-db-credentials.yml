name: Rotate production database credentials

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/rotate-production-db-credentials.yml
      - .ops/prod-db-rotation/**

permissions:
  contents: read

concurrency:
  group: rotate-production-database-credentials
  cancel-in-progress: false

jobs:
  rotate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PROD_PROJECT_REF: jnpoxvalyjtdghnperyu
      PROD_POOLER_HOST: aws-1-us-west-2.pooler.supabase.com
      PROD_POOLER_USER: postgres.jnpoxvalyjtdghnperyu
      QA_PROJECT_REF: hvmxfjjbdcgjjudmthdz
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROD_SUPABASE_DB_URL: ${{ secrets.PROD_SUPABASE_DB_URL }}
      PROD_SUPABASE_DB_URL_NEXT: ${{ secrets.PROD_SUPABASE_DB_URL_NEXT }}
      QA_SUPABASE_DB_URL: ${{ secrets.QA_SUPABASE_DB_URL }}
      GH_ADMIN_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
      GITHUB_ADMIN_TOKEN: ${{ secrets.GITHUB_ADMIN_TOKEN }}
      REPO_ADMIN_TOKEN: ${{ secrets.REPO_ADMIN_TOKEN }}
      GITHUB_PAT: ${{ secrets.GITHUB_PAT }}
      GH_PAT: ${{ secrets.GH_PAT }}
      PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
      GITHUB_TOKEN_ADMIN: ${{ secrets.GITHUB_TOKEN_ADMIN }}
      ACTIONS_ADMIN_TOKEN: ${{ secrets.ACTIONS_ADMIN_TOKEN }}
    steps:
      - name: Check out exact rotation branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          show-progress: false
          fetch-depth: 1

      - name: Execute guarded rotation phase
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          phase="$(tr -d '[:space:]' < .ops/prod-db-rotation/phase.txt)"
          case "$phase" in
            preflight|stage|rotate|verify) ;;
            *) echo "::error::Unknown rotation phase: $phase"; exit 1 ;;
          esac

          cleanup_files() {
            rm -f \
              /tmp/github-key.json \
              /tmp/supabase-project.json \
              /tmp/rotation-response.json \
              /tmp/rotation-body.json \
              /tmp/new-db-password \
              /tmp/cross-environment-prod-url \
              /tmp/db-probe.out \
              /tmp/db-probe.err
          }
          trap cleanup_files EXIT

          require_secret() {
            local name="$1"
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required repository secret: $name"
              exit 1
            fi
            echo "::add-mask::${!name}"
          }

          ADMIN_TOKEN=""
          ADMIN_TOKEN_NAME=""
          select_admin_token() {
            local name candidate status
            for name in \
              GH_ADMIN_TOKEN \
              GITHUB_ADMIN_TOKEN \
              REPO_ADMIN_TOKEN \
              GITHUB_PAT \
              GH_PAT \
              PERSONAL_ACCESS_TOKEN \
              GITHUB_TOKEN_ADMIN \
              ACTIONS_ADMIN_TOKEN; do
              candidate="${!name:-}"
              [ -n "$candidate" ] || continue
              echo "::add-mask::$candidate"
              status="$(curl -sS -o /tmp/github-key.json -w '%{http_code}' \
                -H "Authorization: Bearer $candidate" \
                -H 'Accept: application/vnd.github+json' \
                -H 'X-GitHub-Api-Version: 2022-11-28' \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/secrets/public-key" || true)"
              if [ "$status" = "200" ]; then
                ADMIN_TOKEN="$candidate"
                ADMIN_TOKEN_NAME="$name"
                return 0
              fi
            done
            echo "::error::No configured repository-admin token can manage Actions secrets."
            return 1
          }

          validate_supabase_management_access() {
            require_secret SUPABASE_ACCESS_TOKEN
            local status
            status="$(curl -sS -o /tmp/supabase-project.json -w '%{http_code}' \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H 'Accept: application/json' \
              "https://api.supabase.com/v1/projects/$PROD_PROJECT_REF" || true)"
            if [ "$status" != "200" ]; then
              echo "::error::SUPABASE_ACCESS_TOKEN cannot administer the production project (HTTP $status)."
              exit 1
            fi
            jq -e --arg ref "$PROD_PROJECT_REF" '.ref == $ref or .id == $ref' \
              /tmp/supabase-project.json >/dev/null
            rm -f /tmp/supabase-project.json
          }

          assert_production_url() {
            URL_TO_CHECK="$1" node <<'NODE'
          const raw = process.env.URL_TO_CHECK;
          const expected = {
            user: process.env.PROD_POOLER_USER,
            host: process.env.PROD_POOLER_HOST,
          };
          let url;
          try {
            url = new URL(raw);
          } catch {
            console.error('Production database URL is not a valid URL.');
            process.exit(1);
          }
          const valid =
            ['postgres:', 'postgresql:'].includes(url.protocol) &&
            decodeURIComponent(url.username) === expected.user &&
            url.hostname === expected.host &&
            url.port === '5432' &&
            url.pathname === '/postgres' &&
            url.searchParams.get('sslmode') === 'require' &&
            Boolean(url.password);
          if (!valid) {
            console.error('Production database URL does not match the production-only session-pooler contract.');
            process.exit(1);
          }
          NODE
          }

          assert_qa_url() {
            URL_TO_CHECK="$1" node <<'NODE'
          const raw = process.env.URL_TO_CHECK;
          let url;
          try {
            url = new URL(raw);
          } catch {
            console.error('QA database URL is not a valid URL.');
            process.exit(1);
          }
          const valid =
            ['postgres:', 'postgresql:'].includes(url.protocol) &&
            decodeURIComponent(url.username) === `postgres.${process.env.QA_PROJECT_REF}` &&
            url.hostname.endsWith('.pooler.supabase.com') &&
            url.hostname !== process.env.PROD_POOLER_HOST &&
            Boolean(url.password);
          if (!valid) {
            console.error('QA database URL is not scoped to the QA project.');
            process.exit(1);
          }
          NODE
          }

          db_connects() {
            local url="$1"
            rm -f /tmp/db-probe.out /tmp/db-probe.err
            if PGCONNECT_TIMEOUT=10 psql "$url" -v ON_ERROR_STOP=1 -Atqc 'select 1' \
              >/tmp/db-probe.out 2>/tmp/db-probe.err; then
              [ "$(cat /tmp/db-probe.out)" = "1" ]
              return
            fi
            return 1
          }

          build_cross_environment_prod_url() {
            QA_URL="$QA_SUPABASE_DB_URL" node <<'NODE'
          const fs = require('node:fs');
          const qa = new URL(process.env.QA_URL);
          const qaPassword = decodeURIComponent(qa.password);
          const prod = new URL('postgresql://placeholder:placeholder@placeholder:5432/postgres');
          prod.username = process.env.PROD_POOLER_USER;
          prod.password = qaPassword;
          prod.hostname = process.env.PROD_POOLER_HOST;
          prod.port = '5432';
          prod.pathname = '/postgres';
          prod.searchParams.set('sslmode', 'require');
          fs.writeFileSync('/tmp/cross-environment-prod-url', prod.toString(), { mode: 0o600 });
          NODE
          }

          assert_passwords_differ() {
            PROD_URL_TO_COMPARE="$1" QA_URL_TO_COMPARE="$QA_SUPABASE_DB_URL" node <<'NODE'
          const password = (raw) => decodeURIComponent(new URL(raw).password);
          if (password(process.env.PROD_URL_TO_COMPARE) === password(process.env.QA_URL_TO_COMPARE)) {
            console.error('Production and QA still use the same database password.');
            process.exit(1);
          }
          NODE
          }

          verify_environment_isolation() {
            local prod_url="$1" cross_url isolated
            assert_production_url "$prod_url"
            assert_qa_url "$QA_SUPABASE_DB_URL"
            assert_passwords_differ "$prod_url"

            if ! db_connects "$prod_url"; then
              echo "::error::The production-only connection string cannot authenticate."
              exit 1
            fi
            if ! db_connects "$QA_SUPABASE_DB_URL"; then
              echo "::error::The QA connection string no longer authenticates to QA."
              exit 1
            fi

            build_cross_environment_prod_url
            cross_url="$(cat /tmp/cross-environment-prod-url)"
            echo "::add-mask::$cross_url"
            isolated=false
            for attempt in $(seq 1 30); do
              if ! db_connects "$cross_url"; then
                isolated=true
                break
              fi
              sleep 5
            done
            if [ "$isolated" != "true" ]; then
              echo "::error::The QA database password still authenticates to production."
              exit 1
            fi
          }

          if [ "$phase" = "preflight" ]; then
            require_secret PROD_SUPABASE_DB_URL
            require_secret QA_SUPABASE_DB_URL
            validate_supabase_management_access
            select_admin_token

            canary="rotation-preflight-$(openssl rand -hex 12)"
            echo "::add-mask::$canary"
            printf '%s' "$canary" | GH_TOKEN="$ADMIN_TOKEN" \
              gh secret set PROD_DB_ROTATION_PREFLIGHT_CANARY --repo "$GITHUB_REPOSITORY"
            GH_TOKEN="$ADMIN_TOKEN" \
              gh secret delete PROD_DB_ROTATION_PREFLIGHT_CANARY --repo "$GITHUB_REPOSITORY"

            {
              echo '### Production database rotation preflight passed'
              echo
              echo "- Supabase production-project administration: verified"
              echo "- GitHub Actions secret write/delete access: verified via $ADMIN_TOKEN_NAME"
              echo "- Required production and QA connection secrets: present"
              echo "- No credential was rotated in this phase"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ "$phase" = "stage" ]; then
            validate_supabase_management_access
            select_admin_token

            new_password="$(openssl rand -hex 32)"
            next_url="postgresql://${PROD_POOLER_USER}:${new_password}@${PROD_POOLER_HOST}:5432/postgres?sslmode=require"
            echo "::add-mask::$new_password"
            echo "::add-mask::$next_url"
            assert_production_url "$next_url"

            printf '%s' "$next_url" | GH_TOKEN="$ADMIN_TOKEN" \
              gh secret set PROD_SUPABASE_DB_URL_NEXT --repo "$GITHUB_REPOSITORY"
            test "$(GH_TOKEN="$ADMIN_TOKEN" gh secret list --repo "$GITHUB_REPOSITORY" \
              --json name --jq 'map(select(.name == "PROD_SUPABASE_DB_URL_NEXT")) | length')" = "1"

            {
              echo '### Production database credential staged'
              echo
              echo '- A new high-entropy production-only credential was generated inside GitHub Actions.'
              echo '- It is stored only as `PROD_SUPABASE_DB_URL_NEXT`.'
              echo '- Supabase has not been changed yet; the existing credential remains active.'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ "$phase" = "rotate" ]; then
            require_secret PROD_SUPABASE_DB_URL_NEXT
            require_secret QA_SUPABASE_DB_URL
            validate_supabase_management_access
            select_admin_token
            assert_production_url "$PROD_SUPABASE_DB_URL_NEXT"
            assert_qa_url "$QA_SUPABASE_DB_URL"

            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq postgresql-client

            NEW_URL="$PROD_SUPABASE_DB_URL_NEXT" node <<'NODE'
          const fs = require('node:fs');
          const url = new URL(process.env.NEW_URL);
          fs.writeFileSync('/tmp/new-db-password', decodeURIComponent(url.password), { mode: 0o600 });
          NODE
            new_password="$(cat /tmp/new-db-password)"
            echo "::add-mask::$new_password"

            already_rotated=false
            if db_connects "$PROD_SUPABASE_DB_URL_NEXT"; then
              already_rotated=true
            fi

            if [ "$already_rotated" != "true" ]; then
              jq -cn --arg password "$new_password" '{password: $password}' > /tmp/rotation-body.json
              rotation_status="$(curl -sS -o /tmp/rotation-response.json -w '%{http_code}' \
                -X PATCH \
                -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
                -H 'Content-Type: application/json' \
                --data-binary @/tmp/rotation-body.json \
                "https://api.supabase.com/v1/projects/$PROD_PROJECT_REF/database/password" || true)"
              rm -f /tmp/rotation-body.json /tmp/new-db-password
              case "$rotation_status" in
                200|201|202|204) ;;
                *) echo "::error::Supabase rejected the database-password rotation (HTTP $rotation_status)."; exit 1 ;;
              esac
            fi

            connected=false
            for attempt in $(seq 1 60); do
              if db_connects "$PROD_SUPABASE_DB_URL_NEXT"; then
                connected=true
                break
              fi
              sleep 5
            done
            if [ "$connected" != "true" ]; then
              echo "::error::The new production password did not become usable within five minutes."
              exit 1
            fi

            printf '%s' "$PROD_SUPABASE_DB_URL_NEXT" | GH_TOKEN="$ADMIN_TOKEN" \
              gh secret set PROD_SUPABASE_DB_URL --repo "$GITHUB_REPOSITORY"
            test "$(GH_TOKEN="$ADMIN_TOKEN" gh secret list --repo "$GITHUB_REPOSITORY" \
              --json name --jq 'map(select(.name == "PROD_SUPABASE_DB_URL")) | length')" = "1"

            verify_environment_isolation "$PROD_SUPABASE_DB_URL_NEXT"

            {
              echo '### Production database password rotated'
              echo
              echo '- Supabase accepted the new production-only password.'
              echo '- The staged production session-pooler URL authenticates successfully.'
              echo '- `PROD_SUPABASE_DB_URL` was replaced in GitHub Actions.'
              echo '- The QA password still authenticates to QA but no longer authenticates to production.'
              echo '- `PROD_SUPABASE_DB_URL_NEXT` is retained until the independent verification run.'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ "$phase" = "verify" ]; then
            require_secret PROD_SUPABASE_DB_URL
            require_secret PROD_SUPABASE_DB_URL_NEXT
            require_secret QA_SUPABASE_DB_URL
            select_admin_token

            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq postgresql-client

            assert_production_url "$PROD_SUPABASE_DB_URL"
            assert_production_url "$PROD_SUPABASE_DB_URL_NEXT"
            PROD_CURRENT="$PROD_SUPABASE_DB_URL" PROD_NEXT="$PROD_SUPABASE_DB_URL_NEXT" node <<'NODE'
          const password = (raw) => decodeURIComponent(new URL(raw).password);
          if (password(process.env.PROD_CURRENT) !== password(process.env.PROD_NEXT)) {
            console.error('The promoted production secret differs from the staged credential.');
            process.exit(1);
          }
          NODE

            verify_environment_isolation "$PROD_SUPABASE_DB_URL"

            GH_TOKEN="$ADMIN_TOKEN" \
              gh secret delete PROD_SUPABASE_DB_URL_NEXT --repo "$GITHUB_REPOSITORY"
            GH_TOKEN="$ADMIN_TOKEN" \
              gh secret delete PROD_DB_ROTATION_PREFLIGHT_CANARY --repo "$GITHUB_REPOSITORY" \
              >/dev/null 2>&1 || true
            test "$(GH_TOKEN="$ADMIN_TOKEN" gh secret list --repo "$GITHUB_REPOSITORY" \
              --json name --jq 'map(select(.name == "PROD_SUPABASE_DB_URL_NEXT")) | length')" = "0"

            {
              echo '### Production database credential rotation verified and finalized'
              echo
              echo '- The promoted production secret authenticates to the production session pooler.'
              echo '- The QA secret authenticates only to QA.'
              echo '- Production and QA passwords are different.'
              echo '- The temporary staged credential secret was deleted.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
