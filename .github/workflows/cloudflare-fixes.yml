name: Cloudflare candidate checks only
on:
  push:
    branches: [build/cloudflare-fixes-20261020]
permissions:
  contents: read
concurrency:
  group: cloudflare-fixes-20261020
  cancel-in-progress: false
jobs:
  check:
    if: github.repository == 'ghuser29384/Website2' && github.ref == 'refs/heads/build/cloudflare-fixes-20261020'
    strategy:
      fail-fast: false
      matrix:
        application: [moraltrade, normativity]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
      - name: Verify exact base and deployment block
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = a4adf0cbb7029a6316a34478bd27dffad22cbca4
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code HEAD^ HEAD -- src public package.json package-lock.json next.config.ts vercel.ts scripts/vercel-project-config.mjs
          git diff --check HEAD^ HEAD
          node --input-type=module -e 'import assert from "node:assert/strict"; import {buildVercelProjectConfig} from "./scripts/vercel-project-config.mjs"; assert.equal(buildVercelProjectConfig().git.deploymentEnabled,false);'
      - uses: actions/checkout@v4
        if: matrix.application == 'normativity'
        with:
          repository: ghuser29384/WebsiteBuilding2
          ref: 4ee214324976cf579a77bde4788551cfe32f94fb
          path: compatibility-inputs/normativity
          persist-credentials: false
          sparse-checkout: |
            /*
            !/node_modules/
            !/server/node_modules/
          sparse-checkout-cone-mode: false
      - name: Prepare approved dependencies on disposable runner
        shell: bash
        env:
          CF_CANDIDATE: ${{ matrix.application }}
        run: bash scripts/cloudflare-fixes/run.sh prepare
      - name: Build and probe without outbound networking or credentials
        shell: bash
        env:
          CF_CANDIDATE: ${{ matrix.application }}
        run: |
          set -euo pipefail
          sudo unshare --net -- bash -c '
            set -euo pipefail
            ip link set lo up
            exec env -i PATH="$1" HOME="$2/home" CF_CANDIDATE="$3" \
              CF_RUN_ROOT="$2" CF_OFFLINE_NAMESPACE=1 \
              bash "$2/harness/run.sh" offline
          ' _ "$PATH" "$RUNNER_TEMP/cloudflare-$CF_CANDIDATE" "$CF_CANDIDATE"
      - name: Report evidence boundary
        if: always()
        shell: bash
        env:
          CF_CANDIDATE: ${{ matrix.application }}
        run: |
          {
            echo "## $CF_CANDIDATE compatibility candidate"
            echo 'No deployment, production traffic, credentials or full-feature acceptance.'
            result="$RUNNER_TEMP/cloudflare-$CF_CANDIDATE/runtime-result.json"
            if test -f "$result"; then
              echo '```json'
              cat "$result"
              echo '```'
            else
              echo 'Runtime NOT TESTED: an earlier prerequisite failed.'
            fi
            echo 'Normativity RFC 3161/OpenSSL, full database/provider flows and complete migration costs remain unresolved.'
          } >> "$GITHUB_STEP_SUMMARY"
