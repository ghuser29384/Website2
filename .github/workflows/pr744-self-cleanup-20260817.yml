name: Remove temporary PR 744 controller

on:
  push:
    branches:
      - qa/pr743-auth-resolution-exact-head-20260817
    paths:
      - .github/workflows/pr744-self-cleanup-20260817.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  close-and-delete:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Close temporary PR and delete only its controller branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "ghuser29384/Website2"
          test "$GITHUB_REF_NAME" = "qa/pr743-auth-resolution-exact-head-20260817"
          gh api \
            --method PATCH \
            "repos/$GITHUB_REPOSITORY/pulls/744" \
            -f state=closed \
            >/dev/null
          gh api \
            --method DELETE \
            "repos/$GITHUB_REPOSITORY/git/refs/heads/qa/pr743-auth-resolution-exact-head-20260817"
