name: Offer detail layout production 2026-10-03

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/offer-detail-layout-production-20261003.yml

permissions:
  actions: write
  contents: read

concurrency:
  group: offer-detail-layout-production-20261003
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact release candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Verify approved offer layout source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'ghuser29384/Website2'
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git hash-object 'src/app/offers/[offerId]/layout.tsx')" = '469dfeda6ab1d248b9f50c10f132f9179595f871'
          test "$(git hash-object 'src/app/offers/[offerId]/page.tsx')" = '444981d0bfa510dbffb31975b04defab01990474'
          test "$(git hash-object 'src/app/offers/[offerId]/offer-detail.module.css')" = 'c54b3d632a541516d3862e1948ba9747c2544233'
          test "$(git hash-object src/components/marketplace/marketplace-components.tsx)" = '8bb280db393adc9ae879aab311c3f03839ebd5bb'
          test "$(git hash-object src/lib/production-feature-cleanup.test.ts)" = 'a94a6b65b275a4ec248f9e5341e29b00c591aba0'
          test "$(git hash-object src/lib/public-route-smoke.test.ts)" = 'acb1963e421fe546a8fe24d9ff27f383e7d3fe0b'
          git diff --check HEAD^
          remote_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$remote_sha" = "$GITHUB_SHA"

      - name: Dispatch the existing gated production release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/vercel-release.yml" --jq .state)" = 'active'
          jq -n --arg sha "$GITHUB_SHA" \
            '{ref:"main",inputs:{ref:"main",target:"production",expected_sha:$sha,synthetic_auth_fixture_url:""}}' \
            | gh api --method POST \
                -H 'Accept: application/vnd.github+json' \
                -H 'X-GitHub-Api-Version: 2022-11-28' \
                "repos/$GITHUB_REPOSITORY/actions/workflows/vercel-release.yml/dispatches" \
                --input - >/dev/null
