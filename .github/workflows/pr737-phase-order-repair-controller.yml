name: PR 737 adjacent Compact phase-order repair controller

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/pr737-phase-order-repair-controller.yml
      - .github/scripts/pr737_phase_order_repair.py

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: pr737-phase-order-repair-controller
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  TARGET_BRANCH: feature/compact-authoritative-outflow-ledger-v1-20260816
  EXPECTED_TARGET_HEAD: 460336e9b8a0934d06a346f8451837001198c977
  STACK_BASE_SHA: f46178aaad6d2fbd911cc365e2963bb7c73a0098
  TARGET_CONTROLLER_PATH: .github/workflows/repair-pr737-adjacent-compact-phase-order.yml

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out controller source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: controller

      - name: Check out exact target candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.EXPECTED_TARGET_HEAD }}
          path: target

      - name: Verify exact bounded target
        shell: bash
        run: |
          set -euo pipefail
          cd target
          test "$(git rev-parse HEAD)" = "$EXPECTED_TARGET_HEAD"
          test "$(gh api "repos/$GITHUB_REPOSITORY/branches/$TARGET_BRANCH" --jq '.commit.sha')" = "$EXPECTED_TARGET_HEAD"
          test "$(git merge-base "$STACK_BASE_SHA" HEAD)" = "$STACK_BASE_SHA"
          test -f "$TARGET_CONTROLLER_PATH"
          test "$(git rev-parse HEAD^)" = "35bc063fdee4ea151a62e8cee17ab529b3273b14"
          test "$(git diff --name-only HEAD^...HEAD)" = "$TARGET_CONTROLLER_PATH"

      - name: Transform, verify, commit, and push
        shell: bash
        run: |
          set -euo pipefail
          python3 controller/.github/scripts/pr737_phase_order_repair.py target
          cd target
          git rm "$TARGET_CONTROLLER_PATH"

          cat > /tmp/expected.txt <<'EOF'
          .github/workflows/compact-authoritative-outflow-ledger-qa.yml
          .github/workflows/mpgf-public-goods-compacts-qa.yml
          docs/mpgf/compact-authoritative-outflow-ledger-v1.md
          scripts/test-compact-authoritative-outflow-concurrency.sh
          src/components/mpgf/mpgf-public-goods-compacts.tsx
          src/lib/mpgf/compact-authoritative-outflow-contract.test.ts
          src/lib/mpgf/compact-authoritative-outflow-phase-order-contract.test.ts
          src/lib/mpgf/compact-authoritative-outflow.test.ts
          src/lib/mpgf/compact-authoritative-outflow.ts
          supabase/migrations/20260816141500_compact_authoritative_outflow_ledger_v1.sql
          supabase/migrations/20260816141501_compact_authoritative_outflow_freeze_v1.sql
          supabase/migrations/20260816141502_compact_authoritative_outflow_hardening_v1.sql
          supabase/migrations/20260816141503_compact_authoritative_outflow_replay_fix_v1.sql
          supabase/tests/compact_authoritative_outflow_ledger_authorization.sql
          supabase/tests/compact_authoritative_outflow_ledger_core.sql
          tests/mpgf-public-goods-compacts.spec.ts
          EOF
          sed -i 's/^          //' /tmp/expected.txt
          sort -o /tmp/expected.txt /tmp/expected.txt
          git diff --name-only "$STACK_BASE_SHA" | sort > /tmp/actual.txt
          diff -u /tmp/expected.txt /tmp/actual.txt
          test "$(wc -l < /tmp/actual.txt)" -eq 16
          grep -Fq 'Apply the four authoritative-ledger migrations after legacy Compact validation' .github/workflows/mpgf-public-goods-compacts-qa.yml
          grep -Fq '.github/workflows/mpgf-public-goods-compacts-qa.yml' .github/workflows/compact-authoritative-outflow-ledger-qa.yml
          grep -Fq 'test "$(wc -l < /tmp/actual.txt)" -eq 16' .github/workflows/compact-authoritative-outflow-ledger-qa.yml
          grep -Fq 'adjacent Compact QA runs legacy regressions before ledger authority hardening' src/lib/mpgf/compact-authoritative-outflow-phase-order-contract.test.ts
          git diff --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/compact-authoritative-outflow-ledger-qa.yml \
            .github/workflows/mpgf-public-goods-compacts-qa.yml \
            src/lib/mpgf/compact-authoritative-outflow-phase-order-contract.test.ts
          git commit -m "ci: phase-order adjacent Compact regressions"
          git push origin "HEAD:$TARGET_BRANCH"

      - name: Record bounded repair
        shell: bash
        run: |
          set -euo pipefail
          new_head="$(gh api "repos/$GITHUB_REPOSITORY/branches/$TARGET_BRANCH" --jq '.commit.sha')"
          body="PR #737 adjacent Compact QA phase ordering was repaired in candidate \`$new_head\`. Legacy Compact lifecycle and concurrency regressions now run before the four authoritative-ledger migrations; final-schema types, lint, and no-money assertions run afterward. The temporary target controller was removed. No merge, deployment, persistent migration, provider request, Compact activation, electorate opening, or money movement occurred."
          gh pr comment 737 --repo "$GITHUB_REPOSITORY" --body "$body"
          gh issue comment 734 --repo "$GITHUB_REPOSITORY" --body "$body"
