name: Generate authoritative pre-activation Supabase baseline

on:
  push:
    branches:
      - database/preactivation-schema-baseline-20260818
    paths:
      - scripts/database/generate-preactivation-baseline.trigger
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: preactivation-baseline-generation
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      SOURCE_HEAD: ${{ github.sha }}
      SOURCE_MAIN: f1cd364bf058b28b3b29501aa6528c48f8f39bb7
      TARGET_BRANCH: database/preactivation-schema-baseline-20260818
      PROD_POOLER_HOST: aws-1-us-west-2.pooler.supabase.com
      PROD_POOLER_USER: postgres.jnpoxvalyjtdghnperyu
      PROD_SUPABASE_DB_URL: ${{ secrets.PROD_SUPABASE_DB_URL }}

    steps:
      - name: Check out exact generator source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact repository dependencies
        run: npm ci

      - name: Generate, verify, commit, and push the baseline
        id: generate
        shell: bash
        run: |
          set -euo pipefail
          test -n "${PROD_SUPABASE_DB_URL:-}"
          bash scripts/database/generate-preactivation-baseline.sh

      - name: Package privacy-safe generation evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          EVIDENCE="${RUNNER_TEMP}/preactivation-baseline-${GITHUB_RUN_ID}"
          mkdir -p evidence
          if [[ -d "$EVIDENCE/manifests" ]]; then
            cp -R "$EVIDENCE/manifests" evidence/
          fi
          if [[ -d "$EVIDENCE/logs" ]]; then
            cp -R "$EVIDENCE/logs" evidence/
          fi
          if grep -RIl \
              'postgresql\?://\|eyJ[A-Za-z0-9_-]\{20,\}' \
              evidence 2>/dev/null > evidence/credential-scan-matches.txt; then
            test ! -s evidence/credential-scan-matches.txt
          fi
          find evidence -type f -print0 | sort -z | xargs -0 -r sha256sum \
            > evidence/artifact-sha256.txt

      - name: Upload generation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preactivation-baseline-generation-${{ github.run_id }}
          path: evidence
          if-no-files-found: warn
          retention-days: 21
