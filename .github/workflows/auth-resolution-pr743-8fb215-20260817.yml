# One-use controller for immutable PR #743 candidate
# 8fb215b27c07c1bbc25f5bec84e323e8eb1c2a37. Never merge this workflow.
name: Exact-head PR 743 auth-resolution verification

on:
  push:
    branches:
      - qa/auth-resolution-pr743-8fb215-20260817
    paths:
      - .github/workflows/auth-resolution-pr743-8fb215-20260817.yml

permissions:
  contents: read

concurrency:
  group: auth-resolution-pr743-8fb215-20260817
  cancel-in-progress: false

jobs:
  exact-head-verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    env:
      EXPECTED_BASE_SHA: 7e993158363710e5fe2c3eaa1cbccdb5cd56c235
      EXPECTED_HEAD_SHA: 8fb215b27c07c1bbc25f5bec84e323e8eb1c2a37
      EXPECTED_TREE_SHA: 3bff442637bfa6855ab5649cbf0566a01788d30e
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3211
      SITE_URL: http://127.0.0.1:3211
      PLAYWRIGHT_HTML_OPEN: never

    steps:
      - name: Check out immutable PR 743 candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: 8fb215b27c07c1bbc25f5bec84e323e8eb1c2a37

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Guard exact commit, tree, base, and scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE_SHA"
          test "$(git merge-base "$EXPECTED_BASE_SHA" HEAD)" = "$EXPECTED_BASE_SHA"
          git diff --check "$EXPECTED_BASE_SHA" HEAD
          {
            printf 'base=%s\n' "$EXPECTED_BASE_SHA"
            printf 'head=%s\n' "$(git rev-parse HEAD)"
            printf 'tree=%s\n' "$(git rev-parse HEAD^{tree})"
            printf 'run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'run_attempt=%s\n' "$GITHUB_RUN_ATTEMPT"
          } | tee auth-resolution-exact-head.txt
          git diff --name-only "$EXPECTED_BASE_SHA" HEAD | sort \
            | tee auth-resolution-changed-files.txt
          cat > /tmp/expected-files.txt <<'EOF'
          playwright.auth-resolution.config.ts
          scripts/auth-resolution-supabase.mjs
          src/app/profile/page.tsx
          src/auth-resolution-wiring.test.ts
          src/components/core-trade/trade-draft-workbench.tsx
          src/components/marketplace/marketplace-components.tsx
          src/lib/app-data.ts
          src/lib/auth-resolution.test.ts
          src/lib/auth-resolution.ts
          src/lib/supabase/server.ts
          tests/auth-resolution-delayed.auth.ts
          EOF
          sed -i 's/^          //' /tmp/expected-files.txt
          diff -u /tmp/expected-files.txt auth-resolution-changed-files.txt

      - name: Install exact dependencies
        run: npm ci

      - name: Run source, repository, type, and production-build gates
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/auth-resolution-supabase.mjs
          node --import tsx --test \
            src/lib/auth-resolution.test.ts \
            src/auth-resolution-wiring.test.ts \
            | tee auth-resolution-focused.log
          npm test | tee auth-resolution-unit.log
          npm run lint -- --quiet | tee auth-resolution-lint.log
          npx tsc --noEmit --pretty false | tee auth-resolution-typescript.log
          npm run build | tee auth-resolution-build.log

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run the dedicated delayed-auth browser suite
        shell: bash
        run: |
          set -uo pipefail
          rm -rf auth-resolution-test-results test-results/auth-resolution
          set +e
          PLAYWRIGHT_JSON_OUTPUT_NAME=auth-resolution-playwright.json \
            npx playwright test \
              --config=playwright.auth-resolution.config.ts \
              --reporter=line,json \
              | tee auth-resolution-playwright.log
          status=${PIPESTATUS[0]}
          set -e
          if [[ -d test-results/auth-resolution ]]; then
            cp -R test-results/auth-resolution auth-resolution-test-results
          fi
          exit "$status"

      - name: Run the complete credential-free release-browser suite
        shell: bash
        run: |
          set -uo pipefail
          rm -rf release-browser-test-results test-results playwright-report
          set +e
          CI=true PLAYWRIGHT_USE_PRODUCTION_SERVER=1 \
            npm run test:e2e:release -- --reporter=line \
            | tee auth-resolution-release-browser.log
          status=${PIPESTATUS[0]}
          set -e
          if [[ -d test-results ]]; then
            cp -R test-results release-browser-test-results
          fi
          exit "$status"

      - name: Scan generated evidence for secret material
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          roots = [
              Path('auth-resolution-playwright.json'),
              Path('auth-resolution-playwright.log'),
              Path('auth-resolution-release-browser.log'),
              Path('auth-resolution-test-results'),
              Path('release-browser-test-results'),
              Path('playwright-report'),
          ]
          patterns = {
              'jwt': re.compile(r'eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{10,}'),
              'bearer': re.compile(r'Bearer\s+[A-Za-z0-9._~+/-]{20,}', re.I),
              'postgres_url': re.compile(r'postgres(?:ql)?://[^\s"\']+', re.I),
              'private_key': re.compile(r'-----BEGIN [A-Z ]*PRIVATE KEY-----'),
              'stripe_secret': re.compile(r'(?:sk_live_|rk_live_|whsec_)[A-Za-z0-9_=-]{12,}'),
              'supabase_secret': re.compile(r'(?:sb_secret_|service_role)[A-Za-z0-9._-]{16,}', re.I),
              'auth_cookie_value': re.compile(r'sb-[a-z0-9]+-auth-token["\']?\s*[:=]\s*["\'][^"\']{20,}', re.I),
          }

          scanned = 0
          findings = []
          for root in roots:
              if not root.exists():
                  continue
              files = [root] if root.is_file() else [path for path in root.rglob('*') if path.is_file()]
              for path in files:
                  if path.suffix.lower() in {'.png', '.jpg', '.jpeg', '.webp', '.zip', '.gz'}:
                      continue
                  try:
                      text = path.read_text(encoding='utf-8', errors='ignore')
                  except OSError:
                      continue
                  scanned += 1
                  for name, pattern in patterns.items():
                      if pattern.search(text):
                          findings.append({'file': str(path), 'pattern': name})

          result = {
              'version': 1,
              'scannedFiles': scanned,
              'secretsIncluded': bool(findings),
              'findings': findings,
          }
          Path('auth-resolution-privacy-scan.json').write_text(
              json.dumps(result, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          if findings:
              raise SystemExit('Generated evidence contains one or more secret-pattern matches.')
          PY

      - name: Upload immutable exact-head evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auth-resolution-pr743-8fb215-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            auth-resolution-*.txt
            auth-resolution-*.log
            auth-resolution-*.json
            auth-resolution-test-results
            release-browser-test-results
            playwright-report
