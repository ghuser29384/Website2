name: Materialize direct verified Donation Upgrade

on:
  push:
    branches:
      - feature/direct-verified-donation-upgrade-20260731
    paths:
      - .github/workflows/materialize-direct-donation-upgrade.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/materialize-direct-donation-upgrade.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-direct-donation-upgrade
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TARGET_BRANCH: feature/direct-verified-donation-upgrade-20260731
      EXPECTED_BASE: 8181eed1c0cf075f01ebd22c88d4a8cce441c19d
      PAYLOAD_SHA256: c49f4ccbbea7580600809184382a6bc2da7da5528e9821c768637222a8d262a6
    steps:
      - name: Check out the exact feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/direct-verified-donation-upgrade-20260731
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Verify and materialize the exact candidate
        shell: bash
        run: |
          set -euo pipefail
          # The payload includes the matcher-first / creator-default lifecycle repair and regression.

          git fetch origin main
          git merge-base --is-ancestor "$EXPECTED_BASE" HEAD
          test "$(git merge-base "$EXPECTED_BASE" HEAD)" = "$EXPECTED_BASE"

          payload_dir=.github/direct-upgrade-payload
          test -d "$payload_dir"
          test "$(find "$payload_dir" -maxdepth 1 -type f -name 'part-*' | wc -l | tr -d '[:space:]')" = "7"

          cat > /tmp/direct-upgrade-parts.sha256 <<'EOF'
          7f02793a23a0da9080de420b6eb658b068e8845f7ca682cc421695e8ac898278  part-000
          9ad1c55d26dc15371765829b359a26326aac02904ac7284ce6e8a8767fbadaac  part-001
          2a5f51da31f9142e233bddb7aa62302f754ea049edfb82c491a2b757d833f9ab  part-002
          bd4ebe2d99157cd6b5e5b62111845b2250faa924e8fad28d3ac322e630e00570  part-003
          a8415476c21c1d1c6df8083f96e57d5403fb8192af39b2a98d943a8926ad8778  part-004
          3c2e5b842b832c41b55e75c6c53c3a68eacc4458d2ab7be531262359049cf913  part-005
          89ba0b8d65125867757f084c0d125b85b071556f1a8e2689705f8b010d4baff0  part-006
          EOF
          (
            cd "$payload_dir"
            sha256sum -c /tmp/direct-upgrade-parts.sha256
            test "$(wc -c < part-000 | tr -d '[:space:]')" = "16000"
            test "$(wc -c < part-001 | tr -d '[:space:]')" = "16000"
            test "$(wc -c < part-002 | tr -d '[:space:]')" = "16000"
            test "$(wc -c < part-003 | tr -d '[:space:]')" = "16000"
            test "$(wc -c < part-004 | tr -d '[:space:]')" = "16000"
            test "$(wc -c < part-005 | tr -d '[:space:]')" = "16000"
            test "$(wc -c < part-006 | tr -d '[:space:]')" = "5908"
            cat part-* | base64 --decode > /tmp/direct-upgrade-candidate.tgz
          )
          echo "$PAYLOAD_SHA256  /tmp/direct-upgrade-candidate.tgz" | sha256sum -c -

          cat > /tmp/expected-direct-upgrade-paths.txt <<'EOF'
          .env.example
          .github/workflows/direct-donation-upgrade-gates.yml
          .github/workflows/direct-donation-upgrade-qa.yml
          docs/direct-verified-donation-upgrade.md
          scripts/vercel-project-config.mjs
          scripts/vercel-project-config.test.mjs
          src/app/admin/donation-upgrades/page.tsx
          src/app/admin/page.tsx
          src/app/api/connectors/every-org/[secret]/route.ts
          src/app/api/donation-upgrades/nonprofits/search/route.ts
          src/app/api/jobs/donation-upgrades/route.ts
          src/app/connectors/page.tsx
          src/app/direct-donation-upgrade-actions.ts
          src/app/donation-upgrades/[offerId]/page.tsx
          src/app/donation-upgrades/page.tsx
          src/app/sitemap.ts
          src/app/trades/new/conditional-donation.tsx
          src/components/donation-upgrades/direct-upgrade-deadline-field.tsx
          src/components/donation-upgrades/every-org-nonprofit-selector.tsx
          src/lib/direct-donation-upgrade-data.ts
          src/lib/direct-donation-upgrade-source-contract.test.ts
          src/lib/direct-donation-upgrade-webhook.ts
          src/lib/direct-donation-upgrade.test.ts
          src/lib/direct-donation-upgrade.ts
          supabase/migrations/20260801050000_direct_verified_donation_upgrades.sql
          supabase/tests/direct_verified_donation_upgrade.sql
          EOF
          sort -o /tmp/expected-direct-upgrade-paths.txt /tmp/expected-direct-upgrade-paths.txt

          tar -tzf /tmp/direct-upgrade-candidate.tgz \
            | sed 's#^\./##' \
            | sed '/\/$/d' \
            | sort -u > /tmp/archive-direct-upgrade-paths.txt
          diff -u /tmp/expected-direct-upgrade-paths.txt /tmp/archive-direct-upgrade-paths.txt

          tar -xzf /tmp/direct-upgrade-candidate.tgz -C .
          rm -rf "$payload_dir"
          rm -f .github/workflows/materialize-direct-donation-upgrade.yml
          sed -i 's/[[:space:]]\+$//' .github/workflows/direct-donation-upgrade-gates.yml

          node --check scripts/vercel-project-config.mjs
          node --check scripts/vercel-project-config.test.mjs

          git add -A
          git diff --cached --check "$EXPECTED_BASE"
          git diff --cached --name-only "$EXPECTED_BASE" | sort -u > /tmp/index-direct-upgrade-paths.txt
          diff -u /tmp/expected-direct-upgrade-paths.txt /tmp/index-direct-upgrade-paths.txt

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Implement direct verified Donation Upgrade'
          git push origin "HEAD:${TARGET_BRANCH}"
