name: Dispatch institutional QA

on:
  push:
    branches:
      - feat/institutional-trade-system
    paths:
      - .github/workflows/dispatch-institutional-qa.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: dispatch-institutional-qa
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: feat/institutional-trade-system
      EXPECTED_TREE_SHA: 839043f9e1399001789fdbbf8ae5361ea27a4d34
      QA_PROJECT_REF: hvmxfjjbdcgjjudmthdz
      QA_WORKFLOW: institutional-trade-qa.yml
      PR_NUMBER: "212"
    steps:
      - name: Check out exact feature head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Confirm imported tree and remove dispatcher
        id: exact_head
        shell: bash
        run: |
          set -euo pipefail
          tree_sha="$(git rev-parse 'HEAD^{tree}')"
          if [[ "$tree_sha" != "$EXPECTED_TREE_SHA" ]]; then
            echo "Expected imported tree $EXPECTED_TREE_SHA, got $tree_sha" >&2
            exit 1
          fi

          rm -f .github/workflows/dispatch-institutional-qa.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove temporary institutional QA dispatcher"
          git push origin HEAD:"$BRANCH"

          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tree_sha=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"

      - name: Build exact workflow-dispatch inputs
        id: inputs
        env:
          HEAD_SHA: ${{ steps.exact_head.outputs.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path('.github/workflows/institutional-trade-qa.yml')
          if not path.exists():
              raise SystemExit(f'Missing {path}')

          lines = path.read_text(encoding='utf-8').splitlines()
          inputs = {}
          in_dispatch = False
          in_inputs = False
          current = None
          records = {}

          for raw in lines:
              stripped = raw.strip()
              indent = len(raw) - len(raw.lstrip(' '))
              if indent == 2 and stripped == 'workflow_dispatch:':
                  in_dispatch = True
                  in_inputs = False
                  current = None
                  continue
              if in_dispatch and indent == 4 and stripped == 'inputs:':
                  in_inputs = True
                  continue
              if in_dispatch and indent <= 2 and stripped and stripped != 'workflow_dispatch:':
                  in_dispatch = False
                  in_inputs = False
                  current = None
              if not in_inputs:
                  continue
              if indent == 6 and stripped.endswith(':'):
                  current = stripped[:-1]
                  records[current] = {}
                  continue
              if current and indent >= 8 and ':' in stripped:
                  key, value = stripped.split(':', 1)
                  records[current][key.strip()] = value.strip().strip('"\'')

          qa_ref = os.environ['QA_PROJECT_REF']
          head_sha = os.environ['HEAD_SHA']
          for name, metadata in records.items():
              lowered = name.lower()
              default = metadata.get('default')
              required = metadata.get('required', '').lower() == 'true'
              if 'sha' in lowered or 'head' in lowered or 'commit' in lowered:
                  inputs[name] = head_sha
              elif 'confirm' in lowered or ('project' in lowered and 'ref' in lowered) or lowered in {'target', 'qa_ref'}:
                  inputs[name] = qa_ref
              elif default not in (None, ''):
                  if metadata.get('type') == 'boolean':
                      inputs[name] = default.lower() == 'true'
                  else:
                      inputs[name] = default
              elif required:
                  raise SystemExit(f'Cannot safely infer required workflow input: {name}')

          Path('/tmp/dispatch-inputs.json').write_text(json.dumps(inputs), encoding='utf-8')
          print(json.dumps(inputs, indent=2, sort_keys=True))
          PY
          echo "inputs=$(cat /tmp/dispatch-inputs.json)" >> "$GITHUB_OUTPUT"

      - name: Dispatch isolated-QA workflow
        id: dispatch
        env:
          HEAD_SHA: ${{ steps.exact_head.outputs.head_sha }}
          INPUTS_JSON: ${{ steps.inputs.outputs.inputs }}
        shell: bash
        run: |
          set -euo pipefail
          dispatched_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          jq -n \
            --arg ref "$BRANCH" \
            --argjson inputs "$INPUTS_JSON" \
            '{ref: $ref, inputs: $inputs}' > /tmp/dispatch.json

          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/${QA_WORKFLOW}/dispatches" \
            --input /tmp/dispatch.json

          run_id=""
          for _ in $(seq 1 30); do
            run_id="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow "$QA_WORKFLOW" \
              --branch "$BRANCH" \
              --event workflow_dispatch \
              --limit 20 \
              --json databaseId,headSha,createdAt \
              --jq ".[] | select(.headSha == \"$HEAD_SHA\" and .createdAt >= \"$dispatched_at\") | .databaseId" \
              | head -n 1)"
            if [[ -n "$run_id" ]]; then
              break
            fi
            sleep 5
          done

          if [[ -z "$run_id" ]]; then
            echo "Could not identify the dispatched QA run." >&2
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Wait for complete institutional QA
        id: wait
        env:
          RUN_ID: ${{ steps.dispatch.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          gh run watch "$RUN_ID" --repo "$GITHUB_REPOSITORY" --exit-status
          gh run view "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --json url,headSha,status,conclusion \
            > /tmp/qa-result.json
          cat /tmp/qa-result.json
          echo "url=$(jq -r .url /tmp/qa-result.json)" >> "$GITHUB_OUTPUT"
          echo "head_sha=$(jq -r .headSha /tmp/qa-result.json)" >> "$GITHUB_OUTPUT"
          echo "conclusion=$(jq -r .conclusion /tmp/qa-result.json)" >> "$GITHUB_OUTPUT"

      - name: Record QA dispatch evidence on PR
        if: always() && steps.dispatch.outputs.run_id != ''
        env:
          RUN_ID: ${{ steps.dispatch.outputs.run_id }}
          QA_URL: ${{ steps.wait.outputs.url }}
          QA_HEAD: ${{ steps.wait.outputs.head_sha }}
          QA_CONCLUSION: ${{ steps.wait.outputs.conclusion }}
          IMPORTED_TREE: ${{ steps.exact_head.outputs.tree_sha }}
        shell: bash
        run: |
          set -euo pipefail
          body=$(cat <<EOF
          ## Institutional QA dispatch

          - Exact imported tree: \`$IMPORTED_TREE\`
          - QA workflow run: ${QA_URL:-https://github.com/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}}
          - Tested head: \`${QA_HEAD:-unknown}\`
          - Conclusion: **${QA_CONCLUSION:-running-or-failed-before-result-capture}**

          PR remains in draft. No production migration or production data mutation was authorized.
          EOF
          )
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$body"
