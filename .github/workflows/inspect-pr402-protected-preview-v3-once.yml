name: Inspect PR 402 protected preview v3 once

on:
  push:
    branches:
      - ops/inspect-pr402-protected-preview-20260802-v3
    paths:
      - .github/workflows/inspect-pr402-protected-preview-v3-once.yml

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: inspect-pr402-protected-preview-v3-once
  cancel-in-progress: false

jobs:
  inspect:
    if: github.repository == 'ghuser29384/Website2'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OPS_BRANCH: ops/inspect-pr402-protected-preview-20260802-v3
      WORKFLOW_PATH: .github/workflows/inspect-pr402-protected-preview-v3-once.yml
      RESULT_PATH: .ops-evidence/pr402-protected-preview-v3.json
      TARGET_BRANCH: fix/discover-pledge-clarity-20260801
      EXPECTED_HEAD: b4f2443b95ce32f9c28ad007d7524c6498252bd6
      PREVIEW_DEPLOYMENT_ID: dpl_2m4vCJej3NGzY3dfpxa2JUmK6Pwr
      PREVIEW_URL: https://moraltrade-site-o9tplekqr-ellen-s.vercel.app
      VERCEL_ORG_ID: team_ySu6sF3Uho1E1GnJtCQPVEuJ
      VERCEL_PROJECT_ID: prj_Em3j7Uj7RatX2R1ZYhla3XSHRde7

    steps:
      - name: Check out exact PR 402 head
        uses: actions/checkout@v4
        with:
          ref: fix/discover-pledge-clarity-20260801
          fetch-depth: 0

      - name: Guard exact source and deployment identity
        id: guard
        continue-on-error: true
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')" = "$EXPECTED_HEAD"
          test -n "$VERCEL_TOKEN"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v13/deployments/$PREVIEW_DEPLOYMENT_ID?teamId=$VERCEL_ORG_ID" \
            > /tmp/pr402-deployment.json
          node - <<'NODE'
          const fs = require('node:fs');
          const deployment = JSON.parse(fs.readFileSync('/tmp/pr402-deployment.json', 'utf8'));
          const id = deployment.id ?? deployment.uid;
          const state = deployment.readyState ?? deployment.state;
          const sha = deployment.meta?.githubCommitSha;
          if (id !== process.env.PREVIEW_DEPLOYMENT_ID) throw new Error(`Wrong deployment: ${id}`);
          if (state !== 'READY') throw new Error(`Deployment is not READY: ${state}`);
          if (deployment.target != null) throw new Error(`Expected Preview target: ${deployment.target}`);
          if (sha !== process.env.EXPECTED_HEAD) throw new Error(`Wrong deployed SHA: ${sha}`);
          fs.writeFileSync('/tmp/pr402-guard-evidence.json', JSON.stringify({
            deploymentId: id,
            commit: sha,
            state,
            target: deployment.target ?? null,
            url: process.env.PREVIEW_URL,
          }, null, 2));
          NODE

      - name: Use Node 24
        if: steps.guard.outcome == 'success'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies and Chromium
        id: install
        if: steps.guard.outcome == 'success'
        continue-on-error: true
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Create temporary Vercel automation bypass
        id: bypass
        if: steps.guard.outcome == 'success' && steps.install.outcome == 'success'
        continue-on-error: true
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          secret="$(python3 - <<'PY'
          import secrets, string
          alphabet = string.ascii_letters + string.digits
          print(''.join(secrets.choice(alphabet) for _ in range(32)))
          PY
          )"
          test "${#secret}" -eq 32
          echo "::add-mask::$secret"
          printf '%s' "$secret" > /tmp/pr402-bypass-secret
          jq -n --arg secret "$secret" \
            '{generate:{secret:$secret,note:"Temporary PR 402 exact-preview QA v3"}}' \
            > /tmp/pr402-generate-bypass.json
          curl --fail --silent --show-error \
            --request PATCH \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/pr402-generate-bypass.json \
            "https://api.vercel.com/v1/projects/$VERCEL_PROJECT_ID/protection-bypass?teamId=$VERCEL_ORG_ID" \
            > /tmp/pr402-generate-bypass-response.json
          rm -f /tmp/pr402-generate-bypass.json /tmp/pr402-generate-bypass-response.json

      - name: Inspect exact desktop and mobile Preview
        id: browser
        if: steps.bypass.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          secret="$(cat /tmp/pr402-bypass-secret)"
          echo "::add-mask::$secret"
          VERCEL_AUTOMATION_BYPASS_SECRET="$secret" node --input-type=module <<'NODE' 2>&1 | tee /tmp/pr402-browser.log
          import fs from 'node:fs';
          import { chromium } from '@playwright/test';

          const base = process.env.PREVIEW_URL;
          const secret = process.env.VERCEL_AUTOMATION_BYPASS_SECRET;
          const path = '/discover?domain=pools&view=threshold&query=Find+pools&selected=pool-wild-research&selectedType=pool#discover';
          const target = new URL(path, base).href;
          const origin = new URL(base).origin;
          const evidence = { desktop: null, mobile390x844: null, errors: [] };

          function invariant(condition, message) {
            if (!condition) throw new Error(message);
          }

          async function inspect(viewport, mobile, screenshotPath) {
            const browser = await chromium.launch();
            const context = await browser.newContext({
              viewport,
              extraHTTPHeaders: {
                'x-vercel-protection-bypass': secret,
                'x-vercel-set-bypass-cookie': 'true',
              },
            });
            const page = await context.newPage();
            const pageErrors = [];
            const consoleErrors = [];
            const failedRequests = [];
            const badResponses = [];
            page.on('pageerror', error => pageErrors.push(error.message));
            page.on('console', message => {
              if (message.type() === 'error') consoleErrors.push(message.text());
            });
            page.on('requestfailed', request => {
              if (request.url().startsWith(origin)) {
                failedRequests.push(`${request.method()} ${request.url()} ${request.failure()?.errorText ?? ''}`);
              }
            });
            page.on('response', response => {
              if (response.url().startsWith(origin) && response.status() >= 400) {
                badResponses.push(`${response.status()} ${response.request().method()} ${response.url()}`);
              }
            });

            try {
              const response = await page.goto(target, { waitUntil: 'domcontentloaded', timeout: 45000 });
              invariant(response?.status() === 200, `Navigation status: ${response?.status()}`);
              await page.getByRole('heading', { name: /Wild-animal-suffering priority research pool/i }).waitFor();
              await page.getByRole('heading', { name: 'Preview your conditional pledge' }).waitFor();
              const slider = page.locator('[data-pledge-range][data-pool-id="pool-wild-research"]:visible').last();
              await slider.waitFor();
              await slider.evaluate(element => {
                element.value = '35';
                element.dispatchEvent(new Event('input', { bubbles: true }));
              });
              await page.getByText('0.43% of current gap', { exact: true }).first().waitFor();
              await page.getByText('$8,165 remains', { exact: true }).first().waitFor();
              await page.getByText('This is arithmetic, not a forecast of other contributors.', { exact: true }).first().waitFor();
              await page.getByText('Moving the slider does not save a pledge or authorize payment.', { exact: true }).first().waitFor();
              invariant(await page.getByText(/pivotality/i).count() === 0, 'Pivotality copy remains.');
              invariant(await page.getByText(/How likely am I to be pivotal/i).count() === 0, 'Pivotality question remains.');

              if (mobile) {
                const sheet = page.locator('.inspector.mobile-sheet');
                await sheet.waitFor();
                invariant(await sheet.isVisible(), 'Mobile inspector is hidden.');
                const bounds = await sheet.boundingBox();
                invariant(bounds, 'Mobile inspector has no bounds.');
                invariant(bounds.x >= -1, `Mobile inspector starts outside viewport: ${bounds.x}`);
                invariant(bounds.x + bounds.width <= viewport.width + 1, 'Mobile inspector exceeds viewport.');
                invariant(await sheet.evaluate(el => el.scrollWidth - el.clientWidth) <= 1, 'Mobile sheet overflows horizontally.');
                invariant(await page.locator('html').evaluate(el => el.scrollWidth - el.clientWidth) <= 1, 'Document overflows horizontally.');
              }

              await page.waitForTimeout(750);
              invariant(pageErrors.length === 0, `Page errors: ${pageErrors.join(' | ')}`);
              invariant(consoleErrors.length === 0, `Console errors: ${consoleErrors.join(' | ')}`);
              invariant(failedRequests.length === 0, `Failed same-origin requests: ${failedRequests.join(' | ')}`);
              invariant(badResponses.length === 0, `Bad same-origin responses: ${badResponses.join(' | ')}`);
              await page.screenshot({ path: screenshotPath, fullPage: true });
              return {
                status: 'passed',
                viewport,
                copy: {
                  pledge: '$35',
                  remaining: '$8,165 remains',
                  share: '0.43% of current gap',
                  nonForecast: true,
                  nonAuthorizing: true,
                  pivotalityAbsent: true,
                },
                pageErrors: 0,
                consoleErrors: 0,
                sameOriginRequestFailures: 0,
                sameOriginHttpErrors: 0,
              };
            } finally {
              await context.close();
              await browser.close();
            }
          }

          try {
            evidence.desktop = await inspect({ width: 1440, height: 900 }, false, '/tmp/pr402-preview-desktop.png');
            evidence.mobile390x844 = await inspect({ width: 390, height: 844 }, true, '/tmp/pr402-preview-mobile.png');
            evidence.status = 'passed';
            fs.writeFileSync('/tmp/pr402-browser-evidence.json', JSON.stringify(evidence, null, 2));
          } catch (error) {
            evidence.status = 'failed';
            evidence.errors.push(error instanceof Error ? error.message : String(error));
            fs.writeFileSync('/tmp/pr402-browser-evidence.json', JSON.stringify(evidence, null, 2));
            throw error;
          }
          NODE

      - name: Revoke temporary Vercel automation bypass
        id: revoke
        if: always() && steps.bypass.outcome == 'success'
        continue-on-error: true
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          secret="$(cat /tmp/pr402-bypass-secret)"
          echo "::add-mask::$secret"
          jq -n --arg secret "$secret" \
            '{revoke:{secret:$secret,regenerate:false}}' \
            > /tmp/pr402-revoke-bypass.json
          curl --fail --silent --show-error \
            --request PATCH \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/pr402-revoke-bypass.json \
            "https://api.vercel.com/v1/projects/$VERCEL_PROJECT_ID/protection-bypass?teamId=$VERCEL_ORG_ID" \
            > /tmp/pr402-revoke-bypass-response.json
          rm -f /tmp/pr402-bypass-secret /tmp/pr402-revoke-bypass.json /tmp/pr402-revoke-bypass-response.json

      - name: Upload detailed evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr402-protected-preview-v3-${{ github.run_id }}
          path: |
            /tmp/pr402-guard-evidence.json
            /tmp/pr402-browser-evidence.json
            /tmp/pr402-browser.log
            /tmp/pr402-preview-desktop.png
            /tmp/pr402-preview-mobile.png
          if-no-files-found: warn
          retention-days: 30

      - name: Persist sanitized outcome and remove controller
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GUARD_OUTCOME: ${{ steps.guard.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          BYPASS_OUTCOME: ${{ steps.bypass.outcome }}
          BROWSER_OUTCOME: ${{ steps.browser.outcome }}
          REVOKE_OUTCOME: ${{ steps.revoke.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const result = {
            runId: process.env.GITHUB_RUN_ID,
            runUrl: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            deploymentId: process.env.PREVIEW_DEPLOYMENT_ID,
            commit: process.env.EXPECTED_HEAD,
            outcomes: {
              guard: process.env.GUARD_OUTCOME,
              install: process.env.INSTALL_OUTCOME,
              bypass: process.env.BYPASS_OUTCOME,
              browser: process.env.BROWSER_OUTCOME,
              revoke: process.env.REVOKE_OUTCOME,
            },
          };
          for (const path of ['/tmp/pr402-guard-evidence.json', '/tmp/pr402-browser-evidence.json']) {
            if (fs.existsSync(path)) Object.assign(result, JSON.parse(fs.readFileSync(path, 'utf8')));
          }
          fs.writeFileSync('/tmp/pr402-final-evidence.json', JSON.stringify(result, null, 2));
          NODE

          content="$(base64 -w0 /tmp/pr402-final-evidence.json)"
          jq -n \
            --arg message 'Record PR 402 protected-preview v3 result' \
            --arg content "$content" \
            --arg branch "$OPS_BRANCH" \
            '{message:$message,content:$content,branch:$branch}' \
            > /tmp/pr402-result-create.json
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$RESULT_PATH" \
            --input /tmp/pr402-result-create.json >/dev/null

          workflow_sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/$WORKFLOW_PATH?ref=$OPS_BRANCH" --jq .sha)"
          jq -n \
            --arg message 'Remove one-time PR 402 protected-preview v3 inspector' \
            --arg sha "$workflow_sha" \
            --arg branch "$OPS_BRANCH" \
            '{message:$message,sha:$sha,branch:$branch}' \
            > /tmp/pr402-workflow-delete.json
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/contents/$WORKFLOW_PATH" \
            --input /tmp/pr402-workflow-delete.json >/dev/null

          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [[ "$BROWSER_OUTCOME" == 'success' && "$REVOKE_OUTCOME" == 'success' ]]; then
            gh pr comment 402 --repo "$GITHUB_REPOSITORY" --body "Exact protected canonical Preview passed for \`$EXPECTED_HEAD\` on deployment \`$PREVIEW_DEPLOYMENT_ID\`. Desktop and 390×844 mobile inspection verified the exact pledge arithmetic and disclosures, absence of pivotality copy, a visible bounded mobile sheet, and zero page, console, same-origin request, or HTTP errors. The temporary Vercel automation bypass was revoked. Evidence: $run_url"
          else
            gh pr comment 402 --repo "$GITHUB_REPOSITORY" --body "Exact protected canonical Preview v3 inspection did not pass for \`$EXPECTED_HEAD\` on deployment \`$PREVIEW_DEPLOYMENT_ID\`. Outcomes: guard=$GUARD_OUTCOME, install=$INSTALL_OUTCOME, bypass=$BYPASS_OUTCOME, browser=$BROWSER_OUTCOME, revoke=$REVOKE_OUTCOME. PR #402 remains draft and unmerged. Evidence: $run_url"
          fi

      - name: Enforce successful inspection and revocation
        run: |
          test '${{ steps.guard.outcome }}' = 'success'
          test '${{ steps.install.outcome }}' = 'success'
          test '${{ steps.bypass.outcome }}' = 'success'
          test '${{ steps.browser.outcome }}' = 'success'
          test '${{ steps.revoke.outcome }}' = 'success'