name: Apple credential discovery 20260731

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/apple-credential-discovery-20260731.yml"

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      TEAM_ID: team_ySu6sF3Uho1E1GnJtCQPVEuJ
    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Scan all Vercel projects for relevant environment-variable names
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          report=apple-credential-discovery.txt
          : > "$report"

          if [[ -z "${VERCEL_TOKEN:-}" ]]; then
            echo "github:VERCEL_TOKEN=missing" >> "$report"
            cat "$report"
            exit 0
          fi
          echo "github:VERCEL_TOKEN=configured" >> "$report"

          curl --fail --silent --show-error \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects?teamId=$TEAM_ID&limit=100" \
            -o /tmp/vercel-projects.json

          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          team_id = os.environ["TEAM_ID"]
          token = os.environ["VERCEL_TOKEN"]
          report = Path("apple-credential-discovery.txt")
          projects_payload = json.loads(Path("/tmp/vercel-projects.json").read_text())
          projects = projects_payload.get("projects", [])

          interesting_exact = {
              "APPLE_OAUTH_CLIENT_ID",
              "APPLE_OAUTH_CLIENT_SECRET",
              "APPLE_CLIENT_ID",
              "APPLE_CLIENT_SECRET",
              "APPLE_SERVICE_ID",
              "APPLE_SERVICES_ID",
              "APPLE_TEAM_ID",
              "APPLE_KEY_ID",
              "APPLE_PRIVATE_KEY",
              "APPLE_PRIVATE_KEY_P8",
              "SIGN_IN_WITH_APPLE_CLIENT_ID",
              "SIGN_IN_WITH_APPLE_CLIENT_SECRET",
              "SUPABASE_ACCESS_TOKEN",
              "SUPABASE_PROJECT_REF",
              "PROJECT_REF",
          }

          found = []
          failures = []
          for project in projects:
              project_id = project.get("id")
              project_name = project.get("name") or project_id
              if not project_id:
                  continue
              out_path = Path(f"/tmp/vercel-env-{project_id}.json")
              url = f"https://api.vercel.com/v10/projects/{project_id}/env?teamId={team_id}"
              proc = subprocess.run(
                  [
                      "curl", "--fail", "--silent", "--show-error",
                      "-H", f"Authorization: Bearer {token}",
                      url,
                      "-o", str(out_path),
                  ],
                  capture_output=True,
                  text=True,
              )
              if proc.returncode != 0:
                  failures.append(project_name)
                  continue
              payload = json.loads(out_path.read_text())
              envs = payload.get("envs", payload.get("env", []))
              for env in envs:
                  key = str(env.get("key", ""))
                  upper = key.upper()
                  if "APPLE" in upper or key in interesting_exact:
                      targets = env.get("target") or []
                      if isinstance(targets, str):
                          targets = [targets]
                      found.append((project_name, key, ",".join(sorted(map(str, targets))) or "unspecified"))

          with report.open("a", encoding="utf-8") as stream:
              stream.write(f"vercel:projects_scanned={len(projects)}\n")
              if found:
                  for project_name, key, targets in sorted(set(found)):
                      stream.write(
                          f"vercel:{project_name}:{key}=configured targets={targets}\n"
                      )
              else:
                  stream.write("vercel:relevant_credentials=none_found\n")
              if failures:
                  stream.write(
                      "vercel:env_listing_failures=" + ",".join(sorted(failures)) + "\n"
                  )
          PY

          rm -f /tmp/vercel-projects.json /tmp/vercel-env-*.json
          cat "$report"

      - name: Upload discovery report
        uses: actions/upload-artifact@v4
        with:
          name: apple-credential-discovery
          path: apple-credential-discovery.txt
          if-no-files-found: error
          retention-days: 1
