name: Marketplace delta terminal exact-head QA

on:
  push:
    branches:
      - ops/marketplace-delta-final-gate-v2-20260730
    paths:
      - ".github/workflows/marketplace-delta-final-gate-v2.yml"
      - ".github/scripts/run-marketplace-delta-final-gate-v2.sh"

permissions:
  contents: read

concurrency:
  group: marketplace-delta-terminal-exact-head-qa-20260731
  cancel-in-progress: false

jobs:
  exact-head-browser-gate:
    if: github.ref == 'refs/heads/ops/marketplace-delta-final-gate-v2-20260730'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      QA_SUPABASE_DB_URL: ${{ secrets.QA_SUPABASE_DB_URL }}
      QA_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.QA_SUPABASE_PUBLISHABLE_KEY }}
      QA_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.QA_SUPABASE_SERVICE_ROLE_KEY }}
      QA_TEST_PASSWORD: ${{ secrets.QA_TEST_PASSWORD }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Check out isolated QA branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Run exact-head environment, comparison, browser, and cleanup gate
        shell: bash
        run: bash .github/scripts/run-marketplace-delta-final-gate-v2.sh

      - name: Upload rendered browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marketplace-delta-terminal-browser-evidence-${{ github.run_id }}
          path: marketplace-delta-browser-artifacts
          if-no-files-found: warn
          retention-days: 14

      - name: Upload exact-head and clean-state proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marketplace-delta-terminal-final-proof-${{ github.run_id }}
          path: marketplace-delta-final-proof
          if-no-files-found: warn
          retention-days: 14
