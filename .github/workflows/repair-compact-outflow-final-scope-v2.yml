name: Repair Compact outflow final scope v5

on:
  push:
    branches:
      - feature/compact-authoritative-outflow-ledger-v1-20260816
    paths:
      - .github/workflows/repair-compact-outflow-final-scope-v2.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-compact-outflow-final-scope-v5-${{ github.ref_name }}
  cancel-in-progress: false

env:
  EXPECTED_CONTROLLER_SHA: ${{ github.sha }}
  EXPECTED_PARENT_SHA: 39be4152432b2d900ea1ca371e9cd364f95350d0
  STACK_BASE_SHA: f46178aaad6d2fbd911cc365e2963bb7c73a0098
  TARGET_BRANCH: feature/compact-authoritative-outflow-ledger-v1-20260816

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact controller commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.EXPECTED_CONTROLLER_SHA }}

      - name: Verify bounded controller lineage
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_CONTROLLER_SHA"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT_SHA"
          test "$(git diff --name-only HEAD^...HEAD)" = ".github/workflows/repair-compact-outflow-final-scope-v2.yml"
          test "$(git merge-base "$STACK_BASE_SHA" HEAD)" = "$STACK_BASE_SHA"

      - name: Materialize final durable validation repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workflow_path = Path('.github/workflows/compact-authoritative-outflow-ledger-qa.yml')
          workflow = workflow_path.read_text(encoding='utf-8')

          old_concurrency = '''      - name: Concurrent canonical freeze
        run: |
          chmod +x scripts/test-compact-authoritative-outflow-concurrency.sh
          COMPACT_OUTFLOW_TEST_DB_URL="$DB_URL" bash scripts/test-compact-authoritative-outflow-concurrency.sh 2>&1 | tee db-evidence/concurrency.log
'''
          new_concurrency = '''      - name: Concurrent canonical freeze
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/test-compact-authoritative-outflow-concurrency.sh
          COMPACT_OUTFLOW_TEST_DB_URL="$DB_URL" bash scripts/test-compact-authoritative-outflow-concurrency.sh 2>&1 | tee db-evidence/concurrency.log
'''
          if workflow.count(old_concurrency) != 1:
              raise SystemExit('Could not identify the unique concurrent-freeze workflow block.')
          workflow = workflow.replace(old_concurrency, new_concurrency, 1)

          no_money_start = '      - name: No-money readback\n'
          no_money_end = '      - name: Stop ephemeral runtime\n'
          if workflow.count(no_money_start) != 1 or workflow.count(no_money_end) != 1:
              raise SystemExit('Could not identify the unique no-money workflow block.')
          start = workflow.index(no_money_start)
          end = workflow.index(no_money_end, start)
          no_money_replacement = '''      - name: No-money readback
        shell: bash
        run: |
          set -euo pipefail
          psql "$DB_URL" --no-psqlrc --set ON_ERROR_STOP=1 2>&1 <<'SQL' | tee db-evidence/no-money-assertion.log
          do $assert$
          begin
            if exists (
              select 1 from public.mpgf_public_goods_compacts where status = 'active'
            ) then
              raise exception 'Authoritative outflow QA unexpectedly activated a Compact.';
            end if;
            if exists (
              select 1 from public.mpgf_public_goods_voting_snapshots
            ) then
              raise exception 'Authoritative outflow QA unexpectedly opened an electorate.';
            end if;
            if exists (
              select 1
              from public.mpgf_public_goods_dormant_authorization_snapshots
              where provider_reference_hash is not null
            ) then
              raise exception 'Authoritative outflow QA unexpectedly created a payment provider reference.';
            end if;
          end;
          $assert$;
          SQL
          psql "$DB_URL" --no-psqlrc --tuples-only --no-align --set ON_ERROR_STOP=1 <<'SQL' | sed '/^$/d' | tee db-evidence/no-money.txt
          select 'activation|' || count(*) from public.mpgf_public_goods_compacts where status='active'
          union all select 'electorate|' || count(*) from public.mpgf_public_goods_voting_snapshots
          union all select 'payment_refs|' || count(*) from public.mpgf_public_goods_dormant_authorization_snapshots where provider_reference_hash is not null
          order by 1;
          SQL
          test "$(wc -l < db-evidence/no-money.txt)" -eq 3
          grep -qx 'activation|0' db-evidence/no-money.txt
          grep -qx 'electorate|0' db-evidence/no-money.txt
          grep -qx 'payment_refs|0' db-evidence/no-money.txt
'''
          workflow = workflow[:start] + no_money_replacement + workflow[end:]
          if workflow.count('provider_reference_hash is not null') != 2:
              raise SystemExit('The no-money contract does not use the hashed provider-reference column exactly twice.')
          if 'where provider_reference is not null' in workflow:
              raise SystemExit('The removed provider_reference column remains in the workflow.')
          if workflow.count('db-evidence/no-money-assertion.log') != 1:
              raise SystemExit('The SQL no-money assertion was not installed exactly once.')
          workflow_path.write_text(workflow, encoding='utf-8')

          script_path = Path('scripts/test-compact-authoritative-outflow-concurrency.sh')
          script = script_path.read_text(encoding='utf-8')
          old_profile = '''insert into public.profiles (
  id, email, display_name, bio, affiliation, username, account_kind,
  accepts_group_invitations, public_invitation_mentions_enabled
) values (
  '6d000000-0000-4000-8000-000000000001','ledger-concurrency@example.test',
  'Ledger Concurrency','','','ledger-concurrency','individual',true,true
);
'''
          new_profile = '''insert into public.profiles (
  id, email, display_name, bio, affiliation, username, account_kind,
  accepts_group_invitations, public_invitation_mentions_enabled
) values (
  '6d000000-0000-4000-8000-000000000001','ledger-concurrency@example.test',
  'Ledger Concurrency','','','ledger-concurrency','individual',true,true
)
on conflict (id) do update set
  email = excluded.email,
  display_name = excluded.display_name,
  bio = excluded.bio,
  affiliation = excluded.affiliation,
  username = excluded.username,
  account_kind = excluded.account_kind,
  accepts_group_invitations = excluded.accepts_group_invitations,
  public_invitation_mentions_enabled = excluded.public_invitation_mentions_enabled;
'''
          if script.count(old_profile) != 1:
              raise SystemExit('Could not identify the unique concurrency profile fixture block.')
          script = script.replace(old_profile, new_profile, 1)
          if script.count('on conflict (id) do update set') != 1:
              raise SystemExit('The trigger-compatible profile upsert was not installed exactly once.')
          script_path.write_text(script, encoding='utf-8')
          PY

          for path in \
            .github/workflows/complete-compact-outflow-nonhosted-v1.yml \
            .github/workflows/complete-compact-outflow-nonhosted-v2.yml \
            .github/workflows/continue-compact-outflow-validation-v1.yml \
            .github/workflows/finalize-compact-outflow-validation-v3.yml \
            .github/workflows/repair-compact-outflow-phase-order-v1.yml \
            .github/workflows/repair-compact-outflow-phase-ordering-v1.yml \
            .github/workflows/repair-compact-outflow-preledger-assertion-v1.yml \
            .github/workflows/repair-compact-outflow-test-isolation-v2.yml \
            .github/workflows/repair-compact-outflow-final-scope-v2.yml
          do
            test -f "$path"
            git rm "$path"
          done

          cat > /tmp/expected.txt <<'EOF'
          .github/workflows/compact-authoritative-outflow-ledger-qa.yml
          docs/mpgf/compact-authoritative-outflow-ledger-v1.md
          scripts/test-compact-authoritative-outflow-concurrency.sh
          src/components/mpgf/mpgf-public-goods-compacts.tsx
          src/lib/mpgf/compact-authoritative-outflow-contract.test.ts
          src/lib/mpgf/compact-authoritative-outflow-phase-order-contract.test.ts
          src/lib/mpgf/compact-authoritative-outflow.test.ts
          src/lib/mpgf/compact-authoritative-outflow.ts
          supabase/migrations/20260816141500_compact_authoritative_outflow_ledger_v1.sql
          supabase/migrations/20260816141501_compact_authoritative_outflow_freeze_v1.sql
          supabase/migrations/20260816141502_compact_authoritative_outflow_hardening_v1.sql
          supabase/migrations/20260816141503_compact_authoritative_outflow_replay_fix_v1.sql
          supabase/tests/compact_authoritative_outflow_ledger_authorization.sql
          supabase/tests/compact_authoritative_outflow_ledger_core.sql
          tests/mpgf-public-goods-compacts.spec.ts
          EOF
          sed -i 's/^          //' /tmp/expected.txt
          sort -o /tmp/expected.txt /tmp/expected.txt
          git diff --name-only "$STACK_BASE_SHA" | sort > /tmp/actual.txt
          diff -u /tmp/expected.txt /tmp/actual.txt
          test "$(wc -l < /tmp/actual.txt)" -eq 15
          bash -n scripts/test-compact-authoritative-outflow-concurrency.sh
          grep -Fq 'set -euo pipefail' scripts/test-compact-authoritative-outflow-concurrency.sh
          grep -Fq 'on conflict (id) do update set' scripts/test-compact-authoritative-outflow-concurrency.sh
          grep -Fq 'provider_reference_hash is not null' .github/workflows/compact-authoritative-outflow-ledger-qa.yml
          test "$(grep -Fc 'provider_reference_hash is not null' .github/workflows/compact-authoritative-outflow-ledger-qa.yml)" -eq 2
          test "$(grep -Fc 'set -euo pipefail' .github/workflows/compact-authoritative-outflow-ledger-qa.yml)" -ge 1
          test "$(grep -Fc 'COMPACT_OUTFLOW_TEST_DB_URL="$DB_URL" bash scripts/test-compact-authoritative-outflow-concurrency.sh 2>&1 | tee db-evidence/concurrency.log' .github/workflows/compact-authoritative-outflow-ledger-qa.yml)" -eq 1
          git diff --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/compact-authoritative-outflow-ledger-qa.yml scripts/test-compact-authoritative-outflow-concurrency.sh
          git commit -m "ci: close Compact outflow validation gaps"
          git push origin "HEAD:$TARGET_BRANCH"
