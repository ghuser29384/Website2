name: Commitments performance gates

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/commitments-performance-gates.yml"
      - "src/app/commitments/**"
      - "src/lib/commitments-offer-data*"
      - "src/lib/commitments-loading.test.ts"
      - "src/lib/commitments-portfolio.ts"
      - "src/commitments-portfolio-wiring.test.ts"
      - "playwright.commitments.config.ts"
      - "tests/commitments-loading.auth.ts"

permissions:
  contents: read

concurrency:
  group: commitments-performance-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      PLAYWRIGHT_HTML_OPEN: never
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Test portfolio reads and loading boundary
        run: |
          node --import tsx --test \
            src/lib/commitments-offer-data.test.ts \
            src/lib/commitments-loading.test.ts \
            src/commitments-portfolio-wiring.test.ts
      - name: Lint repository and check diff
        run: |
          npm run lint -- --quiet
          git diff --check origin/main...HEAD
      - name: Build Next.js application
        run: npm run build
      - name: Verify TypeScript
        run: npx tsc --noEmit --pretty false
      - name: Run repository regression tests
        if: success() || failure()
        run: npm test
      # The real production renderer talks only to the existing loopback fixture.
      # No real user sessions, database migrations or production writes are used.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify streaming, signed-out access and fixture-session navigation
        run: npx playwright test --config=playwright.commitments.config.ts --reporter=line
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: commitments-rendered-${{ github.event.pull_request.head.sha }}
          path: test-results/commitments-loading
          if-no-files-found: ignore
          retention-days: 3
