name: PR 212 QA assertion repair

on:
  push:
    branches:
      - feat/institutional-trade-system

permissions:
  contents: write

concurrency:
  group: pr212-qa-assertion-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.event.head_commit.message == 'Install temporary PR #212 QA assertion repair'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact branch commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair the exact-scope assertion and remove this temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/scripts/institutional-trade-qa-e2e.mjs')
          text = path.read_text()
          old = r'/baseline organization\/program scope must exactly match/i,'
          new = r'/baseline profile or organization\/program scope must exactly match the deal party/i,'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one stale baseline assertion, found {count}.')
          path.write_text(text.replace(old, new))
          PY

          node --check .github/scripts/institutional-trade-qa-e2e.mjs
          rm .github/workflows/pr212-qa-assertion-repair.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/scripts/institutional-trade-qa-e2e.mjs .github/workflows/pr212-qa-assertion-repair.yml
          git diff --cached --check
          git commit -m 'Fix institutional baseline scope assertion'
          git push origin HEAD:feat/institutional-trade-system
