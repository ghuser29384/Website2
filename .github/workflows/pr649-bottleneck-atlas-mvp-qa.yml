name: PR 649 Bottleneck Atlas MVP QA

on:
  push:
    branches:
      - feature/bottleneck-atlas-mvp-20260813
    paths:
      - .github/workflows/pr649-bottleneck-atlas-mvp-qa.yml

permissions:
  actions: read
  contents: read
  pull-requests: write

concurrency:
  group: pr649-bottleneck-atlas-mvp-qa
  cancel-in-progress: true

env:
  OPPORTUNITY_SYNTHESIS_ENABLED: "true"
  NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3211
  SITE_URL: http://127.0.0.1:3211
  QA_OUTPUT: pr649-bottleneck-atlas-mvp-evidence

jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Guard branch and intended scope
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'ghuser29384/Website2'
          test "$GITHUB_REF" = 'refs/heads/feature/bottleneck-atlas-mvp-20260813'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --check HEAD~1 HEAD

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies and Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium

      - name: Run source, full test, lint, type, and build gates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$QA_OUTPUT"
          node --import tsx --test \
            src/lib/bottleneck-atlas-matcher.test.ts \
            src/bottleneck-atlas-feed-wiring.test.ts \
            | tee "$QA_OUTPUT/focused-tests.log"
          npm test | tee "$QA_OUTPUT/full-tests.log"
          npm run lint -- --quiet | tee "$QA_OUTPUT/lint.log"
          npx tsc --noEmit --pretty false | tee "$QA_OUTPUT/typescript.log"
          MORAL_TRADE_DISABLE_SUPABASE=true npm run build | tee "$QA_OUTPUT/build.log"

      - name: Run focused rendered interaction gate
        shell: bash
        env:
          MORAL_TRADE_DISABLE_SUPABASE: "true"
          PLAYWRIGHT_USE_PRODUCTION_SERVER: "1"
        run: |
          set -euo pipefail
          npx playwright test tests/bottleneck-atlas.spec.ts --workers=1 --reporter=line \
            | tee "$QA_OUTPUT/playwright.log"

      - name: Capture compact MVP evidence
        shell: bash
        env:
          MORAL_TRADE_DISABLE_SUPABASE: "true"
        run: |
          set -euo pipefail
          npm run start -- -H 127.0.0.1 -p 3211 > "$QA_OUTPUT/server.log" 2>&1 &
          echo "$!" > "$QA_OUTPUT/server.pid"
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:3211/bottleneck-atlas > /dev/null; then
              break
            fi
            if [[ "$attempt" = 90 ]]; then
              tail -n 200 "$QA_OUTPUT/server.log"
              exit 1
            fi
            sleep 1
          done

          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { writeFile } from 'node:fs/promises';
          import { chromium } from '@playwright/test';

          const output = process.env.QA_OUTPUT;
          const baseURL = 'http://127.0.0.1:3211';
          const browser = await chromium.launch();
          const evidence = { views: {}, consoleErrors: [] };

          async function contextFor(viewport) {
            const context = await browser.newContext({ viewport });
            await context.addCookies([{
              name: 'mt_walkthrough_seen',
              value: '1',
              url: baseURL,
              httpOnly: true,
              secure: false,
              sameSite: 'Lax',
            }]);
            return context;
          }

          async function inspect(label, viewport) {
            const context = await contextFor(viewport);
            const page = await context.newPage();
            page.on('pageerror', (error) => evidence.consoleErrors.push(`${label}: ${error.message}`));
            page.on('console', (message) => {
              if (message.type() === 'error') evidence.consoleErrors.push(`${label}: ${message.text()}`);
            });
            await page.goto(`${baseURL}/bottleneck-atlas`, { waitUntil: 'networkidle' });
            await page.getByRole('heading', { level: 1, name: 'Find a cross-cause trade.' }).waitFor();

            const initial = await page.evaluate(() => {
              const main = document.querySelector('main');
              const viewportText = [...document.querySelectorAll('main *')]
                .filter((node) => {
                  const rect = node.getBoundingClientRect();
                  const style = getComputedStyle(node);
                  return rect.top < innerHeight && rect.bottom > 0 && style.visibility !== 'hidden';
                })
                .map((node) => node.childNodes.length === 1 ? node.textContent?.trim() ?? '' : '')
                .filter(Boolean)
                .join(' ');
              return {
                width: innerWidth,
                scrollWidth: Math.max(document.documentElement.scrollWidth, document.body?.scrollWidth ?? 0),
                visibleTextCharacters: viewportText.length,
                matchCount: document.querySelectorAll('[data-atlas-match]').length,
                fieldCount: document.querySelectorAll('[data-atlas-field]').length,
                mainText: main?.textContent?.trim().slice(0, 220) ?? '',
              };
            });
            assert.ok(initial.scrollWidth <= initial.width + 1, `${label} initial overflow`);
            assert.ok(initial.visibleTextCharacters < 900, `${label} initial viewport is still word-heavy: ${initial.visibleTextCharacters}`);
            assert.equal(initial.matchCount, 0);
            assert.equal(initial.fieldCount, 0);
            await page.screenshot({ path: `${output}/${label}-initial.png`, fullPage: false });

            await page.locator('[data-atlas-offer-select]').selectOption('funding');
            await page.locator('[data-atlas-need-select]').selectOption('operations');
            await page.locator('[data-atlas-find-matches]').click();
            await page.locator('[data-atlas-match]').waitFor();
            const result = await page.locator('[data-atlas-match]').getAttribute('data-synthesis-template');
            assert.equal(result, 'ai-governance-advocacy-operations');
            await page.screenshot({ path: `${output}/${label}-match.png`, fullPage: false });

            await page.getByRole('tab', { name: 'Browse evidence' }).click();
            assert.equal(await page.locator('[data-atlas-field]').count(), 18);
            await page.getByLabel('Search fields').fill('AI governance');
            await page.getByRole('button', { name: /AI governance and policy/ }).click();
            await page.locator('[data-atlas-field-detail="ai-governance"]').waitFor();
            await page.screenshot({ path: `${output}/${label}-evidence.png`, fullPage: false });

            const final = await page.evaluate(() => ({
              width: innerWidth,
              scrollWidth: Math.max(document.documentElement.scrollWidth, document.body?.scrollWidth ?? 0),
            }));
            assert.ok(final.scrollWidth <= final.width + 1, `${label} evidence overflow`);
            await context.close();
            return { initial, result, final };
          }

          evidence.views.desktop = await inspect('desktop', { width: 1440, height: 900 });
          evidence.views.mobile = await inspect('mobile', { width: 390, height: 844 });
          assert.deepEqual(evidence.consoleErrors, []);
          await writeFile(`${output}/render-evidence.json`, `${JSON.stringify(evidence, null, 2)}\n`);
          await browser.close();
          NODE

          kill "$(cat "$QA_OUTPUT/server.pid")" 2>/dev/null || true

      - name: Upload MVP evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr649-bottleneck-atlas-mvp-${{ github.run_id }}-${{ github.sha }}
          path: ${{ env.QA_OUTPUT }}
          if-no-files-found: error
          retention-days: 30

      - name: Record QA result on PR 649
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$JOB_STATUS" = success ]]; then
            body="## Bottleneck Atlas MVP QA passed\n\n- Candidate: \`$GITHUB_SHA\`\n- Run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\n- Functional flow: offer + need → ranked match → guarded detail route\n- Evidence flow: search/filter → one selected field at a time\n- Initial viewport: under the enforced 900-character visible-text ceiling\n- Desktop/mobile: no horizontal overflow\n- Focused tests, full tests, lint, TypeScript, production build, and Playwright: passed\n- Production changed: no\n\nScreenshots and structured render metrics are retained in the workflow artifact."
          else
            body="## Bottleneck Atlas MVP QA failed closed\n\n- Candidate: \`$GITHUB_SHA\`\n- Run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\n- Production changed: no\n\nPR #649 remains blocked pending diagnosis."
          fi
          gh pr comment 649 --repo "$GITHUB_REPOSITORY" --body "$body"

# One-use QA workflow. Delete before merge.
