name: Validate live offer structure

on:
  push:
    branches:
      - fix/live-offer-structure-20260723

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Run and record exact-live validation
        shell: bash
        run: |
          set +e
          mkdir -p tmp/live-offer-structure-validation test-results

          npm ci > tmp/live-offer-structure-validation/npm-ci.log 2>&1
          npm_status=$?

          syntax_status=99
          source_status=99
          lint_status=99
          install_status=99
          browser_status=99

          if [ "$npm_status" -eq 0 ]; then
            node --check public/moral-trade-live-token-autocomplete.js > tmp/live-offer-structure-validation/syntax.log 2>&1
            first_syntax=$?
            node --check public/moral-trade-live-offer-structure.js >> tmp/live-offer-structure-validation/syntax.log 2>&1
            second_syntax=$?
            if [ "$first_syntax" -eq 0 ] && [ "$second_syntax" -eq 0 ]; then syntax_status=0; else syntax_status=1; fi

            node --import tsx --test src/lib/exact-live-autocomplete.test.ts > tmp/live-offer-structure-validation/source.log 2>&1
            source_status=$?

            npx eslint public/moral-trade-live-token-autocomplete.js public/moral-trade-live-offer-structure.js src/lib/exact-live-autocomplete.test.ts tests/exact-live-autocomplete.spec.ts > tmp/live-offer-structure-validation/lint.log 2>&1
            lint_status=$?

            npx playwright install --with-deps chromium > tmp/live-offer-structure-validation/install.log 2>&1
            install_status=$?

            if [ "$install_status" -eq 0 ]; then
              npx playwright test tests/exact-live-autocomplete.spec.ts > tmp/live-offer-structure-validation/browser.log 2>&1
              browser_status=$?
            fi
          fi

          cat > tmp/live-offer-structure-validation/result.md <<EOF
          # Structured Live offer validation

          - npm install: $npm_status
          - JavaScript syntax: $syntax_status
          - Exact-live source contract: $source_status
          - Focused ESLint: $lint_status
          - Chromium installation: $install_status
          - Chromium Playwright: $browser_status
          - Route: \`/moral-trade-live.html#trade\`
          - Offer types: Money; Behavior or commitment; Help or service
          - Shared attributes: Estimated time; Relevant skills; Deliverable or completion condition; Verification method

          Exit code 0 means passed. Exit code 99 means skipped because an earlier prerequisite failed.

          ## Source-contract tail
          \`\`\`
          $(tail -n 30 tmp/live-offer-structure-validation/source.log 2>/dev/null)
          \`\`\`

          ## Lint tail
          \`\`\`
          $(tail -n 30 tmp/live-offer-structure-validation/lint.log 2>/dev/null)
          \`\`\`

          ## Browser tail
          \`\`\`
          $(tail -n 80 tmp/live-offer-structure-validation/browser.log 2>/dev/null)
          \`\`\`
          EOF

          git config user.name "moral-trade-offer-structure-bot"
          git config user.email "moral-trade-offer-structure-bot@users.noreply.github.com"
          git add tmp/live-offer-structure-validation
          git commit -m "Record structured live offer validation [skip ci]"
          git push origin HEAD:fix/live-offer-structure-20260723
