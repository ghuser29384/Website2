name: Monitor issue 734 non-hosted completion v1

on:
  push:
    branches:
      - ops/issue734-compact-outflow-completion-20260818
    paths:
      - .github/workflows/monitor-issue734-nonhosted-v1.yml

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

jobs:
  monitor:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ github.token }}
      FEATURE_BRANCH: feature/compact-authoritative-outflow-ledger-v1-20260816
      STACK_BASE_SHA: f46178aaad6d2fbd911cc365e2963bb7c73a0098
      PR_NUMBER: '737'
      ISSUE_NUMBER: '734'
    steps:
      - name: Check out controller branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Wait for frozen candidate and exact-head runs
        id: monitor
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess, time
          from pathlib import Path

          repo = os.environ['GITHUB_REPOSITORY']
          feature = os.environ['FEATURE_BRANCH']
          base = os.environ['STACK_BASE_SHA']
          wanted_names = {
              'ledger': ('compact authoritative outflow ledger qa',),
              'compact': ('mpgf public-goods compacts qa', 'mpgf public goods compacts qa'),
              'payment': ('evidence payment release qa',),
              'visual': ('sitewide canonical visual system', 'canonical visual'),
              'release': ('release classification',),
          }

          def gh_json(*args):
              return json.loads(subprocess.check_output(['gh', *args], text=True))

          workflow_rows = gh_json('workflow', 'list', '--repo', repo, '--all', '--json', 'id,name,path,state')
          workflows = {}
          for key, needles in wanted_names.items():
              matches = [row for row in workflow_rows if any(needle in row['name'].lower() for needle in needles)]
              if len(matches) != 1:
                  raise SystemExit(f'{key}: expected one workflow, found {matches}')
              workflows[key] = matches[0]

          deadline = time.time() + 7200
          stable_head = None
          stable_count = 0
          selected = {}
          while time.time() < deadline:
              pr = gh_json('api', f'repos/{repo}/pulls/{os.environ["PR_NUMBER"]}')
              if pr['state'] != 'open' or not pr.get('draft') or pr.get('merged_at') is not None:
                  raise SystemExit(f'PR state drifted: state={pr["state"]} draft={pr.get("draft")} merged_at={pr.get("merged_at")}')
              head = pr['head']['sha']
              if pr['head']['ref'] != feature:
                  raise SystemExit(f'Unexpected PR branch: {pr["head"]["ref"]}')
              if head == stable_head:
                  stable_count += 1
              else:
                  stable_head = head
                  stable_count = 1

              compare = gh_json('api', f'repos/{repo}/compare/{base}...{head}')
              files = sorted(row['filename'] for row in compare.get('files', []))
              allowed = {
                  '.github/workflows/compact-authoritative-outflow-ledger-qa.yml',
                  'docs/mpgf/compact-authoritative-outflow-ledger-v1.md',
                  'scripts/test-compact-authoritative-outflow-concurrency.sh',
                  'src/components/mpgf/mpgf-public-goods-compacts.tsx',
                  'src/lib/mpgf/compact-authoritative-outflow-contract.test.ts',
                  'src/lib/mpgf/compact-authoritative-outflow.test.ts',
                  'src/lib/mpgf/compact-authoritative-outflow.ts',
                  'supabase/migrations/20260816141500_compact_authoritative_outflow_ledger_v1.sql',
                  'supabase/migrations/20260816141501_compact_authoritative_outflow_freeze_v1.sql',
                  'supabase/migrations/20260816141502_compact_authoritative_outflow_hardening_v1.sql',
                  'supabase/migrations/20260816141503_compact_authoritative_outflow_replay_fix_v1.sql',
                  'supabase/tests/compact_authoritative_outflow_ledger_authorization.sql',
                  'supabase/tests/compact_authoritative_outflow_ledger_core.sql',
                  'tests/mpgf-public-goods-compacts.spec.ts',
              }
              if set(files) != allowed:
                  raise SystemExit(f'Frozen 14-file scope mismatch: {files}')

              payload = gh_json('api', f'repos/{repo}/actions/runs', '-f', f'head_sha={head}', '-f', 'per_page=100', '--method', 'GET')
              selected = {}
              for key, workflow in workflows.items():
                  candidates = [run for run in payload.get('workflow_runs', []) if run.get('workflow_id') == workflow['id'] and run.get('head_sha') == head]
                  if candidates:
                      candidates.sort(key=lambda row: row['id'], reverse=True)
                      selected[key] = candidates[0]
              if stable_count >= 3 and len(selected) == len(workflows) and all(row['status'] == 'completed' for row in selected.values()):
                  break
              time.sleep(20)
          else:
              raise SystemExit(f'Timed out; stable_head={stable_head} selected={selected}')

          report = {
              'candidate_sha': stable_head,
              'candidate_tree': gh_json('api', f'repos/{repo}/git/commits/{stable_head}')['tree']['sha'],
              'runs': {
                  key: {
                      'id': row['id'],
                      'name': row['name'],
                      'status': row['status'],
                      'conclusion': row['conclusion'],
                      'url': row['html_url'],
                  }
                  for key, row in selected.items()
              },
          }
          Path('/tmp/report.json').write_text(json.dumps(report, indent=2) + '\n')
          failures = {key: row for key, row in report['runs'].items() if row['conclusion'] != 'success'}
          if failures:
              raise SystemExit('Exact-head gate failures: ' + json.dumps(failures, indent=2))
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as handle:
              handle.write(f'candidate_sha={report["candidate_sha"]}\n')
              handle.write(f'candidate_tree={report["candidate_tree"]}\n')
          PY

      - name: Publish independent success record
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          report="$(cat /tmp/report.json)"
          body=$(cat <<EOF
          ### Independent issue #734 non-hosted completion check passed

          The frozen 14-file ledger candidate is still open, draft, and unmerged. Exact-head ledger, Compact, payment-release, canonical-visual, and release-classification workflows all completed successfully after the ordered migration/test-phase repair.

          \`\`\`json
          $report
          \`\`\`

          No hosted Preview, persistent migration, production/private-data access, provider object, payment, activation, electorate, alias, merge, or deployment is authorized by this result.
          EOF
          )
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$body"
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$body"

      - name: Publish fail-closed result
        if: failure()
        shell: bash
        run: |
          body="Independent issue #734 monitoring stopped fail closed. No hosted Preview or release action was authorized. Controller: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$body" || true
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$body" || true

      - name: Remove one-use monitor
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/monitor-issue734-nonhosted-v1.yml
          git commit -m 'ops: remove issue 734 non-hosted monitor'
          git push origin "HEAD:${GITHUB_REF_NAME}"
