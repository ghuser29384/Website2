name: PR 212 account-security visibility repair 20260806

on:
  push:
    branches:
      - ops/pr212-account-security-visibility-repair-20260806
    paths:
      - .github/workflows/pr212-account-security-visibility-repair-20260806.yml
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: pr212-account-security-visibility-repair-20260806
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      TARGET_BRANCH: feat/institutional-trade-system
      EXPECTED_HEAD: dbbb0afbb42ef9a1636be073bb1d47343badd98b
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Clone exact PR 212 head without marketplace actions
        shell: bash
        run: |
          set -euo pipefail
          git init target
          git -C target remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C target fetch --depth=1 origin "$EXPECTED_HEAD"
          git -C target checkout --detach FETCH_HEAD
          [[ "$(git -C target rev-parse HEAD)" == "$EXPECTED_HEAD" ]]

      - name: Apply the narrow UI repair and regression contract
        shell: bash
        working-directory: target
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          page_path = Path('src/app/dashboard/page.tsx')
          page = page_path.read_text(encoding='utf-8')
          panel = '          <BackgroundAccountSecurityPanel initialSummary={accountSecuritySummary} />\n'

          hidden = '''            </article>

            <BackgroundAccountSecurityPanel initialSummary={accountSecuritySummary} />
          </div>
'''
          if page.count(hidden) != 1:
              raise SystemExit(f'Expected one hidden account-security placement, found {page.count(hidden)}.')
          page = page.replace(hidden, '''            </article>
          </div>
''', 1)

          visible_anchor = '''          </nav>
        </section>

        {!supabaseReady ? (
'''
          visible_replacement = '''          </nav>

          <BackgroundAccountSecurityPanel initialSummary={accountSecuritySummary} />
        </section>

        {!supabaseReady ? (
'''
          if page.count(visible_anchor) != 1:
              raise SystemExit(f'Expected one visible account-surface insertion point, found {page.count(visible_anchor)}.')
          page = page.replace(visible_anchor, visible_replacement, 1)
          if page.count(panel) != 1:
              raise SystemExit(f'Expected one account-security panel after repair, found {page.count(panel)}.')
          page_path.write_text(page, encoding='utf-8')

          test_path = Path('src/institutional-dashboard-mfa-visibility.test.ts')
          test_path.write_text('''import assert from "node:assert/strict";
import { readFileSync } from "node:fs";
import test from "node:test";

const dashboard = readFileSync("src/app/dashboard/page.tsx", "utf8");
const globalCss = readFileSync("src/app/globals.css", "utf8");
const panel = "<BackgroundAccountSecurityPanel initialSummary={accountSecuritySummary} />";

test("the browser MFA panel is rendered in the visible Account surface exactly once", () => {
  const occurrences = dashboard.split(panel).length - 1;
  assert.equal(occurrences, 1);

  const visibleSurfaceStart = dashboard.indexOf(
    '<section className="v72-private-surface v72-account-surface"',
  );
  const visibleSurfaceEnd = dashboard.indexOf("</section>", visibleSurfaceStart);
  const panelIndex = dashboard.indexOf(panel);
  const legacyNetworkingIndex = dashboard.indexOf('id="background-networking"');

  assert.ok(visibleSurfaceStart >= 0, "Visible Account surface is missing.");
  assert.ok(visibleSurfaceEnd > visibleSurfaceStart, "Visible Account surface does not close.");
  assert.ok(panelIndex > visibleSurfaceStart && panelIndex < visibleSurfaceEnd);
  assert.ok(panelIndex < legacyNetworkingIndex);
});

test("the regression contract detects why the legacy placement was inaccessible", () => {
  assert.match(
    globalCss,
    /\.marketplace-app-shell\s+#main-content\s*>\s*\.section\s*\{\s*display:\s*none;/,
  );
});
''', encoding='utf-8')
          PY
          git diff --check
          mapfile -t changed < <(git diff --name-only)
          [[ "${#changed[@]}" -eq 2 ]]
          [[ "${changed[0]}" == "src/app/dashboard/page.tsx" ]]
          [[ "${changed[1]}" == "src/institutional-dashboard-mfa-visibility.test.ts" ]]

      - name: Install dependencies with retry
        shell: bash
        working-directory: target
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            if npm ci; then exit 0; fi
            if (( attempt == 4 )); then exit 1; fi
            sleep $((attempt * 20))
          done

      - name: Run focused contracts and production build
        shell: bash
        working-directory: target
        run: |
          set -euo pipefail
          node --import tsx --test \
            src/institutional-dashboard-mfa-visibility.test.ts \
            src/institutional-individual-capacity.test.ts \
            src/institutional-product-completeness.test.ts
          node --check .github/scripts/institutional-trade-qa-e2e.mjs
          npm run build

      - name: Commit and publish the exact repair
        id: publish
        shell: bash
        working-directory: target
        run: |
          set -euo pipefail
          remote="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          [[ "$remote" == "$EXPECTED_HEAD" ]] || {
            echo "Feature branch advanced concurrently to $remote" >&2
            exit 1
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/dashboard/page.tsx src/institutional-dashboard-mfa-visibility.test.ts
          git commit -m 'Expose institutional MFA controls in the Account surface'
          new_head="$(git rev-parse HEAD)"
          git push origin "HEAD:$TARGET_BRANCH"
          echo "new_head=$new_head" >> "$GITHUB_OUTPUT"

      - name: Record the repaired exact head on PR 212
        shell: bash
        run: |
          set -euo pipefail
          gh pr comment 212 --repo "$GITHUB_REPOSITORY" --body "<!-- pr212-account-security-visibility-repair-20260806 -->
          Published the confirmed account-security visibility repair as exact head \`${{ steps.publish.outputs.new_head }}\`.

          Diagnostic run 31117812611 proved that \`article#account-security\` was the sole matching panel, but its ancestor \`section#background-networking.dashboard-workspace\` had computed \`display: none\` under the marketplace stylesheet. The repair moves the existing MFA component into the visible v72 Account surface, removes the hidden duplicate, and adds a source contract requiring exactly one visible placement. Focused institutional contracts and the production build passed before publication.

          The feature push now triggers the complete Institutional trade QA workflow. PR #212 remains draft and unmerged; production database, deployment, payment, custody, payout, and institutional feature flags are unchanged."
