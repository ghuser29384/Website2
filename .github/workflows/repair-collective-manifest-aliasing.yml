name: Repair collective reveal-manifest JSONB aliasing

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/repair-collective-manifest-aliasing.yml"

permissions:
  contents: write

concurrency:
  group: repair-collective-manifest-aliasing-20260726
  cancel-in-progress: false

jobs:
  patch-test-migrate:
    if: >-
      github.event.pull_request.head.repo.full_name == 'ghuser29384/Website2' &&
      github.head_ref == 'ops/apply-collective-commitments-20260726'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      EXPECTED_REPOSITORY: ghuser29384/Website2
      PRODUCT_BRANCH: feature/collective-identity-threshold-commitments-20260726
      EXPECTED_PRODUCT_HEAD: 053ed422da9c5cf8c03b1c24c1bb7f2af81386e8
      EXACT_MAIN_HEAD: 9808ca22768b395ef6ef740a27881541b5e5f12a
      EXPECTED_QA_REF: hvmxfjjbdcgjjudmthdz
      QA_SUPABASE_DB_URL: ${{ secrets.QA_SUPABASE_DB_URL }}
      ORIGINAL_MIGRATION_VERSION: "20260726171000"
      ORIGINAL_MIGRATION_NAME: collective_identity_threshold_commitments
      REPAIR_MIGRATION_VERSION: "20260726174500"
      REPAIR_MIGRATION_NAME: fix_collective_manifest_jsonb_aliasing
      ARTIFACT_DIR: ${{ github.workspace }}/collective-manifest-repair-artifacts
      NEXT_PUBLIC_SITE_URL: https://www.moraltrade.org
      VERCEL: "1"
      VERCEL_ENV: preview
      COLLECTIVE_COMMITMENTS_ENABLED: "false"

    steps:
      - name: Validate execution boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY"
          test "$GITHUB_HEAD_REF" = "ops/apply-collective-commitments-20260726"
          test -n "${QA_SUPABASE_DB_URL:-}"
          mkdir -p "$ARTIFACT_DIR"

      - name: Check out temporary operator branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out and guard exact product head
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ghuser29384"
          git config user.email "262476329+ghuser29384@users.noreply.github.com"
          git fetch origin "$PRODUCT_BRANCH"
          git checkout -B "$PRODUCT_BRANCH" "origin/$PRODUCT_BRANCH"
          actual="$(git rev-parse HEAD)"
          if [[ "$actual" != "$EXPECTED_PRODUCT_HEAD" ]]; then
            echo "Refusing moved product head. Expected $EXPECTED_PRODUCT_HEAD, found $actual." >&2
            exit 1
          fi

      - name: Generate exact repair migration and regression guard
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          migration_path = Path("supabase/migrations/20260726171000_collective_identity_threshold_commitments.sql")
          migration = migration_path.read_text()
          replacements = {
              "from jsonb_array_elements(p_manifest) entry;":
                  "from jsonb_array_elements(p_manifest) as manifest(entry);",
              "full join jsonb_array_elements(p_manifest) entry\n":
                  "full join jsonb_array_elements(p_manifest) as manifest(entry)\n",
              "join jsonb_array_elements(p_manifest) entry\n":
                  "join jsonb_array_elements(p_manifest) as manifest(entry)\n",
          }
          for old, new in replacements.items():
              count = migration.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one occurrence of {old!r}; found {count}.")
              migration = migration.replace(old, new)
          migration_path.write_text(migration)

          start = migration.index("create or replace function public.activate_collective_commitment_v1(")
          end = migration.index(
              "create or replace function public.release_collective_commitment_activation_v1(",
              start,
          )
          function_block = migration[start:end].rstrip()
          repair_path = Path(
              "supabase/migrations/20260726174500_fix_collective_manifest_jsonb_aliasing.sql"
          )
          repair_path.write_text(
              "-- Repair PostgreSQL JSONB set-returning-function aliasing in the atomic reveal manifest validator.\n"
              "-- The original migration is corrected for fresh installs; this forward migration repairs QA and\n"
              "-- any environment where version 20260726171000 was already applied.\n"
              "begin;\n\n"
              + function_block
              + "\n\n"
              "revoke all on function public.activate_collective_commitment_v1(uuid, uuid, jsonb, text)\n"
              "  from public, anon, authenticated;\n"
              "grant execute on function public.activate_collective_commitment_v1(uuid, uuid, jsonb, text)\n"
              "  to service_role;\n\n"
              "commit;\n"
          )

          test_path = Path("src/collective-commitments-wiring.test.ts")
          test_source = test_path.read_text()
          old_test = '''test("database activation enforces an exact MAC-backed manifest before publication", async () => {
  const migration = await source(migrationPath);
  assert.match(migration, /collective_commitment_manifest_count_mismatch/);
  assert.match(migration, /collective_commitment_manifest_duplicate_signature/);
  assert.match(migration, /collective_commitment_manifest_exactness_or_mac_failed/);
  assert.match(migration, /extensions\\.hmac/);
  assert.match(migration, /delete from public\\.collective_commitment_private_signatures/);
  assert.match(migration, /delete from public\\.collective_commitment_keys/);
  assert.match(migration, /set status = 'active'/);
});
'''
          new_test = '''test("database activation enforces an exact MAC-backed manifest before publication", async () => {
  const [migration, repairMigration] = await Promise.all([
    source(migrationPath),
    source("supabase/migrations/20260726174500_fix_collective_manifest_jsonb_aliasing.sql"),
  ]);
  for (const activationSource of [migration, repairMigration]) {
    assert.match(activationSource, /collective_commitment_manifest_count_mismatch/);
    assert.match(activationSource, /collective_commitment_manifest_duplicate_signature/);
    assert.match(activationSource, /collective_commitment_manifest_exactness_or_mac_failed/);
    assert.match(activationSource, /extensions\\.hmac/);
    assert.match(activationSource, /jsonb_array_elements\\(p_manifest\\) as manifest\\(entry\\)/);
    assert.doesNotMatch(activationSource, /jsonb_array_elements\\(p_manifest\\) entry/);
    assert.match(activationSource, /delete from public\\.collective_commitment_private_signatures/);
    assert.match(activationSource, /delete from public\\.collective_commitment_keys/);
    assert.match(activationSource, /set status = 'active'/);
  }
});
'''
          count = test_source.count(old_test)
          if count != 1:
              raise SystemExit(f"Expected one wiring-test target; found {count}.")
          test_path.write_text(test_source.replace(old_test, new_test))
          PY

          sha256sum \
            supabase/migrations/20260726171000_collective_identity_threshold_commitments.sql \
            supabase/migrations/20260726174500_fix_collective_manifest_jsonb_aliasing.sql \
            supabase/tests/collective_identity_threshold_commitments.sql \
            | tee "$ARTIFACT_DIR/source-hashes.txt"
          git diff --check

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run focused regressions and lint
        shell: bash
        run: |
          set -o pipefail
          node --import tsx --test \
            src/lib/collective-commitments/types.test.ts \
            src/collective-commitments-wiring.test.ts \
            2>&1 | tee "$ARTIFACT_DIR/focused-tests.log"
          npx eslint \
            src/lib/collective-commitments \
            src/app/collective-commitments \
            src/app/api/jobs/collective-commitments-expire \
            src/components/collective-commitments \
            src/collective-commitments-wiring.test.ts \
            2>&1 | tee "$ARTIFACT_DIR/focused-lint.log"

      - name: Compare full repository tests with exact main
        shell: bash
        run: |
          set -euo pipefail
          set +e
          npm test > "$ARTIFACT_DIR/product-tests.log" 2>&1
          product_status=$?
          set -e

          baseline_dir="$RUNNER_TEMP/collective-main-baseline"
          git worktree add --detach "$baseline_dir" "$EXACT_MAIN_HEAD"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$baseline_dir/node_modules"
          set +e
          (cd "$baseline_dir" && npm test) > "$ARTIFACT_DIR/main-tests.log" 2>&1
          main_status=$?
          set -e

          PRODUCT_STATUS="$product_status" MAIN_STATUS="$main_status" python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import re

          artifact = Path(os.environ["ARTIFACT_DIR"])
          pattern = re.compile(r"^✖ (.+) \((?:\d+(?:\.\d+)?|\d+e[+-]?\d+)ms\)$", re.MULTILINE)

          def failures(name):
              return sorted(set(pattern.findall((artifact / name).read_text(errors="replace"))))

          product_status = int(os.environ["PRODUCT_STATUS"])
          main_status = int(os.environ["MAIN_STATUS"])
          product = failures("product-tests.log")
          main = failures("main-tests.log")
          if product_status != 0 and not product:
              raise SystemExit("Product test command failed without a parseable failing subtest.")
          if main_status != 0 and not main:
              raise SystemExit("Main test command failed without a parseable failing subtest.")
          new = sorted(set(product) - set(main))
          report = {
              "productExit": product_status,
              "mainExit": main_status,
              "productFailures": product,
              "mainFailures": main,
              "newFailures": new,
          }
          (artifact / "full-test-comparison.json").write_text(json.dumps(report, indent=2))
          print(json.dumps(report, indent=2))
          if new:
              raise SystemExit("Repair introduces full-suite failures beyond exact main.")
          PY

      - name: Build exact repaired candidate
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee "$ARTIFACT_DIR/build.log"
          git diff --check "$EXPECTED_PRODUCT_HEAD" -- 2>&1 | tee "$ARTIFACT_DIR/diff-check.log"

      - name: Validate MoralTrade QA target and install PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from urllib.parse import urlparse

          parsed = urlparse(os.environ["QA_SUPABASE_DB_URL"])
          if os.environ["EXPECTED_QA_REF"] not in (parsed.username or ""):
              raise SystemExit("Refusing a database URL outside MoralTrade QA.")
          if parsed.hostname != "aws-0-us-west-1.pooler.supabase.com":
              raise SystemExit(f"Refusing unexpected database host: {parsed.hostname}")
          if parsed.port != 5432 or parsed.path != "/postgres":
              raise SystemExit("Refusing unexpected database connection parameters.")
          PY
          sudo apt-get update -qq
          sudo apt-get install --yes postgresql-client > /dev/null

      - name: Apply exact forward repair to MoralTrade QA
        shell: bash
        run: |
          set -euo pipefail
          repair="supabase/migrations/${REPAIR_MIGRATION_VERSION}_${REPAIR_MIGRATION_NAME}.sql"
          repair_sha="$(sha256sum "$repair" | cut -d' ' -f1)"
          echo "REPAIR_SHA=$repair_sha" >> "$GITHUB_ENV"

          preflight="$ARTIFACT_DIR/qa-preflight.txt"
          psql "$QA_SUPABASE_DB_URL" --no-psqlrc --tuples-only --no-align --set ON_ERROR_STOP=1 <<SQL > "$preflight"
          select case
            when not exists (
              select 1 from supabase_migrations.schema_migrations
              where version='${ORIGINAL_MIGRATION_VERSION}' and name='${ORIGINAL_MIGRATION_NAME}'
            ) then 'FAIL:original_migration_missing'
            when exists (
              select 1 from supabase_migrations.schema_migrations
              where version='${REPAIR_MIGRATION_VERSION}'
            ) then 'FAIL:repair_already_recorded'
            when to_regclass('public.collective_commitments') is null then 'FAIL:schema_missing'
            when to_regprocedure('public.activate_collective_commitment_v1(uuid,uuid,jsonb,text)') is null then 'FAIL:activation_function_missing'
            else 'PASS'
          end;
          SQL
          test "$(tr -d '[:space:]' < "$preflight")" = "PASS"

          apply_file="$RUNNER_TEMP/apply-collective-manifest-repair.sql"
          python3 - "$repair" "$apply_file" <<'PY'
          from pathlib import Path
          import sys

          lines = Path(sys.argv[1]).read_text().splitlines()
          begin_lines = [index for index, line in enumerate(lines) if line.strip().lower() == "begin;"]
          commit_lines = [index for index, line in enumerate(lines) if line.strip().lower() == "commit;"]
          if len(begin_lines) != 1 or len(commit_lines) != 1 or commit_lines[0] != len(lines) - 1:
              raise SystemExit(
                  f"Unexpected repair transaction boundaries: begin={begin_lines}, commit={commit_lines}"
              )
          body = [
              line
              for index, line in enumerate(lines)
              if index not in {begin_lines[0], commit_lines[0]}
          ]
          Path(sys.argv[2]).write_text("\n".join(body) + "\n")
          PY

          cat >> "$apply_file" <<SQL
          insert into supabase_migrations.schema_migrations (
            version, statements, name, created_by, idempotency_key
          ) values (
            '${REPAIR_MIGRATION_VERSION}',
            array['Guarded MoralTrade QA forward repair; sha256 ${repair_sha}'],
            '${REPAIR_MIGRATION_NAME}',
            'github-actions-collective-manifest-repair',
            'collective-${REPAIR_MIGRATION_VERSION}-${repair_sha}'
          );
          SQL

          psql "$QA_SUPABASE_DB_URL" --no-psqlrc --set ON_ERROR_STOP=1 \
            --single-transaction --file "$apply_file" \
            2>&1 | tee "$ARTIFACT_DIR/repair-apply.log"

      - name: Run full transactional database regression
        shell: bash
        run: |
          set -euo pipefail
          psql "$QA_SUPABASE_DB_URL" --no-psqlrc --set ON_ERROR_STOP=1 \
            --file supabase/tests/collective_identity_threshold_commitments.sql \
            2>&1 | tee "$ARTIFACT_DIR/database-regression.log"
          grep -Fq "PASS: duplicate-human and duplicate-account signatures are rejected" "$ARTIFACT_DIR/database-regression.log"
          grep -Fq "PASS: withdrawal and re-signing preserve exact private counts" "$ARTIFACT_DIR/database-regression.log"
          grep -Fq "PASS: incomplete or altered reveal manifests publish zero identities" "$ARTIFACT_DIR/database-regression.log"
          grep -Fq "PASS: exact manifest activation publishes all names atomically and only opted-in affiliations" "$ARTIFACT_DIR/database-regression.log"
          grep -Fq "PASS: activation and expiry erase private ciphertext and per-commitment keys" "$ARTIFACT_DIR/database-regression.log"
          grep -Fq "PASS: frozen terms and direct sensitive-table access are denied" "$ARTIFACT_DIR/database-regression.log"

      - name: Verify repaired QA inventory
        shell: bash
        run: |
          set -euo pipefail
          result="$ARTIFACT_DIR/qa-inventory.txt"
          psql "$QA_SUPABASE_DB_URL" --no-psqlrc --tuples-only --no-align --set ON_ERROR_STOP=1 <<SQL > "$result"
          select case
            when not exists (
              select 1 from supabase_migrations.schema_migrations
              where version='${REPAIR_MIGRATION_VERSION}' and name='${REPAIR_MIGRATION_NAME}'
            ) then 'FAIL:repair_history'
            when has_table_privilege('authenticated', 'public.collective_commitment_private_signatures', 'select') then 'FAIL:private_select'
            when not has_table_privilege('anon', 'public.collective_commitment_public_signers', 'select') then 'FAIL:public_signer_select'
            else 'PASS'
          end;
          SQL
          test "$(tr -d '[:space:]' < "$result")" = "PASS"

      - name: Commit and push tested product repair
        shell: bash
        run: |
          set -euo pipefail
          git add \
            supabase/migrations/20260726171000_collective_identity_threshold_commitments.sql \
            supabase/migrations/20260726174500_fix_collective_manifest_jsonb_aliasing.sql \
            src/collective-commitments-wiring.test.ts
          git commit -m "Fix collective reveal manifest JSONB aliasing"
          git push origin "HEAD:$PRODUCT_BRANCH"
          echo "PRODUCT_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Record sanitized result
        shell: bash
        run: |
          {
            echo "product_head=${PRODUCT_HEAD}"
            echo "qa_project=${EXPECTED_QA_REF}"
            echo "repair_migration_version=${REPAIR_MIGRATION_VERSION}"
            echo "repair_migration_sha256=${REPAIR_SHA}"
            echo "focused_tests=PASS"
            echo "focused_lint=PASS"
            echo "full_test_new_failures=NONE"
            echo "production_build=PASS"
            echo "database_regression=PASS"
            echo "production_changed=NO"
          } > "$ARTIFACT_DIR/result.txt"

      - name: Upload repair evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collective-manifest-repair-${{ github.run_id }}
          path: collective-manifest-repair-artifacts
          if-no-files-found: warn
          retention-days: 14
