name: Production Discover Co-Fund smoke v2

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/production-discover-cofund-smoke-v2.yml"

permissions:
  contents: read

concurrency:
  group: production-discover-cofund-smoke-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run direct production browser smoke
        env:
          BASE_URL: https://www.moraltrade.org
          EXPECTED_PAYLOAD_VERSION: a84dabdc58b8c576b7cdd88f67e959629c2fd4ce
        run: |
          mkdir -p production-smoke-v2
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { writeFile } from "node:fs/promises";
          import { chromium } from "@playwright/test";

          const baseUrl = process.env.BASE_URL;
          const expectedPayloadVersion = process.env.EXPECTED_PAYLOAD_VERSION;
          const report = {
            baseUrl,
            expectedPayloadVersion,
            checkedAt: new Date().toISOString(),
            checks: {},
          };

          function monitor(page) {
            const failures = { consoleErrors: [], pageErrors: [], failedRequests: [] };
            page.on("console", (message) => {
              if (message.type() === "error") failures.consoleErrors.push(message.text());
            });
            page.on("pageerror", (error) => failures.pageErrors.push(error.message));
            page.on("requestfailed", (request) => {
              const error = request.failure()?.errorText || "failed";
              if (error.includes("ERR_ABORTED")) return;
              failures.failedRequests.push({ method: request.method(), url: request.url(), error });
            });
            return failures;
          }

          function assertHealthy(failures, label) {
            assert.deepEqual(failures.consoleErrors, [], `${label}: console errors`);
            assert.deepEqual(failures.pageErrors, [], `${label}: page errors`);
            assert.deepEqual(failures.failedRequests, [], `${label}: failed requests`);
          }

          function assertIncludesCI(haystack, needle, label = needle) {
            assert.ok(
              String(haystack).toLocaleLowerCase().includes(String(needle).toLocaleLowerCase()),
              `missing ${label}`,
            );
          }

          async function waitForDiscover(page) {
            await page.waitForFunction(
              () => !document.body.innerText.includes("Loading Discover…"),
              null,
              { timeout: 120_000 },
            );
            await page.waitForFunction(
              () => Boolean(window.__moralTradeSmartQueryLoaded),
              null,
              { timeout: 120_000 },
            );
          }

          async function createContext(browser, viewport) {
            const context = await browser.newContext({ viewport });
            await context.addCookies([
              {
                name: "mt_walkthrough_seen",
                value: "1",
                domain: "www.moraltrade.org",
                path: "/",
                httpOnly: true,
                secure: true,
                sameSite: "Lax",
              },
            ]);
            return context;
          }

          async function openDiscover(page, path) {
            const response = await page.goto(`${baseUrl}${path}`, {
              waitUntil: "networkidle",
              timeout: 120_000,
            });
            assert.equal(response?.status(), 200, `${path} must return 200`);
            await waitForDiscover(page);
            return response;
          }

          const browser = await chromium.launch({ headless: true });
          try {
            const context = await createContext(browser, { width: 1600, height: 1000 });

            const page = await context.newPage();
            const failures = monitor(page);
            const requests = [];
            page.on("request", (request) => {
              requests.push({
                method: request.method(),
                url: request.url(),
                resourceType: request.resourceType(),
              });
            });

            const response = await openDiscover(
              page,
              "/discover?domain=offers&view=list&offerKind=co-fund#discover",
            );
            const payloadVersion = await page.evaluate(
              () => window.__MT_DISCOVER_PAYLOAD_VERSION__ || "",
            );
            assert.equal(payloadVersion, expectedPayloadVersion);

            const rows = page.locator('.offer-transaction-row[data-offer-kind="co-fund"]');
            assert.equal(await rows.count(), 2);
            const switcher = page.getByRole("group", { name: "Offer listing type" }).first();
            assert.equal(
              await switcher.getByRole("button", { name: "Co-Funds" }).getAttribute("aria-pressed"),
              "true",
            );
            assert.equal(await switcher.getByRole("button", { name: "All offers" }).isVisible(), true);
            assert.equal(
              await switcher.getByRole("button", { name: "Individual offers" }).isVisible(),
              true,
            );

            const bioSalary = page.locator('[data-row-id="cofund-bio-salary"]');
            const bioText = (await bioSalary.innerText()).replace(/\s+/g, " ");
            for (const text of [
              "Co-Fund",
              "You + contributors provide",
              "Counterparty provides",
              "Verified biosecurity candidate",
              "$1,360 remains",
              "Funding closes Jul 22",
              "Join Co-Fund",
            ]) {
              assertIncludesCI(bioText, text);
            }
            assert.doesNotMatch(bioText, /Counteroffer/i);

            const progress = bioSalary.locator("[data-cofund-progress]");
            assert.equal(await progress.getAttribute("data-threshold"), "25000");
            assert.equal(await progress.getAttribute("data-funded"), "23640");
            assert.equal(await progress.getAttribute("data-contributors"), "54");
            assert.equal(await progress.getAttribute("data-minimum-contribution"), "10");
            await page.screenshot({ path: "production-smoke-v2/desktop-cofund-list.png", fullPage: true });

            await bioSalary.getByRole("button", { name: "Join Co-Fund" }).click();
            const inspector = page
              .locator(".inspector")
              .filter({ hasText: "Co-Fund a verified biosecurity salary gap" });
            await inspector.waitFor({ state: "visible" });
            const inspectorText = (await inspector.innerText()).replace(/\s+/g, " ");
            for (const text of [
              "The reciprocal trade",
              "Threshold and release conditions",
              "If the threshold is missed",
              "No contributor is charged",
              "does not charge or create a payment authorization",
            ]) {
              assertIncludesCI(inspectorText, text);
            }
            await page.screenshot({
              path: "production-smoke-v2/desktop-cofund-inspector.png",
              fullPage: true,
            });

            const finalJoin = inspector.getByRole("button", { name: /Join Co-Fund with \$10/i });
            assert.equal(await finalJoin.isVisible(), true);
            const beforeFinal = requests.length;
            await finalJoin.click();
            await page.waitForTimeout(800);
            const finalRequests = requests.slice(beforeFinal);
            const paymentRequests = finalRequests.filter(({ url }) =>
              /(stripe|payment[-_]?intent|checkout|payment-authorization|authorize-payment|\/api\/.{0,40}payment)/i.test(url),
            );
            assert.deepEqual(paymentRequests, [], "Join must not create a payment request");
            const toast = page.locator(".toast");
            assert.equal(await toast.count(), 1);
            const toastText = (await toast.innerText()).replace(/\s+/g, " ");
            assertIncludesCI(toastText, "no charge");
            assertIncludesCI(toastText, "payment authorization");
            assertHealthy(failures, "desktop Co-Fund flow");
            report.checks.desktop = {
              routeStatus: response?.status(),
              url: page.url(),
              payloadVersion,
              coFundCount: await rows.count(),
              inspectorNoCharge: true,
              finalJoinToast: toastText,
              paymentRequests,
              failures,
            };

            const pools = await context.newPage();
            const poolFailures = monitor(pools);
            const poolResponse = await openDiscover(pools, "/discover?domain=pools&view=list#discover");
            assert.equal(
              await pools.getByRole("heading", { name: "Standalone threshold pools" }).isVisible(),
              true,
            );
            assert.equal(await pools.locator('.transaction-row[data-row-id^="pool-"]').count(), 3);
            assert.equal(await pools.locator('[data-row-id="pool-bio-salary"]').count(), 0);
            assert.equal(await pools.locator('[data-row-id="pool-factory-transition"]').count(), 0);
            const poolBody = await pools.locator("body").innerText();
            assert.doesNotMatch(poolBody, /Verified biosecurity salary-gap pool/i);
            assert.doesNotMatch(poolBody, /Factory-farming supplier transition assurance pool/i);
            await pools.screenshot({
              path: "production-smoke-v2/desktop-standalone-pools.png",
              fullPage: true,
            });
            assertHealthy(poolFailures, "standalone Pools");
            report.checks.pools = {
              routeStatus: poolResponse?.status(),
              poolCount: 3,
              failures: poolFailures,
            };

            const legacy = await context.newPage();
            const legacyFailures = monitor(legacy);
            await openDiscover(
              legacy,
              "/discover?domain=pools&view=threshold&selected=pool-bio-salary&selectedType=pool#discover",
            );
            await legacy.locator(".inspector").waitFor({ state: "visible" });
            assert.match(legacy.url(), /domain=offers/);
            assert.match(legacy.url(), /view=list/);
            assert.match(legacy.url(), /offerKind=co-fund/);
            assert.match(legacy.url(), /selected=cofund-bio-salary/);
            assertIncludesCI(
              await legacy.locator(".inspector").innerText(),
              "Co-Fund a verified biosecurity salary gap",
            );
            assertHealthy(legacyFailures, "legacy migration");
            report.checks.legacyMigration = { url: legacy.url(), failures: legacyFailures };

            const search = await context.newPage();
            const searchFailures = monitor(search);
            await openDiscover(search, "/discover?domain=offers&view=list#discover");
            const searchForm = search.locator("#command-form");
            await searchForm.locator("#command-input").fill("group buying a moral trade");
            await searchForm.getByRole("button", { name: /Run search/i }).click();
            await search.waitForURL(/offerKind=co-fund/, { timeout: 30_000 });
            await waitForDiscover(search);
            assert.match(search.url(), /domain=offers/);
            assert.match(search.url(), /view=list/);
            assert.equal(
              await search.locator('.offer-transaction-row[data-offer-kind="co-fund"]').count(),
              2,
            );
            assertHealthy(searchFailures, "group-buying search");
            report.checks.groupBuyingSearch = { url: search.url(), failures: searchFailures };

            const assurance = await context.newPage();
            const assuranceFailures = monitor(assurance);
            await openDiscover(assurance, "/discover?domain=offers&view=list#discover");
            const assuranceForm = assurance.locator("#command-form");
            await assuranceForm.locator("#command-input").fill("dominant assurance contracts");
            await assuranceForm.getByRole("button", { name: /Run search/i }).click();
            await assurance.waitForURL(/domain=pools/, { timeout: 30_000 });
            await waitForDiscover(assurance);
            assert.doesNotMatch(assurance.url(), /offerKind=co-fund/);
            assertHealthy(assuranceFailures, "dominant-assurance search");
            report.checks.assuranceSearch = { url: assurance.url(), failures: assuranceFailures };

            await context.close();

            for (const { width, height, label } of [
              { width: 390, height: 844, label: "390x844" },
              { width: 320, height: 568, label: "320x568" },
            ]) {
              const mobileContext = await createContext(browser, { width, height });
              const mobile = await mobileContext.newPage();
              const mobileFailures = monitor(mobile);
              await openDiscover(
                mobile,
                "/discover?domain=offers&view=list&offerKind=co-fund#discover",
              );
              const row = mobile.locator('[data-row-id="cofund-bio-salary"]');
              await row.waitFor({ state: "visible" });
              const offerBox = await row.locator('[data-exchange-side="offer"]').boundingBox();
              const returnBox = await row.locator('[data-exchange-side="return"]').boundingBox();
              assert.ok(offerBox && returnBox);
              assert.ok(returnBox.y >= offerBox.y + offerBox.height - 1, `${label}: sides must stack`);
              const overflow = await mobile.evaluate(() => ({
                documentWidth: document.documentElement.scrollWidth,
                bodyWidth: document.body.scrollWidth,
                viewportWidth: window.innerWidth,
              }));
              assert.ok(overflow.documentWidth <= overflow.viewportWidth + 1, `${label}: document overflow`);
              assert.ok(overflow.bodyWidth <= overflow.viewportWidth + 1, `${label}: body overflow`);
              assert.equal(
                await mobile.locator('.offer-transaction-row[data-offer-kind="co-fund"]').count(),
                2,
              );
              await mobile.screenshot({
                path: `production-smoke-v2/mobile-${label}.png`,
                fullPage: true,
              });
              assertHealthy(mobileFailures, `mobile ${label}`);
              report.checks[`mobile-${label}`] = {
                overflow,
                stacked: true,
                failures: mobileFailures,
              };
              await mobileContext.close();
            }

            report.pass = true;
          } catch (error) {
            report.pass = false;
            report.error = error instanceof Error ? `${error.stack || error.message}` : String(error);
            throw error;
          } finally {
            await writeFile(
              "production-smoke-v2/report.json",
              `${JSON.stringify(report, null, 2)}\n`,
            );
            await browser.close();
          }
          NODE

      - name: Upload production smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-discover-cofund-smoke-v2
          path: production-smoke-v2
          if-no-files-found: error
          retention-days: 7
