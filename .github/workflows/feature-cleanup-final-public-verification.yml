name: Verify final feature cleanup in production
on:
  push:
    branches: [ops/feature-cleanup-final-release-20260923]
    paths: [.github/workflows/feature-cleanup-final-public-verification.yml]
permissions:
  contents: read
  actions: read
jobs:
  verify:
    if: github.repository == 'ghuser29384/Website2' && github.ref == 'refs/heads/ops/feature-cleanup-final-release-20260923'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      EXPECTED_SHA: fb1d4df06bc4cb55b6ea198ccfc96bc72dbfc94b
      RELEASE_RUN: "35856362409"
    steps:
      - name: Require exact gated production release success
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 100); do
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN" > "$RUNNER_TEMP/expected-release.json"
            test "$(jq -r .head_sha "$RUNNER_TEMP/expected-release.json")" = "$EXPECTED_SHA"
            test "$(jq -r .path "$RUNNER_TEMP/expected-release.json")" = .github/workflows/vercel-release.yml
            if [[ "$(jq -r .status "$RUNNER_TEMP/expected-release.json")" == completed ]]; then
              test "$(jq -r .conclusion "$RUNNER_TEMP/expected-release.json")" = success
              echo 'Exact gated release succeeded; independent verification may proceed.'
              exit 0
            fi
            sleep 15
          done
          echo 'Release is not complete; no production success claimed.' >&2
          exit 1
      - uses: actions/checkout@v4
        with:
          ref: fb1d4df06bc4cb55b6ea198ccfc96bc72dbfc94b
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Prepare existing browser tooling without production credentials
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD^{tree})" = d13dbe94f1a1ce27fa6aa1cc2393cc1b6c4e228b
          npm ci
          npx playwright install --with-deps chromium
      - name: Reuse exact six-feature verifier and add repaired stylesheet readback
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/feature-production-evidence"
          gh api "repos/$GITHUB_REPOSITORY/git/blobs/f07053cce49cb0b67fe778ff93da18b4fac5b8e3" --jq .content | base64 --decode > "$RUNNER_TEMP/feature-cleanup-live-check.mjs"
          printf '%s  %s\n' 63fb971f1a8383a1d9908654a487ea5de2472c1d02e4c45dd8fc36bcbd895bd2 "$RUNNER_TEMP/feature-cleanup-live-check.mjs" | sha256sum --check
          python - <<'PY'
          import os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'feature-cleanup-live-check.mjs'
          source = path.read_text()
          old = "['moral-trade-live-navigation.js', 'moral-trade-discover.html']"
          new = "['moral-trade-live-navigation.js', 'moral-trade-discover.html', 'moral-trade-live-home-offer.css']"
          assert source.count(old) == 1
          path.write_text(source.replace(old, new, 1))
          PY
          node --check "$RUNNER_TEMP/feature-cleanup-live-check.mjs"
          cp "$RUNNER_TEMP/feature-cleanup-live-check.mjs" "$RUNNER_TEMP/feature-production-evidence/verifier.mjs"
          sha256sum "$RUNNER_TEMP/feature-cleanup-live-check.mjs" > "$RUNNER_TEMP/feature-production-evidence/verifier-sha256.txt"
      - name: Test actual anonymous desktop and mobile routes without transaction writes
        shell: bash
        run: |
          set -euo pipefail
          export FEATURE_EVIDENCE_DIR="$RUNNER_TEMP/feature-production-evidence"
          node "$RUNNER_TEMP/feature-cleanup-live-check.mjs" 2>&1 | tee "$FEATURE_EVIDENCE_DIR/run.log"
          git diff --exit-code
      - name: Preserve public verification report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feature-cleanup-final-live-${{ github.run_id }}
          path: ${{ runner.temp }}/feature-production-evidence/
          retention-days: 7
          if-no-files-found: warn
