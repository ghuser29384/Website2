name: Diagnose Donation Redirect candidate lint

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read

concurrency:
  group: donation-redirect-group-buying-walkthrough-20260726
  cancel-in-progress: true

jobs:
  diagnose-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the exact branch
        uses: actions/checkout@v4
        with:
          ref: feature/donation-redirect-group-buying-walkthrough-20260726

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply the guarded walkthrough patch
        run: python3 scripts/apply-donation-redirect-group-buying-walkthrough.py

      - name: Capture candidate lint findings
        run: npx eslint . --format json --output-file candidate-eslint.json || true

      - name: Upload candidate lint findings
        uses: actions/upload-artifact@v4
        with:
          name: donation-redirect-candidate-eslint
          path: candidate-eslint.json
          if-no-files-found: error
          retention-days: 3

      - name: Mark diagnostic run incomplete by design
        run: exit 1
