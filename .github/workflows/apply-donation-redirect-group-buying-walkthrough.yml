name: Patch Donation Redirect walkthrough route assertions

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

concurrency:
  group: donation-redirect-group-buying-walkthrough-20260726
  cancel-in-progress: true

jobs:
  patch-route-assertions:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/donation-redirect-group-buying-walkthrough-20260726

      - name: Add production-route assertion repairs to the guarded updater
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/apply-donation-redirect-group-buying-walkthrough.py")
          text = path.read_text(encoding="utf-8")
          sentinel = "make career-backing route assertion match production shell rewrite"

          if sentinel in text:
              print("Production-route assertion repairs were already present in the updater.")
          else:
              marker = "write(e2e_path, e2e)"
              if text.count(marker) != 1:
                  raise RuntimeError(
                      f"Expected one e2e write marker, found {text.count(marker)}"
                  )

              repair_block = '''e2e = replace_once(
              e2e,
              '    "https://moraltrade.org/create?mode=back",',
              '    "/create?source=walkthrough&mode=back",',
              "make career-backing route assertion match production shell rewrite",
          )
          e2e = replace_once(
              e2e,
              '    "https://moraltrade.org/pools",',
              '    "/discover?source=walkthrough&domain=pools&view=threshold",',
              "make conditional-pools route assertion match production shell rewrite",
          )
          write(e2e_path, e2e)'''

              text = text.replace(marker, repair_block, 1)
              path.write_text(text, encoding="utf-8")
              print("Added production-route assertion repairs to the updater.")
          PY

      - name: Commit the updater correction when needed
        shell: bash
        run: |
          if git diff --quiet -- scripts/apply-donation-redirect-group-buying-walkthrough.py; then
            echo "No updater change to commit."
            exit 0
          fi
          git add scripts/apply-donation-redirect-group-buying-walkthrough.py
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Align walkthrough route assertions with the production shell"
          git push origin HEAD
