name: Diagnose Donation Redirect walkthrough whitespace

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read

concurrency:
  group: donation-redirect-group-buying-walkthrough-20260726
  cancel-in-progress: true

jobs:
  diagnose-whitespace:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the exact branch
        uses: actions/checkout@v4
        with:
          ref: feature/donation-redirect-group-buying-walkthrough-20260726

      - name: Apply the guarded walkthrough patch
        run: python3 scripts/apply-donation-redirect-group-buying-walkthrough.py

      - name: Capture whitespace diagnostics
        shell: bash
        run: |
          git diff --check 2>&1 | tee whitespace.log || true

      - name: Upload whitespace diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: donation-redirect-whitespace-diagnostics
          path: whitespace.log
          if-no-files-found: error
          retention-days: 3

      - name: Mark diagnostic run incomplete by design
        run: exit 1
