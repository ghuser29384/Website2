name: Patch Donation Redirect walkthrough selectors

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

concurrency:
  group: donation-redirect-group-buying-walkthrough-20260726
  cancel-in-progress: true

jobs:
  patch-selectors:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/donation-redirect-group-buying-walkthrough-20260726

      - name: Add amount-button selector repairs to the guarded updater
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/apply-donation-redirect-group-buying-walkthrough.py")
          text = path.read_text(encoding="utf-8")
          sentinel = "make Crowd ten-dollar selector tolerate decorative input-assist glyph"

          if sentinel in text:
              print("Selector repairs were already present in the updater.")
          else:
              marker = "write(e2e_path, e2e)"
              if text.count(marker) != 1:
                  raise RuntimeError(
                      f"Expected one e2e write marker, found {text.count(marker)}"
                  )

              repair_block = '''e2e = replace_once(
              e2e,
              '  await page.getByRole("button", { name: "$10", exact: true }).click();',
              '  await page.getByRole("button", { name: "$10" }).click();',
              "make Crowd ten-dollar selector tolerate decorative input-assist glyph",
          )
          e2e = replace_once(
              e2e,
              '  await page.getByRole("button", { name: "$5", exact: true }).click();',
              '  await page.getByRole("button", { name: "$5" }).click();',
              "make Crowd five-dollar selector tolerate decorative input-assist glyph",
          )
          e2e = replace_once(
              e2e,
              '  await page.getByRole("button", { name: "$25", exact: true }).click();',
              '  await page.getByRole("button", { name: "$25" }).click();',
              "make Crowd twenty-five-dollar selector tolerate decorative input-assist glyph",
          )
          write(e2e_path, e2e)'''

              text = text.replace(marker, repair_block, 1)
              path.write_text(text, encoding="utf-8")
              print("Added resilient amount-button selector repairs to the updater.")
          PY

      - name: Commit the updater correction when needed
        shell: bash
        run: |
          if git diff --quiet -- scripts/apply-donation-redirect-group-buying-walkthrough.py; then
            echo "No updater change to commit."
            exit 0
          fi
          git add scripts/apply-donation-redirect-group-buying-walkthrough.py
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Make walkthrough amount selectors resilient to assist glyphs"
          git push origin HEAD
