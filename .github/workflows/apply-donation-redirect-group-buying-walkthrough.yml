name: Diagnose Donation Redirect walkthrough browser suite

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read

concurrency:
  group: donation-redirect-group-buying-walkthrough-20260726
  cancel-in-progress: true

jobs:
  diagnose-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the exact branch
        uses: actions/checkout@v4
        with:
          ref: feature/donation-redirect-group-buying-walkthrough-20260726

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply the guarded walkthrough patch
        run: python3 scripts/apply-donation-redirect-group-buying-walkthrough.py

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run and capture the complete walkthrough browser suite
        shell: bash
        run: |
          set -o pipefail
          npx playwright test tests/walkthrough.spec.ts --reporter=line 2>&1 | tee playwright.log || true

      - name: Upload browser diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: donation-redirect-playwright-diagnostics-final
          path: |
            playwright.log
            test-results
          if-no-files-found: warn
          retention-days: 3

      - name: Mark diagnostic run incomplete by design
        run: exit 1
