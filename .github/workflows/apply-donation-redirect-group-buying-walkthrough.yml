name: Patch Donation Redirect walkthrough selectors

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

concurrency:
  group: donation-redirect-group-buying-walkthrough-20260726
  cancel-in-progress: true

jobs:
  patch-selectors:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/donation-redirect-group-buying-walkthrough-20260726

      - name: Make amount-button selectors tolerate decorative assist glyphs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/apply-donation-redirect-group-buying-walkthrough.py")
          text = path.read_text(encoding="utf-8")

          replacements = {
              '  await page.getByRole("button", { name: "$10", exact: true }).click();':
                  '  await page.getByRole("button", { name: "$10" }).click();',
              '  await page.getByRole("button", { name: "$5", exact: true }).click();':
                  '  await page.getByRole("button", { name: "$5" }).click();',
              '  await page.getByRole("button", { name: "$25", exact: true }).click();':
                  '  await page.getByRole("button", { name: "$25" }).click();',
          }

          changed = False
          for old, new in replacements.items():
              old_count = text.count(old)
              new_count = text.count(new)
              if old_count == 1:
                  text = text.replace(old, new, 1)
                  changed = True
              elif old_count == 0 and new_count >= 1:
                  continue
              else:
                  raise RuntimeError(
                      f"Unexpected selector state for {old!r}: old={old_count}, new={new_count}"
                  )

          if changed:
              path.write_text(text, encoding="utf-8")
              print("Updated generated Playwright selectors.")
          else:
              print("Generated Playwright selectors were already updated.")
          PY

      - name: Commit the updater correction when needed
        shell: bash
        run: |
          if git diff --quiet -- scripts/apply-donation-redirect-group-buying-walkthrough.py; then
            echo "No updater change to commit."
            exit 0
          fi
          git add scripts/apply-donation-redirect-group-buying-walkthrough.py
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Make walkthrough amount selectors resilient to assist glyphs"
          git push origin HEAD
