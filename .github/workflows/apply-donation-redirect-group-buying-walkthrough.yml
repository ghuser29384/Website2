name: Apply Donation Redirect group-buying walkthrough

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

concurrency:
  group: donation-redirect-group-buying-walkthrough-20260726
  cancel-in-progress: true

jobs:
  implement-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out the exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/donation-redirect-group-buying-walkthrough-20260726

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Establish the exact main unit-test baseline
        shell: bash
        run: |
          set -o pipefail
          git worktree add /tmp/moraltrade-main-baseline origin/main
          ln -s "$GITHUB_WORKSPACE/node_modules" /tmp/moraltrade-main-baseline/node_modules
          (cd /tmp/moraltrade-main-baseline && npm test 2>&1 | tee "$GITHUB_WORKSPACE/main-unit-test.log") || true

      - name: Apply the guarded walkthrough patch
        run: python3 scripts/apply-donation-redirect-group-buying-walkthrough.py

      - name: Run the complete candidate unit and source-contract suite
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee candidate-unit-test.log || true

      - name: Require zero new full-suite failures relative to main
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          pattern = re.compile(r"^✖ (.+?) \([0-9.]+ms\)$")

          def failures(path: str) -> set[str]:
              names: set[str] = set()
              for line in Path(path).read_text(encoding="utf-8", errors="replace").splitlines():
                  if line == "✖ failing tests:":
                      break
                  match = pattern.match(line)
                  if match:
                      names.add(match.group(1))
              return names

          baseline = failures("main-unit-test.log")
          candidate = failures("candidate-unit-test.log")
          new_failures = sorted(candidate - baseline)

          print(f"main failures: {len(baseline)}")
          print(f"candidate failures: {len(candidate)}")
          if new_failures:
              print("new candidate failures:")
              for name in new_failures:
                  print(f"- {name}")
              raise SystemExit(1)

          print("No new full-suite failures relative to the exact main baseline.")
          PY

      - name: Run focused mandatory-walkthrough and Donation Redirect regressions
        run: >-
          node --import tsx --test
          src/proxy.test.ts
          src/walkthrough-production-shell.test.ts
          src/walkthrough-donation-redirect-group-buying.test.ts

      - name: Run lint
        run: npm run lint

      - name: Build the exact candidate
        run: npm run build

      - name: Install Chromium for the complete walkthrough suite
        run: npx playwright install --with-deps chromium

      - name: Run the complete walkthrough browser suite
        run: npx playwright test tests/walkthrough.spec.ts --reporter=line

      - name: Check patch whitespace
        run: git diff --check

      - name: Remove temporary updater files and commit the verified product change
        run: |
          rm scripts/apply-donation-redirect-group-buying-walkthrough.py
          rm .github/workflows/apply-donation-redirect-group-buying-walkthrough.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Expand Donation Redirect walkthrough with coalition group-buying"
          git push origin HEAD
