name: Apply Donation Redirect group-buying walkthrough

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

concurrency:
  group: donation-redirect-group-buying-walkthrough-20260726
  cancel-in-progress: true

jobs:
  implement-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out the exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/donation-redirect-group-buying-walkthrough-20260726

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply the guarded walkthrough patch
        run: python3 scripts/apply-donation-redirect-group-buying-walkthrough.py

      - name: Install dependencies
        run: npm ci

      - name: Run the complete unit and source-contract suite
        id: unit_tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee unit-test.log

      - name: Upload unit-test failure log
        if: steps.unit_tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: donation-redirect-unit-test-log
          path: unit-test.log
          if-no-files-found: error
          retention-days: 3

      - name: Stop after a unit-test failure
        if: steps.unit_tests.outcome == 'failure'
        run: exit 1

      - name: Run lint
        run: npm run lint

      - name: Build the exact candidate
        run: npm run build

      - name: Install Chromium for the focused walkthrough suite
        run: npx playwright install --with-deps chromium

      - name: Run the complete walkthrough browser suite
        run: npx playwright test tests/walkthrough.spec.ts --reporter=line

      - name: Check patch whitespace
        run: git diff --check

      - name: Remove temporary updater files and commit the verified product change
        run: |
          rm scripts/apply-donation-redirect-group-buying-walkthrough.py
          rm .github/workflows/apply-donation-redirect-group-buying-walkthrough.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Expand Donation Redirect walkthrough with coalition group-buying"
          git push origin HEAD
