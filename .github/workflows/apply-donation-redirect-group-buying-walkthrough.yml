name: Patch Donation Redirect walkthrough stylesheet EOF

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

concurrency:
  group: donation-redirect-group-buying-walkthrough-20260726
  cancel-in-progress: true

jobs:
  patch-stylesheet-eof:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/donation-redirect-group-buying-walkthrough-20260726

      - name: Normalize the generated walkthrough stylesheet EOF
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/apply-donation-redirect-group-buying-walkthrough.py")
          text = path.read_text(encoding="utf-8")
          old = 'write(css_path, css.rstrip() + react_css + "\\n")'
          new = 'write(css_path, (css.rstrip() + react_css).rstrip() + "\\n")'

          if old in text:
              if text.count(old) != 1:
                  raise RuntimeError(f"Expected one stylesheet writer, found {text.count(old)}")
              text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8")
              print("Normalized the generated stylesheet EOF.")
          elif new in text:
              print("The generated stylesheet EOF was already normalized.")
          else:
              raise RuntimeError("Could not find the walkthrough stylesheet writer.")
          PY

      - name: Commit the updater correction when needed
        shell: bash
        run: |
          if git diff --quiet -- scripts/apply-donation-redirect-group-buying-walkthrough.py; then
            echo "No updater change to commit."
            exit 0
          fi
          git add scripts/apply-donation-redirect-group-buying-walkthrough.py
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Normalize walkthrough stylesheet EOF"
          git push origin HEAD
