name: PR 212 rendered v4 isolated observer

on:
  push:
    branches:
      - agent/pr212-rendered-v4-observer-20260731
    paths:
      - .github/workflows/pr212-rendered-v4-isolated-observer.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_WORKFLOW: pr212-integrated-rendered-final-v4.yml
      TARGET_BRANCH: agent/pr212-main-integration-ops-20260730
      TARGET_HEAD: ed7faad2442f6b2582874665cf8d5cb806ea022b
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Poll exact rendered-v4 run
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ops/pr212-rendered-v4-isolated
          run_id=""
          status=""
          conclusion=""
          for attempt in $(seq 1 500); do
            gh run list --repo "$GITHUB_REPOSITORY" --workflow "$TARGET_WORKFLOW" --branch "$TARGET_BRANCH" --limit 80 --json databaseId,headSha,status,conclusion,createdAt,url,event > /tmp/runs.json
            run_id="$(jq -r --arg head "$TARGET_HEAD" '[.[] | select(.headSha == $head)] | sort_by(.createdAt) | reverse | .[0].databaseId // empty' /tmp/runs.json)"
            status="$(jq -r --arg head "$TARGET_HEAD" '[.[] | select(.headSha == $head)] | sort_by(.createdAt) | reverse | .[0].status // empty' /tmp/runs.json)"
            conclusion="$(jq -r --arg head "$TARGET_HEAD" '[.[] | select(.headSha == $head)] | sort_by(.createdAt) | reverse | .[0].conclusion // empty' /tmp/runs.json)"
            if [[ -n "$run_id" && "$status" == "completed" ]]; then break; fi
            sleep 10
          done
          if [[ -z "$run_id" ]]; then echo "No exact rendered-v4 run found." >&2; exit 1; fi

          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" > /tmp/run.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100" > /tmp/jobs.json
          gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --log-failed > /tmp/failed.log 2>&1 || true
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100" > /tmp/artifacts.json

          jq -n --arg observed_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg target_head "$TARGET_HEAD" --arg run_id "$run_id" --arg status "$status" --arg conclusion "$conclusion" --slurpfile runs /tmp/runs.json --slurpfile run /tmp/run.json --slurpfile jobs /tmp/jobs.json --slurpfile artifacts /tmp/artifacts.json '{observed_at:$observed_at,target_head:$target_head,run_id:$run_id,status:$status,conclusion:$conclusion,runs:$runs[0],run:$run[0],jobs:$jobs[0].jobs,artifacts:$artifacts[0].artifacts}' > ops/pr212-rendered-v4-isolated/status.json
          tail -n 2200 /tmp/failed.log > ops/pr212-rendered-v4-isolated/failed-log.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops/pr212-rendered-v4-isolated
          git commit -m "Record exact PR 212 rendered-v4 result"
          git push origin HEAD:agent/pr212-rendered-v4-observer-20260731

          test "$status" = "completed"
