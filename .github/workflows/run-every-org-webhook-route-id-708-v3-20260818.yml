name: Run Every.org webhook route-ID hardening v3

on:
  push:
    branches:
      - fix/every-org-webhook-route-id-708-20260818

permissions:
  contents: write

concurrency:
  group: run-every-org-webhook-route-id-708-v3-20260818
  cancel-in-progress: false

env:
  EXPECTED_REPOSITORY: ghuser29384/Website2
  EXPECTED_BRANCH: fix/every-org-webhook-route-id-708-20260818
  EXPECTED_PARENT: 0207a58410480b6edd1bb5a1496bc8ce7c66d6f6
  EXPECTED_PARENT_TREE: 360c4ac6949f1f83adc4e9dbf428b55f3870aea6
  EXPECTED_PARENT_BRANCH: fix/every-org-staging-api-host-708-v3-20260816
  EXPECTED_PREPARE_PARENT: ea48c04efc9796c16adc1e0964ec1b5919dec5da
  PATCH_SOURCE_WORKFLOW: .github/workflows/repair-every-org-webhook-route-id-708-20260818.yml
  THIS_WORKFLOW: .github/workflows/run-every-org-webhook-route-id-708-v3-20260818.yml
  FAILURE_MARKER: route-id-hardening-failure.json

jobs:
  repair:
    if: github.event.head_commit.message == 'Run Every.org webhook route-ID hardening v3'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out exact trigger commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Guard exact ancestry and empty trigger
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY"
          test "$GITHUB_REF_NAME" = "$EXPECTED_BRANCH"
          test "$GITHUB_ACTOR" = ghuser29384
          test "$(git rev-parse HEAD^^)" = "$EXPECTED_PREPARE_PARENT"
          test "$(git show -s --format=%T "$EXPECTED_PARENT")" = "$EXPECTED_PARENT_TREE"
          test "$(git diff --name-only "$EXPECTED_PREPARE_PARENT" HEAD^)" = "$THIS_WORKFLOW"
          git diff --quiet HEAD^ HEAD
          git fetch --no-tags origin "$EXPECTED_PARENT_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_PARENT"
          git merge-base --is-ancestor "$EXPECTED_PARENT" HEAD
          git diff --check "$EXPECTED_PARENT...HEAD"

      - name: Extract, harden, and execute the bounded patch program
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path(".github/workflows/repair-every-org-webhook-route-id-708-20260818.yml")
          lines = workflow.read_text().splitlines()
          starts = [i for i, line in enumerate(lines) if line.strip() == "python3 - <<'PY'"]
          if len(starts) != 1:
              raise SystemExit(f"expected one embedded patch program, found {len(starts)}")
          start = starts[0] + 1
          ends = [i for i in range(start, len(lines)) if lines[i].strip() == "PY"]
          if not ends:
              raise SystemExit("embedded patch program terminator missing")
          block = []
          for line in lines[start:ends[0]]:
              block.append(line[10:] if line.startswith("          ") else line)
          program = "\n".join(block) + "\n"

          reference_anchor = (
              'references = {line.strip() for line in result.stdout.splitlines() if line.strip()}\n'
              'allowed = {'
          )
          reference_replacement = (
              'references = {line.strip() for line in result.stdout.splitlines() if line.strip()}\n'
              'references = {\n'
              '    path for path in references\n'
              '    if not path.startswith(".github/workflows/repair-every-org-webhook-route-id")\n'
              '    and not path.startswith(".github/workflows/run-every-org-webhook-route-id")\n'
              '}\n'
              'allowed = {'
          )
          if reference_anchor not in program:
              raise SystemExit("reference-filter anchor missing")
          program = program.replace(reference_anchor, reference_replacement, 1)

          stale_anchor = (
              'product_candidates = [\n'
              '    path for path in tracked\n'
              '    if path != ".github/workflows/repair-every-org-webhook-route-id-708-20260818.yml"\n'
              ']'
          )
          stale_replacement = (
              'product_candidates = [\n'
              '    path for path in tracked\n'
              '    if not path.startswith(".github/workflows/repair-every-org-webhook-route-id")\n'
              '    and not path.startswith(".github/workflows/run-every-org-webhook-route-id")\n'
              ']'
          )
          if stale_anchor not in program:
              raise SystemExit("stale-scan filter anchor missing")
          program = program.replace(stale_anchor, stale_replacement, 1)
          Path("/tmp/apply-every-org-route-id.py").write_text(program)
          PY
          python3 -m py_compile /tmp/apply-every-org-route-id.py
          python3 /tmp/apply-every-org-route-id.py 2>&1 | tee /tmp/route-id-patch.log
          git diff --check

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        id: install
        run: npm ci

      - name: Run exact source, repository, type, lint, and disabled-build gates
        id: verify
        shell: bash
        env:
          NEXT_PUBLIC_SITE_URL: https://www.moraltrade.org
          VERCEL: "1"
          VERCEL_ENV: preview
          VERCEL_TARGET_ENV: preview
          DIRECT_DONATION_UPGRADES_ENABLED: "false"
          DIRECT_DONATION_UPGRADE_MODE: disabled
          DIRECT_DONATION_UPGRADE_QA_FIXTURES: "false"
          EVERY_ORG_PLEDGE_DONATIONS_ENABLED: "false"
          CONDITIONAL_PAYMENTS_MODE: disabled
          TRADE_DONATION_POOL_ENABLED: "false"
          TRADE_DONATION_POOL_MODE: disabled
        run: |
          set -euo pipefail
          mkdir -p evidence
          {
            echo '=== focused ==='
            node --import tsx --test \
              src/lib/every-org-partner-webhook-auth.test.ts \
              src/lib/every-org-webhook-route-id-source-contract.test.ts \
              src/lib/every-org-api-environment.test.ts \
              src/lib/direct-donation-upgrade.test.ts \
              src/lib/direct-donation-upgrade-split.test.ts \
              src/lib/direct-donation-upgrade-environment-contract.test.ts \
              src/lib/direct-donation-upgrade-source-contract.test.ts \
              src/lib/trade-donation.test.ts \
              src/lib/mpgf.test.ts
            echo '=== repository ==='
            npm test
            echo '=== typescript ==='
            npx tsc --noEmit --pretty false
            echo '=== eslint ==='
            npm run lint -- --quiet
            echo '=== build ==='
            npm run build
          } 2>&1 | tee evidence/verification.log /tmp/route-id-verify.log

      - name: Verify bounded scope, commit, and fast-forward
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/repair-every-org-webhook-route-id-708-20260818.yml \
            .github/workflows/run-every-org-webhook-route-id-708-v2-20260818.yml \
            .github/workflows/run-every-org-webhook-route-id-708-v3-20260818.yml \
            route-id-hardening-failure.json
          git add -A
          git diff --cached --check
          mapfile -t changed < <(git diff --cached --name-only "$EXPECTED_PARENT" | sort)
          printf '%s\n' "${changed[@]}" | tee evidence/changed-paths.txt

          allowed_regex='^(\.env\.example|\.github/workflows/direct-donation-upgrade-(gates|partial-gates|partial-qa|qa|rendered-qa)\.yml|docs/direct-verified-donation-upgrade\.md|docs/every-org-pledge-donation-connector\.md|src/app/api/connectors/every-org/\[(routeId|secret)\]/route\.ts|src/lib/direct-donation-upgrade(-source-contract\.test|-environment-contract\.test|\.test)?\.ts|src/lib/every-org-partner-webhook-auth(\.test)?\.ts|src/lib/every-org-webhook-route-id-source-contract\.test\.ts|src/lib/trade-donation(\.test)?\.ts)$'
          for path in "${changed[@]}"; do
            [[ "$path" =~ $allowed_regex ]] || { echo "Unexpected changed path: $path" >&2; exit 1; }
          done

          test -f 'src/app/api/connectors/every-org/[routeId]/route.ts'
          test ! -e 'src/app/api/connectors/every-org/[secret]/route.ts'
          test -f src/lib/every-org-webhook-route-id-source-contract.test.ts
          grep -Fq 'EVERY_ORG_WEBHOOK_ROUTE_ID=' .env.example
          grep -Fq 'not a credential' .env.example
          ! git grep -n -E 'EVERY_ORG_WEBHOOK_PATH_SECRET|webhookPathSecret|candidatePathSecret|canonicalPathSecret|path_ambiguous|path_mismatch|api/connectors/every-org/\[secret\]' -- .

          git config user.name ghuser29384
          git config user.email 262476329+ghuser29384@users.noreply.github.com
          git commit -m 'Treat Every.org webhook route ID as non-secret'
          final_sha="$(git rev-parse HEAD)"
          final_tree="$(git show -s --format=%T HEAD)"
          {
            echo "final_sha=$final_sha"
            echo "final_tree=$final_tree"
          } | tee evidence/final-identity.txt
          git push origin "HEAD:$EXPECTED_BRANCH"
          echo "final_sha=$final_sha" >> "$GITHUB_OUTPUT"
          echo "final_tree=$final_tree" >> "$GITHUB_OUTPUT"

      - name: Record and upload sanitized exact-head evidence
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "repository=$GITHUB_REPOSITORY"
            echo "branch=$GITHUB_REF_NAME"
            echo "base=$EXPECTED_PARENT"
            echo "head=${{ steps.commit.outputs.final_sha }}"
            echo "tree=${{ steps.commit.outputs.final_tree }}"
            echo "provider_header_contract=unconfirmed"
            echo "deployment_attempted=false"
            echo "provider_transaction_attempted=false"
            echo "checkout_attempted=false"
            echo "donation_attempted=false"
            echo "persistent_database_mutation=false"
          } > evidence/summary.txt
          ! grep -R -n -E 'sb_secret_|vcp_|gh[pousr]_|postgres(ql)?://[^[:space:]]+:[^[:space:]]+@|eyJ[A-Za-z0-9_-]+\.eyJ[A-Za-z0-9_-]+\.' evidence

      - name: Upload success evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: every-org-webhook-route-id-repair-${{ github.run_id }}
          path: evidence
          if-no-files-found: error
          retention-days: 30

      - name: Commit a sanitized failure marker
        if: failure()
        shell: bash
        env:
          OUTCOME_GUARD: ${{ steps.guard.outcome }}
          OUTCOME_PATCH: ${{ steps.patch.outcome }}
          OUTCOME_INSTALL: ${{ steps.install.outcome }}
          OUTCOME_VERIFY: ${{ steps.verify.outcome }}
          OUTCOME_COMMIT: ${{ steps.commit.outcome }}
        run: |
          set -euo pipefail
          git reset --hard "$GITHUB_SHA"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = {
              "schemaVersion": 1,
              "runId": os.environ["GITHUB_RUN_ID"],
              "triggerCommit": os.environ["GITHUB_SHA"],
              "base": os.environ["EXPECTED_PARENT"],
              "outcomes": {
                  name.removeprefix("OUTCOME_").lower(): value
                  for name, value in os.environ.items()
                  if name.startswith("OUTCOME_")
              },
          }
          for name, path in [
              ("patchLogTail", Path("/tmp/route-id-patch.log")),
              ("verificationLogTail", Path("/tmp/route-id-verify.log")),
          ]:
              if path.exists():
                  payload[name] = path.read_text(errors="replace").splitlines()[-100:]
          Path(os.environ["FAILURE_MARKER"]).write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n"
          )
          PY
          git config user.name ghuser29384
          git config user.email 262476329+ghuser29384@users.noreply.github.com
          git add "$FAILURE_MARKER"
          git commit -m 'Update Every.org route-ID hardening failure'
          git push origin "HEAD:$EXPECTED_BRANCH"
