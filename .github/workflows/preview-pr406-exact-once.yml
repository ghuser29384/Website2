name: One-time exact PR 406 canonical preview

on:
  push:
    branches:
      - ops/preview-pr406-20260802
    paths:
      - .github/workflows/preview-pr406-exact-once.yml

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: preview-pr406-exact-once
  cancel-in-progress: false

env:
  CONTROLLER_PATH: .github/workflows/preview-pr406-exact-once.yml
  CONTROLLER_BRANCH: ops/preview-pr406-20260802
  TARGET_BRANCH: feature/pledge-impact-live-foundation-20260801
  EXPECTED_HEAD: 8392ed733a7fa58d5b2775008fa487075d6d9251
  VERCEL_ORG_ID: team_ySu6sF3Uho1E1GnJtCQPVEuJ
  VERCEL_PROJECT_ID: prj_Em3j7Uj7RatX2R1ZYhla3XSHRde7
  VERCEL_CLI_VERSION: 50.38.1
  QA_PROJECT_REF: hvmxfjjbdcgjjudmthdz
  MIGRATION_VERSION: '20260801030000'
  MIGRATION_BLOB: c83ab30d7a84b2c97a70181fb5ba909cbebb75f4

jobs:
  preview:
    if: github.repository == 'ghuser29384/Website2' && github.actor == 'ghuser29384'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      QA_SUPABASE_DB_URL: ${{ secrets.QA_SUPABASE_DB_URL }}

    steps:
      - name: Check out exact PR 406 head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Guard exact head and intended current-main diff
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'ghuser29384/Website2'
          test "$(git branch --show-current)" = "$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')" = "$EXPECTED_HEAD"
          git fetch --no-tags origin main
          cat > /tmp/expected-files.txt <<'EOF'
          .github/workflows/pledge-impact-live-foundation-gates.yml
          src/app/api/mpgf/pledge-impact/route.ts
          src/lib/mpgf/pledge-impact-live-integration.test.ts
          src/lib/mpgf/pledge-impact-live-server.ts
          src/lib/mpgf/pledge-impact-live.test.ts
          src/lib/mpgf/pledge-impact-live.ts
          supabase/migrations/20260801030000_mpgf_pledge_impact_live_foundation.sql
          supabase/tests/mpgf_pledge_impact_live_foundation.sql
          EOF
          sort -o /tmp/expected-files.txt /tmp/expected-files.txt
          git diff --name-only origin/main HEAD | sort > /tmp/actual-files.txt
          diff -u /tmp/expected-files.txt /tmp/actual-files.txt
          git diff --check origin/main HEAD
          test "$(git rev-parse "HEAD:supabase/migrations/20260801030000_mpgf_pledge_impact_live_foundation.sql")" = "$MIGRATION_BLOB"

      - name: Remove one-time controller from its operations branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          blob_sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/$CONTROLLER_PATH?ref=$CONTROLLER_BRANCH" --jq .sha)"
          jq -n --arg message 'Remove one-time exact PR 406 preview controller' --arg sha "$blob_sha" --arg branch "$CONTROLLER_BRANCH" '{message:$message,sha:$sha,branch:$branch}' \
            | gh api --method DELETE "repos/$GITHUB_REPOSITORY/contents/$CONTROLLER_PATH" --input - >/dev/null

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Run complete repository quality gates
        shell: bash
        env:
          NEXT_PUBLIC_SITE_URL: https://www.moraltrade.org
          VERCEL: '1'
          VERCEL_ENV: preview
        run: |
          set -o pipefail
          node --import tsx --test \
            src/lib/mpgf/pledge-impact-live.test.ts \
            src/lib/mpgf/pledge-impact-live-integration.test.ts \
            2>&1 | tee pr406-preview-focused-tests.log
          npm test 2>&1 | tee pr406-preview-repository-tests.log
          npm run lint -- --quiet 2>&1 | tee pr406-preview-eslint.log
          npm run build 2>&1 | tee pr406-preview-build.log

      - name: Validate exact MoralTrade QA target
        shell: bash
        run: |
          set -euo pipefail
          test -n "${QA_SUPABASE_DB_URL:-}"
          python3 - <<'PY'
          import os
          from urllib.parse import urlparse
          parsed = urlparse(os.environ['QA_SUPABASE_DB_URL'])
          if os.environ['QA_PROJECT_REF'] not in (parsed.username or ''):
              raise SystemExit('Refusing a database URL outside exact MoralTrade QA.')
          if parsed.hostname != 'aws-0-us-west-1.pooler.supabase.com' or parsed.port != 5432 or parsed.path != '/postgres':
              raise SystemExit('Refusing unexpected QA database connection parameters.')
          PY

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes postgresql-client > /dev/null

      - name: Re-run exact persistent QA SQL regression
        shell: bash
        run: |
          set -euo pipefail
          test "$(psql "$QA_SUPABASE_DB_URL" --no-psqlrc -Atqc \
            "select count(*) from supabase_migrations.schema_migrations where version = '$MIGRATION_VERSION' and statements[1] like '%' || '$MIGRATION_BLOB' || '%';")" = '1'
          psql "$QA_SUPABASE_DB_URL" \
            --no-psqlrc \
            --set ON_ERROR_STOP=1 \
            --file supabase/tests/mpgf_pledge_impact_live_foundation.sql \
            2>&1 | tee pr406-preview-qa-regression.log

      - name: Link only the canonical Vercel project
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json

      - name: Pull preview environment and build on GitHub Actions
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes "vercel@$VERCEL_CLI_VERSION" pull --yes --environment=preview --token="$VERCEL_TOKEN" --scope=ellen-s
          npx --yes "vercel@$VERCEL_CLI_VERSION" build --token="$VERCEL_TOKEN" --scope=ellen-s

      - name: Deploy the exact prebuilt preview once
        id: deploy
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          deployment_url="$(npx --yes "vercel@$VERCEL_CLI_VERSION" deploy --prebuilt --token="$VERCEL_TOKEN" --scope=ellen-s | tail -n1)"
          deployment_url="${deployment_url//$'\r'/}"
          test -n "$deployment_url"
          [[ "$deployment_url" == https://* ]]
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$deployment_url" > pr406-preview-url.txt

      - name: Wait for preview readiness
        shell: bash
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.deployment_url }}
        run: |
          set -euo pipefail
          status='000'
          for attempt in $(seq 1 40); do
            status="$(curl --silent --show-error --location --output /tmp/pr406-preview-root.html --write-out '%{http_code}' --max-time 20 "$PREVIEW_URL" || true)"
            if [[ "$status" == '200' ]]; then break; fi
            sleep 5
          done
          test "$status" = '200'
          grep -Fq 'Moral Trade' /tmp/pr406-preview-root.html

      - name: Verify fail-closed no-store preview API and method boundary
        shell: bash
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.deployment_url }}
        run: |
          set -euo pipefail
          valid_url="$PREVIEW_URL/api/mpgf/pledge-impact?pool=pool-preview-unmapped&pledgeCents=3500"
          curl --silent --show-error --location --dump-header pr406-preview-api.headers \
            --output pr406-preview-api.json --write-out '%{http_code}' "$valid_url" \
            > pr406-preview-api.status
          test "$(cat pr406-preview-api.status)" = '200'
          grep -Eiq '^cache-control:.*private.*no-store' pr406-preview-api.headers
          test "$(jq -r .status pr406-preview-api.json)" = 'unavailable'
          test "$(jq -r .experimental pr406-preview-api.json)" = 'true'
          test "$(jq -r .poolPublicKey pr406-preview-api.json)" = 'pool-preview-unmapped'
          reason="$(jq -r .reason pr406-preview-api.json)"
          [[ "$reason" == 'pool_not_live' || "$reason" == 'service_unavailable' ]]
          test "$(jq -r '.mechanicalEffect == null' pr406-preview-api.json)" = 'true'

          curl --silent --show-error --location --output pr406-preview-malformed.json \
            --write-out '%{http_code}' \
            "$PREVIEW_URL/api/mpgf/pledge-impact?pool=bad&pledgeCents=3500" \
            > pr406-preview-malformed.status
          test "$(cat pr406-preview-malformed.status)" = '400'

          curl --silent --show-error --location --output pr406-preview-invalid-amount.json \
            --write-out '%{http_code}' \
            "$PREVIEW_URL/api/mpgf/pledge-impact?pool=pool-preview-unmapped&pledgeCents=3.5" \
            > pr406-preview-invalid-amount.status
          test "$(cat pr406-preview-invalid-amount.status)" = '400'

          curl --silent --show-error --location --request POST --output pr406-preview-post.json \
            --write-out '%{http_code}' "$valid_url" > pr406-preview-post.status
          test "$(cat pr406-preview-post.status)" = '405'

          jq -n \
            --arg previewUrl "$PREVIEW_URL" \
            --arg commit "$EXPECTED_HEAD" \
            --arg reason "$reason" \
            --arg cacheControl "$(grep -Ei '^cache-control:' pr406-preview-api.headers | tr -d '\r' | head -n1)" \
            '{previewUrl:$previewUrl,commit:$commit,available:false,reason:$reason,cacheControl:$cacheControl,malformedStatus:400,invalidAmountStatus:400,postStatus:405,noProductionMappingPublished:true}' \
            > pr406-preview-evidence.json

      - name: Upload exact preview evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr406-exact-preview-${{ github.run_id }}
          path: |
            pr406-preview-url.txt
            pr406-preview-evidence.json
            pr406-preview-focused-tests.log
            pr406-preview-repository-tests.log
            pr406-preview-eslint.log
            pr406-preview-build.log
            pr406-preview-qa-regression.log
            pr406-preview-api.headers
            pr406-preview-api.json
            pr406-preview-api.status
            pr406-preview-malformed.json
            pr406-preview-malformed.status
            pr406-preview-invalid-amount.json
            pr406-preview-invalid-amount.status
            pr406-preview-post.json
            pr406-preview-post.status
            /tmp/actual-files.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Report exact preview result to PR 406
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [[ "${{ job.status }}" == 'success' ]]; then
            preview_url="$(cat pr406-preview-url.txt)"
            reason="$(jq -r .reason pr406-preview-evidence.json)"
            gh pr comment 406 --repo "$GITHUB_REPOSITORY" --body "Exact canonical preview gates passed for \`$EXPECTED_HEAD\`. Focused and complete repository tests, ESLint, production build/TypeScript, exact persistent-QA SQL regression, and remote API inspection passed. The preview is read-only and no-store, rejects malformed input and non-GET mutation, publishes no production pool mapping or numerical forecast, and fails closed with \`$reason\` before the production migration is released. Preview: $preview_url Evidence: $run_url"
          else
            gh pr comment 406 --repo "$GITHUB_REPOSITORY" --body "Exact canonical preview gates failed for \`$EXPECTED_HEAD\`. PR #406 remains draft and unmerged; production mapping and forecast publication remain disabled. Evidence: $run_url"
          fi

      - name: Enforce verified exact preview
        if: always()
        shell: bash
        run: test "${{ job.status }}" = 'success'
