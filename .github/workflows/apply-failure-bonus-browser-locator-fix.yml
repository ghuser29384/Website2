name: Apply failure bonus browser locator fix

on:
  pull_request:
    branches:
      - feature/mpgf-failure-bonus-success-premium-20260726
    paths:
      - ".github/failure-bonus-browser-locator-fix.patch"
      - ".github/workflows/apply-failure-bonus-browser-locator-fix.yml"

permissions:
  contents: write

jobs:
  apply-fix:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'qa/failure-bonus-authenticated-browser-20260726'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact QA branch
        uses: actions/checkout@v4
        with:
          ref: qa/failure-bonus-authenticated-browser-20260726
          fetch-depth: 0

      - name: Apply exact locator repair and remove temporary machinery
        shell: bash
        run: |
          set -euxo pipefail
          git apply --check .github/failure-bonus-browser-locator-fix.patch
          git apply .github/failure-bonus-browser-locator-fix.patch
          rm -f .github/failure-bonus-browser-locator-fix.patch
          rm -f .github/workflows/apply-failure-bonus-browser-locator-fix.yml
          node --check .github/scripts/failure-bonus-authenticated-browser-qa.mjs
          git add -A
          git diff --cached --check
          git config user.name "Moral Trade QA automation"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Fix exact template banner locator in failure-bonus QA"
          git push origin HEAD:qa/failure-bonus-authenticated-browser-20260726
