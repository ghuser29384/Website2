name: Repair pre-activation dump client

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
    paths:
      - .github/workflows/repair-preactivation-dump-client.yml

permissions:
  contents: write

concurrency:
  group: repair-preactivation-dump-client-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'database/preactivation-schema-baseline-20260818'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Replace host pg_dump with the Supabase CLI dump container
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/database/generate-preactivation-baseline.sh')
          text = path.read_text()
          old = '''if ! command -v pg_dump >/dev/null 2>&1; then
            fail "pg_dump is required."
          fi

          pg_dump "$PROD_SUPABASE_DB_URL" \\
            --schema-only \\
            --no-owner \\
            --no-comments \\
            --no-security-labels \\
            --no-publications \\
            --no-subscriptions \\
            --schema=public \\
            --schema=moral_trade_private \\
            > "$DUMP_RAW"
          '''
          new = '''npx --yes supabase@2.110.0 db dump \\
            --db-url "$PROD_SUPABASE_DB_URL" \\
            --schema public,moral_trade_private \\
            --file "$DUMP_RAW" \\
            > "$EVIDENCE_ROOT/logs/supabase-db-dump.log" 2>&1
          test -s "$DUMP_RAW"
          '''
          if text.count(old) != 1:
              raise SystemExit(f'Expected one host pg_dump block, found {text.count(old)}.')
          path.write_text(text.replace(old, new))
          PY
          bash -n scripts/database/generate-preactivation-baseline.sh
          git diff --check

      - name: Commit and push normally
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/database/generate-preactivation-baseline.sh
          git commit -m 'Use Supabase-compatible schema dump client'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
