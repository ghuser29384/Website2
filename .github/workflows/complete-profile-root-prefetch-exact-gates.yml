name: Complete Profile root-prefetch exact gates

on:
  pull_request:
    paths:
      - ".github/workflows/complete-profile-root-prefetch-exact-gates.yml"

permissions:
  contents: read
  statuses: write

concurrency:
  group: complete-profile-root-prefetch-exact-gates-395186b1
  cancel-in-progress: false

jobs:
  exact-gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      EXPECTED_SHA: 395186b114c81f73c68e29ce151f5811dfc039ee
      STATUS_CONTEXT: QA / Complete Profile prefetch exact gates

    steps:
      - name: Mark exact candidate pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${EXPECTED_SHA}" \
            -f state=pending \
            -f context="${STATUS_CONTEXT}" \
            -f description="Running typecheck, lint, build, and rendered Complete Profile regressions" \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Check out exact cleanup candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 1

      - name: Verify exact checkout
        run: test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Parse the permanent canary
        run: node --check .github/scripts/complete-profile-production-canary.mjs

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint focused files
        run: >-
          npx eslint
          src/components/profile/complete-profile-review.tsx
          tests/complete-profile-review.spec.ts

      - name: Build production application
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run rendered Complete Profile regressions
        run: npx playwright test tests/complete-profile-review.spec.ts --project=chromium

      - name: Upload rendered evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: complete-profile-root-prefetch-exact-gates-395186b1
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish exact-gate result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [[ "$JOB_STATUS" == "success" ]]; then
            state=success
            description="Typecheck, lint, build, and rendered Complete Profile regressions passed"
          else
            state=failure
            description="Complete Profile prefetch exact gates failed; inspect workflow evidence"
          fi
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${EXPECTED_SHA}" \
            -f state="$state" \
            -f context="${STATUS_CONTEXT}" \
            -f description="$description" \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
