name: PR 212 pinned-main integration observer

on:
  push:
    branches:
      - agent/pr212-main-integration-ops-20260730
    paths:
      - .github/workflows/pr212-integrate-main-observer.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: pr212-integrate-main-observer
  cancel-in-progress: true

jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_WORKFLOW: pr212-integrate-main-and-gate.yml
      TARGET_BRANCH: agent/pr212-main-integration-ops-20260730
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait for terminal integration result and record evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ops/pr212-main-integration
          run_id=""
          status=""
          conclusion=""
          for attempt in $(seq 1 360); do
            gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow "$TARGET_WORKFLOW" \
              --branch "$TARGET_BRANCH" \
              --limit 20 \
              --json databaseId,status,conclusion,createdAt,headSha,event,url \
              > /tmp/runs.json
            run_id="$(jq -r 'sort_by(.createdAt) | reverse | .[0].databaseId // empty' /tmp/runs.json)"
            status="$(jq -r 'sort_by(.createdAt) | reverse | .[0].status // empty' /tmp/runs.json)"
            conclusion="$(jq -r 'sort_by(.createdAt) | reverse | .[0].conclusion // empty' /tmp/runs.json)"
            if [[ -n "$run_id" && "$status" == "completed" ]]; then break; fi
            sleep 10
          done

          if [[ -z "$run_id" ]]; then
            echo "No integration run found." >&2
            exit 1
          fi

          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" > /tmp/run.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100" > /tmp/jobs.json
          gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --log-failed > /tmp/failed.log 2>&1 || true
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100" > /tmp/artifacts.json

          jq -n \
            --arg run_id "$run_id" \
            --arg status "$status" \
            --arg conclusion "$conclusion" \
            --arg observed_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --slurpfile runs /tmp/runs.json \
            --slurpfile run /tmp/run.json \
            --slurpfile jobs /tmp/jobs.json \
            --slurpfile artifacts /tmp/artifacts.json \
            '{observed_at:$observed_at,run_id:$run_id,status:$status,conclusion:$conclusion,runs:$runs[0],run:$run[0],jobs:$jobs[0].jobs,artifacts:$artifacts[0].artifacts}' \
            > ops/pr212-main-integration/terminal-report.json
          tail -n 800 /tmp/failed.log > ops/pr212-main-integration/failed-log.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops/pr212-main-integration/terminal-report.json ops/pr212-main-integration/failed-log.txt
          git commit -m "Record PR 212 pinned-main integration result"
          git push origin HEAD:agent/pr212-main-integration-ops-20260730

          test "$status" = "completed"
