name: A1 production authenticated smoke

on:
  pull_request:
    branches:
      - main
    paths:
      - .a1-production-smoke/**
      - .github/workflows/a1-production-authenticated-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: a1-production-authenticated-smoke
  cancel-in-progress: false

jobs:
  validate-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out smoke bundle
        uses: actions/checkout@v4
      - name: Reconstruct and syntax-check smoke script
        shell: bash
        run: |
          set -euo pipefail
          cat .a1-production-smoke/part-* | base64 --decode > /tmp/a1-production-smoke.mjs
          sha256sum /tmp/a1-production-smoke.mjs
          node --check /tmp/a1-production-smoke.mjs

  verify-production-loop:
    needs: validate-bundle
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      A1_SMOKE_BASE_URL: https://www.moraltrade.org
      A1_SMOKE_OUTPUT_DIR: a1-production-smoke-evidence
      A1_PRODUCTION_SOURCE_SHA: 818f9ad67cfe5746cb01f3b774a475b2d5fb57b2
      PROD_SUPABASE_DB_URL: ${{ secrets.PROD_SUPABASE_DB_URL }}
      QA_TEST_PASSWORD: ${{ secrets.QA_TEST_PASSWORD }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_ySu6sF3Uho1E1GnJtCQPVEuJ
      VERCEL_PROJECT_ID: prj_Em3j7Uj7RatX2R1ZYhla3XSHRde7
      VERCEL_SCOPE: ellen-s
    steps:
      - name: Check out smoke bundle
        uses: actions/checkout@v4
        with:
          path: ops
          fetch-depth: 1

      - name: Check out exact current production source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.A1_PRODUCTION_SOURCE_SHA }}
          path: app
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Validate and mask protected inputs
        shell: bash
        run: |
          set -euo pipefail
          for name in PROD_SUPABASE_DB_URL QA_TEST_PASSWORD VERCEL_TOKEN; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required secret: $name"
              exit 1
            fi
          done
          echo "::add-mask::$PROD_SUPABASE_DB_URL"
          echo "::add-mask::$QA_TEST_PASSWORD"
          echo "::add-mask::$VERCEL_TOKEN"
          test "$(git -C app rev-parse HEAD)" = "$A1_PRODUCTION_SOURCE_SHA"

      - name: Install PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Rotate production CRON_SECRET and redeploy exact source
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          CRON_SECRET="$(openssl rand -hex 32)"
          echo "::add-mask::$CRON_SECRET"
          echo "CRON_SECRET=$CRON_SECRET" >> "$GITHUB_ENV"

          mkdir -p app/.vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > app/.vercel/project.json

          cd app
          printf '%s' "$CRON_SECRET" | npx --yes vercel@56.5.0 env add CRON_SECRET production \
            --force --sensitive --token "$VERCEL_TOKEN" --scope "$VERCEL_SCOPE"

          set +e
          npx --yes vercel@56.5.0 deploy --prod --yes \
            --token "$VERCEL_TOKEN" --scope "$VERCEL_SCOPE" 2>&1 | tee ../vercel-production-deploy.log
          deploy_code=${PIPESTATUS[0]}
          set -e
          if [ "$deploy_code" -ne 0 ]; then
            exit "$deploy_code"
          fi

          deployment_url="$(grep -Eo 'https://[A-Za-z0-9.-]+\.vercel\.app' ../vercel-production-deploy.log | tail -1 || true)"
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"

          for attempt in $(seq 1 60); do
            status="$(curl -sS -o /dev/null -w '%{http_code}' https://www.moraltrade.org/api/live-now || true)"
            if [ "$status" = "200" ]; then
              break
            fi
            sleep 5
          done
          test "$(curl -sS -o /dev/null -w '%{http_code}' https://www.moraltrade.org/api/live-now)" = "200"

      - name: Install application and browser dependencies
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium

      - name: Materialize and run authenticated production sequence
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          cat ../ops/.a1-production-smoke/part-* | base64 --decode > .a1-production-smoke.mjs
          sha256sum .a1-production-smoke.mjs
          node --check .a1-production-smoke.mjs
          node .a1-production-smoke.mjs

      - name: Verify Vercel Cron invokes the protected handler
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          npx --yes vercel@56.5.0 crons run /api/jobs/recommendation-training \
            --token "$VERCEL_TOKEN" --scope "$VERCEL_SCOPE" 2>&1 | tee ../vercel-cron-run.log

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a1-production-authenticated-smoke-${{ github.run_id }}
          path: |
            app/a1-production-smoke-evidence
            vercel-production-deploy.log
            vercel-cron-run.log
          if-no-files-found: warn
          retention-days: 30
