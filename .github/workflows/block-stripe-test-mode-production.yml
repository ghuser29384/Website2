name: Block Stripe test mode in production

on:
  push:
    branches:
      - fix/block-stripe-test-mode-in-production-20260716
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/block-stripe-test-mode-in-production-20260716
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply production payment guard
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str) -> None:
              file_path = Path(path)
              source = file_path.read_text()
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match in {path}, found {count}: {old!r}")
              file_path.write_text(source.replace(old, new))

          replace_exact(
              "src/lib/payments/conditional-state.ts",
              "    // A Stripe test key cannot move live money. Inferring test mode here keeps every\n"
              "    // deployment operable in a clearly labelled sandbox without weakening the live gate.\n",
              "    // A Stripe test key cannot move live money. Infer test mode for local and preview\n"
              "    // environments; the production guard below blocks it on the public site.\n",
          )

          replace_exact(
              "src/lib/payments/conditional-state.ts",
              '  if (mode === "disabled") {\n',
              '  const deploymentEnvironment = environment.VERCEL_ENV?.trim().toLowerCase();\n\n'
              '  if (deploymentEnvironment === "production" && mode === "test") {\n'
              '    return {\n'
              '      enabled: false,\n'
              '      livemode: false,\n'
              '      mode: "disabled",\n'
              '      reason:\n'
              '        "Stripe test mode is blocked on the production site. Complete live account verification and configure Stripe live keys before enabling conditional payments.",\n'
              '    };\n'
              '  }\n\n'
              '  if (mode === "disabled") {\n',
          )

          replace_exact(
              "src/lib/payments/conditional-state.test.ts",
              '''test("a test key safely enables sandbox mode in every deployment environment", () => {
            const productionSandbox = getConditionalPaymentsEnvironment({
              NODE_ENV: "production",
              VERCEL_ENV: "production",
              STRIPE_SECRET_KEY: "sk_test_example",
            } as NodeJS.ProcessEnv);

            assert.equal(productionSandbox.enabled, true);
            assert.equal(productionSandbox.mode, "test");
            assert.equal(productionSandbox.livemode, false);
          });
          '''.replace("          ", ""),
              '''test("Stripe test mode is available in preview and blocked on the production site", () => {
            const previewSandbox = getConditionalPaymentsEnvironment({
              VERCEL_ENV: "preview",
              STRIPE_SECRET_KEY: "sk_test_example",
            } as NodeJS.ProcessEnv);
            assert.equal(previewSandbox.enabled, true);
            assert.equal(previewSandbox.mode, "test");
            assert.equal(previewSandbox.livemode, false);

            const productionSandbox = getConditionalPaymentsEnvironment({
              CONDITIONAL_PAYMENTS_MODE: "test",
              VERCEL_ENV: "production",
              STRIPE_SECRET_KEY: "sk_test_example",
            } as NodeJS.ProcessEnv);
            assert.equal(productionSandbox.enabled, false);
            assert.equal(productionSandbox.mode, "disabled");
            assert.equal(productionSandbox.livemode, false);
            assert.match(productionSandbox.reason, /blocked on the production site/);
          });
          '''.replace("          ", ""),
          )

          replace_exact(
              "src/app/donation-offsets/payments/page.tsx",
              '''function statusLabel(status: string | null | undefined) {
            return (status || "not started").replaceAll("_", " ");
          }
          '''.replace("          ", ""),
              '''function statusLabel(status: string | null | undefined) {
            return (status || "not started").replaceAll("_", " ");
          }

          function paymentModeEyebrow(mode: string) {
            if (mode === "live") return "Live conditional payments";
            if (mode === "test") return "Stripe test mode";
            return "Conditional payments unavailable";
          }

          function paymentPostureMessage(mode: string) {
            if (mode === "live") {
              return "Live mode moves real money and uses compensating refunds rather than claiming impossible payment-level atomicity.";
            }
            if (mode === "test") {
              return "TEST MODE — Stripe test objects only. No real charge, donation, tax receipt, or charitable transfer occurs.";
            }
            return "Stripe payments are disabled on the production site until a verified live account, live keys, signed webhook, recipient destination, and settlement gates are ready.";
          }
          '''.replace("          ", ""),
          )

          replace_exact(
              "src/app/donation-offsets/payments/page.tsx",
              '          eyebrow={readiness.livemode ? "Live conditional payments" : "Stripe test mode"}\n',
              '          eyebrow={paymentModeEyebrow(readiness.mode)}\n',
          )

          replace_exact(
              "src/app/donation-offsets/payments/page.tsx",
              '''            <p>
            {readiness.livemode
              ? "Live mode moves real money and uses compensating refunds rather than claiming impossible card-level atomicity."
              : "TEST MODE — Stripe test objects only. No real card charge, donation, tax receipt, or charitable transfer occurs."}
          </p>
          '''.replace("          ", ""),
              '''            <p>{paymentPostureMessage(readiness.mode)}</p>
          '''.replace("          ", ""),
          )

          replace_exact(
              ".env.example",
              "# Keep disabled in production until all live gates pass. Use test only with Stripe test keys,\n"
              "# a signed test webhook, an explicitly test-only recipient mapping, and non-production data.\n",
              "# Keep disabled in production until all live gates pass. Test mode is restricted to local and\n"
              "# preview deployments with Stripe test keys, a signed test webhook, and non-production data.\n",
          )

          replace_exact(
              "docs/stripe-checkout-payment-methods.md",
              "`CONDITIONAL_PAYMENTS_MODE` remains `disabled` by default, and the existing live acceptance gates remain fail-closed. This deployment does not claim that a Hong Kong Stripe account can offer PayPal through Stripe, does not enable live money, and does not alter the separate Every.org donation handoff.\n",
              "`CONDITIONAL_PAYMENTS_MODE` remains `disabled` by default. Stripe test mode is allowed only in local and preview environments; the application blocks it when `VERCEL_ENV=production`. Production conditional payments remain disabled until a verified live account, live API keys, signed webhook, approved destination, and settlement gates are ready. This deployment does not claim that a Hong Kong Stripe account can offer PayPal through Stripe and does not alter the separate Every.org donation handoff.\n",
          )

          Path(".github/workflows/block-stripe-test-mode-production.yml").unlink()
          PY

      - name: Install dependencies
        run: npm ci

      - name: Run focused payment tests
        run: >-
          node --import tsx --test
          src/lib/payments/conditional-state.test.ts
          src/lib/payments/checkout-payment-methods.test.ts

      - name: Lint changed integration
        run: >-
          npx eslint
          src/lib/payments/conditional-state.ts
          src/lib/payments/conditional-state.test.ts
          src/app/donation-offsets/payments/page.tsx

      - name: Build production application
        env:
          CONDITIONAL_PAYMENTS_MODE: disabled
        run: npm run build

      - name: Commit verified guard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Block Stripe test mode on the production site"
          git push origin HEAD:fix/block-stripe-test-mode-in-production-20260716
