name: Evidence credibility shadow QA

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/evidence-credibility-shadow-qa.yml
      - docs/moral-trade/evidence-credibility-shadow-v2.md
      - src/lib/evidence-credibility-shadow-schema-contract.test.ts
      - supabase/migrations/20260810160000_evidence_credibility_shadow_schema_core.sql
      - supabase/migrations/20260810160001_evidence_credibility_shadow_schema_events.sql
      - supabase/migrations/20260810160002_evidence_credibility_shadow_event_plan_refresh.sql
      - supabase/migrations/20260810160003_evidence_credibility_shadow_evidence_materialize.sql
      - supabase/migrations/20260810160004_evidence_credibility_shadow_evidence_rpc.sql
      - supabase/migrations/20260810160005_evidence_credibility_shadow_settlement_materialize.sql
      - supabase/migrations/20260810160006_evidence_credibility_shadow_settlement_rpc.sql
      - supabase/migrations/20260810160007_evidence_credibility_shadow_differential_active.sql
      - supabase/migrations/20260810160008_evidence_credibility_shadow_rls_grants.sql
      - supabase/migrations/20260810160009_evidence_credibility_shadow_evidence_hardening.sql
      - supabase/migrations/20260810160010_evidence_credibility_shadow_settlement_hardening.sql
      - supabase/migrations/20260810160011_evidence_credibility_shadow_advisor_indexes.sql
      - supabase/tests/evidence_credibility_shadow_core.sql
      - supabase/tests/evidence_credibility_shadow_finality.sql
      - supabase/tests/evidence_credibility_shadow_supersession.sql
      - supabase/tests/evidence_credibility_shadow_settlement.sql
      - supabase/tests/evidence_credibility_shadow_authorization.sql
      - supabase/tests/evidence_credibility_shadow_active_compatibility.sql
  push:
    branches:
      - feature/evidence-credibility-shadow-v2-20260810
    paths:
      - .github/workflows/evidence-credibility-shadow-qa.yml
      - docs/moral-trade/evidence-credibility-shadow-v2.md
      - src/lib/evidence-credibility-shadow-schema-contract.test.ts
      - supabase/migrations/202608101600*_evidence_credibility_shadow_*.sql
      - supabase/tests/evidence_credibility_shadow_*.sql
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evidence-credibility-shadow-qa-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: false

env:
  EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  source-and-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.EXPECTED_HEAD_SHA }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Guard exact durable scope and shadow boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test "$(find supabase/migrations -maxdepth 1 -type f -name '202608101600*_evidence_credibility_shadow_*.sql' | wc -l)" -eq 12
          test "$(find supabase/tests -maxdepth 1 -type f -name 'evidence_credibility_shadow_*.sql' | wc -l)" -eq 8
          test -f docs/moral-trade/evidence-credibility-shadow-v2.md
          test -f src/lib/evidence-credibility-shadow-schema-contract.test.ts
          test ! -e .github/staged-evidence-credibility-shadow-qa.yml.txt
          test ! -e .github/materialize-evidence-shadow
          test ! -e .github/workflows/materialize-evidence-credibility-shadow-v2.yml
          test ! -e .github/workflows/stage-evidence-credibility-shadow-qa-workflow.yml
          ! grep -R "jnpoxvalyjtdghnperyu" \
            .github/workflows/evidence-credibility-shadow-qa.yml \
            docs/moral-trade/evidence-credibility-shadow-v2.md \
            src/lib/evidence-credibility-shadow-schema-contract.test.ts \
            supabase/migrations/202608101600*_evidence_credibility_shadow_*.sql \
            supabase/tests/evidence_credibility_shadow_*.sql
          grep -q "mode.*shadow" supabase/migrations/20260810160000_evidence_credibility_shadow_schema_core.sql
          grep -q "milestone_cutover_enabled.*false" supabase/migrations/20260810160000_evidence_credibility_shadow_schema_core.sql
          grep -q "public_effects_enabled.*false" supabase/migrations/20260810160000_evidence_credibility_shadow_schema_core.sql
          grep -q "ranking_effects_enabled.*false" supabase/migrations/20260810160000_evidence_credibility_shadow_schema_core.sql
          grep -q "eligibility_effects_enabled.*false" supabase/migrations/20260810160000_evidence_credibility_shadow_schema_core.sql
          for file in supabase/tests/evidence_credibility_shadow_*.sql; do
            grep -qi '^begin;' "$file"
            grep -qi '^rollback;' "$file"
          done
          git diff --check

      - name: Install exact dependencies
        run: npm ci

      - name: Run evidence-shadow source contract
        run: node --import tsx --test src/lib/evidence-credibility-shadow-schema-contract.test.ts

      - name: Run complete repository tests
        run: npm test

      - name: Run repository-wide ESLint
        run: npm run lint -- --quiet

      - name: Run strict TypeScript
        run: npx tsc --noEmit

      - name: Build production application
        run: npm run build

      - name: Preserve exact-head evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          status="$(git status --short)"
          test -z "$status"
          mkdir -p evidence
          git rev-parse HEAD > evidence/head-sha.txt
          printf '%s' "$status" > evidence/status.txt
          find supabase/migrations -maxdepth 1 -type f -name '202608101600*_evidence_credibility_shadow_*.sql' -print | sort > evidence/migrations.txt
          find supabase/tests -maxdepth 1 -type f -name 'evidence_credibility_shadow_*.sql' -print | sort > evidence/sql-tests.txt
          sha256sum \
            .github/workflows/evidence-credibility-shadow-qa.yml \
            docs/moral-trade/evidence-credibility-shadow-v2.md \
            src/lib/evidence-credibility-shadow-schema-contract.test.ts \
            supabase/migrations/202608101600*_evidence_credibility_shadow_*.sql \
            supabase/tests/evidence_credibility_shadow_*.sql \
            > evidence/file-sha256.txt

      - name: Upload exact-head evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-credibility-shadow-source-${{ github.run_id }}-${{ env.EXPECTED_HEAD_SHA }}
          path: evidence
          if-no-files-found: error
          retention-days: 30

  isolated-database:
    needs: source-and-contracts
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      EXPECTED_QA_POOLER_HOST: aws-0-us-west-1.pooler.supabase.com
      EXPECTED_QA_REF: hvmxfjjbdcgjjudmthdz
      PGSSLMODE: require
      QA_SUPABASE_DB_URL: ${{ secrets.QA_SUPABASE_DB_URL }}
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.EXPECTED_HEAD_SHA }}

      - name: Guard exact candidate and isolated QA target
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test -n "${QA_SUPABASE_DB_URL:-}"
          python3 - <<'PY'
          import os
          from urllib.parse import parse_qs, urlparse

          parsed = urlparse(os.environ["QA_SUPABASE_DB_URL"])
          ssl_modes = parse_qs(parsed.query).get("sslmode", ["require"])
          valid = (
              parsed.scheme in {"postgres", "postgresql"}
              and os.environ["EXPECTED_QA_REF"] in (parsed.username or "")
              and parsed.hostname == os.environ["EXPECTED_QA_POOLER_HOST"]
              and parsed.port == 5432
              and parsed.path == "/postgres"
              and ssl_modes == ["require"]
              and bool(parsed.password)
          )
          if not valid:
              raise SystemExit("Refusing a database URL outside the exact TLS-only MoralTrade QA target.")
          PY

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes postgresql-client > /dev/null

      - name: Bind exact migrations and prove live hardening equivalence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p database-evidence
          python3 - <<'PY' > database-evidence/local-migration-sha256.txt
          import hashlib
          from pathlib import Path

          files = sorted(
              Path("supabase/migrations").glob(
                  "202608101600*_evidence_credibility_shadow_*.sql"
              )
          )
          if len(files) != 12:
              raise SystemExit(f"Expected 12 shadow migrations, found {len(files)}")
          for path in files:
              migration_name = path.stem.split("_", 1)[1]
              body = path.read_text(encoding="utf-8").rstrip("\n")
              digest = hashlib.sha256(body.encode("utf-8")).hexdigest()
              print(f"{migration_name}|{digest}")
          PY

          psql "$QA_SUPABASE_DB_URL" \
            --no-psqlrc \
            --tuples-only \
            --no-align \
            --set ON_ERROR_STOP=1 \
            --command "select name || '|' || encode(digest(statements[1], 'sha256'), 'hex') from supabase_migrations.schema_migrations where name like 'evidence_credibility_shadow_%' and cardinality(statements)=1 order by name" \
            | sed '/^[[:space:]]*$/d' \
            > database-evidence/qa-migration-sha256.txt

          test "$(wc -l < database-evidence/qa-migration-sha256.txt)" -eq 12
          grep -v '^evidence_credibility_shadow_evidence_hardening|' \
            database-evidence/local-migration-sha256.txt \
            | sort \
            > database-evidence/local-recorded-exact-sha256.txt
          grep -v '^evidence_credibility_shadow_evidence_hardening|' \
            database-evidence/qa-migration-sha256.txt \
            | sort \
            > database-evidence/qa-recorded-exact-sha256.txt
          test "$(wc -l < database-evidence/local-recorded-exact-sha256.txt)" -eq 11
          diff -u \
            database-evidence/local-recorded-exact-sha256.txt \
            database-evidence/qa-recorded-exact-sha256.txt
          grep '^evidence_credibility_shadow_evidence_hardening|' \
            database-evidence/local-migration-sha256.txt \
            > database-evidence/local-hardening-record.txt
          grep '^evidence_credibility_shadow_evidence_hardening|' \
            database-evidence/qa-migration-sha256.txt \
            > database-evidence/qa-hardening-record.txt
          test "$(wc -l < database-evidence/local-hardening-record.txt)" -eq 1
          test "$(wc -l < database-evidence/qa-hardening-record.txt)" -eq 1

          live_definition_query="select 'constraint|' || encode(digest(pg_get_constraintdef(c.oid, true), 'sha256'), 'hex') from pg_constraint c where c.conname='trade_evidence_decisions_contradiction_integrity_consistency_check' union all select 'function|' || encode(digest(pg_get_functiondef(p.oid), 'sha256'), 'hex') from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname='record_trade_evidence_decision_v1' order by 1"
          psql "$QA_SUPABASE_DB_URL" \
            --no-psqlrc \
            --tuples-only \
            --no-align \
            --set ON_ERROR_STOP=1 \
            --command "$live_definition_query" \
            | sed '/^[[:space:]]*$/d' \
            > database-evidence/live-hardening-definitions.txt
          test "$(wc -l < database-evidence/live-hardening-definitions.txt)" -eq 2

          psql "$QA_SUPABASE_DB_URL" --no-psqlrc --set ON_ERROR_STOP=1 --quiet <<'SQL'
          \pset tuples_only on
          \pset format unaligned
          begin;
          \i supabase/migrations/20260810160009_evidence_credibility_shadow_evidence_hardening.sql
          \o database-evidence/replayed-hardening-definitions.raw.txt
          select 'constraint|' || encode(digest(pg_get_constraintdef(c.oid, true), 'sha256'), 'hex')
          from pg_constraint c
          where c.conname='trade_evidence_decisions_contradiction_integrity_consistency_check'
          union all
          select 'function|' || encode(digest(pg_get_functiondef(p.oid), 'sha256'), 'hex')
          from pg_proc p
          join pg_namespace n on n.oid=p.pronamespace
          where n.nspname='public' and p.proname='record_trade_evidence_decision_v1'
          order by 1;
          \o
          rollback;
          SQL
          sed '/^[[:space:]]*$/d' \
            database-evidence/replayed-hardening-definitions.raw.txt \
            > database-evidence/replayed-hardening-definitions.txt
          test "$(wc -l < database-evidence/replayed-hardening-definitions.txt)" -eq 2
          diff -u \
            database-evidence/live-hardening-definitions.txt \
            database-evidence/replayed-hardening-definitions.txt

      - name: Record active and shadow baselines
        shell: bash
        run: |
          set -euo pipefail
          psql "$QA_SUPABASE_DB_URL" \
            --no-psqlrc \
            --tuples-only \
            --no-align \
            --set ON_ERROR_STOP=1 <<'SQL' \
            | sed '/^[[:space:]]*$/d' \
            > database-evidence/before-counts.txt
          select 'active_events|' || count(*) from public.credibility_events
          union all select 'active_aggregates|' || count(*) from public.credibility_public_aggregates
          union all select 'active_restrictions|' || count(*) from public.credibility_restrictions
          union all select 'evidence_decisions|' || count(*) from public.trade_evidence_decisions
          union all select 'settlement_decisions|' || count(*) from public.trade_settlement_shadow_decisions
          union all select 'shadow_events|' || count(*) from public.credibility_shadow_events
          union all select 'restriction_signals|' || count(*) from public.credibility_shadow_restriction_signals
          union all select 'shadow_aggregates|' || count(*) from public.credibility_shadow_aggregates
          order by 1;
          SQL

      - name: Run all six rollback-only SQL suites
        shell: bash
        run: |
          set -euo pipefail
          for suite in \
            evidence_credibility_shadow_core \
            evidence_credibility_shadow_finality \
            evidence_credibility_shadow_supersession \
            evidence_credibility_shadow_settlement \
            evidence_credibility_shadow_authorization \
            evidence_credibility_shadow_active_compatibility; do
            psql "$QA_SUPABASE_DB_URL" \
              --no-psqlrc \
              --set ON_ERROR_STOP=1 \
              --file "supabase/tests/${suite}.sql" \
              | tee "database-evidence/${suite}.log"
          done

      - name: Prove rollback, active-pipeline stability, and fail-closed controls
        shell: bash
        run: |
          set -euo pipefail
          psql "$QA_SUPABASE_DB_URL" \
            --no-psqlrc \
            --tuples-only \
            --no-align \
            --quiet \
            --set ON_ERROR_STOP=1 <<'SQL' \
            | sed '/^[[:space:]]*$/d' \
            > database-evidence/after-counts.txt
          do $check$
          begin
            if (select count(*) from public.trade_evidence_decisions) <> 0
               or (select count(*) from public.trade_settlement_shadow_decisions) <> 0
               or (select count(*) from public.credibility_shadow_events) <> 0
               or (select count(*) from public.credibility_shadow_restriction_signals) <> 0
               or (select count(*) from public.credibility_shadow_aggregates) <> 0 then
              raise exception 'Rollback-only shadow QA left synthetic residue.';
            end if;

            if (select count(*) from public.credibility_shadow_controls) <> 1
               or not exists (
                 select 1
                 from public.credibility_shadow_controls
                 where control_key = 'evidence_decision_v2'
                   and mode = 'shadow'
                   and not milestone_cutover_enabled
                   and not public_effects_enabled
                   and not ranking_effects_enabled
                   and not eligibility_effects_enabled
               ) then
              raise exception 'Evidence credibility controls are not uniquely fail-closed.';
            end if;
          end;
          $check$;

          select 'active_events|' || count(*) from public.credibility_events
          union all select 'active_aggregates|' || count(*) from public.credibility_public_aggregates
          union all select 'active_restrictions|' || count(*) from public.credibility_restrictions
          union all select 'evidence_decisions|' || count(*) from public.trade_evidence_decisions
          union all select 'settlement_decisions|' || count(*) from public.trade_settlement_shadow_decisions
          union all select 'shadow_events|' || count(*) from public.credibility_shadow_events
          union all select 'restriction_signals|' || count(*) from public.credibility_shadow_restriction_signals
          union all select 'shadow_aggregates|' || count(*) from public.credibility_shadow_aggregates
          order by 1;
          SQL

          diff -u database-evidence/before-counts.txt database-evidence/after-counts.txt
          psql "$QA_SUPABASE_DB_URL" \
            --no-psqlrc \
            --tuples-only \
            --no-align \
            --set ON_ERROR_STOP=1 \
            --command "select jsonb_build_object('controlKey', control_key, 'mode', mode, 'milestoneCutover', milestone_cutover_enabled, 'publicEffects', public_effects_enabled, 'rankingEffects', ranking_effects_enabled, 'eligibilityEffects', eligibility_effects_enabled) from public.credibility_shadow_controls where control_key='evidence_decision_v2'" \
            | sed '/^[[:space:]]*$/d' \
            > database-evidence/fail-closed-control.json

      - name: Upload isolated-database evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-credibility-shadow-database-${{ github.run_id }}-${{ env.EXPECTED_HEAD_SHA }}
          path: database-evidence
          if-no-files-found: warn
          retention-days: 30
