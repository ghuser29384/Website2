# One-use dispatcher for PR #618. Never merge this branch.
name: Dispatch exact integrated Bottleneck Atlas Preview

on:
  push:
    branches:
      - ops/dispatch-bottleneck-atlas-integrated-preview-20260812
    paths:
      - .github/workflows/dispatch-bottleneck-atlas-integrated-preview-20260812.yml

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: dispatch-bottleneck-atlas-integrated-preview-20260812
  cancel-in-progress: false

env:
  CONTROLLER_BRANCH: ops/dispatch-bottleneck-atlas-integrated-preview-20260812
  BASE_SHA: 2c51f6b6460a6679037d11c49ef63119ddf17f00
  RELEASE_WORKFLOW: vercel-release.yml
  RELEASE_REF: release/vercel-preview
  RELEASE_TARGET: preview
  EXPECTED_RELEASE_SHA: a65181a4a7231b46b15dfaed1b64c5bcee717f4e
  PREVIOUS_RELEASE_RUN_ID: '31560350563'

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact one-use controller
        uses: actions/checkout@v4
        with:
          ref: ops/dispatch-bottleneck-atlas-integrated-preview-20260812
          fetch-depth: 0

      - name: Guard controller-only scope and exact release ref
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'ghuser29384/Website2'
          test "$GITHUB_REF_NAME" = "$CONTROLLER_BRANCH"
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          git diff --check "$BASE_SHA" HEAD
          test "$(git diff --name-only "$BASE_SHA" HEAD)" = '.github/workflows/dispatch-bottleneck-atlas-integrated-preview-20260812.yml'
          test "$(git ls-remote origin "refs/heads/$RELEASE_REF" | awk '{print $1}')" = "$EXPECTED_RELEASE_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$RELEASE_WORKFLOW" --jq .state)" = active

      - name: Dispatch and resolve exact gated Preview run
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            --arg workflow_ref main \
            --arg release_ref "$RELEASE_REF" \
            --arg target "$RELEASE_TARGET" \
            --arg expected_sha "$EXPECTED_RELEASE_SHA" \
            '{ref:$workflow_ref,inputs:{ref:$release_ref,target:$target,expected_sha:$expected_sha}}' \
            | gh api --method POST \
                -H 'Accept: application/vnd.github+json' \
                -H 'X-GitHub-Api-Version: 2022-11-28' \
                "repos/$GITHUB_REPOSITORY/actions/workflows/$RELEASE_WORKFLOW/dispatches" \
                --input - >/dev/null

          run_id=''
          for _ in $(seq 1 40); do
            while IFS= read -r candidate_id; do
              [[ -n "$candidate_id" ]] || continue
              candidate="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$candidate_id")"
              if [[ "$(jq -r '.event' <<<"$candidate")" = workflow_dispatch \
                && "$(jq -r '.head_branch' <<<"$candidate")" = main \
                && "$(jq -r '.inputs.ref // empty' <<<"$candidate")" = "$RELEASE_REF" \
                && "$(jq -r '.inputs.target // empty' <<<"$candidate")" = "$RELEASE_TARGET" \
                && "$(jq -r '.inputs.expected_sha // empty' <<<"$candidate")" = "$EXPECTED_RELEASE_SHA" ]]; then
                run_id="$candidate_id"
                break 2
              fi
            done < <(
              gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$RELEASE_WORKFLOW/runs?event=workflow_dispatch&per_page=30" \
                --jq ".workflow_runs[] | select(.id > $PREVIOUS_RELEASE_RUN_ID) | .id"
            )
            sleep 2
          done
          test -n "$run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "run_url=https://github.com/$GITHUB_REPOSITORY/actions/runs/$run_id" >> "$GITHUB_OUTPUT"

      - name: Record exact integrated Preview dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.release.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          gh pr comment 618 --repo "$GITHUB_REPOSITORY" --body "Dispatched the permanent gated Preview for exact current-main-integrated candidate \`$EXPECTED_RELEASE_SHA\`. Run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$RUN_ID. Production was not targeted."

      - name: Delete the one-use dispatcher branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method DELETE \
            "repos/$GITHUB_REPOSITORY/git/refs/heads/ops%2Fdispatch-bottleneck-atlas-integrated-preview-20260812"
