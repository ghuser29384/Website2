name: PR 477 exact canonical preview v2

on:
  push:
    branches:
      - ops/pr477-exact-preview-v2-20260806

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write
  statuses: write

concurrency:
  group: pr477-exact-canonical-preview-v2
  cancel-in-progress: false

env:
  CANDIDATE_SHA: fbf414bafefc62fc412b1bd188711a214c0dec10
  MAIN_SHA: 8bdc10338121f173a300436a692c04808d56966b
  PRODUCT_PR: "477"
  RELEASE_REF: release/vercel-preview
  BASELINE_RUN_ID: "30877175677"
  STATUS_CONTEXT: QA / PR 477 exact canonical preview
  EVIDENCE_DIR: /tmp/pr477-exact-canonical-preview-v2
  VERCEL_ORG_ID: team_ySu6sF3Uho1E1GnJtCQPVEuJ
  VERCEL_SCOPE: ellen-s
  VERCEL_PROJECT_ID: prj_Em3j7Uj7RatX2R1ZYhla3XSHRde7
  VERCEL_CLI_VERSION: 50.38.1

jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Mark exact preview verification pending
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${CANDIDATE_SHA}" \
            -f state=pending \
            -f context="$STATUS_CONTEXT" \
            -f description="Running exact differential, focused rendered gates, and canonical preview deployment" \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Check out the immutable product candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0

      - name: Guard product PR, main, release ref, and exact candidate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'ghuser29384/Website2'
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

          product_pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PRODUCT_PR}")"
          test "$(jq -r .state <<<"$product_pr")" = 'open'
          test "$(jq -r .draft <<<"$product_pr")" = 'true'
          test "$(jq -r .head.sha <<<"$product_pr")" = "$CANDIDATE_SHA"
          test "$(jq -r .head.ref <<<"$product_pr")" = 'feature/co-act-co-fund-create-v3-20260803'
          test "$(jq -r .base.ref <<<"$product_pr")" = 'main'

          remote_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          remote_release="$(git ls-remote origin refs/heads/$RELEASE_REF | awk '{print $1}')"
          test "$remote_main" = "$MAIN_SHA"
          test "$remote_release" = "$CANDIDATE_SHA"
          git merge-base --is-ancestor "$MAIN_SHA" "$CANDIDATE_SHA"
          git diff --check "$MAIN_SHA"..."$CANDIDATE_SHA"

          mkdir -p "$EVIDENCE_DIR"
          printf '%s\n' "$CANDIDATE_SHA" > "$EVIDENCE_DIR/candidate-sha.txt"
          printf '%s\n' "$MAIN_SHA" > "$EVIDENCE_DIR/main-sha.txt"
          git diff --stat "$MAIN_SHA"..."$CANDIDATE_SHA" > "$EVIDENCE_DIR/diff-stat.txt"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci 2>&1 | tee "$EVIDENCE_DIR/npm-ci.log"

      - name: Run source, lint, type, and production-build gates
        shell: bash
        env:
          NEXT_PUBLIC_SITE_URL: https://www.moraltrade.org
          SITE_URL: https://www.moraltrade.org
          VERCEL: "1"
          VERCEL_ENV: preview
        run: |
          set -euo pipefail
          npm test 2>&1 | tee "$EVIDENCE_DIR/npm-test.log"
          npm run lint -- --quiet 2>&1 | tee "$EVIDENCE_DIR/eslint.log"
          npx tsc --noEmit 2>&1 | tee "$EVIDENCE_DIR/typescript.log"
          npm run build 2>&1 | tee "$EVIDENCE_DIR/next-build.log"

      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          npx playwright install --with-deps chromium \
            2>&1 | tee "$EVIDENCE_DIR/playwright-install.log"

      - name: Run affected production-server browser gates
        shell: bash
        env:
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3210
          SITE_URL: http://127.0.0.1:3210
          PLAYWRIGHT_HTML_OPEN: never
          PLAYWRIGHT_USE_PRODUCTION_SERVER: "1"
          CREATE_ROUTE_CAPTURE: "1"
        run: |
          set -euo pipefail
          npx playwright test \
            tests/complete-profile-review.spec.ts \
            tests/create-entry-routing.spec.ts \
            tests/create-common-ground-pool.spec.ts \
            tests/create-group-contribution-proposal.spec.ts \
            tests/create-route-workbench.spec.ts \
            --workers=1 --reporter=line \
            2>&1 | tee "$EVIDENCE_DIR/focused-rendered.log"

      - name: Run the complete candidate suite for differential evidence
        shell: bash
        env:
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3210
          SITE_URL: http://127.0.0.1:3210
          PLAYWRIGHT_HTML_OPEN: never
        run: |
          set -uo pipefail
          rm -rf .next test-results playwright-report
          set +e
          npx playwright test --reporter=json \
            > "$EVIDENCE_DIR/candidate-report.json" \
            2> "$EVIDENCE_DIR/candidate-playwright.stderr.log"
          status=$?
          set -e
          printf '%s\n' "$status" > "$EVIDENCE_DIR/candidate-exit-status.txt"

          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const dir = process.env.EVIDENCE_DIR;
          const report = JSON.parse(fs.readFileSync(path.join(dir, 'candidate-report.json'), 'utf8'));
          const failures = [];

          function resultErrors(test) {
            const errors = [];
            for (const result of test?.results ?? []) {
              if (result.status === 'passed' || result.status === 'skipped') continue;
              for (const error of result.errors ?? []) {
                const text = String(error?.message ?? error?.stack ?? error ?? '').trim();
                if (text) errors.push(text.slice(0, 6000));
              }
            }
            return errors;
          }

          function visitSuite(suite, ancestors = []) {
            const nextAncestors = suite?.title ? [...ancestors, suite.title] : ancestors;
            for (const spec of suite?.specs ?? []) {
              const failedTests = (spec.tests ?? []).filter((test) =>
                (test.results ?? []).some((result) => !['passed', 'skipped'].includes(result.status)),
              );
              if (spec.ok === false || failedTests.length > 0) {
                failures.push({
                  file: spec.file ?? '',
                  title: [...nextAncestors, spec.title ?? ''].filter(Boolean).join(' › '),
                  errors: failedTests.flatMap(resultErrors),
                });
              }
            }
            for (const child of suite?.suites ?? []) visitSuite(child, nextAncestors);
          }

          for (const suite of report.suites ?? []) visitSuite(suite, []);
          const unique = [];
          const seen = new Set();
          for (const failure of failures) {
            const key = `${failure.file} › ${failure.title}`;
            if (seen.has(key)) continue;
            seen.add(key);
            unique.push({ key, ...failure });
          }
          unique.sort((a, b) => a.key.localeCompare(b.key));

          const hydrationPattern = /hydrated but some attributes of the server rendered HTML didn't match|Hydration failed because the server rendered HTML didn't match/;
          const hydrationFailures = unique.filter((failure) =>
            failure.errors.some((error) => hydrationPattern.test(error)),
          );
          const summary = {
            candidateSha: process.env.CANDIDATE_SHA,
            exitStatus: Number(fs.readFileSync(path.join(dir, 'candidate-exit-status.txt'), 'utf8').trim()),
            stats: report.stats ?? null,
            failureCount: unique.length,
            hydrationMismatchCount: hydrationFailures.length,
            hydrationFailures: hydrationFailures.map((failure) => failure.key),
          };

          fs.writeFileSync(path.join(dir, 'candidate-failures.json'), `${JSON.stringify(unique, null, 2)}\n`);
          fs.writeFileSync(path.join(dir, 'candidate-summary.json'), `${JSON.stringify(summary, null, 2)}\n`);
          fs.writeFileSync(
            path.join(dir, 'candidate-failures.txt'),
            `${unique.map((failure) => failure.key).join('\n')}${unique.length ? '\n' : ''}`,
          );
          console.log(JSON.stringify(summary, null, 2));
          NODE

      - name: Download the immutable three-run browser baseline
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ghuser29384/Website2
          run-id: ${{ env.BASELINE_RUN_ID }}
          pattern: playwright-baseline-*-ad82ed44
          path: /tmp/pr477-browser-baseline
          merge-multiple: false

      - name: Require zero new full-suite failures
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          function walk(dir) {
            const out = [];
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) out.push(...walk(full));
              else out.push(full);
            }
            return out;
          }

          const baselineFiles = walk('/tmp/pr477-browser-baseline').filter((file) => file.endsWith('/failures.json'));
          if (baselineFiles.length < 3) throw new Error(`Expected three baseline failure files, found ${baselineFiles.length}`);

          const baselineUnion = new Set();
          for (const file of baselineFiles) {
            const failures = JSON.parse(fs.readFileSync(file, 'utf8'));
            for (const failure of failures) {
              baselineUnion.add(`${failure.file ?? ''} › ${failure.title ?? ''}`);
            }
          }

          const dir = process.env.EVIDENCE_DIR;
          const summary = JSON.parse(fs.readFileSync(path.join(dir, 'candidate-summary.json'), 'utf8'));
          const failures = JSON.parse(fs.readFileSync(path.join(dir, 'candidate-failures.json'), 'utf8'));
          const newFailures = failures
            .filter((failure) => !baselineUnion.has(failure.key))
            .map((failure) => failure.key)
            .sort();

          const affectedFiles = new Set([
            'tests/complete-profile-review.spec.ts',
            'tests/create-entry-routing.spec.ts',
            'tests/create-common-ground-pool.spec.ts',
            'tests/create-group-contribution-proposal.spec.ts',
            'tests/create-route-workbench.spec.ts',
          ]);
          const affectedFailures = failures
            .filter((failure) => affectedFiles.has(failure.file))
            .map((failure) => failure.key)
            .sort();

          const comparison = {
            baselineRunId: process.env.BASELINE_RUN_ID,
            baselineFailureUnionCount: baselineUnion.size,
            candidate: summary,
            newFailureCount: newFailures.length,
            newFailures,
            affectedFailureCount: affectedFailures.length,
            affectedFailures,
            passed:
              newFailures.length === 0 &&
              affectedFailures.length === 0 &&
              summary.hydrationMismatchCount === 0 &&
              summary.failureCount <= baselineUnion.size &&
              Number(summary.stats?.expected ?? 0) >= 100,
          };

          fs.writeFileSync(path.join(dir, 'browser-differential.json'), `${JSON.stringify(comparison, null, 2)}\n`);
          console.log(JSON.stringify(comparison, null, 2));
          if (!comparison.passed) process.exit(1);
          NODE

          {
            echo '## PR 477 browser differential'
            echo
            echo "- Candidate: \`$CANDIDATE_SHA\`"
            echo "- Candidate full-suite failures: \`$(jq -r '.candidate.failureCount' "$EVIDENCE_DIR/browser-differential.json")\`"
            echo "- New failures: \`$(jq -r '.newFailureCount' "$EVIDENCE_DIR/browser-differential.json")\`"
            echo "- Affected-flow failures: \`$(jq -r '.affectedFailureCount' "$EVIDENCE_DIR/browser-differential.json")\`"
            echo "- Hydration mismatches: \`$(jq -r '.candidate.hydrationMismatchCount' "$EVIDENCE_DIR/browser-differential.json")\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Restore the exact candidate before deployment
        shell: bash
        run: |
          set -euo pipefail
          git checkout --force "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          rm -rf .next test-results playwright-report
          test -z "$(git status --porcelain)"

      - name: Link only the canonical Vercel project
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' \
            "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json

      - name: Pull the exact preview environment
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes "vercel@$VERCEL_CLI_VERSION" pull \
            --yes \
            --environment=preview \
            --scope="$VERCEL_SCOPE" \
            --token="$VERCEL_TOKEN" \
            2>&1 | tee "$EVIDENCE_DIR/vercel-pull.log"

      - name: Build the exact prebuilt Vercel artifact
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_GIT_COMMIT_SHA: ${{ env.CANDIDATE_SHA }}
          VERCEL_GIT_COMMIT_REF: feature/co-act-co-fund-create-v3-20260803
          VERCEL_GIT_REPO_SLUG: Website2
          VERCEL_GIT_REPO_OWNER: ghuser29384
        run: |
          set -euo pipefail
          npx --yes "vercel@$VERCEL_CLI_VERSION" build \
            --scope="$VERCEL_SCOPE" \
            --token="$VERCEL_TOKEN" \
            2>&1 | tee "$EVIDENCE_DIR/vercel-build.log"

      - name: Upload the exact prebuilt artifact once
        id: deploy
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_GIT_COMMIT_SHA: ${{ env.CANDIDATE_SHA }}
          VERCEL_GIT_COMMIT_REF: feature/co-act-co-fund-create-v3-20260803
          VERCEL_GIT_REPO_SLUG: Website2
          VERCEL_GIT_REPO_OWNER: ghuser29384
        run: |
          set -euo pipefail
          deployment_url="$(npx --yes "vercel@$VERCEL_CLI_VERSION" deploy \
            --prebuilt \
            --scope="$VERCEL_SCOPE" \
            --token="$VERCEL_TOKEN")"
          deployment_url="$(printf '%s\n' "$deployment_url" | tail -n 1 | tr -d '\r')"
          test -n "$deployment_url"
          case "$deployment_url" in
            https://*-ellen-s.vercel.app) ;;
            *) echo "Unexpected deployment URL: $deployment_url" >&2; exit 1 ;;
          esac
          printf '%s\n' "$deployment_url" > "$EVIDENCE_DIR/deployment-url.txt"
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"
          printf 'Deployment URL: %s\n' "$deployment_url"

      - name: Verify canonical project, exact Git metadata, and READY state
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
        run: |
          set -euo pipefail
          deployment_host="${DEPLOYMENT_URL#https://}"
          npx --yes "vercel@$VERCEL_CLI_VERSION" inspect "$DEPLOYMENT_URL" \
            --wait \
            --scope="$VERCEL_SCOPE" \
            --token="$VERCEL_TOKEN" \
            --no-color \
            2>&1 | tee "$EVIDENCE_DIR/vercel-inspect.log"

          curl --silent --show-error --fail \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v13/deployments/$deployment_host?teamId=$VERCEL_ORG_ID" \
            > "$EVIDENCE_DIR/deployment.json"

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          deployment = json.loads(Path(os.environ['EVIDENCE_DIR'], 'deployment.json').read_text())
          project = deployment.get('project') or {}
          meta = deployment.get('meta') or {}
          assert deployment.get('readyState') == 'READY', deployment.get('readyState')
          assert (project.get('id') or deployment.get('projectId')) == os.environ['VERCEL_PROJECT_ID']
          assert deployment.get('target') in (None, 'preview'), deployment.get('target')
          assert meta.get('githubCommitSha') == os.environ['CANDIDATE_SHA'], meta.get('githubCommitSha')
          assert meta.get('githubCommitRepo') == 'Website2', meta.get('githubCommitRepo')
          PY

          deployment_id="$(jq -r .id "$EVIDENCE_DIR/deployment.json")"
          test -n "$deployment_id"
          printf '%s\n' "$deployment_id" > "$EVIDENCE_DIR/deployment-id.txt"

          {
            echo '## Canonical preview deployment'
            echo
            echo "- Candidate: \`$CANDIDATE_SHA\`"
            echo "- Project: \`$VERCEL_PROJECT_ID\`"
            echo "- Deployment ID: \`$deployment_id\`"
            echo "- Deployment: $DEPLOYMENT_URL"
            echo '- State: `READY`'
            echo '- Target: preview'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload immutable preview evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr477-exact-canonical-preview-v2-${{ github.run_id }}
          path: /tmp/pr477-exact-canonical-preview-v2
          if-no-files-found: error
          retention-days: 14

      - name: Publish PR evidence and exact status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
        shell: bash
        run: |
          set -euo pipefail
          run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [[ "$JOB_STATUS" == 'success' ]]; then
            state=success
            description="Exact differential and focused rendered gates passed; canonical preview is READY"
            deployment_id="$(cat "$EVIDENCE_DIR/deployment-id.txt")"
            body=$(cat <<EOF
          Exact-head canonical Preview verification passed for PR #477.

          - Candidate: \`$CANDIDATE_SHA\`
          - GitHub Actions run: $run_url
          - Vercel deployment: \`$deployment_id\`
          - Preview: $DEPLOYMENT_URL
          - Complete source suite, ESLint, TypeScript, and production build: passed
          - Affected production-server browser gates: passed
          - Full-suite differential against immutable three-run baseline: zero new failures, zero affected-flow failures, zero hydration mismatches
          - Canonical team/project, exact Git SHA, preview target, and READY state: verified

          No production merge, production alias change, production database mutation, participant enrollment, invitation, payment authorization, capture, or settlement occurred.
          EOF
          )
          else
            state=failure
            description="PR 477 exact canonical preview verification failed; inspect immutable evidence"
            body=$(cat <<EOF
          Exact-head canonical Preview verification failed for PR #477.

          - Candidate: \`$CANDIDATE_SHA\`
          - GitHub Actions run: $run_url
          - Evidence artifact: \`pr477-exact-canonical-preview-v2-${GITHUB_RUN_ID}\`

          No production merge, production alias change, production database mutation, participant enrollment, invitation, payment authorization, capture, or settlement occurred.
          EOF
          )
          fi

          gh api "repos/${GITHUB_REPOSITORY}/statuses/${CANDIDATE_SHA}" \
            -f state="$state" \
            -f context="$STATUS_CONTEXT" \
            -f description="$description" \
            -f target_url="$run_url"
          gh pr comment "$PRODUCT_PR" --repo "$GITHUB_REPOSITORY" --body "$body"

      - name: Delete the one-use controller branch after success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api -X DELETE \
            "repos/${GITHUB_REPOSITORY}/git/refs/heads/ops/pr477-exact-preview-v2-20260806" || true
