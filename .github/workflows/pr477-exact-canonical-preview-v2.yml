name: PR 477 exact canonical preview v3

on:
  push:
    branches:
      - ops/pr477-exact-preview-v2-20260806

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write
  statuses: write

concurrency:
  group: pr477-exact-canonical-preview-v3
  cancel-in-progress: false

env:
  CANDIDATE_SHA: fbf414bafefc62fc412b1bd188711a214c0dec10
  MAIN_SHA: 8bdc10338121f173a300436a692c04808d56966b
  PRODUCT_PR: "477"
  RELEASE_REF: release/vercel-preview
  CONTROLLER_REF: ops/pr477-exact-preview-v2-20260806
  CONTROLLER_PATH: .github/workflows/pr477-exact-canonical-preview-v2.yml
  STATUS_CONTEXT: QA / PR 477 exact canonical preview
  EVIDENCE_DIR: /tmp/pr477-exact-canonical-preview-v3
  MAIN_WORKTREE: /tmp/pr477-current-main-baseline
  CANDIDATE_RUNS: "2"
  MAIN_RUNS: "3"
  VERCEL_ORG_ID: team_ySu6sF3Uho1E1GnJtCQPVEuJ
  VERCEL_SCOPE: ellen-s
  VERCEL_PROJECT_ID: prj_Em3j7Uj7RatX2R1ZYhla3XSHRde7
  VERCEL_CLI_VERSION: 50.38.1

jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Mark exact preview verification pending
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${CANDIDATE_SHA}" \
            -f state=pending \
            -f context="$STATUS_CONTEXT" \
            -f description="Running same-environment current-main differential, focused rendered gates, and canonical preview" \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Check out the immutable product candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0

      - name: Guard controller, product PR, main, release ref, and exact candidate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'ghuser29384/Website2'
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git ls-remote origin "refs/heads/$CONTROLLER_REF" | awk '{print $1}')" = "$GITHUB_SHA"
          test "$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA")" = "$CONTROLLER_PATH"

          product_pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PRODUCT_PR}")"
          test "$(jq -r .state <<<"$product_pr")" = 'open'
          test "$(jq -r .draft <<<"$product_pr")" = 'true'
          test "$(jq -r .head.sha <<<"$product_pr")" = "$CANDIDATE_SHA"
          test "$(jq -r .head.ref <<<"$product_pr")" = 'feature/co-act-co-fund-create-v3-20260803'
          test "$(jq -r .base.ref <<<"$product_pr")" = 'main'

          remote_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          remote_release="$(git ls-remote origin refs/heads/$RELEASE_REF | awk '{print $1}')"
          test "$remote_main" = "$MAIN_SHA"
          test "$remote_release" = "$CANDIDATE_SHA"
          git merge-base --is-ancestor "$MAIN_SHA" "$CANDIDATE_SHA"
          git diff --check "$MAIN_SHA"..."$CANDIDATE_SHA"

          mkdir -p "$EVIDENCE_DIR"
          printf '%s\n' "$CANDIDATE_SHA" > "$EVIDENCE_DIR/candidate-sha.txt"
          printf '%s\n' "$MAIN_SHA" > "$EVIDENCE_DIR/main-sha.txt"
          printf '%s\n' "$GITHUB_SHA" > "$EVIDENCE_DIR/controller-sha.txt"
          git diff --stat "$MAIN_SHA"..."$CANDIDATE_SHA" > "$EVIDENCE_DIR/diff-stat.txt"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact candidate dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci 2>&1 | tee "$EVIDENCE_DIR/candidate-npm-ci.log"

      - name: Run candidate source, lint, type, and production-build gates
        shell: bash
        env:
          NEXT_PUBLIC_SITE_URL: https://www.moraltrade.org
          SITE_URL: https://www.moraltrade.org
          VERCEL: "1"
          VERCEL_ENV: preview
        run: |
          set -euo pipefail
          npm test 2>&1 | tee "$EVIDENCE_DIR/npm-test.log"
          npm run lint -- --quiet 2>&1 | tee "$EVIDENCE_DIR/eslint.log"
          npx tsc --noEmit 2>&1 | tee "$EVIDENCE_DIR/typescript.log"
          npm run build 2>&1 | tee "$EVIDENCE_DIR/next-build.log"

      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          npx playwright install --with-deps chromium \
            2>&1 | tee "$EVIDENCE_DIR/playwright-install.log"

      - name: Run affected production-server browser gates
        shell: bash
        env:
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3210
          SITE_URL: http://127.0.0.1:3210
          PLAYWRIGHT_HTML_OPEN: never
          PLAYWRIGHT_USE_PRODUCTION_SERVER: "1"
          CREATE_ROUTE_CAPTURE: "1"
        run: |
          set -euo pipefail
          npx playwright test \
            tests/complete-profile-review.spec.ts \
            tests/create-entry-routing.spec.ts \
            tests/create-common-ground-pool.spec.ts \
            tests/create-group-contribution-proposal.spec.ts \
            tests/create-route-workbench.spec.ts \
            --workers=1 --reporter=line \
            2>&1 | tee "$EVIDENCE_DIR/focused-rendered.log"

      - name: Install exact Playwright report extractor
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/extract-pr477-playwright.cjs <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const [reportPath, statusPath, prefix, ref] = process.argv.slice(2);
          const dir = process.env.EVIDENCE_DIR;
          const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
          const failures = [];

          function resultErrors(test) {
            const errors = [];
            for (const result of test?.results ?? []) {
              if (result.status === 'passed' || result.status === 'skipped') continue;
              for (const error of result.errors ?? []) {
                const text = String(error?.message ?? error?.stack ?? error ?? '').trim();
                if (text) errors.push(text.slice(0, 6000));
              }
            }
            return errors;
          }

          function visitSuite(suite, ancestors = []) {
            const nextAncestors = suite?.title ? [...ancestors, suite.title] : ancestors;
            for (const spec of suite?.specs ?? []) {
              const failedTests = (spec.tests ?? []).filter((test) =>
                (test.results ?? []).some((result) => !['passed', 'skipped'].includes(result.status)),
              );
              if (spec.ok === false || failedTests.length > 0) {
                failures.push({
                  file: spec.file ?? '',
                  title: [...nextAncestors, spec.title ?? ''].filter(Boolean).join(' › '),
                  errors: failedTests.flatMap(resultErrors),
                });
              }
            }
            for (const child of suite?.suites ?? []) visitSuite(child, nextAncestors);
          }

          for (const suite of report.suites ?? []) visitSuite(suite, []);
          const unique = [];
          const seen = new Set();
          for (const failure of failures) {
            const key = `${failure.file} › ${failure.title}`;
            if (seen.has(key)) continue;
            seen.add(key);
            unique.push({ key, ...failure });
          }
          unique.sort((a, b) => a.key.localeCompare(b.key));

          const hydrationPattern = /hydrated but some attributes of the server rendered HTML didn't match|Hydration failed because the server rendered HTML didn't match/;
          const hydrationFailures = unique.filter((failure) =>
            failure.errors.some((error) => hydrationPattern.test(error)),
          );
          const summary = {
            prefix,
            ref,
            exitStatus: Number(fs.readFileSync(statusPath, 'utf8').trim()),
            stats: report.stats ?? null,
            failureCount: unique.length,
            hydrationMismatchCount: hydrationFailures.length,
            hydrationFailures: hydrationFailures.map((failure) => failure.key),
          };

          fs.writeFileSync(path.join(dir, `${prefix}-failures.json`), `${JSON.stringify(unique, null, 2)}\n`);
          fs.writeFileSync(path.join(dir, `${prefix}-summary.json`), `${JSON.stringify(summary, null, 2)}\n`);
          fs.writeFileSync(
            path.join(dir, `${prefix}-failures.txt`),
            `${unique.map((failure) => failure.key).join('\n')}${unique.length ? '\n' : ''}`,
          );
          console.log(JSON.stringify(summary, null, 2));
          NODE
          node --check /tmp/extract-pr477-playwright.cjs

      - name: Run two complete candidate suites for differential evidence
        shell: bash
        env:
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3210
          SITE_URL: http://127.0.0.1:3210
          PLAYWRIGHT_HTML_OPEN: never
        run: |
          set -uo pipefail
          for run in $(seq 1 "$CANDIDATE_RUNS"); do
            rm -rf .next test-results playwright-report
            set +e
            npx playwright test --workers=1 --reporter=json \
              > "$EVIDENCE_DIR/candidate-${run}-report.json" \
              2> "$EVIDENCE_DIR/candidate-${run}-playwright.stderr.log"
            status=$?
            set -e
            printf '%s\n' "$status" > "$EVIDENCE_DIR/candidate-${run}-exit-status.txt"
            node /tmp/extract-pr477-playwright.cjs \
              "$EVIDENCE_DIR/candidate-${run}-report.json" \
              "$EVIDENCE_DIR/candidate-${run}-exit-status.txt" \
              "candidate-${run}" \
              "$CANDIDATE_SHA"
          done

      - name: Run three same-environment suites on exact current main
        shell: bash
        env:
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3210
          SITE_URL: http://127.0.0.1:3210
          PLAYWRIGHT_HTML_OPEN: never
        run: |
          set -uo pipefail
          rm -rf "$MAIN_WORKTREE"
          git worktree add --detach "$MAIN_WORKTREE" "$MAIN_SHA"
          cd "$MAIN_WORKTREE"
          npm ci 2>&1 | tee "$EVIDENCE_DIR/main-npm-ci.log"

          for run in $(seq 1 "$MAIN_RUNS"); do
            rm -rf .next test-results playwright-report
            set +e
            npx playwright test --workers=1 --reporter=json \
              > "$EVIDENCE_DIR/main-${run}-report.json" \
              2> "$EVIDENCE_DIR/main-${run}-playwright.stderr.log"
            status=$?
            set -e
            printf '%s\n' "$status" > "$EVIDENCE_DIR/main-${run}-exit-status.txt"
            node /tmp/extract-pr477-playwright.cjs \
              "$EVIDENCE_DIR/main-${run}-report.json" \
              "$EVIDENCE_DIR/main-${run}-exit-status.txt" \
              "main-${run}" \
              "$MAIN_SHA"
          done

          cd "$GITHUB_WORKSPACE"
          git worktree remove --force "$MAIN_WORKTREE"

      - name: Require zero reproducible regressions against exact current main
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const dir = process.env.EVIDENCE_DIR;
          const candidateRunCount = Number(process.env.CANDIDATE_RUNS);
          const mainRunCount = Number(process.env.MAIN_RUNS);

          function loadRuns(prefix, count) {
            return Array.from({ length: count }, (_, index) => {
              const run = index + 1;
              return {
                failures: JSON.parse(fs.readFileSync(path.join(dir, `${prefix}-${run}-failures.json`), 'utf8')),
                summary: JSON.parse(fs.readFileSync(path.join(dir, `${prefix}-${run}-summary.json`), 'utf8')),
              };
            });
          }

          function union(sets) {
            return new Set(sets.flatMap((set) => [...set]));
          }

          function frequencyMap(sets) {
            const frequencies = new Map();
            for (const set of sets) {
              for (const key of set) frequencies.set(key, (frequencies.get(key) ?? 0) + 1);
            }
            return frequencies;
          }

          const candidateRuns = loadRuns('candidate', candidateRunCount);
          const mainRuns = loadRuns('main', mainRunCount);
          const candidateSets = candidateRuns.map((run) => new Set(run.failures.map((failure) => failure.key)));
          const mainSets = mainRuns.map((run) => new Set(run.failures.map((failure) => failure.key)));
          const candidateUnion = union(candidateSets);
          const mainUnion = union(mainSets);
          const candidateFrequency = frequencyMap(candidateSets);
          const mainFrequency = frequencyMap(mainSets);

          const candidatePersistent = [...candidateUnion]
            .filter((key) => candidateFrequency.get(key) === candidateRunCount)
            .sort();
          const newPersistentFailures = candidatePersistent
            .filter((key) => !mainUnion.has(key))
            .sort();
          const frequencyRegressions = candidatePersistent
            .filter((key) => (mainFrequency.get(key) ?? 0) < 2)
            .sort();

          const affectedBasenames = new Set([
            'complete-profile-review.spec.ts',
            'create-entry-routing.spec.ts',
            'create-common-ground-pool.spec.ts',
            'create-group-contribution-proposal.spec.ts',
            'create-route-workbench.spec.ts',
          ]);
          const allCandidateFailures = new Map(
            candidateRuns.flatMap((run) => run.failures).map((failure) => [failure.key, failure]),
          );
          const affectedPersistentFailures = candidatePersistent
            .filter((key) => affectedBasenames.has(path.basename(allCandidateFailures.get(key)?.file ?? '')))
            .sort();
          const affectedTransientFailures = [...candidateUnion]
            .filter((key) => !candidatePersistent.includes(key))
            .filter((key) => affectedBasenames.has(path.basename(allCandidateFailures.get(key)?.file ?? '')))
            .sort();

          const candidateHydrationUnion = union(
            candidateRuns.map((run) => new Set(run.summary.hydrationFailures ?? [])),
          );
          const mainHydrationUnion = union(
            mainRuns.map((run) => new Set(run.summary.hydrationFailures ?? [])),
          );
          const newHydrationFailures = [...candidateHydrationUnion]
            .filter((key) => !mainHydrationUnion.has(key))
            .sort();

          const candidateFailureCounts = candidateRuns.map((run) => run.summary.failureCount);
          const mainFailureCounts = mainRuns.map((run) => run.summary.failureCount);
          const candidateExpectedCounts = candidateRuns.map((run) => Number(run.summary.stats?.expected ?? 0));
          const mainExpectedCounts = mainRuns.map((run) => Number(run.summary.stats?.expected ?? 0));
          const candidateMinFailureCount = Math.min(...candidateFailureCounts);
          const mainMaxFailureCount = Math.max(...mainFailureCounts);
          const candidateExpectedMin = Math.min(...candidateExpectedCounts);
          const mainExpectedMin = Math.min(...mainExpectedCounts);

          const comparison = {
            candidateSha: process.env.CANDIDATE_SHA,
            mainSha: process.env.MAIN_SHA,
            candidateRunCount,
            mainRunCount,
            candidateFailureCounts,
            mainFailureCounts,
            candidateUnionCount: candidateUnion.size,
            mainUnionCount: mainUnion.size,
            candidatePersistentCount: candidatePersistent.length,
            newPersistentFailureCount: newPersistentFailures.length,
            newPersistentFailures,
            frequencyRegressionCount: frequencyRegressions.length,
            frequencyRegressions,
            affectedPersistentFailureCount: affectedPersistentFailures.length,
            affectedPersistentFailures,
            affectedTransientFailureCount: affectedTransientFailures.length,
            affectedTransientFailures,
            candidateHydrationUnionCount: candidateHydrationUnion.size,
            mainHydrationUnionCount: mainHydrationUnion.size,
            newHydrationFailureCount: newHydrationFailures.length,
            newHydrationFailures,
            candidateMinFailureCount,
            mainMaxFailureCount,
            candidateExpectedMin,
            mainExpectedMin,
            passed:
              newPersistentFailures.length === 0 &&
              frequencyRegressions.length === 0 &&
              affectedPersistentFailures.length === 0 &&
              newHydrationFailures.length === 0 &&
              candidateMinFailureCount <= mainMaxFailureCount &&
              candidateExpectedMin >= 100 &&
              mainExpectedMin >= 100,
          };

          fs.writeFileSync(path.join(dir, 'browser-differential.json'), `${JSON.stringify(comparison, null, 2)}\n`);
          console.log(JSON.stringify(comparison, null, 2));
          if (!comparison.passed) process.exit(1);
          NODE

          {
            echo '## PR 477 exact-current-main browser differential'
            echo
            echo "- Candidate: \`$CANDIDATE_SHA\`"
            echo "- Main: \`$MAIN_SHA\`"
            echo "- Candidate failure counts: \`$(jq -c '.candidateFailureCounts' "$EVIDENCE_DIR/browser-differential.json")\`"
            echo "- Main failure counts: \`$(jq -c '.mainFailureCounts' "$EVIDENCE_DIR/browser-differential.json")\`"
            echo "- New persistent failures: \`$(jq -r '.newPersistentFailureCount' "$EVIDENCE_DIR/browser-differential.json")\`"
            echo "- Failure-frequency regressions: \`$(jq -r '.frequencyRegressionCount' "$EVIDENCE_DIR/browser-differential.json")\`"
            echo "- Persistent affected-flow failures: \`$(jq -r '.affectedPersistentFailureCount' "$EVIDENCE_DIR/browser-differential.json")\`"
            echo "- New hydration failures: \`$(jq -r '.newHydrationFailureCount' "$EVIDENCE_DIR/browser-differential.json")\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Restore the exact candidate before deployment
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard "$CANDIDATE_SHA"
          git clean -fdx -e node_modules/
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain)"

      - name: Link only the canonical Vercel project
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' \
            "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json

      - name: Pull the exact preview environment
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes "vercel@$VERCEL_CLI_VERSION" pull \
            --yes \
            --environment=preview \
            --scope="$VERCEL_SCOPE" \
            --token="$VERCEL_TOKEN" \
            2>&1 | tee "$EVIDENCE_DIR/vercel-pull.log"

      - name: Build the exact prebuilt Vercel artifact
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_GIT_COMMIT_SHA: ${{ env.CANDIDATE_SHA }}
          VERCEL_GIT_COMMIT_REF: feature/co-act-co-fund-create-v3-20260803
          VERCEL_GIT_REPO_SLUG: Website2
          VERCEL_GIT_REPO_OWNER: ghuser29384
        run: |
          set -euo pipefail
          npx --yes "vercel@$VERCEL_CLI_VERSION" build \
            --scope="$VERCEL_SCOPE" \
            --token="$VERCEL_TOKEN" \
            2>&1 | tee "$EVIDENCE_DIR/vercel-build.log"

      - name: Upload the exact prebuilt artifact once
        id: deploy
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_GIT_COMMIT_SHA: ${{ env.CANDIDATE_SHA }}
          VERCEL_GIT_COMMIT_REF: feature/co-act-co-fund-create-v3-20260803
          VERCEL_GIT_REPO_SLUG: Website2
          VERCEL_GIT_REPO_OWNER: ghuser29384
        run: |
          set -euo pipefail
          deployment_url="$(npx --yes "vercel@$VERCEL_CLI_VERSION" deploy \
            --prebuilt \
            --scope="$VERCEL_SCOPE" \
            --token="$VERCEL_TOKEN")"
          deployment_url="$(printf '%s\n' "$deployment_url" | tail -n 1 | tr -d '\r')"
          test -n "$deployment_url"
          case "$deployment_url" in
            https://*-ellen-s.vercel.app) ;;
            *) echo "Unexpected deployment URL: $deployment_url" >&2; exit 1 ;;
          esac
          printf '%s\n' "$deployment_url" > "$EVIDENCE_DIR/deployment-url.txt"
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"
          printf 'Deployment URL: %s\n' "$deployment_url"

      - name: Verify canonical project, exact Git metadata, and READY state
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
        run: |
          set -euo pipefail
          deployment_host="${DEPLOYMENT_URL#https://}"
          npx --yes "vercel@$VERCEL_CLI_VERSION" inspect "$DEPLOYMENT_URL" \
            --wait \
            --scope="$VERCEL_SCOPE" \
            --token="$VERCEL_TOKEN" \
            --no-color \
            2>&1 | tee "$EVIDENCE_DIR/vercel-inspect.log"

          curl --silent --show-error --fail \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v13/deployments/$deployment_host?teamId=$VERCEL_ORG_ID" \
            > "$EVIDENCE_DIR/deployment.json"

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          deployment = json.loads(Path(os.environ['EVIDENCE_DIR'], 'deployment.json').read_text())
          project = deployment.get('project') or {}
          meta = deployment.get('meta') or {}
          assert deployment.get('readyState') == 'READY', deployment.get('readyState')
          assert (project.get('id') or deployment.get('projectId')) == os.environ['VERCEL_PROJECT_ID']
          assert deployment.get('target') in (None, 'preview'), deployment.get('target')
          assert meta.get('githubCommitSha') == os.environ['CANDIDATE_SHA'], meta.get('githubCommitSha')
          assert meta.get('githubCommitRepo') == 'Website2', meta.get('githubCommitRepo')
          PY

          deployment_id="$(jq -r .id "$EVIDENCE_DIR/deployment.json")"
          test -n "$deployment_id"
          printf '%s\n' "$deployment_id" > "$EVIDENCE_DIR/deployment-id.txt"

          {
            echo '## Canonical preview deployment'
            echo
            echo "- Candidate: \`$CANDIDATE_SHA\`"
            echo "- Project: \`$VERCEL_PROJECT_ID\`"
            echo "- Deployment ID: \`$deployment_id\`"
            echo "- Deployment: $DEPLOYMENT_URL"
            echo '- State: `READY`'
            echo '- Target: preview'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke-test the protected preview and inspect deployment logs
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
        run: |
          set -euo pipefail
          deployment_id="$(cat "$EVIDENCE_DIR/deployment-id.txt")"

          page_status="$(npx --yes "vercel@$VERCEL_CLI_VERSION" curl /trades/new \
            --deployment "$DEPLOYMENT_URL" \
            --scope="$VERCEL_SCOPE" \
            --token="$VERCEL_TOKEN" \
            --silent --show-error --location \
            --output "$EVIDENCE_DIR/preview-trades-new.html" \
            --write-out '%{http_code}' \
            2> "$EVIDENCE_DIR/preview-trades-new.stderr.log" | tail -n 1 | tr -d '\r')"
          test "$page_status" = '200'
          grep -q 'data-create-interface-frame' "$EVIDENCE_DIR/preview-trades-new.html"
          grep -q 'Moral Trade Create' "$EVIDENCE_DIR/preview-trades-new.html"

          participant_status="$(npx --yes "vercel@$VERCEL_CLI_VERSION" curl '/api/create/participants?q=el' \
            --deployment "$DEPLOYMENT_URL" \
            --scope="$VERCEL_SCOPE" \
            --token="$VERCEL_TOKEN" \
            --silent --show-error \
            --output "$EVIDENCE_DIR/preview-participants.json" \
            --write-out '%{http_code}' \
            2> "$EVIDENCE_DIR/preview-participants.stderr.log" | tail -n 1 | tr -d '\r')"
          test "$participant_status" = '401'
          jq -e '.ok == false and .requiresAuth == true' "$EVIDENCE_DIR/preview-participants.json" >/dev/null

          sleep 5
          set +e
          npx --yes "vercel@$VERCEL_CLI_VERSION" logs \
            --deployment "$deployment_id" \
            --since 10m \
            --json \
            --no-follow \
            --scope="$VERCEL_SCOPE" \
            --token="$VERCEL_TOKEN" \
            > "$EVIDENCE_DIR/vercel-runtime-logs.jsonl" \
            2> "$EVIDENCE_DIR/vercel-runtime-logs.stderr.log"
          logs_status=$?
          set -e
          test "$logs_status" -eq 0

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ['EVIDENCE_DIR'], 'vercel-runtime-logs.jsonl')
          serious = []
          for line in path.read_text(encoding='utf-8').splitlines():
              line = line.strip()
              if not line:
                  continue
              try:
                  entry = json.loads(line)
              except json.JSONDecodeError:
                  continue
              level = str(entry.get('level') or entry.get('severity') or '').lower()
              statuses = [
                  entry.get('statusCode'),
                  entry.get('status'),
                  entry.get('responseStatusCode'),
                  (entry.get('response') or {}).get('statusCode') if isinstance(entry.get('response'), dict) else None,
              ]
              status_5xx = any(isinstance(value, int) and value >= 500 for value in statuses)
              if level in {'error', 'fatal'} or status_5xx:
                  serious.append(entry)
          Path(os.environ['EVIDENCE_DIR'], 'vercel-runtime-serious.json').write_text(
              json.dumps(serious, indent=2) + '\n', encoding='utf-8'
          )
          assert not serious, serious
          PY

          {
            echo '## Preview smoke'
            echo
            echo '- `/trades/new`: `200`, Create iframe marker present'
            echo '- `/api/create/participants?q=el` while signed out: expected `401` auth boundary'
            echo '- Deployment-scoped runtime error/fatal/5xx logs after smoke: `0`'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload immutable preview evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr477-exact-canonical-preview-v3-${{ github.run_id }}
          path: /tmp/pr477-exact-canonical-preview-v3
          if-no-files-found: error
          retention-days: 14

      - name: Publish PR evidence and exact status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
        shell: bash
        run: |
          set -euo pipefail
          run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [[ "$JOB_STATUS" == 'success' ]]; then
            state=success
            description="Exact current-main differential passed; canonical preview is READY and smoke-tested"
            deployment_id="$(cat "$EVIDENCE_DIR/deployment-id.txt")"
            body=$(cat <<EOF
          Exact-head canonical Preview verification passed for PR #477.

          - Candidate: \`$CANDIDATE_SHA\`
          - Exact current main: \`$MAIN_SHA\`
          - GitHub Actions run: $run_url
          - Vercel deployment: \`$deployment_id\`
          - Preview: $DEPLOYMENT_URL
          - Complete source suite, ESLint, TypeScript, and production build: passed
          - Affected production-server browser gates: passed
          - Same-environment browser differential: two candidate runs vs three exact-current-main runs; zero new persistent failures, zero failure-frequency regressions, zero persistent affected-flow failures, and zero new hydration failures
          - Canonical team/project, exact Git SHA, preview target, and READY state: verified
          - Protected preview route and signed-out participant-search auth boundary: smoke-tested
          - Deployment-scoped runtime error/fatal/5xx logs after smoke: zero

          No production merge, production alias change, production database mutation, participant enrollment, invitation, payment authorization, capture, or settlement occurred. PR #477 remains draft pending review of this exact preview.
          EOF
          )
          else
            state=failure
            description="PR 477 exact canonical preview verification failed; inspect immutable v3 evidence"
            body=$(cat <<EOF
          Exact-head canonical Preview verification failed for PR #477.

          - Candidate: \`$CANDIDATE_SHA\`
          - Exact current main: \`$MAIN_SHA\`
          - GitHub Actions run: $run_url
          - Evidence artifact: \`pr477-exact-canonical-preview-v3-${GITHUB_RUN_ID}\`

          No production merge, production alias change, production database mutation, participant enrollment, invitation, payment authorization, capture, or settlement occurred.
          EOF
          )
          fi

          gh api "repos/${GITHUB_REPOSITORY}/statuses/${CANDIDATE_SHA}" \
            -f state="$state" \
            -f context="$STATUS_CONTEXT" \
            -f description="$description" \
            -f target_url="$run_url"
          gh pr comment "$PRODUCT_PR" --repo "$GITHUB_REPOSITORY" --body "$body"

      - name: Delete the one-use controller branch after success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api -X DELETE \
            "repos/${GITHUB_REPOSITORY}/git/refs/heads/$CONTROLLER_REF" || true
