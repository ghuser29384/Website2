name: Apply collective browser deadline fix

on:
  pull_request:
    branches:
      - feature/collective-identity-threshold-commitments-20260726
    paths:
      - ".github/scripts/patch-collective-browser-deadlines.py"
      - ".github/workflows/apply-collective-browser-deadline-fix.yml"

permissions:
  contents: write

concurrency:
  group: apply-collective-browser-deadline-fix-20260727
  cancel-in-progress: false

jobs:
  patch:
    if: >-
      github.event.pull_request.head.repo.full_name == 'ghuser29384/Website2' &&
      github.head_ref == 'qa/collective-commitments-adversarial-browser-20260727'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_REPOSITORY: ghuser29384/Website2
      EXPECTED_BRANCH: qa/collective-commitments-adversarial-browser-20260727
      EXPECTED_QA_BASE: d1c54e8cf68214ce39cf84caf889fd84982ce084
      ARTIFACT_DIR: ${{ github.workspace }}/collective-browser-deadline-patch-artifacts

    steps:
      - name: Validate exact execution boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY"
          test "$GITHUB_HEAD_REF" = "$EXPECTED_BRANCH"

      - name: Check out exact pull-request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Apply deterministic deadline and expiry patch
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$ARTIFACT_DIR"
          stage="$ARTIFACT_DIR/stage.log"
          patch_log="$ARTIFACT_DIR/patcher.log"
          : > "$stage"
          checkpoint() { printf '%s\n' "$1" >> "$stage"; }
          trap 'rc=$?; printf "FAIL line=%s command=%s status=%s\n" "$LINENO" "$BASH_COMMAND" "$rc" >> "$stage"; exit "$rc"' ERR

          checkpoint start
          test "$(git merge-base "$EXPECTED_QA_BASE" HEAD)" = "$EXPECTED_QA_BASE"
          checkpoint base-ancestor-verified
          cp .github/scripts/patch-collective-browser-deadlines.py "$RUNNER_TEMP/patch-collective-browser-deadlines.py"
          checkpoint patcher-preserved
          if ! python3 "$RUNNER_TEMP/patch-collective-browser-deadlines.py" > "$patch_log" 2>&1; then
            cat "$patch_log" >&2
            exit 1
          fi
          checkpoint patcher-applied
          node --check .github/scripts/collective-commitments-adversarial-browser-qa.mjs
          grep -Fq '26 * 60 * 60_000' .github/scripts/collective-commitments-adversarial-browser-qa.mjs
          grep -Fq 'createCommitmentDirectly' .github/scripts/collective-commitments-adversarial-browser-qa.mjs
          grep -Fq 'guarded-service-rpc-for-short-expiry' .github/scripts/collective-commitments-adversarial-browser-qa.mjs
          checkpoint content-verified

          git config user.name "ghuser29384"
          git config user.email "262476329+ghuser29384@users.noreply.github.com"
          git add .github/scripts/collective-commitments-adversarial-browser-qa.mjs
          git diff --cached --check
          checkpoint staged-diff-verified
          git commit -m "Fix collective browser deadline and expiry setup"
          checkpoint committed
          git push origin HEAD:"$EXPECTED_BRANCH"
          checkpoint pushed
          printf 'qa_head=%s\nnormal_deadline=26h\nshort_expiry=service_rpc\nproduction_changed=NO\n' \
            "$(git rev-parse HEAD)" > "$ARTIFACT_DIR/result.txt"
          checkpoint complete

      - name: Upload patch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collective-browser-deadline-fix-${{ github.run_id }}
          path: collective-browser-deadline-patch-artifacts
          if-no-files-found: warn
          retention-days: 14
