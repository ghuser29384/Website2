name: Dashboard 100 Sparks default QA
on:
  push:
    branches: [ops/dashboard-sparks-default-20260925]
    paths: [.github/workflows/dashboard-sparks-default-qa.yml]
permissions:
  contents: write
concurrency:
  group: dashboard-sparks-default-20260925
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3210
      SITE_URL: http://127.0.0.1:3210
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54331
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: dashboard-local-fixture-key
      DASHBOARD_SPARKS_FIXTURE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply scoped application changes at inspected base
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = ghuser29384/Website2
          mkdir -p /tmp/dashboard-sparks-evidence
          git switch --detach 079d5bbc6224bc6e9770d33622f6cab7e4baac01
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          def read_checked(path, sha):
              raw = Path(path).read_bytes()
              actual = hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
              assert actual == sha, (path, actual, sha)
              return raw.decode()
          def replace_once(text, before, after):
              assert text.count(before) == 1, (before, text.count(before))
              return text.replace(before, after, 1)
          def write(path, text):
              Path(path).parent.mkdir(parents=True, exist_ok=True)
              Path(path).write_text(text)
          dashboard = read_checked('src/app/dashboard/page.tsx', 'bf2376dbf9ebf893492774ddb1b07b5d9b696cb9')
          priorities = read_checked('src/app/profile/priorities/page.tsx', '9da214eb1b17e2cb14475474c2968b0563c46a10')
          editor = read_checked('src/components/profile/profile-priority-editor.tsx', '14db9bcf67a82c3be810e0d4293909a174d36693')
          dashboard = replace_once(dashboard, 'import Link from "next/link";', 'import Link from "next/link";\n\nimport { DashboardTools } from "@/components/dashboard/dashboard-tools";\nimport { ProfilePrioritiesView } from "@/components/profile/profile-priorities-view";\nimport { readDashboardView } from "@/lib/dashboard-view";')
          dashboard = replace_once(dashboard, '  const resolvedSearchParams = await searchParams;\n', '  const resolvedSearchParams = await searchParams;\n  // The default screen reads only priorities, not the 42-section controls loader.\n  if (readDashboardView(resolvedSearchParams.view) === "priorities") {\n    return <ProfilePrioritiesView searchParams={Promise.resolve(resolvedSearchParams)} dashboard />;\n  }\n\n')
          dashboard = dashboard.replace('await requireViewer("/dashboard")', 'await requireViewer("/dashboard?view=controls")')
          dashboard = dashboard.replace('value="/dashboard"', 'value="/dashboard?view=controls"').replace('value="/dashboard#', 'value="/dashboard?view=controls#')
          dashboard = replace_once(dashboard, '      <main id="main-content" tabIndex={-1}>', '      <main id="main-content" tabIndex={-1}>\n        <DashboardTools active="controls" />')
          write('src/app/dashboard/page.tsx', dashboard)
          view = priorities
          start = view.index('export const metadata: Metadata = {')
          end = view.index('interface ProfilePrioritiesPageProps')
          view = view[:start] + view[end:]
          view = view.replace('import type { Metadata } from "next";\n', '')
          view = replace_once(view, 'import { ProfilePriorityEditor }', 'import { DashboardTools } from "@/components/dashboard/dashboard-tools";\nimport { ProfilePriorityEditor }')
          view = replace_once(view, 'interface ProfilePrioritiesPageProps {', 'interface ProfilePrioritiesViewProps {\n  dashboard?: boolean;')
          view = replace_once(view, 'export default async function ProfilePrioritiesPage({\n  searchParams,\n}: ProfilePrioritiesPageProps)', 'export async function ProfilePrioritiesView({\n  searchParams,\n  dashboard = false,\n}: ProfilePrioritiesViewProps)')
          view = replace_once(view, '  const returnTo = getSafeInternalPath(firstParam(resolvedSearchParams.returnTo), "/feed");', '  const returnTo = dashboard ? "/dashboard" : getSafeInternalPath(firstParam(resolvedSearchParams.returnTo), "/feed");')
          view = replace_once(view, '  const pagePath = `/profile/priorities?returnTo=${encodeURIComponent(returnTo)}`;', '  const pagePath = dashboard ? "/dashboard" : `/profile/priorities?returnTo=${encodeURIComponent(returnTo)}`;')
          view = replace_once(view, '      {loadError ? (', '      {loadError && dashboard ? <DashboardTools active="priorities" /> : null}\n      {loadError ? (')
          view = replace_once(view, '      {!loadError ? <ProfilePriorityEditor initialAllocation={initialAllocation} returnTo={returnTo} /> : null}', '      {!loadError ? (\n        <ProfilePriorityEditor\n          initialAllocation={initialAllocation}\n          returnTo={returnTo}\n          returnPath={pagePath}\n          cancelTo={dashboard ? "/feed" : returnTo}\n          navigation={dashboard ? <DashboardTools active="priorities" /> : undefined}\n        />\n      ) : null}')
          write('src/components/profile/profile-priorities-view.tsx', view)
          write('src/app/profile/priorities/page.tsx', '''import type { Metadata } from "next";
          import { ProfilePrioritiesView } from "@/components/profile/profile-priorities-view";

          export const metadata: Metadata = {
            title: "Profile priorities",
            description: "Adjust the private 100-spark priority allocation used by your Moral Trade feed.",
            robots: { follow: false, index: false },
          };

          export default function ProfilePrioritiesPage({ searchParams }: {
            searchParams: Promise<Record<string, string | string[] | undefined>>;
          }) {
            return <ProfilePrioritiesView searchParams={searchParams} />;
          }
          ''')
          editor = replace_once(editor, 'useState, type CSSProperties', 'useState, type CSSProperties, type ReactNode')
          editor = replace_once(editor, '  returnTo: string;\n}', '  returnTo: string;\n  returnPath?: string;\n  cancelTo?: string;\n  navigation?: ReactNode;\n}')
          editor = replace_once(editor, '  initialAllocation,\n  returnTo,\n}', '  initialAllocation,\n  returnTo,\n  returnPath,\n  cancelTo = returnTo,\n  navigation,\n}')
          editor = replace_once(editor, 'value={`/profile/priorities?returnTo=${encodeURIComponent(returnTo)}`}', 'value={returnPath ?? `/profile/priorities?returnTo=${encodeURIComponent(returnTo)}`}')
          editor = replace_once(editor, '        </header>\n', '        </header>\n\n        {navigation}\n')
          editor = replace_once(editor, '<Link className={styles.textAction} href={returnTo}>', '<Link className={styles.textAction} href={cancelTo} prefetch={false}>')
          write('src/components/profile/profile-priority-editor.tsx', editor)
          write('src/lib/dashboard-view.ts', '''export type DashboardView = "priorities" | "controls";

          export function readDashboardView(value: string | string[] | undefined): DashboardView {
            return (Array.isArray(value) ? value[0] : value) === "controls" ? "controls" : "priorities";
          }

          // Preserve existing bookmarks and action redirects; fragments are not sent to the server.
          const legacySections = new Set([
            "#dashboard-overview", "#wish-profile", "#background-networking", "#privacy-controls",
            "#match-inbox", "#my-trades", "#advanced-setup", "#payments-and-fund", "#payment-setup",
            "#consent-center", "#saved-searches", "#notifications", "#incoming-responses",
            "#outgoing-responses", "#agreements", "#saved-offers", "#account-security",
          ]);

          export function getLegacyDashboardTarget(search: string, hash: string): string | null {
            const params = new URLSearchParams(search);
            if (params.get("view") === "controls" || !legacySections.has(hash)) return null;
            params.set("view", "controls");
            return `/dashboard?${params.toString()}${hash}`;
          }
          ''')
          write('src/components/dashboard/dashboard-tools.tsx', '''"use client";

          import Link from "next/link";
          import { useEffect } from "react";
          import { getLegacyDashboardTarget, type DashboardView } from "@/lib/dashboard-view";
          import styles from "./dashboard-tools.module.css";

          export function DashboardTools({ active }: { active: DashboardView }) {
            useEffect(() => {
              if (active !== "priorities") return;
              function preserveLegacySection() {
                if (window.location.pathname !== "/dashboard") return;
                const target = getLegacyDashboardTarget(window.location.search, window.location.hash);
                if (target) window.location.replace(target);
              }
              preserveLegacySection();
              window.addEventListener("hashchange", preserveLegacySection);
              return () => window.removeEventListener("hashchange", preserveLegacySection);
            }, [active]);

            return (
              <nav className={styles.tools} aria-label="Dashboard controls">
                <Link href="/dashboard" prefetch={false} aria-current={active === "priorities" ? "page" : undefined}>
                  100 Sparks
                </Link>
                <details className={styles.currency} onKeyDown={(event) => {
                  if (event.key === "Escape") {
                    event.currentTarget.open = false;
                    event.currentTarget.querySelector("summary")?.focus();
                  }
                }}>
                  <summary>Currency</summary>
                  <div className={styles.currencyDetails}>
                    <h2>Currency</h2>
                    <p>Amounts use the currency stated in each offer or agreement. An account-wide currency selector is not available.</p>
                    <p>Changing your sparks does not convert amounts or change any payment terms.</p>
                    <Link href="/dashboard?view=controls#payment-setup" prefetch={false}>Payment setup</Link>
                  </div>
                </details>
                <Link href="/complete-profile" prefetch={false}>Profile details</Link>
                <Link href="/dashboard?view=controls#privacy-controls" prefetch={false}>Privacy</Link>
                <Link href="/dashboard?view=controls#notifications" prefetch={false}>Notifications</Link>
                <Link href="/dashboard?view=controls" prefetch={false} aria-current={active === "controls" ? "page" : undefined}>
                  More controls
                </Link>
              </nav>
            );
          }
          ''')
          write('src/components/dashboard/dashboard-tools.module.css', '''.tools {
            position: relative;
            display: flex;
            flex-wrap: wrap;
            align-items: flex-start;
            gap: 8px;
            padding: 18px clamp(16px, 4vw, 56px);
            border-bottom: 1px solid #d8d8d2;
            background: #fafaf7;
          }

          .tools > a,
          .currency > summary {
            display: inline-flex;
            align-items: center;
            min-height: 44px;
            padding: 10px 14px;
            border: 1px solid #c9cac4;
            background: #fff;
            color: #252a26;
            font: inherit;
            font-size: 14px;
            font-weight: 600;
            line-height: 1.4;
            text-decoration: none;
            cursor: pointer;
          }

          .tools > a:hover,
          .currency > summary:hover { background: #efefe9; }
          .tools > a[aria-current="page"] { border-color: #263e35; background: #263e35; color: #fff; }
          .tools a:focus-visible,
          .tools summary:focus-visible { outline: 2px solid #345d4b; outline-offset: 3px; }
          .currency > summary { list-style: none; }
          .currency > summary::-webkit-details-marker { display: none; }
          .currency > summary::after { content: "+"; margin-left: 14px; }
          .currency[open] > summary::after { content: "−"; }
          .currencyDetails {
            position: absolute;
            z-index: 20;
            top: calc(100% - 6px);
            left: clamp(16px, 4vw, 56px);
            width: min(390px, calc(100% - 32px));
            padding: 20px;
            border: 1px solid #c9cac4;
            background: #fff;
            box-shadow: 0 8px 24px #18251d12;
          }
          .currencyDetails h2 { margin: 0 0 10px; font-size: 18px; line-height: 1.4; }
          .currencyDetails p { margin: 0 0 12px; color: #454d47; font-size: 14px; line-height: 1.65; }
          .currencyDetails a { color: #263e35; font-size: 14px; font-weight: 600; text-decoration: underline; }
          @media (max-width: 480px) {
            .tools { gap: 6px; padding: 12px 16px; }
            .tools > a, .currency > summary { padding: 9px 11px; font-size: 13px; }
          }
          ''')
          tests = Path('src/lib/dashboard-loading.test.ts').read_text()
          tests = replace_once(tests, 'await requireViewer("/dashboard")', 'await requireViewer("/dashboard?view=controls")')
          write('src/lib/dashboard-loading.test.ts', tests)
          write('src/lib/dashboard-view.test.ts', '''import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          import test from "node:test";
          import vm from "node:vm";
          import ts from "typescript";
          import { getLegacyDashboardTarget, readDashboardView } from "./dashboard-view";

          test("Dashboard defaults to priorities and controls require an explicit selection", () => {
            for (const value of [undefined, "", "priorities", "unknown", "currency", ["priorities", "controls"]]) {
              assert.equal(readDashboardView(value), "priorities");
            }
            assert.equal(readDashboardView("controls"), "controls");
            assert.equal(readDashboardView(["controls"]), "controls");
          });

          test("legacy control links preserve messages without redirecting ordinary priority fragments", () => {
            assert.equal(getLegacyDashboardTarget("?message=Saved", "#privacy-controls"), "/dashboard?message=Saved&view=controls#privacy-controls");
            assert.equal(getLegacyDashboardTarget("", "#payment-setup"), "/dashboard?view=controls#payment-setup");
            for (const hash of ["", "#main-content", "#profile-priorities-heading", "#https://example.org"]) {
              assert.equal(getLegacyDashboardTarget("", hash), null);
            }
            assert.equal(getLegacyDashboardTarget("?view=controls", "#privacy-controls"), null);
          });

          test("actual default page returns the shared editor before any controls loader or feature checks", async () => {
            const source = readFileSync("src/app/dashboard/page.tsx", "utf8");
            const parsed = ts.createSourceFile("page.tsx", source, ts.ScriptTarget.Latest, true, ts.ScriptKind.TSX);
            const declaration = parsed.statements.find((node) => ts.isFunctionDeclaration(node) && node.name?.text === "DashboardPage");
            assert.ok(declaration);
            const executable = ts.transpileModule(declaration.getText(parsed), {
              compilerOptions: { module: ts.ModuleKind.CommonJS, target: ts.ScriptTarget.ES2022, jsx: ts.JsxEmit.React },
            }).outputText;
            const exported: { default?: (props: unknown) => Promise<{ type: unknown; props: { dashboard: boolean } }> } = {};
            const sharedEditor = Symbol("shared-priorities-editor");
            vm.runInNewContext(executable, {
              exports: exported, readDashboardView, ProfilePrioritiesView: sharedEditor,
              React: { createElement: (type: unknown, props: unknown) => ({ type, props }) },
              // Any attempted controls initialization is a regression, even before data fetching.
              getFormMessage: () => { throw new Error("Controls initialized on the default view"); },
            });
            assert.ok(exported.default);
            for (const params of [{}, { view: "unknown" }, { message: "Priorities saved" }]) {
              const result = await exported.default({ searchParams: Promise.resolve(params) });
              assert.equal(result.type, sharedEditor);
              assert.equal(result.props.dashboard, true);
            }
          });

          test("both priority routes share account-bound reads and the existing save action", () => {
            const route = readFileSync("src/app/profile/priorities/page.tsx", "utf8");
            const view = readFileSync("src/components/profile/profile-priorities-view.tsx", "utf8");
            const editor = readFileSync("src/components/profile/profile-priority-editor.tsx", "utf8");
            assert.match(route, /ProfilePrioritiesView/);
            assert.match(view, /\.eq\("profile_id", viewer\.authUser\.id\)/);
            assert.match(view, /!loadError \? \(/);
            assert.match(view, /dashboard \? "\/dashboard"/);
            assert.match(editor, /action=\{saveProfilePrioritySearchAction\}/);
            assert.match(editor, /name="return_to"[^\n]*returnPath/);
            assert.match(editor, /name="success_to"[^\n]*returnTo/);
          });

          test("currency is a disclosure, controls do not prefetch, and control forms keep their return view", () => {
            const tools = readFileSync("src/components/dashboard/dashboard-tools.tsx", "utf8");
            assert.match(tools, /<summary>Currency<\/summary>/);
            assert.match(tools, /account-wide currency selector is not available/);
            for (const link of tools.matchAll(/<Link\b[^>]+>/g)) assert.match(link[0], /prefetch=\{false\}/);
            assert.doesNotMatch(tools, /createClient|fetch\(|localStorage|sessionStorage/);
            const page = readFileSync("src/app/dashboard/page.tsx", "utf8");
            assert.doesNotMatch(page, /name="return_to"[^\n]*value="\/dashboard(?:"|#)/);
            assert.match(page, /value="\/dashboard\?view=controls"/);
          });
          ''')
          PY
          git diff --check
          git status --short | tee /tmp/dashboard-sparks-evidence/changed-files.txt
          git config user.name 'Dashboard implementation'
          git config user.email 'dashboard-implementation@users.noreply.github.com'
          git add src/app/dashboard/page.tsx src/app/profile/priorities/page.tsx src/components/profile/profile-priorities-view.tsx src/components/profile/profile-priority-editor.tsx src/components/dashboard/dashboard-tools.tsx src/components/dashboard/dashboard-tools.module.css src/lib/dashboard-view.ts src/lib/dashboard-view.test.ts src/lib/dashboard-loading.test.ts
          git commit -m 'Default Dashboard to 100 Sparks with secondary account controls'
          git push origin HEAD:refs/heads/fix/dashboard-sparks-default-20260925
          git rev-parse HEAD | tee /tmp/dashboard-sparks-evidence/commit.txt
          git diff --stat HEAD^ > /tmp/dashboard-sparks-evidence/diff-stat.txt
          git diff HEAD^ > /tmp/dashboard-sparks-evidence/source.patch
      - run: npm ci
      - name: Focused regressions
        run: node --import tsx --test src/lib/dashboard-view.test.ts src/lib/dashboard-loading.test.ts src/lib/profile-priorities.test.ts | tee /tmp/dashboard-sparks-evidence/focused-tests.log
      - name: Full repository tests
        run: npm test > /tmp/dashboard-sparks-evidence/full-tests.log 2>&1
      - name: Lint and typecheck
        run: |
          npm run lint -- --quiet > /tmp/dashboard-sparks-evidence/lint.log 2>&1
          npx tsc --noEmit > /tmp/dashboard-sparks-evidence/typecheck.log 2>&1
      - name: Production build
        run: npm run build > /tmp/dashboard-sparks-evidence/build.log 2>&1
      - name: Retain evidence and exact changed source
        if: always()
        run: |
          mkdir -p /tmp/dashboard-sparks-evidence/source
          git diff --name-only HEAD^ | while IFS= read -r file; do
            test -f "$file" && cp --parents "$file" /tmp/dashboard-sparks-evidence/source/
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dashboard-sparks-default-qa
          path: /tmp/dashboard-sparks-evidence
          retention-days: 14
