name: One-time canonical Vercel Git disconnect v2

on:
  push:
    branches:
      - ops/vercel-canonical-git-disconnect-20260802
    paths:
      - .github/workflows/vercel-canonical-git-disconnect-v2-once.yml

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: vercel-canonical-git-disconnect-v2-once
  cancel-in-progress: false

env:
  CONTROLLER_PATH: .github/workflows/vercel-canonical-git-disconnect-v2-once.yml
  CONTROLLER_BRANCH: ops/vercel-canonical-git-disconnect-20260802
  VERCEL_ORG_ID: team_ySu6sF3Uho1E1GnJtCQPVEuJ
  VERCEL_PROJECT_ID: prj_Em3j7Uj7RatX2R1ZYhla3XSHRde7
  VERCEL_CLI_VERSION: 50.38.1
  PRODUCTION_BASE_URL: https://www.moraltrade.org

jobs:
  disconnect:
    if: github.repository == 'ghuser29384/Website2' && github.actor == 'ghuser29384'
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Check out exact operations commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          token: ${{ github.token }}

      - name: Guard exact one-file operations scope
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'ghuser29384/Website2'
          test "$GITHUB_REF" = "refs/heads/$CONTROLLER_BRANCH"
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          test -n "$VERCEL_TOKEN"
          changed="$(git diff-tree --no-commit-id --name-only -r HEAD | sed '/^$/d')"
          test "$changed" = "$CONTROLLER_PATH"

      - name: Remove the controller from its operations branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          blob_sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/$CONTROLLER_PATH?ref=$CONTROLLER_BRANCH" --jq .sha)"
          jq -n --arg message 'Remove one-time canonical Vercel Git disconnect v2 controller' --arg sha "$blob_sha" --arg branch "$CONTROLLER_BRANCH" '{message:$message,sha:$sha,branch:$branch}' \
            | gh api --method DELETE "repos/$GITHUB_REPOSITORY/contents/$CONTROLLER_PATH" --input - >/dev/null

      - name: Capture canonical state before disconnect
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --header "Authorization: Bearer $VERCEL_TOKEN" --header 'Accept: application/json' \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID" > /tmp/before.json
          jq '{id,name,live,link:(if .link==null then null else {type:.link.type,org:.link.org,repo:.link.repo,productionBranch:.link.productionBranch} end),resourceConfig:{buildMachineType:.resourceConfig.buildMachineType,elasticConcurrencyEnabled:.resourceConfig.elasticConcurrencyEnabled,buildQueue:(.resourceConfig.buildQueue.configuration // .resourceConfig.buildQueue)}}' \
            /tmp/before.json > canonical-git-disconnect-v2-before.json

      - name: Disconnect canonical project from GitHub
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          if jq -e '.link == null' canonical-git-disconnect-v2-before.json >/dev/null; then
            echo 'Canonical project is already Git-disconnected.' | tee canonical-git-disconnect-v2-command.log
          else
            mkdir -p .vercel
            printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
            printf 'y\n' | npx --yes "vercel@$VERCEL_CLI_VERSION" git disconnect \
              --token="$VERCEL_TOKEN" --scope=ellen-s 2>&1 | tee canonical-git-disconnect-v2-command.log
          fi

      - name: Verify disconnected low-cost state
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --header "Authorization: Bearer $VERCEL_TOKEN" --header 'Accept: application/json' \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID" > /tmp/after.json
          jq '{id,name,live,link:(if .link==null then null else {type:.link.type,org:.link.org,repo:.link.repo,productionBranch:.link.productionBranch} end),resourceConfig:{buildMachineType:.resourceConfig.buildMachineType,elasticConcurrencyEnabled:.resourceConfig.elasticConcurrencyEnabled,buildQueue:(.resourceConfig.buildQueue.configuration // .resourceConfig.buildQueue)}}' \
            /tmp/after.json > canonical-git-disconnect-v2-after.json
          test "$(jq -r .id canonical-git-disconnect-v2-after.json)" = "$VERCEL_PROJECT_ID"
          test "$(jq -r .name canonical-git-disconnect-v2-after.json)" = 'moraltrade-site'
          test "$(jq -r '.link == null' canonical-git-disconnect-v2-after.json)" = 'true'
          test "$(jq -r .resourceConfig.buildMachineType canonical-git-disconnect-v2-after.json)" = 'standard'
          test "$(jq -r .resourceConfig.buildQueue canonical-git-disconnect-v2-after.json)" = 'WAIT_FOR_NAMESPACE_QUEUE'
          test "$(jq -r '.resourceConfig.elasticConcurrencyEnabled != true' canonical-git-disconnect-v2-after.json)" = 'true'

      - name: Smoke-test canonical routes on one production deployment
        shell: bash
        run: |
          set -euo pipefail
          : > canonical-git-disconnect-v2-smoke.tsv
          deployment_id=''
          while IFS='|' read -r path marker; do
            body="$(mktemp)"
            status='000'
            for attempt in $(seq 1 20); do
              status="$(curl --silent --show-error --location --output "$body" --write-out '%{http_code}' --max-time 20 "$PRODUCTION_BASE_URL$path" || true)"
              if [[ "$status" == '200' ]] && grep -Fq "$marker" "$body"; then break; fi
              sleep 5
            done
            test "$status" = '200'
            grep -Fq "$marker" "$body"
            current_id="$(sed -n 's/.*data-dpl-id="\([^"]*\)".*/\1/p' "$body" | head -n1)"
            test -n "$current_id"
            if [[ -z "$deployment_id" ]]; then deployment_id="$current_id"; else test "$current_id" = "$deployment_id"; fi
            printf '%s\t%s\t%s\t%s\n' "$path" "$status" "$current_id" "$marker" >> canonical-git-disconnect-v2-smoke.tsv
          done <<'ROUTES'
          /|Moral Trade
          /commitments|Additional resources you caused.
          /commitments?tab=ledger|aria-current="page" href="/commitments?tab=ledger">Ledger
          /commitments?tab=completed|aria-current="page" href="/commitments?tab=completed">Completed
          /commitments?tab=calendar|aria-current="page" href="/commitments?tab=calendar">Calendar
          ROUTES
          printf '%s\n' "$deployment_id" > canonical-git-disconnect-v2-deployment-id.txt

      - name: Upload redacted evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-vercel-git-disconnect-v2-${{ github.run_id }}
          path: |
            canonical-git-disconnect-v2-before.json
            canonical-git-disconnect-v2-command.log
            canonical-git-disconnect-v2-after.json
            canonical-git-disconnect-v2-smoke.tsv
            canonical-git-disconnect-v2-deployment-id.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Report outcome to PR 422
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [[ "${{ job.status }}" == 'success' ]]; then
            deployment_id="$(cat canonical-git-disconnect-v2-deployment-id.txt)"
            gh pr comment 422 --repo "$GITHUB_REPOSITORY" --body "Post-payment Vercel recovery is now fully verified. The canonical moraltrade-site project is Standard-build, namespace-queued, not elastically concurrent, and Git-disconnected; website2 remains separately Git-disconnected; obsolete projects remain absent; and the canonical root plus Portfolio, Ledger, Completed, and Calendar routes all passed on deployment \`$deployment_id\`. Manual exact-SHA GitHub Actions releases are now the only deployment path. Evidence: $run_url"
          else
            gh pr comment 422 --repo "$GITHUB_REPOSITORY" --body "Canonical Git-disconnect v2 or production smoke did not complete successfully. No completion claim is made. Evidence: $run_url"
          fi

      - name: Enforce verified completion
        if: always()
        shell: bash
        run: test "${{ job.status }}" = 'success'
