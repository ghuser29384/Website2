name: Final audit Direct Donation Upgrade preview runtime

on:
  push:
    branches:
      - ops/final-audit-direct-upgrade-preview-runtime-20260802
    paths:
      - .github/workflows/final-audit-direct-upgrade-preview-runtime-20260802.yml

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: final-audit-direct-upgrade-preview-runtime-20260802
  cancel-in-progress: false

env:
  CONTROLLER_PATH: .github/workflows/final-audit-direct-upgrade-preview-runtime-20260802.yml
  RELEASE_REPAIR_SHA: f22c8adbc3236822df81e52c5888bc281996019f
  FEATURE_BRANCH: feature/direct-verified-donation-upgrade-20260731
  RELEASE_BRANCH: release/vercel-preview
  EVIDENCE_BRANCH: evidence/direct-upgrade-preview-20260802
  RECEIPT_PATH: direct-upgrade-preview-20260802.json
  AUDIT_PATH: direct-upgrade-preview-runtime-audit-20260802.json
  FEATURE_PR: '418'
  VERCEL_TEAM_ID: team_ySu6sF3Uho1E1GnJtCQPVEuJ
  VERCEL_PROJECT_ID: prj_Em3j7Uj7RatX2R1ZYhla3XSHRde7

jobs:
  audit:
    if: github.repository == 'ghuser29384/Website2' && github.actor == 'ghuser29384'
    runs-on: ubuntu-24.04
    timeout-minutes: 150

    steps:
      - name: Check out and guard the one-file runtime auditor
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          token: ${{ github.token }}

      - name: Verify auditor isolation and merged release repair
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff-tree --no-commit-id --name-only -r HEAD | sed '/^$/d')" = "$CONTROLLER_PATH"
          git merge-base --is-ancestor "$RELEASE_REPAIR_SHA" HEAD^
          git show HEAD^:.github/workflows/vercel-release.yml | grep -F 'rendered_verification_run_id:' >/dev/null
          git show HEAD^:.github/workflows/vercel-release.yml | grep -F 'Run read-only canonical route smoke against the deployment' >/dev/null

      - name: Wait for the final schema-2 receipt and matching live refs
        id: receipt
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 7200))
          while true; do
            if (( SECONDS >= deadline )); then
              echo "Timed out waiting for final $EVIDENCE_BRANCH/$RECEIPT_PATH" >&2
              exit 1
            fi

            encoded="$(gh api "repos/$GITHUB_REPOSITORY/contents/$RECEIPT_PATH?ref=$EVIDENCE_BRANCH" --jq '.content' 2>/dev/null | tr -d '\n' || true)"
            if [[ -z "$encoded" ]]; then
              sleep 20
              continue
            fi
            printf '%s' "$encoded" | base64 -d > "$RECEIPT_PATH"

            if ! python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('direct-upgrade-preview-20260802.json').read_text(encoding='utf-8'))
          assert data['schemaVersion'] == 2
          assert len(data['candidateSha']) == 40
          assert len(data['includedMainSha']) == 40
          assert data['gatedRelease']['conclusion'] == 'success'
          assert data['releaseClassification']['state'] == 'success'
          assert len(data['exactHeadGates']) == 7
          assert len(data['routeSmoke']) == 3
          assert data['safetyBoundary']['productionDirectModeEnabled'] is False
          assert data['safetyBoundary']['managedStripeEnabled'] is False
          assert data['safetyBoundary']['pooledSettlementEnabled'] is False
          assert data['safetyBoundary']['providerStagingSecretsVerified'] is False
          assert data['safetyBoundary']['paymentOrDonationCreatedByThisRun'] is False
          assert data['deploymentUrl'].startswith('https://')
          PY
            then
              sleep 20
              continue
            fi

            candidate_sha="$(jq -r '.candidateSha' "$RECEIPT_PATH")"
            included_main_sha="$(jq -r '.includedMainSha' "$RECEIPT_PATH")"
            deployment_url="$(jq -r '.deploymentUrl' "$RECEIPT_PATH")"
            release_run_id="$(jq -r '.gatedRelease.runId' "$RECEIPT_PATH")"
            git fetch origin main "$FEATURE_BRANCH" "$RELEASE_BRANCH" --no-tags --force
            feature_sha="$(git rev-parse "origin/$FEATURE_BRANCH")"
            release_sha="$(git rev-parse "origin/$RELEASE_BRANCH")"
            main_sha="$(git rev-parse origin/main)"

            if [[ "$candidate_sha" != "$feature_sha" || "$candidate_sha" != "$release_sha" || "$included_main_sha" != "$main_sha" ]]; then
              sleep 20
              continue
            fi
            git merge-base --is-ancestor "$RELEASE_REPAIR_SHA" "$candidate_sha"
            git merge-base --is-ancestor "$main_sha" "$candidate_sha"
            [[ "$deployment_url" =~ ^https://[A-Za-z0-9.-]+\.vercel\.app/?$ ]]
            [[ "$release_run_id" =~ ^[0-9]+$ ]]
            receipt_sha256="$(sha256sum "$RECEIPT_PATH" | awk '{print $1}')"
            break
          done

          echo "candidate_sha=$candidate_sha" >> "$GITHUB_OUTPUT"
          echo "main_sha=$main_sha" >> "$GITHUB_OUTPUT"
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"
          echo "release_run_id=$release_run_id" >> "$GITHUB_OUTPUT"
          echo "receipt_sha256=$receipt_sha256" >> "$GITHUB_OUTPUT"

      - name: Resolve the deployment in the canonical Vercel project
        id: deployment
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.receipt.outputs.deployment_url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          host="${DEPLOYMENT_URL#https://}"
          host="${host%/}"
          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v13/deployments/$host?teamId=$VERCEL_TEAM_ID" \
            --output deployment.json

          deployment_id="$(jq -r '.id // .uid // empty' deployment.json)"
          project_id="$(jq -r '.projectId // .project.id // empty' deployment.json)"
          ready_state="$(jq -r '.readyState // .state // empty' deployment.json)"
          resolved_host="$(jq -r '.url // empty' deployment.json)"
          created_at="$(jq -r '.createdAt // .created // empty' deployment.json)"
          target="$(jq -r 'if .target == null then "preview" else .target end' deployment.json)"

          test -n "$deployment_id"
          test "$project_id" = "$VERCEL_PROJECT_ID"
          test "$ready_state" = 'READY'
          test "$resolved_host" = "$host"
          test "$target" != 'production'
          [[ "$created_at" =~ ^[0-9]+$ ]]
          echo "deployment_id=$deployment_id" >> "$GITHUB_OUTPUT"
          echo "created_at=$created_at" >> "$GITHUB_OUTPUT"
          echo "target=$target" >> "$GITHUB_OUTPUT"

      - name: Issue fresh read-only route probes
        id: routes
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.receipt.outputs.deployment_url }}
        run: |
          set -euo pipefail
          nonce="$(date -u +%s)"
          started_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          : > runtime-audit-routes.tsv

          probe() {
            local route="$1"
            local separator="$2"
            local label="$3"
            local body="runtime-audit-${label}.html"
            local headers="runtime-audit-${label}.headers"
            local code='000'
            local url="${DEPLOYMENT_URL%/}${route}${separator}mt_runtime_audit=${nonce}-${label}"
            for _ in $(seq 1 20); do
              code="$(curl --location --silent --show-error --compressed \
                --user-agent 'MoralTrade-Preview-Runtime-Audit/20260802' \
                --connect-timeout 10 --max-time 30 \
                --output "$body" --dump-header "$headers" \
                --write-out '%{http_code}' "$url" || true)"
              [[ "$code" =~ ^[23][0-9][0-9]$ ]] && break
              sleep 3
            done
            [[ "$code" =~ ^[23][0-9][0-9]$ ]]
            test -s "$body"
            ! grep -Eiq 'DEPLOYMENT_DISABLED|Application error|Internal Server Error|FUNCTION_INVOCATION_FAILED' "$body"
            printf '%s\t%s\t%s\t%s\n' "$label" "$route" "$code" "$(sha256sum "$body" | awk '{print $1}')" | tee -a runtime-audit-routes.tsv
          }

          probe '/' '?' root
          probe '/create?structure=conditional-donation' '&' create
          probe '/donation-upgrades' '?' donation-upgrades
          test "$(wc -l < runtime-audit-routes.tsv | tr -d ' ')" = '3'
          echo "nonce=$nonce" >> "$GITHUB_OUTPUT"
          echo "started_at=$started_at" >> "$GITHUB_OUTPUT"
          sleep 20

      - name: Fetch deployment events and runtime logs
        id: logs
        shell: bash
        env:
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.deployment_id }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          runtime_status="$(curl --silent --show-error \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            --output runtime-logs.raw \
            --write-out '%{http_code}' \
            "https://api.vercel.com/v1/projects/$VERCEL_PROJECT_ID/deployments/$DEPLOYMENT_ID/runtime-logs?teamId=$VERCEL_TEAM_ID&limit=1000")"
          test "$runtime_status" = '200'

          events_status="$(curl --silent --show-error \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            --output deployment-events.raw \
            --write-out '%{http_code}' \
            "https://api.vercel.com/v3/deployments/$DEPLOYMENT_ID/events?teamId=$VERCEL_TEAM_ID&direction=backward&follow=0&limit=1000")"
          test "$events_status" = '200'
          test -s runtime-logs.raw
          test -s deployment-events.raw
          echo "runtime_status=$runtime_status" >> "$GITHUB_OUTPUT"
          echo "events_status=$events_status" >> "$GITHUB_OUTPUT"

      - name: Aggregate provider evidence without publishing raw logs
        id: aggregate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          markers=('DEPLOYMENT_DISABLED','FUNCTION_INVOCATION_FAILED','Internal Server Error','Application error')

          def records(path):
              text=Path(path).read_text(encoding='utf-8',errors='replace').strip()
              if not text:
                  return []
              try:
                  value=json.loads(text)
              except json.JSONDecodeError:
                  out=[]
                  for line in text.splitlines():
                      line=line.strip()
                      if not line: continue
                      try: out.append(json.loads(line))
                      except json.JSONDecodeError: out.append({'message':line})
                  return out
              if isinstance(value,list): return value
              if isinstance(value,dict):
                  for key in ('logs','data','events','results','items'):
                      if isinstance(value.get(key),list): return value[key]
                  return [value]
              return [{'value':value}]

          def strings(value):
              if isinstance(value,str):
                  yield value
              elif isinstance(value,dict):
                  for item in value.values(): yield from strings(item)
              elif isinstance(value,list):
                  for item in value: yield from strings(item)

          def codes(value):
              found=[]
              if isinstance(value,dict):
                  for key,item in value.items():
                      norm=key.lower().replace('_','')
                      if norm in {'status','statuscode','httpstatus','responsecode'}:
                          try: code=int(item)
                          except (TypeError,ValueError): pass
                          else:
                              if 100 <= code <= 599: found.append(code)
                      found.extend(codes(item))
              elif isinstance(value,list):
                  for item in value: found.extend(codes(item))
              return found

          def explicit_error(value):
              if not isinstance(value,dict): return False
              for key in ('level','severity','type'):
                  item=value.get(key)
                  if isinstance(item,str) and item.lower() in {'error','fatal','panic'}: return True
              return False

          runtime=records('runtime-logs.raw')
          events=records('deployment-events.raw')
          summary={
              'runtimeRecordCount':len(runtime),
              'runtime5xxCount':sum(any(code >= 500 for code in codes(item)) for item in runtime),
              'runtimeExplicitErrorCount':sum(explicit_error(item) for item in runtime),
              'runtimeMarkerErrorCount':sum(any(marker in text for marker in markers for text in strings(item)) for item in runtime),
              'deploymentEventCount':len(events),
              'deploymentEvent5xxCount':sum(any(code >= 500 for code in codes(item)) for item in events),
              'deploymentEventExplicitErrorCount':sum(explicit_error(item) for item in events),
          }
          Path('runtime-log-aggregate.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          assert summary['runtime5xxCount'] == 0
          assert summary['runtimeExplicitErrorCount'] == 0
          assert summary['runtimeMarkerErrorCount'] == 0
          assert summary['deploymentEvent5xxCount'] == 0
          assert summary['deploymentEventExplicitErrorCount'] == 0
          PY
          python3 -m json.tool runtime-log-aggregate.json >/dev/null
          echo "runtime_records=$(jq -r '.runtimeRecordCount' runtime-log-aggregate.json)" >> "$GITHUB_OUTPUT"
          echo "event_records=$(jq -r '.deploymentEventCount' runtime-log-aggregate.json)" >> "$GITHUB_OUTPUT"

      - name: Build non-sensitive final runtime audit receipt
        shell: bash
        env:
          CANDIDATE_SHA: ${{ steps.receipt.outputs.candidate_sha }}
          MAIN_SHA: ${{ steps.receipt.outputs.main_sha }}
          RECEIPT_SHA256: ${{ steps.receipt.outputs.receipt_sha256 }}
          DEPLOYMENT_URL: ${{ steps.receipt.outputs.deployment_url }}
          RELEASE_RUN_ID: ${{ steps.receipt.outputs.release_run_id }}
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.deployment_id }}
          DEPLOYMENT_TARGET: ${{ steps.deployment.outputs.target }}
          DEPLOYMENT_CREATED_AT: ${{ steps.deployment.outputs.created_at }}
          AUDIT_NONCE: ${{ steps.routes.outputs.nonce }}
          AUDIT_STARTED_AT: ${{ steps.routes.outputs.started_at }}
          RUNTIME_HTTP_STATUS: ${{ steps.logs.outputs.runtime_status }}
          EVENTS_HTTP_STATUS: ${{ steps.logs.outputs.events_status }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv,json,os
          from datetime import datetime,timezone
          from pathlib import Path
          routes=[]
          with Path('runtime-audit-routes.tsv').open(newline='') as h:
              for label,route,status,sha256 in csv.reader(h,delimiter='\t'):
                  routes.append({'label':label,'route':route,'httpStatus':int(status),'bodySha256':sha256})
          aggregate=json.loads(Path('runtime-log-aggregate.json').read_text(encoding='utf-8'))
          audit={
              'schemaVersion':2,
              'recordedAt':datetime.now(timezone.utc).isoformat(),
              'repository':os.environ['GITHUB_REPOSITORY'],
              'candidateSha':os.environ['CANDIDATE_SHA'],
              'includedMainSha':os.environ['MAIN_SHA'],
              'previewReceiptSha256':os.environ['RECEIPT_SHA256'],
              'gatedReleaseRunId':int(os.environ['RELEASE_RUN_ID']),
              'deployment':{
                  'id':os.environ['DEPLOYMENT_ID'],
                  'url':os.environ['DEPLOYMENT_URL'],
                  'projectId':'prj_Em3j7Uj7RatX2R1ZYhla3XSHRde7',
                  'teamId':'team_ySu6sF3Uho1E1GnJtCQPVEuJ',
                  'readyState':'READY',
                  'target':os.environ['DEPLOYMENT_TARGET'],
                  'createdAt':int(os.environ['DEPLOYMENT_CREATED_AT']),
              },
              'freshRouteAudit':{'startedAt':os.environ['AUDIT_STARTED_AT'],'nonce':os.environ['AUDIT_NONCE'],'routes':routes},
              'providerApi':{'runtimeLogsHttpStatus':int(os.environ['RUNTIME_HTTP_STATUS']),'deploymentEventsHttpStatus':int(os.environ['EVENTS_HTTP_STATUS'])},
              'aggregate':aggregate,
              'rawLogsPublished':False,
              'result':'pass',
          }
          Path(os.environ['AUDIT_PATH']).write_text(json.dumps(audit,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          PY
          python3 -m json.tool "$AUDIT_PATH" >/dev/null

      - name: Commit final audit only to evidence branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          content="$(base64 -w 0 "$AUDIT_PATH")"
          existing_sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/$AUDIT_PATH?ref=$EVIDENCE_BRANCH" --jq '.sha' 2>/dev/null || true)"
          if [[ -n "$existing_sha" ]]; then
            jq -n --arg message 'Update final Donation Upgrade preview runtime audit' --arg content "$content" --arg branch "$EVIDENCE_BRANCH" --arg sha "$existing_sha" '{message:$message,content:$content,branch:$branch,sha:$sha}'
          else
            jq -n --arg message 'Record final Donation Upgrade preview runtime audit' --arg content "$content" --arg branch "$EVIDENCE_BRANCH" '{message:$message,content:$content,branch:$branch}'
          fi | gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$AUDIT_PATH" --input - >/dev/null
          remote="$(gh api "repos/$GITHUB_REPOSITORY/contents/$AUDIT_PATH?ref=$EVIDENCE_BRANCH" --jq '.content' | tr -d '\n' | base64 -d)"
          test "$(printf '%s' "$remote" | sha256sum | awk '{print $1}')" = "$(sha256sum "$AUDIT_PATH" | awk '{print $1}')"

      - name: Link final audit from PR 418
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ steps.receipt.outputs.candidate_sha }}
          DEPLOYMENT_URL: ${{ steps.receipt.outputs.deployment_url }}
          RUNTIME_RECORDS: ${{ steps.aggregate.outputs.runtime_records }}
          EVENT_RECORDS: ${{ steps.aggregate.outputs.event_records }}
        run: |
          set -euo pipefail
          audit_url="https://github.com/$GITHUB_REPOSITORY/blob/$EVIDENCE_BRANCH/$AUDIT_PATH"
          gh pr comment "$FEATURE_PR" --repo "$GITHUB_REPOSITORY" --body "Final Vercel runtime audit passed for preview candidate \`$CANDIDATE_SHA\`: $audit_url. The canonical project/team identity matched, the deployment was READY and non-production, three fresh route probes passed without deployment-error markers, and aggregate provider evidence contained zero 5xx, explicit-error, fatal, panic, or known runtime-failure records. Runtime records inspected: \`$RUNTIME_RECORDS\`; deployment events inspected: \`$EVENT_RECORDS\`. Raw logs were not published. Production direct mode, managed Stripe, and pooled settlement remain disabled. Deployment: $DEPLOYMENT_URL."

      - name: Upload non-sensitive final runtime evidence
        uses: actions/upload-artifact@v4
        with:
          name: direct-upgrade-final-runtime-audit-${{ steps.receipt.outputs.candidate_sha }}
          path: |
            ${{ env.AUDIT_PATH }}
            runtime-audit-routes.tsv
            runtime-log-aggregate.json
          if-no-files-found: error
          retention-days: 30
