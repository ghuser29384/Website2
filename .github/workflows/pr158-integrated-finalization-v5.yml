name: PR 158 integrated finalization v5

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/pr158-integrated-finalization-v5.yml"
      - ".github/scripts/run-pr158-integrated-finalization-v2.sh"
      - ".github/scripts/apply-pr158-integrated-lint-fixes.py"

permissions:
  contents: write

concurrency:
  group: pr158-integrated-finalization-v5
  cancel-in-progress: false

jobs:
  finalize-integrated-candidate:
    if: >-
      github.event.pull_request.head.repo.full_name == 'ghuser29384/Website2' &&
      github.head_ref == 'ops/pr158-sync-main-release-validation-20260727'
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      PROD_SUPABASE_DB_URL: ${{ secrets.PROD_SUPABASE_DB_URL }}

    steps:
      - name: Check out temporary orchestration branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preserve and harden the guarded finalization runner
        shell: bash
        run: |
          set -euo pipefail
          cp .github/scripts/run-pr158-integrated-finalization-v2.sh \
            "$RUNNER_TEMP/run-pr158-integrated-finalization-v5.sh"
          cp .github/scripts/apply-pr158-integrated-lint-fixes.py \
            "$RUNNER_TEMP/apply-pr158-integrated-lint-fixes.py"
          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path(os.environ["RUNNER_TEMP"]) / "run-pr158-integrated-finalization-v5.sh"
          source = path.read_text(encoding="utf-8")

          old_errors = '''def errors(path: Path):
              result = []
              for line in path.read_text(encoding="utf-8", errors="replace").splitlines():
                  value = line.strip()
                  if "error TS" not in value:
                      continue
                  value = re.sub(r"^.*?/(src/)", r"\\1", value)
                  result.append(value)
              return sorted(set(result))
          '''
          new_errors = '''def errors(path: Path):
              result = []
              pattern = re.compile(
                  r"(?P<path>src/[^\\n(]+)\\((?P<line>\\d+),(?P<column>\\d+)\\): error (?P<code>TS\\d+):"
              )
              for line in path.read_text(encoding="utf-8", errors="replace").splitlines():
                  value = line.strip()
                  if "error TS" not in value:
                      continue
                  value = re.sub(r"^.*?/(src/)", r"\\1", value)
                  match = pattern.search(value)
                  if match:
                      result.append(
                          f"{match.group('path')}({match.group('line')},{match.group('column')}): {match.group('code')}"
                      )
                  else:
                      result.append(value)
              return sorted(set(result))
          '''
          if source.count(old_errors) != 1:
              raise SystemExit(f"Expected one TypeScript normalization block; found {source.count(old_errors)}.")
          source = source.replace(old_errors, new_errors, 1)

          unsafe_guard = '''  ! grep -Ein '^[[:space:]]*(begin|commit|rollback)[[:space:]]*;' "$migration"
          '''
          if source.count(unsafe_guard) != 1:
              raise SystemExit(f"Expected one naive transaction-boundary guard; found {source.count(unsafe_guard)}.")
          source = source.replace(unsafe_guard, "", 1)

          old_version_list = '''version_list="'$(IFS="','"; echo "${versions[*]}")'"
          '''
          new_version_list = '''version_list="$(printf "'%s'," "${versions[@]}")"
          version_list="${version_list%,}"
          '''
          if source.count(old_version_list) != 1:
              raise SystemExit(f"Expected one unsafe version-list construction; found {source.count(old_version_list)}.")
          source = source.replace(old_version_list, new_version_list, 1)

          marker = new_version_list
          scanner = '''python3 - "${migrations[@]}" <<'PYSQL'
          import re
          import sys
          from pathlib import Path

          def strip_dollar_quoted(source: str, path: Path) -> str:
              cursor = 0
              parts: list[str] = []
              tag_pattern = re.compile(r"\\$[A-Za-z_][A-Za-z_0-9]*\\$|\\$\\$")
              while True:
                  match = tag_pattern.search(source, cursor)
                  if not match:
                      parts.append(source[cursor:])
                      return "".join(parts)
                  tag = match.group(0)
                  end = source.find(tag, match.end())
                  if end < 0:
                      raise SystemExit(f"Unterminated dollar-quoted body in {path}: {tag}")
                  parts.append(source[cursor:match.start()])
                  parts.append(" " * (end + len(tag) - match.start()))
                  cursor = end + len(tag)

          for value in sys.argv[1:]:
              path = Path(value)
              source = strip_dollar_quoted(path.read_text(encoding="utf-8"), path)
              source = re.sub(r"/\\*.*?\\*/", " ", source, flags=re.S)
              source = re.sub(r"--[^\\n]*", " ", source)
              source = re.sub(r"'(?:''|[^'])*'", "''", source)
              match = re.search(r"(?im)^\\s*(begin|commit|rollback)\\s*;", source)
              if match:
                  raise SystemExit(
                      f"Migration contains a top-level transaction boundary ({match.group(1)}) after SQL-body stripping: {path}"
                  )
          print("PASS: no migration contains a top-level transaction boundary.")
          PYSQL

          ''' + new_version_list
          if source.count(marker) != 1:
              raise SystemExit(f"Expected one corrected version-list marker; found {source.count(marker)}.")
          source = source.replace(marker, scanner, 1)

          source = source.replace(
              'EVIDENCE_DIR="$GITHUB_WORKSPACE/integrated-final-v2-evidence"',
              'EVIDENCE_DIR="$GITHUB_WORKSPACE/integrated-final-v5-evidence"',
              1,
          )
          source = source.replace(
              'Path(os.environ["GITHUB_WORKSPACE"]) / "integrated-final-v2-evidence"',
              'Path(os.environ["GITHUB_WORKSPACE"]) / "integrated-final-v5-evidence"',
              1,
          )
          path.write_text(source, encoding="utf-8")
          PY
          chmod +x "$RUNNER_TEMP/run-pr158-integrated-finalization-v5.sh"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Merge, compare baselines, validate, compile migrations, and push
        shell: bash
        run: "$RUNNER_TEMP/run-pr158-integrated-finalization-v5.sh"

      - name: Upload integrated finalization v5 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr158-integrated-finalization-v5-${{ github.run_id }}
          path: integrated-final-v5-evidence
          if-no-files-found: warn
          retention-days: 14
