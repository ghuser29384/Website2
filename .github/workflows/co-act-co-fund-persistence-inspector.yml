name: Co-Act and Co-Fund persistence inspector

on:
  push:
    branches:
      - feature/co-act-co-fund-create-v2-20260801

permissions:
  contents: write
  pull-requests: write

jobs:
  inspect-and-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/co-act-co-fund-create-v2-20260801
          fetch-depth: 0
          persist-credentials: true

      - name: Locate authoritative Create submission and persistence boundaries
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '## Routes and server actions mentioning Create proposals, review records, or FormData'
            grep -RInE --include='*.ts' --include='*.tsx' \
              'request\.formData|FormData|proposal|review record|review_record|create.*trade|trade.*create|moral-trade-create|durable' \
              src/app src/lib src/components 2>/dev/null \
              | grep -Ev 'group-contribution|\.test\.' \
              | head -n 240 || true
            echo
            echo '## Existing Create integration modules'
            find src/lib/create-interface src/components/create public/moral-trade-create -maxdepth 3 -type f 2>/dev/null | sort || true
            echo
            echo '## Database and persistence vocabulary'
            grep -RInE --include='*.ts' --include='*.tsx' --include='*.sql' \
              'from\(["'"'][^"'"']*(proposal|trade|review)|insert\(|upsert\(|update\(|supabase|draft' \
              src supabase 2>/dev/null \
              | grep -Ev 'group-contribution|\.test\.' \
              | head -n 240 || true
          } > /tmp/persistence-map.md

      - name: Comment inspection result on the draft PR
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          pr="$(gh pr list --repo "$GITHUB_REPOSITORY" --head feature/co-act-co-fund-create-v2-20260801 --state open --json number --jq '.[0].number // empty')"
          if [[ -z "$pr" ]]; then exit 0; fi
          {
            echo 'Persistence-boundary inspection from exact head:'
            echo
            cat /tmp/persistence-map.md
          } | head -c 60000 > /tmp/comment.md
          gh pr comment "$pr" --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md

      - name: Remove temporary inspector
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/co-act-co-fund-persistence-inspector.yml
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Remove temporary Co-Act persistence inspector'
          git push origin HEAD:feature/co-act-co-fund-create-v2-20260801
