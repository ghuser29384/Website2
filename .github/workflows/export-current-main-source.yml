name: Temporary export current main source

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: export-current-main-source
  cancel-in-progress: false

jobs:
  export:
    if: >-
      github.repository == 'ghuser29384/Website2' &&
      github.event.issue.pull_request != null &&
      github.event.issue.number == 392 &&
      github.event.comment.body == '/export-current-main-source-20260801'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Archive tracked source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = 'main'
          git archive --format=tar.gz --output=/tmp/current-main-source.tar.gz HEAD
          sha256sum /tmp/current-main-source.tar.gz | tee /tmp/current-main-source.sha256
          git rev-parse HEAD | tee /tmp/current-main-head.txt

      - name: Upload source and metadata
        uses: actions/upload-artifact@v4
        with:
          name: current-main-source-${{ github.run_id }}
          path: |
            /tmp/current-main-source.tar.gz
            /tmp/current-main-source.sha256
            /tmp/current-main-head.txt
          retention-days: 1

      - name: Report artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          head_sha="$(cat /tmp/current-main-head.txt)"
          gh pr comment 392 --repo "$GITHUB_REPOSITORY" --body "Current-main source export succeeded. Run: $GITHUB_RUN_ID. Artifact: \`current-main-source-$GITHUB_RUN_ID\`. Main head: \`$head_sha\`."
