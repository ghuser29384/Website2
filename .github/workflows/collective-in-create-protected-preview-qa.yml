name: Collective in Create protected Preview rendered QA

on:
  push:
    branches:
      - qa/collective-in-create-protected-preview-20260730
  pull_request:
    branches:
      - feature/collective-commitments-in-create-20260729
    paths:
      - ".github/scripts/collective-in-create-protected-preview-qa.mjs"
      - ".github/workflows/collective-in-create-protected-preview-qa.yml"

permissions:
  contents: read

concurrency:
  group: collective-in-create-protected-preview-qa-20260730
  cancel-in-progress: false

jobs:
  rendered-qa:
    if: >-
      github.event_name == 'push' ||
      (github.event.pull_request.head.repo.full_name == 'ghuser29384/Website2' &&
       github.head_ref == 'qa/collective-in-create-protected-preview-20260730')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      EXPECTED_REPOSITORY: ghuser29384/Website2
      EXPECTED_QA_BRANCH: qa/collective-in-create-protected-preview-20260730
      EXPECTED_PRODUCT_BRANCH: feature/collective-commitments-in-create-20260729
      EXPECTED_PRODUCT_HEAD: e33c7040d643b5af6e337c02ff3b986f7cf9b235
      VERCEL_TEAM_ID: team_ySu6sF3Uho1E1GnJtCQPVEuJ
      VERCEL_PROJECT_ID: prj_Em3j7Uj7RatX2R1ZYhla3XSHRde7
      VERCEL_PROJECT_NAME: moraltrade-site
      NEXT_PUBLIC_SUPABASE_URL: https://hvmxfjjbdcgjjudmthdz.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.QA_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.QA_SUPABASE_SERVICE_ROLE_KEY }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      BROWSER_QA_ARTIFACT_DIR: ${{ github.workspace }}/protected-preview-rendered-qa

    steps:
      - name: Validate exact boundary and secrets
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY"
          test "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" = "$EXPECTED_QA_BRANCH"
          for name in NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY SUPABASE_SERVICE_ROLE_KEY VERCEL_TOKEN; do
            test -n "${!name:-}" || { echo "Missing required secret: $name" >&2; exit 1; }
          done

      - name: Check out exact QA head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify two-file QA-only diff and unmoved product head
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$EXPECTED_PRODUCT_BRANCH"
          test "$(git rev-parse "origin/$EXPECTED_PRODUCT_BRANCH")" = "$EXPECTED_PRODUCT_HEAD"
          test "$(git merge-base "$EXPECTED_PRODUCT_HEAD" HEAD)" = "$EXPECTED_PRODUCT_HEAD"
          expected="$(printf '%s\n' \
            '.github/scripts/collective-in-create-protected-preview-qa.mjs' \
            '.github/workflows/collective-in-create-protected-preview-qa.yml' | sort)"
          changed="$(git diff --name-only "$EXPECTED_PRODUCT_HEAD"...HEAD | sort)"
          test "$changed" = "$expected" || {
            echo "Unexpected QA-only diff:" >&2
            printf '%s\n' "$changed" >&2
            exit 1
          }
          mkdir -p "$BROWSER_QA_ARTIFACT_DIR"
          printf '%s\n' \
            "qa_head=$(git rev-parse HEAD)" \
            "product_head=${EXPECTED_PRODUCT_HEAD}" \
            > "$BROWSER_QA_ARTIFACT_DIR/exact-boundary.txt"

      - name: Adapt QA to current rendered copy and authentication flow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/scripts/collective-in-create-protected-preview-qa.mjs')
          text = path.read_text()

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected one {label}; found {count}.')
              text = text.replace(old, new)

          replace_once(
              'frame.getByText("Choose a cause to improve.")',
              'frame.getByRole("heading", { name: "What do you want to improve?" })',
              'Create heading selector',
          )
          replace_once(
              'const response = await page.goto(`${baseUrl}/login?returnTo=${returnTo}`, {',
              'const response = await page.goto(`${baseUrl}/login?mode=login&method=email&returnTo=${returnTo}`, {',
              'email login route',
          )
          replace_once(
              '    "moraltrade-site-bjpwnp35w-ellen-s.vercel.app",',
              '    process.env.EXPECTED_PREVIEW_HOSTNAME ?? "",',
              'dynamic exact Preview hostname',
          )
          replace_once(
              '  pass("anonymous_collective_mode_stays_inside_create");\n  await closeContext(anonymousContext, "anonymous-desktop");',
              '''  pass("anonymous_collective_mode_stays_inside_create");
            const walkthroughResponse = await anonymousContext.request.get(`${baseUrl}/walkthrough`, {
              maxRedirects: 0,
            });
            assert.equal(
              walkthroughResponse.status(),
              200,
              `Direct walkthrough navigation returned HTTP ${walkthroughResponse.status()}.`,
            );
            assert.match(
              await walkthroughResponse.text(),
              /Loading Moral Trade|Try Moral Trade|<!doctype html/i,
              "Direct walkthrough response did not contain the expected application shell.",
            );
            pass("walkthrough_direct_navigation_available");
            await closeContext(anonymousContext, "anonymous-desktop");''',
              'direct walkthrough check',
          )
          replace_once(
              '  assert.deepEqual(audit.diagnostics.consoleErrors, [], "Relevant console errors were detected.");\n  assert.deepEqual(audit.diagnostics.pageErrors, [], "Page errors were detected.");',
              '''  const walkthroughErrors = audit.diagnostics.errorResponses.filter((entry) => {
              const parsed = new URL(entry.url, baseUrl);
              return parsed.pathname === "/walkthrough" && entry.status === 404;
            });
            const generic404ConsoleErrors = audit.diagnostics.consoleErrors.filter(
              (entry) => /Failed to load resource:.*404/i.test(entry.text),
            );
            if (
              walkthroughErrors.length > 0 &&
              generic404ConsoleErrors.length > 0 &&
              generic404ConsoleErrors.length <= walkthroughErrors.length
            ) {
              audit.diagnostics.ignored.push(
                ...walkthroughErrors.map((entry) => ({
                  ...entry,
                  kind: "prefetch_404_for_directly_verified_walkthrough",
                })),
                ...generic404ConsoleErrors.map((entry) => ({
                  ...entry,
                  kind: "console_for_directly_verified_walkthrough_prefetch",
                })),
              );
              audit.diagnostics.errorResponses = audit.diagnostics.errorResponses.filter((entry) => {
                const parsed = new URL(entry.url, baseUrl);
                return !(parsed.pathname === "/walkthrough" && entry.status === 404);
              });
              audit.diagnostics.consoleErrors = audit.diagnostics.consoleErrors.filter(
                (entry) => !/Failed to load resource:.*404/i.test(entry.text),
              );
            }
            assert.deepEqual(audit.diagnostics.consoleErrors, [], "Relevant console errors were detected.");
            assert.deepEqual(audit.diagnostics.pageErrors, [], "Page errors were detected.");''',
              'walkthrough prefetch normalization',
          )

          path.write_text(text)
          PY
          node --check .github/scripts/collective-in-create-protected-preview-qa.mjs

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies and Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          node --check .github/scripts/collective-in-create-protected-preview-qa.mjs
          npx playwright install --with-deps chromium

      - name: Remove superseded exact synthetic feature-review fixtures
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE' | tee "$BROWSER_QA_ARTIFACT_DIR/prior-fixture-cleanup.log"
          import { createClient } from "@supabase/supabase-js";

          const client = createClient(
            process.env.NEXT_PUBLIC_SUPABASE_URL,
            process.env.SUPABASE_SERVICE_ROLE_KEY,
            { auth: { autoRefreshToken: false, detectSessionInUrl: false, persistSession: false } },
          );
          const titlePrefix = "[LIVE FEATURE REVIEW 3228deff]";
          const emailPrefix = "qa-collective-live-review-3228deff-";

          const users = [];
          for (let page = 1; page <= 20; page += 1) {
            const { data, error } = await client.auth.admin.listUsers({ page, perPage: 100 });
            if (error) throw error;
            users.push(...data.users);
            if (data.users.length < 100) break;
          }
          const matchingUsers = users.filter((user) =>
            String(user.email ?? "").toLowerCase().startsWith(emailPrefix),
          );

          for (const user of matchingUsers) {
            const { data: commitments, error: commitmentReadError } = await client
              .from("collective_commitments")
              .select("id,title")
              .eq("creator_id", user.id);
            if (commitmentReadError) throw commitmentReadError;
            const unsafe = (commitments ?? []).filter(
              (row) => !String(row.title).startsWith(titlePrefix),
            );
            if (unsafe.length) {
              throw new Error(`Refusing cleanup for ${user.id}: non-review commitments exist.`);
            }
            if ((commitments ?? []).length) {
              const { error } = await client
                .from("collective_commitments")
                .delete()
                .eq("creator_id", user.id)
                .like("title", `${titlePrefix}%`);
              if (error) throw error;
            }
            const { error: credentialError } = await client
              .from("collective_identity_credentials")
              .delete()
              .eq("profile_id", user.id);
            if (credentialError) throw credentialError;
            const { error: profileError } = await client.from("profiles").delete().eq("id", user.id);
            if (profileError) throw profileError;
            const { error: authError } = await client.auth.admin.deleteUser(user.id);
            if (authError) throw authError;
          }

          const { data: remainingCommitments, error: remainingCommitmentError } = await client
            .from("collective_commitments")
            .select("id")
            .like("title", `${titlePrefix}%`);
          if (remainingCommitmentError) throw remainingCommitmentError;
          if ((remainingCommitments ?? []).length) {
            const { error } = await client
              .from("collective_commitments")
              .delete()
              .like("title", `${titlePrefix}%`);
            if (error) throw error;
          }

          const verifyUsers = [];
          for (let page = 1; page <= 20; page += 1) {
            const { data, error } = await client.auth.admin.listUsers({ page, perPage: 100 });
            if (error) throw error;
            verifyUsers.push(...data.users);
            if (data.users.length < 100) break;
          }
          const remainingUsers = verifyUsers.filter((user) =>
            String(user.email ?? "").toLowerCase().startsWith(emailPrefix),
          );
          const { count, error: countError } = await client
            .from("collective_commitments")
            .select("id", { count: "exact", head: true })
            .like("title", `${titlePrefix}%`);
          if (countError) throw countError;
          if (remainingUsers.length || (count ?? 0) !== 0) {
            throw new Error(`Superseded fixture residue: users=${remainingUsers.length}, commitments=${count ?? 0}`);
          }
          console.log(`Removed ${matchingUsers.length} superseded synthetic users; exact fixture residue is zero.`);
          NODE

      - name: Configure isolated branch-scoped Preview environment
        shell: bash
        run: |
          set -euo pipefail
          master_key="$(openssl rand -base64 32 | tr -d '\n')"
          echo "::add-mask::$master_key"
          upsert_env() {
            local key="$1" value="$2" type="$3"
            jq -n \
              --arg key "$key" \
              --arg value "$value" \
              --arg type "$type" \
              --arg branch "$EXPECTED_PRODUCT_BRANCH" \
              '{key:$key,value:$value,type:$type,target:["preview"],gitBranch:$branch,comment:"Isolated QA-only Collective-in-Create protected Preview; production unaffected."}' \
              > "$RUNNER_TEMP/env.json"
            curl --silent --show-error --fail-with-body \
              --request POST \
              --url "https://api.vercel.com/v10/projects/${VERCEL_PROJECT_ID}/env?teamId=${VERCEL_TEAM_ID}&upsert=true" \
              --header "Authorization: Bearer ${VERCEL_TOKEN}" \
              --header "Content-Type: application/json" \
              --data-binary @"$RUNNER_TEMP/env.json" \
              > "$RUNNER_TEMP/env-response.json"
            jq -e '((.failed // []) | length) == 0 and (.created // .) != null' "$RUNNER_TEMP/env-response.json" >/dev/null
            printf '%s=CONFIGURED\n' "$key" >> "$BROWSER_QA_ARTIFACT_DIR/environment-status.txt"
          }
          upsert_env COLLECTIVE_COMMITMENTS_ENABLED true plain
          upsert_env COLLECTIVE_COMMITMENT_MASTER_KEY "$master_key" sensitive
          upsert_env COLLECTIVE_COMMITMENT_MIN_DEADLINE_MINUTES 60 plain
          upsert_env NEXT_PUBLIC_SUPABASE_URL "$NEXT_PUBLIC_SUPABASE_URL" plain
          upsert_env NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" encrypted
          upsert_env SUPABASE_SERVICE_ROLE_KEY "$SUPABASE_SERVICE_ROLE_KEY" sensitive
          rm -f "$RUNNER_TEMP/env.json" "$RUNNER_TEMP/env-response.json"

      - name: Deploy exact product SHA to protected canonical Preview
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            --arg name "$VERCEL_PROJECT_NAME" \
            --arg project "$VERCEL_PROJECT_ID" \
            --arg ref "$EXPECTED_PRODUCT_BRANCH" \
            --arg sha "$EXPECTED_PRODUCT_HEAD" \
            '{name:$name,project:$project,gitSource:{type:"github",org:"ghuser29384",repo:"Website2",ref:$ref,sha:$sha},meta:{purpose:"collective-in-create-authenticated-rendered-qa",exactProductHead:$sha}}' \
            > "$RUNNER_TEMP/deploy.json"
          curl --silent --show-error --fail-with-body \
            --request POST \
            --url "https://api.vercel.com/v13/deployments?teamId=${VERCEL_TEAM_ID}&forceNew=1" \
            --header "Authorization: Bearer ${VERCEL_TOKEN}" \
            --header "Content-Type: application/json" \
            --data-binary @"$RUNNER_TEMP/deploy.json" \
            > "$RUNNER_TEMP/deploy-response.json"
          deployment_id="$(jq -r '.id // empty' "$RUNNER_TEMP/deploy-response.json")"
          deployment_host="$(jq -r '.url // empty' "$RUNNER_TEMP/deploy-response.json")"
          test -n "$deployment_id" && test -n "$deployment_host"

          state=""
          for _ in $(seq 1 180); do
            curl --silent --show-error --fail-with-body \
              --url "https://api.vercel.com/v13/deployments/${deployment_id}?teamId=${VERCEL_TEAM_ID}" \
              --header "Authorization: Bearer ${VERCEL_TOKEN}" \
              > "$RUNNER_TEMP/deployment-poll.json"
            state="$(jq -r '.readyState // .state // empty' "$RUNNER_TEMP/deployment-poll.json")"
            [[ "$state" == "READY" ]] && break
            if [[ "$state" == "ERROR" || "$state" == "CANCELED" ]]; then
              cat "$RUNNER_TEMP/deployment-poll.json" >&2
              exit 1
            fi
            sleep 5
          done
          test "$state" = "READY"
          jq -e \
            --arg id "$deployment_id" \
            --arg project "$VERCEL_PROJECT_ID" \
            --arg sha "$EXPECTED_PRODUCT_HEAD" \
            '.id == $id and .project.id == $project and (.readyState // .state) == "READY" and .target == null and .meta.githubCommitSha == $sha' \
            "$RUNNER_TEMP/deployment-poll.json" >/dev/null
          jq '{id,url,readyState,state,target,project:{id,name},meta:{githubCommitSha,githubCommitRef,purpose,exactProductHead}}' \
            "$RUNNER_TEMP/deployment-poll.json" > "$BROWSER_QA_ARTIFACT_DIR/deployment.json"
          echo "EXPECTED_DEPLOYMENT_ID=$deployment_id" >> "$GITHUB_ENV"
          echo "EXPECTED_PREVIEW_HOSTNAME=$deployment_host" >> "$GITHUB_ENV"
          echo "PREVIEW_BASE_URL=https://$deployment_host" >> "$GITHUB_ENV"
          printf '%s\n' \
            "deployment_id=${deployment_id}" \
            "deployment_url=https://${deployment_host}" \
            "product_head=${EXPECTED_PRODUCT_HEAD}" \
            "canonical_project=${VERCEL_PROJECT_ID}" \
            "target=preview" \
            >> "$BROWSER_QA_ARTIFACT_DIR/exact-boundary.txt"

      - name: Generate ephemeral automation bypass
        shell: bash
        run: |
          set -euo pipefail
          secret="$(openssl rand -hex 16)"
          echo "::add-mask::$secret"
          echo "VERCEL_AUTOMATION_BYPASS_SECRET=$secret" >> "$GITHUB_ENV"
          jq -n --arg secret "$secret" --arg note "Protected Preview QA ${GITHUB_RUN_ID}" \
            '{generate:{secret:$secret,note:$note}}' > "$RUNNER_TEMP/bypass-request.json"
          curl --silent --show-error --fail-with-body \
            --request PATCH \
            --url "https://api.vercel.com/v1/projects/${VERCEL_PROJECT_ID}/protection-bypass?teamId=${VERCEL_TEAM_ID}" \
            --header "Authorization: Bearer ${VERCEL_TOKEN}" \
            --header "Content-Type: application/json" \
            --data-binary @"$RUNNER_TEMP/bypass-request.json" \
            > "$RUNNER_TEMP/bypass-response.json"
          jq -e '.protectionBypass | type == "object"' "$RUNNER_TEMP/bypass-response.json" >/dev/null
          printf 'automation_bypass=EPHEMERAL_GENERATED\n' > "$BROWSER_QA_ARTIFACT_DIR/protection-status.txt"
          rm -f "$RUNNER_TEMP/bypass-request.json" "$RUNNER_TEMP/bypass-response.json"

      - name: Run authenticated rendered Preview QA
        shell: bash
        run: |
          set -o pipefail
          node .github/scripts/collective-in-create-protected-preview-qa.mjs \
            2>&1 | tee "$BROWSER_QA_ARTIFACT_DIR/run.log"

      - name: Verify audit and exact zero-residue cleanup
        shell: bash
        run: |
          set -euo pipefail
          audit="$BROWSER_QA_ARTIFACT_DIR/audit.json"
          test -s "$audit"
          jq -e '.outcome == "pass"' "$audit" >/dev/null
          jq -e '.cleanup.completed == true' "$audit" >/dev/null
          jq -e '.cleanup.remaining | to_entries | all(.value == 0)' "$audit" >/dev/null
          jq -e '[.checks[] | select(.outcome != "pass")] | length == 0' "$audit" >/dev/null
          jq -e '.diagnostics.consoleErrors | length == 0' "$audit" >/dev/null
          jq -e '.diagnostics.pageErrors | length == 0' "$audit" >/dev/null
          jq -e '.diagnostics.failedRequests | length == 0' "$audit" >/dev/null
          jq -e '.diagnostics.errorResponses | length == 0' "$audit" >/dev/null
          printf '%s\n' \
            "product_head=${EXPECTED_PRODUCT_HEAD}" \
            "deployment_id=${EXPECTED_DEPLOYMENT_ID}" \
            "protected_preview_rendered_qa=PASS" \
            "authenticated_creation=PASS" \
            "first_signature_private=PASS" \
            "exact_threshold_atomic_reveal=PASS" \
            "affiliation_opt_in=PASS" \
            "desktop=PASS" \
            "mobile_390=PASS" \
            "mobile_320=PASS" \
            "runtime_diagnostics=PASS" \
            "synthetic_cleanup=PASS" \
            "production_changed=NO" \
            > "$BROWSER_QA_ARTIFACT_DIR/result.txt"

      - name: Revoke ephemeral automation bypass
        if: always()
        shell: bash
        run: |
          set -u
          if [[ -n "${VERCEL_AUTOMATION_BYPASS_SECRET:-}" && -n "${VERCEL_TOKEN:-}" ]]; then
            jq -n --arg secret "$VERCEL_AUTOMATION_BYPASS_SECRET" \
              '{revoke:{secret:$secret,regenerate:false}}' > "$RUNNER_TEMP/bypass-revoke.json"
            curl --silent --show-error --fail-with-body \
              --request PATCH \
              --url "https://api.vercel.com/v1/projects/${VERCEL_PROJECT_ID}/protection-bypass?teamId=${VERCEL_TEAM_ID}" \
              --header "Authorization: Bearer ${VERCEL_TOKEN}" \
              --header "Content-Type: application/json" \
              --data-binary @"$RUNNER_TEMP/bypass-revoke.json" \
              > "$RUNNER_TEMP/bypass-revoke-response.json"
            printf 'automation_bypass=REVOKED\n' >> "$BROWSER_QA_ARTIFACT_DIR/protection-status.txt"
          fi

      - name: Upload complete rendered-QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collective-in-create-protected-preview-qa-${{ github.run_id }}
          path: protected-preview-rendered-qa
          if-no-files-found: error
          retention-days: 14
