name: PR 727 production Create UAT final

on:
  push:
    branches:
      - ops/pr727-production-create-uat-final-20260817
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pr727-production-create-uat-final
  cancel-in-progress: false

env:
  CONTROLLER_BRANCH: ops/pr727-production-create-uat-final-20260817
  RELEASE_SHA: fd5588fc4ae7f2fed44d6b0d1ca68f24ce1b86ab
  CONTROLLER_BASE_SHA: af26c915db008ff157bacabb5209ec9dc22c59e9
  DEPLOYMENT_ID: dpl_5uNGHmgrNDjraHVRukXyNPeGRgEk
  DEPLOYMENT_URL: https://moraltrade-site-6vbxdlg7e-ellen-s.vercel.app
  DEPLOYMENT_HOST: moraltrade-site-6vbxdlg7e-ellen-s.vercel.app
  CANONICAL_ORIGINS: https://www.moraltrade.org,https://moraltrade.org
  APEX_DOMAIN: moraltrade.org
  WWW_DOMAIN: www.moraltrade.org
  SUPABASE_REF: jnpoxvalyjtdghnperyu
  VERCEL_ORG_ID: team_ySu6sF3Uho1E1GnJtCQPVEuJ
  VERCEL_PROJECT_ID: prj_Em3j7Uj7RatX2R1ZYhla3XSHRde7
  VERCEL_CLI_VERSION: 50.38.1
  OUTPUT_DIR: create-production-uat-final

jobs:
  production-uat:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Check out exact controller
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Guard exact release ancestry and controller scope
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'ghuser29384/Website2'
          test "$GITHUB_REF_NAME" = "$CONTROLLER_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git cat-file -e "${RELEASE_SHA}^{commit}"
          git cat-file -e "${CONTROLLER_BASE_SHA}^{commit}"
          git merge-base --is-ancestor "$RELEASE_SHA" "$CONTROLLER_BASE_SHA"
          git merge-base --is-ancestor "$CONTROLLER_BASE_SHA" "$GITHUB_SHA"
          git diff --check "$RELEASE_SHA" "$GITHUB_SHA"
          git diff --name-only "$RELEASE_SHA" "$GITHUB_SHA" | sort > controller-files.txt
          cat > expected-controller-files.txt <<'FILES'
          .github/scripts/create-production-uat-cleanup.sql
          .github/scripts/create-production-uat-fixture.sql
          .github/scripts/create-production-uat.mjs
          .github/workflows/pr727-production-create-uat-final.yml
          FILES
          diff -u expected-controller-files.txt controller-files.txt
          test -z "$(git status --porcelain --untracked-files=no)"
          mkdir -p "$OUTPUT_DIR"
          {
            printf 'release_sha=%s\n' "$RELEASE_SHA"
            printf 'controller_base_sha=%s\n' "$CONTROLLER_BASE_SHA"
            printf 'controller_sha=%s\n' "$GITHUB_SHA"
            printf 'controller_tree=%s\n' "$(git rev-parse HEAD^{tree})"
          } > "$OUTPUT_DIR/controller.txt"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies and Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium
          node --check .github/scripts/create-production-uat.mjs
          ruby -e "require 'yaml'; abort('invalid workflow YAML') unless YAML.parse_file('.github/workflows/pr727-production-create-uat-final.yml')"

      - name: Pull exact production service credential and bind checked-in public configuration
        id: credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          npx --yes "vercel@${VERCEL_CLI_VERSION}" pull \
            --yes \
            --environment=production \
            --token="$VERCEL_TOKEN" \
            > "$RUNNER_TEMP/vercel-pull.log" 2>&1
          env_file="$PWD/.vercel/.env.production.local"
          test -s "$env_file"
          service_role="$(ENV_FILE="$env_file" bash -c '
            set +u
            source "$ENV_FILE"
            printf "%s" "${SUPABASE_SERVICE_ROLE_KEY:-}"
          ')"
          test -n "$service_role"

          supabase_url="$(sed -nE 's/^const DEFAULT_PUBLIC_SUPABASE_URL = "([^"]+)";$/\1/p' src/lib/supabase/config.ts)"
          publishable_key="$(awk '
            /^const DEFAULT_PUBLIC_SUPABASE_PUBLISHABLE_KEY =/ {
              getline
              value=$0
              sub(/^[[:space:]]*"/, "", value)
              sub(/";[[:space:]]*$/, "", value)
              print value
              exit
            }
          ' src/lib/supabase/config.ts)"
          test -n "$supabase_url"
          test -n "$publishable_key"
          observed_ref="$(SUPABASE_URL="$supabase_url" python3 - <<'PY'
          import os
          from urllib.parse import urlparse
          print((urlparse(os.environ['SUPABASE_URL']).hostname or '').split('.')[0])
          PY
          )"
          test "$observed_ref" = "$SUPABASE_REF"
          echo "::add-mask::$service_role"
          echo "::add-mask::$publishable_key"
          umask 077
          {
            printf 'export NEXT_PUBLIC_SUPABASE_URL=%q\n' "$supabase_url"
            printf 'export NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=%q\n' "$publishable_key"
            printf 'export SUPABASE_SERVICE_ROLE_KEY=%q\n' "$service_role"
          } > "$RUNNER_TEMP/create-uat-secrets.env"
          rm -rf .vercel "$RUNNER_TEMP/vercel-pull.log"
          unset service_role publishable_key supabase_url
          jq -n \
            --arg projectId "$VERCEL_PROJECT_ID" \
            --arg supabaseRef "$observed_ref" \
            --arg observedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{projectId:$projectId,environment:"production",supabaseRef:$supabaseRef,serviceCredentialPresent:true,publicConfigurationSource:"checked-in production defaults",secretValuesRetained:false,observedAt:$observedAt}' \
            > "$OUTPUT_DIR/environment.json"
          echo 'exit_code=0' >> "$GITHUB_OUTPUT"

      - name: Verify exact deployment and both aliases before UAT
        id: alias_before
        shell: bash
        run: |
          set -euo pipefail
          verify_aliases() {
            local suffix="$1"
            local raw="$RUNNER_TEMP/deployment-${suffix}.json"
            curl -fsS -H "Authorization: Bearer ${VERCEL_TOKEN}" \
              "https://api.vercel.com/v13/deployments/${DEPLOYMENT_ID}?teamId=${VERCEL_ORG_ID}" > "$raw"
            jq -e \
              --arg id "$DEPLOYMENT_ID" \
              --arg host "$DEPLOYMENT_HOST" \
              --arg project "$VERCEL_PROJECT_ID" \
              --arg sha "$RELEASE_SHA" '
                ((.id // .uid) == $id)
                and (.url == $host)
                and ((.projectId // .project.id // "") == $project)
                and ((.readyState // .state // "") == "READY")
                and (.target == "production")
                and ((.aliasError // null) == null)
                and (.meta.githubCommitSha == $sha)
              ' "$raw" >/dev/null
            jq '{id:(.id // .uid),url,projectId:(.projectId // .project.id),readyState:(.readyState // .state),target,githubCommitSha:.meta.githubCommitSha}' "$raw" > "$OUTPUT_DIR/deployment-${suffix}.json"
            mkdir -p "$OUTPUT_DIR/aliases-${suffix}"
            for alias_name in "$APEX_DOMAIN" "$WWW_DOMAIN"; do
              local key="${alias_name//./-}"
              local alias_raw="$RUNNER_TEMP/alias-${suffix}-${key}.json"
              curl -fsS -H "Authorization: Bearer ${VERCEL_TOKEN}" \
                "https://api.vercel.com/v4/aliases/${alias_name}?projectId=${VERCEL_PROJECT_ID}&teamId=${VERCEL_ORG_ID}" > "$alias_raw"
              jq -e --arg alias "$alias_name" --arg project "$VERCEL_PROJECT_ID" --arg deployment "$DEPLOYMENT_ID" '
                (.alias == $alias)
                and (.projectId == $project)
                and ((.deploymentId // .deployment.id // .deployment.uid // "") == $deployment)
              ' "$alias_raw" >/dev/null
              jq '{alias,projectId,deploymentId:(.deploymentId // .deployment.id // .deployment.uid)}' "$alias_raw" > "$OUTPUT_DIR/aliases-${suffix}/${key}.json"
            done
          }
          verify_aliases before
          : > "$OUTPUT_DIR/http-before.txt"
          for origin in https://moraltrade.org https://www.moraltrade.org; do
            printf 'requested=%s/create\n' "$origin" >> "$OUTPUT_DIR/http-before.txt"
            curl -sS -L --max-redirs 5 --max-time 60 -o /dev/null \
              -w 'status=%{http_code}\neffective=%{url_effective}\nredirects=%{num_redirects}\n\n' \
              "$origin/create" >> "$OUTPUT_DIR/http-before.txt"
          done
          test "$(grep -c '^status=200$' "$OUTPUT_DIR/http-before.txt")" = '2'
          echo 'exit_code=0' >> "$GITHUB_OUTPUT"

      - name: Create one run-owned production Auth fixture
        id: fixture
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/create-uat-secrets.env"
          qa_user_id="$(python3 -c 'import uuid; print(uuid.uuid4())')"
          qa_suffix="$(openssl rand -hex 6)"
          qa_email="create-uat-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${qa_suffix}@qa.moraltrade.invalid"
          qa_password="$(openssl rand -base64 36 | tr -d '\n')"
          qa_run_id="${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
          echo "::add-mask::$qa_password"
          umask 077
          printf '%s' "$qa_user_id" > "$RUNNER_TEMP/qa-user-id"
          printf '%s' "$qa_email" > "$RUNNER_TEMP/qa-email"
          printf '%s' "$qa_password" > "$RUNNER_TEMP/qa-password"
          printf '%s' "$qa_run_id" > "$RUNNER_TEMP/qa-run-id"

          body="$(jq -nc \
            --arg id "$qa_user_id" \
            --arg email "$qa_email" \
            --arg password "$qa_password" \
            --arg runId "$qa_run_id" '
              {
                id:$id,
                email:$email,
                password:$password,
                email_confirm:true,
                user_metadata:{display_name:"Create production UAT",full_name:"Create production UAT",qa_scope:"create_production_uat",qa_run_id:$runId}
              }')"
          response="$RUNNER_TEMP/auth-create.json"
          status="$(curl -sS -X POST \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H 'Content-Type: application/json' \
            -o "$response" -w '%{http_code}' \
            --data "$body" \
            "${NEXT_PUBLIC_SUPABASE_URL}/auth/v1/admin/users")"
          unset body qa_password
          test "$status" = '200' -o "$status" = '201'
          jq -e --arg id "$qa_user_id" --arg email "$qa_email" --arg run "$qa_run_id" '
            (.id == $id)
            and ((.email // "") | ascii_downcase == ($email | ascii_downcase))
            and (.email_confirmed_at != null)
            and ((.user_metadata // .raw_user_meta_data).qa_scope == "create_production_uat")
            and ((.user_metadata // .raw_user_meta_data).qa_run_id == $run)
          ' "$response" >/dev/null

          profile_ready=false
          for attempt in $(seq 1 30); do
            curl -fsS \
              -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
              "${NEXT_PUBLIC_SUPABASE_URL}/rest/v1/profiles?id=eq.${qa_user_id}&select=id,email,display_name" \
              > "$RUNNER_TEMP/profile-create.json"
            if jq -e --arg id "$qa_user_id" --arg email "$qa_email" '
              length == 1 and .[0].id == $id and ((.[0].email // "") | ascii_downcase == ($email | ascii_downcase))
            ' "$RUNNER_TEMP/profile-create.json" >/dev/null; then
              profile_ready=true
              break
            fi
            sleep 1
          done
          test "$profile_ready" = 'true'
          jq -n --arg userId "$qa_user_id" --arg email "$qa_email" --arg runId "$qa_run_id" --arg createdAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{userId:$userId,email:$email,scope:"create_production_uat",runId:$runId,profileCreated:true,createdAt:$createdAt}' \
            > "$OUTPUT_DIR/fixture.json"
          echo 'exit_code=0' >> "$GITHUB_OUTPUT"

      - name: Run authenticated canonical desktop and mobile Create UAT
        id: browser
        shell: bash
        run: |
          set -uo pipefail
          source "$RUNNER_TEMP/create-uat-secrets.env"
          export CREATE_UAT_EXPECTED_MAIN_SHA="$RELEASE_SHA"
          export CREATE_UAT_EXPECTED_DEPLOYMENT_ID="$DEPLOYMENT_ID"
          export CREATE_UAT_ORIGINS="$CANONICAL_ORIGINS"
          export CREATE_UAT_OUTPUT_DIR="$OUTPUT_DIR"
          export CREATE_UAT_USER_ID="$(cat "$RUNNER_TEMP/qa-user-id")"
          export CREATE_UAT_EMAIL="$(cat "$RUNNER_TEMP/qa-email")"
          export CREATE_UAT_PASSWORD="$(cat "$RUNNER_TEMP/qa-password")"
          echo "::add-mask::$CREATE_UAT_PASSWORD"
          date -u +%Y-%m-%dT%H:%M:%SZ > "$OUTPUT_DIR/uat-started-at.txt"
          set +e
          node .github/scripts/create-production-uat.mjs \
            > >(tee "$OUTPUT_DIR/browser.log") \
            2> >(tee "$OUTPUT_DIR/browser.stderr.log" >&2)
          code=$?
          set -e
          date -u +%Y-%m-%dT%H:%M:%SZ > "$OUTPUT_DIR/uat-completed-at.txt"
          printf '%s\n' "$code" > "$OUTPUT_DIR/browser-exit-code.txt"
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Reverify deployment and aliases after UAT
        id: alias_after
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          code=0
          raw="$RUNNER_TEMP/deployment-after.json"
          set +e
          curl -fsS -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            "https://api.vercel.com/v13/deployments/${DEPLOYMENT_ID}?teamId=${VERCEL_ORG_ID}" > "$raw"
          curl_code=$?
          set -e
          if [[ "$curl_code" -ne 0 ]] || ! jq -e --arg id "$DEPLOYMENT_ID" --arg host "$DEPLOYMENT_HOST" --arg project "$VERCEL_PROJECT_ID" --arg sha "$RELEASE_SHA" '
            ((.id // .uid) == $id)
            and (.url == $host)
            and ((.projectId // .project.id // "") == $project)
            and ((.readyState // .state // "") == "READY")
            and (.target == "production")
            and (.meta.githubCommitSha == $sha)
          ' "$raw" >/dev/null; then
            code=70
          else
            jq '{id:(.id // .uid),url,projectId:(.projectId // .project.id),readyState:(.readyState // .state),target,githubCommitSha:.meta.githubCommitSha}' "$raw" > "$OUTPUT_DIR/deployment-after.json"
          fi
          mkdir -p "$OUTPUT_DIR/aliases-after"
          if [[ "$code" -eq 0 ]]; then
            for alias_name in "$APEX_DOMAIN" "$WWW_DOMAIN"; do
              key="${alias_name//./-}"
              alias_raw="$RUNNER_TEMP/alias-after-${key}.json"
              set +e
              curl -fsS -H "Authorization: Bearer ${VERCEL_TOKEN}" \
                "https://api.vercel.com/v4/aliases/${alias_name}?projectId=${VERCEL_PROJECT_ID}&teamId=${VERCEL_ORG_ID}" > "$alias_raw"
              alias_curl=$?
              set -e
              if [[ "$alias_curl" -ne 0 ]] || ! jq -e --arg alias "$alias_name" --arg project "$VERCEL_PROJECT_ID" --arg deployment "$DEPLOYMENT_ID" '
                (.alias == $alias)
                and (.projectId == $project)
                and ((.deploymentId // .deployment.id // .deployment.uid // "") == $deployment)
              ' "$alias_raw" >/dev/null; then
                code=71
                break
              fi
              jq '{alias,projectId,deploymentId:(.deploymentId // .deployment.id // .deployment.uid)}' "$alias_raw" > "$OUTPUT_DIR/aliases-after/${key}.json"
            done
          fi
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Remove and prove absence of exact run-owned fixture
        id: cleanup
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          code=0
          deleted=false
          auth_absent=false
          profile_absent=false
          user_id=''
          email=''
          run_id=''
          [[ -s "$RUNNER_TEMP/qa-user-id" ]] && user_id="$(cat "$RUNNER_TEMP/qa-user-id")"
          [[ -s "$RUNNER_TEMP/qa-email" ]] && email="$(cat "$RUNNER_TEMP/qa-email")"
          [[ -s "$RUNNER_TEMP/qa-run-id" ]] && run_id="$(cat "$RUNNER_TEMP/qa-run-id")"
          if [[ -s "$RUNNER_TEMP/create-uat-secrets.env" && -n "$user_id" ]]; then
            source "$RUNNER_TEMP/create-uat-secrets.env"
            inspect="$RUNNER_TEMP/auth-inspect.json"
            set +e
            inspect_status="$(curl -sS \
              -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
              -o "$inspect" -w '%{http_code}' \
              "${NEXT_PUBLIC_SUPABASE_URL}/auth/v1/admin/users/${user_id}")"
            inspect_curl=$?
            set -e
            if [[ "$inspect_curl" -ne 0 || "$inspect_status" != '200' ]] || ! jq -e --arg id "$user_id" --arg email "$email" --arg run "$run_id" '
              (.id == $id)
              and ((.email // "") | ascii_downcase == ($email | ascii_downcase))
              and ((.user_metadata // .raw_user_meta_data).qa_scope == "create_production_uat")
              and ((.user_metadata // .raw_user_meta_data).qa_run_id == $run)
            ' "$inspect" >/dev/null; then
              code=80
            else
              set +e
              delete_status="$(curl -sS -X DELETE \
                -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
                -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
                -o "$RUNNER_TEMP/auth-delete.json" -w '%{http_code}' \
                "${NEXT_PUBLIC_SUPABASE_URL}/auth/v1/admin/users/${user_id}")"
              delete_curl=$?
              set -e
              if [[ "$delete_curl" -ne 0 || ( "$delete_status" != '200' && "$delete_status" != '204' ) ]]; then
                code=81
              else
                deleted=true
              fi
            fi
            if [[ "$code" -eq 0 ]]; then
              for attempt in $(seq 1 30); do
                set +e
                status="$(curl -sS \
                  -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
                  -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
                  -o "$RUNNER_TEMP/auth-after.json" -w '%{http_code}' \
                  "${NEXT_PUBLIC_SUPABASE_URL}/auth/v1/admin/users/${user_id}")"
                get_code=$?
                set -e
                if [[ "$get_code" -eq 0 && "$status" = '404' ]]; then auth_absent=true; break; fi
                sleep 1
              done
              [[ "$auth_absent" == 'true' ]] || code=82
            fi
            if [[ "$code" -eq 0 ]]; then
              for attempt in $(seq 1 30); do
                curl -fsS \
                  -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
                  -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
                  "${NEXT_PUBLIC_SUPABASE_URL}/rest/v1/profiles?id=eq.${user_id}&select=id" \
                  > "$RUNNER_TEMP/profile-after.json"
                if jq -e 'length == 0' "$RUNNER_TEMP/profile-after.json" >/dev/null; then profile_absent=true; break; fi
                sleep 1
              done
              [[ "$profile_absent" == 'true' ]] || code=83
            fi
          elif [[ -n "$user_id" ]]; then
            code=84
          else
            auth_absent=true
            profile_absent=true
          fi
          jq -n --arg userId "$user_id" --arg email "$email" --argjson deleted "$deleted" --argjson authAbsent "$auth_absent" --argjson profileAbsent "$profile_absent" --argjson exitCode "$code" --arg completedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{userId:(if $userId=="" then null else $userId end),email:(if $email=="" then null else $email end),deleted:$deleted,authUserAbsent:$authAbsent,profileAbsent:$profileAbsent,exitCode:$exitCode,completedAt:$completedAt}' \
            > "$OUTPUT_DIR/cleanup.json"
          rm -f "$RUNNER_TEMP"/qa-* "$RUNNER_TEMP"/auth-*.json "$RUNNER_TEMP"/profile-*.json
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Validate and summarize machine-readable evidence
        id: evidence
        if: always()
        shell: bash
        run: |
          set +e
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const dir = process.env.OUTPUT_DIR;
          const fail = (message) => { throw new Error(message); };
          const readJson = (name) => JSON.parse(fs.readFileSync(path.join(dir, name), 'utf8'));
          const exitCode = Number(fs.readFileSync(path.join(dir, 'browser-exit-code.txt'), 'utf8').trim());
          if (exitCode !== 0) fail(`Browser exit code ${exitCode}.`);
          const evidence = readJson('evidence.json');
          const cleanup = readJson('cleanup.json');
          if (evidence.expectedMainSha !== process.env.RELEASE_SHA) fail('Release SHA mismatch.');
          if (evidence.expectedDeploymentId !== process.env.DEPLOYMENT_ID) fail('Deployment ID mismatch.');
          if (evidence.noOfferPaymentTradeOrSyntheticProductRecordCreated !== true) fail('Product-record boundary was not preserved.');
          if (!evidence.desktop || !evidence.mobile || !evidence.secondCanonical) fail('Incomplete viewport/domain evidence.');
          const allDiagnostics = [
            evidence.desktop.diagnostics,
            evidence.mobile.diagnostics,
            evidence.secondCanonical.diagnostics,
          ];
          for (const diagnostics of allDiagnostics) {
            for (const key of ['consoleErrors','hydrationErrors','pageErrors','failedRelevantRequests','httpErrors','mutationRequests']) {
              if (!Array.isArray(diagnostics[key]) || diagnostics[key].length !== 0) fail(`Nonempty diagnostics ${key}.`);
            }
          }
          if (cleanup.exitCode !== 0 || cleanup.deleted !== true || cleanup.authUserAbsent !== true || cleanup.profileAbsent !== true) {
            fail('Fixture cleanup proof failed.');
          }
          const screenshots = [
            'create-production-desktop-1644x900.png',
            'create-production-desktop-frame-1644x900.png',
            'create-production-mobile-390x844.png',
            'create-production-mobile-frame-390x844.png',
          ];
          for (const name of screenshots) {
            const file = path.join(dir, name);
            if (!fs.existsSync(file) || fs.statSync(file).size < 1000) fail(`Missing screenshot ${name}.`);
          }
          const summary = {
            schemaVersion: 1,
            releaseSha: evidence.expectedMainSha,
            deploymentId: evidence.expectedDeploymentId,
            deploymentUrl: process.env.DEPLOYMENT_URL,
            aliases: ['moraltrade.org','www.moraltrade.org'],
            uatStartedAt: evidence.startedAt,
            uatFinishedAt: evidence.finishedAt,
            desktopViewport: { width: 1644, height: 900 },
            mobileViewport: { width: 390, height: 844 },
            authenticatedCanonicalDomains: true,
            uiContractPassed: true,
            browserDiagnosticsClean: true,
            browserMutationRequests: 0,
            fixtureDeleted: true,
            authUserAbsent: true,
            profileAbsent: true,
            noOfferPaymentTradeOrSyntheticProductRecordCreated: true,
          };
          fs.writeFileSync(path.join(dir, 'summary.json'), `${JSON.stringify(summary, null, 2)}\n`);
          NODE
          code=$?
          sensitive="$(grep -RIlE --include='*.json' --include='*.log' --include='*.txt' '
            "password"[[:space:]]*:|"access_token"[[:space:]]*:|"refresh_token"[[:space:]]*:|sb_secret_|SUPABASE_SERVICE_ROLE_KEY|VERCEL_TOKEN|CREATE_UAT_PASSWORD
          ' "$OUTPUT_DIR" controller-files.txt expected-controller-files.txt 2>/dev/null || true)"
          if [[ -n "$sensitive" ]]; then
            printf 'Credential-like artifact content: %s\n' "$sensitive" >&2
            code=90
          fi
          rm -f "$RUNNER_TEMP/create-uat-secrets.env" "$RUNNER_TEMP"/deployment-*.json "$RUNNER_TEMP"/alias-*.json
          test -z "$(git status --porcelain --untracked-files=no)" || code=91
          printf '%s\n' "$code" > "$OUTPUT_DIR/evidence-exit-code.txt"
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload immutable production UAT evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr727-production-create-uat-final-${{ github.run_id }}
          path: |
            controller-files.txt
            expected-controller-files.txt
            create-production-uat-final/
          if-no-files-found: error
          retention-days: 30

      - name: Preserve fail-closed conclusion
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.credentials.outputs.exit_code || '255' }}" = '0'
          test "${{ steps.alias_before.outputs.exit_code || '255' }}" = '0'
          test "${{ steps.fixture.outputs.exit_code || '255' }}" = '0'
          test "${{ steps.browser.outputs.exit_code || '255' }}" = '0'
          test "${{ steps.alias_after.outputs.exit_code || '255' }}" = '0'
          test "${{ steps.cleanup.outputs.exit_code || '255' }}" = '0'
          test "${{ steps.evidence.outputs.exit_code || '255' }}" = '0'

      - name: Delete one-use controller branch after success
        if: success()
        shell: bash
        run: git push origin --delete "$CONTROLLER_BRANCH"
