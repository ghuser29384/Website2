name: Temporary cleanup evidence credibility shadow staging

on:
  push:
    branches:
      - feature/evidence-credibility-shadow-v2-20260810
    paths:
      - .github/workflows/cleanup-evidence-credibility-shadow-staging.yml

permissions:
  contents: write

jobs:
  cleanup:
    if: github.repository == 'ghuser29384/Website2'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/evidence-credibility-shadow-v2-20260810
          fetch-depth: 0

      - name: Delete staging residue and this controller
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/staged-evidence-credibility-shadow-qa.yml.txt
          rm -f .github/workflows/cleanup-evidence-credibility-shadow-staging.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          test "$(git diff --cached --name-status | awk '$1=="D"{n++} END{print n+0}')" -eq 2
          git commit -m "Remove evidence credibility shadow staging residue"
          git push origin HEAD:feature/evidence-credibility-shadow-v2-20260810
