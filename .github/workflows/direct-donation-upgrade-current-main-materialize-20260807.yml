name: Materialize Direct Donation Upgrade on current main

on:
  push:
    branches:
      - integration/direct-donation-upgrade-current-main-20260807
    paths:
      - .github/workflows/direct-donation-upgrade-current-main-materialize-20260807.yml

permissions:
  contents: write

concurrency:
  group: direct-donation-upgrade-current-main-materialize-20260807
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      APP_BASE: 87b093751a4c2de909555abdb7f181061bb36390
      FEATURE_BASE: eed67390dc79e5c389e160856ff602837710d0ea
      FEATURE_HEAD: c7cd82bd78608435155a4d047eda883e693e55cd
      TARGET_BRANCH: integration/direct-donation-upgrade-current-main-20260807
      EXPECTED_PARENT: 959f40ef8d9c77dcf24c36d8abe70a80255bfd8d
    steps:
      - name: Check out exact controller head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply the exact 31-file feature delta to current main
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git rev-parse "$APP_BASE^{tree}")" = "fa845c19183cc188f7976962f8b0e6d0ad3a6f56"
          test "$(git rev-parse "$FEATURE_BASE^{tree}")" = "f82b24e5b6d0ca57b504a8b924f2c69f11a78a39"
          test "$(git rev-parse "$FEATURE_HEAD^{tree}")" = "ca3e0e7d271ba8be975fd1340ee957e848e417f3"

          cat > "$RUNNER_TEMP/paths.txt" <<'PATHS'
          .env.example
          .github/workflows/direct-donation-upgrade-gates.yml
          .github/workflows/direct-donation-upgrade-qa.yml
          .github/workflows/direct-donation-upgrade-rendered-qa.yml
          docs/direct-verified-donation-upgrade.md
          scripts/vercel-project-config.mjs
          scripts/vercel-project-config.test.mjs
          src/app/admin/donation-upgrades/page.tsx
          src/app/admin/page.tsx
          src/app/api/connectors/every-org/[secret]/route.ts
          src/app/api/donation-upgrades/nonprofits/search/route.ts
          src/app/api/jobs/donation-upgrades/route.ts
          src/app/connectors/page.tsx
          src/app/direct-donation-upgrade-actions.ts
          src/app/donation-upgrades/[offerId]/page.tsx
          src/app/donation-upgrades/page.tsx
          src/app/sitemap.ts
          src/app/trades/new/conditional-donation.tsx
          src/components/donation-upgrades/direct-upgrade-deadline-field.tsx
          src/components/donation-upgrades/every-org-nonprofit-selector.tsx
          src/lib/create-interface/common-ground-integration.test.ts
          src/lib/create-interface/common-ground-integration.ts
          src/lib/create-interface/source-contract.test.ts
          src/lib/direct-donation-upgrade-data.ts
          src/lib/direct-donation-upgrade-source-contract.test.ts
          src/lib/direct-donation-upgrade-webhook.ts
          src/lib/direct-donation-upgrade.test.ts
          src/lib/direct-donation-upgrade.ts
          supabase/migrations/20260801050000_direct_verified_donation_upgrades.sql
          supabase/tests/direct_verified_donation_upgrade.sql
          tests/direct-donation-upgrade-authenticated.spec.ts
          PATHS
          sed -i 's/^          //' "$RUNNER_TEMP/paths.txt"

          mapfile -t paths < "$RUNNER_TEMP/paths.txt"
          git diff --binary "$FEATURE_BASE" "$FEATURE_HEAD" -- "${paths[@]}" > "$RUNNER_TEMP/direct-upgrade.patch"
          test -s "$RUNNER_TEMP/direct-upgrade.patch"
          git apply --3way --index "$RUNNER_TEMP/direct-upgrade.patch"

          python - <<'PY'
          from pathlib import Path
          old = "      - feature/direct-verified-donation-upgrade-20260731\n"
          new = "      - integration/direct-donation-upgrade-current-main-20260807\n"
          path = Path('.github/workflows/direct-donation-upgrade-gates.yml')
          text = path.read_text(encoding='utf-8')
          if text.count(old) != 1:
              raise SystemExit(f'expected one old branch trigger, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          rm -f \
            .github/workflows/direct-donation-upgrade-current-main-source-export-20260807.yml \
            .github/workflows/direct-donation-upgrade-current-main-materialize-20260807.yml
          git add -A
          git diff --cached --check

          git diff --cached --name-only "$APP_BASE" | sort > "$RUNNER_TEMP/actual.txt"
          sort "$RUNNER_TEMP/paths.txt" > "$RUNNER_TEMP/expected.txt"
          diff -u "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/actual.txt"

          test "$(grep -c '^DIRECT_DONATION_UPGRADES_ENABLED=false$' .env.example)" = 1
          grep -Fq 'Moral Trade never receives, holds, combines, redirects, or re-donates participant funds.' docs/direct-verified-donation-upgrade.md
          grep -Fq 'integration/direct-donation-upgrade-current-main-20260807' .github/workflows/direct-donation-upgrade-gates.yml
          ! grep -R -E '@/lib/stripe|stripe\.checkout|payment_intent|setup_intent' \
            src/lib/direct-donation-upgrade.ts \
            src/lib/direct-donation-upgrade-data.ts \
            src/app/direct-donation-upgrade-actions.ts \
            src/app/trades/new/conditional-donation.tsx

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Integrate direct verified Donation Upgrade on current main'

          remote="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$remote" = "$GITHUB_SHA"
          git push origin "HEAD:$TARGET_BRANCH"
