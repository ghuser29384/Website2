name: Observe PR 212 exact head d698

on:
  push:
    branches:
      - agent/pr212-d698-observer-20260731
    paths:
      - .github/workflows/pr212-d698-observer.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_HEAD: d698d8a07905ab2b9323493e149f202823dd1d56
      TARGET_BRANCH: feat/institutional-trade-system
      TARGET_WORKFLOW: institutional-trade-qa.yml
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Poll exact-head institutional QA to terminal state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ops/pr212-d698
          run_id=""
          status=""
          conclusion=""

          for attempt in $(seq 1 140); do
            gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow "$TARGET_WORKFLOW" \
              --branch "$TARGET_BRANCH" \
              --limit 50 \
              --json databaseId,headSha,status,conclusion,createdAt,event,url,displayTitle \
              > /tmp/runs.json

            run_id="$(jq -r --arg head "$TARGET_HEAD" '[.[] | select(.headSha == $head)] | sort_by(.createdAt) | reverse | .[0].databaseId // empty' /tmp/runs.json)"
            status="$(jq -r --arg head "$TARGET_HEAD" '[.[] | select(.headSha == $head)] | sort_by(.createdAt) | reverse | .[0].status // empty' /tmp/runs.json)"
            conclusion="$(jq -r --arg head "$TARGET_HEAD" '[.[] | select(.headSha == $head)] | sort_by(.createdAt) | reverse | .[0].conclusion // empty' /tmp/runs.json)"

            if [[ -n "$run_id" && "$status" == "completed" ]]; then
              break
            fi
            sleep 30
          done

          if [[ -n "$run_id" ]]; then
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" > /tmp/run.json
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100" > /tmp/jobs.json
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100" > /tmp/artifacts.json
            gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --log-failed > /tmp/failed.log 2>&1 || true
            gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --log > /tmp/full.log 2>&1 || true
          else
            printf '%s\n' '{}' > /tmp/run.json
            printf '%s\n' '{"jobs":[]}' > /tmp/jobs.json
            printf '%s\n' '{"artifacts":[]}' > /tmp/artifacts.json
            printf '%s\n' 'No exact-head institutional QA run found.' > /tmp/failed.log
            printf '%s\n' 'No exact-head institutional QA run found.' > /tmp/full.log
          fi

          jq -n \
            --arg observed_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg target_head "$TARGET_HEAD" \
            --arg run_id "$run_id" \
            --arg status "$status" \
            --arg conclusion "$conclusion" \
            --slurpfile runs /tmp/runs.json \
            --slurpfile run /tmp/run.json \
            --slurpfile jobs /tmp/jobs.json \
            --slurpfile artifacts /tmp/artifacts.json \
            '{observed_at:$observed_at,target_head:$target_head,run_id:$run_id,status:$status,conclusion:$conclusion,runs:$runs[0],run:$run[0],jobs:$jobs[0].jobs,artifacts:$artifacts[0].artifacts}' \
            > ops/pr212-d698/status.json
          tail -n 1000 /tmp/failed.log > ops/pr212-d698/failed-log.txt
          tail -n 5000 /tmp/full.log > ops/pr212-d698/full-log-tail.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops/pr212-d698
          git commit -m "Record PR 212 d698 exact-head QA result"
          git push origin HEAD:agent/pr212-d698-observer-20260731

          [[ -n "$run_id" && "$status" == "completed" ]]
