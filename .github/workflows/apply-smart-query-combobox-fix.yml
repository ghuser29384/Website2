name: Apply smart-query combobox fix

on:
  push:
    branches:
      - feat/smart-query-pipeline
    paths:
      - "scripts/fix-smart-query-combobox.mjs"
      - ".github/workflows/apply-smart-query-combobox-fix.yml"

permissions:
  contents: write

concurrency:
  group: apply-smart-query-combobox-fix
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out latest branch head
        uses: actions/checkout@v4
        with:
          ref: feat/smart-query-pipeline
          fetch-depth: 0

      - name: Apply deterministic accessibility patch
        run: node scripts/fix-smart-query-combobox.mjs

      - name: Commit patched component
        run: |
          if git diff --quiet -- src/components/layout/site-topbar.tsx; then
            echo "No combobox patch changes were required."
            exit 0
          fi
          git config user.name "moral-trade-query-bot"
          git config user.email "moral-trade-query-bot@users.noreply.github.com"
          git add src/components/layout/site-topbar.tsx
          git commit -m "Use an accessible combobox for smart global search"
          git push origin HEAD:feat/smart-query-pipeline
