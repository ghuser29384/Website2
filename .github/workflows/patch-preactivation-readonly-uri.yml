name: Patch pre-activation baseline read-only connection enforcement

on:
  push:
    branches:
      - database/preactivation-schema-baseline-clean-20260819
    paths:
      - .github/workflows/patch-preactivation-readonly-uri.yml

permissions:
  contents: write

env:
  TARGET_BRANCH: database/preactivation-schema-baseline-clean-20260819
  EXPECTED_PARENT: 2913c97b55e44c4703a954a7a836a835b5fee086

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: database/preactivation-schema-baseline-clean-20260819
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Replace advisory PGOPTIONS with URI-enforced read-only startup options
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/database/generate-preactivation-baseline.sh")
          source = path.read_text()
          old = '''echo "::add-mask::$PROD_SUPABASE_DB_URL"
          export PGCONNECT_TIMEOUT=15
          export PGSSLMODE=require
          export PGOPTIONS="-c default_transaction_read_only=on -c statement_timeout=180000 -c lock_timeout=5000"

          psql "$PROD_SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -Atqc \\
            "select current_setting('transaction_read_only'), current_database()" \\
            > "$EVIDENCE_ROOT/manifests/source-session.txt"
          if ! grep -qx $'on\\tpostgres' "$EVIDENCE_ROOT/manifests/source-session.txt"; then
            fail "The source session is not the expected read-only production database."
          fi
          '''.replace("          ", "")
          new = '''READONLY_DB_URL="$(python3 - <<'PY_URL'
          import os
          from urllib.parse import parse_qsl, quote, urlencode, urlsplit, urlunsplit

          parsed = urlsplit(os.environ["PROD_SUPABASE_DB_URL"])
          query = [
              (key, value)
              for key, value in parse_qsl(parsed.query, keep_blank_values=True)
              if key != "options"
          ]
          query.append((
              "options",
              "-c default_transaction_read_only=on -c statement_timeout=180000 -c lock_timeout=5000",
          ))
          print(urlunsplit(parsed._replace(query=urlencode(query, quote_via=quote))))
          PY_URL
          )"
          echo "::add-mask::$PROD_SUPABASE_DB_URL"
          echo "::add-mask::$READONLY_DB_URL"
          export PGCONNECT_TIMEOUT=15
          export PGSSLMODE=require
          unset PGOPTIONS || true

          psql "$READONLY_DB_URL" -X -v ON_ERROR_STOP=1 -AtF $'\\t' -c \\
            "select current_setting('default_transaction_read_only'), current_setting('transaction_read_only'), current_database()" \\
            > "$EVIDENCE_ROOT/manifests/source-session.txt"
          if ! grep -qx $'on\\ton\\tpostgres' "$EVIDENCE_ROOT/manifests/source-session.txt"; then
            fail "The source session is not the expected read-only production database."
          fi
          '''.replace("          ", "")
          if source.count(old) != 1:
              raise SystemExit("The expected read-only session block was not found exactly once.")
          source = source.replace(old, new)
          psql_old = 'psql "$PROD_SUPABASE_DB_URL"'
          dump_old = '--db-url "$PROD_SUPABASE_DB_URL"'
          if source.count(psql_old) < 6:
              raise SystemExit("Too few production psql call sites to patch safely.")
          if source.count(dump_old) != 1:
              raise SystemExit("Expected exactly one schema-dump URL call site.")
          source = source.replace(psql_old, 'psql "$READONLY_DB_URL"')
          source = source.replace(dump_old, '--db-url "$READONLY_DB_URL"')
          if 'psql "$PROD_SUPABASE_DB_URL"' in source or '--db-url "$PROD_SUPABASE_DB_URL"' in source:
              raise SystemExit("A production read call still bypasses the enforced read-only URL.")
          path.write_text(source)

          trigger = Path("scripts/database/generate-preactivation-baseline.trigger")
          trigger.write_text(
              "issue-714 authoritative pre-activation baseline generation\n"
              "source-main=26d1fe436dbf9a4440bfafd501ddf8db944a1127\n"
              "requested-at=2026-08-19T07:20:00Z\n"
              "purpose=uri-enforced-read-only-clean-room-boundary\n"
          )
          PY
          rm .github/workflows/patch-preactivation-readonly-uri.yml
          bash -n scripts/database/generate-preactivation-baseline.sh
          git diff --check
          grep -F 'default_transaction_read_only=on' scripts/database/generate-preactivation-baseline.sh
          grep -F 'psql "$READONLY_DB_URL"' scripts/database/generate-preactivation-baseline.sh
          grep -F -- '--db-url "$READONLY_DB_URL"' scripts/database/generate-preactivation-baseline.sh
          ! grep -F 'psql "$PROD_SUPABASE_DB_URL"' scripts/database/generate-preactivation-baseline.sh

      - name: Commit and push normally
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Enforce read-only production baseline capture"
          git push origin "HEAD:$TARGET_BRANCH"
