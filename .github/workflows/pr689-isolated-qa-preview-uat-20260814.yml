name: PR 689 isolated-QA protected Preview owner UAT 20260814

on:
  push:
    branches:
      - ops/pr689-isolated-qa-preview-uat-20260814
    paths:
      - ".github/workflows/pr689-isolated-qa-preview-uat-20260814.yml"
      - "ops/pr689-uat702/**"

concurrency:
  group: pr689-isolated-qa-preview-uat-20260814
  cancel-in-progress: false

permissions:
  contents: read

env:
  ADMIN_EMAILS: dac-product-reviewer@qa.invalid
  CANDIDATE_BASE_SHA: 79ca382c3bdc325dfc5a28e2cbbafc1b95640386
  CANDIDATE_HEAD_SHA: 5faef28f76ea20097af18a3d5dab6d1c8dfb116c
  CANDIDATE_TREE_SHA: 46783b7e9348ae2fe5a5ca99450b4d30f5bcbef8
  CONTROLLER_BRANCH: ops/pr689-isolated-qa-preview-uat-20260814
  EXPECTED_QA_POOLER_HOST: aws-0-us-west-1.pooler.supabase.com
  EXPECTED_QA_REF: hvmxfjjbdcgjjudmthdz
  FORBIDDEN_PROD_REF: jnpoxvalyjtdghnperyu
  NEXT_PUBLIC_SITE_URL: https://www.moraltrade.org
  SITE_URL: https://www.moraltrade.org
  VERCEL: "1"
  VERCEL_CLI_VERSION: 50.38.1
  VERCEL_LOG_CLI_VERSION: 58.9.5
  VERCEL_ENV: preview
  VERCEL_ORG_ID: team_ySu6sF3Uho1E1GnJtCQPVEuJ
  VERCEL_PROJECT_ID: prj_Em3j7Uj7RatX2R1ZYhla3XSHRde7
  CONDITIONAL_PAYMENTS_MODE: disabled
  TRADE_DONATION_POOL_ENABLED: "false"
  TRADE_DONATION_POOL_MODE: disabled
  DIRECT_DONATION_UPGRADES_ENABLED: "false"
  DIRECT_DONATION_UPGRADE_MODE: disabled
  MPGF_REAL_MONEY_ENABLED: "false"
  MPGF_REAL_MONEY_ACCEPTANCE_ENABLED: "false"
  MPGF_TEST_PAYMENT_ENABLED: "false"
  EVERY_ORG_PLEDGE_DONATIONS_ENABLED: "false"
  PGSSLMODE: require

jobs:
  owner-uat:
    name: Exact candidate protected Preview, owner UAT, logs, and zero residue
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Check out the one-use controller only
        uses: actions/checkout@v4
        with:
          path: controller
          fetch-depth: 0

      - name: Check out the exact PR 689 application candidate
        uses: actions/checkout@v4
        with:
          path: app
          fetch-depth: 0
          ref: ${{ env.CANDIDATE_HEAD_SHA }}

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Revalidate exact GitHub and Git identity before any external mutation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$CONTROLLER_BRANCH"
          test "$(git -C app rev-parse HEAD)" = "$CANDIDATE_HEAD_SHA"
          test "$(git -C app rev-parse HEAD^{tree})" = "$CANDIDATE_TREE_SHA"
          test "$(git -C app rev-parse HEAD^1)" = "$CANDIDATE_BASE_SHA"
          test "$(git -C app rev-parse origin/main)" = "$CANDIDATE_BASE_SHA"
          test "$(git -C app status --porcelain)" = ""

          gh api repos/ghuser29384/Website2/pulls/689 > "$RUNNER_TEMP/pr689.json"
          gh api repos/ghuser29384/Website2/pulls/640 > "$RUNNER_TEMP/pr640.json"
          gh api repos/ghuser29384/Website2/issues/697 > "$RUNNER_TEMP/issue697.json"
          gh api repos/ghuser29384/Website2/issues/702 > "$RUNNER_TEMP/issue702.json"
          jq -e --arg head "$CANDIDATE_HEAD_SHA" '
            .state == "open" and .draft == true and .merged == false and .head.sha == $head
          ' "$RUNNER_TEMP/pr689.json" > /dev/null
          jq -e '.state == "open" and .draft == true and .merged == false' "$RUNNER_TEMP/pr640.json" > /dev/null
          jq -e '.state == "open"' "$RUNNER_TEMP/issue697.json" > /dev/null
          jq -e '.state == "open"' "$RUNNER_TEMP/issue702.json" > /dev/null

          mkdir -p evidence
          jq -n \
            --arg head "$CANDIDATE_HEAD_SHA" \
            --arg tree "$CANDIDATE_TREE_SHA" \
            --arg base "$CANDIDATE_BASE_SHA" \
            '{pr689:{open:true,draft:true,merged:false,head:$head,tree:$tree,base:$base},pr640:{open:true,draft:true,merged:false},issues:{"697":"open","702":"open"}}' \
            > evidence/exact-state.json

      - name: Install exact application dependencies and browser/database clients
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix app ci
          sudo apt-get update -qq
          sudo apt-get install --yes postgresql-client zip unzip > /dev/null
          cd app
          npx playwright install --with-deps chromium

      - name: Prove the exact QA database and API credentials before mutation
        shell: bash
        env:
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.QA_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: https://hvmxfjjbdcgjjudmthdz.supabase.co
          QA_SUPABASE_DB_URL: ${{ secrets.QA_SUPABASE_DB_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.QA_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          test -n "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY"
          test -n "$QA_SUPABASE_DB_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          python3 - <<'PY'
          import os
          from urllib.parse import parse_qs, urlparse

          value = os.environ["QA_SUPABASE_DB_URL"]
          if os.environ["FORBIDDEN_PROD_REF"] in value:
              raise SystemExit("Production project reference is forbidden.")
          parsed = urlparse(value)
          valid = (
              parsed.scheme in {"postgres", "postgresql"}
              and os.environ["EXPECTED_QA_REF"] in (parsed.username or "")
              and parsed.hostname == os.environ["EXPECTED_QA_POOLER_HOST"]
              and parsed.port == 5432
              and parsed.path == "/postgres"
              and parse_qs(parsed.query).get("sslmode", ["require"]) == ["require"]
              and bool(parsed.password)
          )
          if not valid:
              raise SystemExit("Refusing a database URL outside the exact TLS-only QA target.")
          PY

          sentinel_contract="$(psql "$QA_SUPABASE_DB_URL" --no-psqlrc -Atqc "
            select coalesce(
              count(*) = 1
              and bool_and(singleton)
              and bool_and(environment = 'qa')
              and bool_and(project_ref = 'hvmxfjjbdcgjjudmthdz')
              and bool_and(sentinel_id is not null)
              and bool_and(sentinel_sha256 ~ '^[a-f0-9]{64}$')
              and bool_and(provisioned_out_of_band),
              false
            )::text
            from moraltrade_qa.environment_identity
            where singleton;")"
          # The Supabase transaction pooler terminates the runner's TLS session;
          # pg_stat_ssl therefore describes the pooler-to-Postgres leg. Prove the
          # client leg from libpq's own connection metadata instead. PGSSLMODE is
          # also fixed to require at job scope, so psql fails closed without TLS.
          tls_description="$(psql "$QA_SUPABASE_DB_URL" --no-psqlrc -X -c '\conninfo' 2>&1)"
          if [[ "$tls_description" == *"SSL connection"* ]]; then
            tls_active=true
          else
            tls_active=false
          fi
          unset tls_description
          printf 'qa_project_ref=%s\nsentinel_contract=%s\ntls=%s\n' \
            "$EXPECTED_QA_REF" "$sentinel_contract" "$tls_active" \
            > evidence/qa-sentinel.txt
          test "$sentinel_contract" = "true"
          test "$tls_active" = "true"

          cd app
          node --input-type=module <<'NODE'
          import { createClient } from "@supabase/supabase-js";
          const qaRef = process.env.EXPECTED_QA_REF;
          const prodRef = process.env.FORBIDDEN_PROD_REF;
          const url = process.env.NEXT_PUBLIC_SUPABASE_URL;
          if (!url.includes(qaRef) || url.includes(prodRef)) throw new Error("Public QA URL guard failed.");
          const settings = await fetch(`${url}/auth/v1/settings`, {
            headers: { apikey: process.env.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY },
          });
          if (!settings.ok) throw new Error("QA publishable-key contract failed.");
          const service = createClient(url, process.env.SUPABASE_SERVICE_ROLE_KEY, {
            auth: { autoRefreshToken: false, detectSessionInUrl: false, persistSession: false },
          });
          const result = await service.auth.admin.listUsers({ page: 1, perPage: 1 });
          if (result.error) throw new Error("QA service-role contract failed.");
          console.log("qa_api_credential_contracts=passed");
          NODE

      - name: Audit canonical Vercel project and applicable Preview environment names
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          node --input-type=module <<'NODE'
          import { writeFile } from "node:fs/promises";
          const token = process.env.VERCEL_TOKEN;
          const team = process.env.VERCEL_ORG_ID;
          const projectId = process.env.VERCEL_PROJECT_ID;
          const headers = { Authorization: `Bearer ${token}` };
          const projectResponse = await fetch(`https://api.vercel.com/v9/projects/${projectId}?teamId=${team}`, { headers });
          if (!projectResponse.ok) throw new Error("Canonical Vercel project lookup failed.");
          const project = await projectResponse.json();
          if (project.id !== projectId || project.accountId !== team) throw new Error("Vercel project/team identity drifted.");
          const envResponse = await fetch(`https://api.vercel.com/v9/projects/${projectId}/env?teamId=${team}`, { headers });
          if (!envResponse.ok) throw new Error("Vercel Preview environment audit failed.");
          const environment = await envResponse.json();
          const previewKeys = (environment.envs ?? [])
            .filter((entry) => !entry.target || entry.target.includes("preview"))
            .map((entry) => String(entry.key));
          const allowedModes = new Set([
            "CONDITIONAL_PAYMENTS_MODE",
            "TRADE_DONATION_POOL_ENABLED",
            "TRADE_DONATION_POOL_MODE",
            "DIRECT_DONATION_UPGRADES_ENABLED",
            "DIRECT_DONATION_UPGRADE_MODE",
            "MPGF_REAL_MONEY_ENABLED",
            "MPGF_REAL_MONEY_ACCEPTANCE_ENABLED",
            "MPGF_TEST_PAYMENT_ENABLED",
            "EVERY_ORG_PLEDGE_DONATIONS_ENABLED",
          ]);
          const providerCredential = /(STRIPE|EVERY_?ORG|PAYMENT|CUSTODY|SETTLEMENT|RESERVE|PAYOUT|PAYPAL|BRAINTREE|ADYEN|SQUARE).*(SECRET|KEY|TOKEN|ACCOUNT|CREDENTIAL|URL|ID)$/i;
          const forbidden = previewKeys.filter((key) => providerCredential.test(key) && !allowedModes.has(key));
          const deploymentBlankOverrides = new Set([
            "STRIPE_PLATFORM_ACCOUNT_ID",
            "STRIPE_SECRET_KEY",
            "STRIPE_WEBHOOK_SECRET",
          ]);
          const unexpectedProviderKeys = forbidden.filter((key) => !deploymentBlankOverrides.has(key));
          const bypass = Object.entries(project.protectionBypass ?? {}).find(([, value]) => value?.scope === "automation-bypass");
          if (!bypass) throw new Error("Existing protected-automation boundary is unavailable.");
          await writeFile("evidence/vercel-project-environment-audit.json", `${JSON.stringify({
            projectId,
            teamId: team,
            previewEnvironmentKeyCount: previewKeys.length,
            providerCredentialKeysConfiguredInProject: forbidden.sort(),
            providerCredentialKeysBlankedPerDeployment: [...deploymentBlankOverrides].sort(),
            unexpectedProviderCredentialKeys: unexpectedProviderKeys.sort(),
            paymentModesForcedDisabledByController: [...allowedModes].sort(),
            existingAutomationBypassAvailable: true,
            secretValuesRetained: false,
          }, null, 2)}\n`);
          if (unexpectedProviderKeys.length) throw new Error("Applicable Preview environment contains an unhandled payment/provider credential.");
          NODE

      - name: Revalidate the forbidden original deployment without authentication
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { writeFile } from "node:fs/promises";
          const response = await fetch(`https://api.vercel.com/v13/deployments/dpl_35z42KM2AJRdJZStHtHaJ4JXwxea?teamId=${process.env.VERCEL_ORG_ID}`, {
            headers: { Authorization: `Bearer ${process.env.VERCEL_TOKEN}` },
          });
          if (!response.ok) throw new Error("Original deployment lookup failed.");
          const data = await response.json();
          const aliases = data.alias ?? data.aliases ?? [];
          if (data.id !== "dpl_35z42KM2AJRdJZStHtHaJ4JXwxea" || data.target !== null || aliases.length !== 0) {
            throw new Error("Original deployment Preview boundary drifted.");
          }
          await writeFile("evidence/original-deployment-read-only-boundary.json", `${JSON.stringify({
            id: data.id,
            target: data.target,
            aliases,
            authenticatedOrMutatingUatPermitted: false,
          }, null, 2)}\n`);
          NODE

      - name: Build the exact candidate with only isolated-QA and disabled-payment configuration
        shell: bash
        env:
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.QA_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: https://hvmxfjjbdcgjjudmthdz.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.QA_SUPABASE_SERVICE_ROLE_KEY }}
          VERCEL_GIT_COMMIT_REF: integration/mpgf-dac-lifecycle-current-main-20260814
          VERCEL_GIT_COMMIT_SHA: ${{ env.CANDIDATE_HEAD_SHA }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        working-directory: app
        run: |
          set -euo pipefail
          mkdir -p .vercel
          node --input-type=module <<'NODE'
          import { writeFile } from "node:fs/promises";
          const response = await fetch(`https://api.vercel.com/v9/projects/${process.env.VERCEL_PROJECT_ID}?teamId=${process.env.VERCEL_ORG_ID}`, {
            headers: { Authorization: `Bearer ${process.env.VERCEL_TOKEN}` },
          });
          if (!response.ok) throw new Error("Canonical Vercel project settings lookup failed.");
          const project = await response.json();
          if (project.id !== process.env.VERCEL_PROJECT_ID || project.accountId !== process.env.VERCEL_ORG_ID) {
            throw new Error("Canonical Vercel project settings identity drifted.");
          }
          const settings = {
            createdAt: project.createdAt,
            framework: project.framework,
            devCommand: project.devCommand,
            installCommand: project.installCommand,
            buildCommand: project.buildCommand,
            outputDirectory: project.outputDirectory,
            rootDirectory: project.rootDirectory,
            directoryListing: project.directoryListing,
            nodeVersion: project.nodeVersion,
          };
          await writeFile(".vercel/project.json", `${JSON.stringify({
            orgId: process.env.VERCEL_ORG_ID,
            projectId: process.env.VERCEL_PROJECT_ID,
            projectName: project.name,
            settings,
          }, null, 2)}\n`);
          const providerCredential = /(STRIPE|EVERY_?ORG|PAYMENT|CUSTODY|SETTLEMENT|RESERVE|PAYOUT|PAYPAL|BRAINTREE|ADYEN|SQUARE).*(SECRET|KEY|TOKEN|ACCOUNT|CREDENTIAL|URL|ID)$/i;
          const inheritedProviderKeys = Object.keys(process.env).filter((key) => providerCredential.test(key));
          if (inheritedProviderKeys.length) throw new Error("GitHub build process unexpectedly received a payment/provider credential.");
          NODE
          test -z "$(find .vercel -maxdepth 1 -type f -name '.env*' -print -quit)"
          rm -rf .next .vercel/output
          npx --yes "vercel@$VERCEL_CLI_VERSION" build --yes --token="$VERCEL_TOKEN" \
            | tee ../evidence/vercel-build.log
          STATIC_SOURCE_DIR=public \
          STATIC_BUILD_DIR=.vercel/output/static \
          STATIC_EVIDENCE_DIR=../evidence \
          STATIC_CRITICAL_ASSET=moral-trade-live-create-router.js \
            node scripts/vercel-static-artifact-integrity.mjs \
            | tee ../evidence/static-artifact-integrity.log
          test "$(git rev-parse HEAD)" = "$CANDIDATE_HEAD_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$CANDIDATE_TREE_SHA"

      - name: Deploy the prebuilt candidate once as an unaliased Preview
        id: deploy
        shell: bash
        env:
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.QA_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.QA_SUPABASE_SERVICE_ROLE_KEY }}
          VERCEL_GIT_COMMIT_REF: integration/mpgf-dac-lifecycle-current-main-20260814
          VERCEL_GIT_COMMIT_SHA: ${{ env.CANDIDATE_HEAD_SHA }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        working-directory: app
        run: |
          set -euo pipefail
          deployment_url="$(npx --yes "vercel@$VERCEL_CLI_VERSION" deploy \
            --prebuilt \
            --token="$VERCEL_TOKEN" \
            --meta "githubCommitSha=$CANDIDATE_HEAD_SHA" \
            --meta "githubCommitRef=integration/mpgf-dac-lifecycle-current-main-20260814" \
            --env "NEXT_PUBLIC_SUPABASE_URL=https://hvmxfjjbdcgjjudmthdz.supabase.co" \
            --env "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" \
            --env "SUPABASE_SERVICE_ROLE_KEY=$SUPABASE_SERVICE_ROLE_KEY" \
            --env "ADMIN_EMAILS=$ADMIN_EMAILS" \
            --env "CONDITIONAL_PAYMENTS_MODE=disabled" \
            --env "TRADE_DONATION_POOL_ENABLED=false" \
            --env "TRADE_DONATION_POOL_MODE=disabled" \
            --env "DIRECT_DONATION_UPGRADES_ENABLED=false" \
            --env "DIRECT_DONATION_UPGRADE_MODE=disabled" \
            --env "MPGF_REAL_MONEY_ENABLED=false" \
            --env "MPGF_REAL_MONEY_ACCEPTANCE_ENABLED=false" \
            --env "MPGF_TEST_PAYMENT_ENABLED=false" \
            --env "EVERY_ORG_PLEDGE_DONATIONS_ENABLED=false" \
            --build-env "NEXT_PUBLIC_SUPABASE_URL=https://hvmxfjjbdcgjjudmthdz.supabase.co" \
            --build-env "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" \
            --build-env "SUPABASE_SERVICE_ROLE_KEY=$SUPABASE_SERVICE_ROLE_KEY" \
            --build-env "ADMIN_EMAILS=$ADMIN_EMAILS" \
            --build-env "CONDITIONAL_PAYMENTS_MODE=disabled" \
            --build-env "TRADE_DONATION_POOL_ENABLED=false" \
            --build-env "TRADE_DONATION_POOL_MODE=disabled" \
            --build-env "DIRECT_DONATION_UPGRADES_ENABLED=false" \
            --build-env "DIRECT_DONATION_UPGRADE_MODE=disabled" \
            --build-env "MPGF_REAL_MONEY_ENABLED=false" \
            --build-env "MPGF_REAL_MONEY_ACCEPTANCE_ENABLED=false" \
            --build-env "MPGF_TEST_PAYMENT_ENABLED=false" \
            --build-env "EVERY_ORG_PLEDGE_DONATIONS_ENABLED=false" \
            --env "STRIPE_PLATFORM_ACCOUNT_ID=" \
            --env "STRIPE_SECRET_KEY=" \
            --env "STRIPE_WEBHOOK_SECRET=" \
            --build-env "STRIPE_PLATFORM_ACCOUNT_ID=" \
            --build-env "STRIPE_SECRET_KEY=" \
            --build-env "STRIPE_WEBHOOK_SECRET=")"
          deployment_url="$(printf '%s\n' "$deployment_url" | tr -d '\r' | tail -n 1)"
          [[ "$deployment_url" =~ ^https://[A-Za-z0-9.-]+$ ]]
          printf '%s\n' "$deployment_url" > ../evidence/deployment-url.txt
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Prove new deployment metadata, protection, and QA service binding before mutation
        id: deployment
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
          MPGF_DAC_PRODUCT_BASE_URL: ${{ steps.deploy.outputs.deployment_url }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.QA_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: https://hvmxfjjbdcgjjudmthdz.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.QA_SUPABASE_SERVICE_ROLE_KEY }}
          UAT702_EVIDENCE_DIR: ../evidence
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          deployment_id="$(node --input-type=module <<'NODE'
          const hostname = new URL(process.env.DEPLOYMENT_URL).hostname;
          const response = await fetch(`https://api.vercel.com/v13/deployments/${encodeURIComponent(hostname)}?teamId=${process.env.VERCEL_ORG_ID}`, {
            headers: { Authorization: `Bearer ${process.env.VERCEL_TOKEN}` },
          });
          if (!response.ok) throw new Error("Deployment lookup failed.");
          const data = await response.json();
          const deploymentId = data.id ?? data.uid;
          if (!deploymentId || `https://${data.url}` !== process.env.DEPLOYMENT_URL) {
            throw new Error("Exact deployment ID/URL was not found.");
          }
          process.stdout.write(deploymentId);
          NODE
          )"
          [[ "$deployment_id" =~ ^dpl_[A-Za-z0-9]+$ ]]
          echo "deployment_id=$deployment_id" >> "$GITHUB_OUTPUT"

          node --input-type=module - "$deployment_id" <<'NODE'
          import { writeFile } from "node:fs/promises";
          const deploymentId = process.argv[2];
          const response = await fetch(`https://api.vercel.com/v13/deployments/${deploymentId}?teamId=${process.env.VERCEL_ORG_ID}`, {
            headers: { Authorization: `Bearer ${process.env.VERCEL_TOKEN}` },
          });
          if (!response.ok) throw new Error("Exact deployment metadata lookup failed.");
          const data = await response.json();
          const aliases = data.alias ?? data.aliases ?? [];
          const sha = data.meta?.githubCommitSha ?? data.gitSource?.sha ?? "";
          if (data.id !== deploymentId || data.projectId !== process.env.VERCEL_PROJECT_ID) throw new Error("Wrong Vercel deployment/project.");
          if (data.readyState !== "READY" || data.target !== null || aliases.length !== 0) throw new Error("Deployment is not READY, Preview-only, and unaliased.");
          if (sha !== process.env.CANDIDATE_HEAD_SHA) throw new Error("Deployment commit metadata does not match the candidate.");
          if (aliases.some((value) => /(^|\.)moraltrade\.org$/i.test(value))) throw new Error("Production alias is forbidden.");
          const environmentResponse = await fetch(`https://api.vercel.com/v3/env/pull/${deploymentId}?teamId=${process.env.VERCEL_ORG_ID}&source=uat702`, {
            headers: { Authorization: `Bearer ${process.env.VERCEL_TOKEN}` },
          });
          if (!environmentResponse.ok) throw new Error("Deployment-scoped environment proof lookup failed.");
          const selectedEnvironment = await environmentResponse.json();
          const runtimeEnvironment = selectedEnvironment.env ?? {};
          const buildEnvironment = selectedEnvironment.buildEnv ?? {};
          const providerCredential = /(STRIPE|EVERY_?ORG|PAYMENT|CUSTODY|SETTLEMENT|RESERVE|PAYOUT|PAYPAL|BRAINTREE|ADYEN|SQUARE).*(SECRET|KEY|TOKEN|ACCOUNT|CREDENTIAL|URL|ID)$/i;
          const nonemptyProviderKeys = [...new Set([
            ...Object.entries(runtimeEnvironment),
            ...Object.entries(buildEnvironment),
          ].filter(([key, value]) => providerCredential.test(key) && value !== "" && value !== null && value !== undefined).map(([key]) => key))].sort();
          const expectedModes = {
            CONDITIONAL_PAYMENTS_MODE: "disabled",
            TRADE_DONATION_POOL_ENABLED: "false",
            TRADE_DONATION_POOL_MODE: "disabled",
            DIRECT_DONATION_UPGRADES_ENABLED: "false",
            DIRECT_DONATION_UPGRADE_MODE: "disabled",
            MPGF_REAL_MONEY_ENABLED: "false",
            MPGF_REAL_MONEY_ACCEPTANCE_ENABLED: "false",
            MPGF_TEST_PAYMENT_ENABLED: "false",
            EVERY_ORG_PLEDGE_DONATIONS_ENABLED: "false",
          };
          const qaUrl = `https://${process.env.EXPECTED_QA_REF}.supabase.co`;
          const qaRuntimeBound = runtimeEnvironment.NEXT_PUBLIC_SUPABASE_URL === qaUrl
            && runtimeEnvironment.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY === process.env.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
            && runtimeEnvironment.SUPABASE_SERVICE_ROLE_KEY === process.env.SUPABASE_SERVICE_ROLE_KEY;
          const qaBuildRecordBound = buildEnvironment.NEXT_PUBLIC_SUPABASE_URL === qaUrl
            && buildEnvironment.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY === process.env.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
            && buildEnvironment.SUPABASE_SERVICE_ROLE_KEY === process.env.SUPABASE_SERVICE_ROLE_KEY;
          const paymentModesDisabled = Object.entries(expectedModes).every(([key, value]) => runtimeEnvironment[key] === value && buildEnvironment[key] === value);
          const productionProjectExcluded = !JSON.stringify(selectedEnvironment).includes(process.env.FORBIDDEN_PROD_REF);
          await writeFile("evidence/deployment-runtime-environment-proof.json", `${JSON.stringify({
            deploymentId,
            qaRuntimeBound,
            qaBuildRecordBound,
            productionProjectExcluded,
            paymentModesDisabled,
            nonemptyProviderCredentialKeys: nonemptyProviderKeys,
            providerCredentialValuesRetained: false,
          }, null, 2)}\n`);
          if (!qaRuntimeBound || !qaBuildRecordBound || !productionProjectExcluded || !paymentModesDisabled || nonemptyProviderKeys.length) {
            throw new Error("Deployment-scoped QA/payment environment proof failed.");
          }
          await writeFile("evidence/deployment-metadata.json", `${JSON.stringify({
            id: data.id,
            url: process.env.DEPLOYMENT_URL,
            projectId: data.projectId,
            readyState: data.readyState,
            target: data.target,
            aliases,
            candidateSha: sha,
            candidateTree: process.env.CANDIDATE_TREE_SHA,
            qaProjectRef: process.env.EXPECTED_QA_REF,
            productionProjectExcluded: true,
            paymentProviderCredentialsPassed: false,
          }, null, 2)}\n`);
          NODE

          unauth_status="$(curl -sS -o /dev/null -w '%{http_code}' --max-redirs 0 "$DEPLOYMENT_URL/")"
          case "$unauth_status" in
            302|303|307|308|401|403) ;;
            *) echo "Protected Preview unexpectedly returned HTTP $unauth_status without authorization." >&2; exit 1 ;;
          esac

          bypass="$(node --input-type=module <<'NODE'
          const response = await fetch(`https://api.vercel.com/v9/projects/${process.env.VERCEL_PROJECT_ID}?teamId=${process.env.VERCEL_ORG_ID}`, {
            headers: { Authorization: `Bearer ${process.env.VERCEL_TOKEN}` },
          });
          if (!response.ok) throw new Error("Automation boundary lookup failed.");
          const project = await response.json();
          const entry = Object.entries(project.protectionBypass ?? {}).find(([, value]) => value?.scope === "automation-bypass");
          if (!entry) throw new Error("Automation boundary is absent.");
          process.stdout.write(entry[0]);
          NODE
          )"
          test -n "$bypass"
          echo "::add-mask::$bypass"
          export VERCEL_AUTOMATION_BYPASS_SECRET="$bypass"
          cd app
          node ../controller/ops/pr689-uat702/preflight.mjs

      - name: Apply only the reviewed candidate migrations and run rollback regressions on isolated QA
        shell: bash
        env:
          QA_SUPABASE_DB_URL: ${{ secrets.QA_SUPABASE_DB_URL }}
        working-directory: app
        run: |
          set -euo pipefail
          migrations=(
            supabase/migrations/20260806110000_mpgf_pool_review_freeze.sql
            supabase/migrations/20260806143000_mpgf_pool_publication_materialization.sql
            supabase/migrations/20260806173000_mpgf_dac_pledge_intent_ledger.sql
            supabase/migrations/20260807050000_mpgf_dac_success_lapse.sql
            supabase/migrations/20260807100000_mpgf_dac_public_terms_api.sql
            supabase/migrations/20260812073000_mpgf_dac_terminal_event_constraint_reconciliation.sql
            supabase/migrations/20260812074500_mpgf_dac_terminal_schema_reconciliation.sql
          )
          tests=(
            supabase/tests/mpgf_pool_review_freeze.sql
            supabase/tests/mpgf_pool_publication_materialization.sql
            supabase/tests/mpgf_dac_pledge_intent_ledger.sql
            supabase/tests/mpgf_dac_success_lapse.sql
            supabase/tests/mpgf_dac_public_terms_api.sql
          )
          sha256sum "${migrations[@]}" "${tests[@]}" > ../evidence/reviewed-database-sources.sha256
          for migration in "${migrations[@]}"; do
            psql "$QA_SUPABASE_DB_URL" --no-psqlrc --set ON_ERROR_STOP=1 --file "$migration" > "$RUNNER_TEMP/$(basename "$migration").log" 2>&1
          done
          for regression in "${tests[@]}"; do
            psql "$QA_SUPABASE_DB_URL" --no-psqlrc --set ON_ERROR_STOP=1 --file "$regression" > "$RUNNER_TEMP/$(basename "$regression").log" 2>&1
          done
          printf 'reviewed_migrations=7\nrollback_regressions=5\nresult=passed\n' > ../evidence/database-contract-summary.txt

      - name: Execute complete protected-Preview UAT with unconditional cleanup
        id: uat
        shell: bash
        env:
          MPGF_DAC_PRODUCT_BASE_URL: ${{ steps.deploy.outputs.deployment_url }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.QA_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: https://hvmxfjjbdcgjjudmthdz.supabase.co
          QA_SUPABASE_DB_URL: ${{ secrets.QA_SUPABASE_DB_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.QA_SUPABASE_SERVICE_ROLE_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        working-directory: app
        run: |
          set -Eeuo pipefail
          mkdir -p ../evidence test-results
          uat_start="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "uat_start=$uat_start" >> "$GITHUB_OUTPUT"
          fixtures_started=0

          finalize() {
            original_status="$?"
            trap - EXIT
            set +e
            cleanup_status=0
            if [[ "$fixtures_started" = "1" ]]; then
              psql "$QA_SUPABASE_DB_URL" --no-psqlrc -At --set ON_ERROR_STOP=1 \
                --file ../controller/ops/pr689-uat702/payment-proof-before-cleanup.sql \
                > ../evidence/payment-before-cleanup.txt 2> "$RUNNER_TEMP/payment-proof.err"
              payment_status="$?"
              grep -Fxq 'payment_refs_before_cleanup=0' ../evidence/payment-before-cleanup.txt
              payment_status=$((payment_status + $?))
              psql "$QA_SUPABASE_DB_URL" --no-psqlrc --set ON_ERROR_STOP=1 \
                --file ../controller/ops/pr689-uat702/cleanup-dynamic.sql \
                > "$RUNNER_TEMP/dynamic-cleanup.log" 2>&1
              cleanup_status=$((cleanup_status + $?))
              psql "$QA_SUPABASE_DB_URL" --no-psqlrc --set ON_ERROR_STOP=1 \
                --file supabase/tests/mpgf_dac_product_browser_cleanup.sql \
                > "$RUNNER_TEMP/fixed-cleanup.log" 2>&1
              cleanup_status=$((cleanup_status + $?))
            else
              payment_status=0
              printf 'payment_refs_before_cleanup=0\n' > ../evidence/payment-before-cleanup.txt
            fi
            psql "$QA_SUPABASE_DB_URL" --no-psqlrc -At --set ON_ERROR_STOP=1 \
              --file ../controller/ops/pr689-uat702/runtime-residue-proof.sql \
              > ../evidence/zero-residue.txt 2> "$RUNNER_TEMP/residue-proof.err"
            residue_status="$?"
            grep -Fxq 'fixture_residue=0' ../evidence/zero-residue.txt
            residue_status=$((residue_status + $?))
            grep -Fxq 'payment_refs=0' ../evidence/zero-residue.txt
            residue_status=$((residue_status + $?))

            redaction_status=0
            if find test-results -type f -name '*.zip' -print -quit | grep -q .; then
              node uat702/redact-traces.mjs test-results ../evidence \
                > ../evidence/trace-redaction.txt 2> "$RUNNER_TEMP/trace-redaction.err"
              redaction_status="$?"
            else
              redaction_status=1
              printf 'trace_count=0\ntrace_redaction=failed\n' > ../evidence/trace-redaction.txt
            fi

            uat_end="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "uat_end=$uat_end" >> "$GITHUB_OUTPUT"
            if [[ "$original_status" = "0" && "$payment_status" = "0" && "$cleanup_status" = "0" && "$residue_status" = "0" && "$redaction_status" = "0" ]]; then
              result=passed
              final_status=0
            else
              result=failed
              final_status=1
            fi
            jq -n \
              --arg result "$result" \
              --arg start "$uat_start" \
              --arg end "$uat_end" \
              --argjson testStatus "$original_status" \
              --argjson cleanupStatus "$cleanup_status" \
              --argjson residueStatus "$residue_status" \
              --argjson redactionStatus "$redaction_status" \
              '{result:$result,window:{startUtc:$start,endUtc:$end},testStatus:$testStatus,cleanupStatus:$cleanupStatus,residueStatus:$residueStatus,redactionStatus:$redactionStatus}' \
              > ../evidence/machine-result.json
            exit "$final_status"
          }
          trap finalize EXIT

          cp -R ../controller/ops/pr689-uat702 uat702
          node uat702/prepare-base-spec.mjs

          psql "$QA_SUPABASE_DB_URL" --no-psqlrc --set ON_ERROR_STOP=1 \
            --file uat702/cleanup-dynamic.sql > "$RUNNER_TEMP/pre-dynamic-cleanup.log" 2>&1
          psql "$QA_SUPABASE_DB_URL" --no-psqlrc --set ON_ERROR_STOP=1 \
            --file supabase/tests/mpgf_dac_product_browser_cleanup.sql > "$RUNNER_TEMP/pre-fixed-cleanup.log" 2>&1

          qa_password="$(openssl rand -base64 48 | tr -d '\n')"
          echo "::add-mask::$qa_password"
          export MPGF_DAC_PRODUCT_QA_PASSWORD="$qa_password"
          fixtures_started=1
          psql "$QA_SUPABASE_DB_URL" --no-psqlrc --set ON_ERROR_STOP=1 \
            --file supabase/tests/mpgf_dac_product_browser_fixture.sql > "$RUNNER_TEMP/fixture.log" 2>&1

          bypass="$(node --input-type=module <<'NODE'
          const response = await fetch(`https://api.vercel.com/v9/projects/${process.env.VERCEL_PROJECT_ID}?teamId=${process.env.VERCEL_ORG_ID}`, {
            headers: { Authorization: `Bearer ${process.env.VERCEL_TOKEN}` },
          });
          if (!response.ok) throw new Error("Automation boundary lookup failed.");
          const project = await response.json();
          const entry = Object.entries(project.protectionBypass ?? {}).find(([, value]) => value?.scope === "automation-bypass");
          if (!entry) throw new Error("Automation boundary is absent.");
          process.stdout.write(entry[0]);
          NODE
          )"
          test -n "$bypass"
          echo "::add-mask::$bypass"
          export VERCEL_AUTOMATION_BYPASS_SECRET="$bypass"

          npx playwright test \
            uat702/base-product-lifecycle.spec.ts \
            uat702/owner-uat.spec.ts \
            --config uat702/playwright.config.ts \
            --reporter=line \
            2>&1 | tee ../evidence/playwright.log

      - name: Prove mobile and discover findings are inherited from exact base
        if: always()
        shell: bash
        working-directory: app
        run: |
          set -euo pipefail
          git diff --quiet "$CANDIDATE_BASE_SHA" "$CANDIDATE_HEAD_SHA" -- src/lib/site.ts
          git diff --quiet "$CANDIDATE_BASE_SHA" "$CANDIDATE_HEAD_SHA" -- src/components/layout/site-footer.tsx
          if git diff -U0 "$CANDIDATE_BASE_SHA" "$CANDIDATE_HEAD_SHA" -- src/app/globals.css \
            | grep -E '^[-+].*(mt-site-footer|mt-footer-|footer-grid|footer-meta|footer-links)' > /dev/null; then
            echo 'Candidate unexpectedly changes footer CSS.' >&2
            exit 1
          fi
          if git cat-file -e "$CANDIDATE_BASE_SHA:src/app/discover/page.tsx" 2>/dev/null; then exit 1; fi
          if git cat-file -e "$CANDIDATE_HEAD_SHA:src/app/discover/page.tsx" 2>/dev/null; then exit 1; fi
          jq -n '{
            baseSha:env.CANDIDATE_BASE_SHA,
            candidateSha:env.CANDIDATE_HEAD_SHA,
            primaryNavigationChanged:false,
            footerComponentChanged:false,
            footerCssSelectorsChanged:false,
            discoverPageAtBase:false,
            discoverPageAtCandidate:false,
            classification:"inherited_exact_base"
          }' > ../evidence/base-candidate-mobile-routing-differential.json

      - name: Inspect deployment-scoped runtime logs for the exact UAT window
        if: always() && steps.deployment.outputs.deployment_id != '' && steps.uat.outputs.uat_start != ''
        shell: bash
        env:
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.deployment_id }}
          UAT_END: ${{ steps.uat.outputs.uat_end }}
          UAT_START: ${{ steps.uat.outputs.uat_start }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        working-directory: app
        run: |
          set -euo pipefail
          test -n "$UAT_END"
          npx --yes "vercel@$VERCEL_LOG_CLI_VERSION" logs "$DEPLOYMENT_ID" \
            --since "$UAT_START" \
            --until "$UAT_END" \
            --limit 1000 \
            --json \
            --token "$VERCEL_TOKEN" \
            | node uat702/summarize-vercel-logs.mjs \
            > ../evidence/vercel-runtime-log-summary.json
          test "$(jq -r '.entries' ../evidence/vercel-runtime-log-summary.json)" -gt 0
          test "$(jq -r '.http5xx' ../evidence/vercel-runtime-log-summary.json)" = "0"
          test "$(jq -r '.paymentSignals' ../evidence/vercel-runtime-log-summary.json)" = "0"
          test "$(jq -r '.privateLeakSignals' ../evidence/vercel-runtime-log-summary.json)" = "0"

      - name: Build evidence manifest and rescan retained evidence
        if: always()
        shell: bash
        env:
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.QA_SUPABASE_PUBLISHABLE_KEY }}
          QA_SUPABASE_DB_URL: ${{ secrets.QA_SUPABASE_DB_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.QA_SUPABASE_SERVICE_ROLE_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p evidence app/test-results
          bypass="$(node --input-type=module <<'NODE'
          const response = await fetch(`https://api.vercel.com/v9/projects/${process.env.VERCEL_PROJECT_ID}?teamId=${process.env.VERCEL_ORG_ID}`, {
            headers: { Authorization: `Bearer ${process.env.VERCEL_TOKEN}` },
          });
          if (!response.ok) throw new Error("Final automation-boundary lookup failed.");
          const project = await response.json();
          const entry = Object.entries(project.protectionBypass ?? {}).find(([, value]) => value?.scope === "automation-bypass");
          if (!entry) throw new Error("Final automation boundary is absent.");
          process.stdout.write(entry[0]);
          NODE
          )"
          test -n "$bypass"
          echo "::add-mask::$bypass"
          export VERCEL_AUTOMATION_BYPASS_SECRET="$bypass"
          if find app/test-results -type f -name '*.zip' -print -quit | grep -q .; then
            node app/uat702/redact-traces.mjs app/test-results evidence > evidence/final-evidence-secret-scan.txt
          fi
          find evidence app/test-results -type f ! -path 'evidence/sha256-manifest.txt' -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            > evidence/sha256-manifest.txt
          git -C controller diff --check
          git -C app diff --check "$CANDIDATE_BASE_SHA" "$CANDIDATE_HEAD_SHA"

      - name: Upload redacted owner-UAT evidence
        id: artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr689-isolated-qa-owner-uat-${{ github.run_id }}-${{ env.CANDIDATE_HEAD_SHA }}
          path: |
            evidence
            app/test-results
          if-no-files-found: error
          retention-days: 30
