name: Profile Dashboard fixture stability
on:
  push:
    branches: [ops/profile-dashboard-integration-20260927]
    paths: [.github/workflows/profile-dashboard-fixture-stability-20260927.yml]
permissions:
  contents: write
  actions: read
concurrency:
  group: profile-dashboard-fixture-stability-20260927
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      BASE: 4db5ef744c8cebab1940f70ef6bab499a6a61860
      PRIOR_BASE: 2241422b6eec8c38a1fad4b3e3a9c9fb7c2bba49
      CANDIDATE: 31231dcd8d78cb7c7e4f16669c390bb44c48adc6
      PRIOR_TREE: 6afe1f6e85312a4fae65fc9af062354c48e65820
      BRANCH: fix/profile-dashboard-canonical-20260926
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3210
      SITE_URL: http://127.0.0.1:3210
      NEXT_TELEMETRY_DISABLED: '1'
      PLAYWRIGHT_HTML_OPEN: never
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2241422b6eec8c38a1fad4b3e3a9c9fb7c2bba49
          fetch-depth: 0
      - name: Integrate the exact existing unification patch with newly merged audit changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/profile-fixture-stability
          trap 'echo "Guard failed at line $LINENO"' ERR
          test "$GITHUB_REPOSITORY" = ghuser29384/Website2
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git rev-parse HEAD)" = "$PRIOR_BASE"
          main_now="$(git ls-remote origin refs/heads/main | cut -f1)"
          candidate_now="$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)"
          printf 'Observed main=%s\nObserved candidate=%s\n' "$main_now" "$candidate_now" | tee /tmp/profile-fixture-stability/refs.log
          test "$main_now" = "$BASE"
          test "$candidate_now" = "$CANDIDATE"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/10925215655" | jq -e '.digest == "sha256:4b1791a5b4fd0e112faa4696b0202d9d81f43d99f9a05d23f644f50e849fd3e7" and .workflow_run.id == 36298611757' >/dev/null
          gh run download 36298611757 --repo "$GITHUB_REPOSITORY" --name profile-unification-integrated-qa --dir /tmp/prior-profile-qa
          test "$(cat /tmp/prior-profile-qa/tree.txt)" = "$PRIOR_TREE"
          git apply --index /tmp/prior-profile-qa/integration.patch
          test "$(git write-tree)" = "$PRIOR_TREE"
          git diff --cached --name-only > /tmp/profile-fixture-stability/expected-paths.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          prior_head="$(printf 'Reconcile Profile account alias with current Priorities naming\n' | git commit-tree "$PRIOR_TREE" -p "$CANDIDATE" -p "$PRIOR_BASE")"
          git checkout --detach "$prior_head"
          git merge --no-ff --no-commit "$BASE"
          test -z "$(git diff --name-only --diff-filter=U)"
          git diff --cached --name-only "$BASE" > /tmp/profile-fixture-stability/actual-paths.txt
          diff -u /tmp/profile-fixture-stability/expected-paths.txt /tmp/profile-fixture-stability/actual-paths.txt
          test "$(wc -l < /tmp/profile-fixture-stability/actual-paths.txt)" = 17
          git diff --cached --check
          git diff --cached "$BASE" > /tmp/profile-fixture-stability/integration.patch
          git diff --cached --stat "$BASE" > /tmp/profile-fixture-stability/diff-stat.txt
          git commit -m 'Preserve latest audit changes in canonical Profile Dashboard integration'
          git rev-parse HEAD | tee /tmp/profile-fixture-stability/commit.txt
          git rev-parse HEAD^{tree} | tee /tmp/profile-fixture-stability/tree.txt
          printf 'Current-main audit changes retained by normal three-way merge. All gates rerun for the new tree. No assertions or timeouts weakened.\n' > /tmp/profile-fixture-stability/source-equivalence.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build the exact synthetic-account application
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54331
          NEXT_PUBLIC_SUPABASE_ANON_KEY: local-fixture-anon-key
        run: npm run build > /tmp/profile-fixture-stability/fixture-build.log 2>&1
      - run: npx playwright install --with-deps chromium
      - name: Repeat the entire unchanged authenticated fixture suite three times
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54331
          NEXT_PUBLIC_SUPABASE_ANON_KEY: local-fixture-anon-key
          DASHBOARD_SPARKS_FIXTURE: '1'
        run: |
          npx playwright test --config=playwright.release.config.ts tests/dashboard-sparks.spec.ts --repeat-each=3 --reporter=line > /tmp/profile-fixture-stability/fixture-browser.log 2>&1
          if [ -d test-results ]; then cp -R test-results /tmp/profile-fixture-stability/fixture-test-results; fi
      - name: Run complete repository tests, lint and types
        run: |
          node --import tsx --test src/lib/profile-dashboard-redirect.test.ts src/lib/profile-priorities-access.test.ts src/lib/dashboard-view.test.ts > /tmp/profile-fixture-stability/focused-tests.log 2>&1
          npm test > /tmp/profile-fixture-stability/tests.log 2>&1
          npm run lint -- --quiet > /tmp/profile-fixture-stability/lint.log 2>&1
          npx tsc --noEmit --pretty false > /tmp/profile-fixture-stability/types.log 2>&1
      - name: Clean credential-free production build
        run: |
          rm -rf .next
          npm run build > /tmp/profile-fixture-stability/build.log 2>&1
      - name: Run the complete unchanged release browser gate
        run: npm run test:e2e:release -- --reporter=line > /tmp/profile-fixture-stability/browser.log 2>&1
      - name: Publish the verified tree to the existing PR only
        run: |
          set -euo pipefail
          test "$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)" = "$CANDIDATE"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE"
          git diff --exit-code
          git push origin "HEAD:refs/heads/$BRANCH"
      - name: Retain all evidence including failures
        if: always()
        run: |
          mkdir -p /tmp/profile-fixture-stability
          if [ -d test-results ]; then cp -R test-results /tmp/profile-fixture-stability/; fi
          if [ -d /tmp/dashboard-sparks-evidence ]; then cp -R /tmp/dashboard-sparks-evidence /tmp/profile-fixture-stability/; fi
          shopt -s nullglob
          for log in /tmp/profile-fixture-stability/*.log; do echo "=== $log ==="; tail -25 "$log"; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: profile-unification-fixture-stability
          path: /tmp/profile-fixture-stability
          retention-days: 7
