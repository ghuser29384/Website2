name: Patch launch activation validation contract

on:
  push:
    branches:
      - launch/verify-and-harden-20260723
    paths:
      - .github/workflows/patch-launch-activation-contract.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out launch branch
        uses: actions/checkout@v4
        with:
          ref: launch/verify-and-harden-20260723
          fetch-depth: 0

      - name: Update validation to the current RPC response field
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('supabase/tests/core_launch_workflow.sql')
          source = path.read_text()
          old = "response->>'activated'"
          new = "response->>'active'"
          if source.count(old) != 3:
              raise SystemExit(f'Expected three activation response checks, found {source.count(old)}.')
          path.write_text(source.replace(old, new))
          PY
          git rm .github/workflows/patch-launch-activation-contract.yml

      - name: Commit validation contract update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/tests/core_launch_workflow.sql
          git diff --cached --check
          git commit -m "Align launch validation with agreement activation response"
          git push origin HEAD:launch/verify-and-harden-20260723
