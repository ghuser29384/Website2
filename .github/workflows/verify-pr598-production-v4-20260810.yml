name: Verify PR 598 production release v4

on:
  push:
    branches:
      - ops/verify-pr598-production-v4-20260810
    paths:
      - ".github/workflows/verify-pr598-production-v4-20260810.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: verify-pr598-production-v4-20260810
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      EXPECTED_MAIN_SHA: 0778577c98c7a86417057caeb939c01f77e22c89
      EXPECTED_DEPLOYMENT_ID: dpl_3zacHVuaHpbayAyQfY6hzLNEZaPZ
      RELEASE_RUN_ID: "31405775199"
      PROMOTION_RUN_ID: "31408123871"
      VERCEL_ORG_ID: team_ySu6sF3Uho1E1GnJtCQPVEuJ
      VERCEL_PROJECT_ID: prj_Em3j7Uj7RatX2R1ZYhla3XSHRde7
      CANONICAL_ORIGIN: https://www.moraltrade.org

    steps:
      - name: Check out the exact released source
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Guard immutable release, promotion, and canonical deployment
        env:
          GH_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_MAIN_SHA"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$EXPECTED_MAIN_SHA"

          for run_id in "$RELEASE_RUN_ID" "$PROMOTION_RUN_ID"; do
            run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id")"
            test "$(jq -r '.status' <<<"$run_json")" = "completed"
            test "$(jq -r '.conclusion' <<<"$run_json")" = "success"
          done

          curl --fail --silent --show-error \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v13/deployments/www.moraltrade.org?teamId=$VERCEL_ORG_ID" \
            > pr598-production-deployment.json
          jq -e --arg id "$EXPECTED_DEPLOYMENT_ID" '(.id // .uid) == $id' \
            pr598-production-deployment.json >/dev/null
          jq -e --arg project "$VERCEL_PROJECT_ID" '.project.id == $project' \
            pr598-production-deployment.json >/dev/null
          jq -e --arg sha "$EXPECTED_MAIN_SHA" '.meta.githubCommitSha == $sha' \
            pr598-production-deployment.json >/dev/null
          jq -e '.target == "production" and (.readyState // .state) == "READY"' \
            pr598-production-deployment.json >/dev/null

          curl --fail --silent --show-error \
            "$CANONICAL_ORIGIN/moral-trade-live-create-router.js" \
            --output pr598-live-create-router.js
          cmp --silent public/moral-trade-live-create-router.js pr598-live-create-router.js
          sha256sum \
            public/moral-trade-live-create-router.js \
            pr598-live-create-router.js \
            | tee pr598-production-asset-sha256.txt

          printf 'release_run=%s\npromotion_run=%s\ndeployment_id=%s\ndeployment_url=https://%s\ncommit=%s\n' \
            "$RELEASE_RUN_ID" \
            "$PROMOTION_RUN_ID" \
            "$(jq -r '.id // .uid' pr598-production-deployment.json)" \
            "$(jq -r '.url' pr598-production-deployment.json)" \
            "$EXPECTED_MAIN_SHA" \
            | tee pr598-production-release.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies and Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium

      - name: Create the focused canonical Commitments smoke contract
        shell: bash
        run: |
          cat > playwright.production-smoke.config.ts <<'TS'
          import { defineConfig } from "@playwright/test";

          export default defineConfig({
            testDir: "./tests",
            timeout: 60_000,
            expect: { timeout: 12_000 },
            fullyParallel: false,
            workers: 1,
            use: {
              baseURL: "https://www.moraltrade.org",
              storageState: {
                cookies: [
                  {
                    domain: "www.moraltrade.org",
                    expires: -1,
                    httpOnly: true,
                    name: "mt_walkthrough_seen",
                    path: "/",
                    sameSite: "Lax",
                    secure: true,
                    value: "1",
                  },
                ],
                origins: [],
              },
              trace: "retain-on-failure",
            },
          });
          TS

          cat > tests/pr598-production-commitments.spec.ts <<'TS'
          import { expect, test, type Page, type Request } from "@playwright/test";
          import { mkdir, writeFile } from "node:fs/promises";

          type ResponseFailure = { status: number; url: string };
          type RequestFailure = { method: string; url: string; errorText: string };

          function isExpectedDiscoverPrefetch(failure: ResponseFailure) {
            const url = new URL(failure.url);
            return (
              failure.status === 404 &&
              url.origin === "https://www.moraltrade.org" &&
              url.pathname === "/discover" &&
              url.searchParams.get("domain") === "offers" &&
              url.searchParams.get("view") === "list"
            );
          }

          function mapRequestFailure(request: Request): RequestFailure {
            return {
              method: request.method(),
              url: request.url(),
              errorText: request.failure()?.errorText ?? "failed",
            };
          }

          function isExpectedNavigationCancellation(failure: RequestFailure) {
            if (failure.errorText !== "net::ERR_ABORTED") return false;
            const url = new URL(failure.url);
            if (url.origin !== "https://www.moraltrade.org") return false;
            const isNextPrefetch = failure.method === "GET" && url.searchParams.has("_rsc");
            const isBestEffortAnalytics =
              failure.method === "POST" && url.pathname === "/api/funnel-events";
            return isNextPrefetch || isBestEffortAnalytics;
          }

          async function expectNoHorizontalOverflow(page: Page) {
            const dimensions = await page.evaluate(() => ({
              bodyWidth: document.body.scrollWidth,
              documentWidth: document.documentElement.scrollWidth,
              viewportWidth: window.innerWidth,
            }));
            expect(dimensions.bodyWidth).toBeLessThanOrEqual(dimensions.viewportWidth + 1);
            expect(dimensions.documentWidth).toBeLessThanOrEqual(dimensions.viewportWidth + 1);
          }

          test("canonical Commitments is truthful, responsive, and has no unexpected network failure", async ({ page }) => {
            const responseFailures: ResponseFailure[] = [];
            const requestFailures: RequestFailure[] = [];
            const pageErrors: string[] = [];
            const consoleErrors: string[] = [];

            page.on("response", (response) => {
              if (response.status() >= 400) {
                responseFailures.push({ status: response.status(), url: response.url() });
              }
            });
            page.on("requestfailed", (request) => requestFailures.push(mapRequestFailure(request)));
            page.on("pageerror", (error) => pageErrors.push(error.message));
            page.on("console", (message) => {
              if (message.type() === "error") consoleErrors.push(message.text());
            });

            for (const viewport of [
              { width: 1440, height: 900 },
              { width: 390, height: 844 },
              { width: 320, height: 568 },
            ]) {
              await page.setViewportSize(viewport);
              await page.goto("/commitments", { waitUntil: "domcontentloaded" });
              await expect(
                page.getByRole("heading", { name: "Additional resources you caused." }),
              ).toBeVisible();
              await expect(
                page.getByRole("navigation", { name: "Commitments sections" }),
              ).toBeVisible();
              await expect(
                page.getByRole("heading", { name: "Sign in to view your commitments." }),
              ).toBeVisible();
              await expect(page.getByRole("link", { name: "Sign in to continue" })).toHaveAttribute(
                "href",
                "/login?returnTo=/commitments",
              );
              await expectNoHorizontalOverflow(page);
            }

            for (const synthetic of [
              "$540",
              "$18,760",
              "Counteroffer received",
              "Salary-gap pool at 81%",
              "Factory-farming redirect",
            ]) {
              await expect(page.locator("body")).not.toContainText(synthetic);
            }

            const expectedPrefetches = responseFailures.filter(isExpectedDiscoverPrefetch);
            const unexpectedResponses = responseFailures.filter(
              (failure) => !isExpectedDiscoverPrefetch(failure),
            );
            const expectedCancellations = requestFailures.filter(isExpectedNavigationCancellation);
            const unexpectedRequestFailures = requestFailures.filter(
              (failure) => !isExpectedNavigationCancellation(failure),
            );
            const unexpectedConsoleErrors = consoleErrors.filter(
              (message) =>
                !(
                  expectedPrefetches.length > 0 &&
                  message.includes("Failed to load resource") &&
                  message.includes("404")
                ),
            );

            await mkdir("test-results", { recursive: true });
            await writeFile(
              "test-results/pr598-production-commitments-network.json",
              `${JSON.stringify(
                {
                  responseFailures,
                  requestFailures,
                  pageErrors,
                  consoleErrors,
                  expectedDiscoverPrefetch404Count: expectedPrefetches.length,
                  expectedNavigationCancellationCount: expectedCancellations.length,
                  unexpectedRequestFailures,
                },
                null,
                2,
              )}\n`,
            );
            await page.screenshot({
              path: "test-results/pr598-production-commitments-320x568.png",
              fullPage: true,
            });

            expect(expectedPrefetches.length).toBeGreaterThan(0);
            expect(expectedCancellations.length).toBeGreaterThan(0);
            expect(unexpectedResponses).toEqual([]);
            expect(unexpectedRequestFailures).toEqual([]);
            expect(unexpectedConsoleErrors).toEqual([]);
            expect(pageErrors).toEqual([]);
          });
          TS

      - name: Run the focused canonical Commitments smoke
        shell: bash
        env:
          PLAYWRIGHT_HTML_OPEN: never
        run: |
          set -euo pipefail
          npx playwright test \
            tests/pr598-production-commitments.spec.ts \
            --config=playwright.production-smoke.config.ts \
            --reporter=line \
            | tee pr598-production-commitments-smoke.log

      - name: Record canonical HTTP status inventory
        shell: bash
        run: |
          set -euo pipefail
          for path in \
            /moral-trade-live.html \
            /trades/new \
            /commitments \
            /discover \
            /verification; do
            code="$(curl --silent --show-error --location \
              --output /dev/null --write-out '%{http_code}' \
              "$CANONICAL_ORIGIN$path")"
            printf '%s %s\n' "$code" "$path"
            [[ "$code" =~ ^(200|302|303|307|308)$ ]]
          done | tee pr598-production-http-smoke.txt

      - name: Upload immutable focused production-smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr598-production-smoke-v4-${{ github.run_id }}
          path: |
            pr598-production-*.txt
            pr598-production-*.json
            pr598-production-*.log
            pr598-live-create-router.js
            test-results
            playwright-report
          if-no-files-found: warn
          retention-days: 30
