name: PR 552 production database credential presence probe

on:
  push:
    branches:
      - ops/pr552-service-key-probe-20260807
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr552-production-db-credential-probe
  cancel-in-progress: false

env:
  PROD_REF: jnpoxvalyjtdghnperyu
  QA_REF: hvmxfjjbdcgjjudmthdz

jobs:
  probe-repository-secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env: &candidate_secrets
      D01_SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      D02_PROD_SUPABASE_DB_URL: ${{ secrets.PROD_SUPABASE_DB_URL }}
      D03_PRODUCTION_SUPABASE_DB_URL: ${{ secrets.PRODUCTION_SUPABASE_DB_URL }}
      D04_MORALTRADE_SUPABASE_DB_URL: ${{ secrets.MORALTRADE_SUPABASE_DB_URL }}
      D05_MORAL_TRADE_SUPABASE_DB_URL: ${{ secrets.MORAL_TRADE_SUPABASE_DB_URL }}
      D06_MORALTRADE_PRODUCTION_SUPABASE_DB_URL: ${{ secrets.MORALTRADE_PRODUCTION_SUPABASE_DB_URL }}
      D07_MORAL_TRADE_PRODUCTION_SUPABASE_DB_URL: ${{ secrets.MORAL_TRADE_PRODUCTION_SUPABASE_DB_URL }}
      D08_DATABASE_URL: ${{ secrets.DATABASE_URL }}
      D09_PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
      D10_PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      D11_SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
      D12_PROD_SUPABASE_DATABASE_URL: ${{ secrets.PROD_SUPABASE_DATABASE_URL }}
      D13_PRODUCTION_SUPABASE_DATABASE_URL: ${{ secrets.PRODUCTION_SUPABASE_DATABASE_URL }}
      D14_POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
      D15_PROD_POSTGRES_URL: ${{ secrets.PROD_POSTGRES_URL }}
      D16_PRODUCTION_POSTGRES_URL: ${{ secrets.PRODUCTION_POSTGRES_URL }}
      D17_PRODUCTION_DB_URL: ${{ secrets.PRODUCTION_DB_URL }}
      D18_PROD_DB_URL: ${{ secrets.PROD_DB_URL }}
      D19_MORALTRADE_DB_URL: ${{ secrets.MORALTRADE_DB_URL }}
      D20_MORAL_TRADE_DB_URL: ${{ secrets.MORAL_TRADE_DB_URL }}
      D21_QA_SUPABASE_DB_URL: ${{ secrets.QA_SUPABASE_DB_URL }}
      P01_QA_TEST_PASSWORD: ${{ secrets.QA_TEST_PASSWORD }}
      P02_E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
      P03_TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
      P04_PRODUCTION_TEST_PASSWORD: ${{ secrets.PRODUCTION_TEST_PASSWORD }}
      P05_PROD_TEST_PASSWORD: ${{ secrets.PROD_TEST_PASSWORD }}
    steps:
      - name: Check out the exact one-use controller
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes postgresql-client > /dev/null

      - name: Probe candidate database URLs without printing values
        env:
          PROBE_LABEL: repository-db
        run: python3 .github/scripts/pr552-db-credential-probe.py

      - name: Upload presence-only evidence
        uses: actions/upload-artifact@v4
        with:
          name: pr552-db-credential-probe-repository-${{ github.run_id }}
          path: credential-db-probe-repository-db.json
          if-no-files-found: error
          retention-days: 7

  probe-environment-secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: production-db
            environment_name: Production
          - label: production-moraltrade-site-db
            environment_name: Production – moraltrade-site
          - label: preview-db
            environment_name: Preview
          - label: preview-moraltrade-site-db
            environment_name: Preview – moraltrade-site
          - label: moraltrade-qa-db
            environment_name: MoralTrade QA
    environment:
      name: ${{ matrix.environment_name }}
    env: *candidate_secrets
    steps:
      - name: Check out the exact one-use controller
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes postgresql-client > /dev/null

      - name: Probe candidate database URLs without printing values
        env:
          PROBE_LABEL: ${{ matrix.label }}
        run: python3 .github/scripts/pr552-db-credential-probe.py

      - name: Upload presence-only evidence
        uses: actions/upload-artifact@v4
        with:
          name: pr552-db-credential-probe-${{ matrix.label }}-${{ github.run_id }}
          path: credential-db-probe-${{ matrix.label }}.json
          if-no-files-found: error
          retention-days: 7
