name: Update launch offer fixture bounds

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write
  pull-requests: write

jobs:
  repair:
    if: github.event.pull_request.number == 174 && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out launch branch
        uses: actions/checkout@v4
        with:
          ref: launch/verify-and-harden-20260723
          fetch-depth: 0

      - name: Conform synthetic offers to current impact bounds
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('supabase/tests/core_launch_workflow.sql')
          source = path.read_text()
          old = "    'Not needed', 50, 50,\n"
          new = "    'Not needed', 5, 5,\n"
          if source.count(old) != 2:
              raise SystemExit(f'Expected two synthetic offer impact tuples, found {source.count(old)}.')
          path.write_text(source.replace(old, new))
          PY

      - name: Commit fixture bounds
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/tests/core_launch_workflow.sql
          git diff --cached --check
          git commit -m "Conform launch fixtures to current offer impact bounds"
          git push origin HEAD:launch/verify-and-harden-20260723

      - name: Report compatibility update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment 174 --repo "$GITHUB_REPOSITORY" --body "Updated the synthetic launch offers to the current 1–10 impact scale. This changes only the rollback-only validation fixture."
