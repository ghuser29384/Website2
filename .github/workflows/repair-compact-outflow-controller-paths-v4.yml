name: Repair Compact outflow controller paths v4

on:
  push:
    branches:
      - feature/compact-authoritative-outflow-ledger-v1-20260816
    paths:
      - .github/workflows/repair-compact-outflow-controller-paths-v4.yml

permissions:
  contents: write

concurrency:
  group: repair-compact-outflow-controller-paths-v4-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Check out exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Repair v2 controller paths and remove path-repair controllers
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor de3b6e5480a43cf536c655cc3ad1c69786352382 HEAD
          sed -i 's/compact-authoritative_outflow/compact_authoritative_outflow/g' \
            .github/workflows/repair-compact-outflow-profile-fixtures-v2.yml
          ! grep -q 'compact-authoritative_outflow' \
            .github/workflows/repair-compact-outflow-profile-fixtures-v2.yml
          grep -q 'supabase/tests/compact_authoritative_outflow_ledger_core.sql' \
            .github/workflows/repair-compact-outflow-profile-fixtures-v2.yml
          grep -q 'supabase/tests/compact_authoritative_outflow_ledger_authorization.sql' \
            .github/workflows/repair-compact-outflow-profile-fixtures-v2.yml
          git diff --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/repair-compact-outflow-profile-fixtures-v2.yml
          git rm --ignore-unmatch \
            .github/workflows/repair-compact-outflow-controller-paths-v3.yml \
            .github/workflows/repair-compact-outflow-controller-paths-v4.yml
          git commit -m "ops: repair Compact outflow controller paths"
          git push origin "HEAD:${GITHUB_REF_NAME}"
