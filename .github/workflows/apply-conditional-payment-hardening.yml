name: Apply conditional payment hardening

on:
  push:
    branches:
      - payments/conditional-offset-settlement
    paths:
      - ".github/workflows/apply-conditional-payment-hardening.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: payments/conditional-offset-settlement
          fetch-depth: 0

      - name: Apply reviewed hardening patches
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          def replace_once(path: str, old: str, new: str) -> None:
              file_path = Path(path)
              text = file_path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one occurrence in {path}, found {count}: {old[:120]!r}")
              file_path.write_text(text.replace(old, new, 1))

          replace_once(
              "src/lib/payments/conditional-readiness.ts",
              '''  const canSettle =
              canCreateMandates &&
              chargesEnabled &&
              (environment.livemode ? payoutsEnabled && detailsSubmitted : true);

            if (canCreateMandates && !chargesEnabled) {
              blockers.push("Stripe reports that platform charges are not enabled.");
            }
          ''',
              '''  const canSettle =
              canCreateMandates &&
              signedWebhookSeen &&
              (environment.livemode ? chargesEnabled && payoutsEnabled && detailsSubmitted : true);

            if (canCreateMandates && !signedWebhookSeen) {
              blockers.push("No signed Stripe webhook has been processed in this payment environment.");
            }

            if (environment.livemode && canCreateMandates && !chargesEnabled) {
              blockers.push("Stripe reports that live platform charges are not enabled.");
            }
          ''',
          )

          replace_once(
              "src/lib/payments/conditional-webhook.ts",
              '''async function reconcileDestinationAccount(account: Stripe.Account) {
            const supabase = getDb();
            const { data: destination } = await supabase
              .from("conditional_payment_destinations")
              .select("*")
              .eq("stripe_connected_account_id", account.id)
              .eq("livemode", account.livemode)
              .maybeSingle();
          ''',
              '''async function reconcileDestinationAccount(account: Stripe.Account, livemode: boolean) {
            const supabase = getDb();
            const { data: destination } = await supabase
              .from("conditional_payment_destinations")
              .select("*")
              .eq("stripe_connected_account_id", account.id)
              .eq("livemode", livemode)
              .maybeSingle();
          ''',
          )
          replace_once(
              "src/lib/payments/conditional-webhook.ts",
              '''  if (event.type === "account.updated") {
              return reconcileDestinationAccount(object as Stripe.Account);
            }
          ''',
              '''  if (event.type === "account.updated") {
              return reconcileDestinationAccount(object as Stripe.Account, event.livemode);
            }
          ''',
          )

          replace_once(
              "src/lib/payments/donation-offset-context.ts",
              '''const BLOCKED_MATCH_STATUSES = new Set(["blocked", "cancelled", "failed", "refunded", "disputed"]);
          const BLOCKED_OFFER_STATUSES = new Set(["blocked", "cancelled", "withdrawn", "expired"]);
          ''',
              '''const BLOCKED_MATCH_STATUSES = new Set([
            "blocked",
            "cancelled",
            "completed",
            "failed",
            "refunded",
            "disputed",
          ]);
          const BLOCKED_OFFER_STATUSES = new Set([
            "blocked",
            "cancelled",
            "withdrawn",
            "expired",
            "paused",
            "closed",
          ]);
          ''',
          )

          replace_once(
              "src/lib/payments/conditional-state.ts",
              '''    snapshot.compromiseTotalCents ===
                snapshot.matchedBaselineCents + snapshot.matchedCounterpartyCents &&
              snapshot.destinationConnectedAccountId.startsWith("acct_")
          ''',
              '''    snapshot.compromiseTotalCents ===
                snapshot.matchedBaselineCents + snapshot.matchedCounterpartyCents &&
              snapshot.destinationConnectedAccountId.startsWith("acct_") &&
              snapshot.moderationStatus === "clear" &&
              snapshot.matchStatus === "matched" &&
              (snapshot.offerStatus === "open" || snapshot.offerStatus === "matched")
          ''',
          )

          test_path = Path("src/lib/payments/conditional-state.test.ts")
          test_text = test_path.read_text()
          test_text = test_text.replace('timeHorizon: "2026"', 'timeHorizon: "one_off"')
          test_text = test_text.replace(
              'verificationMethod: "reviewed payment evidence"',
              'verificationMethod: "receipts_uploaded"',
          )
          test_text = test_text.replace(
              'unmatchedSurplusRule: "return_unmatched"',
              'unmatchedSurplusRule: "return_to_donors"',
          )
          test_text = test_text.replace('matchStatus: "completed"', 'matchStatus: "matched"')
          insertion = '''  assert.equal(
              donationOffsetSnapshotIsInternallyConsistent(makeSnapshot({ matchedBaselineCents: 49 })),
              false,
            );
          '''
          replacement = insertion + '''  assert.equal(
              donationOffsetSnapshotIsInternallyConsistent(makeSnapshot({ moderationStatus: "flagged" })),
              false,
            );
            assert.equal(
              donationOffsetSnapshotIsInternallyConsistent(makeSnapshot({ matchStatus: "completed" })),
              false,
            );
            assert.equal(
              donationOffsetSnapshotIsInternallyConsistent(makeSnapshot({ offerStatus: "paused" })),
              false,
            );
          '''
          if test_text.count(insertion) != 1:
              raise SystemExit("Could not extend conditional-state status tests.")
          test_path.write_text(test_text.replace(insertion, replacement, 1))

          settlement_path = Path("src/lib/payments/donation-offset-settlement.ts")
          settlement_text = settlement_path.read_text()
          helper_marker = '''function settlementFailureStatus(charge: ChargeResult) {
            if (charge.status === "requires_action") {
              return "requires_action" as const;
            }
            if (charge.status === "processing") {
              return "failed" as const;
            }
            return "failed" as const;
          }

          export async function attemptDonationOffsetSettlement(
          '''
          helper_replacement = '''function settlementFailureStatus(charge: ChargeResult) {
            if (charge.status === "requires_action") {
              return "requires_action" as const;
            }
            if (charge.status === "processing") {
              return "failed" as const;
            }
            return "failed" as const;
          }

          async function findTerminalSettlementBatch(matchId: string, livemode: boolean) {
            const { data, error } = await getDb()
              .from("conditional_settlement_batches")
              .select("id, status, created_at")
              .eq("purpose", "donation_offset")
              .eq("subject_type", "donation_offset_match")
              .eq("subject_id", matchId)
              .eq("livemode", livemode)
              .in("status", ["transferred", "refunding", "disputed", "cancelled"])
              .order("created_at", { ascending: false })
              .limit(20);

            if (error) {
              throw new Error(`Unable to inspect prior settlement batches: ${error.message}`);
            }

            const rows = (data ?? []) as Array<Record<string, any>>;
            return rows.find((row) => row.status === "transferred") ?? rows[0] ?? null;
          }

          export async function attemptDonationOffsetSettlement(
          '''
          if settlement_text.count(helper_marker) != 1:
              raise SystemExit("Could not insert terminal settlement guard.")
          settlement_text = settlement_text.replace(helper_marker, helper_replacement, 1)

          start_marker = '''  const environment = getConditionalPaymentsEnvironment();
            const context = await loadDonationOffsetPaymentContext(matchId);
          '''
          start_replacement = '''  const environment = getConditionalPaymentsEnvironment();
            const terminalBatch = await findTerminalSettlementBatch(matchId, environment.livemode);
            if (terminalBatch?.status === "transferred") {
              return {
                status: "transferred",
                matchId,
                batchId: String(terminalBatch.id),
                message: "The donation offset has already settled to the approved destination.",
              };
            }
            if (terminalBatch) {
              return {
                status: "failed",
                matchId,
                batchId: String(terminalBatch.id),
                message: `The settlement batch is ${terminalBatch.status} and requires operator resolution.`,
              };
            }

            const context = await loadDonationOffsetPaymentContext(matchId);
          '''
          if settlement_text.count(start_marker) != 1:
              raise SystemExit("Could not add pre-context terminal batch guard.")
          settlement_text = settlement_text.replace(start_marker, start_replacement, 1)

          completion_pattern = re.compile(
              r'''    const \{ error: completeError \} = await getDb\(\)\n'''
              r'''      \.from\("conditional_settlement_batches"\)\n'''
              r'''      \.update\(\{\n'''
              r'''        status: "transferred",\n'''
              r'''        completed_at: new Date\(\)\.toISOString\(\),\n'''
              r'''        processing_token: null,\n'''
              r'''        processing_started_at: null,\n'''
              r'''        failure_code: null,\n'''
              r'''        failure_message: null,\n'''
              r'''      \}\)\n'''
              r'''      \.eq\("id", batch\.id\)\n'''
              r'''      \.eq\("processing_token", processingToken\);\n'''
              r'''    if \(completeError\) \{\n'''
              r'''      throw new Error\(\n'''
              r'''        `Funds transferred but the settlement batch could not be finalized: \$\{completeError\.message\}`,\n'''
              r'''      \);\n'''
              r'''    \}\n'''
          )
          completion_replacement = '''    const { data: finalized, error: completeError } = await getDb().rpc(
              "finalize_donation_offset_settlement",
              {
                p_batch_id: batch.id,
                p_processing_token: processingToken,
                p_match_id: context.snapshot.matchId,
                p_offer_id: context.snapshot.offerId,
              },
            );
            if (completeError || !finalized) {
              throw new Error(
                `Funds transferred but the settlement ledger could not be finalized atomically: ${
                  completeError?.message ?? "the settlement claim no longer matched"
                }`,
              );
            }
          '''
          settlement_text, count = completion_pattern.subn(completion_replacement, settlement_text, count=1)
          if count != 1:
              raise SystemExit(f"Could not replace settlement finalization block; replacements={count}")
          settlement_path.write_text(settlement_text)

          app_data_path = Path("src/lib/app-data.ts")
          app_data_text = app_data_path.read_text()
          app_data_text, count = re.subn(
              r'''for \(const match of matchRows\) \{\n\s+if \(match\.status === "cancelled"\) \{\n\s+continue;\n\s+\}''',
              '''for (const match of matchRows) {
              if (match.status !== "completed") {
                continue;
              }''',
              app_data_text,
              count=1,
          )
          if count != 1:
              raise SystemExit(f"Could not restrict redirected metrics to completed matches; replacements={count}")
          app_data_path.write_text(app_data_text)

          Path("supabase/migrations/20260714_finalize_donation_offset_settlement.sql").write_text(
              '''-- Finalize a captured donation offset as one database transaction. If any
          -- participant-facing state cannot be advanced, the caller compensates the Stripe
          -- transfers and charges instead of publishing a partially completed settlement.

          create or replace function public.finalize_donation_offset_settlement(
            p_batch_id uuid,
            p_processing_token uuid,
            p_match_id uuid,
            p_offer_id uuid
          )
          returns boolean
          language plpgsql
          security definer
          set search_path = public
          as $$
          declare
            affected_rows integer := 0;
          begin
            update public.conditional_settlement_batches
            set
              status = 'transferred',
              completed_at = timezone('utc', now()),
              processing_token = null,
              processing_started_at = null,
              failure_code = null,
              failure_message = null
            where id = p_batch_id
              and processing_token = p_processing_token
              and status = 'transferring';

            get diagnostics affected_rows = row_count;
            if affected_rows <> 1 then
              return false;
            end if;

            update public.donation_offset_matches
            set status = 'completed'
            where id = p_match_id
              and offer_id = p_offer_id
              and status = 'matched';

            get diagnostics affected_rows = row_count;
            if affected_rows <> 1 then
              raise exception 'Donation-offset match could not be finalized from matched state.';
            end if;

            update public.offers
            set status = 'closed'
            where id = p_offer_id
              and status in ('open', 'matched');

            get diagnostics affected_rows = row_count;
            if affected_rows <> 1 then
              raise exception 'Donation-offset offer could not be closed during settlement finalization.';
            end if;

            return true;
          end;
          $$;

          revoke all on function public.finalize_donation_offset_settlement(uuid, uuid, uuid, uuid) from public;
          revoke all on function public.finalize_donation_offset_settlement(uuid, uuid, uuid, uuid) from anon;
          revoke all on function public.finalize_donation_offset_settlement(uuid, uuid, uuid, uuid) from authenticated;
          grant execute on function public.finalize_donation_offset_settlement(uuid, uuid, uuid, uuid) to service_role;
          '''
          )

          for obsolete in [
              "src/types/stripe-account-livemode.d.ts",
              ".github/workflows/conditional-readiness-probe.yml",
              ".github/workflows/apply-conditional-payment-hardening.yml",
          ]:
              Path(obsolete).unlink(missing_ok=True)
          PY

      - name: Commit hardened payment release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ghuser29384"
          git config user.email "262476329+ghuser29384@users.noreply.github.com"
          git add -A
          git commit -m "Harden conditional settlement finalization and replay safety"
          git push origin HEAD:payments/conditional-offset-settlement
