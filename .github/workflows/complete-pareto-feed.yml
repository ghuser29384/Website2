name: Complete Pareto Feed implementation

on:
  pull_request:
    branches:
      - main
    types:
      - reopened

permissions:
  contents: write

concurrency:
  group: complete-pareto-feed-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  materialize-verify-and-commit:
    if: github.event.pull_request.head.ref == 'feature/pareto-causal-learning-feed-20260725'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/pareto-causal-learning-feed-20260725

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Materialize the verified A1 source bundle
        run: node scripts/materialize-pareto-feed.mjs

      - name: Replace temporary transport with ordinary source files
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          packageJson.scripts.predev = 'node scripts/ensure-next-swc.mjs';
          packageJson.scripts.prebuild = 'npm run verify:pareto && node scripts/ensure-next-swc.mjs';
          packageJson.scripts.prestart = 'node scripts/ensure-next-swc.mjs';
          fs.writeFileSync('package.json', `${JSON.stringify(packageJson, null, 2)}\n`);
          NODE
          rm -rf .a1 .a1b
          rm -f scripts/materialize-pareto-feed.mjs
          rm -f .github/workflows/complete-pareto-feed.yml
          git diff --check

      - name: Install dependencies
        run: npm ci

      - name: Run A1 model, privacy, causal-exploration, and wiring checks
        run: npm run verify:pareto

      - name: Build the production application
        run: npm run build

      - name: Commit only the verified ordinary source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No materialization changes to commit."
            exit 0
          fi
          git commit -m "Complete Pareto-safe causal Feed implementation"
          git push origin HEAD:feature/pareto-causal-learning-feed-20260725
