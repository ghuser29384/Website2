name: Complete Pareto Feed implementation

on:
  push:
    branches:
      - feature/pareto-causal-learning-feed-20260725
    paths:
      - .github/workflows/complete-pareto-feed.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/complete-pareto-feed.yml

permissions:
  contents: write

concurrency:
  group: complete-pareto-feed-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/pareto-causal-learning-feed-20260725

      - name: Materialize the reviewed A1 source bundle
        shell: bash
        run: |
          set -euo pipefail
          cat .a1/part-* | base64 --decode > /tmp/pareto-feed.tar.gz
          tar -xzf /tmp/pareto-feed.tar.gz -C .
          python scripts/apply-pareto-learning-patches.py
          rm -rf .a1 scripts/apply-pareto-learning-patches.py
          node --check public/moral-trade-live-learning-diagnostics.js
          git diff --check

      - name: Commit the complete implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete Pareto-safe causal Feed implementation"
          git push origin HEAD:feature/pareto-causal-learning-feed-20260725

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run focused model and wiring tests
        run: node --import tsx --test src/lib/pareto-recommendation-model.test.ts src/pareto-recommendation-wiring.test.ts

      - name: Lint the A1 implementation
        run: >-
          npx eslint
          src/lib/pareto-recommendation-model.ts
          src/lib/pareto-recommendation-model.test.ts
          src/lib/pareto-feed-runtime.ts
          src/lib/recommendation-training.ts
          src/app/api/live-now-a1/route.ts
          src/app/api/jobs/recommendation-training/route.ts
          src/app/recommendation-outcome-actions.ts
          src/components/core-trade/trade-agreement-stage.tsx
          src/components/core-trade/trade-outcome-feedback.tsx
          src/pareto-recommendation-wiring.test.ts

      - name: Build the production application
        run: npm run build
