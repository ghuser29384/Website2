name: Repair evidence-credibility integration plan hash check

on:
  push:
    branches:
      - release/evidence-credibility-shadow-current-main-20260812
    paths:
      - .github/workflows/repair-evidence-credibility-integration-plan-hash.yml

permissions:
  contents: write

concurrency:
  group: repair-evidence-credibility-integration-plan-hash-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact release branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Repair plan hash verification working directory
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/evidence-credibility-shadow-integration-qa.yml')
          source = path.read_text(encoding='utf-8')
          old = '        run: sha256sum -c analysis/evidence-credibility-calibration-v1/plan.sha256\n'
          new = '        run: cd analysis/evidence-credibility-calibration-v1 && sha256sum -c plan.sha256\n'
          if source.count(old) != 1:
              raise SystemExit(f'Expected exactly one old plan-hash invocation, found {source.count(old)}.')
          path.write_text(source.replace(old, new), encoding='utf-8')
          PY
          git diff --check
          grep -q 'cd analysis/evidence-credibility-calibration-v1 && sha256sum -c plan.sha256' \
            .github/workflows/evidence-credibility-shadow-integration-qa.yml

      - name: Commit durable repair and remove controller
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/evidence-credibility-shadow-integration-qa.yml
          git rm .github/workflows/repair-evidence-credibility-integration-plan-hash.yml
          git commit -m "ci: verify frozen plan from its package directory"
          git push origin "HEAD:${GITHUB_REF_NAME}"
