name: Repair blind-audit migration idempotency

on:
  push:
    branches:
      - feature/evidence-credibility-blind-audit-v1-20260812
    paths:
      - .github/workflows/repair-blind-audit-migration.yml

permissions:
  contents: write

concurrency:
  group: repair-blind-audit-migration-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Add idempotent trigger replacement guards
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("supabase/migrations/20260812022000_evidence_credibility_blind_audit_v1.sql")
          source = path.read_text(encoding="utf-8")
          replacements = {
              "create trigger evidence_credibility_calibration_sampling_runs_append_only\n":
                  "drop trigger if exists evidence_credibility_calibration_sampling_runs_append_only\n"
                  "  on public.evidence_credibility_calibration_sampling_runs;\n"
                  "create trigger evidence_credibility_calibration_sampling_runs_append_only\n",
              "create trigger evidence_credibility_calibration_draws_append_only\n":
                  "drop trigger if exists evidence_credibility_calibration_draws_append_only\n"
                  "  on public.evidence_credibility_calibration_draws;\n"
                  "create trigger evidence_credibility_calibration_draws_append_only\n",
              "create trigger evidence_credibility_calibration_assignments_append_only\n":
                  "drop trigger if exists evidence_credibility_calibration_assignments_append_only\n"
                  "  on public.evidence_credibility_calibration_audit_assignments;\n"
                  "create trigger evidence_credibility_calibration_assignments_append_only\n",
              "create trigger evidence_credibility_calibration_assignment_events_append_only\n":
                  "drop trigger if exists evidence_credibility_calibration_assignment_events_append_only\n"
                  "  on public.evidence_credibility_calibration_assignment_events;\n"
                  "create trigger evidence_credibility_calibration_assignment_events_append_only\n",
              "create trigger evidence_credibility_calibration_labels_append_only\n":
                  "drop trigger if exists evidence_credibility_calibration_labels_append_only\n"
                  "  on public.evidence_credibility_calibration_labels;\n"
                  "create trigger evidence_credibility_calibration_labels_append_only\n",
          }
          for old, new in replacements.items():
              if source.count(old) != 1:
                  raise SystemExit(f"Expected exactly one trigger declaration for {old.strip()}")
              source = source.replace(old, new)
          path.write_text(source, encoding="utf-8")
          PY
          git diff --check
          test "$(grep -c '^drop trigger if exists evidence_credibility_calibration_.*_append_only$' supabase/migrations/20260812022000_evidence_credibility_blind_audit_v1.sql)" -eq 5

      - name: Commit durable repair and remove controller
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/20260812022000_evidence_credibility_blind_audit_v1.sql
          git rm .github/workflows/repair-blind-audit-migration.yml
          git commit -m "fix: make blind-audit migration idempotent"
          git push origin "HEAD:${GITHUB_REF_NAME}"
