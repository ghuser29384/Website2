name: Dispatch cleanup 813 production release

on:
  push:
    branches:
      - ops/cleanup-813-release-dispatch-20260922
    paths:
      - .github/workflows/cleanup-813-release-dispatch.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: github.repository == 'ghuser29384/Website2' && github.ref == 'refs/heads/ops/cleanup-813-release-dispatch-20260922'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Guard current main and dispatch existing gated production release
        uses: actions/github-script@v7
        env:
          EXPECTED_SHA: ded28e1024b98dcd800249e36e9787378f7802d4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const expected = process.env.EXPECTED_SHA;
            const { data: branch } = await github.rest.repos.getBranch({ owner, repo, branch: 'main' });
            if (branch.commit.sha !== expected) {
              core.setFailed(`main moved: expected ${expected}, got ${branch.commit.sha}`);
              return;
            }
            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id: 'vercel-release.yml',
              ref: 'main',
              inputs: {
                target: 'production',
                ref: 'main',
                expected_sha: expected,
                synthetic_auth_fixture_url: ''
              }
            });
            core.info(`Dispatched gated production release for ${expected}`);
