name: PR 552 optional priority-summary repair

on:
  push:
    branches:
      - ops/pr552-optional-priority-summary-repair-20260808

permissions:
  contents: write

concurrency:
  group: pr552-optional-priority-summary-repair-20260808
  cancel-in-progress: false

jobs:
  repair:
    name: Patch the exact PR 552 branch
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TARGET_BRANCH: hotfix/dashboard-account-security-visible-20260807
      EXPECTED_TARGET_SHA: 0f2164e893b3eee94d2f4033d013f2ebf6430cea
    steps:
      - name: Check out the exact target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Guard the target revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_TARGET_SHA"
          test "$(git branch --show-current)" = "$TARGET_BRANCH"

      - name: Apply the fail-closed optional-summary repair
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path("src/app/dashboard/page.tsx")
          source = path.read_text(encoding="utf-8")
          old = (
              "  const priorityFundSummary =\n"
              "    viewer && supabaseReady ? await getPriorityCorrectionSummary(viewer.authUser.id) : null;\n"
          )
          new = (
              "  const priorityFundSummary =\n"
              "    viewer && supabaseReady && process.env.SUPABASE_SERVICE_ROLE_KEY\n"
              "      ? await getPriorityCorrectionSummary(viewer.authUser.id)\n"
              "      : null;\n"
          )
          count = source.count(old)
          if count != 1:
              raise SystemExit(f"expected one exact priority-summary match, found {count}")
          path.write_text(source.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Verify the exact patch scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only)" = "src/app/dashboard/page.tsx"
          grep -F 'viewer && supabaseReady && process.env.SUPABASE_SERVICE_ROLE_KEY' src/app/dashboard/page.tsx

      - name: Commit and push the repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/dashboard/page.tsx
          git commit -m "Skip optional priority summary without service credentials"
          git push origin "HEAD:$TARGET_BRANCH"
