name: Diagnose live loader tail

on:
  push:
    branches:
      - qa/home-authenticated-feed-20260727

permissions:
  contents: write

jobs:
  diagnose:
    if: ${{ contains(github.event.head_commit.message, '[run-live-loader-tail]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract loader tail
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .qa-results
          node <<'NODE' > .qa-results/live-loader-tail.log
          const { readFileSync } = require('node:fs');
          const html = readFileSync('public/moral-trade-live.html', 'utf8');
          console.log(`bytes=${Buffer.byteLength(html)}`);
          console.log('===== last 30000 chars =====');
          console.log(html.slice(-30000));
          NODE
          git rm .github/workflows/diagnose-live-loader-tail.yml
      - name: Publish context
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .qa-results/live-loader-tail.log
          git commit -m "Record live loader tail [live-loader-tail-complete] [verification-failure]"
          git push origin HEAD:refs/heads/qa/home-authenticated-feed-20260727
