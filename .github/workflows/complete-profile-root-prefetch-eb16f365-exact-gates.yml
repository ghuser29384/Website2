name: Complete Profile root-prefetch rebased exact gates

on:
  pull_request:
    paths:
      - ".github/workflows/complete-profile-root-prefetch-eb16f365-exact-gates.yml"

permissions:
  contents: read
  statuses: write

concurrency:
  group: complete-profile-root-prefetch-eb16f365-exact-gates
  cancel-in-progress: false

jobs:
  exact-gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      EXPECTED_SHA: eb16f365bbe37f77e03999d2c61ec8a04e06fc9b
      STATUS_CONTEXT: QA / Complete Profile prefetch rebased exact gates

    steps:
      - name: Mark exact candidate pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${EXPECTED_SHA}" \
            -f state=pending \
            -f context="${STATUS_CONTEXT}" \
            -f description="Running TypeScript, focused ESLint, build, and rendered regressions" \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Check out exact cleanup candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 1

      - name: Verify exact checkout
        run: test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if npm ci; then exit 0; fi
            if [[ "$attempt" == "3" ]]; then exit 1; fi
            sleep $((attempt * 20))
          done

      - name: Parse permanent canary
        run: node --check .github/scripts/complete-profile-production-canary.mjs

      - name: Run absolute TypeScript gate
        run: npx tsc --noEmit

      - name: Lint focused files
        run: >-
          npx eslint
          src/components/profile/complete-profile-review.tsx
          tests/complete-profile-review.spec.ts
          --max-warnings=2

      - name: Build production application
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run rendered Complete Profile regressions
        env:
          PLAYWRIGHT_HTML_OPEN: never
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report
        run: >-
          npx playwright test
          tests/complete-profile-review.spec.ts
          --reporter=line,html

      - name: Upload rendered evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: complete-profile-root-prefetch-rebased-exact-gates-eb16f365
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish exact-gate result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [[ "$JOB_STATUS" == "success" ]]; then
            state=success
            description="TypeScript, focused ESLint, build, and rendered regressions passed"
          else
            state=failure
            description="Rebased Complete Profile prefetch gates failed; inspect workflow evidence"
          fi
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${EXPECTED_SHA}" \
            -f state="$state" \
            -f context="${STATUS_CONTEXT}" \
            -f description="$description" \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
