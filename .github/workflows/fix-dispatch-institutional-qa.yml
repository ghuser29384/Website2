name: Fix institutional QA dispatcher

on:
  push:
    branches:
      - feat/institutional-trade-system
    paths:
      - .github/workflows/fix-dispatch-institutional-qa.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-dispatch-institutional-qa
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the tree after removing temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          file=.github/workflows/dispatch-institutional-qa.yml
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/dispatch-institutional-qa.yml')
          text = path.read_text(encoding='utf-8')
          old = '''          tree_sha="$(git rev-parse 'HEAD^{tree}')"
          if [[ "$tree_sha" != "$EXPECTED_TREE_SHA" ]]; then
            echo "Expected imported tree $EXPECTED_TREE_SHA, got $tree_sha" >&2
            exit 1
          fi

          rm -f .github/workflows/dispatch-institutional-qa.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
'''
          new = '''          rm -f .github/workflows/dispatch-institutional-qa.yml
          git add -A
          tree_sha="$(git write-tree)"
          if [[ "$tree_sha" != "$EXPECTED_TREE_SHA" ]]; then
            echo "Expected imported tree $EXPECTED_TREE_SHA, got $tree_sha" >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
'''
          if old not in text:
              raise SystemExit('Expected dispatcher block was not found')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

          rm -f .github/workflows/fix-dispatch-institutional-qa.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix exact-tree institutional QA dispatch"
          git push origin HEAD:feat/institutional-trade-system
