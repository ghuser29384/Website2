name: Materialize current-main marketplace delta final

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/materialize-marketplace-delta-final.yml"
      - ".github/scripts/run-marketplace-delta-exact-browser-gate.sh"
      - ".github/scripts/run-marketplace-delta-exact-browser-gate-trigger.sh"
      - ".github/scripts/marketplace-delta-exact-browser-qa.mjs"
  push:
    branches:
      - ops/materialize-marketplace-delta-final-20260730
    paths:
      - ".github/workflows/materialize-marketplace-delta-final.yml"
      - ".github/scripts/run-marketplace-delta-exact-browser-gate.sh"
      - ".github/scripts/run-marketplace-delta-exact-browser-gate-trigger.sh"
      - ".github/scripts/marketplace-delta-exact-browser-qa.mjs"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: materialize-current-main-marketplace-delta-final
  cancel-in-progress: true

jobs:
  exact-head-browser-gate:
    # Superseded by marketplace-delta-exact-browser-gate.yml. Keep this
    # historical workflow inert so one PR update cannot run two writers against
    # the same product candidate and QA fixture.
    if: ${{ false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      QA_SUPABASE_DB_URL: ${{ secrets.QA_SUPABASE_DB_URL }}
      QA_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.QA_SUPABASE_PUBLISHABLE_KEY }}
      QA_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.QA_SUPABASE_SERVICE_ROLE_KEY }}
      QA_TEST_PASSWORD: ${{ secrets.QA_TEST_PASSWORD }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Check out clean orchestration branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record exact workflow run
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh pr comment 324
          --repo ghuser29384/Website2
          --body "Marketplace exact-head gate run: ${GITHUB_RUN_ID} (workflow head ${GITHUB_SHA})."

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Run exact-head environment, browser, and cleanup gate
        shell: bash
        run: bash .github/scripts/run-marketplace-delta-exact-browser-gate-trigger.sh

      - name: Upload rendered browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marketplace-delta-browser-evidence-${{ github.run_id }}
          path: marketplace-delta-browser-artifacts
          if-no-files-found: warn
          retention-days: 14

      - name: Upload exact-head and clean-state proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marketplace-delta-final-proof-${{ github.run_id }}
          path: marketplace-delta-final-proof
          if-no-files-found: warn
          retention-days: 14
