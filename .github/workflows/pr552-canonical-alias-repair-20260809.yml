name: Repair PR 552 canonical aliases to exact released deployment

on:
  push:
    branches:
      - ops/pr552-canonical-alias-repair-20260809
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr552-canonical-alias-repair-20260809
  cancel-in-progress: false

env:
  EXPECTED_MAIN_SHA: bb3b0e4608b7282aecc9d1fe11b5cb310c409347
  EXPECTED_DEPLOYMENT_ID: dpl_6VxCNaMke5Mpe7qZjPhD4tdkuyrx
  EXPECTED_DEPLOYMENT_HOST: moraltrade-site-n12ni5u3j-ellen-s.vercel.app
  EXPECTED_PRIOR_CANONICAL_DEPLOYMENT_ID: dpl_B4ct7W3LgbENhXdwgP1ZHtvgAKLp
  VERCEL_ORG_ID: team_ySu6sF3Uho1E1GnJtCQPVEuJ
  VERCEL_PROJECT_ID: prj_Em3j7Uj7RatX2R1ZYhla3XSHRde7
  VERCEL_CLI_VERSION: 50.38.1
  EVIDENCE_DIR: pr552-canonical-alias-repair

jobs:
  repair:
    name: Move and prove both canonical aliases
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out one-use alias repair controller
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard exact source, target, and controller-only scope
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'ghuser29384/Website2'
          test "$(git rev-parse HEAD^)" = "$EXPECTED_MAIN_SHA"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$EXPECTED_MAIN_SHA"
          changed="$(git diff --name-only "$EXPECTED_MAIN_SHA" "$GITHUB_SHA")"
          test "$changed" = '.github/workflows/pr552-canonical-alias-repair-20260809.yml'
          git diff --check "$EXPECTED_MAIN_SHA" "$GITHUB_SHA"
          mkdir -p "$EVIDENCE_DIR/aliases"
          printf '%s\n' "$changed" > "$EVIDENCE_DIR/controller-files.txt"

      - name: Verify exact READY Production deployment before alias movement
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          curl -fsS \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            "https://api.vercel.com/v13/deployments/${EXPECTED_DEPLOYMENT_HOST}?teamId=${VERCEL_ORG_ID}" \
            > "$EVIDENCE_DIR/deployment.json"
          jq -e \
            --arg deployment "$EXPECTED_DEPLOYMENT_ID" \
            --arg host "$EXPECTED_DEPLOYMENT_HOST" \
            --arg project "$VERCEL_PROJECT_ID" \
            --arg sha "$EXPECTED_MAIN_SHA" '
              ((.uid // .id // "") == $deployment)
              and (.url == $host)
              and ((.projectId // .project.id // "") == $project)
              and ((.readyState // .state // "") == "READY")
              and (.target == "production")
              and ((.aliasError // null) == null)
              and (.meta.githubCommitSha == $sha)
              and (.meta.moralTradeCandidateSha == $sha)
              and (.meta.releaseReason == "pr552-account-security-production-after-serial-differential")
            ' "$EVIDENCE_DIR/deployment.json" >/dev/null

      - name: Record canonical alias state before repair
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          for alias_name in moraltrade.org www.moraltrade.org; do
            alias_path="$EVIDENCE_DIR/aliases/${alias_name//./-}.before.json"
            curl -fsS \
              -H "Authorization: Bearer ${VERCEL_TOKEN}" \
              "https://api.vercel.com/v4/aliases/${alias_name}?projectId=${VERCEL_PROJECT_ID}&teamId=${VERCEL_ORG_ID}" \
              > "$alias_path"
            before_id="$(jq -r '.deploymentId // .deployment.id // .deployment.uid // empty' "$alias_path")"
            test -n "$before_id"
            if [[ "$before_id" != "$EXPECTED_DEPLOYMENT_ID" ]]; then
              test "$before_id" = "$EXPECTED_PRIOR_CANONICAL_DEPLOYMENT_ID"
            fi
          done

      - name: Link only the canonical Vercel project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' \
            "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json

      - name: Explicitly move both canonical aliases
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          for alias_name in www.moraltrade.org moraltrade.org; do
            npx --yes "vercel@${VERCEL_CLI_VERSION}" alias set \
              "$EXPECTED_DEPLOYMENT_HOST" \
              "$alias_name" \
              --scope="$VERCEL_ORG_ID" \
              --token="$VERCEL_TOKEN" \
              2>&1 | tee "$EVIDENCE_DIR/aliases/${alias_name//./-}.set.log"
          done

      - name: Prove both canonical aliases name the exact deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          for alias_name in moraltrade.org www.moraltrade.org; do
            alias_path="$EVIDENCE_DIR/aliases/${alias_name//./-}.after.json"
            matched=false
            for attempt in $(seq 1 60); do
              if curl -fsS \
                -H "Authorization: Bearer ${VERCEL_TOKEN}" \
                "https://api.vercel.com/v4/aliases/${alias_name}?projectId=${VERCEL_PROJECT_ID}&teamId=${VERCEL_ORG_ID}" \
                > "$alias_path"; then
                if jq -e \
                  --arg alias "$alias_name" \
                  --arg project "$VERCEL_PROJECT_ID" \
                  --arg deployment "$EXPECTED_DEPLOYMENT_ID" '
                    .alias == $alias
                    and .projectId == $project
                    and ((.deploymentId // .deployment.id // .deployment.uid // "") == $deployment)
                  ' "$alias_path" >/dev/null; then
                  matched=true
                  break
                fi
              fi
              sleep 5
            done
            test "$matched" = true
          done

      - name: Verify canonical routing and non-error responses
        shell: bash
        run: |
          set -euo pipefail
          curl -sS --max-time 60 \
            -D "$EVIDENCE_DIR/apex-dashboard.headers" \
            -o /dev/null \
            https://moraltrade.org/dashboard
          tr -d '\r' < "$EVIDENCE_DIR/apex-dashboard.headers" \
            > "$EVIDENCE_DIR/apex-dashboard.normalized.headers"
          grep -Eq '^HTTP/[0-9.]+ 308$' "$EVIDENCE_DIR/apex-dashboard.normalized.headers"
          grep -Eqi '^location: https://www\.moraltrade\.org/dashboard([?].*)?$' \
            "$EVIDENCE_DIR/apex-dashboard.normalized.headers"

          dashboard_status="$(curl -sS -L --max-time 60 \
            --cookie 'mt_walkthrough_seen=1' \
            -D "$EVIDENCE_DIR/www-dashboard.headers" \
            -o "$EVIDENCE_DIR/www-dashboard.html" \
            -w '%{http_code}' \
            https://www.moraltrade.org/dashboard)"
          test "$dashboard_status" = '200'
          grep -Fq 'Moral Trade' "$EVIDENCE_DIR/www-dashboard.html"
          ! grep -Eq 'HTTP/[0-9.]+ 5[0-9][0-9]' "$EVIDENCE_DIR/www-dashboard.headers"

          offers_status="$(curl -sS --max-time 60 \
            -D "$EVIDENCE_DIR/offers.headers" \
            -o /dev/null \
            -w '%{http_code}' \
            https://www.moraltrade.org/offers)"
          test "$offers_status" = '307'
          tr -d '\r' < "$EVIDENCE_DIR/offers.headers" \
            > "$EVIDENCE_DIR/offers.normalized.headers"
          grep -Eqi '^location: (/|https://www\.moraltrade\.org/)discover\?domain=offers&view=list$' \
            "$EVIDENCE_DIR/offers.normalized.headers"

      - name: Record exact repair result
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            --arg exactSha "$EXPECTED_MAIN_SHA" \
            --arg deploymentId "$EXPECTED_DEPLOYMENT_ID" \
            --arg deploymentHost "$EXPECTED_DEPLOYMENT_HOST" \
            --arg repairedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '
              {
                exactSha: $exactSha,
                deploymentId: $deploymentId,
                deploymentHost: $deploymentHost,
                canonicalAliases: ["moraltrade.org", "www.moraltrade.org"],
                repairedAt: $repairedAt,
                productionCodeChanged: false,
                aliasOnlyRepair: true
              }
            ' > "$EVIDENCE_DIR/result.json"

      - name: Upload canonical alias repair evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr552-canonical-alias-repair-${{ github.run_id }}
          path: pr552-canonical-alias-repair/
          if-no-files-found: warn
          retention-days: 30
