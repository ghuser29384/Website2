name: PR 212 persisted MFA QA repair

on:
  push:
    branches:
      - ops/pr212-mfa-persisted-session-20260807
    paths:
      - .github/workflows/pr212-mfa-persisted-session-20260807.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pr212-mfa-persisted-session-20260807
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact feature head
        uses: actions/checkout@v4
        with:
          ref: feat/institutional-trade-system
          fetch-depth: 0

      - name: Apply persisted-session MFA QA repair
        shell: bash
        run: |
          set -euo pipefail
          actual_head="$(git rev-parse HEAD)"
          expected_head="a36e06f494975d0a8a772ce65c3d639653afc0d4"
          if [[ "$actual_head" != "$expected_head" ]]; then
            echo "Feature branch moved: expected $expected_head, got $actual_head" >&2
            exit 1
          fi
          printf '%s' '' | base64 --decode > /tmp/pr212-mfa-patch.py
          python /tmp/pr212-mfa-patch.py
          git diff --check
          node --check .github/scripts/institutional-trade-qa-e2e.mjs

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            if npm ci; then exit 0; fi
            if (( attempt == 4 )); then exit 1; fi
            sleep $((attempt * 20))
          done

      - name: Run focused source contracts
        run: node --import tsx --test src/institutional-trade-wiring.test.ts src/institutional-mfa-stable-state.test.ts

      - name: Commit and push verified repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/scripts/institutional-trade-qa-e2e.mjs src/institutional-trade-wiring.test.ts src/institutional-mfa-stable-state.test.ts
          git commit -m "Verify persisted AAL2 state after MFA action"
          git push origin HEAD:feat/institutional-trade-system
