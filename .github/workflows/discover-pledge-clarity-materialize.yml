name: Materialize and validate Discover pledge clarity

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

concurrency:
  group: discover-pledge-clarity-final-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  materialize:
    if: >-
      github.repository == 'ghuser29384/Website2' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/discover-pledge-clarity-20260801'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Guard exact branch and synchronize main
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "fix/discover-pledge-clarity-20260801"
          git fetch origin main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-edit origin/main

      - name: Detect an already materialized exact head
        id: state
        shell: bash
        run: |
          set -euo pipefail
          if \
            grep -Fq "Preview your conditional pledge" src/discover/moral-trade-discover.source.html && \
            grep -Fq "formatGapShare" src/discover/moral-trade-discover.source.html && \
            ! grep -Fq "TEST YOUR PLEDGE" src/discover/moral-trade-discover.source.html && \
            ! grep -Fq "<h3>Pivotality</h3>" src/discover/moral-trade-discover.source.html && \
            test -f src/discover-pledge-clarity.test.ts && \
            test -f tests/discover-pledge-clarity.spec.ts
          then
            echo "already=true" >> "$GITHUB_OUTPUT"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.state.outputs.already != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        if: steps.state.outputs.already != 'true'
        run: npm ci

      - name: Materialize exact pledge-clarity source and tests
        if: steps.state.outputs.already != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/materialize-discover-pledge-clarity.py

      - name: Repack and verify deterministic Discover payload
        if: steps.state.outputs.already != 'true'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/pack-discover-payload.mjs
          npm run verify:discover

      - name: Run focused and complete repository gates
        if: steps.state.outputs.already != 'true'
        shell: bash
        env:
          NEXT_PUBLIC_SITE_URL: https://www.moraltrade.org
          VERCEL: "1"
          VERCEL_ENV: preview
        run: |
          set -euo pipefail
          node --import tsx --test src/discover-pledge-clarity.test.ts
          npm test
          npm run lint -- --quiet
          npm run build

      - name: Run rendered desktop and mobile gates
        if: steps.state.outputs.already != 'true'
        shell: bash
        run: |
          set -euo pipefail
          npx playwright install --with-deps chromium
          npx playwright test tests/discover-pledge-clarity.spec.ts --reporter=line
          test -s test-results/discover-pledge-clarity-desktop.png
          test -s test-results/discover-pledge-clarity-mobile.png

      - name: Check exact diff
        if: steps.state.outputs.already != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git status --short

      - name: Upload rendered evidence
        if: steps.state.outputs.already != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: discover-pledge-clarity-${{ github.run_id }}
          path: |
            test-results/discover-pledge-clarity-*.png
            test-results/**/trace.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish reviewed source
        if: steps.state.outputs.already != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git add \
            src/discover/moral-trade-discover.source.html \
            public/moral-trade-discover.html \
            public/discover/payload \
            src/discover-pledge-clarity.test.ts \
            tests/discover-pledge-clarity.spec.ts
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No materialized source changes to publish."
            exit 0
          fi
          git commit -m "Clarify conditional pledge preview"
          git push origin HEAD:fix/discover-pledge-clarity-20260801
