name: Update launch Auth fixture compatibility

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write
  pull-requests: write

jobs:
  repair:
    if: github.event.pull_request.number == 174 && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out launch branch
        uses: actions/checkout@v4
        with:
          ref: launch/verify-and-harden-20260723
          fetch-depth: 0

      - name: Update the synthetic Auth fixture and response formatting
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          test_path = Path('supabase/tests/core_launch_workflow.sql')
          test_source = test_path.read_text()
          old_columns = '    id, aud, role, email, encrypted_password, email_confirmed_at, confirmed_at,\n'
          new_columns = '    id, aud, role, email, encrypted_password, email_confirmed_at,\n'
          if test_source.count(old_columns) != 1:
              raise SystemExit('Expected Auth user column list was not found exactly once.')
          test_source = test_source.replace(old_columns, new_columns, 1)
          old_values = "      now(), now(), '{\"provider\":\"email\",\"providers\":[\"email\"]}'::jsonb,\n"
          new_values = "      now(), '{\"provider\":\"email\",\"providers\":[\"email\"]}'::jsonb,\n"
          if test_source.count(old_values) != 3:
              raise SystemExit('Expected exactly three synthetic Auth confirmation value pairs.')
          test_source = test_source.replace(old_values, new_values)
          test_path.write_text(test_source)

          route_path = Path('src/app/api/live-now/feedback/route.ts')
          route_source = route_path.read_text()
          old_block = '''  if (!viewer) {
            return privateJson({
              authenticated: false,
              acceptedEventCount: 0,
              learningEnabled: false,
            });
          }'''.replace('        ', '')
          new_block = '''  if (!viewer) {
            return privateJson({
              authenticated: false,
              acceptedEventCount: 0,
              learningEnabled: false,
            });
          }'''.replace('        ', '  ')
          if old_block not in route_source:
              raise SystemExit('Expected anonymous feedback block was not found.')
          route_path.write_text(route_source.replace(old_block, new_block, 1))
          PY

      - name: Commit compatibility fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/tests/core_launch_workflow.sql src/app/api/live-now/feedback/route.ts
          git diff --cached --check
          git commit -m "Support generated Auth confirmation state in launch validation"
          git push origin HEAD:launch/verify-and-harden-20260723

      - name: Report compatibility update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment 174 --repo "$GITHUB_REPOSITORY" --body "Updated the synthetic three-account validation for the current Supabase Auth schema, where \`confirmed_at\` is generated from confirmation fields. No production row or schema was changed."
