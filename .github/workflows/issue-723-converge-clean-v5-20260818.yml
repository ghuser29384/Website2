name: Issue 723 clean convergence v5

on:
  push:
    branches:
      - ops/issue723-converge-clean-20260818
    paths:
      - .github/workflows/issue-723-converge-clean-v5-20260818.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  issues: write
  pull-requests: write

concurrency:
  group: issue-723-clean-convergence
  cancel-in-progress: true

jobs:
  converge:
    runs-on: ubuntu-24.04
    timeout-minutes: 155
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      QA_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.QA_SUPABASE_PUBLISHABLE_KEY }}
      QA_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.QA_SUPABASE_SERVICE_ROLE_KEY }}
      QA_SUPABASE_DB_URL: ${{ secrets.QA_SUPABASE_DB_URL }}
      QA_TEST_PASSWORD: ${{ secrets.QA_TEST_PASSWORD }}
      QA_STRIPE_SECRET_KEY: ${{ secrets.QA_STRIPE_SECRET_KEY }}
      QA_STRIPE_PUBLISHABLE_KEY: ${{ secrets.QA_STRIPE_PUBLISHABLE_KEY }}
      QA_STRIPE_WEBHOOK_SECRET: ${{ secrets.QA_STRIPE_WEBHOOK_SECRET }}
      QA_EVERY_ORG_WEBHOOK_TOKEN: ${{ secrets.QA_EVERY_ORG_WEBHOOK_TOKEN }}
      QA_EVERY_ORG_WEBHOOK_PATH_SECRET: ${{ secrets.QA_EVERY_ORG_WEBHOOK_PATH_SECRET }}
      QA_EVERY_ORG_PARTNER_METADATA_SECRET: ${{ secrets.QA_EVERY_ORG_PARTNER_METADATA_SECRET }}
    steps:
      - name: Check out controller branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 200

      - name: Reuse an already successful clean candidate when present
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          found=false
          prs="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100")"
          while read -r encoded; do
            pr="$(printf '%s' "$encoded" | base64 --decode)"
            number="$(jq -r .number <<<"$pr")"
            head="$(jq -r .head.sha <<<"$pr")"
            branch="$(jq -r .head.ref <<<"$pr")"
            base="$(jq -r .base.ref <<<"$pr")"
            changed="$(jq -r .changed_files <<<"$pr")"
            test "$base" = "qa/pooled-settlement-authenticated-e2e-20260814" || continue
            test "$changed" = "7" || continue
            commit="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${head}")"
            test "$(jq '.parents | length' <<<"$commit")" = "1" || continue
            test "$(jq -r '.parents[0].sha' <<<"$commit")" = "813573f64eaa17d2ca240c50f76ead9a3b535f97" || continue
            runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?branch=${branch}&per_page=100")"
            run_id="$(jq -r --arg sha "$head" '[.workflow_runs[] | select(.head_sha==$sha and .status=="completed" and .conclusion=="success" and (.path | contains("pooled-settlement-authenticated-caller-integration")))] | sort_by(.created_at) | last | .id // empty' <<<"$runs")"
            test -n "$run_id" || continue
            jobs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100")"
            source_job="$(jq -r '[.jobs[] | select(.name=="Exact stacked source and fail-closed preflight" and .conclusion=="success")] | last | .id // empty' <<<"$jobs")"
            matrix_job="$(jq -r '[.jobs[] | select(.name=="Authenticated 19-case matrix with caller repair" and .conclusion=="success")] | last | .id // empty' <<<"$jobs")"
            test -n "$source_job" || continue
            test -n "$matrix_job" || continue
            artifacts="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100")"
            artifact_id="$(jq -r '[.artifacts[] | select(.expired==false and ((.name | startswith("issue-723-clean-authenticated-qa-")) or (.name | startswith("pooled-settlement-authenticated-caller-qa-"))))] | last | .id // empty' <<<"$artifacts")"
            test -n "$artifact_id" || continue
            product_pr="$(jq -r '[.[] | select(.draft==true and (.title=="Clean issue 723 authenticated-caller repair"))] | sort_by(.created_at) | last | .number // 0' <<<"$prs")"
            product_head="$(jq -r --argjson n "$product_pr" '[.[] | select(.number==$n)] | first | .head.sha // ""' <<<"$prs")"
            jq -n \
              --argjson productPr "$product_pr" \
              --arg productHead "$product_head" \
              --argjson stackPr "$number" \
              --arg stackHead "$head" \
              --argjson runId "$run_id" \
              --argjson sourceJobId "$source_job" \
              --argjson matrixJobId "$matrix_job" \
              --argjson artifactId "$artifact_id" \
              '{status:"success",productPr:$productPr,productHead:$productHead,stackPr:$stackPr,stackHead:$stackHead,stackBase:"813573f64eaa17d2ca240c50f76ead9a3b535f97",runId:$runId,sourceJobId:$sourceJobId,matrixJobId:$matrixJobId,artifactId:$artifactId}' \
              > /tmp/issue-723-final.json
            found=true
            break
          done < <(jq -r '.[] | select(.draft==true and (.title | startswith("Clean issue 723 authenticated pooled-settlement QA candidate"))) | @base64' <<<"$prs")
          echo "found=$found" >> "$GITHUB_OUTPUT"

      - name: Normalize controller source and force live-main tracking
        if: steps.reuse.outputs.found != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/issue-723-converge-clean.mjs")
          text = path.read_text()
          text = text.replace('value="${!name:-}"', 'value="\\${!name:-}"')
          old_fetch = 'git(["fetch", "--no-tags", "--force", "origin", "main", originalRepairHead], repoDir, false);'
          new_fetch = '''git(["fetch", "--no-tags", "--force", "origin", "main:refs/remotes/origin/main", `${originalProductBranch}:refs/remotes/origin/${originalProductBranch}`], repoDir, false);
    git(["cat-file", "-e", `${originalRepairHead}^{commit}`], repoDir, false);'''
          if old_fetch in text:
              text = text.replace(old_fetch, new_fetch, 1)
          text = text.replace(
              'git(["fetch", "--no-tags", "--force", "origin", "main"], repoDir, false);',
              'git(["fetch", "--no-tags", "--force", "origin", "main:refs/remotes/origin/main"], repoDir, false);',
          )
          old_drift = '''      if (currentMain !== mainHead) {
        rmSync(dir, { recursive: true, force: true });
        continue;
      }'''
          new_drift = '''      if (currentMain !== mainHead) {
        git(["worktree", "remove", "--force", dir], repoDir, false);
        try { git(["branch", "-D", productBranch], repoDir, false); } catch {}
        continue;
      }'''
          if old_drift in text:
              text = text.replace(old_drift, new_drift, 1)
          path.write_text(text)
          PY
          node --check scripts/issue-723-converge-clean.mjs

      - name: Use Node.js 24
        if: steps.reuse.outputs.found != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install PostgreSQL client
        if: steps.reuse.outputs.found != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Verify isolated-QA credentials are present and non-live
        if: steps.reuse.outputs.found != 'true'
        shell: bash
        run: |
          set -euo pipefail
          for name in QA_SUPABASE_PUBLISHABLE_KEY QA_SUPABASE_SERVICE_ROLE_KEY QA_SUPABASE_DB_URL QA_TEST_PASSWORD QA_STRIPE_SECRET_KEY QA_STRIPE_PUBLISHABLE_KEY QA_STRIPE_WEBHOOK_SECRET QA_EVERY_ORG_WEBHOOK_TOKEN QA_EVERY_ORG_WEBHOOK_PATH_SECRET QA_EVERY_ORG_PARTNER_METADATA_SECRET; do
            test -n "${!name:-}"
          done
          case "$QA_STRIPE_SECRET_KEY" in sk_test_*|rk_test_*) ;; *) exit 1 ;; esac
          case "$QA_STRIPE_PUBLISHABLE_KEY" in pk_test_*) ;; *) exit 1 ;; esac
          case "$QA_STRIPE_WEBHOOK_SECRET" in whsec_*) ;; *) exit 1 ;; esac
          [[ "$QA_SUPABASE_DB_URL" == *hvmxfjjbdcgjjudmthdz* ]]

      - name: Execute complete clean convergence sequence
        if: steps.reuse.outputs.found != 'true'
        run: node scripts/issue-723-converge-clean.mjs

      - name: Publish machine-readable success marker
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          test -s /tmp/issue-723-final.json
          mkdir -p status
          cp /tmp/issue-723-final.json status/issue723-success.json
          rm -f status/issue723-failure.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status/issue723-success.json status/issue723-failure.json || true
          if ! git diff --cached --quiet; then
            git commit -m "Record successful issue 723 clean convergence"
            git push origin "HEAD:ops/issue723-converge-clean-20260818"
          fi

      - name: Publish machine-readable failure marker
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p status
          printf '{"status":"failure","controllerRunId":%s,"note":"See masked GitHub Actions logs; no production or real-money action was authorized."}\n' "$GITHUB_RUN_ID" > status/issue723-failure.json
          rm -f status/issue723-success.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status/issue723-failure.json status/issue723-success.json || true
          git commit -m "Record failed issue 723 convergence" || true
          git push origin "HEAD:ops/issue723-converge-clean-20260818" || true

      - name: Upload decision-ready controller summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-723-clean-convergence-v5-${{ github.run_id }}
          path: /tmp/issue-723-final.json
          if-no-files-found: ignore
          retention-days: 30
