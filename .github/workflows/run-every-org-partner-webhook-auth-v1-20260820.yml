name: Run exact Every.org Partner Webhook authorization v1

on:
  push:
    branches:
      - fix/every-org-partner-webhook-authorization-708-20260820

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: every-org-partner-webhook-auth-v1-20260820
  cancel-in-progress: false

env:
  EXPECTED_REPOSITORY: ghuser29384/Website2
  EXPECTED_BRANCH: fix/every-org-partner-webhook-authorization-708-20260820
  EXPECTED_PREPARE_PARENT: 13826439749380cb6d1ba71260e94fbee914692e
  EXPECTED_BASE: e0041c9d99456cdfef8196d0ab0b982c52379581
  THIS_WORKFLOW: .github/workflows/run-every-org-partner-webhook-auth-v1-20260820.yml
  TRIGGER_FILE: .github/run-every-org-partner-webhook-auth-v1.trigger
  PATCH_SHA256: e88b288448b23f90913ac459deeb52a589711475b965e10cef5824a3d5ba2567

jobs:
  implement-and-validate:
    if: github.event.head_commit.message == 'Run exact Every.org Partner Webhook authorization v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Check out exact trigger commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Guard exact topology and reconstruct the reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY"
          test "$GITHUB_REF_NAME" = "$EXPECTED_BRANCH"
          test "$GITHUB_ACTOR" = ghuser29384
          test "$(git rev-parse HEAD^^)" = "$EXPECTED_PREPARE_PARENT"
          test "$(git diff --name-only "$EXPECTED_PREPARE_PARENT" HEAD^)" = "$THIS_WORKFLOW"
          test "$(git diff --name-only HEAD^ HEAD)" = "$TRIGGER_FILE"
          test "$(cat "$TRIGGER_FILE")" = 'RUN_EXACT_EVERY_ORG_PARTNER_WEBHOOK_AUTH_V1'
          git merge-base --is-ancestor "$EXPECTED_BASE" "$EXPECTED_PREPARE_PARENT"
          git merge-base --is-ancestor "$EXPECTED_BASE" HEAD
          test -z "$(git status --porcelain)"
          test "$(sha256sum .github/scripts/every-org-auth-v1.part00 | cut -d' ' -f1)" = b7f8d50144b2806111954e04ca39e09608ad2aee0bf6f5c51f418907064456c1
          test "$(sha256sum .github/scripts/every-org-auth-v1.part01 | cut -d' ' -f1)" = febe89870fca26ce26f8c4fa0a6289bfcc728f4a84d8164675aec3d57da953b9
          test "$(sha256sum .github/scripts/every-org-auth-v1.part02 | cut -d' ' -f1)" = bda5e879b97f71fa4d16e1742acecb14adebb240c08051320cea832507bd40bb
          test "$(sha256sum .github/scripts/every-org-auth-v1.part03 | cut -d' ' -f1)" = 6b5e368c6f86c9d9cfd60493733c59b0a7a15f3a0f2c8ecfe1911e248539f2f9
          cat .github/scripts/every-org-auth-v1.part{00,01,02,03} > "$RUNNER_TEMP/apply-every-org-auth-v1.py"
          test "$(sha256sum "$RUNNER_TEMP/apply-every-org-auth-v1.py" | cut -d' ' -f1)" = "$PATCH_SHA256"
          PYTHONDONTWRITEBYTECODE=1 python3 -B - "$RUNNER_TEMP/apply-every-org-auth-v1.py" <<'PY'
          import pathlib
          import sys
          path = pathlib.Path(sys.argv[1])
          compile(path.read_text(), str(path), "exec")
          PY
          mkdir -p "$RUNNER_TEMP/evidence"
          {
            echo "trigger_actor=$GITHUB_ACTOR"
            echo "trigger_sha=$GITHUB_SHA"
            echo "stacked_base=$EXPECTED_BASE"
            echo "patch_sha256=$PATCH_SHA256"
            echo "provider_contract=Authorization: Bearer <Auth Token>"
          } > "$RUNNER_TEMP/evidence/trigger.txt"

      - name: Apply the exact written provider contract
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 -B "$RUNNER_TEMP/apply-every-org-auth-v1.py" \
            2>&1 | tee "$RUNNER_TEMP/evidence/patch.log"
          git diff --check
          test -z "$(find .github -type f \( -name '*.pyc' -o -path '*/__pycache__/*' \) -print -quit)"

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci 2>&1 | tee "$RUNNER_TEMP/evidence/npm-ci.log"

      - name: Run focused Every.org authorization and money-rail contracts
        shell: bash
        env:
          DIRECT_DONATION_UPGRADES_ENABLED: "false"
          DIRECT_DONATION_UPGRADE_MODE: disabled
          DIRECT_DONATION_UPGRADE_QA_FIXTURES: "false"
          EVERY_ORG_PLEDGE_DONATIONS_ENABLED: "false"
          CONDITIONAL_PAYMENTS_MODE: disabled
          TRADE_DONATION_POOL_ENABLED: "false"
          TRADE_DONATION_POOL_MODE: disabled
        run: |
          set -euo pipefail
          node --import tsx --test \
            src/lib/every-org-partner-webhook-auth.test.ts \
            src/lib/direct-donation-upgrade-source-contract.test.ts \
            src/lib/direct-donation-upgrade.test.ts \
            src/lib/trade-donation.test.ts \
            src/lib/mpgf.test.ts \
            2>&1 | tee "$RUNNER_TEMP/evidence/focused-tests.log"

      - name: Run complete repository tests
        shell: bash
        env:
          DIRECT_DONATION_UPGRADES_ENABLED: "false"
          DIRECT_DONATION_UPGRADE_MODE: disabled
          DIRECT_DONATION_UPGRADE_QA_FIXTURES: "false"
          EVERY_ORG_PLEDGE_DONATIONS_ENABLED: "false"
          CONDITIONAL_PAYMENTS_MODE: disabled
          TRADE_DONATION_POOL_ENABLED: "false"
          TRADE_DONATION_POOL_MODE: disabled
        run: |
          set -euo pipefail
          npm test 2>&1 | tee "$RUNNER_TEMP/evidence/repository-tests.log"

      - name: Run strict TypeScript
        shell: bash
        run: |
          set -euo pipefail
          npx tsc --noEmit --pretty false 2>&1 | tee "$RUNNER_TEMP/evidence/typescript.log"

      - name: Run scoped ESLint
        shell: bash
        run: |
          set -euo pipefail
          npx eslint \
            'src/app/api/connectors/every-org/[routeId]/route.ts' \
            src/app/api/mpgf/every-org/webhook/route.ts \
            src/lib/direct-donation-upgrade-source-contract.test.ts \
            src/lib/direct-donation-upgrade.test.ts \
            src/lib/every-org-partner-webhook-auth.test.ts \
            src/lib/every-org-partner-webhook-auth.ts \
            src/lib/trade-donation.test.ts \
            2>&1 | tee "$RUNNER_TEMP/evidence/scoped-eslint.log"

      - name: Run repository ESLint with zero errors
        shell: bash
        run: |
          set -euo pipefail
          npm run lint -- --quiet 2>&1 | tee "$RUNNER_TEMP/evidence/repository-eslint.log"

      - name: Build with every money rail disabled
        shell: bash
        env:
          NEXT_PUBLIC_SITE_URL: https://www.moraltrade.org
          VERCEL: "1"
          VERCEL_ENV: preview
          VERCEL_TARGET_ENV: preview
          DIRECT_DONATION_UPGRADES_ENABLED: "false"
          DIRECT_DONATION_UPGRADE_MODE: disabled
          DIRECT_DONATION_UPGRADE_QA_FIXTURES: "false"
          EVERY_ORG_PLEDGE_DONATIONS_ENABLED: "false"
          CONDITIONAL_PAYMENTS_MODE: disabled
          TRADE_DONATION_POOL_ENABLED: "false"
          TRADE_DONATION_POOL_MODE: disabled
        run: |
          set -euo pipefail
          npm run build 2>&1 | tee "$RUNNER_TEMP/evidence/build.log"

      - name: Remove temporary patch material and verify exact durable scope
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          git rm -f -- \
            .github/scripts/every-org-auth-v1.part00 \
            .github/scripts/every-org-auth-v1.part01 \
            .github/scripts/every-org-auth-v1.part02 \
            .github/scripts/every-org-auth-v1.part03 \
            "$TRIGGER_FILE"
          find . -path ./.git -prune -o -type d -name __pycache__ -exec rm -rf {} +
          find . -path ./.git -prune -o -type f -name '*.pyc' -exec rm -f {} +
          git add -A
          git diff --cached --check

          cat > "$RUNNER_TEMP/evidence/expected-paths-with-controller.txt" <<'EOF'
          .env.example
          .github/workflows/run-every-org-partner-webhook-auth-v1-20260820.yml
          docs/direct-verified-donation-upgrade.md
          docs/every-org-pledge-donation-connector.md
          src/app/api/connectors/every-org/[routeId]/route.ts
          src/app/api/mpgf/every-org/webhook/route.ts
          src/lib/direct-donation-upgrade-source-contract.test.ts
          src/lib/direct-donation-upgrade.test.ts
          src/lib/every-org-partner-webhook-auth.test.ts
          src/lib/every-org-partner-webhook-auth.ts
          src/lib/trade-donation.test.ts
          EOF
          LC_ALL=C sort -o "$RUNNER_TEMP/evidence/expected-paths-with-controller.txt" "$RUNNER_TEMP/evidence/expected-paths-with-controller.txt"
          LC_ALL=C git diff --cached --name-only --no-renames "$EXPECTED_BASE" | sort > "$RUNNER_TEMP/evidence/actual-paths-with-controller.txt"
          diff -u "$RUNNER_TEMP/evidence/expected-paths-with-controller.txt" "$RUNNER_TEMP/evidence/actual-paths-with-controller.txt"

          git diff --cached --name-status -M "$EXPECTED_BASE" | tee "$RUNNER_TEMP/evidence/name-status.txt"
          git diff --cached --stat "$EXPECTED_BASE" | tee "$RUNNER_TEMP/evidence/diff-stat.txt"
          git diff --cached "$EXPECTED_BASE" > "$RUNNER_TEMP/evidence/final-with-controller.diff"
          validated_tree_with_controller="$(git write-tree)"

          cp "$THIS_WORKFLOW" "$RUNNER_TEMP/evidence/controller.final.yml"
          git rm --cached -- "$THIS_WORKFLOW"
          target_tree="$(git write-tree)"
          git restore --source=HEAD --staged --worktree -- "$THIS_WORKFLOW"
          test "$(git write-tree)" = "$validated_tree_with_controller"

          test -f 'src/app/api/connectors/every-org/[routeId]/route.ts'
          test ! -e 'src/app/api/connectors/every-org/[secret]/route.ts'
          grep -Fq 'Authorization' src/lib/every-org-partner-webhook-auth.ts
          grep -Fq '"Bearer " as const' src/lib/every-org-partner-webhook-auth.ts
          grep -Fq 'authenticateEveryOrgPartnerWebhookRequest(request.headers)' 'src/app/api/connectors/every-org/[routeId]/route.ts'
          grep -Fq 'authenticateEveryOrgPartnerWebhookRequest(request.headers)' src/app/api/mpgf/every-org/webhook/route.ts
          ! git grep -n -F 'authenticateEveryOrgPartnerWebhookRequest()' -- src
          ! git grep -n -F '"unconfirmed"' -- \
            .env.example docs/direct-verified-donation-upgrade.md docs/every-org-pledge-donation-connector.md \
            'src/app/api/connectors/every-org/[routeId]/route.ts' src/app/api/mpgf/every-org/webhook/route.ts \
            src/lib/direct-donation-upgrade-source-contract.test.ts src/lib/direct-donation-upgrade.test.ts \
            src/lib/every-org-partner-webhook-auth.test.ts src/lib/every-org-partner-webhook-auth.ts \
            src/lib/trade-donation.test.ts
          test -z "$(find . -path ./.git -prune -o -type f \( -name '*.pyc' -o -path '*/__pycache__/*' \) -print -quit)"

          {
            echo "validated_tree_with_controller=$validated_tree_with_controller"
            echo "target_tree_without_controller=$target_tree"
          } | tee "$RUNNER_TEMP/evidence/target-trees.txt"
          echo "target_tree=$target_tree" >> "$GITHUB_OUTPUT"

      - name: Record validation and non-action evidence
        shell: bash
        run: |
          set -euo pipefail
          grep -E '^ℹ (tests|pass|fail|skipped|duration_ms) ' "$RUNNER_TEMP/evidence/focused-tests.log" > "$RUNNER_TEMP/evidence/focused-test-summary.txt" || true
          grep -E '^ℹ (tests|pass|fail|skipped|duration_ms) ' "$RUNNER_TEMP/evidence/repository-tests.log" > "$RUNNER_TEMP/evidence/repository-test-summary.txt" || true
          {
            echo 'npm ci: PASS'
            echo 'focused tests: PASS'
            echo 'npm test: PASS'
            echo 'npx tsc --noEmit: PASS'
            echo 'scoped ESLint: PASS'
            echo 'repository ESLint: PASS'
            echo 'npm run build with rails disabled: PASS'
            echo 'exact durable scope and source scans: PASS'
          } | tee "$RUNNER_TEMP/evidence/validation-summary.txt"
          {
            echo 'provider_webhook_invoked=false'
            echo 'checkout_or_donation_attempted=false'
            echo 'payment_or_refund_attempted=false'
            echo 'database_operation_attempted=false'
            echo 'deployment_or_alias_change=false'
            echo 'feature_flag_or_secret_mutation=false'
            echo 'merge_close_or_ready_transition=false'
          } | tee "$RUNNER_TEMP/evidence/non-actions.txt"
          ! grep -R -n -E 'sb_secret_|vcp_|gh[pousr]_|postgres(ql)?://[^[:space:]]+:[^[:space:]]+@|eyJ[A-Za-z0-9_-]+\.eyJ[A-Za-z0-9_-]+\.' "$RUNNER_TEMP/evidence"

      - name: Commit and push validated product slice
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name ghuser29384
          git config user.email 262476329+ghuser29384@users.noreply.github.com
          git commit -m 'Implement exact Every.org Partner Webhook authorization'
          final_sha="$(git rev-parse HEAD)"
          final_tree="$(git show -s --format=%T HEAD)"
          git push origin "HEAD:$EXPECTED_BRANCH"
          {
            echo "pushed_slice_sha=$final_sha"
            echo "pushed_slice_tree=$final_tree"
            echo "target_tree_without_controller=${{ steps.scope.outputs.target_tree }}"
          } | tee "$RUNNER_TEMP/evidence/pushed-slice-identity.txt"
          echo "final_sha=$final_sha" >> "$GITHUB_OUTPUT"
          echo "final_tree=$final_tree" >> "$GITHUB_OUTPUT"

      - name: Verify pushed branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$EXPECTED_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "${{ steps.commit.outputs.final_sha }}"
          test "$(git show -s --format=%T FETCH_HEAD)" = "${{ steps.commit.outputs.final_tree }}"
          test -z "$(git status --porcelain)"

      - name: Comment exact validation handoff on PR 795
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          gh pr comment 795 --repo "$GITHUB_REPOSITORY" --body "Exact Authorization-Bearer implementation run [$GITHUB_RUN_ID]($run_url) passed focused and complete repository tests, strict TypeScript, scoped and repository ESLint, disabled-rail build, exact-scope checks, and evidence scans. Pushed product slice: \`${{ steps.commit.outputs.final_sha }}\`; controller-free target tree: \`${{ steps.scope.outputs.target_tree }}\`. No deployment, provider invocation, checkout, donation, payment, refund, database mutation, feature-flag or secret mutation, merge, close, or ready-for-review transition occurred."

      - name: Upload exact-head evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: every-org-partner-webhook-auth-v1-${{ github.run_id }}
          path: ${{ runner.temp }}/evidence
          if-no-files-found: warn
          retention-days: 30

      - name: Comment failure on PR 795
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          gh pr comment 795 --repo "$GITHUB_REPOSITORY" --body "Exact Authorization-Bearer implementation run [$GITHUB_RUN_ID]($run_url) failed before completion. Inspect the failed step and sanitized artifact; no successful product or validation claim is made."
