name: Selected cleanup source snapshot
on:
  pull_request:
    paths:
      - .github/workflows/selected-cleanup-source-20260926.yml
      - .github/selected-cleanup-edits.json.gz
permissions:
  contents: write
concurrency:
  group: selected-cleanup-20260926
  cancel-in-progress: false
jobs:
  verify-and-publish-candidate:
    if: github.repository == 'ghuser29384/Website2' && github.event.pull_request.head.ref == 'ops/selected-cleanup-source-20260926' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3210
      SITE_URL: http://127.0.0.1:3210
      PLAYWRIGHT_USE_PRODUCTION_SERVER: '1'
      PLAYWRIGHT_HTML_OPEN: never
    steps:
      - name: Read the exact operations manifest
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: controller
          persist-credentials: false
      - name: Check out the current production baseline
        uses: actions/checkout@v4
        with:
          ref: ef3b1b595f6bddd1e660e3215ca19e57254234f3
          path: app
          fetch-depth: 0
          persist-credentials: false
      - name: Apply only hash-checked selected edits
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = ef3b1b595f6bddd1e660e3215ca19e57254234f3
          mkdir -p "$GITHUB_WORKSPACE/evidence"
          python3 - <<'PY'
          from pathlib import Path
          import gzip, hashlib, json, subprocess
          raw = gzip.decompress(Path('../controller/.github/selected-cleanup-edits.json.gz').read_bytes())
          assert hashlib.sha256(raw).hexdigest() == 'e7b8da3ac8b392cc8acf0de23b45ee84a7362bf5ebb0aca2eed140f7dfb39686'
          edits = json.loads(raw)
          assert len(edits) == 24
          def blob(raw):
              return hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
          # React may reorder form attributes. Check their values, not their order.
          spec = edits['src/lib/selected-cleanup.test.ts']
          assert spec['after'] == '390466d7809c13e6fcc43d8a4be3ecde14ec91e5'
          old = '    assert.match(html, /<form action="\\/offers" class="topbar-search" method="get" role="search">/);'
          new = '''    const form = html.match(/<form\\b[^>]*>/)?.[0];
              assert.ok(form);
              for (const attribute of ['action="/offers"', 'class="topbar-search"', 'method="get"', 'role="search"']) {
                assert.ok(form.includes(attribute));
              }'''
          assert spec['edits'][0][2].count(old) == 1
          spec['edits'][0][2] = spec['edits'][0][2].replace(old, new)
          spec['after'] = '4e4da7642049816bb19b0d9a61d441de67073b24'
          for name, spec in edits.items():
              path = Path(name)
              assert not path.is_absolute() and '..' not in path.parts
              assert name not in {'src/app/about/page.tsx', 'src/app/sitemap.ts', 'next.config.ts', '.github/workflows/vercel-release.yml'}
              assert not name.startswith(('supabase/', 'src/app/api/', 'src/app/profile/'))
              before = path.read_bytes() if path.exists() else None
              assert (blob(before) if before is not None else None) == spec['before'], name
              if spec['after'] is None:
                  path.unlink()
                  continue
              lines = (before or b'').decode('utf-8').splitlines(keepends=True)
              for start, end, replacement in reversed(spec['edits']):
                  lines[start:end] = replacement.splitlines(keepends=True)
              after = ''.join(lines).encode('utf-8')
              assert blob(after) == spec['after'], name
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(after)
          subprocess.run(['git', 'add', '--', *edits], check=True)
          actual = subprocess.check_output(['git','diff','--cached','--name-only'], text=True).splitlines()
          assert set(actual) == set(edits)
          Path('../evidence/selected-scope.json').write_text(json.dumps(edits, indent=2))
          PY
          git diff --cached --check
          git diff --cached --binary > "$GITHUB_WORKSPACE/evidence/selected.patch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Release selected navigation, search and footer cleanup'
          git rev-parse HEAD HEAD^{tree} HEAD^ > "$GITHUB_WORKSPACE/evidence/identity.txt"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install exact application dependencies
        working-directory: app
        run: npm ci
      - name: Test selected contracts and complete repository
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          node --import tsx --test src/lib/selected-cleanup.test.ts src/lib/refined-header.test.ts src/lib/site.test.ts src/lib/live-discover-navigation.test.ts | tee "$GITHUB_WORKSPACE/evidence/focused-tests.log"
          npm test | tee "$GITHUB_WORKSPACE/evidence/repository-tests.log"
      - name: Lint, typecheck and build
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          npm run lint -- --quiet | tee "$GITHUB_WORKSPACE/evidence/lint.log"
          npx tsc --noEmit | tee "$GITHUB_WORKSPACE/evidence/typecheck.log"
          npm run build | tee "$GITHUB_WORKSPACE/evidence/build.log"
      - name: Install Chromium
        working-directory: app
        run: npx playwright install --with-deps chromium
      - name: Verify actual desktop and mobile selected behavior
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          npx playwright test tests/selected-cleanup.spec.ts tests/refined-header.spec.ts tests/contact-page-layout.spec.ts --reporter=line --workers=1 | tee "$GITHUB_WORKSPACE/evidence/focused-browser.log"
          cp -r test-results "$GITHUB_WORKSPACE/evidence/focused-test-results"
      - name: Run the unchanged complete release browser suite
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          npm run test:e2e:release -- --reporter=line | tee "$GITHUB_WORKSPACE/evidence/release-browser.log"
          git diff --check
      - name: Publish the tested candidate branch only
        working-directory: app
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api repos/ghuser29384/Website2/git/ref/heads/main --jq .object.sha)" = ef3b1b595f6bddd1e660e3215ca19e57254234f3
          test "$(git rev-parse HEAD^)" = ef3b1b595f6bddd1e660e3215ca19e57254234f3
          test -z "$(git diff --name-only HEAD)"
          credential="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $credential" push https://github.com/ghuser29384/Website2.git HEAD:refs/heads/release/selected-shared-cleanup-20260926
          printf 'published=%s\nbranch=%s\n' "$(git rev-parse HEAD)" release/selected-shared-cleanup-20260926 > "$GITHUB_WORKSPACE/evidence/published.txt"
      - name: Preserve exact source, checks and rendered evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selected-cleanup-qa-${{ github.run_id }}
          path: |
            evidence
            app/test-results
          retention-days: 7
