name: Create autocomplete current diagnostic 1fd98472

on:
  pull_request:
    paths:
      - ".github/workflows/create-autocomplete-current-diagnostic-1fd98472.yml"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: create-autocomplete-current-diagnostic-1fd98472
  cancel-in-progress: true

env:
  PRODUCT_SHA: 1fd98472897330bc5256fe17e223cb0ac34deac4
  CONTROLLER_BRANCH: qa/create-autocomplete-current-diagnostic-1fd98472
  CONTROLLER_PATH: .github/workflows/create-autocomplete-current-diagnostic-1fd98472.yml
  EVIDENCE_DIR: create-autocomplete-current-diagnostic-1fd98472
  NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3210
  SITE_URL: http://127.0.0.1:3210
  PLAYWRIGHT_HTML_OPEN: never

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 55

    steps:
      - name: Guard immutable product and one-file controller scope
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'ghuser29384/Website2'
          test '${{ github.event.pull_request.head.ref }}' = "$CONTROLLER_BRANCH"
          test '${{ github.event.pull_request.base.ref }}' = 'main'
          test '${{ github.event.pull_request.base.sha }}' = "$PRODUCT_SHA"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)" = "$PRODUCT_SHA"
          actual_files="$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/pulls/${{ github.event.pull_request.number }}/files?per_page=100" \
            --jq '.[].filename')"
          test "$actual_files" = "$CONTROLLER_PATH"

      - name: Check out immutable current main
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PRODUCT_SHA }}
          fetch-depth: 1

      - name: Prove checkout and record current Create source markers
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          test -f public/moral-trade-create/index.html
          test -f src/app/trades/new/page.tsx
          test -f src/components/create/create-interface-frame.tsx
          test -f tests/exact-live-autocomplete.spec.ts
          mkdir -p "$EVIDENCE_DIR"
          printf '%s\n' "$PRODUCT_SHA" > "$EVIDENCE_DIR/product-sha.txt"
          grep -n -E \
            'role="combobox"|actionSuggestions|action-autocomplete|Describe the action|Choose a suggestion or write your own' \
            public/moral-trade-create/index.html \
            > "$EVIDENCE_DIR/current-autocomplete-source-markers.txt" || true
          grep -n -E \
            '/trades/new|Moral Trade Create|data-create-interface-frame' \
            public/moral-trade-live.html \
            src/app/trades/new/page.tsx \
            src/components/create/create-interface-frame.tsx \
            > "$EVIDENCE_DIR/current-route-source-markers.txt" || true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies and Chromium
        shell: bash
        run: |
          set -o pipefail
          npm ci 2>&1 | tee "$EVIDENCE_DIR/npm-ci.log"
          npx playwright install --with-deps chromium \
            2>&1 | tee "$EVIDENCE_DIR/playwright-install.log"

      - name: Write bounded Create autocomplete diagnostic
        shell: bash
        run: |
          set -euo pipefail
          cat > tests/create-autocomplete-current-diagnostic-1fd98472.spec.ts <<'TS'
          import { mkdir, writeFile } from "node:fs/promises";
          import path from "node:path";

          import { expect, test, type Frame, type Page } from "@playwright/test";

          const evidenceDir =
            process.env.EVIDENCE_DIR ?? "create-autocomplete-current-diagnostic-1fd98472";

          interface Events {
            consoleErrors: string[];
            consoleWarnings: string[];
            pageErrors: string[];
            failedRequests: string[];
            httpErrors: string[];
          }

          function observe(page: Page): Events {
            const events: Events = {
              consoleErrors: [],
              consoleWarnings: [],
              pageErrors: [],
              failedRequests: [],
              httpErrors: [],
            };
            page.on("console", (message) => {
              if (message.type() === "error") events.consoleErrors.push(message.text());
              if (message.type() === "warning") events.consoleWarnings.push(message.text());
            });
            page.on("pageerror", (error) => events.pageErrors.push(error.stack || error.message));
            page.on("requestfailed", (request) => {
              events.failedRequests.push(
                `${request.method()} ${request.url()} :: ${request.failure()?.errorText ?? "unknown"}`,
              );
            });
            page.on("response", (response) => {
              const origin = page.url().startsWith("http") ? new URL(page.url()).origin : "";
              if (origin && response.status() >= 400 && new URL(response.url()).origin === origin) {
                events.httpErrors.push(
                  `${response.status()} ${response.request().method()} ${response.url()}`,
                );
              }
            });
            return events;
          }

          async function openCreate(page: Page) {
            await page.goto("/moral-trade-live.html#trade", { waitUntil: "domcontentloaded" });
            await expect(page).toHaveURL(/\/trades\/new(?:[?#]|$)/, { timeout: 30_000 });
            const iframe = page.locator('iframe[title="Moral Trade Create"]');
            await expect(iframe).toBeVisible({ timeout: 30_000 });
            const handle = await iframe.elementHandle();
            const frame = await handle?.contentFrame();
            if (!frame) throw new Error("Moral Trade Create frame did not become available");
            await expect(frame.locator("body")).not.toBeEmpty({ timeout: 30_000 });
            return frame;
          }

          async function reachActionAutocomplete(frame: Frame) {
            await frame.getByRole("button", { name: "Wild animal suffering", exact: true }).click();
            await frame.getByRole("button", { name: "Continue →", exact: true }).click();
            await expect(
              frame.getByRole("heading", { name: "What do you want other people to do?" }),
            ).toBeVisible();
            await frame
              .getByRole("button", { name: /Commitment A bounded action/ })
              .click();

            const input = frame.locator('input[role="combobox"]').filter({ visible: true }).first();
            await expect(input).toBeVisible({ timeout: 10_000 });
            return input;
          }

          async function state(frame: Frame) {
            return frame.evaluate(() => {
              const visible = (element: Element) => {
                const html = element as HTMLElement;
                const rect = html.getBoundingClientRect();
                const style = getComputedStyle(html);
                return (
                  style.display !== "none" &&
                  style.visibility !== "hidden" &&
                  Number(style.opacity) !== 0 &&
                  rect.width > 0 &&
                  rect.height > 0
                );
              };
              const summarize = (element: Element) => ({
                tag: element.tagName.toLowerCase(),
                text: (element.textContent ?? "").replace(/\s+/g, " ").trim().slice(0, 1_200),
                value:
                  element instanceof HTMLInputElement || element instanceof HTMLTextAreaElement
                    ? element.value
                    : null,
                visible: visible(element),
                attributes: Object.fromEntries(
                  [...element.attributes].map((attribute) => [attribute.name, attribute.value]),
                ),
              });

              return {
                title: document.title,
                bodyText: (document.body.textContent ?? "").replace(/\s+/g, " ").trim().slice(0, 12_000),
                headings: [...document.querySelectorAll("h1, h2, h3")].map(summarize),
                visibleComboboxes: [...document.querySelectorAll('[role="combobox"]')]
                  .filter(visible)
                  .map(summarize),
                visibleListboxes: [...document.querySelectorAll('[role="listbox"]')]
                  .filter(visible)
                  .map(summarize),
                visibleOptions: [...document.querySelectorAll('[role="option"]')]
                  .filter(visible)
                  .map(summarize),
                offerChoiceButtons: [...document.querySelectorAll("button")]
                  .filter((element) =>
                    /Commitment|Skill|Fund|Pledge-swap|Donation redirect|Donation Upgrade|Co-Fund|Threshold pool/.test(
                      element.textContent ?? "",
                    ),
                  )
                  .map(summarize),
                legacyClauseCount: document.querySelectorAll(".clause").length,
                legacyTokenCount: document.querySelectorAll('.token[contenteditable="true"]').length,
                legacyOfferTypeCount: document.querySelectorAll("[data-mt-offer-type]").length,
                dimensions: {
                  innerWidth: window.innerWidth,
                  clientWidth: document.documentElement.clientWidth,
                  scrollWidth: document.documentElement.scrollWidth,
                },
              };
            });
          }

          async function record(
            page: Page,
            frame: Frame,
            events: Events,
            label: string,
            extra: Record<string, unknown> = {},
          ) {
            await mkdir(evidenceDir, { recursive: true });
            await writeFile(
              path.join(evidenceDir, `${label}.json`),
              `${JSON.stringify(
                {
                  label,
                  recordedAt: new Date().toISOString(),
                  outerUrl: page.url(),
                  state: await state(frame),
                  events: structuredClone(events),
                  extra,
                },
                null,
                2,
              )}\n`,
              "utf8",
            );
            await page.screenshot({ path: path.join(evidenceDir, `${label}.png`), fullPage: true });
          }

          async function exercise(page: Page, frame: Frame, events: Events, prefix: string) {
            await record(page, frame, events, `${prefix}-cause-step`);
            const input = await reachActionAutocomplete(frame);
            const initial = {
              placeholder: await input.getAttribute("placeholder"),
              ariaControls: await input.getAttribute("aria-controls"),
              ariaExpanded: await input.getAttribute("aria-expanded"),
              ariaAutocomplete: await input.getAttribute("aria-autocomplete"),
            };
            await record(page, frame, events, `${prefix}-action-initial`, { initial });

            await input.fill("write");
            await frame.waitForTimeout(250);
            const writeOptions = await frame.locator('[role="option"]:visible').allTextContents();
            await record(page, frame, events, `${prefix}-write-options`, { writeOptions });

            await input.press("ArrowDown");
            const activeAfterArrow = await input.getAttribute("aria-activedescendant");
            await input.press("Enter");
            await frame.waitForTimeout(100);
            await record(page, frame, events, `${prefix}-keyboard-selection`, {
              activeAfterArrow,
              selectedValue: await input.inputValue(),
              expandedAfterEnter: await input.getAttribute("aria-expanded"),
            });

            await input.fill("donate");
            await frame.waitForTimeout(200);
            await input.press("Escape");
            await record(page, frame, events, `${prefix}-escape`, {
              value: await input.inputValue(),
              expanded: await input.getAttribute("aria-expanded"),
            });

            await input.fill("volunteer");
            await frame.waitForTimeout(200);
            await frame.getByRole("heading", { name: "What do you want other people to do?" }).click();
            await record(page, frame, events, `${prefix}-outside-click`, {
              value: await input.inputValue(),
              expanded: await input.getAttribute("aria-expanded"),
            });
          }

          test("records the current desktop autocomplete reached through the legacy Trade entry", async ({
            page,
          }) => {
            const events = observe(page);
            await page.setViewportSize({ width: 1440, height: 1000 });
            const frame = await openCreate(page);
            await exercise(page, frame, events, "desktop");
          });

          test("records the current mobile autocomplete and viewport contract", async ({ page }) => {
            const events = observe(page);
            await page.setViewportSize({ width: 390, height: 844 });
            const frame = await openCreate(page);
            await exercise(page, frame, events, "mobile");
          });
          TS

          npx playwright test tests/create-autocomplete-current-diagnostic-1fd98472.spec.ts --list \
            > "$EVIDENCE_DIR/test-list.txt"

      - name: Run current Create autocomplete diagnostic
        shell: bash
        run: |
          set -o pipefail
          rm -rf .next
          npx playwright test tests/create-autocomplete-current-diagnostic-1fd98472.spec.ts \
            --workers=1 --reporter=line \
            2>&1 | tee "$EVIDENCE_DIR/playwright.log"

      - name: Upload immutable diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: create-autocomplete-current-diagnostic-1fd98472
          path: |
            create-autocomplete-current-diagnostic-1fd98472
            test-results
          if-no-files-found: error
          retention-days: 14
