name: Create autocomplete current diagnostic 1fd98472

on:
  pull_request:
    paths:
      - ".github/workflows/create-autocomplete-current-diagnostic-1fd98472.yml"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: create-autocomplete-current-diagnostic-1fd98472
  cancel-in-progress: true

env:
  PRODUCT_SHA: 1fd98472897330bc5256fe17e223cb0ac34deac4
  CONTROLLER_BRANCH: qa/create-autocomplete-current-diagnostic-1fd98472
  CONTROLLER_PATH: .github/workflows/create-autocomplete-current-diagnostic-1fd98472.yml
  EVIDENCE_DIR: create-autocomplete-current-diagnostic-1fd98472
  NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3210
  SITE_URL: http://127.0.0.1:3210
  PLAYWRIGHT_HTML_OPEN: never

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 55

    steps:
      - name: Guard immutable product and one-file controller scope
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'ghuser29384/Website2'
          test '${{ github.event.pull_request.head.ref }}' = "$CONTROLLER_BRANCH"
          test '${{ github.event.pull_request.base.ref }}' = 'main'
          test '${{ github.event.pull_request.base.sha }}' = "$PRODUCT_SHA"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)" = "$PRODUCT_SHA"
          actual_files="$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/pulls/${{ github.event.pull_request.number }}/files?per_page=100" \
            --jq '.[].filename')"
          test "$actual_files" = "$CONTROLLER_PATH"

      - name: Check out immutable current main
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PRODUCT_SHA }}
          fetch-depth: 1

      - name: Prove checkout and record current Create source markers
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          test -f public/moral-trade-create/index.html
          test -f src/app/trades/new/page.tsx
          test -f src/components/create/create-interface-frame.tsx
          test -f tests/exact-live-autocomplete.spec.ts
          mkdir -p "$EVIDENCE_DIR"
          printf '%s\n' "$PRODUCT_SHA" > "$EVIDENCE_DIR/product-sha.txt"
          grep -n -E \
            'data-mtg-action-autocomplete|data-mtg-action-options|action-autocomplete|showActionSuggestions|selectActionSuggestion|role="combobox"' \
            public/moral-trade-create/index.html \
            > "$EVIDENCE_DIR/current-autocomplete-source-markers.txt" || true
          grep -n -E \
            'moral-trade-live\.html#trade|/trades/new|Moral Trade Create|data-create-interface-frame' \
            public/moral-trade-live.html \
            src/app/trades/new/page.tsx \
            src/components/create/create-interface-frame.tsx \
            > "$EVIDENCE_DIR/current-route-source-markers.txt" || true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies and Chromium
        shell: bash
        run: |
          set -o pipefail
          npm ci 2>&1 | tee "$EVIDENCE_DIR/npm-ci.log"
          npx playwright install --with-deps chromium \
            2>&1 | tee "$EVIDENCE_DIR/playwright-install.log"

      - name: Write bounded Create autocomplete diagnostic
        shell: bash
        run: |
          set -euo pipefail
          cat > tests/create-autocomplete-current-diagnostic-1fd98472.spec.ts <<'TS'
          import { mkdir, writeFile } from "node:fs/promises";
          import path from "node:path";

          import { expect, test, type Frame, type Page } from "@playwright/test";

          const evidenceDir =
            process.env.EVIDENCE_DIR ?? "create-autocomplete-current-diagnostic-1fd98472";

          interface Events {
            consoleErrors: string[];
            consoleWarnings: string[];
            pageErrors: string[];
            failedRequests: string[];
            httpErrors: string[];
          }

          function observe(page: Page): Events {
            const events: Events = {
              consoleErrors: [],
              consoleWarnings: [],
              pageErrors: [],
              failedRequests: [],
              httpErrors: [],
            };
            page.on("console", (message) => {
              if (message.type() === "error") events.consoleErrors.push(message.text());
              if (message.type() === "warning") events.consoleWarnings.push(message.text());
            });
            page.on("pageerror", (error) => events.pageErrors.push(error.stack || error.message));
            page.on("requestfailed", (request) => {
              events.failedRequests.push(
                `${request.method()} ${request.url()} :: ${request.failure()?.errorText ?? "unknown"}`,
              );
            });
            page.on("response", (response) => {
              const pageOrigin = page.url().startsWith("http") ? new URL(page.url()).origin : "";
              if (
                pageOrigin &&
                response.status() >= 400 &&
                new URL(response.url()).origin === pageOrigin
              ) {
                events.httpErrors.push(
                  `${response.status()} ${response.request().method()} ${response.url()}`,
                );
              }
            });
            return events;
          }

          async function installFixtures(page: Page) {
            await page.route("**/api/live-account", async (route) => {
              await route.fulfill({
                contentType: "application/json",
                body: JSON.stringify({ authenticated: false }),
              });
            });
            await page.route("**/api/live-now**", async (route) => {
              await route.fulfill({
                contentType: "application/json",
                body: JSON.stringify({
                  authenticated: false,
                  generatedAt: "2026-08-08T08:00:00.000Z",
                  matchingOpportunityCount: 0,
                  profile: {
                    causes: [],
                    weightedCauses: [],
                    openToPayment: null,
                    openToPledges: null,
                    signalSources: [],
                    learningEnabled: true,
                  },
                  recentChanges: [],
                  recommendations: [],
                  ownedOpportunities: [],
                  ownedOpportunityCount: 0,
                  status: "signed_out",
                  routePlanner: {
                    status: "signed_out",
                    checkedAt: "2026-08-08T08:00:00.000Z",
                    profile: {},
                    needsMoreInput: [],
                    routes: [],
                    comparison: null,
                    candidateCount: 0,
                  },
                }),
              });
            });
            await page.route("**/api/nonprofits/search**", async (route) => {
              const query = new URL(route.request().url()).searchParams.get("q") ?? "";
              await route.fulfill({
                contentType: "application/json",
                body: JSON.stringify({
                  query,
                  results: /red cross/i.test(query)
                    ? [
                        {
                          label: "American National Red Cross",
                          description: "501(c)(3) charity · Washington, DC · EIN 53-0196605",
                          aliases: ["American Red Cross"],
                          kind: "organization",
                          source: "ProPublica Nonprofit Explorer / IRS",
                          ein: "53-0196605",
                          profileUrl:
                            "https://projects.propublica.org/nonprofits/organizations/530196605",
                          subsection: 3,
                          score: 120,
                        },
                      ]
                    : [],
                  source: "ProPublica Nonprofit Explorer / IRS",
                }),
              });
            });
          }

          async function openCreateThroughLegacyEntry(page: Page) {
            await page.goto("/moral-trade-live.html#trade", { waitUntil: "domcontentloaded" });
            await expect(page).toHaveURL(/\/trades\/new(?:[?#]|$)/, { timeout: 30_000 });
            const iframe = page.locator('iframe[title="Moral Trade Create"]');
            await expect(iframe).toBeVisible({ timeout: 30_000 });
            const handle = await iframe.elementHandle();
            const frame = await handle?.contentFrame();
            if (!frame) throw new Error("Moral Trade Create frame did not become available");
            await expect(frame.locator("body")).not.toBeEmpty({ timeout: 30_000 });
            await frame.waitForTimeout(500);
            return frame;
          }

          async function currentAutocomplete(frame: Frame) {
            const candidates = [
              frame.locator("[data-mtg-action-autocomplete]"),
              frame.locator(".action-autocomplete input"),
              frame.locator('input[role="combobox"]'),
            ];

            for (const locator of candidates) {
              const count = await locator.count();
              for (let index = 0; index < count; index += 1) {
                const item = locator.nth(index);
                if (await item.isVisible().catch(() => false)) return item;
              }
            }
            return null;
          }

          async function snapshot(frame: Frame) {
            return frame.evaluate(() => {
              const visible = (element: Element) => {
                const html = element as HTMLElement;
                const rect = html.getBoundingClientRect();
                const style = getComputedStyle(html);
                return (
                  style.display !== "none" &&
                  style.visibility !== "hidden" &&
                  Number(style.opacity) !== 0 &&
                  rect.width > 0 &&
                  rect.height > 0
                );
              };
              const summarize = (element: Element) => {
                const html = element as HTMLElement;
                const rect = html.getBoundingClientRect();
                return {
                  tag: element.tagName.toLowerCase(),
                  id: html.id,
                  className: html.className,
                  text: (html.textContent ?? "").replace(/\s+/g, " ").trim().slice(0, 2_000),
                  value:
                    element instanceof HTMLInputElement ||
                    element instanceof HTMLTextAreaElement ||
                    element instanceof HTMLSelectElement
                      ? element.value
                      : null,
                  visible: visible(element),
                  rect: { x: rect.x, y: rect.y, width: rect.width, height: rect.height },
                  attributes: Object.fromEntries(
                    [...element.attributes].map((attribute) => [attribute.name, attribute.value]),
                  ),
                  outerHTML: html.outerHTML.slice(0, 12_000),
                };
              };

              const controls = [
                ...document.querySelectorAll(
                  'input, textarea, select, button, a[href], [role="option"], [role="combobox"], [role="listbox"]',
                ),
              ].slice(0, 300).map(summarize);
              const relevantData = [...document.querySelectorAll("*")]
                .flatMap((element) =>
                  [...element.attributes]
                    .filter(
                      (attribute) =>
                        attribute.name.startsWith("data-mtg-") ||
                        attribute.name.startsWith("data-mt-") ||
                        attribute.name === "data-testid",
                    )
                    .map((attribute) => ({
                      tag: element.tagName.toLowerCase(),
                      name: attribute.name,
                      value: attribute.value,
                      text: (element.textContent ?? "")
                        .replace(/\s+/g, " ")
                        .trim()
                        .slice(0, 400),
                    })),
                )
                .slice(0, 600);

              return {
                url: location.href,
                title: document.title,
                bodyText: (document.body.textContent ?? "").replace(/\s+/g, " ").trim().slice(0, 20_000),
                headings: [...document.querySelectorAll("h1, h2, h3")].map(summarize),
                actionAutocomplete: [
                  ...document.querySelectorAll("[data-mtg-action-autocomplete]"),
                ].map(summarize),
                actionOptions: [...document.querySelectorAll("[data-mtg-action-options]")].map(
                  summarize,
                ),
                autocompleteContainers: [...document.querySelectorAll(".action-autocomplete")].map(
                  summarize,
                ),
                comboboxes: [...document.querySelectorAll('[role="combobox"]')].map(summarize),
                listboxes: [...document.querySelectorAll('[role="listbox"]')].map(summarize),
                options: [...document.querySelectorAll('[role="option"]')].map(summarize),
                controls,
                relevantData,
                legacyClauseCount: document.querySelectorAll(".clause").length,
                legacyTokenCount: document.querySelectorAll('.token[contenteditable="true"]').length,
                legacyOfferTypeCount: document.querySelectorAll("[data-mt-offer-type]").length,
                dimensions: {
                  innerWidth: window.innerWidth,
                  clientWidth: document.documentElement.clientWidth,
                  scrollWidth: document.documentElement.scrollWidth,
                  innerHeight: window.innerHeight,
                  scrollHeight: document.documentElement.scrollHeight,
                },
              };
            });
          }

          async function record(
            page: Page,
            frame: Frame,
            events: Events,
            label: string,
            extra: Record<string, unknown> = {},
          ) {
            await mkdir(evidenceDir, { recursive: true });
            const state = await snapshot(frame);
            await writeFile(
              path.join(evidenceDir, `${label}.json`),
              `${JSON.stringify(
                {
                  label,
                  recordedAt: new Date().toISOString(),
                  outerUrl: page.url(),
                  state,
                  events: structuredClone(events),
                  extra,
                },
                null,
                2,
              )}\n`,
              "utf8",
            );
            await page.screenshot({ path: path.join(evidenceDir, `${label}.png`), fullPage: true });
          }

          async function exerciseAutocomplete(page: Page, frame: Frame, events: Events, prefix: string) {
            const input = await currentAutocomplete(frame);
            if (!input) {
              await record(page, frame, events, `${prefix}-no-autocomplete`, {
                attempted: false,
                reason: "No visible current action autocomplete was present",
              });
              return;
            }

            const initial = {
              placeholder: await input.getAttribute("placeholder"),
              ariaLabel: await input.getAttribute("aria-label"),
              ariaControls: await input.getAttribute("aria-controls"),
              ariaExpanded: await input.getAttribute("aria-expanded"),
              role: await input.getAttribute("role"),
            };
            await record(page, frame, events, `${prefix}-initial`, { initial });

            await input.fill("write");
            await frame.waitForTimeout(400);
            const optionsAfterWrite = await frame
              .locator('[role="option"], [data-mtg-action-options] button, [data-mtg-action-options] li')
              .allTextContents();
            await record(page, frame, events, `${prefix}-write-suggestions`, {
              initial,
              optionsAfterWrite,
            });

            await input.press("ArrowDown");
            await frame.waitForTimeout(100);
            const activeAfterArrow = await input.getAttribute("aria-activedescendant");
            await input.press("Enter");
            await frame.waitForTimeout(300);
            await record(page, frame, events, `${prefix}-after-keyboard-selection`, {
              activeAfterArrow,
              valueAfterEnter: await input.inputValue(),
            });

            await input.fill("donate");
            await frame.waitForTimeout(300);
            await input.press("Escape");
            await frame.waitForTimeout(100);
            await record(page, frame, events, `${prefix}-after-escape`, {
              valueAfterEscape: await input.inputValue(),
              expandedAfterEscape: await input.getAttribute("aria-expanded"),
            });

            await input.fill("volunteer");
            await frame.waitForTimeout(300);
            const heading = frame.locator("h1, h2").first();
            if (await heading.isVisible().catch(() => false)) await heading.click();
            await frame.waitForTimeout(100);
            await record(page, frame, events, `${prefix}-after-outside-click`, {
              valueAfterOutsideClick: await input.inputValue(),
              expandedAfterOutsideClick: await input.getAttribute("aria-expanded"),
            });
          }

          test("records the current desktop Create action autocomplete reached from the legacy Trade hash", async ({
            page,
          }) => {
            const events = observe(page);
            await installFixtures(page);
            await page.setViewportSize({ width: 1440, height: 1000 });
            const frame = await openCreateThroughLegacyEntry(page);
            await exerciseAutocomplete(page, frame, events, "desktop");
          });

          test("records the current mobile Create autocomplete and viewport contract", async ({ page }) => {
            const events = observe(page);
            await installFixtures(page);
            await page.setViewportSize({ width: 390, height: 844 });
            const frame = await openCreateThroughLegacyEntry(page);
            await exerciseAutocomplete(page, frame, events, "mobile");
          });
          TS

          npx playwright test tests/create-autocomplete-current-diagnostic-1fd98472.spec.ts --list \
            > "$EVIDENCE_DIR/test-list.txt"

      - name: Run current Create autocomplete diagnostic
        shell: bash
        run: |
          set -o pipefail
          rm -rf .next
          npx playwright test tests/create-autocomplete-current-diagnostic-1fd98472.spec.ts \
            --workers=1 --reporter=line \
            2>&1 | tee "$EVIDENCE_DIR/playwright.log"

      - name: Upload immutable diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: create-autocomplete-current-diagnostic-1fd98472
          path: |
            create-autocomplete-current-diagnostic-1fd98472
            test-results
          if-no-files-found: error
          retention-days: 14
