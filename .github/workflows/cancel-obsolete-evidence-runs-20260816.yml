name: Cancel obsolete integration evidence runs

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/cancel-obsolete-evidence-runs-20260816.yml

permissions:
  actions: write
  contents: read

concurrency:
  group: cancel-obsolete-evidence-runs-20260816
  cancel-in-progress: true

jobs:
  cancel:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'integration/evaluator-core-loop-current-main-20260815'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_BRANCH: integration/evaluator-core-loop-current-main-20260815
      TARGET_WORKFLOW_ID: '323204241'
    steps:
      - name: Cancel every nonterminal obsolete run for this branch
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t run_ids < <(
            gh api --paginate \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows/${TARGET_WORKFLOW_ID}/runs?per_page=100" \
              --jq ".workflow_runs[] | select(.head_branch == \"${TARGET_BRANCH}\") | select(.status != \"completed\") | .id" \
              | sort -n -u
          )
          printf 'obsolete_run_count=%s\n' "${#run_ids[@]}" | tee cancellation-summary.txt
          for run_id in "${run_ids[@]}"; do
            printf 'cancelling=%s\n' "$run_id" | tee -a cancellation-summary.txt
            gh api --method POST \
              "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel" \
              >/dev/null || true
          done
          for attempt in $(seq 1 30); do
            remaining=0
            for run_id in "${run_ids[@]}"; do
              status="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq .status)"
              printf 'status[%s]=%s\n' "$run_id" "$status" | tee -a cancellation-summary.txt
              if [[ "$status" != "completed" ]]; then
                remaining=$((remaining + 1))
              fi
            done
            if [[ "$remaining" = "0" ]]; then
              exit 0
            fi
            sleep 2
          done
          echo 'One or more obsolete runs did not become terminal.' >&2
          exit 1

      - name: Upload cancellation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: obsolete-evidence-run-cancellation-${{ github.event.pull_request.head.sha }}
          retention-days: 7
          if-no-files-found: warn
          path: cancellation-summary.txt
