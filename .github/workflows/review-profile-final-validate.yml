name: Validate review-profile release candidate
on:
  push:
    branches: [ops/review-profile-cleanup-20260923]
    paths: [.github/workflows/review-profile-final-validate.yml]
permissions:
  contents: write
concurrency:
  group: review-profile-cleanup-validation
  cancel-in-progress: false
jobs:
  validate:
    if: github.repository == 'ghuser29384/Website2'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      BASE_SHA: 80892b66b897e5b74d73c27f6d318cf96defad79
      CANDIDATE_TREE: 63287f398a193c88855c75d1a73d709ebf5e2c9a
      FINAL_TREE: 6adeb4513d3b757737c47949e3093efe7ca327b5
      TARGET_BRANCH: cleanup/review-profile-boundaries-verified-20260923
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 83d0549ac7503519c62f5b8d1c61f460710ed283
          fetch-depth: 0
      - name: Extract pinned replay and command definitions
        run: |
          set -euo pipefail
          git show 83d0549ac7503519c62f5b8d1c61f460710ed283:.github/workflows/review-profile-verified-validate.yml > "$RUNNER_TEMP/prior.yml"
          ruby -r yaml -r json -e 'puts YAML.load_file(ARGV[0]).to_json' "$RUNNER_TEMP/prior.yml" > "$RUNNER_TEMP/prior.json"
          python - <<'PY'
          import os
          from pathlib import Path
          Path(os.environ['RUNNER_TEMP'],'run-pinned-step.py').write_text('''import json,os,sys,subprocess
          from pathlib import Path
          spec=json.loads((Path(os.environ['RUNNER_TEMP'])/'prior.json').read_text())
          step=next(s for s in spec['jobs']['validate']['steps'] if s.get('name')==sys.argv[1])
          subprocess.run(['bash','-euo','pipefail','-c',step['run']],check=True)
          ''')
          PY
          git checkout --detach "$BASE_SHA"
      - name: Retrieve pinned reviewed bundles and exact test-only delta
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('node:fs'),crypto=require('node:crypto');
            const spec=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/prior.json','utf8'));
            const step=spec.jobs.validate.steps.find(s=>s.name==='Retrieve exact reviewed bundles');
            if(!step?.with?.script)throw new Error('Missing pinned source replay');
            const AsyncFunction=Object.getPrototypeOf(async function(){}).constructor;
            await new AsyncFunction('require','github','context','core','process',step.with.script)(require,github,context,core,process);
            const {data}=await github.rest.git.getBlob({...context.repo,file_sha:'d5ecace8f0249c80c65218b25ab309c867bf0242'});
            const patch=Buffer.from(data.content,'base64');
            if(crypto.createHash('sha256').update(patch).digest('hex')!=='c30a4065636481688e6b184e03789ff1f33023d055f66a5c1ff1f69f264efc18')throw new Error('Test isolation delta changed');
            fs.writeFileSync(process.env.RUNNER_TEMP+'/visual-analytics.patch',patch);
      - name: Reproduce and freeze exact forty-file scope
        run: |
          set -euo pipefail
          python "$RUNNER_TEMP/run-pinned-step.py" 'Reproduce exact 39-file candidate including restoration regression'
          test "$(git write-tree)" = "$CANDIDATE_TREE"
          git apply --index "$RUNNER_TEMP/visual-analytics.patch"
          test "$(git write-tree)" = "$FINAL_TREE"
          test "$(git diff --cached --name-only | wc -l)" -eq 40
          git diff --exit-code
          git diff --cached --check
          git diff --cached --stat | tee "$RUNNER_TEMP/rp-evidence/diff-stat.txt"
          git diff --cached --name-status > "$RUNNER_TEMP/rp-evidence/paths.txt"
          git write-tree > "$RUNNER_TEMP/rp-evidence/candidate-tree.txt"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install exact dependencies
        run: npm ci
      - name: Runtime and monitor tests, lint, types and build
        env:
          NEXT_PUBLIC_SITE_URL: https://www.moraltrade.org
          SITE_URL: https://www.moraltrade.org
          VERCEL: '1'
          VERCEL_ENV: production
        run: python "$RUNNER_TEMP/run-pinned-step.py" 'Runtime and monitor tests, lint, types and build'
      - name: Focused rendered checks and real analytics opt-out contract
        env:
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3210
          SITE_URL: http://127.0.0.1:3210
          PLAYWRIGHT_HTML_OPEN: never
        run: |
          set -euo pipefail
          python "$RUNNER_TEMP/run-pinned-step.py" 'Focused rendered checks'
          npx playwright test --config=playwright.release.config.ts tests/sitewide-canonical-visual-system.spec.ts --grep 'real analytics opt-out boundary' --reporter=line > "$RUNNER_TEMP/rp-evidence/visual-opt-out.log" 2>&1
      - name: Full configured browser gate without exclusions or rate-limit changes
        env:
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3210
          SITE_URL: http://127.0.0.1:3210
          PLAYWRIGHT_HTML_OPEN: never
        run: python "$RUNNER_TEMP/run-pinned-step.py" 'Full unchanged configured browser gate'
      - name: Synthetic A-B-guest isolation without accounts or transaction writes
        env:
          CI: 'false'
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3210
          SITE_URL: http://127.0.0.1:3210
          NEXT_PUBLIC_SUPABASE_URL: ''
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ''
          MORAL_TRADE_DISABLE_SUPABASE: 'true'
          PLAYWRIGHT_USE_PRODUCTION_SERVER: '0'
        run: python "$RUNNER_TEMP/run-pinned-step.py" 'Synthetic A-B-guest isolation without accounts or transaction writes'
      - name: Publish only the exact validated candidate
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE_SHA"
          test -z "$(git ls-remote origin "refs/heads/$TARGET_BRANCH")"
          test ! -e src/app/qa-profile-draft-boundary
          test ! -e tests/qa-profile-draft-boundary.spec.ts
          test "$(git write-tree)" = "$FINAL_TREE"
          git diff --exit-code
          git diff --cached --check
          git checkout -b "$TARGET_BRANCH"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Correct review labels and simplify account-bound profile setup'
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/rp-evidence/product-identity.txt"
      - name: Preserve complete verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-profile-final-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rp-evidence/
          retention-days: 7
          if-no-files-found: warn
