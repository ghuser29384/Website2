name: Verify sitewide account identity

on:
  pull_request:
    paths:
      - ".github/workflows/verify-sitewide-account-identity.yml"
      - "public/moral-trade-account-identity.js"
      - "public/moral-trade-discover.html"
      - "public/moral-trade-live.html"
      - "public/moral-trade-production.html"
      - "src/app/api/live-account/route.ts"
      - "src/sitewide-account-identity.test.ts"
      - "tests/exact-account-identity-all-pages.spec.ts"

permissions:
  contents: read

concurrency:
  group: sitewide-account-identity-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: |
          node --check public/moral-trade-account-identity.js
          node --check public/moral-trade-live-account.js

      - name: Run focused lint
        run: npx eslint public/moral-trade-account-identity.js src/sitewide-account-identity.test.ts tests/exact-account-identity-all-pages.spec.ts

      - name: Run focused source contracts
        run: node --import tsx --test src/sitewide-account-identity.test.ts

      - name: Build production application
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run account identity browser coverage
        run: npx playwright test tests/exact-account-identity-all-pages.spec.ts --reporter=line
