name: Complete Profile root-prefetch exact gates

on:
  pull_request:
    paths:
      - ".github/workflows/complete-profile-root-prefetch-68cf2136-exact-gates.yml"

permissions:
  contents: read
  statuses: write

concurrency:
  group: complete-profile-root-prefetch-68cf2136-exact-gates
  cancel-in-progress: false

jobs:
  exact-gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      EXPECTED_SHA: 68cf2136ce62b823024963e83503f7af96f229ee
      STATUS_CONTEXT: QA / Complete Profile root-prefetch exact gates
      EVIDENCE_DIR: complete-profile-root-prefetch-exact-gates

    steps:
      - name: Mark exact candidate pending
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${EXPECTED_SHA}" \
            -f state=pending \
            -f context="${STATUS_CONTEXT}" \
            -f description="Running full tests, TypeScript, lint, build, and rendered regressions" \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Check out exact product candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 1

      - name: Verify exact checkout and record metadata
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
          mkdir -p "${EVIDENCE_DIR}"
          jq -n \
            --arg expectedSha "$EXPECTED_SHA" \
            --arg checkedOutSha "$(git rev-parse HEAD)" \
            --arg runUrl "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{expectedSha:$expectedSha,checkedOutSha:$checkedOutSha,runUrl:$runUrl}' \
            > "${EVIDENCE_DIR}/metadata.json"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if npm ci 2>&1 | tee "${EVIDENCE_DIR}/npm-ci.log"; then exit 0; fi
            if [[ "$attempt" == "3" ]]; then exit 1; fi
            sleep $((attempt * 20))
          done

      - name: Parse permanent canary
        shell: bash
        run: node --check .github/scripts/complete-profile-production-canary.mjs 2>&1 | tee "${EVIDENCE_DIR}/canary-syntax.log"

      - name: Run complete source test suite
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee "${EVIDENCE_DIR}/npm-test.log"

      - name: Run absolute TypeScript gate
        shell: bash
        run: |
          set -o pipefail
          npx tsc --noEmit 2>&1 | tee "${EVIDENCE_DIR}/typescript.log"

      - name: Run full ESLint gate
        shell: bash
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee "${EVIDENCE_DIR}/eslint.log"

      - name: Build production application
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee "${EVIDENCE_DIR}/build.log"

      - name: Install Chromium
        shell: bash
        run: |
          set -o pipefail
          npx playwright install --with-deps chromium 2>&1 | tee "${EVIDENCE_DIR}/playwright-install.log"

      - name: Run rendered Complete Profile regressions
        env:
          PLAYWRIGHT_HTML_OPEN: never
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report
        shell: bash
        run: |
          set -o pipefail
          npx playwright test tests/complete-profile-review.spec.ts --reporter=line,html 2>&1 \
            | tee "${EVIDENCE_DIR}/playwright.log"

      - name: Upload exact-gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: complete-profile-root-prefetch-exact-gates-68cf2136
          path: |
            complete-profile-root-prefetch-exact-gates
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish exact-gate result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$JOB_STATUS" == "success" ]]; then
            state=success
            description="Full tests, TypeScript, lint, build, and rendered regressions passed"
          else
            state=failure
            description="Complete Profile exact gates failed; inspect workflow evidence"
          fi
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${EXPECTED_SHA}" \
            -f state="$state" \
            -f context="${STATUS_CONTEXT}" \
            -f description="$description" \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          test "$state" = success
