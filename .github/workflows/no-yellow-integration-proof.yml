name: Integrated no-yellow proof
on:
  push:
    branches: [ops/no-fluorescent-yellow-validation-20260925]
    paths: [.github/workflows/no-yellow-integration-proof.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3210
      SITE_URL: http://127.0.0.1:3210
      PLAYWRIGHT_USE_PRODUCTION_SERVER: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 929d14b0f196522645f76ef0d20b9cf10e2ea043
          fetch-depth: 0
          persist-credentials: false
      - name: Guard integrated source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 929d14b0f196522645f76ef0d20b9cf10e2ea043
          test "$(git rev-parse HEAD^{tree})" = 6807cb3385a0006698987e32bd444b051ef0de3c
          git merge-base --is-ancestor d4d4b25fdf7a46a247838482ce5225163e45a963 HEAD
          git diff --check d4d4b25fdf7a46a247838482ce5225163e45a963 HEAD
          mkdir -p "$RUNNER_TEMP/no-yellow-integration"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Repository gates
        run: |
          set -euo pipefail
          node --import tsx --test src/lib/no-fluorescent-yellow.test.ts src/lib/text-selection-style.test.ts
          npm test
          npm run lint -- --quiet
          npx tsc --noEmit
          npm run build
      - run: npx playwright install --with-deps chromium
      - name: Rendered color scan
        run: |
          set -euo pipefail
          npm run start -- --hostname 127.0.0.1 --port 3210 > "$RUNNER_TEMP/no-yellow-integration/server.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:3210/about >/dev/null && break; sleep 2; done
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { chromium } from '@playwright/test';
          const routes=['/about','/offers?view=live','/create?mode=pool','/pledge-swaps','/trade-controls'];
          const banned=['rgb(225, 246, 91)','rgb(184, 217, 44)','rgb(189, 220, 37)','rgb(162, 170, 22)','rgb(223, 240, 168)','rgb(241, 247, 204)','rgb(200, 221, 113)','rgb(244, 248, 218)','rgb(120, 144, 0)','rgb(116, 136, 0)','rgb(105, 125, 0)','rgb(32, 39, 0)','rgb(48, 59, 0)'];
          const browser=await chromium.launch();
          try {
            for (const width of [1440,390]) {
              const context=await browser.newContext({viewport:{width,height:1000}});
              await context.addCookies([{name:'mt_walkthrough_seen',value:'1',url:'http://127.0.0.1:3210',sameSite:'Lax'},{name:'mt_analytics_opt_out',value:'1',url:'http://127.0.0.1:3210',sameSite:'Lax'}]);
              const page=await context.newPage();
              const errors=[]; page.on('pageerror',e=>errors.push(e.message));
              for (const route of routes) {
                const res=await page.goto('http://127.0.0.1:3210'+route,{waitUntil:'domcontentloaded',timeout:60000});
                assert.ok((res?.status()??200)<400,route);
                const hits=await page.evaluate(banned=>{
                  const set=new Set(banned),hits=[];
                  for(const el of [document.documentElement,document.body,...document.querySelectorAll('*')]){
                    const s=getComputedStyle(el);
                    for(const k of ['backgroundColor','color','borderTopColor','borderRightColor','borderBottomColor','borderLeftColor','outlineColor','fill','stroke']){
                      if(set.has(s[k])) hits.push({k,value:s[k],tag:el.tagName});
                    }
                  }
                  return hits;
                },banned);
                assert.deepEqual(hits,[],route);
                await page.screenshot({path:`${process.env.RUNNER_TEMP}/no-yellow-integration/${route.replace(/[^a-z]+/gi,'-')}-${width}.png`,fullPage:true});
              }
              assert.deepEqual(errors,[]);
              await context.close();
            }
          } finally { await browser.close(); }
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: no-yellow-integration-${{ github.run_id }}
          path: ${{ runner.temp }}/no-yellow-integration
          if-no-files-found: warn
          retention-days: 7
