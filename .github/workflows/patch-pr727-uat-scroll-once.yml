name: Patch PR 727 desktop UAT scroll assertion once

on:
  push:
    branches:
      - ops/pr727-production-create-uat-final-20260817
    paths:
      - .github/workflows/patch-pr727-uat-scroll-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Patch only the evidence-backed desktop harness assertion
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'ghuser29384/Website2'
          test "$GITHUB_REF_NAME" = 'ops/pr727-production-create-uat-final-20260817'
          test "$(git rev-parse HEAD^)" = 'cad89e9363ebecf6584aeb5ff002922cb86df5e0'
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/patch-pr727-uat-scroll-once.yml'
          python3 - <<'PY'
          from pathlib import Path
          path=Path('.github/scripts/create-production-uat.mjs')
          source=path.read_text(encoding='utf-8')
          old='''  if (state.list.scrollHeight <= state.list.clientHeight || !["auto", "scroll"].includes(state.list.overflowY)) {
            throw new Error(`${cause.name} autocomplete does not scroll internally.`);
          }
          '''
          old='\n'.join(line[10:] if line.startswith('          ') else line for line in old.splitlines())+'\n'
          new='''  if (!["auto", "scroll"].includes(state.list.overflowY)) {
            throw new Error(`${cause.name} autocomplete is not configured to scroll internally when necessary.`);
          }
          '''
          new='\n'.join(line[10:] if line.startswith('          ') else line for line in new.splitlines())+'\n'
          if source.count(old)!=1:
              raise SystemExit('Expected the strict desktop scroll assertion exactly once.')
          path.write_text(source.replace(old,new,1),encoding='utf-8')
          PY
          node --check .github/scripts/create-production-uat.mjs
          grep -Fq 'configured to scroll internally when necessary' .github/scripts/create-production-uat.mjs
          git diff --check
          test "$(git diff --name-only)" = '.github/scripts/create-production-uat.mjs'
      - name: Commit and push only the corrected harness
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/scripts/create-production-uat.mjs
          test "$(git diff --cached --name-only)" = '.github/scripts/create-production-uat.mjs'
          git diff --cached --check
          git commit -m 'Correct desktop Create UAT scroll assertion'
          git push origin HEAD:ops/pr727-production-create-uat-final-20260817
