name: PR 704 and PR 724 exact-main production release

on:
  push:
    branches:
      - ops/pr704-pr724-production-release-20260815
    paths:
      - .github/workflows/pr704-pr724-production-release-20260815.yml

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: read
  statuses: write

concurrency:
  group: pr704-pr724-exact-main-production-release
  cancel-in-progress: false

env:
  CONTROLLER_BRANCH: ops/pr704-pr724-production-release-20260815
  EXPECTED_MAIN_SHA: 99247b7a183ed66866429c50f6481fb07fb83461
  PR704_MERGE_SHA: a04d3345fb93f444c74bf5ea6ba795a6934efd20
  PR724_HEAD_SHA: d5406724ec7c16d2e07e4e1819e456069ed117ce
  PR724_MERGE_SHA: 99247b7a183ed66866429c50f6481fb07fb83461
  RELEASE_WORKFLOW: vercel-release.yml
  STATUS_CONTEXT: production-release / PR 704 + PR 724
  EVIDENCE_DIR: /tmp/pr704-pr724-production-release

jobs:
  release-and-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Initialize evidence and pending status
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          gh api "repos/$GITHUB_REPOSITORY/statuses/$EXPECTED_MAIN_SHA" \
            -f state=pending \
            -f context="$STATUS_CONTEXT" \
            -f description='Running exact-main gated release and production smoke' \
            -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null

      - name: Check out the one-shot controller
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Guard exact main, merged PRs, and idle release lane
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'ghuser29384/Website2'
          test "$GITHUB_REF" = "refs/heads/$CONTROLLER_BRANCH"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_MAIN_SHA"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$EXPECTED_MAIN_SHA"

          pr704="$(gh api "repos/$GITHUB_REPOSITORY/pulls/704")"
          pr724="$(gh api "repos/$GITHUB_REPOSITORY/pulls/724")"
          test "$(jq -r .state <<<"$pr704")" = closed
          test "$(jq -r .merged <<<"$pr704")" = true
          test "$(jq -r .merge_commit_sha <<<"$pr704")" = "$PR704_MERGE_SHA"
          test "$(jq -r .state <<<"$pr724")" = closed
          test "$(jq -r .merged <<<"$pr724")" = true
          test "$(jq -r .head.sha <<<"$pr724")" = "$PR724_HEAD_SHA"
          test "$(jq -r .merge_commit_sha <<<"$pr724")" = "$PR724_MERGE_SHA"
          printf '%s\n' "$pr704" > "$EVIDENCE_DIR/pr704.json"
          printf '%s\n' "$pr724" > "$EVIDENCE_DIR/pr724.json"

          git merge-base --is-ancestor "$PR704_MERGE_SHA" "$EXPECTED_MAIN_SHA"
          git merge-base --is-ancestor "$PR724_HEAD_SHA" "$EXPECTED_MAIN_SHA"

          for status in queued in_progress; do
            count="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$RELEASE_WORKFLOW/runs?status=$status&per_page=20" --jq '.total_count')"
            test "$count" = 0
          done

      - name: Dispatch exact production release
        id: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh run list --repo "$GITHUB_REPOSITORY" --workflow "$RELEASE_WORKFLOW" \
            --event workflow_dispatch --limit 100 --json databaseId \
            | jq -r '.[].databaseId' | sort -n > "$EVIDENCE_DIR/release-runs-before.txt"

          gh workflow run "$RELEASE_WORKFLOW" --repo "$GITHUB_REPOSITORY" --ref main \
            -f target=production \
            -f ref=main \
            -f expected_sha="$EXPECTED_MAIN_SHA" \
            -f synthetic_auth_fixture_url=''

          release_run_id=''
          for attempt in $(seq 1 60); do
            candidates="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$RELEASE_WORKFLOW" \
              --event workflow_dispatch --branch main --limit 100 \
              --json databaseId,headSha,createdAt,url)"
            while IFS= read -r candidate; do
              [[ -n "$candidate" ]] || continue
              if ! grep -qx "$candidate" "$EVIDENCE_DIR/release-runs-before.txt"; then
                release_run_id="$candidate"
                break
              fi
            done < <(jq -r --arg sha "$EXPECTED_MAIN_SHA" \
              '[.[] | select(.headSha == $sha)] | sort_by(.createdAt) | reverse | .[].databaseId' \
              <<<"$candidates")
            [[ -n "$release_run_id" ]] && break
            sleep 5
          done

          test -n "$release_run_id"
          printf '%s\n' "$release_run_id" | tee "$EVIDENCE_DIR/release-run-id.txt"
          echo "release_run_id=$release_run_id" >> "$GITHUB_OUTPUT"

      - name: Monitor release and abort on main drift
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN_ID: ${{ steps.dispatch.outputs.release_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          while true; do
            remote_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
            if [[ "$remote_main" != "$EXPECTED_MAIN_SHA" ]]; then
              printf 'main drifted to %s; cancelling release %s\n' "$remote_main" "$RELEASE_RUN_ID" \
                | tee "$EVIDENCE_DIR/main-drift.txt"
              gh run cancel "$RELEASE_RUN_ID" --repo "$GITHUB_REPOSITORY" || true
              exit 1
            fi

            run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN_ID")"
            printf '%s\n' "$run_json" > "$EVIDENCE_DIR/release-run-latest.json"
            status="$(jq -r .status <<<"$run_json")"
            conclusion="$(jq -r '.conclusion // empty' <<<"$run_json")"
            printf '%s %s\n' "$status" "$conclusion"
            if [[ "$status" == completed ]]; then
              test "$conclusion" = success
              break
            fi
            sleep 20
          done

      - name: Capture release jobs and artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN_ID: ${{ steps.dispatch.outputs.release_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN_ID/jobs?per_page=100" \
            > "$EVIDENCE_DIR/release-jobs.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN_ID/artifacts?per_page=100" \
            > "$EVIDENCE_DIR/release-artifacts.json"
          count="$(jq '[.artifacts[] | select(.name | startswith("gated-vercel-release-production-"))] | length' \
            "$EVIDENCE_DIR/release-artifacts.json")"
          test "$count" = 1

      - name: Check out immutable released main
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$EXPECTED_MAIN_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN_SHA"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$EXPECTED_MAIN_SHA"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies and Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm ci 2>&1 | tee "$EVIDENCE_DIR/post-release-npm-ci.log"
          npx playwright install --with-deps chromium 2>&1 | tee "$EVIDENCE_DIR/post-release-playwright-install.log"

      - name: Run canonical production smoke
        shell: bash
        run: |
          set -euo pipefail
          cat > .pr704-pr724-production-smoke.cjs <<'EOF'
          const assert = require('node:assert/strict');
          const fs = require('node:fs/promises');
          const { chromium } = require('@playwright/test');

          const origins = ['https://moraltrade.org', 'https://www.moraltrade.org'];
          const root = `${process.env.EVIDENCE_DIR}/production-smoke`;
          const readyPayload = {
            authenticated: true,
            generatedAt: '2026-08-15T08:41:46.000Z',
            matchingOpportunityCount: 1,
            ownedOpportunities: [],
            ownedOpportunityCount: 0,
            profile: { causes: ['Global health'], weightedCauses: [], learningEnabled: false },
            recentChanges: [],
            recommendations: [{
              id: 'production-smoke-opportunity',
              opportunityType: 'offer',
              href: '/offers/1c6b0e57-bfed-3f29-c51f-6f8c23d1960b',
              ctaLabel: 'Review proposal',
              ownerAlias: 'Production smoke participant',
              offeredCause: 'Global health',
              requestedCause: 'Climate action',
              offerAction: 'Fund a reviewed health project.',
              requestAction: 'Replace one short car trip.',
              verification: 'Review the stated receipt terms.',
              duration: 'One month',
              reason: 'Matches a saved priority',
              reasonDetails: ['Matches Global health'],
            }],
            routePlanner: {
              status: 'ready',
              checkedAt: '2026-08-15T08:41:46.000Z',
              profile: {},
              needsMoreInput: [],
              routes: [],
              comparison: null,
              candidateCount: 1,
            },
            status: 'ready',
          };

          function safeName(value) {
            return value.replace(/^https?:\/\//, '').replace(/[^a-z0-9]+/gi, '-');
          }

          function attachHealth(page) {
            const errors = { console: [], page: [], request: [], http5xx: [] };
            page.on('console', message => {
              if (message.type() === 'error') errors.console.push(message.text());
            });
            page.on('pageerror', error => errors.page.push(String(error)));
            page.on('requestfailed', request => {
              const host = new URL(request.url()).hostname;
              if (host === 'moraltrade.org' || host === 'www.moraltrade.org') {
                errors.request.push(`${request.method()} ${request.url()} :: ${request.failure()?.errorText || 'failed'}`);
              }
            });
            page.on('response', response => {
              const host = new URL(response.url()).hostname;
              if ((host === 'moraltrade.org' || host === 'www.moraltrade.org') && response.status() >= 500) {
                errors.http5xx.push(`${response.status()} ${response.url()}`);
              }
            });
            return errors;
          }

          async function assertNoOverflow(page) {
            const dimensions = await page.evaluate(() => ({
              innerWidth: window.innerWidth,
              scrollWidth: document.documentElement.scrollWidth,
            }));
            assert(dimensions.scrollWidth <= dimensions.innerWidth + 1, JSON.stringify(dimensions));
            return dimensions;
          }

          async function publicAliasScenario(origin, width, height) {
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({
              viewport: { width, height },
              serviceWorkers: 'block',
            });
            await context.addCookies([{
              name: 'mt_walkthrough_seen',
              value: '1',
              domain: '.moraltrade.org',
              path: '/',
              secure: true,
              sameSite: 'Lax',
            }]);
            const page = await context.newPage();
            const errors = attachHealth(page);
            const label = `${safeName(origin)}-${width}x${height}`;

            const pilotResponse = await page.goto(`${origin}/pilot`, {
              waitUntil: 'domcontentloaded',
              timeout: 60_000,
            });
            assert(pilotResponse, 'pilot navigation returned no response');
            assert(pilotResponse.status() < 500, `pilot navigation returned ${pilotResponse.status()}`);
            assert.equal(new URL(page.url()).pathname, '/start');
            await page.getByRole('heading', { level: 1, name: 'Choose a real first action.' }).waitFor({
              state: 'visible',
              timeout: 20_000,
            });
            const startDimensions = await assertNoOverflow(page);
            await page.screenshot({ path: `${root}/${label}-start.png`, fullPage: true });

            const offersResponse = await page.goto(`${origin}/offers?view=live`, {
              waitUntil: 'domcontentloaded',
              timeout: 60_000,
            });
            assert(offersResponse, 'offers navigation returned no response');
            assert(offersResponse.status() < 500, `offers navigation returned ${offersResponse.status()}`);
            await page.locator('form[data-smart-query-surface="offers"]').waitFor({ state: 'visible', timeout: 20_000 });
            await page.locator('[data-authoritative-directory="true"]').waitFor({ state: 'attached', timeout: 20_000 });
            const offersDimensions = await assertNoOverflow(page);
            await page.screenshot({ path: `${root}/${label}-offers.png`, fullPage: true });

            const homeResponse = await page.goto(`${origin}/`, {
              waitUntil: 'domcontentloaded',
              timeout: 60_000,
            });
            assert(homeResponse, 'home navigation returned no response');
            assert(homeResponse.status() < 500, `home navigation returned ${homeResponse.status()}`);
            await page.locator('[data-mt-live-now-state="signed_out"]').waitFor({ state: 'visible', timeout: 30_000 });
            assert.equal(
              (await page.locator('#mt-live-document-heading').textContent())?.trim(),
              'Current opportunities and next actions',
            );
            assert.equal(await page.locator('[data-mt-live-now-recommendation]').count(), 0);
            assert.equal(await page.getByRole('note', { name: 'Recommendation status' }).count(), 0);
            const homeDimensions = await assertNoOverflow(page);
            await page.screenshot({ path: `${root}/${label}-home-signed-out.png`, fullPage: true });

            await page.waitForTimeout(1000);
            assert.deepEqual(errors, { console: [], page: [], request: [], http5xx: [] });
            await fs.writeFile(`${root}/${label}.json`, JSON.stringify({
              origin,
              width,
              height,
              finalUrl: page.url(),
              dimensions: { start: startDimensions, offers: offersDimensions, home: homeDimensions },
              errors,
            }, null, 2));
            await browser.close();
          }

          async function readyHomeScenario() {
            const origin = origins[0];
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({
              viewport: { width: 1440, height: 900 },
              serviceWorkers: 'block',
            });
            await context.addCookies([{
              name: 'mt_walkthrough_seen',
              value: '1',
              domain: '.moraltrade.org',
              path: '/',
              secure: true,
              sameSite: 'Lax',
            }]);
            const page = await context.newPage();
            const errors = attachHealth(page);
            await page.route('**/api/live-now', route => route.fulfill({
              contentType: 'application/json',
              body: JSON.stringify(readyPayload),
            }));
            const response = await page.goto(`${origin}/`, {
              waitUntil: 'domcontentloaded',
              timeout: 60_000,
            });
            assert(response && response.status() < 500);
            await page.locator('[data-mt-live-now-state="ready"]').waitFor({ state: 'visible', timeout: 30_000 });
            assert.equal(
              (await page.locator('#mt-live-document-heading').textContent())?.trim(),
              'Current opportunities and next actions',
            );
            assert.equal(await page.locator('[data-mt-live-now-recommendation]').count(), 1);
            const note = page.getByRole('note', { name: 'Recommendation status' });
            await note.waitFor({ state: 'visible' });
            assert.equal(
              (await note.textContent())?.trim(),
              'Recommendations to review — not agreements, commitments, payments, or verified outcomes.',
            );
            const dimensions = await assertNoOverflow(page);
            await page.screenshot({ path: `${root}/moraltrade-org-ready-home.png`, fullPage: true });
            await page.waitForTimeout(1000);
            assert.deepEqual(errors, { console: [], page: [], request: [], http5xx: [] });
            await fs.writeFile(`${root}/moraltrade-org-ready-home.json`, JSON.stringify({
              origin,
              dimensions,
              errors,
            }, null, 2));
            await browser.close();
          }

          (async () => {
            await fs.mkdir(root, { recursive: true });
            for (const origin of origins) {
              await publicAliasScenario(origin, 1440, 900);
            }
            await publicAliasScenario(origins[0], 390, 844);
            await readyHomeScenario();
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          EOF

          EVIDENCE_DIR="$EVIDENCE_DIR" node .pr704-pr724-production-smoke.cjs \
            2>&1 | tee "$EVIDENCE_DIR/production-smoke.log"
          rm .pr704-pr724-production-smoke.cjs

      - name: Record success summary
        if: success()
        env:
          RELEASE_RUN_ID: ${{ steps.dispatch.outputs.release_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg controller_run "$GITHUB_RUN_ID" \
            --arg release_run "$RELEASE_RUN_ID" \
            --arg main_sha "$EXPECTED_MAIN_SHA" \
            '{repository:$repository,controllerRun:$controller_run,releaseRun:$release_run,mainSha:$main_sha,outcome:"success",checks:["both canonical aliases","pilot redirects to Start","Start action heading","compact Offers shell","signed-out Home truth boundary","ready Home truth boundary","desktop and mobile overflow","browser and HTTP error capture"]}' \
            > "$EVIDENCE_DIR/summary.json"

      - name: Publish final success status
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/statuses/$EXPECTED_MAIN_SHA" \
            -f state=success \
            -f context="$STATUS_CONTEXT" \
            -f description='Exact-main production release and canonical smoke passed' \
            -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null

      - name: Publish failure status
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/statuses/$EXPECTED_MAIN_SHA" \
            -f state=failure \
            -f context="$STATUS_CONTEXT" \
            -f description='Production release or canonical smoke failed closed' \
            -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null

      - name: Upload controller evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr704-pr724-production-controller-${{ github.run_id }}
          path: /tmp/pr704-pr724-production-release
          if-no-files-found: error
          retention-days: 30
