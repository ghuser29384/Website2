name: Audit browser verification
on:
  push:
    branches: [ops/audit-source-20260926]
    paths: [.github/workflows/audit-browser-check-20260926.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      MORAL_TRADE_DISABLE_DEP_REPAIR: '1'
      NEXT_TELEMETRY_DISABLED: '1'
      PLAYWRIGHT_HTML_OPEN: never
      PLAYWRIGHT_USE_PRODUCTION_SERVER: '1'
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3210
      SITE_URL: http://127.0.0.1:3210
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: controller
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: a9aadfbd06b78b977228a849f8deb0a8fcd491b7
          path: candidate
          persist-credentials: false
          fetch-depth: 2
          show-progress: false
      - name: Check and publish seven exact fixture and contract changes
        working-directory: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = ghuser29384/Website2
          test "$(git rev-parse HEAD)" = a9aadfbd06b78b977228a849f8deb0a8fcd491b7
          mkdir -p ../evidence
          python3 - <<'PY'
          import base64,hashlib,lzma,pathlib,subprocess
          patch=lzma.decompress(base64.b64decode(pathlib.Path('../controller/.github/audit-browser-repairs.b64').read_text(),validate=True))
          assert hashlib.sha256(patch).hexdigest()=='60962c73dbc014e97699e8d6a8d6d121f5cf9b139566dc64abbfcb39fb690374'
          pathlib.Path('../evidence/fixture-contracts.patch').write_bytes(patch)
          subprocess.run(['git','apply','--check','../evidence/fixture-contracts.patch'],check=True)
          subprocess.run(['git','apply','../evidence/fixture-contracts.patch'],check=True)
          paths=subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()
          assert sorted(paths)==sorted(['scripts/audit-remediation-fixture.mjs','src/auth-resolution-wiring.test.ts','src/lib/live-account-actions.test.ts','src/live-now-data.test.ts','src/live-operational-retirement.test.ts','src/offers-walkthrough-density.test.ts','src/sitewide-account-identity.test.ts'])
          subprocess.run(['git','add','--',*paths],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          PY
          branch=fix/audit-truth-locale-20260926
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = a9aadfbd06b78b977228a849f8deb0a8fcd491b7
          git config user.name 'ghuser29384'
          git config user.email '262476329+ghuser29384@users.noreply.github.com'
          git commit -m 'Use valid agreement fixtures and test unknown account state explicitly'
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin "HEAD:refs/heads/$branch"
          git rev-parse HEAD > ../evidence/candidate-sha.txt
          git rev-parse 'HEAD^{tree}' > ../evidence/candidate-tree.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: candidate/package-lock.json
      - name: Install packages and run tests
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm test 2>&1 | tee ../evidence/unit-tests.log
          node --import tsx --test src/commitments-portfolio-wiring.test.ts src/commitments-redesign-contract.test.ts src/live-account-data.test.ts src/live-now-data.test.ts src/live-operational-retirement.test.ts src/offers-walkthrough-density.test.ts src/sitewide-account-identity.test.ts 2>&1 | tee ../evidence/source-tests.log
          npm run lint -- --quiet 2>&1 | tee ../evidence/lint.log
      - name: Build and type-check
        id: build
        working-directory: candidate
        env:
          VERCEL: '1'
        shell: bash
        run: |
          set -euo pipefail
          npm run build 2>&1 | tee ../evidence/build.log
          npx tsc --noEmit --pretty false 2>&1 | tee ../evidence/typescript.log
          npx playwright install --with-deps chromium
      - name: Account locale and partial-record UI
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          npx playwright test --config=playwright.audit.config.ts --reporter=line 2>&1 | tee ../evidence/audit-browser.log
      - name: Save account evidence
        if: always()
        run: |
          if test -d candidate/test-results; then cp -r candidate/test-results evidence/audit-test-results; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-account-stage-${{ github.run_id }}
          path: evidence
          retention-days: 14
      - name: Existing Commitments and new homepage browser regressions
        if: always() && steps.build.outcome == 'success'
        working-directory: candidate
        shell: bash
        run: |
          set -o pipefail
          npx playwright test --config=playwright.commitments.config.ts --reporter=line 2>&1 | tee ../evidence/commitments-browser.log
          commitments=${PIPESTATUS[0]}
          cp -r test-results ../evidence/commitments-test-results
          npx playwright test --config=playwright.release.config.ts tests/home-bootstrap-resilience.spec.ts --reporter=line 2>&1 | tee ../evidence/home-browser.log
          home=${PIPESTATUS[0]}
          test "$commitments" -eq 0 && test "$home" -eq 0
      - name: Save browser evidence
        if: always()
        run: |
          if test -d candidate/test-results; then cp -r candidate/test-results evidence/home-test-results; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-browser-stage-${{ github.run_id }}
          path: evidence
          retention-days: 14
