name: Materialize MPGF pool publication non-workflow files 2026-08-06

on:
  push:
    branches:
      - fix/mpgf-pool-publication-materialization-20260806
    paths:
      - ".github/workflows/materialize-mpgf-pool-publication-nonworkflow-20260806.yml"

permissions:
  contents: write

concurrency:
  group: materialize-mpgf-pool-publication-nonworkflow-20260806
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_PARENT: f489be5676e2214324557e8f1efdf2d547d097ab
      TARGET_BRANCH: fix/mpgf-pool-publication-materialization-20260806
      CONTROLLER_PATH: .github/workflows/materialize-mpgf-pool-publication-nonworkflow-20260806.yml
      PAYLOAD_SHA256: 3206573d8e9e8211e206f2b9e070fd4759d5ddd8e93efd8c2b8e7df02e6a1c6d

    steps:
      - name: Check out exact controller commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          ref: ${{ github.sha }}

      - name: Verify isolation and extract reviewed files
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          changed="$(git diff-tree --no-commit-id --name-only -r HEAD | sed '/^$/d')"
          test "$changed" = "$CONTROLLER_PATH"
          cat > /tmp/mpgf-pool-publication-nonworkflow.b64 <<'PAYLOAD'
          
PAYLOAD
          base64 --decode /tmp/mpgf-pool-publication-nonworkflow.b64 > /tmp/mpgf-pool-publication-nonworkflow.tar.gz
          echo "$PAYLOAD_SHA256  /tmp/mpgf-pool-publication-nonworkflow.tar.gz" | sha256sum --check
          tar -xzf /tmp/mpgf-pool-publication-nonworkflow.tar.gz -C "$GITHUB_WORKSPACE"
          test -f supabase/migrations/20260806143000_mpgf_pool_publication_materialization.sql
          test -f supabase/tests/mpgf_pool_publication_materialization.sql
          test -f src/lib/mpgf/pool-publication-materialization.test.ts
          git diff --check

      - name: Commit and push reviewed non-workflow files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            supabase/migrations/20260806143000_mpgf_pool_publication_materialization.sql \
            supabase/tests/mpgf_pool_publication_materialization.sql \
            src/lib/mpgf/pool-publication-materialization.test.ts
          git diff --cached --check
          git commit -m "Materialize approved MPGF pools as public campaigns"
          git push origin "HEAD:$TARGET_BRANCH"
