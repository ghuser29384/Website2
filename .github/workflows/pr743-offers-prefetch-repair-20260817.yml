name: One-use PR 743 Offers prefetch repair

on:
  push:
    branches:
      - ops/pr743-protected-preview-20260817
    paths:
      - .github/workflows/pr743-offers-prefetch-repair-20260817.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact candidate branch
        uses: actions/checkout@v4
        with:
          ref: integration/pr665-current-main-20260817
          fetch-depth: 0

      - name: Guard source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "ghuser29384/Website2"
          test "$(git branch --show-current)" = "integration/pr665-current-main-20260817"
          test "$(git rev-parse HEAD)" = "350370ed1470e08a154e11094e304097fc940523"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "c2d7be6a895f1bb8c9ced1b257eb8b4381d50ac3"
          test "$(git ls-remote origin refs/heads/integration/pr665-current-main-20260817 | awk '{print $1}')" = "350370ed1470e08a154e11094e304097fc940523"

      - name: Apply exact causal repair
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 --decode > /tmp/pr743_patch.py
          python3 /tmp/pr743_patch.py
          git diff --check

      - name: Run focused executable gates
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          node --import tsx --test src/auth-resolution-wiring.test.ts src/proxy.test.ts
          npx eslint src/app/profile/page.tsx src/auth-resolution-wiring.test.ts src/components/marketplace/marketplace-components.tsx
          test "$(git diff --name-only | sort)" = "$(printf '%s\n' src/app/profile/page.tsx src/auth-resolution-wiring.test.ts src/components/marketplace/marketplace-components.tsx | sort)"

      - name: Commit and push without rewriting history
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/integration/pr665-current-main-20260817 | awk '{print $1}')" = "350370ed1470e08a154e11094e304097fc940523"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/profile/page.tsx src/auth-resolution-wiring.test.ts src/components/marketplace/marketplace-components.tsx
          git commit -m "Prevent queryless Offers prefetches on authenticated surfaces"
          git push origin HEAD:refs/heads/integration/pr665-current-main-20260817
          printf 'new_head=%s\nnew_tree=%s\n' "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})" | tee pr743-offers-prefetch-repair.txt

      - name: Upload repair identity
        uses: actions/upload-artifact@v4
        with:
          name: pr743-offers-prefetch-repair-${{ github.run_id }}
          path: pr743-offers-prefetch-repair.txt
          retention-days: 30
