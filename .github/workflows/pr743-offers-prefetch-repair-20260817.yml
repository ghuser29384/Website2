name: One-use PR 743 root prefetch repair

on:
  push:
    branches:
      - ops/pr743-protected-preview-20260817
    paths:
      - .github/workflows/pr743-offers-prefetch-repair-20260817.yml

permissions:
  contents: write

concurrency:
  group: pr743-root-prefetch-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      TARGET_BRANCH: integration/pr665-current-main-20260817
      EXPECTED_MAIN_SHA: 7e993158363710e5fe2c3eaa1cbccdb5cd56c235
      EXPECTED_HEAD_SHA: ebd45a898e83b803681871d95e71162082e68eb8

    steps:
      - name: Check out exact integrated candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Guard source identities
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "ghuser29384/Website2"
          test "$(git branch --show-current)" = "$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$EXPECTED_MAIN_SHA"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | awk '{print $1}')" = "$EXPECTED_HEAD_SHA"
          test "$(git merge-base "$EXPECTED_MAIN_SHA" HEAD)" = "$EXPECTED_MAIN_SHA"

      - name: Suppress both queryless root RSC prefetches and add a source contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workbench_path = Path("src/components/core-trade/trade-draft-workbench.tsx")
          workbench = workbench_path.read_text(encoding="utf-8")
          old = '<Link aria-label="Moral Trade, home" className={styles.brandLink} href="/">'
          new = '<Link aria-label="Moral Trade, home" className={styles.brandLink} href="/" prefetch={false}>'
          if workbench.count(old) != 2:
              raise SystemExit(f"expected exactly two unsuppressed root brand links, found {workbench.count(old)}")
          workbench = workbench.replace(old, new)
          if workbench.count(new) != 2:
              raise SystemExit("failed to suppress both root brand prefetches")
          workbench_path.write_text(workbench, encoding="utf-8")

          test_path = Path("src/auth-resolution-wiring.test.ts")
          source = test_path.read_text(encoding="utf-8")
          anchor = 'test("signed-out trade exit cannot prefetch the document-backed Discover route", () => {\n'
          addition = '''test("trade composer and sign-in gate cannot prefetch the rewritten root route", () => {
  const rootBrandLinks = tradeDraftWorkbenchSource.match(
    /<Link aria-label="Moral Trade, home" className=\{styles\.brandLink\} href="\\/" prefetch=\{false\}>/gu,
  );
  assert.equal(rootBrandLinks?.length, 2);
  assert.doesNotMatch(
    tradeDraftWorkbenchSource,
    /<Link aria-label="Moral Trade, home" className=\{styles\.brandLink\} href="\\/">/u,
  );
});

'''
          if source.count(anchor) != 1:
              raise SystemExit("auth-resolution wiring insertion anchor changed")
          if 'trade composer and sign-in gate cannot prefetch the rewritten root route' in source:
              raise SystemExit("root prefetch contract already exists")
          test_path.write_text(source.replace(anchor, addition + anchor, 1), encoding="utf-8")
          PY

      - name: Run focused executable verification
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          node --import tsx --test src/auth-resolution-wiring.test.ts src/proxy.test.ts
          npx eslint src/auth-resolution-wiring.test.ts src/components/core-trade/trade-draft-workbench.tsx
          git diff --check
          test "$(git diff --name-only | sort)" = "$(printf '%s\n' src/auth-resolution-wiring.test.ts src/components/core-trade/trade-draft-workbench.tsx | sort)"

      - name: Commit and push without rewriting history
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | awk '{print $1}')" = "$EXPECTED_HEAD_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/auth-resolution-wiring.test.ts src/components/core-trade/trade-draft-workbench.tsx
          git commit -m "Prevent trade surfaces from prefetching rewritten root"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          printf 'new_head=%s\nnew_tree=%s\n' "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})" | tee pr743-root-prefetch-repair.txt

      - name: Upload repair identity
        uses: actions/upload-artifact@v4
        with:
          name: pr743-root-prefetch-repair-${{ github.run_id }}
          path: pr743-root-prefetch-repair.txt
          retention-days: 30
