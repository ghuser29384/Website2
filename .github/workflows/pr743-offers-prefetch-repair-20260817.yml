name: One-use PR 743 latest-main integration

on:
  push:
    branches:
      - ops/pr743-protected-preview-20260817
    paths:
      - .github/workflows/pr743-offers-prefetch-repair-20260817.yml

permissions:
  contents: write

concurrency:
  group: pr743-latest-main-integration
  cancel-in-progress: false

env:
  TARGET_BRANCH: integration/pr665-current-main-20260817
  EXPECTED_OLD_HEAD: 4e56686e37a872ebe4dbf9752ef2201c81beb168
  EXPECTED_MAIN_SHA: 7e993158363710e5fe2c3eaa1cbccdb5cd56c235

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact candidate branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Guard source identities and disjoint main movement
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "ghuser29384/Website2"
          test "$(git branch --show-current)" = "$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$EXPECTED_OLD_HEAD"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | awk '{print $1}')" = "$EXPECTED_OLD_HEAD"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$EXPECTED_MAIN_SHA"
          test "$(git merge-base "$EXPECTED_MAIN_SHA" HEAD)" = "c2d7be6a895f1bb8c9ced1b257eb8b4381d50ac3"

          expected_main_delta="$(printf '%s\n' \
            .github/workflows/feed-learning-readiness.yml \
            docs/feed/learned-ranking-readiness.md \
            src/feed-learned-ranking-release-gate.test.ts \
            src/lib/feed/learned-ranking-readiness.test.ts \
            src/lib/feed/learned-ranking-readiness.ts \
            | sort)"
          actual_main_delta="$(git diff --name-only c2d7be6a895f1bb8c9ced1b257eb8b4381d50ac3..."$EXPECTED_MAIN_SHA" | sort)"
          test "$actual_main_delta" = "$expected_main_delta"

          expected_candidate_delta="$(printf '%s\n' \
            playwright.auth-resolution.config.ts \
            scripts/auth-resolution-supabase.mjs \
            src/app/profile/page.tsx \
            src/auth-resolution-wiring.test.ts \
            src/components/core-trade/trade-draft-workbench.tsx \
            src/components/marketplace/marketplace-components.tsx \
            src/lib/app-data.ts \
            src/lib/auth-resolution.test.ts \
            src/lib/auth-resolution.ts \
            src/lib/supabase/server.ts \
            tests/auth-resolution-delayed.auth.ts \
            | sort)"
          actual_candidate_delta="$(git diff --name-only c2d7be6a895f1bb8c9ced1b257eb8b4381d50ac3...HEAD | sort)"
          test "$actual_candidate_delta" = "$expected_candidate_delta"
          test -z "$(comm -12 <(printf '%s\n' "$expected_main_delta") <(printf '%s\n' "$expected_candidate_delta"))"

      - name: Merge exact latest main conventionally
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-ff "$EXPECTED_MAIN_SHA" \
            -m "Merge latest main into PR #743 auth-resolution candidate"

          test "$(git rev-parse HEAD^1)" = "$EXPECTED_OLD_HEAD"
          test "$(git rev-parse HEAD^2)" = "$EXPECTED_MAIN_SHA"
          test "$(git merge-base "$EXPECTED_MAIN_SHA" HEAD)" = "$EXPECTED_MAIN_SHA"

          expected_candidate_delta="$(printf '%s\n' \
            playwright.auth-resolution.config.ts \
            scripts/auth-resolution-supabase.mjs \
            src/app/profile/page.tsx \
            src/auth-resolution-wiring.test.ts \
            src/components/core-trade/trade-draft-workbench.tsx \
            src/components/marketplace/marketplace-components.tsx \
            src/lib/app-data.ts \
            src/lib/auth-resolution.test.ts \
            src/lib/auth-resolution.ts \
            src/lib/supabase/server.ts \
            tests/auth-resolution-delayed.auth.ts \
            | sort)"
          actual_candidate_delta="$(git diff --name-only "$EXPECTED_MAIN_SHA"...HEAD | sort)"
          test "$actual_candidate_delta" = "$expected_candidate_delta"

          while IFS= read -r path; do
            test "$(git rev-parse "HEAD:$path")" = "$(git rev-parse "$EXPECTED_OLD_HEAD:$path")"
          done <<< "$expected_candidate_delta"

          while IFS= read -r path; do
            test "$(git rev-parse "HEAD:$path")" = "$(git rev-parse "$EXPECTED_MAIN_SHA:$path")"
          done <<'PATHS'
          .github/workflows/feed-learning-readiness.yml
          docs/feed/learned-ranking-readiness.md
          src/feed-learned-ranking-release-gate.test.ts
          src/lib/feed/learned-ranking-readiness.test.ts
          src/lib/feed/learned-ranking-readiness.ts
          PATHS

          git diff --check "$EXPECTED_MAIN_SHA"...HEAD
          {
            printf 'old_head=%s\n' "$EXPECTED_OLD_HEAD"
            printf 'main=%s\n' "$EXPECTED_MAIN_SHA"
            printf 'integrated_head=%s\n' "$(git rev-parse HEAD)"
            printf 'integrated_tree=%s\n' "$(git rev-parse HEAD^{tree})"
          } | tee pr743-latest-main-integration.txt

      - name: Push only if branch remains unchanged
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | awk '{print $1}')" = "$EXPECTED_OLD_HEAD"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"

      - name: Upload integration identity
        uses: actions/upload-artifact@v4
        with:
          name: pr743-latest-main-integration-${{ github.run_id }}
          path: pr743-latest-main-integration.txt
          retention-days: 30
