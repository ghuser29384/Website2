name: One-time dispatch exact PR 402 production release

on:
  push:
    branches:
      - ops/dispatch-pr402-production-20260802
    paths:
      - .github/workflows/dispatch-pr402-production-once.yml

permissions:
  contents: write
  actions: write
  pull-requests: write

concurrency:
  group: dispatch-pr402-production-once
  cancel-in-progress: false

env:
  CONTROLLER_PATH: .github/workflows/dispatch-pr402-production-once.yml
  CONTROLLER_BRANCH: ops/dispatch-pr402-production-20260802
  EXPECTED_MAIN: eb71dce7990d1476fc6e4731e1bcd7f3afd640f9
  TARGET_WORKFLOW: vercel-release.yml

jobs:
  dispatch:
    if: github.repository == 'ghuser29384/Website2' && github.actor == 'ghuser29384'
    runs-on: ubuntu-24.04
    timeout-minutes: 150

    steps:
      - name: Check out exact controller commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          token: ${{ github.token }}

      - name: Guard exact merged main and controller scope
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'ghuser29384/Website2'
          test "$GITHUB_REF" = "refs/heads/$CONTROLLER_BRANCH"
          changed="$(git diff-tree --no-commit-id --name-only -r HEAD | sed '/^$/d')"
          test "$changed" = "$CONTROLLER_PATH"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$EXPECTED_MAIN"

      - name: Remove one-time controller from its operations branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          blob_sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/$CONTROLLER_PATH?ref=$CONTROLLER_BRANCH" --jq .sha)"
          jq -n --arg message 'Remove one-time PR 402 production dispatcher' --arg sha "$blob_sha" --arg branch "$CONTROLLER_BRANCH" '{message:$message,sha:$sha,branch:$branch}' \
            | gh api --method DELETE "repos/$GITHUB_REPOSITORY/contents/$CONTROLLER_PATH" --input - >/dev/null

      - name: Announce exact production dispatch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          controller_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          gh pr comment 402 --repo "$GITHUB_REPOSITORY" --body "Dispatching the permanent gated production release workflow for exact merged main commit \`$EXPECTED_MAIN\` to canonical Vercel project \`moraltrade-site\`. Controller: $controller_url"

      - name: Dispatch permanent gated production release and capture its run
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dispatched_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run "$TARGET_WORKFLOW" \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f target=production \
            -f ref=main \
            -f expected_sha="$EXPECTED_MAIN"

          run_id=''
          run_url=''
          for attempt in $(seq 1 40); do
            runs="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$TARGET_WORKFLOW" --event workflow_dispatch --limit 20 --json databaseId,createdAt,url,status,conclusion)"
            run_id="$(jq -r --arg t "$dispatched_at" '[.[] | select(.createdAt >= $t)] | sort_by(.createdAt) | reverse | .[0].databaseId // empty' <<<"$runs")"
            run_url="$(jq -r --arg t "$dispatched_at" '[.[] | select(.createdAt >= $t)] | sort_by(.createdAt) | reverse | .[0].url // empty' <<<"$runs")"
            if [[ -n "$run_id" && -n "$run_url" ]]; then break; fi
            sleep 3
          done
          test -n "$run_id"
          test -n "$run_url"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "run_url=$run_url" >> "$GITHUB_OUTPUT"
          gh pr comment 402 --repo "$GITHUB_REPOSITORY" --body "Permanent gated production release run registered for exact merged commit \`$EXPECTED_MAIN\`: $run_url"

      - name: Wait for permanent gated production release completion
        id: wait
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN_ID: ${{ steps.release.outputs.run_id }}
        run: |
          set -euo pipefail
          set +e
          gh run watch "$RELEASE_RUN_ID" --repo "$GITHUB_REPOSITORY" --exit-status --interval 10
          watch_status=$?
          set -e
          result="$(gh run view "$RELEASE_RUN_ID" --repo "$GITHUB_REPOSITORY" --json status,conclusion,url)"
          printf '%s\n' "$result" > pr402-production-release-run.json
          conclusion="$(jq -r .conclusion <<<"$result")"
          status="$(jq -r .status <<<"$result")"
          url="$(jq -r .url <<<"$result")"
          echo "watch_status=$watch_status" >> "$GITHUB_OUTPUT"
          echo "conclusion=$conclusion" >> "$GITHUB_OUTPUT"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          test "$watch_status" -eq 0
          test "$status" = 'completed'
          test "$conclusion" = 'success'

      - name: Report permanent production release result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_URL: ${{ steps.release.outputs.run_url }}
          RELEASE_CONCLUSION: ${{ steps.wait.outputs.conclusion }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_CONCLUSION" == 'success' ]]; then
            gh pr comment 402 --repo "$GITHUB_REPOSITORY" --body "Permanent gated production release workflow passed for exact merged commit \`$EXPECTED_MAIN\`. Complete repository, lint, TypeScript, production-build, and rendered-browser gates completed before one prebuilt production deployment to canonical project \`moraltrade-site\`. Run: $RELEASE_URL"
          else
            gh pr comment 402 --repo "$GITHUB_REPOSITORY" --body "Permanent gated production release workflow did not pass for exact merged commit \`$EXPECTED_MAIN\`. Production verification is incomplete. Run: ${RELEASE_URL:-unavailable}"
          fi

      - name: Upload dispatch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr402-production-release-dispatch-${{ github.run_id }}
          path: pr402-production-release-run.json
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce successful permanent production release
        if: always()
        shell: bash
        run: test "${{ steps.wait.outputs.conclusion }}" = 'success'
