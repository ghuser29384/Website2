name: Temporary materialize evidence credibility shadow v2

on:
  push:
    branches:
      - feature/evidence-credibility-shadow-v2-20260810
    paths:
      - .github/workflows/materialize-evidence-credibility-shadow-v2.yml
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
    paths:
      - .github/workflows/materialize-evidence-credibility-shadow-v2.yml

permissions:
  contents: write

concurrency:
  group: materialize-evidence-credibility-shadow-v2
  cancel-in-progress: false

jobs:
  materialize:
    if: github.repository == 'ghuser29384/Website2'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/evidence-credibility-shadow-v2-20260810
          fetch-depth: 0

      - name: Guard source branch and base ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}" = "feature/evidence-credibility-shadow-v2-20260810"
          git merge-base --is-ancestor 0778577c98c7a86417057caeb939c01f77e22c89 HEAD
          test "$(find .github/materialize-evidence-shadow -maxdepth 1 -type f -name 'chunk-*.b64' | wc -l)" -eq 5
          test -f .github/workflows/evidence-credibility-shadow-qa.yml

      - name: Reconstruct and verify exact archive
        shell: bash
        run: |
          set -euo pipefail
          expected_sha="dee73a8f24057acf17d2111d7f991c0c31263204fbb07ec695822179f5599ba0"
          cat .github/materialize-evidence-shadow/chunk-*.b64 > /tmp/evidence-shadow.tar.gz.b64
          base64 --decode /tmp/evidence-shadow.tar.gz.b64 > /tmp/evidence-shadow.tar.gz
          actual_sha="$(sha256sum /tmp/evidence-shadow.tar.gz | awk '{print $1}')"
          test "${actual_sha}" = "${expected_sha}"
          python - <<'PY'
          import hashlib
          import tarfile

          expected_files = {
              '.github/workflows/evidence-credibility-shadow-qa.yml',
              'docs/moral-trade/evidence-credibility-shadow-v2.md',
              'src/lib/evidence-credibility-shadow-schema-contract.test.ts',
              'supabase/migrations/20260810160000_evidence_credibility_shadow_schema_core.sql',
              'supabase/migrations/20260810160001_evidence_credibility_shadow_schema_events.sql',
              'supabase/migrations/20260810160002_evidence_credibility_shadow_event_plan_refresh.sql',
              'supabase/migrations/20260810160003_evidence_credibility_shadow_evidence_materialize.sql',
              'supabase/migrations/20260810160004_evidence_credibility_shadow_evidence_rpc.sql',
              'supabase/migrations/20260810160005_evidence_credibility_shadow_settlement_materialize.sql',
              'supabase/migrations/20260810160006_evidence_credibility_shadow_settlement_rpc.sql',
              'supabase/migrations/20260810160007_evidence_credibility_shadow_differential_active.sql',
              'supabase/migrations/20260810160008_evidence_credibility_shadow_rls_grants.sql',
              'supabase/migrations/20260810160009_evidence_credibility_shadow_evidence_hardening.sql',
              'supabase/migrations/20260810160010_evidence_credibility_shadow_settlement_hardening.sql',
              'supabase/migrations/20260810160011_evidence_credibility_shadow_advisor_indexes.sql',
              'supabase/tests/evidence_credibility_shadow_core.sql',
              'supabase/tests/evidence_credibility_shadow_finality.sql',
              'supabase/tests/evidence_credibility_shadow_supersession.sql',
              'supabase/tests/evidence_credibility_shadow_settlement.sql',
              'supabase/tests/evidence_credibility_shadow_authorization.sql',
              'supabase/tests/evidence_credibility_shadow_active_compatibility.sql',
          }
          with tarfile.open('/tmp/evidence-shadow.tar.gz', 'r:gz') as archive:
              files = {member.name for member in archive.getmembers() if member.isfile()}
          if files != expected_files:
              raise SystemExit(
                  f'Archive inventory mismatch. Missing={sorted(expected_files-files)} '
                  f'Unexpected={sorted(files-expected_files)}'
              )
          canonical_manifest = ('\n'.join(sorted(files)) + '\n').encode()
          manifest_sha = hashlib.sha256(canonical_manifest).hexdigest()
          expected_manifest_sha = 'f85f93ed560308624773b700e02d7f89db649640383963dac3c177cab60a98ff'
          if manifest_sha != expected_manifest_sha:
              raise SystemExit(
                  f'Archive manifest mismatch: expected={expected_manifest_sha} actual={manifest_sha}'
              )
          PY

      - name: Materialize durable files and remove all temporary machinery
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf /tmp/evidence-shadow.tar.gz -C "${GITHUB_WORKSPACE}"
          rm -rf .github/materialize-evidence-shadow
          rm -f .github/workflows/materialize-evidence-credibility-shadow-v2.yml
          rm -f .github/workflows/stage-evidence-credibility-shadow-qa-workflow.yml
          rm -f .github/workflows/cleanup-evidence-credibility-shadow-staging.yml
          rm -f .github/staged-evidence-credibility-shadow-qa.yml.txt
          test -f .github/workflows/evidence-credibility-shadow-qa.yml
          test -f docs/moral-trade/evidence-credibility-shadow-v2.md
          test -f src/lib/evidence-credibility-shadow-schema-contract.test.ts
          test "$(find supabase/migrations -maxdepth 1 -type f -name '202608101600*_evidence_credibility_shadow_*.sql' | wc -l)" -eq 12
          test "$(find supabase/tests -maxdepth 1 -type f -name 'evidence_credibility_shadow_*.sql' | wc -l)" -eq 6
          test ! -e .github/materialize-evidence-shadow
          test ! -e .github/workflows/materialize-evidence-credibility-shadow-v2.yml
          test ! -e .github/workflows/stage-evidence-credibility-shadow-qa-workflow.yml
          test ! -e .github/workflows/cleanup-evidence-credibility-shadow-staging.yml
          test ! -e .github/staged-evidence-credibility-shadow-qa.yml.txt

      - name: Commit exact durable tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          test "$(git diff --cached --name-status | awk '$1=="A"{n++} END{print n+0}')" -eq 20
          test "$(git diff --cached --name-status | awk '$1=="D"{n++} END{print n+0}')" -eq 8
          git commit -m "Implement evidence credibility shadow integration"
          git push origin HEAD:feature/evidence-credibility-shadow-v2-20260810
