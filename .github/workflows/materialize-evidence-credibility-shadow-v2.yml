name: Temporary materialize evidence credibility shadow v2

on:
  push:
    branches:
      - feature/evidence-credibility-shadow-v2-20260810
    paths:
      - .github/workflows/materialize-evidence-credibility-shadow-v2.yml
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
    paths:
      - .github/workflows/materialize-evidence-credibility-shadow-v2.yml

permissions:
  contents: write

concurrency:
  group: materialize-evidence-credibility-shadow-v2
  cancel-in-progress: false

jobs:
  materialize:
    if: github.repository == 'ghuser29384/Website2'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/evidence-credibility-shadow-v2-20260810
          fetch-depth: 0

      - name: Guard source branch and base ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}" = "feature/evidence-credibility-shadow-v2-20260810"
          git merge-base --is-ancestor 0778577c98c7a86417057caeb939c01f77e22c89 HEAD
          test "$(find .github/materialize-evidence-shadow -maxdepth 1 -type f -name 'chunk-*.b64' | wc -l)" -eq 5

      - name: Reconstruct and verify exact archive
        shell: bash
        run: |
          set -euo pipefail
          cat .github/materialize-evidence-shadow/chunk-*.b64 > /tmp/evidence-shadow.tar.gz.b64
          base64 --decode /tmp/evidence-shadow.tar.gz.b64 > /tmp/evidence-shadow.tar.gz
          echo "82f833fdb93707eef6af66e13eaab951ad5153ac48fd5d95564092389982099e  /tmp/evidence-shadow.tar.gz" | sha256sum --check --strict
          test "$(tar -tzf /tmp/evidence-shadow.tar.gz | grep -Ev '/$' | wc -l)" -eq 21

      - name: Materialize durable files and remove temporary controller
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf /tmp/evidence-shadow.tar.gz -C "${GITHUB_WORKSPACE}"
          rm -rf .github/materialize-evidence-shadow
          rm -f .github/workflows/materialize-evidence-credibility-shadow-v2.yml
          test -f .github/workflows/evidence-credibility-shadow-qa.yml
          test -f docs/moral-trade/evidence-credibility-shadow-v2.md
          test -f src/lib/evidence-credibility-shadow-schema-contract.test.ts
          test "$(find supabase/migrations -maxdepth 1 -type f -name '202608101600*_evidence_credibility_shadow_*.sql' | wc -l)" -eq 12
          test "$(find supabase/tests -maxdepth 1 -type f -name 'evidence_credibility_shadow_*.sql' | wc -l)" -eq 6

      - name: Commit exact materialized tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          test "$(git diff --cached --name-status | awk '$1=="A"{n++} END{print n+0}')" -eq 21
          test "$(git diff --cached --name-status | awk '$1=="D"{n++} END{print n+0}')" -eq 6
          git commit -m "Implement evidence credibility shadow integration"
          git push origin HEAD:feature/evidence-credibility-shadow-v2-20260810
