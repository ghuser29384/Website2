name: PR 406 exact production release

on:
  push:
    branches:
      - qa/pr406-production-release-732d79fb-20260804
    paths:
      - .github/workflows/pr406-production-release-732d79fb-once.yml

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pr406-production-release-732d79fb
  cancel-in-progress: false

env:
  CONTROLLER_BRANCH: qa/pr406-production-release-732d79fb-20260804
  CONTROLLER_PATH: .github/workflows/pr406-production-release-732d79fb-once.yml
  EXPECTED_MAIN: 732d79fb47ffdce2cecb6672735adb20a09f1098
  MIGRATION_PATH: supabase/migrations/20260801030000_mpgf_pledge_impact_live_foundation.sql
  EXPECTED_MIGRATION_BLOB: c83ab30d7a84b2c97a70181fb5ba909cbebb75f4
  VERCEL_ORG_ID: team_ySu6sF3Uho1E1GnJtCQPVEuJ
  VERCEL_PROJECT_ID: prj_Em3j7Uj7RatX2R1ZYhla3XSHRde7
  VERCEL_CLI_VERSION: 50.38.1

jobs:
  release:
    if: github.repository == 'ghuser29384/Website2'
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Check out immutable merged main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_MAIN }}
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Guard exact merged source and current main
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'ghuser29384/Website2'
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$EXPECTED_MAIN"
          test "$(git rev-parse "HEAD:$MIGRATION_PATH")" = "$EXPECTED_MIGRATION_BLOB"
          git diff --check HEAD^
          git show --stat --oneline --decorate=short HEAD | tee release-merge-stat.txt
          git hash-object "$MIGRATION_PATH" | tee release-migration-blob.txt
          sha256sum "$MIGRATION_PATH" | tee release-migration-sha256.txt

      - name: Remove the one-time release controller from its branch
        id: self-delete
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          blob_sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/$CONTROLLER_PATH?ref=$CONTROLLER_BRANCH" --jq .sha)"
          jq -n \
            --arg message 'Remove one-time PR 406 production release controller' \
            --arg sha "$blob_sha" \
            --arg branch "$CONTROLLER_BRANCH" \
            '{message:$message,sha:$sha,branch:$branch}' \
            | gh api --method DELETE "repos/$GITHUB_REPOSITORY/contents/$CONTROLLER_PATH" --input - >/dev/null

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        id: install
        run: npm ci

      - name: Reconfirm exact source, lint, and type gates
        id: quality
        shell: bash
        env:
          NEXT_PUBLIC_SITE_URL: https://www.moraltrade.org
          SITE_URL: https://www.moraltrade.org
          VERCEL: '1'
          VERCEL_ENV: production
          CONDITIONAL_PAYMENTS_MODE: disabled
          TRADE_DONATION_POOL_ENABLED: 'false'
          TRADE_DONATION_POOL_MODE: disabled
          DIRECT_DONATION_UPGRADES_ENABLED: 'false'
          DIRECT_DONATION_UPGRADE_MODE: disabled
        run: |
          set -euo pipefail
          set -o pipefail
          node --import tsx --test \
            src/lib/mpgf/pledge-impact-live.test.ts \
            src/lib/mpgf/pledge-impact-live-integration.test.ts \
            2>&1 | tee release-focused-tests.log
          npm test 2>&1 | tee release-repository-tests.log
          npm run lint -- --quiet 2>&1 | tee release-eslint.log
          npx tsc --noEmit 2>&1 | tee release-typescript.log

      - name: Link only the canonical Vercel project
        id: link
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' \
            "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          test "$(jq -r .orgId .vercel/project.json)" = "$VERCEL_ORG_ID"
          test "$(jq -r .projectId .vercel/project.json)" = "$VERCEL_PROJECT_ID"

      - name: Pull production environment and build on GitHub Actions compute
        id: vercel-build
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          set -o pipefail
          npx --yes "vercel@$VERCEL_CLI_VERSION" pull \
            --yes \
            --environment=production \
            --token="$VERCEL_TOKEN" \
            --scope=ellen-s \
            2>&1 | tee release-vercel-pull.log
          npx --yes "vercel@$VERCEL_CLI_VERSION" build \
            --prod \
            --token="$VERCEL_TOKEN" \
            --scope=ellen-s \
            2>&1 | tee release-vercel-build.log

      - name: Recheck immutable main immediately before production deployment
        id: predeploy-guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$EXPECTED_MAIN"
          test "$(git rev-parse "HEAD:$MIGRATION_PATH")" = "$EXPECTED_MIGRATION_BLOB"

      - name: Upload the exact prebuilt output to production once
        id: deploy
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          set -o pipefail
          raw="$(npx --yes "vercel@$VERCEL_CLI_VERSION" deploy \
            --prebuilt \
            --prod \
            --token="$VERCEL_TOKEN" \
            --scope=ellen-s \
            2>&1 | tee release-vercel-deploy.log)"
          clean="$(printf '%s\n' "$raw" | sed -r 's/\x1B\[[0-9;]*[mK]//g')"
          deployment_url="$(printf '%s\n' "$clean" | grep -Eo 'https://[A-Za-z0-9.-]+\.vercel\.app' | tail -n1)"
          test -n "$deployment_url"
          deployment_host="${deployment_url#https://}"
          printf '%s\n' "$deployment_url" > release-production-url.txt
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"
          echo "deployment_host=$deployment_host" >> "$GITHUB_OUTPUT"

      - name: Verify exact READY production deployment and aliases
        id: deployment
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEPLOYMENT_HOST: ${{ steps.deploy.outputs.deployment_host }}
        run: |
          set -euo pipefail
          state=''
          aliases_ready='false'
          for attempt in $(seq 1 150); do
            curl --fail --silent --show-error \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v13/deployments/$DEPLOYMENT_HOST?teamId=$VERCEL_ORG_ID" \
              > release-production-deployment.json
            state="$(jq -r '.readyState // .state // empty' release-production-deployment.json)"
            if [[ "$state" == 'ERROR' || "$state" == 'CANCELED' ]]; then
              echo "Deployment entered terminal state: $state" >&2
              exit 1
            fi
            if [[ "$state" == 'READY' ]] \
              && jq -e --arg apex 'moraltrade.org' --arg www 'www.moraltrade.org' \
                '((.alias // []) | index($apex)) != null and ((.alias // []) | index($www)) != null' \
                release-production-deployment.json >/dev/null; then
              aliases_ready='true'
              break
            fi
            sleep 4
          done

          test "$state" = 'READY'
          test "$aliases_ready" = 'true'
          deployment_id="$(jq -r '.id // .uid // empty' release-production-deployment.json)"
          project_id="$(jq -r '.projectId // .project.id // empty' release-production-deployment.json)"
          deployed_sha="$(jq -r '.meta.githubCommitSha // empty' release-production-deployment.json)"
          target="$(jq -r '.target // empty' release-production-deployment.json)"
          test -n "$deployment_id"
          test "$project_id" = "$VERCEL_PROJECT_ID"
          test "$deployed_sha" = "$EXPECTED_MAIN"
          test "$target" = 'production'

          echo "deployment_id=$deployment_id" >> "$GITHUB_OUTPUT"
          jq -n \
            --arg deploymentId "$deployment_id" \
            --arg deploymentUrl "${{ steps.deploy.outputs.deployment_url }}" \
            --arg commit "$deployed_sha" \
            --arg projectId "$project_id" \
            --arg state "$state" \
            --argjson aliases "$(jq '.alias // []' release-production-deployment.json)" \
            '{deploymentId:$deploymentId,deploymentUrl:$deploymentUrl,commit:$commit,projectId:$projectId,state:$state,target:"production",aliases:$aliases}' \
            > release-production-deployment-evidence.json

      - name: Verify canonical production API and method boundary
        id: canonical-api
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-api

          request() {
            local name="$1"
            local method="$2"
            local url="$3"
            local status
            status="$(curl --silent --show-error --location \
              --request "$method" \
              --max-time 45 \
              -H 'Accept: application/json' \
              --dump-header "release-api/$name.headers" \
              --output "release-api/$name.body" \
              --write-out '%{http_code}' \
              "$url")"
            printf '%s\n' "$status" > "release-api/$name.status"
          }

          valid_path='/api/mpgf/pledge-impact?pool=pool-production-unmapped&pledgeCents=3500'
          expected='false'
          for attempt in $(seq 1 90); do
            request www-valid GET "https://www.moraltrade.org$valid_path"
            if [[ "$(cat release-api/www-valid.status)" == '200' ]] \
              && jq -e '.status == "unavailable" and .reason == "pool_not_live" and .poolPublicKey == "pool-production-unmapped" and .pledgeCents == 3500 and .mechanicalEffect == null' \
                release-api/www-valid.body >/dev/null 2>&1; then
              expected='true'
              break
            fi
            sleep 4
          done
          test "$expected" = 'true'

          request apex-valid GET "https://moraltrade.org$valid_path"
          request malformed-pool GET 'https://www.moraltrade.org/api/mpgf/pledge-impact?pool=bad&pledgeCents=3500'
          request invalid-amount GET 'https://www.moraltrade.org/api/mpgf/pledge-impact?pool=pool-production-unmapped&pledgeCents=3.5'
          request missing-amount GET 'https://www.moraltrade.org/api/mpgf/pledge-impact?pool=pool-production-unmapped'
          request post POST "https://www.moraltrade.org$valid_path"
          request root GET 'https://www.moraltrade.org/'

          test "$(cat release-api/www-valid.status)" = '200'
          test "$(cat release-api/apex-valid.status)" = '200'
          test "$(cat release-api/malformed-pool.status)" = '400'
          test "$(cat release-api/invalid-amount.status)" = '400'
          test "$(cat release-api/missing-amount.status)" = '400'
          test "$(cat release-api/post.status)" = '405'
          test "$(cat release-api/root.status)" = '200'

          tr -d '\r' < release-api/www-valid.headers > release-api/www-valid.headers.normalized
          cache_control="$(awk 'BEGIN{IGNORECASE=1} /^cache-control:/ {sub(/^[^:]+:[[:space:]]*/, ""); print; exit}' release-api/www-valid.headers.normalized)"
          [[ "$cache_control" == *private* ]]
          [[ "$cache_control" == *no-store* ]]
          jq -e '.status == "unavailable" and .experimental == true and .reason == "pool_not_live" and .poolState == null and .mechanicalEffect == null' \
            release-api/www-valid.body >/dev/null
          jq -e '.status == "unavailable" and .reason == "pool_not_live"' release-api/apex-valid.body >/dev/null
          jq -e '.error | type == "string" and length > 0' release-api/malformed-pool.body >/dev/null
          jq -e '.error | type == "string" and length > 0' release-api/invalid-amount.body >/dev/null
          jq -e '.error | type == "string" and length > 0' release-api/missing-amount.body >/dev/null
          ! grep -Fq 'DEPLOYMENT_DISABLED' release-api/root.body

          jq -n \
            --arg status 'passed' \
            --arg deploymentId "${{ steps.deployment.outputs.deployment_id }}" \
            --arg commit "$EXPECTED_MAIN" \
            --arg cacheControl "$cache_control" \
            '{status:$status,deploymentId:$deploymentId,commit:$commit,canonicalHosts:["moraltrade.org","www.moraltrade.org"],validHttp:200,failClosedReason:"pool_not_live",malformedPoolHttp:400,invalidAmountHttp:400,missingAmountHttp:400,postHttp:405,rootHttp:200,noProductionMappingPublished:true,noNumericalForecastPublished:true}' \
            > release-production-api-evidence.json

      - name: Upload immutable production release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr406-production-release-${{ github.run_id }}
          path: |
            release-merge-stat.txt
            release-migration-blob.txt
            release-migration-sha256.txt
            release-focused-tests.log
            release-repository-tests.log
            release-eslint.log
            release-typescript.log
            release-vercel-pull.log
            release-vercel-build.log
            release-vercel-deploy.log
            release-production-url.txt
            release-production-deployment.json
            release-production-deployment-evidence.json
            release-production-api-evidence.json
            release-api/
          if-no-files-found: warn
          retention-days: 30

      - name: Report exact production release result to PR 406
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [[ "${{ steps.guard.outcome }}" == 'success' \
             && "${{ steps.self-delete.outcome }}" == 'success' \
             && "${{ steps.quality.outcome }}" == 'success' \
             && "${{ steps.vercel-build.outcome }}" == 'success' \
             && "${{ steps.predeploy-guard.outcome }}" == 'success' \
             && "${{ steps.deployment.outcome }}" == 'success' \
             && "${{ steps.canonical-api.outcome }}" == 'success' ]]; then
            deployment_id="${{ steps.deployment.outputs.deployment_id }}"
            gh pr comment 406 --repo "$GITHUB_REPOSITORY" --body "Exact merged PR #406 commit \`$EXPECTED_MAIN\` was released to canonical production deployment \`$deployment_id\`. The deployment is READY, production-targeted, and owns both canonical aliases. The production API returned HTTP 200 with \`private, no-store\`, failed closed with \`pool_not_live\`, returned 400 for malformed inputs, returned 405 for POST, and published no production pool mapping or numerical forecast. Evidence: $run_url"
          else
            gh pr comment 406 --repo "$GITHUB_REPOSITORY" --body "The exact PR #406 production release controller did not complete all gates for \`$EXPECTED_MAIN\`. The production database migration remains additive with zero mappings and forecasts; no activation was authorized. Evidence: $run_url"
          fi

      - name: Enforce exact release and canonical verification
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.guard.outcome }}" = 'success'
          test "${{ steps.self-delete.outcome }}" = 'success'
          test "${{ steps.install.outcome }}" = 'success'
          test "${{ steps.quality.outcome }}" = 'success'
          test "${{ steps.link.outcome }}" = 'success'
          test "${{ steps.vercel-build.outcome }}" = 'success'
          test "${{ steps.predeploy-guard.outcome }}" = 'success'
          test "${{ steps.deploy.outcome }}" = 'success'
          test "${{ steps.deployment.outcome }}" = 'success'
          test "${{ steps.canonical-api.outcome }}" = 'success'
