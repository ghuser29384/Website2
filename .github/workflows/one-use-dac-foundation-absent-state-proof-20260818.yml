name: One-use DAC foundation absent-state proof 20260818

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/one-use-dac-foundation-absent-state-proof-20260818.yml"

permissions:
  contents: read

concurrency:
  group: one-use-dac-foundation-absent-state-proof-20260818
  cancel-in-progress: false

jobs:
  absent-state-proof:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      MIGRATION_PATH: supabase/migrations/20260818173000_mpgf_dac_public_goods_foundation_reconciliation.sql
      EVIDENCE_DIR: dac-foundation-absent-state-evidence
      POSTGRES_CONTAINER: dac-foundation-${{ github.run_id }}-${{ github.run_attempt }}
      POSTGRES_PASSWORD: local-container-only-not-a-secret

    steps:
      - name: Check out the exact pull-request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Prove absent-state creation, exact grants, idempotency, and fail-closed prerequisites
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "ghuser29384/Website2"
          test "${{ github.event.pull_request.number }}" = "772"
          test "${{ github.event.pull_request.head.ref }}" = "fix/dac-public-goods-foundation-reconciliation-20260818"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test -f "$MIGRATION_PATH"
          mkdir -p "$EVIDENCE_DIR"
          trap 'docker rm --force "$POSTGRES_CONTAINER" >/dev/null 2>&1 || true' EXIT

          docker pull postgres:17 | tee "$EVIDENCE_DIR/docker-pull.log"
          image_ref="$(docker image inspect --format '{{index .RepoDigests 0}}' postgres:17)"
          [[ "$image_ref" =~ ^postgres@sha256:[0-9a-f]{64}$ ]]
          printf '%s\n' "$image_ref" | tee "$EVIDENCE_DIR/postgres-image.txt"
          docker run --detach \
            --name "$POSTGRES_CONTAINER" \
            --env "POSTGRES_PASSWORD=$POSTGRES_PASSWORD" \
            --env POSTGRES_DB=postgres \
            "$image_ref" \
            > "$EVIDENCE_DIR/postgres-container-id.txt"
          for attempt in $(seq 1 60); do
            docker exec "$POSTGRES_CONTAINER" pg_isready -U postgres -d postgres >/dev/null 2>&1 && break
            test "$attempt" -lt 60
            sleep 1
          done

          cat > "$EVIDENCE_DIR/prerequisites.sql" <<'SQL'
          \set ON_ERROR_STOP on
          create schema if not exists extensions;
          create extension if not exists pgcrypto with schema extensions;
          create schema if not exists auth;
          create or replace function auth.uid() returns uuid language sql stable
            as $$ select null::uuid $$;
          do $roles$
          begin
            if not exists (select 1 from pg_roles where rolname='anon') then
              execute 'create role anon nologin';
            end if;
            if not exists (select 1 from pg_roles where rolname='authenticated') then
              execute 'create role authenticated nologin';
            end if;
            if not exists (select 1 from pg_roles where rolname='service_role') then
              execute 'create role service_role nologin';
            end if;
          end;
          $roles$;
          create type public.mpgf_threshold_visibility as enum ('public_exact');
          create type public.mpgf_progress_visibility as enum (
            'exact_amount', 'progress_range', 'threshold_status_only', 'sealed_progress'
          );
          create table public.profiles (id uuid primary key);
          create table public.mpgf_pool_proposals (id uuid primary key);
          create table public.mpgf_candidate_alternatives (id text primary key);
          SQL
          docker exec -i "$POSTGRES_CONTAINER" \
            psql -U postgres -d postgres --no-psqlrc --set ON_ERROR_STOP=1 \
            < "$EVIDENCE_DIR/prerequisites.sql" \
            > "$EVIDENCE_DIR/prerequisites.log"

          query_json() {
            local database="$1" query="$2" output="$3"
            docker exec "$POSTGRES_CONTAINER" \
              psql -U postgres -d "$database" --no-psqlrc --tuples-only --no-align \
              --command "$query" > "$output"
          }
          foundation_filter="n.nspname='public' and c.relname in ('mpgf_public_goods_match_pools','mpgf_public_goods_rounds','mpgf_public_goods_campaigns','mpgf_public_goods_pledges')"
          query_json postgres \
            "select json_build_object('tablesAbsent',count(*)=0,'tableCount',count(*)) from pg_class c join pg_namespace n on n.oid=c.relnamespace where $foundation_filter;" \
            "$EVIDENCE_DIR/absent-preflight.json"
          jq -e '.tablesAbsent == true and .tableCount == 0' "$EVIDENCE_DIR/absent-preflight.json" >/dev/null

          docker exec -i "$POSTGRES_CONTAINER" \
            psql -U postgres -d postgres --no-psqlrc --set ON_ERROR_STOP=1 \
            < "$MIGRATION_PATH" \
            2>&1 | tee "$EVIDENCE_DIR/first-application.log"

          cat > "$EVIDENCE_DIR/postflight.sql" <<'SQL'
          \set ON_ERROR_STOP on
          do $verify$
          begin
            if not exists (select 1 from pg_constraint where conname='mpgf_public_goods_rounds_valid_window')
               or not exists (select 1 from pg_constraint where conname='mpgf_public_goods_no_custody_default') then
              raise exception 'Named canonical constraints are incomplete.';
            end if;
            if has_table_privilege('anon','public.mpgf_public_goods_pledges','INSERT')
               or has_table_privilege('anon','public.mpgf_public_goods_pledges','UPDATE')
               or has_table_privilege('anon','public.mpgf_public_goods_pledges','DELETE')
               or has_table_privilege('authenticated','public.mpgf_public_goods_pledges','DELETE') then
              raise exception 'A prohibited pledge mutation grant exists.';
            end if;
          end;
          $verify$;
          select json_build_object(
            'tableCount',(select count(*) from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname='public' and c.relname in ('mpgf_public_goods_match_pools','mpgf_public_goods_rounds','mpgf_public_goods_campaigns','mpgf_public_goods_pledges')),
            'rlsTableCount',(select count(*) from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname='public' and c.relname in ('mpgf_public_goods_match_pools','mpgf_public_goods_rounds','mpgf_public_goods_campaigns','mpgf_public_goods_pledges') and c.relrowsecurity),
            'columnContractCount',(select count(*) from information_schema.columns where table_schema='public' and table_name in ('mpgf_public_goods_match_pools','mpgf_public_goods_rounds','mpgf_public_goods_campaigns','mpgf_public_goods_pledges')),
            'policyCount',(select count(*) from pg_policies where schemaname='public' and tablename in ('mpgf_public_goods_match_pools','mpgf_public_goods_rounds','mpgf_public_goods_campaigns','mpgf_public_goods_pledges')),
            'rowCounts',json_build_object(
              'matchPools',(select count(*) from public.mpgf_public_goods_match_pools),
              'rounds',(select count(*) from public.mpgf_public_goods_rounds),
              'campaigns',(select count(*) from public.mpgf_public_goods_campaigns),
              'pledges',(select count(*) from public.mpgf_public_goods_pledges)
            ),
            'paymentReferenceRows',(select count(*) from public.mpgf_public_goods_pledges where payment_intent_ref is not null),
            'anonPledgeMutation',has_table_privilege('anon','public.mpgf_public_goods_pledges','INSERT') or has_table_privilege('anon','public.mpgf_public_goods_pledges','UPDATE') or has_table_privilege('anon','public.mpgf_public_goods_pledges','DELETE'),
            'authenticatedPledgeDelete',has_table_privilege('authenticated','public.mpgf_public_goods_pledges','DELETE')
          );
          SQL
          docker exec -i "$POSTGRES_CONTAINER" \
            psql -U postgres -d postgres --no-psqlrc --set ON_ERROR_STOP=1 --tuples-only --no-align \
            < "$EVIDENCE_DIR/postflight.sql" \
            > "$EVIDENCE_DIR/first-postflight.json"
          jq -e '
            .tableCount==4 and .rlsTableCount==4 and .columnContractCount==52
            and .policyCount==6
            and .rowCounts=={matchPools:0,rounds:0,campaigns:0,pledges:0}
            and .paymentReferenceRows==0
            and .anonPledgeMutation==false
            and .authenticatedPledgeDelete==false
          ' "$EVIDENCE_DIR/first-postflight.json" >/dev/null

          docker exec -i "$POSTGRES_CONTAINER" \
            psql -U postgres -d postgres --no-psqlrc --set ON_ERROR_STOP=1 \
            < "$MIGRATION_PATH" \
            2>&1 | tee "$EVIDENCE_DIR/second-application.log"
          docker exec -i "$POSTGRES_CONTAINER" \
            psql -U postgres -d postgres --no-psqlrc --set ON_ERROR_STOP=1 --tuples-only --no-align \
            < "$EVIDENCE_DIR/postflight.sql" \
            > "$EVIDENCE_DIR/second-postflight.json"
          diff -u \
            <(jq -S . "$EVIDENCE_DIR/first-postflight.json") \
            <(jq -S . "$EVIDENCE_DIR/second-postflight.json")

          docker exec "$POSTGRES_CONTAINER" createdb -U postgres missing_prerequisite
          sed '/create type public.mpgf_progress_visibility as enum (/,+2d' \
            "$EVIDENCE_DIR/prerequisites.sql" \
            > "$EVIDENCE_DIR/missing-prerequisite-setup.sql"
          docker exec -i "$POSTGRES_CONTAINER" \
            psql -U postgres -d missing_prerequisite --no-psqlrc --set ON_ERROR_STOP=1 \
            < "$EVIDENCE_DIR/missing-prerequisite-setup.sql" \
            > "$EVIDENCE_DIR/missing-prerequisite-setup.log"
          set +e
          docker exec -i "$POSTGRES_CONTAINER" \
            psql -U postgres -d missing_prerequisite --no-psqlrc --set ON_ERROR_STOP=1 \
            < "$MIGRATION_PATH" \
            > "$EVIDENCE_DIR/missing-prerequisite-failure.log" 2>&1
          status=$?
          set -e
          test "$status" -ne 0
          grep -Fq 'The canonical MPGF visibility enum prerequisites are missing.' "$EVIDENCE_DIR/missing-prerequisite-failure.log"
          query_json missing_prerequisite \
            "select json_build_object('failedClosed',count(*)=0,'foundationTableCount',count(*)) from pg_class c join pg_namespace n on n.oid=c.relnamespace where $foundation_filter;" \
            "$EVIDENCE_DIR/missing-prerequisite-postflight.json"
          jq -e '.failedClosed==true and .foundationTableCount==0' "$EVIDENCE_DIR/missing-prerequisite-postflight.json" >/dev/null

          {
            printf 'head=%s\n' "$(git rev-parse HEAD)"
            printf 'tree=%s\n' "$(git rev-parse HEAD^{tree})"
            printf 'migration_sha256='; sha256sum "$MIGRATION_PATH" | awk '{print $1}'
            printf 'postgres_image=%s\n' "$image_ref"
          } | tee "$EVIDENCE_DIR/source-identity.txt"
          grep -RIEq 'postgres(ql)?://|eyJ[A-Za-z0-9_-]{12,}\.|Bearer[[:space:]]+[A-Za-z0-9._~+/-]{20,}|PRIVATE KEY' "$EVIDENCE_DIR" && {
            echo 'Credential-like material found in retained evidence.' >&2
            exit 1
          } || true

      - name: Upload immutable absent-state evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: one-use-dac-foundation-absent-state-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 30
          path: dac-foundation-absent-state-evidence

# One-use verification only. Never merge; remove after the immutable proof is retained.
