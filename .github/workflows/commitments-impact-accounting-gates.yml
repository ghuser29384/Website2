name: Apply Commitments methodology remediation bundle

on:
  push:
    branches:
      - feature/commitments-phase1-impact-accounting-20260806
    paths:
      - ".github/workflows/commitments-impact-accounting-gates.yml"

permissions:
  contents: write
  issues: read

concurrency:
  group: commitments-methodology-remediation-applier
  cancel-in-progress: false

jobs:
  apply:
    name: Verify and apply exact remediation bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/commitments-phase1-impact-accounting-20260806
          fetch-depth: 0
          persist-credentials: true

      - name: Reconstruct and verify exact bundle
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT_IDS: "5242369506 5242397897 5242419144 5242434746 5242449466 5242464393 5242479169 5242492973 5242498874"
          EXPECTED_SHA256: a0fb530b23b1efcace5da963f2dffcd244fe52c00a25d674af21e2a84d716346
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          import os
          from pathlib import Path, PurePosixPath
          import re
          import tarfile
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          ids = [int(value) for value in os.environ["COMMENT_IDS"].split()]
          expected_hash = os.environ["EXPECTED_SHA256"]
          expected_names = ["docs/commitments/impact-methodologies-v1-review.md", "docs/commitments/impact-methodologies-v1/co_fund.json", "docs/commitments/impact-methodologies-v1/donation_redirect.json", "docs/commitments/impact-methodologies-v1/donation_upgrade.json", "docs/commitments/impact-methodologies-v1/manifest.json", "docs/commitments/impact-methodologies-v1/threshold_funding.json", "docs/commitments/impact-methodologies-v1/threshold_sign_on.json", "docs/commitments/impact-methodologies-v1/trade.json", "scripts/validate-commitments-impact-methodologies.mjs", "src/lib/impact-accounting.test.ts", "src/lib/impact-accounting.ts", "src/lib/impact-model-governance.test.ts", "src/lib/impact-model-governance.ts", "supabase/migrations/20260810150350_commitments_impact_methodology_review_remediation.sql", "supabase/migrations/20260810151733_commitments_impact_methodology_remediation_privileges.sql", "supabase/migrations/20260810152035_commitments_impact_snapshot_overlap_alias_fix.sql", "supabase/tests/commitments_impact_accounting_phase1.sql"]

          chunks = {}
          for comment_id in ids:
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/issues/comments/{comment_id}",
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "commitments-methodology-remediation-applier",
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  payload = json.load(response)
              body = payload.get("body", "")
              match = re.fullmatch(
                  r"<!-- temporary-commitments-remediation-bundle:(\d+)/9 -->\n"
                  r"([A-Za-z0-9+/=]+)\n"
                  r"<!-- /temporary-commitments-remediation-bundle -->",
                  body,
              )
              if not match:
                  raise SystemExit(f"Comment {comment_id} did not match the exact bundle marker.")
              index = int(match.group(1))
              if index in chunks:
                  raise SystemExit(f"Duplicate bundle chunk index: {index}")
              chunks[index] = match.group(2)

          if sorted(chunks) != list(range(1, 10)):
              raise SystemExit(f"Incomplete bundle chunk indexes: {sorted(chunks)}")

          encoded = "".join(chunks[index] for index in range(1, 10))
          archive = base64.b64decode(encoded, validate=True)
          actual_hash = hashlib.sha256(archive).hexdigest()
          if actual_hash != expected_hash:
              raise SystemExit(f"Bundle SHA-256 mismatch: {actual_hash}")

          archive_path = Path("/tmp/commitments-review-remediation.tgz")
          archive_path.write_bytes(archive)
          with tarfile.open(archive_path, "r:gz") as bundle:
              members = bundle.getmembers()
              actual_names = [member.name for member in members]
              if actual_names != expected_names:
                  raise SystemExit(
                      "Bundle file inventory mismatch.\n"
                      f"Expected: {expected_names}\nActual: {actual_names}"
                  )
              for member in members:
                  parsed = PurePosixPath(member.name)
                  if parsed.is_absolute() or ".." in parsed.parts or not member.isfile():
                      raise SystemExit(f"Unsafe archive member: {member.name}")
              bundle.extractall(".", filter="data")

          print(f"bundle_sha256={actual_hash}")
          print(f"bundle_files={len(expected_names)}")
          PY

      - name: Validate and stage exact remediation sources
        run: |
          set -euo pipefail
          node scripts/validate-commitments-impact-methodologies.mjs
          git diff --check

          cat > /tmp/expected-files.txt <<'FILES'
          docs/commitments/impact-methodologies-v1-review.md
          docs/commitments/impact-methodologies-v1/co_fund.json
          docs/commitments/impact-methodologies-v1/donation_redirect.json
          docs/commitments/impact-methodologies-v1/donation_upgrade.json
          docs/commitments/impact-methodologies-v1/manifest.json
          docs/commitments/impact-methodologies-v1/threshold_funding.json
          docs/commitments/impact-methodologies-v1/threshold_sign_on.json
          docs/commitments/impact-methodologies-v1/trade.json
          scripts/validate-commitments-impact-methodologies.mjs
          src/lib/impact-accounting.test.ts
          src/lib/impact-accounting.ts
          src/lib/impact-model-governance.test.ts
          src/lib/impact-model-governance.ts
          supabase/migrations/20260810150350_commitments_impact_methodology_review_remediation.sql
          supabase/migrations/20260810151733_commitments_impact_methodology_remediation_privileges.sql
          supabase/migrations/20260810152035_commitments_impact_snapshot_overlap_alias_fix.sql
          supabase/tests/commitments_impact_accounting_phase1.sql
          FILES
          sort -o /tmp/expected-files.txt /tmp/expected-files.txt
          mapfile -t files < /tmp/expected-files.txt
          git add -- "${files[@]}"
          git diff --cached --name-only | sort > /tmp/actual-files.txt
          diff -u /tmp/expected-files.txt /tmp/actual-files.txt

      - name: Commit exact remediation sources
        env:
          BRANCH: feature/commitments-phase1-impact-accounting-20260806
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH"
          test "$(git rev-parse "origin/$BRANCH")" = "$GITHUB_SHA"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Remediate Commitments methodology review"
          git push origin "HEAD:$BRANCH"
