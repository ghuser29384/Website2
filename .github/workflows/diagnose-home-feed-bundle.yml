name: Diagnose authenticated Home Feed bundle staging

on:
  push:
    branches:
      - qa/home-authenticated-feed-20260727

permissions:
  contents: write

jobs:
  diagnose:
    if: ${{ !contains(github.event.head_commit.message, '[diagnostic-complete]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Record staged-part checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .qa-results
          {
            echo "staging_sha=${GITHUB_SHA}"
            echo "recorded_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            wc -c .qa/home-authenticated-feed-bundle/part-*
            echo
            sha256sum .qa/home-authenticated-feed-bundle/part-*
            echo
            cat .qa/home-authenticated-feed-bundle/part-* > /tmp/home-feed-bundle.b64
            echo "combined_base64_bytes=$(wc -c < /tmp/home-feed-bundle.b64)"
            sha256sum /tmp/home-feed-bundle.b64
            base64 --decode /tmp/home-feed-bundle.b64 > /tmp/home-feed-bundle.zip || true
            echo "decoded_zip_bytes=$(wc -c < /tmp/home-feed-bundle.zip)"
            sha256sum /tmp/home-feed-bundle.zip
          } > .qa-results/bundle-diagnostics.log
      - name: Commit diagnostics
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .qa-results/bundle-diagnostics.log
          git commit -m "Record bundle diagnostics [diagnostic-complete] [verification-failure]"
          git push origin HEAD:refs/heads/qa/home-authenticated-feed-20260727
