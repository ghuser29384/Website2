name: Finalize public evidence v2

on:
  push:
    branches:
      - feature/public-evidence-desk-v2
    paths:
      - .github/workflows/finalize-public-evidence-v2.yml

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/public-evidence-desk-v2
          fetch-depth: 0

      - name: Integrate public-safe evidence into current product flow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          def patch(path: str, replacements: list[tuple[str, str, str]]) -> None:
              target = Path(path)
              text = target.read_text()
              for old, new, label in replacements:
                  text = replace_once(text, old, new, f"{path}: {label}")
              target.write_text(text)

          patch(
              "src/components/core-trade/trade-draft-workbench.tsx",
              [
                  (
                      "  notes: string;\n  voluntaryCertification: boolean;\n}",
                      "  notes: string;\n  publicEvidenceCertification: boolean;\n  voluntaryCertification: boolean;\n}",
                      "public evidence value field",
                  ),
                  (
                      '  privacyScope: "Participants and operator only. Public pages exclude private messages and evidence.",',
                      '  privacyScope: "Agreement evidence and public-safe source copies are public by default. Private messages remain private. A documented safety exception may withhold specific proof.",',
                      "public evidence default scope",
                  ),
                  (
                      '  notes: "",\n  voluntaryCertification: false,\n};',
                      '  notes: "",\n  publicEvidenceCertification: false,\n  voluntaryCertification: false,\n};',
                      "public evidence default certification",
                  ),
                  (
                      '        {values.voluntaryCertification ? (\n          <input name="voluntary_certification" type="hidden" value="on" />\n        ) : null}\n',
                      '        {values.voluntaryCertification ? (\n          <input name="voluntary_certification" type="hidden" value="on" />\n        ) : null}\n        {values.publicEvidenceCertification ? (\n          <input name="public_evidence_certification" type="hidden" value="on" />\n        ) : null}\n',
                      "public evidence hidden certification",
                  ),
                  (
                      '                    <p>Name the evidence that counts and who may see it.</p>',
                      '                    <p>Define the proof that counts. Evidence records and certified public-safe source copies are public by default; private messages remain private.</p>',
                      "proof step explanation",
                  ),
                  (
                      '                      <span className={styles.fieldLabel}>Privacy scope</span>',
                      '                      <span className={styles.fieldLabel}>Public evidence and safety scope</span>',
                      "proof visibility label",
                  ),
                  (
                      '                        value={values.privacyScope}\n                      />\n                    </label>\n                  </div>',
                      '                        value={values.privacyScope}\n                      />\n                    </label>\n                    <span className={styles.helper}>\n                      Remove exact addresses, account numbers, private contact details, and unrelated personal information before evidence submission. A narrow, documented safety exception may withhold specific proof.\n                    </span>\n                  </div>',
                      "proof public-safe helper",
                  ),
                  (
                      '                    <div className={styles.receiptRow}>\n                      <dt>Evidence</dt>\n                      <dd>{concise(values.evidenceRule, "Not stated")}</dd>\n                    </div>\n                  </dl>',
                      '                    <div className={styles.receiptRow}>\n                      <dt>Evidence</dt>\n                      <dd>{concise(values.evidenceRule, "Not stated")}</dd>\n                    </div>\n                    <div className={styles.receiptRow}>\n                      <dt>Evidence visibility</dt>\n                      <dd>{concise(values.privacyScope, "Public by default")}</dd>\n                    </div>\n                  </dl>',
                      "review visibility row",
                  ),
                  (
                      '                  <label className={styles.certification}>\n                    <input\n                      className={styles.checkbox}\n                      checked={values.voluntaryCertification}\n                      onChange={(event) => update("voluntaryCertification", event.target.checked)}\n                      type="checkbox"\n                    />\n                    <span>\n                      This proposal is voluntary. It does not threaten harm, retaliation, or a worse baseline if the other person declines.\n                    </span>\n                  </label>\n',
                      '                  <label className={styles.certification}>\n                    <input\n                      className={styles.checkbox}\n                      checked={values.voluntaryCertification}\n                      onChange={(event) => update("voluntaryCertification", event.target.checked)}\n                      type="checkbox"\n                    />\n                    <span>\n                      This proposal is voluntary. It does not threaten harm, retaliation, or a worse baseline if the other person declines.\n                    </span>\n                  </label>\n\n                  <label className={styles.certification}>\n                    <input\n                      className={styles.checkbox}\n                      checked={values.publicEvidenceCertification}\n                      onChange={(event) => update("publicEvidenceCertification", event.target.checked)}\n                      type="checkbox"\n                    />\n                    <span>\n                      I understand that evidence submitted under an active agreement is public by default. I will submit only public-safe copies with sensitive identifiers and unrelated personal information removed.\n                    </span>\n                  </label>\n',
                      "review public evidence certification",
                  ),
                  (
                      '                    <div className={styles.safetyItem}>\n                      <strong>Separate confirmation</strong>\n                      <span>After review and a counterparty response, both people confirm one frozen version independently.</span>\n                    </div>',
                      '                    <div className={styles.safetyItem}>\n                      <strong>Public-safe evidence</strong>\n                      <span>Evidence is public by default; only necessary, redacted, or certified public-safe copies should be submitted.</span>\n                    </div>\n                    <div className={styles.safetyItem}>\n                      <strong>Separate confirmation</strong>\n                      <span>After review and a counterparty response, both people confirm one frozen version independently.</span>\n                    </div>',
                      "review safety summary",
                  ),
                  (
                      '              Evidence and privacy specified',
                      '              Public-safe evidence specified',
                      "guardrail public evidence copy",
                  ),
                  (
                      '                Save privately, or certify voluntariness and submit once for operator review.',
                      '                Save privately, or certify voluntariness and public-safe evidence before submitting once for operator review.',
                      "footer certification copy",
                  ),
                  (
                      '                disabled={!finalTermsComplete || !values.voluntaryCertification}',
                      '                disabled={\n                  !finalTermsComplete ||\n                  !values.voluntaryCertification ||\n                  !values.publicEvidenceCertification\n                }',
                      "submit certification gate",
                  ),
              ],
          )

          patch(
              "src/app/trades/new/page.tsx",
              [
                  (
                      '    "Participants and operator only. Public pages show proposal terms but not private messages or evidence.",',
                      '    "Agreement evidence and public-safe source copies are public by default. Private messages remain private. A documented safety exception may withhold specific proof.",',
                      "example public evidence scope",
                  ),
              ],
          )

          patch(
              "src/app/core-trade-actions.ts",
              [
                  (
                      'const EVIDENCE_BUCKET = "trade-evidence";\n',
                      'const EVIDENCE_BUCKET = "trade-evidence";\n\nfunction revalidatePublicEvidence(agreementId: string) {\n  revalidatePath("/evidence");\n  revalidatePath(`/evidence/${agreementId}`);\n}\n',
                      "public evidence revalidation helper",
                  ),
                  (
                      '    if (intent === "submit" && !readCheckbox(formData, "voluntary_certification")) {\n      throw new Error("Confirm that the proposal is voluntary and contains no threat or retaliation.");\n    }\n',
                      '    if (intent === "submit" && !readCheckbox(formData, "voluntary_certification")) {\n      throw new Error("Confirm that the proposal is voluntary and contains no threat or retaliation.");\n    }\n    if (intent === "submit" && !readCheckbox(formData, "public_evidence_certification")) {\n      throw new Error(\n        "Confirm that agreement evidence will be public by default and that only public-safe copies will be submitted.",\n      );\n    }\n',
                      "offer public evidence certification",
                  ),
                  (
                      '    const fileEntry = formData.get("evidence_file");\n    let storagePath = "";\n    let evidenceType = "";\n',
                      '    const fileEntry = formData.get("evidence_file");\n    if (!readCheckbox(formData, "public_safe_copy")) {\n      throw new Error(\n        "Confirm that this evidence item and its source are public-safe before submission.",\n      );\n    }\n    let storagePath = "";\n    let evidenceType = "";\n    let publicOriginalFilename = "";\n    let publicMimeType = "";\n    const publicRedactionNote =\n      "The submitting participant certified this source as public-safe. This certification is not independent verification.";\n',
                      "evidence public-safe certification",
                  ),
                  (
                      '      const safeName = fileEntry.name.replace(/[^a-zA-Z0-9._-]+/g, "-").slice(-120) || "evidence";\n      storagePath = `${agreementId}/${viewer.authUser.id}/${randomUUID()}-${safeName}`;',
                      '      const extension = fileEntry.name.match(/\\.[a-zA-Z0-9]{1,10}$/)?.[0].toLowerCase() ?? "";\n      publicOriginalFilename = `public-evidence${extension}`;\n      publicMimeType = fileEntry.type;\n      storagePath = `${agreementId}/${viewer.authUser.id}/${randomUUID()}-${publicOriginalFilename}`;',
                      "neutral public filename",
                  ),
                  (
                      '      evidenceType = "link";\n    } else if (attestation) {',
                      '      evidenceType = "link";\n      publicOriginalFilename = "external-evidence-link";\n      publicMimeType = "text/html";\n    } else if (attestation) {',
                      "link public metadata",
                  ),
                  (
                      '      evidenceType = "attestation";\n    } else {',
                      '      evidenceType = "attestation";\n      publicOriginalFilename = "participant-attestation.txt";\n      publicMimeType = "text/plain";\n    } else {',
                      "attestation public metadata",
                  ),
                  (
                      '        attestation,\n        status: "submitted",\n      })',
                      '        attestation,\n        status: "submitted",\n        public_visibility: "public",\n        redaction_status: "not_required",\n        public_url: evidenceType === "link" ? evidenceUrl : "",\n        public_storage_path: evidenceType === "file" ? storagePath : "",\n        public_original_filename: publicOriginalFilename,\n        public_mime_type: publicMimeType,\n        public_redaction_note: publicRedactionNote,\n      })',
                      "public evidence insert projection",
                  ),
                  (
                      '.update({ lifecycle_status: "evidence_due", updated_at: new Date().toISOString() })\n      .eq("id", agreementId)',
                      '.update({\n        lifecycle_status: "evidence_due",\n        updated_at: new Date().toISOString(),\n        public_evidence_updated_at: new Date().toISOString(),\n      })\n      .eq("id", agreementId)',
                      "touch public evidence on submission",
                  ),
                  (
                      '    revalidatePath(returnTo);\n    redirectWithMessage(returnTo, "message", "Evidence submitted. A seven-day challenge window is open.");',
                      '    revalidatePath(returnTo);\n    revalidatePublicEvidence(agreementId);\n    redirectWithMessage(returnTo, "message", "Evidence submitted. A seven-day challenge window is open.");',
                      "submission public revalidation",
                  ),
                  (
                      '      revalidatePath(returnTo);\n      redirectWithMessage(returnTo, "message", "Evidence accepted.");',
                      '      revalidatePath(returnTo);\n      revalidatePublicEvidence(agreementId);\n      redirectWithMessage(returnTo, "message", "Evidence accepted.");',
                      "acceptance public revalidation",
                  ),
                  (
                      '      revalidatePath(returnTo);\n      redirectWithMessage(returnTo, "message", "Evidence challenged and agreement marked disputed.");',
                      '      revalidatePath(returnTo);\n      revalidatePublicEvidence(agreementId);\n      redirectWithMessage(returnTo, "message", "Evidence challenged and agreement marked disputed.");',
                      "challenge public revalidation",
                  ),
                  (
                      '          .update({ status: "completed", lifecycle_status: "completed", completed_at: now, updated_at: now })\n          .eq("id", agreementId),',
                      '          .update({\n            status: "completed",\n            lifecycle_status: "completed",\n            completed_at: now,\n            updated_at: now,\n            public_evidence_updated_at: now,\n          })\n          .eq("id", agreementId),',
                      "completion public evidence timestamp",
                  ),
                  (
                      '      revalidatePath(returnTo);\n      redirectWithMessage(returnTo, "message", "Both parties confirmed completion. Final Deal Receipt generated.");',
                      '      revalidatePath(returnTo);\n      revalidatePublicEvidence(agreementId);\n      redirectWithMessage(returnTo, "message", "Both parties confirmed completion. Final Deal Receipt generated.");',
                      "completion public revalidation",
                  ),
                  (
                      '    revalidatePath(returnTo);\n    redirectWithMessage(returnTo, "message", "Your completion confirmation was recorded.");',
                      '    revalidatePath(returnTo);\n    revalidatePublicEvidence(agreementId);\n    redirectWithMessage(returnTo, "message", "Your completion confirmation was recorded.");',
                      "partial completion public revalidation",
                  ),
              ],
          )

          patch(
              "src/app/trade-agreements/[agreementId]/page.tsx",
              [
                  (
                      '            <h2 id="evidence-heading">Submit proof, then let the other participant review it.</h2>\n            <p>\n              A private file, external link, or participant attestation may be used. The submitter\n              cannot review their own evidence. A challenge moves the agreement into disputed state.\n            </p>',
                      '            <h2 id="evidence-heading">Submit public-safe proof, then let the other participant review it.</h2>\n            <p>\n              Evidence records and certified public-safe source copies are public by default. Remove\n              exact addresses, account numbers, private contact details, and unrelated personal\n              information before submission. The submitter cannot review their own evidence, and a\n              challenge moves the agreement into disputed state.\n            </p>',
                      "agreement evidence public copy",
                  ),
                  (
                      '          </div>\n\n          {canSubmitEvidence ? (',
                      '          </div>\n\n          {detail.evidence.length ? (\n            <p>\n              <Link className="inline-link" href={`/evidence/${agreementId}`}>\n                Open the public evidence desk and proof timeline\n              </Link>\n            </p>\n          ) : null}\n\n          {canSubmitEvidence ? (',
                      "agreement public desk link",
                  ),
                  (
                      '                <span>Evidence file (PDF, image, or text; 10 MB maximum)</span>',
                      '                <span>Public-safe evidence file (PDF, image, or text; 10 MB maximum)</span>',
                      "agreement public file label",
                  ),
                  (
                      '              <p className="panel-note">Provide one of the three evidence forms above.</p>',
                      '              <label className="radio-row">\n                <input name="public_safe_copy" required type="checkbox" />\n                <span>\n                  I understand this evidence item and its source will be publicly inspectable. I have\n                  removed sensitive identifiers and unrelated personal information.\n                </span>\n              </label>\n              <p className="panel-note">\n                Provide one evidence form above. Public visibility is separate from submitted,\n                accepted, or challenged review status.\n              </p>',
                      "agreement public-safe checkbox",
                  ),
                  (
                      '                      <span className="source-pill">\n                        Challenge until {formatDate(item.challenge_window_ends_at)}\n                      </span>\n                    </div>',
                      '                      <span className="source-pill">\n                        Challenge until {formatDate(item.challenge_window_ends_at)}\n                      </span>\n                      <span className="source-pill">\n                        Visibility: {String(item.public_visibility ?? "public").replaceAll("_", " ")}\n                      </span>\n                      <span className="source-pill">\n                        Redaction: {String(item.redaction_status ?? "pending_review").replaceAll("_", " ")}\n                      </span>\n                    </div>',
                      "agreement evidence visibility pills",
                  ),
                  (
                      '                        Open private uploaded evidence',
                      '                        Open uploaded evidence',
                      "agreement uploaded evidence label",
                  ),
              ],
          )

          patch(
              "src/lib/site.ts",
              [
                  (
                      '    { href: "/commitments", label: "Commitments" },\n    { href: "/safety", label: "Safety" },',
                      '    { href: "/commitments", label: "Commitments" },\n    { href: "/evidence", label: "Evidence" },\n    { href: "/safety", label: "Safety" },',
                      "primary evidence navigation",
                  ),
                  (
                      '      { href: "/credibility", label: "Contextual credibility" },\n      { href: "/status", label: "Service status" },',
                      '      { href: "/credibility", label: "Contextual credibility" },\n      { href: "/evidence", label: "Public evidence" },\n      { href: "/status", label: "Service status" },',
                      "footer evidence navigation",
                  ),
              ],
          )

          patch(
              "src/lib/site-search.ts",
              [
                  (
                      '  {\n    href: "/create",\n    label: "Create",',
                      '  {\n    href: "/evidence",\n    label: "Public evidence",\n    summary: "Inspect public-by-default trade evidence, review states, redactions, and the layered proof timeline.",\n    kind: "learn",\n    keywords: ["evidence", "proof", "public", "redaction", "timeline", "verification", "receipt", "completion"],\n  },\n  {\n    href: "/create",\n    label: "Create",',
                      "site search evidence entry",
                  ),
              ],
          )

          patch(
              "src/app/sitemap.ts",
              [
                  (
                      '    {\n      url: getAbsoluteUrl("/accessibility"),',
                      '    {\n      url: getAbsoluteUrl("/evidence"),\n      lastModified: now,\n      changeFrequency: "daily",\n      priority: 0.82,\n    },\n    {\n      url: getAbsoluteUrl("/accessibility"),',
                      "sitemap evidence route",
                  ),
              ],
          )

          baseline_path = Path("config/measurement/public-route-baseline.json")
          baseline = json.loads(baseline_path.read_text())
          baseline["version"] = "moral-trade-public-route-baseline-v0.4-2026-07"
          baseline["purpose"] = (
              "Executable public-route performance and resilience baseline for the action router, "
              "provider-hosted payment handoff, live marketplace, creation, offset, pool, public "
              "evidence, safety, and status pages visitors use before relying on Moral Trade."
          )
          if not any(route.get("path") == "/evidence" for route in baseline["routes"]):
              safety_index = next(
                  (index for index, route in enumerate(baseline["routes"]) if route.get("path") == "/safety"),
                  len(baseline["routes"]) - 1,
              )
              baseline["routes"].insert(
                  safety_index + 1,
                  {"path": "/evidence", "family": "public_evidence", "stage": "trust"},
              )
          baseline_path.write_text(json.dumps(baseline, indent=2) + "\n")

          test_path = Path("tests/public-evidence.spec.ts")
          test_path.write_text('''import { expect, test } from "@playwright/test";\n\nconst externalBase = (process.env.MORALTRADE_BASE_URL ?? "").replace(/\\/$/, "");\nconst route = (path: string) => `${externalBase}${path}`;\n\ntest.describe("public evidence desk", () => {\n  test("serves the public directory and the clearly labeled example", async ({ page }) => {\n    await page.goto(route("/evidence"));\n    await expect(page.getByRole("heading", { name: "Inspect the proof behind every trade." })).toBeVisible();\n    await expect(page.getByRole("link", { name: /Open the example evidence desk/i })).toBeVisible();\n    await expect(page.getByText("Interface example · not a live trade")).toBeVisible();\n  });\n\n  test("opens the proof timeline as a layer and jumps to linked evidence", async ({ page }) => {\n    await page.goto(route("/evidence/example"));\n    await expect(page.locator("[data-pe-desk]")).toBeVisible();\n\n    const timelineToggle = page.locator("[data-pe-timeline-toggle]");\n    const timeline = page.locator("[data-pe-timeline]");\n    await timelineToggle.click();\n    await expect(timelineToggle).toHaveAttribute("aria-expanded", "true");\n    await expect(timeline).toHaveClass(/open/);\n\n    await page.locator('[data-pe-open-evidence="payment"]').click();\n    await expect(page.locator('[data-pe-document="payment"]')).toHaveClass(/active/);\n    await expect(page.locator('[data-pe-inspector="payment"]')).toHaveClass(/active/);\n    await expect(timelineToggle).toHaveAttribute("aria-expanded", "false");\n    await expect(timeline).not.toHaveClass(/open/);\n\n    await page.locator('[data-pe-select="transit"]').first().click();\n    await expect(page.locator('[data-pe-document="transit"]')).toHaveClass(/active/);\n    await expect(page.locator('[data-pe-inspector="transit"]')).toHaveClass(/active/);\n  });\n\n  test("supports document selection and timeline interaction on mobile without horizontal overflow", async ({ page }) => {\n    await page.setViewportSize({ width: 390, height: 844 });\n    await page.goto(route("/evidence/example"));\n\n    await expect(page.locator(".pe-mobile-strip")).toBeVisible();\n    await page.locator('.pe-mobile-strip [data-pe-select="routes"]').click();\n    await expect(page.locator('[data-pe-document="routes"]')).toHaveClass(/active/);\n    await expect(page.locator('[data-pe-inspector="routes"]')).toHaveClass(/active/);\n\n    const timelineToggle = page.locator("[data-pe-timeline-toggle]");\n    await timelineToggle.click();\n    await expect(page.locator("[data-pe-timeline]")).toHaveClass(/open/);\n    await page.keyboard.press("Escape");\n    await expect(timelineToggle).toHaveAttribute("aria-expanded", "false");\n\n    const dimensions = await page.evaluate(() => ({\n      innerWidth: window.innerWidth,\n      scrollWidth: document.documentElement.scrollWidth,\n    }));\n    expect(dimensions.scrollWidth).toBeLessThanOrEqual(dimensions.innerWidth + 1);\n  });\n});\n''')
          PY

      - name: Remove temporary materialization workflows
        shell: bash
        run: |
          rm -f .github/workflows/materialize-public-evidence-v2.yml
          rm -f .github/workflows/finalize-public-evidence-v2.yml

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Evidence interaction tests
        run: npx playwright test tests/public-evidence.spec.ts --reporter=line

      - name: Commit integrated implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrate public-safe evidence into the current trade flow"
          git push origin HEAD:feature/public-evidence-desk-v2
