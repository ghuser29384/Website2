name: Diagnose Vercel release structural contract

on:
  push:
    branches:
      - ops/diagnose-vercel-release-structural-contract-20260812
    paths:
      - ".github/workflows/diagnose-vercel-release-structural-contract-20260812.yml"

permissions:
  contents: read

concurrency:
  group: diagnose-vercel-release-structural-contract-20260812
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      EXPECTED_MAIN_SHA: 69146f2cf9d5f4d747c0c25abda6de75f410098d
      FAILING_TITLE: permanent Vercel release gates are structurally enforced
      NEXT_PUBLIC_SITE_URL: https://www.moraltrade.org
      SITE_URL: https://www.moraltrade.org
      VERCEL: "1"
      VERCEL_ENV: production

    steps:
      - name: Check out the exact failed production candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_MAIN_SHA }}
          fetch-depth: 1

      - name: Guard exact source and production-gate environment
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN_SHA"
          test "$NEXT_PUBLIC_SITE_URL" = 'https://www.moraltrade.org'
          test "$SITE_URL" = 'https://www.moraltrade.org'
          test "$VERCEL" = '1'
          test "$VERCEL_ENV" = 'production'
          git diff --check

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Locate source declarations resembling the failing test title
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          : > vercel-release-structural-contract.source-locations.txt
          grep -R -n -F \
            --exclude-dir=node_modules \
            --exclude-dir=.git \
            "$FAILING_TITLE" . \
            >> vercel-release-structural-contract.source-locations.txt || true
          if [[ ! -s vercel-release-structural-contract.source-locations.txt ]]; then
            grep -R -n -E \
              --exclude-dir=node_modules \
              --exclude-dir=.git \
              'permanent.*Vercel.*release.*structur|Vercel.*release.*gates' . \
              >> vercel-release-structural-contract.source-locations.txt || true
          fi
          location_count="$(wc -l < vercel-release-structural-contract.source-locations.txt | tr -d ' ')"
          echo "location_count=$location_count" >> "$GITHUB_OUTPUT"
          if [[ "$location_count" = '0' ]]; then
            echo 'No literal declaration found; the production-environment TAP stack is authoritative.' \
              > vercel-release-structural-contract.source-search-note.txt
          else
            cat vercel-release-structural-contract.source-locations.txt
          fi

      - name: Reproduce the exact production npm test gate
        id: test
        shell: bash
        run: |
          set -uo pipefail
          set +e
          npm test \
            > >(tee vercel-release-structural-contract.full-test.stdout.log) \
            2> >(tee vercel-release-structural-contract.full-test.stderr.log >&2)
          status=$?
          set -e
          printf '%s\n' "$status" > vercel-release-structural-contract.exit-code
          echo "status=$status" >> "$GITHUB_OUTPUT"

          cat \
            vercel-release-structural-contract.full-test.stdout.log \
            vercel-release-structural-contract.full-test.stderr.log \
            > vercel-release-structural-contract.full-test.combined.log

          python3 - <<'PY'
          import os
          from pathlib import Path

          title = os.environ["FAILING_TITLE"]
          text = Path("vercel-release-structural-contract.full-test.combined.log").read_text(
              encoding="utf-8", errors="replace"
          )
          lines = text.splitlines()
          selected: set[int] = set()
          needles = (
              title,
              "not ok",
              "AssertionError",
              "ERR_ASSERTION",
              "location:",
              "failureType:",
              "expected:",
              "actual:",
              "operator:",
              ".test.ts:",
          )
          for index, line in enumerate(lines):
              if any(needle in line for needle in needles):
                  selected.update(range(max(0, index - 40), min(len(lines), index + 130)))
          output = []
          previous = None
          for index in sorted(selected):
              if previous is not None and index > previous + 1:
                  output.append("... omitted ...")
              output.append(f"{index + 1:06d}: {lines[index]}")
              previous = index
          Path("vercel-release-structural-contract.failure-extract.log").write_text(
              "\n".join(output) + ("\n" if output else ""), encoding="utf-8"
          )
          PY

          {
            echo '### Exact production-environment repository-test reproduction'
            echo
            echo "- Candidate: \`$EXPECTED_MAIN_SHA\`"
            echo "- Source declarations found: \`${{ steps.locate.outputs.location_count }}\`"
            echo "- Exit code: \`$status\`"
            echo "- Environment: \`VERCEL=1\`, \`VERCEL_ENV=production\`"
            echo
            echo '#### Source search'
            echo '```text'
            cat vercel-release-structural-contract.source-locations.txt
            if [[ -f vercel-release-structural-contract.source-search-note.txt ]]; then
              cat vercel-release-structural-contract.source-search-note.txt
            fi
            echo '```'
            echo
            echo '#### Failure extract'
            echo '```text'
            tail -n 360 vercel-release-structural-contract.failure-extract.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload exact diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vercel-release-structural-contract-production-env-${{ github.run_id }}
          path: |
            vercel-release-structural-contract.source-locations.txt
            vercel-release-structural-contract.source-search-note.txt
            vercel-release-structural-contract.full-test.stdout.log
            vercel-release-structural-contract.full-test.stderr.log
            vercel-release-structural-contract.full-test.combined.log
            vercel-release-structural-contract.failure-extract.log
            vercel-release-structural-contract.exit-code
            .github/workflows/vercel-release.yml
            scripts/vercel-release-workflow.test.mjs
          if-no-files-found: warn
          retention-days: 30

      - name: Preserve the reproduced production-gate result
        if: always()
        shell: bash
        run: |
          status='${{ steps.test.outputs.status }}'
          test -n "$status"
          exit "$status"
