name: Cancel extra Metaphilosophy hotfix Preview records once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cancel-metaphilosophy-hotfix-extra-previews-once.yml

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: cancel-metaphilosophy-hotfix-extra-previews-once
  cancel-in-progress: false

env:
  VERCEL_TEAM_ID: team_ySu6sF3Uho1E1GnJtCQPVEuJ
  VERCEL_PROJECT_ID: prj_2Aq2qYbFw85GBMRLXdfyTIwvEXhZ
  KEEP_DEPLOYMENT_ID: dpl_4MeTJbpZnYx6ffjnzjdtSvnu8pmE
  CONTROLLER_PATH: .github/workflows/cancel-metaphilosophy-hotfix-extra-previews-once.yml

jobs:
  cancel:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out exact controller commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Guard exact repository and controller scope
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'ghuser29384/Website2'
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$GITHUB_ACTOR" = 'ghuser29384'
          changed="$(git diff-tree --no-commit-id --name-only -r HEAD | sed '/^$/d')"
          test "$changed" = "$CONTROLLER_PATH"

      - name: Cancel only the three superseded Preview records
        id: cancel
        continue-on-error: true
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          ids=(
            dpl_9zxBi7oFqNMwFvtiywUSF1izVYR5
            dpl_9rHk8vETH6Y53ZvuyvJAu1rzcyEA
            dpl_AV6kdJUamS2zTmk39Rf6oUfBCucF
          )
          : > metaphilosophy-hotfix-preview-cancellations.jsonl
          for id in "${ids[@]}"; do
            before="$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v13/deployments/$id?teamId=$VERCEL_TEAM_ID")"
            test "$(jq -r .projectId <<<"$before")" = "$VERCEL_PROJECT_ID"
            test "$(jq -r '.target // "preview"' <<<"$before")" = 'preview'
            test "$(jq -r '.meta.githubCommitRef // ""' <<<"$before")" = 'release/vercel-preview'
            state="$(jq -r '.readyState // .state // "UNKNOWN"' <<<"$before")"
            if [[ "$state" == 'QUEUED' || "$state" == 'BUILDING' || "$state" == 'INITIALIZING' ]]; then
              curl --fail-with-body --silent --show-error \
                -X PATCH \
                -H "Authorization: Bearer $VERCEL_TOKEN" \
                "https://api.vercel.com/v12/deployments/$id/cancel?teamId=$VERCEL_TEAM_ID" \
                > "cancel-$id.json"
              action=cancelled
            else
              printf '%s\n' "$before" > "cancel-$id.json"
              action=already_terminal
            fi
            jq -n --arg id "$id" --arg before "$state" --arg action "$action" \
              '{id:$id,before:$before,action:$action}' >> metaphilosophy-hotfix-preview-cancellations.jsonl
          done

          sleep 5
          for id in "${ids[@]}"; do
            after="$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v13/deployments/$id?teamId=$VERCEL_TEAM_ID")"
            state="$(jq -r '.readyState // .state // "UNKNOWN"' <<<"$after")"
            if [[ "$state" != 'CANCELED' && "$state" != 'ERROR' ]]; then
              echo "Deployment $id remained $state" >&2
              exit 1
            fi
          done

          keep="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v13/deployments/$KEEP_DEPLOYMENT_ID?teamId=$VERCEL_TEAM_ID")"
          test "$(jq -r .projectId <<<"$keep")" = "$VERCEL_PROJECT_ID"
          test "$(jq -r '.meta.githubCommitSha // ""' <<<"$keep")" = '1a70216fc1a80b048150283ef8cf4b2d42bb4fbd'
          test "$(jq -r '.meta.githubCommitRef // ""' <<<"$keep")" = 'release/vercel-preview'
          jq -s '.' metaphilosophy-hotfix-preview-cancellations.jsonl > metaphilosophy-hotfix-preview-cancellations.json

      - name: Upload cancellation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metaphilosophy-hotfix-preview-cancellations-${{ github.run_id }}
          path: |
            metaphilosophy-hotfix-preview-cancellations.jsonl
            metaphilosophy-hotfix-preview-cancellations.json
            cancel-*.json
          if-no-files-found: warn
          retention-days: 30

      - name: Report outcome to hotfix PR
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [[ '${{ steps.cancel.outcome }}' == 'success' ]]; then
            gh pr comment 19 --repo ghuser29384/RL-for-Conceptual-Reasoning --body "The three superseded release-preview records were canceled. The single retained exact-candidate Preview is \`$KEEP_DEPLOYMENT_ID\` for head \`1a70216fc1a80b048150283ef8cf4b2d42bb4fbd\`. Evidence: $run_url"
          else
            gh pr comment 19 --repo ghuser29384/RL-for-Conceptual-Reasoning --body "The hotfix Preview cleanup did not verify every superseded record as terminal. No complete cleanup claim is made. Evidence: $run_url"
          fi

      - name: Remove one-time controller with verdict
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ '${{ steps.cancel.outcome }}' == 'success' ]]; then
            message='Remove one-time Metaphilosophy hotfix Preview cleanup after PASS'
          else
            message='Remove one-time Metaphilosophy hotfix Preview cleanup after FAIL'
          fi
          blob_sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/$CONTROLLER_PATH?ref=main" --jq .sha 2>/dev/null || true)"
          if [[ -n "$blob_sha" ]]; then
            jq -n --arg message "$message" --arg sha "$blob_sha" --arg branch main \
              '{message:$message,sha:$sha,branch:$branch}' \
              | gh api --method DELETE "repos/$GITHUB_REPOSITORY/contents/$CONTROLLER_PATH" --input - >/dev/null
          fi

      - name: Enforce cancellation success
        if: always()
        run: test '${{ steps.cancel.outcome }}' = 'success'
