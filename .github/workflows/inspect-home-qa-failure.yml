name: Inspect home QA failure

on:
  push:
    branches:
      - feat/smart-query-pipeline
    paths:
      - ".github/workflows/inspect-home-qa-failure.yml"

permissions:
  actions: read
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/smart-query-pipeline
          fetch-depth: 0

      - name: Download and summarize failed job log
        env:
          GH_TOKEN: ${{ github.token }}
          FAILED_JOB_ID: "89173282168"
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/jobs/${FAILED_JOB_ID}/logs" \
            --output /tmp/home-qa.log
          python - <<'PY'
          from pathlib import Path
          import re

          source = Path('/tmp/home-qa.log').read_text('utf-8', errors='replace')
          source = re.sub(r'\x1b\[[0-9;]*[A-Za-z]', '', source)
          lines = source.splitlines()
          signals = (
              'not ok', 'assertionerror', 'error:', 'err_', 'expected', 'actual',
              'failed', 'failure', 'test at', 'subtest', 'npm error', 'exit code'
          )
          selected = []
          for index, line in enumerate(lines):
              lowered = line.lower()
              if any(signal in lowered for signal in signals):
                  start = max(0, index - 3)
                  end = min(len(lines), index + 8)
                  selected.extend(lines[start:end])
          if not selected:
              selected = lines[-180:]
          deduped = []
          for line in selected:
              if not deduped or deduped[-1] != line:
                  deduped.append(line)
          Path('.github/home-qa-failure.txt').write_text('\n'.join(deduped[-260:]) + '\n', 'utf-8')
          PY

      - name: Commit diagnostic excerpt
        run: |
          git config user.name "moral-trade-query-bot"
          git config user.email "moral-trade-query-bot@users.noreply.github.com"
          git add .github/home-qa-failure.txt
          git commit -m "Record home QA failure excerpt"
          git push origin HEAD:feat/smart-query-pipeline
