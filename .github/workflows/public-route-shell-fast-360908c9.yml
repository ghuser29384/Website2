name: Public route resolved Home main diagnostic 285af803

on:
  pull_request:
    paths:
      - ".github/workflows/public-route-shell-fast-360908c9.yml"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: public-route-shell-fast-gates
  cancel-in-progress: true

env:
  BASE_SHA: 87b093751a4c2de909555abdb7f181061bb36390
  CANDIDATE_SHA: 285af8035c4f8ea2b606c7733c70abd2427ecae0
  PRODUCT_PR: "542"
  EVIDENCE_DIR: public-route-resolved-home-main-diagnostic-285af803
  NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3210
  SITE_URL: http://127.0.0.1:3210
  PLAYWRIGHT_HTML_OPEN: never

jobs:
  diagnose-resolved-home-main:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Guard exact product identity and scope
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          product_pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PRODUCT_PR}")"
          test "$(jq -r .state <<<"$product_pr")" = open
          test "$(jq -r .head.sha <<<"$product_pr")" = "$CANDIDATE_SHA"
          test "$(jq -r .base.sha <<<"$product_pr")" = "$BASE_SHA"
          actual_files="$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/pulls/${PRODUCT_PR}/files?per_page=100" \
            --jq '.[].filename' | sort)"
          expected_files="$(printf '%s\n' \
            'public/moral-trade-live-navigation.js' \
            'src/app/donation-offsets/error.tsx' \
            'src/app/priority-correction-fund/error.tsx' \
            'src/components/create/create-interface-frame.tsx' \
            'src/components/layout/public-route-error.tsx' \
            'tests/public-routes.spec.ts' | sort)"
          test "$actual_files" = "$expected_files"

      - name: Check out immutable candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Write resolved Home landmark diagnostic
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          cat > tests/home-main-diagnostic.spec.ts <<'TS'
          import { expect, test } from "@playwright/test";

          test("records every main after the live Home document resolves", async ({ page }, testInfo) => {
            await page.goto("/", { waitUntil: "domcontentloaded" });
            await expect(page.locator("#mt-live-document-heading")).toHaveCount(1, {
              timeout: 30_000,
            });
            await expect(page.locator('[data-mt-feed-link="true"]')).not.toHaveCount(0, {
              timeout: 15_000,
            });
            await page.waitForTimeout(1_000);

            const diagnostics = await page.locator("main").evaluateAll((elements) =>
              elements.map((element, index) => {
                const html = element as HTMLElement;
                const style = getComputedStyle(html);
                const rect = html.getBoundingClientRect();
                const heading = element.querySelector("h1, h2, h3");
                const hiddenAncestor = element.closest("[hidden], [aria-hidden='true'], [inert]");
                return {
                  index,
                  id: html.id,
                  className: html.className,
                  role: html.getAttribute("role"),
                  ariaLabel: html.getAttribute("aria-label"),
                  parentTag: html.parentElement?.tagName ?? null,
                  parentId: html.parentElement?.id ?? null,
                  parentClassName: html.parentElement?.className ?? null,
                  heading: heading?.textContent?.replace(/\s+/g, " ").trim().slice(0, 240) ?? null,
                  text: html.textContent?.replace(/\s+/g, " ").trim().slice(0, 700) ?? "",
                  display: style.display,
                  visibility: style.visibility,
                  opacity: style.opacity,
                  position: style.position,
                  contentVisibility: style.contentVisibility,
                  width: rect.width,
                  height: rect.height,
                  top: rect.top,
                  left: rect.left,
                  hiddenAncestor: hiddenAncestor
                    ? `${hiddenAncestor.tagName.toLowerCase()}#${(hiddenAncestor as HTMLElement).id}.${
                        (hiddenAncestor as HTMLElement).className
                      }`
                    : null,
                  dataAttributes: Object.fromEntries(
                    [...html.attributes]
                      .filter((attribute) => attribute.name.startsWith("data-"))
                      .map((attribute) => [attribute.name, attribute.value]),
                  ),
                };
              }),
            );
            const controls = await page
              .locator('[data-mt-feed-link], [data-mt-discover-link], [data-mt-evidence-link]')
              .evaluateAll((elements) =>
                elements.map((element, index) => ({
                  index,
                  tag: element.tagName,
                  text: element.textContent?.replace(/\s+/g, " ").trim() ?? "",
                  href: element.getAttribute("href"),
                  ariaLabel: element.getAttribute("aria-label"),
                  display: getComputedStyle(element).display,
                  width: (element as HTMLElement).getBoundingClientRect().width,
                  height: (element as HTMLElement).getBoundingClientRect().height,
                  attributes: Object.fromEntries(
                    [...element.attributes].map((attribute) => [attribute.name, attribute.value]),
                  ),
                })),
              );

            console.log(`HOME_MAIN_DIAGNOSTICS=${JSON.stringify(diagnostics, null, 2)}`);
            console.log(`HOME_NAVIGATION_DIAGNOSTICS=${JSON.stringify(controls, null, 2)}`);
            await page.screenshot({ path: testInfo.outputPath("resolved-home-full.png"), fullPage: true });
            expect(diagnostics.length).toBeGreaterThan(0);
          });
          TS

      - name: Run resolved Home landmark diagnostic
        shell: bash
        run: |
          set -o pipefail
          rm -rf .next
          npx playwright test tests/home-main-diagnostic.spec.ts --workers=1 --reporter=line \
            2>&1 | tee "$EVIDENCE_DIR/resolved-home-main-diagnostic.log"

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-route-resolved-home-main-diagnostic-285af803
          path: |
            public-route-resolved-home-main-diagnostic-285af803
            test-results
          if-no-files-found: error
          retention-days: 14
