name: Public route Home main CSS diagnostic 285af803

on:
  pull_request:
    paths:
      - ".github/workflows/public-route-shell-fast-360908c9.yml"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: public-route-shell-fast-gates
  cancel-in-progress: true

env:
  BASE_SHA: 87b093751a4c2de909555abdb7f181061bb36390
  CANDIDATE_SHA: 285af8035c4f8ea2b606c7733c70abd2427ecae0
  PRODUCT_PR: "542"
  EVIDENCE_DIR: public-route-home-main-css-diagnostic-285af803
  NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3210
  SITE_URL: http://127.0.0.1:3210
  PLAYWRIGHT_HTML_OPEN: never

jobs:
  diagnose-home-main-css:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Guard exact product identity and scope
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          product_pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PRODUCT_PR}")"
          test "$(jq -r .state <<<"$product_pr")" = open
          test "$(jq -r .head.sha <<<"$product_pr")" = "$CANDIDATE_SHA"
          test "$(jq -r .base.sha <<<"$product_pr")" = "$BASE_SHA"
          actual_files="$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/pulls/${PRODUCT_PR}/files?per_page=100" \
            --jq '.[].filename' | sort)"
          expected_files="$(printf '%s\n' \
            'public/moral-trade-live-navigation.js' \
            'src/app/donation-offsets/error.tsx' \
            'src/app/priority-correction-fund/error.tsx' \
            'src/components/create/create-interface-frame.tsx' \
            'src/components/layout/public-route-error.tsx' \
            'tests/public-routes.spec.ts' | sort)"
          test "$actual_files" = "$expected_files"

      - name: Check out immutable candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Write Home main CSS diagnostic
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          cat > tests/home-main-css-diagnostic.spec.ts <<'TS'
          import { expect, test } from "@playwright/test";

          test("records CSS selectors affecting the outer and nested Home mains", async ({ page }) => {
            await page.goto("/", { waitUntil: "domcontentloaded" });
            await expect(page.locator("#mt-live-document-heading")).toHaveCount(1, {
              timeout: 30_000,
            });
            await expect(page.locator('[data-mt-feed-link="true"]')).not.toHaveCount(0, {
              timeout: 15_000,
            });
            await page.waitForTimeout(1_000);

            const diagnostics = await page.evaluate(() => {
              const elements = [...document.querySelectorAll("main")];

              function collectRulesFor(element: Element) {
                const matches: Array<{
                  selector: string;
                  declarations: string;
                  context: string[];
                  source: string;
                }> = [];

                function visitRules(
                  rules: CSSRuleList,
                  context: string[],
                  source: string,
                ) {
                  for (const rule of [...rules]) {
                    if (rule instanceof CSSStyleRule) {
                      try {
                        if (element.matches(rule.selectorText)) {
                          matches.push({
                            selector: rule.selectorText,
                            declarations: rule.style.cssText,
                            context,
                            source,
                          });
                        }
                      } catch {
                        // Ignore selectors unsupported by Element.matches().
                      }
                      continue;
                    }

                    if (
                      rule instanceof CSSMediaRule ||
                      rule instanceof CSSSupportsRule ||
                      rule instanceof CSSLayerBlockRule
                    ) {
                      const nextContext = [...context, rule.cssText.slice(0, rule.cssText.indexOf("{"))];
                      visitRules(rule.cssRules, nextContext, source);
                    }
                  }
                }

                for (const sheet of [...document.styleSheets]) {
                  try {
                    visitRules(sheet.cssRules, [], sheet.href ?? "inline");
                  } catch {
                    matches.push({
                      selector: "<inaccessible stylesheet>",
                      declarations: "",
                      context: [],
                      source: sheet.href ?? "inline",
                    });
                  }
                }

                return matches;
              }

              return elements.map((element, index) => {
                const html = element as HTMLElement;
                const style = getComputedStyle(html);
                return {
                  index,
                  id: html.id,
                  className: html.className,
                  parentClassName: html.parentElement?.className ?? null,
                  computed: {
                    display: style.display,
                    position: style.position,
                    boxSizing: style.boxSizing,
                    width: style.width,
                    minWidth: style.minWidth,
                    maxWidth: style.maxWidth,
                    height: style.height,
                    minHeight: style.minHeight,
                    padding: style.padding,
                    margin: style.margin,
                    gridArea: style.gridArea,
                    gridColumn: style.gridColumn,
                    gridRow: style.gridRow,
                    alignSelf: style.alignSelf,
                    justifySelf: style.justifySelf,
                    overflow: style.overflow,
                  },
                  matchingRules: collectRulesFor(element),
                };
              });
            });

            console.log(`HOME_MAIN_CSS_DIAGNOSTICS=${JSON.stringify(diagnostics, null, 2)}`);
            expect(diagnostics).toHaveLength(2);
          });
          TS

      - name: Run Home main CSS diagnostic
        shell: bash
        run: |
          set -o pipefail
          rm -rf .next
          npx playwright test tests/home-main-css-diagnostic.spec.ts --workers=1 --reporter=line \
            2>&1 | tee "$EVIDENCE_DIR/home-main-css-diagnostic.log"

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-route-home-main-css-diagnostic-285af803
          path: public-route-home-main-css-diagnostic-285af803
          if-no-files-found: error
          retention-days: 14
