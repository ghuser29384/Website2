name: Repair DAC terminal invariants once

on:
  push:
    branches:
      - fix/mpgf-dac-success-lapse-20260807
    paths:
      - .github/workflows/repair-dac-terminal-invariants-once.yml

permissions:
  contents: write

concurrency:
  group: repair-dac-terminal-invariants-once
  cancel-in-progress: false

env:
  TARGET_BRANCH: fix/mpgf-dac-success-lapse-20260807
  EXPECTED_PARENT: 7eb781e3b3a8897869430a7e038811044e55af0e
  CONTROLLER_PATH: .github/workflows/repair-dac-terminal-invariants-once.yml
  MIGRATION_PATH: supabase/migrations/20260807050000_mpgf_dac_success_lapse.sql
  REGRESSION_PATH: supabase/tests/mpgf_dac_success_lapse.sql
  SOURCE_TEST_PATH: src/lib/mpgf/dac-success-lapse-migration.test.ts

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out exact target
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 2

      - name: Guard and repair terminal invariants
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git diff-tree --no-commit-id --name-only -r HEAD)" = "$CONTROLLER_PATH"

          python3 - <<'PY'
          from pathlib import Path

          migration_path = Path("supabase/migrations/20260807050000_mpgf_dac_success_lapse.sql")
          regression_path = Path("supabase/tests/mpgf_dac_success_lapse.sql")
          source_path = Path("src/lib/mpgf/dac-success-lapse-migration.test.ts")

          migration = migration_path.read_text()

          status_marker = """  );

alter table public.mpgf_pool_lifecycle_events
"""
          status_replacement = """  );

alter table public.mpgf_pool_proposals
  drop constraint if exists mpgf_pool_proposals_lock_complete;
alter table public.mpgf_pool_proposals
  add constraint mpgf_pool_proposals_lock_complete
  check (
    (
      status in ('approved_as_candidate', 'succeeded', 'lapsed')
    ) = (
      approved_terms_version is not null
      and operative_terms_sha256 is not null
      and terms_locked_at is not null
      and reviewed_by is not null
      and reviewed_at is not null
    )
  ) not valid;

alter table public.mpgf_pool_lifecycle_events
"""
          if migration.count(status_marker) != 1:
              raise SystemExit(f"Expected one proposal-status marker, found {migration.count(status_marker)}")
          migration = migration.replace(status_marker, status_replacement, 1)

          declaration_marker = """  pledge_row public.mpgf_public_goods_pledges%rowtype;
  campaign_row public.mpgf_public_goods_campaigns%rowtype;
"""
          declaration_replacement = """  pledge_row public.mpgf_public_goods_pledges%rowtype;
  intent_row public.mpgf_dac_pledge_intents%rowtype;
  campaign_row public.mpgf_public_goods_campaigns%rowtype;
"""
          if migration.count(declaration_marker) != 1:
              raise SystemExit(f"Expected one eligibility declaration marker, found {migration.count(declaration_marker)}")
          migration = migration.replace(declaration_marker, declaration_replacement, 1)

          reviewer_marker = """  perform public.mpgf_assert_authorized_pool_reviewer(
    p_reviewer_id,
    pledge_row.pool_proposal_id
  );
"""
          intent_guard = """  select * into intent_row
  from public.mpgf_dac_pledge_intents as intent
  where intent.id = pledge_row.pledge_intent_id;

  if intent_row.id is null
     or intent_row.campaign_id is distinct from pledge_row.campaign_id
     or intent_row.pool_proposal_id is distinct from pledge_row.pool_proposal_id
     or intent_row.terms_version is distinct from pledge_row.terms_version
     or intent_row.terms_sha256 is distinct from pledge_row.terms_sha256
     or intent_row.profile_id is distinct from pledge_row.profile_id
     or intent_row.amount_cents is distinct from pledge_row.amount_cents
     or intent_row.currency is distinct from pledge_row.currency
     or intent_row.visibility_mode is distinct from pledge_row.visibility_mode
     or intent_row.supporter_reason is distinct from pledge_row.supporter_reason
     or intent_row.accepted_at is distinct from pledge_row.accepted_at then
    raise exception using
      errcode = '23514',
      message = 'The canonical DAC pledge differs from its immutable consent intent.';
  end if;

""" + reviewer_marker
          if migration.count(reviewer_marker) != 1:
              raise SystemExit(f"Expected one pledge-review authorization marker, found {migration.count(reviewer_marker)}")
          migration = migration.replace(reviewer_marker, intent_guard, 1)

          aggregate_marker = """  select
    coalesce(sum(pledge.amount_cents), 0)::bigint,
    count(distinct pledge.profile_id)::integer
"""
          audited_guard = """  if exists (
    select 1
    from public.mpgf_public_goods_pledges as pledge
    left join public.mpgf_dac_pledge_intents as intent
      on intent.id = pledge.pledge_intent_id
    where pledge.campaign_id = campaign_row.id
      and pledge.pledge_intent_id is not null
      and (
        intent.id is null
        or intent.campaign_id is distinct from pledge.campaign_id
        or intent.pool_proposal_id is distinct from pledge.pool_proposal_id
        or intent.terms_version is distinct from pledge.terms_version
        or intent.terms_sha256 is distinct from pledge.terms_sha256
        or intent.profile_id is distinct from pledge.profile_id
        or intent.amount_cents is distinct from pledge.amount_cents
        or intent.currency is distinct from pledge.currency
        or intent.visibility_mode is distinct from pledge.visibility_mode
        or intent.supporter_reason is distinct from pledge.supporter_reason
        or intent.accepted_at is distinct from pledge.accepted_at
        or pledge.eligibility_state = 'pending_review'
        or not exists (
          select 1
          from public.mpgf_dac_pledge_events as eligibility_event
          where eligibility_event.pledge_id = pledge.id
            and eligibility_event.pledge_intent_id = pledge.pledge_intent_id
            and eligibility_event.campaign_id = pledge.campaign_id
            and eligibility_event.pool_proposal_id = pledge.pool_proposal_id
            and eligibility_event.profile_id = pledge.profile_id
            and eligibility_event.event_type = 'eligibility_reviewed'
            and eligibility_event.terms_version = pledge.terms_version
            and eligibility_event.terms_sha256 = pledge.terms_sha256
            and eligibility_event.amount_cents = pledge.amount_cents
            and eligibility_event.currency = pledge.currency
            and eligibility_event.event_sha256 =
              public.mpgf_dac_json_sha256(eligibility_event.event_json)
            and eligibility_event.event_json ->> 'toEligibilityState' =
              pledge.eligibility_state
            and (eligibility_event.event_json ->> 'humanScoreBps')::integer =
              pledge.human_score_bps
        )
      )
  ) then
    raise exception using
      errcode = '23514',
      message = 'Every DAC pledge must have a final audited eligibility decision bound to its immutable consent intent before finalization.';
  end if;

""" + aggregate_marker
          if migration.count(aggregate_marker) != 1:
              raise SystemExit(f"Expected one terminal aggregate marker, found {migration.count(aggregate_marker)}")
          migration = migration.replace(aggregate_marker, audited_guard, 1)
          migration_path.write_text(migration)

          regression = regression_path.read_text()

          extra_pledge_marker = """select * from public.mpgf_create_dac_pledge(
  'campaign-af777777777747778777777777777777',
  1000,
  'public_supporter',
  null,
  'qa-dac-terminal-lapse-pledger-one'
);
"""
          extra_pledge_replacement = extra_pledge_marker + """select * from public.mpgf_create_dac_pledge(
  'campaign-af666666666646668666666666666666',
  100,
  'private_amount',
  null,
  'qa-dac-terminal-success-pending-extra'
);
"""
          if regression.count(extra_pledge_marker) != 1:
              raise SystemExit(f"Expected one extra-pledge insertion marker, found {regression.count(extra_pledge_marker)}")
          regression = regression.replace(extra_pledge_marker, extra_pledge_replacement, 1)

          lapse_review_marker = """select * from public.mpgf_review_dac_pledge_eligibility(
  (
    select id from public.mpgf_public_goods_pledges
    where campaign_id = 'campaign-af777777777747778777777777777777'
      and profile_id = 'ac333333-3333-4333-8333-333333333333'
      and pledge_intent_id is not null
  ),
  'ab222222-2222-4222-8222-222222222222',
  'eligible',
  10000,
  'Verify the lone lapse pledger as a unique eligible person'
);
"""
          pending_guard_test = """do $test$
begin
  begin
    perform public.mpgf_finalize_dac_campaign(
      'campaign-af666666666646668666666666666666',
      'ab222222-2222-4222-8222-222222222222',
      'A threshold-met DAC with a pending eligibility decision must not finalize'
    );
    raise exception 'A DAC campaign finalized while one pledge still awaited eligibility review.';
  exception
    when check_violation then null;
  end;
end;
$test$;

select * from public.mpgf_review_dac_pledge_eligibility(
  (
    select id from public.mpgf_public_goods_pledges
    where campaign_id = 'campaign-af666666666646668666666666666666'
      and profile_id = 'ac333333-3333-4333-8333-333333333333'
      and amount_cents = 100
      and pledge_intent_id is not null
  ),
  'ab222222-2222-4222-8222-222222222222',
  'blocked',
  0,
  'Resolve the extra success pledge as ineligible before terminal evaluation'
);

""" + lapse_review_marker
          if regression.count(lapse_review_marker) != 1:
              raise SystemExit(f"Expected one lapse eligibility marker, found {regression.count(lapse_review_marker)}")
          regression = regression.replace(lapse_review_marker, pending_guard_test, 1)

          regression = regression.replace(
              "  success_pledged_count integer;\n  lapse_expired_count integer;",
              "  success_pledged_count integer;\n  success_eligible_count integer;\n  success_blocked_count integer;\n  lapse_expired_count integer;",
              1,
          )
          count_marker = """  select count(*) into lapse_expired_count
  from public.mpgf_public_goods_pledges
"""
          count_replacement = """  select count(*) into success_eligible_count
  from public.mpgf_public_goods_pledges
  where campaign_id = 'campaign-af666666666646668666666666666666'
    and pledge_intent_id is not null
    and status = 'pledged'
    and eligibility_state = 'eligible';

  select count(*) into success_blocked_count
  from public.mpgf_public_goods_pledges
  where campaign_id = 'campaign-af666666666646668666666666666666'
    and pledge_intent_id is not null
    and status = 'pledged'
    and eligibility_state = 'blocked';

""" + count_marker
          if regression.count(count_marker) != 1:
              raise SystemExit(f"Expected one pledge-disposition count marker, found {regression.count(count_marker)}")
          regression = regression.replace(count_marker, count_replacement, 1)

          regression = regression.replace(
              "     or success_pledged_count <> 2\n     or lapse_expired_count <> 1\n     or creation_event_count <> 3\n     or eligibility_event_count <> 3",
              "     or success_pledged_count <> 3\n     or success_eligible_count <> 2\n     or success_blocked_count <> 1\n     or lapse_expired_count <> 1\n     or creation_event_count <> 4\n     or eligibility_event_count <> 4",
              1,
          )
          regression = regression.replace(
              "      success_pledged_count,\n      lapse_expired_count,",
              "      success_pledged_count,\n      success_eligible_count,\n      success_blocked_count,\n      lapse_expired_count,",
              1,
          )
          regression = regression.replace(
              "lifecycle %/%, pledge disposition %/%, events %/%/%, payments %",
              "lifecycle %/%, pledge disposition %/%/%/%, events %/%/%, payments %",
              1,
          )
          regression_path.write_text(regression)

          source = source_path.read_text()
          source = source.replace(
              "  assert.match(migration, /pool_lapsed/);",
              "  assert.match(migration, /pool_lapsed/);\n  assert.match(\n    migration,\n    /status in \\('approved_as_candidate', 'succeeded', 'lapsed'\\)/,\n  );",
              1,
          )
          source = source.replace(
              "  assert.match(migration, /count\\(distinct pledge\\.profile_id\\)/);",
              "  assert.match(migration, /count\\(distinct pledge\\.profile_id\\)/);\n  assert.match(\n    migration,\n    /Every DAC pledge must have a final audited eligibility decision bound to its immutable consent intent before finalization/,\n  );\n  assert.match(\n    migration,\n    /The canonical DAC pledge differs from its immutable consent intent/,\n  );",
              1,
          )
          source = source.replace(
              "  assert.match(regression, /Replay the exact successful terminal transition/);",
              "  assert.match(regression, /Replay the exact successful terminal transition/);\n  assert.match(\n    regression,\n    /A threshold-met DAC with a pending eligibility decision must not finalize/,\n  );",
              1,
          )
          source = source.replace(
              "  assert.match(regression, /success_pledged_count <> 2/);",
              "  assert.match(regression, /success_pledged_count <> 3/);\n  assert.match(regression, /success_eligible_count <> 2/);\n  assert.match(regression, /success_blocked_count <> 1/);",
              1,
          )
          source_path.write_text(source)
          PY

          git diff --check
          grep -Fq "status in ('approved_as_candidate', 'succeeded', 'lapsed')" "$MIGRATION_PATH"
          grep -Fq 'Every DAC pledge must have a final audited eligibility decision' "$MIGRATION_PATH"
          grep -Fq 'The canonical DAC pledge differs from its immutable consent intent' "$MIGRATION_PATH"
          grep -Fq 'A threshold-met DAC with a pending eligibility decision must not finalize' "$REGRESSION_PATH"
          grep -Fq 'success_blocked_count <> 1' "$REGRESSION_PATH"

      - name: Commit only the terminal invariant repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$MIGRATION_PATH" "$REGRESSION_PATH" "$SOURCE_TEST_PATH"
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = "3"
          git diff --cached --check
          git commit -m "Harden DAC terminal lock and audited-eligibility invariants"
          git push origin "HEAD:$TARGET_BRANCH"
