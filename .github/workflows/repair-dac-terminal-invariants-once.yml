name: Repair DAC terminal invariants once

on:
  push:
    branches:
      - fix/mpgf-dac-success-lapse-20260807
    paths:
      - .github/workflows/repair-dac-terminal-invariants-once.yml

permissions:
  contents: write

concurrency:
  group: repair-dac-terminal-invariants-once
  cancel-in-progress: false

env:
  TARGET_BRANCH: fix/mpgf-dac-success-lapse-20260807
  EXPECTED_PARENT: c2f5bcf9818dd9a9ab56d0f646f807bd7df1a8e9
  CONTROLLER_PATH: .github/workflows/repair-dac-terminal-invariants-once.yml
  MIGRATION_PATH: supabase/migrations/20260807050000_mpgf_dac_success_lapse.sql
  REGRESSION_PATH: supabase/tests/mpgf_dac_success_lapse.sql
  SOURCE_TEST_PATH: src/lib/mpgf/dac-success-lapse-migration.test.ts

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out exact target
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 2

      - name: Guard and repair terminal invariants
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git diff-tree --no-commit-id --name-only -r HEAD)" = "$CONTROLLER_PATH"
          printf '%s' '' | base64 --decode | python3
          git diff --check
          grep -Fq "status in ('approved_as_candidate', 'succeeded', 'lapsed')" "$MIGRATION_PATH"
          grep -Fq 'Every DAC pledge must have a final audited eligibility decision' "$MIGRATION_PATH"
          grep -Fq 'The canonical DAC pledge differs from its immutable consent intent' "$MIGRATION_PATH"
          grep -Fq 'A threshold-met DAC with a pending eligibility decision must not finalize' "$REGRESSION_PATH"
          grep -Fq 'success_blocked_count <> 1' "$REGRESSION_PATH"

      - name: Commit only the terminal invariant repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$MIGRATION_PATH" "$REGRESSION_PATH" "$SOURCE_TEST_PATH"
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = "3"
          git diff --cached --check
          git commit -m "Harden DAC terminal lock and audited-eligibility invariants"
          git push origin "HEAD:$TARGET_BRANCH"
