name: Monitor MoralTrade QA resume

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/monitor-moraltrade-qa-resume.yml"
      - ".github/scripts/monitor-moraltrade-qa-resume.py"

permissions:
  actions: read
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Download and run the pinned monitor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/ghuser29384/Website2/1154cb88bf9c3a13d827a80b5cfd4008c7f2d00e/.github/scripts/monitor-moraltrade-qa-resume.py \
            --output "$RUNNER_TEMP/monitor.py"
          python3 "$RUNNER_TEMP/monitor.py"
