name: Add Compact outflow phase-order contract v1

on:
  push:
    branches:
      - feature/compact-authoritative-outflow-ledger-v1-20260816
    paths:
      - .github/workflows/add-compact-outflow-phase-order-contract-v1.yml

permissions:
  contents: write

jobs:
  update-scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact controller commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Freeze the durable phase-order contract in exact scope
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/compact-authoritative-outflow-ledger-qa.yml')
          source = path.read_text(encoding='utf-8')
          expected_anchor = '          src/lib/mpgf/compact-authoritative-outflow-contract.test.ts\n'
          expected_insert = expected_anchor + '          src/lib/mpgf/compact-authoritative-outflow-phase-order-contract.test.ts\n'
          if source.count(expected_anchor) != 1:
              raise SystemExit('Expected exactly one changed-file manifest anchor.')
          source = source.replace(expected_anchor, expected_insert)
          count_anchor = '          test "$(wc -l < /tmp/actual-files.txt)" -eq 14\n'
          if source.count(count_anchor) != 1:
              raise SystemExit('Expected the frozen 14-file count once.')
          source = source.replace(count_anchor, '          test "$(wc -l < /tmp/actual-files.txt)" -eq 15\n')
          test_anchor = '            src/lib/mpgf/compact-authoritative-outflow-contract.test.ts \\\n'
          test_insert = test_anchor + '            src/lib/mpgf/compact-authoritative-outflow-phase-order-contract.test.ts \\\n'
          if source.count(test_anchor) != 1:
              raise SystemExit('Expected exactly one focused-test anchor.')
          source = source.replace(test_anchor, test_insert)
          path.write_text(source, encoding='utf-8')
          PY
          git diff --check
          grep -q 'compact-authoritative-outflow-phase-order-contract.test.ts' .github/workflows/compact-authoritative-outflow-ledger-qa.yml
          grep -q 'actual-files.txt)" -eq 15' .github/workflows/compact-authoritative-outflow-ledger-qa.yml

      - name: Commit scope update and remove controller
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/compact-authoritative-outflow-ledger-qa.yml
          git rm .github/workflows/add-compact-outflow-phase-order-contract-v1.yml
          git commit -m "test: freeze Compact outflow phase ordering"
          git push origin "HEAD:${GITHUB_REF_NAME}"
