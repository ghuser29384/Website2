name: Dispatch PR 212 integrated rendered regressions

on:
  push:
    branches:
      - agent/pr212-main-integration-ops-20260730
    paths:
      - .github/workflows/pr212-dispatch-main-integration.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Dispatch exact rendered-regression workflow
        run: gh workflow run pr212-integrated-rendered-regressions.yml --repo "$GITHUB_REPOSITORY" --ref agent/pr212-main-integration-ops-20260730
