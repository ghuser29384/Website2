name: MPGF pool review and terms-freeze gates

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/mpgf-pool-review-freeze-gates.yml"
      - "src/lib/mpgf/pool-review-freeze-migration.test.ts"
      - "supabase/migrations/20260806110000_mpgf_pool_review_freeze.sql"
      - "supabase/tests/mpgf_pool_review_freeze.sql"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mpgf-pool-review-freeze-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-gates:
    name: Exact-head source, test, lint, typecheck, and build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      NEXT_PUBLIC_SITE_URL: https://www.moraltrade.org
      VERCEL: "1"
      VERCEL_ENV: preview

    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Verify the exact candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          git merge-base --is-ancestor "$EXPECTED_BASE_SHA" HEAD
          {
            printf 'commit=%s\n' "$(git rev-parse HEAD)"
            printf 'tree=%s\n' "$(git rev-parse HEAD^{tree})"
            sha256sum \
              supabase/migrations/20260806110000_mpgf_pool_review_freeze.sql \
              supabase/tests/mpgf_pool_review_freeze.sql \
              src/lib/mpgf/pool-review-freeze-migration.test.ts
          } | tee mpgf-pool-review-freeze-exact-head.txt

      - name: Install dependencies
        run: npm ci

      - name: Run focused migration contract tests
        run: |
          set -euo pipefail
          node --import tsx --test \
            src/lib/mpgf/pool-review-freeze-migration.test.ts \
            | tee mpgf-pool-review-freeze-focused.log

      - name: Run repository tests
        run: |
          set -euo pipefail
          npm test | tee mpgf-pool-review-freeze-repository-tests.log

      - name: Run repository lint
        run: |
          set -euo pipefail
          npm run lint | tee mpgf-pool-review-freeze-lint.log

      - name: Run TypeScript
        run: |
          set -euo pipefail
          npx tsc --noEmit | tee mpgf-pool-review-freeze-typecheck.log

      - name: Build the production application
        run: |
          set -euo pipefail
          npm run build | tee mpgf-pool-review-freeze-build.log

      - name: Verify exact diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          git diff --check "$EXPECTED_BASE_SHA" "$EXPECTED_HEAD_SHA"
          git diff --name-only "$EXPECTED_BASE_SHA" "$EXPECTED_HEAD_SHA" | sort \
            | tee mpgf-pool-review-freeze-diff-files.txt

      - name: Upload source-gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mpgf-pool-review-freeze-source-${{ github.run_id }}
          path: |
            mpgf-pool-review-freeze-*.txt
            mpgf-pool-review-freeze-*.log
          if-no-files-found: warn
          retention-days: 14

  isolated-qa:
    name: Transactional reviewer, RLS, drift, and freeze proof
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    needs: source-gates
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      EXPECTED_QA_POOLER_HOST: aws-0-us-west-1.pooler.supabase.com
      EXPECTED_QA_REF: hvmxfjjbdcgjjudmthdz
      PGSSLMODE: require
      QA_SUPABASE_DB_URL: ${{ secrets.QA_SUPABASE_DB_URL }}

    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify isolated-QA database target
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test -n "${QA_SUPABASE_DB_URL:-}"
          python3 - <<'PY'
          import os
          from urllib.parse import parse_qs, urlparse

          parsed = urlparse(os.environ["QA_SUPABASE_DB_URL"])
          ssl_modes = parse_qs(parsed.query).get("sslmode", ["require"])
          valid = (
              parsed.scheme in {"postgres", "postgresql"}
              and os.environ["EXPECTED_QA_REF"] in (parsed.username or "")
              and parsed.hostname == os.environ["EXPECTED_QA_POOLER_HOST"]
              and parsed.port == 5432
              and parsed.path == "/postgres"
              and ssl_modes == ["require"]
              and bool(parsed.password)
          )
          if not valid:
              raise SystemExit("Refusing a database URL outside the exact TLS-only Moral Trade QA target.")
          PY

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes postgresql-client > /dev/null

      - name: Compile the migration in a rollback-only transaction
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          source = Path("supabase/migrations/20260806110000_mpgf_pool_review_freeze.sql").read_text()
          if not source.rstrip().endswith("commit;"):
              raise SystemExit("Migration does not end in commit;")
          Path("mpgf-pool-review-freeze-rollback.sql").write_text(
              source.rstrip()[:-len("commit;")] + "rollback;\n"
          )
          PY
          psql "$QA_SUPABASE_DB_URL" \
            --no-psqlrc \
            --set ON_ERROR_STOP=1 \
            --file mpgf-pool-review-freeze-rollback.sql \
            | tee mpgf-pool-review-freeze-compile.log

      - name: Apply the additive lifecycle foundation to isolated QA
        shell: bash
        run: |
          set -euo pipefail
          sha256sum supabase/migrations/20260806110000_mpgf_pool_review_freeze.sql \
            | tee mpgf-pool-review-freeze-migration.sha256
          psql "$QA_SUPABASE_DB_URL" \
            --no-psqlrc \
            --set ON_ERROR_STOP=1 \
            --file supabase/migrations/20260806110000_mpgf_pool_review_freeze.sql \
            | tee mpgf-pool-review-freeze-apply.log

      - name: Run the rollback-only multi-role database regression
        shell: bash
        run: |
          set -euo pipefail
          psql "$QA_SUPABASE_DB_URL" \
            --no-psqlrc \
            --set ON_ERROR_STOP=1 \
            --file supabase/tests/mpgf_pool_review_freeze.sql \
            | tee mpgf-pool-review-freeze-regression.log

      - name: Prove zero QA fixture residue
        shell: bash
        run: |
          set -euo pipefail
          residue="$(psql "$QA_SUPABASE_DB_URL" --no-psqlrc --tuples-only --no-align --set ON_ERROR_STOP=1 <<'SQL'
          select
            (select count(*) from auth.users where id in (
              '7a111111-1111-4111-8111-111111111111',
              '7b222222-2222-4222-8222-222222222222',
              '7c333333-3333-4333-8333-333333333333'
            ))
            + (select count(*) from public.profiles where id in (
              '7a111111-1111-4111-8111-111111111111',
              '7b222222-2222-4222-8222-222222222222',
              '7c333333-3333-4333-8333-333333333333'
            ))
            + (select count(*) from public.mpgf_pool_reviewers where reviewer_id in (
              '7a111111-1111-4111-8111-111111111111',
              '7b222222-2222-4222-8222-222222222222',
              '7c333333-3333-4333-8333-333333333333'
            ))
            + (select count(*) from public.mpgf_pool_proposals where id = '7d444444-4444-4444-8444-444444444444')
            + (select count(*) from public.moral_trade_create_submissions where id = '7e555555-5555-4555-8555-555555555555')
            + (select count(*) from public.mpgf_pool_proposal_versions where proposal_id = '7d444444-4444-4444-8444-444444444444')
            + (select count(*) from public.mpgf_pool_lifecycle_events where proposal_id = '7d444444-4444-4444-8444-444444444444');
          SQL
          )"
          printf 'residue_count=%s\n' "$residue" | tee mpgf-pool-review-freeze-zero-residue.txt
          test "$residue" = "0"

      - name: Record installed authorization and immutability objects
        shell: bash
        run: |
          set -euo pipefail
          psql "$QA_SUPABASE_DB_URL" \
            --no-psqlrc \
            --set ON_ERROR_STOP=1 \
            --pset pager=off <<'SQL' | tee mpgf-pool-review-freeze-schema-proof.txt
          select to_regprocedure('public.mpgf_begin_pool_proposal_review(uuid,uuid,text)') as begin_review;
          select to_regprocedure('public.mpgf_approve_and_freeze_pool_proposal(uuid,uuid,text)') as approve_freeze;
          select to_regprocedure('public.mpgf_link_pool_proposal_revision(uuid,uuid,uuid,text)') as revision_link;
          select relname, relrowsecurity
          from pg_class
          where relname in ('mpgf_pool_reviewers','mpgf_pool_proposal_versions','mpgf_pool_lifecycle_events')
          order by relname;
          select tgname
          from pg_trigger
          where not tgisinternal
            and tgname in (
              'mpgf_pool_review_fields_and_frozen_terms',
              'mpgf_pool_proposal_versions_append_only',
              'mpgf_pool_lifecycle_events_append_only'
            )
          order by tgname;
          SQL

      - name: Upload isolated-QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mpgf-pool-review-freeze-qa-${{ github.run_id }}
          path: |
            mpgf-pool-review-freeze-*.log
            mpgf-pool-review-freeze-*.txt
            mpgf-pool-review-freeze-*.sha256
          if-no-files-found: warn
          retention-days: 14
