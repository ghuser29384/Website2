name: Dispatch Complete Profile production canary once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/dispatch-complete-profile-canary-once-20260804.yml

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: dispatch-complete-profile-canary-once-20260804
  cancel-in-progress: false

env:
  EXPECTED_DEPLOYED_SHA: 732d79fb47ffdce2cecb6672735adb20a09f1098
  CONTROLLER_PATH: .github/workflows/dispatch-complete-profile-canary-once-20260804.yml

jobs:
  dispatch:
    if: github.event.head_commit.message == 'Dispatch Complete Profile production canary once'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out exact controller commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Guard exact repository and controller scope
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'ghuser29384/Website2'
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$GITHUB_ACTOR" = 'ghuser29384'
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          changed="$(git diff-tree --no-commit-id --name-only -r HEAD | sed '/^$/d')"
          test "$changed" = "$CONTROLLER_PATH"
          git merge-base --is-ancestor d0e5fedbc0eedfd634fcd8bff29ebde814d6a0ed HEAD

      - name: Dispatch the permanent canary and resolve its run
        id: dispatch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run complete-profile-production-canary.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f expected_sha="$EXPECTED_DEPLOYED_SHA"

          run_json=''
          for attempt in $(seq 1 40); do
            runs="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow complete-profile-production-canary.yml \
              --event workflow_dispatch \
              --branch main \
              --limit 20 \
              --json databaseId,headSha,status,conclusion,url,createdAt)"
            run_json="$(jq -c --arg sha "$GITHUB_SHA" '
              [.[] | select(.headSha == $sha)] | sort_by(.databaseId) | last // empty
            ' <<<"$runs")"
            if [[ -n "$run_json" ]]; then
              break
            fi
            sleep 3
          done

          test -n "$run_json"
          run_id="$(jq -r .databaseId <<<"$run_json")"
          run_url="$(jq -r .url <<<"$run_json")"
          test "$run_id" != 'null'
          test -n "$run_url"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "run_url=$run_url" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$run_json" > complete-profile-canary-dispatch.json

      - name: Report the dispatched run to PR 475
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ steps.dispatch.outputs.run_url }}
        shell: bash
        run: |
          set -euo pipefail
          gh pr comment 475 --repo "$GITHUB_REPOSITORY" --body "Post-merge permanent production canary dispatched for exact deployed SHA \`$EXPECTED_DEPLOYED_SHA\`. Run: $RUN_URL. The dispatcher creates or promotes no Vercel deployment."

      - name: Upload dispatch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: complete-profile-canary-dispatch-${{ github.run_id }}
          path: complete-profile-canary-dispatch.json
          if-no-files-found: warn
          retention-days: 14

      - name: Remove one-time dispatcher
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          blob_sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/$CONTROLLER_PATH?ref=main" --jq .sha 2>/dev/null || true)"
          if [[ -n "$blob_sha" ]]; then
            jq -n \
              --arg message 'Remove one-time Complete Profile canary dispatcher' \
              --arg sha "$blob_sha" \
              --arg branch main \
              '{message:$message,sha:$sha,branch:$branch}' \
              | gh api --method DELETE "repos/$GITHUB_REPOSITORY/contents/$CONTROLLER_PATH" --input - >/dev/null
          fi
