name: Temporary repair PR 558 exact QA cleanup

on:
  push:
    branches:
      - temp/fix-pr558-cleanup-controller-20260808

concurrency:
  group: temp-fix-pr558-cleanup-controller-20260808
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      EXPECTED_HEAD_SHA: 634af275da8f161ea73d9e0fa306695e82b0790e
      TARGET_BRANCH: fix/mpgf-dac-product-lifecycle-20260807
      EXPECTED_QA_POOLER_HOST: aws-0-us-west-1.pooler.supabase.com
      EXPECTED_QA_REF: hvmxfjjbdcgjjudmthdz
      PGSSLMODE: require
      QA_SUPABASE_DB_URL: ${{ secrets.QA_SUPABASE_DB_URL }}

    steps:
      - name: Check out the exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Verify head and apply only proven fixture and cleanup repairs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          python3 - <<'PY'
          from pathlib import Path

          fixture_path = Path("supabase/tests/mpgf_dac_product_browser_fixture.sql")
          fixture = fixture_path.read_text()

          old_policy = '      "eligibilityPolicy":{"policyVersion":"mpgf_failure_bonus_eligibility_v0_1"},\n'
          new_policy = (
              '      "eligibilityPolicy":{\n'
              '        "policyVersion":"mpgf_failure_bonus_eligibility_v0_1",\n'
              '        "contributorIdentityRule":"verified_unique_person",\n'
              '        "contributionTimingRule":"captured_before_deadline",\n'
              '        "relatedPartyRule":"exclude_creator_and_related_parties",\n'
              '        "paymentIntegrityRule":"exclude_duplicate_reversed_disputed_or_fraudulent",\n'
              '        "bonusBasis":"eligible_contribution",\n'
              '        "maxParticipants":100,\n'
              '        "maxBonusPerParticipantCents":2500\n'
              '      },\n'
          )
          if fixture.count(old_policy) != 1:
              raise SystemExit("Expected exactly one incomplete browser-fixture eligibility policy.")
          fixture = fixture.replace(old_policy, new_policy)

          old_rationale = '        "rationale":"Synthetic provisional quote for isolated QA",\n'
          new_rationale = (
              '        "rationale":"Provisional threshold 1 experience-rated quote; '
              'operator approval remains required.",\n'
          )
          if fixture.count(old_rationale) != 1:
              raise SystemExit("Expected exactly one non-canonical browser-fixture rationale.")
          fixture_path.write_text(fixture.replace(old_rationale, new_rationale))

          wrong = "'campaign-c077777777774777877777777777777'"
          correct = "'campaign-c0777777777747778777777777777777'"
          expected_counts = {
              Path(".github/workflows/mpgf-dac-product-lifecycle-gates.yml"): 2,
              Path("supabase/tests/mpgf_dac_product_browser_cleanup.sql"): 5,
              Path("supabase/tests/mpgf_dac_product_browser_fixture.sql"): 8,
          }
          for path, expected_count in expected_counts.items():
              source = path.read_text()
              actual_count = source.count(wrong)
              if actual_count != expected_count:
                  raise SystemExit(
                      f"Expected {expected_count} malformed deterministic campaign IDs in {path}, found {actual_count}."
                  )
              repaired = source.replace(wrong, correct)
              if wrong in repaired:
                  raise SystemExit(f"Malformed deterministic campaign ID remains in {path}.")
              path.write_text(repaired)

          cleanup_path = Path("supabase/tests/mpgf_dac_product_browser_cleanup.sql")
          cleanup = cleanup_path.read_text()
          disable_anchor = (
              "alter table public.mpgf_pool_proposal_versions disable trigger "
              "mpgf_pool_proposal_versions_append_only;\n"
          )
          disable_block = disable_anchor + (
              "alter table public.moral_trade_create_pool_terms disable trigger "
              "moral_trade_create_pool_terms_immutable;\n"
              "alter table public.mpgf_failure_bonus_premium_quotes disable trigger "
              "mpgf_failure_bonus_approved_quote_immutable;\n"
          )
          if cleanup.count(disable_anchor) != 1:
              raise SystemExit("Expected one cleanup trigger-disable anchor.")
          cleanup = cleanup.replace(disable_anchor, disable_block)

          enable_anchor = (
              "alter table public.mpgf_pool_proposal_versions enable trigger "
              "mpgf_pool_proposal_versions_append_only;\n"
          )
          enable_block = (
              "alter table public.mpgf_failure_bonus_premium_quotes enable trigger "
              "mpgf_failure_bonus_approved_quote_immutable;\n"
              "alter table public.moral_trade_create_pool_terms enable trigger "
              "moral_trade_create_pool_terms_immutable;\n"
          ) + enable_anchor
          if cleanup.count(enable_anchor) != 1:
              raise SystemExit("Expected one cleanup trigger-enable anchor.")
          cleanup = cleanup.replace(enable_anchor, enable_block)

          for required in (
              "disable trigger moral_trade_create_pool_terms_immutable",
              "enable trigger moral_trade_create_pool_terms_immutable",
              "disable trigger mpgf_failure_bonus_approved_quote_immutable",
              "enable trigger mpgf_failure_bonus_approved_quote_immutable",
          ):
              if cleanup.count(required) != 1:
                  raise SystemExit(f"Expected exactly one cleanup clause: {required}")
          cleanup_path.write_text(cleanup)

          repaired_fixture = fixture_path.read_text()
          if repaired_fixture.count('"contributorIdentityRule":"verified_unique_person"') != 2:
              raise SystemExit("Browser proposal and schedule must carry the same complete eligibility policy.")
          if repaired_fixture.count(
              "Provisional threshold 1 experience-rated quote; operator approval remains required."
          ) != 1:
              raise SystemExit("Canonical pending-review rationale must appear exactly once.")
          for path in expected_counts:
              if wrong in path.read_text():
                  raise SystemExit(f"Malformed deterministic campaign ID remains in {path}.")
          PY

          git diff --check
          git diff --stat
          git diff -- \
            .github/workflows/mpgf-dac-product-lifecycle-gates.yml \
            supabase/tests/mpgf_dac_product_browser_fixture.sql \
            supabase/tests/mpgf_dac_product_browser_cleanup.sql

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes postgresql-client > /dev/null

      - name: Verify the exact TLS-only isolated QA target
        shell: bash
        run: |
          set -euo pipefail
          test -n "${QA_SUPABASE_DB_URL:-}"
          python3 - <<'PY'
          import os
          from urllib.parse import parse_qs, urlparse

          parsed = urlparse(os.environ["QA_SUPABASE_DB_URL"])
          ssl_modes = parse_qs(parsed.query).get("sslmode", ["require"])
          valid = (
              parsed.scheme in {"postgres", "postgresql"}
              and os.environ["EXPECTED_QA_REF"] in (parsed.username or "")
              and parsed.hostname == os.environ["EXPECTED_QA_POOLER_HOST"]
              and parsed.port == 5432
              and parsed.path == "/postgres"
              and ssl_modes == ["require"]
              and bool(parsed.password)
          )
          if not valid:
              raise SystemExit("Refusing a database URL outside the exact TLS-only Moral Trade QA target.")
          PY

      - name: Remove interrupted synthetic lifecycle with repaired cleanup
        shell: bash
        run: |
          set -euo pipefail
          psql "$QA_SUPABASE_DB_URL" \
            --no-psqlrc \
            --set ON_ERROR_STOP=1 \
            --file supabase/tests/mpgf_dac_product_browser_cleanup.sql

      - name: Create and prove open, succeeded, and lapsed fixtures
        shell: bash
        run: |
          set -euo pipefail
          qa_password="$(openssl rand -base64 48 | tr -d '\n')"
          echo "::add-mask::$qa_password"
          export MPGF_DAC_PRODUCT_QA_PASSWORD="$qa_password"
          psql "$QA_SUPABASE_DB_URL" \
            --no-psqlrc \
            --set ON_ERROR_STOP=1 \
            --file supabase/tests/mpgf_dac_product_browser_fixture.sql

      - name: Verify complete fixture state and no-payment boundary
        shell: bash
        run: |
          set -euo pipefail
          psql "$QA_SUPABASE_DB_URL" \
            --no-psqlrc \
            --set ON_ERROR_STOP=1 \
            --tuples-only \
            --no-align <<'SQL' | tee /tmp/mpgf-dac-fixture-proof.txt
          select 'proposal_count=' || count(*)
          from public.mpgf_pool_proposals
          where id in (
            'ce555555-5555-4555-8555-555555555555',
            'cf666666-6666-4666-8666-666666666666',
            'c0777777-7777-4777-8777-777777777777'
          );
          select 'campaign_count=' || count(*)
          from public.mpgf_public_goods_campaigns
          where id in (
            'campaign-ce555555555545558555555555555555',
            'campaign-cf666666666646668666666666666666',
            'campaign-c0777777777747778777777777777777'
          );
          select 'outcome_count=' || count(*)
          from public.mpgf_dac_campaign_outcomes
          where campaign_id in (
            'campaign-cf666666666646668666666666666666',
            'campaign-c0777777777747778777777777777777'
          );
          select 'payment_refs=' || count(*)
          from public.mpgf_public_goods_pledges
          where campaign_id in (
            'campaign-ce555555555545558555555555555555',
            'campaign-cf666666666646668666666666666666',
            'campaign-c0777777777747778777777777777777'
          )
            and (payment_intent_ref is not null or status = 'captured');
          SQL
          grep -Fxq 'proposal_count=3' /tmp/mpgf-dac-fixture-proof.txt
          grep -Fxq 'campaign_count=3' /tmp/mpgf-dac-fixture-proof.txt
          grep -Fxq 'outcome_count=2' /tmp/mpgf-dac-fixture-proof.txt
          grep -Fxq 'payment_refs=0' /tmp/mpgf-dac-fixture-proof.txt

      - name: Remove synthetic lifecycle and invalidate credentials
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          psql "$QA_SUPABASE_DB_URL" \
            --no-psqlrc \
            --set ON_ERROR_STOP=1 \
            --file supabase/tests/mpgf_dac_product_browser_cleanup.sql

      - name: Prove complete zero synthetic residue
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          psql "$QA_SUPABASE_DB_URL" \
            --no-psqlrc \
            --set ON_ERROR_STOP=1 \
            --tuples-only \
            --no-align <<'SQL' | tee /tmp/mpgf-dac-zero-residue.txt
          with ids as (
            select array[
              'ca111111-1111-4111-8111-111111111111'::uuid,
              'cb222222-2222-4222-8222-222222222222'::uuid,
              'cc333333-3333-4333-8333-333333333333'::uuid,
              'cd444444-4444-4444-8444-444444444444'::uuid
            ] as users,
            array[
              'ce555555-5555-4555-8555-555555555555'::uuid,
              'cf666666-6666-4666-8666-666666666666'::uuid,
              'c0777777-7777-4777-8777-777777777777'::uuid
            ] as proposals,
            array[
              'campaign-ce555555555545558555555555555555',
              'campaign-cf666666666646668666666666666666',
              'campaign-c0777777777747778777777777777777'
            ] as campaigns
          )
          select 'fixture_residue=' || (
            (select count(*) from auth.users, ids where auth.users.id = any(ids.users))
            + (select count(*) from auth.identities, ids where auth.identities.user_id = any(ids.users))
            + (select count(*) from auth.sessions, ids where auth.sessions.user_id = any(ids.users))
            + (select count(*) from auth.refresh_tokens, ids where auth.refresh_tokens.user_id = any(array(select user_id::text from unnest(ids.users) as user_id)))
            + (select count(*) from auth.mfa_factors, ids where auth.mfa_factors.user_id = any(ids.users))
            + (select count(*) from moral_trade_private.person_accounts, ids where profile_id = any(ids.users))
            + (select count(*) from public.profiles, ids where public.profiles.id = any(ids.users))
            + (select count(*) from public.mpgf_pool_reviewers, ids where reviewer_id = any(ids.users))
            + (select count(*) from public.mpgf_pool_proposals, ids where id = any(ids.proposals))
            + (select count(*) from public.mpgf_pool_proposal_versions, ids where proposal_id = any(ids.proposals))
            + (select count(*) from public.mpgf_pool_lifecycle_events, ids where proposal_id = any(ids.proposals))
            + (select count(*) from public.moral_trade_create_pool_terms, ids where pool_proposal_id = any(ids.proposals))
            + (select count(*) from public.mpgf_failure_bonus_premium_quotes, ids where pool_proposal_id = any(ids.proposals))
            + (select count(*) from public.mpgf_public_goods_campaigns, ids where id = any(ids.campaigns))
            + (select count(*) from public.mpgf_public_goods_pledges, ids where campaign_id = any(ids.campaigns))
            + (select count(*) from public.mpgf_dac_pledge_intents, ids where campaign_id = any(ids.campaigns))
            + (select count(*) from public.mpgf_dac_pledge_events, ids where campaign_id = any(ids.campaigns))
            + (select count(*) from public.mpgf_dac_campaign_outcomes, ids where campaign_id = any(ids.campaigns))
            + (select count(*) from public.moral_trade_create_submissions where id in (
              'd1111111-1111-4111-8111-111111111111',
              'd2222222-2222-4222-8222-222222222222',
              'd3333333-3333-4333-8333-333333333333'
            ))
            + (select count(*) from public.mpgf_public_goods_rounds where id = 'qa-dac-product-round-20260807')
            + (select count(*) from public.mpgf_public_goods_match_pools where id = 'qa-dac-product-match-20260807')
          ) from ids;
          SQL
          grep -Fxq 'fixture_residue=0' /tmp/mpgf-dac-zero-residue.txt

      - name: Commit the proven repairs to the PR branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/mpgf-dac-product-lifecycle-gates.yml \
            supabase/tests/mpgf_dac_product_browser_fixture.sql \
            supabase/tests/mpgf_dac_product_browser_cleanup.sql
          git commit -m "test(mpgf): harden deterministic DAC lifecycle fixtures"
          git push origin "HEAD:${TARGET_BRANCH}"
