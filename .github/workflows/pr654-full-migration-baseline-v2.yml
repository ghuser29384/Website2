name: PR654 full empty-database migration baseline v2

on:
  push:
    branches:
      - qa/pr654-migration-history-cleanup-gates-20260815
    paths:
      - .github/workflows/pr654-full-migration-baseline-v2.yml
      - .github/scripts/pr654-full-migration-baseline-v2.sh
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr654-full-migration-baseline-v2
  cancel-in-progress: false

jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      EXPECTED_PRODUCT_HEAD: f0ea581e8956f7987e58dd2240a7e0249bf7cb06
      EXPECTED_BASE: 75fd512e6cf82e2c51df53e211b854c0263109c3
      PRODUCT_BRANCH: qa/pooled-settlement-payer-fix-candidate-20260813
      SUPABASE_CLI_VERSION: 2.110.0
      EVIDENCE_DIR: ${{ runner.temp }}/pr654-migration-baseline-v2-evidence
    steps:
      - name: Check out QA-only harness
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: harness
          fetch-depth: 1
          persist-credentials: false

      - name: Check out exact product head detached
        uses: actions/checkout@v4
        with:
          ref: f0ea581e8956f7987e58dd2240a7e0249bf7cb06
          path: product
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
          cache: npm
          cache-dependency-path: product/package-lock.json

      - name: Run full local migration-baseline gate
        id: gate
        continue-on-error: true
        working-directory: product
        shell: bash
        run: bash ../harness/.github/scripts/pr654-full-migration-baseline-v2.sh

      - name: Upload credential-free evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr654-full-migration-baseline-v2-${{ github.run_id }}
          path: |
            pr654-migration-baseline-v2-evidence.tar.gz
            pr654-migration-baseline-v2-evidence.tar.gz.sha256
            pr654-migration-baseline-v2-summary.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce migration-baseline result
        if: always()
        shell: bash
        run: |
          if [[ "${{ steps.gate.outcome }}" != "success" ]]; then
            echo "Migration-baseline gate failed; inspect the uploaded evidence artifact."
            exit 1
          fi
