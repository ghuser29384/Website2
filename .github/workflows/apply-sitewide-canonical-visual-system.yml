name: Apply sitewide canonical visual system

on:
  push:
    branches:
      - fix/sitewide-canonical-visual-system-20260810
    paths:
      - ".github/workflows/apply-sitewide-canonical-visual-system.yml"

permissions:
  contents: write

concurrency:
  group: apply-sitewide-canonical-visual-system
  cancel-in-progress: false

env:
  BASE_SHA: 72729d80bec2e4ffa147d6dc56ae703fb3e79293
  EXPORT_SHA: ba64462eb298c8a7aab3f808a1addb40e596e008
  PAYLOAD_SHA256: 28b5646f07f63e0dff80c90bf308a9f14ef6085f62b5fc8ccb03eaafba157194

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact workflow commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard branch ancestry and staging scope
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'ghuser29384/Website2'
          test "$GITHUB_REF_NAME" = 'fix/sitewide-canonical-visual-system-20260810'
          test "$(git rev-parse "$EXPORT_SHA^")" = "$BASE_SHA"
          git merge-base --is-ancestor "$EXPORT_SHA" HEAD
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$BASE_SHA"
          git diff --name-only "$EXPORT_SHA" HEAD | sort > /tmp/staged-files.txt
          cat > /tmp/expected-staged-files.txt <<'FILES'
          .github/workflows/apply-sitewide-canonical-visual-system.yml
          .sitewide-payload/part-00.txt
          .sitewide-payload/part-01.txt
          .sitewide-payload/part-02.txt
          .sitewide-payload/part-03.txt
          .sitewide-payload/part-04.txt
          .sitewide-payload/part-05.txt
          FILES
          diff -u /tmp/expected-staged-files.txt /tmp/staged-files.txt

      - name: Apply exact audited payload
        shell: bash
        run: |
          set -euo pipefail
          cat .sitewide-payload/part-*.txt > /tmp/sitewide-payload.b64
          base64 --decode /tmp/sitewide-payload.b64 > /tmp/sitewide-payload.tar.gz
          echo "$PAYLOAD_SHA256  /tmp/sitewide-payload.tar.gz" | sha256sum --check --strict
          tar -xzf /tmp/sitewide-payload.tar.gz
          python .apply-sitewide.py
          rm -rf .sitewide-payload
          rm -f .apply-sitewide.py
          rm -f .github/workflows/export-sitewide-visual-audit.yml
          rm -f .github/workflows/apply-sitewide-canonical-visual-system.yml

      - name: Verify exact final file scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check "$BASE_SHA"
          git diff --name-only "$BASE_SHA" | sort > /tmp/actual-files.txt
          cat > /tmp/expected-files.txt <<'FILES'
          .github/workflows/sitewide-canonical-visual-system.yml
          public/complete-verification.html
          public/moral-trade-canonical-static.css
          public/moral-trade-create/index.html
          src/app/canonical-visual-system.css
          src/app/complete-profile/page.tsx
          src/app/connectors/page.tsx
          src/app/labs/moral-public-goods/[poolSlug]/page.tsx
          src/app/layout.tsx
          src/app/pledge-swaps/page.tsx
          src/app/redirects/[receiptId]/page.tsx
          src/components/auth/auth-card.tsx
          src/components/home/home-page.tsx
          src/sitewide-canonical-visual-system.test.ts
          tests/sitewide-canonical-visual-system.spec.ts
          FILES
          diff -u /tmp/expected-files.txt /tmp/actual-files.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Run focused source contracts
        shell: bash
        run: |
          set -euo pipefail
          node --import tsx --test src/sitewide-canonical-visual-system.test.ts
          node --check public/moral-trade-discover-navigation.js
          node --check public/moral-trade-live-navigation.js

      - name: Commit exact final candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          test -n "$(git status --porcelain)"
          git commit -m 'Align every page with the canonical Home and Walkthrough visual system'
          git push origin HEAD:fix/sitewide-canonical-visual-system-20260810
