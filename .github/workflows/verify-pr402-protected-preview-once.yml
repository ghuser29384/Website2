name: One-time verify exact PR 402 protected Preview

on:
  push:
    branches:
      - ops/verify-pr402-preview-final-20260802
    paths:
      - .github/workflows/verify-pr402-protected-preview-once.yml

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: verify-pr402-protected-preview-once
  cancel-in-progress: false

env:
  CONTROLLER_PATH: .github/workflows/verify-pr402-protected-preview-once.yml
  CONTROLLER_BRANCH: ops/verify-pr402-preview-final-20260802
  TARGET_BRANCH: fix/discover-pledge-clarity-20260801
  EXPECTED_HEAD: 134d89d3ddefcbb96a5f06af99edf95175420985
  EXPECTED_MAIN: 45065ff55049c81c86ba4f9b5de8b35c9920b8ea
  PREVIEW_DEPLOYMENT_ID: dpl_CGM9aM2j3DxnE3JYRMrNnPcsTLZZ
  PREVIEW_URL: https://moraltrade-site-bee27bhgs-ellen-s.vercel.app
  VERCEL_ORG_ID: team_ySu6sF3Uho1E1GnJtCQPVEuJ
  VERCEL_PROJECT_ID: prj_Em3j7Uj7RatX2R1ZYhla3XSHRde7

jobs:
  verify:
    if: github.repository == 'ghuser29384/Website2' && github.actor == 'ghuser29384'
    runs-on: ubuntu-24.04
    timeout-minutes: 50

    steps:
      - name: Check out exact PR 402 head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Remove one-time controller from its operations branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/$CONTROLLER_BRANCH"
          blob_sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/$CONTROLLER_PATH?ref=$CONTROLLER_BRANCH" --jq .sha)"
          jq -n --arg message 'Remove one-time PR 402 protected-preview verifier' --arg sha "$blob_sha" --arg branch "$CONTROLLER_BRANCH" '{message:$message,sha:$sha,branch:$branch}' \
            | gh api --method DELETE "repos/$GITHUB_REPOSITORY/contents/$CONTROLLER_PATH" --input - >/dev/null

      - name: Guard exact source, main, project, and Preview identity
        id: guard
        continue-on-error: true
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'ghuser29384/Website2'
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')" = "$EXPECTED_HEAD"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$EXPECTED_MAIN"
          test -n "$VERCEL_TOKEN"
          git fetch --no-tags origin main
          cat > /tmp/expected-files.txt <<'EOF'
          public/discover/payload/0.txt
          public/discover/payload/1.txt
          public/discover/payload/2.txt
          public/discover/payload/3.txt
          public/discover/payload/4.txt
          public/discover/payload/5.txt
          public/discover/payload/6.txt
          public/discover/payload/manifest.json
          src/discover-pledge-clarity.test.ts
          src/discover/moral-trade-discover.source.html
          tests/discover-pledge-clarity.spec.ts
          EOF
          sort -o /tmp/expected-files.txt /tmp/expected-files.txt
          git diff --name-only origin/main HEAD | sort > /tmp/actual-files.txt
          diff -u /tmp/expected-files.txt /tmp/actual-files.txt
          git diff --check origin/main HEAD
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v13/deployments/$PREVIEW_DEPLOYMENT_ID?teamId=$VERCEL_ORG_ID" \
            > /tmp/deployment.json
          node - <<'NODE'
          const fs = require('node:fs');
          const d = JSON.parse(fs.readFileSync('/tmp/deployment.json', 'utf8'));
          const id = d.id ?? d.uid;
          const state = d.readyState ?? d.state;
          const sha = d.meta?.githubCommitSha;
          const project = d.projectId ?? d.project?.id;
          const url = `https://${d.url}`;
          if (id !== process.env.PREVIEW_DEPLOYMENT_ID) throw new Error(`Wrong deployment: ${id}`);
          if (state !== 'READY') throw new Error(`Deployment is not READY: ${state}`);
          if (d.target != null) throw new Error(`Expected a Preview deployment, got target ${d.target}`);
          if (sha !== process.env.EXPECTED_HEAD) throw new Error(`Wrong deployed SHA: ${sha}`);
          if (project !== process.env.VERCEL_PROJECT_ID) throw new Error(`Wrong Vercel project: ${project}`);
          if (url !== process.env.PREVIEW_URL) throw new Error(`Wrong deployment URL: ${url}`);
          fs.writeFileSync('/tmp/deployment-evidence.json', JSON.stringify({
            deploymentId: id,
            projectId: project,
            commit: sha,
            state,
            target: d.target ?? null,
            source: d.source ?? null,
            url,
          }, null, 2));
          NODE

      - name: Set up Node.js
        if: steps.guard.outcome == 'success'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies and Chromium
        id: install
        if: steps.guard.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium

      - name: Create temporary Vercel automation bypass
        id: bypass
        if: steps.install.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          secret="$(python3 - <<'PY'
          import secrets, string
          alphabet = string.ascii_letters + string.digits
          print(''.join(secrets.choice(alphabet) for _ in range(32)))
          PY
          )"
          echo "::add-mask::$secret"
          printf '%s' "$secret" > /tmp/bypass-secret
          jq -n --arg secret "$secret" '{generate:{secret:$secret,note:"Temporary exact PR 402 protected Preview verification"}}' > /tmp/generate.json
          curl --fail --silent --show-error --request PATCH \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/generate.json \
            "https://api.vercel.com/v1/projects/$VERCEL_PROJECT_ID/protection-bypass?teamId=$VERCEL_ORG_ID" \
            > /tmp/generate-response.json
          rm -f /tmp/generate.json /tmp/generate-response.json

      - name: Inspect exact protected desktop and mobile Preview
        id: inspect
        if: steps.bypass.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-results
          secret="$(cat /tmp/bypass-secret)"
          echo "::add-mask::$secret"
          VERCEL_AUTOMATION_BYPASS_SECRET="$secret" node --input-type=module <<'NODE' 2>&1 | tee /tmp/pr402-protected-preview.log
          import fs from 'node:fs';
          import { chromium } from '@playwright/test';

          const base = process.env.PREVIEW_URL;
          const secret = process.env.VERCEL_AUTOMATION_BYPASS_SECRET;
          const route = '/discover?domain=pools&view=threshold&query=Find+pools&selected=pool-wild-research&selectedType=pool#discover';
          const target = new URL(route, base).href;
          const origin = new URL(base).origin;
          const exactTitle = 'Wild-animal-suffering priority research pool';
          const arithmeticCopy = 'This is arithmetic, not a forecast of other contributors.';
          const authorizationCopy = 'Moving the slider does not save a pledge or authorize payment.';
          const result = {
            status: 'pending',
            deploymentId: process.env.PREVIEW_DEPLOYMENT_ID,
            commit: process.env.EXPECTED_HEAD,
            requestedUrl: target,
            desktop: null,
            mobile390x844: null,
            errors: [],
          };

          function normalize(value) {
            return String(value ?? '').replace(/\s+/g, ' ').trim();
          }

          function requireCondition(condition, message) {
            if (!condition) throw new Error(message);
          }

          async function inspect(name, viewport, mobile) {
            const pageErrors = [];
            const consoleErrors = [];
            const failedSameOriginRequests = [];
            const badSameOriginResponses = [];
            const context = await browser.newContext({
              viewport,
              extraHTTPHeaders: {
                'x-vercel-protection-bypass': secret,
                'x-vercel-set-bypass-cookie': 'true',
              },
            });
            await context.addCookies([{
              name: 'mt_walkthrough_seen',
              value: '1',
              url: base,
              sameSite: 'Lax',
            }]);
            const page = await context.newPage();
            page.on('pageerror', error => pageErrors.push(error.message));
            page.on('console', message => {
              if (message.type() === 'error') consoleErrors.push(message.text());
            });
            page.on('requestfailed', request => {
              if (request.url().startsWith(origin)) {
                failedSameOriginRequests.push(`${request.method()} ${request.url()} ${request.failure()?.errorText ?? ''}`);
              }
            });
            page.on('response', response => {
              if (response.url().startsWith(origin) && response.status() >= 500) {
                badSameOriginResponses.push(`${response.status()} ${response.request().method()} ${response.url()}`);
              }
            });

            try {
              const response = await page.goto(target, { waitUntil: 'domcontentloaded', timeout: 60_000 });
              requireCondition(response?.status() === 200, `${name}: navigation status was ${response?.status() ?? 'missing'}`);
              await page.waitForFunction(() => Boolean(window.__moralTradeSmartQueryLoaded), null, { timeout: 30_000 });

              const finalUrl = new URL(page.url());
              requireCondition(finalUrl.origin === origin, `${name}: navigation left the exact Preview origin`);
              requireCondition(finalUrl.pathname === '/discover', `${name}: wrong final path ${finalUrl.pathname}`);
              requireCondition(finalUrl.searchParams.get('domain') === 'pools', `${name}: domain was not pools`);
              requireCondition(finalUrl.searchParams.get('selected') === 'pool-wild-research', `${name}: selected pool was not retained`);
              requireCondition(finalUrl.searchParams.get('selectedType') === 'pool', `${name}: selected type was not retained`);

              const surface = mobile
                ? page.locator('aside.inspector.mobile-sheet')
                : page.locator('aside.inspector:not(.mobile-sheet)');
              await surface.waitFor({ state: 'visible', timeout: 30_000 });
              await surface.getByRole('heading', { name: 'Preview your conditional pledge' }).waitFor({ state: 'visible', timeout: 15_000 });
              await surface.getByText(exactTitle, { exact: true }).waitFor({ state: 'visible', timeout: 15_000 });

              const slider = surface.locator('[data-pledge-range][data-pool-id="pool-wild-research"]');
              await slider.waitFor({ state: 'visible', timeout: 15_000 });
              await slider.evaluate(element => {
                const input = element;
                input.value = '35';
                input.dispatchEvent(new Event('input', { bubbles: true }));
              });

              const updatedSurface = mobile
                ? page.locator('aside.inspector.mobile-sheet')
                : page.locator('aside.inspector:not(.mobile-sheet)');
              await updatedSurface.getByText('0.43% of current gap', { exact: true }).waitFor({ state: 'visible', timeout: 15_000 });
              await updatedSurface.getByText('$8,165 remains', { exact: true }).waitFor({ state: 'visible', timeout: 15_000 });
              const surfaceText = normalize(await updatedSurface.innerText());
              requireCondition(surfaceText.includes('$35'), `${name}: proposed $35 pledge was not rendered`);
              requireCondition(surfaceText.includes(arithmeticCopy), `${name}: non-forecast arithmetic caveat was missing`);
              requireCondition(surfaceText.includes(authorizationCopy), `${name}: non-authorization caveat was missing`);

              const bodyText = normalize(await page.locator('body').innerText());
              requireCondition(!/pivotality/i.test(bodyText), `${name}: pivotality copy remained`);
              requireCondition(!/Loading Discover…/i.test(bodyText), `${name}: loading shell remained`);
              requireCondition(!/DEPLOYMENT_DISABLED|Payment Required/i.test(bodyText), `${name}: deployment-disabled response rendered`);

              const surfaceBox = await updatedSurface.boundingBox();
              requireCondition(surfaceBox !== null, `${name}: inspector bounds were unavailable`);
              requireCondition(surfaceBox.x >= -1, `${name}: inspector began outside the viewport`);
              requireCondition(surfaceBox.x + surfaceBox.width <= viewport.width + 1, `${name}: inspector exceeded viewport width`);
              const surfaceOverflow = await updatedSurface.evaluate(element => element.scrollWidth - element.clientWidth);
              const overflow = await page.evaluate(() => ({
                html: document.documentElement.scrollWidth - document.documentElement.clientWidth,
                body: document.body.scrollWidth - document.body.clientWidth,
              }));
              requireCondition(surfaceOverflow <= 1, `${name}: inspector horizontal overflow ${surfaceOverflow}`);
              requireCondition(overflow.html <= 1, `${name}: document horizontal overflow ${overflow.html}`);
              requireCondition(overflow.body <= 1, `${name}: body horizontal overflow ${overflow.body}`);

              await page.waitForTimeout(500);
              requireCondition(pageErrors.length === 0, `${name}: page errors: ${pageErrors.join(' | ')}`);
              requireCondition(consoleErrors.length === 0, `${name}: console errors: ${consoleErrors.join(' | ')}`);
              requireCondition(failedSameOriginRequests.length === 0, `${name}: failed same-origin requests: ${failedSameOriginRequests.join(' | ')}`);
              requireCondition(badSameOriginResponses.length === 0, `${name}: same-origin 5xx responses: ${badSameOriginResponses.join(' | ')}`);

              const screenshot = `test-results/pr402-protected-preview-${name}.png`;
              await page.screenshot({ path: screenshot, fullPage: true });
              return {
                ok: true,
                viewport,
                finalUrl: page.url(),
                surface: mobile ? 'mobile-sheet' : 'desktop-inspector',
                surfaceBox,
                surfaceOverflow,
                overflow,
                observed: {
                  title: exactTitle,
                  proposedPledge: '$35',
                  shareOfGap: '0.43% of current gap',
                  remaining: '$8,165 remains',
                  arithmeticCopy,
                  authorizationCopy,
                  pivotalityAbsent: true,
                },
                pageErrors,
                consoleErrors,
                failedSameOriginRequests,
                badSameOriginResponses,
                screenshot,
              };
            } finally {
              await context.close();
            }
          }

          const browser = await chromium.launch();
          try {
            result.desktop = await inspect('desktop-1440x1000', { width: 1440, height: 1000 }, false);
            result.mobile390x844 = await inspect('mobile-390x844', { width: 390, height: 844 }, true);
            result.status = 'passed';
          } catch (error) {
            result.status = 'failed';
            result.errors.push(error instanceof Error ? error.stack ?? error.message : String(error));
            throw error;
          } finally {
            fs.writeFileSync('/tmp/pr402-protected-preview-evidence.json', JSON.stringify(result, null, 2));
            await browser.close();
          }
          NODE

      - name: Revoke temporary Vercel automation bypass
        id: revoke
        if: always() && steps.bypass.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          secret="$(cat /tmp/bypass-secret)"
          echo "::add-mask::$secret"
          jq -n --arg secret "$secret" '{revoke:{secret:$secret,regenerate:false}}' > /tmp/revoke.json
          curl --fail --silent --show-error --request PATCH \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/revoke.json \
            "https://api.vercel.com/v1/projects/$VERCEL_PROJECT_ID/protection-bypass?teamId=$VERCEL_ORG_ID" \
            > /tmp/revoke-response.json
          rm -f /tmp/bypass-secret /tmp/revoke.json /tmp/revoke-response.json

      - name: Upload exact protected-Preview evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr402-protected-preview-verification-${{ github.run_id }}
          path: |
            /tmp/deployment-evidence.json
            /tmp/pr402-protected-preview-evidence.json
            /tmp/pr402-protected-preview.log
            /tmp/actual-files.txt
            test-results/pr402-protected-preview-*.png
          if-no-files-found: warn
          retention-days: 30

      - name: Report exact protected-Preview result to PR 402
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GUARD_OUTCOME: ${{ steps.guard.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          BYPASS_OUTCOME: ${{ steps.bypass.outcome }}
          INSPECT_OUTCOME: ${{ steps.inspect.outcome }}
          REVOKE_OUTCOME: ${{ steps.revoke.outcome }}
        run: |
          set -euo pipefail
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [[ "$GUARD_OUTCOME" == 'success' && "$INSTALL_OUTCOME" == 'success' && "$BYPASS_OUTCOME" == 'success' && "$INSPECT_OUTCOME" == 'success' && "$REVOKE_OUTCOME" == 'success' ]]; then
            gh pr comment 402 --repo "$GITHUB_REPOSITORY" --body "Exact protected Preview verification passed for \`$EXPECTED_HEAD\` on canonical deployment \`$PREVIEW_DEPLOYMENT_ID\`. Desktop 1440×1000 and mobile 390×844 both retained the selected pool, rendered the visible inspector/mobile sheet, showed \`$35\`, \`0.43% of current gap\`, \`$8,165 remains\`, the arithmetic-not-forecast caveat, and the non-authorization caveat; pivotality copy, loading shells, overflow, browser errors, failed same-origin requests, and same-origin 5xx responses were absent. The temporary Vercel automation bypass was revoked. Evidence: $run_url"
          else
            gh pr comment 402 --repo "$GITHUB_REPOSITORY" --body "Exact protected Preview verification did not pass for \`$EXPECTED_HEAD\` on \`$PREVIEW_DEPLOYMENT_ID\`. Outcomes: guard=$GUARD_OUTCOME, install=$INSTALL_OUTCOME, bypass=$BYPASS_OUTCOME, inspect=$INSPECT_OUTCOME, revoke=$REVOKE_OUTCOME. PR #402 remains draft, unmerged, and not authorized for production. Evidence: $run_url"
          fi

      - name: Enforce exact protected-Preview verification and cleanup
        if: always()
        shell: bash
        run: |
          test '${{ steps.guard.outcome }}' = 'success'
          test '${{ steps.install.outcome }}' = 'success'
          test '${{ steps.bypass.outcome }}' = 'success'
          test '${{ steps.inspect.outcome }}' = 'success'
          test '${{ steps.revoke.outcome }}' = 'success'
