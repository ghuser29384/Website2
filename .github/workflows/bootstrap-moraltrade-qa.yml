name: Bootstrap MoralTrade QA

# One-time retry after verified cleanup of the isolated QA target.
on:
  push:
    branches:
      - agent/dynamic-marketplace-clearing-rounds
    paths:
      - ".github/workflows/bootstrap-moraltrade-qa.yml"
  workflow_dispatch:
    inputs:
      confirm_target:
        description: "Enter hvmxfjjbdcgjjudmthdz to confirm the isolated QA target"
        required: true
        type: string
      configure_vercel:
        description: "Configure branch-scoped Preview variables in both Vercel projects"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: bootstrap-moraltrade-qa
  cancel-in-progress: false

jobs:
  bootstrap:
    if: >-
      github.repository == 'ghuser29384/Website2' &&
      github.ref == 'refs/heads/agent/dynamic-marketplace-clearing-rounds' &&
      (github.event_name == 'push' || inputs.confirm_target == 'hvmxfjjbdcgjjudmthdz')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PROD_SUPABASE_DB_URL: ${{ secrets.PROD_SUPABASE_DB_URL }}
      QA_SUPABASE_DB_URL: ${{ secrets.QA_SUPABASE_DB_URL }}
      QA_SUPABASE_URL: https://hvmxfjjbdcgjjudmthdz.supabase.co
      QA_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.QA_SUPABASE_PUBLISHABLE_KEY }}
      QA_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.QA_SUPABASE_SERVICE_ROLE_KEY }}
      QA_TEST_PASSWORD: ${{ secrets.QA_TEST_PASSWORD }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_SCOPE: ellen-s
      MORALTRADE_QA_GIT_BRANCH: agent/dynamic-marketplace-clearing-rounds
      QA_BASELINE_ARTIFACT_DIR: ${{ runner.temp }}/moraltrade-qa-baseline
    steps:
      - name: Check out the tested branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install repository dependencies
        run: npm ci

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.84.2
          github-token: ${{ github.token }}

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Validate required secrets are configured
        shell: bash
        run: |
          set -euo pipefail
          required=(
            PROD_SUPABASE_DB_URL
            QA_SUPABASE_DB_URL
            QA_SUPABASE_PUBLISHABLE_KEY
            QA_SUPABASE_SERVICE_ROLE_KEY
            QA_TEST_PASSWORD
          )
          if [[ "${{ github.event_name }}" == "push" || "${{ inputs.configure_vercel }}" == "true" ]]; then
            required+=(VERCEL_TOKEN)
          fi
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required GitHub Actions secret: $name" >&2
              exit 1
            fi
          done

      - name: Clone schema only, verify isolation, and seed synthetic fixtures
        run: bash scripts/bootstrap-moraltrade-qa-schema.sh

      - name: Upload reviewable baseline snapshot
        uses: actions/upload-artifact@v4
        with:
          name: moraltrade-qa-production-baseline-${{ github.sha }}
          path: ${{ runner.temp }}/moraltrade-qa-baseline
          if-no-files-found: error
          retention-days: 14

      - name: Configure branch-scoped Vercel Preview variables
        if: github.event_name == 'push' || inputs.configure_vercel
        run: bash scripts/configure-moraltrade-qa-vercel.sh

      - name: Record next gate
        run: |
          {
            echo "## Next gate"
            echo
            echo "Trigger fresh Preview deployments for both Vercel projects."
            echo "Then run the two-account desktop and mobile browser QA in docs/moraltrade-qa-environment.md."
            echo "Do not merge PR #158 until runtime logs and the dealroom flow pass."
          } >> "$GITHUB_STEP_SUMMARY"
