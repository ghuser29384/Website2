name: Compare PR 477 rendered gate with exact base

on:
  push:
    branches:
      - ops/dispatch-pr477-vercel-preview-20260806
    paths:
      - .github/workflows/dispatch-pr477-vercel-preview-20260806.yml

permissions:
  contents: read

concurrency:
  group: compare-pr477-rendered-base-20260806
  cancel-in-progress: false

jobs:
  base-rendered:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      BASE_SHA: '8bdc10338121f173a300436a692c04808d56966b'
    steps:
      - name: Guard exact diagnostic source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'ghuser29384/Website2'
          test '${{ github.ref_name }}' = 'ops/dispatch-pr477-vercel-preview-20260806'
          test '${{ github.actor }}' != 'github-actions[bot]'
          test "$BASE_SHA" = '8bdc10338121f173a300436a692c04808d56966b'

      - name: Check out exact PR base
        uses: actions/checkout@v4
        with:
          ref: 8bdc10338121f173a300436a692c04808d56966b
          fetch-depth: 0

      - name: Prove immutable base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BASE_SHA"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run the exact release browser gate on the base
        shell: bash
        env:
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3210
          SITE_URL: http://127.0.0.1:3210
          PLAYWRIGHT_HTML_OPEN: never
        run: |
          set -o pipefail
          rm -rf .next test-results playwright-report
          npm run test:e2e -- --reporter=line 2>&1 | tee base-e2e.log

      - name: Upload exact base diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr477-exact-base-rendered-${{ github.run_id }}
          path: |
            base-e2e.log
            test-results
            playwright-report
          if-no-files-found: warn
          retention-days: 14
