name: Dispatch PR 477 exact-head Vercel preview

on:
  push:
    branches:
      - ops/dispatch-pr477-vercel-preview-20260806
    paths:
      - .github/workflows/dispatch-pr477-vercel-preview-20260806.yml

permissions:
  actions: write
  contents: read

concurrency:
  group: dispatch-pr477-vercel-preview-20260806
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Guard immutable release inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'ghuser29384/Website2'
          test '${{ github.ref_name }}' = 'ops/dispatch-pr477-vercel-preview-20260806'
          test '${{ github.actor }}' != 'github-actions[bot]'

      - name: Dispatch the gated exact-head preview release
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const expectedSha = 'd5be798466fbef0a805df74d427d472065f1b9ea';
            const releaseRef = 'release/vercel-preview';
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'vercel-release.yml',
              ref: releaseRef,
              inputs: {
                target: 'preview',
                ref: releaseRef,
                expected_sha: expectedSha,
              },
            });
            core.notice(`Dispatched gated preview for ${expectedSha}`);
