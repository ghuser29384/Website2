name: Diagnose PR 477 gated preview failure

on:
  push:
    branches:
      - ops/dispatch-pr477-vercel-preview-20260806
    paths:
      - .github/workflows/dispatch-pr477-vercel-preview-20260806.yml

permissions:
  actions: read
  contents: read

concurrency:
  group: diagnose-pr477-gated-preview-20260806
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      FAILED_RUN_ID: '31094698620'
    steps:
      - name: Guard diagnostic inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'ghuser29384/Website2'
          test '${{ github.ref_name }}' = 'ops/dispatch-pr477-vercel-preview-20260806'
          test '${{ github.actor }}' != 'github-actions[bot]'

      - name: Print the failed rendered-gate log excerpt
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run view "$FAILED_RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed > failed.log
          echo '--- salient failure lines ---'
          grep -nE '(^|[^[:alpha:]])(Error:|FAIL|failed|failure|Timeout|timed out|expect\(|Process completed|browser|playwright)' failed.log | tail -n 240 || true
          echo '--- final 320 lines ---'
          tail -n 320 failed.log
