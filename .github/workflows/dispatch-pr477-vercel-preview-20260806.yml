name: Compare PR 477 candidate and base rendered failures

on:
  push:
    branches:
      - ops/dispatch-pr477-vercel-preview-20260806
    paths:
      - .github/workflows/dispatch-pr477-vercel-preview-20260806.yml

permissions:
  actions: read
  contents: read

concurrency:
  group: compare-pr477-rendered-failures-20260806
  cancel-in-progress: false

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CANDIDATE_RUN_ID: '31109928406'
      BASE_RUN_ID: '31113499116'
    steps:
      - name: Guard exact diagnostic inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'ghuser29384/Website2'
          test '${{ github.ref_name }}' = 'ops/dispatch-pr477-vercel-preview-20260806'
          test '${{ github.actor }}' != 'github-actions[bot]'
          test "$CANDIDATE_RUN_ID" = '31109928406'
          test "$BASE_RUN_ID" = '31113499116'

      - name: Compare normalized Playwright failure identities
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run view "$CANDIDATE_RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed > candidate-failed.log
          gh run view "$BASE_RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed > base-failed.log

          python3 - <<'PY'
          import re
          from pathlib import Path

          ANSI = re.compile(r"\x1b\[[0-?]*[ -/]*[@-~]")
          SUMMARY = re.compile(r"\b(\d+) failed\b")
          TEST = re.compile(r"(tests/[^\n]*?\.spec\.ts):\d+:\d+\s+›\s+(.+)$")
          TRAILING = re.compile(r"\s+[─━-]+\s*$")

          def parse(path: str):
              text = ANSI.sub("", Path(path).read_text(errors="replace"))
              matches = list(SUMMARY.finditer(text))
              if not matches:
                  raise SystemExit(f"No Playwright failure summary found in {path}")
              declared = int(matches[-1].group(1))
              tail = text[matches[-1].end():]
              failures = []
              for raw in tail.splitlines():
                  match = TEST.search(raw)
                  if not match:
                      continue
                  title = TRAILING.sub("", match.group(2)).strip()
                  failures.append(f"{match.group(1)} › {title}")
              unique = sorted(set(failures))
              if declared and len(unique) != declared:
                  print(f"WARNING: {path}: declared {declared} failures, extracted {len(unique)} unique identities")
              return declared, unique

          candidate_declared, candidate = parse("candidate-failed.log")
          base_declared, base = parse("base-failed.log")
          candidate_set = set(candidate)
          base_set = set(base)
          introduced = sorted(candidate_set - base_set)
          resolved = sorted(base_set - candidate_set)
          shared = sorted(candidate_set & base_set)

          print(f"candidate_declared_failures={candidate_declared}")
          print(f"candidate_extracted_failures={len(candidate)}")
          print(f"base_declared_failures={base_declared}")
          print(f"base_extracted_failures={len(base)}")
          print(f"shared_failures={len(shared)}")
          print(f"candidate_only_failures={len(introduced)}")
          print(f"base_only_failures={len(resolved)}")

          print("--- candidate-only normalized failures ---")
          for item in introduced:
              print(item)
          print("--- base-only normalized failures ---")
          for item in resolved:
              print(item)
          print("--- shared normalized failures ---")
          for item in shared:
              print(item)

          if candidate_declared and not candidate:
              raise SystemExit("Candidate failures were not parsed")
          if base_declared and not base:
              raise SystemExit("Base failures were not parsed")
          PY
