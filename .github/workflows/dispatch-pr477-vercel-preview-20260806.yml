name: Diagnose PR 477 gated preview failure

on:
  push:
    branches:
      - ops/dispatch-pr477-vercel-preview-20260806
    paths:
      - .github/workflows/dispatch-pr477-vercel-preview-20260806.yml

permissions:
  actions: read
  contents: read

concurrency:
  group: diagnose-pr477-vercel-preview-20260806
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      FAILED_RUN_ID: '31109928406'
    steps:
      - name: Guard diagnostic inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'ghuser29384/Website2'
          test '${{ github.ref_name }}' = 'ops/dispatch-pr477-vercel-preview-20260806'
          test '${{ github.actor }}' != 'github-actions[bot]'
          test "$FAILED_RUN_ID" = '31109928406'

      - name: Print exact failed-run metadata and log excerpt
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo '--- run metadata ---'
          gh run view "$FAILED_RUN_ID" --repo "$GITHUB_REPOSITORY" --json databaseId,name,displayTitle,headBranch,headSha,status,conclusion,event,createdAt,updatedAt,url,jobs
          echo '--- failed log ---'
          gh run view "$FAILED_RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed > failed.log
          echo '--- salient failure lines ---'
          grep -nE '(^|[^[:alpha:]])(Error:|FAIL|failed|failure|Timeout|timed out|expect\(|Process completed|browser|playwright|vercel|Deployment|Missing|SUPABASE|AssertionError|Traceback)' failed.log | tail -n 400 || true
          echo '--- final 500 lines ---'
          tail -n 500 failed.log
