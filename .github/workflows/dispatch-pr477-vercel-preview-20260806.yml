name: Dispatch PR 477 exact-head Vercel preview

on:
  push:
    branches:
      - ops/dispatch-pr477-vercel-preview-20260806
    paths:
      - .github/workflows/dispatch-pr477-vercel-preview-20260806.yml

permissions:
  actions: write
  contents: read

concurrency:
  group: dispatch-pr477-vercel-preview-20260806
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CANDIDATE_SHA: '1df4a247894023fcbd74e3c1fa3316773d2612f8'
      BASE_SHA: '8bdc10338121f173a300436a692c04808d56966b'
      RELEASE_REF: release/vercel-preview
    steps:
      - name: Guard exact dispatch inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'ghuser29384/Website2'
          test '${{ github.ref_name }}' = 'ops/dispatch-pr477-vercel-preview-20260806'
          test '${{ github.actor }}' != 'github-actions[bot]'
          test "${#CANDIDATE_SHA}" -eq 40
          test "${#BASE_SHA}" -eq 40

      - name: Prove immutable release ref and dispatch gated preview
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_sha="$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/$RELEASE_REF" --jq '.object.sha')"
          test "$release_sha" = "$CANDIDATE_SHA"

          for attempt in 1 2 3 4; do
            if gh workflow run vercel-release.yml \
              --repo "$GITHUB_REPOSITORY" \
              --ref "$RELEASE_REF" \
              -f target=preview \
              -f ref="$RELEASE_REF" \
              -f expected_sha="$CANDIDATE_SHA" \
              -f rendered_base_sha="$BASE_SHA"; then
              exit 0
            fi
            if [[ "$attempt" -eq 4 ]]; then
              echo 'Workflow dispatch failed after four attempts.' >&2
              exit 1
            fi
            sleep $((attempt * 10))
          done

      - name: Record dispatch evidence
        run: |
          {
            echo '### PR 477 preview dispatch'
            echo
            echo "- Candidate: \`$CANDIDATE_SHA\`"
            echo "- Exact merge base: \`$BASE_SHA\`"
            echo "- Release ref: \`$RELEASE_REF\`"
            echo '- Dispatch retry policy: four attempts with bounded backoff'
          } >> "$GITHUB_STEP_SUMMARY"
