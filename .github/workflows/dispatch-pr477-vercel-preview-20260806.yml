name: Validate PR 477 rendered gate in development mode

on:
  push:
    branches:
      - ops/dispatch-pr477-vercel-preview-20260806
    paths:
      - .github/workflows/dispatch-pr477-vercel-preview-20260806.yml

permissions:
  contents: read

concurrency:
  group: validate-pr477-dev-rendered-gate-20260806
  cancel-in-progress: false

jobs:
  rendered:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      EXPECTED_HEAD: f1d893e89c94b60b97ac83e2c6429b873600064e
    steps:
      - name: Check out the exact PR candidate
        uses: actions/checkout@v4
        with:
          ref: f1d893e89c94b60b97ac83e2c6429b873600064e
          fetch-depth: 0

      - name: Guard exact diagnostic source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'ghuser29384/Website2'
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run the complete rendered suite without production build artifacts
        env:
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3210
          SITE_URL: http://127.0.0.1:3210
          PLAYWRIGHT_HTML_OPEN: never
        run: |
          set -euo pipefail
          test ! -e .next/BUILD_ID
          npm run test:e2e -- --reporter=line
