name: Tighten Donation Redirect notification screen

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

concurrency:
  group: tighten-donation-redirect-notification-screen
  cancel-in-progress: true

jobs:
  tighten-verify-and-render:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out exact walkthrough branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/donation-redirect-group-buying-walkthrough-20260726

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply compact scheduled-redirect reflow
        run: python3 scripts/tighten-donation-redirect-notification-screen.py

      - name: Normalize generated text file endings
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          for name in [
              "public/moral-trade-interactive-walkthroughs.html",
              "src/app/walkthrough/walkthrough.css",
              "src/components/walkthrough/immersive-walkthrough.tsx",
              "src/walkthrough-donation-redirect-group-buying.test.ts",
              "tests/walkthrough.spec.ts",
          ]:
              path = Path(name)
              path.write_text(path.read_text(encoding="utf-8").rstrip() + "\n", encoding="utf-8")
          PY

      - name: Install dependencies
        run: npm ci

      - name: Run focused source and first-visit regressions
        run: >-
          node --import tsx --test
          src/walkthrough-donation-redirect-group-buying.test.ts
          src/walkthrough-production-shell.test.ts
          src/proxy.test.ts

      - name: Lint the changed TypeScript and TSX surface
        run: >-
          npx eslint
          src/components/walkthrough/immersive-walkthrough.tsx
          src/walkthrough-donation-redirect-group-buying.test.ts
          tests/walkthrough.spec.ts

      - name: Build the corrected candidate
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run the complete seven-test walkthrough suite
        id: walkthrough_suite
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npx playwright test tests/walkthrough.spec.ts --reporter=line 2>&1 | tee walkthrough-suite.log

      - name: Upload browser diagnostics on failure
        if: steps.walkthrough_suite.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: donation-redirect-visibility-failure
          path: |
            walkthrough-suite.log
            test-results
          if-no-files-found: warn
          retention-days: 7

      - name: Stop after browser failure
        if: steps.walkthrough_suite.outcome == 'failure'
        run: exit 1

      - name: Check whitespace
        run: git diff --check

      - name: Start local app for exact review render
        shell: bash
        run: |
          npm run dev -- -H 127.0.0.1 -p 3210 > /tmp/moraltrade-notification-render.log 2>&1 &
          echo $! > /tmp/moraltrade-notification-render.pid
          for attempt in $(seq 1 120); do
            if curl --silent --fail http://127.0.0.1:3210/walkthrough >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/moraltrade-notification-render.log
          exit 1

      - name: Verify and render the fully visible coalition action
        shell: bash
        run: |
          mkdir -p walkthrough-notification-render
          node --input-type=module <<'NODE'
          import { chromium } from "@playwright/test";

          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1280, height: 720 } });
          await page.goto("http://127.0.0.1:3210/walkthrough", { waitUntil: "domcontentloaded" });
          await page.getByRole("heading", { name: "What do you value?" }).waitFor();
          await page.getByRole("tab", { name: /Redirect/i }).click();
          await page.getByRole("button", { name: "Redirect the matched $20" }).click();
          await page.getByRole("button", { name: "See how one $10 can go further" }).click();
          await page.getByRole("heading", {
            name: "The $10 redirect is already scheduled.",
          }).waitFor();

          const action = page.getByRole("button", {
            name: "See a notified user start a coalition",
          });
          await action.waitFor();
          await page.waitForTimeout(700);

          const actionBox = await action.boundingBox();
          const panelBox = await page.locator(".experience").boundingBox();
          const viewport = page.viewportSize();
          if (!actionBox || !panelBox || !viewport) {
            throw new Error("Could not measure the scheduled-redirect action and panel.");
          }

          const insideViewport =
            actionBox.x >= 0 &&
            actionBox.y >= 0 &&
            actionBox.x + actionBox.width <= viewport.width &&
            actionBox.y + actionBox.height <= viewport.height;
          const insidePanel =
            actionBox.x >= panelBox.x &&
            actionBox.y >= panelBox.y &&
            actionBox.x + actionBox.width <= panelBox.x + panelBox.width &&
            actionBox.y + actionBox.height <= panelBox.y + panelBox.height;

          console.log({ actionBox, panelBox, viewport, insideViewport, insidePanel });
          if (!insideViewport || !insidePanel) {
            throw new Error("The coalition action is not fully visible inside the 1280x720 walkthrough panel.");
          }

          await page.screenshot({
            path: "walkthrough-notification-render/corrected-donation-redirect-notification-visible.png",
            fullPage: false,
            animations: "disabled",
          });
          await browser.close();
          NODE

      - name: Upload corrected review render
        uses: actions/upload-artifact@v4
        with:
          name: corrected-donation-redirect-notification-visible
          path: walkthrough-notification-render
          if-no-files-found: error
          retention-days: 7

      - name: Commit only the corrected product and tests
        shell: bash
        run: |
          rm -rf walkthrough-notification-render test-results playwright-report
          rm -f walkthrough-suite.log
          rm scripts/tighten-donation-redirect-notification-screen.py
          rm .github/workflows/tighten-donation-redirect-notification-screen.yml
          git checkout origin/main -- next-env.d.ts
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Keep the scheduled redirect action fully visible"
          git push origin HEAD
