name: Repair multi-threshold type narrowing

on:
  pull_request:
    branches:
      - feature/mpgf-multi-threshold-failure-bonus-editor-20260726
    paths:
      - ".github/workflows/repair-multi-threshold-type-narrowing.yml"

permissions:
  contents: write

jobs:
  repair-type-narrowing:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'qa/fix-multi-threshold-type-narrowing-20260727'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_HEAD: 51cd9ea3cdca65261a2326976991e10ea88c5c50
      EXPECTED_SOURCE_BLOB: 14eb2fb99fa80e5e01aa976dbb58acda66a3cc43
      PRODUCT_BRANCH: feature/mpgf-multi-threshold-failure-bonus-editor-20260726

    steps:
      - name: Check out exact product branch
        uses: actions/checkout@v4
        with:
          ref: feature/mpgf-multi-threshold-failure-bonus-editor-20260726
          fetch-depth: 0

      - name: Verify exact repair target
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git hash-object src/lib/mpgf/failure-bonus-success-premium.ts)" = "$EXPECTED_SOURCE_BLOB"
          test -z "$(git status --porcelain)"

      - name: Apply the minimal discriminated-union repair
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("src/lib/mpgf/failure-bonus-success-premium.ts")
          lines = path.read_text().splitlines()
          expected = [
              "const maximumFailureBonusExposureCents = pricing.assumptions",
              "? calculateMaximumFailureBonusExposureCents({",
              "netRecipientAmountCents: threshold.cumulativeNetRecipientThresholdCents,",
              "failureBonusRateBps: pricing.assumptions.failureBonusRateBps,",
              "eligibilityPolicy,",
              "})",
              ": undefined;",
          ]
          matches = [
              index
              for index in range(0, len(lines) - len(expected) + 1)
              if [line.strip() for line in lines[index:index + len(expected)]] == expected
          ]
          if len(matches) != 1:
              raise SystemExit(f"Expected one exact seven-line repair target, found {len(matches)}")
          index = matches[0]
          replacement = [
              "    const maximumFailureBonusExposureCents =",
              '      pricing.pricingMode === "experience_rated"',
              "        ? calculateMaximumFailureBonusExposureCents({",
              "            netRecipientAmountCents: threshold.cumulativeNetRecipientThresholdCents,",
              "            failureBonusRateBps: pricing.assumptions.failureBonusRateBps,",
              "            eligibilityPolicy,",
              "          })",
              "        : undefined;",
          ]
          lines[index:index + len(expected)] = replacement
          path.write_text("\n".join(lines) + "\n")
          PY
          test "$(git diff --name-only)" = "src/lib/mpgf/failure-bonus-success-premium.ts"
          git diff --check
          grep -n 'pricing.pricingMode === "experience_rated"' src/lib/mpgf/failure-bonus-success-premium.ts

      - name: Commit the minimal repair to the product branch
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "Moral Trade release automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/lib/mpgf/failure-bonus-success-premium.ts
          git commit -m "Fix failure-bonus pricing type narrowing"
          git push origin "HEAD:${PRODUCT_BRANCH}"
