name: 100 Sparks navigation checks

on:
  pull_request:
    paths:
      - "src/app/100-sparks/**"
      - "src/app/profile/**"
      - "src/components/profile/profile-priorities-card*"
      - "src/components/profile/complete-profile-review.tsx"
      - "src/lib/profile-priorities-access.test.ts"
      - "tests/profile-priorities-access.spec.ts"
      - "tests/complete-profile-review.spec.ts"
      - ".github/workflows/profile-priorities-access.yml"

permissions:
  contents: read

concurrency:
  group: profile-priorities-access-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3210
      SITE_URL: http://127.0.0.1:3210
      PLAYWRIGHT_HTML_OPEN: never
      PLAYWRIGHT_USE_PRODUCTION_SERVER: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Source and application checks
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git diff --check "$BASE_SHA" HEAD
          npm test
          npm run lint -- --quiet
          npx tsc --noEmit
          npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify navigation, responsive layout, and existing account safeguards
        run: |
          npx playwright test tests/profile-priorities-access.spec.ts tests/complete-profile-review.spec.ts --workers=1 --reporter=line
      - name: Retain browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: profile-priorities-access-${{ github.run_id }}
          path: test-results
          if-no-files-found: warn
          retention-days: 14
