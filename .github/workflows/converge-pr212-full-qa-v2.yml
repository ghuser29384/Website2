name: Converge PR 212 full QA v2

on:
  push:
    branches:
      - agent/pr212-main-integration-inspector-20260730
    paths:
      - .github/workflows/converge-pr212-full-qa-v2.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  pull-requests: read

concurrency:
  group: converge-pr212-full-qa-v2
  cancel-in-progress: false

jobs:
  converge:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_WORKFLOW: institutional-trade-qa.yml
      FEATURE_BRANCH: feat/institutional-trade-system
      INSPECTOR_BRANCH: agent/pr212-main-integration-inspector-20260730
      QA_SUPABASE_DB_URL: ${{ secrets.QA_SUPABASE_DB_URL }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pr212-main-integration-inspector-20260730
          fetch-depth: 0

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client jq

      - name: Converge exact heads without racing an active QA run
        shell: bash
        run: |
          set -euo pipefail
          test -n "$QA_SUPABASE_DB_URL"
          [[ "$QA_SUPABASE_DB_URL" == *"hvmxfjjbdcgjjudmthdz"* ]]
          [[ "$QA_SUPABASE_DB_URL" != *"jnpoxvalyjtdghnperyu"* ]]

          output=ops/pr212-full-qa-convergence-v2
          rm -rf "$output"
          mkdir -p "$output" /tmp/pr212-qa-artifacts
          final_result=failure

          reset_empty_institutional_schema() {
            psql "$QA_SUPABASE_DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
            do $$
            declare
              target record;
              row_total bigint;
              synthetic_auth bigint;
              synthetic_profiles bigint;
            begin
              select count(*) into synthetic_auth from auth.users where lower(email) like 'institutional-%@example.test';
              select count(*) into synthetic_profiles from public.profiles where lower(email) like 'institutional-%@example.test';
              if synthetic_auth <> 0 or synthetic_profiles <> 0 then
                raise exception 'Refusing QA reset: synthetic auth users=% profiles=%', synthetic_auth, synthetic_profiles;
              end if;

              for target in
                select n.nspname schema_name,c.relname relation_name
                from pg_class c join pg_namespace n on n.oid=c.relnamespace
                where n.nspname='public' and c.relkind in ('r','p') and c.relname like 'institutional_%'
              loop
                execute format('select count(*) from %I.%I',target.schema_name,target.relation_name) into row_total;
                if row_total <> 0 then
                  raise exception 'Refusing QA reset: %.% contains % rows',target.schema_name,target.relation_name,row_total;
                end if;
              end loop;

              for target in
                select n.nspname schema_name,c.relname relation_name,case c.relkind when 'm' then 'materialized view' else 'view' end relation_kind
                from pg_class c join pg_namespace n on n.oid=c.relnamespace
                where n.nspname='public' and c.relkind in ('v','m') and c.relname like 'institutional_%'
              loop
                execute format('drop %s if exists %I.%I cascade',target.relation_kind,target.schema_name,target.relation_name);
              end loop;

              for target in
                select n.nspname schema_name,c.relname relation_name
                from pg_class c join pg_namespace n on n.oid=c.relnamespace
                where n.nspname='public' and c.relkind in ('r','p') and c.relname like 'institutional_%'
              loop
                execute format('drop table if exists %I.%I cascade',target.schema_name,target.relation_name);
              end loop;

              for target in
                select n.nspname schema_name,p.proname function_name,pg_get_function_identity_arguments(p.oid) identity_arguments
                from pg_proc p join pg_namespace n on n.oid=p.pronamespace
                where n.nspname='public' and p.proname like '%institutional%'
              loop
                execute format('drop function if exists %I.%I(%s) cascade',target.schema_name,target.function_name,target.identity_arguments);
              end loop;
            end
            $$;
            SQL
          }

          for cycle in 1 2 3 4; do
            feature_head="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/212" --jq .head.sha)"
            cycle_dir="$output/cycle-${cycle}-${feature_head}"
            mkdir -p "$cycle_dir"

            run_id=""
            status=""
            conclusion=""
            for attempt in $(seq 1 1800); do
              gh run list --repo "$GITHUB_REPOSITORY" --workflow "$TARGET_WORKFLOW" --branch "$FEATURE_BRANCH" --limit 100 --json databaseId,headSha,status,conclusion,createdAt,url > /tmp/runs.json
              run_id="$(jq -r --arg head "$feature_head" '[.[] | select(.headSha == $head)] | sort_by(.createdAt) | reverse | .[0].databaseId // empty' /tmp/runs.json)"
              status="$(jq -r --arg head "$feature_head" '[.[] | select(.headSha == $head)] | sort_by(.createdAt) | reverse | .[0].status // empty' /tmp/runs.json)"
              conclusion="$(jq -r --arg head "$feature_head" '[.[] | select(.headSha == $head)] | sort_by(.createdAt) | reverse | .[0].conclusion // empty' /tmp/runs.json)"
              if [[ -n "$run_id" && "$status" == completed ]]; then break; fi
              sleep 10
            done
            test -n "$run_id"
            test "$status" = completed

            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" > "$cycle_dir/run.json"
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100" > "$cycle_dir/jobs.json"
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts" > "$cycle_dir/artifacts.json"
            gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --log-failed > "$cycle_dir/failed-log.txt" 2>&1 || true

            failed_steps="$(jq -r '[.jobs[].steps[] | select(.conclusion == "failure") | .name] | unique | .[]' "$cycle_dir/jobs.json")"
            jq -n --arg cycle "$cycle" --arg feature_head "$feature_head" --arg run_id "$run_id" --arg conclusion "$conclusion" --arg failed_steps "$failed_steps" '{cycle:($cycle|tonumber),feature_head:$feature_head,run_id:$run_id,conclusion:$conclusion,failed_steps:($failed_steps|split("\n")|map(select(length>0)))}' > "$cycle_dir/summary.json"

            if [[ "$conclusion" == success ]]; then
              final_result=success
              cp "$cycle_dir/summary.json" "$output/final.json"
              break
            fi

            if [[ "$failed_steps" == "Require exact generated database types to be committed" ]]; then
              for required in \
                "Run source-contract integrity tests before database mutation" \
                "Compile and atomically apply the amended original migration to isolated QA" \
                "Generate exact isolated-QA database types" \
                "Require no new or institutional Supabase lint findings" \
                "Run forced-RLS, grants, foreign-key-index, and non-custody inventories" \
                "Run exact-base differential complete test suite" \
                "Require absolute TypeScript success against generated QA schema" \
                "Require absolute ESLint success" \
                "Require absolute production build success" \
                "Run organization-led and independent-individual authenticated workflows plus negative matrix" \
                "Run targeted current-main desktop and mobile regression smoke" \
                "Confirm complete synthetic identity and institutional-record cleanup"; do
                jq -e --arg required "$required" '.jobs[].steps[] | select(.name == $required) | .conclusion == "success"' "$cycle_dir/jobs.json" >/dev/null
              done

              artifact_name="institutional-trade-qa-${feature_head}-${run_id}"
              rm -rf /tmp/pr212-qa-artifacts/*
              gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name "$artifact_name" --dir /tmp/pr212-qa-artifacts
              generated="$(find /tmp/pr212-qa-artifacts -name database.types.ts -path '*institutional-qa-artifacts*' | head -1)"
              test -n "$generated"
              test -s "$generated"

              # The exact-head run is terminal and cleanup passed, so reset before creating the
              # new head. The push then starts against an empty isolated institutional schema.
              reset_empty_institutional_schema

              git fetch origin "refs/heads/${FEATURE_BRANCH}:refs/remotes/origin/${FEATURE_BRANCH}"
              test "$(git rev-parse "refs/remotes/origin/${FEATURE_BRANCH}")" = "$feature_head"
              rm -rf /tmp/pr212-feature
              git worktree add --detach /tmp/pr212-feature "$feature_head"
              cp "$generated" /tmp/pr212-feature/src/lib/supabase/database.types.ts
              cd /tmp/pr212-feature
              git diff --check
              test -n "$(git status --short src/lib/supabase/database.types.ts)"
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add src/lib/supabase/database.types.ts
              git commit -m "Commit exact PR 212 isolated-QA database types"
              git push origin "HEAD:refs/heads/${FEATURE_BRANCH}"
              git rev-parse HEAD > "$GITHUB_WORKSPACE/$cycle_dir/generated-types-commit.txt"
              cd "$GITHUB_WORKSPACE"
              git worktree remove --force /tmp/pr212-feature
              continue
            fi

            if [[ "$failed_steps" == "Compile and atomically apply the amended original migration to isolated QA" ]]; then
              git fetch origin "refs/heads/${FEATURE_BRANCH}:refs/remotes/origin/${FEATURE_BRANCH}"
              test "$(git rev-parse "refs/remotes/origin/${FEATURE_BRANCH}")" = "$feature_head"
              changed="$(git diff-tree --no-commit-id --name-only -r "${feature_head}^" "$feature_head")"
              if [[ "$changed" == "src/lib/supabase/database.types.ts" ]]; then
                reset_empty_institutional_schema
                rm -rf /tmp/pr212-feature
                git worktree add --detach /tmp/pr212-feature "$feature_head"
                cd /tmp/pr212-feature
                git config user.name "github-actions[bot]"
                git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                git commit --allow-empty -m "Rerun PR 212 QA after guarded empty-schema reset"
                git push origin "HEAD:refs/heads/${FEATURE_BRANCH}"
                git rev-parse HEAD > "$GITHUB_WORKSPACE/$cycle_dir/rerun-commit.txt"
                cd "$GITHUB_WORKSPACE"
                git worktree remove --force /tmp/pr212-feature
                continue
              fi
            fi

            cp "$cycle_dir/summary.json" "$output/final.json"
            break
          done

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$output"
          git commit -m "Record PR 212 full-QA convergence v2"
          git push origin "HEAD:refs/heads/${INSPECTOR_BRANCH}"
          test "$final_result" = success
