name: A1 production credential diagnostics

on:
  pull_request:
    branches:
      - main
    paths:
      - .a1-production-smoke/**

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ACCESS_TOKEN: ${{ secrets.VERCEL_ACCESS_TOKEN }}
      MORALTRADE_VERCEL_TOKEN: ${{ secrets.MORALTRADE_VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_ySu6sF3Uho1E1GnJtCQPVEuJ
      VERCEL_PROJECT_ID: prj_Em3j7Uj7RatX2R1ZYhla3XSHRde7
      PROD_SUPABASE_DB_URL: ${{ secrets.PROD_SUPABASE_DB_URL }}
      PROD_SUPABASE_DB_PASSWORD: ${{ secrets.PROD_SUPABASE_DB_PASSWORD }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROD_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PROD_SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROD_SUPABASE_ACCESS_TOKEN: ${{ secrets.PROD_SUPABASE_ACCESS_TOKEN }}
      QA_SUPABASE_DB_URL: ${{ secrets.QA_SUPABASE_DB_URL }}
      QA_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.QA_SUPABASE_SERVICE_ROLE_KEY }}
      QA_TEST_PASSWORD: ${{ secrets.QA_TEST_PASSWORD }}
    steps:
      - name: Record configured credential names
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          names=(
            VERCEL_TOKEN
            VERCEL_ACCESS_TOKEN
            MORALTRADE_VERCEL_TOKEN
            PROD_SUPABASE_DB_URL
            PROD_SUPABASE_DB_PASSWORD
            SUPABASE_DB_PASSWORD
            PROD_SUPABASE_SERVICE_ROLE_KEY
            SUPABASE_SERVICE_ROLE_KEY
            SUPABASE_ACCESS_TOKEN
            PROD_SUPABASE_ACCESS_TOKEN
            QA_SUPABASE_DB_URL
            QA_SUPABASE_SERVICE_ROLE_KEY
            QA_TEST_PASSWORD
          )
          for name in "${names[@]}"; do
            if [ -n "${!name:-}" ]; then
              echo "$name=present"
              echo "::add-mask::${!name}"
            else
              echo "$name=absent"
            fi
          done > diagnostics/credential-presence.txt

      - name: Probe Vercel project and environment APIs
        shell: bash
        run: |
          set -euo pipefail
          token="${VERCEL_ACCESS_TOKEN:-${MORALTRADE_VERCEL_TOKEN:-${VERCEL_TOKEN:-}}}"
          if [ -z "$token" ]; then
            echo "request=project" > diagnostics/vercel-api.txt
            echo "status=missing_token" >> diagnostics/vercel-api.txt
            exit 0
          fi
          echo "::add-mask::$token"

          for request in project env; do
            if [ "$request" = project ]; then
              url="https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID"
            else
              url="https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/env?teamId=$VERCEL_ORG_ID&decrypt=true"
            fi
            body="/tmp/$request.json"
            status="$(curl -sS -o "$body" -w '%{http_code}' -H "Authorization: Bearer $token" "$url")"
            node - "$body" "$status" "$request" <<'NODE' >> diagnostics/vercel-api.txt
          const fs = require('node:fs');
          const [path, status, request] = process.argv.slice(2);
          let body = {};
          try { body = JSON.parse(fs.readFileSync(path, 'utf8')); } catch {}
          const envs = Array.isArray(body.envs) ? body.envs : [];
          const names = envs
            .filter((item) => {
              const targets = Array.isArray(item.target) ? item.target : [item.target];
              return targets.includes('production') && !item.gitBranch;
            })
            .map((item) => `${item.key}:${item.type}:decrypted=${item.decrypted === true}:value_present=${typeof item.value === 'string' && item.value.length > 0}`)
            .sort();
          const message = body?.error?.message || body?.message || '';
          console.log(`request=${request}`);
          console.log(`status=${status}`);
          console.log(`message=${message}`);
          if (names.length) console.log(`production_envs=${names.join(',')}`);
          NODE
            rm -f "$body"
          done

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a1-production-credential-diagnostics-${{ github.run_id }}
          path: diagnostics
          if-no-files-found: error
          retention-days: 7
