name: Repair PR 212 institutional lint

on:
  push:
    branches:
      - feat/institutional-trade-system
    paths:
      - .github/workflows/repair-pr212-institutional-lint.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-pr212-institutional-lint
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact ambiguity repair and contract assertion
        shell: bash
        run: |
          set -euo pipefail

          migration=supabase/migrations/20260726123000_institutional_trade_system.sql
          test_file=src/institutional-trade-migration.test.ts

          [[ "$(git rev-parse "HEAD:${migration}")" == "634da1c852c2433c337d5f995def7f02923c23c8" ]] || {
            echo "Unexpected migration blob; refusing to patch." >&2
            exit 1
          }
          [[ "$(git rev-parse "HEAD:${test_file}")" == "0a7b22fdb2f89d8faef2dfec174b4a192394ca24" ]] || {
            echo "Unexpected migration-test blob; refusing to patch." >&2
            exit 1
          }

          python - <<'PY'
          from pathlib import Path

          migration_path = Path("supabase/migrations/20260726123000_institutional_trade_system.sql")
          migration = migration_path.read_text()
          old = """create or replace function public.institutional_json_contains_secret(value jsonb)
          returns boolean language plpgsql immutable set search_path=pg_catalog,public as $$
          declare item record; scalar text;
          begin
           if value is null then return false; end if;
           if jsonb_typeof(value)='object' then
            for item in select key,value as nested from jsonb_each(value) loop
             if lower(item.key) ~ '(secret|password|passwd|token|api[_-]?key|private[_-]?key|authorization|credential)' then return true; end if;
             if public.institutional_json_contains_secret(item.nested) then return true; end if;
            end loop;
           elsif jsonb_typeof(value)='array' then
            for item in select value as nested from jsonb_array_elements(value) loop if public.institutional_json_contains_secret(item.nested) then return true; end if; end loop;
           elsif jsonb_typeof(value)='string' then
            scalar:=trim(both '"' from value::text);
          """
          new = """create or replace function public.institutional_json_contains_secret(payload jsonb)
          returns boolean language plpgsql immutable set search_path=pg_catalog,public as $$
          declare item record; scalar text;
          begin
           if payload is null then return false; end if;
           if jsonb_typeof(payload)='object' then
            for item in select entry.key,entry.value as nested from jsonb_each(payload) as entry(key,value) loop
             if lower(item.key) ~ '(secret|password|passwd|token|api[_-]?key|private[_-]?key|authorization|credential)' then return true; end if;
             if public.institutional_json_contains_secret(item.nested) then return true; end if;
            end loop;
           elsif jsonb_typeof(payload)='array' then
            for item in select element.value as nested from jsonb_array_elements(payload) as element(value) loop if public.institutional_json_contains_secret(item.nested) then return true; end if; end loop;
           elsif jsonb_typeof(payload)='string' then
            scalar:=trim(both '"' from payload::text);
          """
          if migration.count(old) != 1:
              raise SystemExit(f"Expected one vulnerable function block, found {migration.count(old)}")
          migration_path.write_text(migration.replace(old, new))

          test_path = Path("src/institutional-trade-migration.test.ts")
          test_text = test_path.read_text()
          marker = """    /institutional_json_contains_secret/i,
          """
          replacement = """    /institutional_json_contains_secret\\(payload jsonb\\)/i,
              /jsonb_each\\(payload\\) as entry\\(key,value\\)/i,
              /jsonb_array_elements\\(payload\\) as element\\(value\\)/i,
          """
          if test_text.count(marker) != 1:
              raise SystemExit(f"Expected one integration-security marker, found {test_text.count(marker)}")
          test_path.write_text(test_text.replace(marker, replacement))
          PY

          grep -F "institutional_json_contains_secret(payload jsonb)" "$migration"
          grep -F "jsonb_each(payload) as entry(key,value)" "$migration"
          grep -F "jsonb_array_elements(payload) as element(value)" "$migration"
          ! grep -F "institutional_json_contains_secret(value jsonb)" "$migration"
          git diff --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$migration" "$test_file"
          git commit -m "Fix institutional secret scanner ambiguity"
          git push origin HEAD:feat/institutional-trade-system
