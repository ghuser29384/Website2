name: Validate returning-user Complete Profile

on:
  push:
    branches:
      - qa/validate-complete-profile-returning-20260731

permissions:
  contents: read
  statuses: write

concurrency:
  group: validate-returning-user-complete-profile
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      EXPECTED_SHA: 7b8ab3c9e7cf952d14c5207e67963c1efdbe1eac
      STATUS_CONTEXT: QA / returning-user Complete Profile
    steps:
      - name: Mark validation pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${EXPECTED_SHA}" \
            -f state=pending \
            -f context="${STATUS_CONTEXT}" \
            -f description="Running test, typecheck, lint, build, and rendered gates" \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Check out exact product candidate
        uses: actions/checkout@v4
        with:
          ref: fix/complete-profile-returning-users-20260731
          fetch-depth: 0

      - name: Verify exact candidate SHA
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
          git diff --check

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run complete unit and source suite
        run: npm test

      - name: Run absolute TypeScript gate
        run: npx tsc --noEmit

      - name: Run absolute ESLint gate
        run: npm run lint

      - name: Build production application
        env:
          NEXT_PUBLIC_SITE_URL: https://www.moraltrade.org
          VERCEL: "1"
          VERCEL_ENV: preview
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run rendered Complete Profile gates
        run: npx playwright test tests/complete-profile-review.spec.ts --reporter=line,html

      - name: Upload rendered evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: complete-profile-returning-rendered-evidence
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish successful validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${EXPECTED_SHA}" \
            -f state=success \
            -f context="${STATUS_CONTEXT}" \
            -f description="Unit, typecheck, lint, build, and rendered gates passed" \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Publish failed validation
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${EXPECTED_SHA}" \
            -f state=failure \
            -f context="${STATUS_CONTEXT}" \
            -f description="One or more release gates failed" \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
