name: Validate returning-user Complete Profile

on:
  push:
    branches:
      - qa/validate-complete-profile-returning-20260731

permissions:
  contents: read
  statuses: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      EXPECTED_SHA: 8c7511280a8e05d13777aedd140e6606df251416
      STATUS_CONTEXT: QA / returning-user Complete Profile
    steps:
      - name: Mark validation pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${EXPECTED_SHA}" \
            -f state=pending \
            -f context="${STATUS_CONTEXT}" \
            -f description="Running test, typecheck, lint, build, and rendered gates"

      - name: Check out exact product candidate
        uses: actions/checkout@v4
        with:
          ref: fix/complete-profile-returning-users-20260731
          fetch-depth: 0

      - name: Verify exact candidate SHA
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
          git diff --check

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        id: install
        continue-on-error: true
        run: npm ci

      - name: Run complete unit and source suite
        id: test
        continue-on-error: true
        run: npm test

      - name: Run absolute TypeScript gate
        id: typecheck
        continue-on-error: true
        run: npx tsc --noEmit

      - name: Run absolute ESLint gate
        id: lint
        continue-on-error: true
        run: npm run lint

      - name: Build production application
        id: build
        continue-on-error: true
        env:
          NEXT_PUBLIC_SITE_URL: https://www.moraltrade.org
          VERCEL: "1"
          VERCEL_ENV: preview
        run: npm run build

      - name: Install Chromium
        id: browser
        continue-on-error: true
        run: npx playwright install --with-deps chromium

      - name: Run rendered Complete Profile gates
        id: rendered
        continue-on-error: true
        run: npx playwright test tests/complete-profile-review.spec.ts --reporter=line,html

      - name: Upload rendered evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: complete-profile-returning-rendered-evidence
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish validation result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          BROWSER_OUTCOME: ${{ steps.browser.outcome }}
          RENDERED_OUTCOME: ${{ steps.rendered.outcome }}
        run: |
          set -euo pipefail
          outcomes="${INSTALL_OUTCOME} ${TEST_OUTCOME} ${TYPECHECK_OUTCOME} ${LINT_OUTCOME} ${BUILD_OUTCOME} ${BROWSER_OUTCOME} ${RENDERED_OUTCOME}"
          if [[ "${outcomes}" == "success success success success success success success" ]]; then
            state=success
            description="All absolute and rendered release gates passed"
          else
            state=failure
            description="One or more absolute or rendered release gates failed"
          fi

          gh api "repos/${GITHUB_REPOSITORY}/statuses/${EXPECTED_SHA}" \
            -f state="${state}" \
            -f context="${STATUS_CONTEXT}" \
            -f description="${description}" \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/actions"

          printf 'install=%s\ntest=%s\ntypecheck=%s\nlint=%s\nbuild=%s\nbrowser=%s\nrendered=%s\n' \
            "${INSTALL_OUTCOME}" "${TEST_OUTCOME}" "${TYPECHECK_OUTCOME}" "${LINT_OUTCOME}" \
            "${BUILD_OUTCOME}" "${BROWSER_OUTCOME}" "${RENDERED_OUTCOME}"

          test "${state}" = success
