name: Cancel duplicate Account security preview release once

on:
  push:
    branches:
      - ops/dispatch-dashboard-account-security-preview-20260807
    paths:
      - .github/workflows/dispatch-dashboard-account-security-preview-20260807.yml

permissions:
  actions: write
  contents: read

jobs:
  cancel-duplicate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DUPLICATE_RUN_ID: "31157379381"
    steps:
      - name: Cancel only the queued duplicate release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          status="$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${DUPLICATE_RUN_ID}" \
            | jq -r '.status')"

          case "$status" in
            queued|pending|in_progress|requested|waiting)
              response_code="$(curl -sS \
                -o cancel-response.txt \
                -w '%{http_code}' \
                -X POST \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H 'Accept: application/vnd.github+json' \
                -H 'X-GitHub-Api-Version: 2022-11-28' \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${DUPLICATE_RUN_ID}/cancel")"
              if [[ "$response_code" != '202' && "$response_code" != '409' ]]; then
                cat cancel-response.txt >&2
                echo "Cancel returned HTTP ${response_code}." >&2
                exit 1
              fi
              echo "Cancellation requested for duplicate run ${DUPLICATE_RUN_ID}."
              ;;
            completed)
              echo "Duplicate run ${DUPLICATE_RUN_ID} was already completed; no cancellation needed."
              ;;
            *)
              echo "Unexpected duplicate-run status: ${status}" >&2
              exit 1
              ;;
          esac
