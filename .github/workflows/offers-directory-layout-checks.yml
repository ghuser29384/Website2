name: Offers directory repository checks

on:
  pull_request:
    branches: [main]
    paths:
      - src/app/offers/**
      - src/components/marketplace/participant-offer-group*
      - src/lib/offers-directory-layout.test.ts
      - tests/offers-density.spec.ts
      - .github/workflows/offers-directory-layout-checks.yml

permissions:
  contents: read

concurrency:
  group: offers-directory-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  repository:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        revision: [base, candidate]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.revision == 'base' && github.event.pull_request.base.sha || github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Record exact source
        run: |
          mkdir -p qa-results
          git rev-parse HEAD HEAD^{tree} > qa-results/source.txt
      - name: Install dependencies
        run: npm ci
      - name: Focused layout regression tests
        if: matrix.revision == 'candidate'
        run: |
          set -o pipefail
          node --import tsx --test src/lib/offers-directory-layout.test.ts src/offers-walkthrough-density.test.ts | tee qa-results/focused.txt
      - name: Repository tests
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          npm test 2>&1 | tee qa-results/repository-tests.txt
      - name: Repository lint
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          npm run lint -- --format json --output-file qa-results/eslint.json
      - name: Retain diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offers-directory-${{ matrix.revision }}-${{ github.event.pull_request.head.sha }}
          path: qa-results/
          if-no-files-found: error
          retention-days: 7
