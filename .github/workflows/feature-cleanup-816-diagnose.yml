name: Inspect feature cleanup 816 browser failure
on:
  push:
    branches: [ops/feature-cleanup-816-release-20260923]
    paths: [.github/workflows/feature-cleanup-816-diagnose.yml]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    if: github.repository == 'ghuser29384/Website2' && github.ref == 'refs/heads/ops/feature-cleanup-816-release-20260923'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Extract only browser failure context from the exact failed run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/35846327015" > "$RUNNER_TEMP/run.json"
          test "$(jq -r .head_sha "$RUNNER_TEMP/run.json")" = 06211a77e8e37d67cb28785f45a5f7d0fa3ba761
          test "$(jq -r .conclusion "$RUNNER_TEMP/run.json")" = failure
          gh api --allow-escape-sequences "repos/$GITHUB_REPOSITORY/actions/jobs/107133275864/logs" > "$RUNNER_TEMP/job.log"
          python - <<'PY'
          import os,re
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          source=(root/'job.log').read_text(encoding='utf-8-sig')
          source=re.sub(r'\x1b\[[0-9;]*[A-Za-z]','',source)
          lines=source.splitlines()
          keep=set()
          for i,line in enumerate(lines):
              if re.search(r'\b\d+\) \[chromium\]|\b\d+ failed\b|\b\d+ passed\b|\b\d+ skipped\b|Error: expect\(|Test timeout|TimeoutError:',line):
                  keep.update(range(max(0,i-2),min(len(lines),i+48)))
          out='\n'.join(lines[i] for i in sorted(keep))
          assert out,'No failure context found'
          out=out[-40000:]
          (root/'browser-failure.txt').write_text(out+'\n')
          print(out)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: feature-816-browser-failure
          path: ${{ runner.temp }}/browser-failure.txt
          retention-days: 7
