name: PR800 refund operator and rendering recovery v5

on:
  push:
    branches:
      - ops/pr800-refund-operator-recovery-v5-20260824
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: pr800-refund-operator-rendering-recovery-v5
  cancel-in-progress: true

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 160
    env:
      GH_TOKEN: ${{ github.token }}
      FOUNDATION_BRANCH: feature/direct-donation-upgrade-refund-safety-709-clean-20260822
      FOUNDATION_SHA: 358adf99f338f25011b6de4204d72bce4475b12f
      FOUNDATION_TREE: b6be5280a4d9ac4e167763be1c07b94ce5e646b6
      SOURCE_BRANCH: feature/direct-donation-upgrade-refund-safety-709-20260821
      TARGET_BRANCH: feature/direct-donation-upgrade-refund-operator-rendering-709-v2-20260824
      PR_TITLE: Add AAL2-gated refund operator and truthful rendering
    steps:
      - name: Check out isolated controller
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Freeze exact inputs and reconstruct product candidate
        id: reconstruct
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/pr800-refund-operator-v5"
          candidate="$work/candidate"
          evidence="$GITHUB_WORKSPACE/operator-evidence"
          mkdir -p "$work" "$evidence"

          git fetch --no-tags origin \
            "+refs/heads/$FOUNDATION_BRANCH:refs/remotes/origin/$FOUNDATION_BRANCH" \
            "+refs/heads/$SOURCE_BRANCH:refs/remotes/origin/$SOURCE_BRANCH"

          test "$(git rev-parse "refs/remotes/origin/$FOUNDATION_BRANCH")" = "$FOUNDATION_SHA"
          test "$(git rev-parse "$FOUNDATION_SHA^{tree}")" = "$FOUNDATION_TREE"
          test -z "$(git ls-remote origin "refs/heads/$TARGET_BRANCH")"

          source_ref="refs/remotes/origin/$SOURCE_BRANCH"
          git ls-tree -r --name-only "$source_ref" -- .github/pr796-refund-operator-bundle/ \
            | grep -E '^\.github/pr796-refund-operator-bundle/part-[0-9]{2}$' \
            | sort > "$work/bundle-parts.txt"
          test -s "$work/bundle-parts.txt"

          : > "$work/operator.b64"
          while IFS= read -r part; do
            git show "$source_ref:$part" >> "$work/operator.b64"
          done < "$work/bundle-parts.txt"
          base64 --decode "$work/operator.b64" > "$work/operator.tar.gz"
          gzip --test "$work/operator.tar.gz"

          python3 - "$work/operator.tar.gz" "$work/archive-paths.txt" <<'PY'
          import sys
          import tarfile
          from pathlib import PurePosixPath

          archive, output = sys.argv[1:]
          names = []
          total = 0
          with tarfile.open(archive, "r:gz") as tar:
              for member in tar.getmembers():
                  if not member.isfile():
                      raise SystemExit(f"non-file archive member: {member.name}")
                  path = PurePosixPath(member.name)
                  if path.is_absolute() or ".." in path.parts:
                      raise SystemExit(f"unsafe archive path: {member.name}")
                  if not (
                      member.name.startswith("src/")
                      or member.name
                      == "docs/provider-review/every-org-donation-upgrade-review-packet.md"
                  ):
                      raise SystemExit(f"non-product archive path: {member.name}")
                  if member.name.startswith(("src/generated/", "src/.")):
                      raise SystemExit(f"forbidden archive path: {member.name}")
                  if member.size > 1_500_000:
                      raise SystemExit(f"oversized archive member: {member.name}")
                  names.append(member.name)
                  total += member.size

          if not 3 <= len(names) <= 60:
              raise SystemExit(f"unexpected archive path count: {len(names)}")
          if len(names) != len(set(names)):
              raise SystemExit("duplicate archive path")
          if total > 8_000_000:
              raise SystemExit("archive exceeds bounded size")
          with open(output, "w", encoding="utf-8") as handle:
              handle.write("\n".join(sorted(names)) + "\n")
          PY

          git worktree add --detach "$candidate" "$FOUNDATION_SHA"
          tar -xzf "$work/operator.tar.gz" -C "$candidate" --no-same-owner

          python3 - "$candidate" "$work/actual-paths.txt" <<'PY'
          import subprocess
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          output = Path(sys.argv[2])
          raw = subprocess.check_output(
              [
                  "git",
                  "-C",
                  str(root),
                  "status",
                  "--porcelain=v1",
                  "--untracked-files=all",
                  "-z",
              ]
          )
          records = [record for record in raw.decode().split("\0") if record]
          paths = []
          for record in records:
              status = record[:2]
              path = record[3:]
              if "R" in status or "C" in status:
                  raise SystemExit(f"unexpected rename/copy status: {record!r}")
              paths.append(path)
          if not paths:
              raise SystemExit("archive produced no product changes")
          if len(paths) != len(set(paths)):
              raise SystemExit("duplicate changed path")
          output.write_text("\n".join(sorted(paths)) + "\n", encoding="utf-8")
          PY

          comm -23 "$work/actual-paths.txt" "$work/archive-paths.txt" \
            > "$work/unexpected-paths.txt"
          test ! -s "$work/unexpected-paths.txt"
          count="$(wc -l < "$work/actual-paths.txt" | tr -d ' ')"
          test "$count" -ge 3
          test "$count" -le 60

          if grep -E '(^|/)(\.github|scripts|supabase/migrations)/|(^|/)package(-lock)?\.json$' \
            "$work/actual-paths.txt"; then
            echo "non-product, script, package, or migration path in operator tranche" >&2
            exit 1
          fi

          cp "$work/bundle-parts.txt" "$evidence/"
          cp "$work/archive-paths.txt" "$evidence/"
          cp "$work/actual-paths.txt" "$evidence/"
          sha256sum "$work/operator.tar.gz" > "$evidence/operator-archive-sha256.txt"
          printf 'foundation_branch=%s\nfoundation_sha=%s\nfoundation_tree=%s\nsource_branch=%s\ntarget_branch=%s\ncontroller_sha=%s\n' \
            "$FOUNDATION_BRANCH" "$FOUNDATION_SHA" "$FOUNDATION_TREE" \
            "$SOURCE_BRANCH" "$TARGET_BRANCH" "$(git rev-parse HEAD)" \
            > "$evidence/input-identity.txt"

          echo "CANDIDATE_DIR=$candidate" >> "$GITHUB_ENV"
          echo "WORK_DIR=$work" >> "$GITHUB_ENV"
          echo "EVIDENCE_DIR=$evidence" >> "$GITHUB_ENV"

      - name: Verify bounded operator, rendering, privacy, and authorization contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$CANDIDATE_DIR" "$WORK_DIR/actual-paths.txt" <<'PY'
          import re
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          paths = [
              line
              for line in Path(sys.argv[2]).read_text(encoding="utf-8").splitlines()
              if line
          ]
          text = {path: (root / path).read_text(encoding="utf-8") for path in paths}
          combined = "\n".join(text.values())
          implementation = "\n".join(
              source
              for path, source in text.items()
              if not path.endswith((".test.ts", ".test.tsx"))
              and not path.startswith("docs/")
          )

          required = [
              ("AAL2/MFA boundary", r"\baal2\b|assurance_level|\bmfa\b"),
              ("administrator authorization", r"admin(?:istrator)?|allowlist"),
              ("server action", r"[\"']use server[\"']"),
              (
                  "refund RPC",
                  r"record_direct_donation_upgrade_provider_reversal",
              ),
              (
                  "provider reversal rendering",
                  r"provider_reversed|Provider refund recorded",
              ),
              (
                  "post-completion exception rendering",
                  r"post_completion_exception|post-completion exception",
              ),
              (
                  "current-versus-historical accounting",
                  r"current_unreversed|currently unreversed|historical",
              ),
          ]
          for label, pattern in required:
              if not re.search(pattern, combined, re.I):
                  raise SystemExit(f"missing required contract: {label}")

          forbidden = [
              (
                  "direct Every.org network call",
                  r"https?://(?:staging\.)?every\.org|api\.every\.org",
              ),
              (
                  "managed checkout/payment execution",
                  r"PaymentIntent|CheckoutSession|stripe\.checkout",
              ),
              (
                  "new raw donor or payment persistence",
                  r"donor_email|donor_name|card_number|bank_account|raw_provider_payload",
              ),
              (
                  "brand endorsement claim",
                  r"official partner|sponsored by|endorsed by|in partnership with Every\.org",
              ),
          ]
          for label, pattern in forbidden:
              if re.search(pattern, implementation, re.I):
                  raise SystemExit(f"forbidden implementation content: {label}")

          test_paths = [
              path for path in paths if path.endswith((".test.ts", ".test.tsx"))
          ]
          if not test_paths:
              raise SystemExit("missing durable operator/rendering tests")

          action_paths = [
              path for path in paths if path.endswith(("actions.ts", "actions.tsx"))
          ]
          if not action_paths:
              raise SystemExit("missing server action path")
          action_text = "\n".join(text[path] for path in action_paths)
          if not re.search(
              r"recordProviderRefundFromForm|record_direct_donation_upgrade_provider_reversal",
              action_text,
          ):
              raise SystemExit("server action is not connected to the refund recorder")

          server_paths = [
              path
              for path in paths
              if "refund-server" in path or path.endswith(("actions.ts", "actions.tsx"))
          ]
          server_text = "\n".join(text[path] for path in server_paths)
          if "record_direct_donation_upgrade_provider_reversal" not in server_text:
              raise SystemExit("server-side tranche does not invoke the refund RPC")
          if not re.search(r"\baal2\b|assurance_level|\bmfa\b", server_text, re.I):
              raise SystemExit("server-side refund path lacks an AAL2/MFA check")

          fixture_paths = [path for path in paths if "/qa/" in path]
          for path in fixture_paths:
              source = text[path]
              if (
                  "DIRECT_DONATION_UPGRADE_QA_FIXTURES" not in source
                  or "VERCEL_ENV" not in source
              ):
                  raise SystemExit(f"QA fixture is not fail-closed: {path}")
          PY

          mapfile -t paths < "$WORK_DIR/actual-paths.txt"
          git -C "$CANDIDATE_DIR" add --intent-to-add -- "${paths[@]}"
          git -C "$CANDIDATE_DIR" diff --check
          git -C "$CANDIDATE_DIR" diff --name-only "$FOUNDATION_SHA" | sort \
            > "$EVIDENCE_DIR/diff-paths.txt"
          diff -u "$WORK_DIR/actual-paths.txt" "$EVIDENCE_DIR/diff-paths.txt"

          while IFS= read -r path; do
            sha256sum "$CANDIDATE_DIR/$path"
          done < "$WORK_DIR/actual-paths.txt" > "$EVIDENCE_DIR/product-source-sha256.txt"

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd "$CANDIDATE_DIR"
          npm ci > "$EVIDENCE_DIR/npm-ci.log" 2>&1

      - name: Run focused operator, rendering, refund, and inherited tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$CANDIDATE_DIR"
          mapfile -t recovered < <(
            grep -E '\.test\.tsx?$' "$WORK_DIR/actual-paths.txt" || true
          )
          tests=(
            src/lib/provider-refund-contract.test.ts
            src/lib/every-org-partner-webhook-auth.test.ts
            src/lib/direct-donation-upgrade.test.ts
            src/lib/direct-donation-upgrade-source-contract.test.ts
          )
          tests+=("${recovered[@]}")
          printf '%s\n' "${tests[@]}" | awk '!seen[$0]++' \
            > "$EVIDENCE_DIR/focused-test-paths.txt"
          mapfile -t unique < "$EVIDENCE_DIR/focused-test-paths.txt"
          node --import tsx --test "${unique[@]}" \
            > "$EVIDENCE_DIR/focused-tests.log" 2>&1

      - name: Run complete repository tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$CANDIDATE_DIR"
          npm test > "$EVIDENCE_DIR/repository-tests.log" 2>&1

      - name: Run strict TypeScript
        shell: bash
        run: |
          set -euo pipefail
          cd "$CANDIDATE_DIR"
          npx tsc --noEmit > "$EVIDENCE_DIR/typecheck.log" 2>&1

      - name: Run repository ESLint
        shell: bash
        run: |
          set -euo pipefail
          cd "$CANDIDATE_DIR"
          npm run lint -- --quiet > "$EVIDENCE_DIR/lint.log" 2>&1

      - name: Build with every money rail and QA fixture disabled
        shell: bash
        env:
          NEXT_PUBLIC_SITE_URL: https://www.moraltrade.org
          VERCEL: "1"
          VERCEL_ENV: preview
          DIRECT_DONATION_UPGRADES_ENABLED: "false"
          DIRECT_DONATION_UPGRADE_MODE: disabled
          DIRECT_DONATION_UPGRADE_QA_FIXTURES: "false"
          CONDITIONAL_PAYMENTS_MODE: disabled
          TRADE_DONATION_POOL_ENABLED: "false"
          TRADE_DONATION_POOL_MODE: disabled
        run: |
          set -euo pipefail
          cd "$CANDIDATE_DIR"
          npm run build > "$EVIDENCE_DIR/build.log" 2>&1

      - name: Commit and publish exact one-commit stacked candidate
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          cd "$CANDIDATE_DIR"

          test "$(git ls-remote origin "refs/heads/$FOUNDATION_BRANCH" | awk '{print $1}')" \
            = "$FOUNDATION_SHA"
          test -z "$(git ls-remote origin "refs/heads/$TARGET_BRANCH")"

          mapfile -t paths < "$WORK_DIR/actual-paths.txt"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- "${paths[@]}"
          git diff --cached --name-only | sort > "$EVIDENCE_DIR/staged-paths.txt"
          diff -u "$WORK_DIR/actual-paths.txt" "$EVIDENCE_DIR/staged-paths.txt"

          git commit -m "Add AAL2-gated refund operator and truthful rendering"
          product_sha="$(git rev-parse HEAD)"
          product_tree="$(git rev-parse HEAD^{tree})"
          test "$(git rev-parse HEAD^)" = "$FOUNDATION_SHA"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"

          printf 'foundation_sha=%s\nfoundation_tree=%s\nproduct_sha=%s\nproduct_tree=%s\nchanged_files=%s\n' \
            "$FOUNDATION_SHA" "$FOUNDATION_TREE" "$product_sha" "$product_tree" \
            "$(wc -l < "$WORK_DIR/actual-paths.txt" | tr -d ' ')" \
            | tee "$EVIDENCE_DIR/product-identity.txt"
          echo "product_sha=$product_sha" >> "$GITHUB_OUTPUT"
          echo "product_tree=$product_tree" >> "$GITHUB_OUTPUT"

      - name: Open exact stacked draft pull request
        id: pr
        shell: bash
        env:
          PRODUCT_SHA: ${{ steps.publish.outputs.product_sha }}
          PRODUCT_TREE: ${{ steps.publish.outputs.product_tree }}
        run: |
          set -euo pipefail
          body_file="$RUNNER_TEMP/pr-body.md"
          cat > "$body_file" <<EOF
          ## Purpose

          Add the separately bounded Issue #709 administrator and rendering tranche on top of the exact validated PR #800 refund-accounting foundation.

          ## Exact identity

          - base branch: \`$FOUNDATION_BRANCH\`
          - exact base: \`$FOUNDATION_SHA\`
          - head branch: \`$TARGET_BRANCH\`
          - exact product head: \`$PRODUCT_SHA\`
          - exact product tree: \`$PRODUCT_TREE\`
          - relationship: exactly one commit ahead and zero behind at publication

          ## Implemented boundary

          - allowlisted administrator access with an active AAL2/MFA session;
          - server-side recording of a refund that Every.org has already made;
          - invocation of the existing service-role-only provider-reversal RPC;
          - fail-closed evidence comparison and data minimization;
          - participant and administrator rendering for provider-reversed obligations and post-completion exceptions;
          - historical provider-confirmed value separated from current unreversed credit;
          - durable operator, authorization, refund, replay, and rendering contract tests.

          ## Validation

          Recovery run \`$GITHUB_RUN_ID\` passed focused tests, the complete repository suite, strict TypeScript, repository ESLint, a disabled-money-rail production build, static authorization/privacy/brand contracts, exact scope checks, and exact ancestry checks.

          ## Disposition

          This PR is draft, stacked, disabled, unmerged, and undeployed. No Every.org request, webhook registration or invocation, checkout, donation, payment, actual refund, database migration, deployment, alias movement, credential mutation, feature activation, custody, transfer, payout, email, brand submission, or production change occurred.
          EOF

          pr_url="$(gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base "$FOUNDATION_BRANCH" \
            --head "$TARGET_BRANCH" \
            --title "$PR_TITLE" \
            --body-file "$body_file" \
            --draft)"
          pr_number="$(gh pr view "$pr_url" --repo "$GITHUB_REPOSITORY" --json number --jq .number)"
          printf 'pr_number=%s\npr_url=%s\n' "$pr_number" "$pr_url" \
            | tee "$EVIDENCE_DIR/pull-request.txt"
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"

      - name: Record authoritative v5 success
        shell: bash
        env:
          PRODUCT_SHA: ${{ steps.publish.outputs.product_sha }}
          PRODUCT_TREE: ${{ steps.publish.outputs.product_tree }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
        run: |
          set -euo pipefail
          paths="$(sed 's/^/- `/' "$WORK_DIR/actual-paths.txt" | sed 's/$/`/')"
          body="<!-- pr800-refund-operator-recovery-v5-20260824 -->
          ## AAL2 refund-operator and truthful-rendering tranche validated

          - exact foundation: \`$FOUNDATION_SHA\`
          - exact product head: \`$PRODUCT_SHA\`
          - exact product tree: \`$PRODUCT_TREE\`
          - stacked draft PR: #$PR_NUMBER
          - changed product paths: \`$(wc -l < "$WORK_DIR/actual-paths.txt" | tr -d ' ')\`
          - validation run: \`$GITHUB_RUN_ID\`
          - focused tests, complete repository tests, TypeScript, ESLint, disabled-money-rail build, static authorization/privacy/brand contracts, exact scope, and exact ancestry: passed

          Durable product paths:
          $paths

          This remains a separate stacked, disabled, unmerged, and undeployed tranche. No Every.org request, webhook registration or invocation, checkout, donation, payment, actual refund, database migration, deployment, alias change, credential mutation, feature activation, custody, transfer, payout, email, brand submission, or production change occurred."
          gh issue comment 709 --repo "$GITHUB_REPOSITORY" --body "$body"

      - name: Record failure without overstating product evidence
        if: failure()
        shell: bash
        run: |
          body="<!-- pr800-refund-operator-recovery-v5-failure-20260824 -->
          The bounded v5 refund-operator recovery failed in run \`$GITHUB_RUN_ID\`. No failed run is product evidence. No Every.org request, webhook registration or invocation, checkout, donation, payment, actual refund, database migration, deployment, alias change, credential mutation, feature activation, custody, transfer, payout, email, brand submission, or production change occurred."
          gh issue comment 709 --repo "$GITHUB_REPOSITORY" --body "$body"

      - name: Write explicit non-action evidence
        if: always()
        shell: bash
        run: |
          mkdir -p operator-evidence
          printf '%s\n' \
            providerRequestAttempted=false \
            webhookMutationAttempted=false \
            checkoutAttempted=false \
            donationAttempted=false \
            paymentAttempted=false \
            actualRefundAttempted=false \
            databaseMigrationAttempted=false \
            deploymentAttempted=false \
            aliasMovementAttempted=false \
            credentialMutationAttempted=false \
            featureActivationAttempted=false \
            emailSent=false \
            brandSubmissionSent=false \
            productionChanged=false \
            > operator-evidence/non-actions.txt

      - name: Upload bounded recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr800-refund-operator-recovery-v5-${{ github.run_id }}
          path: operator-evidence/
          if-no-files-found: error
          retention-days: 30
