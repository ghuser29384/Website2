name: Evidence credibility shadow collection QA

on:
  pull_request:
    branches:
      - feature/evidence-credibility-shadow-v2-20260810
    paths:
      - .github/workflows/evidence-credibility-shadow-collection-qa.yml
      - docs/moral-trade/evidence-credibility-shadow-collection-v1.md
      - src/app/admin/evidence-credibility-shadow-actions.ts
      - src/app/admin/evidence-credibility-shadow/page.tsx
      - src/lib/evidence-credibility-shadow-collection-contract.test.ts
      - supabase/migrations/20260812020000_evidence_credibility_shadow_collection_queue.sql
      - supabase/tests/evidence_credibility_shadow_collection_queue.sql
  push:
    branches:
      - feature/evidence-credibility-shadow-collection-v1-20260812
    paths:
      - .github/workflows/evidence-credibility-shadow-collection-qa.yml
      - docs/moral-trade/evidence-credibility-shadow-collection-v1.md
      - src/app/admin/evidence-credibility-shadow-actions.ts
      - src/app/admin/evidence-credibility-shadow/page.tsx
      - src/lib/evidence-credibility-shadow-collection-contract.test.ts
      - supabase/migrations/20260812020000_evidence_credibility_shadow_collection_queue.sql
      - supabase/tests/evidence_credibility_shadow_collection_queue.sql
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evidence-credibility-shadow-collection-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: false

env:
  EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  source-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Guard exact private stacked scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          git merge-base --is-ancestor 091026c421131489cf092bb81c27f59a2a60290d HEAD
          test -f .github/workflows/evidence-credibility-shadow-collection-qa.yml
          test -f docs/moral-trade/evidence-credibility-shadow-collection-v1.md
          test -f src/app/admin/evidence-credibility-shadow-actions.ts
          test -f src/app/admin/evidence-credibility-shadow/page.tsx
          test -f src/lib/evidence-credibility-shadow-collection-contract.test.ts
          test -f supabase/migrations/20260812020000_evidence_credibility_shadow_collection_queue.sql
          test -f supabase/tests/evidence_credibility_shadow_collection_queue.sql
          ! grep -R "jnpoxvalyjtdghnperyu" \
            .github/workflows/evidence-credibility-shadow-collection-qa.yml \
            docs/moral-trade/evidence-credibility-shadow-collection-v1.md \
            src/app/admin/evidence-credibility-shadow-actions.ts \
            src/app/admin/evidence-credibility-shadow/page.tsx \
            src/lib/evidence-credibility-shadow-collection-contract.test.ts \
            supabase/migrations/20260812020000_evidence_credibility_shadow_collection_queue.sql \
            supabase/tests/evidence_credibility_shadow_collection_queue.sql
          ! grep -R "createServiceClient" \
            src/app/admin/evidence-credibility-shadow-actions.ts \
            src/app/admin/evidence-credibility-shadow/page.tsx
          git diff --check 091026c421131489cf092bb81c27f59a2a60290d...HEAD

      - name: Install exact dependencies
        run: npm ci

      - name: Run focused private-collection source contract
        run: >-
          node --import tsx --test
          src/lib/evidence-credibility-shadow-collection-contract.test.ts

      - name: Run complete repository tests
        run: npm test

      - name: Run repository-wide ESLint
        run: npm run lint -- --quiet

      - name: Run strict TypeScript
        run: npx tsc --noEmit

      - name: Build production application
        env:
          NEXT_PUBLIC_SITE_URL: https://www.moraltrade.org
          VERCEL: "1"
          VERCEL_ENV: preview
        run: npm run build

      - name: Preserve exact-head source evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source-evidence
          git rev-parse HEAD > source-evidence/head-sha.txt
          git status --short > source-evidence/status.txt
          test ! -s source-evidence/status.txt
          sha256sum \
            .github/workflows/evidence-credibility-shadow-collection-qa.yml \
            docs/moral-trade/evidence-credibility-shadow-collection-v1.md \
            src/app/admin/evidence-credibility-shadow-actions.ts \
            src/app/admin/evidence-credibility-shadow/page.tsx \
            src/lib/evidence-credibility-shadow-collection-contract.test.ts \
            supabase/migrations/20260812020000_evidence_credibility_shadow_collection_queue.sql \
            supabase/tests/evidence_credibility_shadow_collection_queue.sql \
            > source-evidence/file-sha256.txt

      - name: Upload exact-head source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-credibility-shadow-collection-source-${{ github.run_id }}-${{ env.EXPECTED_HEAD_SHA }}
          path: source-evidence
          if-no-files-found: warn
          retention-days: 30

  isolated-database:
    needs: source-and-build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      EXPECTED_QA_POOLER_HOST: aws-0-us-west-1.pooler.supabase.com
      EXPECTED_QA_REF: hvmxfjjbdcgjjudmthdz
      PGSSLMODE: require
      QA_SUPABASE_DB_URL: ${{ secrets.QA_SUPABASE_DB_URL }}
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          fetch-depth: 0

      - name: Guard exact candidate and TLS-only isolated QA target
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test -n "${QA_SUPABASE_DB_URL:-}"
          python3 - <<'PY'
          import os
          from urllib.parse import parse_qs, urlparse

          parsed = urlparse(os.environ["QA_SUPABASE_DB_URL"])
          ssl_modes = parse_qs(parsed.query).get("sslmode", ["require"])
          valid = (
              parsed.scheme in {"postgres", "postgresql"}
              and os.environ["EXPECTED_QA_REF"] in (parsed.username or "")
              and parsed.hostname == os.environ["EXPECTED_QA_POOLER_HOST"]
              and parsed.port == 5432
              and parsed.path == "/postgres"
              and ssl_modes == ["require"]
              and bool(parsed.password)
          )
          if not valid:
              raise SystemExit("Refusing a database URL outside the exact TLS-only MoralTrade QA target.")
          PY

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes postgresql-client > /dev/null

      - name: Record active-pipeline and fail-closed baselines
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p database-evidence
          psql "$QA_SUPABASE_DB_URL" \
            --no-psqlrc \
            --tuples-only \
            --no-align \
            --set ON_ERROR_STOP=1 <<'SQL' \
            | sed '/^[[:space:]]*$/d' \
            > database-evidence/before-state.txt
          select 'active_aggregates|' || count(*) from public.credibility_public_aggregates
          union all select 'active_events|' || count(*) from public.credibility_events
          union all select 'active_restrictions|' || count(*) from public.credibility_restrictions
          union all select 'shadow_aggregates|' || count(*) from public.credibility_shadow_aggregates
          union all select 'shadow_events|' || count(*) from public.credibility_shadow_events
          union all select 'shadow_restriction_signals|' || count(*) from public.credibility_shadow_restriction_signals
          union all select 'evidence_decisions|' || count(*) from public.trade_evidence_decisions
          union all select 'settlement_decisions|' || count(*) from public.trade_settlement_shadow_decisions
          order by 1;
          SQL

      - name: Preflight exact migration and rollback-only regression together
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          migration_path = Path(
              "supabase/migrations/20260812020000_evidence_credibility_shadow_collection_queue.sql"
          )
          test_path = Path(
              "supabase/tests/evidence_credibility_shadow_collection_queue.sql"
          )
          migration = migration_path.read_text(encoding="utf-8")
          migration = migration.replace(
              "create trigger credibility_shadow_collection_audit_append_only",
              "drop trigger if exists credibility_shadow_collection_audit_append_only "
              "on public.credibility_shadow_collection_audit;\n\n"
              "create trigger credibility_shadow_collection_audit_append_only",
              1,
          )
          tests = test_path.read_text(encoding="utf-8").splitlines()
          if tests[0].startswith("--"):
              pass
          begin_index = next(
              index for index, line in enumerate(tests)
              if line.strip().lower() == "begin;"
          )
          rollback_index = next(
              index for index in range(len(tests) - 1, -1, -1)
              if tests[index].strip().lower() == "rollback;"
          )
          combined = ["begin;", migration]
          combined.extend(tests[begin_index + 1:rollback_index])
          combined.append("rollback;")
          Path("qa-shadow-collection-preflight.sql").write_text(
              "\n".join(combined) + "\n",
              encoding="utf-8",
          )
          Path("qa-shadow-collection-migration.sql").write_text(
              migration,
              encoding="utf-8",
          )
          PY
          psql "$QA_SUPABASE_DB_URL" \
            --no-psqlrc \
            --set ON_ERROR_STOP=1 \
            --file qa-shadow-collection-preflight.sql \
            | tee database-evidence/preflight.log

      - name: Apply the exact candidate semantics to isolated QA
        shell: bash
        run: |
          set -euo pipefail
          psql "$QA_SUPABASE_DB_URL" \
            --no-psqlrc \
            --set ON_ERROR_STOP=1 \
            --file qa-shadow-collection-migration.sql \
            | tee database-evidence/migration.log

      - name: Run post-apply rollback-only collection regression
        shell: bash
        run: |
          set -euo pipefail
          psql "$QA_SUPABASE_DB_URL" \
            --no-psqlrc \
            --set ON_ERROR_STOP=1 \
            --file supabase/tests/evidence_credibility_shadow_collection_queue.sql \
            | tee database-evidence/regression.log

      - name: Prove zero residue, exact grants, and active-pipeline isolation
        shell: bash
        run: |
          set -euo pipefail
          psql "$QA_SUPABASE_DB_URL" \
            --no-psqlrc \
            --tuples-only \
            --no-align \
            --set ON_ERROR_STOP=1 <<'SQL' \
            | sed '/^[[:space:]]*$/d' \
            > database-evidence/after-state.txt
          do $check$
          begin
            if (select count(*) from public.credibility_shadow_collection_audit) <> 0
               or (select count(*) from public.trade_evidence_decisions) <> 0
               or (select count(*) from public.trade_settlement_shadow_decisions) <> 0
               or (select count(*) from public.credibility_shadow_events) <> 0
               or (select count(*) from public.credibility_shadow_restriction_signals) <> 0
               or (select count(*) from public.credibility_shadow_aggregates) <> 0 then
              raise exception 'Rollback-only collection QA left private shadow residue.';
            end if;

            if not exists (
              select 1
              from public.credibility_shadow_controls
              where control_key = 'evidence_decision_v2'
                and mode = 'shadow'
                and not milestone_cutover_enabled
                and not public_effects_enabled
                and not ranking_effects_enabled
                and not eligibility_effects_enabled
            ) then
              raise exception 'Evidence credibility controls are not fail-closed.';
            end if;

            if not has_function_privilege(
                 'authenticated',
                 'public.list_credibility_shadow_collection_queue_v1(integer,integer)',
                 'execute'
               )
               or has_function_privilege(
                 'anon',
                 'public.list_credibility_shadow_collection_queue_v1(integer,integer)',
                 'execute'
               )
               or has_function_privilege(
                 'service_role',
                 'public.list_credibility_shadow_collection_queue_v1(integer,integer)',
                 'execute'
               )
               or has_table_privilege(
                 'authenticated',
                 'public.credibility_shadow_collection_audit',
                 'select'
               ) then
              raise exception 'Private collection authorization grants are not exact.';
            end if;
          end;
          $check$;

          select 'active_aggregates|' || count(*) from public.credibility_public_aggregates
          union all select 'active_events|' || count(*) from public.credibility_events
          union all select 'active_restrictions|' || count(*) from public.credibility_restrictions
          union all select 'shadow_aggregates|' || count(*) from public.credibility_shadow_aggregates
          union all select 'shadow_events|' || count(*) from public.credibility_shadow_events
          union all select 'shadow_restriction_signals|' || count(*) from public.credibility_shadow_restriction_signals
          union all select 'evidence_decisions|' || count(*) from public.trade_evidence_decisions
          union all select 'settlement_decisions|' || count(*) from public.trade_settlement_shadow_decisions
          order by 1;
          SQL
          sed -i '/^DO$/d' database-evidence/after-state.txt
          diff -u database-evidence/before-state.txt database-evidence/after-state.txt

          psql "$QA_SUPABASE_DB_URL" \
            --no-psqlrc \
            --tuples-only \
            --no-align \
            --set ON_ERROR_STOP=1 \
            --command "select jsonb_build_object('controlKey', control_key, 'mode', mode, 'milestoneCutover', milestone_cutover_enabled, 'publicEffects', public_effects_enabled, 'rankingEffects', ranking_effects_enabled, 'eligibilityEffects', eligibility_effects_enabled) from public.credibility_shadow_controls where control_key='evidence_decision_v2'" \
            | sed '/^[[:space:]]*$/d' \
            > database-evidence/fail-closed-control.json

      - name: Upload isolated-database evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-credibility-shadow-collection-database-${{ github.run_id }}-${{ env.EXPECTED_HEAD_SHA }}
          path: |
            database-evidence
            qa-shadow-collection-preflight.sql
            qa-shadow-collection-migration.sql
          if-no-files-found: warn
          retention-days: 30
