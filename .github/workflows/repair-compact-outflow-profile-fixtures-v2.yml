name: Repair Compact outflow profile fixtures v2

on:
  push:
    branches:
      - feature/compact-authoritative-outflow-ledger-v1-20260816
    paths:
      - .github/workflows/repair-compact-outflow-profile-fixtures-v2.yml

permissions:
  contents: write

concurrency:
  group: repair-compact-outflow-profile-fixtures-v2-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out exact controller commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Verify authorized lineage and controller-only drift
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor de3b6e5480a43cf536c655cc3ad1c69786352382 HEAD
          cat > /tmp/expected-controller-files.txt <<'EOF'
          .github/workflows/repair-compact-outflow-profile-fixtures-v1.yml
          .github/workflows/repair-compact-outflow-profile-fixtures-v2.yml
          EOF
          sed -i 's/^          //' /tmp/expected-controller-files.txt
          git diff --name-only de3b6e5480a43cf536c655cc3ad1c69786352382...HEAD | sort > /tmp/actual-controller-files.txt
          diff -u /tmp/expected-controller-files.txt /tmp/actual-controller-files.txt

      - name: Repair deterministic fixtures and durable validation contract
        shell: bash
        env:
          PHASE_CONTRACT_B64:   
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          assignments = "\n".join([
              "on conflict (id) do update set",
              "  email = excluded.email,",
              "  display_name = excluded.display_name,",
              "  bio = excluded.bio,",
              "  affiliation = excluded.affiliation,",
              "  username = excluded.username,",
              "  account_kind = excluded.account_kind,",
              "  accepts_group_invitations = excluded.accepts_group_invitations,",
              "  public_invitation_mentions_enabled = excluded.public_invitation_mentions_enabled",
          ])

          def make_profile_fixture_idempotent(path: str, end_marker: str) -> None:
              target = Path(path)
              source = target.read_text(encoding="utf-8")
              start = source.index("insert into public.profiles (")
              end = source.index(end_marker, start)
              block = source[start:end]
              if assignments not in block:
                  stripped = block.rstrip()
                  if not stripped.endswith(";"):
                      raise SystemExit(f"{path}: profile fixture does not end in a semicolon")
                  block = stripped[:-1] + "\n" + assignments + ";"
                  target.write_text(source[:start] + block + source[end:], encoding="utf-8")

          make_profile_fixture_idempotent(
              "supabase/tests/compact_authoritative_outflow_ledger_core.sql",
              "\n\\echo ledger-core:profiles-inserted",
          )
          make_profile_fixture_idempotent(
              "supabase/tests/compact_authoritative_outflow_ledger_authorization.sql",
              "\n\ninsert into public.trade_review_role_grants",
          )

          workflow_path = Path(".github/workflows/compact-authoritative-outflow-ledger-qa.yml")
          workflow = workflow_path.read_text(encoding="utf-8")

          def replace_once(old: str, new: str, label: str) -> None:
              global workflow
              count = workflow.count(old)
              if count == 1:
                  workflow = workflow.replace(old, new)
              elif new not in workflow:
                  raise SystemExit(f"Expected one {label}; found {count}")

          replace_once(
              "          src/lib/mpgf/compact-authoritative-outflow-contract.test.ts\n"
              "          src/lib/mpgf/compact-authoritative-outflow.test.ts",
              "          src/lib/mpgf/compact-authoritative-outflow-contract.test.ts\n"
              "          src/lib/mpgf/compact-authoritative-outflow-phase-order-contract.test.ts\n"
              "          src/lib/mpgf/compact-authoritative-outflow.test.ts",
              "expected manifest",
          )
          replace_once(
              "            src/lib/mpgf/compact-authoritative-outflow-contract.test.ts \\\n"
              "            src/lib/mpgf/public-goods-compacts.test.ts",
              "            src/lib/mpgf/compact-authoritative-outflow-contract.test.ts \\\n"
              "            src/lib/mpgf/compact-authoritative-outflow-phase-order-contract.test.ts \\\n"
              "            src/lib/mpgf/public-goods-compacts.test.ts",
              "focused contract list",
          )
          replace_once(
              'test "$(wc -l < /tmp/actual.txt)" -eq 14',
              'test "$(wc -l < /tmp/actual.txt)" -eq 15',
              "scope count",
          )
          replace_once(
              '          for controller in .github/workflows/repair-compact-outflow-*.yml; do\n'
              '            test ! -e "$controller"\n'
              '          done',
              '          test ! -e .github/workflows/add-compact-outflow-phase-order-contract-v1.yml\n'
              '          for controller in .github/workflows/repair-compact-outflow-*.yml; do\n'
              '            test ! -e "$controller"\n'
              '          done',
              "controller guard",
          )
          replace_once(
              'psql "$DB_URL" --no-psqlrc --set ON_ERROR_STOP=1 <<\'SQL\' | tee db-evidence/pre-ledger-lifecycle.log',
              'psql "$DB_URL" --no-psqlrc --set ON_ERROR_STOP=1 2>&1 <<\'SQL\' | tee db-evidence/pre-ledger-lifecycle.log',
              "pre-ledger stderr capture",
          )
          replace_once(
              'psql "$DB_URL" --no-psqlrc --set ON_ERROR_STOP=1 <<\'SQL\' | tee db-evidence/ledger-lifecycle.log',
              'psql "$DB_URL" --no-psqlrc --set ON_ERROR_STOP=1 2>&1 <<\'SQL\' | tee db-evidence/ledger-lifecycle.log',
              "ledger stderr capture",
          )
          replace_once(
              'psql "$QA_DB_URL" --no-psqlrc --set ON_ERROR_STOP=1 <<\'SQL\' | tee rollback-evidence/lifecycle.log',
              'psql "$QA_DB_URL" --no-psqlrc --set ON_ERROR_STOP=1 2>&1 <<\'SQL\' | tee rollback-evidence/lifecycle.log',
              "rollback stderr capture",
          )
          workflow_path.write_text(workflow, encoding="utf-8")

          Path("src/lib/mpgf/compact-authoritative-outflow-phase-order-contract.test.ts").write_bytes(
              base64.b64decode(os.environ["PHASE_CONTRACT_B64"]),
          )
          PY

          git diff --check
          grep -q 'on conflict (id) do update set' supabase/tests/compact_authoritative_outflow_ledger_core.sql
          grep -q 'on conflict (id) do update set' supabase/tests/compact_authoritative_outflow_ledger_authorization.sql
          grep -q 'compact-authoritative-outflow-phase-order-contract.test.ts' .github/workflows/compact-authoritative-outflow-ledger-qa.yml
          grep -q 'eq 15' .github/workflows/compact-authoritative-outflow-ledger-qa.yml
          grep -q '2>&1' .github/workflows/compact-authoritative-outflow-ledger-qa.yml

      - name: Commit durable repair and remove one-use controllers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/compact-authoritative-outflow-ledger-qa.yml \
            src/lib/mpgf/compact-authoritative-outflow-phase-order-contract.test.ts \
            supabase/tests/compact-authoritative_outflow_ledger_core.sql \
            supabase/tests/compact-authoritative_outflow_ledger_authorization.sql
          git rm --ignore-unmatch \
            .github/workflows/add-compact-outflow-phase-order-contract-v1.yml \
            .github/workflows/repair-compact-outflow-phase-lineage-v3.yml \
            .github/workflows/repair-compact-outflow-phase-ordering-v2.yml \
            .github/workflows/repair-compact-outflow-profile-fixtures-v1.yml \
            .github/workflows/repair-compact-outflow-profile-fixtures-v2.yml
          git commit -m "test: repair Compact outflow profile fixtures"
          git push origin "HEAD:${GITHUB_REF_NAME}"
