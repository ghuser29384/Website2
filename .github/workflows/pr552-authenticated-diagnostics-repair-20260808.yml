name: PR 552 authenticated diagnostics repair

on:
  push:
    branches:
      - ops/pr552-authenticated-diagnostics-repair-20260808
    paths:
      - .github/scripts/pr552-authenticated-diagnostics-repair-20260808.py
      - .github/workflows/pr552-authenticated-diagnostics-repair-20260808.yml

permissions:
  contents: write

concurrency:
  group: pr552-authenticated-diagnostics-repair-20260808
  cancel-in-progress: false

jobs:
  repair:
    name: Patch the exact PR 552 branch
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TARGET_BRANCH: hotfix/dashboard-account-security-visible-20260807
      EXPECTED_TARGET_SHA: 795874493862c926f9eb2a4d2239a28a99e41968
      PATCHER_PATH: .github/scripts/pr552-authenticated-diagnostics-repair-20260808.py
    steps:
      - name: Check out exact target
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Guard target and materialize patcher
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'ghuser29384/Website2'
          test "$(git branch --show-current)" = "$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$EXPECTED_TARGET_SHA"
          git cat-file -e "${GITHUB_SHA}^{commit}"
          git show "${GITHUB_SHA}:${PATCHER_PATH}" > "$RUNNER_TEMP/pr552-diagnostics-patcher.py"
          python3 -m py_compile "$RUNNER_TEMP/pr552-diagnostics-patcher.py"

      - name: Apply repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/pr552-diagnostics-patcher.py"

      - name: Verify exact scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --name-only | sort > actual.txt
          cat > expected.txt <<'EOF'
          src/app/dashboard/page.tsx
          src/components/dashboard/background-account-security-panel.tsx
          src/dashboard-account-security-visibility.test.ts
          EOF
          diff -u expected.txt actual.txt
          test "$(grep -Fc 'pattern="[0-9\s-]{6,8}"' src/components/dashboard/background-account-security-panel.tsx)" = '2'
          test "$(grep -Fc 'pattern="[0-9\\s-]{6,8}"' src/components/dashboard/background-account-security-panel.tsx)" = '0'
          grep -F 'prefetch={item.href === "/offers" ? false : undefined}' src/app/dashboard/page.tsx

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/dashboard/page.tsx \
            src/components/dashboard/background-account-security-panel.tsx \
            src/dashboard-account-security-visibility.test.ts
          git commit -m "Fix Account security browser diagnostics"
          git push origin "HEAD:$TARGET_BRANCH"
