name: Issue 714 lock-synchronized Auth signup probe

on:
  push:
    branches:
      - ops/issue714-pr698-sync-diagnostic-20260824
    paths:
      - .github/workflows/issue714-auth-signup-probe.yml

permissions:
  contents: read

jobs:
  signup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SUPABASE_URL: https://msuvwouzyempbavtqhva.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_cHY53ziSs2vP6LhFb2w_hw_5Y7XcB7C
    steps:
      - name: Wait for the isolated activation-migration lock signal
        shell: bash
        run: |
          set -euo pipefail
          EVIDENCE_DIR="$RUNNER_TEMP/issue714-lock-synchronized-evidence"
          mkdir -p "$EVIDENCE_DIR"
          response="$RUNNER_TEMP/lock-signal-response.json"
          detected=false
          for attempt in $(seq 1 300); do
            status="$(curl --silent --show-error --max-time 10 \
              --output "$response" \
              --write-out '%{http_code}' \
              --request POST "$SUPABASE_URL/rest/v1/rpc/issue714_migration_lock_ready_v1" \
              --header "apikey: $SUPABASE_PUBLISHABLE_KEY" \
              --header 'Content-Type: application/json' \
              --data '{}')"
            if [[ "$status" = "200" ]] && jq -e '. == true' "$response" >/dev/null; then
              detected=true
              {
                printf 'lock_signal_detected=true\n'
                printf 'poll_attempt=%s\n' "$attempt"
                printf 'detected_at=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)"
                sha256sum "$response" | awk '{print "signal_response_sha256=" $1}'
                printf 'signal_response_bytes=%s\n' "$(wc -c < "$response")"
              } | tee "$EVIDENCE_DIR/signal.txt"
              break
            fi
            sleep 1
          done
          rm -f "$response"
          test "$detected" = true

      - name: Exercise canonical password signup while the profile lock is held
        shell: bash
        run: |
          set -euo pipefail
          EVIDENCE_DIR="$RUNNER_TEMP/issue714-lock-synchronized-evidence"
          body="$RUNNER_TEMP/signup-response.json"
          started_at="$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)"
          start_epoch="$(date +%s%N)"
          status="$(curl --silent --show-error --max-time 180 \
            --output "$body" \
            --write-out '%{http_code}' \
            --request POST "$SUPABASE_URL/auth/v1/signup" \
            --header "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            --header 'Content-Type: application/json' \
            --data '{"email":"issue714-concurrency-locked-20260825@example.invalid","password":"Q4!issue714-Locked-6Vm9sK","data":{"display_name":"Issue 714 Locked Concurrency Synthetic"}}')"
          end_epoch="$(date +%s%N)"
          finished_at="$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)"
          elapsed_ms="$(( (end_epoch - start_epoch) / 1000000 ))"
          {
            sha256sum "$body" | awk '{print "response_sha256=" $1}'
            printf 'http_status=%s\n' "$status"
            printf 'started_at=%s\n' "$started_at"
            printf 'finished_at=%s\n' "$finished_at"
            printf 'elapsed_ms=%s\n' "$elapsed_ms"
            printf 'response_bytes=%s\n' "$(wc -c < "$body")"
          } | tee "$EVIDENCE_DIR/signup.txt"
          rm -f "$body"
          case "$status" in
            200|201) ;;
            *) exit 1 ;;
          esac
          test "$elapsed_ms" -ge 10000

      - name: Upload privacy-safe lock and signup evidence
        uses: actions/upload-artifact@v4
        with:
          name: issue714-lock-synchronized-auth-signup
          path: ${{ runner.temp }}/issue714-lock-synchronized-evidence
          if-no-files-found: error
          retention-days: 7
