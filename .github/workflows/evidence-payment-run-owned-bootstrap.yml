name: Materialize Evidence payment run-owned QA implementation

on:
  push:
    branches:
      - fix/evidence-payment-run-owned-qa-20260816-v2
    paths:
      - ".ci-upload/evidence-sequence.part*"
      - ".github/workflows/evidence-payment-run-owned-bootstrap.yml"

permissions:
  contents: write

concurrency:
  group: evidence-payment-run-owned-bootstrap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    if: github.repository == 'ghuser29384/Website2' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the exact bootstrap commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Reconstruct and validate the bounded implementation archive
        shell: bash
        env:
          EXPECTED_ARCHIVE_SHA256: 29809e60b309c60d5695bfaeff52992a8df749295a4c477155e4cede705f96f9
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REF_NAME" = "fix/evidence-payment-run-owned-qa-20260816-v2"

          for part in 00 01 02 03 04 05 06 07; do
            test -f ".ci-upload/evidence-sequence.part${part}"
          done
          cat .ci-upload/evidence-sequence.part{00..07} > "$RUNNER_TEMP/evidence-sequence.tar.gz.b64"
          base64 --decode "$RUNNER_TEMP/evidence-sequence.tar.gz.b64" > "$RUNNER_TEMP/evidence-sequence.tar.gz"
          printf '%s  %s\n' "$EXPECTED_ARCHIVE_SHA256" "$RUNNER_TEMP/evidence-sequence.tar.gz" \
            | sha256sum --check --strict

          python3 - <<'PY'
          import os
          import pathlib
          import tarfile

          archive = pathlib.Path(os.environ["RUNNER_TEMP"]) / "evidence-sequence.tar.gz"
          repository = pathlib.Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          expected_files = {
              ".github/workflows/evidence-payment-release-qa.yml",
              "scripts/evidence-payment-qa-namespace.mjs",
              "scripts/evidence-payment-qa-namespace.test.mjs",
              "scripts/evidence-payment-qa-run-ownership.test.mjs",
              "supabase/tests/evidence_weighted_payment_browser_preflight.sql",
              "supabase/tests/evidence_weighted_payment_browser_fixture.sql",
              "supabase/tests/evidence_weighted_payment_browser_cleanup.sql",
              "tests/evidence-weighted-payment-authenticated.spec.ts",
          }

          with tarfile.open(archive, "r:gz") as bundle:
              members = bundle.getmembers()
              actual_files = {member.name for member in members if member.isfile()}
              if actual_files != expected_files:
                  raise SystemExit(
                      f"Archive file manifest mismatch: expected={sorted(expected_files)!r} "
                      f"actual={sorted(actual_files)!r}"
                  )
              for member in members:
                  path = pathlib.PurePosixPath(member.name)
                  if path.is_absolute() or ".." in path.parts:
                      raise SystemExit(f"Unsafe archive path: {member.name}")
                  if member.issym() or member.islnk() or member.isdev():
                      raise SystemExit(f"Unsupported archive member type: {member.name}")
                  if member.isfile():
                      source = bundle.extractfile(member)
                      if source is None:
                          raise SystemExit(f"Unable to read archive member: {member.name}")
                      target = (repository / member.name).resolve()
                      if repository not in target.parents:
                          raise SystemExit(f"Archive path escapes repository: {member.name}")
                      target.parent.mkdir(parents=True, exist_ok=True)
                      target.write_bytes(source.read())
                      target.chmod(0o644)
          PY

      - name: Remove bootstrap archive and verify the repository-only scope
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .ci-upload

          node --check scripts/evidence-payment-qa-namespace.mjs
          node --check scripts/evidence-payment-qa-namespace.test.mjs
          node --check scripts/evidence-payment-qa-run-ownership.test.mjs
          node --test \
            scripts/evidence-payment-qa-namespace.test.mjs \
            scripts/evidence-payment-qa-run-ownership.test.mjs

          git add -A
          expected="$(printf '%s\n' \
            .github/workflows/evidence-payment-release-qa.yml \
            .github/workflows/evidence-payment-run-owned-bootstrap.yml \
            scripts/evidence-payment-qa-namespace.mjs \
            scripts/evidence-payment-qa-namespace.test.mjs \
            scripts/evidence-payment-qa-run-ownership.test.mjs \
            supabase/tests/evidence_weighted_payment_browser_cleanup.sql \
            supabase/tests/evidence_weighted_payment_browser_fixture.sql \
            supabase/tests/evidence_weighted_payment_browser_preflight.sql \
            tests/evidence-weighted-payment-authenticated.spec.ts \
            | sort)"
          actual="$(git diff --cached --name-only origin/main | sort)"
          if [[ "$actual" != "$expected" ]]; then
            printf 'Expected staged paths:\n%s\nActual staged paths:\n%s\n' "$expected" "$actual" >&2
            exit 1
          fi
          test ! -e .ci-upload
          test -f .github/workflows/evidence-payment-run-owned-bootstrap.yml
          git diff --cached --check origin/main

      - name: Commit and push the materialized non-workflow implementation
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | awk '{print $1}')"
          test "$remote_head" = "$GITHUB_SHA"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --name-only | grep -q '^\.github/workflows/'; then
            echo "Refusing to let the Actions token modify a workflow file." >&2
            exit 1
          fi
          git commit -m "Wire Evidence-payment QA fixtures to run ownership" \
            -m "Replace fixed cross-run identities and cleanup with a deterministic run/attempt namespace, exact fixture parameters, ownership-aware cleanup, guarded preflight, and source-level overlap contracts. This remains repository-only and does not touch product runtime or production state."
          git push origin "HEAD:$GITHUB_REF_NAME"
