name: Materialize protected Preview acceptance v3b

on:
  push:
    branches:
      - ops/evidence-credibility-shadow-preview-acceptance-20260812
    paths:
      - .github/workflows/materialize-protected-preview-v3b.yml

permissions:
  contents: write

concurrency:
  group: materialize-protected-preview-v3b
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Generate corrected v3 workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path('.github/workflows/evidence-credibility-shadow-protected-preview-acceptance-v2.yml')
          target_path = Path('.github/workflows/evidence-credibility-shadow-protected-preview-acceptance-v3.yml')
          lines = source_path.read_text(encoding='utf-8').splitlines()
          lines[0] = 'name: Evidence credibility protected Preview acceptance v3'
          lines = [line.replace(
              '.github/workflows/evidence-credibility-shadow-protected-preview-acceptance-v2.yml',
              '.github/workflows/evidence-credibility-shadow-protected-preview-acceptance-v3.yml',
          ) for line in lines]

          help_lines = [i for i, line in enumerate(lines) if 'npx vercel@latest curl --help' in line]
          if len(help_lines) != 1:
              raise SystemExit(f'Expected one Vercel curl help line, found {len(help_lines)}.')
          i = help_lines[0]
          if not lines[i].rstrip().endswith('|| true'):
              lines[i] = lines[i].rstrip() + ' || true'

          starts = [i for i, line in enumerate(lines) if line.strip() == 'npx vercel@latest curl "$DEPLOYMENT_URL/login" \\']
          if len(starts) != 1:
              raise SystemExit(f'Expected one Vercel curl request block, found {len(starts)}.')
          start = starts[0]
          end = next((i for i in range(start, min(start + 20, len(lines))) if '2> ../preview-evidence/vercel-curl-stderr.txt' in lines[i]), None)
          if end is None:
              raise SystemExit('Could not locate the end of the Vercel curl block.')
          lines[start:end + 1] = [
              '          npx vercel@latest curl "$DEPLOYMENT_URL/login" \\',
              '            --token="$VERCEL_TOKEN" \\',
              '            -- \\',
              "            --header 'x-vercel-set-bypass-cookie: true' \\",
              '            --dump-header /tmp/vercel-bypass-headers.txt \\',
              '            --output /tmp/vercel-bypass-body.html \\',
              '            2> ../preview-evidence/vercel-curl-stderr.txt',
          ]
          target_path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          git diff --check
          grep -q -- '--dump-header /tmp/vercel-bypass-headers.txt' .github/workflows/evidence-credibility-shadow-protected-preview-acceptance-v3.yml
          grep -q 'curl --help.*|| true' .github/workflows/evidence-credibility-shadow-protected-preview-acceptance-v3.yml

      - name: Commit the generated v3 workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/evidence-credibility-shadow-protected-preview-acceptance-v3.yml
          git commit -m "fix: pass native curl arguments after the Vercel separator"
          git push origin "HEAD:${GITHUB_REF_NAME}"
