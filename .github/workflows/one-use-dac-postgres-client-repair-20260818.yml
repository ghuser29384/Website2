name: One-use DAC PostgreSQL client repair 20260818

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/one-use-dac-postgres-client-repair-20260818.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: one-use-dac-postgres-client-repair-20260818
  cancel-in-progress: false

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Cancel the obsolete stuck exact-head run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OBSOLETE_RUN_ID: "32170467104"
        run: |
          set -euo pipefail
          status="$(curl -fsS \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$OBSOLETE_RUN_ID" \
            | jq -r '.status')"
          if [[ "$status" == "in_progress" || "$status" == "queued" || "$status" == "pending" ]]; then
            curl -fsS -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$OBSOLETE_RUN_ID/cancel" \
              >/dev/null
          fi

      - name: Check out current repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/dac-public-goods-foundation-reconciliation-20260818
          fetch-depth: 0

      - name: Replace apt networking with an exact containerized PostgreSQL 17 client
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          product_path = Path(".github/workflows/mpgf-dac-product-lifecycle-gates.yml")
          product = product_path.read_text()
          old = '''      - name: Install PostgreSQL client
                  run: |
                    sudo apt-get update -qq
                    sudo apt-get install --yes postgresql-client > /dev/null
          '''.replace("                  ", "")
          new = '''      - name: Prepare exact PostgreSQL 17 client
                  shell: bash
                  run: |
                    set -euo pipefail
                    docker pull postgres:17
                    cat > "$RUNNER_TEMP/psql" <<'SH'
                    #!/usr/bin/env bash
                    set -euo pipefail
                    exec docker run --rm -i \\
                      -v "$PWD:/workspace" \\
                      -w /workspace \\
                      postgres:17 psql "$@"
                    SH
                    chmod 0700 "$RUNNER_TEMP/psql"
                    echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          '''.replace("                  ", "")
          if product.count(old) != 1:
              raise SystemExit("Expected exactly one apt-based PostgreSQL client step.")
          product = product.replace(old, new)
          if "apt-get" in product:
              raise SystemExit("An apt-based client install remains in the DAC lifecycle workflow.")
          product_path.write_text(product)

          foundation_path = Path(
              ".github/workflows/mpgf-dac-public-goods-foundation-reconciliation-gates.yml"
          )
          foundation = foundation_path.read_text()
          trigger_anchor = '      - "tests/mpgf-dac-product-lifecycle.spec.ts"\n'
          workflow_trigger = '      - ".github/workflows/mpgf-dac-product-lifecycle-gates.yml"\n'
          if foundation.count(workflow_trigger) == 0:
              if foundation.count(trigger_anchor) != 2:
                  raise SystemExit("Expected two rendered-test trigger anchors.")
              foundation = foundation.replace(
                  trigger_anchor,
                  trigger_anchor + workflow_trigger,
              )
          elif foundation.count(workflow_trigger) != 2:
              raise SystemExit("Unexpected product-workflow trigger count.")

          expected_anchor = "          tests/mpgf-dac-product-lifecycle.spec.ts\n"
          expected_line = "          .github/workflows/mpgf-dac-product-lifecycle-gates.yml\n"
          if expected_line not in foundation:
              if foundation.count(expected_anchor) != 1:
                  raise SystemExit("Expected one rendered-test scope anchor.")
              foundation = foundation.replace(
                  expected_anchor,
                  expected_anchor + expected_line,
              )

          old_hash = (
              '            sha256sum "$MIGRATION_PATH" "$SOURCE_TEST_PATH" '
              'tests/mpgf-dac-product-lifecycle.spec.ts\n'
          )
          new_hash = (
              '            sha256sum "$MIGRATION_PATH" "$SOURCE_TEST_PATH" '
              'tests/mpgf-dac-product-lifecycle.spec.ts '
              '.github/workflows/mpgf-dac-product-lifecycle-gates.yml\n'
          )
          if new_hash not in foundation:
              if foundation.count(old_hash) != 1:
                  raise SystemExit("Expected one exact source-hash anchor.")
              foundation = foundation.replace(old_hash, new_hash)

          foundation_path.write_text(foundation)
          PY

          git diff --check
          git diff -- \
            .github/workflows/mpgf-dac-product-lifecycle-gates.yml \
            .github/workflows/mpgf-dac-public-goods-foundation-reconciliation-gates.yml

      - name: Commit normally and remove this one-use controller
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-use-dac-postgres-client-repair-20260818.yml
          git add \
            .github/workflows/mpgf-dac-product-lifecycle-gates.yml \
            .github/workflows/mpgf-dac-public-goods-foundation-reconciliation-gates.yml
          git commit -m "ci(mpgf): use exact containerized PostgreSQL client"
          git push origin HEAD:fix/dac-public-goods-foundation-reconciliation-20260818
