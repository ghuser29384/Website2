name: Repair Co-Act and Co-Fund direct Shadow DOM listeners v3

on:
  push:
    branches:
      - feature/co-act-co-fund-create-v2-20260801
    paths:
      - ".github/workflows/co-act-co-fund-direct-listener-repair-v2.yml"

permissions:
  contents: write

concurrency:
  group: co-act-co-fund-direct-listener-repair-v3
  cancel-in-progress: false

env:
  TARGET_BRANCH: feature/co-act-co-fund-create-v2-20260801
  EXPECTED_PARENT: 242e54c375818308681688e8b0d29826196b3562
  CONTROLLER_PATH: .github/workflows/co-act-co-fund-direct-listener-repair-v2.yml

jobs:
  repair:
    if: >-
      github.repository == 'ghuser29384/Website2' &&
      github.ref == 'refs/heads/feature/co-act-co-fund-create-v2-20260801'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the exact controller commit
        uses: actions/checkout@v4
        with:
          ref: feature/co-act-co-fund-create-v2-20260801
          fetch-depth: 0
          persist-credentials: true

      - name: Verify the exact one-file trigger
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')" = "$GITHUB_SHA"
          test "$(git diff --name-only "$EXPECTED_PARENT" "$GITHUB_SHA")" = "$CONTROLLER_PATH"

      - name: Move interaction ownership into the component listeners
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          client_path = Path('src/lib/create-interface/group-contribution-client.ts')
          client = client_path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str, label: str) -> None:
              global client
              count = client.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one {label}; found {count}')
              client = client.replace(old, new, 1)

          replace_once(
              'const mounted = new Map<string, MountedOption>();\n'
              'let observer: MutationObserver | null = null;',
              'const mounted = new Map<string, MountedOption>();\n'
              'const pendingRenders = new WeakMap<MountedOption, number>();\n'
              'let observer: MutationObserver | null = null;',
              'mounted-state declaration',
          )

          old_mode = (
              '    button.addEventListener("click", () => {\n'
              '      const mode = button.dataset.mode as GroupDraftMode;\n'
              '      entry.state.mode = mode;\n'
              '      entry.state.primaryText =\n'
              '        readPrimaryText(entry.card, entry.underlying) || entry.state.primaryText;\n'
              '      renderMountedOption(entry);\n'
              '      writeProposalPayload();\n'
              '    });'
          )
          new_mode = (
              '    button.addEventListener("click", () => {\n'
              '      const mode = button.dataset.mode as GroupDraftMode;\n'
              '      entry.state.mode = mode;\n'
              '      entry.state.primaryText =\n'
              '        readPrimaryText(entry.card, entry.underlying) || entry.state.primaryText;\n'
              '      entry.state = normalizeDraft(entry.state);\n'
              '      writeProposalPayload();\n'
              '      scheduleMountedOptionRender(entry);\n'
              '    });'
          )
          replace_once(old_mode, new_mode, 'mode-button listener')

          replace_once(
              '        if (rerender) renderMountedOption(entry);\n'
              '        else updateValidationStatus(entry);',
              '        if (rerender) scheduleMountedOptionRender(entry);\n'
              '        else updateValidationStatus(entry);',
              'field rerender path',
          )

          anchor = (
              'function updateStateFromControl(\n'
              '  state: GroupContributionDraftState,'
          )
          helper = (
              'function scheduleMountedOptionRender(entry: MountedOption): void {\n'
              '  const targetWindow = entry.host.ownerDocument.defaultView;\n'
              '  if (!targetWindow) return;\n\n'
              '  const pending = pendingRenders.get(entry);\n'
              '  if (pending !== undefined) targetWindow.clearTimeout(pending);\n\n'
              '  const timer = targetWindow.setTimeout(() => {\n'
              '    pendingRenders.delete(entry);\n'
              '    if (mounted.get(entry.key) !== entry || !entry.host.isConnected) return;\n'
              '    renderMountedOption(entry);\n'
              '  }, 0);\n'
              '  pendingRenders.set(entry, timer);\n'
              '}\n\n'
              'function updateStateFromControl(\n'
              '  state: GroupContributionDraftState,'
          )
          replace_once(anchor, helper, 'state-control insertion point')
          client_path.write_text(client, encoding='utf-8')

          Path('src/instrumentation-client.ts').write_text(
              'import { startGroupContributionEnhancement } from "./lib/create-interface/group-contribution-client";\n\n'
              'startGroupContributionEnhancement();\n',
              encoding='utf-8',
          )

          test_lines = [
              'import assert from "node:assert/strict";',
              'import { existsSync, readFileSync } from "node:fs";',
              'import test from "node:test";',
              '',
              'const instrumentation = readFileSync("src/instrumentation-client.ts", "utf8");',
              'const client = readFileSync(',
              '  "src/lib/create-interface/group-contribution-client.ts",',
              '  "utf8",',
              ');',
              '',
              'test("group controls use one authoritative event path and defer only rendering", () => {',
              '  assert.equal(',
              '    existsSync("src/lib/create-interface/group-contribution-interaction-stability.ts"),',
              '    false,',
              '  );',
              '  assert.doesNotMatch(instrumentation, /InteractionStability|interaction-stability/);',
              '  assert.match(client, /const pendingRenders = new WeakMap<MountedOption, number>\\(\\);/);',
              '',
              '  const modeListener = client.indexOf(\'button.addEventListener("click"\');',
              '  const normalized = client.indexOf(',
              '    "entry.state = normalizeDraft(entry.state);",',
              '    modeListener,',
              '  );',
              '  const persisted = client.indexOf("writeProposalPayload();", normalized);',
              '  const scheduled = client.indexOf("scheduleMountedOptionRender(entry);", persisted);',
              '',
              '  assert.ok(modeListener >= 0);',
              '  assert.ok(normalized > modeListener);',
              '  assert.ok(persisted > normalized);',
              '  assert.ok(scheduled > persisted);',
              '  assert.match(client, /if \\(rerender\\) scheduleMountedOptionRender\\(entry\\);/);',
              '  assert.match(',
              '    client,',
              '    /function scheduleMountedOptionRender[\\s\\S]*targetWindow\\.setTimeout[\\s\\S]*renderMountedOption\\(entry\\);[\\s\\S]*\\}, 0\\);/,',
              '  );',
              '});',
          ]
          Path('src/lib/create-interface/group-contribution-interaction.test.ts').write_text(
              '\n'.join(test_lines) + '\n',
              encoding='utf-8',
          )
          PY

          rm -f \
            src/lib/create-interface/group-contribution-interaction-stability.ts \
            src/lib/create-interface/group-contribution-interaction-stability.test.ts
          git rm "$CONTROLLER_PATH"
          git diff --check

      - name: Run focused contracts, ESLint, and TypeScript
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          node --import tsx --test \
            src/lib/create-interface/group-contribution*.test.ts \
            src/lib/create-interface/persistence.test.ts \
            src/lib/create-interface/source-contract.test.ts \
            src/lib/create-interface/validation.test.ts
          npx eslint \
            src/instrumentation-client.ts \
            src/lib/create-interface/group-contribution-client.ts \
            src/lib/create-interface/group-contribution-interaction.test.ts
          npx tsc --noEmit

      - name: Commit and publish the bounded repair
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          cat > /tmp/expected-paths.txt <<'EOF'
          .github/workflows/co-act-co-fund-direct-listener-repair-v2.yml
          src/instrumentation-client.ts
          src/lib/create-interface/group-contribution-client.ts
          src/lib/create-interface/group-contribution-interaction-stability.test.ts
          src/lib/create-interface/group-contribution-interaction-stability.ts
          src/lib/create-interface/group-contribution-interaction.test.ts
          EOF
          sed -i 's/^          //' /tmp/expected-paths.txt
          sort -u /tmp/expected-paths.txt -o /tmp/expected-paths.txt
          git diff --cached --name-only | sort -u > /tmp/actual-paths.txt
          diff -u /tmp/expected-paths.txt /tmp/actual-paths.txt
          git diff --cached --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Use direct Co-Act and Co-Fund Shadow DOM listeners'
          test "$(git rev-parse HEAD^)" = "$GITHUB_SHA"
          test ! -e "$CONTROLLER_PATH"
          test ! -e src/lib/create-interface/group-contribution-interaction-stability.ts
          test ! -e src/lib/create-interface/group-contribution-interaction-stability.test.ts
          git push --force-with-lease="refs/heads/$TARGET_BRANCH:$GITHUB_SHA" \
            origin "HEAD:refs/heads/$TARGET_BRANCH"
