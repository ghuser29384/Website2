name: PR868 gated release failure evidence
on:
  push:
    branches: [ops/pr868-preview-reconcile-20261001]
    paths: [.github/workflows/pr868-release-failure-evidence-20261001.yml]
permissions:
  contents: read
  actions: read
jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 29eae507ce13cfcff22bb665b9fd19e7cdc42189
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Read failed browser gate log and verify referenced test paths
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/pr868-failure
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const response=await fetch('https://api.github.com/repos/ghuser29384/Website2/actions/jobs/110529602905/logs',{headers:{Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github+json'},signal:AbortSignal.timeout(30000)});
          if(!response.ok)throw new Error(`Log download HTTP ${response.status}`);
          const text=(await response.text()).replace(/\x1b\[[0-9;]*m/g,'');
          const lines=text.split('\n');
          const selected=new Set();
          for(let i=0;i<lines.length;i++) if(/\d+\) tests\/|Error:|TimeoutError|\d+ failed|\d+ passed|\d+ skipped/.test(lines[i])) for(let j=Math.max(0,i-2);j<Math.min(lines.length,i+45);j++)selected.add(j);
          const excerpt=[...selected].sort((a,b)=>a-b).map(i=>lines[i]).join('\n');
          fs.writeFileSync('/tmp/pr868-failure/excerpt.txt',excerpt);
          const paths=[...new Set([...excerpt.matchAll(/(?:^|\s)(tests\/[A-Za-z0-9_/.-]+\.spec\.ts):/g)].map(m=>m[1]))];
          const result={run:36909879885,job:110529602905,sha:'29eae507ce13cfcff22bb665b9fd19e7cdc42189',paths:paths.map(path=>({path,exists:fs.existsSync(path)}))};
          fs.writeFileSync('/tmp/pr868-failure/identity.json',JSON.stringify(result,null,2));
          console.log(JSON.stringify(result,null,2));console.log(excerpt.slice(-16000));
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: pr868-release-failure-${{ github.run_id }}
          path: /tmp/pr868-failure
          retention-days: 14
