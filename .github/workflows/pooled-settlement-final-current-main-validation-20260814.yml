name: Pooled settlement final current-main validation 20260814

on:
  push:
    branches:
      - qa/pooled-settlement-final-current-main-20260814
    paths:
      - .github/workflows/pooled-settlement-final-current-main-validation-20260814.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pooled-settlement-final-current-main-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      EXPECTED_MAIN_SHA: 85279bb2332f83dec7389d54ca3261a5dbd075cd
      EXPECTED_CANDIDATE_SHA: 597bcb39f2033ee80e4892754530a57b6c7ca587
      WORKFLOW_PATH: .github/workflows/pooled-settlement-final-current-main-validation-20260814.yml
      NEXT_TELEMETRY_DISABLED: "1"
      TRADE_DONATION_POOL_ENABLED: "false"
      TRADE_DONATION_POOL_MODE: disabled
      CONDITIONAL_PAYMENTS_MODE: disabled
    steps:
      - name: Check out exact validation revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify exact candidate, main ancestry, and workflow-only delta
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$EXPECTED_MAIN_SHA" "$EXPECTED_CANDIDATE_SHA"
          git merge-base --is-ancestor "$EXPECTED_CANDIDATE_SHA" HEAD
          test "$(git diff --name-only "$EXPECTED_CANDIDATE_SHA" HEAD)" = "$WORKFLOW_PATH"
          git diff --check "$EXPECTED_MAIN_SHA" "$EXPECTED_CANDIDATE_SHA"

      - name: Verify exact 21-file pooled-settlement product diff
        shell: bash
        run: |
          set -euo pipefail
          cat > expected-files.txt <<'EOF'
          .env.example
          docs/trade-donation-pooled-settlement-runbook.md
          src/app/admin/page.tsx
          src/app/admin/trade-donation-pools/page.tsx
          src/app/api/connectors/every-org/[secret]/route.ts
          src/app/api/stripe/webhook/route.ts
          src/app/trade-donation-actions-base.ts
          src/app/trade-donation-pool-actions.ts
          src/components/core-trade/trade-agreement-stage.tsx
          src/components/core-trade/trade-donation-agreement-stage.tsx
          src/components/core-trade/trade-donation-pool-agreement-stage.tsx
          src/lib/payments/trade-donation-pool-webhook.ts
          src/lib/trade-donation-pool-environment-source-contract.test.ts
          src/lib/trade-donation-pool-provider-resume-source-contract.test.ts
          src/lib/trade-donation-pool-source-contract.test.ts
          src/lib/trade-donation-pool-stripe-environment-source-contract.test.ts
          src/lib/trade-donation-pool.test.ts
          src/lib/trade-donation-pool.ts
          supabase/migrations/20260725152000_cross_user_pooled_trade_donations.sql
          supabase/migrations/20260814030000_harden_trade_donation_pool_stripe_failure_environment.sql
          supabase/migrations/20260814033000_resume_trade_donation_pool_bundle_checkout.sql
          EOF
          sed -i 's/^          //' expected-files.txt
          git diff --name-only "$EXPECTED_MAIN_SHA" "$EXPECTED_CANDIDATE_SHA" > actual-files.txt
          diff -u expected-files.txt actual-files.txt
          test "$(wc -l < actual-files.txt)" -eq 21
          ! grep -q '^\.github/workflows/' actual-files.txt

      - name: Verify production defaults remain fail-closed
        shell: bash
        run: |
          set -euo pipefail
          grep -Fx 'TRADE_DONATION_POOL_ENABLED=false' .env.example
          grep -Fx 'TRADE_DONATION_POOL_MODE=disabled # disabled | test | live' .env.example
          ! grep -Eq '^TRADE_DONATION_POOL_ENABLED=true$' .env.example
          test -f supabase/migrations/20260814024354_harden_trade_donation_pool_component_trigger_rpc.sql
          test ! -e supabase/migrations/20260814023000_harden_trade_donation_pool_component_trigger_rpc.sql

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run all pooled-settlement security and source-contract tests
        run: >-
          node --import tsx --test
          src/lib/trade-donation-pool.test.ts
          src/lib/trade-donation-pool-source-contract.test.ts
          src/lib/trade-donation-pool-environment-source-contract.test.ts
          src/lib/trade-donation-pool-stripe-environment-source-contract.test.ts
          src/lib/trade-donation-pool-provider-resume-source-contract.test.ts
          src/lib/moral-trade/pooled-settlement-trigger-privilege-migration.test.ts

      - name: Run conditional-payment regression tests
        run: >-
          node --import tsx --test
          src/lib/payments/conditional-state.test.ts
          src/lib/payments/checkout-payment-methods.test.ts

      - name: Run complete repository tests
        run: npm test

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint -- --quiet

      - name: Build production application with pooled settlement disabled
        env:
          NEXT_PUBLIC_SITE_URL: https://www.moraltrade.org
          VERCEL: "1"
          VERCEL_ENV: production
        run: npm run build
