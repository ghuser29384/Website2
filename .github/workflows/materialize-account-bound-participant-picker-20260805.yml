name: Materialize account-bound participant picker

on:
  push:
    branches:
      - feature/account-bound-participant-picker-20260805
    paths:
      - .github/workflows/materialize-account-bound-participant-picker-20260805.yml

permissions:
  contents: write

concurrency:
  group: materialize-account-bound-participant-picker-20260805
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4
        with:
          ref: feature/account-bound-participant-picker-20260805
          fetch-depth: 0
          persist-credentials: true

      - name: Verify one-use inputs and reconstruct patch
        shell: bash
        run: |
          set -euo pipefail

          branch="$(git branch --show-current)"
          echo "branch=$branch"
          test "$branch" = "feature/account-bound-participant-picker-20260805"

          declare -A expected=(
            [00]=323e663d64d4b7121b1edaa009e9bd6f32f08c17
            [01]=96ebb48b0f6804c013358f1a8c925406b77c750a
            [02]=9019cf9c48b25cca2ad9d643d31e86184502f525
            [03]=988f821e9675715b2441ea6e99a1517a6b4c53e4
            [04]=daa3d20da2400faf399bdf5b9e09eb2d997396bb
            [05]=73b46337b4637dee7a161464098980c7c2ac92c0
          )

          for suffix in 00 01 02 03 04 05; do
            file=".github/account-bound-participant-picker.patch.xz.b64.${suffix}"
            test -f "$file"
            actual="$(git hash-object "$file")"
            echo "$file actual=$actual expected=${expected[$suffix]}"
            test "$actual" = "${expected[$suffix]}"
          done

          cat .github/account-bound-participant-picker.patch.xz.b64.0* \
            | base64 --decode > /tmp/account-bound-participant-picker.patch.xz
          echo "compressed_bytes=$(wc -c < /tmp/account-bound-participant-picker.patch.xz)"
          xz --test /tmp/account-bound-participant-picker.patch.xz
          xz --decompress --stdout /tmp/account-bound-participant-picker.patch.xz \
            > /tmp/account-bound-participant-picker.patch
          echo "patch_bytes=$(wc -c < /tmp/account-bound-participant-picker.patch)"

          awk '/^diff --git a\// {path=$3; sub(/^a\//, "", path); print path}' \
            /tmp/account-bound-participant-picker.patch \
            | sort -u > /tmp/account-bound-participant-picker.paths

          path_count="$(wc -l < /tmp/account-bound-participant-picker.paths)"
          echo "durable_patch_path_count=$path_count"
          cat /tmp/account-bound-participant-picker.paths
          test "$path_count" -eq 37

          while IFS= read -r path; do
            case "$path" in
              .github/workflows/*|docs/*|public/*|src/*|supabase/*|tests/*) ;;
              *)
                echo "Unexpected path in durable patch: $path" >&2
                exit 1
                ;;
            esac
          done < /tmp/account-bound-participant-picker.paths

          if grep -Eq '^diff --git a/\.github/(account-bound-participant-picker\.patch|workflows/(export|materialize)-account-bound-participant-picker)' \
            /tmp/account-bound-participant-picker.patch; then
            echo "Durable patch contains temporary materialization machinery" >&2
            exit 1
          fi

          git apply --check /tmp/account-bound-participant-picker.patch
          git apply --index /tmp/account-bound-participant-picker.patch
          echo "patch_applied=true"

      - name: Remove all temporary materialization files
        shell: bash
        run: |
          set -euo pipefail
          git rm \
            .github/account-bound-participant-picker.patch.xz.b64.00 \
            .github/account-bound-participant-picker.patch.xz.b64.01 \
            .github/account-bound-participant-picker.patch.xz.b64.02 \
            .github/account-bound-participant-picker.patch.xz.b64.03 \
            .github/account-bound-participant-picker.patch.xz.b64.04 \
            .github/account-bound-participant-picker.patch.xz.b64.05 \
            .github/workflows/export-account-bound-participant-picker-source-20260805.yml \
            .github/workflows/materialize-account-bound-participant-picker-20260805.yml

      - name: Validate exact staged candidate
        shell: bash
        run: |
          set -euo pipefail
          git diff --cached --check

          git diff --cached --name-only | sort -u > /tmp/staged-paths
          staged_count="$(wc -l < /tmp/staged-paths)"
          echo "staged_path_count=$staged_count"
          cat /tmp/staged-paths
          test "$staged_count" -eq 45

          durable_count="$(comm -23 \
            <(sort /tmp/staged-paths) \
            <(printf '%s\n' \
              .github/account-bound-participant-picker.patch.xz.b64.00 \
              .github/account-bound-participant-picker.patch.xz.b64.01 \
              .github/account-bound-participant-picker.patch.xz.b64.02 \
              .github/account-bound-participant-picker.patch.xz.b64.03 \
              .github/account-bound-participant-picker.patch.xz.b64.04 \
              .github/account-bound-participant-picker.patch.xz.b64.05 \
              .github/workflows/export-account-bound-participant-picker-source-20260805.yml \
              .github/workflows/materialize-account-bound-participant-picker-20260805.yml | sort) \
            | wc -l)"
          echo "durable_staged_count=$durable_count"
          test "$durable_count" -eq 37

          git status --short

      - name: Commit durable candidate and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Materialize account-bound participant picker"
          git push origin HEAD:feature/account-bound-participant-picker-20260805
