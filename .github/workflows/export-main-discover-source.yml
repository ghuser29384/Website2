name: Temporary export — current main Discover source

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out PR merge ref
        uses: actions/checkout@v4

      - name: Verify and package current main Discover surface
        shell: bash
        run: |
          set -euo pipefail
          expected="0a26b17d75c9590f92c73663ea19fe1b0e8aa6c4"
          git merge-base --is-ancestor "$expected" HEAD
          paths=(
            .github/workflows/smart-query-qa.yml
            package.json
            public/discover/payload/0.txt
            public/discover/payload/1.txt
            public/discover/payload/2.txt
            public/discover/payload/3.txt
            public/discover/payload/4.txt
            public/discover/payload/5.txt
            public/discover/payload/6.txt
            scripts/discover-two-sided-contract.test.mjs
            scripts/pack-discover-payload.mjs
            src/discover/moral-trade-discover.source.html
            tests/discover-query-audit.spec.ts
          )
          git diff --quiet "$expected" HEAD -- "${paths[@]}"
          mkdir -p export
          for path in "${paths[@]}"; do
            test -f "$path"
            mkdir -p "export/$(dirname "$path")"
            cp "$path" "export/$path"
          done
          printf '%s\n' "$expected" > export/EXPORTED_SOURCE_SHA
          tar -czf current-main-discover-source.tgz -C export .

      - name: Upload exact source surface
        uses: actions/upload-artifact@v4
        with:
          name: current-main-discover-source
          path: current-main-discover-source.tgz
          if-no-files-found: error
          retention-days: 1
