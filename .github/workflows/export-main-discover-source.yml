name: Temporary export — current main Discover integration files

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out PR merge ref
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify and package current main Discover integration files
        shell: bash
        run: |
          set -euo pipefail
          expected="85660ffc07f6125bd28028a89480c85927d03ae8"
          git merge-base --is-ancestor "$expected" HEAD
          paths=(
            .github/workflows/smart-query-qa.yml
            public/discover/payload/manifest.json
            public/moral-trade-discover.html
            scripts/discover-two-sided-contract.test.mjs
            scripts/pack-discover-payload.mjs
            tests/discover-payload-cache.spec.ts
          )
          git diff --quiet "$expected" HEAD -- "${paths[@]}"
          mkdir -p export
          for path in "${paths[@]}"; do
            test -f "$path"
            mkdir -p "export/$(dirname "$path")"
            cp "$path" "export/$path"
          done
          printf '%s\n' "$expected" > export/EXPORTED_SOURCE_SHA
          tar -czf current-main-discover-integration-files.tgz -C export .

      - name: Upload exact source surface
        uses: actions/upload-artifact@v4
        with:
          name: current-main-discover-integration-files
          path: current-main-discover-integration-files.tgz
          if-no-files-found: error
          retention-days: 1
