name: Synchronize launch verification branch one-shot

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/sync-launch-branch-one-shot.yml

permissions:
  contents: write

concurrency:
  group: sync-launch-with-main
  cancel-in-progress: false

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out launch branch with full history
        uses: actions/checkout@v4
        with:
          ref: launch/verify-and-harden-20260723
          fetch-depth: 0

      - name: Merge current main and preserve current launch behavior
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main launch/verify-and-harden-20260723

          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e

          conflicts="$(git diff --name-only --diff-filter=U || true)"
          if [[ -n "$conflicts" ]]; then
            unexpected="$(printf '%s\n' "$conflicts" | grep -Ev '^(scripts/vercel-ignore-build\.mjs|src/lib/vercel-build-ownership\.test\.ts|vercel\.json|src/app/trades/new/page\.tsx)$' || true)"
            if [[ -n "$unexpected" ]]; then
              echo "Unexpected merge conflicts:" >&2
              printf '%s\n' "$unexpected" >&2
              exit 1
            fi

            for path in scripts/vercel-ignore-build.mjs src/lib/vercel-build-ownership.test.ts vercel.json; do
              if printf '%s\n' "$conflicts" | grep -Fxq "$path"; then
                git checkout --ours -- "$path"
                git add "$path"
              fi
            done
          elif [[ $merge_status -ne 0 ]]; then
            echo "Merge failed without a reported file conflict." >&2
            exit 1
          fi

          cat > src/app/trades/new/page.tsx <<'EOF'
          import { randomUUID } from "node:crypto";
          import type { Metadata } from "next";

          import { saveCoreOfferAction } from "@/app/core-trade-actions";
          import {
            HardenedTradeDraftWorkbench,
            type TradeDraftValues,
          } from "@/components/core-trade/trade-draft-workbench-hardened";
          import { TradeDraftSignInGate } from "@/components/core-trade/trade-draft-workbench";
          import { getViewer } from "@/lib/app-data";
          import { getFormMessage } from "@/lib/form-state";
          import {
            getPledgeTemplateInitialValues,
            getTradeDraftTemplateLabel,
          } from "@/lib/trade-template-library";

          export const dynamic = "force-dynamic";
          export const revalidate = 0;

          export const metadata: Metadata = {
            title: "Create a trade",
            description:
              "Build one bounded Moral Trade proposal through progressive terms, then save privately or submit it once for review.",
            robots: { index: false, follow: false },
          };

          interface NewTradePageProps {
            searchParams: Promise<Record<string, string | string[] | undefined>>;
          }

          function valueOf(value: string | string[] | undefined) {
            return Array.isArray(value) ? value[0] ?? "" : value ?? "";
          }

          const VICTORIA_EXAMPLE: Partial<TradeDraftValues> = {
            offeredCause: "Global poverty reduction",
            requestedCause: "Animal welfare",
            proposedAction:
              "Donate 1% of income to an agreed global-poverty charity for the stated term.",
            requestedAction: "Follow a vegetarian diet for the stated term.",
            noTradeBaseline:
              "Without an agreement, I keep my current giving and the counterparty keeps their current diet.",
            duration: "12 months",
            evidenceRule:
              "Donation receipt for the giving commitment and participant attestation for the diet commitment.",
            maximumBurden: "The stated 1% donation and the stated 12-month dietary commitment only.",
            privacyScope:
              "Agreement evidence is private to the two participants and the operator. Publishing any evidence requires a separate, explicit redaction and publication step.",
            exitConditions:
              "Either participant may end future obligations by notifying the other; completed periods remain recorded.",
          };

          const WORKBENCH_GRID = `
            #main-content > form {
              min-height: 0;
            }
          `;

          export default async function NewTradePage({ searchParams }: NewTradePageProps) {
            const [viewer, resolvedSearchParams] = await Promise.all([getViewer(), searchParams]);
            const templateId = valueOf(resolvedSearchParams.template);
            const structure = valueOf(resolvedSearchParams.structure);
            const acceptsCommandHandoff =
              valueOf(resolvedSearchParams.handoff) === "command-center";
            const returnParams = new URLSearchParams();
            if (templateId) returnParams.set("template", templateId);
            if (structure) returnParams.set("structure", structure);
            if (acceptsCommandHandoff) returnParams.set("handoff", "command-center");
            const returnTo = `/trades/new${returnParams.size ? `?${returnParams.toString()}` : ""}`;

            if (!viewer) {
              return <TradeDraftSignInGate returnTo={returnTo} />;
            }

            const example = valueOf(resolvedSearchParams.example);
            const templateValues = getPledgeTemplateInitialValues(templateId);
            const templateLabel = templateValues ? getTradeDraftTemplateLabel(templateId) : null;

            return (
              <>
                <style>{WORKBENCH_GRID}</style>
                <HardenedTradeDraftWorkbench
                  acceptCommandHandoff={acceptsCommandHandoff}
                  formMessage={getFormMessage(resolvedSearchParams)}
                  initialValues={templateValues ?? (example === "seed-victoria" ? VICTORIA_EXAMPLE : undefined)}
                  saveAction={saveCoreOfferAction}
                  submissionKey={randomUUID()}
                  templateLabel={templateLabel}
                />
              </>
            );
          }
          EOF
          sed -i 's/^          //' src/app/trades/new/page.tsx
          git add src/app/trades/new/page.tsx

          if ! grep -q 'acceptCommandHandoff' src/components/core-trade/trade-draft-workbench-hardened.tsx; then
            cat > /tmp/hardened-handoff.patch <<'EOF'
          diff --git a/src/components/core-trade/trade-draft-workbench-hardened.tsx b/src/components/core-trade/trade-draft-workbench-hardened.tsx
          index 49767ee..0000000 100644
          --- a/src/components/core-trade/trade-draft-workbench-hardened.tsx
          +++ b/src/components/core-trade/trade-draft-workbench-hardened.tsx
          @@ -1,10 +1,12 @@
           "use client";
           
           import Link from "next/link";
          +import { useEffect, useRef, useState } from "react";
           
           import { MoralTradeWordmark } from "@/components/brand/moral-trade-wordmark";
          +import { consumeCommandCenterHandoff } from "@/lib/command-center-handoff";
           
           export interface TradeDraftValues {
          @@ -23,12 +25,29 @@ export interface TradeDraftValues {
           }
           
           interface HardenedTradeDraftWorkbenchProps {
          +  acceptCommandHandoff?: boolean;
             formMessage?: { text: string; tone: "error" | "success" } | null;
             initialValues?: Partial<TradeDraftValues>;
             saveAction: (formData: FormData) => void | Promise<void>;
             submissionKey: string;
             templateLabel?: string | null;
           }
          +
          +type CommandHandoffState = "loading" | "loaded" | "unavailable" | null;
          +
          +const HANDOFF_FIELD_NAMES: Partial<Record<keyof TradeDraftValues, string>> = {
          +  duration: "duration",
          +  evidenceDueDate: "evidence_due_date",
          +  evidenceRule: "evidence_rule",
          +  exitConditions: "exit_conditions",
          +  noTradeBaseline: "no_trade_baseline",
          +  notes: "notes",
          +  offeredCause: "offered_cause",
          +  proposedAction: "proposed_action",
          +  requestedAction: "requested_action",
          +  requestedCause: "requested_cause",
          +  startDate: "start_date",
          +};
           
           const DEFAULT_PRIVACY_SCOPE =
             "Agreement evidence is private to the two participants and the operator. Publishing any evidence requires a separate, explicit redaction and publication step.";
          @@ -41,12 +60,54 @@ function value(initialValues: Partial<TradeDraftValues> | undefined, key: keyof TradeDraftValues) {
           }
           
           export function HardenedTradeDraftWorkbench({
          +  acceptCommandHandoff = false,
             formMessage,
             initialValues,
             saveAction,
             submissionKey,
             templateLabel,
           }: HardenedTradeDraftWorkbenchProps) {
          +  const formRef = useRef<HTMLFormElement>(null);
          +  const commandHandoff = useRef<
          +    ReturnType<typeof consumeCommandCenterHandoff> | undefined
          +  >(undefined);
          +  const [commandHandoffState, setCommandHandoffState] =
          +    useState<CommandHandoffState>(acceptCommandHandoff ? "loading" : null);
          +
          +  useEffect(() => {
          +    if (!acceptCommandHandoff) return;
          +
          +    if (commandHandoff.current === undefined) {
          +      try {
          +        commandHandoff.current = consumeCommandCenterHandoff(window.sessionStorage);
          +      } catch {
          +        commandHandoff.current = null;
          +      }
          +    }
          +
          +    const restoredHandoff = commandHandoff.current;
          +    const form = formRef.current;
          +    if (!restoredHandoff || !form) {
          +      setCommandHandoffState("unavailable");
          +      return;
          +    }
          +
          +    for (const [key, handoffValue] of Object.entries(restoredHandoff.values) as Array<
          +      [keyof TradeDraftValues, string]
          +    >) {
          +      const fieldName = HANDOFF_FIELD_NAMES[key];
          +      if (!fieldName) continue;
          +      const field = form.elements.namedItem(fieldName);
          +      if (field instanceof HTMLInputElement || field instanceof HTMLTextAreaElement) {
          +        field.value = handoffValue;
          +        field.dispatchEvent(new Event("input", { bubbles: true }));
          +      }
          +    }
          +
          +    setCommandHandoffState("loaded");
          +  }, [acceptCommandHandoff]);
          +
             return (
               <main className="page-shell marketplace-app-shell" id="main-content" tabIndex={-1}>
          @@ -83,14 +144,29 @@ export function HardenedTradeDraftWorkbench({
                 <strong>{formMessage.tone === "error" ? "Could not save" : "Saved"}</strong>
                 <p>{formMessage.text}</p>
               </div>
          +    ) : commandHandoffState === "loading" ? (
          +      <div className="status-banner" role="status">
          +        <strong>Loading command</strong>
          +        <p>Restoring the one-time command into the editable terms.</p>
          +      </div>
          +    ) : commandHandoffState === "loaded" ? (
          +      <div className="status-banner" role="status">
          +        <strong>Command loaded</strong>
          +        <p>Review every term, add any missing bounds, and save only when the proposal is accurate.</p>
          +      </div>
          +    ) : commandHandoffState === "unavailable" ? (
          +      <div className="status-banner status-banner-error" role="alert">
          +        <strong>Command unavailable</strong>
          +        <p>Enter the terms below. No draft was created.</p>
          +      </div>
               ) : templateLabel ? (
                 <div className="status-banner" role="status">
                   <strong>{templateLabel}</strong>
                   <p>Template text is only a starting point. Replace every term with one that is true.</p>
                 </div>
               ) : null}
           
          -    <form action={saveAction} className="panel stack-form">
          +    <form action={saveAction} className="panel stack-form" ref={formRef}>
                 <input name="submission_key" type="hidden" value={submissionKey} />
          EOF
            sed -i 's/^          //' /tmp/hardened-handoff.patch
            git apply /tmp/hardened-handoff.patch
            git add src/components/core-trade/trade-draft-workbench-hardened.tsx
          fi

          if [[ -f .github/workflows/sync-launch-with-main.yml ]]; then
            git rm .github/workflows/sync-launch-with-main.yml
          fi

          unresolved="$(git diff --name-only --diff-filter=U || true)"
          if [[ -n "$unresolved" ]]; then
            echo "Unresolved conflicts remain:" >&2
            printf '%s\n' "$unresolved" >&2
            exit 1
          fi

          git add -A
          git commit -m "Merge current main into launch verification branch"
          git push origin HEAD:launch/verify-and-harden-20260723
