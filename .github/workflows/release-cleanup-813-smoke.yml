name: Verify cleanup 813 on canonical site
on:
  push:
    branches: [ops/release-cleanup-813-20260919]
    paths: [.github/workflows/release-cleanup-813-smoke.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: cleanup-813-post-release-readonly
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      EXPECTED_SHA: 53ca525c314ad01892e45842bfea6c5c4269fcfd
      EXPECTED_RELEASE_RUN: '35422163689'
      NEXT_TELEMETRY_DISABLED: '1'
      CI: 'true'
    steps:
      - name: Wait for the exact existing production release, without redeploying
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = ghuser29384/Website2
          test "$GITHUB_REF" = refs/heads/ops/release-cleanup-813-20260919
          mkdir -p "$RUNNER_TEMP/cleanup-813-smoke"
          finished=false
          for attempt in $(seq 1 160); do
            result="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$EXPECTED_RELEASE_RUN")"
            jq -e --arg sha "$EXPECTED_SHA" '.head_sha == $sha and .head_branch == "main" and .path == ".github/workflows/vercel-release.yml" and .event == "workflow_dispatch"' <<< "$result" >/dev/null
            if test "$(jq -r .status <<< "$result")" = completed; then
              test "$(jq -r .conclusion <<< "$result")" = success
              jq '{id,head_sha,head_branch,path,status,conclusion,updated_at,html_url}' <<< "$result" > "$RUNNER_TEMP/cleanup-813-smoke/release.json"
              finished=true
              break
            fi
            sleep 15
          done
          test "$finished" = true
      - uses: actions/checkout@v4
        with:
          ref: 53ca525c314ad01892e45842bfea6c5c4269fcfd
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Read canonical HTTP routes and compare feed bytes to released source
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          import urllib.request, urllib.error, hashlib, json, os
          class NoRedirect(urllib.request.HTTPRedirectHandler):
            def redirect_request(self, req, fp, code, msg, headers, newurl):
              return None
          opener = urllib.request.build_opener(NoRedirect())
          out = Path(os.environ['RUNNER_TEMP'])/'cleanup-813-smoke'
          expected = Path('public/moral-trade-live.html').read_bytes()
          results = []
          for path in ['/feed','/walkthrough']:
            url = 'https://www.moraltrade.org'+path+'?release_check='+os.environ['EXPECTED_SHA']
            request = urllib.request.Request(url, headers={'Cache-Control':'no-cache'})
            with urllib.request.urlopen(request,timeout=45) as response:
              data = response.read()
              assert response.status == 200, (path,response.status)
              assert len(data) > 200
              if path == '/feed': assert data == expected, 'Canonical feed differs from the exact released source'
              results.append({'path':path,'status':response.status,'sha256':hashlib.sha256(data).hexdigest()})
          for host in ['moraltrade.org','www.moraltrade.org']:
            try:
              response = opener.open(urllib.request.Request('https://'+host+'/',headers={'User-Agent':'Mozilla/5.0','Cache-Control':'no-cache'}),timeout=45)
            except urllib.error.HTTPError as error:
              response = error
            expected_status = 308 if host == 'moraltrade.org' else 307
            assert response.code == expected_status, (host,response.code)
            location = response.headers.get('Location','')
            assert ('www.moraltrade.org' in location) if host == 'moraltrade.org' else location.endswith('/walkthrough')
            results.append({'host':host,'status':response.code,'location':location})
          report={'sha':os.environ['EXPECTED_SHA'],'checked_at':datetime.now(timezone.utc).isoformat(),'requests':'GET only','results':results}
          (out/'http.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report))
          PY
      - name: Render canonical desktop and mobile flows with all mutations blocked
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import { chromium } from '@playwright/test';
          import assert from 'node:assert/strict';
          import { writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          const out=join(process.env.RUNNER_TEMP,'cleanup-813-smoke');
          const browser=await chromium.launch();
          const results=[];
          try {
            for (const [name,width,height] of [['desktop',1440,1000],['mobile',390,844]]) {
              const context=await browser.newContext({viewport:{width,height}});
              const blocked=[];
              await context.route('**/*', route=>{
                const req=route.request();
                const url=new URL(req.url());
                if (['GET','HEAD'].includes(req.method()) && ['www.moraltrade.org','moraltrade.org'].includes(url.hostname)) return route.continue();
                blocked.push({method:req.method(),host:url.hostname,path:url.pathname});
                return route.abort();
              });
              const page=await context.newPage();
              const errors=[];
              page.on('pageerror',error=>errors.push(error.message));
              await page.goto('https://www.moraltrade.org/',{waitUntil:'networkidle',timeout:60000});
              assert.equal(new URL(page.url()).pathname,'/walkthrough');
              await page.getByRole('heading',{name:'What do you value?'}).waitFor({state:'visible',timeout:30000});
              await page.screenshot({path:join(out,`${name}-live-walkthrough.png`),fullPage:true});
              await page.goto('https://www.moraltrade.org/',{waitUntil:'networkidle',timeout:60000});
              assert.equal(new URL(page.url()).pathname,'/');
              await page.locator('[data-mt-live-now-state="signed_out"]').waitFor({state:'visible',timeout:30000});
              assert.equal(await page.locator('[data-mt-live-now-recommendation]').count(),0);
              assert.equal(await page.getByTestId('home-offer-trade').count(),0);
              const text=await page.locator('body').innerText();
              assert.ok(text.includes('No recommendations shown'));
              assert.ok(!text.includes('96% on-time verification'));
              assert.ok(!text.includes('Application error:'));
              await page.screenshot({path:join(out,`${name}-live-feed.png`),fullPage:true});
              await page.locator('button[data-action="create"]').click();
              await page.waitForURL('**/trades/new**',{timeout:30000});
              assert.ok((await page.locator('body').innerText()).trim().length>200);
              results.push({viewport:name,width,height,firstVisit:'/walkthrough',returningHome:'/',signedOut:true,noMockRecommendations:true,createDestination:new URL(page.url()).pathname,pageErrors:errors,blockedRequests:blocked});
              assert.deepEqual(errors,[]);
              await context.close();
            }
            const report={sha:process.env.EXPECTED_SHA,checkedAt:new Date().toISOString(),mode:'Public signed-out Chromium; GET/HEAD only; third-party requests blocked',results};
            writeFileSync(join(out,'browser.json'),JSON.stringify(report,null,2)+'\n');
            console.log(JSON.stringify(report));
          } finally {await browser.close();}
          JS
      - name: Preserve read-only production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cleanup-813-live-smoke-${{ github.run_id }}
          path: ${{ runner.temp }}/cleanup-813-smoke/
          retention-days: 7
