name: Observe or dispatch exact f9ae548 production release

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - .github/workflows/observe-or-dispatch-production-f9ae548.yml

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: observe-or-dispatch-production-f9ae548
  cancel-in-progress: false

env:
  EXPECTED_MAIN_SHA: f9ae5480ae7c20176f24c5f8b678088b5823fc39
  CONTROLLER_BRANCH: ops/observe-or-dispatch-production-f9ae548-20260818
  CONTROLLER_PATH: .github/workflows/observe-or-dispatch-production-f9ae548.yml
  RELEASE_WORKFLOW: vercel-release.yml
  EXISTING_RUN_NOT_BEFORE: '2026-08-18T05:55:29Z'
  RELEASE_EVIDENCE_PR: '757'

jobs:
  observe-or-dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Check out the exact controller head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Guard repository, immutable main, and controller-only scope
        shell: bash
        env:
          EVENT_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          EVENT_HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          EVENT_BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'ghuser29384/Website2'
          test "$EVENT_HEAD_REPO" = "$GITHUB_REPOSITORY"
          test "$EVENT_HEAD_BRANCH" = "$CONTROLLER_BRANCH"
          test "$EVENT_BASE_BRANCH" = 'main'
          test "$(git rev-parse HEAD)" = "$EVENT_HEAD_SHA"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_MAIN_SHA"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$EXPECTED_MAIN_SHA"
          test "$(git diff --name-only "$EXPECTED_MAIN_SHA" HEAD)" = "$CONTROLLER_PATH"
          git diff --check "$EXPECTED_MAIN_SHA" HEAD
          test "$(git show "$EXPECTED_MAIN_SHA:.github/workflows/vercel-release.yml" | sed -n '1p')" = 'name: Gated Vercel release'

      - name: Reuse an existing exact run or dispatch exactly once
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CONTROLLER_PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          api() {
            curl -fsS \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "$@"
          }

          list_exact_runs() {
            api "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/$RELEASE_WORKFLOW/runs?event=workflow_dispatch&branch=main&per_page=100" \
              | jq -c \
                  --arg sha "$EXPECTED_MAIN_SHA" \
                  --arg not_before "$EXISTING_RUN_NOT_BEFORE" \
                  '[.workflow_runs[] | select(.head_sha == $sha and .head_branch == "main" and .event == "workflow_dispatch" and .created_at >= $not_before)] | sort_by(.created_at)'
          }

          runs="$(list_exact_runs)"
          count="$(jq 'length' <<< "$runs")"
          if (( count > 1 )); then
            ids="$(jq -r 'map(.id|tostring) | join(",")' <<< "$runs")"
            body="EXACT_PRODUCTION_RELEASE_F9AE548\nstatus=blocked_duplicate_runs\nhead_sha=$EXPECTED_MAIN_SHA\nrun_ids=$ids\ncontroller_run=$GITHUB_RUN_ID"
            payload="$(jq -n --arg body "$body" '{body:$body}')"
            api -X POST "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/$RELEASE_EVIDENCE_PR/comments" -d "$payload" >/dev/null
            api -X POST "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/$CONTROLLER_PR/comments" -d "$payload" >/dev/null
            exit 1
          fi

          if (( count == 0 )); then
            dispatch_payload="$(jq -n \
              --arg expected_sha "$EXPECTED_MAIN_SHA" \
              '{ref:"main",inputs:{target:"production",ref:"main",expected_sha:$expected_sha,synthetic_auth_fixture_url:""}}')"
            http_code="$(curl -sS \
              -o "$RUNNER_TEMP/dispatch-response.txt" \
              -w '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/$RELEASE_WORKFLOW/dispatches" \
              -d "$dispatch_payload")"
            test "$http_code" = '204'
            test ! -s "$RUNNER_TEMP/dispatch-response.txt"

            for _ in $(seq 1 60); do
              sleep 5
              runs="$(list_exact_runs)"
              count="$(jq 'length' <<< "$runs")"
              if (( count == 1 )); then
                break
              fi
              if (( count > 1 )); then
                echo 'More than one exact release run appeared after the guarded dispatch.' >&2
                exit 1
              fi
            done
            test "$count" = '1'
            disposition='dispatched'
          else
            disposition='reused'
          fi

          run_id="$(jq -r '.[0].id' <<< "$runs")"
          run_url="$(jq -r '.[0].html_url' <<< "$runs")"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "run_url=$run_url" >> "$GITHUB_OUTPUT"
          echo "disposition=$disposition" >> "$GITHUB_OUTPUT"

          status=''
          conclusion=''
          for _ in $(seq 1 300); do
            run="$(api "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$run_id")"
            test "$(jq -r '.head_sha' <<< "$run")" = "$EXPECTED_MAIN_SHA"
            test "$(jq -r '.head_branch' <<< "$run")" = 'main'
            test "$(jq -r '.event' <<< "$run")" = 'workflow_dispatch'
            status="$(jq -r '.status' <<< "$run")"
            conclusion="$(jq -r '.conclusion // "pending"' <<< "$run")"
            [[ "$status" == 'completed' ]] && break
            test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$EXPECTED_MAIN_SHA"
            sleep 10
          done

          run="$(api "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$run_id")"
          status="$(jq -r '.status' <<< "$run")"
          conclusion="$(jq -r '.conclusion // "pending"' <<< "$run")"
          created_at="$(jq -r '.created_at' <<< "$run")"
          updated_at="$(jq -r '.updated_at' <<< "$run")"
          attempt="$(jq -r '.run_attempt' <<< "$run")"
          jobs="$(api "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100")"
          job_summary="$(jq -r '[.jobs[] | "job_id=" + (.id|tostring) + " name=" + .name + " status=" + .status + " conclusion=" + (.conclusion // "pending")] | join("\n")' <<< "$jobs")"

          body="$(cat <<EOF
EXACT_PRODUCTION_RELEASE_F9AE548
controller_disposition=$disposition
run_id=$run_id
run_url=$run_url
head_sha=$EXPECTED_MAIN_SHA
head_branch=main
event=workflow_dispatch
status=$status
conclusion=$conclusion
attempt=$attempt
created_at=$created_at
updated_at=$updated_at
input_target=production
input_ref=main
input_expected_sha=$EXPECTED_MAIN_SHA
input_synthetic_auth_fixture_url=<empty>
controller_run=$GITHUB_RUN_ID
$job_summary
EOF
)"
          payload="$(jq -n --arg body "$body" '{body:$body}')"
          api -X POST "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/$RELEASE_EVIDENCE_PR/comments" -d "$payload" >/dev/null
          api -X POST "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/$CONTROLLER_PR/comments" -d "$payload" >/dev/null

          test "$status" = 'completed'
          test "$conclusion" = 'success'
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$EXPECTED_MAIN_SHA"
