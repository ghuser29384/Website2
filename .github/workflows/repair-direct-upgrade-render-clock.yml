name: Repair Direct Donation Upgrade render clock lint

on:
  push:
    branches:
      - feature/direct-verified-donation-upgrade-20260731
    paths:
      - .github/workflows/repair-direct-upgrade-render-clock.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-direct-upgrade-render-clock
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/direct-verified-donation-upgrade-20260731
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Move wall-clock acquisition outside the component render body
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/app/trades/new/conditional-donation.tsx')
          text = path.read_text()
          function_anchor = '''function candidateOfferId(candidate: DirectDonationUpgradeCandidateRow) {
            return String(candidate.offer_id);
          }
          '''
          replacement = function_anchor + '''
          async function loadRenderClockMs() {
            return Date.now();
          }
          '''
          render_anchor = '''  const formMessage = getFormMessage(params);
            const now = Date.now();
          '''
          render_replacement = '''  const formMessage = getFormMessage(params);
            const now = await loadRenderClockMs();
          '''
          if text.count(function_anchor) != 1:
              raise SystemExit('Expected one candidateOfferId anchor.')
          if text.count(render_anchor) != 1:
              raise SystemExit('Expected one direct Date.now render anchor.')
          text = text.replace(function_anchor, replacement).replace(render_anchor, render_replacement)
          path.write_text(text)
          PY

          git diff --check
          npm ci
          npx eslint src/app/trades/new/conditional-donation.tsx
          node --import tsx --test \
            src/lib/direct-donation-upgrade.test.ts \
            src/lib/direct-donation-upgrade-source-contract.test.ts

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/trades/new/conditional-donation.tsx
          git commit -m 'Move Donation Upgrade clock acquisition outside render'
          git push origin HEAD:feature/direct-verified-donation-upgrade-20260731
