name: Failure bonus integration source snapshot

on:
  push:
    branches:
      - ops/export-failure-bonus-integration-source-20260726
    paths:
      - ".github/workflows/failure-bonus-integration-source-snapshot.yml"

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact source
        uses: actions/checkout@v4

      - name: Create source archive
        run: |
          tar \
            --exclude=.git \
            --exclude=node_modules \
            --exclude=.next \
            --exclude=test-results \
            --exclude=playwright-report \
            -czf /tmp/failure-bonus-integration-source.tar.gz .

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: failure-bonus-integration-source-${{ github.run_id }}
          path: /tmp/failure-bonus-integration-source.tar.gz
          retention-days: 2
