name: Repair MPGF approval metadata guard 2026-08-06

on:
  push:
    branches:
      - fix/mpgf-pool-review-freeze-20260806
    paths:
      - ".github/workflows/repair-mpgf-approval-metadata-guard-20260806.yml"

permissions:
  contents: write

concurrency:
  group: repair-mpgf-approval-metadata-guard-20260806
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_PARENT: 65b4686a6a9fe89395394af244c499d26fa061ea
      TARGET_BRANCH: fix/mpgf-pool-review-freeze-20260806
      CONTROLLER_PATH: .github/workflows/repair-mpgf-approval-metadata-guard-20260806.yml

    steps:
      - name: Check out exact controller commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          ref: ${{ github.sha }}

      - name: Exclude approval metadata from operative-term drift comparison
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          changed="$(git diff-tree --no-commit-id --name-only -r HEAD | sed '/^$/d')"
          test "$changed" = "$CONTROLLER_PATH"

          python3 - <<'PY'
          from pathlib import Path

          migration_path = Path("supabase/migrations/20260806110000_mpgf_pool_review_freeze.sql")
          migration = migration_path.read_text()
          old = """      - 'reviewed_by'
      - 'reviewed_at'
      - 'review_reason';
"""
          new = """      - 'reviewed_by'
      - 'reviewed_at'
      - 'review_reason'
      - 'approved_terms_version'
      - 'operative_terms_sha256'
      - 'terms_locked_at';
"""
          if migration.count(old) != 2:
              raise SystemExit(f"Expected two operative-material projections, found {migration.count(old)}")
          migration_path.write_text(migration.replace(old, new))

          test_path = Path("src/lib/mpgf/pool-review-freeze-migration.test.ts")
          test_source = test_path.read_text()
          anchor = '    "terms_locked_at = timezone(\'utc\', now())",\n'
          addition = (
              '    "- \'approved_terms_version\'",\n'
              '    "- \'operative_terms_sha256\'",\n'
              '    "- \'terms_locked_at\'",\n'
          )
          if test_source.count(anchor) != 1:
              raise SystemExit(f"Expected one terms-lock assertion anchor, found {test_source.count(anchor)}")
          test_path.write_text(test_source.replace(anchor, anchor + addition))
          PY

          git diff --check
          git diff -- \
            supabase/migrations/20260806110000_mpgf_pool_review_freeze.sql \
            src/lib/mpgf/pool-review-freeze-migration.test.ts

      - name: Commit and push non-workflow repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            supabase/migrations/20260806110000_mpgf_pool_review_freeze.sql \
            src/lib/mpgf/pool-review-freeze-migration.test.ts
          git diff --cached --check
          git commit -m "Allow approval metadata without operative-term drift"
          git push origin "HEAD:$TARGET_BRANCH"
