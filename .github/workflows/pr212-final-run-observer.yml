name: PR 212 final exact-head QA observer

on:
  push:
    branches:
      - ops/pr212-complete-ui-status-20260730
    paths:
      - .github/workflows/pr212-final-run-observer.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  pull-requests: read

concurrency:
  group: pr212-final-exact-head-qa-observer
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_BRANCH: feat/institutional-trade-system
      TARGET_WORKFLOW: institutional-trade-qa.yml
      TARGET_HEAD: 7ed2cf755f453a21419d11773b3d062a9edda72f
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Locate exact-head institutional QA run and record terminal state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ops/pr212-final-qa

          run_id=""
          run_status=""
          run_conclusion=""
          for attempt in $(seq 1 100); do
            gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow "$TARGET_WORKFLOW" \
              --branch "$TARGET_BRANCH" \
              --limit 100 \
              --json databaseId,headSha,status,conclusion,createdAt,event,url,displayTitle \
              > /tmp/pr212-final-runs.json

            run_id="$(jq -r --arg head "$TARGET_HEAD" '[.[] | select(.headSha == $head)] | sort_by(.createdAt) | reverse | .[0].databaseId // empty' /tmp/pr212-final-runs.json)"
            run_status="$(jq -r --arg head "$TARGET_HEAD" '[.[] | select(.headSha == $head)] | sort_by(.createdAt) | reverse | .[0].status // empty' /tmp/pr212-final-runs.json)"
            run_conclusion="$(jq -r --arg head "$TARGET_HEAD" '[.[] | select(.headSha == $head)] | sort_by(.createdAt) | reverse | .[0].conclusion // empty' /tmp/pr212-final-runs.json)"

            if [[ -n "$run_id" && "$run_status" == "completed" ]]; then
              break
            fi
            sleep 12
          done

          if [[ -n "$run_id" ]]; then
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" > /tmp/pr212-final-run.json
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100" > /tmp/pr212-final-jobs.json
            gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --log-failed > /tmp/pr212-final-failed.log 2>&1 || true
          else
            printf '%s\n' '{}' > /tmp/pr212-final-run.json
            printf '%s\n' '{"jobs":[]}' > /tmp/pr212-final-jobs.json
            printf '%s\n' 'No exact-head institutional QA run found.' > /tmp/pr212-final-failed.log
          fi

          jq -n \
            --arg generated_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg target_head "$TARGET_HEAD" \
            --arg target_branch "$TARGET_BRANCH" \
            --arg target_workflow "$TARGET_WORKFLOW" \
            --arg run_id "$run_id" \
            --arg run_status "$run_status" \
            --arg run_conclusion "$run_conclusion" \
            --slurpfile runs /tmp/pr212-final-runs.json \
            --slurpfile run /tmp/pr212-final-run.json \
            --slurpfile jobs /tmp/pr212-final-jobs.json \
            '{generated_at:$generated_at,target_head:$target_head,target_branch:$target_branch,target_workflow:$target_workflow,selected_run_id:$run_id,selected_run_status:$run_status,selected_run_conclusion:$run_conclusion,runs:$runs[0],run:$run[0],jobs:$jobs[0].jobs}' \
            > ops/pr212-final-qa/run-report.json

          cp /tmp/pr212-final-failed.log ops/pr212-final-qa/failed-log.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops/pr212-final-qa/run-report.json ops/pr212-final-qa/failed-log.txt
          git commit -m "Record PR 212 exact-head QA terminal state"
          git push origin HEAD:ops/pr212-complete-ui-status-20260730

          if [[ -z "$run_id" ]]; then
            echo "No exact-head institutional QA run was found." >&2
            exit 1
          fi
          if [[ "$run_status" != "completed" ]]; then
            echo "Exact-head institutional QA run did not reach a terminal state in time." >&2
            exit 1
          fi
