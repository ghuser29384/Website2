name: Inspect release validation run metadata

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/inspect-release-run-metadata.yml

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read exact validation run metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for run_id in 30746018141 30746019003 30746019006 30746019025; do
            gh api \
              -H 'Accept: application/vnd.github+json' \
              "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" \
              | jq '{
                  id,
                  name,
                  event,
                  status,
                  conclusion,
                  head_sha,
                  head_branch,
                  workflow_id,
                  path,
                  repository: .repository.full_name,
                  head_repository: .head_repository.full_name
                }'
          done
