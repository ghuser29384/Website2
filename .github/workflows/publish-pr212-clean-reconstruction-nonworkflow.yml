name: Publish PR 212 reconstruction source without workflow files

on:
  push:
    branches:
      - agent/pr212-clean-reconstruction-staging-20260730
    paths:
      - .github/workflows/publish-pr212-clean-reconstruction-nonworkflow.yml
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: publish-pr212-clean-reconstruction-nonworkflow
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPECTED_PR_HEAD: 9ec3bd79618a704469bc4f3547d2d8a1e4dc2730
      STAGING_BRANCH: agent/pr212-clean-reconstruction-staging-20260730
      FINAL_BRANCH: agent/pr212-clean-reconstruction-20260730
      EXPECTED_BASE64_SHA256: 32432ad98bffc63704336f313491f03e86070e88eb217c37e74cf255125637c7
      EXPECTED_GZIP_SHA256: 5e03aa5b29836c54880a607950d9651fced78c0d98d3aa27bd2fce3c2321bf49
      EXPECTED_PATCH_SHA256: 145589ad3cdc3f9ea4a09c7f800196c752c8d45c0139d8f618b736074f3d9ecb
      EXPECTED_AUTHORIZATION_BASE64_SHA256: a2736fc4b4940fa9e6e16b057139432c91dc66f1780aa6136d6abf102410be52
      EXPECTED_AUTHORIZATION_GZIP_SHA256: 9bbc792a71a146b166b1f2e36f16fa5d335689a159df036d7247817a2fa106a5
      EXPECTED_AUTHORIZATION_PATCH_SHA256: 793771d842b462fb20824feda276022be6806ac7aa02d00cc84c681e32e77f34
      EXPECTED_AUTHORIZATION_TEST_SHA256: b1ed9f60ae262e4cbea5e0b058f6a61c044594a89ab9f5e775100a5d11432024
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out the separately protected reconstruction branch
        uses: actions/checkout@v4
        with:
          ref: agent/pr212-clean-reconstruction-20260730
          fetch-depth: 0

      - name: Reconstruct, verify, and publish only non-workflow source
        shell: bash
        run: |
          set -euo pipefail

          actual_pr_head="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/212" --jq .head.sha)"
          actual_final_head="$(git rev-parse HEAD)"
          if [[ "$actual_pr_head" != "$EXPECTED_PR_HEAD" || "$actual_final_head" != "$EXPECTED_PR_HEAD" ]]; then
            echo "PR #212 or the protected reconstruction branch moved; refusing to publish." >&2
            echo "Expected:   $EXPECTED_PR_HEAD" >&2
            echo "PR head:    $actual_pr_head" >&2
            echo "Branch head: $actual_final_head" >&2
            exit 1
          fi

          git fetch origin "refs/heads/${STAGING_BRANCH}:refs/remotes/origin/${STAGING_BRANCH}"
          work=/tmp/pr212-nonworkflow-publication
          rm -rf "$work"
          mkdir -p "$work/parts" "$work/evidence"

          for part in 000 001 002 003 004 005 008; do
            git show "refs/remotes/origin/${STAGING_BRANCH}:.github/pr212-clean-reconstruction.payload-${part}" > "$work/parts/${part}"
          done
          cat > "$work/parts.sha256" <<'HASHES'
          8e200e772f16ee924aae30510ff163660fb655d730a2a6eab1918dde55c2c059  /tmp/pr212-nonworkflow-publication/parts/000
          e4bf20f743c7d695515645b98c3c3c2b6dc3ffc7a6f187e86526a12d68d4b7cc  /tmp/pr212-nonworkflow-publication/parts/001
          5a42d33377cfc834e1f3bdf0cad90e46a1e462624d435c50ec993bfed480ea62  /tmp/pr212-nonworkflow-publication/parts/002
          5f588bcc561c0facb04ca9a3bebaf8c77b8e1a374f51200cd0eccc3fbf3ac85d  /tmp/pr212-nonworkflow-publication/parts/003
          98bfa47b309c78d3cb9c9707cbb54b232991b1933844789d1203ecc6b15afa20  /tmp/pr212-nonworkflow-publication/parts/004
          c031da22d8fdc0686557e539ae685f37eeb6ea3038ed5e3063ba6815ee4d7d07  /tmp/pr212-nonworkflow-publication/parts/005
          4216cf1a8b659488ae695e4ddbd3c973002cd32ada26a5beee687465f1e39798  /tmp/pr212-nonworkflow-publication/parts/008
          HASHES
          sha256sum --check --strict "$work/parts.sha256"

          cat "$work/parts/000" "$work/parts/001" "$work/parts/002" "$work/parts/003" "$work/parts/004" "$work/parts/005" "$work/parts/008" > "$work/base.patch.gz.b64"
          echo "${EXPECTED_BASE64_SHA256}  $work/base.patch.gz.b64" | sha256sum --check --strict
          base64 --decode "$work/base.patch.gz.b64" > "$work/base.patch.gz"
          echo "${EXPECTED_GZIP_SHA256}  $work/base.patch.gz" | sha256sum --check --strict
          gzip --decompress --stdout "$work/base.patch.gz" > "$work/base.patch"
          echo "${EXPECTED_PATCH_SHA256}  $work/base.patch" | sha256sum --check --strict

          git show "refs/remotes/origin/${STAGING_BRANCH}:.github/pr212-clean-reconstruction.authorization-snapshot.patch.gz.b64" > "$work/authorization.patch.gz.b64"
          echo "${EXPECTED_AUTHORIZATION_BASE64_SHA256}  $work/authorization.patch.gz.b64" | sha256sum --check --strict
          base64 --decode "$work/authorization.patch.gz.b64" > "$work/authorization.patch.gz"
          echo "${EXPECTED_AUTHORIZATION_GZIP_SHA256}  $work/authorization.patch.gz" | sha256sum --check --strict
          gzip --decompress --stdout "$work/authorization.patch.gz" > "$work/authorization.patch"
          echo "${EXPECTED_AUTHORIZATION_PATCH_SHA256}  $work/authorization.patch" | sha256sum --check --strict

          git show "refs/remotes/origin/${STAGING_BRANCH}:.github/pr212-clean-reconstruction.authorization-snapshot.test.ts" > "$work/authorization.test.ts"
          echo "${EXPECTED_AUTHORIZATION_TEST_SHA256}  $work/authorization.test.ts" | sha256sum --check --strict

          git apply --check --binary "$work/base.patch"
          git apply --binary "$work/base.patch"
          git apply --check --binary "$work/authorization.patch"
          git apply --binary "$work/authorization.patch"
          test ! -e src/institutional-authorization-snapshot.test.ts
          install -D -m 0644 "$work/authorization.test.ts" src/institutional-authorization-snapshot.test.ts

          git restore --source=HEAD -- .github/workflows/institutional-trade-qa.yml
          rm -f .github/workflows/pr212-clean-reconstruction-gates.yml
          git diff --check

          cat > "$work/expected-files.txt" <<'FILES'
          .github/scripts/institutional-trade-qa-e2e.mjs
          src/app/institutions/[organizationId]/deals/[dealId]/page.tsx
          src/app/institutions/[organizationId]/page.tsx
          src/app/institutions/actions.ts
          src/app/institutions/individual/deals/[dealId]/page.tsx
          src/components/institutions/institutional-deal-workspace.tsx
          src/components/institutions/institutional-organization-administration.tsx
          src/components/institutions/institutional-pool-workspace.tsx
          src/institutional-authorization-snapshot.test.ts
          src/institutional-individual-capacity.test.ts
          src/institutional-product-completeness.test.ts
          src/institutional-trade-migration.test.ts
          src/institutional-trade-wiring.test.ts
          src/lib/institutional-data.ts
          src/lib/institutional-trade.ts
          supabase/migrations/20260726123000_institutional_trade_system.sql
          FILES
          git status --short | cut -c4- | sort > "$work/actual-files.txt"
          sort -o "$work/expected-files.txt" "$work/expected-files.txt"
          diff -u "$work/expected-files.txt" "$work/actual-files.txt"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Reconstruct PR 212 institutional source"
          published_commit="$(git rev-parse HEAD)"
          git push origin "HEAD:refs/heads/${FINAL_BRANCH}"

          {
            echo "base_commit=${EXPECTED_PR_HEAD}"
            echo "published_commit=${published_commit}"
            echo "base_patch_sha256=${EXPECTED_PATCH_SHA256}"
            echo "authorization_patch_sha256=${EXPECTED_AUTHORIZATION_PATCH_SHA256}"
            echo "authorization_test_sha256=${EXPECTED_AUTHORIZATION_TEST_SHA256}"
          } > "$work/evidence/result.txt"
          cp "$work/expected-files.txt" "$work/actual-files.txt" "$work/evidence/"

      - name: Upload publication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr212-nonworkflow-publication-${{ github.run_id }}
          path: /tmp/pr212-nonworkflow-publication/evidence
          if-no-files-found: warn
          retention-days: 14
