name: Sitewide no-fluorescent-yellow rendered validation v2

on:
  push:
    branches: [ops/no-fluorescent-yellow-validation-20260925]
    paths: [.github/workflows/no-fluorescent-yellow-rendered-v2.yml]

permissions:
  contents: read

jobs:
  rendered:
    runs-on: ubuntu-24.04
    timeout-minutes: 105
    env:
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3210
      SITE_URL: http://127.0.0.1:3210
      PLAYWRIGHT_HTML_OPEN: never
      PLAYWRIGHT_USE_PRODUCTION_SERVER: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 02fe79c7d84f2d859c7b85459350d5a1e786a021
          fetch-depth: 0
          persist-credentials: false
      - name: Guard exact candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 02fe79c7d84f2d859c7b85459350d5a1e786a021
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Verify representative production-built routes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/no-yellow-rendered-v2"
          npm run start -- --hostname 127.0.0.1 --port 3210 > "$RUNNER_TEMP/no-yellow-rendered-v2/server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3210/create?mode=pool >/dev/null; then ready=1; break; fi
            sleep 2
          done
          test "$ready" = 1
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { writeFile } from 'node:fs/promises';
          import { chromium } from '@playwright/test';

          const out = `${process.env.RUNNER_TEMP}/no-yellow-rendered-v2`;
          const browser = await chromium.launch();
          const evidence = { candidate: '02fe79c7d84f2d859c7b85459350d5a1e786a021', results: [] };
          try {
            for (const width of [1440, 390]) {
              const context = await browser.newContext({ viewport: { width, height: 1000 } });
              await context.addCookies([
                { name: 'mt_walkthrough_seen', value: '1', url: 'http://127.0.0.1:3210', sameSite: 'Lax' },
                { name: 'mt_analytics_opt_out', value: '1', url: 'http://127.0.0.1:3210', sameSite: 'Lax' },
              ]);
              const page = await context.newPage();
              const pageErrors = [];
              page.on('pageerror', e => pageErrors.push(e.message));

              const createResponse = await page.goto('http://127.0.0.1:3210/create?mode=pool', { waitUntil: 'domcontentloaded', timeout: 60000 });
              assert.ok((createResponse?.status() ?? 200) < 400);
              const rootSignal = await page.evaluate(() => {
                const s = getComputedStyle(document.documentElement);
                return {
                  signal: s.getPropertyValue('--signal').trim().toLowerCase(),
                  signalInk: s.getPropertyValue('--signal-ink').trim().toLowerCase(),
                  successSoft: s.getPropertyValue('--success-soft').trim().toLowerCase(),
                };
              });
              assert.equal(rootSignal.signal, '#dfe6ff');
              assert.equal(rootSignal.signalInk, '#26376f');
              assert.equal(rootSignal.successSoft, '#e8f0df');

              const poolButton = page.locator('[data-create-mode="pool"]');
              await poolButton.waitFor({ state: 'visible', timeout: 45000 });
              await poolButton.hover();
              const poolHover = await poolButton.evaluate(el => getComputedStyle(el).backgroundColor);
              assert.equal(poolHover, 'rgb(230, 237, 248)');
              await page.screenshot({ path: `${out}/create-pool-${width}.png`, fullPage: true });

              const pledgeResponse = await page.goto('http://127.0.0.1:3210/pledge-swaps', { waitUntil: 'domcontentloaded', timeout: 60000 });
              assert.ok((pledgeResponse?.status() ?? 200) < 400);
              const pledgeTokens = await page.locator('main').first().evaluate(el => {
                const s = getComputedStyle(el);
                return {
                  signal: s.getPropertyValue('--pledge-signal').trim().toLowerCase(),
                  ink: s.getPropertyValue('--pledge-signal-ink').trim().toLowerCase(),
                };
              });
              assert.equal(pledgeTokens.signal, '#e4eaff');
              assert.equal(pledgeTokens.ink, '#26376f');
              await page.screenshot({ path: `${out}/pledge-swaps-${width}.png`, fullPage: true });

              const controlsResponse = await page.goto('http://127.0.0.1:3210/trade-controls', { waitUntil: 'domcontentloaded', timeout: 60000 });
              assert.ok((controlsResponse?.status() ?? 200) < 400);
              const controlsTokens = await page.locator('main').first().evaluate(el => {
                const s = getComputedStyle(el);
                return {
                  accent: s.getPropertyValue('--lime').trim().toLowerCase(),
                  accentDark: s.getPropertyValue('--lime-dark').trim().toLowerCase(),
                };
              });
              assert.equal(controlsTokens.accent, '#83a97d');
              assert.equal(controlsTokens.accentDark, '#4f6d4c');
              await page.screenshot({ path: `${out}/trade-controls-${width}.png`, fullPage: true });

              const homeResponse = await page.goto('http://127.0.0.1:3210/', { waitUntil: 'domcontentloaded', timeout: 60000 });
              assert.ok((homeResponse?.status() ?? 200) < 400);
              await page.screenshot({ path: `${out}/home-${width}.png`, fullPage: true });

              assert.deepEqual(pageErrors, []);
              evidence.results.push({ width, rootSignal, poolHover, pledgeTokens, controlsTokens });
              await context.close();
            }
            await writeFile(`${out}/rendered-colors.json`, JSON.stringify(evidence, null, 2));
          } finally {
            await browser.close();
          }
          NODE
      - name: Run unchanged release browser suite
        run: npm run test:e2e:release -- --reporter=line
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: no-yellow-rendered-v2-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/no-yellow-rendered-v2
            test-results
          if-no-files-found: warn
          retention-days: 7
