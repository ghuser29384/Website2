name: Finalize Compact outflow validation v3

on:
  push:
    branches:
      - feature/compact-authoritative-outflow-ledger-v1-20260816
    paths:
      - .github/workflows/finalize-compact-outflow-validation-v3.yml

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: finalize-compact-outflow-validation-v3
  cancel-in-progress: false

env:
  STACK_BASE_SHA: f46178aaad6d2fbd911cc365e2963bb7c73a0098
  FEATURE_BRANCH: feature/compact-authoritative-outflow-ledger-v1-20260816
  QA_REF: hvmxfjjbdcgjjudmthdz
  PR_NUMBER: '737'
  ISSUE_NUMBER: '734'

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 160
    steps:
      - name: Check out live feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Fail closed on unexpected product scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base "$STACK_BASE_SHA" HEAD)" = "$STACK_BASE_SHA"
          git diff --name-only "$STACK_BASE_SHA"...HEAD | sort > /tmp/live-scope.txt
          if grep -Ev '^(\.github/workflows/(compact-authoritative-outflow-ledger-qa|repair-compact-outflow-qa|repair-compact-outflow-validation-v2|repair-compact-outflow-scope-guard-v3|repair-compact-outflow-scope-guard-v4|repair-compact-outflow-scope-guard-v5|repair-compact-outflow-phase-order-v1|complete-compact-outflow-nonhosted-v1|repair-compact-outflow-test-isolation-v2|complete-compact-outflow-nonhosted-v2|finalize-compact-outflow-validation-v3)\.yml|docs/mpgf/compact-authoritative-outflow-ledger-v1\.md|scripts/test-compact-authoritative-outflow-concurrency\.sh|src/components/mpgf/mpgf-public-goods-compacts\.tsx|src/lib/mpgf/compact-authoritative-outflow(-contract\.test|\.test)?\.ts|supabase/migrations/2026081614150[0-3]_compact_authoritative_outflow_.*\.sql|supabase/tests/compact_authoritative_outflow_ledger_(authorization|core)\.sql|tests/mpgf-public-goods-compacts\.spec\.ts)$' /tmp/live-scope.txt; then
            echo 'Unexpected file outside the frozen ledger plus known controller scope.'
            exit 1
          fi
          grep -qx '.github/workflows/finalize-compact-outflow-validation-v3.yml' /tmp/live-scope.txt

      - name: Write definitive ordered and isolated QA workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('.github/workflows/compact-authoritative-outflow-ledger-qa.yml')
          source = path.read_text(encoding='utf-8')

          def replace_between(start_pattern: str, end_pattern: str, replacement: str) -> None:
              global source
              start_match = re.search(start_pattern, source, flags=re.MULTILINE)
              if not start_match:
                  raise SystemExit(f'Missing start pattern: {start_pattern}')
              end_match = re.search(end_pattern, source[start_match.start():], flags=re.MULTILINE)
              if not end_match:
                  raise SystemExit(f'Missing end pattern: {end_pattern}')
              end = start_match.start() + end_match.start()
              source = source[:start_match.start()] + replacement + source[end:]

          prepare = r'''      - name: Prepare exact split migration chain
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          mkdir -p compact-outflow-clean/pre-ledger-migrations compact-outflow-clean/ledger-migrations compact-outflow-clean/normalized-tests
          git show "$HISTORICAL_BASELINE_COMMIT:supabase/schema.sql" > compact-outflow-clean/historical-baseline.sql
          test "$(sha256sum compact-outflow-clean/historical-baseline.sql | cut -d ' ' -f 1)" = "$HISTORICAL_BASELINE_SHA256"
          git diff --name-only --diff-filter=AM "$HISTORICAL_BASELINE_COMMIT"..HEAD -- 'supabase/migrations/*.sql' \
            | LC_ALL=C sort | tee compact-outflow-clean/post-baseline-migrations.txt
          while IFS= read -r migration_path; do
            test -f "$migration_path"
            case "$(basename "$migration_path")" in
              20260816141500_compact_authoritative_outflow_ledger_v1.sql|20260816141501_compact_authoritative_outflow_freeze_v1.sql|20260816141502_compact_authoritative_outflow_hardening_v1.sql|20260816141503_compact_authoritative_outflow_replay_fix_v1.sql)
                cp "$migration_path" compact-outflow-clean/ledger-migrations/ ;;
              *) cp "$migration_path" compact-outflow-clean/pre-ledger-migrations/ ;;
            esac
          done < compact-outflow-clean/post-baseline-migrations.txt
          test "$(find compact-outflow-clean/ledger-migrations -maxdepth 1 -type f -name '*.sql' | wc -l)" -eq 4
          python3 - <<'PYTESTS'
          from pathlib import Path
          output = Path('compact-outflow-clean/normalized-tests')
          for name in [
              'mpgf_public_goods_compacts_lifecycle.sql',
              'mpgf_public_goods_compacts_historical_freeze.sql',
              'compact_authoritative_outflow_ledger_core.sql',
              'compact_authoritative_outflow_ledger_authorization.sql',
          ]:
              lines = (Path('supabase/tests') / name).read_text(encoding='utf-8').splitlines()
              lines = [line for line in lines if line.strip().lower() not in {'begin;', 'commit;', 'rollback;'}]
              (output / name).write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PYTESTS
          find supabase/migrations -maxdepth 1 -type f -name '*.sql' -print | LC_ALL=C sort | xargs sha256sum > compact-outflow-clean/migration-source.sha256
          git rev-parse HEAD > compact-outflow-clean/head-sha.txt

'''
          replace_between(r'^      - name: Prepare exact (?:split )?migration chain\n', r'^      - name: Start clean ephemeral PostgreSQL 17 Supabase runtime\n', prepare)

          apply = r'''      - name: Apply baseline and pre-ledger production-compatible migrations
        shell: bash
        run: |
          set -o pipefail
          SUPABASE_MIGRATION_TEST_DB_URL="$LOCAL_SUPABASE_DB_URL" \
          SUPABASE_MIGRATION_BASELINE_SQL=compact-outflow-clean/historical-baseline.sql \
          SUPABASE_MIGRATION_SKIP_BASENAMES=20260811152545_commitments_impact_study_instrumentation_qa_only.sql,20260811152958_commitments_impact_study_instrumentation_child_trigger_fix.sql,20260811161238_commitments_impact_study_instrumentation_review_remediation_core.sql,20260811161445_commitments_impact_study_instrumentation_review_remediation_instance_validator.sql,20260811161708_commitments_impact_study_instrumentation_review_remediation_child_validators.sql,20260811161948_commitments_impact_study_instrumentation_review_remediation_rpcs.sql,20260811162054_commitments_impact_study_instrumentation_review_remediation_privileges.sql,20260811171544_commitments_impact_study_blocked_probe_service_role.sql \
            bash scripts/apply-supabase-migrations-in-order.sh compact-outflow-clean/pre-ledger-migrations \
            2>&1 | tee compact-outflow-clean/pre-ledger-migration-chain.log
          test "$(grep -c '^skipping_environment_bound_migration=' compact-outflow-clean/pre-ledger-migration-chain.log)" -eq 8
          ! grep -q 'applying_migration=2026081614150' compact-outflow-clean/pre-ledger-migration-chain.log

      - name: Run isolated legacy Compact regressions before ledger migrations
        shell: bash
        run: |
          set -euo pipefail
          : > compact-outflow-clean/pre-ledger-regressions.log
          for suite in mpgf_public_goods_compacts_lifecycle mpgf_public_goods_compacts_historical_freeze; do
            psql "$LOCAL_SUPABASE_DB_URL" --no-psqlrc --set ON_ERROR_STOP=1 <<SQL | tee -a compact-outflow-clean/pre-ledger-regressions.log
          begin;
          \i compact-outflow-clean/normalized-tests/${suite}.sql
          rollback;
          SQL
          done

      - name: Apply authoritative outflow ledger migrations
        shell: bash
        run: |
          set -euo pipefail
          : > compact-outflow-clean/ledger-migration-chain.log
          for migration in \
            compact-outflow-clean/ledger-migrations/20260816141500_compact_authoritative_outflow_ledger_v1.sql \
            compact-outflow-clean/ledger-migrations/20260816141501_compact_authoritative_outflow_freeze_v1.sql \
            compact-outflow-clean/ledger-migrations/20260816141502_compact_authoritative_outflow_hardening_v1.sql \
            compact-outflow-clean/ledger-migrations/20260816141503_compact_authoritative_outflow_replay_fix_v1.sql; do
            psql "$LOCAL_SUPABASE_DB_URL" --no-psqlrc --set ON_ERROR_STOP=1 --file "$migration" | tee -a compact-outflow-clean/ledger-migration-chain.log
          done
          test "$(grep -c '^COMMIT$' compact-outflow-clean/ledger-migration-chain.log)" -eq 4

'''
          replace_between(r'^      - name: Apply baseline and (?:every|pre-ledger).*\n', r'^      - name: Generate and compare exact public runtime types\n', apply)

          lifecycle = r'''      - name: Run database lint and isolated final-ledger suites
        shell: bash
        run: |
          set -euo pipefail
          supabase db lint --db-url "$LOCAL_SUPABASE_DB_URL" --schema public --level warning --fail-on none 2>&1 | tee compact-outflow-clean/supabase-db-lint.log
          supabase db lint --db-url "$LOCAL_SUPABASE_DB_URL" --schema moral_trade_private --level warning --fail-on none 2>&1 | tee compact-outflow-clean/private-db-lint.log
          node scripts/verify-mpgf-public-goods-compacts-db-lint.mjs compact-outflow-clean/supabase-db-lint.log | tee compact-outflow-clean/supabase-db-lint-owned-gate.json
          : > compact-outflow-clean/final-ledger-lifecycle.log
          for suite in compact_authoritative_outflow_ledger_core compact_authoritative_outflow_ledger_authorization; do
            psql "$LOCAL_SUPABASE_DB_URL" --no-psqlrc --set ON_ERROR_STOP=1 <<SQL | tee -a compact-outflow-clean/final-ledger-lifecycle.log
          begin;
          \i compact-outflow-clean/normalized-tests/${suite}.sql
          rollback;
          SQL
          done

'''
          replace_between(r'^      - name: Run database lint and .*lifecycle suites\n', r'^      - name: Run genuinely concurrent canonical freeze\n', lifecycle)

          rollback_prepare = r'''      - name: Prepare rollback-only migrations and normalized tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p compact-outflow-rollback/migrations compact-outflow-rollback/normalized-tests
          python3 - <<'PYROLLBACK'
          from pathlib import Path
          for source_path in [
              Path('supabase/migrations/20260813163052_mpgf_public_goods_compacts.sql'),
              Path('supabase/migrations/20260814031500_mpgf_public_goods_compacts_state_hardening.sql'),
              Path('supabase/migrations/20260816141500_compact_authoritative_outflow_ledger_v1.sql'),
              Path('supabase/migrations/20260816141501_compact_authoritative_outflow_freeze_v1.sql'),
              Path('supabase/migrations/20260816141502_compact_authoritative_outflow_hardening_v1.sql'),
              Path('supabase/migrations/20260816141503_compact_authoritative_outflow_replay_fix_v1.sql'),
          ]:
              lines = source_path.read_text(encoding='utf-8').splitlines()
              body = [line for line in lines if line.strip().lower() not in {'begin;', 'commit;'}]
              (Path('compact-outflow-rollback/migrations') / source_path.name).write_text('\n'.join(body) + '\n', encoding='utf-8')
          for name in [
              'mpgf_public_goods_compacts_lifecycle.sql',
              'mpgf_public_goods_compacts_historical_freeze.sql',
              'compact_authoritative_outflow_ledger_core.sql',
              'compact_authoritative_outflow_ledger_authorization.sql',
          ]:
              lines = (Path('supabase/tests') / name).read_text(encoding='utf-8').splitlines()
              lines = [line for line in lines if line.strip().lower() not in {'begin;', 'commit;', 'rollback;'}]
              (Path('compact-outflow-rollback/normalized-tests') / name).write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PYROLLBACK
          sha256sum supabase/migrations/2026081614150*_compact_authoritative_outflow_*.sql supabase/tests/compact_authoritative_outflow_ledger_*.sql > compact-outflow-rollback/source-sha256.txt

'''
          replace_between(r'^      - name: Prepare rollback-only .*\n', r'^      - name: Execute .*rollback-only authority lifecycle\n', rollback_prepare)

          rollback_execute = r'''      - name: Execute ordered rollback-only authority lifecycle
        shell: bash
        run: |
          set -o pipefail
          psql "$QA_SUPABASE_DB_URL" --no-psqlrc --set ON_ERROR_STOP=1 <<'SQL' | tee compact-outflow-rollback/lifecycle.log
          begin;
          \i supabase/migrations/20260607_moral_trade_release_gate_policy_snapshots.sql
          \i supabase/migrations/20260607_zzzzz_moral_trade_participant_eligibility_records.sql
          \i compact-outflow-rollback/migrations/20260813163052_mpgf_public_goods_compacts.sql
          \i compact-outflow-rollback/migrations/20260814031500_mpgf_public_goods_compacts_state_hardening.sql
          savepoint legacy_lifecycle;
          \i compact-outflow-rollback/normalized-tests/mpgf_public_goods_compacts_lifecycle.sql
          rollback to savepoint legacy_lifecycle;
          release savepoint legacy_lifecycle;
          savepoint legacy_historical;
          \i compact-outflow-rollback/normalized-tests/mpgf_public_goods_compacts_historical_freeze.sql
          rollback to savepoint legacy_historical;
          release savepoint legacy_historical;
          \i compact-outflow-rollback/migrations/20260816141500_compact_authoritative_outflow_ledger_v1.sql
          \i compact-outflow-rollback/migrations/20260816141501_compact_authoritative_outflow_freeze_v1.sql
          \i compact-outflow-rollback/migrations/20260816141502_compact_authoritative_outflow_hardening_v1.sql
          \i compact-outflow-rollback/migrations/20260816141503_compact_authoritative_outflow_replay_fix_v1.sql
          savepoint ledger_core;
          \i compact-outflow-rollback/normalized-tests/compact_authoritative_outflow_ledger_core.sql
          rollback to savepoint ledger_core;
          release savepoint ledger_core;
          savepoint ledger_authorization;
          \i compact-outflow-rollback/normalized-tests/compact_authoritative_outflow_ledger_authorization.sql
          rollback to savepoint ledger_authorization;
          release savepoint ledger_authorization;
          rollback;
          SQL

'''
          replace_between(r'^      - name: Execute .*rollback-only authority lifecycle\n', r'^      - name: Prove rollback and zero fixture residue\n', rollback_execute)

          # Keep safety scans focused on runtime-capable files, never their own tests/workflow literals.
          source = re.sub(
              r'          if grep -R? -E "automaticCollectionEnabled.*?^          fi\n',
              '          if grep -E "automaticCollectionEnabled[[:space:]]*[:=][[:space:]]*true|moneyMoved[[:space:]]*[:=][[:space:]]*true|activation_execution_enabled[[:space:]]*=[[:space:]]*true" docs/mpgf/compact-authoritative-outflow-ledger-v1.md src/components/mpgf/mpgf-public-goods-compacts.tsx src/lib/mpgf/compact-authoritative-outflow.ts supabase/migrations/2026081614150*_compact_authoritative_outflow_*.sql; then\n            echo "An active collection or activation effect was introduced."\n            exit 1\n          fi\n',
              source,
              count=1,
              flags=re.MULTILINE | re.DOTALL,
          )
          source = re.sub(
              r'          if grep -R? -E "createServiceClient.*?^          fi\n',
              '          if grep -E "createServiceClient|SUPABASE_SERVICE_ROLE_KEY|STRIPE_SECRET_KEY|EVERY_ORG" src/components/mpgf/mpgf-public-goods-compacts.tsx src/lib/mpgf/compact-authoritative-outflow.ts; then\n            echo "Application/runtime credential or service-role use is forbidden."\n            exit 1\n          fi\n',
              source,
              count=1,
              flags=re.MULTILINE | re.DOTALL,
          )

          path.write_text(source, encoding='utf-8')
          PY
          git diff --check
          workflow=.github/workflows/compact-authoritative-outflow-ledger-qa.yml
          for marker in 'Prepare exact split migration chain' 'isolated legacy Compact regressions' 'isolated final-ledger suites' 'savepoint legacy_lifecycle' 'savepoint ledger_authorization'; do grep -q "$marker" "$workflow"; done

      - name: Remove all one-use controllers and freeze candidate
        id: freeze
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for controller in \
            .github/workflows/repair-compact-outflow-qa.yml \
            .github/workflows/repair-compact-outflow-validation-v2.yml \
            .github/workflows/repair-compact-outflow-scope-guard-v3.yml \
            .github/workflows/repair-compact-outflow-scope-guard-v4.yml \
            .github/workflows/repair-compact-outflow-scope-guard-v5.yml \
            .github/workflows/repair-compact-outflow-phase-order-v1.yml \
            .github/workflows/complete-compact-outflow-nonhosted-v1.yml \
            .github/workflows/repair-compact-outflow-test-isolation-v2.yml \
            .github/workflows/complete-compact-outflow-nonhosted-v2.yml \
            .github/workflows/finalize-compact-outflow-validation-v3.yml; do
            git rm -f --ignore-unmatch "$controller"
          done
          git add .github/workflows/compact-authoritative-outflow-ledger-qa.yml
          git commit -m 'ci: finalize ordered Compact outflow validation'
          git push origin "HEAD:${FEATURE_BRANCH}"
          echo "candidate_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "candidate_tree=$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"

      - name: Discover and dispatch exact-head gates
        id: discover
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow list --repo "$GITHUB_REPOSITORY" --all --json id,name,path,state > /tmp/workflows.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          rows=json.loads(Path('/tmp/workflows.json').read_text())
          wanted={
            'ledger':('compact authoritative outflow ledger qa',),
            'compact':('mpgf public-goods compacts qa','mpgf public goods compacts qa'),
            'payment':('evidence payment release qa',),
            'visual':('sitewide canonical visual system','canonical visual'),
            'release':('release classification',),
          }
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as out:
            for key,needles in wanted.items():
              matches=[r for r in rows if any(n in r['name'].lower() for n in needles)]
              if len(matches)!=1 or matches[0].get('state')!='active': raise SystemExit(f'{key}: {matches}')
              out.write(f'{key}_id={matches[0]["id"]}\n{key}_path={matches[0]["path"]}\n')
          PY
          gh workflow run "${{ steps.discover.outputs.ledger_path }}" --repo "$GITHUB_REPOSITORY" --ref "$FEATURE_BRANCH" -f confirm_target="$QA_REF"
          gh workflow run "${{ steps.discover.outputs.compact_path }}" --repo "$GITHUB_REPOSITORY" --ref "$FEATURE_BRANCH" -f confirm_target="$QA_REF" || gh workflow run "${{ steps.discover.outputs.compact_path }}" --repo "$GITHUB_REPOSITORY" --ref "$FEATURE_BRANCH"
          gh workflow run "${{ steps.discover.outputs.payment_path }}" --repo "$GITHUB_REPOSITORY" --ref "$FEATURE_BRANCH"
          gh workflow run "${{ steps.discover.outputs.visual_path }}" --repo "$GITHUB_REPOSITORY" --ref "$FEATURE_BRANCH"
          gh workflow run "${{ steps.discover.outputs.release_path }}" --repo "$GITHUB_REPOSITORY" --ref "$FEATURE_BRANCH"

      - name: Wait for exact-head completion
        id: wait
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ steps.freeze.outputs.candidate_sha }}
          LEDGER_ID: ${{ steps.discover.outputs.ledger_id }}
          COMPACT_ID: ${{ steps.discover.outputs.compact_id }}
          PAYMENT_ID: ${{ steps.discover.outputs.payment_id }}
          VISUAL_ID: ${{ steps.discover.outputs.visual_id }}
          RELEASE_ID: ${{ steps.discover.outputs.release_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,subprocess,time
          from pathlib import Path
          repo=os.environ['GITHUB_REPOSITORY']; sha=os.environ['CANDIDATE_SHA']
          ids={k:int(os.environ[f'{k.upper()}_ID']) for k in ['ledger','compact','payment','visual','release']}
          selected={}; deadline=time.time()+7800
          while time.time()<deadline:
            data=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/runs','--method','GET','-f',f'head_sha={sha}','-f','per_page=100','-f','exclude_pull_requests=false'],text=True))
            for key,wid in ids.items():
              rows=[r for r in data.get('workflow_runs',[]) if r.get('workflow_id')==wid and r.get('head_sha')==sha]
              if rows: selected[key]=sorted(rows,key=lambda r:r['id'],reverse=True)[0]
            if len(selected)==len(ids) and all(r['status']=='completed' for r in selected.values()): break
            time.sleep(20)
          else: raise SystemExit(f'timeout: {selected}')
          report={k:{'id':r['id'],'name':r['name'],'conclusion':r['conclusion'],'url':r['html_url'],'head_sha':r['head_sha']} for k,r in selected.items()}
          Path('/tmp/runs.json').write_text(json.dumps(report,indent=2)+'\n')
          failed={k:v for k,v in report.items() if v['conclusion']!='success'}
          if failed: raise SystemExit(json.dumps(failed,indent=2))
          PY

      - name: Publish definitive non-hosted success
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ steps.freeze.outputs.candidate_sha }}
          CANDIDATE_TREE: ${{ steps.freeze.outputs.candidate_tree }}
        run: |
          runs="$(cat /tmp/runs.json)"
          body=$(cat <<EOF
          ### Definitive ordered exact-head validation passed

          - Candidate: \`$CANDIDATE_SHA\`
          - Tree: \`$CANDIDATE_TREE\`
          - Stack base: \`$STACK_BASE_SHA\`
          - Frozen differential: exactly the 14 ledger files; all one-use feature-branch controllers were removed.
          - Legacy Compact regressions ran before ledger migrations in isolated transactions.
          - Final ledger suites ran after all four ledger migrations.
          - Isolated QA retained one outer rollback transaction with per-suite savepoints.

          \`\`\`json
          $runs
          \`\`\`

          This completes the non-hosted implementation/validation sequence. It is not merge, deployment, persistent migration, provider, payment, activation, electorate, alias, or recruitment authorization. Protected isolated-QA hosted UAT is the next sequence.
          EOF
          )
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$body"
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$body"

      - name: Publish fail-closed result
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ steps.freeze.outputs.candidate_sha }}
        run: |
          body="Definitive issue #734 validation stopped fail closed for candidate \`${CANDIDATE_SHA:-unknown}\`. No hosted Preview or release mutation was authorized. Controller: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$body" || true
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$body" || true
