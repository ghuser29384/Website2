name: Export Apple auth source 20260731

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Record exact source commit
        run: |
          git rev-parse HEAD > SOURCE_COMMIT.txt
          git status --short

      - name: Package repository source
        run: |
          tar --exclude=.git --exclude=node_modules --exclude=.next -czf /tmp/moraltrade-source.tgz .

      - name: Upload source bundle
        uses: actions/upload-artifact@v4
        with:
          name: moraltrade-apple-auth-source
          path: /tmp/moraltrade-source.tgz
          if-no-files-found: error
          retention-days: 1

  credential-presence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APPLE_OAUTH_CLIENT_ID: ${{ secrets.APPLE_OAUTH_CLIENT_ID }}
      APPLE_OAUTH_CLIENT_SECRET: ${{ secrets.APPLE_OAUTH_CLIENT_SECRET }}
      APPLE_CLIENT_ID: ${{ secrets.APPLE_CLIENT_ID }}
      APPLE_CLIENT_SECRET: ${{ secrets.APPLE_CLIENT_SECRET }}
      APPLE_SERVICE_ID: ${{ secrets.APPLE_SERVICE_ID }}
      APPLE_SERVICES_ID: ${{ secrets.APPLE_SERVICES_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
      APPLE_PRIVATE_KEY: ${{ secrets.APPLE_PRIVATE_KEY }}
      APPLE_PRIVATE_KEY_P8: ${{ secrets.APPLE_PRIVATE_KEY_P8 }}
      SIGN_IN_WITH_APPLE_CLIENT_ID: ${{ secrets.SIGN_IN_WITH_APPLE_CLIENT_ID }}
      SIGN_IN_WITH_APPLE_CLIENT_SECRET: ${{ secrets.SIGN_IN_WITH_APPLE_CLIENT_SECRET }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Record repository-secret presence without exposing values
        shell: bash
        run: |
          set -euo pipefail
          : > apple-auth-credential-presence.txt
          for name in \
            APPLE_OAUTH_CLIENT_ID \
            APPLE_OAUTH_CLIENT_SECRET \
            APPLE_CLIENT_ID \
            APPLE_CLIENT_SECRET \
            APPLE_SERVICE_ID \
            APPLE_SERVICES_ID \
            APPLE_TEAM_ID \
            APPLE_KEY_ID \
            APPLE_PRIVATE_KEY \
            APPLE_PRIVATE_KEY_P8 \
            SIGN_IN_WITH_APPLE_CLIENT_ID \
            SIGN_IN_WITH_APPLE_CLIENT_SECRET \
            SUPABASE_ACCESS_TOKEN \
            SUPABASE_PROJECT_REF \
            VERCEL_TOKEN
          do
            if [[ -n "${!name:-}" ]]; then
              printf 'github:%s=configured\n' "$name" >> apple-auth-credential-presence.txt
            else
              printf 'github:%s=missing\n' "$name" >> apple-auth-credential-presence.txt
            fi
          done
          cat apple-auth-credential-presence.txt

      - name: Inspect production Vercel environment names without exposing values
        if: env.VERCEL_TOKEN != ''
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .vercel
          printf '{"orgId":"team_ySu6sF3Uho1E1GnJtCQPVEuJ","projectId":"prj_Em3j7Uj7RatX2R1ZYhla3XSHRde7"}\n' > .vercel/project.json
          umask 077
          npx --yes vercel@latest env pull /tmp/moraltrade-production.env \
            --environment=production \
            --yes \
            --token="$VERCEL_TOKEN" \
            >/tmp/vercel-env-pull.stdout \
            2>/tmp/vercel-env-pull.stderr
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('/tmp/moraltrade-production.env')
          names = []
          for line in path.read_text(encoding='utf-8').splitlines():
              match = re.match(r'^(?:export\s+)?([A-Za-z_][A-Za-z0-9_]*)=', line)
              if match:
                  names.append(match.group(1))

          interesting = sorted({
              name for name in names
              if 'APPLE' in name.upper()
              or name in {'SUPABASE_ACCESS_TOKEN', 'SUPABASE_PROJECT_REF', 'PROJECT_REF'}
          })
          output = Path('apple-auth-credential-presence.txt')
          with output.open('a', encoding='utf-8') as stream:
              if interesting:
                  for name in interesting:
                      stream.write(f'vercel:{name}=configured\n')
              else:
                  stream.write('vercel:apple-or-supabase-management-credentials=none-found\n')
          PY
          rm -f /tmp/moraltrade-production.env /tmp/vercel-env-pull.stdout /tmp/vercel-env-pull.stderr
          cat apple-auth-credential-presence.txt

      - name: Upload credential-presence report
        uses: actions/upload-artifact@v4
        with:
          name: apple-auth-credential-presence
          path: apple-auth-credential-presence.txt
          if-no-files-found: error
          retention-days: 1

  apple-provider-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: https://jnpoxvalyjtdghnperyu.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_Pcmy5vefKiaEhuYTOSU75Q_NklsZOrT
    steps:
      - name: Probe Apple OAuth and ID-token paths without authenticating a user
        shell: bash
        run: |
          set -euo pipefail
          : > apple-provider-probe.txt

          settings_status=$(curl --silent --show-error \
            --output /tmp/settings.json \
            --write-out '%{http_code}' \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -H "authorization: Bearer $SUPABASE_PUBLISHABLE_KEY" \
            "$SUPABASE_URL/auth/v1/settings")
          python3 - "$settings_status" <<'PY' >> apple-provider-probe.txt
          import json
          import sys
          from pathlib import Path

          status = sys.argv[1]
          payload = json.loads(Path('/tmp/settings.json').read_text(encoding='utf-8'))
          print(f'settings_status={status}')
          print(f'settings_external_apple={payload.get("external", {}).get("apple") is True}')
          PY

          oauth_status=$(curl --silent --show-error \
            --output /tmp/oauth-body.txt \
            --write-out '%{http_code}' \
            --max-redirs 0 \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -H "authorization: Bearer $SUPABASE_PUBLISHABLE_KEY" \
            "$SUPABASE_URL/auth/v1/authorize?provider=apple&redirect_to=https%3A%2F%2Fwww.moraltrade.org%2Fauth%2Fconfirm%3Fnext%3D%252Fdashboard%26mode%3Dlogin" \
            || true)
          printf 'oauth_authorize_status=%s\n' "$oauth_status" >> apple-provider-probe.txt
          python3 - <<'PY' >> apple-provider-probe.txt
          import json
          from pathlib import Path

          text = Path('/tmp/oauth-body.txt').read_text(encoding='utf-8', errors='replace').strip()
          try:
              payload = json.loads(text)
          except json.JSONDecodeError:
              payload = {}
          print(f'oauth_authorize_error_code={payload.get("error_code", "") or "none"}')
          print(f'oauth_authorize_message={payload.get("msg", payload.get("message", "")) or "none"}')
          PY

          probe_token=$(python3 - <<'PY'
          import base64
          import json
          import time

          def encode(value):
              raw = json.dumps(value, separators=(',', ':')).encode()
              return base64.urlsafe_b64encode(raw).decode().rstrip('=')

          now = int(time.time())
          print('.'.join([
              encode({'alg': 'RS256', 'kid': 'PROBEKEY01'}),
              encode({
                  'iss': 'https://appleid.apple.com',
                  'aud': 'org.moraltrade.web',
                  'sub': 'apple-provider-probe',
                  'iat': now,
                  'exp': now + 300,
                  'nonce': 'apple-provider-probe',
              }),
              'invalid-signature',
          ]))
          PY
          )

          id_token_status=$(curl --silent --show-error \
            --output /tmp/id-token-body.txt \
            --write-out '%{http_code}' \
            -X POST \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -H "authorization: Bearer $SUPABASE_PUBLISHABLE_KEY" \
            -H 'content-type: application/json' \
            --data "{\"provider\":\"apple\",\"id_token\":\"$probe_token\",\"nonce\":\"apple-provider-probe\"}" \
            "$SUPABASE_URL/auth/v1/token?grant_type=id_token")
          printf 'id_token_status=%s\n' "$id_token_status" >> apple-provider-probe.txt
          python3 - <<'PY' >> apple-provider-probe.txt
          import json
          from pathlib import Path

          text = Path('/tmp/id-token-body.txt').read_text(encoding='utf-8', errors='replace').strip()
          try:
              payload = json.loads(text)
          except json.JSONDecodeError:
              payload = {}
          print(f'id_token_error_code={payload.get("error_code", payload.get("code", "")) or "none"}')
          print(f'id_token_message={payload.get("msg", payload.get("message", payload.get("error_description", ""))) or "none"}')
          PY

          cat apple-provider-probe.txt

      - name: Upload Apple provider probe report
        uses: actions/upload-artifact@v4
        with:
          name: apple-provider-probe
          path: apple-provider-probe.txt
          if-no-files-found: error
          retention-days: 1
