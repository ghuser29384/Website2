name: Diagnose remaining Co-Act and Co-Fund browser failures

on:
  push:
    branches:
      - feature/co-act-co-fund-create-v2-20260801
    paths:
      - ".github/workflows/co-act-co-fund-review-summary-loop-repair.yml"

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: co-act-co-fund-browser-diagnostic-v7
  cancel-in-progress: false

env:
  EXPECTED_PARENT: 25c484f6da8ec9af6e14d2e9cf694f876b399c7a
  CONTROLLER_PATH: .github/workflows/co-act-co-fund-review-summary-loop-repair.yml

jobs:
  diagnose:
    if: >-
      github.repository == 'ghuser29384/Website2' &&
      github.ref == 'refs/heads/feature/co-act-co-fund-create-v2-20260801'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out exact diagnostic trigger
        uses: actions/checkout@v4
        with:
          ref: feature/co-act-co-fund-create-v2-20260801
          fetch-depth: 0

      - name: Verify exact one-file trigger
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git diff --name-only "$EXPECTED_PARENT" "$GITHUB_SHA")" = "$CONTROLLER_PATH"

      - name: Apply the proven observer-loop fix in the diagnostic worktree
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/lib/create-interface/group-contribution-client.ts')
          text = path.read_text(encoding='utf-8')
          old = '''function renderReviewSummaries(payload: GroupContributionProposalPayload): void {
            const doc = createDocument();
            const summaryOffers = doc.querySelector<HTMLElement>("#summaryOffers");
            if (!summaryOffers) return;
          '''
          new = '''function renderReviewSummaries(payload: GroupContributionProposalPayload): void {
            const doc = createDocument();
            const summaryOffers = doc.querySelector<HTMLElement>("#summaryOffers");
            if (!summaryOffers) return;

            const projectionSignature = JSON.stringify(payload);
            if (summaryOffers.dataset.mtGroupContributionSignature === projectionSignature) return;
            summaryOffers.dataset.mtGroupContributionSignature = projectionSignature;
          '''
          if text.count(old) != 1:
              raise SystemExit(f'unexpected review-summary inventory: {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Write targeted browser diagnostic
        shell: bash
        run: |
          cat > tests/co-act-co-fund-browser-diagnostic.spec.ts <<'TS'
          import { test, type FrameLocator, type Page, type Route } from "@playwright/test";

          const RESUME_KEY = "moral_trade_create_resume_v1";
          const GROUP_KEY = "mt:create:group-contribution-drafts:v1";

          async function openConcreteOfferStep(page: Page): Promise<FrameLocator> {
            await page.goto("/trades/new");
            await page.waitForLoadState("domcontentloaded");
            const create = page.frameLocator('iframe[title="Moral Trade Create"]');
            await create.getByRole("button", { name: "Future flourishing" }).click();
            await create.locator('[data-request-kind="commitment"]').click();
            await create.getByLabel("What commitment do you want?").fill(
              "Not eat meat for one meal per week",
            );
            await create.locator("#continueRequest").click();
            await create.getByRole("button", { name: "A behavior change" }).click();
            await create.getByRole("button", { name: "Money" }).click();
            await create.locator("#continueOffers").click();
            await create
              .locator('[data-offer-entry-block][data-offer-id="behavior"] [data-offer-field="action"]')
              .fill("Avoid meat for one meal per week");
            await create
              .locator('[data-offer-entry-block][data-offer-id="behavior"] [data-offer-field="duration"]')
              .fill("once per week for 12 weeks");
            await create
              .locator('[data-offer-entry-block][data-offer-id="money"] [data-offer-field="amount"]')
              .fill("5.00");
            await create
              .locator('[data-offer-entry-block][data-offer-id="money"] [data-offer-field="organization"]')
              .fill("Existential Risk Research Project");
            return create;
          }

          function behaviorHost(create: FrameLocator) {
            return create.locator(
              '[data-offer-entry-block][data-offer-id="behavior"] + [data-mt-group-contribution-host]',
            );
          }

          function fundingHost(create: FrameLocator) {
            return create.locator(
              '[data-offer-entry-block][data-offer-id="money"] + [data-mt-group-contribution-host]',
            );
          }

          test("records the incomplete Co-Fund Shadow DOM state", async ({ page }) => {
            const create = await openConcreteOfferStep(page);
            const host = fundingHost(create);
            await host.getByRole("button", { name: "Fund together" }).click();
            await page.waitForTimeout(750);
            const snapshot = await host.evaluate((element, keys) => {
              const root = element.shadowRoot;
              return {
                html: root?.innerHTML ?? null,
                text: root?.textContent ?? null,
                validationHtml: root?.querySelector<HTMLElement>("[data-validation]")?.innerHTML ?? null,
                buttons: [...(root?.querySelectorAll<HTMLElement>("[data-mode]") ?? [])].map((button) => ({
                  mode: button.dataset.mode,
                  pressed: button.getAttribute("aria-pressed"),
                })),
                groupDrafts: localStorage.getItem(keys.group),
              };
            }, { group: GROUP_KEY });
            console.log(`COFUND_DIAGNOSTIC=${JSON.stringify(snapshot)}`);
          });

          test("records storage and active screens across the authentication handoff", async ({ page }) => {
            await page.route("**/api/create/publish", async (route: Route) => {
              await route.fulfill({
                status: 401,
                contentType: "application/json",
                body: JSON.stringify({
                  ok: false,
                  requiresAuth: true,
                  message: "Sign in to submit this Create record.",
                  loginUrl: "/trades/new?resume=create",
                }),
              });
            });

            const create = await openConcreteOfferStep(page);
            const coAct = behaviorHost(create);
            await coAct.getByRole("button", { name: "Act together" }).click();
            await coAct.getByLabel("Yes, include the counterparty").check();
            await coAct.getByLabel("Maximum participants").fill("17");
            await create.locator("#reviewOffers").click();
            await create.locator("label.publish-confirm").click();

            const beforeFrame = await create.locator("body").evaluate((_, keys) => ({
              resume: sessionStorage.getItem(keys.resume),
              group: localStorage.getItem(keys.group),
              heading: document.querySelector<HTMLElement>("#summaryHeading")?.textContent ?? null,
              active: [...document.querySelectorAll<HTMLElement>("[id^='screen']")]
                .filter((node) => !node.hidden)
                .map((node) => node.id),
            }), { resume: RESUME_KEY, group: GROUP_KEY });
            const beforeTop = await page.evaluate((key) => sessionStorage.getItem(key), RESUME_KEY);
            console.log(`AUTH_BEFORE_FRAME=${JSON.stringify(beforeFrame)}`);
            console.log(`AUTH_BEFORE_TOP=${JSON.stringify(beforeTop)}`);

            await create.getByRole("button", { name: /Submit for review/ }).click();
            await page.waitForURL(/\/trades\/new\?resume=create$/);
            await page.waitForTimeout(1250);

            const resumed = page.frameLocator('iframe[title="Moral Trade Create"]');
            const afterFrame = await resumed.locator("body").evaluate((_, keys) => ({
              resume: sessionStorage.getItem(keys.resume),
              group: localStorage.getItem(keys.group),
              heading: document.querySelector<HTMLElement>("#summaryHeading")?.textContent ?? null,
              active: [...document.querySelectorAll<HTMLElement>("[id^='screen']")]
                .filter((node) => !node.hidden)
                .map((node) => node.id),
              bodyPrefix: document.body.innerText.slice(0, 600),
            }), { resume: RESUME_KEY, group: GROUP_KEY });
            const afterTop = await page.evaluate((key) => sessionStorage.getItem(key), RESUME_KEY);
            console.log(`AUTH_AFTER_FRAME=${JSON.stringify(afterFrame)}`);
            console.log(`AUTH_AFTER_TOP=${JSON.stringify(afterTop)}`);
          });
          TS
          sed -i 's/^          //' tests/co-act-co-fund-browser-diagnostic.spec.ts

      - name: Install dependencies and Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run diagnostic
        env:
          CREATE_ROUTE_CAPTURE: "1"
        run: npx playwright test tests/co-act-co-fund-browser-diagnostic.spec.ts --reporter=line

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: co-act-co-fund-browser-diagnostic-${{ github.run_id }}
          path: |
            test-results
            playwright-report
          if-no-files-found: warn
          retention-days: 7

      - name: Report diagnostic result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh pr comment 420 --repo "$GITHUB_REPOSITORY" --body \
            "Co-Act/Co-Fund remaining-browser diagnostic completed with job status \`${{ job.status }}\` in Actions run \`$GITHUB_RUN_ID\`. The decoded job log contains the \`COFUND_DIAGNOSTIC\`, \`AUTH_BEFORE_*\`, and \`AUTH_AFTER_*\` snapshots."

# Diagnostic trigger v2: 2026-08-03T15:54Z
