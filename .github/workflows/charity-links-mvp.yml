name: Official charity links MVP

on:
  pull_request:
    paths:
      - "src/app/donate/**"
      - "src/app/cohort/page.tsx"
      - "src/app/support/page.tsx"
      - "src/app/status/page.tsx"
      - "src/lib/measurement-plan.ts"
      - "config/measurement/public-route-baseline.json"
      - "src/components/analytics/funnel-tracker.tsx"
      - "src/lib/charity-links*"
      - "src/lib/growth*"
      - "src/lib/visitor-paths.ts"
      - "tests/charity-links.spec.ts"
      - ".github/workflows/charity-links-mvp.yml"

permissions:
  contents: read

concurrency:
  group: charity-links-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      MORAL_TRADE_DISABLE_SUPABASE: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run repository unit tests
        run: npm test
      - name: Lint and type-check
        run: |
          npm run lint
          npx tsc --noEmit
      - name: Install browser for local-only QA
        run: npx playwright install --with-deps chromium
      - name: Build without database or payment credentials
        env:
          VERCEL: '1'
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run build
      - name: Check desktop, mobile, repeat clicks, and analytics opt-out
        env:
          PLAYWRIGHT_USE_PRODUCTION_SERVER: '1'
        run: npx playwright test tests/charity-links.spec.ts --workers=1
      - name: Upload local-only browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: charity-links-browser-${{ github.sha }}
          path: |
            /tmp/charity-links-*.png
            test-results/
          retention-days: 7
          if-no-files-found: ignore
