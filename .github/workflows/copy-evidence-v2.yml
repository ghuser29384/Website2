name: Copy public evidence files v2

on:
  push:
    branches:
      - feature/public-evidence-desk-v2
    paths:
      - .github/workflows/copy-evidence-v2.yml

permissions:
  contents: write

jobs:
  copy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/public-evidence-desk-v2
          fetch-depth: 0
      - run: |
          set -euo pipefail
          git fetch origin feature/public-evidence-desk
          git checkout origin/feature/public-evidence-desk -- 'src/app/evidence/[[...recordId]]/page.tsx' supabase/migrations/20260718130000_public_trade_evidence.sql
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- 'src/app/evidence/[[...recordId]]/page.tsx' supabase/migrations/20260718130000_public_trade_evidence.sql
          git rm -- .github/workflows/copy-evidence-v2.yml
          git commit -m "Copy integrated evidence desk source"
          git push origin HEAD:feature/public-evidence-desk-v2
