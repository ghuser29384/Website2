# Registered in two steps so the branch workflow is present before its triggering update.
name: Bootstrap pre-activation baseline boundary files

on:
  push:
    branches:
      - database/preactivation-schema-baseline-20260818
    paths:
      - .github/workflows/bootstrap-preactivation-baseline-files.yml

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: database/preactivation-schema-baseline-20260818
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Materialize reviewed bootstrap files
        shell: bash
        env:
          ARCHIVE_BLOB_SHA: 8ca1baca93806f8827607322746b8c0f82d081a4
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "${{ github.ref_name }}" = "database/preactivation-schema-baseline-20260818"
          curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/git/blobs/$ARCHIVE_BLOB_SHA" \
            | jq -r '.content' | tr -d '\n' | base64 --decode > /tmp/preactivation-bootstrap.tar.gz
          test "$(sha256sum /tmp/preactivation-bootstrap.tar.gz | awk '{print $1}')" = \
            "2aaf44ecf15bb53aea22db10b2589dad93e3a687c917e964a9aa5a1f60b47c78"
          python3 - <<'PY'
          import tarfile
          allowed = {
              "scripts/database/preactivation-catalog.sql",
              "scripts/database/generate-preactivation-baseline.sh",
              "scripts/database/validate-preactivation-baseline.sh",
              "docs/database/preactivation-schema-baseline.md",
              ".github/workflows/generate-preactivation-baseline.yml",
              ".github/workflows/validate-preactivation-baseline.yml",
          }
          with tarfile.open("/tmp/preactivation-bootstrap.tar.gz", mode="r:gz") as archive:
              members = archive.getmembers()
              names = {member.name for member in members}
              if names != allowed:
                  raise SystemExit(f"Unexpected archive paths: {sorted(names ^ allowed)}")
              for member in members:
                  if member.isdir() or member.issym() or member.islnk():
                      raise SystemExit(f"Unsafe archive member: {member.name}")
              archive.extractall(".")
          PY
          chmod 0755 \
            scripts/database/generate-preactivation-baseline.sh \
            scripts/database/validate-preactivation-baseline.sh
          rm .github/workflows/bootstrap-preactivation-baseline-files.yml
          bash -n scripts/database/generate-preactivation-baseline.sh
          bash -n scripts/database/validate-preactivation-baseline.sh
          git diff --check
          git status --short

      - name: Commit and push normally
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add authoritative pre-activation Supabase baseline boundary"
          git push origin HEAD:database/preactivation-schema-baseline-20260818
