name: PR 212 integrated post-cleanup gate

on:
  push:
    branches:
      - agent/pr212-main-integration-ops-20260730
    paths:
      - .github/workflows/pr212-integrated-postcleanup-gate.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr212-integrated-postcleanup-gate
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      CANDIDATE_BRANCH: agent/pr212-main-integrated-20260731
      CANDIDATE_SHA: 6e4deac3530e8f0989b457d082e6efd11b2fa34e
      PINNED_MAIN_SHA: 36650b48f9e664ea6d67c0840cf6a803060e8d7c
      PR_OLD_HEAD: 9ec3bd79618a704469bc4f3547d2d8a1e4dc2730
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      SITE_URL: http://127.0.0.1:3000
      INSTITUTIONAL_TRADES_ENABLED: "true"
      INSTITUTIONAL_POOLS_ENABLED: "true"
      INSTITUTIONAL_ENTERPRISE_API_ENABLED: "true"
      INSTITUTIONAL_WEBHOOKS_ENABLED: "true"

    steps:
      - name: Check out exact integrated candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0

      - name: Verify exact refs, ancestry, and audited file inventory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p pr212-postcleanup-evidence
          remote_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          remote_candidate="$(git ls-remote origin "refs/heads/${CANDIDATE_BRANCH}" | awk '{print $1}')"
          remote_pr="$(git ls-remote origin refs/heads/feat/institutional-trade-system | awk '{print $1}')"
          test "$remote_main" = "$PINNED_MAIN_SHA"
          test "$remote_candidate" = "$CANDIDATE_SHA"
          test "$remote_pr" = "$PR_OLD_HEAD"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git merge-base --is-ancestor "$PINNED_MAIN_SHA" "$CANDIDATE_SHA"
          git merge-base --is-ancestor "$PR_OLD_HEAD" "$CANDIDATE_SHA"

          cat > /tmp/expected-files.txt <<'FILES'
          .env.example
          .github/scripts/institutional-differential-typecheck.sh
          .github/scripts/institutional-trade-qa-e2e.mjs
          .github/workflows/institutional-trade-qa.yml
          src/app/admin/institutional-deal-desk/page.tsx
          src/app/admin/page.tsx
          src/app/institutions/[organizationId]/deals/[dealId]/page.tsx
          src/app/institutions/[organizationId]/page.tsx
          src/app/institutions/actions.ts
          src/app/institutions/consents/[consentId]/page.tsx
          src/app/institutions/individual/deals/[dealId]/page.tsx
          src/app/institutions/individual/page.tsx
          src/app/institutions/institutions.module.css
          src/app/institutions/new/page.tsx
          src/app/institutions/page.tsx
          src/app/institutions/verifier-assignments/[assignmentId]/page.tsx
          src/components/institutions/institutional-deal-workspace.tsx
          src/components/institutions/institutional-organization-administration.tsx
          src/components/institutions/institutional-pool-workspace.tsx
          src/components/institutions/institutional-ui.tsx
          src/institutional-authorization-snapshot.test.ts
          src/institutional-individual-capacity.test.ts
          src/institutional-product-completeness.test.ts
          src/institutional-trade-migration.test.ts
          src/institutional-trade-wiring.test.ts
          src/lib/discovery-ranking.test.ts
          src/lib/funding.test.ts
          src/lib/institutional-data.ts
          src/lib/institutional-feature-gates.ts
          src/lib/institutional-trade.test.ts
          src/lib/institutional-trade.ts
          src/lib/institutional-webhooks.test.ts
          src/lib/institutional-webhooks.ts
          src/lib/mpgf/failure-bonus-operator.test.ts
          src/lib/payments/conditional-state.test.ts
          src/lib/public-route-smoke.test.ts
          src/lib/recommendation-training-execution.test.ts
          src/lib/x-profile-connector.test.ts
          supabase/migrations/20260726123000_institutional_trade_system.sql
          tsconfig.json
          FILES
          sort -o /tmp/expected-files.txt /tmp/expected-files.txt
          git diff --name-only "$PINNED_MAIN_SHA" "$CANDIDATE_SHA" | sort > /tmp/actual-files.txt
          diff -u /tmp/expected-files.txt /tmp/actual-files.txt
          ! git ls-tree -r --name-only HEAD | grep -E '(^|/)pr212-main-integration-evidence/|pr212-clean-reconstruction-gates\.yml$'

          {
            printf 'candidate_sha=%s\n' "$CANDIDATE_SHA"
            printf 'candidate_tree=%s\n' "$(git rev-parse HEAD^{tree})"
            printf 'pinned_main_sha=%s\n' "$PINNED_MAIN_SHA"
            printf 'old_pr_head=%s\n' "$PR_OLD_HEAD"
          } | tee pr212-postcleanup-evidence/exact-refs.txt
          cp /tmp/actual-files.txt pr212-postcleanup-evidence/audited-files.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies with transient-registry retry
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            if npm ci; then exit 0; fi
            if (( attempt == 4 )); then exit 1; fi
            sleep $((attempt * 20))
          done

      - name: Run institutional and conflict-adjacent source contracts
        shell: bash
        run: |
          set -euo pipefail
          node --import tsx --test \
            src/institutional-authorization-snapshot.test.ts \
            src/institutional-individual-capacity.test.ts \
            src/institutional-product-completeness.test.ts \
            src/institutional-trade-migration.test.ts \
            src/institutional-trade-wiring.test.ts \
            src/lib/institutional-trade.test.ts \
            src/lib/institutional-webhooks.test.ts \
            src/lib/crawlability.test.ts \
            src/lib/public-route-smoke.test.ts \
            src/proxy.test.ts \
            src/walkthrough-production-shell.test.ts \
            | tee pr212-postcleanup-evidence/source-contracts.log
          node --check .github/scripts/institutional-trade-qa-e2e.mjs

      - name: Require absolute TypeScript success
        run: npx tsc --noEmit --pretty false | tee pr212-postcleanup-evidence/typescript.log

      - name: Require absolute ESLint success
        run: npm run lint | tee pr212-postcleanup-evidence/eslint.log

      - name: Require absolute production build success
        run: npm run build | tee pr212-postcleanup-evidence/build.log

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start exact production build
        shell: bash
        run: |
          set -euo pipefail
          npm start -- --hostname 127.0.0.1 --port 3000 > pr212-postcleanup-evidence/server.log 2>&1 &
          echo $! > pr212-postcleanup-evidence/server.pid
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:3000/ >/dev/null; then exit 0; fi
            sleep 2
          done
          cat pr212-postcleanup-evidence/server.log >&2
          exit 1

      - name: Run desktop and mobile targeted rendered regressions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p pr212-postcleanup-evidence/screenshots
          cat > .pr212-targeted-regression.mjs <<'NODE'
          import { chromium } from "@playwright/test";
          import fs from "node:fs/promises";

          const baseURL = "http://127.0.0.1:3000";
          const browser = await chromium.launch({ headless: true });
          const devices = [
            { name: "desktop", viewport: { width: 1440, height: 1000 } },
            { name: "mobile", viewport: { width: 390, height: 844 }, isMobile: true, hasTouch: true },
          ];
          const report = [];

          async function inspect(context, deviceName, name, path, assertion) {
            const page = await context.newPage();
            const consoleErrors = [];
            const pageErrors = [];
            const serverErrors = [];
            page.on("console", (message) => {
              if (message.type() === "error") consoleErrors.push(message.text());
            });
            page.on("pageerror", (error) => pageErrors.push(String(error)));
            page.on("response", (response) => {
              if (response.status() >= 500) serverErrors.push(`${response.status()} ${response.url()}`);
            });

            const response = await page.goto(`${baseURL}${path}`, { waitUntil: "networkidle" });
            if (!response || response.status() >= 500) throw new Error(`${deviceName}/${name}: initial response failed`);
            await assertion(page);
            await page.screenshot({ path: `pr212-postcleanup-evidence/screenshots/${deviceName}-${name}.png`, fullPage: true });
            if (consoleErrors.length || pageErrors.length || serverErrors.length) {
              throw new Error(`${deviceName}/${name}: console=${JSON.stringify(consoleErrors)} page=${JSON.stringify(pageErrors)} server=${JSON.stringify(serverErrors)}`);
            }
            report.push({ device: deviceName, name, path, finalURL: page.url(), status: response.status() });
            await page.close();
          }

          for (const device of devices) {
            const context = await browser.newContext({ viewport: device.viewport, isMobile: device.isMobile, hasTouch: device.hasTouch });

            await inspect(context, device.name, "home-navigation", "/", async (page) => {
              await page.locator("body").waitFor({ state: "visible" });
              const hrefs = await page.locator('a[href]').evaluateAll((links) => links.map((link) => link.getAttribute('href') || ''));
              if (!hrefs.some((href) => href.startsWith('/offers'))) throw new Error("Home navigation has no Offers destination.");
              if (!hrefs.some((href) => href === '/trades/new' || href === '/create')) throw new Error("Home navigation has no Create destination.");
            });

            await inspect(context, device.name, "offers-visual-directory", "/offers?view=live", async (page) => {
              await page.locator("body").waitFor({ state: "visible" });
              await page.waitForTimeout(1200);
              const bodyText = await page.locator("body").innerText();
              if (!/Offers|opportunities|market|worked examples/i.test(bodyText)) throw new Error("Offers directory did not render recognizable content.");
              const visual = page.locator('[data-visual-offer-grid="true"]');
              const fallback = page.locator(".mt-directory-view .mt-market-grid");
              if (!(await visual.count()) && !(await fallback.count())) throw new Error("Offers rendered neither visual nor server fallback grid.");
            });

            const completeBase = "/complete-profile?source=walkthrough&cause_area=Animal%20welfare&walkthrough_cause=Factory%20farming&offer_type=Money&match_name=Animal%20welfare&match_get=More%20animal%20welfare%20funding&match_give=Research%20time";
            await inspect(context, device.name, "complete-profile-connections", completeBase, async (page) => {
              await page.getByRole("button", { name: /Sources/i }).waitFor({ state: "visible" });
              if (await page.getByRole("dialog").count()) throw new Error("Connections dialog opened without a panel request.");
              await page.goto(`${baseURL}${completeBase}&panel=connections`, { waitUntil: "networkidle" });
              await page.getByRole("dialog").waitFor({ state: "visible" });
              await page.getByRole("button", { name: /Close account sources/i }).click();
              await page.getByRole("dialog").waitFor({ state: "hidden" });
            });

            await inspect(context, device.name, "create", "/trades/new", async (page) => {
              await page.locator("body").waitFor({ state: "visible" });
              const text = await page.locator("body").innerText();
              if (!/Create|Fund|Commit|Skill|Donation Upgrade/i.test(text)) throw new Error("Create did not render a primary creation mode.");
              if (/Delegated authority|Institutional budgets|Enterprise integrations/i.test(text)) throw new Error("Organization-only controls leaked into ordinary Create.");
            });

            await inspect(context, device.name, "feed", "/feed", async (page) => {
              await page.locator("body").waitFor({ state: "visible" });
              const pathname = new URL(page.url()).pathname;
              if (pathname !== "/feed" && pathname !== "/login") throw new Error(`Unexpected Feed destination: ${page.url()}`);
            });

            await inspect(context, device.name, "walkthrough", "/walkthrough", async (page) => {
              await page.locator("body").waitFor({ state: "visible" });
              const text = await page.locator("body").innerText();
              if (/Skip walkthrough|Skip for now/i.test(text)) throw new Error("Walkthrough exposes a skip control.");
            });

            await inspect(context, device.name, "evidence", "/evidence", async (page) => {
              await page.locator("body").waitFor({ state: "visible" });
              const pathname = new URL(page.url()).pathname;
              if (pathname !== "/evidence" && pathname !== "/login") throw new Error(`Unexpected Evidence destination: ${page.url()}`);
            });

            await inspect(context, device.name, "admin-navigation", "/admin", async (page) => {
              await page.locator("body").waitFor({ state: "visible" });
              const pathname = new URL(page.url()).pathname;
              if (pathname !== "/admin" && pathname !== "/login") throw new Error(`Unexpected Admin destination: ${page.url()}`);
            });

            await inspect(context, device.name, "authentication-return", "/login?returnTo=%2Fadmin", async (page) => {
              await page.locator("body").waitFor({ state: "visible" });
              if (new URL(page.url()).pathname !== "/login") throw new Error(`Authentication redirect loop: ${page.url()}`);
            });

            await context.close();
          }

          await fs.writeFile("pr212-postcleanup-evidence/rendered-regression-report.json", `${JSON.stringify(report, null, 2)}\n`);
          await browser.close();
          NODE
          node .pr212-targeted-regression.mjs
          rm -f .pr212-targeted-regression.mjs

      - name: Confirm main and candidate did not move during validation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$PINNED_MAIN_SHA"
          test "$(git ls-remote origin "refs/heads/${CANDIDATE_BRANCH}" | awk '{print $1}')" = "$CANDIDATE_SHA"
          test "$(git ls-remote origin refs/heads/feat/institutional-trade-system | awk '{print $1}')" = "$PR_OLD_HEAD"

      - name: Stop exact production build
        if: always()
        shell: bash
        run: |
          if [[ -f pr212-postcleanup-evidence/server.pid ]]; then
            kill "$(cat pr212-postcleanup-evidence/server.pid)" 2>/dev/null || true
          fi
          rm -f .pr212-targeted-regression.mjs

      - name: Upload exact post-cleanup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr212-integrated-postcleanup-${{ github.run_id }}
          path: pr212-postcleanup-evidence
          if-no-files-found: warn
          retention-days: 14
