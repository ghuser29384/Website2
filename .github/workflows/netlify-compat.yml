name: Netlify compatibility only
on:
  push:
    branches: [build/netlify-normativity-db-20261024]
permissions:
  contents: read
concurrency:
  group: netlify-normativity-db-20261024
  cancel-in-progress: false
jobs:
  compatibility:
    if: github.repository == 'ghuser29384/Website2' && github.ref == 'refs/heads/build/netlify-normativity-db-20261024'
    strategy:
      fail-fast: false
      matrix:
        candidate: [normativity]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CANDIDATE: ${{ matrix.candidate }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
      - name: Assert source and no deployment
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 0bd23fa67f4e82e47b3e5efe333a62a7ce1c16b2
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --check HEAD^ HEAD
          node --input-type=module -e 'import assert from "node:assert/strict"; import {execFileSync} from "node:child_process"; import {buildVercelProjectConfig} from "./scripts/vercel-project-config.mjs"; assert.equal(buildVercelProjectConfig().git.deploymentEnabled,false); const files=execFileSync("git",["diff","--name-only","HEAD^","HEAD"],{encoding:"utf8"}).trim().split("\n"); assert(files.every(f=>f===".github/workflows/netlify-compat.yml"||f.startsWith("scripts/netlify-compat/")));'
      - name: Acquire approved runner-only dependencies
        run: bash scripts/netlify-compat/run.sh prepare
      - name: Build and test with loopback only
        run: |
          set -euo pipefail
          sudo unshare --net -- bash -c '
            set -euo pipefail
            ip link set lo up
            exec runuser -u runner -- env -i PATH="$1" HOME="$2/home" ROOT="$2" CANDIDATE="$3" OFFLINE_NAMESPACE=1 PG_BIN="$(pg_config --bindir)" bash "$2/harness/run.sh" offline
          ' _ "$PATH" "$RUNNER_TEMP/netlify-compat-$CANDIDATE" "$CANDIDATE"
      - name: Report bounded evidence
        if: always()
        run: |
          {
            echo '## Netlify compatibility — synthetic, not migration acceptance'
            result="$RUNNER_TEMP/netlify-compat-$CANDIDATE/result.json"
            if test -f "$result"; then cat "$result"; else echo 'NOT TESTED: prerequisite failed'; fi
            echo 'Hosted limits, full feature parity, database/proof and complete job acceptance remain unverified unless separately demonstrated.'
          } >> "$GITHUB_STEP_SUMMARY"
