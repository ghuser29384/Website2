name: Exact Discover visual production release 72729d80

on:
  push:
    branches:
      - release/discover-home-visual-production-72729d80

permissions:
  actions: read
  contents: read

concurrency:
  group: gated-vercel-production
  cancel-in-progress: false

env:
  EXPECTED_SHA: 72729d80bec2e4ffa147d6dc56ae703fb3e79293
  VERIFIED_HEAD_SHA: 8a4088737baa4105d27e97c244d4ae93573d30ec
  VERIFIED_TREE_SHA: f65c0ecae6db7d710c97d9de64ff83a5681e28ad
  VERIFIED_VISUAL_RUN_ID: '31349451782'
  VERIFIED_SMART_QUERY_RUN_ID: '31349451693'
  VERIFIED_CREATE_RUN_ID: '31349451711'
  VERCEL_ORG_ID: team_ySu6sF3Uho1E1GnJtCQPVEuJ
  VERCEL_PROJECT_ID: prj_Em3j7Uj7RatX2R1ZYhla3XSHRde7
  VERCEL_CLI_VERSION: 50.38.1
  RELEASE_OUTPUT_DIR: discover-home-visual-production-release

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Check out the exact merged commit
        uses: actions/checkout@v4
        with:
          ref: 72729d80bec2e4ffa147d6dc56ae703fb3e79293
          fetch-depth: 0

      - name: Guard repository, main, and immutable merged tree
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'ghuser29384/Website2'
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "${#EXPECTED_SHA}" -eq 40
          test "$(git rev-parse HEAD^{tree})" = "$VERIFIED_TREE_SHA"
          remote_main_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$remote_main_sha" = "$EXPECTED_SHA"
          git diff --check HEAD^

      - name: Prove source identity and exact successful candidate gates
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$VERIFIED_HEAD_SHA"
          test "$(git rev-parse "$VERIFIED_HEAD_SHA^{tree}")" = "$VERIFIED_TREE_SHA"

          for run_id in "$VERIFIED_VISUAL_RUN_ID" "$VERIFIED_SMART_QUERY_RUN_ID" "$VERIFIED_CREATE_RUN_ID"; do
            run_path="/tmp/run-${run_id}.json"
            curl --fail --silent --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$run_id" \
              > "$run_path"
            node - "$run_path" "$VERIFIED_HEAD_SHA" <<'NODE'
          const fs = require('node:fs');
          const [path, expectedSha] = process.argv.slice(2);
          const run = JSON.parse(fs.readFileSync(path, 'utf8'));
          if (run.status !== 'completed' || run.conclusion !== 'success' || run.head_sha !== expectedSha) {
            console.error({ id: run.id, status: run.status, conclusion: run.conclusion, head_sha: run.head_sha, expectedSha });
            process.exit(1);
          }
          console.log(`Verified run ${run.id}: ${run.conclusion} on ${run.head_sha}`);
          NODE
          done

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Run complete merged-tree quality gates
        shell: bash
        env:
          NEXT_PUBLIC_SITE_URL: https://www.moraltrade.org
          SITE_URL: https://www.moraltrade.org
          VERCEL: '1'
          VERCEL_ENV: production
        run: |
          set -euo pipefail
          node --check public/moral-trade-discover-navigation.js
          node --import tsx --test src/discover-home-visual-contract.test.ts src/lib/live-discover-navigation.test.ts
          npm run verify:discover
          npm test
          npm run lint -- --quiet
          npx tsc --noEmit
          npm run build

      - name: Run focused merged-tree desktop and mobile rendering gate
        id: browser
        shell: bash
        env:
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3210
          SITE_URL: http://127.0.0.1:3210
          PLAYWRIGHT_HTML_OPEN: never
        run: |
          set -euo pipefail
          npx playwright install --with-deps chromium
          rm -rf "$RELEASE_OUTPUT_DIR"
          mkdir -p "$RELEASE_OUTPUT_DIR"
          set +e
          npx playwright test tests/discover-home-visual-alignment.spec.ts --reporter=line \
            2>&1 | tee "$RELEASE_OUTPUT_DIR/merged-tree-browser.log"
          status=${PIPESTATUS[0]}
          set -e
          exit "$status"

      - name: Upload merged-tree rendered release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-discover-visual-merged-tree-${{ github.run_id }}-${{ env.EXPECTED_SHA }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            discover-home-visual-production-release/merged-tree-browser.log
            playwright-report
            test-results

      - name: Link only the canonical Vercel project
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' \
            "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json

      - name: Pull exact production environment
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes "vercel@$VERCEL_CLI_VERSION" pull \
            --yes \
            --environment=production \
            --token="$VERCEL_TOKEN"

      - name: Build the exact Vercel production artifact
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes "vercel@$VERCEL_CLI_VERSION" build \
            --prod \
            --token="$VERCEL_TOKEN"

      - name: Upload the already-built artifact exactly once
        id: deploy
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          deployment_url="$(npx --yes "vercel@$VERCEL_CLI_VERSION" deploy \
            --prebuilt \
            --prod \
            --token="$VERCEL_TOKEN")"
          test -n "$deployment_url"
          deployment_host="${deployment_url#https://}"
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"
          echo "deployment_host=$deployment_host" >> "$GITHUB_OUTPUT"
          printf 'Deployment URL: %s\n' "$deployment_url"

      - name: Verify the exact READY production deployment before aliasing
        id: deployment
        shell: bash
        env:
          VERCEL_TOKEN_VALUE: ${{ secrets.VERCEL_TOKEN }}
          DEPLOYMENT_HOST: ${{ steps.deploy.outputs.deployment_host }}
        run: |
          set -euo pipefail
          mkdir -p "$RELEASE_OUTPUT_DIR/aliases"
          detail_path="$RELEASE_OUTPUT_DIR/deployment-detail.json"
          detail_api="https://api.vercel.com/v13/deployments/${DEPLOYMENT_HOST}?teamId=${VERCEL_ORG_ID}"
          verified=false

          for attempt in $(seq 1 40); do
            if curl -fsS \
              -H "Authorization: Bearer ${VERCEL_TOKEN_VALUE}" \
              "$detail_api" > "$detail_path" \
              && jq -e \
                --arg project_id "$VERCEL_PROJECT_ID" \
                --arg expected_sha "$EXPECTED_SHA" '
                  (.target == "production")
                  and ((.readyState // .state // "") == "READY")
                  and ((.projectId // .project.id // "") == $project_id)
                  and ((.aliasError // null) == null)
                  and (.meta.githubCommitOrg == "ghuser29384")
                  and (.meta.githubCommitRepo == "Website2")
                  and (.meta.githubCommitSha == $expected_sha)
                ' "$detail_path" >/dev/null; then
              verified=true
              break
            fi
            sleep 5
          done

          test "$verified" = true
          deployment_id="$(jq -r '.uid // .id // empty' "$detail_path")"
          test -n "$deployment_id"
          echo "deployment_id=$deployment_id" >> "$GITHUB_OUTPUT"
          printf 'Exact deployment ID: %s\n' "$deployment_id"

      - name: Record previous canonical alias ownership
        shell: bash
        env:
          VERCEL_TOKEN_VALUE: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          for alias_name in moraltrade.org www.moraltrade.org; do
            alias_key="${alias_name//./-}"
            curl -fsS \
              -H "Authorization: Bearer ${VERCEL_TOKEN_VALUE}" \
              "https://api.vercel.com/v4/aliases/${alias_name}?projectId=${VERCEL_PROJECT_ID}&teamId=${VERCEL_ORG_ID}" \
              > "$RELEASE_OUTPUT_DIR/aliases/${alias_key}-before.json"
          done

      - name: Assign both canonical aliases to the exact deployment
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
        run: |
          set -euo pipefail
          npx --yes "vercel@$VERCEL_CLI_VERSION" alias set \
            "$DEPLOYMENT_URL" moraltrade.org \
            --token="$VERCEL_TOKEN"
          npx --yes "vercel@$VERCEL_CLI_VERSION" alias set \
            "$DEPLOYMENT_URL" www.moraltrade.org \
            --token="$VERCEL_TOKEN"

      - name: Prove both aliases resolve to the exact deployment
        shell: bash
        env:
          VERCEL_TOKEN_VALUE: ${{ secrets.VERCEL_TOKEN }}
          EXPECTED_DEPLOYMENT_ID: ${{ steps.deployment.outputs.deployment_id }}
        run: |
          set -euo pipefail
          for alias_name in moraltrade.org www.moraltrade.org; do
            alias_key="${alias_name//./-}"
            alias_path="$RELEASE_OUTPUT_DIR/aliases/${alias_key}-after.json"
            alias_api="https://api.vercel.com/v4/aliases/${alias_name}?projectId=${VERCEL_PROJECT_ID}&teamId=${VERCEL_ORG_ID}"
            verified=false

            for attempt in $(seq 1 40); do
              if curl -fsS \
                -H "Authorization: Bearer ${VERCEL_TOKEN_VALUE}" \
                "$alias_api" > "$alias_path" \
                && jq -e \
                  --arg alias_name "$alias_name" \
                  --arg project_id "$VERCEL_PROJECT_ID" \
                  --arg deployment_id "$EXPECTED_DEPLOYMENT_ID" '
                    (.alias == $alias_name)
                    and (.projectId == $project_id)
                    and ((.deploymentId // .deployment.id // .deployment.uid // "") == $deployment_id)
                  ' "$alias_path" >/dev/null; then
                verified=true
                break
              fi
              sleep 5
            done

            test "$verified" = true
          done

      - name: Verify canonical release assets and HTTP boundaries
        shell: bash
        env:
          EXPECTED_DEPLOYMENT_ID: ${{ steps.deployment.outputs.deployment_id }}
        run: |
          set -euo pipefail
          release_query="release=${EXPECTED_SHA}"
          css_url="https://www.moraltrade.org/moral-trade-discover-home-alignment.css?${release_query}"
          js_url="https://www.moraltrade.org/moral-trade-discover-navigation.js?${release_query}"
          discover_url="https://www.moraltrade.org/discover?domain=offers&view=list&${release_query}"

          verified=false
          for attempt in $(seq 1 40); do
            css_status="$(curl -fsS -o "$RELEASE_OUTPUT_DIR/discover-alignment.css" -w '%{http_code}' "$css_url" || true)"
            js_status="$(curl -fsS -o "$RELEASE_OUTPUT_DIR/discover-navigation.js" -w '%{http_code}' "$js_url" || true)"
            discover_status="$(curl -fsS -o "$RELEASE_OUTPUT_DIR/discover.html" -w '%{http_code}' "$discover_url" || true)"
            apex_status="$(curl -sS -o /dev/null -D "$RELEASE_OUTPUT_DIR/apex.headers" -w '%{http_code}' https://moraltrade.org/ || true)"

            if [[ "$css_status" == '200' ]] \
              && [[ "$js_status" == '200' ]] \
              && [[ "$discover_status" == '200' ]] \
              && [[ "$apex_status" == '308' ]] \
              && grep -Fq 'Align Discover with the canonical Moral Trade home and walkthrough language.' "$RELEASE_OUTPUT_DIR/discover-alignment.css" \
              && grep -Fq -- '--paper: #f5f2e9' "$RELEASE_OUTPUT_DIR/discover-alignment.css" \
              && grep -Fq 'moral-trade-discover-home-alignment.css?v=20260810' "$RELEASE_OUTPUT_DIR/discover-navigation.js" \
              && grep -Fq 'Focus Discover command' "$RELEASE_OUTPUT_DIR/discover-navigation.js" \
              && grep -Fq '{ label: "Evidence", path: "/evidence" }' "$RELEASE_OUTPUT_DIR/discover-navigation.js" \
              && grep -Fq 'moral-trade-discover-navigation.js' "$RELEASE_OUTPUT_DIR/discover.html" \
              && tr -d '\r' < "$RELEASE_OUTPUT_DIR/apex.headers" | grep -Fqx 'location: https://www.moraltrade.org/'; then
              verified=true
              break
            fi
            sleep 5
          done

          test "$verified" = true
          jq -n \
            --arg expectedSha "$EXPECTED_SHA" \
            --arg deploymentId "$EXPECTED_DEPLOYMENT_ID" \
            --arg cssStatus "$css_status" \
            --arg jsStatus "$js_status" \
            --arg discoverStatus "$discover_status" \
            --arg apexStatus "$apex_status" '
              {
                expectedSha: $expectedSha,
                deploymentId: $deploymentId,
                cssStatus: ($cssStatus | tonumber),
                navigationStatus: ($jsStatus | tonumber),
                discoverStatus: ($discoverStatus | tonumber),
                apexStatus: ($apexStatus | tonumber),
                exactAssetsVerified: true,
                canonicalRoutesVerified: true
              }
            ' > "$RELEASE_OUTPUT_DIR/canonical-smoke.json"

      - name: Reconfirm alias ownership after canonical smoke tests
        shell: bash
        env:
          VERCEL_TOKEN_VALUE: ${{ secrets.VERCEL_TOKEN }}
          EXPECTED_DEPLOYMENT_ID: ${{ steps.deployment.outputs.deployment_id }}
        run: |
          set -euo pipefail
          for alias_name in moraltrade.org www.moraltrade.org; do
            alias_key="${alias_name//./-}"
            alias_path="$RELEASE_OUTPUT_DIR/aliases/${alias_key}-final.json"
            curl -fsS \
              -H "Authorization: Bearer ${VERCEL_TOKEN_VALUE}" \
              "https://api.vercel.com/v4/aliases/${alias_name}?projectId=${VERCEL_PROJECT_ID}&teamId=${VERCEL_ORG_ID}" \
              > "$alias_path"
            jq -e \
              --arg alias_name "$alias_name" \
              --arg project_id "$VERCEL_PROJECT_ID" \
              --arg deployment_id "$EXPECTED_DEPLOYMENT_ID" '
                (.alias == $alias_name)
                and (.projectId == $project_id)
                and ((.deploymentId // .deployment.id // .deployment.uid // "") == $deployment_id)
              ' "$alias_path" >/dev/null
          done

      - name: Upload immutable production release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-discover-visual-production-${{ github.run_id }}-${{ env.EXPECTED_SHA }}
          if-no-files-found: error
          retention-days: 14
          path: discover-home-visual-production-release

      - name: Record immutable release summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '### Exact Discover visual production release'
            echo
            echo '- Target: `production`'
            echo '- Ref: `main`'
            echo "- Commit: \`$EXPECTED_SHA\`"
            echo "- Tree: \`$VERIFIED_TREE_SHA\` (identical to verified PR head \`$VERIFIED_HEAD_SHA\`)"
            echo "- Exact-head gates: \`$VERIFIED_VISUAL_RUN_ID\`, \`$VERIFIED_SMART_QUERY_RUN_ID\`, \`$VERIFIED_CREATE_RUN_ID\`"
            echo "- Project: \`$VERCEL_PROJECT_ID\`"
            echo "- Deployment: ${{ steps.deploy.outputs.deployment_url }}"
            echo "- Deployment ID: \`${{ steps.deployment.outputs.deployment_id }}\`"
            echo '- Canonical aliases: `moraltrade.org`, `www.moraltrade.org`'
            echo '- Canonical asset and route smoke: passed'
          } >> "$GITHUB_STEP_SUMMARY"
