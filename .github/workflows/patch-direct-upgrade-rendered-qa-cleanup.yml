name: Patch Direct Donation Upgrade rendered QA cleanup

on:
  push:
    branches:
      - feature/direct-verified-donation-upgrade-20260731
    paths:
      - .github/workflows/patch-direct-upgrade-rendered-qa-cleanup.yml

permissions:
  contents: write

concurrency:
  group: patch-direct-upgrade-rendered-qa-cleanup
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/direct-verified-donation-upgrade-20260731
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Patch synthetic one-person-account cleanup and self-remove
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          python3 - <<'PY'
          from pathlib import Path

          target = Path('.github/workflows/direct-donation-upgrade-rendered-qa.yml')
          controller = Path('.github/workflows/patch-direct-upgrade-rendered-qa-cleanup.yml')
          text = target.read_text()
          synthetic = "d1000000-0000-4000-8000-000000000001"

          initial_anchor = f"""          delete from auth.users
          where id = '{synthetic}'::uuid;
"""
          initial_replacement = f"""          delete from moral_trade_private.person_account_aliases
          where alias_profile_id = '{synthetic}'::uuid
             or canonical_profile_id = '{synthetic}'::uuid;
          delete from moral_trade_private.person_accounts
          where profile_id = '{synthetic}'::uuid;

          delete from auth.users
          where id = '{synthetic}'::uuid;
"""
          if text.count(initial_anchor) != 1:
              raise SystemExit(f'Expected one multiline auth cleanup anchor, found {text.count(initial_anchor)}')
          text = text.replace(initial_anchor, initial_replacement)

          final_anchor = f"          delete from auth.users where id='{synthetic}'::uuid;\n"
          final_replacement = f"""          delete from moral_trade_private.person_account_aliases
          where alias_profile_id='{synthetic}'::uuid
             or canonical_profile_id='{synthetic}'::uuid;
          delete from moral_trade_private.person_accounts
          where profile_id='{synthetic}'::uuid;
          delete from auth.users where id='{synthetic}'::uuid;
"""
          if text.count(final_anchor) != 1:
              raise SystemExit(f'Expected one single-line auth cleanup anchor, found {text.count(final_anchor)}')
          text = text.replace(final_anchor, final_replacement)

          verify_anchor = f"""            'profiles', (select count(*) from public.profiles where id='{synthetic}'),
            'offers', (select count(*) from public.direct_donation_upgrade_offers where creator_profile_id='{synthetic}'),
"""
          verify_replacement = f"""            'profiles', (select count(*) from public.profiles where id='{synthetic}'),
            'personAccounts', (select count(*) from moral_trade_private.person_accounts where profile_id='{synthetic}'),
            'personAccountAliases', (select count(*) from moral_trade_private.person_account_aliases where alias_profile_id='{synthetic}' or canonical_profile_id='{synthetic}'),
            'offers', (select count(*) from public.direct_donation_upgrade_offers where creator_profile_id='{synthetic}'),
"""
          if text.count(verify_anchor) != 1:
              raise SystemExit(f'Expected one cleanup-verification anchor, found {text.count(verify_anchor)}')
          text = text.replace(verify_anchor, verify_replacement)

          if text.count('delete from moral_trade_private.person_accounts') != 2:
              raise SystemExit('The rendered QA workflow must clean person_accounts in setup and teardown.')
          if text.count("'personAccounts'") != 1 or text.count("'personAccountAliases'") != 1:
              raise SystemExit('Cleanup proof must include one-person-account residue checks.')

          target.write_text(text)
          controller.unlink()
          PY

          git diff --check
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/direct-donation-upgrade-rendered-qa.yml
          git rm .github/workflows/patch-direct-upgrade-rendered-qa-cleanup.yml
          git commit -m 'Repair Direct Donation Upgrade QA identity cleanup'
          git push origin HEAD:feature/direct-verified-donation-upgrade-20260731
