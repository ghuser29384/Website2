name: PR868 dispatch protected Preview
on:
  push:
    branches: [ops/pr868-preview-reconcile-20261001]
    paths: [.github/workflows/pr868-dispatch-preview-20261001.yml]
permissions:
  contents: read
  actions: write
concurrency:
  group: pr868-dispatch-preview-20261001
  cancel-in-progress: false
jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Require completed exact-source gates and dispatch the existing workflow without changing it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = ghuser29384/Website2
          mkdir -p /tmp/pr868-dispatch
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const repo='ghuser29384/Website2',base=`https://api.github.com/repos/${repo}`;
          const headers={Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'};
          const read=async path=>{const r=await fetch(base+path,{headers,signal:AbortSignal.timeout(20000)});if(!r.ok)throw new Error(`GitHub GET HTTP ${r.status}`);return r.json();};
          const sourceRun=36908216079,bindingsRun=36909145616;
          for(let attempt=0; ;attempt++){
            const run=await read(`/actions/runs/${sourceRun}`);
            if(run.status==='completed') {if(run.conclusion!=='success')throw new Error('Reconciliation gates did not pass; no deployment dispatched');break;}
            if(attempt>=80)throw new Error('Reconciliation gates are still pending; no deployment dispatched');
            await new Promise(resolve=>setTimeout(resolve,15000));
          }
          const jobs=await read(`/actions/runs/${sourceRun}/jobs?per_page=100`);
          const required=['prepare','quality (payment)','quality (preview)','fixtures (dashboard)','fixtures (payments)','publish'];
          if(required.some(name=>!jobs.jobs.some(j=>j.name===name&&j.conclusion==='success')))throw new Error('An exact-source prerequisite is missing');
          const bindings=await read(`/actions/runs/${bindingsRun}`);
          if(bindings.conclusion!=='success')throw new Error('Isolated QA Preview public bindings are not confirmed');
          const main='ab6049702a9e70f29ccc95da6685f0e642e3c835',payment='ca557375101c5cba8990e280683ebe862f60b02e',preview='29eae507ce13cfcff22bb665b9fd19e7cdc42189';
          for(const [branch,sha] of Object.entries({'main':main,'feat/account-payment-methods-20260928':payment,'release/vercel-preview':preview})){
            const ref=await read(`/git/ref/heads/${branch}`);if(ref.object.sha!==sha)throw new Error(`Branch ${branch} moved; no deployment dispatched`);
          }
          for(const ref of [main,preview]){
            const workflow=await read(`/contents/.github/workflows/vercel-release.yml?ref=${ref}`);
            if(workflow.sha!=='e219e99d25279161b89eee80fc410912c3561a19')throw new Error('Gated release workflow changed; inspection required');
          }
          const request={ref:'main',inputs:{target:'preview',ref:'release/vercel-preview',expected_sha:preview,synthetic_auth_fixture_url:''}};
          const requestedAt=new Date().toISOString();
          const r=await fetch(base+'/actions/workflows/vercel-release.yml/dispatches',{method:'POST',headers,body:JSON.stringify(request),signal:AbortSignal.timeout(20000)});
          if(r.status!==204)throw new Error(`Gated Preview dispatch returned HTTP ${r.status}; no alternative deployment attempted`);
          const result={requestedAt,workflow:'.github/workflows/vercel-release.yml',request,sourceGateRun:sourceRun,qaBindingsRun:bindingsRun,productionAuthorized:false};
          fs.writeFileSync('/tmp/pr868-dispatch/dispatch.json',JSON.stringify(result,null,2));
          console.log(JSON.stringify(result,null,2));
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr868-preview-dispatch-${{ github.run_id }}
          path: /tmp/pr868-dispatch/dispatch.json
          retention-days: 14
