name: Reminder management verification

on:
  push:
    branches:
      - agent/manage-reminders
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reminder-management-verification
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      CONDITIONAL_PAYMENTS_MODE: disabled
      MORAL_TRADE_FUNDING_MODE: external_charities_only
      MPGF_REAL_MONEY_ENABLED: "false"
      MPGF_REAL_MONEY_ACCEPTANCE_ENABLED: "false"
      MPGF_TEST_PAYMENT_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
