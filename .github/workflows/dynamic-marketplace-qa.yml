name: Dynamic marketplace QA

on:
  pull_request:
    paths:
      - ".github/workflows/bootstrap-moraltrade-qa.yml"
      - ".github/workflows/dynamic-marketplace-qa.yml"
      - "docs/moraltrade-qa-environment.md"
      - "scripts/bootstrap-moraltrade-qa-schema.sh"
      - "scripts/configure-moraltrade-qa-vercel.sh"
      - "scripts/seed-moraltrade-qa.mjs"
      - "src/app/commitments/page.tsx"
      - "src/app/deals/**"
      - "src/app/offers/**"
      - "src/app/trades/new/page.tsx"
      - "src/components/community/comment-thread.tsx"
      - "src/components/marketplace/**"
      - "src/lib/marketplace-clearing-round*"
      - "src/lib/marketplace-offer-families*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate shell scripts
        run: |
          bash -n scripts/bootstrap-moraltrade-qa-schema.sh
          bash -n scripts/configure-moraltrade-qa-vercel.sh
          shellcheck scripts/bootstrap-moraltrade-qa-schema.sh
          shellcheck scripts/configure-moraltrade-qa-vercel.sh

      - name: Validate synthetic seed script
        run: node --check scripts/seed-moraltrade-qa.mjs

      - name: Run focused marketplace tests
        run: |
          node --import tsx --test \
            src/app/offers/dynamic-marketplace.test.ts \
            src/lib/marketplace-clearing-round.test.ts \
            src/lib/marketplace-offer-families.test.ts

      - name: Lint changed marketplace surfaces
        run: |
          npx eslint \
            src/app/commitments/page.tsx \
            src/app/deals/[agreementId]/*.tsx \
            src/app/offers/*.tsx \
            src/app/offers/[offerId]/question/*.tsx \
            src/app/trades/new/page.tsx \
            src/components/marketplace/*.tsx \
            src/lib/marketplace-clearing-round.ts \
            src/lib/marketplace-offer-families.ts
