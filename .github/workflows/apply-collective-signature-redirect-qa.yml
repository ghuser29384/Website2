name: Apply collective signature redirect QA adaptation

on:
  pull_request:
    branches:
      - feature/collective-identity-threshold-commitments-20260726
    paths:
      - ".github/scripts/patch-collective-signature-redirect-qa.py"
      - ".github/workflows/apply-collective-signature-redirect-qa.yml"

permissions:
  contents: write

concurrency:
  group: apply-collective-signature-redirect-qa-20260727
  cancel-in-progress: false

jobs:
  patch:
    if: >-
      github.event.pull_request.head.repo.full_name == 'ghuser29384/Website2' &&
      github.head_ref == 'qa/collective-commitments-adversarial-browser-20260727'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_REPOSITORY: ghuser29384/Website2
      EXPECTED_BRANCH: qa/collective-commitments-adversarial-browser-20260727
      EXPECTED_PRODUCT_BASE: 053ed422da9c5cf8c03b1c24c1bb7f2af81386e8
      ARTIFACT_DIR: ${{ github.workspace }}/collective-signature-redirect-patch-artifacts

    steps:
      - name: Validate exact execution boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY"
          test "$GITHUB_HEAD_REF" = "$EXPECTED_BRANCH"

      - name: Check out exact pull-request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Apply and publish exact redirect-aware QA patch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ARTIFACT_DIR"
          test "$(git merge-base "$EXPECTED_PRODUCT_BASE" HEAD)" = "$EXPECTED_PRODUCT_BASE"
          cp .github/scripts/patch-collective-signature-redirect-qa.py \
            "$RUNNER_TEMP/patch-collective-signature-redirect-qa.py"
          python3 "$RUNNER_TEMP/patch-collective-signature-redirect-qa.py" \
            2>&1 | tee "$ARTIFACT_DIR/patch.log"

          node --check .github/scripts/collective-commitments-adversarial-browser-qa.mjs
          grep -Fq 'async function waitForSignOutcome' \
            .github/scripts/collective-commitments-adversarial-browser-qa.mjs
          grep -Fq 'selectColumn = table === "collective_commitment_keys"' \
            .github/scripts/collective-commitments-adversarial-browser-qa.mjs
          grep -Fq 'const service = createCollectiveCommitmentServiceClient();' \
            src/lib/collective-commitments/service.ts

          git config user.name "ghuser29384"
          git config user.email "262476329+ghuser29384@users.noreply.github.com"
          git rm .github/scripts/patch-collective-signature-redirect-qa.py
          git add \
            .github/scripts/collective-commitments-adversarial-browser-qa.mjs \
            src/lib/collective-commitments/service.ts
          git diff --cached --check
          git commit -m "Adapt collective QA to server-side signature redirects"
          git push origin HEAD:"$EXPECTED_BRANCH"

          printf '%s\n' \
            "qa_head=$(git rev-parse HEAD)" \
            "redirect_aware_sign_outcomes=PASS" \
            "key_cleanup_column=PASS" \
            "signature_service_client=PASS" \
            "production_changed=NO" > "$ARTIFACT_DIR/result.txt"

      - name: Upload patch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collective-signature-redirect-patch-${{ github.run_id }}
          path: collective-signature-redirect-patch-artifacts
          if-no-files-found: warn
          retention-days: 14
