name: One-person exact-merge run inspector

on:
  issue_comment:
    types: [created]

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  inspect:
    if: >-
      github.repository == 'ghuser29384/Website2' &&
      github.event.issue.pull_request != null &&
      github.event.issue.number == 379 &&
      github.event.comment.body == '/inspect-one-person-exact-merge-run-20260801'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report exact-merge controller runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rows="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?event=issue_comment&per_page=100" --jq '.workflow_runs[] | select(.name == "One-person exact-merge QA controller") | [.id,.status,(.conclusion // "pending"),.head_sha,.created_at,.updated_at] | @tsv')"
          if [[ -z "$rows" ]]; then rows='no matching run found'; fi
          body=$'Exact-merge QA controller run inventory:\n\n```text\n'"$rows"$'\n```'
          gh pr comment 379 --repo "$GITHUB_REPOSITORY" --body "$body"
      - name: Remove temporary inspector
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          path='.github/workflows/one-person-exact-merge-run-inspector.yml'
          sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/$path?ref=main" --jq .sha 2>/dev/null || true)"
          if [[ -n "$sha" ]]; then
            jq -n --arg message 'Remove temporary one-person exact-merge run inspector' --arg sha "$sha" --arg branch main '{message:$message,sha:$sha,branch:$branch}' | gh api --method DELETE "repos/$GITHUB_REPOSITORY/contents/$path" --input - >/dev/null
          fi
