name: PR654 migration introduction map

on:
  push:
    branches:
      - qa/pr654-recovery-forensics-export-20260816
    paths:
      - .github/workflows/pr654-migration-introduction-map.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact product head with full history
        uses: actions/checkout@v4
        with:
          ref: f0ea581e8956f7987e58dd2240a7e0249bf7cb06
          fetch-depth: 0
          persist-credentials: false

      - name: Export introduction order and per-file provenance
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/pr654-migration-introduction-map"
          mkdir -p "$out"
          git log --all --reverse --diff-filter=A --date=iso-strict \
            --format='COMMIT%x09%H%x09%P%x09%aI%x09%s' \
            --name-status -- supabase/migrations \
            > "$out/addition-log.txt"
          printf 'filename\tcommit\tparents\tauthor_date\tsubject\n' \
            > "$out/per-file-introduction.tsv"
          while IFS= read -r file; do
            row="$(git log --all --diff-filter=A -1 --date=iso-strict \
              --format='%H%x09%P%x09%aI%x09%s' -- "$file")"
            printf '%s\t%s\n' "$file" "$row" \
              >> "$out/per-file-introduction.tsv"
          done < <(find supabase/migrations -maxdepth 1 -type f -name '*.sql' -print | LC_ALL=C sort)
          sha256sum "$out"/* > "$out/sha256sums.txt"
          tar -C "$(dirname "$out")" -czf \
            "$GITHUB_WORKSPACE/pr654-migration-introduction-map.tar.gz" \
            "$(basename "$out")"
          sha256sum "$GITHUB_WORKSPACE/pr654-migration-introduction-map.tar.gz" \
            > "$GITHUB_WORKSPACE/pr654-migration-introduction-map.tar.gz.sha256"

      - name: Upload introduction map
        uses: actions/upload-artifact@v4
        with:
          name: pr654-migration-introduction-map-${{ github.run_id }}
          path: |
            pr654-migration-introduction-map.tar.gz
            pr654-migration-introduction-map.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
