name: PR 552 production credential presence probe

on:
  push:
    branches:
      - ops/pr552-service-key-probe-20260807
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr552-production-credential-probe
  cancel-in-progress: false

env:
  PROD_REF: jnpoxvalyjtdghnperyu
  QA_REF: hvmxfjjbdcgjjudmthdz

jobs:
  probe-repository-secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env: &candidate_secrets
      C01_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      C02_PROD_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PROD_SUPABASE_SERVICE_ROLE_KEY }}
      C03_PRODUCTION_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PRODUCTION_SUPABASE_SERVICE_ROLE_KEY }}
      C04_MORALTRADE_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.MORALTRADE_SUPABASE_SERVICE_ROLE_KEY }}
      C05_MORAL_TRADE_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.MORAL_TRADE_SUPABASE_SERVICE_ROLE_KEY }}
      C06_MORALTRADE_PRODUCTION_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.MORALTRADE_PRODUCTION_SUPABASE_SERVICE_ROLE_KEY }}
      C07_MORAL_TRADE_PRODUCTION_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.MORAL_TRADE_PRODUCTION_SUPABASE_SERVICE_ROLE_KEY }}
      C08_SUPABASE_PROD_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_PROD_SERVICE_ROLE_KEY }}
      C09_SUPABASE_PRODUCTION_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_PRODUCTION_SERVICE_ROLE_KEY }}
      C10_SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      C11_SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      C12_PROD_SUPABASE_SECRET_KEY: ${{ secrets.PROD_SUPABASE_SECRET_KEY }}
      C13_PRODUCTION_SUPABASE_SECRET_KEY: ${{ secrets.PRODUCTION_SUPABASE_SECRET_KEY }}
      C14_MORALTRADE_SUPABASE_SECRET_KEY: ${{ secrets.MORALTRADE_SUPABASE_SECRET_KEY }}
      C15_MORAL_TRADE_SUPABASE_SECRET_KEY: ${{ secrets.MORAL_TRADE_SUPABASE_SECRET_KEY }}
      C16_SUPABASE_PROD_SECRET_KEY: ${{ secrets.SUPABASE_PROD_SECRET_KEY }}
      C17_PROD_SERVICE_ROLE_KEY: ${{ secrets.PROD_SERVICE_ROLE_KEY }}
      C18_PRODUCTION_SERVICE_ROLE_KEY: ${{ secrets.PRODUCTION_SERVICE_ROLE_KEY }}
      C19_MORALTRADE_SERVICE_ROLE_KEY: ${{ secrets.MORALTRADE_SERVICE_ROLE_KEY }}
      C20_MORAL_TRADE_SERVICE_ROLE_KEY: ${{ secrets.MORAL_TRADE_SERVICE_ROLE_KEY }}
      C21_QA_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.QA_SUPABASE_SERVICE_ROLE_KEY }}
      M01_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      M02_PROD_SUPABASE_ACCESS_TOKEN: ${{ secrets.PROD_SUPABASE_ACCESS_TOKEN }}
      M03_PRODUCTION_SUPABASE_ACCESS_TOKEN: ${{ secrets.PRODUCTION_SUPABASE_ACCESS_TOKEN }}
      M04_SUPABASE_MANAGEMENT_TOKEN: ${{ secrets.SUPABASE_MANAGEMENT_TOKEN }}
      M05_SUPABASE_PAT: ${{ secrets.SUPABASE_PAT }}
      M06_MORALTRADE_SUPABASE_ACCESS_TOKEN: ${{ secrets.MORALTRADE_SUPABASE_ACCESS_TOKEN }}
      M07_MORAL_TRADE_SUPABASE_ACCESS_TOKEN: ${{ secrets.MORAL_TRADE_SUPABASE_ACCESS_TOKEN }}
      M08_QA_SUPABASE_ACCESS_TOKEN: ${{ secrets.QA_SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Check out the exact one-use controller
        uses: actions/checkout@v4

      - name: Probe credential scopes without printing values
        env:
          PROBE_LABEL: repository
        run: python3 .github/scripts/pr552-credential-probe.py

      - name: Upload presence-only evidence
        uses: actions/upload-artifact@v4
        with:
          name: pr552-credential-probe-repository-${{ github.run_id }}
          path: credential-probe-repository.json
          if-no-files-found: error
          retention-days: 7

  probe-environment-secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: production
            environment_name: Production
          - label: production-moraltrade-site
            environment_name: Production – moraltrade-site
          - label: preview
            environment_name: Preview
          - label: preview-moraltrade-site
            environment_name: Preview – moraltrade-site
          - label: moraltrade-qa
            environment_name: MoralTrade QA
    environment:
      name: ${{ matrix.environment_name }}
    env: *candidate_secrets
    steps:
      - name: Check out the exact one-use controller
        uses: actions/checkout@v4

      - name: Probe credential scopes without printing values
        env:
          PROBE_LABEL: ${{ matrix.label }}
        run: python3 .github/scripts/pr552-credential-probe.py

      - name: Upload presence-only evidence
        uses: actions/upload-artifact@v4
        with:
          name: pr552-credential-probe-${{ matrix.label }}-${{ github.run_id }}
          path: credential-probe-${{ matrix.label }}.json
          if-no-files-found: error
          retention-days: 7
