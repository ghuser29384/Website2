name: PR 727 production UAT secret presence probe

on:
  push:
    branches:
      - ops/pr727-production-secret-presence-probe-20260817

permissions:
  contents: write

concurrency:
  group: pr727-production-secret-presence-probe
  cancel-in-progress: false

env:
  CONTROLLER_BRANCH: ops/pr727-production-secret-presence-probe-20260817
  BASE_SHA: 7e993158363710e5fe2c3eaa1cbccdb5cd56c235
  OUTPUT_DIR: pr727-production-secret-presence-probe

jobs:
  probe:
    environment:
      name: MoralTrade QA
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PROD_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PROD_SUPABASE_SERVICE_ROLE_KEY }}
      PROD_SUPABASE_DB_URL: ${{ secrets.PROD_SUPABASE_DB_URL }}
      QA_TEST_PASSWORD: ${{ secrets.QA_TEST_PASSWORD }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Check out exact controller
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Guard one-file controller scope
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'ghuser29384/Website2'
          test "$GITHUB_REF_NAME" = "$CONTROLLER_BRANCH"
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          git diff --check "$BASE_SHA" "$GITHUB_SHA"
          test "$(git diff --name-only "$BASE_SHA" "$GITHUB_SHA")" = '.github/workflows/pr727-production-secret-presence-probe.yml'
          mkdir -p "$OUTPUT_DIR"

      - name: Record secret presence without values
        id: presence
        shell: bash
        run: |
          set -euo pipefail
          service_present=false
          db_present=false
          password_present=false
          vercel_present=false
          [[ -n "${PROD_SUPABASE_SERVICE_ROLE_KEY:-}" ]] && service_present=true
          [[ -n "${PROD_SUPABASE_DB_URL:-}" ]] && db_present=true
          [[ -n "${QA_TEST_PASSWORD:-}" ]] && password_present=true
          [[ -n "${VERCEL_TOKEN:-}" ]] && vercel_present=true
          jq -n \
            --arg environment 'MoralTrade QA' \
            --argjson serviceRolePresent "$service_present" \
            --argjson databaseUrlPresent "$db_present" \
            --argjson qaPasswordPresent "$password_present" \
            --argjson vercelTokenPresent "$vercel_present" \
            --arg observedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{environment:$environment,serviceRolePresent:$serviceRolePresent,databaseUrlPresent:$databaseUrlPresent,qaPasswordPresent:$qaPasswordPresent,vercelTokenPresent:$vercelTokenPresent,secretValuesRetained:false,observedAt:$observedAt}' \
            > "$OUTPUT_DIR/result.json"
          test "$service_present" = true
          test "$vercel_present" = true
          echo 'exit_code=0' >> "$GITHUB_OUTPUT"

      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr727-production-secret-presence-probe-${{ github.run_id }}
          path: ${{ env.OUTPUT_DIR }}
          if-no-files-found: error
          retention-days: 7

      - name: Delete one-use probe branch after success
        if: success()
        shell: bash
        run: git push origin --delete "$CONTROLLER_BRANCH"
