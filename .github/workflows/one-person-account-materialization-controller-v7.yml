name: One-person account materialization controller v7

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: one-person-account-materialization-controller
  cancel-in-progress: false

env:
  TARGET_BRANCH: feature/one-person-one-account-20260731
  EXPECTED_FEATURE_HEAD: 5be9ce4a3332d0c7094eccee6be57af10579530f
  BASE_MAIN_SHA: c78199d491cb064355216ee79bf1846191f0572c
  BACKUP_BRANCH: ops/one-person-account-transport-20260801
  EXPECTED_BACKUP_HEAD: c4edc0d9ea381574b7bf990987fe56eba122416f
  CONTROLLER_PATH: .github/workflows/one-person-account-materialization-controller-v7.yml

jobs:
  materialize:
    if: >-
      github.repository == 'ghuser29384/Website2' &&
      github.event.issue.pull_request != null &&
      github.event.issue.number == 379 &&
      github.event.comment.body == '/run-one-person-materialization-20260801-v7'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/one-person-one-account-20260731
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Verify exact current-main feature base and transport backup
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'ghuser29384/Website2'
          test "$(git branch --show-current)" = "$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$EXPECTED_FEATURE_HEAD"
          test "$(git rev-parse HEAD^)" = "$BASE_MAIN_SHA"
          test -f .github/workflows/one-person-account-qa.yml
          test ! -e .github/one-person-bootstrap
          test ! -e .github/workflows/materialize-one-person-account.yml
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')" = "$EXPECTED_FEATURE_HEAD"
          test "$(git ls-remote origin "refs/heads/$BACKUP_BRANCH" | awk '{print $1}')" = "$EXPECTED_BACKUP_HEAD"
          git fetch --no-tags origin "$BACKUP_BRANCH"
          git cat-file -e "$EXPECTED_BACKUP_HEAD^{commit}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          work="$(mktemp -d)"
          echo "WORK_DIR=$work" >> "$GITHUB_ENV"

      - name: Reconstruct and authenticate candidate and materializer from backup
        shell: bash
        run: |
          set -euo pipefail
          candidate_parts=(
            .github/one-person-bootstrap/candidate.local-000
            .github/one-person-bootstrap/candidate.local-001
            .github/one-person-bootstrap/candidate.local-002
            .github/one-person-bootstrap/candidate.local-003
            .github/one-person-bootstrap/candidate.local-004
            .github/one-person-bootstrap/candidate.local-005
            .github/one-person-bootstrap/candidate.local-006
            .github/one-person-bootstrap/candidate.local-007
          )
          materializer_parts=(
            .github/one-person-bootstrap/materializer.local-000
            .github/one-person-bootstrap/materializer.local-001
            .github/one-person-bootstrap/materializer.local-002
          )
          : > "$WORK_DIR/candidate.b64"
          for part in "${candidate_parts[@]}"; do
            git show "$EXPECTED_BACKUP_HEAD:$part" >> "$WORK_DIR/candidate.b64"
          done
          tr -d '\r\n\t ' < "$WORK_DIR/candidate.b64" > "$WORK_DIR/candidate.clean.b64"
          mv "$WORK_DIR/candidate.clean.b64" "$WORK_DIR/candidate.b64"
          test "$(wc -c < "$WORK_DIR/candidate.b64")" -eq 61832
          base64 --decode "$WORK_DIR/candidate.b64" > "$WORK_DIR/candidate.tar.xz"
          echo '19939a96e170056ee70ef98f1cec87a52451da4598e6d3c1b3c16094d2befb67  candidate.tar.xz' > "$WORK_DIR/candidate.sha256"
          (cd "$WORK_DIR" && sha256sum --check candidate.sha256)
          xz --test "$WORK_DIR/candidate.tar.xz"

          : > "$WORK_DIR/materializer.b64"
          for part in "${materializer_parts[@]}"; do
            git show "$EXPECTED_BACKUP_HEAD:$part" >> "$WORK_DIR/materializer.b64"
          done
          tr -d '\r\n\t ' < "$WORK_DIR/materializer.b64" > "$WORK_DIR/materializer.clean.b64"
          mv "$WORK_DIR/materializer.clean.b64" "$WORK_DIR/materializer.b64"
          test "$(wc -c < "$WORK_DIR/materializer.b64")" -eq 17636
          base64 --decode "$WORK_DIR/materializer.b64" > "$WORK_DIR/materialize.py"
          echo '6fb25969630e77ca68eb8efba20e9cb8ab45d740699d4a96e3e0d3868a6f6de1  materialize.py' > "$WORK_DIR/materializer.sha256"
          (cd "$WORK_DIR" && sha256sum --check materializer.sha256)
          python3 -m py_compile "$WORK_DIR/materialize.py"

      - name: Verify exact archive inventory and extract safely
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$WORK_DIR/candidate"
          python3 - <<'PY'
          import os, tarfile
          from pathlib import Path, PurePosixPath
          archive = Path(os.environ['WORK_DIR']) / 'candidate.tar.xz'
          destination = Path(os.environ['WORK_DIR']) / 'candidate'
          expected = {
            '.github/workflows/one-person-account-qa.yml',
            'docs/one-person-one-account.md',
            'scripts/test-one-person-concurrency.sh',
            'src/app/account/identity/page.tsx',
            'src/app/admin/identity/page.tsx',
            'src/app/api/identity/provider/route.ts',
            'src/app/api/identity/qa/complete/route.ts',
            'src/app/identity/actions.ts',
            'src/app/identity/identity.module.css',
            'src/app/identity/page.tsx',
            'src/app/identity/recovery/page.tsx',
            'src/app/identity/status/page.tsx',
            'src/lib/identity/one-person-account.test.ts',
            'src/lib/identity/one-person-account.ts',
            'src/lib/identity/server.ts',
            'supabase/migrations/20260731072000_one_person_one_account.sql',
            'supabase/tests/one_person_one_account.sql',
            'tests/one-person-account-authenticated.spec.ts',
          }
          with tarfile.open(archive, 'r:xz') as tf:
            names = set()
            for member in tf.getmembers():
              raw = member.name[2:] if member.name.startswith('./') else member.name
              path = PurePosixPath(raw)
              if path.is_absolute() or '..' in path.parts or not member.isfile():
                raise SystemExit(f'unsafe archive member: {member.name}')
              names.add(raw)
            if names != expected:
              raise SystemExit(f'inventory mismatch missing={sorted(expected-names)} unexpected={sorted(names-expected)}')
            tf.extractall(destination, filter='data')
          PY
          cmp "$WORK_DIR/candidate/.github/workflows/one-person-account-qa.yml" .github/workflows/one-person-account-qa.yml

      - name: Materialize and normalize reviewed feature tree
        shell: bash
        run: |
          set -euo pipefail
          cp -a "$WORK_DIR/candidate/." .
          python3 "$WORK_DIR/materialize.py" | tee "$WORK_DIR/materialization.json"
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/lib/identity/one-person-account.ts')
          path.write_text(path.read_text().rstrip('\n') + '\n')
          PY
          git diff --check
          git add -A
          git diff --cached --check
          if git diff --cached --name-only | grep -q '^.github/workflows/'; then
            echo 'The ordinary materialization commit unexpectedly changes a workflow file.' >&2
            git diff --cached --name-only | grep '^.github/workflows/' >&2
            exit 1
          fi

      - name: Verify exact 24-path PR boundary
        shell: bash
        run: |
          set -euo pipefail
          cat > "$WORK_DIR/expected.txt" <<'EOF'
          .env.example
          .github/workflows/one-person-account-qa.yml
          docs/one-person-one-account.md
          package.json
          scripts/test-one-person-concurrency.sh
          src/app/account/identity/page.tsx
          src/app/actions.ts
          src/app/admin/identity/page.tsx
          src/app/api/identity/provider/route.ts
          src/app/api/identity/qa/complete/route.ts
          src/app/auth/confirm/route.ts
          src/app/identity/actions.ts
          src/app/identity/identity.module.css
          src/app/identity/page.tsx
          src/app/identity/recovery/page.tsx
          src/app/identity/status/page.tsx
          src/app/signup/page.tsx
          src/components/auth/auth-card.tsx
          src/lib/identity/one-person-account.test.ts
          src/lib/identity/one-person-account.ts
          src/lib/identity/server.ts
          supabase/migrations/20260731072000_one_person_one_account.sql
          supabase/tests/one_person_one_account.sql
          tests/one-person-account-authenticated.spec.ts
          EOF
          sed -i 's/^          //' "$WORK_DIR/expected.txt"
          sort -u "$WORK_DIR/expected.txt" -o "$WORK_DIR/expected.txt"
          git diff --cached --name-only "$BASE_MAIN_SHA" | sort -u > "$WORK_DIR/actual.txt"
          diff -u "$WORK_DIR/expected.txt" "$WORK_DIR/actual.txt"

      - name: Commit and push ordinary materialized changes
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')" = "$EXPECTED_FEATURE_HEAD"
          git commit -m 'Materialize one-person-one-account identity authority'
          feature_sha="$(git rev-parse HEAD)"
          git push origin "HEAD:$TARGET_BRANCH"
          echo "feature_sha=$feature_sha" >> "$GITHUB_OUTPUT"

      - name: Reopen draft PR and record candidate SHA
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          feature_sha='${{ steps.publish.outputs.feature_sha }}'
          gh pr reopen 379 --repo "$GITHUB_REPOSITORY"
          gh pr comment 379 --repo "$GITHUB_REPOSITORY" --body "Materialized the hash-verified one-person-account candidate at exact feature SHA \`$feature_sha\`. PR remains draft. Repository and isolated-QA release gates must pass before review readiness, merge, or deployment."

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment 379 --repo "$GITHUB_REPOSITORY" --body "One-person-account materialization controller v7 failed at run $GITHUB_RUN_ID. No ordinary feature commit was pushed unless every integrity and boundary gate passed."

      - name: Remove temporary controller
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/$CONTROLLER_PATH?ref=main" --jq .sha 2>/dev/null || true)"
          if [[ -n "$sha" ]]; then
            jq -n --arg message 'Remove temporary one-person materialization controller v7' --arg sha "$sha" --arg branch main '{message:$message,sha:$sha,branch:$branch}' \
              | gh api --method DELETE "repos/$GITHUB_REPOSITORY/contents/$CONTROLLER_PATH" --input - >/dev/null
          fi
