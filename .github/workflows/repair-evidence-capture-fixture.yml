name: Repair evidence capture QA fixture

on:
  push:
    branches:
      - feature/evidence-credibility-capture-queue-20260811
    paths:
      - .github/workflows/repair-evidence-capture-fixture.yml
      - supabase/tests/evidence_credibility_shadow_capture_queue.sql

permissions:
  contents: write

concurrency:
  group: repair-evidence-capture-fixture-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Repair the immutable-bundle fixture ordering
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("supabase/tests/evidence_credibility_shadow_capture_queue.sql")
          source = path.read_text(encoding="utf-8")
          old_bundle = """    'initial',
              1,
              'accepted',
              now(),
              now()
          """
          new_bundle = """    'initial',
              1,
              'draft',
              null,
              null
          """
          if source.count(old_bundle) != 1:
              raise SystemExit("Expected exactly one accepted-before-item fixture block.")
          source = source.replace(old_bundle, new_bundle)

          old_boundary = """select bundle.object_id, 'attestation', 'QA-only private evidence'
          from qa_capture_objects bundle
          where bundle.object_name = 'bundle';

          with payout_math as (
          """
          new_boundary = """select bundle.object_id, 'attestation', 'QA-only private evidence'
          from qa_capture_objects bundle
          where bundle.object_name = 'bundle';

          update public.trade_evidence_bundles
          set status = 'accepted',
              submitted_at = now(),
              reviewed_at = now()
          where id = (
            select object_id from qa_capture_objects where object_name = 'bundle'
          );

          with payout_math as (
          """
          if source.count(old_boundary) != 1:
              raise SystemExit("Expected exactly one evidence-item fixture boundary.")
          source = source.replace(old_boundary, new_boundary)
          path.write_text(source, encoding="utf-8")
          PY
          git diff --check
          grep -n -A32 -B8 "insert into public.trade_evidence_bundles" \
            supabase/tests/evidence_credibility_shadow_capture_queue.sql

      - name: Commit the fixture repair and remove this one-use controller
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/tests/evidence_credibility_shadow_capture_queue.sql
          git rm .github/workflows/repair-evidence-capture-fixture.yml
          git commit -m "test: respect evidence bundle immutability in capture QA"
          git push origin "HEAD:${GITHUB_REF_NAME}"
