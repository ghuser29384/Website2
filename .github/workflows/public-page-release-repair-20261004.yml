name: Public page release repair 2026-10-04

on:
  push:
    branches: [main]
    paths: [.github/workflows/public-page-release-repair-20261004.yml]

permissions:
  contents: read
  actions: write

concurrency:
  group: public-page-release-repair-20261004
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Verify the reviewed page recovery and exact main candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'ghuser29384/Website2'
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git hash-object src/components/layout/site-link.tsx)" = '94874cae8166543e1dbad218a8eef4168d3f6704'
          test "$(git hash-object src/lib/home-navigation.test.ts)" = 'a0eed0f29e2bccfc26bbd0558f33cb353e858393'
          test "$(git hash-object src/lib/mpgf/phase-one-governance.ts)" = '1df014e14fd2272eff915e99120e56f47c06014b'
          test "$(git hash-object public/moral-trade-input-assist.js)" = 'c9944fe713efea34a2b6c1cf95ed9f19eedfd2dd'
          git diff --check HEAD^
          remote_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$remote_sha" = "$GITHUB_SHA"
      - name: Dispatch the existing gated production release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/vercel-release.yml" --jq .state)" = 'active'
          jq -n --arg sha "$GITHUB_SHA" \
            '{ref:"main",inputs:{ref:"main",target:"production",expected_sha:$sha,synthetic_auth_fixture_url:""}}' \
            | gh api --method POST \
                -H 'Accept: application/vnd.github+json' \
                -H 'X-GitHub-Api-Version: 2022-11-28' \
                "repos/$GITHUB_REPOSITORY/actions/workflows/vercel-release.yml/dispatches" \
                --input - >/dev/null
