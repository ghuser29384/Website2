name: Diagnose home browser QA

on:
  push:
    branches:
      - feat/smart-query-pipeline
    paths:
      - ".github/workflows/diagnose-home-browser.yml"

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/smart-query-pipeline
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Capture browser failure
        run: |
          set +e
          npm run test:e2e -- tests/exact-live-now-recommendations.spec.ts --reporter=line \
            > /tmp/home-browser-qa.log 2>&1
          status=$?
          tail -n 320 /tmp/home-browser-qa.log > .github/home-browser-qa-failure.txt
          printf '\nexit_status=%s\n' "$status" >> .github/home-browser-qa-failure.txt
          exit 0

      - name: Commit diagnostic output
        run: |
          git config user.name "moral-trade-query-bot"
          git config user.email "moral-trade-query-bot@users.noreply.github.com"
          git add .github/home-browser-qa-failure.txt
          git commit -m "Record home browser QA diagnostic"
          git push origin HEAD:feat/smart-query-pipeline
