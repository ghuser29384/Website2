name: Split one-person cross-relation migration locks v4

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-person-migration-split-controller-v4.yml

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: one-person-migration-split-controller-v4
  cancel-in-progress: false

env:
  CONTROLLER_PATH: .github/workflows/one-person-migration-split-controller-v4.yml
  V1_COMMIT: beb5745a026373e13d65cfbe3a54c7d659f7155e
  V1_PATH: .github/workflows/one-person-migration-split-controller.yml
  TARGET_BRANCH: feature/one-person-one-account-20260731
  EXPECTED_FEATURE_HEAD: 68eb508998658c5ec4285234ed321f493da7126c
  IDENTITY_MIGRATION: supabase/migrations/20260731072000_one_person_one_account.sql
  PROFILE_MIGRATION: supabase/migrations/20260801153000_one_person_profile_badge_projection_trigger.sql
  QA_WORKFLOW: .github/workflows/one-person-account-qa.yml

jobs:
  split:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact controller commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          token: ${{ github.token }}

      - name: Verify one-file scope and remove controller from main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'ghuser29384/Website2'
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          changed="$(git diff-tree --no-commit-id --name-only -r HEAD | sed '/^$/d')"
          test "$changed" = "$CONTROLLER_PATH"
          controller_sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/$CONTROLLER_PATH?ref=main" --jq .sha)"
          jq -n \
            --arg message 'Remove one-person migration split controller v4' \
            --arg sha "$controller_sha" \
            --arg branch main \
            '{message:$message,sha:$sha,branch:$branch}' \
            | gh api --method DELETE \
                "repos/$GITHUB_REPOSITORY/contents/$CONTROLLER_PATH" \
                --input - >/dev/null

      - name: Recover and normalize the reviewed repair program
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$V1_COMMIT"
          git show "$V1_COMMIT:$V1_PATH" > /tmp/one-person-split-v1.yml
          python3 - <<'PY'
          from pathlib import Path

          path = Path('/tmp/one-person-split-v1.yml')
          lines = path.read_text(encoding='utf-8').splitlines()

          def unique_index(predicate, label):
              matches = [i for i, line in enumerate(lines) if predicate(line)]
              if len(matches) != 1:
                  raise SystemExit(f'unexpected {label} inventory: {matches}')
              return matches[0]

          # Correct the nested triple-quote collision in the replay snippet.
          replay_start = unique_index(
              lambda line: "replay_step = '''      - name: Replay relation-isolated migrations under adversarial lock order with rollback" in line,
              'replay opening',
          )
          lines[replay_start] = lines[replay_start].replace("replay_step = '''", 'replay_step = """', 1)
          replay_assignment = unique_index(
              lambda line: 'workflow = workflow[:replay_start] + replay_step + workflow[replay_end:]' in line,
              'replay assignment',
          )
          if lines[replay_assignment - 1].strip() != "'''":
              raise SystemExit('unexpected replay closing delimiter')
          lines[replay_assignment - 1] = lines[replay_assignment - 1].replace("'''", '"""')

          # Restore continuation indentation that the outer workflow block scalar would remove.
          expected_index = unique_index(lambda line: 'expected_needle = ' in line, 'expected needle')
          if 'supabase/tests/one_person_one_account.sql' not in lines[expected_index + 1]:
              raise SystemExit('unexpected expected needle continuation')
          lines[expected_index + 1] = '    ' + lines[expected_index + 1]

          replacement_index = unique_index(lambda line: 'expected_replacement = ' in line, 'expected replacement')
          for offset, fragment in (
              (1, '20260801153000_one_person_profile_badge_projection_trigger.sql'),
              (2, 'supabase/tests/one_person_one_account.sql'),
          ):
              if fragment not in lines[replacement_index + offset]:
                  raise SystemExit('unexpected expected replacement continuation')
              lines[replacement_index + offset] = '    ' + lines[replacement_index + offset]

          for marker in ('artifact_old = ', 'artifact_new = '):
              start = unique_index(lambda line, marker=marker: marker in line, marker)
              end = start + 1
              while end < len(lines) and not lines[end].rstrip().endswith("'''"):
                  end += 1
              if end >= len(lines):
                  raise SystemExit(f'unterminated {marker}')
              for index in range(start + 1, end + 1):
                  lines[index] = '      ' + lines[index]

          # Each generated workflow snippet starts with six literal spaces on its first line.
          # Add two spaces to each continuation line so all YAML keys and run-block content align.
          def indent_generated_snippet(start_fragment: str, assignment_fragment: str, quote: str) -> None:
              start = unique_index(lambda line: start_fragment in line, start_fragment)
              assignment = unique_index(lambda line: assignment_fragment in line, assignment_fragment)
              close = assignment - 1
              if lines[close].strip() != quote:
                  raise SystemExit(f'unexpected closing delimiter before {assignment_fragment}')
              for index in range(start + 1, close):
                  if lines[index]:
                      lines[index] = '  ' + lines[index]

          indent_generated_snippet(
              "apply_step = '''      - name: Apply additive migrations once to isolated QA",
              'workflow = workflow[:apply_start] + apply_step + workflow[apply_end:]',
              "'''",
          )
          indent_generated_snippet(
              'replay_step = """      - name: Replay relation-isolated migrations under adversarial lock order with rollback',
              'workflow = workflow[:replay_start] + replay_step + workflow[replay_end:]',
              '"""',
          )

          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          ruby -e 'require "yaml"; YAML.parse_file(ARGV[0]) or abort("invalid recovered controller YAML")' /tmp/one-person-split-v1.yml
          ruby -ryaml -e '
            doc = YAML.load_file(ARGV[0]);
            step = doc.fetch("jobs").fetch("split").fetch("steps").find { |item| item["name"] == "Split profile trigger into a relation-isolated migration and update QA" };
            abort("repair step not found") unless step && step["run"];
            print step["run"]
          ' /tmp/one-person-split-v1.yml > /tmp/one-person-repair-step.sh
          bash -n /tmp/one-person-repair-step.sh

      - name: Check out exact feature head and execute repaired program
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH"
          test "$(git rev-parse "refs/remotes/origin/$TARGET_BRANCH")" = "$EXPECTED_FEATURE_HEAD"
          git switch --detach "$EXPECTED_FEATURE_HEAD"
          test "$(git rev-parse HEAD)" = "$EXPECTED_FEATURE_HEAD"
          test -f "$IDENTITY_MIGRATION"
          test -f "$QA_WORKFLOW"
          test ! -e "$PROFILE_MIGRATION"
          bash /tmp/one-person-repair-step.sh

      - name: Commit and push exact feature repair
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')" = "$EXPECTED_FEATURE_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$IDENTITY_MIGRATION" "$PROFILE_MIGRATION" "$QA_WORKFLOW"
          git diff --cached --check
          cat > /tmp/expected-paths.txt <<'EOF'
          .github/workflows/one-person-account-qa.yml
          supabase/migrations/20260731072000_one_person_one_account.sql
          supabase/migrations/20260801153000_one_person_profile_badge_projection_trigger.sql
          EOF
          sed -i 's/^          //' /tmp/expected-paths.txt
          sort -o /tmp/expected-paths.txt /tmp/expected-paths.txt
          git diff --cached --name-only | sort > /tmp/actual-paths.txt
          diff -u /tmp/expected-paths.txt /tmp/actual-paths.txt
          git commit -m 'Split one-person profile trigger into relation-isolated migration'
          candidate_sha="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_FEATURE_HEAD"
          git push --force-with-lease="refs/heads/$TARGET_BRANCH:$EXPECTED_FEATURE_HEAD" \
            origin "HEAD:refs/heads/$TARGET_BRANCH"
          echo "candidate_sha=$candidate_sha" >> "$GITHUB_OUTPUT"

      - name: Report result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ steps.publish.outputs.candidate_sha }}
        shell: bash
        run: |
          if [[ -n "$CANDIDATE_SHA" ]]; then
            gh pr comment 379 --repo "$GITHUB_REPOSITORY" --body "Split the cross-relation trigger DDL into an idempotent profile-only migration and pushed exact candidate \`$CANDIDATE_SHA\`. The draft PR remains unmerged; production is unchanged. Exact-head repository and isolated-QA gates are running."
          else
            gh pr comment 379 --repo "$GITHUB_REPOSITORY" --body "The one-person migration split controller v4 failed in run \`$GITHUB_RUN_ID\`. No feature push occurred unless every exact-head, exact-path, syntax, and force-with-lease guard passed."
