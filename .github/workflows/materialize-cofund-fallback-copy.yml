name: Materialize Co-Fund fallback copy

on:
  push:
    branches:
      - agent/cofund-fallback-copy-20260731
    paths:
      - .github/workflows/materialize-cofund-fallback-copy.yml

permissions:
  contents: write

concurrency:
  group: materialize-cofund-fallback-copy
  cancel-in-progress: false

jobs:
  materialize-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact branch
        uses: actions/checkout@v4
        with:
          ref: agent/cofund-fallback-copy-20260731
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply the approved user-facing copy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file_path = Path(path)
              source = file_path.read_text(encoding="utf-8")
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one occurrence, found {count}: {old!r}")
              file_path.write_text(source.replace(old, new), encoding="utf-8")

          js = "public/moral-trade-create/common-ground.js"
          replace_once(
              js,
              '<label for="cg-default-${index}">Without pool</label>',
              '<label for="cg-default-${index}">What would you fund instead?</label>',
          )
          replace_once(
              js,
              '<input id="cg-default-${index}" data-cg-field="defaultProject" data-cg-id="${escapeHTML(participant.id)}" maxlength="160" value="${escapeHTML(participant.defaultProject)}" />',
              '<input id="cg-default-${index}" data-cg-field="defaultProject" data-cg-id="${escapeHTML(participant.id)}" maxlength="160" value="${escapeHTML(participant.defaultProject)}" aria-describedby="commonGroundFallbackHelp" />',
          )
          replace_once(
              js,
              'Add participant ${index + 1}’s no-pool default.',
              'Add what participant ${index + 1} would fund instead.',
          )
          replace_once(
              js,
              'Confirm the no-pool defaults.',
              'Confirm what each participant would fund instead.',
          )
          replace_once(
              js,
              '${formatUsd(parseCents(participant.contribution) || 0)} · without pool: ${participant.defaultProject}',
              '${formatUsd(parseCents(participant.contribution) || 0)} · would otherwise fund: ${participant.defaultProject}',
          )
          replace_once(
              js,
              'The split and no-pool defaults are accurate.',
              'The split and fallback projects are accurate.',
          )
          replace_once(
              js,
              '; without pool: ${escapeHTML(participant.defaultProject)}</li>',
              '; would otherwise fund: ${escapeHTML(participant.defaultProject)}</li>',
          )

          integration = "src/lib/create-interface/common-ground-integration.ts"
          replace_once(
              integration,
              '              </div>\n              <div class="common-ground-participant-list" id="commonGroundParticipantList"></div>',
              '              </div>\n              <p class="common-ground-fallback-help" id="commonGroundFallbackHelp">If this Co-Fund does not happen, where would you otherwise use this money?</p>\n              <div class="common-ground-participant-list" id="commonGroundParticipantList"></div>',
          )
          replace_once(
              integration,
              '<span>These are honest no-pool defaults.</span>',
              '<span>These are the projects we would honestly fund if this Co-Fund did not happen.</span>',
          )

          css = "public/moral-trade-create/common-ground.css"
          replace_once(
              css,
              '.common-ground-participant-list {\n  display: grid;\n}',
              '.common-ground-fallback-help {\n  margin: 0;\n  padding: 11px 14px;\n  border-bottom: 1px solid var(--line);\n  color: var(--muted);\n  font-size: 12px;\n  line-height: 1.45;\n}\n\n.common-ground-participant-list {\n  display: grid;\n}',
          )

          integration_test = "src/lib/create-interface/common-ground-integration.test.ts"
          replace_once(
              integration_test,
              '  assert.match(integrated, /Co-Fund/);\n  assert.match(integrated, /Threshold pool/);',
              '  assert.match(integrated, /Co-Fund/);\n  assert.match(\n    integrated,\n    /If this Co-Fund does not happen, where would you otherwise use this money\\?/,\n  );\n  assert.match(\n    integrated,\n    /These are the projects we would honestly fund if this Co-Fund did not happen\\./,\n  );\n  assert.doesNotMatch(integrated, /honest no-pool defaults/);\n  assert.match(integrated, /Threshold pool/);',
          )

          source_contract = "src/lib/create-interface/source-contract.test.ts"
          replace_once(
              source_contract,
              '  assert.match(commonGroundScript, /Private value estimates stay in this tab/);',
              '  assert.match(\n    html,\n    /If this Co-Fund does not happen, where would you otherwise use this money\\?/,\n  );\n  assert.match(\n    html,\n    /These are the projects we would honestly fund if this Co-Fund did not happen\\./,\n  );\n  assert.match(commonGroundScript, /What would you fund instead\\?/);\n  assert.doesNotMatch(commonGroundScript, /Without pool|no-pool/);\n  assert.match(commonGroundScript, /Private value estimates stay in this tab/);',
          )

          browser_test = "tests/create-common-ground-pool.spec.ts"
          replace_once(
              browser_test,
              '    const visibleWords = await create.locator("#commonGroundFields").evaluate((element) =>',
              '    await expect(\n      create.getByText(\n        "If this Co-Fund does not happen, where would you otherwise use this money?",\n        { exact: true },\n      ),\n    ).toBeVisible();\n    await expect(\n      create.getByLabel("What would you fund instead?", { exact: true }),\n    ).toHaveCount(2);\n    await expect(create.locator("#commonGroundFields")).not.toContainText("Without pool");\n\n    const visibleWords = await create.locator("#commonGroundFields").evaluate((element) =>',
          )
          replace_once(browser_test, '    expect(visibleWords).toBeLessThanOrEqual(95);', '    expect(visibleWords).toBeLessThanOrEqual(125);')
          replace_once(
              browser_test,
              '    await create.getByLabel("These are honest no-pool defaults.").check();',
              '    await create\n      .getByLabel(\n        "These are the projects we would honestly fund if this Co-Fund did not happen.",\n        { exact: true },\n      )\n      .check();',
          )
          PY

      - name: Install dependencies
        run: npm ci

      - name: Verify JavaScript syntax
        run: node --check public/moral-trade-create/common-ground.js

      - name: Run focused Create tests
        run: node --import tsx --test src/lib/create-interface/*.test.ts

      - name: Lint changed TypeScript
        run: >-
          npx eslint
          src/lib/create-interface/common-ground-integration.ts
          src/lib/create-interface/common-ground-integration.test.ts
          src/lib/create-interface/source-contract.test.ts
          tests/create-common-ground-pool.spec.ts

      - name: Build production application
        env:
          NEXT_PUBLIC_SITE_URL: https://www.moraltrade.org
          VERCEL: "1"
          VERCEL_ENV: preview
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run desktop and mobile Co-Fund checks
        run: npx playwright test tests/create-common-ground-pool.spec.ts --reporter=line

      - name: Verify intended copy and whitespace
        shell: bash
        run: |
          grep -F "What would you fund instead?" public/moral-trade-create/common-ground.js
          grep -F "If this Co-Fund does not happen, where would you otherwise use this money?" src/lib/create-interface/common-ground-integration.ts
          grep -F "These are the projects we would honestly fund if this Co-Fund did not happen." src/lib/create-interface/common-ground-integration.ts
          ! grep -E "Without pool|no-pool" public/moral-trade-create/common-ground.js src/lib/create-interface/common-ground-integration.ts
          git diff --check

      - name: Commit verified product change and remove this materializer
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/materialize-cofund-fallback-copy.yml
          git add \
            public/moral-trade-create/common-ground.css \
            public/moral-trade-create/common-ground.js \
            src/lib/create-interface/common-ground-integration.ts \
            src/lib/create-interface/common-ground-integration.test.ts \
            src/lib/create-interface/source-contract.test.ts \
            tests/create-common-ground-pool.spec.ts
          git commit -m "Clarify Co-Fund fallback project copy"
          git push origin HEAD:agent/cofund-fallback-copy-20260731
