name: Apply Co-Fund rename

on:
  push:
    branches:
      - "product/rename-common-ground-to-co-fund-20260730"

permissions:
  contents: write

concurrency:
  group: apply-co-fund-rename
  cancel-in-progress: false

jobs:
  rename-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Replace the retired product name everywhere it is tracked
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          old = "Common Ground Pool"
          new = "Co-Fund"
          workflow = Path(".github/workflows/apply-co-fund-rename.yml")

          result = subprocess.run(
              ["git", "grep", "-Il", "--null", old],
              check=False,
              stdout=subprocess.PIPE,
          )
          paths = [Path(raw.decode("utf-8")) for raw in result.stdout.split(b"\0") if raw]
          replacements = 0
          changed = []

          for path in paths:
              if path == workflow:
                  continue
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count:
                  path.write_text(text.replace(old, new), encoding="utf-8")
                  replacements += count
                  changed.append(f"{path}: {count}")

          if replacements == 0:
              raise SystemExit("No tracked product-name occurrences were replaced.")

          workflow.unlink()

          remaining = subprocess.run(
              ["git", "grep", "-n", old],
              check=False,
              text=True,
              stdout=subprocess.PIPE,
          )
          if remaining.returncode == 0:
              raise SystemExit(f"Retired product name remains:\n{remaining.stdout}")

          print(f"Replaced {replacements} occurrence(s):")
          print("\n".join(changed))
          PY

      - name: Install dependencies
        run: npm ci

      - name: Verify Create JavaScript syntax
        run: node --check public/moral-trade-create/common-ground.js

      - name: Run Create unit and source-contract tests
        run: node --import tsx --test src/lib/create-interface/*.test.ts

      - name: Lint the renamed implementation and regressions
        run: >-
          npx eslint
          src/lib/create-interface/common-ground-integration.ts
          src/lib/create-interface/common-ground-integration.test.ts
          src/lib/create-interface/common-ground-validation.test.ts
          src/lib/create-interface/persistence.ts
          src/lib/create-interface/source-contract.test.ts
          src/lib/create-interface/validation.ts
          tests/create-common-ground-pool.spec.ts

      - name: Build the production application
        env:
          NEXT_PUBLIC_SITE_URL: https://www.moraltrade.org
          VERCEL: "1"
          VERCEL_ENV: preview
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify desktop and mobile Co-Fund workflows
        run: npx playwright test tests/create-common-ground-pool.spec.ts --reporter=line

      - name: Verify exact diff boundaries
        run: |
          git diff --check
          if git grep -n "Common Ground Pool"; then
            echo "Retired product name remains." >&2
            exit 1
          fi
          git grep -n "Co-Fund"
          git status --short

      - name: Commit the verified rename and remove this temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rename Common Ground Pool to Co-Fund"
          git push origin HEAD:product/rename-common-ground-to-co-fund-20260730
