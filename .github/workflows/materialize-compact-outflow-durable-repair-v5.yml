name: Materialize Compact outflow durable repair v5

on:
  push:
    branches:
      - feature/compact-authoritative-outflow-ledger-v1-20260816
    paths:
      - .github/workflows/materialize-compact-outflow-durable-repair-v5.yml

permissions:
  contents: write

concurrency:
  group: materialize-compact-outflow-durable-repair-v5-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact controller commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Verify bounded controller lineage
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "5cc1823dc7e4e96315362bf7866033d834a27f70"
          test "$(git diff --name-only HEAD^...HEAD)" = ".github/workflows/materialize-compact-outflow-durable-repair-v5.yml"

      - name: Repair deterministic lineage selection and privacy assertions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          freeze_path = Path('supabase/migrations/20260816141501_compact_authoritative_outflow_freeze_v1.sql')
          freeze = freeze_path.read_text(encoding='utf-8')

          replacements = [
              (
                  '  supersedes_obligation_id uuid;\n',
                  '  supersedes_obligation_id uuid;\n  obligation_frozen_at_value timestamptz;\n',
                  'freeze declaration',
              ),
              (
                  '''  select coverage.* into coverage_record
  from public.mpgf_public_goods_outflow_coverage_snapshots coverage
  join moral_trade_private.compact_outflow_coverage_metadata metadata
    on metadata.coverage_snapshot_id = coverage.id
  where coverage.participant_id = p_participant_id
    and coverage.cycle_key = p_cycle_key
    and metadata.authority_status <> 'provisional'
  order by metadata.created_at desc, coverage.id desc limit 1;
''',
                  '''  select coverage.* into coverage_record
  from public.mpgf_public_goods_outflow_coverage_snapshots coverage
  join moral_trade_private.compact_outflow_coverage_metadata metadata
    on metadata.coverage_snapshot_id = coverage.id
  where coverage.participant_id = p_participant_id
    and coverage.cycle_key = p_cycle_key
    and metadata.authority_status <> 'provisional'
    and not exists (
      select 1
      from moral_trade_private.compact_outflow_coverage_metadata successor
      where successor.supersedes_coverage_snapshot_id = coverage.id
        and successor.authority_status <> 'provisional'
    )
  order by metadata.source_cutoff_at desc, metadata.created_at desc, coverage.id desc
  limit 1;
''',
                  'coverage leaf selection',
              ),
              (
                  '''  select obligation.id into supersedes_obligation_id
  from public.mpgf_public_goods_obligation_snapshots obligation
  where obligation.participant_id = p_participant_id
    and obligation.cycle_key = p_cycle_key
  order by obligation.frozen_at desc, obligation.id desc limit 1;
''',
                  '''  select obligation.id into supersedes_obligation_id
  from public.mpgf_public_goods_obligation_snapshots obligation
  where obligation.participant_id = p_participant_id
    and obligation.cycle_key = p_cycle_key
    and not exists (
      select 1
      from public.mpgf_public_goods_obligation_snapshots successor
      where successor.supersedes_id = obligation.id
    )
  order by obligation.frozen_at desc, obligation.id desc
  limit 1;

  select pg_catalog.greatest(
    pg_catalog.clock_timestamp(),
    coalesce(
      max(obligation.frozen_at) + interval '1 microsecond',
      pg_catalog.clock_timestamp()
    )
  ) into obligation_frozen_at_value
  from public.mpgf_public_goods_obligation_snapshots obligation
  where obligation.participant_id = p_participant_id
    and obligation.cycle_key = p_cycle_key;
''',
                  'obligation leaf and monotonic timestamp selection',
              ),
              (
                  '''        source_observation_count, snapshot_hash, supersedes_id
      ) values (
        p_participant_id, p_cycle_key, coverage_record.id, 'calculated',
        eligible_total_bigint, eligible_total_bigint / 10,
        observation_count, snapshot_hash_value, supersedes_obligation_id
      ) returning * into obligation_record;
''',
                  '''        source_observation_count, snapshot_hash, supersedes_id,
        frozen_at, created_at
      ) values (
        p_participant_id, p_cycle_key, coverage_record.id, 'calculated',
        eligible_total_bigint, eligible_total_bigint / 10,
        observation_count, snapshot_hash_value, supersedes_obligation_id,
        obligation_frozen_at_value, obligation_frozen_at_value
      ) returning * into obligation_record;
''',
                  'calculated obligation timestamp',
              ),
              (
                  '''        source_observation_count, snapshot_hash, supersedes_id
      ) values (
        p_participant_id, p_cycle_key, coverage_record.id, 'unavailable',
        null, null, 0, snapshot_hash_value, supersedes_obligation_id
      ) returning * into obligation_record;
''',
                  '''        source_observation_count, snapshot_hash, supersedes_id,
        frozen_at, created_at
      ) values (
        p_participant_id, p_cycle_key, coverage_record.id, 'unavailable',
        null, null, 0, snapshot_hash_value, supersedes_obligation_id,
        obligation_frozen_at_value, obligation_frozen_at_value
      ) returning * into obligation_record;
''',
                  'unavailable obligation timestamp',
              ),
          ]
          for old, new, label in replacements:
              count = freeze.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one {label}; found {count}.')
              freeze = freeze.replace(old, new)
          freeze_path.write_text(freeze, encoding='utf-8')

          hardening_path = Path('supabase/migrations/20260816141502_compact_authoritative_outflow_hardening_v1.sql')
          hardening = hardening_path.read_text(encoding='utf-8')
          hardening_replacements = [
              (
                  '  bounds record;\n',
                  '  bounds record;\n  final_created_at_value timestamptz;\n',
                  'coverage declaration',
              ),
              (
                  '''  if p_source_cutoff_at < bounds.period_end_exclusive
     or p_source_cutoff_at > pg_catalog.now() then
    raise exception using errcode = '23514',
      message = 'Coverage cutoff must be after the prior UTC month and not in the future.';
  end if;

  select coverage_snapshot_id into existing_id
''',
                  '''  if p_source_cutoff_at < bounds.period_end_exclusive
     or p_source_cutoff_at > pg_catalog.now() then
    raise exception using errcode = '23514',
      message = 'Coverage cutoff must be after the prior UTC month and not in the future.';
  end if;
  perform pg_catalog.pg_advisory_xact_lock(
    pg_catalog.hashtextextended(
      batch.participant_id::text || ':coverage:' || batch.cycle_key,
      0
    )
  );

  select coverage_snapshot_id into existing_id
''',
                  'coverage advisory lock',
              ),
              (
                  '''  select metadata.coverage_snapshot_id into latest_prior
  from moral_trade_private.compact_outflow_coverage_metadata metadata
  where metadata.participant_id = batch.participant_id
    and metadata.cycle_key = batch.cycle_key
    and metadata.authority_status <> 'provisional'
  order by metadata.created_at desc, metadata.coverage_snapshot_id desc
  limit 1;
''',
                  '''  select metadata.coverage_snapshot_id into latest_prior
  from moral_trade_private.compact_outflow_coverage_metadata metadata
  where metadata.participant_id = batch.participant_id
    and metadata.cycle_key = batch.cycle_key
    and metadata.authority_status <> 'provisional'
    and not exists (
      select 1
      from moral_trade_private.compact_outflow_coverage_metadata successor
      where successor.supersedes_coverage_snapshot_id = metadata.coverage_snapshot_id
        and successor.authority_status <> 'provisional'
    )
  order by metadata.source_cutoff_at desc,
    metadata.created_at desc,
    metadata.coverage_snapshot_id desc
  limit 1;

  select pg_catalog.greatest(
    pg_catalog.clock_timestamp(),
    coalesce(
      max(coverage.created_at) + interval '1 microsecond',
      pg_catalog.clock_timestamp()
    )
  ) into final_created_at_value
  from public.mpgf_public_goods_outflow_coverage_snapshots coverage
  where coverage.participant_id = batch.participant_id
    and coverage.cycle_key = batch.cycle_key;
''',
                  'latest coverage leaf and monotonic timestamp',
              ),
              (
                  '''    source_coverage_attested, evidence_hash, observed_at, supersedes_id
  ) values (
    batch.participant_id, batch.cycle_key,
    bounds.period_start, bounds.period_end_exclusive,
    public_status, btrim(p_coverage_reason), source_scope_value,
    p_authority_status = 'complete', snapshot_hash_value,
    p_source_cutoff_at, latest_prior
  ) returning id into final_id;
''',
                  '''    source_coverage_attested, evidence_hash, observed_at, supersedes_id,
    created_at
  ) values (
    batch.participant_id, batch.cycle_key,
    bounds.period_start, bounds.period_end_exclusive,
    public_status, btrim(p_coverage_reason), source_scope_value,
    p_authority_status = 'complete', snapshot_hash_value,
    p_source_cutoff_at, latest_prior, final_created_at_value
  ) returning id into final_id;
''',
                  'final coverage timestamp',
              ),
          ]
          for old, new, label in hardening_replacements:
              count = hardening.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one {label}; found {count}.')
              hardening = hardening.replace(old, new)
          hardening_path.write_text(hardening, encoding='utf-8')

          test_path = Path('supabase/tests/compact_authoritative_outflow_ledger_core.sql')
          test_source = test_path.read_text(encoding='utf-8')
          old_test = '''  if (state#>>'{obligation,eligibleNetSettledOutflowCents}')::bigint <> 0
     or state::text ~ '8000|payment-a|payment-b|payment-c' then
    raise exception 'Cross-user aggregate or source detail leaked: %', state;
  end if;
'''
          new_test = '''  if state#>>'{obligation,coverage}' <> 'complete'
     or (state#>>'{obligation,eligibleNetSettledOutflowCents}')::bigint <> 0
     or (state#>>'{obligation,obligationCents}')::bigint <> 0
     or (state#>'{obligation}')::text ~ 'payment-a|payment-b|payment-c|source_record_key|canonical_event_hash|source_watermark|provider_reference' then
    raise exception 'Cross-user aggregate or source detail leaked: %', state;
  end if;
'''
          if test_source.count(old_test) != 1:
              raise SystemExit(
                  f'Expected one cross-user privacy assertion; found {test_source.count(old_test)}.'
              )
          test_path.write_text(test_source.replace(old_test, new_test), encoding='utf-8')
          PY

          git diff --check
          grep -q "supersedes_coverage_snapshot_id = coverage.id" \
            supabase/migrations/20260816141501_compact_authoritative_outflow_freeze_v1.sql
          grep -q "obligation_frozen_at_value" \
            supabase/migrations/20260816141501_compact_authoritative_outflow_freeze_v1.sql
          grep -q "final_created_at_value" \
            supabase/migrations/20260816141502_compact_authoritative_outflow_hardening_v1.sql
          grep -q "state#>>'{obligation,coverage}' <> 'complete'" \
            supabase/tests/compact_authoritative_outflow_ledger_core.sql

      - name: Commit durable repair and remove one-use controller
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            supabase/migrations/20260816141501_compact_authoritative_outflow_freeze_v1.sql \
            supabase/migrations/20260816141502_compact_authoritative_outflow_hardening_v1.sql \
            supabase/tests/compact_authoritative_outflow_ledger_core.sql
          git rm .github/workflows/materialize-compact-outflow-durable-repair-v5.yml
          git commit -m "fix: make Compact outflow supersession deterministic"
          git push origin "HEAD:${GITHUB_REF_NAME}"
