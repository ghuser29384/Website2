name: Repair group proposal interaction flake

on:
  push:
    branches:
      - feature/co-act-co-fund-create-v3-20260803
    paths:
      - .github/workflows/repair-group-proposal-flake.yml

permissions:
  contents: write

concurrency:
  group: repair-group-proposal-interaction-flake
  cancel-in-progress: false

jobs:
  repair:
    if: github.repository == 'ghuser29384/Website2'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4
        with:
          ref: feature/co-act-co-fund-create-v3-20260803
          fetch-depth: 1

      - name: Make the offer-entry fixture stable and remove this workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/create-group-contribution-proposal.spec.ts')
          text = path.read_text()
          start_marker = "  await create\n    .locator('[data-offer-entry-block][data-offer-id=\"behavior\"] [data-offer-field=\"action\"]')"
          end_marker = '    .fill("Existential Risk Research Project");\n'
          start = text.find(start_marker)
          if start < 0:
              raise SystemExit('Could not locate the behavior-action fixture start')
          end_start = text.find(end_marker, start)
          if end_start < 0:
              raise SystemExit('Could not locate the organization fixture end')
          end = end_start + len(end_marker)
          new = "\n".join([
              "  const behaviorAction = create.locator(",
              "    '[data-offer-entry-block][data-offer-id=\"behavior\"] [data-offer-field=\"action\"]',",
              "  );",
              "  const behaviorDuration = create.locator(",
              "    '[data-offer-entry-block][data-offer-id=\"behavior\"] [data-offer-field=\"duration\"]',",
              "  );",
              "",
              '  await behaviorDuration.fill("once per week for 12 weeks");',
              "  await create",
              "    .locator('[data-offer-entry-block][data-offer-id=\"money\"] [data-offer-field=\"amount\"]')",
              '    .fill("5.00");',
              "  await create",
              "    .locator('[data-offer-entry-block][data-offer-id=\"money\"] [data-offer-field=\"organization\"]')",
              '    .fill("Existential Risk Research Project");',
              "",
              "  // Enter the action last and cross a real focus boundary before mounting group controls.",
              "  // This prevents later offer-field updates from racing the delegated Create state handler.",
              '  await behaviorAction.fill("Avoid meat for one meal per week");',
              '  await behaviorAction.press("Tab");',
              '  await expect(behaviorAction).toHaveValue("Avoid meat for one meal per week");',
              "",
          ])
          path.write_text(text[:start] + new + text[end:])

          workflow = Path('.github/workflows/repair-group-proposal-flake.yml')
          workflow.unlink()
          PY

      - name: Commit the durable test repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/create-group-contribution-proposal.spec.ts .github/workflows/repair-group-proposal-flake.yml
          git diff --cached --check
          git commit -m "Stabilize group proposal offer-entry interaction test"
          git push origin HEAD:feature/co-act-co-fund-create-v3-20260803
