name: Finalize blind-audit hardening workflow v2

on:
  push:
    branches:
      - feature/evidence-credibility-blind-audit-v1-20260812
    paths:
      - .github/workflows/finalize-blind-audit-hardening-v2.yml

permissions:
  contents: write

concurrency:
  group: finalize-blind-audit-hardening-v2-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Bind the hardening migration into exact-head QA
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path(".github/workflows/evidence-credibility-blind-audit-qa.yml")
          source = path.read_text(encoding="utf-8")
          base = "supabase/migrations/20260812022000_evidence_credibility_blind_audit_v1.sql"
          hardening = "supabase/migrations/20260812022001_evidence_credibility_blind_audit_hardening.sql"

          def add_after_in_block(text: str, start_marker: str, end_marker: str) -> str:
              start = text.index(start_marker)
              end = text.index(end_marker, start)
              block = text[start:end]
              line = f"            {base} \\\n"
              if block.count(line) != 1:
                  raise SystemExit(
                      f"Expected one base migration line between {start_marker!r} and {end_marker!r}."
                  )
              block = block.replace(
                  line,
                  line + f"            {hardening} \\\n",
              )
              return text[:start] + block + text[end:]

          path_line = f"      - {base}\n"
          if source.count(path_line) != 2:
              raise SystemExit("Expected the base migration in both path filters.")
          source = source.replace(
              path_line,
              path_line + f"      - {hardening}\n",
          )

          manifest_line = f"          {base}\n"
          if source.count(manifest_line) != 1:
              raise SystemExit("Expected one base migration in the exact manifest.")
          source = source.replace(
              manifest_line,
              manifest_line + f"          {hardening}\n",
          )

          old_count = '          test "$(wc -l < /tmp/actual-files.txt)" -eq 10\n'
          if source.count(old_count) != 1:
              raise SystemExit("Expected one ten-file scope assertion.")
          source = source.replace(
              old_count,
              '          test "$(wc -l < /tmp/actual-files.txt)" -eq 11\n',
          )

          old_migration_assertion = (
              '          test "$(find supabase/migrations -maxdepth 1 -type f '
              "-name '20260812022000_evidence_credibility_blind_audit_v1.sql' "
              '| wc -l)" -eq 1\n'
          )
          if source.count(old_migration_assertion) != 1:
              raise SystemExit("Expected one migration-count assertion.")
          source = source.replace(
              old_migration_assertion,
              f'          test -f {base}\n          test -f {hardening}\n',
          )

          source = add_after_in_block(
              source,
              '          if grep -R "jnpoxvalyjtdghnperyu"',
              '; then\n            echo "Production project reference found',
          )

          effect_start = source.index('          if grep -Eqi \\\n')
          effect_end = source.index('; then\n            echo "The blind-audit migration', effect_start)
          effect_block = source[effect_start:effect_end]
          effect_target = f"            {base}"
          if effect_block.count(effect_target) != 1:
              raise SystemExit("Expected one active-effect base migration target.")
          effect_block = effect_block.replace(
              effect_target,
              f"            {base} \\\n            {hardening}",
          )
          source = source[:effect_start] + effect_block + source[effect_end:]

          source = add_after_in_block(
              source,
              '      - name: Preserve exact-head source evidence',
              '      - name: Upload exact-head source evidence',
          )

          old_variable = f'          migration="{base}"\n'
          if source.count(old_variable) != 1:
              raise SystemExit("Expected one database migration variable.")
          source = source.replace(
              old_variable,
              f'          migration_core="{base}"\n'
              f'          migration_hardening="{hardening}"\n',
          )

          old_include = "          \\i ${migration}\n"
          if source.count(old_include) != 1:
              raise SystemExit("Expected one database migration include.")
          source = source.replace(
              old_include,
              "          \\i ${migration_core}\n"
              "          \\i ${migration_hardening}\n",
          )

          source = add_after_in_block(
              source,
              '          git rev-parse HEAD > database-evidence/head-sha.txt',
              '            > database-evidence/file-sha256.txt',
          )

          path.write_text(source, encoding="utf-8")
          PY
          git diff --check
          grep -q "20260812022001_evidence_credibility_blind_audit_hardening.sql" \
            .github/workflows/evidence-credibility-blind-audit-qa.yml
          grep -q '\\i ${migration_hardening}' \
            .github/workflows/evidence-credibility-blind-audit-qa.yml

      - name: Commit the durable workflow update and remove controllers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/evidence-credibility-blind-audit-qa.yml
          for controller in \
            .github/workflows/finalize-blind-audit-hardening.yml \
            .github/workflows/finalize-blind-audit-hardening-v2.yml; do
            test ! -e "$controller" || git rm "$controller"
          done
          git commit -m "ci: validate blind-audit hardening migration"
          git push origin "HEAD:${GITHUB_REF_NAME}"
