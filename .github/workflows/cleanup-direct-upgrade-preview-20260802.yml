name: Cleanup Direct Donation Upgrade preview branches

on:
  push:
    branches:
      - ops/cleanup-direct-upgrade-preview-20260802
    paths:
      - .github/workflows/cleanup-direct-upgrade-preview-20260802.yml

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: cleanup-direct-upgrade-preview-20260802
  cancel-in-progress: false

env:
  CONTROLLER_PATH: .github/workflows/cleanup-direct-upgrade-preview-20260802.yml
  RELEASE_REPAIR_SHA: f22c8adbc3236822df81e52c5888bc281996019f
  FEATURE_BRANCH: feature/direct-verified-donation-upgrade-20260731
  RELEASE_BRANCH: release/vercel-preview
  EVIDENCE_BRANCH: evidence/direct-upgrade-preview-20260802
  RECEIPT_PATH: direct-upgrade-preview-20260802.json
  AUDIT_PATH: direct-upgrade-preview-runtime-audit-20260802.json
  FEATURE_PR: '418'

jobs:
  cleanup:
    if: github.repository == 'ghuser29384/Website2' && github.actor == 'ghuser29384'
    runs-on: ubuntu-24.04
    timeout-minutes: 150

    steps:
      - name: Check out and guard the one-file cleanup controller
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          token: ${{ github.token }}

      - name: Verify cleanup isolation and merged release repair
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff-tree --no-commit-id --name-only -r HEAD | sed '/^$/d')" = "$CONTROLLER_PATH"
          git merge-base --is-ancestor "$RELEASE_REPAIR_SHA" HEAD^

      - name: Wait for final matching pass receipts and draft PR
        id: evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 7200))
          while true; do
            if (( SECONDS >= deadline )); then
              echo 'Timed out waiting for cleanup-safe evidence.' >&2
              exit 1
            fi
            receipt="$(gh api "repos/$GITHUB_REPOSITORY/contents/$RECEIPT_PATH?ref=$EVIDENCE_BRANCH" --jq '.content' 2>/dev/null | tr -d '\n' || true)"
            audit="$(gh api "repos/$GITHUB_REPOSITORY/contents/$AUDIT_PATH?ref=$EVIDENCE_BRANCH" --jq '.content' 2>/dev/null | tr -d '\n' || true)"
            if [[ -z "$receipt" || -z "$audit" ]]; then
              sleep 20
              continue
            fi
            printf '%s' "$receipt" | base64 -d > "$RECEIPT_PATH"
            printf '%s' "$audit" | base64 -d > "$AUDIT_PATH"
            if python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('direct-upgrade-preview-20260802.json').read_text())
          a=json.loads(Path('direct-upgrade-preview-runtime-audit-20260802.json').read_text())
          assert r['schemaVersion']==2 and a['schemaVersion']==2
          assert r['candidateSha']==a['candidateSha']
          assert r['includedMainSha']==a['includedMainSha']
          assert r['deploymentUrl']==a['deployment']['url']
          assert r['gatedRelease']['conclusion']=='success'
          assert r['releaseClassification']['state']=='success'
          assert len(r['exactHeadGates'])==7 and len(r['routeSmoke'])==3
          assert a['result']=='pass' and a['deployment']['readyState']=='READY'
          assert a['deployment']['target']!='production'
          assert len(a['freshRouteAudit']['routes'])==3
          agg=a['aggregate']
          for key in ('runtime5xxCount','runtimeExplicitErrorCount','runtimeMarkerErrorCount','deploymentEvent5xxCount','deploymentEventExplicitErrorCount'):
              assert agg[key]==0
          safety=r['safetyBoundary']
          assert safety['productionDirectModeEnabled'] is False
          assert safety['managedStripeEnabled'] is False
          assert safety['pooledSettlementEnabled'] is False
          assert safety['paymentOrDonationCreatedByThisRun'] is False
          PY
            then
              candidate_sha="$(jq -r '.candidateSha' "$RECEIPT_PATH")"
              main_sha="$(jq -r '.includedMainSha' "$RECEIPT_PATH")"
              git fetch origin main "$FEATURE_BRANCH" "$RELEASE_BRANCH" --no-tags --force
              test "$(git rev-parse "origin/$FEATURE_BRANCH")" = "$candidate_sha"
              test "$(git rev-parse "origin/$RELEASE_BRANCH")" = "$candidate_sha"
              test "$(git rev-parse origin/main)" = "$main_sha"
              test "$(gh api "repos/$GITHUB_REPOSITORY/pulls/$FEATURE_PR" --jq '.draft')" = 'true'
              echo "candidate_sha=$candidate_sha" >> "$GITHUB_OUTPUT"
              break
            fi
            sleep 20
          done

      - name: Delete temporary diagnostic and orchestration refs only
        id: cleanup
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          : > deleted-branches.txt
          : > absent-branches.txt
          while IFS= read -r branch; do
            [[ -n "$branch" ]] || continue
            case "$branch" in
              main|"$FEATURE_BRANCH"|"$RELEASE_BRANCH"|"$EVIDENCE_BRANCH")
                echo "Refusing to delete protected branch $branch" >&2
                exit 1
                ;;
            esac
            encoded="$(jq -rn --arg v "heads/$branch" '$v|@uri')"
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/$encoded" >/dev/null 2>&1; then
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/$encoded" >/dev/null
              printf '%s\n' "$branch" | tee -a deleted-branches.txt
            else
              printf '%s\n' "$branch" | tee -a absent-branches.txt
            fi
          done <<'BRANCHES'
          diag/vercel-release-e2e-1d296a3
          diag/validate-vercel-release-evidence-f22c8ad
          fix/vercel-release-browser-env-20260802
          fix/vercel-release-trusted-rendered-evidence-20260802
          ops/direct-upgrade-preview-after-release-gate-20260802
          ops/verify-and-preview-direct-upgrade-20260802
          ops/publish-direct-upgrade-preview-evidence-20260802
          ops/audit-direct-upgrade-preview-runtime-20260802
          ops/final-resync-direct-upgrade-20260802
          ops/final-verify-preview-direct-upgrade-20260802
          ops/final-publish-direct-upgrade-preview-evidence-20260802
          ops/final-audit-direct-upgrade-preview-runtime-20260802
          ops/finalize-direct-upgrade-preview-evidence-20260802
          BRANCHES
          echo "deleted_count=$(wc -l < deleted-branches.txt | tr -d ' ')" >> "$GITHUB_OUTPUT"
          echo "absent_count=$(wc -l < absent-branches.txt | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - name: Record cleanup boundary on PR 418
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ steps.evidence.outputs.candidate_sha }}
          DELETED_COUNT: ${{ steps.cleanup.outputs.deleted_count }}
          ABSENT_COUNT: ${{ steps.cleanup.outputs.absent_count }}
        run: |
          set -euo pipefail
          gh pr comment "$FEATURE_PR" --repo "$GITHUB_REPOSITORY" --body "Temporary preview diagnostics and orchestration cleanup completed after the final matching receipts passed for \`$CANDIDATE_SHA\`. Deleted temporary branches: \`$DELETED_COUNT\`; already absent: \`$ABSENT_COUNT\`. Preserved \`main\`, the PR #418 feature branch, \`release/vercel-preview\`, and the immutable evidence branch. PR #418 remains draft; production and payment rails remain disabled."

      - name: Upload cleanup receipt
        uses: actions/upload-artifact@v4
        with:
          name: direct-upgrade-preview-branch-cleanup-${{ steps.evidence.outputs.candidate_sha }}
          path: |
            deleted-branches.txt
            absent-branches.txt
          if-no-files-found: error
          retention-days: 30

      - name: Delete this cleanup controller branch last
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          encoded="$(jq -rn --arg v 'heads/ops/cleanup-direct-upgrade-preview-20260802' '$v|@uri')"
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/$encoded" >/dev/null
