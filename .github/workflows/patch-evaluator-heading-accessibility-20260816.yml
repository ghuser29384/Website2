# One-use controller for the exact current Offers accessibility-tree mismatch reproduced in run 31926697015.
name: Patch evaluator heading accessibility for current Offers

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/patch-evaluator-heading-accessibility-20260816.yml

permissions:
  contents: write

concurrency:
  group: patch-evaluator-heading-accessibility-20260816
  cancel-in-progress: false

jobs:
  patch:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'integration/evaluator-core-loop-current-main-20260815'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact integration branch
        uses: actions/checkout@v4
        with:
          ref: integration/evaluator-core-loop-current-main-20260815
          fetch-depth: 0

      - name: Patch only the demonstrated accessible-name mismatch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tests/evaluator-core-loop-authenticated.spec.ts')
          text = path.read_text()
          old = '''      const evaluatorHeading = evaluatorOfferCard.getByRole("heading", {
        level: 4,
        name: /Evaluator core-loop verification\\s+Private QA response verification/i,
      });
      await expect(evaluatorHeading).toHaveText(
        /Evaluator core-loop verification\\s*\\/\\s*Private QA response verification/,
      );'''
          new = '''      const evaluatorHeading = evaluatorOfferCard.getByRole("heading", { level: 4 });
      await expect(evaluatorHeading).toHaveCount(1);
      await expect(evaluatorHeading).toHaveText(
        /Evaluator core-loop verification\\s*\\/\\s*Private QA response verification/,
      );'''
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one current heading assertion; found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/patch-evaluator-heading-accessibility-20260816.yml
          git diff --check
          git diff --name-only | sort | tee /tmp/changed.txt
          printf '%s\n' \
            .github/workflows/patch-evaluator-heading-accessibility-20260816.yml \
            tests/evaluator-core-loop-authenticated.spec.ts \
            | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt

      - name: Commit exact harness repair and remove patcher
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/evaluator-core-loop-authenticated.spec.ts
          git rm .github/workflows/patch-evaluator-heading-accessibility-20260816.yml
          git commit -m "Scope evaluator heading by exact proposal card"
          git push origin HEAD:integration/evaluator-core-loop-current-main-20260815
