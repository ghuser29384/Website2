name: Verify reviewed quiet UI integration

on:
  push:
    branches: [ops/quiet-ui-source-review-20260926]
    paths:
      - .github/workflows/quiet-ui-reviewed-integration.yml
      - .github/quiet-ui-review-replay.py

permissions:
  contents: read

concurrency:
  group: quiet-ui-reviewed-integration
  cancel-in-progress: false

env:
  EXPECTED_MAIN: f58ee041dfd909cad7699ed67485cc0a7db95933
  EXPECTED_HEAD: 1994d490e51d11fd9677a1b10346c8713928e815
  EXPECTED_TREE: 0c74b6a488d7c382a0b00676e54e4302536a1e7b
  CI: 'true'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  prepare:
    if: github.actor == 'ghuser29384'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      candidate: ${{ steps.prepare.outputs.candidate }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reproduce the reviewed merge without touching main or the PR branch
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = ghuser29384/Website2
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin refs/heads/fix/quiet-ui-20260926 | cut -f1)" = "$EXPECTED_HEAD"
          replay="$GITHUB_WORKSPACE/.github/quiet-ui-review-replay.py"
          git config user.name 'ghuser29384'
          git config user.email '262476329+ghuser29384@users.noreply.github.com'
          git update-ref refs/remotes/origin/export-quiet-ui-main "$EXPECTED_MAIN"
          git worktree add --detach "$RUNNER_TEMP/candidate" "$EXPECTED_HEAD"
          cd "$RUNNER_TEMP/candidate"
          set +e
          git merge --no-commit --no-ff origin/export-quiet-ui-main
          merge_status=$?
          set -e
          test "$merge_status" = 1
          actual="$(git diff --name-only --diff-filter=U | sort)"
          expected="$(printf '%s\n' public/moral-trade-live-core.txt public/moral-trade-live-feed.css public/moral-trade-live.html tests/discover-home-visual-alignment.spec.ts | sort)"
          test "$actual" = "$expected"
          python3 "$replay"
          git add -u
          test -z "$(git diff --name-only --diff-filter=U)"
          git diff --cached --check
          tree="$(git write-tree)"
          test "$tree" = "$EXPECTED_TREE"
          git commit -m 'Integrate approved quiet UI with current navigation and muted palette'
          candidate="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^1)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD^2)" = "$EXPECTED_MAIN"
          git push origin HEAD:refs/heads/ops/quiet-ui-reviewed-candidate-20260926
          mkdir -p "$RUNNER_TEMP/integration-evidence"
          printf 'candidate=%s\nmain=%s\nhead=%s\ntree=%s\n' "$candidate" "$EXPECTED_MAIN" "$EXPECTED_HEAD" "$tree" | tee "$RUNNER_TEMP/integration-evidence/revisions.txt"
          git diff "$EXPECTED_MAIN" HEAD > "$RUNNER_TEMP/integration-evidence/reviewed.patch"
          git diff --stat "$EXPECTED_MAIN" HEAD > "$RUNNER_TEMP/integration-evidence/diffstat.txt"
          echo "candidate=$candidate" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quiet-ui-integration-revisions
          path: ${{ runner.temp }}/integration-evidence
          retention-days: 7
          if-no-files-found: warn

  quality:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.candidate }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Unit and security regression tests
        run: npm test
      - name: ESLint
        run: npm run lint -- --quiet
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Production build including prebuild safety gates
        run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Focused desktop and mobile regressions
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: evidence/focused-results.json
        run: npx playwright test tests/quiet-ui.spec.ts tests/homepage-narrow-header.spec.ts tests/refined-header.spec.ts tests/discover-home-visual-alignment.spec.ts tests/selected-ui-cleanup.spec.ts tests/returning-homepage.spec.ts tests/create-route-ui-regression.spec.ts --output=test-results/focused --reporter=line,json
      - name: Complete unchanged release browser gate
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: evidence/release-results.json
        run: npm run test:e2e:release -- --output=test-results/release --reporter=line,json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quiet-ui-reviewed-quality
          path: |
            evidence/
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: warn

  dashboard-fixture:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54331
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: dashboard-local-public-fixture
      SUPABASE_SERVICE_ROLE_KEY: dashboard-local-service-fixture
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3210
      SITE_URL: http://127.0.0.1:3210
      DASHBOARD_SPARKS_FIXTURE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.candidate }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Exercise priority saving, account isolation, currency links, and controls with loopback-only data
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: evidence/dashboard-results.json
        run: npx playwright test tests/dashboard-sparks.spec.ts --workers=1 --output=test-results/dashboard --reporter=line,json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quiet-ui-reviewed-dashboard
          path: |
            evidence/
            test-results/
            /tmp/dashboard-sparks-evidence/
          retention-days: 7
          if-no-files-found: warn

  commitments-fixture:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:3231
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: auth-resolution-public-fixture
      SUPABASE_SERVICE_ROLE_KEY: auth-resolution-service-fixture
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3211
      SITE_URL: http://127.0.0.1:3211
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.candidate }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Exercise real session loading and signed-out navigation with the isolated local fixture
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: evidence/commitments-results.json
        run: npx playwright test --config=playwright.commitments.config.ts --reporter=line,json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quiet-ui-reviewed-commitments
          path: |
            evidence/
            test-results/
          retention-days: 7
          if-no-files-found: warn
