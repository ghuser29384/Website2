name: Site simplification validation and production 2026-10-03

on:
  push:
    branches:
      - main
      - codex/site-simplification
    paths:
      - .github/workflows/site-simplification-production-20261003.yml

permissions:
  contents: read

concurrency:
  group: site-simplification-production-20261003-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/codex/site-simplification'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run repository and production-build gates
        env:
          NEXT_PUBLIC_SITE_URL: https://www.moraltrade.org
          SITE_URL: https://www.moraltrade.org
          VERCEL: '1'
          VERCEL_ENV: production
        run: |
          set -euo pipefail
          npm test
          npm run lint -- --quiet
          npx tsc --noEmit
          npm run build
      - name: Run the complete rendered release gate
        env:
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3210
          SITE_URL: http://127.0.0.1:3210
          PLAYWRIGHT_HTML_OPEN: never
        run: |
          set -euo pipefail
          npx playwright install --with-deps chromium
          npm run test:e2e:release -- --reporter=line
      - name: Retain rendered evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-simplification-${{ github.sha }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  dispatch:
    if: github.ref == 'refs/heads/main'
    permissions:
      actions: write
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact release candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Verify approved simplification source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'ghuser29384/Website2'
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git hash-object public/moral-trade-live-core.txt)" = '73306f7b09508ce87fd4c3ef2e5ccf43d91ad976'
          test "$(git hash-object public/moral-trade-live-now.js)" = 'd239fa6273cf111d41e02228bd84049e75dbf54b'
          test "$(git hash-object public/moral-trade-discover.html)" = 'ec0f0b371121319349baa12f120e193fdc7b7fd2'
          test "$(git hash-object public/moral-trade-discover-search.js)" = 'a101349d3348979674272463f460eb88fb6e500c'
          test "$(git hash-object public/moral-trade-create/index.html)" = 'f5e860ff0bee09a0aaa53acae3bfffa329597784'
          test "$(git hash-object public/moral-trade-create/ui-repairs.css)" = 'b3e5a62f39bce27a9c7cb729ff60aae555672214'
          test "$(git hash-object src/lib/offer-browse-route.ts)" = '808eeefecee6804f294025cda884ef9de9b1900f'
          test "$(git hash-object src/proxy.ts)" = 'bf3b5fcf49f93a63ef24a8f09e693060ae80d043'
          test "$(git hash-object src/lib/create-interface/common-ground-integration.ts)" = '32ef9425e15554420d76366df7b22a1a6284d608'
          test "$(git hash-object src/app/saved-offers/page.tsx)" = '03b51853e3ae03a9ec1ef897adfe094f90bf846a'
          test "$(git hash-object src/app/wish-registry/page.tsx)" = '9f3a85b1f97b8e8d92fcdff276545a38b49d90c4'
          git diff --check HEAD^
          remote_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$remote_sha" = "$GITHUB_SHA"

      - name: Dispatch the existing gated production release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/vercel-release.yml" --jq .state)" = 'active'
          jq -n --arg sha "$GITHUB_SHA" \
            '{ref:"main",inputs:{ref:"main",target:"production",expected_sha:$sha,synthetic_auth_fixture_url:""}}' \
            | gh api --method POST \
                -H 'Accept: application/vnd.github+json' \
                -H 'X-GitHub-Api-Version: 2022-11-28' \
                "repos/$GITHUB_REPOSITORY/actions/workflows/vercel-release.yml/dispatches" \
                --input - >/dev/null
