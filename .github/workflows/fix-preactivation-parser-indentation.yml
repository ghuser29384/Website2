name: Fix pre-activation parser indentation and rerun

on:
  push:
    branches:
      - database/preactivation-schema-baseline-clean-20260819
    paths:
      - .github/workflows/fix-preactivation-parser-indentation.yml

permissions:
  contents: write

env:
  TARGET_BRANCH: database/preactivation-schema-baseline-clean-20260819
  EXPECTED_PARENT: ec200359dd04599f4e8e62528142bc917b928eb0

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: database/preactivation-schema-baseline-clean-20260819
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Repair generated Python indentation and retrigger
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/database/generate-preactivation-baseline.sh")
          source = path.read_text()
          replacements = {
              "\n  violations.append((line_number, match.group(1).upper()))":
                  "\n            violations.append((line_number, match.group(1).upper()))",
              "\n  active_dollar_quote = token\n        elif token == active_dollar_quote:":
                  "\n            active_dollar_quote = token\n        elif token == active_dollar_quote:",
              "\n  active_dollar_quote = None\nif active_dollar_quote is not None:":
                  "\n            active_dollar_quote = None\nif active_dollar_quote is not None:",
          }
          for old, new in replacements.items():
              if source.count(old) != 1:
                  raise SystemExit(f"Expected exactly one malformed indentation occurrence: {old!r}")
              source = source.replace(old, new)
          path.write_text(source)

          trigger = Path("scripts/database/generate-preactivation-baseline.trigger")
          trigger.write_text(
              "issue-714 authoritative pre-activation baseline generation\n"
              "source-main=26d1fe436dbf9a4440bfafd501ddf8db944a1127\n"
              "requested-at=2026-08-19T08:15:00Z\n"
              "purpose=parser-aware-data-free-clean-room-boundary-r2\n"
          )
          PY
          rm .github/workflows/fix-preactivation-parser-indentation.yml
          bash -n scripts/database/generate-preactivation-baseline.sh
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          source = Path("scripts/database/generate-preactivation-baseline.sh").read_text()
          start = source.index('python3 - "$DUMP_RAW" "$DUMP_NORMALIZED" <<\'PY\'')
          body_start = source.index("\n", start) + 1
          body_end = source.index("\nPY\n", body_start)
          compile(source[body_start:body_end], "dump-normalizer", "exec")
          PY

      - name: Commit and push normally
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix parser-aware baseline validation"
          git push origin "HEAD:$TARGET_BRANCH"
