name: Repair MPGF compact QA clean-tree evidence

on:
  push:
    branches:
      - agent/mpgf-public-goods-compacts
    paths:
      - .github/workflows/repair-mpgf-compact-qa-clean-tree.yml

permissions:
  contents: write

concurrency:
  group: repair-mpgf-compact-qa-clean-tree-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Preserve tracked-tree integrity while allowing recorded QA outputs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/mpgf-public-goods-compacts-qa.yml')
          lines = path.read_text(encoding='utf-8').splitlines()

          start_marker = '      - name: Prove clean exact-head source state'
          end_marker = '      - name: Upload exact-head source and rendered evidence'
          starts = [index for index, line in enumerate(lines) if line == start_marker]
          ends = [index for index, line in enumerate(lines) if line == end_marker]
          if len(starts) != 1 or len(ends) != 1 or starts[0] >= ends[0]:
              raise SystemExit('Expected one clean-tree step followed by one upload step.')

          replacement = [
              '      - name: Prove clean exact-head tracked source state',
              '        if: always()',
              '        shell: bash',
              '        run: |',
              '          set -euo pipefail',
              '          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"',
              '          git diff --exit-code',
              '          git diff --cached --exit-code',
              '          test -z "$(git status --short --untracked-files=no)"',
              '          git status --short > mpgf-compacts-working-tree-status.txt',
              '          git rev-parse HEAD > mpgf-compacts-head-sha.txt',
              '',
          ]
          lines[starts[0]:ends[0]] = replacement

          head_line = '            mpgf-compacts-head-sha.txt'
          head_matches = [index for index, line in enumerate(lines) if line == head_line]
          status_line = '            mpgf-compacts-working-tree-status.txt'
          if len(head_matches) != 1:
              raise SystemExit('Expected one source-evidence head SHA artifact line.')
          if status_line not in lines:
              lines.insert(head_matches[0] + 1, status_line)

          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          git diff --check
          grep -q 'git diff --cached --exit-code' .github/workflows/mpgf-public-goods-compacts-qa.yml
          grep -q 'mpgf-compacts-working-tree-status.txt' .github/workflows/mpgf-public-goods-compacts-qa.yml

      - name: Commit durable repair and remove controller
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/mpgf-public-goods-compacts-qa.yml
          git rm .github/workflows/repair-mpgf-compact-qa-clean-tree.yml
          git commit -m "ci: distinguish compact QA outputs from tracked changes"
          git push origin "HEAD:${GITHUB_REF_NAME}"
