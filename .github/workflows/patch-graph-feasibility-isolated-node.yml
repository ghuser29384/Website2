name: Patch graph-feasibility isolated-node boundary

on:
  push:
    branches:
      - research/commitments-trade-graph-feasibility-20260812
    paths:
      - ".github/workflows/patch-graph-feasibility-isolated-node.yml"
      - "scripts/ops/push-graph-feasibility-isolated-node-nonworkflow.py"

permissions:
  contents: write

concurrency:
  group: patch-graph-feasibility-isolated-node
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact branch
        uses: actions/checkout@v4
        with:
          ref: research/commitments-trade-graph-feasibility-20260812
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Apply, validate, commit, and push non-workflow patch
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ops/push-graph-feasibility-isolated-node-nonworkflow.py

      - name: Capture exact pushed patch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > isolated-node-patch-commit.txt
          git show --format=fuller --stat --oneline HEAD > isolated-node-patch-stat.txt
          git diff HEAD^ HEAD > isolated-node-patch.diff

      - name: Upload exact isolated-node patch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graph-feasibility-isolated-node-nonworkflow-${{ github.run_id }}
          path: |
            isolated-node-patch-commit.txt
            isolated-node-patch-stat.txt
            isolated-node-patch.diff
            docs/commitments/impact-identification/study-candidates/trade-bilateral-encouragement-planning-v1/graph-feasibility/README.md
            docs/commitments/impact-identification/study-candidates/trade-bilateral-encouragement-planning-v1/graph-feasibility/graph-feasibility-contract.json
            docs/commitments/impact-identification/study-candidates/trade-bilateral-encouragement-planning-v1/graph-feasibility/synthetic-graph-report.json
            scripts/commitments-trade-study/graph-feasibility-core.mjs
          if-no-files-found: error
