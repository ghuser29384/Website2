name: Repair Every.org staging API host isolation v2

on:
  push:
    branches:
      - fix/every-org-staging-api-host-708-v2-20260816

permissions:
  contents: write

concurrency:
  group: repair-every-org-staging-api-host-708-v2-20260816
  cancel-in-progress: false

jobs:
  repair:
    if: github.event.head_commit.message == 'Bootstrap Every.org staging API host repair v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      EXPECTED_BRANCH: fix/every-org-staging-api-host-708-v2-20260816
      EXPECTED_PARENT: b2c45dc0110d8841f7cbd7576347936044310c1c
      EXPECTED_SOURCE_BLOB: 6805ee4d1949d9f688b7b392153db1db382a5ec9
      WORKFLOW_PATH: .github/workflows/repair-every-org-staging-api-host-708-v2-20260816.yml
    steps:
      - name: Check out exact repair branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Guard exact source and one-file bootstrap
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_ACTOR" = ghuser29384
          test "$GITHUB_REF_NAME" = "$EXPECTED_BRANCH"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git rev-parse HEAD:src/lib/direct-donation-upgrade.ts)" = "$EXPECTED_SOURCE_BLOB"
          test "$(git diff --name-only HEAD^ HEAD)" = "$WORKFLOW_PATH"
          git fetch --no-tags origin fix/every-org-partner-webhook-auth-708-20260815
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_PARENT"

      - name: Patch environment-specific Every.org API host and add contract test
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path("src/lib/direct-donation-upgrade.ts")
          source = source_path.read_text()

          old_constant = 'const EVERY_ORG_API_BASE = "https://partners.every.org/v0.2";'
          new_constant = '''const EVERY_ORG_LIVE_API_BASE = "https://partners.every.org/v0.2";
          const EVERY_ORG_STAGING_API_BASE =
            "https://partners-staging.every.org/v0.2";

          export function getEveryOrgApiBase(mode: DirectDonationUpgradeMode) {
            if (mode === "staging") return EVERY_ORG_STAGING_API_BASE;
            if (mode === "live") return EVERY_ORG_LIVE_API_BASE;
            throw new Error(
              "Every.org API is unavailable while Direct Donation Upgrades are disabled.",
            );
          }'''
          if source.count(old_constant) != 1:
              raise SystemExit("Refusing: expected exactly one legacy Every.org API base constant")
          source = source.replace(old_constant, new_constant)

          legacy_reference = "${EVERY_ORG_API_BASE}"
          if source.count(legacy_reference) != 2:
              raise SystemExit("Refusing: expected exactly two legacy API base references")
          source = source.replace(
              legacy_reference,
              "${getEveryOrgApiBase(config.mode)}",
          )
          if "EVERY_ORG_API_BASE" in source:
              raise SystemExit("Refusing: legacy API base reference remains")
          source_path.write_text(source)

          test_path = Path("src/lib/every-org-api-environment.test.ts")
          if test_path.exists():
              raise SystemExit("Refusing: focused environment test already exists")
          test_path.write_text('''import assert from "node:assert/strict";
          import test from "node:test";

          import { getEveryOrgApiBase } from "@/lib/direct-donation-upgrade";

          test("Every.org API hosts remain isolated by provider environment", () => {
            assert.equal(
              getEveryOrgApiBase("staging"),
              "https://partners-staging.every.org/v0.2",
            );
            assert.equal(
              getEveryOrgApiBase("live"),
              "https://partners.every.org/v0.2",
            );
            assert.throws(
              () => getEveryOrgApiBase("disabled"),
              /unavailable while Direct Donation Upgrades are disabled/,
            );
          });
          ''')
          PY
          npx prettier --write \
            src/lib/direct-donation-upgrade.ts \
            src/lib/every-org-api-environment.test.ts
          git diff --check
          grep -Fq 'https://partners-staging.every.org/v0.2' src/lib/direct-donation-upgrade.ts
          grep -Fq 'https://partners.every.org/v0.2' src/lib/direct-donation-upgrade.ts
          ! grep -Fq 'const EVERY_ORG_API_BASE' src/lib/direct-donation-upgrade.ts

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Run focused Every.org and Donation Upgrade tests
        run: >-
          node --import tsx --test
          src/lib/every-org-api-environment.test.ts
          src/lib/direct-donation-upgrade.test.ts
          src/lib/direct-donation-upgrade-split.test.ts
          src/lib/direct-donation-upgrade-environment-contract.test.ts
          src/lib/direct-donation-upgrade-source-contract.test.ts
          src/lib/every-org-partner-webhook-auth.test.ts
          src/lib/trade-donation.test.ts
          src/lib/mpgf.test.ts

      - name: Run absolute TypeScript gate
        run: npx tsc --noEmit

      - name: Run absolute ESLint gate
        run: npm run lint -- --quiet

      - name: Build with all money rails disabled
        env:
          NEXT_PUBLIC_SITE_URL: https://www.moraltrade.org
          VERCEL: "1"
          VERCEL_ENV: preview
          VERCEL_TARGET_ENV: preview
          DIRECT_DONATION_UPGRADES_ENABLED: "false"
          DIRECT_DONATION_UPGRADE_MODE: disabled
          DIRECT_DONATION_UPGRADE_QA_FIXTURES: "false"
          CONDITIONAL_PAYMENTS_MODE: disabled
          TRADE_DONATION_POOL_ENABLED: "false"
          TRADE_DONATION_POOL_MODE: disabled
        run: npm run build

      - name: Commit only the bounded repair and remove the bootstrap workflow
        shell: bash
        run: |
          set -euo pipefail
          rm "$WORKFLOW_PATH"
          git config user.name ghuser29384
          git config user.email 262476329+ghuser29384@users.noreply.github.com
          git add -A
          git diff --cached --check
          mapfile -t changed < <(git diff --cached --name-only "$EXPECTED_PARENT" | sort)
          expected=(
            src/lib/direct-donation-upgrade.ts
            src/lib/every-org-api-environment.test.ts
          )
          test "${#changed[@]}" = "${#expected[@]}"
          for index in "${!expected[@]}"; do
            test "${changed[$index]}" = "${expected[$index]}"
          done
          git commit -m 'Fix Every.org staging API host isolation'
          git push origin "HEAD:$EXPECTED_BRANCH"
