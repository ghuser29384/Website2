name: A1 production authenticated smoke final

on:
  pull_request:
    branches:
      - main
    paths:
      - .a1-production-smoke/**

permissions:
  contents: read

jobs:
  validate-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out verified smoke bundle
        uses: actions/checkout@v4
        with:
          ref: ops/a1-production-smoke-20260725
          show-progress: false
      - name: Reconstruct and validate script
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .a1-production-smoke/final.gz.b64 | gzip -d > /tmp/a1-production-smoke.mjs
          echo "f82baf39e9af65aac1204416a3e0589f74f8013f30c11ec2eda7b7341d8a2a7f  /tmp/a1-production-smoke.mjs" | sha256sum -c -
          node --check /tmp/a1-production-smoke.mjs

  verify-production-loop:
    needs: validate-bundle
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      A1_SMOKE_BASE_URL: https://www.moraltrade.org
      A1_SMOKE_OUTPUT_DIR: a1-production-smoke-evidence
      A1_PRODUCTION_SOURCE_SHA: 818f9ad67cfe5746cb01f3b774a475b2d5fb57b2
      RAW_PROD_SUPABASE_DB_URL: ${{ secrets.PROD_SUPABASE_DB_URL }}
      PROD_SUPABASE_DB_PASSWORD: ${{ secrets.PROD_SUPABASE_DB_PASSWORD }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      QA_TEST_PASSWORD: ${{ secrets.QA_TEST_PASSWORD }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_ySu6sF3Uho1E1GnJtCQPVEuJ
      VERCEL_PROJECT_ID: prj_Em3j7Uj7RatX2R1ZYhla3XSHRde7
    steps:
      - name: Check out verified smoke bundle
        uses: actions/checkout@v4
        with:
          ref: ops/a1-production-smoke-20260725
          path: ops
          show-progress: false
          fetch-depth: 1

      - name: Check out exact current production source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.A1_PRODUCTION_SOURCE_SHA }}
          path: app
          show-progress: false
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Validate protected inputs and resolve production database URL
        shell: bash
        run: |
          set -euo pipefail
          for name in RAW_PROD_SUPABASE_DB_URL QA_TEST_PASSWORD VERCEL_TOKEN; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required secret: $name"
              exit 1
            fi
          done

          echo "::add-mask::$RAW_PROD_SUPABASE_DB_URL"
          echo "::add-mask::$QA_TEST_PASSWORD"
          echo "::add-mask::$VERCEL_TOKEN"
          if [ -n "${PROD_SUPABASE_DB_PASSWORD:-}" ]; then
            echo "::add-mask::$PROD_SUPABASE_DB_PASSWORD"
          fi
          if [ -n "${SUPABASE_DB_PASSWORD:-}" ]; then
            echo "::add-mask::$SUPABASE_DB_PASSWORD"
          fi

          mkdir -p app/a1-production-smoke-evidence
          env_response=/tmp/vercel-project-env.json
          env_code="$(
            curl -sS \
              -o "$env_response" \
              -w '%{http_code}' \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/env?teamId=$VERCEL_ORG_ID&decrypt=true"
          )"
          if [ "$env_code" != "200" ]; then
            node - "$env_response" "$env_code" <<'NODE'
          const fs = require('node:fs');
          const [path, status] = process.argv.slice(2);
          let message = 'unknown Vercel API error';
          try {
            const body = JSON.parse(fs.readFileSync(path, 'utf8'));
            message = body?.error?.message || body?.message || message;
          } catch {}
          console.error(`Vercel environment lookup failed with HTTP ${status}: ${message}`);
          NODE
            exit 1
          fi

          node - "$env_response" <<'NODE'
          const fs = require('node:fs');
          const responsePath = process.argv[2];
          const body = JSON.parse(fs.readFileSync(responsePath, 'utf8'));
          const envs = Array.isArray(body.envs) ? body.envs : [];
          const isProduction = (item) => {
            const targets = Array.isArray(item.target) ? item.target : [item.target];
            return targets.includes('production') && !item.gitBranch;
          };
          const production = new Map();
          for (const item of envs.filter(isProduction)) {
            if (!production.has(item.key)) production.set(item.key, item);
          }

          const safeRows = [...production.values()]
            .map((item) => ({
              key: item.key,
              type: item.type,
              decrypted: item.decrypted === true,
              value_present: typeof item.value === 'string' && item.value.length > 0,
            }))
            .sort((left, right) => left.key.localeCompare(right.key));
          fs.writeFileSync(
            'app/a1-production-smoke-evidence/vercel-env-metadata.json',
            `${JSON.stringify(safeRows, null, 2)}\n`,
          );

          const read = (key) => {
            const value = production.get(key)?.value;
            if (typeof value === 'string' && value.length > 0) return value;
            const fallback = process.env[key];
            return typeof fallback === 'string' ? fallback : '';
          };
          const urlCandidates = [
            'PROD_SUPABASE_DB_URL',
            'SUPABASE_DATABASE_URL',
            'SUPABASE_DB_URL',
            'DATABASE_URL',
            'DIRECT_URL',
            'POSTGRES_URL_NON_POOLING',
            'POSTGRES_URL',
            'POSTGRES_PRISMA_URL',
            'RAW_PROD_SUPABASE_DB_URL',
          ];
          const source = urlCandidates.find((key) => /^postgres(?:ql)?:\/\//i.test(read(key)));
          if (!source) throw new Error('No production Postgres URL is available.');

          const url = new URL(read(source));
          const passwordNames = [
            'PROD_SUPABASE_DB_PASSWORD',
            'SUPABASE_DB_PASSWORD',
            'SUPABASE_DATABASE_PASSWORD',
            'DATABASE_PASSWORD',
            'POSTGRES_PASSWORD',
          ];
          const passwordSource = passwordNames.find((key) => read(key).length > 0) || '';
          if (passwordSource) url.password = read(passwordSource);

          url.username = 'postgres.jnpoxvalyjtdghnperyu';
          url.hostname = 'aws-1-us-west-2.pooler.supabase.com';
          url.port = '5432';
          url.pathname = '/postgres';
          url.searchParams.set('sslmode', 'require');

          fs.writeFileSync('/tmp/a1-normalized-db-url', url.toString(), { mode: 0o600 });
          fs.writeFileSync(
            'app/a1-production-smoke-evidence/db-url-source.txt',
            `selected_source=${source}\npassword_override=${passwordSource || 'absent'}\n`,
          );
          NODE

          NORMALIZED_DB_URL="$(cat /tmp/a1-normalized-db-url)"
          echo "::add-mask::$NORMALIZED_DB_URL"
          echo "PROD_SUPABASE_DB_URL=$NORMALIZED_DB_URL" >> "$GITHUB_ENV"
          rm -f "$env_response" /tmp/a1-normalized-db-url
          test "$(git -C app rev-parse HEAD)" = "$A1_PRODUCTION_SOURCE_SHA"

      - name: Install PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq postgresql-client

      - name: Preflight production database connection
        shell: bash
        run: |
          set -euo pipefail
          diagnostics="app/a1-production-smoke-evidence/preflight-diagnostics.txt"

          configured_host="$(node -e 'process.stdout.write(new URL(process.env.PROD_SUPABASE_DB_URL).hostname)')"
          configured_user="$(node -e 'process.stdout.write(decodeURIComponent(new URL(process.env.PROD_SUPABASE_DB_URL).username))')"
          {
            echo "configured_host=$configured_host"
            echo "configured_user=$configured_user"
          } > "$diagnostics"

          test "$configured_user" = "postgres.jnpoxvalyjtdghnperyu"

          set +e
          connection_probe="$(
            PGCONNECT_TIMEOUT=10 psql "$PROD_SUPABASE_DB_URL" \
              -v ON_ERROR_STOP=1 \
              -Atqc 'select 1' \
              2>> "$diagnostics"
          )"
          connection_code=$?
          set -e

          if [ "$connection_code" -ne 0 ]; then
            cat "$diagnostics"
            exit "$connection_code"
          fi
          test "$connection_probe" = "1"

      - name: Rotate production CRON_SECRET and deploy exact source
        shell: bash
        run: |
          set -euo pipefail
          export CRON_SECRET="$(openssl rand -hex 32)"
          echo "::add-mask::$CRON_SECRET"
          echo "CRON_SECRET=$CRON_SECRET" >> "$GITHUB_ENV"

          node <<'NODE' > /tmp/a1-cron-secret.json
          process.stdout.write(JSON.stringify({
            key: 'CRON_SECRET',
            value: process.env.CRON_SECRET,
            type: 'sensitive',
            target: ['production'],
            comment: 'A1 recommendation training and production cron authorization',
          }));
          NODE
          cron_code="$(
            curl -sS \
              -o /tmp/a1-cron-upsert.json \
              -w '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              -H 'Content-Type: application/json' \
              --data-binary @/tmp/a1-cron-secret.json \
              "https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/env?teamId=$VERCEL_ORG_ID&upsert=true"
          )"
          rm -f /tmp/a1-cron-secret.json
          if [ "$cron_code" != "200" ] && [ "$cron_code" != "201" ]; then
            node - /tmp/a1-cron-upsert.json "$cron_code" <<'NODE'
          const fs = require('node:fs');
          const [path, status] = process.argv.slice(2);
          let message = 'unknown Vercel API error';
          try {
            const body = JSON.parse(fs.readFileSync(path, 'utf8'));
            message = body?.error?.message || body?.message || message;
          } catch {}
          console.error(`CRON_SECRET upsert failed with HTTP ${status}: ${message}`);
          NODE
            exit 1
          fi
          rm -f /tmp/a1-cron-upsert.json

          node <<'NODE' > /tmp/a1-deploy.json
          process.stdout.write(JSON.stringify({
            name: 'moraltrade-site',
            project: process.env.VERCEL_PROJECT_ID,
            target: 'production',
            gitSource: {
              type: 'github',
              org: 'ghuser29384',
              repo: 'Website2',
              ref: 'main',
              sha: process.env.A1_PRODUCTION_SOURCE_SHA,
            },
            meta: {
              source: 'a1-production-authenticated-smoke',
            },
          }));
          NODE
          deploy_code="$(
            curl -sS \
              -o /tmp/a1-deploy-response.json \
              -w '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              -H 'Content-Type: application/json' \
              --data-binary @/tmp/a1-deploy.json \
              "https://api.vercel.com/v13/deployments?teamId=$VERCEL_ORG_ID&forceNew=1"
          )"
          rm -f /tmp/a1-deploy.json
          if [ "$deploy_code" != "200" ] && [ "$deploy_code" != "201" ]; then
            node - /tmp/a1-deploy-response.json "$deploy_code" <<'NODE'
          const fs = require('node:fs');
          const [path, status] = process.argv.slice(2);
          let message = 'unknown Vercel API error';
          try {
            const body = JSON.parse(fs.readFileSync(path, 'utf8'));
            message = body?.error?.message || body?.message || message;
          } catch {}
          console.error(`Production deployment creation failed with HTTP ${status}: ${message}`);
          NODE
            exit 1
          fi

          DEPLOYMENT_ID="$(node -e "const v=require('/tmp/a1-deploy-response.json'); process.stdout.write(v.id || '')")"
          DEPLOYMENT_URL="$(node -e "const v=require('/tmp/a1-deploy-response.json'); process.stdout.write(v.url || '')")"
          test -n "$DEPLOYMENT_ID"
          {
            echo "deployment_id=$DEPLOYMENT_ID"
            echo "deployment_url=$DEPLOYMENT_URL"
          } > app/a1-production-smoke-evidence/vercel-deployment.txt
          rm -f /tmp/a1-deploy-response.json

          for attempt in $(seq 1 150); do
            curl -sS \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v13/deployments/$DEPLOYMENT_ID?teamId=$VERCEL_ORG_ID" \
              -o /tmp/a1-deployment-status.json
            ready_state="$(node -e "const v=require('/tmp/a1-deployment-status.json'); process.stdout.write(v.readyState || v.state || '')")"
            case "$ready_state" in
              READY) break ;;
              ERROR|CANCELED|CANCELLED)
                echo "::error::Production deployment ended in $ready_state"
                exit 1
                ;;
            esac
            sleep 5
          done
          test "$(node -e "const v=require('/tmp/a1-deployment-status.json'); process.stdout.write(v.readyState || v.state || '')")" = "READY"
          rm -f /tmp/a1-deployment-status.json

          for attempt in $(seq 1 60); do
            status="$(curl -sS -o /dev/null -w '%{http_code}' https://www.moraltrade.org/api/live-now || true)"
            if [ "$status" = "200" ]; then
              break
            fi
            sleep 5
          done
          test "$(curl -sS -o /dev/null -w '%{http_code}' https://www.moraltrade.org/api/live-now)" = "200"

      - name: Install application and browser dependencies
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium

      - name: Run authenticated production sequence
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode ../ops/.a1-production-smoke/final.gz.b64 | gzip -d > .a1-production-smoke.mjs
          echo "f82baf39e9af65aac1204416a3e0589f74f8013f30c11ec2eda7b7341d8a2a7f  .a1-production-smoke.mjs" | sha256sum -c -
          node --check .a1-production-smoke.mjs
          node .a1-production-smoke.mjs

      - name: Verify protected cron handler
        shell: bash
        run: |
          set -euo pipefail
          status="$(
            curl -sS \
              -o app/a1-production-smoke-evidence/cron-handler-response.json \
              -w '%{http_code}' \
              -H "Authorization: Bearer $CRON_SECRET" \
              https://www.moraltrade.org/api/jobs/recommendation-training
          )"
          test "$status" = "200"

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a1-production-authenticated-smoke-final-${{ github.run_id }}
          path: |
            app/a1-production-smoke-evidence
          if-no-files-found: warn
          retention-days: 30
