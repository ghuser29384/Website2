name: A1 production authenticated smoke final

on:
  pull_request:
    branches:
      - main
    paths:
      - .a1-production-smoke/**

permissions:
  contents: read

jobs:
  validate-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out verified smoke bundle
        uses: actions/checkout@v4
        with:
          ref: ops/a1-production-smoke-20260725
          show-progress: false
      - name: Reconstruct and validate script
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .a1-production-smoke/final.gz.b64 | gzip -d > /tmp/a1-production-smoke.mjs
          echo "f82baf39e9af65aac1204416a3e0589f74f8013f30c11ec2eda7b7341d8a2a7f  /tmp/a1-production-smoke.mjs" | sha256sum -c -
          node --check /tmp/a1-production-smoke.mjs

  verify-production-loop:
    needs: validate-bundle
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      A1_SMOKE_BASE_URL: https://www.moraltrade.org
      A1_SMOKE_OUTPUT_DIR: a1-production-smoke-evidence
      A1_PRODUCTION_SOURCE_SHA: 818f9ad67cfe5746cb01f3b774a475b2d5fb57b2
      RAW_PROD_SUPABASE_DB_URL: ${{ secrets.PROD_SUPABASE_DB_URL }}
      PROD_SUPABASE_DB_PASSWORD: ${{ secrets.PROD_SUPABASE_DB_PASSWORD }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      QA_TEST_PASSWORD: ${{ secrets.QA_TEST_PASSWORD }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_ySu6sF3Uho1E1GnJtCQPVEuJ
      VERCEL_PROJECT_ID: prj_Em3j7Uj7RatX2R1ZYhla3XSHRde7
    steps:
      - name: Check out verified smoke bundle
        uses: actions/checkout@v4
        with:
          ref: ops/a1-production-smoke-20260725
          path: ops
          show-progress: false
          fetch-depth: 1

      - name: Check out exact current production source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.A1_PRODUCTION_SOURCE_SHA }}
          path: app
          show-progress: false
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Validate protected inputs and pull production environment
        shell: bash
        run: |
          set -euo pipefail
          for name in RAW_PROD_SUPABASE_DB_URL QA_TEST_PASSWORD VERCEL_TOKEN; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required secret: $name"
              exit 1
            fi
          done

          echo "::add-mask::$RAW_PROD_SUPABASE_DB_URL"
          echo "::add-mask::$QA_TEST_PASSWORD"
          echo "::add-mask::$VERCEL_TOKEN"
          if [ -n "${PROD_SUPABASE_DB_PASSWORD:-}" ]; then
            echo "::add-mask::$PROD_SUPABASE_DB_PASSWORD"
          fi
          if [ -n "${SUPABASE_DB_PASSWORD:-}" ]; then
            echo "::add-mask::$SUPABASE_DB_PASSWORD"
          fi

          mkdir -p app/.vercel app/a1-production-smoke-evidence
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > app/.vercel/project.json

          set +e
          (
            cd app
            npx --yes vercel@56.5.0 env pull .vercel-production.env \
              --environment=production --yes --token "$VERCEL_TOKEN" \
              > a1-production-smoke-evidence/vercel-env-pull.log 2>&1
          )
          pull_code=$?
          set -e
          if [ "$pull_code" -ne 0 ]; then
            cat app/a1-production-smoke-evidence/vercel-env-pull.log
            exit "$pull_code"
          fi

          node --env-file=app/.vercel-production.env <<'NODE'
          const fs = require('node:fs');

          const names = fs
            .readFileSync('app/.vercel-production.env', 'utf8')
            .split(/\r?\n/)
            .map((line) => line.match(/^([A-Za-z_][A-Za-z0-9_]*)=/)?.[1])
            .filter(Boolean)
            .sort();
          fs.writeFileSync(
            'app/a1-production-smoke-evidence/vercel-env-names.txt',
            `${names.join('\n')}\n`,
          );

          const candidates = [
            ['PROD_SUPABASE_DB_URL', process.env.PROD_SUPABASE_DB_URL],
            ['SUPABASE_DB_URL', process.env.SUPABASE_DB_URL],
            ['DATABASE_URL', process.env.DATABASE_URL],
            ['POSTGRES_URL', process.env.POSTGRES_URL],
            ['POSTGRES_PRISMA_URL', process.env.POSTGRES_PRISMA_URL],
            ['RAW_PROD_SUPABASE_DB_URL', process.env.RAW_PROD_SUPABASE_DB_URL],
          ];
          const selected = candidates.find(([, value]) => typeof value === 'string' && /^postgres(?:ql)?:\/\//i.test(value));
          if (!selected) {
            throw new Error('No production Postgres URL was available from Vercel or GitHub secrets.');
          }

          const [source, raw] = selected;
          const url = new URL(raw);
          const passwordOverride =
            process.env.PROD_SUPABASE_DB_PASSWORD ||
            process.env.SUPABASE_DB_PASSWORD ||
            process.env.POSTGRES_PASSWORD ||
            '';
          if (passwordOverride) url.password = passwordOverride;
          url.username = 'postgres.jnpoxvalyjtdghnperyu';
          url.hostname = 'aws-1-us-west-2.pooler.supabase.com';
          url.port = '5432';
          url.pathname = '/postgres';
          url.searchParams.set('sslmode', 'require');

          fs.writeFileSync('/tmp/a1-normalized-db-url', url.toString(), { mode: 0o600 });
          fs.writeFileSync(
            'app/a1-production-smoke-evidence/db-url-source.txt',
            `selected_source=${source}\npassword_override=${passwordOverride ? 'present' : 'absent'}\n`,
          );
          NODE

          NORMALIZED_DB_URL="$(cat /tmp/a1-normalized-db-url)"
          echo "::add-mask::$NORMALIZED_DB_URL"
          echo "PROD_SUPABASE_DB_URL=$NORMALIZED_DB_URL" >> "$GITHUB_ENV"
          rm -f app/.vercel-production.env /tmp/a1-normalized-db-url
          test "$(git -C app rev-parse HEAD)" = "$A1_PRODUCTION_SOURCE_SHA"

      - name: Install PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq postgresql-client

      - name: Preflight production database connection
        shell: bash
        run: |
          set -euo pipefail
          diagnostics="app/a1-production-smoke-evidence/preflight-diagnostics.txt"

          configured_host="$(node -e 'process.stdout.write(new URL(process.env.PROD_SUPABASE_DB_URL).hostname)')"
          configured_user="$(node -e 'process.stdout.write(decodeURIComponent(new URL(process.env.PROD_SUPABASE_DB_URL).username))')"
          {
            echo "configured_host=$configured_host"
            echo "configured_user=$configured_user"
          } > "$diagnostics"

          test "$configured_user" = "postgres.jnpoxvalyjtdghnperyu"

          set +e
          connection_probe="$(
            PGCONNECT_TIMEOUT=10 psql "$PROD_SUPABASE_DB_URL" \
              -v ON_ERROR_STOP=1 \
              -Atqc 'select 1' \
              2>> "$diagnostics"
          )"
          connection_code=$?
          set -e

          if [ "$connection_code" -ne 0 ]; then
            cat "$diagnostics"
            exit "$connection_code"
          fi
          test "$connection_probe" = "1"

      - name: Rotate production CRON_SECRET and redeploy exact source
        shell: bash
        run: |
          set -euo pipefail
          CRON_SECRET="$(openssl rand -hex 32)"
          echo "::add-mask::$CRON_SECRET"
          echo "CRON_SECRET=$CRON_SECRET" >> "$GITHUB_ENV"

          cd app
          printf '%s' "$CRON_SECRET" | npx --yes vercel@56.5.0 env add CRON_SECRET production \
            --force --sensitive --token "$VERCEL_TOKEN"

          npx --yes vercel@56.5.0 deploy --prod --yes \
            --token "$VERCEL_TOKEN" 2>&1 | tee ../vercel-production-deploy.log

          for attempt in $(seq 1 60); do
            status="$(curl -sS -o /dev/null -w '%{http_code}' https://www.moraltrade.org/api/live-now || true)"
            if [ "$status" = "200" ]; then
              break
            fi
            sleep 5
          done
          test "$(curl -sS -o /dev/null -w '%{http_code}' https://www.moraltrade.org/api/live-now)" = "200"

      - name: Install application and browser dependencies
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium

      - name: Run authenticated production sequence
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode ../ops/.a1-production-smoke/final.gz.b64 | gzip -d > .a1-production-smoke.mjs
          echo "f82baf39e9af65aac1204416a3e0589f74f8013f30c11ec2eda7b7341d8a2a7f  .a1-production-smoke.mjs" | sha256sum -c -
          node --check .a1-production-smoke.mjs
          node .a1-production-smoke.mjs

      - name: Verify Vercel Cron invokes the protected handler
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          npx --yes vercel@56.5.0 crons run /api/jobs/recommendation-training \
            --token "$VERCEL_TOKEN" 2>&1 | tee ../vercel-cron-run.log

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a1-production-authenticated-smoke-final-${{ github.run_id }}
          path: |
            app/a1-production-smoke-evidence
            vercel-production-deploy.log
            vercel-cron-run.log
          if-no-files-found: warn
          retention-days: 30
