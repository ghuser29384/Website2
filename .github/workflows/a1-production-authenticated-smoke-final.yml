name: A1 production authenticated smoke final

on:
  pull_request:
    branches:
      - main
    paths:
      - .a1-production-smoke/**

permissions:
  contents: read

jobs:
  validate-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out verified smoke bundle
        uses: actions/checkout@v4
        with:
          ref: ops/a1-production-smoke-20260725
          show-progress: false
      - name: Reconstruct and validate script
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .a1-production-smoke/final.gz.b64 | gzip -d > /tmp/a1-production-smoke.mjs
          echo "f82baf39e9af65aac1204416a3e0589f74f8013f30c11ec2eda7b7341d8a2a7f  /tmp/a1-production-smoke.mjs" | sha256sum -c -
          node --check /tmp/a1-production-smoke.mjs

  verify-production-loop:
    needs: validate-bundle
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      A1_SMOKE_BASE_URL: https://www.moraltrade.org
      A1_SMOKE_OUTPUT_DIR: a1-production-smoke-evidence
      A1_PRODUCTION_SOURCE_SHA: 818f9ad67cfe5746cb01f3b774a475b2d5fb57b2
      RAW_PROD_SUPABASE_DB_URL: ${{ secrets.PROD_SUPABASE_DB_URL }}
      QA_TEST_PASSWORD: ${{ secrets.QA_TEST_PASSWORD }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_ySu6sF3Uho1E1GnJtCQPVEuJ
      VERCEL_PROJECT_ID: prj_Em3j7Uj7RatX2R1ZYhla3XSHRde7
      VERCEL_SCOPE: ellen-s
    steps:
      - name: Check out verified smoke bundle
        uses: actions/checkout@v4
        with:
          ref: ops/a1-production-smoke-20260725
          path: ops
          show-progress: false
          fetch-depth: 1

      - name: Check out exact current production source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.A1_PRODUCTION_SOURCE_SHA }}
          path: app
          show-progress: false
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Validate, normalize, and mask protected inputs
        shell: bash
        run: |
          set -euo pipefail
          for name in RAW_PROD_SUPABASE_DB_URL QA_TEST_PASSWORD VERCEL_TOKEN; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required secret: $name"
              exit 1
            fi
          done

          NORMALIZED_DB_URL="$({
            node <<'NODE'
          const raw = process.env.RAW_PROD_SUPABASE_DB_URL;
          const url = new URL(raw);
          url.username = "postgres.jnpoxvalyjtdghnperyu";
          url.hostname = "aws-1-us-west-2.pooler.supabase.com";
          url.port = "5432";
          url.pathname = "/postgres";
          url.searchParams.set("sslmode", "require");
          process.stdout.write(url.toString());
          NODE
          })"

          echo "::add-mask::$RAW_PROD_SUPABASE_DB_URL"
          echo "::add-mask::$NORMALIZED_DB_URL"
          echo "::add-mask::$QA_TEST_PASSWORD"
          echo "::add-mask::$VERCEL_TOKEN"
          echo "PROD_SUPABASE_DB_URL=$NORMALIZED_DB_URL" >> "$GITHUB_ENV"
          test "$(git -C app rev-parse HEAD)" = "$A1_PRODUCTION_SOURCE_SHA"

      - name: Install PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Preflight production database connection
        shell: bash
        run: |
          set -euo pipefail
          configured_user="$(
            node -e 'process.stdout.write(decodeURIComponent(new URL(process.env.PROD_SUPABASE_DB_URL).username))'
          )"
          test "$configured_user" = "postgres.jnpoxvalyjtdghnperyu"

          actual_user="$(
            psql "$PROD_SUPABASE_DB_URL" \
              -v ON_ERROR_STOP=1 \
              -Atqc 'select current_user'
          )"
          case "$actual_user" in
            postgres|postgres.jnpoxvalyjtdghnperyu) ;;
            *)
              echo "::error::Unexpected production database role: $actual_user"
              exit 1
              ;;
          esac

      - name: Rotate production CRON_SECRET and redeploy exact source
        shell: bash
        run: |
          set -euo pipefail
          CRON_SECRET="$(openssl rand -hex 32)"
          echo "::add-mask::$CRON_SECRET"
          echo "CRON_SECRET=$CRON_SECRET" >> "$GITHUB_ENV"

          mkdir -p app/.vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > app/.vercel/project.json

          cd app
          printf '%s' "$CRON_SECRET" | npx --yes vercel@56.5.0 env add CRON_SECRET production \
            --force --sensitive --token "$VERCEL_TOKEN" --scope "$VERCEL_SCOPE"

          npx --yes vercel@56.5.0 deploy --prod --yes \
            --token "$VERCEL_TOKEN" --scope "$VERCEL_SCOPE" 2>&1 | tee ../vercel-production-deploy.log

          for attempt in $(seq 1 60); do
            status="$(curl -sS -o /dev/null -w '%{http_code}' https://www.moraltrade.org/api/live-now || true)"
            if [ "$status" = "200" ]; then
              break
            fi
            sleep 5
          done
          test "$(curl -sS -o /dev/null -w '%{http_code}' https://www.moraltrade.org/api/live-now)" = "200"

      - name: Install application and browser dependencies
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium

      - name: Run authenticated production sequence
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode ../ops/.a1-production-smoke/final.gz.b64 | gzip -d > .a1-production-smoke.mjs
          echo "f82baf39e9af65aac1204416a3e0589f74f8013f30c11ec2eda7b7341d8a2a7f  .a1-production-smoke.mjs" | sha256sum -c -
          node --check .a1-production-smoke.mjs
          node .a1-production-smoke.mjs

      - name: Verify Vercel Cron invokes the protected handler
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          npx --yes vercel@56.5.0 crons run /api/jobs/recommendation-training \
            --token "$VERCEL_TOKEN" --scope "$VERCEL_SCOPE" 2>&1 | tee ../vercel-cron-run.log

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a1-production-authenticated-smoke-final-${{ github.run_id }}
          path: |
            app/a1-production-smoke-evidence
            vercel-production-deploy.log
            vercel-cron-run.log
          if-no-files-found: warn
          retention-days: 30
