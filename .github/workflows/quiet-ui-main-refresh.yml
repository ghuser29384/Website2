name: Quiet UI current main review
on:
  push:
    branches: [ops/quiet-ui-source-review-20260926]
    paths: [.github/workflows/quiet-ui-main-refresh.yml]
permissions:
  contents: read
jobs:
  inspect:
    if: github.actor == 'ghuser29384'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Export pinned concurrent changes and current branch identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/review"
          main=caa25edccad0a444d4d18b45046a9e3fdfc1abf8
          old=f58ee041dfd909cad7699ed67485cc0a7db95933
          git merge-base --is-ancestor "$old" "$main"
          git branch export-quiet-ui-main-refresh "$main"
          git bundle create "$RUNNER_TEMP/review/source.bundle" export-quiet-ui-main-refresh
          git diff "$old" "$main" > "$RUNNER_TEMP/review/main.patch"
          git log --format=fuller "$old..$main" > "$RUNNER_TEMP/review/main-log.txt"
          git diff --stat "$old" "$main" > "$RUNNER_TEMP/review/diffstat.txt"
          git show-ref --verify refs/remotes/origin/main > "$RUNNER_TEMP/review/main-ref.txt"
          git show-ref --verify refs/remotes/origin/fix/quiet-ui-20260926 > "$RUNNER_TEMP/review/pr-ref.txt"
          git show-ref --verify refs/remotes/origin/release/vercel-preview > "$RUNNER_TEMP/review/preview-ref.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: quiet-ui-concurrent-main-review
          path: ${{ runner.temp }}/review/
          retention-days: 3
          if-no-files-found: error
