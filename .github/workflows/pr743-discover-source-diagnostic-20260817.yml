name: Trace PR 743 queryless root prefetch source

on:
  push:
    branches:
      - ops/pr743-protected-preview-20260817
    paths:
      - .github/workflows/pr743-discover-source-diagnostic-20260817.yml

permissions:
  contents: read

jobs:
  trace-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_CANDIDATE_SHA: ebd45a898e83b803681871d95e71162082e68eb8
    steps:
      - name: Check out exact integrated candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_CANDIDATE_SHA }}
          fetch-depth: 0

      - name: Prove identity and scan text sources for root navigation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_CANDIDATE_SHA"
          python3 - <<'PY' | tee pr743-root-prefetch-source-trace.txt
          from pathlib import Path
          import re

          suffixes = {'.ts', '.tsx', '.js', '.jsx', '.mjs', '.html'}
          patterns = {
              'jsx_root_href': re.compile(r'href\s*=\s*(?:["\']/["\']|\{["\']/["\']\})'),
              'root_href_data': re.compile(r'href\s*:\s*["\']/["\']'),
              'root_string': re.compile(r'["\']/["\']'),
              'link_tag': re.compile(r'<Link\b'),
              'prefetch': re.compile(r'prefetch\s*='),
          }
          roots = [Path('src'), Path('public'), Path('tests')]
          files = sorted(
              p for root in roots for p in root.rglob('*')
              if p.is_file() and p.suffix in suffixes and p.stat().st_size <= 5_000_000
          )
          print(f'exact_head={"ebd45a898e83b803681871d95e71162082e68eb8"}')
          for label, pattern in patterns.items():
              print(f'\n### {label}')
              for path in files:
                  try:
                      lines = path.read_text(encoding='utf-8').splitlines()
                  except UnicodeDecodeError:
                      continue
                  for index, line in enumerate(lines):
                      if pattern.search(line):
                          start = max(0, index - 2)
                          end = min(len(lines), index + 3)
                          print(f'--- {path}:{index + 1}')
                          for cursor in range(start, end):
                              print(f'{cursor + 1}:{lines[cursor]}')
          PY

      - name: Decode and inspect packed live Feed document for root navigation
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE' | tee -a pr743-root-prefetch-source-trace.txt
          const fs = require('node:fs');
          const zlib = require('node:zlib');
          const names = ['0a','0b','0c','0d','1','2','3','4a','4b','4c','4d','5a','5b','5c','5d'];
          const encoded = names.map((name) => fs.readFileSync(`public/mt-live-0d0e0f03-${name}.txt`, 'utf8')).join('');
          const source = zlib.gunzipSync(Buffer.from(encoded, 'base64')).toString('utf8');
          const lines = source.split(/\r?\n/u);
          console.log('\n### decoded live source lines containing root-like href/navigation');
          for (let index = 0; index < lines.length; index += 1) {
            if (/href\s*=\s*["']\/(?:["'#?])|location|history|navigate|prefetch/iu.test(lines[index])) {
              const start = Math.max(0, index - 2);
              const end = Math.min(lines.length, index + 3);
              for (let cursor = start; cursor < end; cursor += 1) console.log(`${cursor + 1}:${lines[cursor]}`);
              console.log('---');
            }
          }
          NODE

      - name: Upload trace
        uses: actions/upload-artifact@v4
        with:
          name: pr743-root-prefetch-source-trace-${{ env.EXPECTED_CANDIDATE_SHA }}-${{ github.run_id }}
          path: pr743-root-prefetch-source-trace.txt
          retention-days: 14
