name: Trace PR 743 hosted Discover request source

on:
  push:
    branches:
      - ops/pr743-protected-preview-20260817
    paths:
      - .github/workflows/pr743-discover-source-diagnostic-20260817.yml

permissions:
  contents: read

jobs:
  trace-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_CANDIDATE_SHA: 350370ed1470e08a154e11094e304097fc940523
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_CANDIDATE_SHA }}
          fetch-depth: 0

      - name: Prove identity and trace every relevant source occurrence
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_CANDIDATE_SHA"
          {
            echo '### exact path and literal queries'
            git grep -n -I -F '/discover?domain=offers&view=list' -- . ':!package-lock.json' || true
            git grep -n -I -F 'domain=offers' -- . ':!package-lock.json' || true
            git grep -n -I -F 'view=list' -- . ':!package-lock.json' || true
            echo
            echo '### every /discover occurrence in the exact candidate'
            git grep -n -I -F '/discover' -- . ':!package-lock.json' || true
            echo
            echo '### nearby offers/discover/navigation constructions'
            git grep -n -I -E 'offers\?view|href.{0,100}offers|discover.{0,100}offers|offers.{0,100}discover|domain.{0,50}offers|view.{0,50}list' -- . ':!package-lock.json' || true
          } | tee pr743-discover-source-trace.txt

      - name: Decode and inspect the packed live Feed document
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE' | tee -a pr743-discover-source-trace.txt
          const fs = require('node:fs');
          const zlib = require('node:zlib');
          const names = ['0a','0b','0c','0d','1','2','3','4a','4b','4c','4d','5a','5b','5c','5d'];
          const encoded = names
            .map((name) => fs.readFileSync(`public/mt-live-0d0e0f03-${name}.txt`, 'utf8'))
            .join('');
          const source = zlib.gunzipSync(Buffer.from(encoded, 'base64')).toString('utf8');
          console.log('\n### decoded live source: lines containing offers/discover/prefetch/fetch');
          const lines = source.split(/\r?\n/u);
          for (let index = 0; index < lines.length; index += 1) {
            if (/offers|discover|prefetch|fetch\s*\(/iu.test(lines[index])) {
              const start = Math.max(0, index - 1);
              const end = Math.min(lines.length, index + 2);
              for (let cursor = start; cursor < end; cursor += 1) {
                console.log(`${cursor + 1}:${lines[cursor]}`);
              }
              console.log('---');
            }
          }
          console.log('\n### decoded live source exact bare Offers targets');
          const patterns = [
            /href\s*=\s*["']\/offers["']/giu,
            /href\s*=\s*["']https:\/\/moraltrade\.org\/offers["']/giu,
            /fetch\s*\(\s*["']\/offers["']/giu,
            /location(?:\.assign|\.replace)?\s*\(?\s*["']\/offers["']/giu,
          ];
          for (const pattern of patterns) {
            console.log(String(pattern), [...source.matchAll(pattern)].map((match) => match[0]));
          }
          NODE

      - name: Upload trace and exact candidate source files
        uses: actions/upload-artifact@v4
        with:
          name: pr743-discover-source-trace-${{ env.EXPECTED_CANDIDATE_SHA }}-${{ github.run_id }}
          path: |
            pr743-discover-source-trace.txt
            src/app/profile/page.tsx
            src/auth-resolution-wiring.test.ts
            src/components/marketplace/marketplace-components.tsx
          retention-days: 14
