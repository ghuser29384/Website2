name: Trace PR 743 queryless root prefetch source

on:
  push:
    branches:
      - ops/pr743-protected-preview-20260817
    paths:
      - .github/workflows/pr743-discover-source-diagnostic-20260817.yml

permissions:
  contents: read

jobs:
  trace-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_CANDIDATE_SHA: ebd45a898e83b803681871d95e71162082e68eb8
    steps:
      - name: Check out exact integrated candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_CANDIDATE_SHA }}
          fetch-depth: 0

      - name: Prove identity and trace queryless root navigation sources
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_CANDIDATE_SHA"
          {
            echo '### literal JSX/HTML root href forms'
            git grep -n -I -E 'href[[:space:]]*=[[:space:]]*["'"']/["'"']|href[[:space:]]*=[[:space:]]*\{["'"']/["'"']\}' -- . ':!package-lock.json' || true
            echo
            echo '### root-like href data and navigation arrays'
            git grep -n -I -E 'href:[[:space:]]*["'"']/["'"']|href[[:space:]]*=[[:space:]]*["'"']/[#?]|location\.(assign|replace)[[:space:]]*\([[:space:]]*["'"']/' -- . ':!package-lock.json' || true
            echo
            echo '### Next Link tags and nearby prefetch decisions'
            git grep -n -I -E '<Link|prefetch=' -- src ':!package-lock.json' || true
            echo
            echo '### all exact queryless slash string occurrences in TS/TSX/JS/HTML'
            git grep -n -I -E '["'"']/["'"']' -- '*.ts' '*.tsx' '*.js' '*.jsx' '*.html' || true
          } | tee pr743-root-prefetch-source-trace.txt

      - name: Decode and inspect packed live Feed document for root navigation
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE' | tee -a pr743-root-prefetch-source-trace.txt
          const fs = require('node:fs');
          const zlib = require('node:zlib');
          const names = ['0a','0b','0c','0d','1','2','3','4a','4b','4c','4d','5a','5b','5c','5d'];
          const encoded = names.map((name) => fs.readFileSync(`public/mt-live-0d0e0f03-${name}.txt`, 'utf8')).join('');
          const source = zlib.gunzipSync(Buffer.from(encoded, 'base64')).toString('utf8');
          const lines = source.split(/\r?\n/u);
          console.log('\n### decoded live source lines containing href/root/navigation');
          for (let index = 0; index < lines.length; index += 1) {
            if (/href|location|history|navigate|prefetch/iu.test(lines[index])) {
              const start = Math.max(0, index - 1);
              const end = Math.min(lines.length, index + 2);
              for (let cursor = start; cursor < end; cursor += 1) console.log(`${cursor + 1}:${lines[cursor]}`);
              console.log('---');
            }
          }
          console.log('\n### decoded exact root targets');
          for (const pattern of [
            /href\s*=\s*["']\/["']/giu,
            /href\s*=\s*["']\/(?:[#?][^"']*)?["']/giu,
            /location(?:\.assign|\.replace)?\s*\(?\s*["']\/["']/giu,
            /["']\/["']/giu,
          ]) console.log(String(pattern), [...source.matchAll(pattern)].slice(0, 100).map((m) => m[0]));
          NODE

      - name: Upload trace
        uses: actions/upload-artifact@v4
        with:
          name: pr743-root-prefetch-source-trace-${{ env.EXPECTED_CANDIDATE_SHA }}-${{ github.run_id }}
          path: pr743-root-prefetch-source-trace.txt
          retention-days: 14
