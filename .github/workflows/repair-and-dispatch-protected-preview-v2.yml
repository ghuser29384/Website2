name: Repair and dispatch protected Preview acceptance v2

on:
  push:
    branches:
      - ops/evidence-credibility-shadow-preview-acceptance-20260812
    paths:
      - .github/workflows/repair-and-dispatch-protected-preview-v2.yml

permissions:
  actions: write
  contents: write

concurrency:
  group: repair-and-dispatch-protected-preview-v2
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Repair current Vercel CLI curl syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/evidence-credibility-shadow-protected-preview-acceptance-v2.yml')
          source = path.read_text(encoding='utf-8')
          old_help = "          npx vercel@latest curl --help 2>&1 | tee ../preview-evidence/vercel-curl-help.txt\n"
          new_help = "          npx vercel@latest curl --help 2>&1 | tee ../preview-evidence/vercel-curl-help.txt || true\n"
          if source.count(old_help) != 1:
              raise SystemExit(f'Expected one help invocation, found {source.count(old_help)}.')
          source = source.replace(old_help, new_help)

          old_curl = """          npx vercel@latest curl \"$DEPLOYMENT_URL/login\" \\
            -H 'x-vercel-set-bypass-cookie: true' \\
            -D /tmp/vercel-bypass-headers.txt \\
            -o /tmp/vercel-bypass-body.html \\
            --token=\"$VERCEL_TOKEN\" \\
            2> ../preview-evidence/vercel-curl-stderr.txt
          """
          new_curl = """          npx vercel@latest curl \"$DEPLOYMENT_URL/login\" \\
            --token=\"$VERCEL_TOKEN\" \\
            -- \\
            --header 'x-vercel-set-bypass-cookie: true' \\
            --dump-header /tmp/vercel-bypass-headers.txt \\
            --output /tmp/vercel-bypass-body.html \\
            2> ../preview-evidence/vercel-curl-stderr.txt
          """
          if source.count(old_curl) != 1:
              raise SystemExit(f'Expected one old curl block, found {source.count(old_curl)}.')
          path.write_text(source.replace(old_curl, new_curl), encoding='utf-8')
          PY
          git diff --check
          grep -q -- '--dump-header /tmp/vercel-bypass-headers.txt' \
            .github/workflows/evidence-credibility-shadow-protected-preview-acceptance-v2.yml

      - name: Commit durable repair and remove controller
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/evidence-credibility-shadow-protected-preview-acceptance-v2.yml
          git rm .github/workflows/repair-and-dispatch-protected-preview-v2.yml
          git commit -m "fix: use native curl args after Vercel separator"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Dispatch repaired acceptance workflow on the durable branch head
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/dispatch.json
          import json, os
          print(json.dumps({'ref': os.environ['GITHUB_REF_NAME']}))
          PY
          curl --fail-with-body \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/evidence-credibility-shadow-protected-preview-acceptance-v2.yml/dispatches" \
            --data-binary @/tmp/dispatch.json
