name: QA authenticated Home Feed bundle

on:
  push:
    branches:
      - qa/home-authenticated-feed-20260727

permissions:
  contents: write

concurrency:
  group: qa-home-authenticated-feed-20260727
  cancel-in-progress: false

jobs:
  apply-verify-publish:
    if: ${{ !contains(github.event.head_commit.message, '[verification-failure]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      BRANCH: qa/home-authenticated-feed-20260727
      BASE_SHA: eebf509a970cb69f0586dd990987b486f7db1584
      BUNDLE_SHA256: ed4c7c637288e9e7e0123503648ef9a7dbc02fdf3d9c506cc986ed8d1d0f6d08
      BUNDLE_DIR: /tmp/home-feed-bundle/moraltrade-home-authenticated-feed-eebf509a

    steps:
      - name: Check out the staged branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Reconstruct and authenticate the reviewed bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/home-feed-bundle
          cat .qa/home-authenticated-feed-bundle/part-* > /tmp/home-feed-bundle.b64
          base64 --decode /tmp/home-feed-bundle.b64 > /tmp/home-feed-bundle.zip
          echo "${BUNDLE_SHA256}  /tmp/home-feed-bundle.zip" | sha256sum -c -
          unzip -q /tmp/home-feed-bundle.zip -d /tmp/home-feed-bundle
          chmod +x "${BUNDLE_DIR}/apply.sh" "${BUNDLE_DIR}/verify.sh"
          unzip -t /tmp/home-feed-bundle.zip | tee /tmp/bundle-integrity.log

      - name: Restore the exact reviewed base
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard "${BASE_SHA}"
          git clean -fdx
          test "$(git rev-parse HEAD)" = "${BASE_SHA}"

      - name: Install exact-base dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund 2>&1 | tee /tmp/npm-ci-baseline-exact.log

      - name: Measure the exact-base test baseline
        shell: bash
        run: |
          set -uo pipefail
          set +e
          npm test 2>&1 | tee /tmp/test-baseline-exact.log
          status=${PIPESTATUS[0]}
          set -e
          echo "${status}" > /tmp/test-baseline-exact.status
          echo "Exact-base npm test status: ${status}"

      - name: Apply the bundle at its reviewed base
        shell: bash
        run: |
          set -euo pipefail
          "${BUNDLE_DIR}/apply.sh" "${GITHUB_WORKSPACE}" 2>&1 | tee /tmp/apply.log

      - name: Require the exact intended changed-file set
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/expected-paths.txt <<'EOF'
          package.json
          public/moral-trade-live-now.js
          src/app/api/live-now-a1/route.ts
          src/app/page.tsx
          src/components/home/home-page.tsx
          src/components/home/returning-home.module.css
          src/home-feed-contract.test.ts
          src/lib/home-feed-snapshot.test.ts
          src/lib/home-feed-snapshot.ts
          src/lib/live-now-a1-response.ts
          src/lib/pareto-feed-runtime.ts
          src/pareto-recommendation-wiring.test.ts
          tests/returning-homepage.spec.ts
          EOF
          {
            git diff --name-only
            git ls-files --others --exclude-standard
          } | LC_ALL=C sort -u > /tmp/actual-paths.txt
          LC_ALL=C sort -o /tmp/expected-paths.txt /tmp/expected-paths.txt
          diff -u /tmp/expected-paths.txt /tmp/actual-paths.txt | tee /tmp/changed-paths.diff
          git diff --check

      - name: Refresh dependencies for the patched package contract
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund 2>&1 | tee /tmp/npm-ci-exact.log

      - name: Install Chromium for targeted browser verification
        shell: bash
        run: |
          set -euo pipefail
          npx playwright install --with-deps chromium 2>&1 | tee /tmp/playwright-install.log

      - name: Require the patch-specific Pareto and Home Feed gate
        shell: bash
        run: |
          set -euo pipefail
          npm run verify:pareto 2>&1 | tee /tmp/verify-pareto-exact.log

      - name: Run the supplied verify.sh on the exact reviewed base
        shell: bash
        run: |
          set -uo pipefail
          set +e
          "${BUNDLE_DIR}/verify.sh" "${GITHUB_WORKSPACE}" 2>&1 | tee /tmp/verify-exact.log
          status=${PIPESTATUS[0]}
          set -e
          echo "${status}" > /tmp/verify-exact.status
          echo "Exact-base verify.sh status: ${status}"

      - name: Prove verify.sh introduced no test failure beyond the exact-base baseline
        shell: bash
        run: |
          set -euo pipefail
          python - /tmp/test-baseline-exact.log /tmp/test-baseline-exact.status /tmp/verify-exact.log /tmp/verify-exact.status /tmp/exact-baseline-comparison.txt <<'PY'
          from __future__ import annotations
          from collections import Counter
          from pathlib import Path
          import re
          import sys

          baseline_log, baseline_status_path, candidate_log, candidate_status_path, report_path = map(Path, sys.argv[1:])

          def read_status(path: Path) -> int:
              return int(path.read_text(encoding="utf-8").strip())

          def parse(path: Path):
              text = path.read_text(encoding="utf-8", errors="replace")
              failures = Counter()
              for line in text.splitlines():
                  match = re.match(r"^\s*not ok\s+\d+\s+-\s+(.+?)\s*$", line)
                  if match:
                      failures[match.group(1)] += 1
              summaries = [int(value) for value in re.findall(r"^# fail\s+(\d+)\s*$", text, re.MULTILINE)]
              tests = [int(value) for value in re.findall(r"^# tests\s+(\d+)\s*$", text, re.MULTILINE)]
              return failures, summaries[-1] if summaries else None, tests[-1] if tests else None

          baseline_status = read_status(baseline_status_path)
          candidate_status = read_status(candidate_status_path)
          baseline_failures, baseline_fail_count, baseline_test_count = parse(baseline_log)
          candidate_failures, candidate_fail_count, candidate_test_count = parse(candidate_log)
          unexpected = candidate_failures - baseline_failures
          resolved = baseline_failures - candidate_failures

          lines = [
              f"baseline_status={baseline_status}",
              f"candidate_verify_status={candidate_status}",
              f"baseline_test_count={baseline_test_count}",
              f"candidate_test_count={candidate_test_count}",
              f"baseline_fail_count={baseline_fail_count}",
              f"candidate_fail_count={candidate_fail_count}",
              f"unexpected_failure_count={sum(unexpected.values())}",
              f"resolved_baseline_failure_count={sum(resolved.values())}",
          ]
          if unexpected:
              lines.append("unexpected_failures:")
              for name, count in sorted(unexpected.items()):
                  lines.append(f"  {count}x {name}")
          if resolved:
              lines.append("resolved_baseline_failures:")
              for name, count in sorted(resolved.items()):
                  lines.append(f"  {count}x {name}")
          report_path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          print(report_path.read_text(encoding="utf-8"))

          if unexpected:
              raise SystemExit("verify.sh produced failures not present at the exact base")
          if candidate_status != 0 and (candidate_fail_count is None or candidate_fail_count == 0):
              raise SystemExit("verify.sh failed outside the established npm-test baseline")
          if baseline_status == 0 and candidate_status != 0:
              raise SystemExit("verify.sh failed although the exact-base test suite passed")
          if candidate_fail_count is not None and candidate_fail_count != sum(candidate_failures.values()):
              raise SystemExit("candidate TAP failure summary did not match parsed failing subtests")
          PY

      - name: Run the verify.sh gates that follow the established full-suite baseline
        shell: bash
        run: |
          set -euo pipefail
          npm run lint 2>&1 | tee /tmp/lint-exact.log
          npm run build 2>&1 | tee /tmp/build-exact.log
          npx playwright test tests/returning-homepage.spec.ts 2>&1 | tee /tmp/playwright-exact.log

      - name: Commit the verified exact-base implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            package.json \
            public/moral-trade-live-now.js \
            src/app/api/live-now-a1/route.ts \
            src/app/page.tsx \
            src/components/home/home-page.tsx \
            src/components/home/returning-home.module.css \
            src/home-feed-contract.test.ts \
            src/lib/home-feed-snapshot.test.ts \
            src/lib/home-feed-snapshot.ts \
            src/lib/live-now-a1-response.ts \
            src/lib/pareto-feed-runtime.ts \
            src/pareto-recommendation-wiring.test.ts \
            tests/returning-homepage.spec.ts
          git diff --cached --check
          git commit -m "Use the authenticated Feed snapshot on Home"
          git show --stat --oneline --decorate HEAD | tee /tmp/implementation-commit.txt

      - name: Measure the current-main test baseline in an isolated worktree
        shell: bash
        run: |
          set -uo pipefail
          git fetch origin main
          rm -rf /tmp/home-feed-main-baseline
          git worktree add --detach /tmp/home-feed-main-baseline origin/main
          pushd /tmp/home-feed-main-baseline
          npm ci --no-audit --no-fund 2>&1 | tee /tmp/npm-ci-baseline-main.log
          set +e
          npm test 2>&1 | tee /tmp/test-baseline-main.log
          status=${PIPESTATUS[0]}
          set -e
          echo "${status}" > /tmp/test-baseline-main.status
          popd
          git worktree remove --force /tmp/home-feed-main-baseline
          echo "Current-main npm test status: ${status}"

      - name: Rebase the verified commit onto current main
        shell: bash
        run: |
          set -euo pipefail
          git rebase origin/main 2>&1 | tee /tmp/rebase.log
          git merge-base --is-ancestor origin/main HEAD
          test "$(git rev-list --count origin/main..HEAD)" = "1"

      - name: Refresh dependencies for the rebased candidate
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund 2>&1 | tee /tmp/npm-ci-rebased.log

      - name: Require the rebased patch-specific gate
        shell: bash
        run: |
          set -euo pipefail
          npm run verify:pareto 2>&1 | tee /tmp/verify-pareto-rebased.log

      - name: Run the supplied verify.sh on the rebased candidate
        shell: bash
        run: |
          set -uo pipefail
          set +e
          "${BUNDLE_DIR}/verify.sh" "${GITHUB_WORKSPACE}" 2>&1 | tee /tmp/verify-rebased.log
          status=${PIPESTATUS[0]}
          set -e
          echo "${status}" > /tmp/verify-rebased.status
          echo "Rebased verify.sh status: ${status}"

      - name: Prove the rebased candidate introduced no failure beyond current main
        shell: bash
        run: |
          set -euo pipefail
          python - /tmp/test-baseline-main.log /tmp/test-baseline-main.status /tmp/verify-rebased.log /tmp/verify-rebased.status /tmp/rebased-baseline-comparison.txt <<'PY'
          from __future__ import annotations
          from collections import Counter
          from pathlib import Path
          import re
          import sys

          baseline_log, baseline_status_path, candidate_log, candidate_status_path, report_path = map(Path, sys.argv[1:])

          def read_status(path: Path) -> int:
              return int(path.read_text(encoding="utf-8").strip())

          def parse(path: Path):
              text = path.read_text(encoding="utf-8", errors="replace")
              failures = Counter()
              for line in text.splitlines():
                  match = re.match(r"^\s*not ok\s+\d+\s+-\s+(.+?)\s*$", line)
                  if match:
                      failures[match.group(1)] += 1
              summaries = [int(value) for value in re.findall(r"^# fail\s+(\d+)\s*$", text, re.MULTILINE)]
              tests = [int(value) for value in re.findall(r"^# tests\s+(\d+)\s*$", text, re.MULTILINE)]
              return failures, summaries[-1] if summaries else None, tests[-1] if tests else None

          baseline_status = read_status(baseline_status_path)
          candidate_status = read_status(candidate_status_path)
          baseline_failures, baseline_fail_count, baseline_test_count = parse(baseline_log)
          candidate_failures, candidate_fail_count, candidate_test_count = parse(candidate_log)
          unexpected = candidate_failures - baseline_failures
          resolved = baseline_failures - candidate_failures

          lines = [
              f"baseline_status={baseline_status}",
              f"candidate_verify_status={candidate_status}",
              f"baseline_test_count={baseline_test_count}",
              f"candidate_test_count={candidate_test_count}",
              f"baseline_fail_count={baseline_fail_count}",
              f"candidate_fail_count={candidate_fail_count}",
              f"unexpected_failure_count={sum(unexpected.values())}",
              f"resolved_baseline_failure_count={sum(resolved.values())}",
          ]
          if unexpected:
              lines.append("unexpected_failures:")
              for name, count in sorted(unexpected.items()):
                  lines.append(f"  {count}x {name}")
          if resolved:
              lines.append("resolved_baseline_failures:")
              for name, count in sorted(resolved.items()):
                  lines.append(f"  {count}x {name}")
          report_path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          print(report_path.read_text(encoding="utf-8"))

          if unexpected:
              raise SystemExit("rebased verify.sh produced failures not present on current main")
          if candidate_status != 0 and (candidate_fail_count is None or candidate_fail_count == 0):
              raise SystemExit("rebased verify.sh failed outside the current-main npm-test baseline")
          if baseline_status == 0 and candidate_status != 0:
              raise SystemExit("rebased verify.sh failed although current main's test suite passed")
          if candidate_fail_count is not None and candidate_fail_count != sum(candidate_failures.values()):
              raise SystemExit("rebased TAP failure summary did not match parsed failing subtests")
          PY

      - name: Run the remaining rebased verify.sh gates
        shell: bash
        run: |
          set -euo pipefail
          npm run lint 2>&1 | tee /tmp/lint-rebased.log
          npm run build 2>&1 | tee /tmp/build-rebased.log
          npx playwright test tests/returning-homepage.spec.ts 2>&1 | tee /tmp/playwright-rebased.log
          git diff --exit-code
          git diff --cached --exit-code
          git rev-parse HEAD | tee /tmp/final-head-sha.txt

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: home-authenticated-feed-verification
          if-no-files-found: ignore
          retention-days: 14
          path: |
            /tmp/bundle-integrity.log
            /tmp/npm-ci-baseline-exact.log
            /tmp/test-baseline-exact.log
            /tmp/test-baseline-exact.status
            /tmp/apply.log
            /tmp/expected-paths.txt
            /tmp/actual-paths.txt
            /tmp/changed-paths.diff
            /tmp/npm-ci-exact.log
            /tmp/playwright-install.log
            /tmp/verify-pareto-exact.log
            /tmp/verify-exact.log
            /tmp/verify-exact.status
            /tmp/exact-baseline-comparison.txt
            /tmp/lint-exact.log
            /tmp/build-exact.log
            /tmp/playwright-exact.log
            /tmp/implementation-commit.txt
            /tmp/npm-ci-baseline-main.log
            /tmp/test-baseline-main.log
            /tmp/test-baseline-main.status
            /tmp/rebase.log
            /tmp/npm-ci-rebased.log
            /tmp/verify-pareto-rebased.log
            /tmp/verify-rebased.log
            /tmp/verify-rebased.status
            /tmp/rebased-baseline-comparison.txt
            /tmp/lint-rebased.log
            /tmp/build-rebased.log
            /tmp/playwright-rebased.log
            /tmp/final-head-sha.txt

      - name: Publish the verified branch candidate
        shell: bash
        run: |
          set -euo pipefail
          git push \
            --force-with-lease="refs/heads/${BRANCH}:${GITHUB_SHA}" \
            origin \
            "HEAD:refs/heads/${BRANCH}"

      - name: Persist a failure report on the staging branch
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/home-feed-failure
          {
            echo "Authenticated Home Feed bundle verification failed."
            echo "staging_sha=${GITHUB_SHA}"
            echo "base_sha=${BASE_SHA}"
            echo "recorded_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            for log in \
              /tmp/bundle-integrity.log \
              /tmp/test-baseline-exact.status \
              /tmp/apply.log \
              /tmp/changed-paths.diff \
              /tmp/verify-pareto-exact.log \
              /tmp/verify-exact.status \
              /tmp/exact-baseline-comparison.txt \
              /tmp/lint-exact.log \
              /tmp/build-exact.log \
              /tmp/playwright-exact.log \
              /tmp/implementation-commit.txt \
              /tmp/test-baseline-main.status \
              /tmp/rebase.log \
              /tmp/verify-pareto-rebased.log \
              /tmp/verify-rebased.status \
              /tmp/rebased-baseline-comparison.txt \
              /tmp/lint-rebased.log \
              /tmp/build-rebased.log \
              /tmp/playwright-rebased.log; do
              if test -f "${log}"; then
                echo "===== ${log} ====="
                tail -n 1000 "${log}"
                echo
              fi
            done
          } > /tmp/home-feed-failure/home-feed-verification.log

          git reset --hard "${GITHUB_SHA}"
          git clean -fdx
          mkdir -p .qa-results
          cp /tmp/home-feed-failure/home-feed-verification.log .qa-results/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .qa-results/home-feed-verification.log
          git commit -m "Record authenticated Home Feed verification failure [verification-failure]"
          git push origin "HEAD:refs/heads/${BRANCH}"
