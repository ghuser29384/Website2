name: Repair live pledge-impact type guards

on:
  push:
    branches:
      - feature/pledge-impact-live-foundation-20260801
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pledge-impact-live-type-repair
  cancel-in-progress: true

jobs:
  repair:
    if: github.repository == 'ghuser29384/Website2'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/pledge-impact-live-foundation-20260801
          fetch-depth: 0
          persist-credentials: true

      - name: Convert validation helpers into TypeScript type predicates
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "feature/pledge-impact-live-foundation-20260801"
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/lib/mpgf/pledge-impact-live.ts')
          text = path.read_text()

          replacements = [
              (
                  'function isSafeInteger(value: unknown, minimum = Number.MIN_SAFE_INTEGER, maximum = Number.MAX_SAFE_INTEGER) {',
                  '''function isSafeInteger(
  value: unknown,
  minimum = Number.MIN_SAFE_INTEGER,
  maximum = Number.MAX_SAFE_INTEGER,
): value is number {''',
              ),
              (
                  'function isFiniteNumber(value: unknown, minimum = -Infinity, maximum = Infinity) {',
                  '''function isFiniteNumber(
  value: unknown,
  minimum = -Infinity,
  maximum = Infinity,
): value is number {''',
              ),
              (
                  'function isIsoTimestamp(value: unknown) {',
                  'function isIsoTimestamp(value: unknown): value is string {',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one type-guard match, found {count}: {old!r}')
              text = text.replace(old, new)

          path.write_text(text)
          PY

      - name: Publish repair and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/mpgf/pledge-impact-live.ts
          git rm .github/workflows/pledge-impact-live-type-repair.yml
          git commit -m "Narrow live pledge-impact validation types"
          git push origin HEAD:feature/pledge-impact-live-foundation-20260801
