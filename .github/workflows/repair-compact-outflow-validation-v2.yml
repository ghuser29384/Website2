name: Repair Compact outflow validation v2

on:
  push:
    branches:
      - feature/compact-authoritative-outflow-ledger-v1-20260816
    paths:
      - .github/workflows/repair-compact-outflow-validation-v2.yml

permissions:
  contents: write

concurrency:
  group: repair-compact-outflow-validation-v2-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Repair runtime scan and PostgreSQL row selection
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/compact-authoritative-outflow-ledger-qa.yml')
          source = workflow.read_text(encoding='utf-8')
          old_scan = '''          if grep -R -E "createServiceClient|SUPABASE_SERVICE_ROLE_KEY|STRIPE_SECRET_KEY|EVERY_ORG" \\
            src/components/mpgf/mpgf-public-goods-compacts.tsx \\
            src/lib/mpgf/compact-authoritative-outflow*.ts; then
'''
          new_scan = '''          if grep -R -E "createServiceClient|SUPABASE_SERVICE_ROLE_KEY|STRIPE_SECRET_KEY|EVERY_ORG" \\
            src/components/mpgf/mpgf-public-goods-compacts.tsx \\
            src/lib/mpgf/compact-authoritative-outflow.ts; then
'''
          if source.count(old_scan) != 1:
              raise SystemExit('Expected one runtime credential-scan block.')
          workflow.write_text(source.replace(old_scan, new_scan), encoding='utf-8')

          migration = Path('supabase/migrations/20260816141501_compact_authoritative_outflow_freeze_v1.sql')
          sql = migration.read_text(encoding='utf-8')
          old_select = '''  select coverage, metadata into coverage_record, coverage_meta
  from public.mpgf_public_goods_outflow_coverage_snapshots coverage
  join moral_trade_private.compact_outflow_coverage_metadata metadata
    on metadata.coverage_snapshot_id = coverage.id
  where coverage.participant_id = p_participant_id
    and coverage.cycle_key = p_cycle_key
    and metadata.authority_status <> 'provisional'
  order by metadata.created_at desc, coverage.id desc limit 1;
'''
          new_select = '''  select coverage.* into coverage_record
  from public.mpgf_public_goods_outflow_coverage_snapshots coverage
  join moral_trade_private.compact_outflow_coverage_metadata metadata
    on metadata.coverage_snapshot_id = coverage.id
  where coverage.participant_id = p_participant_id
    and coverage.cycle_key = p_cycle_key
    and metadata.authority_status <> 'provisional'
  order by metadata.created_at desc, coverage.id desc limit 1;

  if coverage_record.id is not null then
    select * into coverage_meta
    from moral_trade_private.compact_outflow_coverage_metadata
    where coverage_snapshot_id = coverage_record.id;
  end if;
'''
          if sql.count(old_select) != 1:
              raise SystemExit('Expected one composite-row coverage selection.')
          migration.write_text(sql.replace(old_select, new_select), encoding='utf-8')
          PY
          git diff --check
          ! grep -q 'compact-authoritative-outflow\*.ts; then' .github/workflows/compact-authoritative-outflow-ledger-qa.yml
          ! grep -q 'select coverage, metadata into coverage_record' supabase/migrations/20260816141501_compact_authoritative_outflow_freeze_v1.sql
          grep -q 'select coverage\.\* into coverage_record' supabase/migrations/20260816141501_compact_authoritative_outflow_freeze_v1.sql

      - name: Commit durable repairs and remove controller
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/compact-authoritative-outflow-ledger-qa.yml \
            supabase/migrations/20260816141501_compact_authoritative_outflow_freeze_v1.sql
          git rm .github/workflows/repair-compact-outflow-validation-v2.yml
          git commit -m "fix: repair Compact outflow exact-head validation"
          git push origin "HEAD:${GITHUB_REF_NAME}"
