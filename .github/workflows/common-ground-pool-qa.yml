name: Common Ground Pool QA

on:
  pull_request:
    paths:
      - ".github/workflows/common-ground-pool-qa.yml"
      - "docs/common-ground-pool.md"
      - "src/app/mpgf/common-ground-pool/**"
      - "src/app/mpgf/page.tsx"
      - "src/lib/mpgf/common-ground-pool.ts"
      - "src/lib/mpgf/common-ground-pool.test.ts"
      - "tests/common-ground-pool.spec.ts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: common-ground-pool-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact pull request head
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Common Ground Pool unit and source-contract tests
        run: node --import tsx --test src/lib/mpgf/common-ground-pool.test.ts

      - name: Lint changed implementation
        run: >-
          npx eslint
          src/app/mpgf/common-ground-pool/page.tsx
          src/app/mpgf/common-ground-pool/common-ground-pool-builder.tsx
          src/app/mpgf/page.tsx
          src/lib/mpgf/common-ground-pool.ts
          src/lib/mpgf/common-ground-pool.test.ts
          tests/common-ground-pool.spec.ts

      - name: Run production build and TypeScript checks
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Common Ground Pool browser tests
        run: npx playwright test tests/common-ground-pool.spec.ts --reporter=line
