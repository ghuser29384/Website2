name: MPGF DAC success, lapse, and pledge-expiry gates

on:
  push:
    branches:
      - fix/mpgf-dac-success-lapse-20260807
    paths:
      - ".github/workflows/mpgf-dac-success-lapse-gates.yml"
      - "src/lib/mpgf/dac-success-lapse-migration.test.ts"
      - "supabase/migrations/20260807050000_mpgf_dac_success_lapse.sql"
      - "supabase/tests/mpgf_dac_success_lapse.sql"
  pull_request:
    branches:
      - fix/mpgf-dac-pledge-intent-ledger-20260806
    paths:
      - ".github/workflows/mpgf-dac-success-lapse-gates.yml"
      - "src/lib/mpgf/dac-success-lapse-migration.test.ts"
      - "supabase/migrations/20260807050000_mpgf_dac_success_lapse.sql"
      - "supabase/tests/mpgf_dac_success_lapse.sql"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mpgf-dac-success-lapse-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  MIGRATION_PATH: supabase/migrations/20260807050000_mpgf_dac_success_lapse.sql
  REGRESSION_PATH: supabase/tests/mpgf_dac_success_lapse.sql
  SOURCE_TEST_PATH: src/lib/mpgf/dac-success-lapse-migration.test.ts

jobs:
  source-gates:
    name: Exact-head source, tests, lint, typecheck, and build
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha || '35f44095f4ec85c7670b752fff1a0da18e24944a' }}
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      NEXT_PUBLIC_SITE_URL: https://www.moraltrade.org
      SITE_URL: https://www.moraltrade.org
      VERCEL: "1"
      VERCEL_ENV: preview
      CONDITIONAL_PAYMENTS_MODE: disabled
      TRADE_DONATION_POOL_ENABLED: "false"
      TRADE_DONATION_POOL_MODE: disabled
      DIRECT_DONATION_UPGRADES_ENABLED: "false"
      DIRECT_DONATION_UPGRADE_MODE: disabled

    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Verify exact candidate identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          git merge-base --is-ancestor "$EXPECTED_BASE_SHA" HEAD
          {
            printf 'commit=%s\n' "$(git rev-parse HEAD)"
            printf 'tree=%s\n' "$(git rev-parse HEAD^{tree})"
            sha256sum "$MIGRATION_PATH" "$REGRESSION_PATH" "$SOURCE_TEST_PATH"
          } | tee mpgf-dac-terminal-exact-head.txt

      - name: Install exact dependencies
        run: npm ci

      - name: Run focused terminal-lifecycle contracts
        run: |
          set -euo pipefail
          node --import tsx --test "$SOURCE_TEST_PATH" \
            | tee mpgf-dac-terminal-focused.log

      - name: Run complete repository tests
        run: |
          set -euo pipefail
          npm test | tee mpgf-dac-terminal-repository-tests.log

      - name: Run repository lint
        run: |
          set -euo pipefail
          npm run lint -- --quiet | tee mpgf-dac-terminal-lint.log

      - name: Run strict TypeScript
        run: |
          set -euo pipefail
          npx tsc --noEmit | tee mpgf-dac-terminal-typecheck.log

      - name: Build the production application
        run: |
          set -euo pipefail
          npm run build | tee mpgf-dac-terminal-build.log

      - name: Verify exact diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          git diff --check "$EXPECTED_BASE_SHA" "$EXPECTED_HEAD_SHA"
          git diff --name-only "$EXPECTED_BASE_SHA" "$EXPECTED_HEAD_SHA" \
            | sort | tee mpgf-dac-terminal-diff-files.txt

      - name: Upload source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mpgf-dac-terminal-source-${{ github.run_id }}
          path: |
            mpgf-dac-terminal-*.txt
            mpgf-dac-terminal-*.log
          if-no-files-found: warn
          retention-days: 14

  isolated-qa:
    name: Exactly-once success, lapse, expiry, RLS, and no-payment proof
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    needs: source-gates
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      EXPECTED_QA_POOLER_HOST: aws-0-us-west-1.pooler.supabase.com
      EXPECTED_QA_REF: hvmxfjjbdcgjjudmthdz
      PGSSLMODE: require
      QA_SUPABASE_DB_URL: ${{ secrets.QA_SUPABASE_DB_URL }}

    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact isolated-QA target
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test -n "${QA_SUPABASE_DB_URL:-}"
          python3 - <<'PY'
          import os
          from urllib.parse import parse_qs, urlparse

          parsed = urlparse(os.environ["QA_SUPABASE_DB_URL"])
          ssl_modes = parse_qs(parsed.query).get("sslmode", ["require"])
          valid = (
              parsed.scheme in {"postgres", "postgresql"}
              and os.environ["EXPECTED_QA_REF"] in (parsed.username or "")
              and parsed.hostname == os.environ["EXPECTED_QA_POOLER_HOST"]
              and parsed.port == 5432
              and parsed.path == "/postgres"
              and ssl_modes == ["require"]
              and bool(parsed.password)
          )
          if not valid:
              raise SystemExit("Refusing a database URL outside the exact TLS-only Moral Trade QA target.")
          PY

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes postgresql-client > /dev/null

      - name: Verify the parent DAC pledge foundation
        shell: bash
        run: |
          set -euo pipefail
          psql "$QA_SUPABASE_DB_URL" \
            --no-psqlrc \
            --set ON_ERROR_STOP=1 \
            --tuples-only \
            --no-align <<'SQL' | tee mpgf-dac-terminal-parent-foundation.txt
          select 'intent_table=' ||
            (to_regclass('public.mpgf_dac_pledge_intents') is not null);
          select 'event_table=' ||
            (to_regclass('public.mpgf_dac_pledge_events') is not null);
          select 'canonical_pledge_rpc=' ||
            (to_regprocedure('public.mpgf_create_dac_pledge(text,bigint,text,text,text)') is not null);
          SQL
          grep -Fxq 'intent_table=true' mpgf-dac-terminal-parent-foundation.txt
          grep -Fxq 'event_table=true' mpgf-dac-terminal-parent-foundation.txt
          grep -Fxq 'canonical_pledge_rpc=true' mpgf-dac-terminal-parent-foundation.txt

      - name: Compile the additive terminal migration in a rollback-only transaction
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path("supabase/migrations/20260807050000_mpgf_dac_success_lapse.sql").read_text()
          if not source.lstrip().startswith("begin;"):
              raise SystemExit("Migration does not begin with begin;")
          if not source.rstrip().endswith("commit;"):
              raise SystemExit("Migration does not end with commit;")
          compiled = source.rstrip()[:-len("commit;")] + "rollback;\n"
          Path("mpgf-dac-terminal-migration-rollback.sql").write_text(compiled)
          PY
          psql "$QA_SUPABASE_DB_URL" \
            --no-psqlrc \
            --set ON_ERROR_STOP=1 \
            --file mpgf-dac-terminal-migration-rollback.sql \
            2>&1 | tee mpgf-dac-terminal-compile.log

      - name: Apply the additive success-and-lapse foundation to isolated QA
        shell: bash
        run: |
          set -euo pipefail
          sha256sum "$MIGRATION_PATH" | tee mpgf-dac-terminal-migration.sha256
          psql "$QA_SUPABASE_DB_URL" \
            --no-psqlrc \
            --set ON_ERROR_STOP=1 \
            --file "$MIGRATION_PATH" \
            2>&1 | tee mpgf-dac-terminal-apply.log

      - name: Run rollback-only multi-role success-and-lapse regression
        shell: bash
        run: |
          set -euo pipefail
          psql "$QA_SUPABASE_DB_URL" \
            --no-psqlrc \
            --set ON_ERROR_STOP=1 \
            --file "$REGRESSION_PATH" \
            2>&1 | tee mpgf-dac-terminal-regression.log

      - name: Prove zero fixture residue and one canonical ledger
        shell: bash
        run: |
          set -euo pipefail
          psql "$QA_SUPABASE_DB_URL" \
            --no-psqlrc \
            --set ON_ERROR_STOP=1 \
            --tuples-only \
            --no-align <<'SQL' | tee mpgf-dac-terminal-zero-residue.txt
          select 'fixture_residue=' || (
            (select count(*) from auth.users where id in (
              'aa111111-1111-4111-8111-111111111111',
              'ab222222-2222-4222-8222-222222222222',
              'ac333333-3333-4333-8333-333333333333',
              'ad444444-4444-4444-8444-444444444444',
              'ae555555-5555-4555-8555-555555555555'
            ))
            + (select count(*) from public.profiles where id in (
              'aa111111-1111-4111-8111-111111111111',
              'ab222222-2222-4222-8222-222222222222',
              'ac333333-3333-4333-8333-333333333333',
              'ad444444-4444-4444-8444-444444444444',
              'ae555555-5555-4555-8555-555555555555'
            ))
            + (select count(*) from public.mpgf_pool_reviewers where reviewer_id = 'ab222222-2222-4222-8222-222222222222')
            + (select count(*) from public.mpgf_pool_proposals where id in (
              'af666666-6666-4666-8666-666666666666',
              'af777777-7777-4777-8777-777777777777'
            ))
            + (select count(*) from public.mpgf_pool_proposal_versions where proposal_id in (
              'af666666-6666-4666-8666-666666666666',
              'af777777-7777-4777-8777-777777777777'
            ))
            + (select count(*) from public.mpgf_pool_lifecycle_events where proposal_id in (
              'af666666-6666-4666-8666-666666666666',
              'af777777-7777-4777-8777-777777777777'
            ))
            + (select count(*) from public.mpgf_public_goods_campaigns where id in (
              'campaign-af666666666646668666666666666666',
              'campaign-af777777777747778777777777777777'
            ))
            + (select count(*) from public.mpgf_public_goods_pledges where campaign_id in (
              'campaign-af666666666646668666666666666666',
              'campaign-af777777777747778777777777777777'
            ))
            + (select count(*) from public.mpgf_dac_pledge_intents where campaign_id in (
              'campaign-af666666666646668666666666666666',
              'campaign-af777777777747778777777777777777'
            ))
            + (select count(*) from public.mpgf_dac_pledge_events where campaign_id in (
              'campaign-af666666666646668666666666666666',
              'campaign-af777777777747778777777777777777'
            ))
            + (select count(*) from public.mpgf_dac_campaign_outcomes where campaign_id in (
              'campaign-af666666666646668666666666666666',
              'campaign-af777777777747778777777777777777'
            ))
            + (select count(*) from public.mpgf_failure_bonus_premium_quotes where pool_proposal_id in (
              'af666666-6666-4666-8666-666666666666',
              'af777777-7777-4777-8777-777777777777'
            ))
            + (select count(*) from public.mpgf_public_goods_rounds where id = 'qa-dac-terminal-round-20260807')
            + (select count(*) from public.mpgf_public_goods_match_pools where id = 'qa-dac-terminal-match-20260807')
          );
          select 'conditional_ledger_absent=' ||
            (to_regclass('public.mpgf_conditional_pledges') is null);
          select 'outcome_rows=' || count(*)
          from public.mpgf_dac_campaign_outcomes;
          SQL
          grep -Fxq 'fixture_residue=0' mpgf-dac-terminal-zero-residue.txt
          grep -Fxq 'conditional_ledger_absent=true' mpgf-dac-terminal-zero-residue.txt
          grep -Fxq 'outcome_rows=0' mpgf-dac-terminal-zero-residue.txt

      - name: Record terminal schema, authorization, public audit, and no-payment boundary
        shell: bash
        run: |
          set -euo pipefail
          psql "$QA_SUPABASE_DB_URL" \
            --no-psqlrc \
            --set ON_ERROR_STOP=1 \
            --pset pager=off \
            --tuples-only \
            --no-align <<'SQL' | tee mpgf-dac-terminal-schema-proof.txt
          select 'outcome_table=' ||
            (to_regclass('public.mpgf_dac_campaign_outcomes') is not null);
          select 'eligibility_rpc=' ||
            (to_regprocedure('public.mpgf_review_dac_pledge_eligibility(uuid,uuid,text,integer,text)') is not null);
          select 'finalization_rpc=' ||
            (to_regprocedure('public.mpgf_finalize_dac_campaign(text,uuid,text)') is not null);
          select 'public_outcome_policy=' || count(*)
          from pg_policies
          where schemaname = 'public'
            and tablename = 'mpgf_dac_campaign_outcomes'
            and policyname = 'mpgf_dac_campaign_outcomes_public_select';
          select 'pool_succeeded=' ||
            (pg_get_constraintdef(oid) like '%pool_succeeded%')
          from pg_constraint
          where conrelid = 'public.mpgf_pool_lifecycle_events'::regclass
            and conname = 'mpgf_pool_lifecycle_events_event_type_check';
          select 'pool_lapsed=' ||
            (pg_get_constraintdef(oid) like '%pool_lapsed%')
          from pg_constraint
          where conrelid = 'public.mpgf_pool_lifecycle_events'::regclass
            and conname = 'mpgf_pool_lifecycle_events_event_type_check';
          select 'payment_refs=' || count(*)
          from public.mpgf_public_goods_pledges
          where pledge_intent_id is not null
            and (
              payment_intent_ref is not null
              or status = 'captured'
            );
          SQL
          grep -Fxq 'outcome_table=true' mpgf-dac-terminal-schema-proof.txt
          grep -Fxq 'eligibility_rpc=true' mpgf-dac-terminal-schema-proof.txt
          grep -Fxq 'finalization_rpc=true' mpgf-dac-terminal-schema-proof.txt
          grep -Fxq 'public_outcome_policy=1' mpgf-dac-terminal-schema-proof.txt
          grep -Fxq 'pool_succeeded=true' mpgf-dac-terminal-schema-proof.txt
          grep -Fxq 'pool_lapsed=true' mpgf-dac-terminal-schema-proof.txt
          grep -Fxq 'payment_refs=0' mpgf-dac-terminal-schema-proof.txt

      - name: Upload isolated-QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mpgf-dac-terminal-qa-${{ github.run_id }}
          path: |
            mpgf-dac-terminal-*.log
            mpgf-dac-terminal-*.txt
            mpgf-dac-terminal-*.sha256
            mpgf-dac-terminal-migration-rollback.sql
          if-no-files-found: warn
          retention-days: 14
