name: Issue 721 branch builder

on:
  push:
    branches:
      - work/issue721-builder-20260816

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor == 'ghuser29384'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/issue721-builder-20260816
          fetch-depth: 0
      - name: Materialize the bounded repository-only repair
        shell: bash
        run: |
          set -euo pipefail
          base64 -d scripts/issue721_builder.py.gz.b64 | gzip -d > scripts/issue721_branch_builder.py
          python3 scripts/issue721_branch_builder.py
          rm -f scripts/issue721_builder.py.gz.b64 scripts/issue721_branch_builder.py
          node --check scripts/evidence-payment-qa-namespace.mjs
          node --check scripts/evidence-payment-qa-overlap-proof.mjs
          node --test scripts/evidence-payment-qa-run-ownership.test.mjs
          ruby -e "require 'yaml'; YAML.safe_load_file('.github/workflows/evidence-payment-release-qa.yml', aliases: true)"
          git diff --check
      - name: Commit the materialized candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ghuser29384"
          git config user.email "262476329+ghuser29384@users.noreply.github.com"
          git add --all
          git commit -m "Make Evidence payment QA fixtures run-owned"
          git push origin HEAD:work/issue721-builder-20260816
