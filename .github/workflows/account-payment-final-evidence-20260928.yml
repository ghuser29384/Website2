name: Account payment settings final evidence
on:
  push:
    branches: [ops/payment-methods-implementation-20260928]
    paths: [.github/workflows/account-payment-final-evidence-20260928.yml]
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ACCOUNT_PAYMENTS_FIXTURE: '1'
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54333
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: fixture-publishable
      SUPABASE_SERVICE_ROLE_KEY: fixture-service
      STRIPE_SECRET_KEY: sk_test_account_payment_fixture
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3210
      SITE_URL: http://127.0.0.1:3210
      VERCEL_ENV: preview
      PLAYWRIGHT_USE_PRODUCTION_SERVER: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3ef9f86a41257b585c2a940df74c2bf03f16793b
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Guard exact source and runtime equivalence
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = ghuser29384/Website2
          test "$(git rev-parse HEAD)" = 3ef9f86a41257b585c2a940df74c2bf03f16793b
          test "$(git rev-parse HEAD^)" = ba062d0d1864bf3167cfc42c0514648eb8676d09
          mkdir -p /tmp/account-payment-settings-evidence
          python3 - <<'PY'
          import subprocess
          changed=set(subprocess.check_output(['git','diff','--name-only','--no-renames','HEAD^','HEAD']).decode().splitlines())
          assert changed=={'docs/account-payment-methods.md','src/lib/payments/account-payment-service.test.ts','tests/account-payment-settings.spec.ts','supabase/migrations/20260928181500_account_payment_settings.sql','supabase/migrations/20260928182211_account_payment_settings.sql'}
          before=subprocess.check_output(['git','show','HEAD^:supabase/migrations/20260928181500_account_payment_settings.sql'])
          after=subprocess.check_output(['git','show','HEAD:supabase/migrations/20260928182211_account_payment_settings.sql'])
          assert before==after
          print('All runtime source, configuration and SQL contents unchanged from ba062d0; only migration identity, references and a scoped QA selector changed.')
          PY
          git diff --check HEAD^
          git rev-parse HEAD HEAD^{tree} > /tmp/account-payment-settings-evidence/source-identity.txt
      - run: npm ci
      - name: Exact-head source quality gates
        run: |
          set -euo pipefail
          node --check tests/fixtures/account-payments-preload.cjs
          node --import tsx --test src/lib/payments/account-payment-service.test.ts src/lib/live-account-actions.test.ts src/live-account-data.test.ts | tee /tmp/account-payment-settings-evidence/focused.log
          # The normal repository unit suite runs without a configured external
          # backend. Loopback fixtures start only in the later browser runner.
          # Do not let those browser-only variables redirect unrelated unit tests.
          env -u NEXT_PUBLIC_SUPABASE_URL -u NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY -u SUPABASE_SERVICE_ROLE_KEY -u STRIPE_SECRET_KEY npm test | tee /tmp/account-payment-settings-evidence/unit.log
          npm run lint -- --quiet | tee /tmp/account-payment-settings-evidence/lint.log
          npx tsc --noEmit --pretty false | tee /tmp/account-payment-settings-evidence/types.log
      - name: Exact-head production build and all six server-action browser cases
        run: |
          set -euo pipefail
          npm run build | tee /tmp/account-payment-settings-evidence/build.log
          npx playwright install --with-deps chromium
          export NODE_OPTIONS="--require=$GITHUB_WORKSPACE/tests/fixtures/account-payments-preload.cjs"
          npm run test:e2e -- tests/account-payment-settings.spec.ts --workers=1 --reporter=line | tee /tmp/account-payment-settings-evidence/browser.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: account-payment-accepted-${{ github.run_id }}
          path: |
            /tmp/account-payment-settings-evidence
            test-results
          retention-days: 14
