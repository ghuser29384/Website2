name: Apply LLM query interpretation enablement

on:
  push:
    branches:
      - feat/enable-llm-query-interpretation

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/enable-llm-query-interpretation
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply focused production enablement
        run: |
          python <<'PY'
          from pathlib import Path

          llm_path = Path("src/lib/smart-query-llm.ts")
          llm = llm_path.read_text()
          interface_block = '''export interface LlmSmartQueryResult {
            interpretation: SmartQueryInterpretation;
            target: string;
            usedLlm: boolean;
          }
          '''.replace("          ", "")
          helper_block = '''
          interface SmartQueryLlmEnvironment {
            AI_QUERY_FALLBACK_ENABLED?: string;
            AI_QUERY_FALLBACK_KILL_SWITCH?: string;
            OPENAI_API_KEY?: string;
            VERCEL_ENV?: string;
          }

          /**
           * Production uses the ambiguity resolver whenever a server-side key exists.
           * Preview and local environments remain opt-in. The separate kill switch is
           * the explicit emergency off path in every environment.
           */
          export function isSmartQueryLlmFallbackEnabled(
            environment: SmartQueryLlmEnvironment = process.env,
          ) {
            if (!environment.OPENAI_API_KEY) return false;
            if (environment.AI_QUERY_FALLBACK_KILL_SWITCH === "true") return false;
            if (environment.AI_QUERY_FALLBACK_ENABLED === "true") return true;
            return environment.VERCEL_ENV === "production";
          }
          '''.replace("          ", "")
          if interface_block not in llm:
            raise SystemExit("LlmSmartQueryResult block not found")
          llm = llm.replace(interface_block, interface_block + helper_block, 1)

          old_gate = '''  if (
            !base.needsClarification ||
            base.confidence >= SMART_QUERY_CONFIDENCE_THRESHOLD ||
            process.env.AI_QUERY_FALLBACK_ENABLED !== "true" ||
            !process.env.OPENAI_API_KEY
          ) {
          '''.replace("          ", "")
          new_gate = '''  if (
            !base.needsClarification ||
            base.confidence >= SMART_QUERY_CONFIDENCE_THRESHOLD ||
            !isSmartQueryLlmFallbackEnabled()
          ) {
          '''.replace("          ", "")
          if old_gate not in llm:
            raise SystemExit("Existing LLM feature gate not found")
          llm = llm.replace(old_gate, new_gate, 1)
          llm_path.write_text(llm)

          test_path = Path("src/lib/smart-query.test.ts")
          tests = test_path.read_text()
          import_line = 'import { parseSmartQueryWithClarification } from "./smart-query-clarification";\n'
          replacement_import = import_line + 'import { isSmartQueryLlmFallbackEnabled } from "./smart-query-llm";\n'
          if import_line not in tests:
            raise SystemExit("Smart query clarification import not found")
          tests = tests.replace(import_line, replacement_import, 1)
          test_block = '''

          test("enables the LLM ambiguity fallback in production when a server-side key exists", () => {
            assert.equal(
              isSmartQueryLlmFallbackEnabled({
                AI_QUERY_FALLBACK_ENABLED: "false",
                OPENAI_API_KEY: "server-side-test-key",
                VERCEL_ENV: "production",
              }),
              true,
            );
          });

          test("keeps non-production use opt-in and honors the emergency kill switch", () => {
            assert.equal(
              isSmartQueryLlmFallbackEnabled({
                OPENAI_API_KEY: "server-side-test-key",
                VERCEL_ENV: "preview",
              }),
              false,
            );
            assert.equal(
              isSmartQueryLlmFallbackEnabled({
                AI_QUERY_FALLBACK_ENABLED: "true",
                OPENAI_API_KEY: "server-side-test-key",
                VERCEL_ENV: "preview",
              }),
              true,
            );
            assert.equal(
              isSmartQueryLlmFallbackEnabled({
                AI_QUERY_FALLBACK_KILL_SWITCH: "true",
                OPENAI_API_KEY: "server-side-test-key",
                VERCEL_ENV: "production",
              }),
              false,
            );
            assert.equal(
              isSmartQueryLlmFallbackEnabled({ VERCEL_ENV: "production" }),
              false,
            );
          });
          '''.replace("          ", "")
          if "enables the LLM ambiguity fallback in production" in tests:
            raise SystemExit("LLM enablement tests already present")
          test_path.write_text(tests.rstrip() + test_block)

          env_path = Path(".env.example")
          env_text = env_path.read_text()
          old_env = '''# Deterministic extraction and controlled semantic matching always run. Enable this only when a
          # server-side OpenAI key is configured; the fallback is called solely for material ambiguity.
          AI_QUERY_FALLBACK_ENABLED=false
          OPENAI_API_KEY=
          OPENAI_QUERY_MODEL=gpt-5-nano
          '''.replace("          ", "")
          new_env = '''# Deterministic extraction and controlled semantic matching always run. Production enables
          # the LLM fallback automatically when a server-side OpenAI key is configured. Set this
          # opt-in flag to true for preview or local environments. The kill switch disables it everywhere.
          AI_QUERY_FALLBACK_ENABLED=false
          AI_QUERY_FALLBACK_KILL_SWITCH=false
          OPENAI_API_KEY=
          OPENAI_QUERY_MODEL=gpt-5-nano
          '''.replace("          ", "")
          if old_env not in env_text:
            raise SystemExit("Existing smart-query environment block not found")
          env_path.write_text(env_text.replace(old_env, new_env, 1))

          smoke_path = Path(".github/workflows/llm-query-production-smoke.yml")
          smoke_path.write_text('''name: LLM query production smoke

          on:
            push:
              branches:
                - main
              paths:
                - "src/lib/smart-query-llm.ts"
                - "src/app/api/query/interpret/route.ts"
                - ".github/workflows/llm-query-production-smoke.yml"
            workflow_dispatch:

          permissions:
            contents: read

          concurrency:
            group: llm-query-production-smoke
            cancel-in-progress: true

          jobs:
            smoke:
              runs-on: ubuntu-latest
              timeout-minutes: 12

              steps:
                - name: Wait for production and verify the LLM ambiguity resolver
                  env:
                    ENDPOINT: https://www.moraltrade.org/api/query/interpret
                  run: |
                    set -euo pipefail
                    payload='{"query":"Verified animal welfare work for $50","surface":"offers","now":"2026-07-23T10:40:00Z"}'
                    : > response.json

                    for attempt in $(seq 1 18); do
                      response="$(
                        curl --silent --show-error --max-time 20 \\
                          --request POST "$ENDPOINT" \\
                          --header 'content-type: application/json' \\
                          --data "$payload" || true
                      )"
                      printf '%s' "$response" > response.json

                      if jq -e '.usedLlm == true and .interpretation.stage == "llm"' response.json >/dev/null 2>&1; then
                        jq '{usedLlm, stage: .interpretation.stage, needsClarification: .interpretation.needsClarification, reasonCodes: .interpretation.reasonCodes}' response.json
                        exit 0
                      fi

                      echo "Production LLM fallback not ready on attempt ${attempt}; retrying in 20 seconds."
                      sleep 20
                    done

                    echo "Production did not report a successful LLM interpretation."
                    cat response.json
                    exit 1
          '''.replace("          ", ""))
          PY

      - name: Install dependencies
        run: npm ci

      - name: Verify focused changes
        run: |
          npx eslint src/lib/smart-query-llm.ts src/lib/smart-query.test.ts
          node --import tsx --test src/lib/smart-query.test.ts src/lib/smart-evidence-ranking.test.ts

      - name: Commit implementation
        run: |
          git config user.name "moral-trade-query-bot"
          git config user.email "moral-trade-query-bot@users.noreply.github.com"
          git add \
            .env.example \
            .github/workflows/llm-query-production-smoke.yml \
            src/lib/smart-query-llm.ts \
            src/lib/smart-query.test.ts
          git commit -m "Enable LLM query interpretation in production"
          git push origin HEAD:feat/enable-llm-query-interpretation
