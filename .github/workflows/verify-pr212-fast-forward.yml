name: Verify PR 212 fast-forward

on:
  push:
    branches:
      - agent/pr212-main-integration-inspector-20260730
    paths:
      - .github/workflows/verify-pr212-fast-forward.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      FEATURE_BRANCH: feat/institutional-trade-system
      INTEGRATION_BRANCH: agent/pr212-main-integrated-36650b-20260731
      INSPECTOR_BRANCH: agent/pr212-main-integration-inspector-20260730
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pr212-main-integration-inspector-20260730
          fetch-depth: 0
      - name: Require feature ref to equal the validated integration ref
        shell: bash
        run: |
          set -euo pipefail
          feature_head="$(git ls-remote --heads origin "refs/heads/${FEATURE_BRANCH}" | awk '{print $1}')"
          integration_head="$(git ls-remote --heads origin "refs/heads/${INTEGRATION_BRANCH}" | awk '{print $1}')"
          test -n "$feature_head"
          test -n "$integration_head"
          test "$feature_head" = "$integration_head"
          git fetch origin "$feature_head"
          git cat-file -e "$feature_head:src/pr212-main-integration-regression.test.ts"
          git cat-file -e "$feature_head:.github/workflows/pr212-main-integrated-gates.yml"
          mkdir -p ops/pr212-fast-forward
          jq -n --arg feature_head "$feature_head" --arg integration_head "$integration_head" '{verified:true,feature_head:$feature_head,integration_head:$integration_head}' > ops/pr212-fast-forward/verified.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops/pr212-fast-forward/verified.json
          git commit -m "Verify PR 212 fast-forward to main-integrated commit"
          git push origin "HEAD:refs/heads/${INSPECTOR_BRANCH}"
