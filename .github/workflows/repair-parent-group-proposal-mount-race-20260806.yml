name: Repair parent group proposal mount race 2026-08-06

on:
  push:
    branches:
      - audit/self-service-pool-lifecycle-source-20260806
    paths:
      - ".github/workflows/repair-parent-group-proposal-mount-race-20260806.yml"

permissions:
  contents: write

concurrency:
  group: repair-parent-group-proposal-mount-race-20260806
  cancel-in-progress: false

jobs:
  repair-parent:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TARGET_BRANCH: feature/co-act-co-fund-create-v3-20260803
      EXPECTED_TARGET_HEAD: 4030e9242f9870a23f6ce3f1e7368b0e9a541842
      OLD_BLOCK_B64: 
      NEW_BLOCK_B64: 
      OLD_CLICK_B64: ICBhd2FpdCBjcmVhdGUubG9jYXRvcigiI3Jldmlld09mZmVycyIpLmNsaWNrKCk7CiAgYXdhaXQgZXhwZWN0KGNyZWF0ZS5nZXRCeVRleHQoIlByb3Bvc2VkIGdyb3VwIHRlcm1zIiwgeyBleGFjdDogdHJ1ZSB9KSkudG9CZVZpc2libGUoKTsK
      NEW_CLICK_B64: 

    steps:
      - name: Check out the exact parent candidate
        uses: actions/checkout@v4
        with:
          ref: feature/co-act-co-fund-create-v3-20260803
          fetch-depth: 2

      - name: Verify target head and repair the rendered regression
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_TARGET_HEAD"
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          path = Path("tests/create-group-contribution-proposal.spec.ts")
          text = path.read_text()
          old = base64.b64decode(os.environ["OLD_BLOCK_B64"]).decode()
          new = base64.b64decode(os.environ["NEW_BLOCK_B64"]).decode()
          old_click = base64.b64decode(os.environ["OLD_CLICK_B64"]).decode()
          new_click = base64.b64decode(os.environ["NEW_CLICK_B64"]).decode()
          if text.count(old) != 1:
              raise SystemExit(f"Expected one helper block, found {text.count(old)}")
          text = text.replace(old, new)
          if text.count(old_click) != 1:
              raise SystemExit(f"Expected one review-click block, found {text.count(old_click)}")
          path.write_text(text.replace(old_click, new_click))
          temporary = Path(".github/workflows/repair-group-proposal-mount-race.yml")
          if not temporary.exists():
              raise SystemExit("Expected temporary feature-branch repair workflow")
          temporary.unlink()
          PY
          git diff --check
          git diff -- tests/create-group-contribution-proposal.spec.ts .github/workflows/repair-group-proposal-mount-race.yml

      - name: Commit and push the exact repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/create-group-contribution-proposal.spec.ts .github/workflows/repair-group-proposal-mount-race.yml
          git diff --cached --check
          git commit -m "Stabilize group proposal editor after enhancement mount"
          git push origin "HEAD:$TARGET_BRANCH"
