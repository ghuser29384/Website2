name: Temporary stage evidence credibility shadow QA workflow

on:
  push:
    branches:
      - feature/evidence-credibility-shadow-v2-20260810
    paths:
      - .github/workflows/stage-evidence-credibility-shadow-qa-workflow.yml

permissions:
  contents: write

concurrency:
  group: stage-evidence-credibility-shadow-qa-workflow
  cancel-in-progress: false

jobs:
  stage:
    if: github.repository == 'ghuser29384/Website2'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch history
        uses: actions/checkout@v4
        with:
          ref: feature/evidence-credibility-shadow-v2-20260810
          fetch-depth: 0

      - name: Reconstruct exact workflow blob from immutable archive
        shell: bash
        run: |
          set -euo pipefail
          source_commit='9e36f6be2ed91cfc286343cc93dc0052c94e0fa8'
          : > /tmp/evidence-shadow.tar.gz.b64
          for chunk in 00 01 02 03 04; do
            git show "${source_commit}:.github/materialize-evidence-shadow/chunk-${chunk}.b64" >> /tmp/evidence-shadow.tar.gz.b64
          done
          base64 --decode /tmp/evidence-shadow.tar.gz.b64 > /tmp/evidence-shadow.tar.gz
          echo "82f833fdb93707eef6af66e13eaab951ad5153ac48fd5d95564092389982099e  /tmp/evidence-shadow.tar.gz" | sha256sum --check --strict
          tar -xOf /tmp/evidence-shadow.tar.gz .github/workflows/evidence-credibility-shadow-qa.yml > .github/staged-evidence-credibility-shadow-qa.yml.txt
          test -s .github/staged-evidence-credibility-shadow-qa.yml.txt

      - name: Commit staging blob and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/stage-evidence-credibility-shadow-qa-workflow.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          test "$(git diff --cached --name-status | awk '$1=="A"{n++} END{print n+0}')" -eq 1
          test "$(git diff --cached --name-status | awk '$1=="D"{n++} END{print n+0}')" -eq 1
          git commit -m "Stage evidence credibility shadow QA workflow blob"
          git push origin HEAD:feature/evidence-credibility-shadow-v2-20260810
