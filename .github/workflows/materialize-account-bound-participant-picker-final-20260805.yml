name: Materialize final account-bound participant picker

on:
  push:
    branches:
      - feature/account-bound-participant-picker-20260805
    paths:
      - .github/workflows/materialize-account-bound-participant-picker-final-20260805.yml

permissions:
  contents: write

concurrency:
  group: materialize-account-bound-participant-picker-final-20260805
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4
        with:
          ref: feature/account-bound-participant-picker-20260805
          fetch-depth: 0
          persist-credentials: true

      - name: Verify immutable payload and reconstruct durable patch
        shell: bash
        run: |
          set -euo pipefail

          test "$(git branch --show-current)" = "feature/account-bound-participant-picker-20260805"
          git merge-base --is-ancestor 3c3d744a621d833726da5563d72c636e40795563 HEAD
          test -e .github/workflows/account-bound-participant-picker-gates.yml
          test -z "$(git status --porcelain)"

          declare -A expected=(
            [00]=46b35614f381065606dcc3fd6667519b2a8461f8
            [01]=4129a10bb6dfc69094b4fb2572e38da74f685a97
            [02]=131899551b4ef91261837292a1d5838f54549e01
            [03]=5c9adc625a6e85d73fbd73d9f7e8bc1b58e0ae06
            [04]=52a4f80f6d387825b908fd24cf3a97e7f5c2ec45
            [05]=32ac301bc8c7078856a3e47bbe0631445a73bf4e
            [06]=5fa6578ddb330f72a7b7555f1a158175f7987f56
          )

          for suffix in 00 01 02 03 04 05 06; do
            file=".github/account-bound-participant-picker-final.patch.xz.b64.${suffix}"
            test -f "$file"
            actual="$(git hash-object "$file")"
            echo "$file actual=$actual expected=${expected[$suffix]}"
            test "$actual" = "${expected[$suffix]}"
          done

          cat .github/account-bound-participant-picker-final.patch.xz.b64.0* \
            | base64 --decode > /tmp/account-bound-participant-picker-final.patch.xz
          echo "663541c44fb7a8304da1f520e211df36cf2d68501b72af9ed806daa45f1b3170  /tmp/account-bound-participant-picker-final.patch.xz" \
            | sha256sum --check --strict
          xz --test /tmp/account-bound-participant-picker-final.patch.xz
          xz --decompress --stdout /tmp/account-bound-participant-picker-final.patch.xz \
            > /tmp/account-bound-participant-picker-final.patch
          echo "ad8c971680de7088c5324ffa0b4fa826261fb77165e7f8743d54cd1a2a6cab6f  /tmp/account-bound-participant-picker-final.patch" \
            | sha256sum --check --strict

          awk '/^diff --git a\// {path=$3; sub(/^a\//, "", path); print path}' \
            /tmp/account-bound-participant-picker-final.patch \
            | sort -u > /tmp/account-bound-participant-picker-final.paths
          cat > /tmp/account-bound-participant-picker-final.expected-paths <<'PATHS'
          .github/workflows/account-bound-participant-picker-gates.yml
          public/moral-trade-create/participant-picker.js
          src/app/api/create/participants/route.ts
          src/app/api/create/publish/route.ts
          src/lib/create-interface/participant-target-server.test.ts
          src/lib/create-interface/participant-target-server.ts
          src/lib/create-interface/participant-target.test.ts
          src/lib/create-interface/participant-target.ts
          src/lib/create-interface/persistence.test.ts
          src/lib/create-interface/validation.test.ts
          src/lib/profile-username.test.ts
          src/lib/profile-username.ts
          supabase/migrations/20260805152000_account_bound_participant_directory_v2.sql
          supabase/tests/account_bound_participant_directory_v2.sql
          PATHS
          sed -i 's/^          //' /tmp/account-bound-participant-picker-final.expected-paths
          sort -o /tmp/account-bound-participant-picker-final.expected-paths \
            /tmp/account-bound-participant-picker-final.expected-paths
          test "$(wc -l < /tmp/account-bound-participant-picker-final.paths)" -eq 14
          diff -u \
            /tmp/account-bound-participant-picker-final.expected-paths \
            /tmp/account-bound-participant-picker-final.paths

          grep -Fxv '.github/workflows/account-bound-participant-picker-gates.yml' \
            /tmp/account-bound-participant-picker-final.expected-paths \
            > /tmp/account-bound-participant-picker-final.nonworkflow-paths
          test "$(wc -l < /tmp/account-bound-participant-picker-final.nonworkflow-paths)" -eq 13

          git apply \
            --exclude=.github/workflows/account-bound-participant-picker-gates.yml \
            --check /tmp/account-bound-participant-picker-final.patch
          git apply \
            --exclude=.github/workflows/account-bound-participant-picker-gates.yml \
            --index /tmp/account-bound-participant-picker-final.patch

      - name: Remove temporary payload files
        shell: bash
        run: |
          set -euo pipefail
          git rm \
            .github/account-bound-participant-picker-final.patch.xz.b64.00 \
            .github/account-bound-participant-picker-final.patch.xz.b64.01 \
            .github/account-bound-participant-picker-final.patch.xz.b64.02 \
            .github/account-bound-participant-picker-final.patch.xz.b64.03 \
            .github/account-bound-participant-picker-final.patch.xz.b64.04 \
            .github/account-bound-participant-picker-final.patch.xz.b64.05 \
            .github/account-bound-participant-picker-final.patch.xz.b64.06

      - name: Validate exact staged non-workflow candidate
        shell: bash
        run: |
          set -euo pipefail
          git diff --cached --check
          git diff --cached --name-only | sort -u > /tmp/staged-paths
          test "$(wc -l < /tmp/staged-paths)" -eq 20

          for suffix in 00 01 02 03 04 05 06; do
            grep -Fxq ".github/account-bound-participant-picker-final.patch.xz.b64.${suffix}" \
              /tmp/staged-paths
          done

          comm -23 \
            /tmp/staged-paths \
            <(printf '%s\n' \
              .github/account-bound-participant-picker-final.patch.xz.b64.00 \
              .github/account-bound-participant-picker-final.patch.xz.b64.01 \
              .github/account-bound-participant-picker-final.patch.xz.b64.02 \
              .github/account-bound-participant-picker-final.patch.xz.b64.03 \
              .github/account-bound-participant-picker-final.patch.xz.b64.04 \
              .github/account-bound-participant-picker-final.patch.xz.b64.05 \
              .github/account-bound-participant-picker-final.patch.xz.b64.06 | sort) \
            > /tmp/durable-staged-paths
          test "$(wc -l < /tmp/durable-staged-paths)" -eq 13
          diff -u \
            /tmp/account-bound-participant-picker-final.nonworkflow-paths \
            /tmp/durable-staged-paths

          test -e .github/workflows/account-bound-participant-picker-gates.yml
          test -e .github/workflows/export-current-abpp-source-20260805.yml
          test -e .github/workflows/materialize-account-bound-participant-picker-final-20260805.yml
          git status --short

      - name: Commit non-workflow candidate and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Complete account-bound participant picker candidate"
          git push origin HEAD:feature/account-bound-participant-picker-20260805
