name: Site proportions production 2026-10-04

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/site-proportions-production-20261004.yml

permissions:
  actions: write
  contents: read

concurrency:
  group: site-proportions-production-20261004
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact release candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Verify approved layout source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'ghuser29384/Website2'
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git hash-object 'public/moral-trade-proportions.css')" = '567b656594889b13a28a706ccee0cf570d711350'
          test "$(git hash-object 'src/app/bottleneck-atlas/bottleneck-atlas.module.css')" = 'b3a11908ec63cd6891563800be5c0f7985aaeb5b'
          test "$(git hash-object 'src/app/commitments/loading.module.css')" = '72a8e1f6ff21f4350f5be0dcd0800bf1c559b8b6'
          test "$(git hash-object 'src/app/connectors/connectors.module.css')" = 'ea57e6c5a69337b863df09a870415e98e81c2586'
          test "$(git hash-object 'src/app/create/submissions/[submissionId]/page.tsx')" = '920e8ffeef1f273d2eb9ce53ef7e3a7e246a3ac4'
          test "$(git hash-object 'src/app/moral-goods-group-buying/moral-goods-group-buying.module.css')" = '76bf6629bf30f535caad5c8ce2628006b44c3d02'
          test "$(git hash-object 'src/app/redirects/[receiptId]/page.module.css')" = '0915c9b70e852f3e37763ee037ac7f9000b762ae'
          test "$(git hash-object 'src/components/backing/backing-create.module.css')" = '13922bb2087b73439e4b9e9899af18a9e317d43f'
          test "$(git hash-object 'src/components/core-trade/trade-donation-agreement-stage.module.css')" = 'e9d507f2716ab5ec9581a34145c40be316762210'
          test "$(git hash-object 'src/components/create/create-route-chooser.module.css')" = 'd572d657d1cf7e35c1c8e6aa6ecb7a87f1a99025'
          test "$(git hash-object 'src/components/create/submission-receipt.tsx')" = '93d58443980cedd08e5a183d17994fede0f746e5'
          test "$(git hash-object 'src/components/create/submission-receipt.module.css')" = '6888c362c3c370507328bcb9fe3a789d6e67597b'
          test "$(git hash-object 'tests/site-proportions.spec.ts')" = '897b132099a7d74188642e42d6c081ff2e4f3bd6'
          test "$(git hash-object 'src/lib/create-interface/source-contract.test.ts')" = 'fb04873e945b3f2c06d8b6d8864daf9610f45274'
          git diff --check HEAD^
          remote_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$remote_sha" = "$GITHUB_SHA"

      - name: Dispatch the existing gated production release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/vercel-release.yml" --jq .state)" = 'active'
          jq -n --arg sha "$GITHUB_SHA" \
            '{ref:"main",inputs:{ref:"main",target:"production",expected_sha:$sha,synthetic_auth_fixture_url:""}}' \
            | gh api --method POST \
                -H 'Accept: application/vnd.github+json' \
                -H 'X-GitHub-Api-Version: 2022-11-28' \
                "repos/$GITHUB_REPOSITORY/actions/workflows/vercel-release.yml/dispatches" \
                --input - >/dev/null
