name: Harden and verify Command persistence

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: harden-command-persistence
  cancel-in-progress: false

jobs:
  harden-verify-push:
    if: github.head_ref == 'feat/universal-command-workspace'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/universal-command-workspace
          fetch-depth: 1

      - name: Restrict Command records to authenticated server routes
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          persistence_path = Path('src/lib/command/persistence.ts')
          persistence = persistence_path.read_text()
          persistence = persistence.replace(
              'import { createClient } from "@/lib/supabase/server";',
              'import { createServiceClient } from "@/lib/supabase/server";',
          )
          persistence = persistence.replace(
              '(await createClient()) as any',
              'createServiceClient() as any',
          )
          persistence_path.write_text(persistence)

          migration_path = Path('supabase/migrations/20260723110000_universal_command_workspace.sql')
          migration = migration_path.read_text()
          old = '''grant select, insert, update, delete on public.command_sessions to authenticated;
          grant select, insert on public.command_messages to authenticated;
          grant select, insert, update on public.command_runs to authenticated;
          grant select, insert, update on public.command_tool_calls to authenticated;
          grant select, insert on public.command_audit_events to authenticated;
          grant usage, select on sequence public.command_audit_events_seq_seq to authenticated;

          grant all on public.command_sessions to service_role;
          grant all on public.command_messages to service_role;
          grant all on public.command_runs to service_role;
          grant all on public.command_tool_calls to service_role;
          grant all on public.command_audit_events to service_role;
          grant all on sequence public.command_audit_events_seq_seq to service_role;
          '''
          new = '''revoke all on public.command_sessions from anon, authenticated;
          revoke all on public.command_messages from anon, authenticated;
          revoke all on public.command_runs from anon, authenticated;
          revoke all on public.command_tool_calls from anon, authenticated;
          revoke all on public.command_audit_events from anon, authenticated;
          revoke all on sequence public.command_audit_events_seq_seq from anon, authenticated;

          grant all on public.command_sessions to service_role;
          grant all on public.command_messages to service_role;
          grant all on public.command_runs to service_role;
          grant all on public.command_tool_calls to service_role;
          grant all on public.command_audit_events to service_role;
          grant all on sequence public.command_audit_events_seq_seq to service_role;
          '''
          if old not in migration:
              raise SystemExit('Expected Command grant block was not found')
          migration_path.write_text(migration.replace(old, new))

          test_path = Path('src/lib/command/workspace-contract.test.ts')
          test_text = test_path.read_text()
          test_text = test_text.replace(
              '  assert.doesNotMatch(migration, /grant .* to anon/);\n',
              '  assert.doesNotMatch(migration, /grant .* to anon/);\n'
              '  assert.match(migration, /revoke all on public\\.command_sessions from anon, authenticated/);\n'
              '  assert.doesNotMatch(migration, /grant .* to authenticated/);\n',
          )
          test_text = test_text.replace(
              '  assert.match(persistence, /encryptBackgroundSensitiveText/);\n',
              '  assert.match(persistence, /createServiceClient/);\n'
              '  assert.doesNotMatch(persistence, /createClient\\(\\)/);\n'
              '  assert.match(persistence, /encryptBackgroundSensitiveText/);\n',
          )
          test_path.write_text(test_text)
          PY
          git rm .github/workflows/harden-command-persistence.yml
          git status --short

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npx eslint src/lib/command/persistence.ts src/lib/command/workspace-contract.test.ts
      - run: node --import tsx --test src/lib/command/*.test.ts src/lib/command-center-handoff.test.ts
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- tests/exact-live-command-center.spec.ts

      - name: Commit verified hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden universal Command persistence"
          git push origin HEAD:feat/universal-command-workspace
