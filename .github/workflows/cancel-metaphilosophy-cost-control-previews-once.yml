name: Cancel superseded Metaphilosophy cost-control previews once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cancel-metaphilosophy-cost-control-previews-once.yml

permissions:
  contents: write

concurrency:
  group: cancel-metaphilosophy-cost-control-previews-once
  cancel-in-progress: false

env:
  VERCEL_TEAM_ID: team_ySu6sF3Uho1E1GnJtCQPVEuJ
  VERCEL_PROJECT_ID: prj_2Aq2qYbFw85GBMRLXdfyTIwvEXhZ
  CONTROLLER_PATH: .github/workflows/cancel-metaphilosophy-cost-control-previews-once.yml

jobs:
  cancel:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out exact controller commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Guard exact repository and one-file controller scope
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'ghuser29384/Website2'
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$GITHUB_ACTOR" = 'ghuser29384'
          changed="$(git diff-tree --no-commit-id --name-only -r HEAD | sed '/^$/d')"
          test "$changed" = "$CONTROLLER_PATH"

      - name: Cancel exact superseded Preview deployments
        id: cancel
        continue-on-error: true
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          ids=(
            dpl_HUiSyRepP3PA2qrodAYsJCGrcDAn
            dpl_9Kx6BQqf5BM88ZfGQiHHLzfYQqub
            dpl_228JY597z1qnWFYmFXRefEEjjy8g
            dpl_H4uFPZ6aYSGNMPgtsgkSjjSa8Kt8
            dpl_8hgu85Fhp2sWJjijPwwXgJ1Tpz99
          )
          : > metaphilosophy-preview-cancellations.jsonl
          for id in "${ids[@]}"; do
            before="$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v13/deployments/$id?teamId=$VERCEL_TEAM_ID")"
            project="$(jq -r .projectId <<<"$before")"
            target="$(jq -r '.target // "preview"' <<<"$before")"
            ref="$(jq -r '.meta.githubCommitRef // ""' <<<"$before")"
            test "$project" = "$VERCEL_PROJECT_ID"
            test "$target" = 'preview'
            test "$ref" = 'chore/vercel-cost-controls-20260804'
            state="$(jq -r '.readyState // .state // "UNKNOWN"' <<<"$before")"
            if [[ "$state" == 'QUEUED' || "$state" == 'BUILDING' || "$state" == 'INITIALIZING' ]]; then
              after="$(curl --fail-with-body --silent --show-error \
                -X PATCH \
                -H "Authorization: Bearer $VERCEL_TOKEN" \
                "https://api.vercel.com/v12/deployments/$id/cancel?teamId=$VERCEL_TEAM_ID")"
              jq -n --arg id "$id" --arg before "$state" --arg after "$(jq -r '.readyState // .state // "UNKNOWN"' <<<"$after")" \
                '{id:$id,before:$before,after:$after,action:"cancelled"}' \
                >> metaphilosophy-preview-cancellations.jsonl
            else
              jq -n --arg id "$id" --arg before "$state" \
                '{id:$id,before:$before,after:$before,action:"already_terminal"}' \
                >> metaphilosophy-preview-cancellations.jsonl
            fi
          done

          sleep 3
          jq -s '.' metaphilosophy-preview-cancellations.jsonl > metaphilosophy-preview-cancellations.json
          for id in "${ids[@]}"; do
            curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v13/deployments/$id?teamId=$VERCEL_TEAM_ID" \
              | jq -e '(.readyState // .state) == "CANCELED" or (.readyState // .state) == "ERROR"' >/dev/null
          done

      - name: Upload cancellation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metaphilosophy-preview-cancellations-${{ github.run_id }}
          path: |
            metaphilosophy-preview-cancellations.jsonl
            metaphilosophy-preview-cancellations.json
          if-no-files-found: warn
          retention-days: 30

      - name: Remove one-time controller with verdict
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ '${{ steps.cancel.outcome }}' == 'success' ]]; then
            message='Remove one-time Metaphilosophy Preview cancellation controller after PASS'
          else
            message='Remove one-time Metaphilosophy Preview cancellation controller after FAIL'
          fi
          blob_sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/$CONTROLLER_PATH?ref=main" --jq .sha 2>/dev/null || true)"
          if [[ -n "$blob_sha" ]]; then
            jq -n \
              --arg message "$message" \
              --arg sha "$blob_sha" \
              --arg branch main \
              '{message:$message,sha:$sha,branch:$branch}' \
              | gh api --method DELETE "repos/$GITHUB_REPOSITORY/contents/$CONTROLLER_PATH" --input - >/dev/null
          fi

      - name: Enforce cancellation success
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test '${{ steps.cancel.outcome }}' = 'success'
