name: Fix marketplace materializer summary marker

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/fix-marketplace-materializer-summary.yml"
      - ".github/scripts/materialize-marketplace-delta.py"

permissions:
  contents: write

concurrency:
  group: fix-marketplace-materializer-summary
  cancel-in-progress: false

jobs:
  fix:
    if: >-
      github.event.pull_request.head.repo.full_name == 'ghuser29384/Website2' &&
      github.head_ref == 'ops/materialize-marketplace-delta-20260729'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/materialize-marketplace-delta-20260729
          fetch-depth: 0
      - name: Align the current-main result-summary marker
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/scripts/materialize-marketplace-delta.py')
          source = path.read_text(encoding='utf-8')
          old = '               current result set. Open a record to review its complete terms and evidence state.\n'
          new = '              current result set. Open a record to review its complete terms and evidence state.\n'
          if source.count(old) == 1:
              source = source.replace(old, new, 1)
              path.write_text(source, encoding='utf-8')
          elif source.count(new) == 1:
              print('Materializer summary marker is already aligned.')
          else:
              raise SystemExit(
                  f'Expected one old or aligned summary marker; old={source.count(old)} new={source.count(new)}'
              )
          PY
      - name: Commit the idempotent marker fix
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No materializer change required."
            exit 0
          fi
          git config user.name "ghuser29384"
          git config user.email "262476329+ghuser29384@users.noreply.github.com"
          git add .github/scripts/materialize-marketplace-delta.py
          git commit -m "Align marketplace delta materializer with current main"
          git push origin HEAD:ops/materialize-marketplace-delta-20260729
