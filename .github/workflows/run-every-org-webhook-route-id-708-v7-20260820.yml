name: Run Every.org webhook route-ID hardening v7

on:
  push:
    branches:
      - fix/every-org-webhook-route-id-708-20260818

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: run-every-org-webhook-route-id-708-v7-20260820
  cancel-in-progress: false

env:
  EXPECTED_REPOSITORY: ghuser29384/Website2
  EXPECTED_BRANCH: fix/every-org-webhook-route-id-708-20260818
  EXPECTED_EXISTING_HEAD: 4d0a944d25a9aa140c56b5ad41670575b00d8738
  EXPECTED_PARENT: 0207a58410480b6edd1bb5a1496bc8ce7c66d6f6
  EXPECTED_PARENT_TREE: 360c4ac6949f1f83adc4e9dbf428b55f3870aea6
  EXPECTED_PARENT_BRANCH: fix/every-org-staging-api-host-708-v3-20260816
  THIS_WORKFLOW: .github/workflows/run-every-org-webhook-route-id-708-v7-20260820.yml
  TRIGGER_FILE: .github/run-every-org-webhook-route-id-708-v7.trigger
  PATCH_PROGRAM: .github/scripts/apply-every-org-webhook-route-id-708-v5.py

jobs:
  repair:
    if: github.event.head_commit.message == 'Run Every.org webhook route-ID hardening v7'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Check out exact trigger commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Guard exact branch topology and one-file trigger
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY"
          test "$GITHUB_REF_NAME" = "$EXPECTED_BRANCH"
          test "$GITHUB_ACTOR" = ghuser29384
          test "$(git rev-parse HEAD^^)" = "$EXPECTED_EXISTING_HEAD"
          test "$(git diff --name-only "$EXPECTED_EXISTING_HEAD" HEAD^)" = "$THIS_WORKFLOW"
          test "$(git diff --name-only HEAD^ HEAD)" = "$TRIGGER_FILE"
          test "$(cat "$TRIGGER_FILE")" = 'RUN_EVERY_ORG_WEBHOOK_ROUTE_ID_HARDENING_V7'
          test "$(git show -s --format=%T "$EXPECTED_PARENT")" = "$EXPECTED_PARENT_TREE"
          git fetch --no-tags origin "$EXPECTED_PARENT_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_PARENT"
          git merge-base --is-ancestor "$EXPECTED_PARENT" "$EXPECTED_EXISTING_HEAD"
          git merge-base --is-ancestor "$EXPECTED_PARENT" HEAD
          git diff --check "$EXPECTED_PARENT...HEAD"
          test -z "$(git status --porcelain)"
          test -f "$PATCH_PROGRAM"
          PYTHONDONTWRITEBYTECODE=1 python3 -B - "$PATCH_PROGRAM" <<'PY'
          import pathlib
          import sys
          path = pathlib.Path(sys.argv[1])
          compile(path.read_text(), str(path), "exec")
          PY
          test -z "$(find .github -type f \( -name '*.pyc' -o -path '*/__pycache__/*' \) -print -quit)"
          mkdir -p "$RUNNER_TEMP/evidence"
          {
            echo "trigger_actor=$GITHUB_ACTOR"
            echo "trigger_sha=$GITHUB_SHA"
            echo "existing_head=$EXPECTED_EXISTING_HEAD"
            echo "stacked_base=$EXPECTED_PARENT"
          } > "$RUNNER_TEMP/evidence/trigger.txt"

      - name: Apply bounded route-ID repair exactly once
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 -B "$PATCH_PROGRAM" \
            2>&1 | tee "$RUNNER_TEMP/evidence/route-id-patch.log"
          git diff --check
          test -z "$(find .github -type f \( -name '*.pyc' -o -path '*/__pycache__/*' \) -print -quit)"

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci 2>&1 | tee "$RUNNER_TEMP/evidence/npm-ci.log"

      - name: Run focused Every.org and Donation Upgrade contracts
        shell: bash
        env:
          DIRECT_DONATION_UPGRADES_ENABLED: "false"
          DIRECT_DONATION_UPGRADE_MODE: disabled
          DIRECT_DONATION_UPGRADE_QA_FIXTURES: "false"
          EVERY_ORG_PLEDGE_DONATIONS_ENABLED: "false"
          CONDITIONAL_PAYMENTS_MODE: disabled
          TRADE_DONATION_POOL_ENABLED: "false"
          TRADE_DONATION_POOL_MODE: disabled
        run: |
          set -euo pipefail
          node --import tsx --test \
            src/lib/every-org-partner-webhook-auth.test.ts \
            src/lib/every-org-webhook-route-id-source-contract.test.ts \
            src/lib/every-org-api-environment.test.ts \
            src/lib/direct-donation-upgrade.test.ts \
            src/lib/direct-donation-upgrade-split.test.ts \
            src/lib/direct-donation-upgrade-environment-contract.test.ts \
            src/lib/direct-donation-upgrade-source-contract.test.ts \
            src/lib/trade-donation.test.ts \
            src/lib/mpgf.test.ts \
            2>&1 | tee "$RUNNER_TEMP/evidence/focused-tests.log"

      - name: Run complete repository tests
        shell: bash
        env:
          DIRECT_DONATION_UPGRADES_ENABLED: "false"
          DIRECT_DONATION_UPGRADE_MODE: disabled
          DIRECT_DONATION_UPGRADE_QA_FIXTURES: "false"
          EVERY_ORG_PLEDGE_DONATIONS_ENABLED: "false"
          CONDITIONAL_PAYMENTS_MODE: disabled
          TRADE_DONATION_POOL_ENABLED: "false"
          TRADE_DONATION_POOL_MODE: disabled
        run: |
          set -euo pipefail
          npm test 2>&1 | tee "$RUNNER_TEMP/evidence/repository-tests.log"

      - name: Run strict TypeScript
        shell: bash
        run: |
          set -euo pipefail
          npx tsc --noEmit --pretty false 2>&1 | tee "$RUNNER_TEMP/evidence/typescript.log"

      - name: Run scoped ESLint
        shell: bash
        run: |
          set -euo pipefail
          npx eslint \
            'src/app/api/connectors/every-org/[routeId]/route.ts' \
            src/lib/every-org-webhook-route-id-source-contract.test.ts \
            src/lib/every-org-partner-webhook-auth.test.ts \
            src/lib/every-org-partner-webhook-auth.ts \
            src/lib/direct-donation-upgrade-environment-contract.test.ts \
            src/lib/direct-donation-upgrade-source-contract.test.ts \
            src/lib/direct-donation-upgrade.test.ts \
            src/lib/direct-donation-upgrade.ts \
            src/lib/trade-donation.test.ts \
            src/lib/trade-donation.ts \
            2>&1 | tee "$RUNNER_TEMP/evidence/scoped-eslint.log"

      - name: Run repository ESLint with zero errors
        shell: bash
        run: |
          set -euo pipefail
          npm run lint -- --quiet 2>&1 | tee "$RUNNER_TEMP/evidence/repository-eslint.log"

      - name: Build with every money rail disabled
        shell: bash
        env:
          NEXT_PUBLIC_SITE_URL: https://www.moraltrade.org
          VERCEL: "1"
          VERCEL_ENV: preview
          VERCEL_TARGET_ENV: preview
          DIRECT_DONATION_UPGRADES_ENABLED: "false"
          DIRECT_DONATION_UPGRADE_MODE: disabled
          DIRECT_DONATION_UPGRADE_QA_FIXTURES: "false"
          EVERY_ORG_PLEDGE_DONATIONS_ENABLED: "false"
          CONDITIONAL_PAYMENTS_MODE: disabled
          TRADE_DONATION_POOL_ENABLED: "false"
          TRADE_DONATION_POOL_MODE: disabled
        run: |
          set -euo pipefail
          npm run build 2>&1 | tee "$RUNNER_TEMP/evidence/build.log"

      - name: Remove temporary controllers and bytecode safely
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t temporary_paths < <(
            git ls-files \
              | grep -E '(every-org-webhook-route-id|route-id-hardening|708-v[2-7])' \
              | grep -v '^src/lib/every-org-webhook-route-id-source-contract\.test\.ts$' \
              || true
          )
          printf '%s\n' "${temporary_paths[@]}" \
            | sed '/^$/d' \
            | tee "$RUNNER_TEMP/evidence/removed-temporary-paths.txt"
          for path in "${temporary_paths[@]}"; do
            git rm -f -- "$path"
          done
          find . -path ./.git -prune -o -type d -name __pycache__ -exec rm -rf {} +
          find . -path ./.git -prune -o -type f -name '*.pyc' -exec rm -f {} +
          git add -A
          remaining="$({
            git ls-files \
              | grep -E '(every-org-webhook-route-id|route-id-hardening|708-v[2-7])' \
              | grep -v '^src/lib/every-org-webhook-route-id-source-contract\.test\.ts$' \
              || true
          } | sed '/^$/d')"
          test -z "$remaining"
          test -z "$(find . -path ./.git -prune -o -type f \( -name '*.pyc' -o -path '*/__pycache__/*' \) -print -quit)"

      - name: Verify exact durable scope and source contracts
        shell: bash
        run: |
          set -euo pipefail
          git diff --cached --check
          cat > "$RUNNER_TEMP/evidence/expected-durable-paths.txt" <<'EOF'
          .env.example
          .github/workflows/direct-donation-upgrade-rendered-qa.yml
          docs/direct-verified-donation-upgrade.md
          docs/every-org-pledge-donation-connector.md
          src/app/api/connectors/every-org/[routeId]/route.ts
          src/app/api/connectors/every-org/[secret]/route.ts
          src/lib/direct-donation-upgrade-source-contract.test.ts
          src/lib/direct-donation-upgrade.test.ts
          src/lib/direct-donation-upgrade.ts
          src/lib/every-org-partner-webhook-auth.test.ts
          src/lib/every-org-partner-webhook-auth.ts
          src/lib/every-org-webhook-route-id-source-contract.test.ts
          src/lib/trade-donation.test.ts
          src/lib/trade-donation.ts
          EOF
          LC_ALL=C sort -o "$RUNNER_TEMP/evidence/expected-durable-paths.txt" "$RUNNER_TEMP/evidence/expected-durable-paths.txt"
          LC_ALL=C git diff --cached --name-only --no-renames "$EXPECTED_PARENT" | sort > "$RUNNER_TEMP/evidence/actual-durable-paths.txt"
          diff -u "$RUNNER_TEMP/evidence/expected-durable-paths.txt" "$RUNNER_TEMP/evidence/actual-durable-paths.txt"
          git diff --cached --name-status -M "$EXPECTED_PARENT" | tee "$RUNNER_TEMP/evidence/name-status.txt"
          git diff --cached --summary -M "$EXPECTED_PARENT" | tee "$RUNNER_TEMP/evidence/rename-summary.txt"
          git diff --cached --stat "$EXPECTED_PARENT" | tee "$RUNNER_TEMP/evidence/diff-stat.txt"
          git diff --cached "$EXPECTED_PARENT" > "$RUNNER_TEMP/evidence/final-product.diff"

          test -f 'src/app/api/connectors/every-org/[routeId]/route.ts'
          test ! -e 'src/app/api/connectors/every-org/[secret]/route.ts'
          test -f src/lib/every-org-webhook-route-id-source-contract.test.ts
          test ! -e src/lib/every-org-webhook-secret-source-contract.test.ts
          grep -Fq 'EVERY_ORG_WEBHOOK_ROUTE_ID=' .env.example
          grep -Fq 'not a credential' .env.example
          grep -Fq 'authenticateEveryOrgPartnerWebhookRequest()' 'src/app/api/connectors/every-org/[routeId]/route.ts'
          grep -Fq 'EVERY_ORG_PARTNER_WEBHOOK_AUTHORIZATION_TOKEN' src/lib/every-org-partner-webhook-auth.ts
          grep -Fq 'timingSafeEqual' src/lib/every-org-partner-webhook-auth.ts
          grep -Fq 'partnerWebhookAuthorizationReady: false' src/lib/every-org-partner-webhook-auth.ts
          ! git grep -n -E 'EVERY_ORG_WEBHOOK_PATH_SECRET|webhookPathSecret|candidatePathSecret|canonicalPathSecret|path_ambiguous|path_mismatch|api/connectors/every-org/\[secret\]' -- .
          ! git grep -n -E 'DIRECT_DONATION_UPGRADES_ENABLED[^\n]*(true|"true")|DIRECT_DONATION_UPGRADE_MODE[^\n]*(staging|live)' -- .env.example

          python3 - <<'PY'
          from pathlib import Path
          route = Path('src/app/api/connectors/every-org/[routeId]/route.ts').read_text()
          auth = Path('src/lib/every-org-partner-webhook-auth.ts').read_text()
          auth_call = route.index('authenticateEveryOrgPartnerWebhookRequest()')
          params = route.index('await context.params')
          body = route.index('await request.text()')
          database = route.index('createServiceClient()')
          assert auth_call < params < body < database
          assert 'timingSafeEqual(candidateRouteId' not in auth
          assert 'constantTimeTextEqual(candidateRouteId' not in auth
          assert 'candidateRouteId !== canonicalRouteId' in auth
          assert 'partnerWebhookAuthorizationReady: false' in auth
          PY

          {
            echo "starting_sha=$EXPECTED_EXISTING_HEAD"
            echo "stacked_base_sha=$EXPECTED_PARENT"
            echo "provider_header_contract=unconfirmed"
            echo "route_id_non_secret=true"
            echo "private_partner_token_is_only_authentication_credential=true"
            echo "direct_rail_default_disabled=true"
            echo "deployment_attempted=false"
            echo "database_operation_attempted=false"
            echo "provider_invocation_attempted=false"
            echo "payment_attempted=false"
            echo "refund_attempted=false"
            echo "checkout_attempted=false"
            echo "secret_or_feature_flag_changed=false"
            echo "merge_close_or_ready_transition=false"
          } | tee "$RUNNER_TEMP/evidence/non-actions.txt"

      - name: Record validation summaries and scan retained evidence
        shell: bash
        run: |
          set -euo pipefail
          grep -E '^ℹ (tests|pass|fail|skipped|duration_ms) ' "$RUNNER_TEMP/evidence/focused-tests.log" > "$RUNNER_TEMP/evidence/focused-test-summary.txt" || true
          grep -E '^ℹ (tests|pass|fail|skipped|duration_ms) ' "$RUNNER_TEMP/evidence/repository-tests.log" > "$RUNNER_TEMP/evidence/repository-test-summary.txt" || true
          {
            echo 'npm ci: PASS'
            echo 'focused tests: PASS'
            echo 'npm test: PASS'
            echo 'npx tsc --noEmit: PASS'
            echo 'scoped ESLint: PASS'
            echo 'repository ESLint: PASS'
            echo 'npm run build with rails disabled: PASS'
            echo 'git diff --cached --check: PASS'
            echo 'exact durable scope: PASS'
            echo 'source scans: PASS'
          } | tee "$RUNNER_TEMP/evidence/validation-summary.txt"
          ! grep -R -n -E 'sb_secret_|vcp_|gh[pousr]_|postgres(ql)?://[^[:space:]]+:[^[:space:]]+@|eyJ[A-Za-z0-9_-]+\.eyJ[A-Za-z0-9_-]+\.' "$RUNNER_TEMP/evidence"

      - name: Commit and fast-forward the exact branch
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name ghuser29384
          git config user.email 262476329+ghuser29384@users.noreply.github.com
          git commit -m 'Harden Every.org webhook route ID boundary'
          final_sha="$(git rev-parse HEAD)"
          final_tree="$(git show -s --format=%T HEAD)"
          {
            echo "resulting_sha=$final_sha"
            echo "resulting_tree=$final_tree"
          } | tee "$RUNNER_TEMP/evidence/final-identity.txt"
          git push origin "HEAD:$EXPECTED_BRANCH"
          echo "final_sha=$final_sha" >> "$GITHUB_OUTPUT"
          echo "final_tree=$final_tree" >> "$GITHUB_OUTPUT"

      - name: Verify pushed branch and clean final worktree
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$EXPECTED_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "${{ steps.commit.outputs.final_sha }}"
          test "$(git show -s --format=%T FETCH_HEAD)" = "${{ steps.commit.outputs.final_tree }}"
          test -z "$(git status --porcelain)"
          test "$(git diff --name-only "$EXPECTED_PARENT" FETCH_HEAD | wc -l | tr -d ' ')" -gt 0

      - name: Add exact-run evidence comment to PR 760
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          gh pr comment 760 --repo "$GITHUB_REPOSITORY" --body "Route-ID hardening completed on exact successor run [$GITHUB_RUN_ID]($run_url). Final product commit: \`${{ steps.commit.outputs.final_sha }}\`; tree: \`${{ steps.commit.outputs.final_tree }}\`. Focused tests, all repository tests, TypeScript, scoped and repository ESLint, disabled-rail build, exact durable-scope checks, and evidence scans passed. The route component is now an opaque non-secret ID; private Partner Webhook authorization remains the only sender credential and remains fail-closed pending the exact header implementation. No deployment, provider invocation, database mutation, checkout, donation, payment, refund, secret mutation, merge, close, or ready-for-review transition occurred."

      - name: Upload exact-head evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: every-org-webhook-route-id-hardening-v7-${{ github.run_id }}
          path: ${{ runner.temp }}/evidence
          if-no-files-found: warn
          retention-days: 30

      - name: Add failure evidence comment to PR 760
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          gh pr comment 760 --repo "$GITHUB_REPOSITORY" --body "Route-ID hardening successor run [$GITHUB_RUN_ID]($run_url) failed before completion. Inspect the exact failed step and retained sanitized evidence. No successful durable-product claim is made."
