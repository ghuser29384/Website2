name: Apply live offer structure patch

on:
  push:
    branches:
      - fix/live-offer-structure-20260723

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch explicit autocomplete contexts and exact-live coverage
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function replaceOnce(source, from, to, label) {
            if (!source.includes(from)) throw new Error(`Missing ${label} marker`);
            if (source.indexOf(from) !== source.lastIndexOf(from)) {
              throw new Error(`Ambiguous ${label} marker`);
            }
            return source.replace(from, to);
          }

          const adapterPath = 'public/moral-trade-live-token-autocomplete.js';
          let adapter = fs.readFileSync(adapterPath, 'utf8');
          adapter = replaceOnce(
            adapter,
            `  function tokenContext(token) {\n    const clause = token.closest(".clause");`,
            `  function tokenContext(token) {\n    if (token.getAttribute("data-mt-autocomplete-disabled") === "true") return null;\n\n    const explicitContext = token.getAttribute("data-mt-autocomplete-context");\n    if (["priorities", "commitments", "evidence", "exits"].includes(explicitContext)) {\n      return explicitContext;\n    }\n\n    const clause = token.closest(".clause");`,
            'token context',
          );
          adapter = replaceOnce(
            adapter,
            `        "skill",\n        "donation redirect",`,
            `        "skill",\n        "behavior or commitment",\n        "help or service",\n        "donation redirect",`,
            'offer labels',
          );
          fs.writeFileSync(adapterPath, adapter);

          fs.writeFileSync(
            'src/lib/exact-live-autocomplete.test.ts',
            `import assert from "node:assert/strict";\nimport { readFileSync } from "node:fs";\nimport { join } from "node:path";\nimport test from "node:test";\nimport { gunzipSync } from "node:zlib";\n\nconst root = process.cwd();\n\nfunction readRepoFile(path: string) {\n  return readFileSync(join(root, path), "utf8");\n}\n\nfunction readExactLiveSource() {\n  const names = ["0a", "0b", "0c", "0d", "1", "2", "3", "4a", "4b", "4c", "4d", "5a", "5b", "5c", "5d"];\n  const encoded = names\n    .map((name) => readRepoFile(\`public/mt-live-0d0e0f03-\${name}.txt\`).trim())\n    .join("");\n  return gunzipSync(Buffer.from(encoded, "base64")).toString("utf8");\n}\n\ntest("the exact live shell loads structured offer types and autocomplete for editable terms", () => {\n  const loader = readRepoFile("public/moral-trade-live.html");\n  const adapter = readRepoFile("public/moral-trade-live-token-autocomplete.js");\n  const structure = readRepoFile("public/moral-trade-live-offer-structure.js");\n  const styles = readRepoFile("public/moral-trade-live-offer-structure.css");\n  const source = readExactLiveSource();\n\n  assert.match(loader, /moral-trade-input-assist\\.js/);\n  assert.match(loader, /moral-trade-live-token-autocomplete\\.js/);\n  assert.match(loader, /moral-trade-live-offer-structure\\.js/);\n  assert.match(loader, /moral-trade-live-offer-structure\\.css/);\n  assert.match(source, /class="token" contenteditable="true"/);\n\n  assert.match(structure, /label: "Money"/);\n  assert.match(structure, /label: "Behavior or commitment"/);\n  assert.match(structure, /label: "Help or service"/);\n  assert.match(structure, /Estimated time/);\n  assert.match(structure, /Relevant skills/);\n  assert.match(structure, /Deliverable or completion condition/);\n  assert.match(structure, /Verification method/);\n  assert.match(structure, /Conditions and safeguards/);\n  assert.match(structure, /legacyIngredients\\.forEach/);\n  assert.match(styles, /mt-offer-attributes/);\n  assert.match(styles, /grid-template-columns: repeat\\(2/);\n\n  assert.match(adapter, /TOKEN_SELECTOR/);\n  assert.match(adapter, /data-mt-live-token-panel/);\n  assert.match(adapter, /data-mt-autocomplete-disabled/);\n  assert.match(adapter, /const explicitContext/);\n  assert.match(adapter, /"behavior or commitment"/);\n  assert.match(adapter, /"help or service"/);\n  assert.match(adapter, /return index === 0 \\? null : "priorities"/);\n  assert.match(adapter, /return "commitments"/);\n  assert.match(adapter, /\\["proof", "verification"\\]/);\n  assert.match(adapter, /return "evidence"/);\n  assert.match(adapter, /label === "if it fails"/);\n  assert.match(adapter, /return "exits"/);\n  assert.match(adapter, /suggestion\\.label \\|\\| suggestion\\.value/);\n  assert.doesNotMatch(adapter, /"activation condition"/);\n  assert.match(adapter, /new MutationObserver/);\n  assert.match(adapter, /aria-autocomplete/);\n});\n`,
          );

          fs.writeFileSync(
            'tests/exact-live-autocomplete.spec.ts',
            `import { expect, test } from "@playwright/test";\n\nasync function installLiveFixtures(page: import("@playwright/test").Page) {\n  await page.route("**/api/live-account", (route) =>\n    route.fulfill({\n      contentType: "application/json",\n      body: JSON.stringify({ authenticated: false }),\n    }),\n  );\n  await page.route("**/api/live-now", (route) =>\n    route.fulfill({\n      contentType: "application/json",\n      body: JSON.stringify({\n        authenticated: false,\n        recommendations: [],\n        status: "unavailable",\n        routePlanner: {\n          status: "unavailable",\n          checkedAt: "2026-07-23T00:00:00.000Z",\n          profile: {},\n          needsMoreInput: [],\n          routes: [],\n          comparison: null,\n          candidateCount: 0,\n        },\n      }),\n    }),\n  );\n}\n\ntest("the exact live trade clauses autocomplete their contenteditable terms", async ({ page }, testInfo) => {\n  await installLiveFixtures(page);\n  await page.goto("/moral-trade-live.html#trade", { waitUntil: "domcontentloaded" });\n\n  const offerClause = page.locator(".clause").filter({\n    has: page.locator(".clause-label", { hasText: "I offer" }),\n  });\n  const amountToken = offerClause.locator('.token[contenteditable="true"]').first();\n  const causeToken = offerClause.locator('.token[contenteditable="true"]').nth(1);\n\n  await expect(amountToken).not.toHaveAttribute("data-mt-autocomplete-ready", "true");\n  await expect(causeToken).toHaveAttribute("data-mt-autocomplete-ready", "true");\n  await expect(causeToken).toHaveAttribute("data-mt-autocomplete-context", "priorities");\n\n  const activationToken = page\n    .locator(".clause")\n    .filter({ has: page.locator(".clause-label", { hasText: "Activation condition" }) })\n    .locator('.token[contenteditable="true"]');\n  await expect(activationToken).not.toHaveAttribute("data-mt-autocomplete-ready", "true");\n\n  await causeToken.fill("Animal");\n\n  const panel = page.locator('[data-mt-live-token-panel="true"]');\n  await expect(panel).toBeVisible();\n  await expect(panel.locator(".mt-input-assist-option strong")).toHaveText([\n    "Animal welfare",\n    "Wild animal suffering",\n    "Factory farming",\n  ]);\n  await page.screenshot({\n    path: testInfo.outputPath("autocomplete-visible.png"),\n    fullPage: false,\n  });\n\n  await panel.locator(".mt-input-assist-option").first().click();\n  await expect(causeToken).toHaveText("Animal welfare");\n  await expect(panel).toBeHidden();\n\n  const proofToken = page\n    .locator(".clause")\n    .filter({ has: page.locator(".clause-label", { hasText: "Proof" }) })\n    .locator('.token[contenteditable="true"]')\n    .first();\n  await proofToken.fill("receipt");\n  await expect(panel).toBeVisible();\n  await expect(panel.locator(".mt-input-assist-option strong").first()).toHaveText(\n    "Redacted donation receipt",\n  );\n  await page.keyboard.press("Enter");\n  await expect(proofToken).toHaveText("Redacted donation receipt");\n\n  await page.locator('[data-trade="match"]').click();\n  await page.locator('[data-trade="build"]').click();\n  await expect(page.locator('.token[data-mt-autocomplete-ready="true"]')).toHaveCount(6);\n});\n\ntest("the exact live offer palette uses three offer types and collects shared attributes", async ({\n  page,\n}, testInfo) => {\n  await installLiveFixtures(page);\n  await page.goto("/moral-trade-live.html#trade", { waitUntil: "domcontentloaded" });\n\n  const offerTypeLabels = page.locator(\n    '[data-mt-offer-type] .mt-offer-ingredient-label',\n  );\n  await expect(offerTypeLabels).toHaveText([\n    "Money",\n    "Behavior or commitment",\n    "Help or service",\n  ]);\n  await expect(page.locator('[data-ingredient="Time"]')).toHaveCount(0);\n  await expect(page.locator('[data-ingredient="Behavior"]')).toHaveCount(0);\n  await expect(page.locator('[data-ingredient="Skill"]')).toHaveCount(0);\n  await expect(page.locator(".mt-offer-group-label")).toHaveText([\n    "Offer type",\n    "Conditions and safeguards",\n  ]);\n\n  await page.locator('[data-mt-offer-type="behavior"]').click();\n  const behaviorClause = page.locator(".clause").filter({\n    has: page.locator(".clause-label", { hasText: "Behavior or commitment" }),\n  });\n  await expect(behaviorClause.locator(".mt-offer-attribute-label")).toHaveText([\n    "Estimated time",\n    "Relevant skills",\n    "Deliverable or completion condition",\n    "Verification method",\n  ]);\n  const behaviorTokens = behaviorClause.locator('.token[contenteditable="true"]');\n  await expect(behaviorTokens).toHaveCount(5);\n  await expect(behaviorTokens.first()).toHaveAttribute(\n    "data-mt-autocomplete-context",\n    "commitments",\n  );\n  await expect(behaviorTokens.last()).toHaveAttribute(\n    "data-mt-autocomplete-context",\n    "evidence",\n  );\n  await expect(behaviorTokens).toHaveAttribute("data-mt-autocomplete-ready", "true");\n\n  await page.locator('[data-mt-offer-type="service"]').click();\n  const serviceClause = page.locator(".clause").filter({\n    has: page.locator(".clause-label", { hasText: "Help or service" }),\n  });\n  await expect(serviceClause.locator(".mt-offer-attribute-label")).toHaveText([\n    "Estimated time",\n    "Relevant skills",\n    "Deliverable or completion condition",\n    "Verification method",\n  ]);\n  await expect(serviceClause.locator('.token[contenteditable="true"]')).toHaveCount(5);\n\n  await page.locator('[data-mt-offer-type="money"]').click();\n  const moneyClause = page.locator(".clause").filter({\n    has: page.locator(".clause-label", { hasText: "Money" }),\n  });\n  await expect(moneyClause.locator(".mt-offer-attribute-label")).toHaveText([\n    "Estimated time",\n    "Relevant skills",\n    "Deliverable or completion condition",\n    "Verification method",\n  ]);\n  await expect(\n    moneyClause.locator('[data-mt-autocomplete-disabled="true"]'),\n  ).toHaveCount(1);\n  await expect(\n    moneyClause.locator('[data-mt-autocomplete-context="priorities"]'),\n  ).toHaveCount(1);\n\n  await page.screenshot({\n    path: testInfo.outputPath("structured-offer-types.png"),\n    fullPage: true,\n  });\n\n  await page.locator('[data-trade="match"]').click();\n  await page.locator('[data-trade="build"]').click();\n  await expect(offerTypeLabels).toHaveText([\n    "Money",\n    "Behavior or commitment",\n    "Help or service",\n  ]);\n  await expect(behaviorClause.locator(".mt-offer-attribute-label")).toHaveCount(4);\n  await expect(serviceClause.locator(".mt-offer-attribute-label")).toHaveCount(4);\n  await expect(moneyClause.locator(".mt-offer-attribute-label")).toHaveCount(4);\n});\n`,
          );
          NODE
          node --check public/moral-trade-live-token-autocomplete.js
          node --check public/moral-trade-live-offer-structure.js
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "moral-trade-offer-structure-bot"
          git config user.email "moral-trade-offer-structure-bot@users.noreply.github.com"
          git add public/moral-trade-live-token-autocomplete.js src/lib/exact-live-autocomplete.test.ts tests/exact-live-autocomplete.spec.ts
          git commit -m "Test structured live offer types"
          git push origin HEAD:fix/live-offer-structure-20260723
