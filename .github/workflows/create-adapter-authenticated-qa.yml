name: Authenticated Create adapter isolated-QA release gate

on:
  push:
    branches:
      - ops/create-adapter-authenticated-qa-20260728
    paths:
      - ".github/workflows/create-adapter-authenticated-qa.yml"
      - ".github/qa/**"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: create-adapter-isolated-qa-authenticated-release-gate-20260728
  cancel-in-progress: true

jobs:
  authenticated-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      EXACT_CANDIDATE_SHA: e8288b8084b88e69a6d23ca3e966ab18178fefb8
      QA_SUPABASE_DB_URL: ${{ secrets.QA_SUPABASE_DB_URL }}
      EXPECTED_QA_REF: hvmxfjjbdcgjjudmthdz
      PREVIEW_BASE_URL: https://website2-lp9x7bexh-ellen-s.vercel.app
      PREVIEW_SHARE_URL: https://website2-lp9x7bexh-ellen-s.vercel.app/?_vercel_share=lhA9dNAXj9i3dJMhSuCzkdqPqE6dWbY8
      QA_OUTPUT_DIR: qa-artifacts/create-adapter-authenticated
    steps:
      - name: Check out QA operator branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Reconstruct and repair QA runner and browser script
        shell: bash
        run: |
          set -euo pipefail
          test -n "${QA_SUPABASE_DB_URL:-}"
          cat .github/qa/runner.b64.part-* | tr -d '\n' | base64 --decode | xz --decompress > /tmp/run-create-adapter-qa.sh
          cat .github/qa/browser.b64.part-* | tr -d '\n' | base64 --decode | xz --decompress > /tmp/create-adapter-authenticated-qa.mjs
          python3 - <<'PY'
          from pathlib import Path

          runner_path = Path('/tmp/run-create-adapter-qa.sh')
          runner = runner_path.read_text()

          strict_old = '#!/usr/bin/env bash\nset -u -o pipefail'
          strict_new = '#!/usr/bin/env bash\nset -euo pipefail'
          if runner.count(strict_old) != 1:
              raise SystemExit('The expected runner shell-options header was not found exactly once.')
          runner = runner.replace(strict_old, strict_new)

          candidate_old = '''log "materializing exact candidate worktree"
          git fetch --no-tags origin "+refs/heads/feature/moral-trade-create-interface-adapter-20260727:refs/remotes/origin/create-adapter-candidate"
          test "$(git rev-parse refs/remotes/origin/create-adapter-candidate)" = "$EXACT_CANDIDATE_SHA"
          rm -rf "$CANDIDATE"
          git worktree add --detach "$CANDIDATE" refs/remotes/origin/create-adapter-candidate
          test "$(git -C "$CANDIDATE" rev-parse HEAD)" = "$EXACT_CANDIDATE_SHA"'''
          candidate_new = '''log "materializing exact integrated candidate worktree"
          git fetch --no-tags origin "$EXACT_CANDIDATE_SHA"
          rm -rf "$CANDIDATE"
          git worktree add --detach "$CANDIDATE" "$EXACT_CANDIDATE_SHA"
          test "$(git -C "$CANDIDATE" rev-parse HEAD)" = "$EXACT_CANDIDATE_SHA"'''
          if runner.count(candidate_old) != 1:
              raise SystemExit('The stale product-branch candidate block was not found exactly once.')
          runner = runner.replace(candidate_old, candidate_new)

          user_columns_old = '''  email_change_token_new, email_change_token_current, reauthentication_token,
            is_sso_user, is_anonymous, created_at, updated_at'''
          user_columns_new = '''  email_change_token_new, email_change, email_change_token_current, reauthentication_token,
            is_sso_user, is_anonymous, created_at, updated_at'''
          if runner.count(user_columns_old) != 1:
              raise SystemExit('The expected auth.users column list was not found exactly once.')
          runner = runner.replace(user_columns_old, user_columns_new)

          user_values_old = "'', '', '', '', '', false, false, now(), now())"
          if runner.count(user_values_old) != 3:
              raise SystemExit(f'Expected three auth.users value rows; found {runner.count(user_values_old)}.')
          runner = runner.replace(user_values_old, "'', '', '', '', '', '', false, false, now(), now())")

          runner_path.write_text(runner)

          browser_path = Path('/tmp/create-adapter-authenticated-qa.mjs')
          browser = browser_path.read_text()

          publish_old = '.locator("#publishConfirm").check();'
          publish_count = browser.count(publish_old)
          if publish_count < 2:
              raise SystemExit(f'Expected at least two publish-confirm checks; found {publish_count}.')
          browser = browser.replace(
              publish_old,
              '.locator("#publishConfirm").check({ force: true });',
          )

          email_old = '''    await creatorPage.locator('input[name="email"]').fill(credentials.creator.email);'''
          email_new = '''    if (await creatorPage.locator('input[name="email"]').count() === 0) {
                await creatorPage.getByRole("link", { name: "Continue with email", exact: true }).click();
                await creatorPage.locator('input[name="email"]').waitFor({ state: "visible", timeout: 30_000 });
              }
              await creatorPage.locator('input[name="email"]').fill(credentials.creator.email);'''
          if email_old not in browser:
              raise SystemExit('Creator email-login transition was not found.')
          browser = browser.replace(email_old, email_new)

          fixed_radio_old = '''    await frame.locator('input[name="poolFailureBonusType"][value="fixed"]').check({ force: true });'''
          fixed_radio_new = '''    const fixedBonusOption = frame.locator('label.pool-choice-option:has(input[name="poolFailureBonusType"][value="fixed"]) > span');
              await fixedBonusOption.click();
              await assertEventually(
                async () => frame.locator('input[name="poolFailureBonusType"][value="fixed"]').isChecked(),
                "Fixed failure-bonus type did not become selected",
              );'''
          if browser.count(fixed_radio_old) != 1:
              raise SystemExit('The fixed failure-bonus radio setup line was not found exactly once.')
          browser = browser.replace(fixed_radio_old, fixed_radio_new)

          formula_radio_old = '''    await frame.locator('input[name="poolFailureTimingMode"][value="formula"]').check({ force: true });'''
          formula_radio_new = '''    await frame.locator("#timingControls").waitFor({ state: "visible", timeout: 10_000 });
              const formulaTimingOption = frame.locator('label.pool-choice-option:has(input[name="poolFailureTimingMode"][value="formula"]) > span');
              await formulaTimingOption.click();
              await assertEventually(
                async () => frame.locator('input[name="poolFailureTimingMode"][value="formula"]').isChecked(),
                "Custom-formula timing mode did not become selected",
              );'''
          if browser.count(formula_radio_old) != 1:
              raise SystemExit('The custom-formula timing radio setup line was not found exactly once.')
          browser = browser.replace(formula_radio_old, formula_radio_new)

          receipt_status_old = '''    record("receipt display says submitted for review", receipt.displayStatus === "Submitted for review", receipt.displayStatus);'''
          receipt_status_new = '''    record("receipt display says submitted for review", receipt.displayStatus.trim().toLowerCase() === "submitted for review", receipt.displayStatus);'''
          if browser.count(receipt_status_old) != 1:
              raise SystemExit('The case-sensitive receipt-status assertion was not found exactly once.')
          browser = browser.replace(receipt_status_old, receipt_status_new)

          browser_path.write_text(browser)
          PY
          chmod +x /tmp/run-create-adapter-qa.sh
          bash -n /tmp/run-create-adapter-qa.sh
          node --check /tmp/create-adapter-authenticated-qa.mjs

      - name: Run authenticated QA and exact cleanup
        id: qa
        continue-on-error: true
        run: /tmp/run-create-adapter-qa.sh

      - name: Upload authenticated QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: create-adapter-isolated-qa-authenticated-${{ github.run_id }}
          path: |
            /tmp/create-adapter-candidate/qa-artifacts/create-adapter-authenticated
            /tmp/create-adapter-e2e-result.json
            /tmp/create-adapter-fixture-ids.txt
            /tmp/create-adapter-database-evidence.log
            /tmp/create-adapter-cleanup.log
            /tmp/create-adapter-zero-residue.json
            /tmp/create-adapter-final-status.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Report run ID and exact release-gate outcome
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          QA_OUTCOME: ${{ steps.qa.outcome }}
        run: |
          gh pr comment 273 --body "Authenticated isolated-QA Create release gate run \`${GITHUB_RUN_ID}\` completed with outcome **${QA_OUTCOME}** against exact integrated candidate \`${EXACT_CANDIDATE_SHA}\` and Preview \`${PREVIEW_BASE_URL}\`."

      - name: Require all authenticated QA gates
        if: always()
        env:
          QA_OUTCOME: ${{ steps.qa.outcome }}
        run: test "$QA_OUTCOME" = success

# Normalizes rendered status casing while preserving the required pending-review semantics.
