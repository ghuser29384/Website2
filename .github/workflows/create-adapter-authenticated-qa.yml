name: Authenticated Create adapter production-preview QA

on:
  push:
    branches:
      - ops/create-adapter-authenticated-qa-20260728
    paths:
      - ".github/workflows/create-adapter-authenticated-qa.yml"
      - ".github/qa/**"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: create-adapter-production-preview-authenticated-qa-20260728
  cancel-in-progress: false

jobs:
  authenticated-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      EXACT_CANDIDATE_SHA: e8288b8084b88e69a6d23ca3e966ab18178fefb8
      PREVIEW_BASE_URL: https://moraltrade-site-24crjz8zg-ellen-s.vercel.app
      PREVIEW_SHARE_URL: https://moraltrade-site-24crjz8zg-ellen-s.vercel.app/?_vercel_share=IEachfWLgykLNO3f9Zhnk477ewvaMtXx
      QA_MARKER: prod-create-adapter-authqa-20260728T091057Z-2bce19
      QA_OUTPUT_DIR: qa-artifacts/create-adapter-authenticated
      CREATOR_EMAIL: prod-create-adapter-authqa-20260728T091057Z-2bce19-creator@example.test
      CREATOR_PASSWORD: QPTR3phM393jaTLNEIGR83amU7bri5NfAa1!
      CREATOR_DISPLAY_NAME: Production Create Adapter QA Creator 20260728T091057Z
      CONTRIBUTOR_EMAIL: prod-create-adapter-authqa-20260728T091057Z-2bce19-contributor@example.test
      CONTRIBUTOR_PASSWORD: HLuIkM3EmRuCr0l61hggGecnDmeDX2gtAa1!
      CONTRIBUTOR_DISPLAY_NAME: Production Create Adapter QA Contributor 20260728T091057Z
      OUTSIDER_EMAIL: prod-create-adapter-authqa-20260728T091057Z-2bce19-outsider@example.test
      OUTSIDER_PASSWORD: pIgQmshYfm0_fsLk5ALTTzZYNu0NRbinAa1!
      OUTSIDER_DISPLAY_NAME: Production Create Adapter QA Outsider 20260728T091057Z
    steps:
      - name: Check out QA operator branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Reconstruct browser QA and materialize exact integrated candidate
        shell: bash
        run: |
          set -euo pipefail
          printf '::add-mask::%s\n' "$CREATOR_PASSWORD" "$CONTRIBUTOR_PASSWORD" "$OUTSIDER_PASSWORD"
          cat .github/qa/browser.b64.part-* | tr -d '\n' | base64 --decode | xz --decompress > /tmp/create-adapter-authenticated-qa.mjs
          python3 - <<'PY'
          from pathlib import Path
          path = Path('/tmp/create-adapter-authenticated-qa.mjs')
          source = path.read_text()

          publish_old = '.locator("#publishConfirm").check();'
          publish_count = source.count(publish_old)
          if publish_count < 2:
              raise SystemExit(f'Expected at least two publish-confirm checks; found {publish_count}.')
          source = source.replace(
              publish_old,
              '.locator("#publishConfirm").check({ force: true });',
          )

          email_old = '''    await creatorPage.locator('input[name="email"]').fill(credentials.creator.email);'''
          email_new = '''    if (await creatorPage.locator('input[name="email"]').count() === 0) {
              await creatorPage.getByRole("link", { name: "Continue with email", exact: true }).click();
              await creatorPage.locator('input[name="email"]').waitFor({ state: "visible", timeout: 30_000 });
            }
            await creatorPage.locator('input[name="email"]').fill(credentials.creator.email);'''
          if email_old not in source:
              raise SystemExit('Creator email-login transition was not found.')
          source = source.replace(email_old, email_new)
          path.write_text(source)
          PY
          node --check /tmp/create-adapter-authenticated-qa.mjs
          git fetch --no-tags origin "$EXACT_CANDIDATE_SHA"
          rm -rf /tmp/create-adapter-candidate
          git worktree add --detach /tmp/create-adapter-candidate "$EXACT_CANDIDATE_SHA"
          test "$(git -C /tmp/create-adapter-candidate rev-parse HEAD)" = "$EXACT_CANDIDATE_SHA"
          cp /tmp/create-adapter-authenticated-qa.mjs /tmp/create-adapter-candidate/create-adapter-authenticated-qa.mjs

      - name: Install exact-candidate dependencies and Chromium
        working-directory: /tmp/create-adapter-candidate
        run: |
          npm ci
          npx playwright install chromium --with-deps

      - name: Run authenticated desktop and mobile QA
        id: qa
        continue-on-error: true
        working-directory: /tmp/create-adapter-candidate
        run: node create-adapter-authenticated-qa.mjs

      - name: Upload authenticated QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: create-adapter-production-preview-authenticated-qa-${{ github.run_id }}
          path: |
            /tmp/create-adapter-candidate/qa-artifacts/create-adapter-authenticated
            /tmp/create-adapter-e2e-result.json
          if-no-files-found: warn
          retention-days: 30

      - name: Report run ID and browser outcome
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          QA_OUTCOME: ${{ steps.qa.outcome }}
        run: |
          gh pr comment 273 --body "Authenticated production-preview Create QA run \`${GITHUB_RUN_ID}\` completed with browser outcome **${QA_OUTCOME}** against exact integrated candidate \`${EXACT_CANDIDATE_SHA}\`."

      - name: Require authenticated browser gate
        if: always()
        env:
          QA_OUTCOME: ${{ steps.qa.outcome }}
        run: test "$QA_OUTCOME" = success
