  }

  function inferDiscoverDomain(interpretation, target) {''',
          )
          replace_once(
              browser_helper,
              '''    if (/\\b(pool|pools|threshold|conditional funding)\\b/.test(query)) {
      return "pools";
    }''',
              '''    if (isStandalonePoolQuery(query)) {
      return "pools";
    }''',
          )

          discover_source = "src/discover/moral-trade-discover.source.html"
          replace_once(
              discover_source,
              "'moral','near','threshold'",
              "'moral','dominant','assurance','contract','contracts','near','threshold'",
          )
          replace_once(
              discover_source,
              r"if (!asksForCoFund && /\\bpool\\b|\\bpools\\b|\\bthreshold pool\\b|\\bstandalone threshold\\b|\\bdominant assurance contract\\b|\\bnear[- ]activation\\b|\\bnear[- ]threshold\\b/.test(lower)) domain = 'pools';",
              r"if (!asksForCoFund && /\\bpool\\b|\\bpools\\b|\\bthreshold pool\\b|\\bstandalone threshold\\b|\\bdominant[- ]assurance contracts?\\b|\\bassurance contracts?\\b|\\bnear[- ]activation\\b|\\bnear[- ]threshold\\b/.test(lower)) domain = 'pools';",
          )

          browser_test = "tests/discover-cofund.spec.ts"
          with Path(browser_test).open("a") as handle:
              handle.write(r'''

test("dominant-assurance searches route to standalone Pools even without a server routing hint", async ({
  page,
}) => {
  await page.route("**/api/query/interpret", async (route) => {
    await route.fulfill({
      status: 200,
