      body: JSON.stringify({
        interpretation: {
          originalQuery: "dominant assurance contracts",
          normalizedQuery: "dominant assurance contracts",
          parsedConstraintCount: 0,
          confidence: 0.99,
          reasonCodes: [],
          needsClarification: false,
          clarification: null,
          facets: {
            causes: [],
            verified: null,
