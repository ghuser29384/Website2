name: MPGF public-goods compacts QA

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/mpgf-public-goods-compacts-qa.yml"
      - "docs/mpgf/public-goods-compacts.md"
      - "src/app/api/mpgf/compacts/**"
      - "src/app/globals.css"
      - "src/app/mpgf/compacts/**"
      - "src/app/mpgf/page.tsx"
      - "src/app/sitemap.ts"
      - "src/components/mpgf/mpgf-page-frame.tsx"
      - "src/components/mpgf/mpgf-public-goods-compacts*"
      - "src/lib/mpgf/public-goods-compacts*"
      - "src/lib/supabase/database.types.ts"
      - "supabase/migrations/20260813163052_mpgf_public_goods_compacts.sql"
      - "supabase/migrations/20260814031500_mpgf_public_goods_compacts_state_hardening.sql"
      - "supabase/tests/mpgf_public_goods_compacts_lifecycle.sql"
      - "supabase/tests/mpgf_public_goods_compacts_historical_freeze.sql"
      - "scripts/apply-supabase-migrations-in-order.sh"
      - "scripts/test-mpgf-public-goods-compacts-concurrency.sh"
      - "scripts/verify-mpgf-public-goods-compacts-db-lint.mjs"
      - "scripts/verify-mpgf-public-goods-compacts-generated-types.mjs"
      - "tests/mpgf-public-goods-compacts.spec.ts"
      - "tests/public-routes.spec.ts"
  workflow_dispatch:
    inputs:
      confirm_target:
        description: "Enter hvmxfjjbdcgjjudmthdz to confirm the isolated QA target"
        required: true
        default: hvmxfjjbdcgjjudmthdz
        type: string

permissions:
  contents: read

concurrency:
  group: mpgf-public-goods-compacts-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  clean-ephemeral-full-chain:
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      LOCAL_SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      # The migration directory starts midstream. Its earliest migration assumes
      # tables introduced by the schema snapshot in the same historical commit.
      HISTORICAL_BASELINE_COMMIT: 4c95052ff97d55b42486cac47b7430896946f124
      HISTORICAL_BASELINE_SHA256: 5fa7f1f21f7a8fc5720ca695d9e6d90eef7eefc1dd97632a2b5ff665c321464a

    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.114.0

      - name: Install PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install --yes postgresql-client > /dev/null

      - name: Verify exact candidate and migration identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mpgf-compacts-clean-qa
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          git diff --check
          compact_version_count="$(find supabase/migrations -maxdepth 1 -type f -name '20260813163052_*.sql' | wc -l | tr -d ' ')"
          test "$compact_version_count" = "1"
          find supabase/migrations -maxdepth 1 -type f -name '*.sql' -print \
            | LC_ALL=C sort \
            | xargs sha256sum \
            > mpgf-compacts-clean-qa/migration-source.sha256
          find supabase/migrations -maxdepth 1 -type f -name '*.sql' -print \
            | sed -E 's#^.*/([0-9]+)_.*#\1#' \
            | LC_ALL=C sort \
            | uniq -d \
            > mpgf-compacts-clean-qa/duplicate-migration-versions.txt
          if grep -qx '20260813163052' mpgf-compacts-clean-qa/duplicate-migration-versions.txt; then
            echo "The compact migration version collides with another repository migration." >&2
            exit 1
          fi
          git show "$HISTORICAL_BASELINE_COMMIT:supabase/schema.sql" \
            > mpgf-compacts-clean-qa/historical-baseline.sql
          test "$(sha256sum mpgf-compacts-clean-qa/historical-baseline.sql | cut -d ' ' -f 1)" \
            = "$HISTORICAL_BASELINE_SHA256"
          mkdir -p mpgf-compacts-clean-qa/post-baseline-migrations
          git diff --name-only --diff-filter=AM \
            "$HISTORICAL_BASELINE_COMMIT"..HEAD \
            -- 'supabase/migrations/*.sql' \
            | LC_ALL=C sort \
            | tee mpgf-compacts-clean-qa/post-baseline-migrations.txt
          while IFS= read -r migration_path; do
            test -f "$migration_path"
            cp "$migration_path" mpgf-compacts-clean-qa/post-baseline-migrations/
          done < mpgf-compacts-clean-qa/post-baseline-migrations.txt
          test -f mpgf-compacts-clean-qa/post-baseline-migrations/20260813163052_mpgf_public_goods_compacts.sql
          test -f mpgf-compacts-clean-qa/post-baseline-migrations/20260814031500_mpgf_public_goods_compacts_state_hardening.sql
          git rev-parse HEAD > mpgf-compacts-clean-qa/head-sha.txt

      - name: Start a clean ephemeral PostgreSQL 17 Supabase runtime
        shell: bash
        run: |
          set -euo pipefail
          mv supabase/migrations "$RUNNER_TEMP/repository-migrations"
          mkdir supabase/migrations
          supabase init --force
          sed -i 's/major_version = 15/major_version = 17/' supabase/config.toml
          supabase start \
            --exclude gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor \
            --log-level error \
            --yes > /dev/null
          rmdir supabase/migrations
          mv "$RUNNER_TEMP/repository-migrations" supabase/migrations

      - name: Apply historical baseline and production-compatible pre-ledger migrations in order
        shell: bash
        run: |
          set -euo pipefail
          qa_skips=20260811152545_commitments_impact_study_instrumentation_qa_only.sql,20260811152958_commitments_impact_study_instrumentation_child_trigger_fix.sql,20260811161238_commitments_impact_study_instrumentation_review_remediation_core.sql,20260811161445_commitments_impact_study_instrumentation_review_remediation_instance_validator.sql,20260811161708_commitments_impact_study_instrumentation_review_remediation_child_validators.sql,20260811161948_commitments_impact_study_instrumentation_review_remediation_rpcs.sql,20260811162054_commitments_impact_study_instrumentation_review_remediation_privileges.sql,20260811171544_commitments_impact_study_blocked_probe_service_role.sql
          ledger_skips=20260816141500_compact_authoritative_outflow_ledger_v1.sql,20260816141501_compact_authoritative_outflow_freeze_v1.sql,20260816141502_compact_authoritative_outflow_hardening_v1.sql,20260816141503_compact_authoritative_outflow_replay_fix_v1.sql
          SUPABASE_MIGRATION_TEST_DB_URL="$LOCAL_SUPABASE_DB_URL"           SUPABASE_MIGRATION_BASELINE_SQL=mpgf-compacts-clean-qa/historical-baseline.sql           SUPABASE_MIGRATION_SKIP_BASENAMES="${qa_skips},${ledger_skips}"             bash scripts/apply-supabase-migrations-in-order.sh               mpgf-compacts-clean-qa/post-baseline-migrations             2>&1 | tee mpgf-compacts-clean-qa/pre-ledger-migration-chain.log
          test "$(grep -c '^skipping_environment_bound_migration=' mpgf-compacts-clean-qa/pre-ledger-migration-chain.log)" -eq 12
          grep --fixed-strings --quiet 'applying_migration=20260813163052_mpgf_public_goods_compacts.sql' mpgf-compacts-clean-qa/pre-ledger-migration-chain.log
          grep --fixed-strings --quiet 'applying_migration=20260814031500_mpgf_public_goods_compacts_state_hardening.sql' mpgf-compacts-clean-qa/pre-ledger-migration-chain.log
          grep --fixed-strings --quiet 'skipped_environment_bound_migration_count=12' mpgf-compacts-clean-qa/pre-ledger-migration-chain.log
          for version in 20260816141500 20260816141501 20260816141502 20260816141503; do
            if grep -q "applying_migration=${version}_" mpgf-compacts-clean-qa/pre-ledger-migration-chain.log; then
              echo "Authoritative-ledger migration ${version} ran before legacy Compact validation." >&2
              exit 1
            fi
          done

      - name: Run legacy role, lifecycle, privacy, and no-money tests before ledger authority hardening
        shell: bash
        run: |
          set -euo pipefail
          psql "$LOCAL_SUPABASE_DB_URL"             --no-psqlrc             --set ON_ERROR_STOP=1 <<'SQL'             | tee mpgf-compacts-clean-qa/pre-ledger-database-lifecycle.log
          begin;
          \i supabase/tests/mpgf_public_goods_compacts_lifecycle.sql
          \i supabase/tests/mpgf_public_goods_compacts_historical_freeze.sql
          rollback;
          SQL

      - name: Run genuinely concurrent readiness freeze test before ledger authority hardening
        shell: bash
        run: |
          set -euo pipefail
          MPGF_COMPACT_TEST_DB_URL="$LOCAL_SUPABASE_DB_URL"             bash scripts/test-mpgf-public-goods-compacts-concurrency.sh             2>&1 | tee mpgf-compacts-clean-qa/pre-ledger-database-concurrency.log

      - name: Apply the four authoritative-ledger migrations after legacy Compact validation
        shell: bash
        run: |
          set -euo pipefail
          : > mpgf-compacts-clean-qa/authoritative-ledger-migrations.log
          for migration in             supabase/migrations/20260816141500_compact_authoritative_outflow_ledger_v1.sql             supabase/migrations/20260816141501_compact_authoritative_outflow_freeze_v1.sql             supabase/migrations/20260816141502_compact_authoritative_outflow_hardening_v1.sql             supabase/migrations/20260816141503_compact_authoritative_outflow_replay_fix_v1.sql
          do
            echo "applying_authoritative_ledger_migration=$(basename "$migration")"               | tee -a mpgf-compacts-clean-qa/authoritative-ledger-migrations.log
            psql "$LOCAL_SUPABASE_DB_URL"               --no-psqlrc               --set ON_ERROR_STOP=1               --file "$migration"               2>&1 | tee -a mpgf-compacts-clean-qa/authoritative-ledger-migrations.log
          done
          for version in 20260816141500 20260816141501 20260816141502 20260816141503; do
            grep -q "applying_authoritative_ledger_migration=${version}_"               mpgf-compacts-clean-qa/authoritative-ledger-migrations.log
          done

      - name: Generate and compare exact final runtime database types
        shell: bash
        run: |
          set -euo pipefail
          supabase gen types typescript             --db-url "$LOCAL_SUPABASE_DB_URL"             --schema public             > mpgf-compacts-clean-qa/generated-database.types.ts
          test -s mpgf-compacts-clean-qa/generated-database.types.ts
          node scripts/verify-mpgf-public-goods-compacts-generated-types.mjs             mpgf-compacts-clean-qa/generated-database.types.ts             src/lib/supabase/database.types.ts             | tee mpgf-compacts-clean-qa/generated-type-comparison.json

      - name: Run final-schema Supabase database lint with Compact-owned error gate
        shell: bash
        run: |
          set -euo pipefail
          supabase db lint             --db-url "$LOCAL_SUPABASE_DB_URL"             --schema public             --level warning             --fail-on none             2>&1 | tee mpgf-compacts-clean-qa/supabase-db-lint.log
          node scripts/verify-mpgf-public-goods-compacts-db-lint.mjs             mpgf-compacts-clean-qa/supabase-db-lint.log             | tee mpgf-compacts-clean-qa/supabase-db-lint-compact-gate.json

      - name: Prove final schema preserved no-activation and no-money boundaries
        shell: bash
        run: |
          set -euo pipefail
          psql "$LOCAL_SUPABASE_DB_URL"             --no-psqlrc             --tuples-only             --no-align             --set ON_ERROR_STOP=1 <<'SQL'             | sed '/^$/d'             | tee mpgf-compacts-clean-qa/final-no-money.txt
          select 'active_compacts|' || count(*) from public.mpgf_public_goods_compacts where status = 'active'
          union all select 'settled_contributions|' || count(*) from public.mpgf_public_goods_settled_contribution_snapshots
          union all select 'voting_snapshots|' || count(*) from public.mpgf_public_goods_voting_snapshots
          order by 1;
          SQL
          test "$(wc -l < mpgf-compacts-clean-qa/final-no-money.txt)" -eq 3
          grep -qx 'active_compacts|0' mpgf-compacts-clean-qa/final-no-money.txt
          grep -qx 'settled_contributions|0' mpgf-compacts-clean-qa/final-no-money.txt
          grep -qx 'voting_snapshots|0' mpgf-compacts-clean-qa/final-no-money.txt

      - name: Stop and erase the ephemeral Supabase runtime
        if: always()
        shell: bash
        run: |
          supabase stop --no-backup --yes > /dev/null 2>&1 || true

      - name: Upload clean-chain database evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mpgf-public-goods-compacts-clean-chain-${{ github.run_id }}-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: warn
          retention-days: 30
          path: mpgf-compacts-clean-qa

  source-and-rendered:
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Verify exact candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          git diff --check

      - name: Install exact dependencies
        run: npm ci

      - name: Run complete repository tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee mpgf-compacts-repository-tests.log

      - name: Run repository-wide ESLint
        shell: bash
        run: |
          set -o pipefail
          npm run lint -- --quiet 2>&1 | tee mpgf-compacts-eslint.log

      - name: Run strict TypeScript
        shell: bash
        run: |
          set -o pipefail
          npx tsc --noEmit 2>&1 | tee mpgf-compacts-typescript-full.log

      - name: Build production application
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee mpgf-compacts-build.log

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run desktop, tablet, and mobile rendered Compact v2 QA
        shell: bash
        run: |
          set -o pipefail
          npx playwright test \
            tests/mpgf-public-goods-compacts.spec.ts \
            --workers=1 \
            --reporter=line 2>&1 | tee mpgf-compacts-playwright.log

      - name: Prove clean exact-head tracked source state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --short --untracked-files=no)"
          git status --short > mpgf-compacts-working-tree-status.txt
          git rev-parse HEAD > mpgf-compacts-head-sha.txt

      - name: Upload exact-head source and rendered evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mpgf-public-goods-compacts-source-rendered-${{ github.run_id }}-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            mpgf-compacts-head-sha.txt
            mpgf-compacts-working-tree-status.txt
            mpgf-compacts-repository-tests.log
            mpgf-compacts-eslint.log
            mpgf-compacts-typescript-full.log
            mpgf-compacts-build.log
            mpgf-compacts-playwright.log
            test-results/mpgf-public-goods-compacts*

  rollback-database-lifecycle:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.confirm_target == 'hvmxfjjbdcgjjudmthdz')
      || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      EXPECTED_QA_POOLER_HOST: aws-0-us-west-1.pooler.supabase.com
      EXPECTED_QA_REF: hvmxfjjbdcgjjudmthdz
      PGSSLMODE: require
      QA_SUPABASE_DB_URL: ${{ secrets.QA_SUPABASE_DB_URL }}

    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Verify exact candidate and isolated QA target
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test -n "${QA_SUPABASE_DB_URL:-}"
          python3 - <<'PY'
          import os
          from urllib.parse import parse_qs, urlparse

          parsed = urlparse(os.environ["QA_SUPABASE_DB_URL"])
          ssl_modes = parse_qs(parsed.query).get("sslmode", ["require"])
          valid = (
              parsed.scheme in {"postgres", "postgresql"}
              and os.environ["EXPECTED_QA_REF"] in (parsed.username or "")
              and parsed.hostname == os.environ["EXPECTED_QA_POOLER_HOST"]
              and parsed.port == 5432
              and parsed.path == "/postgres"
              and ssl_modes == ["require"]
              and bool(parsed.password)
          )
          if not valid:
              raise SystemExit(
                  "Refusing a database URL outside the exact TLS-only MoralTrade QA target."
              )
          PY

      - name: Install dependencies and PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          sudo apt-get update -qq
          sudo apt-get install --yes postgresql-client > /dev/null

      - name: Run focused source, type, and diff gates
        shell: bash
        run: |
          set -euo pipefail
          node --import tsx --test \
            src/lib/mpgf/public-goods-compacts.test.ts \
            src/lib/mpgf/public-goods-compacts-state.test.ts \
            src/lib/mpgf/public-goods-compacts-contract.test.ts \
            src/lib/mpgf/public-goods-compacts-hardening-contract.test.ts \
            | tee mpgf-compacts-focused.log
          npx tsc --noEmit | tee mpgf-compacts-typescript.log
          git diff --check

      - name: Prepare rollback-only migration inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mpgf-compacts-qa
          python3 - <<'PY'
          from pathlib import Path

          sources = [
              Path("supabase/migrations/20260813163052_mpgf_public_goods_compacts.sql"),
              Path("supabase/migrations/20260814031500_mpgf_public_goods_compacts_state_hardening.sql"),
          ]
          output = Path("mpgf-compacts-qa")
          for source in sources:
              lines = source.read_text().splitlines()
              stripped = [
                  line
                  for line in lines
                  if line.strip().lower() not in {"begin;", "commit;"}
              ]
              target = output / source.name
              target.write_text("\n".join(stripped) + "\n")
          PY
          sha256sum \
            supabase/migrations/20260607_moral_trade_release_gate_policy_snapshots.sql \
            supabase/migrations/20260607_zzzzz_moral_trade_participant_eligibility_records.sql \
            supabase/migrations/20260813163052_mpgf_public_goods_compacts.sql \
            supabase/migrations/20260814031500_mpgf_public_goods_compacts_state_hardening.sql \
            supabase/tests/mpgf_public_goods_compacts_lifecycle.sql \
            supabase/tests/mpgf_public_goods_compacts_historical_freeze.sql \
            | tee mpgf-compacts-qa/source.sha256

      - name: Prove QA starts without persisted compact schema
        shell: bash
        run: |
          set -euo pipefail
          count="$(psql "$QA_SUPABASE_DB_URL" --no-psqlrc --tuples-only --no-align --set ON_ERROR_STOP=1 <<'SQL'
          select count(*)
          from unnest(array[
            'mpgf_public_goods_compacts',
            'mpgf_public_goods_compact_memberships',
            'mpgf_public_goods_dormant_authorization_snapshots',
            'mpgf_public_goods_outflow_coverage_snapshots',
            'mpgf_public_goods_outflow_observations',
            'mpgf_public_goods_obligation_snapshots',
            'mpgf_public_goods_allocation_instructions',
            'mpgf_public_goods_allocation_instruction_lines',
            'mpgf_public_goods_scheduled_amount_snapshots',
            'mpgf_public_goods_settled_contribution_snapshots',
            'mpgf_public_goods_funding_qualification_snapshots',
            'mpgf_public_goods_readiness_snapshots',
            'mpgf_public_goods_voting_snapshots',
            'mpgf_public_goods_voting_weight_snapshots',
            'mpgf_public_goods_delegation_events',
            'mpgf_public_goods_delegation_snapshots',
            'mpgf_public_goods_delegation_weight_snapshots',
            'mpgf_public_goods_compact_idempotency_keys'
          ]) as relation_name
          where to_regclass('public.' || relation_name) is not null;
          SQL
          )"
          test "$count" = "0"
          prerequisite_count="$(psql "$QA_SUPABASE_DB_URL" --no-psqlrc --tuples-only --no-align --set ON_ERROR_STOP=1 <<'SQL'
          select count(*)
          from unnest(array[
            'moral_trade_identity_artifact_references',
            'moral_trade_participant_eligibility_records',
            'moral_trade_participant_eligibility_reviews'
          ]) as relation_name
          where to_regclass('public.' || relation_name) is not null;
          SQL
          )"
          {
            printf 'relations_before=%s\n' "$count"
            printf 'eligibility_prerequisite_relations_before=%s\n' "$prerequisite_count"
          } | tee mpgf-compacts-qa/schema-absence-before.txt

      - name: Compile migrations and run full lifecycle inside rollback
        shell: bash
        run: |
          set -euo pipefail
          psql "$QA_SUPABASE_DB_URL" \
            --no-psqlrc \
            --set ON_ERROR_STOP=1 <<SQL \
            | tee mpgf-compacts-qa/rollback-lifecycle.log
          begin;
          \i supabase/migrations/20260607_moral_trade_release_gate_policy_snapshots.sql
          \i supabase/migrations/20260607_zzzzz_moral_trade_participant_eligibility_records.sql
          \i mpgf-compacts-qa/20260813163052_mpgf_public_goods_compacts.sql
          \i mpgf-compacts-qa/20260814031500_mpgf_public_goods_compacts_state_hardening.sql
          \i supabase/tests/mpgf_public_goods_compacts_lifecycle.sql
          \i supabase/tests/mpgf_public_goods_compacts_historical_freeze.sql
          rollback;
          SQL

      - name: Prove rollback left no compact schema or fixtures
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          count="$(psql "$QA_SUPABASE_DB_URL" --no-psqlrc --tuples-only --no-align --set ON_ERROR_STOP=1 <<'SQL'
          select count(*)
          from unnest(array[
            'mpgf_public_goods_compacts',
            'mpgf_public_goods_compact_memberships',
            'mpgf_public_goods_dormant_authorization_snapshots',
            'mpgf_public_goods_outflow_coverage_snapshots',
            'mpgf_public_goods_outflow_observations',
            'mpgf_public_goods_obligation_snapshots',
            'mpgf_public_goods_allocation_instructions',
            'mpgf_public_goods_allocation_instruction_lines',
            'mpgf_public_goods_scheduled_amount_snapshots',
            'mpgf_public_goods_settled_contribution_snapshots',
            'mpgf_public_goods_funding_qualification_snapshots',
            'mpgf_public_goods_readiness_snapshots',
            'mpgf_public_goods_voting_snapshots',
            'mpgf_public_goods_voting_weight_snapshots',
            'mpgf_public_goods_delegation_events',
            'mpgf_public_goods_delegation_snapshots',
            'mpgf_public_goods_delegation_weight_snapshots',
            'mpgf_public_goods_compact_idempotency_keys'
          ]) as relation_name
          where to_regclass('public.' || relation_name) is not null;
          SQL
          )"
          test "$count" = "0"
          prerequisite_count="$(psql "$QA_SUPABASE_DB_URL" --no-psqlrc --tuples-only --no-align --set ON_ERROR_STOP=1 <<'SQL'
          select count(*)
          from unnest(array[
            'moral_trade_identity_artifact_references',
            'moral_trade_participant_eligibility_records',
            'moral_trade_participant_eligibility_reviews'
          ]) as relation_name
          where to_regclass('public.' || relation_name) is not null;
          SQL
          )"
          prerequisite_count_before="$(sed -n 's/^eligibility_prerequisite_relations_before=//p' mpgf-compacts-qa/schema-absence-before.txt)"
          test "$prerequisite_count" = "$prerequisite_count_before"
          users="$(psql "$QA_SUPABASE_DB_URL" --no-psqlrc --tuples-only --no-align --set ON_ERROR_STOP=1 <<'SQL'
          select count(*) from auth.users where email like 'compact-%@example.test';
          SQL
          )"
          test "$users" = "0"
          {
            printf 'relations_after=%s\n' "$count"
            printf 'eligibility_prerequisite_relations_after=%s\n' "$prerequisite_count"
            printf 'fixture_users_after=%s\n' "$users"
          } | tee mpgf-compacts-qa/schema-absence-after.txt

      - name: Upload rollback-only QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mpgf-public-goods-compacts-database-${{ github.run_id }}-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            mpgf-compacts-focused.log
            mpgf-compacts-typescript.log
            mpgf-compacts-qa
