name: Dispatch Offers directory production 2026-09-25

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/offers-directory-production-dispatch-20260925.yml

permissions:
  actions: write
  contents: read

concurrency:
  group: offers-directory-production-dispatch-20260925
  cancel-in-progress: false

env:
  CONTROLLER_PATH: .github/workflows/offers-directory-production-dispatch-20260925.yml
  OFFERS_CSS_PATH: src/app/offers/offers-density.module.css
  RELEASE_WORKFLOW: vercel-release.yml
  RELEASE_REF: main
  RELEASE_TARGET: production
  EXPECTED_TRIGGER_PARENT: e24a91d848d595f68d668da7386d6fd810760afa

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact controller commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Verify exact Offers fix release trigger
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'ghuser29384/Website2'
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$(git rev-parse HEAD^)" = "$EXPECTED_TRIGGER_PARENT"
          changed="$(git diff --name-only HEAD^ HEAD | sed '/^$/d' | sort)"
          expected_changed="$(printf '%s\n' "$CONTROLLER_PATH" "$OFFERS_CSS_PATH" | sort)"
          test "$changed" = "$expected_changed"
          test "$RELEASE_TARGET" = 'production'
          test "$RELEASE_REF" = 'main'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          remote_sha="$(git ls-remote origin "refs/heads/$RELEASE_REF" | awk '{print $1}')"
          test "$remote_sha" = "$GITHUB_SHA"
          workflow_state="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$RELEASE_WORKFLOW" --jq .state)"
          test "$workflow_state" = 'active'

      - name: Dispatch exact gated production release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          payload="$(jq -n --arg workflow_ref main --arg release_ref "$RELEASE_REF" --arg target "$RELEASE_TARGET" --arg expected_sha "$GITHUB_SHA" '{ref:$workflow_ref,inputs:{ref:$release_ref,target:$target,expected_sha:$expected_sha,synthetic_auth_fixture_url:""}}')"
          gh api --method POST             -H 'Accept: application/vnd.github+json'             -H 'X-GitHub-Api-Version: 2022-11-28'             "repos/$GITHUB_REPOSITORY/actions/workflows/$RELEASE_WORKFLOW/dispatches"             --input - <<<"$payload" >/dev/null
