name: Home, Trade, and Create entry QA

on:
  pull_request:
    paths:
      - "public/moral-trade-live-create-router.js"
      - "public/moral-trade-live-feed-identity.js"
      - "public/moral-trade-live.html"
      - "src/lib/create-interface/unified-entry-routes.test.ts"
      - "src/proxy.test.ts"
      - "src/proxy.ts"
      - "tests/create-entry-routing.spec.ts"
      - ".github/workflows/exact-live-trade-autocomplete-qa.yml"
  push:
    branches:
      - main
    paths:
      - "public/moral-trade-live-create-router.js"
      - "public/moral-trade-live-feed-identity.js"
      - "public/moral-trade-live.html"
      - "src/lib/create-interface/unified-entry-routes.test.ts"
      - "src/proxy.test.ts"
      - "src/proxy.ts"
      - "tests/create-entry-routing.spec.ts"
      - ".github/workflows/exact-live-trade-autocomplete-qa.yml"

permissions:
  contents: read

jobs:
  entry-routing:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify route and Feed identity JavaScript syntax
        run: |
          node --check public/moral-trade-live-create-router.js
          node --check public/moral-trade-live-feed-identity.js

      - name: Lint route implementation and tests
        run: |
          npx eslint \
            public/moral-trade-live-create-router.js \
            public/moral-trade-live-feed-identity.js \
            src/lib/create-interface/unified-entry-routes.test.ts \
            src/proxy.test.ts \
            src/proxy.ts \
            tests/create-entry-routing.spec.ts

      - name: Run route source regressions
        run: |
          node --import tsx --test \
            src/proxy.test.ts \
            src/lib/create-interface/unified-entry-routes.test.ts

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run rendered Home, Trade, and Create regression
        run: npm run test:e2e -- tests/create-entry-routing.spec.ts

      - name: Upload rendered evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: home-trade-create-entry-evidence
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 7
