name: Split one-person cross-relation migration locks

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-person-migration-split-controller.yml

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: one-person-migration-split-controller
  cancel-in-progress: false

env:
  CONTROLLER_PATH: .github/workflows/one-person-migration-split-controller.yml
  TARGET_BRANCH: feature/one-person-one-account-20260731
  EXPECTED_FEATURE_HEAD: 68eb508998658c5ec4285234ed321f493da7126c
  IDENTITY_MIGRATION: supabase/migrations/20260731072000_one_person_one_account.sql
  PROFILE_MIGRATION: supabase/migrations/20260801153000_one_person_profile_badge_projection_trigger.sql
  QA_WORKFLOW: .github/workflows/one-person-account-qa.yml

jobs:
  split:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact controller commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          token: ${{ github.token }}

      - name: Verify one-file controller scope and remove it from main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'ghuser29384/Website2'
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          changed="$(git diff-tree --no-commit-id --name-only -r HEAD | sed '/^$/d')"
          test "$changed" = "$CONTROLLER_PATH"
          controller_sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/$CONTROLLER_PATH?ref=main" --jq .sha)"
          jq -n \
            --arg message 'Remove one-person migration split controller' \
            --arg sha "$controller_sha" \
            --arg branch main \
            '{message:$message,sha:$sha,branch:$branch}' \
            | gh api --method DELETE \
                "repos/$GITHUB_REPOSITORY/contents/$CONTROLLER_PATH" \
                --input - >/dev/null

      - name: Check out exact held feature head
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH"
          test "$(git rev-parse "refs/remotes/origin/$TARGET_BRANCH")" = "$EXPECTED_FEATURE_HEAD"
          git switch --detach "$EXPECTED_FEATURE_HEAD"
          test "$(git rev-parse HEAD)" = "$EXPECTED_FEATURE_HEAD"
          test -f "$IDENTITY_MIGRATION"
          test -f "$QA_WORKFLOW"
          test ! -e "$PROFILE_MIGRATION"

      - name: Split profile trigger into a relation-isolated migration and update QA
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          identity_path = Path('supabase/migrations/20260731072000_one_person_one_account.sql')
          profile_path = Path('supabase/migrations/20260801153000_one_person_profile_badge_projection_trigger.sql')
          workflow_path = Path('.github/workflows/one-person-account-qa.yml')

          identity = identity_path.read_text(encoding='utf-8')
          lock_start = '-- Acquire both relations without ever waiting while holding only one of them.\n'
          lock_end = '$one_person_migration_relation_locks$;\n\n'
          if identity.count(lock_start) != 1 or identity.count(lock_end) != 1:
              raise SystemExit('unexpected relation-lock block inventory')
          start = identity.index(lock_start)
          end = identity.index(lock_end, start) + len(lock_end)
          replacement = (
              '-- Cross-relation DDL is split across migrations so this transaction never holds\n'
              '-- a strong lock on auth.users while waiting for public.profiles, or vice versa.\n\n'
          )
          identity = identity[:start] + replacement + identity[end:]

          trigger_block = '''drop trigger if exists sync_identity_badge_from_profile on public.profiles;
          create trigger sync_identity_badge_from_profile
          after insert or update on public.profiles
          for each row execute function moral_trade_private.sync_identity_badge_from_profile();

          '''
          if identity.count(trigger_block) != 1:
              raise SystemExit(f'unexpected profile-trigger block inventory: {identity.count(trigger_block)}')
          identity = identity.replace(
              trigger_block,
              '-- The public.profiles projection trigger is installed by the follow-up\n'
              '-- profile-only migration so this transaction never needs strong locks on both\n'
              '-- auth.users and public.profiles.\n\n',
              1,
          )
          if '$one_person_migration_relation_locks$' in identity:
              raise SystemExit('stale relation-lock block remains')
          identity_path.write_text(identity, encoding='utf-8')

          profile = '''-- Install the profile badge projection without sharing a transaction with auth.users DDL.
          -- The core identity migration is additive and fail-closed; this follow-up is idempotent
          -- and can be retried independently if public.profiles is temporarily busy.

          begin;

          set local statement_timeout = '120s';
          set local lock_timeout = '90s';

          do $require_one_person_profile_projection_function$
          begin
            if to_regprocedure('moral_trade_private.sync_identity_badge_from_profile()') is null then
              raise exception using
                errcode = '55000',
                message = 'one_person_profile_projection_function_missing';
            end if;
          end;
          $require_one_person_profile_projection_function$;

          drop trigger if exists sync_identity_badge_from_profile on public.profiles;
          create trigger sync_identity_badge_from_profile
          after insert or update on public.profiles
          for each row execute function moral_trade_private.sync_identity_badge_from_profile();

          notify pgrst, 'reload schema';

          commit;
          '''
          profile_path.write_text(profile, encoding='utf-8')

          workflow = workflow_path.read_text(encoding='utf-8')
          path_needle = '''      - "supabase/migrations/20260731072000_one_person_one_account.sql"
                - "supabase/tests/one_person_one_account.sql"'''
          path_replacement = '''      - "supabase/migrations/20260731072000_one_person_one_account.sql"
                - "supabase/migrations/20260801153000_one_person_profile_badge_projection_trigger.sql"
                - "supabase/tests/one_person_one_account.sql"'''
          if workflow.count(path_needle) != 1:
              raise SystemExit('unexpected workflow path-filter inventory')
          workflow = workflow.replace(path_needle, path_replacement, 1)

          expected_needle = '''          supabase/migrations/20260731072000_one_person_one_account.sql
                supabase/tests/one_person_one_account.sql'''
          expected_replacement = '''          supabase/migrations/20260731072000_one_person_one_account.sql
                supabase/migrations/20260801153000_one_person_profile_badge_projection_trigger.sql
                supabase/tests/one_person_one_account.sql'''
          if workflow.count(expected_needle) != 1:
              raise SystemExit('unexpected expected-path inventory')
          workflow = workflow.replace(expected_needle, expected_replacement, 1)

          apply_start = workflow.index('      - name: Apply additive migration once to isolated QA\n')
          apply_end = workflow.index('      - name: Normalize isolated QA release gates to disabled\n', apply_start)
          apply_step = '''      - name: Apply additive migrations once to isolated QA
                shell: bash
                run: |
                  set -euo pipefail
                  identity_migration=supabase/migrations/20260731072000_one_person_one_account.sql
                  profile_migration=supabase/migrations/20260801153000_one_person_profile_badge_projection_trigger.sql
                  test "$(grep -cF '$one_person_migration_relation_locks$' "$identity_migration" || true)" -eq 0
                  sha256sum "$identity_migration" "$profile_migration" | tee one-person-migrations.sha256
                  present="$(psql "$MORALTRADE_QA_DATABASE_URL" -v ON_ERROR_STOP=1 -qAtc "select to_regclass('moral_trade_private.person_account_release_gates') is not null")"
                  if [[ "$present" == "t" ]]; then
                    echo "One-person-account schema already exists in isolated QA; verifying instead of replaying persistent migrations."
                  else
                    psql "$MORALTRADE_QA_DATABASE_URL" -v ON_ERROR_STOP=1 -f "$identity_migration" | tee one-person-identity-migration.txt
                    psql "$MORALTRADE_QA_DATABASE_URL" -v ON_ERROR_STOP=1 -f "$profile_migration" | tee one-person-profile-migration.txt
                  fi
                  psql "$MORALTRADE_QA_DATABASE_URL" -v ON_ERROR_STOP=1 -qAt <<'SQL' | tee one-person-schema-inventory.txt
                  select jsonb_build_object(
                    'releaseGates', to_regclass('moral_trade_private.person_account_release_gates') is not null,
                    'personAccounts', to_regclass('moral_trade_private.person_accounts') is not null,
                    'identitySubjects', to_regclass('moral_trade_private.identity_subjects') is not null,
                    'registrationGrants', to_regclass('moral_trade_private.person_registration_grants') is not null,
                    'beforeUserCreatedHook', to_regprocedure('public.one_person_before_user_created_hook(jsonb)') is not null,
                    'customAccessTokenHook', to_regprocedure('public.one_person_custom_access_token_hook(jsonb)') is not null,
                    'cleanupFixture', to_regprocedure('public.cleanup_one_person_qa_fixture_v1(uuid,text)') is not null,
                    'cleanupSession', to_regprocedure('public.cleanup_one_person_qa_session_v1(uuid,text)') is not null,
                    'profileBadgeTrigger', exists (
                      select 1
                      from pg_catalog.pg_trigger trigger_row
                      join pg_catalog.pg_class relation on relation.oid = trigger_row.tgrelid
                      join pg_catalog.pg_namespace namespace on namespace.oid = relation.relnamespace
                      where namespace.nspname = 'public'
                        and relation.relname = 'profiles'
                        and trigger_row.tgname = 'sync_identity_badge_from_profile'
                        and not trigger_row.tgisinternal
                    )
                  );
                  SQL
                  grep -q '"releaseGates": true' one-person-schema-inventory.txt
                  grep -q '"beforeUserCreatedHook": true' one-person-schema-inventory.txt
                  grep -q '"profileBadgeTrigger": true' one-person-schema-inventory.txt
          '''
          workflow = workflow[:apply_start] + apply_step + workflow[apply_end:]

          replay_start = workflow.index('      - name: Replay complete migration under adversarial lock order with rollback\n')
          replay_end = workflow.index('      - name: SQL regression with release gates initially disabled\n', replay_start)
          replay_step = '''      - name: Replay relation-isolated migrations under adversarial lock order with rollback
                shell: bash
                run: |
                  set -euo pipefail
                  identity_migration=supabase/migrations/20260731072000_one_person_one_account.sql
                  profile_migration=supabase/migrations/20260801153000_one_person_profile_badge_projection_trigger.sql

                  python3 - <<'PY'
                  from pathlib import Path

                  source_path = Path("supabase/migrations/20260731072000_one_person_one_account.sql")
                  lines = source_path.read_text(encoding="utf-8").splitlines()
                  try:
                      start = next(index for index, line in enumerate(lines) if line.strip() == "begin;")
                  except StopIteration as exc:
                      raise SystemExit("identity migration begin statement not found") from exc

                  end = len(lines) - 1
                  while end >= 0 and not lines[end].strip():
                      end -= 1
                  if end <= start or lines[end].strip() != "commit;":
                      raise SystemExit("identity migration final commit statement not found")

                  reset = r'''do $reset_one_person_replay_triggers$
                  declare
                    item record;
                  begin
                    for item in
                      select * from (values
                        ('person_account_release_gates', 'person_account_release_gates_touch_updated_at'),
                        ('identity_subjects', 'identity_subjects_touch_updated_at'),
                        ('preaccount_verification_sessions', 'preaccount_verification_sessions_touch_updated_at'),
                        ('person_accounts', 'person_accounts_touch_updated_at'),
                        ('preaccount_guardian_consents', 'preaccount_guardian_consents_touch_updated_at'),
                        ('guardian_relationships', 'guardian_relationships_touch_updated_at'),
                        ('account_merge_cases', 'account_merge_cases_touch_updated_at'),
                        ('identity_verification_events', 'identity_verification_events_append_only'),
                        ('account_security_events', 'account_security_events_append_only'),
                        ('identity_dedupe_keys', 'identity_dedupe_keys_no_delete')
                      ) as configured(table_name, trigger_name)
                    loop
                      if to_regclass('moral_trade_private.' || item.table_name) is not null then
                        execute format(
                          'drop trigger if exists %I on moral_trade_private.%I',
                          item.trigger_name,
                          item.table_name
                        );
                      end if;
                    end loop;
                  end;
                  $reset_one_person_replay_triggers$;'''

                  body = "\\n".join(lines[start + 1 : end]).rstrip() + "\\n"
                  replay = (
                      "\\\\set ON_ERROR_STOP on\\n"
                      "begin;\\n"
                      "set local statement_timeout = '180s';\\n"
                      "set local lock_timeout = '150s';\\n\\n"
                      + reset
                      + "\\n\\n"
                      + body
                      + "\\nrollback;\\n"
                  )
                  Path("/tmp/one-person-identity-replay.sql").write_text(replay, encoding="utf-8")

                  profile_source = Path(
                      "supabase/migrations/20260801153000_one_person_profile_badge_projection_trigger.sql"
                  ).read_text(encoding="utf-8").rstrip()
                  if not profile_source.endswith("commit;"):
                      raise SystemExit("profile migration final commit statement not found")
                  Path("/tmp/one-person-profile-replay.sql").write_text(
                      profile_source[:-len("commit;")] + "rollback;\\n",
                      encoding="utf-8",
                  )
                  PY

                  sha256sum /tmp/one-person-identity-replay.sql /tmp/one-person-profile-replay.sql \
                    | tee one-person-replays.sha256
                  cat > /tmp/one-person-lock-blocker.sql <<'SQL'
                  \\set ON_ERROR_STOP on
                  begin;
                  set local statement_timeout = '180s';
                  lock table public.profiles in access share mode;
                  select pg_advisory_lock(93791, 379);
                  select 'blocker-profile-lock-acquired';
                  select pg_sleep(2);
                  lock table auth.users in row exclusive mode;
                  select 'blocker-auth-lock-acquired';
                  select pg_sleep(2);
                  commit;
                  select pg_advisory_unlock(93791, 379);
                  SQL

                  blocker_pid=''
                  cleanup_blocker() {
                    if [[ -n "$blocker_pid" ]] && kill -0 "$blocker_pid" 2>/dev/null; then
                      kill "$blocker_pid" 2>/dev/null || true
                      wait "$blocker_pid" 2>/dev/null || true
                    fi
                  }
                  trap cleanup_blocker EXIT

                  psql "$MORALTRADE_QA_DATABASE_URL" \
                    -v ON_ERROR_STOP=1 \
                    -f /tmp/one-person-lock-blocker.sql \
                    > one-person-lock-blocker.txt 2>&1 &
                  blocker_pid=$!

                  blocker_ready=false
                  for attempt in $(seq 1 200); do
                    readiness="$(psql "$MORALTRADE_QA_DATABASE_URL" -v ON_ERROR_STOP=1 -qAtc \
                      "select pg_try_advisory_lock(93791, 379)")"
                    if [[ "$readiness" == "f" ]]; then
                      blocker_ready=true
                      break
                    fi
                    sleep 0.1
                  done
                  if [[ "$blocker_ready" != "true" ]]; then
                    echo "The adversarial blocker did not acquire its profile lock." >&2
                    cat one-person-lock-blocker.txt >&2 || true
                    exit 1
                  fi

                  set +e
                  psql "$MORALTRADE_QA_DATABASE_URL" \
                    -v ON_ERROR_STOP=1 \
                    -f /tmp/one-person-identity-replay.sql \
                    2>&1 | tee one-person-identity-replay.txt
                  identity_status=${PIPESTATUS[0]}
                  wait "$blocker_pid"
                  blocker_status=$?
                  blocker_pid=''
                  set -e

                  if [[ "$identity_status" -ne 0 || "$blocker_status" -ne 0 ]]; then
                    echo "Identity replay status: $identity_status; blocker status: $blocker_status" >&2
                    cat one-person-lock-blocker.txt >&2 || true
                    exit 1
                  fi
                  grep -Fq 'blocker-profile-lock-acquired' one-person-lock-blocker.txt
                  grep -Fq 'blocker-auth-lock-acquired' one-person-lock-blocker.txt
                  grep -Fq 'ROLLBACK' one-person-identity-replay.txt
                  if grep -Fqi 'deadlock detected' one-person-identity-replay.txt one-person-lock-blocker.txt; then
                    echo "The relation-isolated identity migration encountered a deadlock." >&2
                    exit 1
                  fi

                  psql "$MORALTRADE_QA_DATABASE_URL" \
                    -v ON_ERROR_STOP=1 \
                    -f /tmp/one-person-profile-replay.sql \
                    2>&1 | tee one-person-profile-replay.txt
                  grep -Fq 'ROLLBACK' one-person-profile-replay.txt
          '''
          workflow = workflow[:replay_start] + replay_step + workflow[replay_end:]

          artifact_old = '''            one-person-migration.sha256
                one-person-migration.txt
                one-person-schema-inventory.txt
                one-person-gates-before.json
                one-person-lock-replay.sha256
                one-person-lock-replay.txt
                one-person-lock-blocker.txt'''
          artifact_new = '''            one-person-migrations.sha256
                one-person-identity-migration.txt
                one-person-profile-migration.txt
                one-person-schema-inventory.txt
                one-person-gates-before.json
                one-person-replays.sha256
                one-person-identity-replay.txt
                one-person-profile-replay.txt
                one-person-lock-blocker.txt'''
          if workflow.count(artifact_old) != 1:
              raise SystemExit('unexpected artifact inventory')
          workflow = workflow.replace(artifact_old, artifact_new, 1)
          workflow_path.write_text(workflow, encoding='utf-8')
          PY

          ruby -e 'require "yaml"; YAML.parse_file(ARGV[0]) or abort("invalid workflow YAML")' "$QA_WORKFLOW"
          git diff --check
          test "$(grep -cF '$one_person_migration_relation_locks$' "$IDENTITY_MIGRATION" || true)" -eq 0
          test -f "$PROFILE_MIGRATION"
          grep -Fq 'drop trigger if exists sync_identity_badge_from_profile on public.profiles;' "$PROFILE_MIGRATION"
          grep -Fq 'Replay relation-isolated migrations under adversarial lock order with rollback' "$QA_WORKFLOW"

      - name: Commit and push exact feature repair
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')" = "$EXPECTED_FEATURE_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$IDENTITY_MIGRATION" "$PROFILE_MIGRATION" "$QA_WORKFLOW"
          git diff --cached --check
          cat > /tmp/expected-paths.txt <<'EOF'
          .github/workflows/one-person-account-qa.yml
          supabase/migrations/20260731072000_one_person_one_account.sql
          supabase/migrations/20260801153000_one_person_profile_badge_projection_trigger.sql
          EOF
          sed -i 's/^          //' /tmp/expected-paths.txt
          git diff --cached --name-only | sort > /tmp/actual-paths.txt
          sort -o /tmp/expected-paths.txt /tmp/expected-paths.txt
          diff -u /tmp/expected-paths.txt /tmp/actual-paths.txt
          git commit -m 'Split one-person profile trigger into relation-isolated migration'
          candidate_sha="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_FEATURE_HEAD"
          git push --force-with-lease="refs/heads/$TARGET_BRANCH:$EXPECTED_FEATURE_HEAD" \
            origin "HEAD:refs/heads/$TARGET_BRANCH"
          echo "candidate_sha=$candidate_sha" >> "$GITHUB_OUTPUT"

      - name: Report result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ steps.publish.outputs.candidate_sha }}
        shell: bash
        run: |
          if [[ -n "$CANDIDATE_SHA" ]]; then
            gh pr comment 379 --repo "$GITHUB_REPOSITORY" --body "Split the cross-relation trigger DDL into an idempotent profile-only migration and pushed exact candidate \`$CANDIDATE_SHA\`. The draft PR remains unmerged; production is unchanged. Exact-head repository and isolated-QA gates are running."
          else
            gh pr comment 379 --repo "$GITHUB_REPOSITORY" --body "The one-person migration split controller failed in run \`$GITHUB_RUN_ID\`. No feature push occurred unless every exact-head, exact-path, syntax, and force-with-lease guard passed."
          fi
