name: Repair Compact outflow scope guard v4

on:
  push:
    branches:
      - feature/compact-authoritative-outflow-ledger-v1-20260816
    paths:
      - .github/workflows/repair-compact-outflow-scope-guard-v4.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Restrict safety scans to runtime files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/compact-authoritative-outflow-ledger-qa.yml')
          lines = path.read_text(encoding='utf-8').splitlines()

          def replace_if_block(marker: str, replacement: list[str]) -> None:
              start = next(i for i, line in enumerate(lines) if marker in line)
              end = next(i for i in range(start, len(lines)) if lines[i].strip() == 'fi')
              lines[start:end + 1] = replacement

          replace_if_block(
              'if grep -R -E "automaticCollectionEnabled',
              [
                  '          if grep -E "automaticCollectionEnabled[[:space:]]*[:=][[:space:]]*true|moneyMoved[[:space:]]*[:=][[:space:]]*true|activation_execution_enabled[[:space:]]*=[[:space:]]*true" docs/mpgf/compact-authoritative-outflow-ledger-v1.md src/components/mpgf/mpgf-public-goods-compacts.tsx src/lib/mpgf/compact-authoritative-outflow.ts supabase/migrations/2026081614150*_compact_authoritative_outflow_*.sql; then',
                  '            echo "An active collection or activation effect was introduced."',
                  '            exit 1',
                  '          fi',
              ],
          )
          replace_if_block(
              'if grep -R -E "createServiceClient',
              [
                  '          if grep -E "createServiceClient|SUPABASE_SERVICE_ROLE_KEY|STRIPE_SECRET_KEY|EVERY_ORG" src/components/mpgf/mpgf-public-goods-compacts.tsx src/lib/mpgf/compact-authoritative-outflow.ts; then',
                  '            echo "Application/runtime credential or service-role use is forbidden."',
                  '            exit 1',
                  '          fi',
              ],
          )
          lines = [
              line.replace(
                  'test ! -e .github/workflows/repair-compact-outflow-qa.yml',
                  'for controller in .github/workflows/repair-compact-outflow-qa.yml .github/workflows/repair-compact-outflow-validation-v2.yml .github/workflows/repair-compact-outflow-scope-guard-v3.yml .github/workflows/repair-compact-outflow-scope-guard-v4.yml; do test ! -e "$controller"; done',
              )
              for line in lines
          ]
          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          git diff --check
          grep -q 'docs/mpgf/compact-authoritative-outflow-ledger-v1.md src/components' .github/workflows/compact-authoritative-outflow-ledger-qa.yml
          ! grep -q '$(cat /tmp/actual-files.txt); then' .github/workflows/compact-authoritative-outflow-ledger-qa.yml

      - name: Commit durable repair and remove controller
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/compact-authoritative-outflow-ledger-qa.yml
          git rm .github/workflows/repair-compact-outflow-scope-guard-v4.yml
          git commit -m "ci: scope Compact outflow safety scans to runtime files"
          git push origin "HEAD:${GITHUB_REF_NAME}"
