name: Export PR 212 current source

on:
  push:
    branches:
      - ops/pr212-current-source-20260730
    paths:
      - .github/workflows/export-pr212-current-source.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: feat/institutional-trade-system
          fetch-depth: 1

      - name: Verify expected head and package source
        shell: bash
        run: |
          set -euo pipefail
          expected=9ec3bd79618a704469bc4f3547d2d8a1e4dc2730
          actual="$(git rev-parse HEAD)"
          if [[ "$actual" != "$expected" ]]; then
            echo "PR head moved: expected $expected, got $actual" >&2
            exit 1
          fi
          tar \
            --exclude=.git \
            --exclude=node_modules \
            --exclude=.next \
            --exclude='*.zip' \
            -czf /tmp/pr212-current-source.tar.gz .
          sha256sum /tmp/pr212-current-source.tar.gz > /tmp/pr212-current-source.sha256

      - name: Upload exact source
        uses: actions/upload-artifact@v4
        with:
          name: pr212-current-source-${{ github.run_id }}
          path: |
            /tmp/pr212-current-source.tar.gz
            /tmp/pr212-current-source.sha256
          retention-days: 3

      - name: Record source artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ops/pr212-current-source
          jq -n \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg head_sha "$(git rev-parse HEAD)" \
            --arg artifact "pr212-current-source-${GITHUB_RUN_ID}" \
            '{run_id:$run_id,head_sha:$head_sha,artifact:$artifact}' \
            > ops/pr212-current-source/run.json
          git fetch origin ops/pr212-current-source-20260730
          git checkout -B ops/pr212-current-source-20260730 origin/ops/pr212-current-source-20260730
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops/pr212-current-source/run.json
          git commit -m "Record PR 212 current source artifact"
          git push origin HEAD:ops/pr212-current-source-20260730
