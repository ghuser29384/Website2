name: Correct Donation Redirect notification semantics

on:
  push:
    branches:
      - feature/donation-redirect-group-buying-walkthrough-20260726

permissions:
  contents: write

concurrency:
  group: correct-donation-redirect-notification-semantics
  cancel-in-progress: false

jobs:
  correct-verify-and-render:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out exact walkthrough branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/donation-redirect-group-buying-walkthrough-20260726

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply the exact semantic correction
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          standalone_path = Path("public/moral-trade-interactive-walkthroughs.html")
          standalone = standalone_path.read_text(encoding="utf-8")
          replacements = [
              (
                  "Different causes · different bottlenecks",
                  "Redirect scheduled · users notified",
                  "standalone step-two prompt",
              ),
              (
                  "Before the fallback settles, invite a better proposal.",
                  "The $10 will be donated in 7 days.",
                  "standalone step-two heading",
              ),
              (
                  "The Republican's $10 will go to environmental protection in 7 days unless a trade she values more is accepted and completed.",
                  "Moral Trade notifies users that the Republican environmentalist's $10 is scheduled to go to an environmental protection organization. They can propose a moral trade she judges an even better use of the same $10; otherwise, the donation proceeds automatically.",
                  "standalone notification explanation",
              ),
              ("Fallback donation", "Scheduled redirect", "standalone scheduled redirect label"),
              (
                  "Useful, but no exchange.",
                  "Automatically donated if no better accepted trade is completed.",
                  "standalone scheduled redirect note",
              ),
              ("One-to-one trade", "One-to-one proposal", "standalone one-to-one label"),
              ("Group-buy moral trade", "Group-buy proposal", "standalone group-buy label"),
              (
                  "Notify potential coalition members",
                  "See a notified user start a coalition",
                  "standalone step-two action",
              ),
              (
                  "7-day better-match window",
                  "Platform notification · 7 days remaining",
                  "standalone notification prompt",
              ),
              (
                  "One member finds 99 close matches.",
                  "A notified user finds 99 close matches.",
                  "standalone notified-user heading",
              ),
              (
                  "Moral Trade searches for people whose priorities are as similar as possible and whose small actions can add up.",
                  "She uses Moral Trade to find 99 users whose priorities are as similar as possible and whose small actions can add up.",
                  "standalone notified-user explanation",
              ),
          ]
          for old, new, label in replacements:
              standalone = replace_once(standalone, old, new, label)
          standalone_path.write_text(standalone, encoding="utf-8")

          fallback_path = Path("src/components/walkthrough/immersive-walkthrough.tsx")
          fallback = fallback_path.read_text(encoding="utf-8")
          replacements = [
              (
                  "Different causes · different bottlenecks",
                  "Redirect scheduled · users notified",
                  "React step-two prompt",
              ),
              (
                  "Before the fallback settles, invite a better proposal.",
                  "The $10 will be donated in 7 days.",
                  "React step-two heading",
              ),
              (
                  "The Republican&apos;s $10 will go to environmental protection in 7 days unless a trade\n              she values more is accepted and completed.",
                  "Moral Trade notifies users that the Republican environmentalist&apos;s $10 is scheduled\n              to go to an environmental protection organization. They can propose a moral trade she\n              judges an even better use of the same $10; otherwise, the donation proceeds automatically.",
                  "React notification explanation",
              ),
              ("Fallback donation", "Scheduled redirect", "React scheduled redirect label"),
              (
                  "Useful, but no exchange.",
                  "Automatically donated if no better accepted trade is completed.",
                  "React scheduled redirect note",
              ),
              ("One-to-one trade", "One-to-one proposal", "React one-to-one label"),
              ("Group-buy moral trade", "Group-buy proposal", "React group-buy label"),
              (
                  "Notify potential coalition members",
                  "See a notified user start a coalition",
                  "React step-two action",
              ),
              (
                  "7-day better-match window",
                  "Platform notification · 7 days remaining",
                  "React notification prompt",
              ),
              (
                  "One member finds 99 close matches.",
                  "A notified user finds 99 close matches.",
                  "React notified-user heading",
              ),
              (
                  "Moral Trade searches for people whose priorities are as similar as possible and\n                whose small actions can add up.",
                  "She uses Moral Trade to find 99 users whose priorities are as similar as possible and\n                whose small actions can add up.",
                  "React notified-user explanation",
              ),
          ]
          for old, new, label in replacements:
              fallback = replace_once(fallback, old, new, label)
          fallback_path.write_text(fallback, encoding="utf-8")

          browser_path = Path("tests/walkthrough.spec.ts")
          browser = browser_path.read_text(encoding="utf-8")
          browser = replace_once(
              browser,
              '''  await expect(page.getByText("1 × 10 weeks")).toBeVisible();
          await page.getByRole("button", { name: "Notify potential coalition members" }).click();

          await expect(page.getByRole("heading", { name: "One member finds 99 close matches." })).toBeVisible();''',
              '''  await expect(page.getByText("1 × 10 weeks")).toBeVisible();
          await expect(
            page.getByRole("heading", { name: "The $10 will be donated in 7 days." }),
          ).toBeVisible();
          await expect(page.getByText(/Moral Trade notifies users/)).toBeVisible();
          await page.getByRole("button", { name: "See a notified user start a coalition" }).click();

          await expect(
            page.getByRole("heading", { name: "A notified user finds 99 close matches." }),
          ).toBeVisible();''',
              "browser notification flow",
          )
          browser_path.write_text(browser, encoding="utf-8")

          contract_path = Path("src/walkthrough-donation-redirect-group-buying.test.ts")
          contract = contract_path.read_text(encoding="utf-8")
          contract = replace_once(
              contract,
              "    assert.match(source, /One member finds 99 close matches/);",
              '''    assert.match(source, /Redirect scheduled · users notified/);
              assert.match(source, /The \\$10 will be donated in 7 days/);
              assert.match(source, /Moral Trade notifies users/);
              assert.match(source, /See a notified user start a coalition/);
              assert.match(source, /A notified user finds 99 close matches/);
              assert.doesNotMatch(source, /invite a better proposal|Notify potential coalition members/);''',
              "source contract notification semantics",
          )
          contract_path.write_text(contract, encoding="utf-8")

          print("Corrected Donation Redirect notification semantics in both implementations and tests.")
          PY

      - name: Install dependencies
        run: npm ci

      - name: Run focused source and first-visit regressions
        run: >-
          node --import tsx --test
          src/walkthrough-donation-redirect-group-buying.test.ts
          src/walkthrough-production-shell.test.ts
          src/proxy.test.ts

      - name: Lint the changed TypeScript and TSX surface
        run: >-
          npx eslint
          src/components/walkthrough/immersive-walkthrough.tsx
          src/walkthrough-donation-redirect-group-buying.test.ts
          tests/walkthrough.spec.ts

      - name: Build the corrected candidate
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run the complete walkthrough browser suite
        run: npx playwright test tests/walkthrough.spec.ts --reporter=line

      - name: Check whitespace
        run: git diff --check

      - name: Start local app for review render
        shell: bash
        run: |
          npm run dev -- -H 127.0.0.1 -p 3210 > /tmp/moraltrade-notification-render.log 2>&1 &
          echo $! > /tmp/moraltrade-notification-render.pid
          for attempt in $(seq 1 120); do
            if curl --silent --fail http://127.0.0.1:3210/walkthrough >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/moraltrade-notification-render.log
          exit 1

      - name: Render the corrected notification screen
        shell: bash
        run: |
          mkdir -p walkthrough-notification-render
          node --input-type=module <<'NODE'
          import { chromium } from "@playwright/test";

          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1440, height: 900 } });
          await page.goto("http://127.0.0.1:3210/walkthrough", { waitUntil: "domcontentloaded" });
          await page.getByRole("heading", { name: "What do you value?" }).waitFor();
          await page.getByRole("tab", { name: /Redirect/i }).click();
          await page.getByRole("button", { name: "Redirect the matched $20" }).click();
          await page.getByRole("button", { name: "See how one $10 can go further" }).click();
          await page.getByRole("heading", { name: "The $10 will be donated in 7 days." }).waitFor();
          await page.screenshot({
            path: "walkthrough-notification-render/corrected-donation-redirect-notification.png",
            fullPage: true,
            animations: "disabled",
          });
          await browser.close();
          NODE

      - name: Upload corrected render
        uses: actions/upload-artifact@v4
        with:
          name: corrected-donation-redirect-notification-render
          path: walkthrough-notification-render
          if-no-files-found: error
          retention-days: 7

      - name: Commit only the corrected product and test files
        shell: bash
        run: |
          rm -rf walkthrough-notification-render
          rm .github/workflows/correct-donation-redirect-notification-semantics.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Clarify Donation Redirect notifications and user proposals"
          git push origin HEAD
