name: Diagnose Compact outflow ledger DB

on:
  push:
    branches:
      - feature/compact-authoritative-outflow-ledger-v1-20260816
    paths:
      - .github/workflows/diagnose-compact-outflow-ledger-db.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
      - name: Add bounded SQL diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('supabase/tests/compact_authoritative_outflow_ledger_core.sql')
          source = path.read_text(encoding='utf-8')
          if '\\set VERBOSITY verbose' not in source:
              source = source.replace('\\set ON_ERROR_STOP on\n', '\\set ON_ERROR_STOP on\n\\set VERBOSITY verbose\n\\echo ledger-core:start\n', 1)
          marker = "  ('6b000000-0000-4000-8000-000000000005','00000000-0000-0000-8000-000000000000','authenticated','authenticated','ledger-prod@example.test','',now(),'{}','{}','','','','','',false,false,now(),now());\n"
          if '\\echo ledger-core:auth-users-inserted' not in source:
              source = source.replace(marker, marker + '\\echo ledger-core:auth-users-inserted\n', 1)
          profile_marker = "  ('6b000000-0000-4000-8000-000000000005','ledger-prod@example.test','Ledger Prod','','','ledger-prod','individual',true,true);\n"
          if '\\echo ledger-core:profiles-inserted' not in source:
              source = source.replace(profile_marker, profile_marker + '\\echo ledger-core:profiles-inserted\n', 1)
          path.write_text(source, encoding='utf-8')
          PY
          git diff --check
      - name: Commit diagnostic fixture markers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/tests/compact_authoritative_outflow_ledger_core.sql
          git commit -m "test: expose Compact outflow fixture failure location"
          git push origin "HEAD:${GITHUB_REF_NAME}"
