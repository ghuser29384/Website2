name: PR 727 Create production UAT v2

on:
  push:
    branches:
      - ops/pr727-create-production-uat-v2-20260817
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pr727-create-production-uat-v2
  cancel-in-progress: false

env:
  CONTROLLER_BRANCH: ops/pr727-create-production-uat-v2-20260817
  CONTROLLER_BASE_SHA: c2d7be6a895f1bb8c9ced1b257eb8b4381d50ac3
  EXPECTED_PRODUCTION_SHA: fd5588fc4ae7f2fed44d6b0d1ca68f24ce1b86ab
  EXPECTED_DEPLOYMENT_ID: dpl_5uNGHmgrNDjraHVRukXyNPeGRgEk
  EXPECTED_DEPLOYMENT_URL: https://moraltrade-site-6vbxdlg7e-ellen-s.vercel.app
  EXPECTED_DEPLOYMENT_HOST: moraltrade-site-6vbxdlg7e-ellen-s.vercel.app
  EXPECTED_SUPABASE_REF: jnpoxvalyjtdghnperyu
  CANONICAL_ORIGIN: https://www.moraltrade.org
  APEX_ORIGIN: https://moraltrade.org
  CANONICAL_APEX_DOMAIN: moraltrade.org
  CANONICAL_WWW_DOMAIN: www.moraltrade.org
  VERCEL_ORG_ID: team_ySu6sF3Uho1E1GnJtCQPVEuJ
  VERCEL_PROJECT_ID: prj_Em3j7Uj7RatX2R1ZYhla3XSHRde7
  VERCEL_CLI_VERSION: 50.38.1
  OUTPUT_DIR: pr727-create-production-uat-v2

jobs:
  canonical-production-uat:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Check out the exact one-use controller
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Guard repository, release ancestry, and controller-only scope
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'ghuser29384/Website2'
          test "$GITHUB_REF_NAME" = "$CONTROLLER_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git cat-file -e "${CONTROLLER_BASE_SHA}^{commit}"
          git cat-file -e "${EXPECTED_PRODUCTION_SHA}^{commit}"
          git merge-base --is-ancestor "$EXPECTED_PRODUCTION_SHA" "$CONTROLLER_BASE_SHA"
          git merge-base --is-ancestor "$CONTROLLER_BASE_SHA" "$GITHUB_SHA"
          git diff --check "$CONTROLLER_BASE_SHA" "$GITHUB_SHA"
          git diff --name-only "$CONTROLLER_BASE_SHA" "$GITHUB_SHA" | sort > controller-files.txt
          cat > expected-controller-files.txt <<'FILES'
          .github/scripts/pr727-create-production-uat.mjs
          .github/workflows/pr727-create-production-uat-v2.yml
          .github/workflows/pr727-create-production-uat.yml
          FILES
          diff -u expected-controller-files.txt controller-files.txt
          test -z "$(git status --porcelain --untracked-files=no)"
          mkdir -p "$OUTPUT_DIR/screenshots"
          {
            printf 'controller_commit=%s\n' "$GITHUB_SHA"
            printf 'controller_tree=%s\n' "$(git rev-parse HEAD^{tree})"
            printf 'controller_base=%s\n' "$CONTROLLER_BASE_SHA"
            printf 'production_commit=%s\n' "$EXPECTED_PRODUCTION_SHA"
          } | tee "$OUTPUT_DIR/controller-scope.txt"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies and Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium
          node --check .github/scripts/pr727-create-production-uat.mjs
          ruby -e "require 'yaml'; abort('invalid workflow YAML') unless YAML.parse_file('.github/workflows/pr727-create-production-uat-v2.yml')"

      - name: Pull exact production service credential without sourcing unrelated values
        id: env_pull
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          mkdir -p .vercel "$OUTPUT_DIR"
          printf '{"orgId":"%s","projectId":"%s"}\n' \
            "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          npx --yes "vercel@${VERCEL_CLI_VERSION}" pull \
            --yes \
            --environment=production \
            --token="$VERCEL_TOKEN" \
            > "$RUNNER_TEMP/pr727-vercel-pull.log" 2>&1
          test -s .vercel/.env.production.local

          RUNNER_TEMP="$RUNNER_TEMP" node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const envText = fs.readFileSync('.vercel/.env.production.local', 'utf8');
          const configText = fs.readFileSync('src/lib/supabase/config.ts', 'utf8');
          const serviceLine = envText
            .split(/\r?\n/)
            .find((line) => line.startsWith('SUPABASE_SERVICE_ROLE_KEY='));
          if (!serviceLine) throw new Error('Production pull omitted SUPABASE_SERVICE_ROLE_KEY.');

          const decodeEnvValue = (rawValue) => {
            const raw = rawValue.trim();
            if (raw.startsWith('"') && raw.endsWith('"')) return JSON.parse(raw);
            if (raw.startsWith("'") && raw.endsWith("'")) {
              return raw.slice(1, -1).replace(/'\\''/g, "'").replace(/\\\\/g, '\\');
            }
            return raw;
          };

          const serviceRoleKey = decodeEnvValue(
            serviceLine.slice('SUPABASE_SERVICE_ROLE_KEY='.length),
          );
          const url = configText.match(
            /const DEFAULT_PUBLIC_SUPABASE_URL = "([^"]+)";/,
          )?.[1];
          const publishableKey = configText.match(
            /const DEFAULT_PUBLIC_SUPABASE_PUBLISHABLE_KEY =\s*"([^"]+)";/,
          )?.[1];
          if (!url || !publishableKey || !serviceRoleKey) {
            throw new Error('Could not resolve the exact production Supabase values.');
          }
          if (/\r|\n/.test(serviceRoleKey)) {
            throw new Error('Production service credential contained an unexpected newline.');
          }
          const encode = (value) => Buffer.from(value, 'utf8').toString('base64');
          const output = [
            `SUPABASE_URL_B64=${encode(url)}`,
            `SUPABASE_PUBLISHABLE_KEY_B64=${encode(publishableKey)}`,
            `SUPABASE_SERVICE_ROLE_KEY_B64=${encode(serviceRoleKey)}`,
            '',
          ].join('\n');
          fs.writeFileSync(
            path.join(process.env.RUNNER_TEMP, 'pr727-production-values.b64'),
            output,
            { mode: 0o600 },
          );
          NODE

          source "$RUNNER_TEMP/pr727-production-values.b64"
          supabase_url="$(printf '%s' "$SUPABASE_URL_B64" | base64 --decode)"
          public_key="$(printf '%s' "$SUPABASE_PUBLISHABLE_KEY_B64" | base64 --decode)"
          service_role="$(printf '%s' "$SUPABASE_SERVICE_ROLE_KEY_B64" | base64 --decode)"
          test -n "$supabase_url"
          test -n "$public_key"
          test -n "$service_role"
          observed_ref="$(SUPABASE_URL="$supabase_url" python3 - <<'PY'
          import os
          from urllib.parse import urlparse
          hostname = urlparse(os.environ['SUPABASE_URL']).hostname or ''
          print(hostname.split('.')[0])
          PY
          )"
          test "$observed_ref" = "$EXPECTED_SUPABASE_REF"
          echo "::add-mask::$public_key"
          echo "::add-mask::$service_role"
          umask 077
          {
            printf 'export NEXT_PUBLIC_SUPABASE_URL=%q\n' "$supabase_url"
            printf 'export NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=%q\n' "$public_key"
            printf 'export SUPABASE_SERVICE_ROLE_KEY=%q\n' "$service_role"
          } > "$RUNNER_TEMP/pr727-production-secrets.env"

          rm -f \
            .vercel/.env.production.local \
            .vercel/.env.local \
            "$RUNNER_TEMP/pr727-production-values.b64" \
            "$RUNNER_TEMP/pr727-vercel-pull.log"
          unset SUPABASE_URL_B64 SUPABASE_PUBLISHABLE_KEY_B64 \
            SUPABASE_SERVICE_ROLE_KEY_B64 supabase_url public_key service_role

          jq -n \
            --arg projectId "$VERCEL_PROJECT_ID" \
            --arg supabaseRef "$observed_ref" \
            --arg pulledAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '
              {
                projectId:$projectId,
                environment:"production",
                supabaseRef:$supabaseRef,
                publicConfigurationSource:"checked-in production defaults",
                serviceCredentialSource:"exact Vercel production pull",
                serviceCredentialPresent:true,
                pulledAt:$pulledAt,
                secretsPersistedToArtifact:false
              }' > "$OUTPUT_DIR/environment-summary.json"
          echo 'exit_code=0' >> "$GITHUB_OUTPUT"

      - name: Verify exact deployment and both canonical aliases before UAT
        id: alias_pre
        shell: bash
        run: |
          set -euo pipefail
          detail_raw="$RUNNER_TEMP/pr727-deployment-before.json"
          curl -fsS \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            "https://api.vercel.com/v13/deployments/${EXPECTED_DEPLOYMENT_ID}?teamId=${VERCEL_ORG_ID}" \
            > "$detail_raw"
          jq -e \
            --arg id "$EXPECTED_DEPLOYMENT_ID" \
            --arg host "$EXPECTED_DEPLOYMENT_HOST" \
            --arg project "$VERCEL_PROJECT_ID" \
            --arg sha "$EXPECTED_PRODUCTION_SHA" '
              ((.id // .uid) == $id)
              and (.url == $host)
              and ((.projectId // .project.id // "") == $project)
              and ((.readyState // .state // "") == "READY")
              and (.target == "production")
              and ((.aliasError // null) == null)
              and (.meta.githubCommitOrg == "ghuser29384")
              and (.meta.githubCommitRepo == "Website2")
              and (.meta.githubCommitSha == $sha)
            ' "$detail_raw" >/dev/null
          jq '{
            id:(.id // .uid),
            url,
            projectId:(.projectId // .project.id),
            readyState:(.readyState // .state),
            target,
            aliasError:(.aliasError // null),
            githubCommitSha:.meta.githubCommitSha
          }' "$detail_raw" > "$OUTPUT_DIR/deployment-before.json"

          mkdir -p "$OUTPUT_DIR/aliases-before"
          for alias_name in "$CANONICAL_APEX_DOMAIN" "$CANONICAL_WWW_DOMAIN"; do
            alias_key="${alias_name//./-}"
            alias_raw="$RUNNER_TEMP/pr727-alias-before-${alias_key}.json"
            alias_out="$OUTPUT_DIR/aliases-before/${alias_key}.json"
            curl -fsS \
              -H "Authorization: Bearer ${VERCEL_TOKEN}" \
              "https://api.vercel.com/v4/aliases/${alias_name}?projectId=${VERCEL_PROJECT_ID}&teamId=${VERCEL_ORG_ID}" \
              > "$alias_raw"
            jq -e \
              --arg alias "$alias_name" \
              --arg project "$VERCEL_PROJECT_ID" \
              --arg deployment "$EXPECTED_DEPLOYMENT_ID" '
                (.alias == $alias)
                and (.projectId == $project)
                and ((.deploymentId // .deployment.id // .deployment.uid // "") == $deployment)
              ' "$alias_raw" >/dev/null
            jq '{
              alias,
              projectId,
              deploymentId:(.deploymentId // .deployment.id // .deployment.uid)
            }' "$alias_raw" > "$alias_out"
          done

          : > "$OUTPUT_DIR/http-before.txt"
          for origin in "$APEX_ORIGIN" "$CANONICAL_ORIGIN"; do
            result="$RUNNER_TEMP/pr727-http-before.txt"
            printf 'requested=%s\n' "${origin}/trades/new" > "$result"
            curl -sS -L --max-redirs 5 --max-time 60 \
              -o /dev/null \
              -w 'status=%{http_code}\neffective=%{url_effective}\nredirects=%{num_redirects}\n' \
              "${origin}/trades/new" >> "$result"
            grep -Fxq 'status=200' "$result"
            redirects="$(sed -n 's/^redirects=//p' "$result")"
            test "$redirects" -le 5
            cat "$result" >> "$OUTPUT_DIR/http-before.txt"
            printf '\n' >> "$OUTPUT_DIR/http-before.txt"
          done
          echo 'exit_code=0' >> "$GITHUB_OUTPUT"

      - name: Create one exact run-owned production Auth fixture
        id: fixture
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/pr727-production-secrets.env"
          suffix="$(openssl rand -hex 6)"
          qa_email="pr727-create-uat-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${suffix}@qa.moraltrade.invalid"
          qa_password="$(openssl rand -base64 36 | tr -d '\n')"
          qa_run_id="${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
          display_name="PR727 Create production UAT ${qa_run_id}"
          echo "::add-mask::$qa_password"
          umask 077
          printf '%s' "$qa_password" > "$RUNNER_TEMP/pr727-qa-password"
          printf '%s' "$qa_email" > "$RUNNER_TEMP/pr727-qa-email"
          printf '%s' "$qa_run_id" > "$RUNNER_TEMP/pr727-qa-run-id"

          request_body="$(jq -nc \
            --arg email "$qa_email" \
            --arg password "$qa_password" \
            --arg displayName "$display_name" \
            --arg runId "$qa_run_id" '
              {
                email:$email,
                password:$password,
                email_confirm:true,
                user_metadata:{
                  display_name:$displayName,
                  full_name:$displayName,
                  qa_scope:"pr727_create_production_uat",
                  qa_run_id:$runId
                }
              }')"
          auth_raw="$RUNNER_TEMP/pr727-auth-user-created.json"
          status="$(curl -sS \
            -X POST \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H 'Content-Type: application/json' \
            -o "$auth_raw" \
            -w '%{http_code}' \
            --data "$request_body" \
            "${NEXT_PUBLIC_SUPABASE_URL}/auth/v1/admin/users")"
          unset request_body qa_password
          test "$status" = '200' -o "$status" = '201'
          qa_user_id="$(jq -r '.id // empty' "$auth_raw")"
          test -n "$qa_user_id"
          printf '%s' "$qa_user_id" > "$RUNNER_TEMP/pr727-qa-user-id"
          jq -e \
            --arg id "$qa_user_id" \
            --arg email "$qa_email" \
            --arg run "$qa_run_id" '
              (.id == $id)
              and ((.email // "") | ascii_downcase == ($email | ascii_downcase))
              and (.email_confirmed_at != null)
              and ((.user_metadata // .raw_user_meta_data).qa_scope == "pr727_create_production_uat")
              and ((.user_metadata // .raw_user_meta_data).qa_run_id == $run)
            ' "$auth_raw" >/dev/null

          profile_raw="$RUNNER_TEMP/pr727-profile-created.json"
          profile_count=-1
          for attempt in $(seq 1 20); do
            curl -fsS \
              -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
              "${NEXT_PUBLIC_SUPABASE_URL}/rest/v1/profiles?id=eq.${qa_user_id}&select=id,email,display_name" \
              > "$profile_raw"
            profile_count="$(jq 'length' "$profile_raw")"
            if [[ "$profile_count" = '0' || "$profile_count" = '1' ]]; then
              break
            fi
            sleep 1
          done
          test "$profile_count" = '0' -o "$profile_count" = '1'
          if [[ "$profile_count" = '1' ]]; then
            jq -e --arg id "$qa_user_id" '.[0].id == $id' "$profile_raw" >/dev/null
          fi

          echo "PR727_QA_USER_ID=$qa_user_id" >> "$GITHUB_ENV"
          echo "PR727_QA_EMAIL=$qa_email" >> "$GITHUB_ENV"
          echo "PR727_QA_RUN_ID=$qa_run_id" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_URL=$NEXT_PUBLIC_SUPABASE_URL" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" >> "$GITHUB_ENV"
          echo "PR727_OUTPUT_DIR=$OUTPUT_DIR" >> "$GITHUB_ENV"

          jq -n \
            --arg userId "$qa_user_id" \
            --arg email "$qa_email" \
            --arg runId "$qa_run_id" \
            --argjson profileCreated "$([[ "$profile_count" = '1' ]] && echo true || echo false)" \
            --arg createdAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '
              {
                userId:$userId,
                email:$email,
                qaScope:"pr727_create_production_uat",
                qaRunId:$runId,
                profileCreated:$profileCreated,
                createdAt:$createdAt
              }' > "$OUTPUT_DIR/fixture-summary.json"
          echo 'exit_code=0' >> "$GITHUB_OUTPUT"

      - name: Run authenticated desktop and mobile canonical Create UAT
        id: uat
        shell: bash
        run: |
          set -uo pipefail
          source "$RUNNER_TEMP/pr727-production-secrets.env"
          export PR727_QA_PASSWORD="$(cat "$RUNNER_TEMP/pr727-qa-password")"
          export PR727_CANONICAL_ORIGIN="$CANONICAL_ORIGIN"
          export PR727_EXPECTED_SHA="$EXPECTED_PRODUCTION_SHA"
          export PR727_EXPECTED_DEPLOYMENT_ID="$EXPECTED_DEPLOYMENT_ID"
          export PR727_EXPECTED_DEPLOYMENT_URL="$EXPECTED_DEPLOYMENT_URL"
          export PR727_EXPECTED_SUPABASE_REF="$EXPECTED_SUPABASE_REF"
          echo "::add-mask::$PR727_QA_PASSWORD"
          date -u +%Y-%m-%dT%H:%M:%SZ > "$OUTPUT_DIR/uat-step-started-at.txt"
          set +e
          node .github/scripts/pr727-create-production-uat.mjs \
            > >(tee "$OUTPUT_DIR/browser.log") \
            2> >(tee "$OUTPUT_DIR/browser.stderr.log" >&2)
          code=$?
          set -e
          date -u +%Y-%m-%dT%H:%M:%SZ > "$OUTPUT_DIR/uat-step-completed-at.txt"
          printf '%s\n' "$code" > "$OUTPUT_DIR/browser-exit-code.txt"
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Reverify exact deployment and canonical aliases after UAT
        id: alias_post
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          code=0
          mkdir -p "$OUTPUT_DIR/aliases-after"
          detail_raw="$RUNNER_TEMP/pr727-deployment-after.json"
          set +e
          curl -fsS \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            "https://api.vercel.com/v13/deployments/${EXPECTED_DEPLOYMENT_ID}?teamId=${VERCEL_ORG_ID}" \
            > "$detail_raw"
          curl_code=$?
          set -e
          if [[ "$curl_code" -ne 0 ]] || ! jq -e \
            --arg id "$EXPECTED_DEPLOYMENT_ID" \
            --arg project "$VERCEL_PROJECT_ID" \
            --arg sha "$EXPECTED_PRODUCTION_SHA" '
              ((.id // .uid) == $id)
              and ((.projectId // .project.id // "") == $project)
              and ((.readyState // .state // "") == "READY")
              and (.target == "production")
              and (.meta.githubCommitSha == $sha)
            ' "$detail_raw" >/dev/null; then
            code=80
          else
            jq '{
              id:(.id // .uid),
              url,
              projectId:(.projectId // .project.id),
              readyState:(.readyState // .state),
              target,
              aliasError:(.aliasError // null),
              githubCommitSha:.meta.githubCommitSha
            }' "$detail_raw" > "$OUTPUT_DIR/deployment-after.json"
          fi

          if [[ "$code" -eq 0 ]]; then
            for alias_name in "$CANONICAL_APEX_DOMAIN" "$CANONICAL_WWW_DOMAIN"; do
              alias_key="${alias_name//./-}"
              alias_raw="$RUNNER_TEMP/pr727-alias-after-${alias_key}.json"
              alias_out="$OUTPUT_DIR/aliases-after/${alias_key}.json"
              set +e
              curl -fsS \
                -H "Authorization: Bearer ${VERCEL_TOKEN}" \
                "https://api.vercel.com/v4/aliases/${alias_name}?projectId=${VERCEL_PROJECT_ID}&teamId=${VERCEL_ORG_ID}" \
                > "$alias_raw"
              alias_curl=$?
              set -e
              if [[ "$alias_curl" -ne 0 ]] || ! jq -e \
                --arg alias "$alias_name" \
                --arg project "$VERCEL_PROJECT_ID" \
                --arg deployment "$EXPECTED_DEPLOYMENT_ID" '
                  (.alias == $alias)
                  and (.projectId == $project)
                  and ((.deploymentId // .deployment.id // .deployment.uid // "") == $deployment)
                ' "$alias_raw" >/dev/null; then
                code=81
                break
              fi
              jq '{
                alias,
                projectId,
                deploymentId:(.deploymentId // .deployment.id // .deployment.uid)
              }' "$alias_raw" > "$alias_out"
            done
          fi
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Delete exactly the run-owned production Auth fixture
        id: cleanup
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          code=0
          deleted=false
          auth_absent=false
          profile_absent=false
          user_id=''
          email=''
          run_id=''
          [[ -s "$RUNNER_TEMP/pr727-qa-user-id" ]] && user_id="$(cat "$RUNNER_TEMP/pr727-qa-user-id")"
          [[ -s "$RUNNER_TEMP/pr727-qa-email" ]] && email="$(cat "$RUNNER_TEMP/pr727-qa-email")"
          [[ -s "$RUNNER_TEMP/pr727-qa-run-id" ]] && run_id="$(cat "$RUNNER_TEMP/pr727-qa-run-id")"

          if [[ -s "$RUNNER_TEMP/pr727-production-secrets.env" && -n "$user_id" ]]; then
            source "$RUNNER_TEMP/pr727-production-secrets.env"
            inspect_raw="$RUNNER_TEMP/pr727-user-before-delete.json"
            set +e
            inspect_status="$(curl -sS \
              -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
              -o "$inspect_raw" \
              -w '%{http_code}' \
              "${NEXT_PUBLIC_SUPABASE_URL}/auth/v1/admin/users/${user_id}")"
            inspect_curl=$?
            set -e
            if [[ "$inspect_curl" -ne 0 || "$inspect_status" != '200' ]] \
              || ! jq -e \
                --arg id "$user_id" \
                --arg email "$email" \
                --arg run "$run_id" '
                  (.id == $id)
                  and ((.email // "") | ascii_downcase == ($email | ascii_downcase))
                  and ((.user_metadata // .raw_user_meta_data).qa_scope == "pr727_create_production_uat")
                  and ((.user_metadata // .raw_user_meta_data).qa_run_id == $run)
                ' "$inspect_raw" >/dev/null; then
              code=82
            else
              set +e
              delete_status="$(curl -sS \
                -X DELETE \
                -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
                -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
                -o "$RUNNER_TEMP/pr727-user-delete.json" \
                -w '%{http_code}' \
                "${NEXT_PUBLIC_SUPABASE_URL}/auth/v1/admin/users/${user_id}")"
              delete_curl=$?
              set -e
              if [[ "$delete_curl" -ne 0 || ( "$delete_status" != '200' && "$delete_status" != '204' ) ]]; then
                code=83
              else
                deleted=true
              fi
            fi

            if [[ "$code" -eq 0 ]]; then
              for attempt in $(seq 1 30); do
                set +e
                user_status="$(curl -sS \
                  -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
                  -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
                  -o "$RUNNER_TEMP/pr727-user-after-delete.json" \
                  -w '%{http_code}' \
                  "${NEXT_PUBLIC_SUPABASE_URL}/auth/v1/admin/users/${user_id}")"
                user_curl=$?
                set -e
                if [[ "$user_curl" -eq 0 && "$user_status" = '404' ]]; then
                  auth_absent=true
                  break
                fi
                sleep 1
              done
              [[ "$auth_absent" == 'true' ]] || code=84
            fi

            if [[ "$code" -eq 0 ]]; then
              for attempt in $(seq 1 30); do
                curl -fsS \
                  -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
                  -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
                  "${NEXT_PUBLIC_SUPABASE_URL}/rest/v1/profiles?id=eq.${user_id}&select=id" \
                  > "$RUNNER_TEMP/pr727-profile-after-delete.json"
                if jq -e 'length == 0' "$RUNNER_TEMP/pr727-profile-after-delete.json" >/dev/null; then
                  profile_absent=true
                  break
                fi
                sleep 1
              done
              [[ "$profile_absent" == 'true' ]] || code=85
            fi
          elif [[ -n "$user_id" ]]; then
            code=86
          else
            auth_absent=true
            profile_absent=true
          fi

          jq -n \
            --arg userId "$user_id" \
            --arg email "$email" \
            --argjson deleted "$deleted" \
            --argjson authAbsent "$auth_absent" \
            --argjson profileAbsent "$profile_absent" \
            --argjson exitCode "$code" \
            --arg completedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '
              {
                userId:(if $userId == "" then null else $userId end),
                email:(if $email == "" then null else $email end),
                deleted:$deleted,
                authUserAbsent:$authAbsent,
                profileAbsent:$profileAbsent,
                exitCode:$exitCode,
                completedAt:$completedAt
              }' > "$OUTPUT_DIR/cleanup-summary.json"
          rm -f \
            "$RUNNER_TEMP/pr727-qa-password" \
            "$RUNNER_TEMP/pr727-auth-user-created.json" \
            "$RUNNER_TEMP/pr727-profile-created.json" \
            "$RUNNER_TEMP/pr727-user-before-delete.json" \
            "$RUNNER_TEMP/pr727-user-delete.json" \
            "$RUNNER_TEMP/pr727-user-after-delete.json" \
            "$RUNNER_TEMP/pr727-profile-after-delete.json"
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Verify complete evidence and scrub credential material
        id: evidence
        if: always()
        shell: bash
        run: |
          set +e
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const dir = process.env.OUTPUT_DIR;
          const readJson = (name) => JSON.parse(fs.readFileSync(path.join(dir, name), 'utf8'));
          const readExit = (name) => Number.parseInt(
            fs.readFileSync(path.join(dir, name), 'utf8').trim(),
            10,
          );
          const assert = (condition, message) => {
            if (!condition) throw new Error(message);
          };
          const emptyDiagnostics = (diagnostics) => diagnostics &&
            diagnostics.consoleErrors.length === 0 &&
            diagnostics.pageErrors.length === 0 &&
            diagnostics.requestFailures.length === 0 &&
            diagnostics.httpErrors.length === 0 &&
            diagnostics.mutationRequests.length === 0 &&
            diagnostics.hydrationErrors.length === 0;

          assert(readExit('browser-exit-code.txt') === 0, 'Browser UAT failed.');
          const result = readJson('result.json');
          const cleanup = readJson('cleanup-summary.json');
          assert(result.status === 'passed', 'Result status was not passed.');
          assert(result.expectedSha === process.env.EXPECTED_PRODUCTION_SHA, 'Production SHA mismatch.');
          assert(result.expectedDeploymentId === process.env.EXPECTED_DEPLOYMENT_ID, 'Deployment ID mismatch.');
          assert(result.expectedDeploymentUrl === process.env.EXPECTED_DEPLOYMENT_URL, 'Deployment URL mismatch.');
          assert(result.canonicalOrigin === process.env.CANONICAL_ORIGIN, 'Canonical origin mismatch.');
          assert(result.desktop.viewport.width === 1644 && result.desktop.viewport.height === 900, 'Desktop viewport mismatch.');
          assert(result.mobile.viewport.width === 390 && result.mobile.viewport.height === 844, 'Mobile viewport mismatch.');
          assert(result.desktop.overflow.frame <= 1 && result.desktop.overflow.page <= 1, 'Desktop overflow proof failed.');
          assert(result.mobile.overflow.frame <= 1 && result.mobile.overflow.page <= 1, 'Mobile overflow proof failed.');
          assert(emptyDiagnostics(result.desktop.diagnostics), 'Desktop diagnostics were not empty.');
          assert(emptyDiagnostics(result.mobile.diagnostics), 'Mobile diagnostics were not empty.');
          assert(result.noBrowserMutationRequests === true, 'A browser mutation request occurred.');
          assert(result.desktop.autocomplete.placement === 'above', 'Desktop autocomplete did not flip above.');
          assert(result.mobile.autocomplete.position === 'static', 'Mobile autocomplete did not stay in flow.');
          assert(result.desktop.requestSurface.requestPanelStyle.tagName === 'DIV', 'Request panel was not a DIV.');
          assert(result.desktop.requestSurface.requestPanelStyle.backgroundColor === 'rgb(255, 253, 248)', 'Request panel background mismatch.');
          for (const ratio of Object.values(result.desktop.requestSurface.contrasts)) {
            assert(ratio >= 4.5, 'Desktop contrast below 4.5.');
          }
          for (const ratio of Object.values(result.mobile.requestSurface.contrasts)) {
            assert(ratio >= 4.5, 'Mobile contrast below 4.5.');
          }
          assert(result.desktop.keyboard.ratio >= 4.5 && result.mobile.keyboard.ratio >= 4.5, 'Selected-suggestion contrast below 4.5.');
          assert(cleanup.exitCode === 0 && cleanup.deleted === true, 'Run-owned Auth fixture was not deleted.');
          assert(cleanup.authUserAbsent === true && cleanup.profileAbsent === true, 'Run-owned Auth residue remained.');
          for (const name of ['desktop-request.png', 'desktop-autocomplete-above.png', 'mobile-request.png']) {
            const file = path.join(dir, 'screenshots', name);
            assert(fs.existsSync(file) && fs.statSync(file).size > 1000, `Missing screenshot ${name}.`);
          }

          const summary = {
            schemaVersion: 2,
            productionSha: result.expectedSha,
            deploymentId: result.expectedDeploymentId,
            deploymentUrl: result.expectedDeploymentUrl,
            canonicalAliases: ['moraltrade.org', 'www.moraltrade.org'],
            uat: {
              startedAt: result.startedAt,
              completedAt: result.completedAt,
              desktopViewport: result.desktop.viewport,
              mobileViewport: result.mobile.viewport,
              authenticated: true,
              noHorizontalOverflow: true,
              noBrowserDiagnostics: true,
              noBrowserMutationRequests: true,
              causeSpecificSuggestions: true,
              autocompleteBoundedAndResponsive: true,
              contrastMinimum: 4.5,
            },
            cleanup: {
              authUserDeleted: true,
              authUserAbsent: true,
              profileAbsent: true,
              productMutationRequestsObserved: 0,
            },
          };
          fs.writeFileSync(path.join(dir, 'summary.json'), `${JSON.stringify(summary, null, 2)}\n`);
          NODE
          evidence_code=$?

          sensitive_matches="$(grep -RIlE \
            --include='*.json' \
            --include='*.log' \
            --include='*.txt' \
            '"password"[[:space:]]*:|"access_token"[[:space:]]*:|"refresh_token"[[:space:]]*:|sb_secret_|SUPABASE_SERVICE_ROLE_KEY|VERCEL_TOKEN|PR727_QA_PASSWORD' \
            "$OUTPUT_DIR" controller-files.txt expected-controller-files.txt 2>/dev/null || true)"
          if [[ -n "$sensitive_matches" ]]; then
            printf 'Credential-like material detected in evidence files: %s\n' "$sensitive_matches" >&2
            evidence_code=87
          fi

          rm -f \
            "$RUNNER_TEMP/pr727-production-secrets.env" \
            "$RUNNER_TEMP/pr727-qa-email" \
            "$RUNNER_TEMP/pr727-qa-user-id" \
            "$RUNNER_TEMP/pr727-qa-run-id" \
            "$RUNNER_TEMP"/pr727-deployment-*.json \
            "$RUNNER_TEMP"/pr727-alias-*.json \
            "$RUNNER_TEMP"/pr727-http-before.txt
          rm -rf .vercel
          test -z "$(git status --porcelain --untracked-files=no)" || evidence_code=88
          printf '%s\n' "$evidence_code" > "$OUTPUT_DIR/evidence-exit-code.txt"
          echo "exit_code=$evidence_code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload immutable production-UAT evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr727-create-production-uat-v2-${{ github.run_id }}
          path: |
            controller-files.txt
            expected-controller-files.txt
            pr727-create-production-uat-v2/
          if-no-files-found: error
          retention-days: 30

      - name: Preserve the fail-closed conclusion
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.env_pull.outputs.exit_code || '255' }}" = '0'
          test "${{ steps.alias_pre.outputs.exit_code || '255' }}" = '0'
          test "${{ steps.fixture.outputs.exit_code || '255' }}" = '0'
          test "${{ steps.uat.outputs.exit_code || '255' }}" = '0'
          test "${{ steps.alias_post.outputs.exit_code || '255' }}" = '0'
          test "${{ steps.cleanup.outputs.exit_code || '255' }}" = '0'
          test "${{ steps.evidence.outputs.exit_code || '255' }}" = '0'

      - name: Delete the one-use controller branch after successful cleanup
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git push origin --delete "$CONTROLLER_BRANCH"
