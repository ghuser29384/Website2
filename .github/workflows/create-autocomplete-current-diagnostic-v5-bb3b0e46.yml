name: Create autocomplete current diagnostic v5 bb3b0e46

on:
  pull_request:
    paths:
      - ".github/workflows/create-autocomplete-current-diagnostic-v5-bb3b0e46.yml"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: create-autocomplete-current-diagnostic-v5-bb3b0e46
  cancel-in-progress: true

env:
  PRODUCT_SHA: bb3b0e4608b7282aecc9d1fe11b5cb310c409347
  CONTROLLER_BRANCH: qa/create-autocomplete-current-diagnostic-v5-bb3b0e46
  CONTROLLER_PATH: .github/workflows/create-autocomplete-current-diagnostic-v5-bb3b0e46.yml
  EVIDENCE_DIR: create-autocomplete-current-diagnostic-v5-bb3b0e46
  NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3210
  SITE_URL: http://127.0.0.1:3210
  PLAYWRIGHT_HTML_OPEN: never

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Guard immutable product and one-file scope
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test '${{ github.event.pull_request.head.ref }}' = "$CONTROLLER_BRANCH"
          test '${{ github.event.pull_request.base.sha }}' = "$PRODUCT_SHA"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)" = "$PRODUCT_SHA"
          test "$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/pulls/${{ github.event.pull_request.number }}/files?per_page=100" \
            --jq '.[].filename')" = "$CONTROLLER_PATH"

      - name: Check out immutable current product
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PRODUCT_SHA }}
          fetch-depth: 1

      - name: Prove checkout and source contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          test -f public/moral-trade-create/index.html
          test -f tests/exact-live-autocomplete.spec.ts
          mkdir -p "$EVIDENCE_DIR"
          printf '%s\n' "$PRODUCT_SHA" > "$EVIDENCE_DIR/product-sha.txt"
          grep -n -E 'requestActionInput|actionSuggestions|suggestion-option|Wild animal suffering|Read a 30-minute introduction|handleRequestKeydown|chooseSuggestion' \
            public/moral-trade-create/index.html > "$EVIDENCE_DIR/source-markers.txt"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies and Chromium
        shell: bash
        run: |
          set -o pipefail
          npm ci 2>&1 | tee "$EVIDENCE_DIR/npm-ci.log"
          npx playwright install --with-deps chromium 2>&1 | tee "$EVIDENCE_DIR/chromium.log"

      - name: Write current-flow diagnostic
        shell: bash
        run: |
          cat > tests/create-autocomplete-current-diagnostic-v5-bb3b0e46.spec.ts <<'TS'
          import { mkdir, writeFile } from "node:fs/promises";
          import path from "node:path";
          import { expect, test, type Frame, type Locator, type Page } from "@playwright/test";

          const dir = process.env.EVIDENCE_DIR!;
          test.setTimeout(90_000);

          type RuntimeLog = {
            console: string[];
            pageErrors: string[];
            failedRequests: string[];
          };

          function observeRuntime(page: Page): RuntimeLog {
            const log: RuntimeLog = { console: [], pageErrors: [], failedRequests: [] };
            page.on("console", (message) => {
              if (message.type() === "error" || message.type() === "warning") {
                log.console.push(`${message.type()}: ${message.text()}`);
              }
            });
            page.on("pageerror", (error) => log.pageErrors.push(error.stack || error.message));
            page.on("requestfailed", (request) => {
              log.failedRequests.push(`${request.method()} ${request.url()} :: ${request.failure()?.errorText || "unknown"}`);
            });
            return log;
          }

          async function reachActionStep(page: Page): Promise<{ frame: Frame; input: Locator; list: Locator }> {
            await page.goto("/moral-trade-live.html#trade", { waitUntil: "domcontentloaded" });
            await expect(page).toHaveURL(/\/trades\/new(?:[?#]|$)/, { timeout: 30_000 });
            await expect(page).toHaveTitle(/Moral Trade/i);

            const iframe = page.locator('iframe[title="Moral Trade Create"]');
            await expect(iframe).toBeVisible({ timeout: 30_000 });
            const frame = await (await iframe.elementHandle())?.contentFrame();
            if (!frame) throw new Error("Create iframe unavailable");

            const cause = frame.locator("button.cause-choice").filter({ hasText: "Wild animal suffering" });
            await expect(cause).toHaveCount(1);
            await cause.click();

            const requestHeading = frame.getByRole("heading", {
              name: "What do you want other people to do?",
            });
            await expect(requestHeading).toBeVisible({ timeout: 10_000 });

            const commitment = frame.locator("button.request-choice").filter({ hasText: "Commitment" });
            await expect(commitment).toHaveCount(1);
            await commitment.click();

            const input = frame.locator("#requestActionInput");
            const list = frame.locator("#actionSuggestions");
            await expect(input).toBeVisible({ timeout: 10_000 });
            await expect(input).toHaveAttribute("role", "combobox");
            await expect(input).toHaveAttribute("aria-autocomplete", "list");
            await expect(input).toHaveAttribute("aria-controls", "actionSuggestions");
            await expect(input).toHaveAttribute("aria-expanded", "false");
            await expect(input).toHaveAttribute("placeholder", "e.g. Not eat meat for one meal");
            await expect(list).toHaveAttribute("role", "listbox");
            await expect(list).toHaveAttribute("aria-label", "Suggested actions");

            return { frame, input, list };
          }

          async function collect(page: Page, frame: Frame, runtime: RuntimeLog) {
            const inner = await frame.evaluate(() => {
              const visible = (element: Element) => {
                const html = element as HTMLElement;
                const rect = html.getBoundingClientRect();
                const style = getComputedStyle(html);
                return style.display !== "none" && style.visibility !== "hidden" && Number(style.opacity) !== 0 && rect.width > 0 && rect.height > 0;
              };
              const summarize = (element: Element) => ({
                tag: element.tagName.toLowerCase(),
                text: (element.textContent ?? "").replace(/\s+/g, " ").trim().slice(0, 1200),
                value: element instanceof HTMLInputElement || element instanceof HTMLTextAreaElement ? element.value : null,
                visible: visible(element),
                attributes: Object.fromEntries([...element.attributes].map((attribute) => [attribute.name, attribute.value])),
                outerHTML: (element as HTMLElement).outerHTML.slice(0, 10000),
              });
              const input = document.querySelector("#requestActionInput");
              const list = document.querySelector("#actionSuggestions");
              return {
                documentTitle: document.title,
                heading: document.querySelector("#requestHeading")?.textContent?.trim() || null,
                input: input ? summarize(input) : null,
                list: list ? summarize(list) : null,
                visibleOptions: [...document.querySelectorAll('[role="option"]')].filter(visible).map(summarize),
                allOptions: [...document.querySelectorAll('[role="option"]')].map(summarize),
                legacyClauseCount: document.querySelectorAll(".clause").length,
                legacyTokenCount: document.querySelectorAll('.token[contenteditable="true"]').length,
                legacyOfferTypeCount: document.querySelectorAll("[data-mt-offer-type]").length,
                dimensions: {
                  innerWidth: window.innerWidth,
                  clientWidth: document.documentElement.clientWidth,
                  scrollWidth: document.documentElement.scrollWidth,
                },
              };
            });
            const outerDimensions = await page.evaluate(() => ({
              innerWidth: window.innerWidth,
              clientWidth: document.documentElement.clientWidth,
              scrollWidth: document.documentElement.scrollWidth,
            }));
            return { outerUrl: page.url(), outerTitle: await page.title(), outerDimensions, inner, runtime };
          }

          async function save(page: Page, frame: Frame, runtime: RuntimeLog, label: string) {
            await mkdir(dir, { recursive: true });
            const evidence = await collect(page, frame, runtime);
            await writeFile(path.join(dir, `${label}.json`), `${JSON.stringify(evidence, null, 2)}\n`);
            await page.screenshot({ path: path.join(dir, `${label}-page.png`), fullPage: true });
            await frame.locator("body").screenshot({ path: path.join(dir, `${label}-frame.png`) });
          }

          async function exercise(page: Page, prefix: string) {
            const runtime = observeRuntime(page);
            const { frame, input, list } = await reachActionStep(page);

            await expect(frame.locator(".clause")).toHaveCount(0);
            await expect(frame.locator('.token[contenteditable="true"]')).toHaveCount(0);
            await expect(frame.locator("[data-mt-offer-type]")).toHaveCount(0);
            await save(page, frame, runtime, `${prefix}-initial`);

            await input.fill("read");
            await expect(list).toBeVisible();
            await expect(input).toHaveAttribute("aria-expanded", "true");
            const readOptions = list.getByRole("option");
            expect(await readOptions.count()).toBeGreaterThanOrEqual(2);
            await expect(readOptions.first()).toContainText(
              "Read a 30-minute introduction to wild animal suffering",
            );
            await save(page, frame, runtime, `${prefix}-read-open`);

            await input.press("ArrowDown");
            await expect(readOptions.first()).toHaveAttribute("aria-selected", "true");
            await input.press("Enter");
            await expect(input).toHaveValue(
              "Read a 30-minute introduction to wild animal suffering",
            );
            await expect(input).toHaveAttribute("aria-expanded", "false");
            await expect(list).toBeHidden();
            await save(page, frame, runtime, `${prefix}-keyboard-selected`);

            await input.fill("spend");
            await expect(list).toBeVisible();
            await input.press("Escape");
            await expect(input).toHaveValue("spend");
            await expect(input).toHaveAttribute("aria-expanded", "false");
            await expect(list).toBeHidden();
            await save(page, frame, runtime, `${prefix}-escape-dismissed`);

            await input.fill("read");
            await expect(list).toBeVisible();
            await frame.locator("#requestHeading").click();
            await expect(input).toHaveValue("read");
            await expect(input).toHaveAttribute("aria-expanded", "false");
            await expect(list).toBeHidden();
            await save(page, frame, runtime, `${prefix}-outside-dismissed`);

            const dimensions = await frame.evaluate(() => ({
              innerWidth: window.innerWidth,
              clientWidth: document.documentElement.clientWidth,
              scrollWidth: document.documentElement.scrollWidth,
            }));
            expect(dimensions.clientWidth).toBe(dimensions.innerWidth);
            expect(dimensions.scrollWidth).toBeLessThanOrEqual(dimensions.innerWidth + 1);
          }

          test("desktop current action autocomplete", async ({ page }) => {
            await page.setViewportSize({ width: 1440, height: 1000 });
            await exercise(page, "desktop");
          });

          test("mobile current action autocomplete", async ({ page }) => {
            await page.setViewportSize({ width: 390, height: 844 });
            await exercise(page, "mobile");
          });
          TS
          npx playwright test tests/create-autocomplete-current-diagnostic-v5-bb3b0e46.spec.ts --list \
            > "$EVIDENCE_DIR/test-list.txt"

      - name: Run diagnostic
        shell: bash
        run: |
          set -o pipefail
          rm -rf .next
          npx playwright test tests/create-autocomplete-current-diagnostic-v5-bb3b0e46.spec.ts \
            --workers=1 --reporter=line 2>&1 | tee "$EVIDENCE_DIR/playwright.log"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: create-autocomplete-current-diagnostic-v5-bb3b0e46
          path: |
            create-autocomplete-current-diagnostic-v5-bb3b0e46
            test-results
          if-no-files-found: error
          retention-days: 14
