name: Observe PR 212 exact-head institutional QA

on:
  push:
    branches:
      - agent/pr212-final-status-20260731
    paths:
      - .github/workflows/pr212-exact-head-institutional-qa-observer.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_WORKFLOW: institutional-trade-qa.yml
      TARGET_BRANCH: feat/institutional-trade-system
      TARGET_HEAD: 6e4deac3530e8f0989b457d082e6efd11b2fa34e
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Poll exact institutional QA and persist terminal evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ops/pr212-exact-head-institutional-qa
          run_id=""
          status=""
          conclusion=""
          for attempt in $(seq 1 570); do
            gh run list --repo "$GITHUB_REPOSITORY" --workflow "$TARGET_WORKFLOW" --branch "$TARGET_BRANCH" --limit 60 --json databaseId,headSha,status,conclusion,createdAt,event,url > /tmp/runs.json
            run_id="$(jq -r --arg head "$TARGET_HEAD" '[.[] | select(.headSha == $head)] | sort_by(.createdAt) | reverse | .[0].databaseId // empty' /tmp/runs.json)"
            status="$(jq -r --arg head "$TARGET_HEAD" '[.[] | select(.headSha == $head)] | sort_by(.createdAt) | reverse | .[0].status // empty' /tmp/runs.json)"
            conclusion="$(jq -r --arg head "$TARGET_HEAD" '[.[] | select(.headSha == $head)] | sort_by(.createdAt) | reverse | .[0].conclusion // empty' /tmp/runs.json)"
            if [[ -n "$run_id" && "$status" == "completed" ]]; then break; fi
            sleep 10
          done

          if [[ -n "$run_id" ]]; then
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" > /tmp/run.json
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100" > /tmp/jobs.json
            gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --log-failed > /tmp/failed.log 2>&1 || true
          else
            printf '%s\n' '{}' > /tmp/run.json
            printf '%s\n' '{"jobs":[]}' > /tmp/jobs.json
            printf '%s\n' 'No exact-head institutional QA run found.' > /tmp/failed.log
          fi

          jq -n \
            --arg target_head "$TARGET_HEAD" \
            --arg run_id "$run_id" \
            --arg status "$status" \
            --arg conclusion "$conclusion" \
            --slurpfile runs /tmp/runs.json \
            --slurpfile run /tmp/run.json \
            --slurpfile jobs /tmp/jobs.json \
            '{target_head:$target_head,run_id:$run_id,status:$status,conclusion:$conclusion,runs:$runs[0],run:$run[0],jobs:$jobs[0].jobs}' \
            > ops/pr212-exact-head-institutional-qa/status.json
          tail -n 2000 /tmp/failed.log > ops/pr212-exact-head-institutional-qa/failed-log.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops/pr212-exact-head-institutional-qa
          git commit -m "Record PR 212 exact-head institutional QA"
          git push origin HEAD:agent/pr212-final-status-20260731

          [[ -n "$run_id" && "$status" == "completed" ]] || exit 1
