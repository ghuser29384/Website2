name: Apply failure bonus browser role selectors

on:
  pull_request:
    branches:
      - feature/mpgf-failure-bonus-success-premium-20260726
    paths:
      - ".github/failure-bonus-browser-role-selectors.patch"
      - ".github/workflows/apply-failure-bonus-browser-role-selectors.yml"

permissions:
  contents: write

jobs:
  apply-selectors:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'qa/failure-bonus-authenticated-browser-20260726'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact QA branch
        uses: actions/checkout@v4
        with:
          ref: qa/failure-bonus-authenticated-browser-20260726
          fetch-depth: 0

      - name: Verify exact source and patch applicability
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git hash-object .github/scripts/failure-bonus-authenticated-browser-qa.mjs)" = "00b0cd1e21efddabaffc2b8d23f786674637c36e"
          git apply --check --verbose .github/failure-bonus-browser-role-selectors.patch

      - name: Apply exact role selectors
        shell: bash
        run: |
          set -euxo pipefail
          git apply --verbose .github/failure-bonus-browser-role-selectors.patch
          test "$(git hash-object .github/scripts/failure-bonus-authenticated-browser-qa.mjs)" = "8fe9ee2dc0a8031bc26c3c136cc6137cf3934e7c"
          node --check .github/scripts/failure-bonus-authenticated-browser-qa.mjs

      - name: Remove temporary machinery and commit
        shell: bash
        run: |
          set -euxo pipefail
          rm -f .github/failure-bonus-browser-role-selectors.patch
          rm -f .github/workflows/apply-failure-bonus-browser-role-selectors.yml
          git add -A
          git diff --cached --check
          git config user.name "Moral Trade QA automation"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Use exact roles in failure-bonus browser QA"

      - name: Publish repaired QA branch
        shell: bash
        run: |
          set -euxo pipefail
          git push origin HEAD:qa/failure-bonus-authenticated-browser-20260726
