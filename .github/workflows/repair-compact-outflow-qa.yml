name: Repair Compact outflow QA baseline

on:
  push:
    branches:
      - feature/compact-authoritative-outflow-ledger-v1-20260816
    paths:
      - .github/workflows/repair-compact-outflow-qa.yml

permissions:
  contents: write

concurrency:
  group: repair-compact-outflow-qa-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Remove pre-migration references to absent Compact relations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/compact-authoritative-outflow-ledger-qa.yml')
          source = path.read_text(encoding='utf-8')
          lines = [
              "          union all select 'active_compacts|' || coalesce((select count(*) from public.mpgf_public_goods_compacts where status='active'),0)\n",
              "          union all select 'payment_mandates|' || coalesce((select count(*) from public.conditional_payment_mandates),0)\n",
          ]
          for line in lines:
              if source.count(line) != 2:
                  raise SystemExit(f'Expected two baseline occurrences: {line!r}')
              source = source.replace(line, '')
          path.write_text(source, encoding='utf-8')
          PY
          git diff --check
          ! grep -q "active_compacts|' || coalesce" .github/workflows/compact-authoritative-outflow-ledger-qa.yml
          ! grep -q "payment_mandates|' || coalesce" .github/workflows/compact-authoritative-outflow-ledger-qa.yml

      - name: Commit durable repair and remove controller
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/compact-authoritative-outflow-ledger-qa.yml
          git rm .github/workflows/repair-compact-outflow-qa.yml
          git commit -m "ci: avoid absent relations in outflow QA baseline"
          git push origin "HEAD:${GITHUB_REF_NAME}"
