name: Restrict DAC outcome writes once

on:
  push:
    branches:
      - fix/mpgf-dac-success-lapse-20260807
    paths:
      - .github/workflows/restrict-dac-outcome-writes-once.yml

permissions:
  contents: write

concurrency:
  group: restrict-dac-outcome-writes-once
  cancel-in-progress: false

env:
  TARGET_BRANCH: fix/mpgf-dac-success-lapse-20260807
  EXPECTED_PARENT: 1b03026261994a92684eeaa634ee740ee12f6250
  CONTROLLER_PATH: .github/workflows/restrict-dac-outcome-writes-once.yml
  MIGRATION_PATH: supabase/migrations/20260807050000_mpgf_dac_success_lapse.sql
  REGRESSION_PATH: supabase/tests/mpgf_dac_success_lapse.sql
  SOURCE_TEST_PATH: src/lib/mpgf/dac-success-lapse-migration.test.ts

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact target
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 2

      - name: Guard and restrict direct terminal-outcome writes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git diff-tree --no-commit-id --name-only -r HEAD)" = "$CONTROLLER_PATH"
          printf '%s' '' | base64 --decode | python3
          git diff --check
          grep -Fq 'revoke all on table public.mpgf_dac_campaign_outcomes' "$MIGRATION_PATH"
          grep -Fq 'Service role unexpectedly has direct DAC outcome mutation privileges.' "$REGRESSION_PATH"
          grep -Fq 'grant select on table public.mpgf_dac_campaign_outcomes' "$MIGRATION_PATH"

      - name: Commit only the write-boundary repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$MIGRATION_PATH" "$REGRESSION_PATH" "$SOURCE_TEST_PATH"
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = "3"
          git diff --cached --check
          git commit -m "Restrict DAC terminal outcomes to audited RPC writes"
          git push origin "HEAD:$TARGET_BRANCH"
