name: Import institutional source

on:
  push:
    branches:
      - feat/institutional-trade-system
    paths:
      - .github/workflows/import-institutional-source.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-institutional-source
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_PAYLOAD_SHA256: abd0ba337c39ea66321ea64d28b471a9dc0bd710c5ca3f4d9d8758552cb52525
      EXPECTED_PATCH_SHA256: 75dbd90c619cbf80e715b6ea9735c8570b5cd6700585ac0aa88799289860ff6e
      EXPECTED_TREE_SHA: 839043f9e1399001789fdbbf8ae5361ea27a4d34
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch, verify, and import exact implementation blobs
        shell: bash
        run: |
          set -euo pipefail

          blob_shas=(
            0becdf78bc7eaf03f5fec673599953c6cbde5ddf
            fe94fdf1059423a42c469e3ee3cd638c6c476886
            05d84116a084a10d3f240acc3a9ffba2fa78837b
            3505126caa5cbe6c476c334ce5a66ad035f1045f
            9391ec454d2ffa1fda18b5b796137073124c7fc1
            9ec44427e2d1c51be9fbf65c6ba09e25a26120c8
            51c5082638fbe268f2b68018351d74397f869e5b
            9f78d299a9661f0578369b1d29e90191e4d9bc92
            5ba0760bfe334a017f262e28a5eb17e2d4406998
            7b3c8451b23413435f8aaa0e7b2829c595656453
            a11d0fa771d9eae50f79179f878f42dbf61a1513
            71abff5c8c9899bf8f052bbf11cf5021d4ba582f
            f965335b267b1637dfe01d70fe3aa03f1dd9f2ac
            8877c35004e2bf948f46200d194f47b56cbe29ea
            f54ead17c522fe8328e258c3509242366ff86425
            28742f836484764fe3add44a419d34b01151f4f8
            66910b9bb0bcc87ccdc391683d0bc35f5ad5d479
            89e913b7e1f002397f46228c87bb5c339dc6aa57
            72522648f3ec799baade5ab70cd7eab0d3403c39
            7a1ec710adccd0f991ae8284f31a68d6c53285f8
            b7035273a14821d7f33c3ebdbd5c2496c8ab1927
            6a7bc4b836a7307841a8f710f12974daefbcc792
            d8237cf3863364a9c8ab8cddf51b52a22f6157cb
            00d5337fa1fda8428d4ced2593270aab672f2313
          )

          payload=/tmp/institutional-patch.b64
          patch=/tmp/institutional.patch
          : > "$payload"

          for index in "${!blob_shas[@]}"; do
            sha="${blob_shas[$index]}"
            part="/tmp/institutional-part-$(printf '%02d' "$index")"
            response="${part}.json"

            curl --fail-with-body --silent --show-error \
              --retry 3 \
              --retry-all-errors \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs/${sha}" \
              > "$response"

            jq -er '.content' "$response" | tr -d '\n' | base64 --decode > "$part"
            actual_sha="$(git hash-object "$part")"
            if [[ "$actual_sha" != "$sha" ]]; then
              echo "Blob verification failed for part $index: expected $sha, got $actual_sha" >&2
              exit 1
            fi
            cat "$part" >> "$payload"
          done

          echo "${EXPECTED_PAYLOAD_SHA256}  ${payload}" | sha256sum --check --strict
          base64 --decode < "$payload" | xz --decompress --stdout > "$patch"
          echo "${EXPECTED_PATCH_SHA256}  ${patch}" | sha256sum --check --strict

          temporary_paths=(
            .github/importer-diagnostic.txt
            .github/institutional-patch.part-00
            .github/institutional-patch.part-01
            .github/institutional-patch.part-02
            .github/institutional-patch.part-03
            .github/institutional-patch.part-04
            .github/institutional-patch.part-05
            .github/institutional-patch.part-06
            .github/institutional-patch.part-07
            .github/institutional-patch.part-08
            .github/institutional-qa-trigger
            .github/workflows/attach-institutional-payload.yml
            .github/workflows/dispatch-institutional-qa.yml
            .github/workflows/export-institutional-source.yml
            .github/workflows/fix-dispatch-institutional-qa.yml
            .github/workflows/import-institutional-source.yml
            .github/workflows/prepare-institutional-qa-runner.yml
            .github/workflows/read-institutional-importer-log.yml
          )

          apply_excludes=()
          for path in "${temporary_paths[@]}"; do
            apply_excludes+=("--exclude=$path")
          done

          git apply --check --binary "${apply_excludes[@]}" "$patch"
          git apply --binary --index "${apply_excludes[@]}" "$patch"

          rm -f "${temporary_paths[@]}"
          git add -A

          actual_tree="$(git write-tree)"
          {
            echo "expected_tree=$EXPECTED_TREE_SHA"
            echo "actual_tree=$actual_tree"
          } > /tmp/institutional-tree-shas.txt
          git diff --cached --binary > /tmp/institutional-staged.diff
          git ls-files -s > /tmp/institutional-index.txt
          tar --exclude=.git --exclude=node_modules --exclude=.next -czf /tmp/institutional-imported-tree.tar.gz .

          if [[ "$actual_tree" != "$EXPECTED_TREE_SHA" ]]; then
            echo "Imported tree mismatch: expected $EXPECTED_TREE_SHA, got $actual_tree" >&2
            echo "Staged paths:" >&2
            git diff --cached --name-status >&2
            echo "Working-tree status:" >&2
            git status --short >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Implement institutional trade system integrity and QA"
          git push origin HEAD:feat/institutional-trade-system

      - name: Upload importer verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: institutional-import-verification-${{ github.run_id }}
          path: |
            /tmp/institutional-patch.b64
            /tmp/institutional.patch
            /tmp/institutional-tree-shas.txt
            /tmp/institutional-staged.diff
            /tmp/institutional-index.txt
            /tmp/institutional-imported-tree.tar.gz
          if-no-files-found: warn
          retention-days: 2
