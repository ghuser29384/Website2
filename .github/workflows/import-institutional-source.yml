name: Import institutional source

on:
  push:
    branches:
      - feat/institutional-trade-system
    paths:
      - .github/institutional-patch.part-*
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-institutional-source
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import exact local implementation patch
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          parts=(.github/institutional-patch.part-*)
          if (( ${#parts[@]} == 0 )); then
            echo "Patch already consumed; nothing to import."
            exit 0
          fi
          if (( ${#parts[@]} != 12 )); then
            echo "Expected exactly twelve patch parts; found ${#parts[@]}. Waiting for the complete patch."
            exit 0
          fi
          cat "${parts[@]}" | base64 --decode | xz --decompress --stdout | git apply --binary --index -
          rm -f "${parts[@]}" .github/workflows/export-institutional-source.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No implementation changes found."
            exit 0
          fi
          git commit -m "Implement institutional trade system integrity and QA"
          git push origin HEAD:feat/institutional-trade-system
