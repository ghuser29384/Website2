name: Repair MPGF direct-proposal version null handling 2026-08-06

on:
  push:
    branches:
      - fix/mpgf-pool-review-freeze-20260806
    paths:
      - ".github/workflows/repair-mpgf-direct-proposal-version-null-20260806.yml"

permissions:
  contents: write

concurrency:
  group: repair-mpgf-direct-proposal-version-null-20260806
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_PARENT: f489be5676e2214324557e8f1efdf2d547d097ab
      TARGET_BRANCH: fix/mpgf-pool-review-freeze-20260806
      CONTROLLER_PATH: .github/workflows/repair-mpgf-direct-proposal-version-null-20260806.yml

    steps:
      - name: Check out exact controller commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          ref: ${{ github.sha }}

      - name: Normalize absent linked Create terms to SQL null and add regression coverage
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          changed="$(git diff-tree --no-commit-id --name-only -r HEAD | sed '/^$/d')"
          test "$changed" = "$CONTROLLER_PATH"

          python3 - <<'PY'
          from pathlib import Path

          migration_path = Path("supabase/migrations/20260806110000_mpgf_pool_review_freeze.sql")
          migration = migration_path.read_text()
          old_assignment = "  create_terms_json := snapshot_json -> 'createPoolTerms';\n"
          new_assignment = "  create_terms_json := nullif(snapshot_json -> 'createPoolTerms', 'null'::jsonb);\n"
          if migration.count(old_assignment) != 1:
              raise SystemExit(
                  f"Expected one direct-proposal Create-term assignment, found {migration.count(old_assignment)}"
              )
          migration_path.write_text(migration.replace(old_assignment, new_assignment))

          regression_path = Path("supabase/tests/mpgf_pool_review_freeze.sql")
          regression = regression_path.read_text()
          proposal_anchor = """insert into public.moral_trade_create_submissions (
"""
          direct_fixture = """-- Direct MPGF proposal path: no linked Moral Trade Create terms.
insert into public.mpgf_pool_proposals (
  id, proposer_id, title, problem, intervention, moral_public_good_rationale,
  proposed_recipient_name, summary, cause_area, requested_maximum_funding_cents,
  minimum_viable_funding_cents, outcome_units_summary, expected_effect_vs_funding,
  timeline, milestones_json, risks_json, misuse_pathways, implementing_team_json,
  status, submitted_at, public_goods_destination_type, public_goods_destination_ref,
  public_goods_threshold_amount_cents, public_goods_threshold_supporters,
  public_goods_deadline_at, public_goods_verification_method, public_goods_baseline_rule,
  public_goods_exit_rule, public_goods_base_match_ratio, public_goods_qf_enabled,
  public_goods_qf_cap_multiple, public_goods_payout_method,
  public_goods_failure_bonus_enabled, public_goods_success_premium_included_in_net_threshold
) values (
  '7d666666-6666-4666-8666-666666666666',
  '7a111111-1111-4111-8111-111111111111',
  'QA direct pool review and freeze',
  'Synthetic direct QA problem',
  'Synthetic direct QA intervention',
  'Synthetic direct QA public-good rationale',
  'Synthetic direct QA recipient',
  'Synthetic direct QA summary',
  'QA',
  100000,
  50000,
  'One verified direct QA outcome',
  'Synthetic direct QA effect',
  'Synthetic direct QA timeline',
  '[]'::jsonb,
  '[]'::jsonb,
  'None; transaction rolls back',
  '{"summary":"Synthetic direct QA team"}'::jsonb,
  'submitted',
  timezone('utc', now()),
  'external_charity',
  'qa-direct-recipient-reference',
  50000,
  2,
  timezone('utc', now()) + interval '30 days',
  'Synthetic direct QA evidence',
  'No charge without success',
  'Pledges expire on lapse',
  0,
  false,
  1.5,
  'external_handoff',
  false,
  false
);

"""
          if regression.count(proposal_anchor) != 1:
              raise SystemExit(f"Expected one Create-submission anchor, found {regression.count(proposal_anchor)}")
          regression = regression.replace(proposal_anchor, direct_fixture + proposal_anchor)

          review_anchor = """select * from public.mpgf_begin_pool_proposal_review(
  '7d444444-4444-4444-8444-444444444444',
"""
          direct_review = """-- A supported direct MPGF proposal without linked Create terms can still be versioned,
-- independently reviewed, and frozen. Its optional Create snapshot must be SQL null,
-- not JSON null.
select * from public.mpgf_begin_pool_proposal_review(
  '7d666666-6666-4666-8666-666666666666',
  '7b222222-2222-4222-8222-222222222222',
  'QA direct proposal review started'
);
select * from public.mpgf_approve_and_freeze_pool_proposal(
  '7d666666-6666-4666-8666-666666666666',
  '7b222222-2222-4222-8222-222222222222',
  'QA direct proposal terms approved and frozen'
);

do $test$
declare
  direct_status text;
  direct_create_terms jsonb;
begin
  select proposal.status, version.create_pool_terms_json
  into direct_status, direct_create_terms
  from public.mpgf_pool_proposals as proposal
  join public.mpgf_pool_proposal_versions as version
    on version.proposal_id = proposal.id
   and version.terms_version = proposal.approved_terms_version
  where proposal.id = '7d666666-6666-4666-8666-666666666666';

  if direct_status <> 'approved_as_candidate' then
    raise exception 'Direct proposal did not reach approved frozen status.';
  end if;
  if direct_create_terms is not null then
    raise exception 'Direct proposal version stored JSON null instead of SQL null.';
  end if;
end;
$test$;

"""
          if regression.count(review_anchor) != 1:
              raise SystemExit(f"Expected one primary review anchor, found {regression.count(review_anchor)}")
          regression_path.write_text(regression.replace(review_anchor, direct_review + review_anchor))

          contract_path = Path("src/lib/mpgf/pool-review-freeze-migration.test.ts")
          contract = contract_path.read_text()
          migration_anchor = '    "proposal_version.terms_sha256",\n'
          migration_assertion = '    "nullif(snapshot_json -> \'createPoolTerms\', \'null\'::jsonb)",\n'
          if contract.count(migration_anchor) != 1:
              raise SystemExit(f"Expected one version-hash contract anchor, found {contract.count(migration_anchor)}")
          contract = contract.replace(migration_anchor, migration_anchor + migration_assertion)

          regression_anchor = '    "Drifted linked terms unexpectedly approved",\n'
          regression_assertions = (
              '    "QA direct proposal review started",\n'
              '    "Direct proposal version stored JSON null instead of SQL null",\n'
          )
          if contract.count(regression_anchor) != 1:
              raise SystemExit(f"Expected one regression contract anchor, found {contract.count(regression_anchor)}")
          contract_path.write_text(contract.replace(regression_anchor, regression_anchor + regression_assertions))
          PY

          git diff --check
          git diff -- \
            supabase/migrations/20260806110000_mpgf_pool_review_freeze.sql \
            supabase/tests/mpgf_pool_review_freeze.sql \
            src/lib/mpgf/pool-review-freeze-migration.test.ts

      - name: Commit and push non-workflow repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            supabase/migrations/20260806110000_mpgf_pool_review_freeze.sql \
            supabase/tests/mpgf_pool_review_freeze.sql \
            src/lib/mpgf/pool-review-freeze-migration.test.ts
          git diff --cached --check
          git commit -m "Handle direct MPGF proposal versions without Create terms"
          git push origin "HEAD:$TARGET_BRANCH"
