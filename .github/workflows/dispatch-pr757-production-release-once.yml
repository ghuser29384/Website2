name: Dispatch PR 757 exact production release once

on:
  push:
    branches:
      - ops/pr757-production-release-dispatch-20260818
    paths:
      - .github/workflows/dispatch-pr757-production-release-once.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact controller
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Guard exact main and dispatch checked-in release workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_MAIN_SHA: f9ae5480ae7c20176f24c5f8b678088b5823fc39
          CONTROLLER_BRANCH: ops/pr757-production-release-dispatch-20260818
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'ghuser29384/Website2'
          test "$GITHUB_REF_NAME" = "$CONTROLLER_BRANCH"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_MAIN_SHA"
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/dispatch-pr757-production-release-once.yml'
          git diff --check HEAD^ HEAD
          remote_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$remote_main" = "$EXPECTED_MAIN_SHA"
          test "$(git show "$EXPECTED_MAIN_SHA:.github/workflows/vercel-release.yml" | sed -n '1p')" = 'name: Gated Vercel release'

          payload="$(jq -n \
            --arg ref 'main' \
            --arg target 'production' \
            --arg release_ref 'main' \
            --arg expected_sha "$EXPECTED_MAIN_SHA" \
            --arg fixture '' \
            '{ref:$ref,inputs:{target:$target,ref:$release_ref,expected_sha:$expected_sha,synthetic_auth_fixture_url:$fixture}}')"

          http_code="$(curl -sS \
            -o "$RUNNER_TEMP/dispatch-response.txt" \
            -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/vercel-release.yml/dispatches" \
            -d "$payload")"
          test "$http_code" = '204'
          test ! -s "$RUNNER_TEMP/dispatch-response.txt"
          printf 'workflow=vercel-release.yml\nref=main\ntarget=production\nexpected_sha=%s\nsynthetic_auth_fixture_url=<empty>\nhttp_status=%s\n' \
            "$EXPECTED_MAIN_SHA" "$http_code"
