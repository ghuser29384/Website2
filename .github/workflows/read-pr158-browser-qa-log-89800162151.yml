name: Read PR 158 browser QA failure

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/read-pr158-browser-qa-log-89800162151.yml"
      - ".github/scripts/read-pr158-browser-qa-log-89800162151.py"

permissions:
  actions: read
  contents: read

jobs:
  extract:
    if: >-
      github.event.pull_request.head.repo.full_name == 'ghuser29384/Website2' &&
      github.head_ref == 'ops/read-pr158-browser-qa-log-89800162151'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Download and print sanitized browser-QA failure
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/ghuser29384/Website2/884dc1628240a834debdedf49d39d63a5ed8d067/.github/scripts/read-pr158-browser-qa-log-89800162151.py \
            --output "$RUNNER_TEMP/read-browser-qa-log.py"
          python3 "$RUNNER_TEMP/read-browser-qa-log.py"
