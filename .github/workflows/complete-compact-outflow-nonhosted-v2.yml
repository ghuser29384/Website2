name: Complete Compact outflow non-hosted validation v2

on:
  push:
    branches:
      - feature/compact-authoritative-outflow-ledger-v1-20260816
    paths:
      - .github/workflows/complete-compact-outflow-nonhosted-v2.yml

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: complete-compact-outflow-nonhosted-v2
  cancel-in-progress: false

env:
  STACK_BASE_SHA: f46178aaad6d2fbd911cc365e2963bb7c73a0098
  FEATURE_BRANCH: feature/compact-authoritative-outflow-ledger-v1-20260816
  QA_REF: hvmxfjjbdcgjjudmthdz
  PR_NUMBER: '737'
  ISSUE_NUMBER: '734'

jobs:
  complete:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Check out controller head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Verify final ordered and isolated workflow
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/compact-authoritative-outflow-ledger-qa.yml
          test "$(git merge-base "$STACK_BASE_SHA" HEAD)" = "$STACK_BASE_SHA"
          for marker in \
            'Prepare exact split migration chain' \
            'Run legacy Compact regressions before ledger migrations' \
            'Apply authoritative outflow ledger migrations' \
            'Run database lint and final-ledger lifecycle suites' \
            'savepoint legacy_lifecycle' \
            'savepoint ledger_authorization'; do
            grep -q "$marker" "$workflow"
          done
          git diff --name-only "$STACK_BASE_SHA"...HEAD | sort > /tmp/scope.txt
          test "$(wc -l < /tmp/scope.txt)" -eq 15
          grep -qx '.github/workflows/complete-compact-outflow-nonhosted-v2.yml' /tmp/scope.txt
          if grep -Ev '^(\.github/workflows/(compact-authoritative-outflow-ledger-qa|complete-compact-outflow-nonhosted-v2)\.yml|docs/mpgf/compact-authoritative-outflow-ledger-v1\.md|scripts/test-compact-authoritative-outflow-concurrency\.sh|src/components/mpgf/mpgf-public-goods-compacts\.tsx|src/lib/mpgf/compact-authoritative-outflow(-contract\.test|\.test)?\.ts|supabase/migrations/2026081614150[0-3]_compact_authoritative_outflow_.*\.sql|supabase/tests/compact_authoritative_outflow_ledger_(authorization|core)\.sql|tests/mpgf-public-goods-compacts\.spec\.ts)$' /tmp/scope.txt; then
            echo 'Unexpected file outside the frozen ledger plus controller scope.'
            exit 1
          fi
          git diff --check

      - name: Remove controller and freeze exact candidate
        id: freeze
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/complete-compact-outflow-nonhosted-v2.yml
          git commit -m 'ops: remove final Compact outflow non-hosted controller'
          git push origin "HEAD:${FEATURE_BRANCH}"
          echo "candidate_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "candidate_tree=$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"

      - name: Discover exact workflows
        id: discover
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow list --repo "$GITHUB_REPOSITORY" --all --json id,name,path,state > /tmp/workflows.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          rows = json.loads(Path('/tmp/workflows.json').read_text())
          wanted = {
              'ledger': ('compact authoritative outflow ledger qa',),
              'compact': ('mpgf public-goods compacts qa', 'mpgf public goods compacts qa'),
              'payment': ('evidence payment release qa',),
              'visual': ('sitewide canonical visual system', 'canonical visual'),
              'release': ('release classification',),
          }
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
              for key, needles in wanted.items():
                  matches = [row for row in rows if any(needle in row['name'].lower() for needle in needles)]
                  if len(matches) != 1 or matches[0].get('state') != 'active':
                      raise SystemExit(f'{key}: workflow discovery failed: {matches}')
                  output.write(f'{key}_id={matches[0]["id"]}\n')
                  output.write(f'{key}_path={matches[0]["path"]}\n')
          PY

      - name: Dispatch all exact-head gates
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          LEDGER_PATH: ${{ steps.discover.outputs.ledger_path }}
          COMPACT_PATH: ${{ steps.discover.outputs.compact_path }}
          PAYMENT_PATH: ${{ steps.discover.outputs.payment_path }}
          VISUAL_PATH: ${{ steps.discover.outputs.visual_path }}
          RELEASE_PATH: ${{ steps.discover.outputs.release_path }}
        run: |
          set -euo pipefail
          gh workflow run "$LEDGER_PATH" --repo "$GITHUB_REPOSITORY" --ref "$FEATURE_BRANCH" -f confirm_target="$QA_REF"
          gh workflow run "$COMPACT_PATH" --repo "$GITHUB_REPOSITORY" --ref "$FEATURE_BRANCH" -f confirm_target="$QA_REF" || gh workflow run "$COMPACT_PATH" --repo "$GITHUB_REPOSITORY" --ref "$FEATURE_BRANCH"
          gh workflow run "$PAYMENT_PATH" --repo "$GITHUB_REPOSITORY" --ref "$FEATURE_BRANCH"
          gh workflow run "$VISUAL_PATH" --repo "$GITHUB_REPOSITORY" --ref "$FEATURE_BRANCH"
          gh workflow run "$RELEASE_PATH" --repo "$GITHUB_REPOSITORY" --ref "$FEATURE_BRANCH"

      - name: Wait for all exact-head gates
        id: wait
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ steps.freeze.outputs.candidate_sha }}
          LEDGER_ID: ${{ steps.discover.outputs.ledger_id }}
          COMPACT_ID: ${{ steps.discover.outputs.compact_id }}
          PAYMENT_ID: ${{ steps.discover.outputs.payment_id }}
          VISUAL_ID: ${{ steps.discover.outputs.visual_id }}
          RELEASE_ID: ${{ steps.discover.outputs.release_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess, time
          from pathlib import Path
          repo = os.environ['GITHUB_REPOSITORY']
          sha = os.environ['CANDIDATE_SHA']
          workflow_ids = {key: int(os.environ[f'{key.upper()}_ID']) for key in ['ledger','compact','payment','visual','release']}
          selected = {}
          deadline = time.time() + 7200
          while time.time() < deadline:
              data = json.loads(subprocess.check_output([
                  'gh','api',f'repos/{repo}/actions/runs','--method','GET',
                  '-f',f'head_sha={sha}','-f','per_page=100','-f','exclude_pull_requests=false'
              ], text=True))
              for key, workflow_id in workflow_ids.items():
                  rows = [run for run in data.get('workflow_runs',[]) if run.get('workflow_id') == workflow_id and run.get('head_sha') == sha]
                  if rows:
                      rows.sort(key=lambda run: run['id'], reverse=True)
                      selected[key] = rows[0]
              if len(selected) == len(workflow_ids) and all(run['status'] == 'completed' for run in selected.values()):
                  break
              time.sleep(20)
          else:
              raise SystemExit(f'Timed out waiting for exact-head runs: {selected}')
          report = {key: {'id':run['id'],'name':run['name'],'conclusion':run['conclusion'],'url':run['html_url'],'head_sha':run['head_sha']} for key,run in selected.items()}
          Path('/tmp/runs.json').write_text(json.dumps(report,indent=2)+'\n')
          failed = {key:row for key,row in report.items() if row['conclusion'] != 'success'}
          if failed:
              raise SystemExit('Gate failures: '+json.dumps(failed,indent=2))
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
              for key,row in report.items():
                  output.write(f'{key}_run_id={row["id"]}\n')
          PY

      - name: Publish exact-head success
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ steps.freeze.outputs.candidate_sha }}
          CANDIDATE_TREE: ${{ steps.freeze.outputs.candidate_tree }}
        run: |
          runs="$(cat /tmp/runs.json)"
          body=$(cat <<EOF
          ### Ordered, isolated exact-head validation passed

          - Candidate: \`$CANDIDATE_SHA\`
          - Tree: \`$CANDIDATE_TREE\`
          - Stack base: \`$STACK_BASE_SHA\`
          - Legacy Compact regressions ran before ledger migrations in isolated fixture transactions.
          - Isolated-QA validation retained one outer transaction and used savepoints for each suite.

          \`\`\`json
          $runs
          \`\`\`

          No merge, deployment, persistent migration, provider action, payment, activation, electorate, alias, or public recruitment is authorized. The next gate is protected isolated-QA hosted UAT.
          EOF
          )
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$body"
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$body"

      - name: Publish fail-closed result
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ steps.freeze.outputs.candidate_sha }}
        run: |
          body="Final non-hosted issue #734 validation stopped fail closed for candidate \`${CANDIDATE_SHA:-unknown}\`. No hosted Preview or release mutation was authorized. Controller: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$body" || true
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$body" || true
