name: Disconnect duplicate websitebuilding2 Vercel project once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/disconnect-websitebuilding2-once.yml

permissions:
  contents: write

concurrency:
  group: disconnect-websitebuilding2-once
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: team_ySu6sF3Uho1E1GnJtCQPVEuJ
  DUPLICATE_PROJECT_ID: prj_fS6CHvUz6OL0hSLDhujuXGDuaVtg
  RETAINED_PROJECT_ID: prj_nYsdGDl1zVtUNoD4YtrUVoBg1Hp5
  VERCEL_CLI_VERSION: 50.38.1
  CONTROLLER_PATH: .github/workflows/disconnect-websitebuilding2-once.yml

jobs:
  disconnect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out exact controller commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Guard exact repository and one-file controller scope
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'ghuser29384/Website2'
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$GITHUB_ACTOR" = 'ghuser29384'
          changed="$(git diff-tree --no-commit-id --name-only -r HEAD | sed '/^$/d')"
          test "$changed" = "$CONTROLLER_PATH"

      - name: Verify the duplicate is safe to archive
        id: preflight
        continue-on-error: true
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          auth="Authorization: Bearer $VERCEL_TOKEN"
          duplicate_url="https://api.vercel.com/v9/projects/$DUPLICATE_PROJECT_ID?teamId=$VERCEL_ORG_ID"
          domains_url="https://api.vercel.com/v9/projects/$DUPLICATE_PROJECT_ID/domains?teamId=$VERCEL_ORG_ID&limit=100"
          retained_url="https://api.vercel.com/v9/projects/$RETAINED_PROJECT_ID?teamId=$VERCEL_ORG_ID"

          curl --fail-with-body --silent --show-error -H "$auth" "$duplicate_url" > duplicate-before.json
          curl --fail-with-body --silent --show-error -H "$auth" "$domains_url" > duplicate-domains-before.json
          curl --fail-with-body --silent --show-error -H "$auth" "$retained_url" > retained-before.json

          jq -e --arg id "$DUPLICATE_PROJECT_ID" --arg name websitebuilding2 \
            '.id == $id and .name == $name and .link.type == "github" and .link.org == "ghuser29384" and .link.repo == "WebsiteBuilding2"' \
            duplicate-before.json >/dev/null
          jq -e --arg id "$RETAINED_PROJECT_ID" --arg name normativity \
            '.id == $id and .name == $name and .link.type == "github" and .link.org == "ghuser29384" and .link.repo == "WebsiteBuilding2"' \
            retained-before.json >/dev/null
          jq -e '
            [(.domains // [])[] | .name | select((endswith(".vercel.app") or . == "vercel.app") | not)] | length == 0
          ' duplicate-domains-before.json >/dev/null

      - name: Disconnect only websitebuilding2 from Git
        if: steps.preflight.outcome == 'success'
        id: disconnect
        continue-on-error: true
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' \
            "$VERCEL_ORG_ID" "$DUPLICATE_PROJECT_ID" > .vercel/project.json
          printf 'y\n' | npx --yes "vercel@$VERCEL_CLI_VERSION" git disconnect \
            --token="$VERCEL_TOKEN" \
            --scope=ellen-s

      - name: Verify duplicate disconnected and retained project unchanged
        if: steps.preflight.outcome == 'success' && steps.disconnect.outcome == 'success'
        id: verify
        continue-on-error: true
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          auth="Authorization: Bearer $VERCEL_TOKEN"
          curl --fail-with-body --silent --show-error -H "$auth" \
            "https://api.vercel.com/v9/projects/$DUPLICATE_PROJECT_ID?teamId=$VERCEL_ORG_ID" \
            > duplicate-after.json
          curl --fail-with-body --silent --show-error -H "$auth" \
            "https://api.vercel.com/v9/projects/$RETAINED_PROJECT_ID?teamId=$VERCEL_ORG_ID" \
            > retained-after.json

          jq -e '.link == null' duplicate-after.json >/dev/null
          jq -e --arg id "$RETAINED_PROJECT_ID" \
            '.id == $id and .link.type == "github" and .link.org == "ghuser29384" and .link.repo == "WebsiteBuilding2"' \
            retained-after.json >/dev/null

          jq -n \
            --arg status passed \
            --arg duplicate "$DUPLICATE_PROJECT_ID" \
            --arg retained "$RETAINED_PROJECT_ID" \
            '{status:$status,duplicateProject:$duplicate,retainedProject:$retained,duplicateGitDisconnected:true,retainedGitConnectionPreserved:true}' \
            > websitebuilding2-disconnect-result.json

      - name: Upload redacted evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: websitebuilding2-disconnect-${{ github.run_id }}
          path: |
            duplicate-before.json
            duplicate-domains-before.json
            retained-before.json
            duplicate-after.json
            retained-after.json
            websitebuilding2-disconnect-result.json
          if-no-files-found: warn
          retention-days: 30

      - name: Remove one-time controller with verdict
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ '${{ steps.preflight.outcome }}' == 'success' && '${{ steps.disconnect.outcome }}' == 'success' && '${{ steps.verify.outcome }}' == 'success' ]]; then
            message='Remove one-time websitebuilding2 disconnect controller after PASS'
          else
            message='Remove one-time websitebuilding2 disconnect controller after FAIL'
          fi
          blob_sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/$CONTROLLER_PATH?ref=main" --jq .sha 2>/dev/null || true)"
          if [[ -n "$blob_sha" ]]; then
            jq -n \
              --arg message "$message" \
              --arg sha "$blob_sha" \
              --arg branch main \
              '{message:$message,sha:$sha,branch:$branch}' \
              | gh api --method DELETE "repos/$GITHUB_REPOSITORY/contents/$CONTROLLER_PATH" --input - >/dev/null
          fi

      - name: Enforce disconnected archive state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test '${{ steps.preflight.outcome }}' = 'success'
          test '${{ steps.disconnect.outcome }}' = 'success'
          test '${{ steps.verify.outcome }}' = 'success'
