name: PR 406 persistent QA migration and API E2E

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: pr406-persistent-qa-e2e-20260801
  cancel-in-progress: false

env:
  TARGET_BRANCH: feature/pledge-impact-live-foundation-20260801
  EXPECTED_HEAD: a73141c88438cbbecf79cf693109bc460150b70a
  CONTROLLER_PATH: .github/workflows/pr406-persistent-qa-e2e-controller.yml
  PR_NUMBER: "406"
  QA_PROJECT_REF: hvmxfjjbdcgjjudmthdz
  MIGRATION_VERSION: "20260801030000"
  MIGRATION_NAME: mpgf_pledge_impact_live_foundation
  MIGRATION_PATH: supabase/migrations/20260801030000_mpgf_pledge_impact_live_foundation.sql
  MIGRATION_BLOB: c83ab30d7a84b2c97a70181fb5ba909cbebb75f4
  QA_SUPABASE_URL: https://hvmxfjjbdcgjjudmthdz.supabase.co
  QA_SUPABASE_PUBLISHABLE_KEY: sb_publishable_Sai3NlSapbvkmXa3EQrx9A_W9oNEYE8
  FIXTURE_POOL: qa-pool-pledge-impact-e2e
  NO_FORECAST_POOL: qa-pool-pledge-impact-no-forecast

jobs:
  persistent-qa:
    if: >-
      github.repository == 'ghuser29384/Website2' &&
      github.event.issue.pull_request != null &&
      github.event.issue.number == 406 &&
      github.event.comment.body == '/apply-pr406-persistent-qa-20260801'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      QA_SUPABASE_DB_URL: ${{ secrets.QA_SUPABASE_DB_URL }}

    steps:
      - name: Check out exact feature head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Guard exact repository, branch, and QA target
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'ghuser29384/Website2'
          test "$(git branch --show-current)" = "$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')" = "$EXPECTED_HEAD"
          test -n "${QA_SUPABASE_DB_URL:-}"
          python3 - <<'PY'
          import os
          from urllib.parse import urlparse

          parsed = urlparse(os.environ['QA_SUPABASE_DB_URL'])
          expected = os.environ['QA_PROJECT_REF']
          if expected not in (parsed.username or ''):
              raise SystemExit('Refusing a database URL outside the exact MoralTrade QA project.')
          if parsed.hostname != 'aws-0-us-west-1.pooler.supabase.com':
              raise SystemExit(f'Refusing unexpected database host: {parsed.hostname}')
          if parsed.port != 5432 or parsed.path != '/postgres':
              raise SystemExit('Refusing unexpected database connection parameters.')
          PY

      - name: Remove temporary controller from main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          controller_sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/$CONTROLLER_PATH?ref=main" --jq .sha)"
          jq -n \
            --arg message 'Remove temporary PR 406 persistent-QA controller' \
            --arg sha "$controller_sha" \
            --arg branch main \
            '{message:$message,sha:$sha,branch:$branch}' \
            | gh api --method DELETE "repos/$GITHUB_REPOSITORY/contents/$CONTROLLER_PATH" --input - >/dev/null

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes postgresql-client > /dev/null

      - name: Apply and register the additive migration persistently
        shell: bash
        run: |
          set -euo pipefail
          existing="$(psql "$QA_SUPABASE_DB_URL" --no-psqlrc -Atqc \
            "select count(*) from supabase_migrations.schema_migrations where version = '$MIGRATION_VERSION';")"
          case "$existing" in
            0)
              cat > /tmp/apply-pr406-migration.sql <<SQL
          \set ON_ERROR_STOP on
          begin;
          select pg_advisory_xact_lock(hashtextextended('pr406_mpgf_pledge_impact_live_foundation', 0));
          \ir $GITHUB_WORKSPACE/$MIGRATION_PATH
          insert into supabase_migrations.schema_migrations (
            version,
            statements,
            name,
            created_by
          ) values (
            '$MIGRATION_VERSION',
            array['source-git-blob:$MIGRATION_BLOB;candidate:$EXPECTED_HEAD'],
            '$MIGRATION_NAME',
            'github-actions:pr406-persistent-qa'
          );
          commit;
          SQL
              psql "$QA_SUPABASE_DB_URL" \
                --no-psqlrc \
                --file /tmp/apply-pr406-migration.sql \
                2>&1 | tee persistent-migration.log
              ;;
            1)
              marker="$(psql "$QA_SUPABASE_DB_URL" --no-psqlrc -Atqc \
                "select coalesce(statements[1], '') from supabase_migrations.schema_migrations where version = '$MIGRATION_VERSION';")"
              [[ "$marker" == *"$MIGRATION_BLOB"* ]] || {
                echo 'Existing migration version has an unexpected source marker.' >&2
                exit 1
              }
              printf 'Migration %s already registered from the expected source.\n' "$MIGRATION_VERSION" \
                | tee persistent-migration.log
              ;;
            *)
              echo "Unexpected migration inventory count: $existing" >&2
              exit 1
              ;;
          esac

      - name: Verify persistent schema and empty release state
        shell: bash
        run: |
          set -euo pipefail
          psql "$QA_SUPABASE_DB_URL" --no-psqlrc --set ON_ERROR_STOP=1 <<'SQL' \
            2>&1 | tee persistent-schema-verification.log
          do $verify$
          begin
            if to_regclass('public.mpgf_pledge_impact_pool_map') is null
               or to_regclass('public.mpgf_pledge_impact_forecast_snapshots') is null
               or to_regclass('public.mpgf_pledge_impact_forecast_audit_events') is null then
              raise exception 'Persistent pledge-impact relations are missing.';
            end if;
            if to_regprocedure('public.get_mpgf_pledge_impact_bundle(text)') is null
               or to_regprocedure('public.release_mpgf_pledge_impact_forecast(text,text,text,timestamp with time zone,timestamp with time zone,jsonb)') is null then
              raise exception 'Persistent pledge-impact functions are missing.';
            end if;
            if exists (
              select 1 from public.mpgf_pledge_impact_pool_map
              where pool_public_key in (
                'qa-pool-pledge-impact-e2e',
                'qa-pool-pledge-impact-no-forecast'
              )
            ) then
              raise exception 'Stale PR406 QA fixture mapping exists before setup.';
            end if;
          end;
          $verify$;
          SQL

      - name: Run the full SQL regression against the persistent migration
        shell: bash
        run: |
          set -euo pipefail
          psql "$QA_SUPABASE_DB_URL" \
            --no-psqlrc \
            --set ON_ERROR_STOP=1 \
            --file supabase/tests/mpgf_pledge_impact_live_foundation.sql \
            2>&1 | tee persistent-schema-regression.log
          test "$(psql "$QA_SUPABASE_DB_URL" --no-psqlrc -Atqc \
            "select count(*) from public.mpgf_pledge_impact_pool_map where pool_public_key = 'qa-pool-wild-research';")" = '0'

      - name: Create a persistent QA-only production-shaped fixture
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/pr406-qa-fixture.sql <<'SQL'
          \set ON_ERROR_STOP on
          begin;

          insert into public.mpgf_pool_proposals (
            id, title, proposed_recipient_name, problem, intervention,
            moral_public_good_rationale, summary, cause_area,
            requested_maximum_funding_cents, minimum_viable_funding_cents,
            outcome_units_summary, expected_effect_vs_funding, timeline,
            misuse_pathways, status, threshold_visibility, progress_visibility,
            public_goods_destination_type, public_goods_destination_ref,
            public_goods_threshold_amount_cents, public_goods_threshold_supporters,
            public_goods_deadline_at, public_goods_failure_bonus_enabled
          ) values
          (
            '71111111-1111-4111-8111-111111111111',
            'QA pledge-impact API research pool',
            'QA research recipient',
            'Important research is underfunded.',
            'Fund an independently reviewed priority study.',
            'Several moral views value reducing severe suffering.',
            'QA-only persistent API fixture.',
            'Animal welfare',
            2500000, 2500000,
            'One independently reviewed research programme',
            'Additional funding purchases additional reviewed research capacity.',
            'Complete within twelve months of threshold activation.',
            'No operational misuse pathway in this QA-only fixture.',
            'approved_as_candidate', 'public_exact', 'exact_amount',
            'external_charity', 'https://qa.example.org/approved-charity-e2e',
            2500000, 2, timezone('utc', now()) + interval '30 days', false
          ),
          (
            '72222222-2222-4222-8222-222222222222',
            'QA pledge-impact no-forecast pool',
            'QA second recipient',
            'A second public-good project is underfunded.',
            'Fund a second independently reviewed study.',
            'Several moral views value the study.',
            'QA-only no-forecast fixture.',
            'Global priorities',
            1000000, 1000000,
            'One reviewed study',
            'Additional funding buys reviewed research.',
            'Complete within twelve months.',
            'No operational misuse pathway in this QA-only fixture.',
            'approved_as_candidate', 'public_exact', 'exact_amount',
            'external_charity', 'https://qa.example.org/approved-charity-no-forecast',
            1000000, 1, timezone('utc', now()) + interval '30 days', false
          );

          insert into public.mpgf_pledge_impact_pool_map (
            pool_public_key, pool_proposal_id, mapping_version,
            release_environment, active
          ) values
          (
            'qa-pool-pledge-impact-e2e',
            '71111111-1111-4111-8111-111111111111',
            'qa-persistent-e2e-v1', 'qa', true
          ),
          (
            'qa-pool-pledge-impact-no-forecast',
            '72222222-2222-4222-8222-222222222222',
            'qa-persistent-e2e-v1', 'qa', true
          );

          insert into public.mpgf_pledges (
            id, pool_proposal_id, amount_cents, cadence, status,
            pledge_mode, real_money, contributor_label
          ) values
          (
            '73333333-3333-4333-8333-333333333331',
            '71111111-1111-4111-8111-111111111111',
            1000000, 'one_time', 'pledged', 'pledge_only', false,
            'QA API contributor one'
          ),
          (
            '73333333-3333-4333-8333-333333333332',
            '71111111-1111-4111-8111-111111111111',
            680000, 'one_time', 'pledged', 'pledge_only', false,
            'QA API contributor two'
          );

          select public.release_mpgf_pledge_impact_forecast(
            'qa-pool-pledge-impact-e2e',
            'qa-persistent-api-v1',
            'qa-persistent-model-v1',
            date_trunc('milliseconds', clock_timestamp()),
            date_trunc('milliseconds', clock_timestamp()) + interval '90 minutes',
            jsonb_build_object(
              'schemaVersion', 'mpgf_pledge_impact_forecast_v1',
              'audience', 'pool_state',
              'experimental', true,
              'currency', 'USD',
              'forecastErrorFloorBps', 50,
              'followOnEffect', jsonb_build_object(
                'included', false,
                'evidenceType', 'none',
                'evidenceReference', null
              ),
              'points', jsonb_build_array(
                jsonb_build_object(
                  'pledgeCents', 0,
                  'additionalFundingFromOthers', jsonb_build_object(
                    'estimateCents', 0, 'lower90Cents', 0, 'upper90Cents', 0
                  ),
                  'allocatedFundingCredit', jsonb_build_object(
                    'estimateCents', 0, 'lower90Cents', 0, 'upper90Cents', 0
                  ),
                  'thresholds', jsonb_build_array(jsonb_build_object(
                    'thresholdIndex', 1,
                    'thresholdCents', 2500000,
                    'probabilityWithoutPledgeBps', 4200,
                    'probabilityWithPledgeBps', 4200,
                    'lower90ChangeBps', 0,
                    'upper90ChangeBps', 0
                  )),
                  'failureBonusConditionalOnFailure', null,
                  'decomposition', jsonb_build_object(
                    'directThresholdEffectCents', 0,
                    'followOnContributionEffectCents', 0,
                    'settlementAdjustmentCents', 0,
                    'timingEffectCents', 0
                  )
                ),
                jsonb_build_object(
                  'pledgeCents', 3500,
                  'additionalFundingFromOthers', jsonb_build_object(
                    'estimateCents', 10200,
                    'lower90Cents', 1200,
                    'upper90Cents', 28600
                  ),
                  'allocatedFundingCredit', jsonb_build_object(
                    'estimateCents', 8900,
                    'lower90Cents', 1000,
                    'upper90Cents', 20000
                  ),
                  'thresholds', jsonb_build_array(jsonb_build_object(
                    'thresholdIndex', 1,
                    'thresholdCents', 2500000,
                    'probabilityWithoutPledgeBps', 4200,
                    'probabilityWithPledgeBps', 4260,
                    'lower90ChangeBps', 12,
                    'upper90ChangeBps', 110
                  )),
                  'failureBonusConditionalOnFailure', null,
                  'decomposition', jsonb_build_object(
                    'directThresholdEffectCents', 11100,
                    'followOnContributionEffectCents', 0,
                    'settlementAdjustmentCents', -900,
                    'timingEffectCents', 0
                  )
                ),
                jsonb_build_object(
                  'pledgeCents', 8500,
                  'additionalFundingFromOthers', jsonb_build_object(
                    'estimateCents', 30600,
                    'lower90Cents', 9500,
                    'upper90Cents', 62000
                  ),
                  'allocatedFundingCredit', jsonb_build_object(
                    'estimateCents', 22000,
                    'lower90Cents', 7000,
                    'upper90Cents', 45000
                  ),
                  'thresholds', jsonb_build_array(jsonb_build_object(
                    'thresholdIndex', 1,
                    'thresholdCents', 2500000,
                    'probabilityWithoutPledgeBps', 4200,
                    'probabilityWithPledgeBps', 4390,
                    'lower90ChangeBps', 65,
                    'upper90ChangeBps', 300
                  )),
                  'failureBonusConditionalOnFailure', null,
                  'decomposition', jsonb_build_object(
                    'directThresholdEffectCents', 32000,
                    'followOnContributionEffectCents', 0,
                    'settlementAdjustmentCents', -1400,
                    'timingEffectCents', 0
                  )
                )
              ),
              'modelPerformance', jsonb_build_object(
                'sampleSize', 1240,
                'evaluationWindowStart', '2026-04-01T00:00:00.000Z',
                'evaluationWindowEnd', '2026-07-30T23:59:59.000Z',
                'brierScore', 0.173,
                'calibrationErrorBps', 42,
                'notes', 'QA-only production-shaped fixture; no viewer-level inputs.'
              )
            )
          );

          commit;
          SQL
          psql "$QA_SUPABASE_DB_URL" \
            --no-psqlrc \
            --file /tmp/pr406-qa-fixture.sql \
            2>&1 | tee persistent-fixture-create.log

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Build the exact candidate against MoralTrade QA
        shell: bash
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.QA_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ env.QA_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_SITE_URL: https://www.moraltrade.org
          VERCEL: "1"
          VERCEL_ENV: preview
        run: |
          set -o pipefail
          npm run build 2>&1 | tee persistent-qa-build.log

      - name: Run exact local API against persistent QA
        shell: bash
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.QA_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ env.QA_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_SITE_URL: https://www.moraltrade.org
          PORT: "3010"
        run: |
          set -euo pipefail
          npm start -- -H 127.0.0.1 -p 3010 > persistent-qa-next.log 2>&1 &
          server_pid=$!
          echo "$server_pid" > /tmp/pr406-next.pid
          ready=0
          for attempt in $(seq 1 90); do
            if curl --silent --fail 'http://127.0.0.1:3010/api/mpgf/pledge-impact?pool=qa-pool-pledge-impact-e2e&pledgeCents=3500' \
              > /tmp/available.json; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" = '1'

          curl --silent --show-error --dump-header /tmp/available.headers \
            'http://127.0.0.1:3010/api/mpgf/pledge-impact?pool=qa-pool-pledge-impact-e2e&pledgeCents=3500' \
            > /tmp/available.json
          curl --silent --show-error --dump-header /tmp/no-forecast.headers \
            'http://127.0.0.1:3010/api/mpgf/pledge-impact?pool=qa-pool-pledge-impact-no-forecast&pledgeCents=3500' \
            > /tmp/no-forecast.json
          curl --silent --show-error --dump-header /tmp/unmapped.headers \
            'http://127.0.0.1:3010/api/mpgf/pledge-impact?pool=qa-pool-pledge-impact-unmapped&pledgeCents=3500' \
            > /tmp/unmapped.json
          curl --silent --show-error --dump-header /tmp/malformed.headers \
            'http://127.0.0.1:3010/api/mpgf/pledge-impact?pool=qa-pool-pledge-impact-e2e&pledgeCents=35.5' \
            > /tmp/malformed.json

          node <<'NODE'
          const fs = require('node:fs');
          const read = (name) => JSON.parse(fs.readFileSync(`/tmp/${name}.json`, 'utf8'));
          const headers = (name) => fs.readFileSync(`/tmp/${name}.headers`, 'utf8').toLowerCase();
          const available = read('available');
          if (available.status !== 'available') throw new Error(JSON.stringify(available));
          if (available.experimental !== true) throw new Error('Experimental label missing.');
          if (available.poolPublicKey !== 'qa-pool-pledge-impact-e2e') throw new Error('Wrong pool.');
          if (available.pledgeCents !== 3500) throw new Error('Wrong pledge amount.');
          if (available.additionalFundingFromOthers?.estimateCents !== 10200) throw new Error('Wrong causal estimate.');
          if (available.allocatedFundingCredit?.estimateCents !== 8900) throw new Error('Wrong allocated credit.');
          if (available.fundingMultiplier !== 2.91) throw new Error('Wrong multiplier.');
          if (available.mechanicalEffect?.currentGapCents !== 820000) throw new Error('Wrong live gap.');
          if (available.mechanicalEffect?.remainingAfterPledgeCents !== 816500) throw new Error('Wrong remaining gap.');
          if (available.mechanicalEffect?.shareOfCurrentGapBps !== 43) throw new Error('Wrong gap-share precision.');
          if (available.explanation?.viewerPersonalizationUsed !== false) throw new Error('Viewer personalization contract failed.');
          if (!headers('available').includes('cache-control: private, no-store')) throw new Error('No-store header missing.');

          const noForecast = read('no-forecast');
          if (noForecast.status !== 'unavailable' || noForecast.reason !== 'forecast_not_released') {
            throw new Error(`Unexpected no-forecast response: ${JSON.stringify(noForecast)}`);
          }
          const unmapped = read('unmapped');
          if (unmapped.status !== 'unavailable' || unmapped.reason !== 'pool_not_live') {
            throw new Error(`Unexpected unmapped response: ${JSON.stringify(unmapped)}`);
          }
          const malformed = read('malformed');
          if (malformed.error !== 'pledgeCents must be a non-negative whole number of cents.') {
            throw new Error(`Malformed input did not fail closed: ${JSON.stringify(malformed)}`);
          }
          NODE

          before_count="$(psql "$QA_SUPABASE_DB_URL" --no-psqlrc -Atqc \
            "select count(*) from public.mpgf_pledges where pool_proposal_id in ('71111111-1111-4111-8111-111111111111','72222222-2222-4222-8222-222222222222');")"
          test "$before_count" = '2'

          psql "$QA_SUPABASE_DB_URL" --no-psqlrc --set ON_ERROR_STOP=1 <<'SQL'
          insert into public.mpgf_pledges (
            id, pool_proposal_id, amount_cents, cadence, status,
            pledge_mode, real_money, contributor_label
          ) values (
            '73333333-3333-4333-8333-333333333333',
            '71111111-1111-4111-8111-111111111111',
            1000, 'one_time', 'pledged', 'pledge_only', false,
            'QA API state-mismatch contributor'
          );
          SQL

          curl --silent --show-error --dump-header /tmp/mismatch.headers \
            'http://127.0.0.1:3010/api/mpgf/pledge-impact?pool=qa-pool-pledge-impact-e2e&pledgeCents=3500' \
            > /tmp/mismatch.json
          node <<'NODE'
          const fs = require('node:fs');
          const mismatch = JSON.parse(fs.readFileSync('/tmp/mismatch.json', 'utf8'));
          if (mismatch.status !== 'unavailable' || mismatch.reason !== 'pool_state_mismatch') {
            throw new Error(`Changed live state did not invalidate the forecast: ${JSON.stringify(mismatch)}`);
          }
          if (mismatch.mechanicalEffect?.currentGapCents !== 819000) {
            throw new Error('Mismatch response did not preserve fresh live mechanical arithmetic.');
          }
          NODE

          after_count="$(psql "$QA_SUPABASE_DB_URL" --no-psqlrc -Atqc \
            "select count(*) from public.mpgf_pledges where pool_proposal_id in ('71111111-1111-4111-8111-111111111111','72222222-2222-4222-8222-222222222222');")"
          test "$after_count" = '3'
          cp /tmp/available.json persistent-qa-available.json
          cp /tmp/no-forecast.json persistent-qa-no-forecast.json
          cp /tmp/unmapped.json persistent-qa-unmapped.json
          cp /tmp/malformed.json persistent-qa-malformed.json
          cp /tmp/mismatch.json persistent-qa-state-mismatch.json

      - name: Clean the QA-only fixture and verify zero residue
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${QA_SUPABASE_DB_URL:-}" ]]; then
            exit 1
          fi
          psql "$QA_SUPABASE_DB_URL" --no-psqlrc --set ON_ERROR_STOP=1 <<'SQL' \
            2>&1 | tee persistent-fixture-cleanup.log
          begin;
          alter table public.mpgf_pledge_impact_forecast_audit_events disable trigger user;
          alter table public.mpgf_pledge_impact_forecast_snapshots disable trigger user;

          delete from public.mpgf_pledge_impact_forecast_audit_events
          where snapshot_id in (
            select id from public.mpgf_pledge_impact_forecast_snapshots
            where pool_public_key in (
              'qa-pool-pledge-impact-e2e',
              'qa-pool-pledge-impact-no-forecast'
            )
          );
          delete from public.mpgf_pledge_impact_forecast_snapshots
          where pool_public_key in (
            'qa-pool-pledge-impact-e2e',
            'qa-pool-pledge-impact-no-forecast'
          );

          alter table public.mpgf_pledge_impact_forecast_snapshots enable trigger user;
          alter table public.mpgf_pledge_impact_forecast_audit_events enable trigger user;

          delete from public.mpgf_pledge_impact_pool_map
          where pool_public_key in (
            'qa-pool-pledge-impact-e2e',
            'qa-pool-pledge-impact-no-forecast'
          );
          delete from public.mpgf_pledges
          where pool_proposal_id in (
            '71111111-1111-4111-8111-111111111111',
            '72222222-2222-4222-8222-222222222222'
          );
          delete from public.mpgf_pool_proposals
          where id in (
            '71111111-1111-4111-8111-111111111111',
            '72222222-2222-4222-8222-222222222222'
          );
          commit;
          SQL

          test "$(psql "$QA_SUPABASE_DB_URL" --no-psqlrc -Atqc \
            "select (select count(*) from public.mpgf_pledge_impact_pool_map where pool_public_key like 'qa-pool-pledge-impact-%') + (select count(*) from public.mpgf_pool_proposals where id in ('71111111-1111-4111-8111-111111111111','72222222-2222-4222-8222-222222222222')) + (select count(*) from public.mpgf_pledges where pool_proposal_id in ('71111111-1111-4111-8111-111111111111','72222222-2222-4222-8222-222222222222')); ")" = '0'
          test "$(psql "$QA_SUPABASE_DB_URL" --no-psqlrc -Atqc \
            "select count(*) from supabase_migrations.schema_migrations where version = '$MIGRATION_VERSION' and name = '$MIGRATION_NAME';")" = '1'
          if [[ -f /tmp/pr406-next.pid ]]; then
            kill "$(cat /tmp/pr406-next.pid)" 2>/dev/null || true
          fi

      - name: Upload persistent-QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr406-persistent-qa-${{ github.run_id }}
          path: |
            persistent-migration.log
            persistent-schema-verification.log
            persistent-schema-regression.log
            persistent-fixture-create.log
            persistent-qa-build.log
            persistent-qa-next.log
            persistent-qa-available.json
            persistent-qa-no-forecast.json
            persistent-qa-unmapped.json
            persistent-qa-malformed.json
            persistent-qa-state-mismatch.json
            persistent-fixture-cleanup.log
          if-no-files-found: warn
          retention-days: 30

      - name: Report success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Persistent MoralTrade QA validation passed in run \`$GITHUB_RUN_ID\`. Migration \`$MIGRATION_VERSION\` is registered and retained in QA. A production-shaped QA-only pool and forecast proved the exact local API's available response, causal estimate, separate allocated credit, 2.91× multiplier, 0.43% mechanical gap share, no-store behavior, no-forecast and unmapped fail-closed states, malformed-input rejection, no pledge/payment mutation, and live-state hash invalidation. The immutable fixture was then removed under a QA-only owner cleanup, and zero fixture residue was verified. PR remains draft; production is unchanged."

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Persistent PR #406 QA validation failed in run \`$GITHUB_RUN_ID\`. The additive migration may have been retained if its atomic apply step succeeded; the QA-only fixture cleanup ran under \`if: always()\`. Inspect the artifact before any further release action. Production was not touched."
