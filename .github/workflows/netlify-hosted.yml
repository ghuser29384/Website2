name: Netlify one approved hosted fixture test
on:
  push:
    branches: [build/netlify-hosted-20261021]
permissions:
  contents: read
concurrency:
  group: netlify-hosted-20261021
  cancel-in-progress: false
jobs:
  hosted:
    if: github.repository == 'ghuser29384/Website2' && github.ref == 'refs/heads/build/netlify-hosted-20261021' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
      - name: Verify approved scope
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 893359134c83ec76b888e847231a7c03892736b5
          git diff --check HEAD^ HEAD
          node --input-type=module -e 'import assert from "node:assert/strict"; import {execFileSync} from "node:child_process"; import {buildVercelProjectConfig} from "./scripts/vercel-project-config.mjs"; assert.equal(buildVercelProjectConfig().git.deploymentEnabled,false); assert(execFileSync("git",["diff","--name-only","HEAD^","HEAD"],{encoding:"utf8"}).trim().split("\n").every(f=>f===".github/workflows/netlify-hosted.yml"||f.startsWith("scripts/netlify-hosted/")));'
      - name: Test routing and isolation without credentials
        run: node --test scripts/netlify-hosted/runtime-isolation.test.mjs scripts/netlify-hosted/routing-safety.test.mjs scripts/netlify-hosted/cli-diagnostic.test.mjs
      - name: Install approved runner-only CLI without deployment credential
        run: npm install --prefix "$RUNNER_TEMP/netlify-tool" --no-audit --no-fund netlify-cli@27.14.1
      - name: Package fixture without deployment credential
        working-directory: scripts/netlify-hosted
        run: |
          npm ls --prefix "$RUNNER_TEMP/netlify-tool" @netlify/zip-it-and-ship-it --all
          mkdir -p public
          "$RUNNER_TEMP/netlify-tool/node_modules/.bin/netlify" functions:build --src netlify/functions --functions packaged-functions
          node manifest-preflight.mjs packaged-functions/manifest.json > "$RUNNER_TEMP/netlify-manifest-preflight.json"
      - name: Verify exact prior draft and attempt one new draft deployment
        id: deploy
        working-directory: scripts/netlify-hosted
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_SYNTHETIC_TEST_TOKEN }}
          NETLIFY_BIN: ${{ runner.temp }}/netlify-tool/node_modules/.bin/netlify
          NETLIFY_TELEMETRY_DISABLED: '1'
        run: node deploy.mjs
      - name: Report non-sensitive evidence
        if: always()
        run: |
          for file in "$RUNNER_TEMP/netlify-hosted-deployment.json" "$RUNNER_TEMP/netlify-manifest-preflight.json"; do
            if test -f "$file"; then cat "$file" >> "$GITHUB_STEP_SUMMARY"; fi
          done
