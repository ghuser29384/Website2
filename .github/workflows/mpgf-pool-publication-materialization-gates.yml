name: MPGF pool publication materialization gates

on:
  pull_request:
    paths:
      - ".github/workflows/mpgf-pool-publication-materialization-gates.yml"
      - "src/lib/mpgf/pool-publication-materialization.test.ts"
      - "supabase/migrations/20260806143000_mpgf_pool_publication_materialization.sql"
      - "supabase/tests/mpgf_pool_publication_materialization.sql"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mpgf-pool-publication-materialization-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-gates:
    name: Exact-head source, test, lint, typecheck, and build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      NEXT_PUBLIC_SITE_URL: https://www.moraltrade.org
      VERCEL: "1"
      VERCEL_ENV: preview

    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Verify the exact candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          git merge-base --is-ancestor "$EXPECTED_BASE_SHA" HEAD
          {
            printf 'commit=%s\n' "$(git rev-parse HEAD)"
            printf 'tree=%s\n' "$(git rev-parse HEAD^{tree})"
            sha256sum \
              supabase/migrations/20260806143000_mpgf_pool_publication_materialization.sql \
              supabase/tests/mpgf_pool_publication_materialization.sql \
              src/lib/mpgf/pool-publication-materialization.test.ts
          } | tee mpgf-pool-publication-exact-head.txt

      - name: Install dependencies
        run: npm ci

      - name: Run focused publication contracts
        run: |
          set -euo pipefail
          node --import tsx --test \
            src/lib/mpgf/pool-publication-materialization.test.ts \
            | tee mpgf-pool-publication-focused.log

      - name: Run repository tests
        run: |
          set -euo pipefail
          npm test | tee mpgf-pool-publication-repository-tests.log

      - name: Run repository lint
        run: |
          set -euo pipefail
          npm run lint | tee mpgf-pool-publication-lint.log

      - name: Run TypeScript
        run: |
          set -euo pipefail
          npx tsc --noEmit | tee mpgf-pool-publication-typecheck.log

      - name: Build production application
        run: |
          set -euo pipefail
          npm run build | tee mpgf-pool-publication-build.log

      - name: Verify exact diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          git diff --check "$EXPECTED_BASE_SHA" "$EXPECTED_HEAD_SHA"
          git diff --name-only "$EXPECTED_BASE_SHA" "$EXPECTED_HEAD_SHA" | sort \
            | tee mpgf-pool-publication-diff-files.txt

      - name: Upload source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mpgf-pool-publication-source-${{ github.run_id }}
          path: |
            mpgf-pool-publication-*.txt
            mpgf-pool-publication-*.log
          if-no-files-found: warn
          retention-days: 14

  isolated-qa:
    name: Transactional publication, authorization, visibility, and residue proof
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    needs: source-gates
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      EXPECTED_QA_POOLER_HOST: aws-0-us-west-1.pooler.supabase.com
      EXPECTED_QA_REF: hvmxfjjbdcgjjudmthdz
      PGSSLMODE: require
      QA_SUPABASE_DB_URL: ${{ secrets.QA_SUPABASE_DB_URL }}

    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact isolated-QA target
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test -n "${QA_SUPABASE_DB_URL:-}"
          python3 - <<'PY'
          import os
          from urllib.parse import parse_qs, urlparse

          parsed = urlparse(os.environ["QA_SUPABASE_DB_URL"])
          ssl_modes = parse_qs(parsed.query).get("sslmode", ["require"])
          valid = (
              parsed.scheme in {"postgres", "postgresql"}
              and os.environ["EXPECTED_QA_REF"] in (parsed.username or "")
              and parsed.hostname == os.environ["EXPECTED_QA_POOLER_HOST"]
              and parsed.port == 5432
              and parsed.path == "/postgres"
              and ssl_modes == ["require"]
              and bool(parsed.password)
          )
          if not valid:
              raise SystemExit("Refusing a database URL outside the exact TLS-only MoralTrade QA target.")
          PY

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes postgresql-client > /dev/null

      - name: Compile migration in rollback-only transaction
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          source = Path("supabase/migrations/20260806143000_mpgf_pool_publication_materialization.sql").read_text()
          if not source.rstrip().endswith("commit;"):
              raise SystemExit("Migration does not end in commit;")
          Path("mpgf-pool-publication-rollback.sql").write_text(
              source.rstrip()[:-len("commit;")] + "rollback;\n"
          )
          PY
          psql "$QA_SUPABASE_DB_URL" \
            --no-psqlrc \
            --set ON_ERROR_STOP=1 \
            --file mpgf-pool-publication-rollback.sql \
            | tee mpgf-pool-publication-compile.log

      - name: Apply additive publication migration to isolated QA
        shell: bash
        run: |
          set -euo pipefail
          sha256sum supabase/migrations/20260806143000_mpgf_pool_publication_materialization.sql \
            | tee mpgf-pool-publication-migration.sha256
          psql "$QA_SUPABASE_DB_URL" \
            --no-psqlrc \
            --set ON_ERROR_STOP=1 \
            --file supabase/migrations/20260806143000_mpgf_pool_publication_materialization.sql \
            | tee mpgf-pool-publication-apply.log

      - name: Run rollback-only multi-role publication regression
        shell: bash
        run: |
          set -euo pipefail
          psql "$QA_SUPABASE_DB_URL" \
            --no-psqlrc \
            --set ON_ERROR_STOP=1 \
            --file supabase/tests/mpgf_pool_publication_materialization.sql \
            | tee mpgf-pool-publication-regression.log

      - name: Prove zero publication QA residue
        shell: bash
        run: |
          set -euo pipefail
          residue="$(psql "$QA_SUPABASE_DB_URL" --no-psqlrc --tuples-only --no-align --set ON_ERROR_STOP=1 <<'SQL'
          select
            (select count(*) from auth.users where id in (
              '8a111111-1111-4111-8111-111111111111',
              '8b222222-2222-4222-8222-222222222222',
              '8c333333-3333-4333-8333-333333333333'
            ))
            + (select count(*) from public.profiles where id in (
              '8a111111-1111-4111-8111-111111111111',
              '8b222222-2222-4222-8222-222222222222',
              '8c333333-3333-4333-8333-333333333333'
            ))
            + (select count(*) from public.mpgf_pool_proposals where id in (
              '8d444444-4444-4444-8444-444444444444',
              '8d555555-5555-4555-8555-555555555555',
              '8d666666-6666-4666-8666-666666666666',
              '8d777777-7777-4777-8777-777777777777'
            ))
            + (select count(*) from public.mpgf_public_goods_campaigns where round_id = 'qa-publish-round-20260806')
            + (select count(*) from public.mpgf_public_goods_rounds where id = 'qa-publish-round-20260806')
            + (select count(*) from public.mpgf_public_goods_match_pools where id = 'qa-publish-match-20260806')
            + (select count(*) from public.moral_trade_create_submissions where id = '8e888888-8888-4888-8888-888888888888');
          SQL
          )"
          printf 'residue_count=%s\n' "$residue" | tee mpgf-pool-publication-zero-residue.txt
          test "$residue" = "0"

      - name: Record installed publication objects
        shell: bash
        run: |
          set -euo pipefail
          psql "$QA_SUPABASE_DB_URL" \
            --no-psqlrc \
            --set ON_ERROR_STOP=1 \
            --pset pager=off <<'SQL' | tee mpgf-pool-publication-schema-proof.txt
          select to_regprocedure('public.mpgf_publish_pool_proposal(uuid,text,text,uuid,text)') as publish_function;
          select indexname
          from pg_indexes
          where schemaname = 'public'
            and indexname = 'mpgf_public_goods_campaigns_one_per_pool_proposal_idx';
          select tgname
          from pg_trigger
          where not tgisinternal
            and tgname = 'mpgf_public_goods_campaigns_published_terms_guard';
          select has_function_privilege(
            'authenticated',
            'public.mpgf_publish_pool_proposal(uuid,text,text,uuid,text)',
            'EXECUTE'
          ) as authenticated_can_publish;
          SQL

      - name: Upload isolated-QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mpgf-pool-publication-qa-${{ github.run_id }}
          path: |
            mpgf-pool-publication-*.log
            mpgf-pool-publication-*.txt
            mpgf-pool-publication-*.sha256
          if-no-files-found: warn
          retention-days: 14
