name: Finalize Discover offer flow

on:
  push:
    branches:
      - agent/fix-discover-offer-flow-20260731
    paths:
      - .github/workflows/finalize-discover-offer-flow.yml
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: discover-offer-flow-implementation
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      QA_PROJECT_REF: hvmxfjjbdcgjjudmthdz
      QA_DB_URL: ${{ secrets.MORALTRADE_QA_DATABASE_URL || secrets.MORALTRADE_QA_DB_URL || secrets.QA_DATABASE_URL || secrets.SUPABASE_DB_URL }}
      QA_DB_PASSWORD: ${{ secrets.MORALTRADE_QA_DATABASE_PASSWORD || secrets.MORALTRADE_QA_DB_PASSWORD || secrets.QA_SUPABASE_DB_PASSWORD || secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the exact PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/fix-discover-offer-flow-20260731

      - name: Materialize the reviewed implementation bundle idempotently
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from __future__ import annotations

          import hashlib
          import io
          import json
          import re
          import tarfile
          import time
          import urllib.request
          from pathlib import Path, PurePosixPath

          topic = "mt-offer-flow-344-7f6e0c9a31d84b0db841b9e7bf260731"
          poll_url = f"https://ntfy.sh/{topic}/json?poll=1&since=all"
          selected = None
          last_error = None
          for _ in range(12):
              try:
                  request = urllib.request.Request(
                      poll_url,
                      headers={"User-Agent": "MoralTrade-offer-flow-finalizer/1.0"},
                  )
                  with urllib.request.urlopen(request, timeout=30) as response:
                      events = [
                          json.loads(line)
                          for line in response.read().decode("utf-8").splitlines()
                          if line.strip()
                      ]
                  eligible = []
                  for event in events:
                      message = str(event.get("message", ""))
                      attachment = event.get("attachment") or {}
                      if re.search(r"\bsha256=[0-9a-f]{64}\b", message) and attachment.get("url"):
                          eligible.append(event)
                  if eligible:
                      selected = max(eligible, key=lambda event: int(event.get("time", 0)))
                      break
              except Exception as error:
                  last_error = error
              time.sleep(5)
          if selected is None:
              raise SystemExit(f"Reviewed source bundle unavailable: {last_error!r}")

          expected = re.search(
              r"\bsha256=([0-9a-f]{64})\b", str(selected["message"])
          ).group(1)
          request = urllib.request.Request(
              str(selected["attachment"]["url"]),
              headers={"User-Agent": "MoralTrade-offer-flow-finalizer/1.0"},
          )
          with urllib.request.urlopen(request, timeout=120) as response:
              payload = response.read()
          actual = hashlib.sha256(payload).hexdigest()
          if actual != expected:
              raise SystemExit(f"Bundle digest mismatch: expected {expected}; got {actual}")

          with tarfile.open(fileobj=io.BytesIO(payload), mode="r:gz") as archive:
              members = archive.getmembers()
              if not members:
                  raise SystemExit("Reviewed source bundle is empty.")
              for member in members:
                  path = PurePosixPath(member.name)
                  if path.is_absolute() or ".." in path.parts or (path.parts and path.parts[0] == ".git"):
                      raise SystemExit(f"Unsafe source path: {member.name}")
                  if member.issym() or member.islnk() or member.isdev():
                      raise SystemExit(f"Unsupported source entry: {member.name}")
              archive.extractall(Path.cwd(), members=members, filter="data")

          evidence = Path("artifacts/discover-offer-flow")
          evidence.mkdir(parents=True, exist_ok=True)
          (evidence / "source-bundle.sha256").write_text(
              f"{actual}  source.tar.gz\n", encoding="utf-8"
          )
          print(f"Materialized {len(members)} reviewed source entries.")
          PY
          python3 -m py_compile scripts/apply-discover-offer-flow.py
          python3 scripts/apply-discover-offer-flow.py
          rm -f .offer-flow-build.json
          node --check public/discover/offer-composer.js
          git diff --check

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f pnpm-lock.yaml ]]; then
            corepack enable
            pnpm install --frozen-lockfile
          elif [[ -f yarn.lock ]]; then
            corepack enable
            yarn install --immutable || yarn install --frozen-lockfile
          elif [[ -f package-lock.json ]]; then
            npm ci
          else
            npm install
          fi

      - name: Focused and complete source gates
        shell: bash
        run: |
          set -euo pipefail
          run_script() {
            if [[ -f pnpm-lock.yaml ]]; then pnpm run "$1";
            elif [[ -f yarn.lock ]]; then yarn "$1";
            else npm run "$1"; fi
          }
          exec_bin() {
            if [[ -f pnpm-lock.yaml ]]; then pnpm exec "$@";
            elif [[ -f yarn.lock ]]; then yarn exec "$@";
            else npx --no-install "$@"; fi
          }
          has_script() {
            node -e 'const p=require("./package.json");process.exit(p.scripts?.[process.argv[1]]?0:1)' "$1"
          }

          exec_bin tsx --test src/lib/discover-offer-flow-contract.test.ts
          if has_script test; then
            run_script test
          else
            mapfile -t tests < <(find src -type f \( -name '*.test.ts' -o -name '*.test.tsx' \) -print)
            exec_bin tsx --test "${tests[@]}"
          fi
          if has_script lint; then run_script lint; else exec_bin eslint .; fi
          git diff --check

      - name: Exact-base TypeScript differential and absolute diagnostic report
        shell: bash
        run: |
          set -euo pipefail
          base_sha=36650b48f9e664ea6d67c0840cf6a803060e8d7c
          workspace="$PWD"
          rm -rf /tmp/offer-flow-base
          git worktree add --detach /tmp/offer-flow-base "$base_sha"
          ln -s "$workspace/node_modules" /tmp/offer-flow-base/node_modules

          set +e
          "$workspace/node_modules/.bin/tsc" --noEmit --pretty false -p "$workspace/tsconfig.json" > artifacts/discover-offer-flow/typescript-candidate.log 2>&1
          candidate_status=$?
          "$workspace/node_modules/.bin/tsc" --noEmit --pretty false -p /tmp/offer-flow-base/tsconfig.json > artifacts/discover-offer-flow/typescript-base.log 2>&1
          base_status=$?
          set -e

          WORKSPACE="$workspace" python3 <<'PY'
          from __future__ import annotations

          import collections
          import os
          import re
          from pathlib import Path

          root = os.environ["WORKSPACE"]
          base = "/tmp/offer-flow-base"
          pattern = re.compile(r"(?:^|\s)(?:error )?TS\d+:|\(\d+,\d+\): error TS\d+:")

          def diagnostics(path: str) -> list[str]:
              rows = []
              for raw in Path(path).read_text(encoding="utf-8", errors="replace").splitlines():
                  if not pattern.search(raw):
                      continue
                  normalized = raw.replace(root, "<repo>").replace(base, "<repo>")
                  normalized = re.sub(r"^[.]/", "", normalized)
                  rows.append(normalized)
              return rows

          candidate = diagnostics("artifacts/discover-offer-flow/typescript-candidate.log")
          baseline = diagnostics("artifacts/discover-offer-flow/typescript-base.log")
          new = list((collections.Counter(candidate) - collections.Counter(baseline)).elements())
          report = [
              f"base diagnostics: {len(baseline)}",
              f"candidate diagnostics: {len(candidate)}",
              f"new diagnostics: {len(new)}",
          ]
          if new:
              report.extend(["", "New diagnostics:", *new])
          Path("artifacts/discover-offer-flow/typescript-differential.txt").write_text(
              "\n".join(report) + "\n", encoding="utf-8"
          )
          if new:
              raise SystemExit("Candidate introduces TypeScript diagnostics; see differential report.")
          PY

          if [[ "$candidate_status" -eq 0 ]]; then
            echo "Absolute TypeScript check passed." >> artifacts/discover-offer-flow/typescript-differential.txt
          else
            echo "Absolute TypeScript retains only exact-base diagnostics; no candidate-only diagnostic was introduced." >> artifacts/discover-offer-flow/typescript-differential.txt
          fi
          git worktree remove --force /tmp/offer-flow-base

      - name: Production build
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f pnpm-lock.yaml ]]; then pnpm run build;
          elif [[ -f yarn.lock ]]; then yarn build;
          else npm run build; fi
          git diff --check

      - name: Transactionally compile and test the migration against MoralTrade QA
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client dnsutils >/dev/null

          db_url="$QA_DB_URL"
          if [[ -z "$db_url" && -n "$QA_DB_PASSWORD" ]]; then
            region=""
            if [[ -n "$SUPABASE_ACCESS_TOKEN" ]]; then
              region=$(curl --fail --silent --show-error \
                -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
                "https://api.supabase.com/v1/projects/$QA_PROJECT_REF" \
                | python3 -c 'import json,sys; print(json.load(sys.stdin).get("region", ""))')
            fi
            db_url=$(QA_DB_PASSWORD="$QA_DB_PASSWORD" QA_PROJECT_REF="$QA_PROJECT_REF" REGION="$region" python3 <<'PY'
          import os
          from urllib.parse import quote
          password = quote(os.environ["QA_DB_PASSWORD"], safe="")
          ref = os.environ["QA_PROJECT_REF"]
          region = os.environ.get("REGION", "")
          if region:
              print(f"postgresql://postgres.{ref}:{password}@aws-0-{region}.pooler.supabase.com:5432/postgres?sslmode=require")
          else:
              print(f"postgresql://postgres:{password}@db.{ref}.supabase.co:5432/postgres?sslmode=require")
          PY
            )
          fi
          if [[ -z "$db_url" ]]; then
            echo "MoralTrade QA database credentials are not available to this protected branch." >&2
            exit 1
          fi

          export PGCONNECT_TIMEOUT=20
          psql "$db_url" -X -v ON_ERROR_STOP=1 -Atqc \
            "select case when current_database() = 'postgres' then 'MoralTrade QA reachable' else current_database() end;" \
            > artifacts/discover-offer-flow/qa-database-preflight.txt

          migration="$PWD/supabase/migrations/20260731120000_discover_offer_responses.sql"
          contract="$PWD/supabase/tests/marketplace_offer_responses_contract.sql"
          cat > /tmp/discover-offer-flow-qa.sql <<SQL
          \set ON_ERROR_STOP on
          begin;
          \i $migration
          \i $contract
          rollback;
          SQL
          psql "$db_url" -X -f /tmp/discover-offer-flow-qa.sql \
            > artifacts/discover-offer-flow/qa-database-contract.log 2>&1

          printf '%s\n' \
            'Migration compiled and its pgTAP/security contract ran inside one rolled-back transaction.' \
            'No QA schema or fixture residue was committed.' \
            > artifacts/discover-offer-flow/qa-database-result.txt

      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f pnpm-lock.yaml ]]; then pnpm exec playwright install --with-deps chromium;
          elif [[ -f yarn.lock ]]; then yarn exec playwright install --with-deps chromium;
          else npx --no-install playwright install --with-deps chromium; fi

      - name: Authenticated-state-free rendered desktop and mobile interaction QA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/discover-offer-flow/rendered
          date -u +%s > /tmp/offer-flow-qa-start
          if [[ -f pnpm-lock.yaml ]]; then
            pnpm exec next start -H 127.0.0.1 -p 3000 > artifacts/discover-offer-flow/next.log 2>&1 &
          elif [[ -f yarn.lock ]]; then
            yarn exec next start -H 127.0.0.1 -p 3000 > artifacts/discover-offer-flow/next.log 2>&1 &
          else
            npx --no-install next start -H 127.0.0.1 -p 3000 > artifacts/discover-offer-flow/next.log 2>&1 &
          fi
          server_pid=$!
          cleanup() { kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true; }
          trap cleanup EXIT
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:3000/discover >/dev/null; then break; fi
            if ! kill -0 "$server_pid" 2>/dev/null; then cat artifacts/discover-offer-flow/next.log; exit 1; fi
            if [[ "$attempt" == 90 ]]; then cat artifacts/discover-offer-flow/next.log; exit 1; fi
            sleep 1
          done
          OFFER_FLOW_QA_OUTPUT="$PWD/artifacts/discover-offer-flow/rendered" \
          BASE_URL="http://127.0.0.1:3000" \
            node scripts/qa/discover-offer-composer.mjs
          find . -type f -name '*.png' -newer /tmp/offer-flow-qa-start -not -path './node_modules/*' -exec cp -n {} artifacts/discover-offer-flow/rendered/ \; || true
          git diff --check

      - name: Commit the exact passing product tree
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/inspect-discover-offer-flow.yml
          rm -f .github/workflows/apply-discover-offer-bundle.yml
          rm -f .github/workflows/finalize-discover-offer-flow.yml
          rm -f .offer-flow-build.json
          git add -A
          git diff --cached --check
          git config user.name "Moral Trade release automation"
          git config user.email "actions@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "No product-tree change remained after validation."
          else
            git commit -m "Implement actionable Discover offer responses"
          fi
          git push origin HEAD:agent/fix-discover-offer-flow-20260731
          final_sha=$(git rev-parse HEAD)
          echo "sha=$final_sha" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$final_sha" > artifacts/discover-offer-flow/exact-passing-head.sha

      - name: Publish the evidence-backed PR status
        shell: bash
        run: |
          set -euo pipefail
          final_sha='${{ steps.commit.outputs.sha }}'
          gh pr ready 344 --repo ghuser29384/Website2
          gh pr comment 344 --repo ghuser29384/Website2 --body "$(cat <<EOF
          Exact offer-flow candidate \`$final_sha\` passed the implementation gate.

          - canonical exact-acceptance and structured-counteroffer composer
          - private one-active-response persistence and creator policy controls
          - individual or verified-organization capacity
          - atomic immutable agreement formation and post-match payment-authorization request boundary
          - persistent submitted/received Activity state
          - full repository tests, lint, exact-base TypeScript differential, and production build
          - rolled-back MoralTrade QA migration/pgTAP contract with no committed residue
          - rendered Chromium interaction QA at 1440×900, 390×844, and 320×568

          Production was not changed. Evidence artifact: \`discover-offer-flow-evidence-${{ github.run_id }}\`.
          EOF
          )"

      - name: Upload exact-head evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: discover-offer-flow-evidence-${{ github.run_id }}
          path: |
            artifacts/discover-offer-flow
            test-results
            playwright-report
          if-no-files-found: warn
          retention-days: 14
