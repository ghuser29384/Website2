name: Temporary export Co-Act and Co-Fund v2 source

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: export-co-act-co-fund-v2-source
  cancel-in-progress: false

jobs:
  export:
    if: >-
      github.repository == 'ghuser29384/Website2' &&
      github.event.issue.pull_request != null &&
      github.event.issue.number == 392 &&
      github.event.comment.body == '/export-co-act-co-fund-v2-source-20260801'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/co-act-co-fund-create-v2-20260801
          fetch-depth: 0

      - name: Verify and archive tracked source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = 'feature/co-act-co-fund-create-v2-20260801'
          git status --short
          git archive --format=tar.gz --output=/tmp/co-act-co-fund-v2-source.tar.gz HEAD
          sha256sum /tmp/co-act-co-fund-v2-source.tar.gz | tee /tmp/co-act-co-fund-v2-source.sha256
          git rev-parse HEAD | tee /tmp/co-act-co-fund-v2-head.txt
          git rev-parse origin/main | tee /tmp/co-act-co-fund-v2-main.txt

      - name: Upload source and metadata
        uses: actions/upload-artifact@v4
        with:
          name: co-act-co-fund-v2-source-${{ github.run_id }}
          path: |
            /tmp/co-act-co-fund-v2-source.tar.gz
            /tmp/co-act-co-fund-v2-source.sha256
            /tmp/co-act-co-fund-v2-head.txt
            /tmp/co-act-co-fund-v2-main.txt
          retention-days: 1

      - name: Report artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          head_sha="$(cat /tmp/co-act-co-fund-v2-head.txt)"
          main_sha="$(cat /tmp/co-act-co-fund-v2-main.txt)"
          gh pr comment 392 --repo "$GITHUB_REPOSITORY" --body "Co-Act/Co-Fund v2 source export succeeded. Run: $GITHUB_RUN_ID. Artifact: \`co-act-co-fund-v2-source-$GITHUB_RUN_ID\`. Branch head: \`$head_sha\`. Observed main: \`$main_sha\`."
