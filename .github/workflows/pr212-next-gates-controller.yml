name: PR 212 next-gates controller

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: pr212-next-gates-controller
  cancel-in-progress: true

jobs:
  integrate-and-push:
    if: github.event.issue.pull_request != null && github.event.issue.number == 212 && github.event.comment.body == '/run-pr212-next-gates-20260801-b4e71c92'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_BRANCH: feat/institutional-trade-system
      EXPECTED_FEATURE_HEAD: c224595fe13b5fe39a1690938208d0a482714df1
      QA_WORKFLOW_PATH: .github/workflows/institutional-trade-qa.yml
      CONTROLLER_PATH: .github/workflows/pr212-next-gates-controller.yml
    steps:
      - name: Check out the exact feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/institutional-trade-system
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Integrate current main and make the QA gate durable
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(git rev-parse HEAD)" != "$EXPECTED_FEATURE_HEAD" ]]; then
            echo "Feature head moved; refusing to patch an uninspected commit." >&2
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --no-tags origin main
          integrated_main="$(git rev-parse origin/main)"
          git merge --no-ff origin/main -m "Merge main ${integrated_main} into institutional trade branch"
          git rm --ignore-unmatch "$CONTROLLER_PATH"

          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/institutional-trade-qa.yml')
          text = path.read_text()

          permissions_old = '''permissions:
  contents: read
'''
          permissions_new = '''permissions:
  contents: read
  issues: write
  pull-requests: write
'''
          if 'pull-requests: write' not in text:
              if text.count(permissions_old) != 1:
                  raise SystemExit('Could not locate the QA workflow permissions block.')
              text = text.replace(permissions_old, permissions_new)

          test_line = "            src/institutional-pool-record-trigger.test.ts \\\n"
          if test_line not in text:
              anchor = "            src/institutional-trade-migration.test.ts \\\n"
              if text.count(anchor) != 1:
                  raise SystemExit('Could not locate the source-contract test insertion point.')
              text = text.replace(anchor, anchor + test_line)

          setup_old = '''          migration=supabase/migrations/20260726123000_institutional_trade_system.sql
          sha256sum "$migration" | tee institutional-qa-artifacts/institutional-migration.sha256
'''
          setup_new = '''          migration=supabase/migrations/20260726123000_institutional_trade_system.sql
          pool_patch=supabase/migrations/20260731173000_fix_institutional_pool_record_status_access.sql
          sha256sum "$migration" | tee institutional-qa-artifacts/institutional-migration.sha256
          sha256sum "$pool_patch" | tee institutional-qa-artifacts/institutional-pool-trigger-patch.sha256
'''
          if 'pool_patch=supabase/migrations/20260731173000_fix_institutional_pool_record_status_access.sql' not in text:
              if text.count(setup_old) != 1:
                  raise SystemExit('Could not locate the migration setup block.')
              text = text.replace(setup_old, setup_new)

          apply_old = '''          fi
          psql "$QA_SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -P pager=off <<'SQL' | tee institutional-qa-artifacts/institutional-schema-inventory.txt
'''
          apply_new = '''          fi
          echo "Compiling the additive pool-trigger migration inside a rollback-only transaction."
          psql "$QA_SUPABASE_DB_URL" -v ON_ERROR_STOP=1 <<SQL
          begin;
          \\i $pool_patch
          rollback;
          SQL
          echo "Applying the additive pool-trigger migration atomically to isolated QA."
          psql "$QA_SUPABASE_DB_URL" -v ON_ERROR_STOP=1 --single-transaction --file "$pool_patch"
          psql "$QA_SUPABASE_DB_URL" -Atqc "select pg_get_functiondef('public.institutional_validate_pool_record()'::regprocedure)" \
            | tee institutional-qa-artifacts/institutional-pool-trigger-definition.sql \
            | grep -F "to_jsonb(new)->>'status'" >/dev/null
          psql "$QA_SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -P pager=off <<'SQL' | tee institutional-qa-artifacts/institutional-schema-inventory.txt
'''
          if 'Applying the additive pool-trigger migration atomically to isolated QA.' not in text:
              if text.count(apply_old) != 1:
                  raise SystemExit('Could not locate the migration-to-inventory boundary.')
              text = text.replace(apply_old, apply_new)

          marker = '<!-- pr212-institutional-qa-run -->'
          if marker not in text:
              status_step = '''

      - name: Publish institutional QA run status to PR 212
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh pr comment 212 --repo "$GITHUB_REPOSITORY" --body "<!-- pr212-institutional-qa-run -->
          ## PR #212 institutional QA run

          - Run: [$GITHUB_RUN_ID]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)
          - Head: \`$GITHUB_SHA\`
          - Ref: \`$GITHUB_REF\`
          - Job status: **${{ job.status }}**
          - Evidence artifact upload is attempted before this status is published.
          - Production database migrations and institutional feature activation remain blocked."
'''
              text = text.rstrip() + status_step + '\n'

          path.write_text(text)
          PY

          node --import tsx --test src/institutional-pool-record-trigger.test.ts
          node --check .github/scripts/institutional-trade-qa-e2e.mjs
          node --check .github/scripts/pr212-targeted-regression-qa.mjs
          git diff --check

          git add -A
          git commit -m 'Integrate main and harden institutional QA migration replay'
          final_head="$(git rev-parse HEAD)"
          git push origin "HEAD:${TARGET_BRANCH}"
          gh pr comment 212 --repo "$GITHUB_REPOSITORY" --body "<!-- pr212-current-main-integration -->
          Integrated current main \`$integrated_main\` into PR #212 and pushed durable QA-gate head \`$final_head\`. The full institutional QA workflow has been triggered by this push. No production database migration or institutional feature activation was attempted."

      - name: Report controller failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment 212 --repo "$GITHUB_REPOSITORY" --body "<!-- pr212-controller-failure -->
          PR #212 next-gates controller failed before producing a verified exact-head QA result. No production database migration or institutional feature activation was attempted."

      - name: Remove this one-use controller from main
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          controller_sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${CONTROLLER_PATH}?ref=main" --jq .sha 2>/dev/null || true)"
          if [[ -n "$controller_sha" ]]; then
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/contents/${CONTROLLER_PATH}" \
              -f message='Remove temporary PR 212 next-gates controller' \
              -f sha="$controller_sha" \
              -f branch=main >/dev/null
          fi
