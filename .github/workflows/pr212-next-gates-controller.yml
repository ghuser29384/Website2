name: PR 212 next-gates controller

on:
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: pr212-next-gates-controller
  cancel-in-progress: false

jobs:
  integrate-repair-and-verify:
    if: >-
      github.event.issue.pull_request != null &&
      github.event.issue.number == 212 &&
      github.event.comment.body == '/run-pr212-next-gates-20260801-7c8f3b2e'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_BRANCH: feat/institutional-trade-system
      EXPECTED_FEATURE_HEAD: c224595fe13b5fe39a1690938208d0a482714df1
      INTEGRATION_BASE_SHA: 8181eed1c0cf075f01ebd22c88d4a8cce441c19d
      QA_WORKFLOW_PATH: .github/workflows/institutional-trade-qa.yml
      CONTROLLER_PATH: .github/workflows/pr212-next-gates-controller.yml
      POOL_PATCH: supabase/migrations/20260731173000_fix_institutional_pool_record_status_access.sql
      POOL_TRIGGER_TEST: src/institutional-pool-record-trigger.test.ts
    steps:
      - name: Check out the exact feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/institutional-trade-system
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Verify exact inputs and integrate the last non-controller main head
        id: integrate
        shell: bash
        run: |
          set -euo pipefail
          feature_head="$(git rev-parse HEAD)"
          if [[ "$feature_head" != "$EXPECTED_FEATURE_HEAD" ]]; then
            echo "Feature head moved: expected $EXPECTED_FEATURE_HEAD, found $feature_head" >&2
            exit 1
          fi
          git fetch --no-tags origin main
          git cat-file -e "${INTEGRATION_BASE_SHA}^{commit}"
          if ! git merge-base --is-ancestor "$INTEGRATION_BASE_SHA" origin/main; then
            echo "The approved integration base is no longer an ancestor of main." >&2
            exit 1
          fi
          for required in "$QA_WORKFLOW_PATH" "$POOL_PATCH" "$POOL_TRIGGER_TEST"; do
            test -f "$required" || { echo "Missing required branch file: $required" >&2; exit 1; }
          done

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-ff "$INTEGRATION_BASE_SHA" -m 'Merge current functional main into institutional trade branch'
          echo "integrated_head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Make institutional QA replay the additive migration and its regression test
        id: workflow_patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/institutional-trade-qa.yml')
          text = path.read_text()

          test_line = "            src/institutional-pool-record-trigger.test.ts \\\n"
          if test_line not in text:
              anchor = "            src/institutional-trade-migration.test.ts \\\n"
              if text.count(anchor) != 1:
                  raise SystemExit('Could not locate the unique institutional source-test insertion point.')
              text = text.replace(anchor, anchor + test_line)

          setup_old = '''          migration=supabase/migrations/20260726123000_institutional_trade_system.sql
          sha256sum "$migration" | tee institutional-qa-artifacts/institutional-migration.sha256
'''
          setup_new = '''          migration=supabase/migrations/20260726123000_institutional_trade_system.sql
          pool_patch=supabase/migrations/20260731173000_fix_institutional_pool_record_status_access.sql
          sha256sum "$migration" | tee institutional-qa-artifacts/institutional-migration.sha256
          sha256sum "$pool_patch" | tee institutional-qa-artifacts/institutional-pool-trigger-patch.sha256
'''
          if 'pool_patch=supabase/migrations/20260731173000_fix_institutional_pool_record_status_access.sql' not in text:
              if text.count(setup_old) != 1:
                  raise SystemExit('Could not locate the unique institutional migration setup block.')
              text = text.replace(setup_old, setup_new)

          apply_old = '''          fi
          psql "$QA_SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -P pager=off <<'SQL' | tee institutional-qa-artifacts/institutional-schema-inventory.txt
'''
          apply_new = '''          fi
          echo "Compiling the additive pool-trigger migration inside a rollback-only transaction."
          psql "$QA_SUPABASE_DB_URL" -v ON_ERROR_STOP=1 <<SQL
          begin;
          \\i $pool_patch
          rollback;
          SQL
          echo "Applying the additive pool-trigger migration atomically to isolated QA."
          psql "$QA_SUPABASE_DB_URL" -v ON_ERROR_STOP=1 --single-transaction --file "$pool_patch"
          psql "$QA_SUPABASE_DB_URL" -Atqc "select pg_get_functiondef('public.institutional_validate_pool_record()'::regprocedure)" \
            | tee institutional-qa-artifacts/institutional-pool-trigger-definition.sql \
            | grep -F "to_jsonb(new)->>'status'" >/dev/null
          psql "$QA_SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -P pager=off <<'SQL' | tee institutional-qa-artifacts/institutional-schema-inventory.txt
'''
          if 'Applying the additive pool-trigger migration atomically to isolated QA.' not in text:
              if text.count(apply_old) != 1:
                  raise SystemExit('Could not locate the unique migration-to-inventory boundary.')
              text = text.replace(apply_old, apply_new)

          path.write_text(text)
          PY

          node --import tsx --test "$POOL_TRIGGER_TEST"
          node --check .github/scripts/institutional-trade-qa-e2e.mjs
          node --check .github/scripts/pr212-targeted-regression-qa.mjs
          git diff --check
          git diff -- "$QA_WORKFLOW_PATH"

          if git diff --quiet -- "$QA_WORKFLOW_PATH"; then
            echo "The QA workflow already contained the required durable replay gate."
          else
            git add "$QA_WORKFLOW_PATH"
            git commit -m 'Replay institutional pool trigger migration in QA'
          fi
          final_head="$(git rev-parse HEAD)"
          echo "final_head=$final_head" >> "$GITHUB_OUTPUT"
          git push origin "HEAD:${TARGET_BRANCH}"

      - name: Locate the exact-head push QA run
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          final_head='${{ steps.workflow_patch.outputs.final_head }}'
          run_json=''
          for attempt in $(seq 1 90); do
            run_json="$(gh run list --repo "$repo" --workflow "$QA_WORKFLOW_PATH" --branch "$TARGET_BRANCH" --event push --limit 50 --json databaseId,headSha,status,conclusion,url,createdAt | jq -c --arg sha "$final_head" 'map(select(.headSha == $sha)) | sort_by(.createdAt) | reverse | .[0] // empty')"
            if [[ -n "$run_json" ]]; then
              break
            fi
            sleep 2
          done
          if [[ -z "$run_json" ]]; then
            echo "Could not locate the push-triggered institutional QA run for $final_head." >&2
            exit 1
          fi
          run_id="$(jq -r .databaseId <<<"$run_json")"
          run_url="$(jq -r .url <<<"$run_json")"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "run_url=$run_url" >> "$GITHUB_OUTPUT"
          gh pr comment 212 --repo "$repo" --body "<!-- pr212-current-main-qa -->
## PR #212 current-main exact-head QA

- Integrated feature head: \`$final_head\`
- QA run: [$run_id]($run_url)
- Status: **running**
- Production database and production institutional flags remain unchanged."

      - name: Wait for the complete institutional QA gate
        id: wait
        shell: bash
        run: |
          set +e
          repo="$GITHUB_REPOSITORY"
          run_id='${{ steps.locate.outputs.run_id }}'
          gh run watch "$run_id" --repo "$repo" --exit-status
          watch_status=$?
          conclusion="$(gh run view "$run_id" --repo "$repo" --json conclusion --jq .conclusion 2>/dev/null || echo unknown)"
          echo "conclusion=$conclusion" >> "$GITHUB_OUTPUT"
          echo "watch_status=$watch_status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish exact-head QA result
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          final_head='${{ steps.workflow_patch.outputs.final_head }}'
          run_id='${{ steps.locate.outputs.run_id }}'
          run_url='${{ steps.locate.outputs.run_url }}'
          conclusion='${{ steps.wait.outputs.conclusion }}'
          jobs="$(gh run view "$run_id" --repo "$repo" --json jobs --jq '[.jobs[] | {name,conclusion}]')"
          gh pr comment 212 --repo "$repo" --body "<!-- pr212-current-main-qa-result -->
## PR #212 current-main exact-head QA result

- Feature head: \`$final_head\`
- QA run: [$run_id]($run_url)
- Conclusion: **$conclusion**
- Job conclusions: \`$jobs\`
- The PR remains draft and unmerged. Production database migrations and institutional feature activation remain blocked unless every release gate passes."
          if [[ "$conclusion" != "success" ]]; then
            exit 1
          fi

      - name: Remove this one-use controller from main
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          controller_sha="$(gh api "repos/${repo}/contents/${CONTROLLER_PATH}?ref=main" --jq .sha 2>/dev/null || true)"
          if [[ -n "$controller_sha" ]]; then
            gh api --method DELETE "repos/${repo}/contents/${CONTROLLER_PATH}" \
              -f message='Remove temporary PR 212 next-gates controller' \
              -f sha="$controller_sha" \
              -f branch=main >/dev/null
          fi
