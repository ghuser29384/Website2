name: Enable collective commitments feature-review preview

on:
  pull_request:
    branches:
      - feature/collective-identity-threshold-commitments-20260726
    paths:
      - ".github/workflows/enable-collective-preview-review.yml"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: enable-collective-preview-review-20260727
  cancel-in-progress: false

jobs:
  configure-and-deploy:
    if: >-
      github.event.pull_request.head.repo.full_name == 'ghuser29384/Website2' &&
      github.head_ref == 'ops/enable-collective-preview-review-20260727'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPECTED_REPOSITORY: ghuser29384/Website2
      EXPECTED_PRODUCT_BRANCH: feature/collective-identity-threshold-commitments-20260726
      EXPECTED_PRODUCT_HEAD: 3228deff118e5b6d049a859a12261c76b501b871
      REVIEW_BRANCH: feature/collective-identity-threshold-commitments-20260726
      VERCEL_TEAM_ID: team_ySu6sF3Uho1E1GnJtCQPVEuJ
      VERCEL_PROJECT_ID: prj_uhfNhPo00nQrcbG0dk2zLWo7UmdK
      VERCEL_PROJECT_NAME: website2
      QA_SUPABASE_URL: https://hvmxfjjbdcgjjudmthdz.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.QA_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.QA_SUPABASE_SERVICE_ROLE_KEY }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      ARTIFACT_DIR: ${{ github.workspace }}/collective-feature-review-artifacts

    steps:
      - name: Validate exact boundary and required secrets
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY"
          test "$GITHUB_HEAD_REF" = "ops/enable-collective-preview-review-20260727"
          for name in VERCEL_TOKEN NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY SUPABASE_SERVICE_ROLE_KEY; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required GitHub Actions secret: $name" >&2
              exit 1
            fi
          done

      - name: Check out temporary operations branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify exact product commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$EXPECTED_PRODUCT_BRANCH"
          actual="$(git rev-parse "origin/$EXPECTED_PRODUCT_BRANCH")"
          if [[ "$actual" != "$EXPECTED_PRODUCT_HEAD" ]]; then
            echo "Refusing moved product branch. Expected $EXPECTED_PRODUCT_HEAD, found $actual." >&2
            exit 1
          fi
          test "$(git merge-base "$EXPECTED_PRODUCT_HEAD" HEAD)" = "$EXPECTED_PRODUCT_HEAD"
          mkdir -p "$ARTIFACT_DIR"

      - name: Generate isolated branch-specific master key
        shell: bash
        run: |
          set -euo pipefail
          master_key="$(openssl rand -base64 32 | tr -d '\n')"
          echo "::add-mask::$master_key"
          echo "COLLECTIVE_COMMITMENT_MASTER_KEY=$master_key" >> "$GITHUB_ENV"

      - name: Configure branch-specific Vercel Preview variables
        shell: bash
        run: |
          set -euo pipefail
          upsert_env() {
            local key="$1"
            local value="$2"
            local type="$3"
            local response="$RUNNER_TEMP/vercel-env-${key}.json"
            jq -n \
              --arg key "$key" \
              --arg value "$value" \
              --arg type "$type" \
              --arg branch "$REVIEW_BRANCH" \
              '{key:$key,value:$value,type:$type,target:["preview"],gitBranch:$branch,comment:"Temporary branch-scoped Collective Commitments feature review; production unaffected."}' \
              > "$RUNNER_TEMP/vercel-env-payload.json"
            curl --silent --show-error --fail-with-body \
              --request POST \
              --url "https://api.vercel.com/v10/projects/${VERCEL_PROJECT_ID}/env?teamId=${VERCEL_TEAM_ID}&upsert=true" \
              --header "Authorization: Bearer ${VERCEL_TOKEN}" \
              --header "Content-Type: application/json" \
              --data-binary @"$RUNNER_TEMP/vercel-env-payload.json" \
              > "$response"
            jq -e '((.failed // []) | length) == 0 and (.created // .) != null' "$response" >/dev/null
            printf '%s=CONFIGURED\n' "$key" >> "$ARTIFACT_DIR/environment-status.txt"
            rm -f "$response" "$RUNNER_TEMP/vercel-env-payload.json"
          }

          upsert_env COLLECTIVE_COMMITMENTS_ENABLED true plain
          upsert_env COLLECTIVE_COMMITMENT_MASTER_KEY "$COLLECTIVE_COMMITMENT_MASTER_KEY" sensitive
          upsert_env COLLECTIVE_COMMITMENT_MIN_DEADLINE_MINUTES 60 plain
          upsert_env NEXT_PUBLIC_SUPABASE_URL "$QA_SUPABASE_URL" plain
          upsert_env NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" encrypted
          upsert_env SUPABASE_SERVICE_ROLE_KEY "$SUPABASE_SERVICE_ROLE_KEY" sensitive

      - name: Create exact Vercel deployment from reviewed product commit
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            --arg name "$VERCEL_PROJECT_NAME" \
            --arg project "$VERCEL_PROJECT_ID" \
            --arg ref "$REVIEW_BRANCH" \
            --arg sha "$EXPECTED_PRODUCT_HEAD" \
            '{name:$name,project:$project,gitSource:{type:"github",org:"ghuser29384",repo:"Website2",ref:$ref,sha:$sha},meta:{purpose:"collective-commitments-feature-review",exactProductHead:$sha}}' \
            > "$RUNNER_TEMP/deployment-request.json"
          curl --silent --show-error --fail-with-body \
            --request POST \
            --url "https://api.vercel.com/v13/deployments?teamId=${VERCEL_TEAM_ID}&forceNew=1" \
            --header "Authorization: Bearer ${VERCEL_TOKEN}" \
            --header "Content-Type: application/json" \
            --data-binary @"$RUNNER_TEMP/deployment-request.json" \
            > "$RUNNER_TEMP/deployment-response.json"
          deployment_id="$(jq -r '.id // empty' "$RUNNER_TEMP/deployment-response.json")"
          deployment_url="$(jq -r '.url // empty' "$RUNNER_TEMP/deployment-response.json")"
          test -n "$deployment_id"
          test -n "$deployment_url"
          echo "DEPLOYMENT_ID=$deployment_id" >> "$GITHUB_ENV"
          echo "DEPLOYMENT_URL=https://$deployment_url" >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/deployment-request.json" "$RUNNER_TEMP/deployment-response.json"

      - name: Wait for exact preview to become ready
        shell: bash
        run: |
          set -euo pipefail
          state=""
          for _ in $(seq 1 180); do
            curl --silent --show-error --fail-with-body \
              --url "https://api.vercel.com/v13/deployments/${DEPLOYMENT_ID}?teamId=${VERCEL_TEAM_ID}" \
              --header "Authorization: Bearer ${VERCEL_TOKEN}" \
              > "$RUNNER_TEMP/deployment-poll.json"
            state="$(jq -r '.readyState // .status // .state // empty' "$RUNNER_TEMP/deployment-poll.json")"
            if [[ "$state" == "READY" ]]; then
              jq '{id,url,readyState,state,target,meta}' "$RUNNER_TEMP/deployment-poll.json" \
                > "$ARTIFACT_DIR/deployment-status.json"
              break
            fi
            if [[ "$state" == "ERROR" || "$state" == "CANCELED" ]]; then
              cat "$RUNNER_TEMP/deployment-poll.json" >&2
              exit 1
            fi
            sleep 5
          done
          test "$state" = "READY"
          printf '%s\n' \
            "exact_product_head=${EXPECTED_PRODUCT_HEAD}" \
            "deployment_id=${DEPLOYMENT_ID}" \
            "deployment_url=${DEPLOYMENT_URL}" \
            "preview_feature_enabled=true" \
            "preview_database=hvmxfjjbdcgjjudmthdz" \
            "production_changed=NO" \
            > "$ARTIFACT_DIR/result.txt"

      - name: Comment deployment on PR 233
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh pr comment 233 --repo "$EXPECTED_REPOSITORY" --body "The disabled feature-review Preview was repaired with branch-scoped Preview variables only and redeployed from exact product head \`${EXPECTED_PRODUCT_HEAD}\`. Deployment: \`${DEPLOYMENT_ID}\` at \`${DEPLOYMENT_URL}/collective-commitments\`. MoralTrade QA is the Preview database. Production was not changed."

      - name: Upload configuration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collective-feature-review-${{ github.run_id }}
          path: collective-feature-review-artifacts
          if-no-files-found: warn
          retention-days: 2
