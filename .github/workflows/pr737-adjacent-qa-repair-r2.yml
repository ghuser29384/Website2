name: PR 737 adjacent QA repair payload

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/pr737-adjacent-qa-repair-r2.yml

permissions:
  contents: read

concurrency:
  group: pr737-adjacent-qa-repair-payload
  cancel-in-progress: true

env:
  EXPECTED_HEAD: 32c4d35346eb5588424c9ce5d09ceca22d3a519e
  TARGET_PATH: .github/workflows/mpgf-public-goods-compacts-qa.yml

jobs:
  build-payload:
    if: github.event.pull_request.head.ref == 'ops/pr737-adjacent-qa-repair-r2-20260821'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact PR 737 candidate
        uses: actions/checkout@v4
        with:
          repository: ghuser29384/Website2
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 0

      - name: Produce exact bounded repair payload
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path(os.environ['TARGET_PATH'])
          text = path.read_text()
          old = '      - name: Run genuinely concurrent readiness freeze before ledger authority hardening\n'
          new = '      - name: Run genuinely concurrent readiness freeze test before ledger authority hardening\n'
          if text.count(old) != 1 or text.count(new) != 0:
              raise SystemExit(f'unexpected marker counts: old={text.count(old)}, new={text.count(new)}')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          test "$(git diff --name-only)" = "$TARGET_PATH"
          test "$(grep -Fc -- 'Run genuinely concurrent readiness freeze test before ledger authority hardening' "$TARGET_PATH")" -eq 1
          test "$(grep -Fc -- 'Run genuinely concurrent readiness freeze before ledger authority hardening' "$TARGET_PATH")" -eq 0
          mkdir -p repair-payload/.github/workflows
          cp "$TARGET_PATH" repair-payload/$TARGET_PATH
          sha256sum repair-payload/$TARGET_PATH > repair-payload/sha256.txt
          printf '%s\n' "$EXPECTED_HEAD" > repair-payload/parent-sha.txt

      - name: Upload exact repair payload
        uses: actions/upload-artifact@v4
        with:
          name: pr737-adjacent-qa-repair-payload-${{ env.EXPECTED_HEAD }}
          path: repair-payload
          if-no-files-found: error
          retention-days: 7
