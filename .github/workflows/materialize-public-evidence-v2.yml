name: Materialize integrated public evidence v2

on:
  push:
    branches:
      - feature/public-evidence-desk-v2
    paths:
      - .github/workflows/materialize-public-evidence-v2.yml

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/public-evidence-desk-v2
          fetch-depth: 0

      - name: Copy the approved evidence desk and timeline surface
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feature/public-evidence-desk
          git checkout origin/feature/public-evidence-desk -- \
            'src/app/evidence/[[...recordId]]/page.tsx' \
            supabase/migrations/20260718130000_public_trade_evidence.sql

      - name: Integrate with the current production trade flow
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{path}: expected one match, found {count}: {old[:120]!r}")
              file.write_text(text.replace(old, new, 1))

          # Primary navigation and footer discovery.
          replace_once(
              "src/lib/site.ts",
              '    { href: "/discover", label: "Discover" },\n    { href: "/trades/new", label: "Create" },',
              '    { href: "/discover", label: "Discover" },\n    { href: "/evidence", label: "Evidence" },\n    { href: "/trades/new", label: "Create" },',
          )
          replace_once(
              "src/lib/site.ts",
              '      { href: "/discover", label: "Discover opportunities" },\n      { href: "/trades/new", label: "Create a trade" },',
              '      { href: "/discover", label: "Discover opportunities" },\n      { href: "/evidence", label: "Inspect public evidence" },\n      { href: "/trades/new", label: "Create a trade" },',
          )

          # Sitemap and search surface.
          replace_once(
              "src/app/sitemap.ts",
              '''    {
      url: getAbsoluteUrl("/create"),
      lastModified: now,
      changeFrequency: "weekly",
      priority: 0.96,
    },''',
              '''    {
      url: getAbsoluteUrl("/evidence"),
      lastModified: now,
      changeFrequency: "daily",
      priority: 0.9,
    },
    {
      url: getAbsoluteUrl("/create"),
      lastModified: now,
      changeFrequency: "weekly",
      priority: 0.96,
    },''',
          )
          replace_once(
              "src/lib/site-search.ts",
              '''  {
    href: "/create",
    label: "Create",''',
              '''  {
    href: "/evidence",
    label: "Public evidence",
    summary:
      "Inspect public-by-default evidence, review states, redactions, and the proof timeline behind trade records.",
    kind: "trade",
    keywords: [
      "evidence",
      "proof",
      "public",
      "timeline",
      "submitted",
      "accepted",
      "challenged",
      "redaction",
      "receipt",
    ],
  },
  {
    href: "/create",
    label: "Create",''',
          )

          # Route-performance baseline.
          baseline_path = Path("config/measurement/public-route-baseline.json")
          baseline = json.loads(baseline_path.read_text())
          baseline["version"] = "moral-trade-public-route-baseline-v0.4-2026-07"
          baseline["purpose"] = (
              "Executable public-route performance and resilience baseline for the action router, "
              "provider-hosted payment handoff, live marketplace, public evidence, creation, offset, "
              "pool, safety, and status pages visitors use before relying on Moral Trade."
          )
          routes = baseline["routes"]
          insert_at = next(i for i, route in enumerate(routes) if route["path"] == "/create")
          routes[insert_at:insert_at] = [
              {"path": "/evidence", "family": "public_evidence", "stage": "trust"},
              {"path": "/evidence/example", "family": "public_evidence", "stage": "inspection"},
          ]
          baseline_path.write_text(json.dumps(baseline, indent=2) + "\n")

          # Keep the current Card Stack, but make the public-evidence policy explicit and enforceable.
          replace_once(
              "src/app/trades/new/page.tsx",
              '''  privacyScope:
    "Participants and operator only. Public pages show proposal terms but not private messages or evidence.",''',
              '''  privacyScope:
    "Drafts and private messages remain private. Evidence submitted under an active agreement is publicly inspectable by default after sensitive identifiers are removed.",''',
          )

          workbench = "src/components/core-trade/trade-draft-workbench.tsx"
          replace_once(
              workbench,
              '''  notes: string;
  voluntaryCertification: boolean;
}''',
              '''  notes: string;
  voluntaryCertification: boolean;
  publicEvidenceCertification: boolean;
}''',
          )
          replace_once(
              workbench,
              '  privacyScope: "Participants and operator only. Public pages exclude private messages and evidence.",',
              '  privacyScope: "Drafts and private messages remain private. Evidence submitted under an active agreement is public by default, with sensitive identifiers removed and narrow safety exceptions.",',
          )
          replace_once(
              workbench,
              '''  notes: "",
  voluntaryCertification: false,
};''',
              '''  notes: "",
  voluntaryCertification: false,
  publicEvidenceCertification: false,
};''',
          )
          replace_once(
              workbench,
              '''        {values.voluntaryCertification ? (
          <input name="voluntary_certification" type="hidden" value="on" />
        ) : null}

        <header''',
              '''        {values.voluntaryCertification ? (
          <input name="voluntary_certification" type="hidden" value="on" />
        ) : null}
        {values.publicEvidenceCertification ? (
          <input name="public_evidence_certification" type="hidden" value="on" />
        ) : null}

        <header''',
          )
          replace_once(
              workbench,
              '<p>Name the evidence that counts and who may see it.</p>',
              '<p>Name the evidence that counts. Evidence records and public-safe sources are public by default; drafts and private messages stay private.</p>',
          )
          replace_once(
              workbench,
              '<span className={styles.fieldLabel}>Privacy scope</span>',
              '<span className={styles.fieldLabel}>Evidence visibility and privacy scope</span>',
          )
          replace_once(
              workbench,
              '''                  <label className={styles.certification}>
                    <input
                      className={styles.checkbox}
                      checked={values.voluntaryCertification}
                      onChange={(event) => update("voluntaryCertification", event.target.checked)}
                      type="checkbox"
                    />
                    <span>
                      This proposal is voluntary. It does not threaten harm, retaliation, or a worse baseline if the other person declines.
                    </span>
                  </label>

                  <div className={styles.safetyList}>''',
              '''                  <label className={styles.certification}>
                    <input
                      className={styles.checkbox}
                      checked={values.voluntaryCertification}
                      onChange={(event) => update("voluntaryCertification", event.target.checked)}
                      type="checkbox"
                    />
                    <span>
                      This proposal is voluntary. It does not threaten harm, retaliation, or a worse baseline if the other person declines.
                    </span>
                  </label>

                  <label className={styles.certification}>
                    <input
                      className={styles.checkbox}
                      checked={values.publicEvidenceCertification}
                      onChange={(event) => update("publicEvidenceCertification", event.target.checked)}
                      type="checkbox"
                    />
                    <span>
                      I understand that evidence submitted under an active agreement is public by default. Only public-safe copies with sensitive identifiers removed may be submitted.
                    </span>
                  </label>

                  <div className={styles.safetyList}>''',
          )
          replace_once(
              workbench,
              '''                    <div className={styles.safetyItem}>
                      <strong>Separate confirmation</strong>
                      <span>After review and a counterparty response, both people confirm one frozen version independently.</span>
                    </div>
                  </div>''',
              '''                    <div className={styles.safetyItem}>
                      <strong>Separate confirmation</strong>
                      <span>After review and a counterparty response, both people confirm one frozen version independently.</span>
                    </div>
                    <div className={styles.safetyItem}>
                      <strong>Public evidence record</strong>
                      <span>Submitted, accepted, and challenged remain distinct states. Public visibility is not a blanket verification claim.</span>
                    </div>
                  </div>''',
          )
          replace_once(
              workbench,
              '              Evidence and privacy specified',
              '              Public-safe evidence specified',
          )
          replace_once(
              workbench,
              '                Save privately, or certify voluntariness and submit once for operator review.',
              '                Save privately, or certify voluntariness and public-by-default evidence before submitting for review.',
          )
          replace_once(
              workbench,
              '                disabled={!finalTermsComplete || !values.voluntaryCertification}',
              '                disabled={!finalTermsComplete || !values.voluntaryCertification || !values.publicEvidenceCertification}',
          )
          replace_once(
              workbench,
              '            The card stack saves real proposal terms to your account. Nothing is public or binding until review, invitation, and separate bilateral confirmation.',
              '            The card stack saves real proposal terms to your account. Drafts and messages remain private. Evidence submitted later under an active agreement is public by default, and nothing becomes binding without separate bilateral confirmation.',
          )

          # Server-side enforcement for both offer submission and evidence upload.
          actions = "src/app/core-trade-actions.ts"
          replace_once(
              actions,
              '''    if (intent === "submit" && !readCheckbox(formData, "voluntary_certification")) {
      throw new Error("Confirm that the proposal is voluntary and contains no threat or retaliation.");
    }

    const fingerprint''',
              '''    if (intent === "submit" && !readCheckbox(formData, "voluntary_certification")) {
      throw new Error("Confirm that the proposal is voluntary and contains no threat or retaliation.");
    }
    if (intent === "submit" && !readCheckbox(formData, "public_evidence_certification")) {
      throw new Error(
        "Confirm that agreement evidence will be public by default and that only public-safe copies will be submitted.",
      );
    }

    const fingerprint''',
          )
          replace_once(
              actions,
              '''    const fileEntry = formData.get("evidence_file");
    let storagePath = "";
    let evidenceType = "";''',
              '''    const fileEntry = formData.get("evidence_file");
    const publicSafeCopy = readCheckbox(formData, "public_safe_copy");
    if (!publicSafeCopy) {
      throw new Error(
        "Confirm that this evidence and its source are public-safe before submission.",
      );
    }
    let storagePath = "";
    let evidenceType = "";
    let publicOriginalFilename = "";
    let publicMimeType = "";
    const publicRedactionNote =
      "The submitting participant certified this source as public-safe. This certification is not independent verification.";''',
          )
          replace_once(
              actions,
              '''      const safeName = fileEntry.name.replace(/[^a-zA-Z0-9._-]+/g, "-").slice(-120) || "evidence";
      storagePath = `${agreementId}/${viewer.authUser.id}/${randomUUID()}-${safeName}`;''',
              '''      const extensionByMime: Record<string, string> = {
        "application/pdf": ".pdf",
        "image/png": ".png",
        "image/jpeg": ".jpg",
        "image/webp": ".webp",
        "text/plain": ".txt",
      };
      publicOriginalFilename = `public-evidence${extensionByMime[fileEntry.type] ?? ""}`;
      publicMimeType = fileEntry.type;
      storagePath = `${agreementId}/${viewer.authUser.id}/${randomUUID()}-${publicOriginalFilename}`;''',
          )
          replace_once(
              actions,
              '''      evidenceType = "link";
    } else if (attestation) {
      evidenceType = "attestation";''',
              '''      evidenceType = "link";
      publicOriginalFilename = "external-evidence-link";
      publicMimeType = "text/html";
    } else if (attestation) {
      evidenceType = "attestation";
      publicOriginalFilename = "participant-attestation.txt";
      publicMimeType = "text/plain";''',
          )
          replace_once(
              actions,
              '''        attestation,
        status: "submitted",
      })''',
              '''        attestation,
        status: "submitted",
        public_visibility: "public",
        redaction_status: "not_required",
        public_storage_path: storagePath,
        public_original_filename: publicOriginalFilename,
        public_mime_type: publicMimeType,
        public_redaction_note: publicRedactionNote,
      })''',
          )
          replace_once(
              actions,
              '''          .update({ status: "completed", lifecycle_status: "completed", completed_at: now, updated_at: now })''',
              '''          .update({
            status: "completed",
            lifecycle_status: "completed",
            completed_at: now,
            updated_at: now,
            public_evidence_updated_at: now,
          })''',
          )

          # Participant agreement page: public-safe submission and a direct route into the desk.
          agreement = "src/app/trade-agreements/[agreementId]/page.tsx"
          replace_once(
              agreement,
              '''            <h2 id="evidence-heading">Submit proof, then let the other participant review it.</h2>
            <p>
              A private file, external link, or participant attestation may be used. The submitter
              cannot review their own evidence. A challenge moves the agreement into disputed state.
            </p>
          </div>

          {canSubmitEvidence ? (''',
              '''            <h2 id="evidence-heading">Submit public-safe proof, then let the other participant review it.</h2>
            <p>
              Evidence records and their sources are public by default. Remove exact addresses,
              account numbers, private contact details, and unrelated personal information before
              submission. The submitter cannot review their own evidence, and a challenge moves the
              agreement into disputed state.
            </p>
          </div>

          {detail.evidence.length ? (
            <p>
              <Link className="inline-link" href={`/evidence/${agreementId}`}>
                Open the public evidence desk and proof timeline
              </Link>
            </p>
          ) : null}

          {canSubmitEvidence ? (''',
          )
          replace_once(
              agreement,
              '<span>Evidence file (PDF, image, or text; 10 MB maximum)</span>',
              '<span>Public-safe evidence file (PDF, image, or text; 10 MB maximum)</span>',
          )
          replace_once(
              agreement,
              '''              <p className="panel-note">Provide one of the three evidence forms above.</p>
              <PendingSubmitButton''',
              '''              <label className="radio-row">
                <input name="public_safe_copy" required type="checkbox" />
                <span>
                  I understand this evidence item and its source will be publicly inspectable. I have
                  removed sensitive identifiers and unrelated personal information.
                </span>
              </label>
              <p className="panel-note">
                Provide one evidence form above. Public visibility is separate from submitted,
                accepted, or challenged review status.
              </p>
              <PendingSubmitButton''',
          )
          replace_once(
              agreement,
              '''                      <span className="source-pill">
                        Challenge until {formatDate(item.challenge_window_ends_at)}
                      </span>
                    </div>''',
              '''                      <span className="source-pill">
                        Challenge until {formatDate(item.challenge_window_ends_at)}
                      </span>
                      <span className="source-pill">
                        Visibility: {String(item.public_visibility ?? "public").replaceAll("_", " ")}
                      </span>
                      <span className="source-pill">
                        Redaction: {String(item.redaction_status ?? "pending_review").replaceAll("_", " ")}
                      </span>
                    </div>''',
          )
          replace_once(
              agreement,
              '                        Open private uploaded evidence',
              '                        Open submitted source (participant access)',
          )

          # The live public route must never fall back to a private storage filename.
          evidence_page = "src/app/evidence/[[...recordId]]/page.tsx"
          replace_once(
              evidence_page,
              '      const fileName = clean(item.public_original_filename, clean(item.storage_path).split("/").pop() ?? "");',
              '      const fileName = clean(item.public_original_filename, evidenceType === "file" ? "public-evidence" : evidenceType === "link" ? "external-evidence-link" : "participant-attestation.txt");',
          )

          # Harden migration backfill and retroactive safety-exception behavior.
          migration = "supabase/migrations/20260718130000_public_trade_evidence.sql"
          replace_once(
              migration,
              '''declare
  evidence_is_public boolean := true;
  exception_reason text := '';
  inferred_filename text := '';
begin
  select
    coalesce(a.public_evidence_enabled, true),
    coalesce(a.public_evidence_exception_reason, '')
  into evidence_is_public, exception_reason''',
              '''declare
  evidence_is_public boolean := true;
  inferred_filename text := '';
begin
  select coalesce(a.public_evidence_enabled, true)
  into evidence_is_public''',
          )
          replace_once(
              migration,
              '''  public_original_filename = case
    when not coalesce(a.public_evidence_enabled, true) then ''
    when btrim(e.public_original_filename) <> '' then e.public_original_filename
    else regexp_replace(coalesce(e.storage_path, ''), '^.*/', '')
  end,''',
              '''  public_original_filename = case
    when not coalesce(a.public_evidence_enabled, true) then ''
    when e.evidence_type = 'file' then 'public-evidence'
    when btrim(e.public_original_filename) <> '' then e.public_original_filename
    when e.evidence_type = 'link' then 'external-evidence-link'
    else 'participant-attestation.txt'
  end,''',
          )
          safety_sql = '''create or replace function public.sync_public_trade_evidence_visibility()
returns trigger
language plpgsql
security definer
set search_path = public
as $$
begin
  if new.public_evidence_enabled is not distinct from old.public_evidence_enabled then
    return new;
  end if;

  if not new.public_evidence_enabled then
    update public.trade_evidence_items
    set
      public_visibility = 'withheld_safety',
      redaction_status = 'withheld',
      public_title = 'Evidence withheld for safety',
      public_summary = 'Specific proof is withheld under a documented safety exception.',
      public_url = '',
      public_storage_path = '',
      public_original_filename = '',
      public_mime_type = '',
      public_redaction_note = 'Specific proof withheld under a documented safety exception.',
      public_published_at = null
    where agreement_id = new.id;
  else
    update public.trade_evidence_items
    set
      public_visibility = 'public',
      redaction_status = case when evidence_type = 'file' then 'pending_review' else 'not_required' end,
      public_title = case
        when evidence_type = 'attestation' then 'Participant attestation'
        when evidence_type = 'link' then 'External evidence link'
        else 'Submitted evidence file'
      end,
      public_summary = coalesce(
        nullif(btrim(attestation), ''),
        'Evidence submitted under the parties'' frozen agreement. The public record preserves its review and redaction state.'
      ),
      public_url = case when evidence_type = 'link' then evidence_url else '' end,
      public_storage_path = '',
      public_original_filename = case
        when evidence_type = 'file' then 'public-evidence'
        when evidence_type = 'link' then 'external-evidence-link'
        else 'participant-attestation.txt'
      end,
      public_mime_type = case
        when evidence_type = 'link' then 'text/html'
        when evidence_type = 'attestation' then 'text/plain'
        else ''
      end,
      public_redaction_note = case
        when evidence_type = 'file' then 'The evidence record is public. The uploaded file remains unavailable until a public-safe copy passes redaction review.'
        when evidence_type = 'link' then 'The participant supplied this link for public inspection.'
        else 'This attestation is the public evidence. Private contact information is not shown.'
      end,
      public_published_at = now()
    where agreement_id = new.id;
  end if;

  return new;
end;
$$;

drop trigger if exists sync_public_trade_evidence_visibility_trigger
  on public.agreements;
create trigger sync_public_trade_evidence_visibility_trigger
after update of public_evidence_enabled on public.agreements
for each row execute function public.sync_public_trade_evidence_visibility();

'''
          replace_once(
              migration,
              'comment on column public.trade_evidence_items.public_visibility is\n',
              safety_sql + 'comment on column public.trade_evidence_items.public_visibility is\n',
          )
          PY

      - name: Commit the rebased implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            config/measurement/public-route-baseline.json \
            src/app/core-trade-actions.ts \
            'src/app/evidence/[[...recordId]]/page.tsx' \
            src/app/sitemap.ts \
            'src/app/trade-agreements/[agreementId]/page.tsx' \
            src/app/trades/new/page.tsx \
            src/components/core-trade/trade-draft-workbench.tsx \
            src/lib/site-search.ts \
            src/lib/site.ts \
            supabase/migrations/20260718130000_public_trade_evidence.sql
          git rm -- .github/workflows/materialize-public-evidence-v2.yml
          git commit -m "Add integrated public evidence desk and proof timeline"
          git push origin HEAD:feature/public-evidence-desk-v2
