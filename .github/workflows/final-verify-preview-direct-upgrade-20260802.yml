name: Final verify and preview Direct Donation Upgrade

on:
  push:
    branches:
      - ops/final-verify-preview-direct-upgrade-20260802
    paths:
      - .github/workflows/final-verify-preview-direct-upgrade-20260802.yml

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: read

concurrency:
  group: final-verify-preview-direct-upgrade-20260802
  cancel-in-progress: false

env:
  CONTROLLER_PATH: .github/workflows/final-verify-preview-direct-upgrade-20260802.yml
  RELEASE_REPAIR_SHA: f22c8adbc3236822df81e52c5888bc281996019f
  FEATURE_BRANCH: feature/direct-verified-donation-upgrade-20260731
  RELEASE_BRANCH: release/vercel-preview
  FEATURE_PR: '418'
  GATED_RELEASE_WORKFLOW: vercel-release.yml

jobs:
  verify-and-preview:
    if: github.repository == 'ghuser29384/Website2' && github.actor == 'ghuser29384'
    runs-on: ubuntu-24.04
    timeout-minutes: 150

    steps:
      - name: Check out and guard the one-file observer
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          token: ${{ github.token }}

      - name: Verify observer isolation and merged release repair
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff-tree --no-commit-id --name-only -r HEAD | sed '/^$/d')" = "$CONTROLLER_PATH"
          git merge-base --is-ancestor "$RELEASE_REPAIR_SHA" HEAD^
          git show HEAD^:.github/workflows/vercel-release.yml | grep -F 'rendered_verification_run_id:' >/dev/null
          git show HEAD^:.github/workflows/vercel-release.yml | grep -F 'Run read-only canonical route smoke against the deployment' >/dev/null

      - name: Freeze a stable final feature candidate
        id: candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 1200))
          previous=''
          stable_reads=0

          while true; do
            if (( SECONDS >= deadline )); then
              echo 'Timed out waiting for a stable synchronized feature head.' >&2
              exit 1
            fi

            feature_sha="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$FEATURE_PR" --jq '.head.sha')"
            feature_ref="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$FEATURE_PR" --jq '.head.ref')"
            test "$feature_ref" = "$FEATURE_BRANCH"

            git fetch origin main "$FEATURE_BRANCH" "$RELEASE_BRANCH" --no-tags --force
            test "$(git rev-parse "origin/$FEATURE_BRANCH")" = "$feature_sha"
            main_sha="$(git rev-parse origin/main)"
            git merge-base --is-ancestor "$RELEASE_REPAIR_SHA" "$feature_sha"
            git merge-base --is-ancestor "$main_sha" "$feature_sha"
            test "$(git ls-tree -r --name-only "$feature_sha" | grep -Ec '^\.github/direct-upgrade-(release|final-gates)-trigger-20260802$' || true)" = '0'
            git diff --check "$main_sha" "$feature_sha"

            if [[ "$feature_sha" = "$previous" ]]; then
              stable_reads=$((stable_reads + 1))
            else
              previous="$feature_sha"
              stable_reads=1
            fi
            if (( stable_reads >= 3 )); then
              break
            fi
            sleep 20
          done

          echo "candidate_sha=$feature_sha" >> "$GITHUB_OUTPUT"
          echo "main_sha=$main_sha" >> "$GITHUB_OUTPUT"
          printf 'Frozen final candidate %s containing main %s\n' "$feature_sha" "$main_sha"

      - name: Wait for all exact-head feature workflows
        id: gates
        shell: bash
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.candidate_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 7200))
          : > direct-upgrade-final-exact-head-runs.tsv
          rendered_run_id=''

          while IFS='|' read -r workflow_id label; do
            while true; do
              if (( SECONDS >= deadline )); then
                echo "Timed out waiting for $label on $CANDIDATE_SHA" >&2
                exit 1
              fi

              runs_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow_id/runs?per_page=100")"
              run_json="$(jq -c --arg sha "$CANDIDATE_SHA" '
                [
                  .workflow_runs[]?
                  | select(.head_sha == $sha or any(.pull_requests[]?; .head.sha == $sha))
                ]
                | sort_by(.created_at)
                | last // empty
              ' <<<"$runs_json")"

              if [[ -z "$run_json" ]]; then
                sleep 20
                continue
              fi

              status="$(jq -r '.status' <<<"$run_json")"
              conclusion="$(jq -r '.conclusion // ""' <<<"$run_json")"
              run_id="$(jq -r '.id' <<<"$run_json")"
              run_url="$(jq -r '.html_url' <<<"$run_json")"
              if [[ "$status" != 'completed' ]]; then
                sleep 20
                continue
              fi
              if [[ "$conclusion" != 'success' ]]; then
                echo "$label run $run_id completed with $conclusion" >&2
                gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs" \
                  --jq '.jobs[] | [.name, .status, .conclusion] | @tsv' >&2 || true
                exit 1
              fi

              printf '%s\t%s\t%s\t%s\n' "$workflow_id" "$label" "$run_id" "$run_url" \
                | tee -a direct-upgrade-final-exact-head-runs.tsv
              if [[ "$workflow_id" = '324968062' ]]; then
                rendered_run_id="$run_id"
              fi
              break
            done
          done <<'WORKFLOWS'
          324958317|Direct verified Donation Upgrade engineering gates
          324958752|Direct verified Donation Upgrade isolated QA
          324968062|Direct verified Donation Upgrade rendered QA
          321431264|Moral Trade Create adapter gates
          325052727|Vercel build ownership policy
          313452115|Create route visual QA
          323143327|Compact Co-Fund UI compatibility
          WORKFLOWS

          test -n "$rendered_run_id"
          test "$(wc -l < direct-upgrade-final-exact-head-runs.tsv | tr -d ' ')" = '7'
          echo "rendered_run_id=$rendered_run_id" >> "$GITHUB_OUTPUT"

      - name: Require successful release classification for the exact head
        shell: bash
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.candidate_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 1800))
          while true; do
            statuses="$(gh api "repos/$GITHUB_REPOSITORY/commits/$CANDIDATE_SHA/status")"
            state="$(jq -r '[.statuses[]? | select(.context == "release-classification")][0].state // "missing"' <<<"$statuses")"
            case "$state" in
              success) break ;;
              failure|error) echo "release-classification is $state" >&2; exit 1 ;;
              *)
                if (( SECONDS >= deadline )); then
                  echo 'Timed out waiting for release-classification.' >&2
                  exit 1
                fi
                sleep 15
                ;;
            esac
          done

      - name: Advance only the designated preview branch
        shell: bash
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          old_release_sha="$(git ls-remote origin "refs/heads/$RELEASE_BRANCH" | awk '{print $1}')"
          test -n "$old_release_sha"
          git merge-base --is-ancestor "$old_release_sha" "$CANDIDATE_SHA"
          git push origin "$CANDIDATE_SHA:refs/heads/$RELEASE_BRANCH"
          test "$(git ls-remote origin "refs/heads/$RELEASE_BRANCH" | awk '{print $1}')" = "$CANDIDATE_SHA"

      - name: Dispatch the immutable gated preview
        id: release
        shell: bash
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.candidate_sha }}
          GH_TOKEN: ${{ github.token }}
          RENDERED_RUN_ID: ${{ steps.gates.outputs.rendered_run_id }}
        run: |
          set -euo pipefail
          workflow_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$GATED_RELEASE_WORKFLOW" --jq '.id')"
          dispatched_after="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          jq -n \
            --arg ref 'main' \
            --arg target 'preview' \
            --arg release_ref "$RELEASE_BRANCH" \
            --arg expected_sha "$CANDIDATE_SHA" \
            --arg rendered_run_id "$RENDERED_RUN_ID" \
            '{ref:$ref,inputs:{target:$target,ref:$release_ref,expected_sha:$expected_sha,rendered_verification_run_id:$rendered_run_id}}' \
            | gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow_id/dispatches" --input - >/dev/null

          run_json=''
          for _ in $(seq 1 90); do
            runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow_id/runs?event=workflow_dispatch&branch=main&per_page=50")"
            run_json="$(jq -c --arg after "$dispatched_after" '[.workflow_runs[]? | select(.created_at >= $after)] | sort_by(.created_at) | first // empty' <<<"$runs")"
            [[ -n "$run_json" ]] && break
            sleep 5
          done
          test -n "$run_json"
          echo "release_run_id=$(jq -r '.id' <<<"$run_json")" >> "$GITHUB_OUTPUT"
          echo "release_run_url=$(jq -r '.html_url' <<<"$run_json")" >> "$GITHUB_OUTPUT"

      - name: Require successful preview and exact route-smoke artifact
        id: preview
        shell: bash
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.candidate_sha }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN_ID: ${{ steps.release.outputs.release_run_id }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 7200))
          while true; do
            run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN_ID")"
            status="$(jq -r '.status' <<<"$run_json")"
            conclusion="$(jq -r '.conclusion // ""' <<<"$run_json")"
            if [[ "$status" = 'completed' ]]; then
              if [[ "$conclusion" != 'success' ]]; then
                echo "Gated preview $RELEASE_RUN_ID completed with $conclusion" >&2
                gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN_ID/jobs" \
                  --jq '.jobs[] | [.name, .status, .conclusion] | @tsv' >&2 || true
                exit 1
              fi
              break
            fi
            if (( SECONDS >= deadline )); then
              echo "Timed out waiting for gated preview $RELEASE_RUN_ID" >&2
              exit 1
            fi
            sleep 20
          done

          expected_name="gated-vercel-release-preview-$CANDIDATE_SHA"
          artifacts="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN_ID/artifacts?per_page=100")"
          artifact="$(jq -c --arg name "$expected_name" '[.artifacts[]? | select(.name == $name and (.expired | not))] | first // empty' <<<"$artifacts")"
          test -n "$artifact"
          echo "artifact_id=$(jq -r '.id' <<<"$artifact")" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$expected_name" >> "$GITHUB_OUTPUT"

      - name: Record exact final preview evidence on PR 418
        shell: bash
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.candidate_sha }}
          MAIN_SHA: ${{ steps.candidate.outputs.main_sha }}
          RENDERED_RUN_ID: ${{ steps.gates.outputs.rendered_run_id }}
          RELEASE_RUN_ID: ${{ steps.release.outputs.release_run_id }}
          RELEASE_RUN_URL: ${{ steps.release.outputs.release_run_url }}
          ARTIFACT_ID: ${{ steps.preview.outputs.artifact_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          runs_markdown="$(awk -F '\t' '{printf "- %s: run `%s` — %s\n", $2, $3, $4}' direct-upgrade-final-exact-head-runs.tsv)"
          body="$(cat <<EOF
          ### Final immutable Donation Upgrade preview passed

          - Candidate: \`$CANDIDATE_SHA\`
          - Included main: \`$MAIN_SHA\`
          - Exact rendered-QA run: \`$RENDERED_RUN_ID\`
          - Gated Vercel preview: \`$RELEASE_RUN_ID\` — $RELEASE_RUN_URL
          - Route-smoke artifact: \`$ARTIFACT_ID\`

          Exact-head gates:

          $runs_markdown

          The canonical Vercel project received one immutable prebuilt preview only after all exact-head gates and release classification passed. The gated workflow then passed read-only smoke checks for \`/\`, \`/create?structure=conditional-donation\`, and \`/donation-upgrades\`. Production direct mode, managed Stripe, and pooled settlement remain disabled.
          EOF
          )"
          gh pr comment "$FEATURE_PR" --repo "$GITHUB_REPOSITORY" --body "$body"

      - name: Upload final orchestration evidence
        uses: actions/upload-artifact@v4
        with:
          name: direct-upgrade-final-preview-orchestration-${{ steps.candidate.outputs.candidate_sha }}
          path: direct-upgrade-final-exact-head-runs.tsv
          if-no-files-found: error
          retention-days: 30
