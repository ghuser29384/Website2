name: A1 production scheduled-cron smoke

on:
  pull_request:
    branches:
      - main
    paths:
      - .a1-production-smoke/**

permissions:
  contents: read

jobs:
  verify-production-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      A1_SMOKE_BASE_URL: https://www.moraltrade.org
      A1_SMOKE_OUTPUT_DIR: a1-production-smoke-evidence
      A1_PRODUCTION_SOURCE_SHA: 85b24324d64591e231c44cddd7ab082d212c1607
      RAW_PROD_SUPABASE_DB_URL: ${{ secrets.PROD_SUPABASE_DB_URL }}
      QA_SUPABASE_DB_URL: ${{ secrets.QA_SUPABASE_DB_URL }}
      QA_TEST_PASSWORD: ${{ secrets.QA_TEST_PASSWORD }}
    steps:
      - name: Check out scheduled-cron smoke bundle
        uses: actions/checkout@v4
        with:
          ref: ops/a1-production-smoke-20260725
          path: ops
          fetch-depth: 1
          show-progress: false

      - name: Check out exact A1 application source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.A1_PRODUCTION_SOURCE_SHA }}
          path: app
          fetch-depth: 1
          show-progress: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq postgresql-client

      - name: Resolve and preflight production database credentials
        shell: bash
        run: |
          set -euo pipefail
          for name in RAW_PROD_SUPABASE_DB_URL QA_SUPABASE_DB_URL QA_TEST_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required GitHub Actions secret: $name"
              exit 1
            fi
            echo "::add-mask::${!name}"
          done

          node <<'NODE'
          const fs = require('node:fs');
          const rawProd = new URL(process.env.RAW_PROD_SUPABASE_DB_URL);
          const qa = new URL(process.env.QA_SUPABASE_DB_URL);
          const candidates = [];

          const exact = new URL(rawProd);
          exact.searchParams.set('sslmode', 'require');
          candidates.push(['exact-production-url', exact]);

          const pooler = new URL(rawProd);
          pooler.username = 'postgres.jnpoxvalyjtdghnperyu';
          pooler.hostname = 'aws-1-us-west-2.pooler.supabase.com';
          pooler.port = '5432';
          pooler.pathname = '/postgres';
          pooler.searchParams.set('sslmode', 'require');
          candidates.push(['session-pooler-production-password', pooler]);

          const poolerWithQaPassword = new URL(pooler);
          poolerWithQaPassword.password = qa.password;
          candidates.push(['session-pooler-current-shared-password', poolerWithQaPassword]);

          fs.mkdirSync('/tmp/a1-db-candidates', { recursive: true, mode: 0o700 });
          candidates.forEach(([label, url], index) => {
            fs.writeFileSync(`/tmp/a1-db-candidates/${index}.label`, label, { mode: 0o600 });
            fs.writeFileSync(`/tmp/a1-db-candidates/${index}.url`, url.toString(), { mode: 0o600 });
          });
          NODE

          selected_url=""
          selected_label=""
          for url_file in /tmp/a1-db-candidates/*.url; do
            index="${url_file%.url}"
            label="$(cat "$index.label")"
            candidate="$(cat "$url_file")"
            echo "::add-mask::$candidate"
            if PGCONNECT_TIMEOUT=10 psql "$candidate" -v ON_ERROR_STOP=1 -Atqc 'select 1' \
              >/tmp/a1-db-probe.out 2>/tmp/a1-db-probe.err; then
              if [ "$(cat /tmp/a1-db-probe.out)" = "1" ]; then
                selected_url="$candidate"
                selected_label="$label"
                break
              fi
            fi
          done

          rm -rf /tmp/a1-db-candidates /tmp/a1-db-probe.out /tmp/a1-db-probe.err
          if [ -z "$selected_url" ]; then
            echo "::error::No configured production database credential candidate passed the connection preflight."
            exit 1
          fi

          echo "::add-mask::$selected_url"
          echo "PROD_SUPABASE_DB_URL=$selected_url" >> "$GITHUB_ENV"
          mkdir -p app/a1-production-smoke-evidence
          printf 'selected_candidate=%s\n' "$selected_label" > app/a1-production-smoke-evidence/database-preflight.txt

      - name: Install application and browser dependencies
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium

      - name: Transform and run authenticated scheduled-cron sequence
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode ../ops/.a1-production-smoke/final.gz.b64 | gzip -d > .a1-production-scheduled-cron-smoke.mjs
          echo "f82baf39e9af65aac1204416a3e0589f74f8013f30c11ec2eda7b7341d8a2a7f  .a1-production-scheduled-cron-smoke.mjs" | sha256sum -c -
          node ../ops/.a1-production-smoke/patch-to-scheduled-cron.mjs .a1-production-scheduled-cron-smoke.mjs
          node ../ops/.a1-production-smoke/add-layout-diagnostics.mjs .a1-production-scheduled-cron-smoke.mjs
          sha256sum .a1-production-scheduled-cron-smoke.mjs
          node --check .a1-production-scheduled-cron-smoke.mjs
          node .a1-production-scheduled-cron-smoke.mjs

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a1-production-scheduled-cron-smoke-${{ github.run_id }}
          path: app/a1-production-smoke-evidence
          if-no-files-found: warn
          retention-days: 30
