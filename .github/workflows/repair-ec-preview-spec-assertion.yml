name: Repair evidence credibility Preview spec assertion

on:
  push:
    branches:
      - ops/evidence-credibility-shadow-preview-acceptance-20260812
    paths:
      - .github/workflows/repair-ec-preview-spec-assertion.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
      - name: Remove the unsupported admin-card evidence-count assertion
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path=Path('ops/evidence-credibility-shadow-preview-acceptance.spec.ts')
          source=path.read_text(encoding='utf-8')
          old='      await expect(captureForm.getByText("Attestation: 1", { exact: true })).toBeVisible();\n'
          if source.count(old)!=1:
              raise SystemExit(f'Expected one obsolete assertion, found {source.count(old)}.')
          path.write_text(source.replace(old,''),encoding='utf-8')
          PY
          git diff --check
      - name: Commit durable spec repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops/evidence-credibility-shadow-preview-acceptance.spec.ts
          git commit -m "test: verify evidence only in blinded reviewer workspace"
          git push origin "HEAD:${GITHUB_REF_NAME}"
