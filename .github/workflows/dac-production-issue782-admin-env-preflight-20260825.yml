name: Issue 782 production admin UAT capability preflight

on:
  push:
    branches:
      - ops/dac-production-canonical-uat-26d1fe43-20260824
    paths:
      - ".github/workflows/dac-production-issue782-admin-env-preflight-20260825.yml"

permissions:
  actions: read
  contents: read

concurrency:
  group: moraltrade-issue782-admin-env-preflight
  cancel-in-progress: false

env:
  CONTROLLER_BRANCH: ops/dac-production-canonical-uat-26d1fe43-20260824
  CONTROLLER_PATH: .github/workflows/dac-production-issue782-admin-env-preflight-20260825.yml
  BACKUP_CONTROLLER_PATH: .github/workflows/dac-production-issue782-replacement-backup-20260825.yml
  EXPECTED_MAIN_SHA: 26d1fe436dbf9a4440bfafd501ddf8db944a1127
  EXPECTED_MAIN_TREE: 47fe96dfc881f1c57dea711283fc3db36a44e053
  EXPECTED_DEPLOYMENT_ID: dpl_GbKHA9YfvjEW3iqymgY4uzp7MWsX
  EXPECTED_VERCEL_PROJECT_ID: prj_Em3j7Uj7RatX2R1ZYhla3XSHRde7
  VERCEL_TEAM_ID: team_ySu6sF3Uho1E1GnJtCQPVEuJ
  BACKUP_RUN_ID: "32904854234"
  BACKUP_RUN_HEAD: 9b176aa10fd377a9357b944a701eb0911dc1b9fd
  BACKUP_ARTIFACT_ID: "9584433427"
  BACKUP_ARTIFACT_DIGEST: sha256:773149dde3b2512b3854e48c5adf1b1b4c16a627be3ed2c21207d947d9885835
  EVIDENCE_DIR: issue782-admin-env-preflight-evidence

jobs:
  preflight:
    name: Read-only production ADMIN_EMAILS capability classification
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out exact controller
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Guard exact source, unchanged main, and controller-only branch scope
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "ghuser29384/Website2"
          test "$GITHUB_REF_NAME" = "$CONTROLLER_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git merge-base HEAD "$EXPECTED_MAIN_SHA")" = "$EXPECTED_MAIN_SHA"
          test "$(git rev-parse "$EXPECTED_MAIN_SHA^{tree}")" = "$EXPECTED_MAIN_TREE"
          remote_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$remote_main" = "$EXPECTED_MAIN_SHA"
          mapfile -t changed < <(git diff --name-only "$EXPECTED_MAIN_SHA" HEAD | sort)
          printf '%s\n' "${changed[@]}" > "$RUNNER_TEMP/changed-files.txt"
          expected="$RUNNER_TEMP/expected-files.txt"
          printf '%s\n' "$CONTROLLER_PATH" "$BACKUP_CONTROLLER_PATH" | sort > "$expected"
          diff -u "$expected" "$RUNNER_TEMP/changed-files.txt"
          git diff --check "$EXPECTED_MAIN_SHA" HEAD
          mkdir -p "$EVIDENCE_DIR"
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg controllerSha "$GITHUB_SHA" \
            --arg mainSha "$EXPECTED_MAIN_SHA" \
            --arg mainTree "$EXPECTED_MAIN_TREE" \
            --arg remoteMain "$remote_main" \
            --arg checkedAt "$(date -u +%FT%TZ)" \
            '{repository:$repository,controllerSha:$controllerSha,mainSha:$mainSha,mainTree:$mainTree,remoteMain:$remoteMain,controllerOnlyBranch:true,checkedAt:$checkedAt}' \
            > "$EVIDENCE_DIR/source-identity.json"

      - name: Re-prove unexpired exact replacement backup
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BACKUP_RUN_ID" > "$RUNNER_TEMP/backup-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$BACKUP_ARTIFACT_ID" > "$RUNNER_TEMP/backup-artifact.json"
          jq -e --arg head "$BACKUP_RUN_HEAD" '.status=="completed" and .conclusion=="success" and .head_sha==$head' "$RUNNER_TEMP/backup-run.json" >/dev/null
          jq -e --argjson id "$BACKUP_ARTIFACT_ID" --arg digest "$BACKUP_ARTIFACT_DIGEST" '
            .id==$id and .expired==false and .digest==$digest and (.expires_at | fromdateiso8601) > now
          ' "$RUNNER_TEMP/backup-artifact.json" >/dev/null
          jq -n \
            --argjson runId "$BACKUP_RUN_ID" \
            --arg head "$BACKUP_RUN_HEAD" \
            --argjson artifactId "$BACKUP_ARTIFACT_ID" \
            --arg digest "$BACKUP_ARTIFACT_DIGEST" \
            --arg expiresAt "$(jq -r .expires_at "$RUNNER_TEMP/backup-artifact.json")" \
            --arg verifiedAt "$(date -u +%FT%TZ)" \
            '{runId:$runId,head:$head,artifactId:$artifactId,digest:$digest,expired:false,expiresAt:$expiresAt,verifiedAt:$verifiedAt}' \
            > "$EVIDENCE_DIR/backup-proof.json"

      - name: Guard exact deployment before environment inspection
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          echo "::add-mask::$VERCEL_TOKEN"
          curl -fsS -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v13/deployments/$EXPECTED_DEPLOYMENT_ID?teamId=$VERCEL_TEAM_ID" \
            > "$RUNNER_TEMP/deployment.json"
          jq -e --arg id "$EXPECTED_DEPLOYMENT_ID" --arg project "$EXPECTED_VERCEL_PROJECT_ID" --arg sha "$EXPECTED_MAIN_SHA" '
            ((.id // .uid)==$id)
            and ((.projectId // .project.id // "")==$project)
            and ((.readyState // .state // "")=="READY")
            and (.target=="production")
            and (.meta.githubCommitSha==$sha)
            and ((.alias // .aliases // []) | any(.=="moraltrade.org"))
            and ((.alias // .aliases // []) | any(.=="www.moraltrade.org"))
          ' "$RUNNER_TEMP/deployment.json" >/dev/null
          jq -n \
            --arg deploymentId "$EXPECTED_DEPLOYMENT_ID" \
            --arg projectId "$EXPECTED_VERCEL_PROJECT_ID" \
            --arg mainSha "$EXPECTED_MAIN_SHA" \
            --argjson createdAt "$(jq -r '.createdAt // 0' "$RUNNER_TEMP/deployment.json")" \
            '{deploymentId:$deploymentId,projectId:$projectId,mainSha:$mainSha,target:"production",ready:true,canonicalAliases:true,createdAtMs:$createdAt}' \
            > "$EVIDENCE_DIR/deployment-proof.json"

      - name: Classify production admin UAT capability without retaining values
        shell: bash
        run: |
          set -euo pipefail
          raw="$RUNNER_TEMP/project-envs.json"
          curl -fsS -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v10/projects/$EXPECTED_VERCEL_PROJECT_ID/env?teamId=$VERCEL_TEAM_ID&decrypt=true&source=issue782-admin-uat-preflight" \
            > "$raw"
          DEPLOYMENT_CREATED_MS="$(jq -r '.createdAtMs' "$EVIDENCE_DIR/deployment-proof.json")" \
          RAW_ENV_FILE="$raw" \
          OUTPUT_FILE="$EVIDENCE_DIR/admin-uat-capability.json" \
          node <<'NODE'
          const fs = require('node:fs');
          const raw = JSON.parse(fs.readFileSync(process.env.RAW_ENV_FILE, 'utf8'));
          const envs = Array.isArray(raw.envs) ? raw.envs : [];
          const productionTargets = (entry) => {
            const target = entry.target;
            return Array.isArray(target) ? target.includes('production') : target === 'production';
          };
          const candidates = envs.filter((entry) => entry?.key === 'ADMIN_EMAILS' && productionTargets(entry));
          const values = candidates.map((entry) => typeof entry.value === 'string' ? entry.value : '');
          const emails = values
            .flatMap((value) => value.split(','))
            .map((value) => value.trim().toLowerCase())
            .filter(Boolean);
          const uniqueEmails = [...new Set(emails)];
          const safeSynthetic = uniqueEmails.filter((email) =>
            /^[a-z0-9._+-]+@(qa\.moraltrade\.invalid|qa\.invalid|[a-z0-9.-]+\.invalid)$/.test(email),
          );
          const deploymentCreatedMs = Number(process.env.DEPLOYMENT_CREATED_MS || 0);
          const timestamps = candidates.map((entry) => {
            const rawTime = entry.updatedAt ?? entry.createdAt ?? 0;
            const parsed = typeof rawTime === 'number' ? rawTime : Date.parse(rawTime);
            return Number.isFinite(parsed) ? parsed : 0;
          });
          const latestCandidateMs = timestamps.length ? Math.max(...timestamps) : 0;
          const allDecrypted = candidates.every((entry) => typeof entry.value === 'string');
          const result = {
            schemaVersion: 1,
            projectId: process.env.EXPECTED_VERCEL_PROJECT_ID,
            deploymentId: process.env.EXPECTED_DEPLOYMENT_ID,
            productionAdminEmailsVariableCount: candidates.length,
            normalizedAllowlistEntryCount: uniqueEmails.length,
            safeSyntheticAdminEntryCount: safeSynthetic.length,
            hasSafeSyntheticAdmin: safeSynthetic.length > 0,
            valuesDecryptedInMemory: allDecrypted,
            valuesRetained: false,
            candidateMetadataPredatesDeployment: latestCandidateMs > 0 && latestCandidateMs <= deploymentCreatedMs,
            deploymentCreatedAtMs: deploymentCreatedMs,
            latestCandidateMetadataAtMs: latestCandidateMs,
            checkedAt: new Date().toISOString(),
          };
          fs.writeFileSync(process.env.OUTPUT_FILE, JSON.stringify(result, null, 2) + '\n', { mode: 0o600 });
          NODE
          jq -e '
            .productionAdminEmailsVariableCount >= 0
            and .normalizedAllowlistEntryCount >= 0
            and .safeSyntheticAdminEntryCount >= 0
            and .valuesRetained == false
          ' "$EVIDENCE_DIR/admin-uat-capability.json" >/dev/null
          rm -f "$raw"

      - name: Scan retained evidence and remove raw API responses
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > "$EVIDENCE_DIR/privacy-scan.json"
          from pathlib import Path
          import json, re
          root = Path('issue782-admin-env-preflight-evidence')
          files = [p for p in root.rglob('*') if p.is_file()]
          patterns = {
              'email': re.compile(rb'[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}', re.I),
              'database_url': re.compile(rb'postgres(?:ql)?://[^\s"\']+', re.I),
              'jwt': re.compile(rb'eyJ[A-Za-z0-9_-]{12,}\.[A-Za-z0-9_-]{12,}\.[A-Za-z0-9_-]{8,}'),
              'bearer': re.compile(rb'Bearer\s+[A-Za-z0-9._~+/-]{20,}', re.I),
              'private_key': re.compile(rb'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----'),
              'provider_secret': re.compile(rb'(?:sk_(?:live|test)_|whsec_)[A-Za-z0-9_-]{8,}', re.I),
          }
          findings=[]
          for file in files:
              data=file.read_bytes()
              for label, pattern in patterns.items():
                  if pattern.search(data): findings.append({'type':label,'file':str(file)})
          result={'filesScanned':len(files),'findings':findings}
          print(json.dumps(result,sort_keys=True))
          if findings: raise SystemExit('Sensitive value pattern found in retained preflight evidence.')
          PY
          jq -e '.findings==[]' "$EVIDENCE_DIR/privacy-scan.json" >/dev/null
          rm -f "$RUNNER_TEMP/backup-run.json" "$RUNNER_TEMP/backup-artifact.json" "$RUNNER_TEMP/deployment.json"

      - name: Upload redacted preflight evidence
        uses: actions/upload-artifact@v4
        with:
          name: issue782-admin-uat-capability-${{ github.run_id }}-${{ github.sha }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 30

      - name: Record capability classification
        shell: bash
        run: |
          set -euo pipefail
          has_safe="$(jq -r .hasSafeSyntheticAdmin "$EVIDENCE_DIR/admin-uat-capability.json")"
          candidate_predates="$(jq -r .candidateMetadataPredatesDeployment "$EVIDENCE_DIR/admin-uat-capability.json")"
          {
            echo '### Issue 782 production admin UAT capability preflight'
            echo "- exact main: \`$EXPECTED_MAIN_SHA\`"
            echo "- exact deployment: \`$EXPECTED_DEPLOYMENT_ID\`"
            echo "- unexpired replacement backup: verified"
            echo "- safe synthetic production admin present: \`$has_safe\`"
            echo "- relevant ADMIN_EMAILS metadata predates deployment: \`$candidate_predates\`"
            echo '- allowlist values retained or logged: no'
          } >> "$GITHUB_STEP_SUMMARY"
