name: Materialize Commitments instrumentation remediation

on:
  push:
    branches: [feature/commitments-impact-study-instrumentation-20260811]
    paths:
      - ".github/workflows/materialize-commitments-impact-study-instrumentation-remediation.yml"
      - ".github/remediation/commitments-impact-study-instrumentation-v2.part*"
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/materialize-commitments-impact-study-instrumentation-remediation.yml"
      - ".github/remediation/commitments-impact-study-instrumentation-v2.part*"

permissions:
  contents: write

concurrency:
  group: materialize-commitments-impact-study-instrumentation-remediation
  cancel-in-progress: false

jobs:
  materialize:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/commitments-impact-study-instrumentation-20260811

      - name: Verify and extract exact bundle
        shell: bash
        run: |
          set -euo pipefail

          for part in 00 01 02 03 04 05 06a 06b 06c 06d 07; do
            test -f ".github/remediation/commitments-impact-study-instrumentation-v2.part${part}"
          done

          cat > /tmp/chunk-sha256.txt <<'HASHES'
          7abda09c7ea72b22e642d884b5e6c1f75477a2c2157ae22cfbabb5520fa50e0b  .github/remediation/commitments-impact-study-instrumentation-v2.part00
          4bc224dc66f9606892f64ba594f8f1ac1d0b6ba62996ac9424d5aa9df6c3a186  .github/remediation/commitments-impact-study-instrumentation-v2.part01
          d1f89b6c0f5275fb7b2950edb16edf71aebe7c1607f9e67b0fb6a0754143bec6  .github/remediation/commitments-impact-study-instrumentation-v2.part02
          d8cc1e4bec66bd1420519c0cee562192ec52ea04e4d3d3caf14b35ea5e3f73d0  .github/remediation/commitments-impact-study-instrumentation-v2.part03
          715a1d53db479d1ffcbdd3b0dec0ae16cdeeb0e8f08ec5c04e2287200c426b1f  .github/remediation/commitments-impact-study-instrumentation-v2.part04
          f0b85056ec4137787611c463782781255281303edebbd57ab56736494880b7f2  .github/remediation/commitments-impact-study-instrumentation-v2.part05
          064b85c740f64b02c5619b0e758afd71ce59833ea0cbfc66eeafe0028d3ce2f8  .github/remediation/commitments-impact-study-instrumentation-v2.part06a
          93967de3b4f171f76304d8d9fac249c28a28190030db3c075c2919ff6ac9b4ad  .github/remediation/commitments-impact-study-instrumentation-v2.part06b
          5682c1bb6d0ba15199511be0cb97ff50187c1b29b77d4f05b71b7bee1207c4bc  .github/remediation/commitments-impact-study-instrumentation-v2.part06c
          7d8b4d70936530bd45805bb81b3155c00f26e4d22644c317a4b6031ba5fb06d9  .github/remediation/commitments-impact-study-instrumentation-v2.part06d
          8039c5cfdb03df01dc0a1f0cf849f2da7c1fded3fa5f927a5983542a9eb0ab44  .github/remediation/commitments-impact-study-instrumentation-v2.part07
          HASHES
          sha256sum --check /tmp/chunk-sha256.txt

          cat \
            .github/remediation/commitments-impact-study-instrumentation-v2.part{00,01,02,03,04,05} \
            .github/remediation/commitments-impact-study-instrumentation-v2.part{06a,06b,06c,06d} \
            .github/remediation/commitments-impact-study-instrumentation-v2.part07 \
            > /tmp/bundle.b64
          echo "fd91f29d96740b3f31649cebd4f42dbeb83fe55ac0921f22a25def4aa543560b  /tmp/bundle.b64" | sha256sum --check

          base64 --decode /tmp/bundle.b64 > /tmp/bundle.tgz
          echo "de7f509c0d0a3f49e6970965eb705c6ac58ef46c687da6499893dcfdefc3bada  /tmp/bundle.tgz" | sha256sum --check

          tar -tzf /tmp/bundle.tgz | sort > /tmp/actual-files.txt
          cat > /tmp/expected-files.txt <<'FILES'
          .github/workflows/commitments-impact-study-instrumentation-gates.yml
          docs/commitments/impact-identification/canonical-json-parity-fixtures.v2.json
          docs/commitments/impact-identification/qa-study-instrumentation-v1.md
          docs/commitments/impact-identification/study-instance-validator-binding.v2.json
          docs/commitments/impact-identification/study-instance.schema.v2.json
          docs/commitments/impact-identification/synthetic-study-fixtures/trade-validation-fixture.v2.json
          scripts/validate-commitments-impact-study-instance.mjs
          supabase/migrations/20260811161238_commitments_impact_study_instrumentation_review_remediation_core.sql
          supabase/migrations/20260811161445_commitments_impact_study_instrumentation_review_remediation_instance_validator.sql
          supabase/migrations/20260811161708_commitments_impact_study_instrumentation_review_remediation_child_validators.sql
          supabase/migrations/20260811161948_commitments_impact_study_instrumentation_review_remediation_rpcs.sql
          supabase/migrations/20260811162054_commitments_impact_study_instrumentation_review_remediation_privileges.sql
          supabase/tests/commitments_impact_study_instrumentation_qa_only.sql
          FILES
          sort -o /tmp/expected-files.txt /tmp/expected-files.txt
          diff -u /tmp/expected-files.txt /tmp/actual-files.txt

          tar -xzf /tmp/bundle.tgz -C .

          rm -f .github/remediation/commitments-impact-study-instrumentation-v2.part*
          rmdir .github/remediation 2>/dev/null || true
          rm -f .github/workflows/materialize-commitments-impact-study-instrumentation-remediation.yml

      - name: Commit exact remediation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check -- . \
            ':(exclude)supabase/migrations/20260811161238_commitments_impact_study_instrumentation_review_remediation_core.sql' \
            ':(exclude)supabase/migrations/20260811161445_commitments_impact_study_instrumentation_review_remediation_instance_validator.sql'
          git commit -m "Remediate QA-only impact-study instrumentation review"
          git push origin HEAD:feature/commitments-impact-study-instrumentation-20260811
