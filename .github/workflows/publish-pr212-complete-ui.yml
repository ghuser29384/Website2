name: Publish PR 212 complete institutional interfaces

on:
  push:
    branches:
      - ops/pr212-complete-ui-publish-20260730
    paths:
      - .github/workflows/publish-pr212-complete-ui.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-pr212-complete-ui
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      EXPECTED_HEAD: 9ec3bd79618a704469bc4f3547d2d8a1e4dc2730
      EXPECTED_PATCH_SHA256: d0b3c68affcb27cebc0d4773d487d056e66dc500ccf99776a85b97ac051cd2f0
      NEXT_PUBLIC_SUPABASE_URL: https://hvmxfjjbdcgjjudmthdz.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.QA_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.QA_SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      SITE_URL: http://127.0.0.1:3000
      INSTITUTIONAL_TRADES_ENABLED: "true"
      INSTITUTIONAL_POOLS_ENABLED: "true"
      INSTITUTIONAL_ENTERPRISE_API_ENABLED: "true"
      INSTITUTIONAL_WEBHOOKS_ENABLED: "true"
      CRON_SECRET: qa-institutional-cron-not-production

    steps:
      - name: Check out exact PR branch
        uses: actions/checkout@v4
        with:
          ref: feat/institutional-trade-system
          fetch-depth: 0

      - name: Reconstruct and apply reviewed implementation patch
        shell: bash
        run: |
          set -euo pipefail
          actual_head="$(git rev-parse HEAD)"
          if [[ "$actual_head" != "$EXPECTED_HEAD" ]]; then
            echo "PR #212 moved: expected $EXPECTED_HEAD, got $actual_head" >&2
            exit 1
          fi

          git fetch origin \
            refs/heads/ops/pr212-complete-ui-20260729:refs/remotes/origin/ops/pr212-complete-ui-20260729
          git show origin/ops/pr212-complete-ui-20260729:.github/workflows/apply-pr212-complete-ui.yml \
            > /tmp/apply-pr212-complete-ui.yml

          python - <<'PY'
          from __future__ import annotations

          import base64
          import gzip
          import hashlib
          import re
          from pathlib import Path

          source = Path("/tmp/apply-pr212-complete-ui.yml").read_text()
          match = re.search(
              r"cat > /tmp/pr212-complete-ui\.patch\.gz\.b64 <<'PATCH'\s*\n(.*?)\n\s*PATCH\s*\n",
              source,
              flags=re.DOTALL,
          )
          if not match:
              raise SystemExit("Could not locate the reviewed patch payload in the source workflow.")

          encoded = "".join(match.group(1).split())
          compressed = base64.b64decode(encoded, validate=True)
          patch = gzip.decompress(compressed)
          digest = hashlib.sha256(patch).hexdigest()
          expected = "d0b3c68affcb27cebc0d4773d487d056e66dc500ccf99776a85b97ac051cd2f0"
          if digest != expected:
              raise SystemExit(f"Patch digest mismatch: expected {expected}, got {digest}")
          Path("/tmp/pr212-complete-ui.patch").write_bytes(patch)
          PY

          echo "${EXPECTED_PATCH_SHA256}  /tmp/pr212-complete-ui.patch" | sha256sum --check --strict
          git apply --check --binary /tmp/pr212-complete-ui.patch
          git apply --binary /tmp/pr212-complete-ui.patch
          git diff --check

          cat > /tmp/expected-paths.txt <<'PATHS'
          .github/scripts/institutional-trade-qa-e2e.mjs
          .github/workflows/institutional-trade-qa.yml
          src/app/admin/institutional-deal-desk/page.tsx
          src/app/institutions/[organizationId]/deals/[dealId]/page.tsx
          src/app/institutions/[organizationId]/page.tsx
          src/app/institutions/actions.ts
          src/app/institutions/individual/deals/[dealId]/page.tsx
          src/app/institutions/individual/page.tsx
          src/app/institutions/institutions.module.css
          src/components/institutions/institutional-deal-workspace.tsx
          src/institutional-individual-capacity.test.ts
          src/institutional-product-completeness.test.ts
          src/institutional-trade-migration.test.ts
          src/institutional-trade-wiring.test.ts
          src/lib/institutional-data.ts
          src/lib/institutional-trade.ts
          supabase/migrations/20260726123000_institutional_trade_system.sql
          PATHS
          git status --short | sed -E 's/^.. //' | sort -u > /tmp/actual-paths.txt
          diff -u <(sort /tmp/expected-paths.txt) /tmp/actual-paths.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies with transient-registry retry
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            if npm ci; then exit 0; fi
            if (( attempt == 4 )); then exit 1; fi
            sleep $((attempt * 20))
          done

      - name: Run institutional source-contract and domain tests
        shell: bash
        run: |
          set -euo pipefail
          node --import tsx --test \
            src/institutional-individual-capacity.test.ts \
            src/institutional-product-completeness.test.ts \
            src/institutional-trade-migration.test.ts \
            src/institutional-trade-wiring.test.ts \
            src/lib/institutional-trade.test.ts \
            src/lib/institutional-webhooks.test.ts
          node --check .github/scripts/institutional-trade-qa-e2e.mjs

      - name: Require absolute TypeScript success
        run: npx tsc --noEmit --pretty false

      - name: Require absolute ESLint success
        run: npm run lint

      - name: Require absolute production build success
        run: npm run build

      - name: Commit complete interfaces to PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete institutional trade interfaces and authenticated flows"
          git push origin HEAD:feat/institutional-trade-system
