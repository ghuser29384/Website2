name: Issue 782 terminal diagnostic

on:
  push:
    branches:
      - ops/dac-production-canonical-uat-26d1fe43-20260824
    paths:
      - .github/workflows/dac-production-issue782-terminal-diagnostic-20260826.yml

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: issue782-terminal-diagnostic
  cancel-in-progress: false

env:
  CONTROLLER_BRANCH: ops/dac-production-canonical-uat-26d1fe43-20260824
  EXPECTED_MAIN_SHA: 26d1fe436dbf9a4440bfafd501ddf8db944a1127
  ISSUE_NUMBER: "782"
  SUPERVISOR_WORKFLOW: dac-production-issue782-authorized-supervisor-20260826.yml
  FINALIZER_WORKFLOW: dac-production-issue782-authorized-finalizer-20260826.yml
  EVIDENCE_DIR: issue782-terminal-diagnostic-evidence

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Gather terminal run and issue state
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$EXPECTED_MAIN_SHA"
          mkdir -p "$EVIDENCE_DIR"
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER" > "$EVIDENCE_DIR/issue.json"
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments?per_page=100" > "$EVIDENCE_DIR/comments.json"

          for item in supervisor:$SUPERVISOR_WORKFLOW finalizer:$FINALIZER_WORKFLOW; do
            label="${item%%:*}"
            workflow="${item#*:}"
            run_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?branch=$CONTROLLER_BRANCH&per_page=20" | jq -r '[.workflow_runs[]] | sort_by(.created_at) | last | .id // empty')"
            if [[ "$run_id" =~ ^[0-9]+$ ]]; then
              gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" > "$EVIDENCE_DIR/$label-run.json"
              gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100" > "$EVIDENCE_DIR/$label-jobs.json"
              gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts" > "$EVIDENCE_DIR/$label-artifacts.json"
            fi
          done

          controller_run_id="$(jq -r '
            [ .[]
              | select(.created_at >= "2026-08-26T03:32:56Z")
              | select(.body | contains("Authorized issue #782 controller supervision"))
              | (.body | capture("controller run: `(?<id>[0-9]+)`").id)
            ] | last // empty
          ' "$EVIDENCE_DIR/comments.json")"
          if [[ "$controller_run_id" =~ ^[0-9]+$ ]]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$controller_run_id" > "$EVIDENCE_DIR/controller-run.json"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$controller_run_id/jobs?per_page=100" > "$EVIDENCE_DIR/controller-jobs.json"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$controller_run_id/artifacts" > "$EVIDENCE_DIR/controller-artifacts.json"
          fi

      - name: Produce first-cause classification
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          root=Path('issue782-terminal-diagnostic-evidence')
          def load(name, default=None):
            p=root/name
            return json.loads(p.read_text()) if p.exists() else default
          issue=load('issue.json',{})
          comments=load('comments.json',[])
          runs={}
          first_failures=[]
          for label in ('supervisor','controller','finalizer'):
            run=load(f'{label}-run.json')
            jobs=load(f'{label}-jobs.json',{}).get('jobs',[])
            if run:
              runs[label]={'id':run.get('id'),'status':run.get('status'),'conclusion':run.get('conclusion'),'url':run.get('html_url')}
            for job in jobs:
              for step in job.get('steps',[]):
                if step.get('conclusion')=='failure':
                  first_failures.append({'scope':label,'jobId':job.get('id'),'job':job.get('name'),'step':step.get('name'),'stepNumber':step.get('number')})
                  break
              if first_failures and first_failures[-1]['scope']==label:
                break
          terminal=None
          for comment in comments:
            body=comment.get('body','')
            for value in ('production_release_passed','rolled_back','blocked_before_release'):
              if value in body:
                terminal=value
          result={
            'issueState':issue.get('state'),
            'issueStateReason':issue.get('state_reason'),
            'terminalMarker':terminal,
            'runs':runs,
            'firstFailures':first_failures,
            'diagnosedAt':__import__('datetime').datetime.now(__import__('datetime').timezone.utc).isoformat(),
          }
          (root/'diagnostic.json').write_text(json.dumps(result,indent=2)+'\n')
          PY

      - name: Post concise diagnostic record
        shell: bash
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/comment.md"
          python3 - <<'PY' > "$body"
          import json
          d=json.load(open('issue782-terminal-diagnostic-evidence/diagnostic.json'))
          print('## Issue #782 terminal diagnostic')
          print()
          print(f"- issue state: `{d.get('issueState')}`")
          print(f"- terminal marker: `{d.get('terminalMarker') or 'none'}`")
          for label,run in d.get('runs',{}).items():
            print(f"- {label} run: `{run.get('id')}` — `{run.get('status')}/{run.get('conclusion')}` — {run.get('url')}")
          if d.get('firstFailures'):
            f=d['firstFailures'][0]
            print(f"- first causal failed step: `{f.get('scope')}` / `{f.get('job')}` / `{f.get('step')}` (job `{f.get('jobId')}`)")
          else:
            print('- first causal failed step: `none recorded`')
          print()
          print('This diagnostic is read-only with respect to production, migrations, aliases, Auth users, synthetic rows, providers, and payments.')
          PY
          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" -f body="$(cat "$body")" >/dev/null

      - name: Upload diagnostic evidence
        uses: actions/upload-artifact@v4
        with:
          name: issue782-terminal-diagnostic-${{ github.run_id }}-${{ github.sha }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 30
