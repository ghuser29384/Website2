name: A1 smoke bundle diagnostics

on:
  pull_request:
    branches:
      - main
    paths:
      - .a1-production-smoke/**

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the smoke branch
        uses: actions/checkout@v4
        with:
          ref: ops/a1-production-smoke-20260725
          show-progress: false
      - name: Reconstruct bundle and capture syntax diagnostics
        id: check
        shell: bash
        run: |
          set +e
          cat .a1-production-smoke/part-* | base64 --decode > a1-production-smoke.mjs
          sha256sum a1-production-smoke.mjs > bundle-sha256.txt
          node --check a1-production-smoke.mjs > syntax-check.txt 2>&1
          status=$?
          echo "$status" > syntax-status.txt
          cat bundle-sha256.txt
          cat syntax-check.txt
          exit 0
      - name: Upload reconstructed bundle and diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: a1-smoke-bundle-diagnostics-${{ github.run_id }}
          path: |
            a1-production-smoke.mjs
            bundle-sha256.txt
            syntax-check.txt
            syntax-status.txt
          retention-days: 7
      - name: Enforce syntax success
        shell: bash
        run: test "$(cat syntax-status.txt)" = "0"
