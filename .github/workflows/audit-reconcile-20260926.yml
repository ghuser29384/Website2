name: Reconciled audit remediation QA
on:
  push:
    branches: [ops/audit-source-20260926]
    paths: [.github/workflows/audit-reconcile-20260926.yml]
permissions:
  contents: write
concurrency:
  group: audit-reconcile-20260926
  cancel-in-progress: false
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      MORAL_TRADE_DISABLE_DEP_REPAIR: '1'
      NEXT_TELEMETRY_DISABLED: '1'
      PLAYWRIGHT_HTML_OPEN: never
      PLAYWRIGHT_USE_PRODUCTION_SERVER: '1'
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3210
      SITE_URL: http://127.0.0.1:3210
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: controller
          persist-credentials: false
          show-progress: false
      - uses: actions/checkout@v4
        with:
          ref: d329155236bf64bd9ba84c93ca79a084da4827c8
          path: candidate
          fetch-depth: 0
          persist-credentials: false
          show-progress: false
      - name: Reconcile only reviewed conflicts
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = ghuser29384/Website2
          test "$GITHUB_REF" = refs/heads/ops/audit-source-20260926
          git config user.name 'ghuser29384'
          git config user.email '262476329+ghuser29384@users.noreply.github.com'
          python3 ../controller/.github/audit-reconcile.py
      - name: Fast-forward only the authorized fix branch
        working-directory: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branch=fix/audit-truth-locale-20260926
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = d329155236bf64bd9ba84c93ca79a084da4827c8
          git commit -m 'Reconcile approved Commitments redesign with audit correctness fixes'
          test "$(git rev-parse HEAD^1)" = d329155236bf64bd9ba84c93ca79a084da4827c8
          test "$(git rev-parse HEAD^2)" = caa25edccad0a444d4d18b45046a9e3fdfc1abf8
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin "HEAD:refs/heads/$branch"
          git rev-parse HEAD | tee ../evidence/candidate-sha.txt
          git rev-parse 'HEAD^{tree}' > ../evidence/candidate-tree.txt
          git diff --stat HEAD^2 HEAD > ../evidence/scope.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: candidate/package-lock.json
      - name: Install locked dependencies
        working-directory: candidate
        run: npm ci --no-audit --no-fund
      - name: Tests and lint
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          npm test 2>&1 | tee ../evidence/unit-tests.log
          node --import tsx --test src/commitments-portfolio-wiring.test.ts src/commitments-redesign-contract.test.ts src/live-account-data.test.ts src/lib/local-date-time.test.ts 2>&1 | tee ../evidence/source-tests.log
          npm run lint -- --quiet 2>&1 | tee ../evidence/lint.log
      - name: Production build and TypeScript
        working-directory: candidate
        env:
          VERCEL: '1'
        shell: bash
        run: |
          set -euo pipefail
          npm run build 2>&1 | tee ../evidence/build.log
          npx tsc --noEmit --pretty false 2>&1 | tee ../evidence/typescript.log
      - name: Install Chromium
        working-directory: candidate
        run: npx playwright install --with-deps chromium
      - name: Account, locale and partial-record browser tests
        id: audit
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          npx playwright test --config=playwright.audit.config.ts --reporter=line 2>&1 | tee ../evidence/audit-browser.log
      - name: Preserve audit screenshots
        if: always()
        run: |
          if test -d candidate/test-results; then cp -r candidate/test-results evidence/audit-test-results; fi
      - name: Existing authenticated Commitments regression tests
        if: success() || steps.audit.outcome == 'failure'
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          npx playwright test --config=playwright.commitments.config.ts --reporter=line 2>&1 | tee ../evidence/commitments-browser.log
      - name: Preserve Commitments screenshots
        if: always()
        run: |
          if test -d candidate/test-results; then cp -r candidate/test-results evidence/commitments-test-results; fi
      - name: Complete current release browser suite
        if: success() || steps.audit.outcome == 'failure'
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          npm run test:e2e:release -- --reporter=line 2>&1 | tee ../evidence/release-browser.log
      - name: Collect evidence
        if: always()
        run: |
          mkdir -p evidence
          if test -d candidate/test-results; then cp -r candidate/test-results evidence/release-test-results; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reconciled-audit-qa-${{ github.run_id }}
          path: evidence
          retention-days: 14
