name: Repair Vercel recovery verifier once

on:
  push:
    branches:
      - fix/vercel-recovery-readback-20260802
    paths:
      - .github/workflows/repair-vercel-recovery-verifier-once.yml

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: repair-vercel-recovery-verifier-once
  cancel-in-progress: false

jobs:
  repair:
    if: github.repository == 'ghuser29384/Website2'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder
      CONDITIONAL_PAYMENTS_MODE: disabled
      TRADE_DONATION_POOL_ENABLED: "false"
      TRADE_DONATION_POOL_MODE: disabled
      DIRECT_DONATION_UPGRADES_ENABLED: "false"
      DIRECT_DONATION_UPGRADE_MODE: disabled

    steps:
      - name: Check out exact repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/vercel-recovery-readback-20260802
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Guard current main base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = 'fix/vercel-recovery-readback-20260802'
          git fetch --no-tags origin main
          test "$(git merge-base HEAD origin/main)" = "$(git rev-parse origin/main)"
          test "$(git diff --name-only origin/main...HEAD)" = '.github/workflows/repair-vercel-recovery-verifier-once.yml'

      - name: Apply fail-closed production-deployment readback repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          script_path = Path('scripts/vercel-admin-cost-controls.mjs')
          text = script_path.read_text()

          old_summary = '''function safeLink(link) {
            if (!link || typeof link !== "object") return null;
            return {
              type: link.type ?? null,
              org: link.org ?? null,
              repo: link.repo ?? null,
              repoId: link.repoId ?? null,
              productionBranch: link.productionBranch ?? null,
            };
          }

          export function safeProjectSummary(project, domains = []) {
            if (!project) return null;
            return {
              id: project.id,
              name: project.name,
              live: project.live ?? null,
              framework: project.framework ?? null,
              link: safeLink(project.link),
              domains: domains
                .map((entry) => (typeof entry === "string" ? entry : entry?.name))
                .filter(Boolean)
                .sort(),
              resourceConfig: project.resourceConfig
                ? {
                    buildMachineType: project.resourceConfig.buildMachineType ?? null,
                    elasticConcurrencyEnabled:
                      project.resourceConfig.elasticConcurrencyEnabled ?? null,
                    buildQueue:
                      project.resourceConfig.buildQueue?.configuration ?? null,
                  }
                : null,
              speedInsightsEnabled: Boolean(project.speedInsights?.enabledAt),
              webAnalyticsEnabled: Boolean(project.webAnalytics?.enabledAt),
              latestDeployment: project.latestDeployments?.[0]
                ? {
                    id: project.latestDeployments[0].id,
                    readyState: project.latestDeployments[0].readyState,
                    target: project.latestDeployments[0].target ?? null,
                    createdAt: project.latestDeployments[0].createdAt ?? null,
                  }
                : null,
            };
          }
          '''

          new_summary = '''function safeLink(link) {
            if (!link || typeof link !== "object") return null;
            return {
              type: link.type ?? null,
              org: link.org ?? null,
              repo: link.repo ?? null,
              repoId: link.repoId ?? null,
              productionBranch: link.productionBranch ?? null,
            };
          }

          function safeDeploymentSummary(deployment) {
            if (!deployment || typeof deployment !== "object") return null;
            const id = deployment.id ?? deployment.uid ?? null;
            if (!id) return null;
            return {
              id,
              readyState: deployment.readyState ?? deployment.state ?? null,
              target: deployment.target ?? null,
              createdAt: deployment.createdAt ?? deployment.created ?? null,
            };
          }

          export function selectReadyProductionDeployment(deployments = []) {
            return (
              deployments
                .map(safeDeploymentSummary)
                .filter(
                  (deployment) =>
                    deployment?.readyState === "READY" &&
                    deployment.target === "production",
                )
                .sort(
                  (left, right) =>
                    Number(right.createdAt ?? 0) - Number(left.createdAt ?? 0),
                )[0] ?? null
            );
          }

          export function safeProjectSummary(
            project,
            domains = [],
            productionDeployments = [],
          ) {
            if (!project) return null;
            const resourceConfig = project.resourceConfig
              ? {
                  buildMachineType: project.resourceConfig.buildMachineType ?? null,
                  buildQueue:
                    project.resourceConfig.buildQueue?.configuration ?? null,
                  ...(Object.hasOwn(
                    project.resourceConfig,
                    "elasticConcurrencyEnabled",
                  )
                    ? {
                        elasticConcurrencyEnabled:
                          project.resourceConfig.elasticConcurrencyEnabled,
                      }
                    : {}),
                }
              : null;

            return {
              id: project.id,
              name: project.name,
              live: project.live ?? null,
              framework: project.framework ?? null,
              link: safeLink(project.link),
              domains: domains
                .map((entry) => (typeof entry === "string" ? entry : entry?.name))
                .filter(Boolean)
                .sort(),
              resourceConfig,
              speedInsightsEnabled: Boolean(project.speedInsights?.enabledAt),
              webAnalyticsEnabled: Boolean(project.webAnalytics?.enabledAt),
              latestDeployment: safeDeploymentSummary(
                project.latestDeployments?.[0],
              ),
              productionDeployment:
                selectReadyProductionDeployment(productionDeployments),
            };
          }
          '''
          text = replace_once(text, old_summary, new_summary, 'project summary block')

          old_domains = '''async function getDomains(token, id, { allow404 = false } = {}) {
            const response = await request(
              `/v9/projects/${encodeURIComponent(id)}/domains?limit=100`,
              { token, allow404 },
            );
            return response?.domains ?? [];
          }

          async function inspectProject(token, expected, { allow404 = false } = {}) {
            const project = await getProject(token, expected.id, { allow404 });
            if (!project) return null;
            if (project.id !== expected.id || project.name !== expected.name) {
              throw new Error(
                `Project identity mismatch for ${expected.name}: ${JSON.stringify({
                  id: project.id,
                  name: project.name,
                })}`,
              );
            }
            const domains = await getDomains(token, expected.id);
            return { project, domains, summary: safeProjectSummary(project, domains) };
          }

          async function audit(token) {
            const canonical = await inspectProject(token, CANONICAL_PROJECT);
          '''

          new_domains = '''async function getDomains(token, id, { allow404 = false } = {}) {
            const response = await request(
              `/v9/projects/${encodeURIComponent(id)}/domains?limit=100`,
              { token, allow404 },
            );
            return response?.domains ?? [];
          }

          async function getProductionDeployments(token, id) {
            const response = await request(
              `/v6/deployments?projectId=${encodeURIComponent(id)}&target=production&limit=20`,
              { token },
            );
            return response?.deployments ?? [];
          }

          async function inspectProject(
            token,
            expected,
            { allow404 = false, includeProductionDeployments = false } = {},
          ) {
            const project = await getProject(token, expected.id, { allow404 });
            if (!project) return null;
            if (project.id !== expected.id || project.name !== expected.name) {
              throw new Error(
                `Project identity mismatch for ${expected.name}: ${JSON.stringify({
                  id: project.id,
                  name: project.name,
                })}`,
              );
            }
            const domains = await getDomains(token, expected.id);
            const productionDeployments = includeProductionDeployments
              ? await getProductionDeployments(token, expected.id)
              : [];
            return {
              project,
              domains,
              summary: safeProjectSummary(
                project,
                domains,
                productionDeployments,
              ),
            };
          }

          async function audit(token) {
            const canonical = await inspectProject(token, CANONICAL_PROJECT, {
              includeProductionDeployments: true,
            });
          '''
          text = replace_once(text, old_domains, new_domains, 'deployment audit block')

          old_settings = '''export function verifyCanonicalSettings(summary) {
            if (!summary) throw new Error("Canonical Vercel project is missing.");
            const config = summary.resourceConfig;
            if (config?.buildMachineType !== "standard") {
              throw new Error(
                `Canonical build machine is not standard: ${JSON.stringify(config)}`,
              );
            }
            if (config.elasticConcurrencyEnabled === true) {
              throw new Error(
                `On-demand build concurrency remains enabled: ${JSON.stringify(config)}`,
              );
            }
            if (config.buildQueue !== "WAIT_FOR_NAMESPACE_QUEUE") {
              throw new Error(
                `Canonical build queue is not serialized: ${JSON.stringify(config)}`,
              );
            }
            return true;
          }

          export function verifyCanonicalLive(summary) {
            if (!summary) throw new Error("Canonical Vercel project is missing.");
            if (summary.live !== true) {
              throw new Error(
                `Canonical Vercel project is not live: ${JSON.stringify({
                  id: summary.id,
                  name: summary.name,
                  live: summary.live,
                })}`,
              );
            }
            return true;
          }
          '''

          new_settings = '''export function verifyCanonicalSettings(summary) {
            if (!summary) throw new Error("Canonical Vercel project is missing.");
            const config = summary.resourceConfig;
            if (config?.buildMachineType !== "standard") {
              throw new Error(
                `Canonical build machine is not standard: ${JSON.stringify(config)}`,
              );
            }
            if (!Object.hasOwn(config, "elasticConcurrencyEnabled")) {
              throw new Error(
                `On-demand build concurrency readback is missing: ${JSON.stringify(config)}`,
              );
            }
            if (
              config.elasticConcurrencyEnabled !== false &&
              config.elasticConcurrencyEnabled !== null
            ) {
              throw new Error(
                `On-demand build concurrency is not disabled: ${JSON.stringify(config)}`,
              );
            }
            if (config.buildQueue !== "WAIT_FOR_NAMESPACE_QUEUE") {
              throw new Error(
                `Canonical build queue is not serialized: ${JSON.stringify(config)}`,
              );
            }
            return true;
          }

          export function verifyCanonicalLive(summary) {
            if (!summary) throw new Error("Canonical Vercel project is missing.");
            const productionDeployment = summary.productionDeployment;
            const domains = new Set(summary.domains ?? []);
            const canonicalAliasesAssigned =
              domains.has("moraltrade.org") &&
              domains.has("www.moraltrade.org");
            const productionIsReady =
              Boolean(productionDeployment?.id) &&
              productionDeployment.readyState === "READY" &&
              productionDeployment.target === "production";

            if (!productionIsReady || !canonicalAliasesAssigned) {
              throw new Error(
                `Canonical Vercel project is not operational: ${JSON.stringify({
                  id: summary.id,
                  name: summary.name,
                  live: summary.live,
                  productionDeployment: productionDeployment ?? null,
                  domains: [...domains].sort(),
                })}`,
              );
            }
            return true;
          }
          '''
          text = replace_once(text, old_settings, new_settings, 'verification block')
          script_path.write_text(text)

          test_path = Path('scripts/vercel-admin-cost-controls.test.mjs')
          tests = test_path.read_text()
          tests = replace_once(
              tests,
              '  runProductionSmoke,\n  safeProjectSummary,',
              '  runProductionSmoke,\n  safeProjectSummary,\n  selectReadyProductionDeployment,',
              'test import',
          )

          old_verification_test = '''test("canonical verification fails closed when settings or live state are wrong", () => {
            const canonical = {
              id: CANONICAL_PROJECT.id,
              name: CANONICAL_PROJECT.name,
              live: true,
              resourceConfig: {
                buildMachineType: "standard",
                elasticConcurrencyEnabled: false,
                buildQueue: "WAIT_FOR_NAMESPACE_QUEUE",
              },
            };

            assert.equal(verifyCanonicalSettings(canonical), true);
            assert.equal(
              verifyCanonicalSettings({
                ...canonical,
                resourceConfig: {
                  ...canonical.resourceConfig,
                  elasticConcurrencyEnabled: null,
                },
              }),
              true,
            );
            assert.equal(verifyCanonicalLive(canonical), true);
            assert.throws(
              () => verifyCanonicalLive({ ...canonical, live: false }),
              /not live/,
            );
            assert.throws(
              () =>
                verifyCanonicalSettings({
                  ...canonical,
                  resourceConfig: {
                    ...canonical.resourceConfig,
                    elasticConcurrencyEnabled: true,
                  },
                }),
              /concurrency remains enabled/,
            );
          });
          '''

          new_verification_test = '''test("canonical verification accepts normalized disabled readback and a READY production deployment", () => {
            const canonical = {
              id: CANONICAL_PROJECT.id,
              name: CANONICAL_PROJECT.name,
              live: false,
              domains: ["moraltrade.org", "www.moraltrade.org"],
              latestDeployment: {
                id: "dpl_newer_preview",
                readyState: "READY",
                target: null,
                createdAt: 300,
              },
              productionDeployment: {
                id: "dpl_current_production",
                readyState: "READY",
                target: "production",
                createdAt: 200,
              },
              resourceConfig: {
                buildMachineType: "standard",
                elasticConcurrencyEnabled: false,
                buildQueue: "WAIT_FOR_NAMESPACE_QUEUE",
              },
            };

            assert.equal(verifyCanonicalSettings(canonical), true);
            assert.equal(verifyCanonicalLive(canonical), true);
            assert.equal(
              verifyCanonicalSettings({
                ...canonical,
                resourceConfig: {
                  ...canonical.resourceConfig,
                  elasticConcurrencyEnabled: null,
                },
              }),
              true,
            );
            assert.throws(
              () =>
                verifyCanonicalSettings({
                  ...canonical,
                  resourceConfig: {
                    buildMachineType: "standard",
                    buildQueue: "WAIT_FOR_NAMESPACE_QUEUE",
                  },
                }),
              /readback is missing/,
            );
            assert.throws(
              () =>
                verifyCanonicalSettings({
                  ...canonical,
                  resourceConfig: {
                    ...canonical.resourceConfig,
                    elasticConcurrencyEnabled: true,
                  },
                }),
              /concurrency is not disabled/,
            );
            assert.throws(
              () =>
                verifyCanonicalLive({
                  ...canonical,
                  productionDeployment: {
                    ...canonical.productionDeployment,
                    readyState: "BUILDING",
                  },
                }),
              /not operational/,
            );
            assert.throws(
              () =>
                verifyCanonicalLive({
                  ...canonical,
                  domains: ["moraltrade.org"],
                }),
              /not operational/,
            );
          });

          test("production deployment selection ignores newer previews and non-ready production deployments", () => {
            assert.deepEqual(
              selectReadyProductionDeployment([
                {
                  id: "dpl_newer_preview",
                  readyState: "READY",
                  target: null,
                  createdAt: 400,
                },
                {
                  id: "dpl_building_production",
                  readyState: "BUILDING",
                  target: "production",
                  createdAt: 350,
                },
                {
                  uid: "dpl_older_production",
                  state: "READY",
                  target: "production",
                  created: 100,
                },
                {
                  id: "dpl_current_production",
                  readyState: "READY",
                  target: "production",
                  createdAt: 200,
                },
              ]),
              {
                id: "dpl_current_production",
                readyState: "READY",
                target: "production",
                createdAt: 200,
              },
            );
          });
          '''
          tests = replace_once(
              tests,
              old_verification_test,
              new_verification_test,
              'canonical verification test',
          )

          old_audit_test = '''test("audit summaries redact environment-variable values and other secrets", () => {
            const summary = safeProjectSummary(
              {
                id: CANONICAL_PROJECT.id,
                name: CANONICAL_PROJECT.name,
                live: true,
                framework: "nextjs",
                link: {
                  type: "github",
                  org: "ghuser29384",
                  repo: "Website2",
                  repoId: 1204006559,
                  productionBranch: "main",
                  gitCredentialId: "secret-credential-id",
                },
                env: [{ key: "DATABASE_URL", value: "must-not-leak" }],
                resourceConfig: {
                  buildMachineType: "standard",
                  elasticConcurrencyEnabled: false,
                  buildQueue: { configuration: "WAIT_FOR_NAMESPACE_QUEUE" },
                },
                speedInsights: { enabledAt: 1 },
                webAnalytics: { enabledAt: 1 },
                latestDeployments: [
                  { id: "dpl_1", readyState: "READY", target: "production" },
                ],
              },
              [{ name: "moraltrade.org" }],
            );

            const serialized = JSON.stringify(summary);
            assert.doesNotMatch(serialized, /must-not-leak/);
            assert.doesNotMatch(serialized, /secret-credential-id/);
            assert.match(serialized, /moraltrade\\.org/);
            assert.equal(summary.resourceConfig.buildMachineType, "standard");
          });
          '''

          new_audit_test = '''test("audit summaries redact secrets and keep preview and production deployment identities separate", () => {
            const summary = safeProjectSummary(
              {
                id: CANONICAL_PROJECT.id,
                name: CANONICAL_PROJECT.name,
                live: false,
                framework: "nextjs",
                link: {
                  type: "github",
                  org: "ghuser29384",
                  repo: "Website2",
                  repoId: 1204006559,
                  productionBranch: "main",
                  gitCredentialId: "secret-credential-id",
                },
                env: [{ key: "DATABASE_URL", value: "must-not-leak" }],
                resourceConfig: {
                  buildMachineType: "standard",
                  elasticConcurrencyEnabled: null,
                  buildQueue: { configuration: "WAIT_FOR_NAMESPACE_QUEUE" },
                },
                speedInsights: { enabledAt: 1 },
                webAnalytics: { enabledAt: 1 },
                latestDeployments: [
                  {
                    id: "dpl_newer_preview",
                    readyState: "READY",
                    target: null,
                    createdAt: 300,
                  },
                ],
              },
              [
                { name: "moraltrade.org" },
                { name: "www.moraltrade.org" },
              ],
              [
                {
                  id: "dpl_building_production",
                  readyState: "BUILDING",
                  target: "production",
                  createdAt: 250,
                },
                {
                  id: "dpl_current_production",
                  readyState: "READY",
                  target: "production",
                  createdAt: 200,
                },
              ],
            );

            const serialized = JSON.stringify(summary);
            assert.doesNotMatch(serialized, /must-not-leak/);
            assert.doesNotMatch(serialized, /secret-credential-id/);
            assert.match(serialized, /moraltrade\\.org/);
            assert.equal(summary.resourceConfig.buildMachineType, "standard");
            assert.equal(summary.resourceConfig.elasticConcurrencyEnabled, null);
            assert.equal(summary.latestDeployment.id, "dpl_newer_preview");
            assert.equal(
              summary.productionDeployment.id,
              "dpl_current_production",
            );
          });
          '''
          tests = replace_once(tests, old_audit_test, new_audit_test, 'audit summary test')
          test_path.write_text(tests)
          PY

      - name: Remove one-time controller before validation
        run: rm .github/workflows/repair-vercel-recovery-verifier-once.yml

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Focused Vercel controls
        run: npm run test:vercel-controls

      - name: Complete repository tests
        run: npm test

      - name: Repository-wide ESLint
        run: npm run lint

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Optimized production build
        run: npm run build

      - name: Exact current-main diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --name-only origin/main | sort > /tmp/actual-files.txt
          printf '%s\n' \
            scripts/vercel-admin-cost-controls.mjs \
            scripts/vercel-admin-cost-controls.test.mjs \
            | sort > /tmp/expected-files.txt
          diff -u /tmp/expected-files.txt /tmp/actual-files.txt

      - name: Commit verified repair and remove controller
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            scripts/vercel-admin-cost-controls.mjs \
            scripts/vercel-admin-cost-controls.test.mjs \
            .github/workflows/repair-vercel-recovery-verifier-once.yml
          git diff --cached --check
          git commit -m 'Verify active Vercel production deployment independently'
          git push origin HEAD:fix/vercel-recovery-readback-20260802

      - name: Report exact-head result
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment 450 --repo "$GITHUB_REPOSITORY" --body "Exact current-main repository gates passed for the Vercel recovery verifier repair. The corrected verifier accepts only explicit disabled concurrency readback (false or null), rejects omitted/true readback, selects the newest READY production deployment independently of newer previews, requires both canonical aliases, and retains independent route smoke. Focused controls, the complete repository suite, ESLint, TypeScript, optimized build, and the exact two-file diff passed on the committed head. Evidence: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"