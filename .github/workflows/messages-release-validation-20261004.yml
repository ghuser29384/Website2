name: Validate remaining Messages release blockers

on:
  pull_request:
    branches: [main]
    paths:
      - src/app/worked-examples/page.tsx
      - tests/feed-loading-recovery.spec.ts
      - tests/home-bootstrap-resilience.spec.ts
      - tests/site-simplification.spec.ts
      - .github/workflows/messages-release-validation-20261004.yml
  push:
    branches: [main]
    paths:
      - .github/workflows/messages-release-validation-20261004.yml

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint -- --quiet
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://www.moraltrade.org
          VERCEL: '1'
          VERCEL_ENV: preview
      - run: npx playwright install --with-deps chromium
      - name: Verify Feed recovery and truthful inventory states
        run: npx playwright test --config=playwright.release.config.ts tests/feed-loading-recovery.spec.ts tests/home-bootstrap-resilience.spec.ts tests/site-simplification.spec.ts --reporter=line
      - name: Verify the worked-examples page
        run: npx playwright test --config=playwright.release.config.ts tests/sitewide-canonical-visual-system.spec.ts --grep 'aligns public editorial route /worked-examples' --reporter=line --output=test-results/worked-examples
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-blocker-evidence-${{ github.run_id }}
          path: test-results
          if-no-files-found: warn

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Dispatch the existing complete production gate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'ghuser29384/Website2'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          remote_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$remote_sha" = "$GITHUB_SHA"
          jq -n --arg sha "$GITHUB_SHA" \
            '{ref:"main",inputs:{ref:"main",target:"production",expected_sha:$sha,synthetic_auth_fixture_url:""}}' \
            | gh api --method POST \
                "repos/$GITHUB_REPOSITORY/actions/workflows/vercel-release.yml/dispatches" \
                --input - >/dev/null
