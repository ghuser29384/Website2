name: Temporary repair — rebase Feed-to-Create onto current main

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/fix-feed-create-phase1-output-ambiguity.yml"

permissions:
  contents: write

concurrency:
  group: fix-feed-create-phase1-current-main
  cancel-in-progress: false

jobs:
  rebase:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PRODUCT_BRANCH: feature/feed-create-phase1-20260730
      EXPECTED_PRODUCT_HEAD: 21fec04c6ea6c3911e14e1cedb4bf57b54aa758e
      EXPECTED_MAIN_HEAD: 0a26b17d75c9590f92c73663ea19fe1b0e8aa6c4
    steps:
      - name: Check out the exact repaired product branch
        uses: actions/checkout@v4
        with:
          repository: ghuser29384/Website2
          ref: feature/feed-create-phase1-20260730
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Rebase the one product commit onto exact current main
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_PRODUCT_HEAD"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN_HEAD"
          test "$(git rev-list --count 36650b48f9e664ea6d67c0840cf6a803060e8d7c..HEAD)" = "1"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rebase origin/main

          test "$(git merge-base origin/main HEAD)" = "$EXPECTED_MAIN_HEAD"
          test "$(git rev-list --count origin/main..HEAD)" = "1"
          test "$(git diff --name-only origin/main...HEAD | wc -l | tr -d '[:space:]')" = "21"
          git diff --check origin/main...HEAD

          git push \
            --force-with-lease="refs/heads/${PRODUCT_BRANCH}:${EXPECTED_PRODUCT_HEAD}" \
            origin "HEAD:refs/heads/${PRODUCT_BRANCH}"

          printf 'base=%s\n' "$(git rev-parse origin/main)"
          printf 'head=%s\n' "$(git rev-parse HEAD)"
          printf 'tree=%s\n' "$(git rev-parse HEAD^{tree})"
