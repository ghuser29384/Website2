name: PR 406 current-main integration controller

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: pr406-current-main-integration-20260801
  cancel-in-progress: false

env:
  TARGET_BRANCH: feature/pledge-impact-live-foundation-20260801
  EXPECTED_HEAD: a73141c88438cbbecf79cf693109bc460150b70a
  CONTROLLER_PATH: .github/workflows/pr406-current-main-integration-controller.yml
  PR_NUMBER: "406"
  EXPECTED_QA_REF: hvmxfjjbdcgjjudmthdz
  MIGRATION_VERSION: "20260801030000"
  MIGRATION_BLOB: c83ab30d7a84b2c97a70181fb5ba909cbebb75f4

jobs:
  integrate:
    if: >-
      github.repository == 'ghuser29384/Website2' &&
      github.event.issue.pull_request != null &&
      github.event.issue.number == 406 &&
      github.event.comment.body == '/integrate-pr406-current-main-20260801'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      QA_SUPABASE_DB_URL: ${{ secrets.QA_SUPABASE_DB_URL }}

    steps:
      - name: Check out exact feature head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Guard exact repository and feature head
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'ghuser29384/Website2'
          test "$(git branch --show-current)" = "$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')" = "$EXPECTED_HEAD"

      - name: Remove controller from main and pin clean base
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          controller_sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/$CONTROLLER_PATH?ref=main" --jq .sha)"
          jq -n \
            --arg message 'Remove temporary PR 406 current-main integration controller' \
            --arg sha "$controller_sha" \
            --arg branch main \
            '{message:$message,sha:$sha,branch:$branch}' \
            | gh api --method DELETE "repos/$GITHUB_REPOSITORY/contents/$CONTROLLER_PATH" --input - >/dev/null
          git fetch origin main
          base_sha="$(git rev-parse origin/main)"
          test -n "$base_sha"
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"

      - name: Merge pinned current main without committing
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-commit --no-ff "${{ steps.base.outputs.base_sha }}"
          test ! -e "$CONTROLLER_PATH"

      - name: Make branch QA gate persistent-migration aware
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/pledge-impact-live-foundation-gates.yml')
          text = path.read_text(encoding='utf-8')

          env_needle = '''      QA_SUPABASE_DB_URL: ${{ secrets.QA_SUPABASE_DB_URL }}
      EXPECTED_QA_REF: hvmxfjjbdcgjjudmthdz'''
          env_replacement = '''      QA_SUPABASE_DB_URL: ${{ secrets.QA_SUPABASE_DB_URL }}
      EXPECTED_QA_REF: hvmxfjjbdcgjjudmthdz
      MIGRATION_VERSION: "20260801030000"
      MIGRATION_BLOB: c83ab30d7a84b2c97a70181fb5ba909cbebb75f4'''
          if text.count(env_needle) != 1:
              raise SystemExit(f'unexpected QA env inventory: {text.count(env_needle)}')
          text = text.replace(env_needle, env_replacement, 1)

          old = '''      - name: Run migration and live regression in one rollback-only transaction
        shell: bash
        run: |
          set -euo pipefail
          {
            printf '%s\\n' '\\set ON_ERROR_STOP on' 'begin;'
            cat supabase/migrations/20260801030000_mpgf_pledge_impact_live_foundation.sql
            tail -n +2 supabase/tests/mpgf_pledge_impact_live_foundation.sql | sed '$d'
            printf '%s\\n' 'rollback;'
          } > qa-pledge-impact-live-transaction.sql

          psql "$QA_SUPABASE_DB_URL" \\
            --no-psqlrc \\
            --set ON_ERROR_STOP=1 \\
            --file qa-pledge-impact-live-transaction.sql \\
            2>&1 | tee qa-pledge-impact-live.log'''

          new = '''      - name: Run migration or persistent-schema live regression
        shell: bash
        run: |
          set -euo pipefail
          registered="$(psql "$QA_SUPABASE_DB_URL" --no-psqlrc -Atqc \\
            "select count(*) from supabase_migrations.schema_migrations where version = '$MIGRATION_VERSION';")"

          case "$registered" in
            0)
              {
                printf '%s\\n' '\\set ON_ERROR_STOP on' 'begin;'
                cat supabase/migrations/20260801030000_mpgf_pledge_impact_live_foundation.sql
                tail -n +2 supabase/tests/mpgf_pledge_impact_live_foundation.sql | sed '$d'
                printf '%s\\n' 'rollback;'
              } > qa-pledge-impact-live-transaction.sql
              ;;
            1)
              marker="$(psql "$QA_SUPABASE_DB_URL" --no-psqlrc -Atqc \\
                "select coalesce(statements[1], '') from supabase_migrations.schema_migrations where version = '$MIGRATION_VERSION';")"
              [[ "$marker" == *"$MIGRATION_BLOB"* ]] || {
                echo 'Registered migration source does not match this candidate.' >&2
                exit 1
              }
              cp supabase/tests/mpgf_pledge_impact_live_foundation.sql \\
                qa-pledge-impact-live-transaction.sql
              ;;
            *)
              echo "Unexpected migration inventory count: $registered" >&2
              exit 1
              ;;
          esac

          psql "$QA_SUPABASE_DB_URL" \\
            --no-psqlrc \\
            --set ON_ERROR_STOP=1 \\
            --file qa-pledge-impact-live-transaction.sql \\
            2>&1 | tee qa-pledge-impact-live.log'''

          if text.count(old) != 1:
              raise SystemExit(f'unexpected QA regression step inventory: {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check

      - name: Verify exact integrated feature inventory
        shell: bash
        env:
          BASE_SHA: ${{ steps.base.outputs.base_sha }}
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_SHA" | sort > /tmp/actual-files.txt
          cat > /tmp/expected-files.txt <<'EOF'
          .github/workflows/pledge-impact-live-foundation-gates.yml
          src/app/api/mpgf/pledge-impact/route.ts
          src/lib/mpgf/pledge-impact-live-integration.test.ts
          src/lib/mpgf/pledge-impact-live-server.ts
          src/lib/mpgf/pledge-impact-live.test.ts
          src/lib/mpgf/pledge-impact-live.ts
          supabase/migrations/20260801030000_mpgf_pledge_impact_live_foundation.sql
          supabase/tests/mpgf_pledge_impact_live_foundation.sql
          EOF
          sort -o /tmp/expected-files.txt /tmp/expected-files.txt
          diff -u /tmp/expected-files.txt /tmp/actual-files.txt
          git diff --check "$BASE_SHA"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Run integrated code gates
        shell: bash
        env:
          NEXT_PUBLIC_SITE_URL: https://www.moraltrade.org
          VERCEL: "1"
          VERCEL_ENV: preview
        run: |
          set -o pipefail
          node --import tsx --test \
            src/lib/mpgf/pledge-impact-live.test.ts \
            src/lib/mpgf/pledge-impact-live-integration.test.ts \
            2>&1 | tee focused-pledge-impact-live.log
          npm test 2>&1 | tee repository-tests.log
          npm run lint -- --quiet 2>&1 | tee repository-lint.log
          npm run build 2>&1 | tee production-build.log

      - name: Validate exact MoralTrade QA target
        shell: bash
        run: |
          set -euo pipefail
          test -n "${QA_SUPABASE_DB_URL:-}"
          python3 - <<'PY'
          import os
          from urllib.parse import urlparse

          parsed = urlparse(os.environ['QA_SUPABASE_DB_URL'])
          expected = os.environ['EXPECTED_QA_REF']
          if expected not in (parsed.username or ''):
              raise SystemExit('Refusing a database URL outside the exact MoralTrade QA project.')
          if parsed.hostname != 'aws-0-us-west-1.pooler.supabase.com':
              raise SystemExit(f'Refusing unexpected database host: {parsed.hostname}')
          if parsed.port != 5432 or parsed.path != '/postgres':
              raise SystemExit('Refusing unexpected database connection parameters.')
          PY

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes postgresql-client > /dev/null

      - name: Re-run persistent-schema SQL regression
        shell: bash
        run: |
          set -euo pipefail
          test "$(psql "$QA_SUPABASE_DB_URL" --no-psqlrc -Atqc \
            "select count(*) from supabase_migrations.schema_migrations where version = '$MIGRATION_VERSION' and statements[1] like '%' || '$MIGRATION_BLOB' || '%';")" = '1'
          psql "$QA_SUPABASE_DB_URL" \
            --no-psqlrc \
            --set ON_ERROR_STOP=1 \
            --file supabase/tests/mpgf_pledge_impact_live_foundation.sql \
            2>&1 | tee qa-pledge-impact-live.log

      - name: Verify pinned main stayed current
        shell: bash
        env:
          BASE_SHA: ${{ steps.base.outputs.base_sha }}
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"

      - name: Commit and push exact integrated candidate
        id: publish
        shell: bash
        env:
          BASE_SHA: ${{ steps.base.outputs.base_sha }}
        run: |
          set -euo pipefail
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')" = "$EXPECTED_HEAD"
          git add -A
          git diff --cached --check
          git commit -m 'Merge current main into pledge-impact live foundation'
          candidate_sha="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^1)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD^2)" = "$BASE_SHA"
          git diff --name-only "$BASE_SHA" HEAD | sort > /tmp/final-files.txt
          diff -u /tmp/expected-files.txt /tmp/final-files.txt
          git push --force-with-lease="refs/heads/$TARGET_BRANCH:$EXPECTED_HEAD" \
            origin "HEAD:refs/heads/$TARGET_BRANCH"
          echo "candidate_sha=$candidate_sha" >> "$GITHUB_OUTPUT"

      - name: Upload integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr406-current-main-${{ github.run_id }}
          path: |
            focused-pledge-impact-live.log
            repository-tests.log
            repository-lint.log
            production-build.log
            qa-pledge-impact-live.log
            /tmp/actual-files.txt
            /tmp/final-files.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Report success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Current-main integration passed in run \`$GITHUB_RUN_ID\`. Pushed exact candidate \`${{ steps.publish.outputs.candidate_sha }}\` on clean base \`${{ steps.base.outputs.base_sha }}\`. The exact eight-file diff passed 12/12 focused tests, complete repository tests, repository-wide ESLint, production build/TypeScript, and the persistent MoralTrade QA SQL regression. The branch QA workflow now handles both absent and already-registered migration states. PR remains draft; production and forecast publication remain unchanged."

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "PR #406 current-main integration failed in run \`$GITHUB_RUN_ID\`. The controller was removed from main before validation. No feature push occurred unless every exact-head, eight-file, code, SQL, pinned-base, merge-parent, and force-with-lease guard passed."
