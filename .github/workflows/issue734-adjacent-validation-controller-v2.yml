name: Issue 734 Compact outflow adjacent validation controller v2

on:
  push:
    branches:
      - ops/issue734-compact-outflow-validation-20260818
    paths:
      - .github/workflows/issue734-adjacent-validation-controller-v2.yml

permissions:
  contents: read
  actions: write
  issues: write
  pull-requests: write

concurrency:
  group: issue734-compact-outflow-adjacent-validation-v2
  cancel-in-progress: false

jobs:
  validate-adjacent:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      FEATURE_PR: "737"
      TRACKING_ISSUE: "734"
      FEATURE_BRANCH: feature/compact-authoritative-outflow-ledger-v1-20260816
    steps:
      - name: Wait for latest durable candidate and successful ledger QA
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          workflow_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows?per_page=100" \
            --jq '.workflows[] | select(.name == "Compact authoritative outflow ledger QA") | .id' | head -n 1)"
          test -n "$workflow_id"
          candidate_sha=""
          candidate_tree=""
          ledger_run=""
          last_failed_sha=""

          for _ in $(seq 1 330); do
            pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${FEATURE_PR}")"
            test "$(jq -r '.state' <<<"$pr_json")" = open
            test "$(jq -r '.draft' <<<"$pr_json")" = true
            test "$(jq -r '.merged' <<<"$pr_json")" = false
            test "$(jq -r '.head.ref' <<<"$pr_json")" = "$FEATURE_BRANCH"
            candidate_sha="$(jq -r '.head.sha' <<<"$pr_json")"

            files="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${FEATURE_PR}/files?per_page=100" --jq '.[].filename' | LC_ALL=C sort)"
            if [ "$(printf '%s\n' "$files" | sed '/^$/d' | wc -l)" -eq 14 ] \
               && ! printf '%s\n' "$files" | grep -q -E '^\.github/workflows/(continue|repair)-compact-outflow'; then
              run_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_id}/runs?head_sha=${candidate_sha}&per_page=20" \
                --jq '.workflow_runs | sort_by(.created_at) | reverse | .[0].id // empty')"
              if [ -n "$run_id" ]; then
                run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")"
                status="$(jq -r '.status' <<<"$run_json")"
                conclusion="$(jq -r '.conclusion // empty' <<<"$run_json")"
                if [ "$status" = completed ] && [ "$conclusion" = success ]; then
                  ledger_run="$run_id"
                  candidate_tree="$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/${candidate_sha}" --jq '.tree.sha')"
                  break
                fi
                if [ "$status" = completed ] && [ "$conclusion" != success ]; then
                  if [ "$last_failed_sha" = "$candidate_sha" ]; then
                    echo "Waiting for a repaired successor to failed candidate ${candidate_sha}."
                  else
                    last_failed_sha="$candidate_sha"
                    echo "Observed failed ledger QA ${run_id} on ${candidate_sha}; waiting for a repaired successor."
                  fi
                fi
              fi
            fi
            sleep 60
          done

          for value in "$candidate_sha" "$candidate_tree" "$ledger_run"; do test -n "$value"; done
          printf 'sha=%s\n' "$candidate_sha" >> "$GITHUB_OUTPUT"
          printf 'tree=%s\n' "$candidate_tree" >> "$GITHUB_OUTPUT"
          printf 'ledger_run=%s\n' "$ledger_run" >> "$GITHUB_OUTPUT"

      - name: Ensure exact-head adjacent workflows pass
        id: adjacent
        shell: bash
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail

          ensure_workflow() {
            local label="$1"
            local regex="$2"
            local workflow_id workflow_name existing_run dispatch_started run_id status conclusion
            workflow_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows?per_page=100" \
              --jq ".workflows[] | select(.name | test(\"${regex}\"; \"i\")) | .id" | head -n 1)"
            workflow_name="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_id}" --jq '.name')"
            test -n "$workflow_id"
            existing_run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_id}/runs?head_sha=${CANDIDATE_SHA}&per_page=30" \
              --jq '.workflow_runs | map(select(.status == "completed" and .conclusion == "success")) | sort_by(.created_at) | reverse | .[0].id // empty')"
            if [ -n "$existing_run" ]; then
              printf '%s|%s|%s\n' "$label" "$workflow_name" "$existing_run" | tee -a /tmp/adjacent-runs.txt
              return
            fi

            dispatch_started="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_id}/dispatches" -f ref="$FEATURE_BRANCH"
            run_id=""
            conclusion=""
            for _ in $(seq 1 240); do
              run_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_id}/runs?branch=${FEATURE_BRANCH}&event=workflow_dispatch&per_page=30" \
                --jq ".workflow_runs | map(select(.head_sha == \"${CANDIDATE_SHA}\" and .created_at >= \"${dispatch_started}\")) | sort_by(.created_at) | reverse | .[0].id // empty")"
              if [ -n "$run_id" ]; then
                status="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.status')"
                conclusion="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.conclusion // empty')"
                if [ "$status" = completed ]; then break; fi
              fi
              sleep 30
            done
            test -n "$run_id"
            test "$conclusion" = success
            printf '%s|%s|%s\n' "$label" "$workflow_name" "$run_id" | tee -a /tmp/adjacent-runs.txt
          }

          : > /tmp/adjacent-runs.txt
          ensure_workflow compact '^MPGF public-goods compacts QA$'
          ensure_workflow payment '^Evidence payment release QA$'
          ensure_workflow visual '^Sitewide canonical visual system$'
          ensure_workflow release 'release classification'
          {
            echo 'runs<<EOF'
            cat /tmp/adjacent-runs.txt
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Record adjacent-green exact head
        shell: bash
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
          CANDIDATE_TREE: ${{ steps.candidate.outputs.tree }}
          LEDGER_RUN: ${{ steps.candidate.outputs.ledger_run }}
          ADJACENT_RUNS: ${{ steps.adjacent.outputs.runs }}
        run: |
          set -euo pipefail
          body="$(cat <<EOF
          Exact-head non-hosted gates are green for authoritative-outflow candidate \`${CANDIDATE_SHA}\` (tree \`${CANDIDATE_TREE}\`). Ledger QA: ${LEDGER_RUN}. Adjacent evidence:
          \`\`\`
          ${ADJACENT_RUNS}
          \`\`\`
          No merge, deployment, persistent migration, provider operation, payment, activation, electorate, or money movement occurred. Protected isolated-QA hosted UAT is now the only remaining tranche gate.
          EOF
          )"
          gh issue comment "$TRACKING_ISSUE" --body "$body"
          gh pr comment "$FEATURE_PR" --body "$body"
