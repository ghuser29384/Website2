name: Repair PR 552 one-use production-auth QA once

on:
  push:
    branches:
      - ops/pr552-one-use-production-auth-qa-20260808

permissions:
  contents: write

concurrency:
  group: repair-pr552-one-use-production-auth-qa-once
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact controller branch
        uses: actions/checkout@v4
        with:
          ref: ops/pr552-one-use-production-auth-qa-20260808
          fetch-depth: 0

      - name: Repair environment creation and fail-closed cleanup setup
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/repair-pr552-one-use-production-auth-qa-v2.py
          rm \
            .github/scripts/repair-pr552-one-use-production-auth-qa.py \
            .github/scripts/repair-pr552-one-use-production-auth-qa-v2.py \
            .github/workflows/repair-pr552-one-use-production-auth-qa.yml
          git diff --check
          ruby -e 'require "yaml"; YAML.parse_file(ARGV.fetch(0)) or abort("invalid YAML")' \
            .github/workflows/pr552-one-use-production-auth-qa.yml

      - name: Commit the one-use repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Repair PR 552 one-use Preview secret injection'
          git push origin HEAD:ops/pr552-one-use-production-auth-qa-20260808
