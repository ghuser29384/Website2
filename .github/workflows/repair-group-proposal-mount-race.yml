name: Repair group proposal mount race

on:
  push:
    branches:
      - feature/co-act-co-fund-create-v3-20260803
    paths:
      - .github/workflows/repair-group-proposal-mount-race.yml

permissions:
  contents: write

concurrency:
  group: repair-group-proposal-mount-race
  cancel-in-progress: false

jobs:
  repair:
    if: github.repository == 'ghuser29384/Website2'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4
        with:
          ref: feature/co-act-co-fund-create-v3-20260803
          fetch-depth: 1

      - name: Stabilize base offer entry around asynchronous group-control mounting
        shell: bash
        run: python -c "import base64; exec(base64.b64decode(''))"

      - name: Commit the durable regression repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/create-group-contribution-proposal.spec.ts .github/workflows/repair-group-proposal-mount-race.yml
          git diff --cached --check
          git commit -m "Stabilize group proposal editor after enhancement mount"
          git push origin HEAD:feature/co-act-co-fund-create-v3-20260803
