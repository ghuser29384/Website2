name: One-time Vercel disabled-concurrency verifier patch

on:
  push:
    branches:
      - ops/vercel-canonical-git-disconnect-20260802
    paths:
      - .github/workflows/patch-vercel-null-concurrency-once.yml

permissions:
  contents: write

concurrency:
  group: patch-vercel-null-concurrency-once
  cancel-in-progress: false

env:
  CONTROLLER_PATH: .github/workflows/patch-vercel-null-concurrency-once.yml
  CONTROLLER_BRANCH: ops/vercel-canonical-git-disconnect-20260802
  TARGET_BRANCH: fix/vercel-disabled-concurrency-null-20260802
  EXPECTED_HEAD: 49282e712228187e56bcfc75a8e051e103214e9b

jobs:
  patch:
    if: github.repository == 'ghuser29384/Website2' && github.actor == 'ghuser29384'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out exact target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Guard exact source state
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'ghuser29384/Website2'
          test "$(git branch --show-current)" = "$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')" = "$EXPECTED_HEAD"
          git diff --quiet

      - name: Apply exact fail-closed verifier and test patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          implementation = Path('scripts/vercel-admin-cost-controls.mjs')
          text = implementation.read_text(encoding='utf-8')
          old = '  if (config.elasticConcurrencyEnabled !== false) {'
          new = '  if (config.elasticConcurrencyEnabled === true) {'
          if text.count(old) != 1:
              raise SystemExit(f'unexpected verifier condition inventory: {text.count(old)}')
          implementation.write_text(text.replace(old, new, 1), encoding='utf-8')

          tests = Path('scripts/vercel-admin-cost-controls.test.mjs')
          test_text = tests.read_text(encoding='utf-8')
          test_old = '''  assert.equal(verifyCanonicalSettings(canonical), true);
          assert.equal(verifyCanonicalLive(canonical), true);'''
          test_new = '''  assert.equal(verifyCanonicalSettings(canonical), true);
          assert.equal(
            verifyCanonicalSettings({
              ...canonical,
              resourceConfig: {
                ...canonical.resourceConfig,
                elasticConcurrencyEnabled: null,
              },
            }),
            true,
          );
          assert.equal(verifyCanonicalLive(canonical), true);'''
          if test_text.count(test_old) != 1:
              raise SystemExit(f'unexpected verifier test insertion point inventory: {test_text.count(test_old)}')
          tests.write_text(test_text.replace(test_old, test_new, 1), encoding='utf-8')
          PY

          cat > /tmp/expected-files.txt <<'EOF'
          scripts/vercel-admin-cost-controls.mjs
          scripts/vercel-admin-cost-controls.test.mjs
          EOF
          git diff --name-only | sort > /tmp/actual-files.txt
          diff -u /tmp/expected-files.txt /tmp/actual-files.txt
          git diff --check
          grep -Fq 'if (config.elasticConcurrencyEnabled === true)' scripts/vercel-admin-cost-controls.mjs
          grep -Fq 'elasticConcurrencyEnabled: null' scripts/vercel-admin-cost-controls.test.mjs

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Run focused Vercel control-plane tests
        shell: bash
        run: |
          set -o pipefail
          npm run test:vercel-controls 2>&1 | tee vercel-null-concurrency-tests.log

      - name: Commit and publish exact repository-only repair
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')" = "$EXPECTED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/vercel-admin-cost-controls.mjs scripts/vercel-admin-cost-controls.test.mjs
          git diff --cached --name-only | sort > /tmp/staged-files.txt
          diff -u /tmp/expected-files.txt /tmp/staged-files.txt
          git diff --cached --check
          git commit -m 'Accept Vercel null as disabled elastic concurrency'
          candidate_sha="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_HEAD"
          git push --force-with-lease="refs/heads/$TARGET_BRANCH:$EXPECTED_HEAD" origin "HEAD:refs/heads/$TARGET_BRANCH"
          echo "candidate_sha=$candidate_sha" >> "$GITHUB_OUTPUT"

      - name: Upload focused evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vercel-null-concurrency-verifier-${{ github.run_id }}
          path: vercel-null-concurrency-tests.log
          if-no-files-found: warn
          retention-days: 30

      - name: Remove the one-time controller
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          blob_sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/$CONTROLLER_PATH?ref=$CONTROLLER_BRANCH" --jq .sha 2>/dev/null || true)"
          if [[ -n "$blob_sha" ]]; then
            jq -n --arg message 'Remove one-time Vercel verifier patch controller' --arg sha "$blob_sha" --arg branch "$CONTROLLER_BRANCH" '{message:$message,sha:$sha,branch:$branch}' \
              | gh api --method DELETE "repos/$GITHUB_REPOSITORY/contents/$CONTROLLER_PATH" --input - >/dev/null
          fi

      - name: Enforce successful publication
        if: always()
        shell: bash
        run: test "${{ job.status }}" = 'success'
