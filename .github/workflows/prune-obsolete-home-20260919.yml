name: Verify and publish obsolete-home cleanup draft
on:
  push:
    branches: [cleanup/remove-obsolete-mock-home-20260919]
    paths: [.github/workflows/prune-obsolete-home-20260919.yml]
permissions:
  contents: write
concurrency:
  group: prune-obsolete-mock-home-20260919
  cancel-in-progress: false
jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      BASE_SHA: 26d1fe436dbf9a4440bfafd501ddf8db944a1127
      TARGET_BRANCH: cleanup/remove-obsolete-mock-home-20260919
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify source and replay exact inspected transformation
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = ghuser29384/Website2
          test "$GITHUB_REF" = "refs/heads/$TARGET_BRANCH"
          test "$(git rev-parse HEAD^)" = a20250097dce8d314ce114e252bdc46b339b4611
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE_SHA"
          test "$(git diff --name-only "$BASE_SHA" HEAD)" = .github/workflows/prune-obsolete-home-20260919.yml
          mkdir -p "$RUNNER_TEMP/prune-evidence"
          python - <<'PY'
          import subprocess, textwrap
          controller = subprocess.check_output(['git','show','a20250097dce8d314ce114e252bdc46b339b4611:.github/workflows/prune-obsolete-home-20260919.yml'], text=True)
          start = '      - name: Apply reviewed removal with exact old and new blob checks\n        shell: python\n        run: |\n'
          end = '      - name: Remove controller and freeze exact product scope\n'
          assert controller.count(start) == 1 and controller.count(end) == 1
          code = textwrap.dedent(controller.split(start, 1)[1].split(end, 1)[0])
          exec(compile(code, '<exact-reviewed-transformation>', 'exec'), {})
          PY
          rm .github/workflows/prune-obsolete-home-20260919.yml
          git add -- src/app/page.tsx src/components/home/home-page.tsx src/components/home/local-date-greeting.tsx src/components/home/returning-home.module.css src/lib/public-route-smoke.test.ts src/lib/action-first-positioning.test.ts src/sitewide-canonical-visual-system.test.ts src/lib/retired-home-contract.test.ts .github/workflows/prune-obsolete-home-20260919.yml
          git diff --check "$BASE_SHA"
          test "$(git diff --name-only "$BASE_SHA" | wc -l)" -eq 8
          git diff --stat "$BASE_SHA" | tee "$RUNNER_TEMP/prune-evidence/diff-stat.txt"
          git diff --binary "$BASE_SHA" > "$RUNNER_TEMP/prune-evidence/cleanup.patch"
          git diff --name-status "$BASE_SHA" > "$RUNNER_TEMP/prune-evidence/paths.txt"
      - name: Install locked dependencies
        run: npm ci
      - name: Focused tests and changed-file lint
        run: |
          set -euo pipefail
          node --import tsx --test src/lib/retired-home-contract.test.ts src/lib/action-first-positioning.test.ts src/sitewide-canonical-visual-system.test.ts | tee "$RUNNER_TEMP/prune-evidence/focused-tests.txt"
          npx eslint src/app/page.tsx src/lib/public-route-smoke.test.ts src/lib/action-first-positioning.test.ts src/sitewide-canonical-visual-system.test.ts src/lib/retired-home-contract.test.ts | tee "$RUNNER_TEMP/prune-evidence/scoped-lint.txt"
      - name: Compare full tests with unchanged main under the same clock
        run: |
          set -euo pipefail
          set +e
          npm test > "$RUNNER_TEMP/prune-evidence/repository-tests.txt" 2>&1
          candidate_status=$?
          set -e
          git worktree add --detach "$RUNNER_TEMP/prune-baseline" "$BASE_SHA"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/prune-baseline/node_modules"
          set +e
          (cd "$RUNNER_TEMP/prune-baseline" && npm test) > "$RUNNER_TEMP/prune-evidence/baseline-tests.txt" 2>&1
          baseline_status=$?
          set -e
          printf 'candidate-tests=%s\nbaseline-tests=%s\n' "$candidate_status" "$baseline_status" > "$RUNNER_TEMP/prune-evidence/check-status.txt"
          python - <<'PY'
          from pathlib import Path
          import os, re, json
          root = Path(os.environ['RUNNER_TEMP']) / 'prune-evidence'
          def result(name):
              source = (root / name).read_text()
              counts = {key: int(value) for key, value in re.findall(r'^# (tests|pass|fail|cancelled|skipped) (\d+)$', source, re.M)}
              failures = re.findall(r'^not ok \d+ - (.*)$', source, re.M)
              assert 'tests' in counts and 'fail' in counts
              return {'counts': counts, 'failures': failures}
          candidate = result('repository-tests.txt')
          baseline = result('baseline-tests.txt')
          expected = [
              'candidate exposure allows only matching purpose binding, surface, cohort, and budget',
              'candidate exposure fails closed without a confirmed pending intro limit',
          ]
          assert candidate['failures'] == baseline['failures'] == expected, (candidate, baseline)
          assert candidate['counts']['fail'] == baseline['counts']['fail'] == 2
          assert candidate['counts']['tests'] == baseline['counts']['tests'] + 5
          assert candidate['counts']['cancelled'] == baseline['counts']['cancelled'] == 0
          report = {'candidate': candidate, 'baseline': baseline, 'new_failures': [], 'suite_fully_green': False, 'boundary': 'The same two unchanged background candidate fixtures expire on 2026-09-01; no privacy expiry gate was changed.'}
          (root / 'baseline-comparison.json').write_text(json.dumps(report, indent=2) + '\n')
          print(json.dumps(report, indent=2))
          PY
      - name: Record full lint, types and build results without mislabeling failures
        run: |
          set -euo pipefail
          record() {
            label="$1"; shift
            set +e
            "$@" > "$RUNNER_TEMP/prune-evidence/$label.txt" 2>&1
            result=$?
            set -e
            printf '%s=%s\n' "$label" "$result" | tee -a "$RUNNER_TEMP/prune-evidence/check-status.txt"
            tail -n 12 "$RUNNER_TEMP/prune-evidence/$label.txt"
          }
          record full-lint npm run lint -- --quiet
          record typecheck npx tsc --noEmit --pretty false
          record build npm run build
          git diff --check "$BASE_SHA"
          test "$(git diff --name-only "$BASE_SHA" | wc -l)" -eq 8
      - name: Verify local HTTP routing when build succeeds
        run: |
          set -euo pipefail
          if ! grep -qx 'build=0' "$RUNNER_TEMP/prune-evidence/check-status.txt"; then
            echo 'http-smoke=not-run-build-failed' >> "$RUNNER_TEMP/prune-evidence/check-status.txt"
            exit 0
          fi
          npm run start -- --hostname 127.0.0.1 --port 3219 > "$RUNNER_TEMP/prune-evidence/local-server.txt" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          set +e
          python - <<'PY'
          import urllib.request, urllib.error, time, http.cookiejar, os, json
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'prune-evidence'
          for _ in range(60):
              try:
                  response = urllib.request.urlopen('http://127.0.0.1:3219/feed', timeout=3)
                  break
              except (urllib.error.URLError, TimeoutError):
                  time.sleep(1)
          else:
              raise RuntimeError('Local server did not become ready')
          feed = response.read()
          assert response.status == 200
          assert feed == Path('public/moral-trade-live.html').read_bytes()
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          jar = http.cookiejar.CookieJar()
          opener = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar), NoRedirect())
          try:
              opener.open('http://127.0.0.1:3219/', timeout=10)
              raise AssertionError('First visit must redirect')
          except urllib.error.HTTPError as response:
              assert response.code == 307
              assert response.headers['Location'].endswith('/walkthrough')
          returning = opener.open('http://127.0.0.1:3219/', timeout=10)
          assert returning.status == 200 and returning.read() == feed
          report = {'feed': 200, 'first_visit': 307, 'returning_visit': 200, 'live_html_byte_identical': True, 'browser_rendering': 'not tested', 'production': 'not contacted'}
          (root / 'http-smoke.json').write_text(json.dumps(report, indent=2) + '\n')
          print(json.dumps(report))
          PY
          result=$?
          set -e
          echo "http-smoke=$result" >> "$RUNNER_TEMP/prune-evidence/check-status.txt"
      - name: Publish isolated draft candidate, never merge or deploy
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE_SHA"
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)" = "$GITHUB_SHA"
          git diff --exit-code
          test "$(git diff --cached --name-only "$BASE_SHA" | wc -l)" -eq 8
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Remove obsolete mock homepage and fake interactions" -m "Exact eight-file product cleanup. Focused tests and scoped lint pass. Full-suite baseline comparison preserves two pre-existing expired background-candidate fixture failures. Other check results are recorded in the run artifact; this commit is a draft candidate, not a release approval."
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          git rev-parse HEAD | tee "$RUNNER_TEMP/prune-evidence/product-head.txt"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/prune-evidence/product-tree.txt"
      - name: Preserve evidence including any failed checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: obsolete-home-cleanup-${{ github.run_id }}
          path: ${{ runner.temp }}/prune-evidence/
          retention-days: 7
          if-no-files-found: warn
