name: Inspect obsolete homepage dependencies
on:
  push:
    branches: [cleanup/remove-obsolete-mock-home-20260919]
    paths: [.github/workflows/prune-obsolete-home-20260919.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 26d1fe436dbf9a4440bfafd501ddf8db944a1127
          persist-credentials: false
      - name: Print exact retired-module references
        run: |
          set -euo pipefail
          git grep -n -C 5 -E 'home-page.tsx|local-date-greeting|returning-home.module.css' -- src/lib/public-route-smoke.test.ts src/sitewide-canonical-visual-system.test.ts src/lib/action-first-positioning.test.ts
      - uses: actions/upload-artifact@v4
        with:
          name: obsolete-home-source-26d1fe4
          retention-days: 1
          path: |
            src/app/page.tsx
            src/proxy.ts
            next.config.ts
            src/components/home/home-page.tsx
            src/components/home/local-date-greeting.tsx
            src/components/home/returning-home.module.css
            src/lib/public-route-smoke.test.ts
            src/lib/action-first-positioning.test.ts
            src/sitewide-canonical-visual-system.test.ts
