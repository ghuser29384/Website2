name: Quiet UI reviewed release candidate
on:
  push:
    branches: [ops/quiet-ui-source-review-20260926]
    paths: [.github/workflows/quiet-ui-release-candidate.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: quiet-ui-release-candidate
  cancel-in-progress: false
defaults:
  run:
    shell: bash
env:
  CI: 'true'
  NEXT_TELEMETRY_DISABLED: '1'
jobs:
  prepare:
    if: github.actor == 'ghuser29384'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      candidate: ${{ steps.verify.outputs.candidate }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 439eda02244ff6c7d3b2afbc171bb5110f028ea4
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the published candidate matches the independently reviewed tree
        id: verify
        run: |
          set -euo pipefail
          candidate=439eda02244ff6c7d3b2afbc171bb5110f028ea4
          test "$(git rev-parse HEAD)" = "$candidate"
          test "$(git rev-parse HEAD^{tree})" = 8005830af701579b86e9376338a0aff8b6176f90
          test "$(git rev-parse HEAD^1)" = 35b174d5d09c6a846a6964af02c4dc248d6e1eb4
          test "$(git rev-parse HEAD^2)" = caa25edccad0a444d4d18b45046a9e3fdfc1abf8
          git diff --check HEAD^2 HEAD
          mkdir -p evidence
          printf 'candidate=%s\nmain=%s\ntree=%s\n' "$candidate" "$(git rev-parse HEAD^2)" "$(git rev-parse HEAD^{tree})" > evidence/revision.txt
          git diff HEAD^2 HEAD > evidence/changes.patch
          echo "candidate=$candidate" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quiet-ui-release-revision
          path: evidence/
          retention-days: 7
          if-no-files-found: warn
  quality:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.candidate }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Absolute repository, root-contract, security and production build gates
        run: |
          set -euo pipefail
          mkdir -p evidence
          git rev-parse HEAD > evidence/revision.txt
          npm test 2>&1 | tee evidence/unit.log
          node --import tsx --test src/*.test.ts src/lib/create-interface/*.test.ts 2>&1 | tee evidence/root-and-create.log
          npm run lint -- --quiet 2>&1 | tee evidence/lint.log
          npx tsc --noEmit 2>&1 | tee evidence/typescript.log
          npm audit --omit=dev --json > evidence/audit-production.json
          npm run build 2>&1 | tee evidence/build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quiet-ui-release-quality
          path: evidence/
          retention-days: 7
  browser:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.candidate }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Focused desktop and mobile checks with unchanged retry and timeout settings
        id: focused
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: evidence/focused-results.json
        run: npx playwright test tests/quiet-ui.spec.ts tests/homepage-narrow-header.spec.ts tests/refined-header.spec.ts tests/discover-home-visual-alignment.spec.ts tests/selected-ui-cleanup.spec.ts tests/returning-homepage.spec.ts tests/create-route-ui-regression.spec.ts --output=test-results/focused --reporter=line,json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quiet-ui-release-focused-browser
          path: |
            evidence/
            test-results/focused/
          retention-days: 7
          if-no-files-found: warn
      - name: Complete unchanged release browser suite
        if: ${{ !cancelled() && steps.focused.outcome != 'skipped' }}
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: evidence/release-results.json
        run: npm run test:e2e:release -- --output=test-results/release --reporter=line,json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quiet-ui-release-browser
          path: |
            evidence/
            test-results/release/
          retention-days: 7
          if-no-files-found: warn
  dashboard:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54331
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: dashboard-local-public-fixture
      SUPABASE_SERVICE_ROLE_KEY: dashboard-local-service-fixture
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3210
      SITE_URL: http://127.0.0.1:3210
      DASHBOARD_SPARKS_FIXTURE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.candidate }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Authenticated priorities, account controls, and isolation on local fixtures
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: evidence/dashboard-results.json
        run: npx playwright test tests/dashboard-sparks.spec.ts --workers=1 --output=test-results/dashboard --reporter=line,json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quiet-ui-release-dashboard
          path: |
            evidence/
            test-results/
            /tmp/dashboard-sparks-evidence/
          retention-days: 7
          if-no-files-found: warn
  commitments:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:3231
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: auth-resolution-public-fixture
      SUPABASE_SERVICE_ROLE_KEY: auth-resolution-service-fixture
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3211
      SITE_URL: http://127.0.0.1:3211
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.candidate }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Commitments streaming, authentication and the approved current-main layout
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME_NAME: evidence/commitments-results.json
          PLAYWRIGHT_JSON_OUTPUT_NAME: evidence/commitments-results.json
        run: npx playwright test --config=playwright.commitments.config.ts --reporter=line,json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quiet-ui-release-commitments
          path: |
            evidence/
            test-results/
          retention-days: 7
          if-no-files-found: warn
