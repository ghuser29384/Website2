name: Patch pre-activation baseline top-level DML parser

on:
  push:
    branches:
      - database/preactivation-schema-baseline-clean-20260819
    paths:
      - .github/workflows/patch-preactivation-top-level-dml-parser.yml

permissions:
  contents: write

env:
  TARGET_BRANCH: database/preactivation-schema-baseline-clean-20260819
  EXPECTED_PARENT: 27e317a3dd67aaf842d256a5a763cb85abeb2f0f

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: database/preactivation-schema-baseline-clean-20260819
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Distinguish top-level data statements from stored-function bodies
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/database/generate-preactivation-baseline.sh")
          source = path.read_text()

          old_scan = r'''normalized = "\n".join(output).strip() + "\n"
          for pattern, label in (
              (r"(?i)\bCOPY\s+(?:public|moral_trade_private)\.", "COPY data"),
              (r"(?i)\bINSERT\s+INTO\s+(?:public|moral_trade_private)\.", "application data"),
              (r"(?i)\bINSERT\s+INTO\s+auth\.users\b", "Auth user data"),
              (r"(?i)\bCREATE\s+DATABASE\b", "database creation"),
              (r"(?i)\bALTER\s+DATABASE\b", "database mutation"),
              (r"(?i)\bactivation_stage\b", "post-boundary activation schema"),
              (r"(?i)\bcomplete_(?:walkthrough|profile)_activation_v1\b", "post-boundary activation RPC"),
              (r"(?i)\bMoral Trade operator\s+[—-]\s+Ellen\b", "named-human seed"),
          ):
              if re.search(pattern, normalized):
                  raise SystemExit(f"Forbidden {label} in schema-only dump.")
          Path(sys.argv[2]).write_text(normalized)
          '''.replace("          ", "")

          new_scan = r'''normalized = "\n".join(output).strip() + "\n"

          # A schema-only dump legitimately contains DML inside stored functions. Reject only
          # executable top-level data statements while tracking PostgreSQL dollar-quoted bodies.
          dollar_quote = re.compile(r"\$(?:[A-Za-z_][A-Za-z0-9_]*)?\$")
          top_level_dml = re.compile(
              r'^\s*(COPY|INSERT\s+INTO|UPDATE|DELETE\s+FROM|TRUNCATE(?:\s+TABLE)?)'
              r'\s+(?:ONLY\s+)?(?:(?:"public"|"moral_trade_private")|(?:public|moral_trade_private))\.',
              re.IGNORECASE,
          )
          active_dollar_quote: str | None = None
          violations: list[tuple[int, str]] = []
          for line_number, line in enumerate(normalized.splitlines(), start=1):
              if active_dollar_quote is None:
                  match = top_level_dml.match(line)
                  if match:
                      violations.append((line_number, match.group(1).upper()))
              for token_match in dollar_quote.finditer(line):
                  token = token_match.group(0)
                  if active_dollar_quote is None:
                      active_dollar_quote = token
                  elif token == active_dollar_quote:
                      active_dollar_quote = None
          if active_dollar_quote is not None:
              raise SystemExit("Unterminated dollar-quoted body in normalized schema dump.")
          if violations:
              summary = ", ".join(f"line {line}: {kind}" for line, kind in violations)
              raise SystemExit(f"Forbidden top-level application data statement(s): {summary}")

          for pattern, label in (
              (r"(?i)\bCREATE\s+DATABASE\b", "database creation"),
              (r"(?i)\bALTER\s+DATABASE\b", "database mutation"),
              (r"(?i)\bactivation_stage\b", "post-boundary activation schema"),
              (r"(?i)\bcomplete_(?:walkthrough|profile)_activation_v1\b", "post-boundary activation RPC"),
              (r"(?i)\bMoral Trade operator\s+[—-]\s+Ellen\b", "named-human seed"),
          ):
              if re.search(pattern, normalized):
                  raise SystemExit(f"Forbidden {label} in schema-only dump.")
          Path(sys.argv[2]).write_text(normalized)
          '''.replace("          ", "")

          if source.count(old_scan) != 1:
              raise SystemExit("Expected the old global DML scan exactly once.")
          source = source.replace(old_scan, new_scan)

          old_shell = '''for forbidden in \\
            'COPY public.' \\
            'COPY moral_trade_private.' \\
            'INSERT INTO public.' \\
            'INSERT INTO moral_trade_private.' \\
            'activation_stage' \\
            'complete_walkthrough_activation_v1' \\
            'complete_profile_activation_v1'; do'''.replace("          ", "")
          new_shell = '''for forbidden in \\
            'activation_stage' \\
            'complete_walkthrough_activation_v1' \\
            'complete_profile_activation_v1'; do'''.replace("          ", "")
          if source.count(old_shell) != 1:
              raise SystemExit("Expected the old blanket shell scan exactly once.")
          source = source.replace(old_shell, new_shell)

          old_test_import = '''import { readFileSync } from "node:fs";
          import test from "node:test";
          '''.replace("          ", "")
          new_test_import = '''import { readFileSync } from "node:fs";
          import test from "node:test";

          function findTopLevelApplicationDataStatements(sql: string): string[] {
            const dollarQuote = /\\$(?:[A-Za-z_][A-Za-z0-9_]*)?\\$/g;
            const topLevelDml = /^\\s*(COPY|INSERT\\s+INTO|UPDATE|DELETE\\s+FROM|TRUNCATE(?:\\s+TABLE)?)\\s+(?:ONLY\\s+)?(?:(?:"public"|"moral_trade_private")|(?:public|moral_trade_private))\\./i;
            let activeDollarQuote: string | null = null;
            const violations: string[] = [];
            for (const [index, line] of sql.split(/\\r?\\n/).entries()) {
              if (activeDollarQuote === null) {
                const match = topLevelDml.exec(line);
                if (match) violations.push(`line ${index + 1}: ${match[1].toUpperCase()}`);
              }
              dollarQuote.lastIndex = 0;
              for (const match of line.matchAll(dollarQuote)) {
                const token = match[0];
                if (activeDollarQuote === null) activeDollarQuote = token;
                else if (token === activeDollarQuote) activeDollarQuote = null;
              }
            }
            assert.equal(activeDollarQuote, null, "dollar-quoted body must terminate");
            return violations;
          }
          '''.replace("          ", "")
          if source.count(old_test_import) != 1:
              raise SystemExit("Expected the generated test import block exactly once.")
          source = source.replace(old_test_import, new_test_import)

          old_test_assertions = '''  assert.doesNotMatch(sql, /COPY (?:public|moral_trade_private)\\./);
            assert.doesNotMatch(sql, /INSERT INTO (?:public|moral_trade_private)\\./);
            assert.doesNotMatch(sql, /activation_stage/);'''.replace("            ", "")
          new_test_assertions = '''  assert.deepEqual(findTopLevelApplicationDataStatements(sql), []);
            assert.doesNotMatch(sql, /activation_stage/);'''.replace("            ", "")
          if source.count(old_test_assertions) != 1:
              raise SystemExit("Expected the generated test's blanket DML assertions exactly once.")
          source = source.replace(old_test_assertions, new_test_assertions)

          path.write_text(source)

          trigger = Path("scripts/database/generate-preactivation-baseline.trigger")
          trigger.write_text(
              "issue-714 authoritative pre-activation baseline generation\n"
              "source-main=26d1fe436dbf9a4440bfafd501ddf8db944a1127\n"
              "requested-at=2026-08-19T08:05:00Z\n"
              "purpose=parser-aware-data-free-clean-room-boundary\n"
          )
          PY

          rm .github/workflows/patch-preactivation-top-level-dml-parser.yml
          bash -n scripts/database/generate-preactivation-baseline.sh
          git diff --check
          grep -F 'top_level_dml = re.compile' scripts/database/generate-preactivation-baseline.sh
          grep -F 'findTopLevelApplicationDataStatements' scripts/database/generate-preactivation-baseline.sh
          ! grep -F "'INSERT INTO public.'" scripts/database/generate-preactivation-baseline.sh

      - name: Commit and push normally
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Distinguish schema function bodies from top-level data"
          git push origin "HEAD:$TARGET_BRANCH"
