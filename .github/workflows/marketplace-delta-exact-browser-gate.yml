name: Marketplace delta exact-head browser gate

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/marketplace-delta-exact-browser-gate.yml"
      - ".github/scripts/audit-marketplace-delta-final-evidence.py"
      - ".github/scripts/publish-marketplace-delta-final-decision.py"

permissions:
  actions: read
  contents: read
  pull-requests: write

concurrency:
  group: marketplace-delta-evidence-finalizer
  cancel-in-progress: false

jobs:
  finalize-evidence:
    if: >-
      github.event.pull_request.head.repo.full_name == 'ghuser29384/Website2' &&
      github.head_ref == 'ops/materialize-marketplace-delta-final-20260730'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ github.token }}
      QA_SUPABASE_DB_URL: ${{ secrets.QA_SUPABASE_DB_URL }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Check out temporary finalizer branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js for Vercel log inspection
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install media and database inspection tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update >/dev/null
          sudo apt-get install --yes ffmpeg postgresql-client python3-pil unzip >/dev/null

      - name: Audit terminal workflow, artifacts, media, runtime logs, QA residue, and review threads
        shell: bash
        run: python3 .github/scripts/audit-marketplace-delta-final-evidence.py

      - name: Upload the independent evidence audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marketplace-delta-independent-final-audit-${{ github.run_id }}
          path: |
            marketplace-delta-final-audit/*.md
            marketplace-delta-final-audit/*.json
            marketplace-delta-final-audit/*.txt
            marketplace-delta-final-audit/media-inspection/video-frames/**/*.png
            !marketplace-delta-final-audit/vercel-logs-help.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish the evidence-backed decision and close temporary PRs without merging
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f marketplace-delta-final-audit/review-body.md
          test -f marketplace-delta-final-audit/decision.txt
          python3 .github/scripts/publish-marketplace-delta-final-decision.py

      - name: Upload publication and closure receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marketplace-delta-final-publication-${{ github.run_id }}
          path: |
            marketplace-delta-final-audit/publication.json
            marketplace-delta-final-audit/temporary-pr-closures.json
            marketplace-delta-final-audit/decision.txt
          if-no-files-found: error
          retention-days: 30

      - name: Enforce the evidence-backed release decision
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          decision="$(tr -d '[:space:]' < marketplace-delta-final-audit/decision.txt)"
          echo "Final marketplace decision: $decision"
          test "$decision" = "GO"
