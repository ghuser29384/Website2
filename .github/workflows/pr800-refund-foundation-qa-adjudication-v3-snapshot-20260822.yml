name: PR800 rollback-only QA adjudication v3 snapshot

on:
  push:
    branches:
      - ops/pr800-adjudication-observer-20260822
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_WORKFLOW: pr800-refund-foundation-qa-adjudication-v3-20260822.yml
      TARGET_BRANCH: ops/pr800-refund-foundation-qa-adjudication-v3-20260822
      TARGET_HEAD: 3c971ae8e8916308e2ba5b7c72906c9314f536b2
    steps:
      - name: Record exact v3 adjudication state
        shell: bash
        run: |
          set -euo pipefail
          response="$(gh api --method GET \
            "repos/$GITHUB_REPOSITORY/actions/workflows/$TARGET_WORKFLOW/runs" \
            -f branch="$TARGET_BRANCH" \
            -f per_page=30)"
          latest="$(jq -c \
            --arg sha "$TARGET_HEAD" \
            '[.workflow_runs[] | select(.head_sha == $sha)] | sort_by(.created_at) | reverse | .[0] // empty' \
            <<<"$response")"
          if [[ -z "$latest" ]]; then
            body='<!-- pr800-refund-foundation-qa-adjudication-v3-snapshot -->
          PR #800 v3 adjudication snapshot: no exact run found.'
          else
            run_id="$(jq -r '.id' <<<"$latest")"
            status="$(jq -r '.status' <<<"$latest")"
            conclusion="$(jq -r '.conclusion // "none"' <<<"$latest")"
            html_url="$(jq -r '.html_url' <<<"$latest")"
            body="<!-- pr800-refund-foundation-qa-adjudication-v3-snapshot -->
          PR #800 v3 adjudication snapshot: run \`$run_id\`, status \`$status\`, conclusion \`$conclusion\`: $html_url"
          fi
          gh issue comment 709 --repo "$GITHUB_REPOSITORY" --body "$body"
