name: Apply present-stage authenticated Commitments governance

on:
  push:
    branches:
      - ops/commitments-present-stage-no-mfa-20260810

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: commitments-present-stage-no-mfa-controller
  cancel-in-progress: false

env:
  TARGET_BRANCH: feature/commitments-phase1-impact-accounting-20260806
  EXPECTED_TARGET_SHA: ecf0337d8effcb585469356050bb3741a2ec1989
  EXPECTED_MAIN_SHA: f0f5f36be4ef4ac6cb09cdc81802b27cd268878a
  MIGRATION_VERSION: '20260810013845'
  MIGRATION_NAME: commitments_impact_present_stage_authenticated_approver
  MIGRATION_PATH: supabase/migrations/20260810013845_commitments_impact_present_stage_authenticated_approver.sql
  EXPECTED_QA_REF: hvmxfjjbdcgjjudmthdz
  EVIDENCE_DIR: commitments-present-stage-no-mfa-evidence

jobs:
  apply-and-verify:
    name: Apply policy decision, prove exact sources, test, and push PR 534
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      QA_SUPABASE_DB_URL: ${{ secrets.QA_SUPABASE_DB_URL }}
    steps:
      - name: Check out one-use controller
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard exact controller, main, and feature heads
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'ghuser29384/Website2'
          test "$(git rev-parse HEAD^)" = "$EXPECTED_MAIN_SHA"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$EXPECTED_MAIN_SHA"
          test "$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')" = "$EXPECTED_TARGET_SHA"
          changed="$(git diff --name-only "$EXPECTED_MAIN_SHA" "$GITHUB_SHA")"
          test "$changed" = '.github/workflows/commitments-present-stage-no-mfa-controller-20260810.yml'
          git diff --check "$EXPECTED_MAIN_SHA" "$GITHUB_SHA"
          mkdir -p "$EVIDENCE_DIR"
          printf '%s\n' "$changed" > "$EVIDENCE_DIR/controller-files.txt"

      - name: Install PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install --yes postgresql-client > /dev/null

      - name: Check out exact PR 534 branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH" main
          git checkout -B "$TARGET_BRANCH" "origin/$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$EXPECTED_TARGET_SHA"
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN_SHA"

      - name: Materialize exact registered QA migration source
        shell: bash
        run: |
          set -euo pipefail
          test -n "${QA_SUPABASE_DB_URL:-}"
          python3 - <<'PY'
          import os
          from urllib.parse import urlparse

          parsed = urlparse(os.environ['QA_SUPABASE_DB_URL'])
          if os.environ['EXPECTED_QA_REF'] not in (parsed.username or ''):
              raise SystemExit('Refusing a database URL outside exact MoralTrade QA.')
          if parsed.hostname != 'aws-0-us-west-1.pooler.supabase.com' or parsed.port != 5432 or parsed.path != '/postgres':
              raise SystemExit('Refusing unexpected database connection parameters.')
          PY

          actual_name="$(psql "$QA_SUPABASE_DB_URL" --no-psqlrc -Atqc \
            "select name from supabase_migrations.schema_migrations where version = '${MIGRATION_VERSION}';")"
          test "$actual_name" = "$MIGRATION_NAME"
          mkdir -p "$(dirname "$MIGRATION_PATH")"
          psql "$QA_SUPABASE_DB_URL" --no-psqlrc -Atqc \
            "select statements[1] from supabase_migrations.schema_migrations where version = '${MIGRATION_VERSION}';" \
            > "$MIGRATION_PATH"
          test -s "$MIGRATION_PATH"
          grep -Fq 'public.is_impact_model_approver(false)' "$MIGRATION_PATH"
          grep -Fq 'Present-stage MFA is not required' "$MIGRATION_PATH"
          ! grep -Fq 'public.is_impact_model_approver(true)' "$MIGRATION_PATH"
          sha256sum "$MIGRATION_PATH" | tee "$EVIDENCE_DIR/migration-file-sha256.txt"

      - name: Update methodology blockers, review packet, tests, validator, and gates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          target_sha = os.environ['EXPECTED_TARGET_SHA']
          main_sha = os.environ['EXPECTED_MAIN_SHA']
          migration_version = os.environ['MIGRATION_VERSION']
          migration_name = os.environ['MIGRATION_NAME']
          migration_path = os.environ['MIGRATION_PATH']
          old_blocker = 'founder_aal2_session_not_yet_verified'
          new_blocker = 'founder_approver_account_not_yet_configured'

          def read(path: str) -> str:
              return Path(path).read_text(encoding='utf-8')

          def write(path: str, text: str) -> None:
              Path(path).write_text(text, encoding='utf-8')

          def replace_exact(text: str, old: str, new: str, expected: int, label: str) -> str:
              actual = text.count(old)
              if actual != expected:
                  raise SystemExit(f'{label}: expected {expected} occurrences, found {actual}')
              return text.replace(old, new)

          wrappers = [
              'trade.json',
              'co_fund.json',
              'threshold_funding.json',
              'donation_upgrade.json',
              'threshold_sign_on.json',
              'donation_redirect.json',
          ]
          wrapper_dir = Path('docs/commitments/impact-methodologies-v1')
          for filename in wrappers:
              path = wrapper_dir / filename
              payload = json.loads(path.read_text(encoding='utf-8'))
              blockers = payload.get('approvalBlockers')
              if not isinstance(blockers, list) or blockers.count(old_blocker) != 1:
                  raise SystemExit(f'{path}: stale AAL2 blocker shape is not exact')
              payload['approvalBlockers'] = [new_blocker if item == old_blocker else item for item in blockers]
              path.write_text(json.dumps(payload, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          manifest_path = wrapper_dir / 'manifest.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          expected_global = 'the selected founder approver must enroll authenticator MFA and establish a real AAL2 session'
          replacement_global = 'the selected founder account must be configured as an active impact-model approver and use an authenticated session'
          if manifest.get('globalApprovalBlockers', []).count(expected_global) != 1:
              raise SystemExit('manifest global MFA blocker is not exact')
          manifest['globalApprovalBlockers'] = [
              replacement_global if item == expected_global else item
              for item in manifest['globalApprovalBlockers']
          ]
          for entry in manifest.get('methodologies', []):
              blockers = entry.get('approvalBlockers')
              if not isinstance(blockers, list) or blockers.count(old_blocker) != 1:
                  raise SystemExit(f"manifest entry {entry.get('mechanismFamily')} has unexpected blocker state")
              entry['approvalBlockers'] = [new_blocker if item == old_blocker else item for item in blockers]
          manifest['generatedAtUtc'] = '2026-08-10T01:38:45Z'
          manifest['status'] = 'review_ready_current_main_synced_qa_authenticated_approver_migration_verified_not_approved_not_active'
          manifest['sourcePullRequestHead'] = target_sha
          manifest['currentMainAtPreparation'] = main_sha
          manifest['currentMainMergeCommit'] = target_sha
          manifest['currentStageApprovalSecurity'] = {
              'mfaRequired': False,
              'mfaDeferredUntil': 'site_high_leverage',
              'approverRequirement': 'authenticated_active_allowlisted_account',
              'qaProjectRef': os.environ['EXPECTED_QA_REF'],
              'qaMigrationVersion': migration_version,
              'qaMigrationName': migration_name,
              'status': 'applied_and_verified',
              'productionApplied': False,
          }
          manifest_path.write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          review_path = 'docs/commitments/impact-methodologies-v1-review.md'
          review = read(review_path)
          review = replace_exact(
              review,
              '**Status:** current-main synchronized; QA RLS hardening applied and verified; not approved; not active; not deployed to production',
              '**Status:** current-main synchronized; QA RLS hardening and present-stage authenticated-approver governance applied and verified; MFA deferred until the site is high-leverage; not approved; not active; not deployed to production',
              1,
              'review status',
          )
          review = replace_exact(
              review,
              '- Current `main` merged into the feature branch: `bb3b0e4608b7282aecc9d1fe11b5cb310c409347`\n- Current-main synchronization merge commit: `d34398baeae99ea99d87c97576ef3280dd5b9b57`',
              f'- Current `main` merged into the feature branch: `{main_sha}`\n- Current-main synchronization merge commit: `{target_sha}`',
              1,
              'review current-main state',
          )
          review = replace_exact(
              review,
              '- Exact normalized migration SHA-256: `33bc1fefed0298a1643bd37956b9c8850ccffd8805d66403439e4c1ab60e5bf4`\n- Production database and production deployment: unchanged by this continuation',
              '- Exact normalized migration SHA-256: `33bc1fefed0298a1643bd37956b9c8850ccffd8805d66403439e4c1ab60e5bf4`\n'
              f'- QA present-stage approver migration: `{migration_version}_{migration_name}.sql`\n'
              '- Current approval requirement: authenticated active allowlisted founder account; MFA is not required at the present stage\n'
              '- MFA reconsideration point: when Moral Trade becomes high-leverage, including meaningful users, funds, irreversible commitments, or concentrated production control\n'
              '- Production database and production deployment: unchanged by this continuation',
              1,
              'review QA migration metadata',
          )
          approval_heading = '## Approval and activation sequence\n'
          if review.count(approval_heading) != 1:
              raise SystemExit('review approval heading is not exact')
          security_section = (
              '## Present-stage approval security\n\n'
              'The selected founder account must be explicitly configured in the audited `impact_model_approvers` allowlist and must use an authenticated session. MFA/AAL2 is deliberately not a present-stage requirement. The optional AAL2 check remains available in the database so a later migration can require it once Moral Trade is high-leverage without changing the approver roster, exact-hash audit trail, or model-health gates. Exact methodology hashes, append-only approval events, active-approver status, and current passing model health remain mandatory.\n\n'
          )
          review = review.replace(approval_heading, security_section + approval_heading)
          review = replace_exact(
              review,
              '3. Enroll authenticator MFA for the selected founder approver and verify a real AAL2 session on `/dashboard#account-security`.',
              '3. Configure the selected founder account as an active impact-model approver and use an authenticated session. MFA is explicitly deferred until the site is high-leverage.',
              1,
              'approval step 3',
          )
          review = replace_exact(
              review,
              '6. Record explicit AAL2 founder approval for each exact hash.',
              '6. Record explicit authenticated founder approval for each exact hash.',
              1,
              'approval step 6',
          )
          review = replace_exact(
              review,
              '- Founder authenticator MFA / AAL2 has not been verified.',
              '- The selected founder account has not yet been configured as an active impact-model approver.',
              1,
              'review blocker',
          )
          write(review_path, review)

          validator_path = 'scripts/validate-commitments-impact-methodologies.mjs'
          validator = read(validator_path)
          validator = replace_exact(
              validator,
              '\nfunction canonicalize(value) {',
              '\nconst CURRENT_STAGE_APPROVER_BLOCKER = "founder_approver_account_not_yet_configured";\n'
              'const RETIRED_PRESENT_STAGE_BLOCKER = "founder_aal2_session_not_yet_verified";\n\n'
              'function canonicalize(value) {',
              1,
              'validator constants',
          )
          validator = replace_exact(
              validator,
              'assert(manifest.qaRlsHardening?.productionApplied === false, "Manifest must not claim production migration.");',
              'assert(manifest.qaRlsHardening?.productionApplied === false, "Manifest must not claim production migration.");\n'
              'assert(manifest.currentStageApprovalSecurity?.mfaRequired === false, "Present-stage manifest must not require MFA.");\n'
              'assert(manifest.currentStageApprovalSecurity?.mfaDeferredUntil === "site_high_leverage", "MFA deferral stage is missing.");\n'
              'assert(manifest.currentStageApprovalSecurity?.approverRequirement === "authenticated_active_allowlisted_account", "Present-stage approver requirement is invalid.");\n'
              'assert(manifest.currentStageApprovalSecurity?.qaMigrationVersion === "20260810013845", "Present-stage QA governance migration is not bound.");\n'
              'assert(!JSON.stringify(manifest.globalApprovalBlockers).match(/aal2|authenticator|mfa/i), "Present-stage global blockers must not retain MFA/AAL2.");',
              1,
              'validator manifest policy',
          )
          validator = replace_exact(
              validator,
              '  assert(entry.methodologyHash === expectedHash, `${mechanism} manifest hash mismatch.`);',
              '  assert(entry.methodologyHash === expectedHash, `${mechanism} manifest hash mismatch.`);\n'
              '  assert(entry.approvalBlockers.includes(CURRENT_STAGE_APPROVER_BLOCKER), `${mechanism} present-stage approver blocker is missing.`);\n'
              '  assert(!entry.approvalBlockers.includes(RETIRED_PRESENT_STAGE_BLOCKER), `${mechanism} retains the retired AAL2 blocker.`);',
              1,
              'validator entry blocker policy',
          )
          validator = replace_exact(
              validator,
              '  assert(\n    JSON.stringify(wrapper.approvalBlockers) === JSON.stringify(entry.approvalBlockers),\n    `${mechanism} manifest/file blockers differ.`,\n  );',
              '  assert(\n    JSON.stringify(wrapper.approvalBlockers) === JSON.stringify(entry.approvalBlockers),\n    `${mechanism} manifest/file blockers differ.`,\n  );\n'
              '  assert(wrapper.approvalBlockers.includes(CURRENT_STAGE_APPROVER_BLOCKER), `${mechanism} wrapper present-stage approver blocker is missing.`);\n'
              '  assert(!wrapper.approvalBlockers.includes(RETIRED_PRESENT_STAGE_BLOCKER), `${mechanism} wrapper retains the retired AAL2 blocker.`);',
              1,
              'validator wrapper blocker policy',
          )
          write(validator_path, validator)

          workflow_path = '.github/workflows/commitments-impact-accounting-gates.yml'
          workflow = read(workflow_path)
          workflow = replace_exact(
              workflow,
              '      - "supabase/migrations/20260808174259_mpgf_public_goods_public_read_rls.sql"',
              '      - "supabase/migrations/20260808174259_mpgf_public_goods_public_read_rls.sql"\n'
              '      - "supabase/migrations/20260810013845_commitments_impact_present_stage_authenticated_approver.sql"',
              1,
              'workflow trigger path',
          )
          workflow = replace_exact(
              workflow,
              '          supabase/migrations/20260808174259_mpgf_public_goods_public_read_rls.sql\n          supabase/tests/commitments_impact_accounting_phase1.sql',
              '          supabase/migrations/20260808174259_mpgf_public_goods_public_read_rls.sql\n'
              '          supabase/migrations/20260810013845_commitments_impact_present_stage_authenticated_approver.sql\n'
              '          supabase/tests/commitments_impact_accounting_phase1.sql',
              1,
              'workflow required file',
          )
          workflow = replace_exact(
              workflow,
              '              supabase/migrations/20260808174259_mpgf_public_goods_public_read_rls.sql) ;;',
              '              supabase/migrations/20260808174259_mpgf_public_goods_public_read_rls.sql|\\\n'
              '              supabase/migrations/20260810013845_commitments_impact_present_stage_authenticated_approver.sql) ;;',
              1,
              'workflow allowlist',
          )
          workflow = replace_exact(
              workflow,
              "            printf '%s\\n' supabase/migrations/20260808174259_mpgf_public_goods_public_read_rls.sql",
              "            printf '%s\\n' supabase/migrations/20260808174259_mpgf_public_goods_public_read_rls.sql\n"
              "            printf '%s\\n' supabase/migrations/20260810013845_commitments_impact_present_stage_authenticated_approver.sql",
              1,
              'workflow migration inventory',
          )
          write(workflow_path, workflow)

          test_path = 'supabase/tests/commitments_impact_accounting_phase1.sql'
          sql_test = read(test_path)
          sql_test = replace_exact(
              sql_test,
              "      ('20260806135201', 'commitments_impact_approver_event_comment_fix')",
              "      ('20260806135201', 'commitments_impact_approver_event_comment_fix'),\n"
              "      ('20260810013845', 'commitments_impact_present_stage_authenticated_approver')",
              1,
              'SQL expected migration',
          )
          guard_pattern = re.compile(r"do \\$aal1_guard\\\$.*?\\$aal1_guard\\\$;", re.S)
          guard_replacement = """do $present_stage_auth_guard$
begin
  if not public.is_impact_model_approver(false) then
    raise exception 'The configured account was not recognized as a present-stage authenticated approver.';
  end if;
  if public.is_impact_model_approver(true) then
    raise exception 'AAL1 unexpectedly satisfied the optional future AAL2 check.';
  end if;
end;
$present_stage_auth_guard$;"""
          sql_test, count = guard_pattern.subn(guard_replacement, sql_test, count=1)
          if count != 1:
              raise SystemExit(f'SQL present-stage guard replacement count: {count}')

          marker = '$present_stage_auth_guard$;\n\nreset role;\n'
          if sql_test.count(marker) != 1:
              raise SystemExit('SQL insertion marker is not exact')
          unconfigured_guard = """

select set_config(
  'request.jwt.claims',
  jsonb_build_object(
    'sub', '7a100000-0000-4000-8000-000000000003',
    'role', 'authenticated',
    'aal', 'aal1'
  )::text,
  true
);
set local role authenticated;

do $unconfigured_approver_guard$
begin
  begin
    perform public.submit_impact_model_version_for_review(
      '7a100000-0000-4000-8000-000000000010'
    );
    raise exception 'An unconfigured authenticated user unexpectedly submitted an impact model.';
  exception
    when insufficient_privilege then null;
  end;

  begin
    perform public.review_impact_model_version(
      '7a100000-0000-4000-8000-000000000010',
      'approve',
      'This must not be recorded.'
    );
    raise exception 'An unconfigured authenticated user unexpectedly reviewed an impact model.';
  exception
    when insufficient_privilege then null;
  end;

  begin
    perform public.activate_impact_model_version(
      '7a100000-0000-4000-8000-000000000010'
    );
    raise exception 'An unconfigured authenticated user unexpectedly activated an impact model.';
  exception
    when insufficient_privilege then null;
  end;
end;
$unconfigured_approver_guard$;

reset role;
"""
          sql_test = sql_test.replace(marker, marker + unconfigured_guard, 1)
          auth_aal2 = "'role', 'authenticated',\n    'aal', 'aal2'"
          auth_aal1 = "'role', 'authenticated',\n    'aal', 'aal1'"
          if sql_test.count(auth_aal2) != 2:
              raise SystemExit(f'Expected two authenticated AAL2 fixtures, found {sql_test.count(auth_aal2)}')
          sql_test = sql_test.replace(auth_aal2, auth_aal1)
          if 'AAL1 unexpectedly submitted an impact model for review' in sql_test:
              raise SystemExit('Retired AAL1 denial assertion remains in SQL test')
          write(test_path, sql_test)

          # Assert no current-stage documents or wrappers still treat MFA/AAL2 as a blocker.
          inspected = [review_path, validator_path, str(manifest_path)] + [str(wrapper_dir / item) for item in wrappers]
          for path in inspected:
              text = read(path)
              if old_blocker in text:
                  raise SystemExit(f'{path}: retired blocker remains')
          if Path(migration_path).name not in read(workflow_path):
              raise SystemExit('New migration is not bound into the gate workflow')
          PY

          git diff --check
          git diff --stat | tee "$EVIDENCE_DIR/changed-files-stat.txt"
          git diff --name-only | sort | tee "$EVIDENCE_DIR/changed-files.txt"

      - name: Verify exact registered migration source
        shell: bash
        run: |
          set -euo pipefail
          registered="$RUNNER_TEMP/registered-${MIGRATION_VERSION}.sql"
          psql "$QA_SUPABASE_DB_URL" --no-psqlrc -Atqc \
            "select statements[1] from supabase_migrations.schema_migrations where version = '${MIGRATION_VERSION}';" \
            > "$registered"
          python3 - "$MIGRATION_PATH" "$registered" <<'PY' | tee "$EVIDENCE_DIR/migration-source-verification.log"
          from pathlib import Path
          import hashlib
          import sys

          source = Path(sys.argv[1]).read_text(encoding='utf-8').rstrip('\n')
          registered = Path(sys.argv[2]).read_text(encoding='utf-8').rstrip('\n')
          if source != registered:
              print(f"source_sha256={hashlib.sha256(source.encode()).hexdigest()}", file=sys.stderr)
              print(f"registered_sha256={hashlib.sha256(registered.encode()).hexdigest()}", file=sys.stderr)
              raise SystemExit(1)
          print(f"migration_version={sys.argv[1].split('/')[-1].split('_', 1)[0]}")
          print(f"normalized_sha256={hashlib.sha256(source.encode()).hexdigest()}")
          print('source_matches_registered=true')
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Validate methodologies and run focused tests
        shell: bash
        run: |
          set -o pipefail
          node scripts/validate-commitments-impact-methodologies.mjs \
            2>&1 | tee "$EVIDENCE_DIR/methodology-validation.log"
          node --import tsx --test \
            src/lib/impact-accounting.test.ts \
            src/lib/impact-model-governance.test.ts \
            2>&1 | tee "$EVIDENCE_DIR/focused-tests.log"

      - name: Run complete repository tests, lint, TypeScript, and build
        shell: bash
        env:
          NEXT_PUBLIC_SITE_URL: https://www.moraltrade.org
          VERCEL: '1'
          VERCEL_ENV: preview
        run: |
          set -o pipefail
          npm test 2>&1 | tee "$EVIDENCE_DIR/repository-tests.log"
          npm run lint -- --quiet 2>&1 | tee "$EVIDENCE_DIR/repository-lint.log"
          npx tsc --noEmit 2>&1 | tee "$EVIDENCE_DIR/typescript.log"
          npm run build 2>&1 | tee "$EVIDENCE_DIR/production-build.log"

      - name: Run exact QA RLS and transactional governance regression
        shell: bash
        run: |
          set -o pipefail
          psql "$QA_SUPABASE_DB_URL" --no-psqlrc \
            --file supabase/tests/commitments_public_goods_rls.sql \
            2>&1 | tee "$EVIDENCE_DIR/qa-public-goods-rls.log"
          psql "$QA_SUPABASE_DB_URL" --no-psqlrc --set ON_ERROR_STOP=1 \
            --file supabase/tests/commitments_impact_accounting_phase1_prelude.sql \
            --file supabase/tests/commitments_impact_accounting_phase1.sql \
            2>&1 | tee "$EVIDENCE_DIR/qa-impact-accounting.log"

          residue="$(psql "$QA_SUPABASE_DB_URL" --no-psqlrc -Atqc "
            select
              (select count(*) from auth.users where id in (
                '7a100000-0000-4000-8000-000000000001'::uuid,
                '7a100000-0000-4000-8000-000000000002'::uuid,
                '7a100000-0000-4000-8000-000000000003'::uuid))
              + (select count(*) from public.impact_model_versions where id in (
                '7a100000-0000-4000-8000-000000000010'::uuid,
                '7a100000-0000-4000-8000-000000000011'::uuid))
              + (select count(*) from public.impact_estimate_snapshots where subject_ref like 'qa:%phase1%')
              + (select count(*) from public.impact_refresh_queue where subject_ref = 'qa:threshold-pool:phase1');")"
          printf 'synthetic_residue=%s\n' "$residue" | tee "$EVIDENCE_DIR/qa-residue.log"
          test "$residue" = '0'

      - name: Commit and push only if remote heads remain exact
        id: push
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$EXPECTED_MAIN_SHA"
          test "$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')" = "$EXPECTED_TARGET_SHA"
          git diff --check
          git config user.name 'ghuser29384'
          git config user.email '262476329+ghuser29384@users.noreply.github.com'
          git add \
            .github/workflows/commitments-impact-accounting-gates.yml \
            docs/commitments/impact-methodologies-v1-review.md \
            docs/commitments/impact-methodologies-v1 \
            scripts/validate-commitments-impact-methodologies.mjs \
            supabase/tests/commitments_impact_accounting_phase1.sql \
            "$MIGRATION_PATH"
          git commit -m 'Use authenticated approver governance before high-leverage stage'
          new_sha="$(git rev-parse HEAD)"
