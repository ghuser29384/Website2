name: Verify merged Vercel recovery readback once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/verify-vercel-recovery-postmerge-once.yml

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: verify-vercel-recovery-postmerge-once
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'ghuser29384/Website2'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: team_ySu6sF3Uho1E1GnJtCQPVEuJ
      VERCEL_PROJECT_ID: prj_Em3j7Uj7RatX2R1ZYhla3XSHRde7

    steps:
      - name: Check out exact main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Remove one-time controller before execution
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/verify-vercel-recovery-postmerge-once.yml

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Run read-only Vercel audit and verifier
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          node scripts/vercel-admin-cost-controls.mjs audit > /tmp/vercel-recovery-audit.json
          node scripts/vercel-admin-cost-controls.mjs verify > /tmp/vercel-recovery-verify.json
          node scripts/vercel-admin-cost-controls.mjs smoke > /tmp/vercel-recovery-smoke.json
          node - <<'NODE'
          const fs = require('node:fs');
          for (const path of [
            '/tmp/vercel-recovery-audit.json',
            '/tmp/vercel-recovery-verify.json',
            '/tmp/vercel-recovery-smoke.json',
          ]) {
            const value = JSON.parse(fs.readFileSync(path, 'utf8'));
            if (!value || typeof value !== 'object') throw new Error(`Invalid evidence: ${path}`);
          }
          NODE

      - name: Remove controller from main and record evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/verify-vercel-recovery-postmerge-once.yml
          git commit -m 'Remove one-time Vercel recovery post-merge verifier'
          git push origin HEAD:main
          gh pr comment 450 --repo "$GITHUB_REPOSITORY" --body "Merged verifier post-check passed on current production. Read-only audit, corrected administrative verification, and the canonical root plus Commitments Portfolio, Ledger, Completed, and Calendar smoke contract passed using one production deployment. The one-time controller removed itself from main. Evidence: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"