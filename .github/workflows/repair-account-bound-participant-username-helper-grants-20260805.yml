name: Repair account participant username helper grants

on:
  push:
    branches:
      - feature/account-bound-participant-picker-20260805
    paths:
      - .github/workflows/repair-account-bound-participant-username-helper-grants-20260805.yml

permissions:
  contents: write

concurrency:
  group: repair-account-bound-participant-username-helper-grants-20260805
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact branch
        uses: actions/checkout@v4
        with:
          ref: feature/account-bound-participant-picker-20260805
          fetch-depth: 0
          persist-credentials: true

      - name: Apply narrow SQL authorization repair
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "feature/account-bound-participant-picker-20260805"
          git merge-base --is-ancestor 6006b569ab21d6310f6835304601731a2c8a899b HEAD
          test -z "$(git status --porcelain)"

          python3 - <<'PY'
          from pathlib import Path

          migration = Path("supabase/migrations/20260805152000_account_bound_participant_directory_v2.sql")
          source = migration.read_text()
          old = """revoke all on function public.normalize_profile_username_v1(text) from public, anon, authenticated;
          revoke all on function public.profile_username_is_reserved_v1(text) from public, anon, authenticated;
          revoke all on function public.safe_participant_display_name_v1(text, text) from public, anon, authenticated;
          """
          new = """revoke all on function public.normalize_profile_username_v1(text) from public, anon, authenticated;
          revoke all on function public.profile_username_is_reserved_v1(text) from public, anon, authenticated;
          revoke all on function public.safe_participant_display_name_v1(text, text) from public, anon, authenticated;

          -- The profile username check constraint calls these two pure validators while ordinary
          -- authenticated owners update their own profile. Grant only those non-sensitive helpers;
          -- participant search and the private claim ledger remain service-role-only.
          grant execute on function public.normalize_profile_username_v1(text) to authenticated;
          grant execute on function public.profile_username_is_reserved_v1(text) to authenticated;
          """
          if source.count(old) != 1:
              raise SystemExit("migration authorization marker was not unique")
          migration.write_text(source.replace(old, new, 1))

          regression = Path("supabase/tests/account_bound_participant_directory_v2.sql")
          source = regression.read_text()
          old = """  if not has_function_privilege('service_role','public.search_create_participants_v2(uuid,text,integer)','execute') then
              raise exception 'service role cannot execute participant search';
            end if;
            if to_regprocedure('public.search_create_participants_v1(uuid,text,text,uuid,integer)') is not null
          """
          new = """  if not has_function_privilege('service_role','public.search_create_participants_v2(uuid,text,integer)','execute') then
              raise exception 'service role cannot execute participant search';
            end if;
            if not has_function_privilege('authenticated','public.normalize_profile_username_v1(text)','execute')
               or not has_function_privilege('authenticated','public.profile_username_is_reserved_v1(text)','execute') then
              raise exception 'authenticated profile owners cannot execute username constraint helpers';
            end if;
            if has_function_privilege('anon','public.normalize_profile_username_v1(text)','execute')
               or has_function_privilege('anon','public.profile_username_is_reserved_v1(text)','execute') then
              raise exception 'anonymous role can execute username constraint helpers';
            end if;
            if to_regprocedure('public.search_create_participants_v1(uuid,text,text,uuid,integer)') is not null
          """
          if source.count(old) != 1:
              raise SystemExit("regression authorization marker was not unique")
          regression.write_text(source.replace(old, new, 1))
          PY

          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 2
          git diff --name-only | sort | diff -u - <(printf '%s\n' \
            supabase/migrations/20260805152000_account_bound_participant_directory_v2.sql \
            supabase/tests/account_bound_participant_directory_v2.sql | sort)
          grep -Fq "grant execute on function public.normalize_profile_username_v1(text) to authenticated;" \
            supabase/migrations/20260805152000_account_bound_participant_directory_v2.sql
          grep -Fq "anonymous role can execute username constraint helpers" \
            supabase/tests/account_bound_participant_directory_v2.sql

      - name: Commit repair and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            supabase/migrations/20260805152000_account_bound_participant_directory_v2.sql \
            supabase/tests/account_bound_participant_directory_v2.sql
          git commit -m "Allow profile owners to satisfy username constraints"
          git push origin HEAD:feature/account-bound-participant-picker-20260805
