name: Temporary repair PR 558 duplicate noindex metadata assertion

on:
  push:
    branches:
      - temp/fix-pr558-noindex-duplicates-20260808

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPECTED_HEAD_SHA: b0b1cb030ef4ec37510fcfe7a0254efbbcba81f8
      TARGET_BRANCH: fix/mpgf-dac-product-lifecycle-20260807

    steps:
      - name: Check out the exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Assert presence rather than a brittle duplicate metadata count
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          python3 - <<'PY'
          from pathlib import Path

          browser_path = Path("tests/mpgf-dac-product-lifecycle.spec.ts")
          browser = browser_path.read_text()
          old_assertion = (
              "  await expect(page.locator('meta[name=\"robots\"][content*=\"noindex\"]')).toHaveCount(1);\n"
          )
          new_assertion = (
              "  await expect(\n"
              "    page.locator('meta[name=\"robots\"][content*=\"noindex\"]').first(),\n"
              "  ).toHaveAttribute(\"content\", /noindex/);\n"
          )
          if browser.count(old_assertion) != 1:
              raise SystemExit(
                  f"Expected exactly one brittle noindex count assertion, found {browser.count(old_assertion)}."
              )
          browser = browser.replace(old_assertion, new_assertion)
          if old_assertion in browser:
              raise SystemExit("The brittle exact noindex metadata count remains.")
          if browser.count(new_assertion) != 1:
              raise SystemExit("The semantic noindex metadata assertion was not installed exactly once.")
          browser_path.write_text(browser)

          contract_path = Path("src/lib/mpgf/dac-browser-selector-contract.test.ts")
          contract = contract_path.read_text()
          old_contract = (
              "  assert.ok(\n"
              "    browserSpec.includes('meta[name=\\\"robots\\\"][content*=\\\"noindex\\\"]'),\n"
              "    \"The outsider proof must require Next.js not-found noindex metadata.\",\n"
              "  );\n"
          )
          new_contract = old_contract + (
              "  assert.ok(\n"
              "    browserSpec.includes(\".first(),\\n  ).toHaveAttribute(\\\"content\\\", /noindex/)\"),\n"
              "    \"The outsider proof must accept duplicate framework-generated noindex metadata while requiring at least one canonical marker.\",\n"
              "  );\n"
              "  assert.ok(\n"
              "    !browserSpec.includes(\"meta[name=\\\"robots\\\"][content*=\\\"noindex\\\"]')).toHaveCount(1)\"),\n"
              "    \"The browser proof must not require exactly one framework-generated noindex element.\",\n"
              "  );\n"
          )
          if contract.count(old_contract) != 1:
              raise SystemExit("Expected exactly one noindex selector contract anchor.")
          if "duplicate framework-generated noindex metadata" in contract:
              raise SystemExit("Duplicate-noindex regression assertions already exist unexpectedly.")
          contract_path.write_text(contract.replace(old_contract, new_contract))
          PY

          git diff --check
          git diff -- \
            tests/mpgf-dac-product-lifecycle.spec.ts \
            src/lib/mpgf/dac-browser-selector-contract.test.ts

      - name: Install exact dependencies
        run: npm ci

      - name: Prove the scoped browser contracts
        shell: bash
        run: |
          set -euo pipefail
          node --import tsx --test \
            src/lib/mpgf/dac-browser-selector-contract.test.ts \
            src/lib/mpgf/dac-pledge-currency-format.test.ts \
            src/lib/mpgf/dac-product-lifecycle.test.ts

      - name: Commit the proven repair to the PR branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tests/mpgf-dac-product-lifecycle.spec.ts \
            src/lib/mpgf/dac-browser-selector-contract.test.ts
          git commit -m "test(mpgf): tolerate duplicate not-found metadata"
          git push origin "HEAD:${TARGET_BRANCH}"
