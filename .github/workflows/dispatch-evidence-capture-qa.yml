name: Dispatch exact-head evidence capture QA

on:
  push:
    branches:
      - feature/evidence-credibility-capture-queue-20260811
    paths:
      - .github/workflows/dispatch-evidence-capture-qa.yml

permissions:
  actions: write
  contents: write

concurrency:
  group: dispatch-evidence-capture-qa-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Remove this one-use controller and push the durable exact head
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/dispatch-evidence-capture-qa.yml
          git commit -m "ops: dispatch repaired capture QA candidate"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "DURABLE_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Dispatch the existing exact-head QA workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/payload.json
          import json
          import os
          print(json.dumps({"ref": os.environ["GITHUB_REF_NAME"]}))
          PY
          curl --fail-with-body \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/evidence-credibility-capture-qa.yml/dispatches" \
            --data-binary @/tmp/payload.json
          echo "Dispatched evidence-credibility-capture-qa.yml for ${DURABLE_HEAD}."
