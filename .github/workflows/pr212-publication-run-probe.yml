name: PR 212 publication run probe

on:
  push:
    branches:
      - ops/pr212-final-ui-publish-20260730
    paths:
      - .github/workflows/pr212-publication-run-probe.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_HEAD: 666f36318d54fe3c648d35950ec6199d640cf6f1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/pr212-final-ui-publish-20260730
          fetch-depth: 0
      - name: Record publication workflow runs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ops/pr212-publication-probe
          gh run list --repo "$GITHUB_REPOSITORY" --workflow publish-pr212-final-ui.yml --branch ops/pr212-final-ui-publish-20260730 --limit 50 --json databaseId,headSha,status,conclusion,createdAt,event,url,displayTitle > /tmp/runs.json
          jq --arg head "$TARGET_HEAD" '{target_head:$head,exact_head_runs:[.[] | select(.headSha == $head)],all_runs:.}' /tmp/runs.json > ops/pr212-publication-probe/report.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops/pr212-publication-probe/report.json
          git commit -m "Record PR 212 publication workflow probe"
          git push origin HEAD:ops/pr212-final-ui-publish-20260730
