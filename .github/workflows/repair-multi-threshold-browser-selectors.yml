name: Repair multi-threshold browser selectors

on:
  pull_request:
    branches:
      - feature/mpgf-multi-threshold-failure-bonus-editor-20260726
    paths:
      - ".github/workflows/repair-multi-threshold-browser-selectors.yml"

permissions:
  contents: write

jobs:
  repair-selectors:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'qa/multi-threshold-authenticated-browser-20260727'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_SCRIPT_BLOB: e4c3e28751eee741527d761e778e71d136f50d8b
      QA_BRANCH: qa/multi-threshold-authenticated-browser-20260727
      SCRIPT_PATH: .github/scripts/multi-threshold-authenticated-browser-qa.mjs

    steps:
      - name: Check out exact QA branch
        uses: actions/checkout@v4
        with:
          ref: qa/multi-threshold-authenticated-browser-20260727
          fetch-depth: 0

      - name: Apply exact currency-prefix-safe locator repair
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git hash-object "$SCRIPT_PATH")" = "$EXPECTED_SCRIPT_BLOB"
          python - <<'PY'
          from pathlib import Path

          path = Path(".github/scripts/multi-threshold-authenticated-browser-qa.mjs")
          source = path.read_text()
          old = '''function spinbutton(page, name) {
  return page.getByRole("spinbutton", { name, exact: true });
}'''
          new = '''function spinbutton(page, name) {
  return page.getByRole("spinbutton", { name: new RegExp(`^${name}`) });
}'''
          if source.count(old) != 1:
              raise SystemExit(f"Expected one exact spinbutton helper, found {source.count(old)}")
          path.write_text(source.replace(old, new, 1))
          PY
          test "$(git diff --name-only)" = "$SCRIPT_PATH"
          git diff --check
          node --check "$SCRIPT_PATH"

      - name: Publish repaired QA script
        shell: bash
        run: |
          set -euxo pipefail
          rm -f .github/workflows/repair-multi-threshold-browser-selectors.yml
          git add -A
          git diff --cached --check
          git config user.name "Moral Trade QA automation"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Match currency-prefixed QA spinbuttons"
          git push origin "HEAD:${QA_BRANCH}"
