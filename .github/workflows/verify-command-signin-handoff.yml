name: Verify Command sign-in handoff

on:
  pull_request:
    branches:
      - feat/universal-command-workspace

permissions:
  contents: read

jobs:
  verify:
    if: github.head_ref == 'trigger/finalize-universal-command'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/universal-command-workspace
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx eslint src/app/mpgf/pools/new/page.tsx tests/exact-live-command-center.spec.ts
      - run: node --import tsx --test src/lib/command/*.test.ts src/lib/command-center-handoff.test.ts
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- tests/exact-live-command-center.spec.ts
