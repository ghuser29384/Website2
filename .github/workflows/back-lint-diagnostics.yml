name: Back lint diagnostics

on:
  push:
    branches:
      - feature/develop-back-create-flow

permissions:
  contents: read

jobs:
  lint-diagnostics:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Capture lint output
        id: lint
        shell: bash
        run: |
          set +e
          npm run lint > lint-output.txt 2>&1
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload lint output
        uses: actions/upload-artifact@v4
        with:
          name: back-lint-output
          path: lint-output.txt
          if-no-files-found: error
          retention-days: 1
