name: Split one-person cross-relation migration locks v3

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-person-migration-split-controller-v3.yml

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: one-person-migration-split-controller-v3
  cancel-in-progress: false

env:
  CONTROLLER_PATH: .github/workflows/one-person-migration-split-controller-v3.yml
  V1_COMMIT: beb5745a026373e13d65cfbe3a54c7d659f7155e
  V1_PATH: .github/workflows/one-person-migration-split-controller.yml
  TARGET_BRANCH: feature/one-person-one-account-20260731
  EXPECTED_FEATURE_HEAD: 68eb508998658c5ec4285234ed321f493da7126c
  IDENTITY_MIGRATION: supabase/migrations/20260731072000_one_person_one_account.sql
  PROFILE_MIGRATION: supabase/migrations/20260801153000_one_person_profile_badge_projection_trigger.sql
  QA_WORKFLOW: .github/workflows/one-person-account-qa.yml

jobs:
  split:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact controller commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          token: ${{ github.token }}

      - name: Verify one-file scope and remove controller from main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'ghuser29384/Website2'
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          changed="$(git diff-tree --no-commit-id --name-only -r HEAD | sed '/^$/d')"
          test "$changed" = "$CONTROLLER_PATH"
          controller_sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/$CONTROLLER_PATH?ref=main" --jq .sha)"
          jq -n \
            --arg message 'Remove one-person migration split controller v3' \
            --arg sha "$controller_sha" \
            --arg branch main \
            '{message:$message,sha:$sha,branch:$branch}' \
            | gh api --method DELETE \
                "repos/$GITHUB_REPOSITORY/contents/$CONTROLLER_PATH" \
                --input - >/dev/null

      - name: Recover and fully normalize the reviewed repair program
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$V1_COMMIT"
          git show "$V1_COMMIT:$V1_PATH" > /tmp/one-person-split-v1.yml
          python3 - <<'PY'
          from pathlib import Path

          path = Path('/tmp/one-person-split-v1.yml')
          text = path.read_text(encoding='utf-8')

          opening = "          replay_step = '''      - name: Replay relation-isolated migrations under adversarial lock order with rollback"
          closing = "                  grep -Fq 'ROLLBACK' one-person-profile-replay.txt\n          '''\n          workflow = workflow[:replay_start] + replay_step + workflow[replay_end:]"
          if text.count(opening) != 1 or text.count(closing) != 1:
              raise SystemExit('unexpected v1 nested-string inventory')
          text = text.replace(
              opening,
              '          replay_step = """      - name: Replay relation-isolated migrations under adversarial lock order with rollback',
              1,
          )
          text = text.replace(
              closing,
              "                  grep -Fq 'ROLLBACK' one-person-profile-replay.txt\n          \"\"\"\n          workflow = workflow[:replay_start] + replay_step + workflow[replay_end:]",
              1,
          )

          expected_old = "          expected_needle = '''          supabase/migrations/20260731072000_one_person_one_account.sql\n                supabase/tests/one_person_one_account.sql'''"
          expected_new = "          expected_needle = '''          supabase/migrations/20260731072000_one_person_one_account.sql\n                    supabase/tests/one_person_one_account.sql'''"
          replacement_old = "          expected_replacement = '''          supabase/migrations/20260731072000_one_person_one_account.sql\n                supabase/migrations/20260801153000_one_person_profile_badge_projection_trigger.sql\n                supabase/tests/one_person_one_account.sql'''"
          replacement_new = "          expected_replacement = '''          supabase/migrations/20260731072000_one_person_one_account.sql\n                    supabase/migrations/20260801153000_one_person_profile_badge_projection_trigger.sql\n                    supabase/tests/one_person_one_account.sql'''"
          if text.count(expected_old) != 1 or text.count(replacement_old) != 1:
              raise SystemExit('unexpected expected-path string inventory')
          text = text.replace(expected_old, expected_new, 1)
          text = text.replace(replacement_old, replacement_new, 1)

          artifact_old = """          artifact_old = '''            one-person-migration.sha256
                one-person-migration.txt
                one-person-schema-inventory.txt
                one-person-gates-before.json
                one-person-lock-replay.sha256
                one-person-lock-replay.txt
                one-person-lock-blocker.txt'''"""
          artifact_old_fixed = """          artifact_old = '''            one-person-migration.sha256
                      one-person-migration.txt
                      one-person-schema-inventory.txt
                      one-person-gates-before.json
                      one-person-lock-replay.sha256
                      one-person-lock-replay.txt
                      one-person-lock-blocker.txt'''"""
          artifact_new = """          artifact_new = '''            one-person-migrations.sha256
                one-person-identity-migration.txt
                one-person-profile-migration.txt
                one-person-schema-inventory.txt
                one-person-gates-before.json
                one-person-replays.sha256
                one-person-identity-replay.txt
                one-person-profile-replay.txt
                one-person-lock-blocker.txt'''"""
          artifact_new_fixed = """          artifact_new = '''            one-person-migrations.sha256
                      one-person-identity-migration.txt
                      one-person-profile-migration.txt
                      one-person-schema-inventory.txt
                      one-person-gates-before.json
                      one-person-replays.sha256
                      one-person-identity-replay.txt
                      one-person-profile-replay.txt
                      one-person-lock-blocker.txt'''"""
          if text.count(artifact_old) != 1 or text.count(artifact_new) != 1:
              raise SystemExit('unexpected artifact string inventory')
          text = text.replace(artifact_old, artifact_old_fixed, 1)
          text = text.replace(artifact_new, artifact_new_fixed, 1)

          def indent_string_continuations(source: str, start_marker: str, end_marker: str) -> str:
              start = source.index(start_marker)
              body_start = source.index('\n', start) + 1
              end = source.index(end_marker, body_start)
              body = source[body_start:end]
              body = '\n'.join(('  ' + line if line else line) for line in body.split('\n'))
              return source[:body_start] + body + source[end:]

          text = indent_string_continuations(
              text,
              "          apply_step = '''      - name: Apply additive migrations once to isolated QA",
              "          '''\n          workflow = workflow[:apply_start]",
          )
          text = indent_string_continuations(
              text,
              '          replay_step = """      - name: Replay relation-isolated migrations under adversarial lock order with rollback',
              '          """\n          workflow = workflow[:replay_start]',
          )

          path.write_text(text, encoding='utf-8')
          PY
          ruby -e 'require "yaml"; YAML.parse_file(ARGV[0]) or abort("invalid recovered controller YAML")' /tmp/one-person-split-v1.yml
          ruby -ryaml -e '
            doc = YAML.load_file(ARGV[0]);
            step = doc.fetch("jobs").fetch("split").fetch("steps").find { |item| item["name"] == "Split profile trigger into a relation-isolated migration and update QA" };
            abort("repair step not found") unless step && step["run"];
            print step["run"]
          ' /tmp/one-person-split-v1.yml > /tmp/one-person-repair-step.sh
          bash -n /tmp/one-person-repair-step.sh

      - name: Check out exact feature head and execute repaired program
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH"
          test "$(git rev-parse "refs/remotes/origin/$TARGET_BRANCH")" = "$EXPECTED_FEATURE_HEAD"
          git switch --detach "$EXPECTED_FEATURE_HEAD"
          test "$(git rev-parse HEAD)" = "$EXPECTED_FEATURE_HEAD"
          test -f "$IDENTITY_MIGRATION"
          test -f "$QA_WORKFLOW"
          test ! -e "$PROFILE_MIGRATION"
          bash /tmp/one-person-repair-step.sh

      - name: Commit and push exact feature repair
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')" = "$EXPECTED_FEATURE_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$IDENTITY_MIGRATION" "$PROFILE_MIGRATION" "$QA_WORKFLOW"
          git diff --cached --check
          cat > /tmp/expected-paths.txt <<'EOF'
          .github/workflows/one-person-account-qa.yml
          supabase/migrations/20260731072000_one_person_one_account.sql
          supabase/migrations/20260801153000_one_person_profile_badge_projection_trigger.sql
          EOF
          sed -i 's/^          //' /tmp/expected-paths.txt
          sort -o /tmp/expected-paths.txt /tmp/expected-paths.txt
          git diff --cached --name-only | sort > /tmp/actual-paths.txt
          diff -u /tmp/expected-paths.txt /tmp/actual-paths.txt
          git commit -m 'Split one-person profile trigger into relation-isolated migration'
          candidate_sha="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_FEATURE_HEAD"
          git push --force-with-lease="refs/heads/$TARGET_BRANCH:$EXPECTED_FEATURE_HEAD" \
            origin "HEAD:refs/heads/$TARGET_BRANCH"
          echo "candidate_sha=$candidate_sha" >> "$GITHUB_OUTPUT"

      - name: Report result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ steps.publish.outputs.candidate_sha }}
        shell: bash
        run: |
          if [[ -n "$CANDIDATE_SHA" ]]; then
            gh pr comment 379 --repo "$GITHUB_REPOSITORY" --body "Split the cross-relation trigger DDL into an idempotent profile-only migration and pushed exact candidate \`$CANDIDATE_SHA\`. The draft PR remains unmerged; production is unchanged. Exact-head repository and isolated-QA gates are running."
          else
            gh pr comment 379 --repo "$GITHUB_REPOSITORY" --body "The one-person migration split controller v3 failed in run \`$GITHUB_RUN_ID\`. No feature push occurred unless every exact-head, exact-path, syntax, and force-with-lease guard passed."
          fi
