name: Temporary export — Discover PR 347 source

on:
  push:
    branches:
      - ops/export-discover-pr347-source-20260731

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4

      - name: Verify and package the PR 347 changed surface
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "f39cb3dd4b6ef527cfee47b0d3d03e5e8226db24"
          mkdir -p export
          while IFS= read -r path; do
            test -f "$path"
            mkdir -p "export/$(dirname "$path")"
            cp "$path" "export/$path"
          done <<'EOF'
          .github/workflows/smart-query-qa.yml
          package.json
          public/discover/payload/0.txt
          public/discover/payload/1.txt
          public/discover/payload/2.txt
          public/discover/payload/3.txt
          public/discover/payload/4.txt
          public/discover/payload/5.txt
          public/discover/payload/6.txt
          scripts/discover-two-sided-contract.test.mjs
          scripts/pack-discover-payload.mjs
          src/discover/moral-trade-discover.source.html
          tests/discover-query-audit.spec.ts
          EOF
          printf '%s\n' "$(git rev-parse HEAD^)" > export/EXPORTED_SOURCE_SHA
          tar -czf discover-pr347-source.tgz -C export .

      - name: Upload exact source surface
        uses: actions/upload-artifact@v4
        with:
          name: discover-pr347-source
          path: discover-pr347-source.tgz
          if-no-files-found: error
          retention-days: 1
