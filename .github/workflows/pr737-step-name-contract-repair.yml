name: PR 737 bounded adjacent-QA repair

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/pr737-step-name-contract-repair.yml

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: pr737-bounded-adjacent-qa-repair
  cancel-in-progress: true

env:
  TARGET_BRANCH: feature/compact-authoritative-outflow-ledger-v1-20260816
  TARGET_PATH: .github/workflows/mpgf-public-goods-compacts-qa.yml
  TARGET_CONTROLLER_PATH: .github/workflows/pr737-adjacent-qa-repair-once.yml
  EXPECTED_PARENT: a409141dcb57dd67fdef472509d180765267c407
  EXPECTED_HEAD: 32c4d35346eb5588424c9ce5d09ceca22d3a519e
  EXPECTED_TARGET_BLOB: 29a819544957ecd698f5474977b2d0fd80a26752
  EXPECTED_CONTROLLER_BLOB: e1f8e9d6e5593efbf2d3f2ab3d25606c0b2c09f0
  PR_NUMBER: "737"
  GH_TOKEN: ${{ github.token }}

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out trusted controller source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact bounded repair atomically
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse "origin/$TARGET_BRANCH")" = "$EXPECTED_HEAD"
          test "$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid,isDraft,state --jq 'select(.isDraft == true and .state == "OPEN") | .headRefOid')" = "$EXPECTED_HEAD"

          git checkout --detach "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse "HEAD:$TARGET_PATH")" = "$EXPECTED_TARGET_BLOB"
          test "$(git rev-parse "HEAD:$TARGET_CONTROLLER_PATH")" = "$EXPECTED_CONTROLLER_BLOB"

          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path(os.environ['TARGET_PATH'])
          text = path.read_text()

          old_name = "      - name: Run genuinely concurrent readiness freeze before ledger authority hardening\n"
          new_name = "      - name: Run genuinely concurrent readiness freeze test before ledger authority hardening\n"
          if text.count(old_name) != 1:
              raise SystemExit(f'expected one stale step name, found {text.count(old_name)}')
          if new_name in text:
              raise SystemExit('repaired step name already present before repair')
          text = text.replace(old_name, new_name, 1)

          old_cleanup = """      - name: Prove rollback left no compact schema or fixtures
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          count=\"$(psql \"$QA_SUPABASE_DB_URL\" --no-psqlrc --tuples-only --no-align --set ON_ERROR_STOP=1 <<'SQL'
"""
          new_cleanup = """      - name: Prove rollback left no compact schema or fixtures
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mpgf-compacts-qa
          count=\"$(psql \"$QA_SUPABASE_DB_URL\" --no-psqlrc --tuples-only --no-align --set ON_ERROR_STOP=1 <<'SQL'
"""
          if text.count(old_cleanup) != 1:
              raise SystemExit(f'expected one cleanup prelude, found {text.count(old_cleanup)}')
          text = text.replace(old_cleanup, new_cleanup, 1)

          old_baseline = """          prerequisite_count_before=\"$(sed -n 's/^eligibility_prerequisite_relations_before=//p' mpgf-compacts-qa/schema-absence-before.txt)\"
          test \"$prerequisite_count\" = \"$prerequisite_count_before\"
"""
          new_baseline = """          if [[ -f mpgf-compacts-qa/schema-absence-before.txt ]]; then
            prerequisite_count_before=\"$(sed -n 's/^eligibility_prerequisite_relations_before=//p' mpgf-compacts-qa/schema-absence-before.txt)\"
            test -n \"$prerequisite_count_before\"
          else
            test ! -e mpgf-compacts-qa/rollback-lifecycle.log
            prerequisite_count_before=\"$prerequisite_count\"
            {
              printf 'relations_before=%s\\n' \"$count\"
              printf 'eligibility_prerequisite_relations_before=%s\\n' \"$prerequisite_count_before\"
            } > mpgf-compacts-qa/schema-absence-before.txt
          fi
          test \"$prerequisite_count\" = \"$prerequisite_count_before\"
"""
          if text.count(old_baseline) != 1:
              raise SystemExit(f'expected one brittle baseline read, found {text.count(old_baseline)}')
          text = text.replace(old_baseline, new_baseline, 1)

          if text.count('genuinely concurrent readiness freeze test') != 1:
              raise SystemExit('source-contract marker absent or duplicated after repair')
          if text.count('mkdir -p mpgf-compacts-qa') < 2:
              raise SystemExit('cleanup directory guard absent after repair')
          if text.count('test ! -e mpgf-compacts-qa/rollback-lifecycle.log') != 1:
              raise SystemExit('early-failure cleanup guard absent after repair')
          path.write_text(text)
          PY

          rm "$TARGET_CONTROLLER_PATH"
          git diff --check
          printf '%s\n' "$TARGET_PATH" "$TARGET_CONTROLLER_PATH" | sort > /tmp/expected-working.txt
          git diff --name-only | sort > /tmp/actual-working.txt
          diff -u /tmp/expected-working.txt /tmp/actual-working.txt
          test "$(git diff --name-only "$EXPECTED_PARENT" | sort)" = "$TARGET_PATH"

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$TARGET_PATH" "$TARGET_CONTROLLER_PATH"
          git commit -m "ci: repair adjacent Compact rollback gate"
          new_head="$(git rev-parse HEAD)"
          test "$new_head" != "$EXPECTED_HEAD"
          test "$(git ls-remote --heads origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')" = "$EXPECTED_HEAD"
          git push --force-with-lease="refs/heads/$TARGET_BRANCH:$EXPECTED_HEAD" origin "HEAD:refs/heads/$TARGET_BRANCH"

          test "$(gh api "repos/$GITHUB_REPOSITORY/branches/$TARGET_BRANCH" --jq '.commit.sha')" = "$new_head"
          test "$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid,isDraft,state,changedFiles --jq 'select(.isDraft == true and .state == "OPEN" and .changedFiles == 16) | .headRefOid')" = "$new_head"
          test "$(gh api "repos/$GITHUB_REPOSITORY/contents/$TARGET_PATH?ref=$new_head" --jq '.content' | base64 --decode | grep -Fc -- 'genuinely concurrent readiness freeze test')" -eq 1
          if gh api "repos/$GITHUB_REPOSITORY/contents/$TARGET_CONTROLLER_PATH?ref=$new_head" >/dev/null 2>&1; then
            echo 'One-use target controller remains in candidate tree.' >&2
            exit 1
          fi

          new_tree="$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$new_head" --jq '.tree.sha')"
          printf 'new_head=%s\nnew_tree=%s\n' "$new_head" "$new_tree" | tee /tmp/result.txt

      - name: Record bounded repair
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -s /tmp/result.txt ]]; then
            new_head="$(sed -n 's/^new_head=//p' /tmp/result.txt)"
            new_tree="$(sed -n 's/^new_tree=//p' /tmp/result.txt)"
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Bounded adjacent-Compact QA repair applied. The source-contract step name now includes **test**, early-failure cleanup creates and reconstructs its evidence baseline safely, and the one-use target controller was removed. Candidate: \`$new_head\`; tree: \`$new_tree\`; durable differential: exactly 16 files. No merge, deployment, persistent migration, provider operation, activation, electorate opening, or money movement was performed."
          fi
