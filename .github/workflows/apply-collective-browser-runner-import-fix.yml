name: Apply collective browser-runner import fix

on:
  pull_request:
    branches:
      - feature/collective-identity-threshold-commitments-20260726
    paths:
      - ".github/scripts/patch-collective-browser-runner.py"
      - ".github/workflows/apply-collective-browser-runner-import-fix.yml"

permissions:
  contents: write

concurrency:
  group: apply-collective-browser-runner-import-fix-20260727
  cancel-in-progress: false

jobs:
  patch:
    if: >-
      github.event.pull_request.head.repo.full_name == 'ghuser29384/Website2' &&
      github.head_ref == 'qa/collective-commitments-adversarial-browser-20260727'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_REPOSITORY: ghuser29384/Website2
      EXPECTED_BRANCH: qa/collective-commitments-adversarial-browser-20260727
      EXPECTED_STAGING_PARENT: 8c33e78caaf03296cd3a253b7011d3f07d9188d6
      ARTIFACT_DIR: ${{ github.workspace }}/collective-browser-runner-patch-artifacts

    steps:
      - name: Validate exact execution boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY"
          test "$GITHUB_HEAD_REF" = "$EXPECTED_BRANCH"

      - name: Check out exact pull-request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Apply deterministic patch and remove staging files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ARTIFACT_DIR"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_STAGING_PARENT"
          cp .github/scripts/patch-collective-browser-runner.py "$RUNNER_TEMP/patch-collective-browser-runner.py"
          python3 "$RUNNER_TEMP/patch-collective-browser-runner.py"
          node --check .github/scripts/collective-commitments-adversarial-browser-qa.mjs
          if grep -Fq 'src/lib/collective-commitments/crypto.ts' .github/scripts/collective-commitments-adversarial-browser-qa.mjs; then
            echo "Application crypto import remains in standalone runner." >&2
            exit 1
          fi
          grep -Fq 'browser-qa.log' .github/workflows/collective-commitments-adversarial-browser-qa.yml
          grep -Fq 'await writeAudit();' .github/scripts/collective-commitments-adversarial-browser-qa.mjs

          git config user.name "ghuser29384"
          git config user.email "262476329+ghuser29384@users.noreply.github.com"
          git rm \
            .github/scripts/patch-collective-browser-runner.py \
            .github/workflows/apply-collective-browser-runner-import-fix.yml
          git add \
            .github/scripts/collective-commitments-adversarial-browser-qa.mjs \
            .github/workflows/collective-commitments-adversarial-browser-qa.yml
          git diff --cached --check
          git commit -m "Make collective browser QA runner standalone and auditable"
          git push origin HEAD:"$EXPECTED_BRANCH"
          printf 'qa_head=%s\nstandalone_crypto=PASS\nbrowser_log_capture=PASS\ninitial_audit=PASS\nproduction_changed=NO\n' \
            "$(git rev-parse HEAD)" > "$ARTIFACT_DIR/result.txt"

      - name: Upload patch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collective-browser-runner-import-fix-${{ github.run_id }}
          path: collective-browser-runner-patch-artifacts
          if-no-files-found: warn
          retention-days: 14
