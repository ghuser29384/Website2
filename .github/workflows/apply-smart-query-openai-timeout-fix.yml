# One-time repair workflow; remove this file after the verified implementation commit lands.
name: Apply smart-query OpenAI timeout fix

on:
  push:
    branches:
      - fix/smart-query-openai-timeout-20260729
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/apply-smart-query-openai-timeout-fix.yml"

permissions:
  contents: write

concurrency:
  group: apply-smart-query-openai-timeout-fix
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/smart-query-openai-timeout-20260729
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply bounded configurable timeout
        run: |
          python <<'PY'
          from pathlib import Path

          llm_path = Path("src/lib/smart-query-llm.ts")
          llm = llm_path.read_text()

          marker = "export async function resolveSmartQueryWithLlm(\n"
          helper = '''const DEFAULT_SMART_QUERY_LLM_TIMEOUT_MS = 12_000;
          const MIN_SMART_QUERY_LLM_TIMEOUT_MS = 3_000;
          const MAX_SMART_QUERY_LLM_TIMEOUT_MS = 20_000;

          export function smartQueryLlmTimeoutMs(
            rawValue = process.env.OPENAI_QUERY_TIMEOUT_MS,
          ) {
            if (!rawValue) return DEFAULT_SMART_QUERY_LLM_TIMEOUT_MS;
            const parsed = Number(rawValue);
            if (!Number.isFinite(parsed)) return DEFAULT_SMART_QUERY_LLM_TIMEOUT_MS;
            return Math.min(
              MAX_SMART_QUERY_LLM_TIMEOUT_MS,
              Math.max(MIN_SMART_QUERY_LLM_TIMEOUT_MS, Math.round(parsed)),
            );
          }

          '''.replace("          ", "")

          if "smartQueryLlmTimeoutMs" not in llm:
            if marker not in llm:
              raise SystemExit("LLM resolver marker not found")
            llm = llm.replace(marker, helper + marker, 1)

          old_timeout = "const timeout = setTimeout(() => controller.abort(), 3_000);"
          new_timeout = "const timeout = setTimeout(() => controller.abort(), smartQueryLlmTimeoutMs());"
          if old_timeout in llm:
            llm = llm.replace(old_timeout, new_timeout, 1)
          elif new_timeout not in llm:
            raise SystemExit("Existing LLM timeout statement not found")
          llm_path.write_text(llm)

          test_path = Path("src/lib/smart-query-llm-timeout.test.ts")
          test_path.write_text('''import assert from "node:assert/strict";
          import test from "node:test";

          import { smartQueryLlmTimeoutMs } from "./smart-query-llm";

          test("uses a twelve-second default for ambiguity-only LLM interpretation", () => {
            assert.equal(smartQueryLlmTimeoutMs(undefined), 12_000);
            assert.equal(smartQueryLlmTimeoutMs("not-a-number"), 12_000);
          });

          test("accepts bounded timeout overrides", () => {
            assert.equal(smartQueryLlmTimeoutMs("9000"), 9_000);
            assert.equal(smartQueryLlmTimeoutMs("100"), 3_000);
            assert.equal(smartQueryLlmTimeoutMs("99999"), 20_000);
          });
          '''.replace("          ", ""))

          env_path = Path(".env.example")
          env_text = env_path.read_text()
          env_marker = "OPENAI_QUERY_MODEL=gpt-5-nano\n"
          env_line = "OPENAI_QUERY_TIMEOUT_MS=12000\n"
          if env_line not in env_text:
            if env_marker not in env_text:
              raise SystemExit("OpenAI query model environment marker not found")
            env_text = env_text.replace(env_marker, env_marker + env_line, 1)
          env_path.write_text(env_text)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Verify timeout repair
        run: |
          set -o pipefail
          npx eslint \
            src/lib/smart-query-llm.ts \
            src/lib/smart-query-llm-timeout.test.ts
          node --import tsx --test \
            src/lib/smart-query-llm-timeout.test.ts \
            src/lib/smart-query.test.ts \
            src/lib/smart-query-llm-gate.test.ts \
            src/lib/smart-evidence-ranking.test.ts
          npm run build

      - name: Commit verified repair
        run: |
          git config user.name "moral-trade-query-bot"
          git config user.email "moral-trade-query-bot@users.noreply.github.com"
          git add \
            .env.example \
            src/lib/smart-query-llm.ts \
            src/lib/smart-query-llm-timeout.test.ts
          git commit -m "Allow production query interpretation to finish"
          git push origin HEAD:fix/smart-query-openai-timeout-20260729
