name: Export exact PR 718 source package 20260816

on:
  push:
    branches:
      - ops/export-pr718-source-20260816

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out controller
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out exact synchronized PR 718 candidate
        uses: actions/checkout@v4
        with:
          ref: e7359a046d67391a37c92505f4c50694d5b24e1e
          fetch-depth: 0
          path: candidate

      - name: Guard exact source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "e7359a046d67391a37c92505f4c50694d5b24e1e"
          test "$(git -C candidate rev-parse HEAD^2)" = "4587e8c418621440835940d6924f32c02ba3f2d1"

      - name: Remove Git metadata from export
        shell: bash
        run: rm -rf candidate/.git

      - name: Upload complete source package
        uses: actions/upload-artifact@v4
        with:
          name: pr718-complete-source-${{ github.sha }}
          retention-days: 3
          if-no-files-found: error
          include-hidden-files: true
          path: candidate
