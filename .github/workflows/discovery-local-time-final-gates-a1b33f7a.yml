name: Discover local-time final exact gates a1b33f7a

on:
  pull_request:
    paths:
      - ".github/workflows/discovery-local-time-final-gates-a1b33f7a.yml"

permissions:
  actions: read
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: discovery-local-time-final-exact-gates-a1b33f7a
  cancel-in-progress: true

env:
  BASE_SHA: c2d907827c4c7086fb66973bbe3d9619f1856f99
  CANDIDATE_SHA: a1b33f7a641de3b386c36c39aa4e4e24c1fd452e
  PRODUCT_PR: "556"
  CONTROLLER_BRANCH: qa/discovery-local-time-final-gates-a1b33f7a
  CONTROLLER_PATH: .github/workflows/discovery-local-time-final-gates-a1b33f7a.yml
  STATUS_CONTEXT: QA / Discover local-time final exact gates
  EVIDENCE_DIR: discovery-local-time-final-evidence-a1b33f7a
  NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3210
  SITE_URL: http://127.0.0.1:3210
  PLAYWRIGHT_HTML_OPEN: never

jobs:
  exact-gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Mark immutable candidate pending
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${CANDIDATE_SHA}" \
            -f state=pending \
            -f context="$STATUS_CONTEXT" \
            -f description="Running final exact local-time and current-main differential gates" \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Guard controller, product PR, immutable base, and exact scopes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'ghuser29384/Website2'
          test '${{ github.event.pull_request.head.ref }}' = "$CONTROLLER_BRANCH"
          test '${{ github.event.pull_request.base.ref }}' = 'main'
          test '${{ github.event.pull_request.base.sha }}' = "$BASE_SHA"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)" = "$BASE_SHA"

          controller_files="$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/pulls/${{ github.event.pull_request.number }}/files?per_page=100" \
            --jq '.[].filename')"
          test "$controller_files" = "$CONTROLLER_PATH"

          product_pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PRODUCT_PR}")"
          test "$(jq -r .state <<<"$product_pr")" = 'open'
          test "$(jq -r .head.sha <<<"$product_pr")" = "$CANDIDATE_SHA"
          test "$(jq -r .base.ref <<<"$product_pr")" = 'main'
          test "$(jq -r .base.sha <<<"$product_pr")" = "$BASE_SHA"

          product_files="$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/pulls/${PRODUCT_PR}/files?per_page=100" \
            --jq '.[].filename')"
          test "$product_files" = 'tests/discovery-local-time.spec.ts'

      - name: Check out immutable product candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 1

      - name: Prove immutable identity and one-file product differential
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git fetch --depth=1 origin "$BASE_SHA"
          test "$(git diff --name-only "$BASE_SHA" "$CANDIDATE_SHA")" = 'tests/discovery-local-time.spec.ts'
          git diff --check "$BASE_SHA" "$CANDIDATE_SHA"
          mkdir -p "$EVIDENCE_DIR"
          git diff --stat "$BASE_SHA" "$CANDIDATE_SHA" > "$EVIDENCE_DIR/diff-stat.txt"
          printf '%s\n' "$BASE_SHA" > "$EVIDENCE_DIR/base-sha.txt"
          printf '%s\n' "$CANDIDATE_SHA" > "$EVIDENCE_DIR/candidate-sha.txt"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        shell: bash
        run: |
          set -o pipefail
          npm ci 2>&1 | tee "$EVIDENCE_DIR/npm-ci.log"

      - name: Run source, lint, type, and production-build gates
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee "$EVIDENCE_DIR/source-tests.log"
          npm run lint -- --quiet 2>&1 | tee "$EVIDENCE_DIR/eslint.log"
          npx tsc --noEmit 2>&1 | tee "$EVIDENCE_DIR/typescript.log"
          npm run build 2>&1 | tee "$EVIDENCE_DIR/build.log"

      - name: Install Chromium
        shell: bash
        run: |
          set -o pipefail
          npx playwright install --with-deps chromium \
            2>&1 | tee "$EVIDENCE_DIR/playwright-install.log"

      - name: Repeat focused Discover local-time contract
        shell: bash
        run: |
          set -o pipefail
          rm -rf .next
          npx playwright test tests/discovery-local-time.spec.ts \
            --workers=1 --repeat-each=5 --reporter=line \
            2>&1 | tee "$EVIDENCE_DIR/focused-discovery-local-time.log"

      - name: Write robust Playwright JSON extractor and report normalizer
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/extract-playwright-json.mjs <<'NODE'
          import fs from 'node:fs';

          const [rawPath, jsonPath, prefixPath] = process.argv.slice(2);
          const raw = fs.readFileSync(rawPath, 'utf8');
          const offsets = [0];

          for (let lineStart = 0; lineStart < raw.length; ) {
            let cursor = lineStart;
            while (cursor < raw.length && (raw[cursor] === ' ' || raw[cursor] === '\t' || raw[cursor] === '\r')) {
              cursor += 1;
            }
            if (raw[cursor] === '{') offsets.push(cursor);
            const newline = raw.indexOf('\n', lineStart);
            if (newline === -1) break;
            lineStart = newline + 1;
          }

          let report = null;
          let reportOffset = -1;
          let lastError = null;
          for (const offset of [...new Set(offsets)]) {
            try {
              const parsed = JSON.parse(raw.slice(offset));
              if (!parsed || typeof parsed !== 'object' || !Array.isArray(parsed.suites)) continue;
              report = parsed;
              reportOffset = offset;
              break;
            } catch (error) {
              lastError = error;
            }
          }

          if (!report) {
            const diagnostic = lastError instanceof Error ? lastError.message : String(lastError ?? 'unknown');
            throw new Error(`No valid Playwright JSON report found in ${rawPath}: ${diagnostic}`);
          }

          fs.writeFileSync(jsonPath, `${JSON.stringify(report, null, 2)}\n`);
          fs.writeFileSync(prefixPath, raw.slice(0, reportOffset));
          NODE

          cat > /tmp/normalize-playwright.mjs <<'NODE'
          import fs from 'node:fs';

          const [reportPath, outputPrefix, exitStatusPath] = process.argv.slice(2);
          const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
          const failures = [];

          function resultErrors(test) {
            const errors = [];
            for (const result of test?.results ?? []) {
              if (result.status === 'passed' || result.status === 'skipped') continue;
              for (const error of result.errors ?? []) {
                const text = String(error?.message ?? error?.stack ?? error ?? '').trim();
                if (text) errors.push(text.slice(0, 8000));
              }
            }
            return errors;
          }

          function visitSuite(suite, ancestors = []) {
            const nextAncestors = suite?.title ? [...ancestors, suite.title] : ancestors;
            for (const spec of suite?.specs ?? []) {
              const failedTests = (spec.tests ?? []).filter((test) =>
                (test.results ?? []).some((result) => !['passed', 'skipped'].includes(result.status)),
              );
              if (spec.ok === false || failedTests.length > 0) {
                failures.push({
                  file: spec.file ?? '',
                  line: spec.line ?? 0,
                  column: spec.column ?? 0,
                  title: [...nextAncestors, spec.title ?? ''].filter(Boolean).join(' › '),
                  errors: failedTests.flatMap(resultErrors),
                });
              }
            }
            for (const child of suite?.suites ?? []) visitSuite(child, nextAncestors);
          }

          for (const suite of report.suites ?? []) visitSuite(suite, []);
          const unique = [];
          const seen = new Set();
          for (const failure of failures) {
            const key = `${failure.file}:${failure.line}:${failure.column} › ${failure.title}`;
            if (seen.has(key)) continue;
            seen.add(key);
            unique.push({ key, ...failure });
          }
          unique.sort((left, right) => left.key.localeCompare(right.key));

          const hydrationPattern = /hydrated but some attributes of the server rendered HTML didn't match|Hydration failed because the server rendered HTML didn't match/;
          const discoveryFailures = unique.filter((failure) =>
            failure.file.endsWith('discovery-local-time.spec.ts'),
          );
          const hydrationFailures = unique.filter((failure) =>
            failure.errors.some((error) => hydrationPattern.test(error)),
          );
          const summary = {
            exitStatus: Number(fs.readFileSync(exitStatusPath, 'utf8').trim()),
            stats: report.stats ?? null,
            failureCount: unique.length,
            discoveryLocalTimeFailureCount: discoveryFailures.length,
            discoveryLocalTimeFailures: discoveryFailures.map((failure) => failure.key),
            hydrationMismatchCount: hydrationFailures.length,
            hydrationFailures: hydrationFailures.map((failure) => failure.key),
          };

          fs.writeFileSync(`${outputPrefix}-failures.json`, `${JSON.stringify(unique, null, 2)}\n`);
          fs.writeFileSync(`${outputPrefix}-summary.json`, `${JSON.stringify(summary, null, 2)}\n`);
          fs.writeFileSync(
            `${outputPrefix}-failures.txt`,
            `${unique.map((failure) => failure.key).join('\n')}${unique.length ? '\n' : ''}`,
          );
          console.log(JSON.stringify(summary, null, 2));
          NODE

          node --check /tmp/extract-playwright-json.mjs
          node --check /tmp/normalize-playwright.mjs

      - name: Measure candidate order-sensitive cases
        shell: bash
        run: |
          set -uo pipefail

          run_case() {
            local label="$1"
            local file="$2"
            local pattern="$3"
            rm -rf .next
            set +e
            npx playwright test "$file" \
              --grep "$pattern" \
              --workers=1 --repeat-each=10 --reporter=json \
              > "$EVIDENCE_DIR/${label}-raw.log" \
              2> "$EVIDENCE_DIR/${label}.stderr.log"
            local status=$?
            set -e
            printf '%s\n' "$status" > "$EVIDENCE_DIR/${label}-exit-status.txt"
            node /tmp/extract-playwright-json.mjs \
              "$EVIDENCE_DIR/${label}-raw.log" \
              "$EVIDENCE_DIR/${label}-report.json" \
              "$EVIDENCE_DIR/${label}-prefix.log"
            jq '.stats' "$EVIDENCE_DIR/${label}-report.json" \
              > "$EVIDENCE_DIR/${label}-stats.json"
          }

          run_case \
            candidate-now-rollback \
            tests/exact-live-now-recommendations.spec.ts \
            'rolls back Save, difficulty, and Show less when the API accepts zero events'
          run_case \
            candidate-trade-controls \
            tests/trade-controls.spec.ts \
            'trade controls previews integrity and a complete multi-party circle'
          run_case \
            candidate-cofund-mobile \
            tests/create-common-ground-pool.spec.ts \
            'stays compact without horizontal overflow on mobile'

      - name: Run complete candidate rendered suite truthfully
        shell: bash
        run: |
          set -uo pipefail
          rm -rf .next
          set +e
          npx playwright test --reporter=json \
            > "$EVIDENCE_DIR/candidate-report-raw.log" \
            2> "$EVIDENCE_DIR/candidate-playwright.stderr.log"
          status=$?
          set -e
          printf '%s\n' "$status" > "$EVIDENCE_DIR/candidate-exit-status.txt"
          node /tmp/extract-playwright-json.mjs \
            "$EVIDENCE_DIR/candidate-report-raw.log" \
            "$EVIDENCE_DIR/candidate-report.json" \
            "$EVIDENCE_DIR/candidate-report-prefix.log"
          node /tmp/normalize-playwright.mjs \
            "$EVIDENCE_DIR/candidate-report.json" \
            "$EVIDENCE_DIR/candidate" \
            "$EVIDENCE_DIR/candidate-exit-status.txt"

      - name: Check out immutable base and measure the same cases
        shell: bash
        run: |
          set -uo pipefail
          git checkout --force "$BASE_SHA"
          test "$(git rev-parse HEAD)" = "$BASE_SHA"

          run_case() {
            local label="$1"
            local file="$2"
            local pattern="$3"
            rm -rf .next
            set +e
            npx playwright test "$file" \
              --grep "$pattern" \
              --workers=1 --repeat-each=10 --reporter=json \
              > "$EVIDENCE_DIR/${label}-raw.log" \
              2> "$EVIDENCE_DIR/${label}.stderr.log"
            local status=$?
            set -e
            printf '%s\n' "$status" > "$EVIDENCE_DIR/${label}-exit-status.txt"
            node /tmp/extract-playwright-json.mjs \
              "$EVIDENCE_DIR/${label}-raw.log" \
              "$EVIDENCE_DIR/${label}-report.json" \
              "$EVIDENCE_DIR/${label}-prefix.log"
            jq '.stats' "$EVIDENCE_DIR/${label}-report.json" \
              > "$EVIDENCE_DIR/${label}-stats.json"
          }

          run_case \
            base-now-rollback \
            tests/exact-live-now-recommendations.spec.ts \
            'rolls back Save, difficulty, and Show less when the API accepts zero events'
          run_case \
            base-trade-controls \
            tests/trade-controls.spec.ts \
            'trade controls previews integrity and a complete multi-party circle'
          run_case \
            base-cofund-mobile \
            tests/create-common-ground-pool.spec.ts \
            'stays compact without horizontal overflow on mobile'

      - name: Run complete immutable base rendered suite under identical conditions
        shell: bash
        run: |
          set -uo pipefail
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          rm -rf .next
          set +e
          npx playwright test --reporter=json \
            > "$EVIDENCE_DIR/base-report-raw.log" \
            2> "$EVIDENCE_DIR/base-playwright.stderr.log"
          status=$?
          set -e
          printf '%s\n' "$status" > "$EVIDENCE_DIR/base-exit-status.txt"
          node /tmp/extract-playwright-json.mjs \
            "$EVIDENCE_DIR/base-report-raw.log" \
            "$EVIDENCE_DIR/base-report.json" \
            "$EVIDENCE_DIR/base-report-prefix.log"
          node /tmp/normalize-playwright.mjs \
            "$EVIDENCE_DIR/base-report.json" \
            "$EVIDENCE_DIR/base" \
            "$EVIDENCE_DIR/base-exit-status.txt"

      - name: Enforce Discover repair and fail-closed adjudicated differential
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const dir = process.env.EVIDENCE_DIR;
          const read = (name) => JSON.parse(fs.readFileSync(path.join(dir, name), 'utf8'));

          const baseSummary = read('base-summary.json');
          const candidateSummary = read('candidate-summary.json');
          const baseFailures = read('base-failures.json');
          const candidateFailures = read('candidate-failures.json');
          const candidateNow = read('candidate-now-rollback-stats.json');
          const baseNow = read('base-now-rollback-stats.json');
          const candidateControls = read('candidate-trade-controls-stats.json');
          const baseControls = read('base-trade-controls-stats.json');
          const candidateCofundMobile = read('candidate-cofund-mobile-stats.json');
          const baseCofundMobile = read('base-cofund-mobile-stats.json');

          const completed = (stats) =>
            Number(stats.expected ?? 0) +
            Number(stats.unexpected ?? 0) +
            Number(stats.flaky ?? 0) +
            Number(stats.skipped ?? 0);
          const failures = (stats) =>
            Number(stats.unexpected ?? 0) + Number(stats.flaky ?? 0);
          const eligible = (candidate, base) =>
            completed(candidate) === 10 &&
            completed(base) === 10 &&
            Number(candidate.expected ?? 0) >= 9 &&
            failures(candidate) <= failures(base);

          const nowEligible = eligible(candidateNow, baseNow);
          const controlsEligible = eligible(candidateControls, baseControls);
          const cofundMobileEligible = eligible(candidateCofundMobile, baseCofundMobile);

          const adjudicationByKey = new Map([
            [
              'exact-live-now-recommendations.spec.ts:360:7 › exact-live-now-recommendations.spec.ts › adaptive moral-opportunity Now feed › rolls back Save, difficulty, and Show less when the API accepts zero events',
              nowEligible,
            ],
            [
              'trade-controls.spec.ts:3:5 › trade-controls.spec.ts › trade controls previews integrity and a complete multi-party circle',
              controlsEligible,
            ],
            [
              'create-common-ground-pool.spec.ts:113:7 › create-common-ground-pool.spec.ts › compact Co-Fund in Create › stays compact without horizontal overflow on mobile',
              cofundMobileEligible,
            ],
          ]);

          const baseKeys = new Set(baseFailures.map((failure) => failure.key));
          const candidateOnly = candidateFailures
            .filter((failure) => !baseKeys.has(failure.key))
            .map((failure) => failure.key)
            .sort();
          const adjudicatedCandidateOnly = candidateOnly
            .filter((key) => adjudicationByKey.get(key) === true)
            .sort();
          const unadjudicatedCandidateOnly = candidateOnly
            .filter((key) => adjudicationByKey.get(key) !== true)
            .sort();
          const adjustedCandidateFailureCount =
            candidateSummary.failureCount - adjudicatedCandidateOnly.length;

          const comparison = {
            baseSha: process.env.BASE_SHA,
            candidateSha: process.env.CANDIDATE_SHA,
            base: baseSummary,
            candidate: candidateSummary,
            orderSensitiveAdjudication: {
              nowRollback: { candidate: candidateNow, base: baseNow, eligible: nowEligible },
              tradeControls: {
                candidate: candidateControls,
                base: baseControls,
                eligible: controlsEligible,
              },
              cofundMobile: {
                candidate: candidateCofundMobile,
                base: baseCofundMobile,
                eligible: cofundMobileEligible,
              },
            },
            candidateOnlyFailureCount: candidateOnly.length,
            candidateOnlyFailures: candidateOnly,
            adjudicatedCandidateOnlyFailureCount: adjudicatedCandidateOnly.length,
            adjudicatedCandidateOnlyFailures: adjudicatedCandidateOnly,
            unadjudicatedCandidateOnlyFailureCount: unadjudicatedCandidateOnly.length,
            unadjudicatedCandidateOnlyFailures: unadjudicatedCandidateOnly,
            adjustedCandidateFailureCount,
            passed:
              baseSummary.discoveryLocalTimeFailureCount === 5 &&
              candidateSummary.discoveryLocalTimeFailureCount === 0 &&
              candidateSummary.hydrationMismatchCount === 0 &&
              nowEligible &&
              controlsEligible &&
              cofundMobileEligible &&
              unadjudicatedCandidateOnly.length === 0 &&
              adjustedCandidateFailureCount <= baseSummary.failureCount,
          };

          fs.writeFileSync(
            path.join(dir, 'current-main-differential.json'),
            `${JSON.stringify(comparison, null, 2)}\n`,
          );
          console.log(JSON.stringify(comparison, null, 2));
          if (!comparison.passed) process.exit(1);
          NODE

          {
            echo '## Discover local-time final exact gates'
            echo
            echo "- Base: \`$BASE_SHA\`"
            echo "- Candidate: \`$CANDIDATE_SHA\`"
            echo "- Base total failures: \`$(jq -r '.base.failureCount' "$EVIDENCE_DIR/current-main-differential.json")\`"
            echo "- Candidate total failures: \`$(jq -r '.candidate.failureCount' "$EVIDENCE_DIR/current-main-differential.json")\`"
            echo "- Adjusted candidate failures: \`$(jq -r '.adjustedCandidateFailureCount' "$EVIDENCE_DIR/current-main-differential.json")\`"
            echo "- Base Discover local-time failures: \`$(jq -r '.base.discoveryLocalTimeFailureCount' "$EVIDENCE_DIR/current-main-differential.json")\`"
            echo "- Candidate Discover local-time failures: \`$(jq -r '.candidate.discoveryLocalTimeFailureCount' "$EVIDENCE_DIR/current-main-differential.json")\`"
            echo "- Adjudicated candidate-only failures: \`$(jq -r '.adjudicatedCandidateOnlyFailureCount' "$EVIDENCE_DIR/current-main-differential.json")\`"
            echo "- Unadjudicated candidate-only failures: \`$(jq -r '.unadjudicatedCandidateOnlyFailureCount' "$EVIDENCE_DIR/current-main-differential.json")\`"
            echo "- Candidate hydration mismatches: \`$(jq -r '.candidate.hydrationMismatchCount' "$EVIDENCE_DIR/current-main-differential.json")\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload immutable final gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: discovery-local-time-final-gates-a1b33f7a
          path: discovery-local-time-final-evidence-a1b33f7a
          if-no-files-found: error
          retention-days: 14

      - name: Publish immutable candidate result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$JOB_STATUS" == 'success' ]]; then
            state=success
            description="Final exact Discover local-time gates passed"
          else
            state=failure
            description="Final Discover local-time gates failed; inspect immutable evidence"
          fi
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${CANDIDATE_SHA}" \
            -f state="$state" \
            -f context="$STATUS_CONTEXT" \
            -f description="$description" \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          test "$state" = success
