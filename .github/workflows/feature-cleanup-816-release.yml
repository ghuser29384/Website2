name: Dispatch exact feature cleanup 816 release
on:
  push:
    branches: [ops/feature-cleanup-816-release-20260923]
    paths: [.github/workflows/feature-cleanup-816-release.yml]
permissions:
  contents: read
  actions: write
jobs:
  dispatch:
    if: github.repository == 'ghuser29384/Website2' && github.ref == 'refs/heads/ops/feature-cleanup-816-release-20260923'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Guard exact merged source and dispatch unchanged release pipeline once
        uses: actions/github-script@v7
        env:
          EXPECTED_SHA: 06211a77e8e37d67cb28785f45a5f7d0fa3ba761
          EXPECTED_TREE: b63a5c0b2102e10d49b0d0cf23f3b7b3ae12963d
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const expected = process.env.EXPECTED_SHA;
            const { data: branch } = await github.rest.repos.getBranch({ owner, repo, branch: 'main' });
            if (branch.commit.sha !== expected) throw new Error('Main moved; release stopped.');
            const { data: commit } = await github.rest.git.getCommit({ owner, repo, commit_sha: expected });
            if (commit.tree.sha !== process.env.EXPECTED_TREE) throw new Error('Validated tree mismatch.');
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: 816 });
            if (!pr.merged || pr.merge_commit_sha !== expected) throw new Error('Expected PR merge not confirmed.');
            await github.rest.actions.createWorkflowDispatch({
              owner, repo, workflow_id: 'vercel-release.yml', ref: 'main',
              inputs: { target: 'production', ref: 'main', expected_sha: expected, synthetic_auth_fixture_url: '' }
            });
            core.info(`Dispatched the unchanged gated production release for ${expected}.`);
