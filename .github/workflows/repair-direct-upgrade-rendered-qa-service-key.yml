name: Export repaired Direct Donation Upgrade rendered QA workflow

on:
  push:
    branches:
      - feature/direct-verified-donation-upgrade-20260731
    paths:
      - .github/workflows/repair-direct-upgrade-rendered-qa-service-key.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/repair-direct-upgrade-rendered-qa-service-key.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: export-repaired-direct-upgrade-rendered-qa-workflow
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/direct-verified-donation-upgrade-20260731
          fetch-depth: 0

      - name: Produce and validate the permanent workflow replacement
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/direct-donation-upgrade-rendered-qa.yml')
          flow_lines = workflow.read_text().splitlines(keepends=True)

          service_indexes = [
              index for index, line in enumerate(flow_lines)
              if line.strip().startswith('SUPABASE_SERVICE_ROLE_KEY:')
          ]
          if len(service_indexes) != 1:
              raise SystemExit(f'Expected one service-role environment entry, found {len(service_indexes)}.')
          index = service_indexes[0]
          indentation = flow_lines[index][:-len(flow_lines[index].lstrip())]
          flow_lines[index] = (
              f'{indentation}DIRECT_DONATION_UPGRADE_RENDERED_QA_NO_SERVICE_ROLE: "true"\n'
          )

          assertion_indexes = [
              index for index, line in enumerate(flow_lines)
              if line.strip() == 'test -n "${SUPABASE_SERVICE_ROLE_KEY:-}"'
          ]
          if len(assertion_indexes) != 1:
              raise SystemExit(f'Expected one service-role assertion, found {len(assertion_indexes)}.')
          del flow_lines[assertion_indexes[0]]

          output = []
          skipping = False
          starts = 0
          ends = 0
          for line in flow_lines:
              stripped = line.strip()
              if stripped.startswith('status="$(curl --silent --show-error'):
                  skipping = True
                  starts += 1
                  continue
              if skipping:
                  if stripped.startswith("printf 'Verified the configured service role"):
                      skipping = False
                      ends += 1
                  continue
              output.append(line)
          if skipping or starts != 1 or ends != 1:
              raise SystemExit(
                  f'Could not remove exact service-role probe: starts={starts}, ends={ends}, open={skipping}.'
              )

          workflow.write_text(''.join(output))
          PY

          grep -Fq 'DIRECT_DONATION_UPGRADE_RENDERED_QA_NO_SERVICE_ROLE: "true"' \
            .github/workflows/direct-donation-upgrade-rendered-qa.yml
          ! grep -Fq 'secrets.SUPABASE_SERVICE_ROLE_KEY' \
            .github/workflows/direct-donation-upgrade-rendered-qa.yml
          ! grep -Fq 'SUPABASE_SERVICE_ROLE_KEY:-' \
            .github/workflows/direct-donation-upgrade-rendered-qa.yml
          ! grep -Fq 'Verified the configured service role' \
            .github/workflows/direct-donation-upgrade-rendered-qa.yml

          npm ci
          node --import tsx --test \
            src/lib/direct-donation-upgrade.test.ts \
            src/lib/direct-donation-upgrade-source-contract.test.ts
          npx eslint \
            src/app/trades/new/conditional-donation.tsx \
            src/lib/direct-donation-upgrade-source-contract.test.ts
          sha256sum .github/workflows/direct-donation-upgrade-rendered-qa.yml \
            | tee direct-upgrade-rendered-qa-workflow.sha256

      - name: Upload exact permanent workflow replacement
        uses: actions/upload-artifact@v4
        with:
          name: direct-upgrade-rendered-qa-workflow-replacement-${{ github.run_id }}
          path: |
            .github/workflows/direct-donation-upgrade-rendered-qa.yml
            direct-upgrade-rendered-qa-workflow.sha256
          if-no-files-found: error
          retention-days: 3
