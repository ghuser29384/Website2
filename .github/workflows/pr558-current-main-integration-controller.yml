name: PR 558 current-main integration controller

on:
  push:
    branches:
      - ops/integrate-pr558-current-main-20260808

permissions:
  contents: write
  actions: write

concurrency:
  group: pr558-current-main-integration-controller
  cancel-in-progress: false

jobs:
  integrate-and-dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPECTED_MAIN_SHA: 3f158e8ba38a197327e95d1dec660ee8582a9a12
      EXPECTED_SOURCE_SHA: ef7894d41f5793dd19c0f478be4cb855171699a3
      INTEGRATION_BRANCH: integration/mpgf-dac-lifecycle-current-main-20260808
      SOURCE_BRANCH: fix/mpgf-dac-product-lifecycle-20260807
      LIFECYCLE_WORKFLOW_ID: "329247968"

    steps:
      - name: Check out the exact current-main integration branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.INTEGRATION_BRANCH }}
          fetch-depth: 0

      - name: Merge the exact proven DAC stack into current main
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN_SHA"
          git fetch --no-tags origin \
            "$SOURCE_BRANCH:refs/remotes/origin/$SOURCE_BRANCH"
          test "$(git rev-parse "refs/remotes/origin/$SOURCE_BRANCH")" = "$EXPECTED_SOURCE_SHA"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if ! git merge --no-ff "$EXPECTED_SOURCE_SHA" \
            -m "merge: integrate exact DAC lifecycle stack with current main"; then
            echo "Merge conflicts:" >&2
            git diff --name-only --diff-filter=U >&2
            exit 1
          fi

          git merge-base --is-ancestor "$EXPECTED_MAIN_SHA" HEAD
          git merge-base --is-ancestor "$EXPECTED_SOURCE_SHA" HEAD
          git diff --check "$EXPECTED_MAIN_SHA" HEAD
          test -z "$(git status --porcelain)"
          {
            printf 'main=%s\n' "$EXPECTED_MAIN_SHA"
            printf 'source=%s\n' "$EXPECTED_SOURCE_SHA"
            printf 'integrated=%s\n' "$(git rev-parse HEAD)"
            printf 'tree=%s\n' "$(git rev-parse HEAD^{tree})"
          } | tee pr558-current-main-integration.txt

      - name: Push the exact integrated tree
        shell: bash
        run: |
          set -euo pipefail
          git push origin "HEAD:$INTEGRATION_BRANCH"

      - name: Dispatch the permanent DAC lifecycle gate on the integrated ref
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/actions/workflows/$LIFECYCLE_WORKFLOW_ID/dispatches" \
            -f ref="$INTEGRATION_BRANCH"
