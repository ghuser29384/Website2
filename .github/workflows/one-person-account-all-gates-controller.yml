name: One-person account all-gates controller

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: one-person-account-all-gates-controller
  cancel-in-progress: false

env:
  FEATURE_BRANCH: feature/one-person-one-account-20260731
  EXPECTED_FEATURE_SHA: 068e9ba938f91c8a7630901f0d66d634fca0295a
  CONTROLLER_PATH: .github/workflows/one-person-account-all-gates-controller.yml

jobs:
  all-gates:
    if: >-
      github.repository == 'ghuser29384/Website2' &&
      github.event.issue.pull_request != null &&
      github.event.issue.number == 379 &&
      github.event.comment.body == '/run-one-person-all-gates-20260801'
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          ref: 068e9ba938f91c8a7630901f0d66d634fca0295a
          fetch-depth: 0

      - name: Guard exact candidate and feature boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'ghuser29384/Website2'
          test "$(git rev-parse HEAD)" = "$EXPECTED_FEATURE_SHA"
          test "$(git ls-remote origin "refs/heads/$FEATURE_BRANCH" | awk '{print $1}')" = "$EXPECTED_FEATURE_SHA"
          test ! -e .github/one-person-bootstrap
          test ! -e .github/workflows/materialize-one-person-account.yml
          git diff --check origin/main...HEAD
          git diff --name-only origin/main...HEAD | sort -u | tee one-person-changed-paths.txt
          test "$(wc -l < one-person-changed-paths.txt)" -eq 24

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies with transient retry
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            if npm ci; then exit 0; fi
            if (( attempt == 4 )); then exit 1; fi
            sleep $((attempt * 20))
          done

      - name: Run focused identity tests
        shell: bash
        run: |
          set +e
          set -o pipefail
          npm run test:one-person-account 2>&1 | tee one-person-focused-tests.txt
          status=${PIPESTATUS[0]}
          echo "$status" > focused.status
          exit 0

      - name: Run complete repository tests
        shell: bash
        run: |
          set +e
          set -o pipefail
          npm test 2>&1 | tee one-person-repository-tests.txt
          status=${PIPESTATUS[0]}
          echo "$status" > tests.status
          exit 0

      - name: Run TypeScript absolute gate
        shell: bash
        run: |
          set +e
          set -o pipefail
          npx tsc --noEmit 2>&1 | tee one-person-typescript.txt
          status=${PIPESTATUS[0]}
          echo "$status" > typescript.status
          exit 0

      - name: Run ESLint absolute gate
        shell: bash
        run: |
          set +e
          set -o pipefail
          npm run lint -- --quiet 2>&1 | tee one-person-eslint.txt
          status=${PIPESTATUS[0]}
          echo "$status" > eslint.status
          exit 0

      - name: Build production application
        env:
          NEXT_PUBLIC_SITE_URL: https://www.moraltrade.org
          SITE_URL: https://www.moraltrade.org
          VERCEL: '1'
          VERCEL_ENV: preview
        shell: bash
        run: |
          set +e
          set -o pipefail
          npm run build 2>&1 | tee one-person-build.txt
          status=${PIPESTATUS[0]}
          echo "$status" > build.status
          exit 0

      - name: Summarize gates
        id: summary
        shell: bash
        run: |
          set -euo pipefail
          printf 'focused=%s\ntests=%s\ntypescript=%s\neslint=%s\nbuild=%s\n' \
            "$(cat focused.status)" \
            "$(cat tests.status)" \
            "$(cat typescript.status)" \
            "$(cat eslint.status)" \
            "$(cat build.status)" | tee one-person-gate-status.txt
          if grep -Eq '=[1-9][0-9]*$' one-person-gate-status.txt; then
            echo 'all_passed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'all_passed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Upload exact-head gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: one-person-account-all-gates-${{ github.run_id }}
          path: |
            one-person-changed-paths.txt
            one-person-focused-tests.txt
            one-person-repository-tests.txt
            one-person-typescript.txt
            one-person-eslint.txt
            one-person-build.txt
            one-person-gate-status.txt
            *.status
            .next/build-manifest.json
            .next/routes-manifest.json
          if-no-files-found: warn

      - name: Comment result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          statuses="$(tr '\n' ' ' < one-person-gate-status.txt 2>/dev/null || echo 'status unavailable')"
          if [[ '${{ steps.summary.outputs.all_passed }}' == 'true' ]]; then
            gh pr comment 379 --repo "$GITHUB_REPOSITORY" --body "Exact-head all-gates diagnostics passed for candidate \`$EXPECTED_FEATURE_SHA\` in run $GITHUB_RUN_ID. $statuses PR remains draft pending current-main integration and isolated-QA gates."
          else
            gh pr comment 379 --repo "$GITHUB_REPOSITORY" --body "Exact-head all-gates diagnostics found failures for candidate \`$EXPECTED_FEATURE_SHA\` in run $GITHUB_RUN_ID. $statuses Inspect the evidence artifact and repair the same draft branch."
          fi

      - name: Enforce final gate result
        if: steps.summary.outputs.all_passed != 'true'
        run: exit 1

      - name: Remove temporary controller
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/$CONTROLLER_PATH?ref=main" --jq .sha 2>/dev/null || true)"
          if [[ -n "$sha" ]]; then
            jq -n --arg message 'Remove temporary one-person all-gates controller' --arg sha "$sha" --arg branch main '{message:$message,sha:$sha,branch:$branch}' \
              | gh api --method DELETE "repos/$GITHUB_REPOSITORY/contents/$CONTROLLER_PATH" --input - >/dev/null
          fi
