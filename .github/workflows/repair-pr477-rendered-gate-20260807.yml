name: Repair PR 477 focused rendered release gate

on:
  push:
    branches:
      - ops/dispatch-pr477-vercel-preview-20260806
    paths:
      - .github/workflows/repair-pr477-rendered-gate-20260807.yml

permissions:
  actions: write
  contents: write

concurrency:
  group: repair-pr477-rendered-gate-20260807
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TARGET_BRANCH: feature/co-act-co-fund-create-v3-20260803
      EXPECTED_OLD_SHA: 7bada6f910ecbc13c9964aaa07b5966040e99d1e
      BASE_SHA: 87b093751a4c2de909555abdb7f181061bb36390
      RELEASE_REF: release/vercel-preview

    steps:
      - name: Check out the exact PR candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Guard control branch, candidate, and exact base
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'ghuser29384/Website2'
          test '${{ github.ref_name }}' = 'ops/dispatch-pr477-vercel-preview-20260806'
          test '${{ github.actor }}' != 'github-actions[bot]'
          test "$(git rev-parse HEAD)" = "$EXPECTED_OLD_SHA"
          target_sha="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          main_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$target_sha" = "$EXPECTED_OLD_SHA"
          test "$main_sha" = "$BASE_SHA"
          git merge-base --is-ancestor "$BASE_SHA" HEAD

      - name: Patch the focused differential adjudicator and its contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workflow_path = Path('.github/workflows/vercel-release.yml')
          test_path = Path('scripts/vercel-release-workflow.test.mjs')
          workflow = workflow_path.read_text()
          tests = test_path.read_text()

          def replace_once(source: str, old: str, new: str, label: str) -> str:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              return source.replace(old, new, 1)

          workflow = replace_once(
              workflow,
              '              grep = "^(?:" + "|".join(re.escape(title) for title in titles) + ")$" if titles else ""',
              '              grep = "(?:" + "|".join(re.escape(title) for title in titles) + ")" if titles else ""',
              'unanchored Playwright title filter',
          )

          candidate_boundary = '''          if [[ -d playwright-report ]]; then
            mv playwright-report "$evidence_dir/candidate-focused-playwright-report"
          fi

          (
            set -euo pipefail
            cd "$base_dir"
'''
          repaired_boundary = '''          if [[ -d playwright-report ]]; then
            mv playwright-report "$evidence_dir/candidate-focused-playwright-report"
          fi

          if [[ "$candidate_focused_status" -eq 0 ]]; then
            cat > "$evidence_dir/focused-summary.md" <<EOF
          ### Focused rendered-failure adjudication

          - Candidate focused failures: 0
          - Exact-base focused rerun: not needed
          - Persistent candidate-only regressions: 0
          - Result: every candidate-only full-suite failure cleared across five focused repetitions
          EOF
            : > "$evidence_dir/regressions.txt"
            cat "$evidence_dir/focused-summary.md" >> "$GITHUB_STEP_SUMMARY"
            echo 'Every candidate-only full-suite failure cleared under repeated focused rerun.'
            exit 0
          fi

          base_focused_files=()
          : > "$evidence_dir/base-unavailable-files.txt"
          for focused_file in "${focused_files[@]}"; do
            if [[ -f "$base_dir/$focused_file" ]]; then
              base_focused_files+=("$focused_file")
            else
              printf '%s\\n' "$focused_file" >> "$evidence_dir/base-unavailable-files.txt"
            fi
          done

          if [[ "${#base_focused_files[@]}" -eq 0 ]]; then
            printf '  0 passed\\n' > "$evidence_dir/base-focused.log"
            printf '0\\n' > "$evidence_dir/base-focused.status"
          else
            (
              set -euo pipefail
              cd "$base_dir"
'''
          workflow = replace_once(
              workflow,
              candidate_boundary,
              repaired_boundary,
              'candidate-pass short circuit and base file partition',
          )

          base_command = '''            npx playwright test "${focused_files[@]}" \\
              --grep "$focused_grep" \\
              --repeat-each=5 \\
              --reporter=line 2>&1 | tee "$evidence_dir/base-focused.log"
'''
          repaired_base_command = '''              npx playwright test "${base_focused_files[@]}" \\
                --grep "$focused_grep" \\
                --repeat-each=5 \\
                --reporter=line 2>&1 | tee "$evidence_dir/base-focused.log"
'''
          workflow = replace_once(
              workflow,
              base_command,
              repaired_base_command,
              'base focused file subset',
          )

          base_close = '''            if [[ -d playwright-report ]]; then
              mv playwright-report "$evidence_dir/base-focused-playwright-report"
            fi
          )
          base_focused_status="$(cat "$evidence_dir/base-focused.status")"
'''
          repaired_base_close = '''              if [[ -d playwright-report ]]; then
                mv playwright-report "$evidence_dir/base-focused-playwright-report"
              fi
            )
          fi
          base_focused_status="$(cat "$evidence_dir/base-focused.status")"
'''
          workflow = replace_once(
              workflow,
              base_close,
              repaired_base_close,
              'base focused conditional close',
          )

          focused_summary = '''            --base-status "$base_focused_status" \\
            --output "$evidence_dir"
          cat "$evidence_dir/focused-summary.md" >> "$GITHUB_STEP_SUMMARY"
'''
          repaired_summary = '''            --base-status "$base_focused_status" \\
            --output "$evidence_dir"
          if [[ -s "$evidence_dir/base-unavailable-files.txt" ]]; then
            unavailable_count="$(grep -c . "$evidence_dir/base-unavailable-files.txt")"
            printf '%s\\n' "- Candidate-only files absent from exact base: $unavailable_count" \\
              >> "$evidence_dir/focused-summary.md"
          fi
          cat "$evidence_dir/focused-summary.md" >> "$GITHUB_STEP_SUMMARY"
'''
          workflow = replace_once(
              workflow,
              focused_summary,
              repaired_summary,
              'focused unavailable-file evidence',
          )

          test_marker = '''test("the release requires a repository secret rather than embedding credentials", async () => {
'''
          regression_test = r'''test("focused preview adjudication reruns full Playwright titles and never asks the base to run absent files", async () => {
  const source = await workflow();
  const candidatePassIndex = source.indexOf(
    'if [[ "$candidate_focused_status" -eq 0 ]]; then',
  );
  const basePartitionIndex = source.indexOf("base_focused_files=()");
  const baseRunIndex = source.indexOf(
    'npx playwright test "${base_focused_files[@]}"',
  );

  assert.match(
    source,
    /grep = "\(\?:" \+ "\|"\.join\(re\.escape\(title\) for title in titles\) \+ "\)" if titles else ""/,
  );
  assert.doesNotMatch(source, /grep = "\^\(\?:"/);
  assert.notEqual(candidatePassIndex, -1);
  assert.notEqual(basePartitionIndex, -1);
  assert.notEqual(baseRunIndex, -1);
  assert.ok(candidatePassIndex < basePartitionIndex);
  assert.ok(basePartitionIndex < baseRunIndex);
  assert.match(source, /if \[\[ -f "\$base_dir\/\$focused_file" \]\]; then/);
  assert.match(source, /base_focused_files\+\=\("\$focused_file"\)/);
  assert.match(
    source,
    /if \[\[ "\$\{#base_focused_files\[@\]\}" -eq 0 \]\]; then/,
  );
  assert.match(
    source,
    /printf '  0 passed\\n' > "\$evidence_dir\/base-focused\.log"/,
  );
  assert.match(source, /base-unavailable-files\.txt/);
});

'''
          if test_marker not in tests:
              raise SystemExit('regression-test insertion marker missing')
          if 'focused preview adjudication reruns full Playwright titles' in tests:
              raise SystemExit('regression test already present')
          tests = tests.replace(test_marker, regression_test + test_marker, 1)

          workflow_path.write_text(workflow)
          test_path.write_text(tests)
          PY

          git diff --check
          node --test scripts/vercel-release-workflow.test.mjs
          git diff -- .github/workflows/vercel-release.yml scripts/vercel-release-workflow.test.mjs

      - name: Commit the repair and pin the immutable preview ref
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ghuser29384'
          git config user.email '262476329+ghuser29384@users.noreply.github.com'
          git add .github/workflows/vercel-release.yml scripts/vercel-release-workflow.test.mjs
          git commit -m 'Fix focused rendered-gate adjudication'
          new_sha="$(git rev-parse HEAD)"
          test "${#new_sha}" -eq 40
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"

          old_release_sha="$(git ls-remote origin "refs/heads/$RELEASE_REF" | awk '{print $1}')"
          test -n "$old_release_sha"
          git push \
            --force-with-lease="refs/heads/$RELEASE_REF:$old_release_sha" \
            origin "$new_sha:refs/heads/$RELEASE_REF"

          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')" = "$new_sha"
          test "$(git ls-remote origin "refs/heads/$RELEASE_REF" | awk '{print $1}')" = "$new_sha"
          echo "candidate_sha=$new_sha" >> "$GITHUB_OUTPUT"

      - name: Dispatch the exact repaired preview
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          test "${#CANDIDATE_SHA}" -eq 40
          for attempt in 1 2 3 4 5; do
            release_sha="$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/$RELEASE_REF" --jq '.object.sha')"
            test "$release_sha" = "$CANDIDATE_SHA"
            if gh workflow run vercel-release.yml \
              --repo "$GITHUB_REPOSITORY" \
              --ref "$RELEASE_REF" \
              -f target=preview \
              -f ref="$RELEASE_REF" \
              -f expected_sha="$CANDIDATE_SHA" \
              -f rendered_base_sha="$BASE_SHA"; then
              exit 0
            fi
            if [[ "$attempt" -eq 5 ]]; then
              echo 'Exact repaired preview dispatch failed after five attempts.' >&2
              exit 1
            fi
            sleep $((attempt * 10))
          done

      - name: Record repair and dispatch evidence
        shell: bash
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.candidate_sha }}
        run: |
          {
            echo '### PR 477 rendered-gate repair'
            echo
            echo "- Previous candidate: \`$EXPECTED_OLD_SHA\`"
            echo "- Repaired candidate: \`$CANDIDATE_SHA\`"
            echo "- Exact base: \`$BASE_SHA\`"
            echo '- Repair: full-title focused grep, candidate-pass short circuit, and base-file existence partition'
            echo '- Targeted release-workflow contract: passed before commit'
            echo '- Immutable preview ref: pinned and dispatched'
          } >> "$GITHUB_STEP_SUMMARY"
