name: Repair PR 477 focused rendered release gate

on:
  push:
    branches:
      - ops/dispatch-pr477-vercel-preview-20260806
    paths:
      - .github/workflows/repair-pr477-rendered-gate-20260807.yml

permissions:
  actions: write
  contents: write

concurrency:
  group: repair-pr477-rendered-gate-20260807
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CONTROLLER_REVISION: '2'
      TARGET_BRANCH: feature/co-act-co-fund-create-v3-20260803
      EXPECTED_OLD_SHA: 7bada6f910ecbc13c9964aaa07b5966040e99d1e
      BASE_SHA: 87b093751a4c2de909555abdb7f181061bb36390
      RELEASE_REF: release/vercel-preview

    steps:
      - name: Check out the exact repair controller
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: controller
          fetch-depth: 1

      - name: Check out the exact PR candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          path: target
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Guard control branch, candidate, and exact base
        shell: bash
        working-directory: target
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'ghuser29384/Website2'
          test '${{ github.ref_name }}' = 'ops/dispatch-pr477-vercel-preview-20260806'
          test '${{ github.actor }}' != 'github-actions[bot]'
          test "$(git rev-parse HEAD)" = "$EXPECTED_OLD_SHA"
          target_sha="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          main_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$target_sha" = "$EXPECTED_OLD_SHA"
          test "$main_sha" = "$BASE_SHA"
          git merge-base --is-ancestor "$BASE_SHA" HEAD

      - name: Patch and verify the focused differential adjudicator
        shell: bash
        run: |
          set -euo pipefail
          python3 controller/.github/scripts/repair-pr477-rendered-gate-20260807.py "$GITHUB_WORKSPACE/target"
          cd target
          git diff --check
          node --test scripts/vercel-release-workflow.test.mjs
          git diff -- .github/workflows/vercel-release.yml scripts/vercel-release-workflow.test.mjs

      - name: Commit the repair and pin the immutable preview ref
        id: candidate
        shell: bash
        working-directory: target
        run: |
          set -euo pipefail
          git config user.name 'ghuser29384'
          git config user.email '262476329+ghuser29384@users.noreply.github.com'
          git add .github/workflows/vercel-release.yml scripts/vercel-release-workflow.test.mjs
          git commit -m 'Fix focused rendered-gate adjudication'
          new_sha="$(git rev-parse HEAD)"
          test "${#new_sha}" -eq 40
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"

          old_release_sha="$(git ls-remote origin "refs/heads/$RELEASE_REF" | awk '{print $1}')"
          test -n "$old_release_sha"
          git push \
            --force-with-lease="refs/heads/$RELEASE_REF:$old_release_sha" \
            origin "$new_sha:refs/heads/$RELEASE_REF"

          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')" = "$new_sha"
          test "$(git ls-remote origin "refs/heads/$RELEASE_REF" | awk '{print $1}')" = "$new_sha"
          echo "candidate_sha=$new_sha" >> "$GITHUB_OUTPUT"

      - name: Dispatch the exact repaired preview
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          test "${#CANDIDATE_SHA}" -eq 40
          for attempt in 1 2 3 4 5; do
            release_sha="$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/$RELEASE_REF" --jq '.object.sha')"
            test "$release_sha" = "$CANDIDATE_SHA"
            if gh workflow run vercel-release.yml \
              --repo "$GITHUB_REPOSITORY" \
              --ref "$RELEASE_REF" \
              -f target=preview \
              -f ref="$RELEASE_REF" \
              -f expected_sha="$CANDIDATE_SHA" \
              -f rendered_base_sha="$BASE_SHA"; then
              exit 0
            fi
            if [[ "$attempt" -eq 5 ]]; then
              echo 'Exact repaired preview dispatch failed after five attempts.' >&2
              exit 1
            fi
            sleep $((attempt * 10))
          done

      - name: Record repair and dispatch evidence
        shell: bash
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.candidate_sha }}
        run: |
          {
            echo '### PR 477 rendered-gate repair'
            echo
            echo "- Previous candidate: \`$EXPECTED_OLD_SHA\`"
            echo "- Repaired candidate: \`$CANDIDATE_SHA\`"
            echo "- Exact base: \`$BASE_SHA\`"
            echo '- Repair: full-title focused grep, candidate-pass short circuit, and base-file existence partition'
            echo '- Targeted release-workflow contract: passed before commit'
            echo '- Immutable preview ref: pinned and dispatched'
          } >> "$GITHUB_STEP_SUMMARY"
