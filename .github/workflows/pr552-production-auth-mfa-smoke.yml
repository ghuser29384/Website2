name: PR 552 exact production Account Security MFA smoke

on:
  push:
    branches:
      - ops/pr552-production-auth-mfa-smoke-20260810
    paths:
      - .github/scripts/pr552-run-production-auth-mfa-smoke.sh
      - .github/workflows/pr552-production-auth-mfa-smoke.yml
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: pr552-exact-production-account-security-mfa
  cancel-in-progress: false

env:
  CONTROLLER_BRANCH: ops/pr552-production-auth-mfa-smoke-20260810
  CONTROLLER_BASE_SHA: bb3b0e4608b7282aecc9d1fe11b5cb310c409347
  CANDIDATE_SHA: bb3b0e4608b7282aecc9d1fe11b5cb310c409347
  DEPLOYMENT_ID: dpl_6VxCNaMke5Mpe7qZjPhD4tdkuyrx
  DEPLOYMENT_HOST: moraltrade-site-n12ni5u3j-ellen-s.vercel.app
  PRODUCTION_ORIGIN: https://www.moraltrade.org
  EXPECTED_RELEASE_REASON: pr552-account-security-production-after-serial-differential
  EXPECTED_SUPABASE_REF: jnpoxvalyjtdghnperyu
  NEXT_PUBLIC_SUPABASE_URL: https://jnpoxvalyjtdghnperyu.supabase.co
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_Pcmy5vefKiaEhuYTOSU75Q_NklsZOrT
  VERCEL_ORG_ID: team_ySu6sF3Uho1E1GnJtCQPVEuJ
  VERCEL_PROJECT_ID: prj_Em3j7Uj7RatX2R1ZYhla3XSHRde7
  PATCHER_COMMIT: 108b0ba4575c3248969490d3bf06028b5732d11c
  PATCHER_BLOB: ab1bb352a565f5bb5311dbe3e30bf16733badc07
  HARNESS_COMMIT: 928a81e30c6eae8f35e56513ac6f0f1a428fd825
  HARNESS_BLOB: 394366c478fc01d93d6c7f245aba496986f56762
  PATCHER_PATH: .qa-runtime/pr552-patch-production-auth-harness.py
  RUNNER_PATH: .github/scripts/pr552-run-production-auth-mfa-smoke.sh
  HARNESS_PATH: .qa-runtime/pr552-production-auth-mfa.mjs
  PRIVATE_STATE_PATH: .qa-private/pr552-production-auth-mfa.json
  OUTPUT_DIR: pr552-production-auth-mfa-smoke
  STATUS_CONTEXT: QA / PR552 production Account Security MFA

jobs:
  production-auth-mfa:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PROD_SUPABASE_DB_URL: ${{ secrets.PROD_SUPABASE_DB_URL }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Check out the one-use controller
        uses: actions/checkout@v4
        with:
          ref: ops/pr552-production-auth-mfa-smoke-20260810
          fetch-depth: 0

      - name: Guard immutable production target and controller-only scope
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'ghuser29384/Website2'
          test "$(git branch --show-current)" = "$CONTROLLER_BRANCH"
          git merge-base --is-ancestor "$CANDIDATE_SHA" origin/main
          test "$CONTROLLER_BASE_SHA" = "$CANDIDATE_SHA"
          git merge-base --is-ancestor "$CONTROLLER_BASE_SHA" "$GITHUB_SHA"
          git cat-file -e "${PATCHER_COMMIT}^{commit}"
          git cat-file -e "${HARNESS_COMMIT}^{commit}"
          git diff --check "$CONTROLLER_BASE_SHA" "$GITHUB_SHA" -- "$RUNNER_PATH"
          git diff --name-only "$CONTROLLER_BASE_SHA" "$GITHUB_SHA" | sort > controller-files.txt
          cat > expected-controller-files.txt <<'FILES'
          .github/scripts/pr552-run-production-auth-mfa-smoke.sh
          .github/workflows/pr552-production-auth-mfa-smoke.yml
          FILES
          diff -u expected-controller-files.txt controller-files.txt
          bash -n "$RUNNER_PATH"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies, Chromium, PostgreSQL client, jq, and curl
        shell: bash
        run: |
          set -euo pipefail
          test -n "${PROD_SUPABASE_DB_URL:-}"
          test -n "${VERCEL_TOKEN:-}"
          npm ci
          npx playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq postgresql-client jq curl

      - name: Materialize and specialize the proven authenticated MFA harness
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$PATCHER_PATH")" "$(dirname "$PRIVATE_STATE_PATH")"
          git show "${PATCHER_COMMIT}:.github/scripts/pr552-patch-authenticated-preview-harness-v12.py" > "$PATCHER_PATH"
          git show "${HARNESS_COMMIT}:.github/scripts/pr552-authenticated-preview-mfa-db.mjs" > "$HARNESS_PATH"
          test "$(git hash-object "$PATCHER_PATH")" = "$PATCHER_BLOB"
          test "$(git hash-object "$HARNESS_PATH")" = "$HARNESS_BLOB"
          python3 -m py_compile "$PATCHER_PATH"
          python3 "$PATCHER_PATH" "$HARNESS_PATH"

          HARNESS_PATH="$HARNESS_PATH" python3 <<'PY'
          import os
          from pathlib import Path

          path = Path(os.environ["HARNESS_PATH"])
          source = path.read_text(encoding="utf-8")
          replacements = {
              'const VERCEL_BYPASS_SECRET = process.env.VERCEL_AUTOMATION_BYPASS_SECRET;\n': '',
              'if (MODE === "test") required("VERCEL_AUTOMATION_BYPASS_SECRET", VERCEL_BYPASS_SECRET);\n': '',
              '''    extraHTTPHeaders: {
                "x-vercel-protection-bypass": VERCEL_BYPASS_SECRET,
                "x-vercel-set-bypass-cookie": "true",
              },
          ''': '',
          }
          for old, new in replacements.items():
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"Production specialization expected one match, found {count}: {old!r}")
              source = source.replace(old, new, 1)

          diagnostics_start = "function diagnostics(page, label) {"
          diagnostics_end = "\n\nasync function assertDashboardSurface"
          if source.count(diagnostics_start) != 1 or source.count(diagnostics_end) != 1:
              raise SystemExit("Expected one exact browser-diagnostics span.")
          start = source.index(diagnostics_start)
          end = source.index(diagnostics_end, start)
          replacement = r'''const OPTIONAL_OFFERS_LIST_404_CONSOLE =
            "Failed to load resource: the server responded with a status of 404 ()";

          function isOptionalOffersList404(status, rawUrl) {
            if (status !== 404) return false;
            const url = new URL(rawUrl);
            return (
              url.origin === previewUrl.origin &&
              url.pathname === "/discover" &&
              url.searchParams.size === 2 &&
              url.searchParams.get("domain") === "offers" &&
              url.searchParams.get("view") === "list"
            );
          }

          function diagnostics(page, label) {
            const record = {
              label,
              consoleErrors: [],
              pageErrors: [],
              requestFailures: [],
              httpErrors: [],
              expectedOptionalOffersList404s: [],
              expectedOptionalOffersList404ConsoleErrors: [],
            };
            page.on("console", (message) => {
              if (message.type() === "error") record.consoleErrors.push(message.text());
            });
            page.on("pageerror", (error) => record.pageErrors.push(error.message));
            page.on("requestfailed", (request) => {
              const url = new URL(request.url());
              if (url.origin !== previewUrl.origin) return;
              const errorText = request.failure()?.errorText ?? "unknown";
              const isExpectedPrefetchAbort =
                errorText.includes("ERR_ABORTED") &&
                (url.searchParams.has("_rsc") || request.headers()["next-router-prefetch"] === "1");
              const isExpectedServerActionNavigationAbort =
                errorText.includes("ERR_ABORTED") &&
                request.method() === "POST" &&
                request.resourceType() === "fetch" &&
                url.pathname === "/dashboard";
              if (!isExpectedPrefetchAbort && !isExpectedServerActionNavigationAbort) {
                record.requestFailures.push({
                  method: request.method(),
                  resourceType: request.resourceType(),
                  url: request.url(),
                  errorText,
                });
              }
            });
            page.on("response", (response) => {
              const url = new URL(response.url());
              if (url.origin !== previewUrl.origin || response.status() < 400) return;
              if (url.pathname === "/favicon.ico") return;
              if (isOptionalOffersList404(response.status(), response.url())) {
                record.expectedOptionalOffersList404s.push({
                  status: response.status(),
                  url: response.url(),
                });
                return;
              }
              record.httpErrors.push({ status: response.status(), url: response.url() });
            });
            return record;
          }

          function assertDiagnostics(record) {
            const matchingOptionalConsoleErrors = record.consoleErrors.filter(
              (value) => value === OPTIONAL_OFFERS_LIST_404_CONSOLE,
            );
            const unexpectedConsoleErrors = record.consoleErrors.filter(
              (value) => value !== OPTIONAL_OFFERS_LIST_404_CONSOLE,
            );
            const optionalResponseCount = record.expectedOptionalOffersList404s.length;
            const optionalConsoleCount = matchingOptionalConsoleErrors.length;
            record.consoleErrors = unexpectedConsoleErrors;
            record.expectedOptionalOffersList404ConsoleErrors = matchingOptionalConsoleErrors;

            const failures = [
              ...record.consoleErrors.map((value) => `console: ${value}`),
              ...record.pageErrors.map((value) => `page: ${value}`),
              ...record.requestFailures.map(
                (value) => `request: ${value.method} ${value.url} ${value.errorText}`,
              ),
              ...record.httpErrors.map((value) => `http: ${value.status} ${value.url}`),
            ];
            if (optionalResponseCount > 3) {
              failures.push(`optional offers-list 404 count exceeded bound: ${optionalResponseCount}`);
            }
            if (optionalConsoleCount !== optionalResponseCount) {
              failures.push(
                `optional offers-list 404 console/response mismatch: ${optionalConsoleCount}/${optionalResponseCount}`,
              );
            }
            if (failures.length) {
              throw new Error(`${record.label} browser diagnostics failed:\n${failures.join("\n")}`);
            }
          }'''
          source = source[:start] + replacement + source[end:]

          for forbidden in (
              "VERCEL_AUTOMATION_BYPASS_SECRET",
              "VERCEL_BYPASS_SECRET",
              "x-vercel-protection-bypass",
              "x-vercel-set-bypass-cookie",
          ):
              if forbidden in source:
                  raise SystemExit(f"Stale protected-Preview token remains: {forbidden}")
          required = {
              "function isOptionalOffersList404": 1,
              "expectedOptionalOffersList404s": 3,
              "expectedOptionalOffersList404ConsoleErrors": 2,
              "optional offers-list 404 count exceeded bound": 1,
              "optional offers-list 404 console/response mismatch": 1,
          }
          for token, expected in required.items():
              actual = source.count(token)
              if actual != expected:
                  raise SystemExit(f"Production diagnostic token {token!r}: expected {expected}, found {actual}")
          path.write_text(source, encoding="utf-8")
          PY

          node --check "$HARNESS_PATH"
          grep -Fq "$CANDIDATE_SHA" "$HARNESS_PATH"
          grep -Fq "$DEPLOYMENT_ID" "$HARNESS_PATH"
          ! grep -Fq '0f2164e893b3eee94d2f4033d013f2ebf6430cea' "$HARNESS_PATH"
          ! grep -Fq 'dpl_E4kcbFVK7QpYvdygM8m9sc841DpC' "$HARNESS_PATH"
          sha256sum "$PATCHER_PATH" "$HARNESS_PATH" > patched-harness.sha256

      - name: Exercise exact live desktop and mobile MFA with guaranteed cleanup
        shell: bash
        run: bash "$RUNNER_PATH"

      - name: Publish exact production status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "$OUTPUT_DIR/verified-summary.json" ]] \
            && jq -e '.temporaryUserAbsent == true and .aliasesVerifiedBeforeAndAfter == true' \
              "$OUTPUT_DIR/verified-summary.json" >/dev/null; then
            state=success
            description='Exact live desktop/mobile MFA passed and all synthetic state was removed'
          else
            state=failure
            description='Exact live Account Security MFA smoke failed; inspect cleanup evidence'
          fi
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${CANDIDATE_SHA}" \
            -f state="$state" \
            -f context="$STATUS_CONTEXT" \
            -f description="$description" \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Summarize exact production result
        if: always()
        shell: bash
        run: |
          {
            echo '## PR 552 exact production Account Security MFA smoke'
            echo
            echo "- Candidate: \`$CANDIDATE_SHA\`"
            echo "- Deployment: \`$DEPLOYMENT_ID\`"
            if [[ -f "$OUTPUT_DIR/verified-summary.json" ]]; then
              echo '- Desktop MFA lifecycle: `AAL1 → enrolled factor → AAL2`'
              echo '- Mobile persisted-factor lifecycle: `AAL1 → AAL2`'
              echo '- Browser diagnostics: `clean; only exact bounded offers-list prefetch 404s classified separately`'
              echo '- Exact factor cleanup: `passed`'
              echo '- Synthetic user, identity, factor, session, token, and profile cleanup: `passed`'
              echo '- Both production aliases before and after: `exact deployment verified`'
            else
              echo '- Result: `failed; inspect artifact`'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Archive immutable production-auth evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr552-production-auth-mfa-smoke-${{ github.run_id }}
          path: |
            controller-files.txt
            expected-controller-files.txt
            patched-harness.sha256
            pr552-production-auth-mfa-smoke/
          if-no-files-found: warn
          retention-days: 30
