name: Diagnose Create adapter focused gate

on:
  push:
    branches:
      - ops/create-adapter-authenticated-qa-20260728
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/diagnose-create-adapter-focused.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          ref: 1a8dca60ea9f510bf8d8c232820d584097fd1f81
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run focused tests with persistent log
        id: focused
        continue-on-error: true
        run: >-
          node --import tsx --test
          src/lib/create-interface/*.test.ts
          src/lib/command-center-handoff.test.ts
          src/live-template-system.test.ts
          src/lib/public-route-smoke.test.ts
          > focused-tests.log 2>&1

      - name: Upload focused-test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: create-adapter-focused-diagnostic-${{ github.run_id }}
          path: focused-tests.log
          if-no-files-found: error
          retention-days: 7

      - name: Print failing tail
        if: always()
        run: tail -n 260 focused-tests.log || true

      - name: Preserve failure result
        if: always()
        env:
          OUTCOME: ${{ steps.focused.outcome }}
        run: test "$OUTCOME" = success
