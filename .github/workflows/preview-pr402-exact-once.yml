name: One-time exact PR 402 canonical preview

on:
  push:
    branches:
      - ops/preview-pr402-20260802
    paths:
      - .github/workflows/preview-pr402-exact-once.yml

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: preview-pr402-exact-once
  cancel-in-progress: false

env:
  CONTROLLER_PATH: .github/workflows/preview-pr402-exact-once.yml
  CONTROLLER_BRANCH: ops/preview-pr402-20260802
  TARGET_BRANCH: fix/discover-pledge-clarity-20260801
  EXPECTED_HEAD: b4f2443b95ce32f9c28ad007d7524c6498252bd6
  VERCEL_ORG_ID: team_ySu6sF3Uho1E1GnJtCQPVEuJ
  VERCEL_PROJECT_ID: prj_Em3j7Uj7RatX2R1ZYhla3XSHRde7
  VERCEL_CLI_VERSION: 50.38.1

jobs:
  preview:
    if: github.repository == 'ghuser29384/Website2' && github.actor == 'ghuser29384'
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Check out exact PR 402 head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Guard exact head and intended current-main diff
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'ghuser29384/Website2'
          test "$(git branch --show-current)" = "$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')" = "$EXPECTED_HEAD"
          git fetch --no-tags origin main
          cat > /tmp/expected-files.txt <<'EOF'
          public/discover/payload/0.txt
          public/discover/payload/1.txt
          public/discover/payload/2.txt
          public/discover/payload/3.txt
          public/discover/payload/4.txt
          public/discover/payload/5.txt
          public/discover/payload/6.txt
          public/discover/payload/manifest.json
          src/discover-pledge-clarity.test.ts
          src/discover/moral-trade-discover.source.html
          tests/discover-pledge-clarity.spec.ts
          EOF
          sort -o /tmp/expected-files.txt /tmp/expected-files.txt
          git diff --name-only origin/main HEAD | sort > /tmp/actual-files.txt
          diff -u /tmp/expected-files.txt /tmp/actual-files.txt
          git diff --check origin/main HEAD

      - name: Remove one-time controller from its operations branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          blob_sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/$CONTROLLER_PATH?ref=$CONTROLLER_BRANCH" --jq .sha)"
          jq -n --arg message 'Remove one-time exact PR 402 preview controller' --arg sha "$blob_sha" --arg branch "$CONTROLLER_BRANCH" '{message:$message,sha:$sha,branch:$branch}' \
            | gh api --method DELETE "repos/$GITHUB_REPOSITORY/contents/$CONTROLLER_PATH" --input - >/dev/null

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Run complete repository quality gates
        shell: bash
        env:
          NEXT_PUBLIC_SITE_URL: https://www.moraltrade.org
          VERCEL: '1'
          VERCEL_ENV: preview
        run: |
          set -o pipefail
          npm test 2>&1 | tee pr402-preview-repository-tests.log
          npm run lint -- --quiet 2>&1 | tee pr402-preview-eslint.log
          npm run build 2>&1 | tee pr402-preview-build.log

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run focused local rendered gates
        shell: bash
        run: |
          set -o pipefail
          npx playwright test \
            tests/discover-pledge-clarity.spec.ts \
            tests/discover-live-search.spec.ts \
            --reporter=line 2>&1 | tee pr402-preview-local-playwright.log

      - name: Link only the canonical Vercel project
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json

      - name: Pull preview environment and build on GitHub Actions
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes "vercel@$VERCEL_CLI_VERSION" pull --yes --environment=preview --token="$VERCEL_TOKEN" --scope=ellen-s
          npx --yes "vercel@$VERCEL_CLI_VERSION" build --token="$VERCEL_TOKEN" --scope=ellen-s

      - name: Deploy the exact prebuilt preview once
        id: deploy
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          deployment_url="$(npx --yes "vercel@$VERCEL_CLI_VERSION" deploy --prebuilt --token="$VERCEL_TOKEN" --scope=ellen-s | tail -n1)"
          deployment_url="${deployment_url//$'\r'/}"
          test -n "$deployment_url"
          [[ "$deployment_url" == https://* ]]
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$deployment_url" > pr402-preview-url.txt

      - name: Wait for preview readiness
        shell: bash
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.deployment_url }}
        run: |
          set -euo pipefail
          status='000'
          for attempt in $(seq 1 40); do
            status="$(curl --silent --show-error --location --output /tmp/pr402-preview-root.html --write-out '%{http_code}' --max-time 20 "$PREVIEW_URL" || true)"
            if [[ "$status" == '200' ]]; then break; fi
            sleep 5
          done
          test "$status" = '200'
          grep -Fq 'Moral Trade' /tmp/pr402-preview-root.html

      - name: Inspect exact desktop and mobile preview behavior
        shell: bash
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.deployment_url }}
        run: |
          set -euo pipefail
          mkdir -p test-results
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import { writeFile } from 'node:fs/promises';

          const base = process.env.PREVIEW_URL;
          const route = '/discover?domain=pools&view=threshold&query=Find+pools&selected=pool-wild-research&selectedType=pool#discover';
          const browser = await chromium.launch();
          const evidence = { base, commit: process.env.EXPECTED_HEAD, checks: [] };

          async function inspect(name, viewport, mobile) {
            const context = await browser.newContext({ viewport });
            await context.addCookies([{ name: 'mt_walkthrough_seen', value: '1', url: base, sameSite: 'Lax' }]);
            const page = await context.newPage();
            const pageErrors = [];
            const consoleErrors = [];
            page.on('pageerror', (error) => pageErrors.push(error.message));
            page.on('console', (message) => {
              if (message.type() === 'error') consoleErrors.push(message.text());
            });
            await page.goto(base + route, { waitUntil: 'networkidle', timeout: 60000 });
            const heading = page.getByRole('heading', { name: 'Preview your conditional pledge' });
            await heading.waitFor({ state: 'visible' });
            if (mobile) {
              await page.locator('.inspector.mobile-sheet').waitFor({ state: 'visible' });
            }
            const slider = page.locator('[data-pledge-range][data-pool-id="pool-wild-research"]:visible').last();
            await slider.waitFor({ state: 'visible' });
            await slider.evaluate((element) => {
              element.value = '35';
              element.dispatchEvent(new Event('input', { bubbles: true }));
            });
            await page.getByText('0.43% of current gap', { exact: true }).first().waitFor({ state: 'visible' });
            await page.getByText('$8,165 remains', { exact: true }).first().waitFor({ state: 'visible' });
            await page.getByText('Moving the slider does not save a pledge or authorize payment.', { exact: true }).waitFor({ state: 'visible' });
            if (await page.getByText(/pivotality/i).count()) throw new Error(`${name}: pivotality copy remains`);
            const overflow = await page.locator('html').evaluate((element) => element.scrollWidth - element.clientWidth);
            if (overflow > 1) throw new Error(`${name}: document overflow ${overflow}`);
            if (mobile) {
              const sheet = page.locator('.inspector.mobile-sheet');
              const box = await sheet.boundingBox();
              if (!box || box.x < -1 || box.x + box.width > viewport.width + 1) throw new Error(`${name}: mobile sheet out of bounds`);
              const sheetOverflow = await sheet.evaluate((element) => element.scrollWidth - element.clientWidth);
              if (sheetOverflow > 1) throw new Error(`${name}: sheet overflow ${sheetOverflow}`);
            }
            if (pageErrors.length) throw new Error(`${name}: page errors: ${pageErrors.join(' | ')}`);
            if (consoleErrors.length) throw new Error(`${name}: console errors: ${consoleErrors.join(' | ')}`);
            await page.screenshot({ path: `test-results/pr402-preview-${name}.png`, fullPage: true });
            evidence.checks.push({ name, viewport, overflow, pageErrors, consoleErrors, ok: true });
            await context.close();
          }

          try {
            await inspect('desktop', { width: 1440, height: 1000 }, false);
            await inspect('mobile-390x844', { width: 390, height: 844 }, true);
          } finally {
            await browser.close();
          }
          await writeFile('pr402-preview-evidence.json', JSON.stringify(evidence, null, 2) + '\n');
          NODE

      - name: Upload exact preview evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr402-exact-preview-${{ github.run_id }}
          path: |
            pr402-preview-url.txt
            pr402-preview-evidence.json
            pr402-preview-repository-tests.log
            pr402-preview-eslint.log
            pr402-preview-build.log
            pr402-preview-local-playwright.log
            test-results/**
            /tmp/actual-files.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Report exact preview result to PR 402
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [[ "${{ job.status }}" == 'success' ]]; then
            preview_url="$(cat pr402-preview-url.txt)"
            gh pr comment 402 --repo "$GITHUB_REPOSITORY" --body "Exact canonical preview gates passed for \`$EXPECTED_HEAD\`. Complete repository tests, ESLint, production build/TypeScript, focused local rendered tests, and remote desktop/mobile preview inspection passed. The preview shows \`$35\`, \`$8,165 remains\`, \`0.43% of current gap\`, the non-authorization caveat, no pivotality copy, no overflow, and no browser errors. Preview: $preview_url Evidence: $run_url"
          else
            gh pr comment 402 --repo "$GITHUB_REPOSITORY" --body "Exact canonical preview gates failed for \`$EXPECTED_HEAD\`. PR #402 remains draft and unmerged. Evidence: $run_url"
          fi

      - name: Enforce verified exact preview
        if: always()
        shell: bash
        run: test "${{ job.status }}" = 'success'
