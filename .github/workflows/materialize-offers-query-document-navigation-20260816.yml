name: Restore release-control test after source materialization

on:
  push:
    branches:
      - fix/offers-query-document-navigation-20260816

permissions:
  contents: write

concurrency:
  group: restore-offers-release-control-test-20260816
  cancel-in-progress: false

env:
  EXPECTED_BASE: 4587e8c418621440835940d6924f32c02ba3f2d1
  TARGET_BRANCH: fix/offers-query-document-navigation-20260816

jobs:
  restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact source branch
        uses: actions/checkout@v4
        with:
          ref: fix/offers-query-document-navigation-20260816
          fetch-depth: 0

      - name: Restore unchanged release-control assertion
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'ghuser29384/Website2'
          test "$(git branch --show-current)" = "$TARGET_BRANCH"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$EXPECTED_BASE"

          if ! grep -Fq 'const evidenceStart = source.indexOf("- name: Upload immutable release evidence")' scripts/vercel-release-workflow.test.mjs; then
            echo 'Release-control test already matches the base contract.'
            exit 0
          fi

          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/vercel-release-workflow.test.mjs")
          source = path.read_text(encoding="utf-8")
          start_marker = '  const evidenceStart = source.indexOf("- name: Upload immutable release evidence");\n'
          end_marker = '  assert.match(evidenceStep, /^\\s+playwright-report\\s*$/m);\n'
          start = source.index(start_marker)
          end = source.index(end_marker, start) + len(end_marker)
          replacement = '  assert.match(source, /path: \\$\\{\\{ env\\.RELEASE_EVIDENCE_DIR \\}\\}/);\n'
          path.write_text(source[:start] + replacement + source[end:], encoding="utf-8")
          PY

          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- scripts/vercel-release-workflow.test.mjs
          test "$(git diff --cached --name-only)" = 'scripts/vercel-release-workflow.test.mjs'
          git diff --cached --check
          git commit -m 'Keep existing release evidence contract unchanged'
          git push origin "HEAD:$TARGET_BRANCH"
