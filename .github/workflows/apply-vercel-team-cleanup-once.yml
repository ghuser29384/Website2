name: Apply one-time team-wide Vercel cost cleanup

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-vercel-team-cleanup-once.yml

permissions:
  contents: write

concurrency:
  group: apply-vercel-team-cleanup-once
  cancel-in-progress: false

env:
  VERCEL_TEAM_ID: team_ySu6sF3Uho1E1GnJtCQPVEuJ
  CONTROLLER_PATH: .github/workflows/apply-vercel-team-cleanup-once.yml

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out exact controller commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Guard exact repository and one-file controller scope
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'ghuser29384/Website2'
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$GITHUB_ACTOR" = 'ghuser29384'
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          changed="$(git diff-tree --no-commit-id --name-only -r HEAD | sed '/^$/d')"
          test "$changed" = "$CONTROLLER_PATH"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Audit and apply the bounded cleanup
        id: apply
        continue-on-error: true
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"

          cat > /tmp/vercel-team-cleanup.mjs <<'NODE'
          import { writeFile } from "node:fs/promises";

          const token = process.env.VERCEL_TOKEN;
          const teamId = process.env.VERCEL_TEAM_ID;
          if (!token || !teamId) throw new Error("Missing Vercel credentials or team ID.");

          const canonicalId = "prj_Em3j7Uj7RatX2R1ZYhla3XSHRde7";
          const legacyWebsite2Id = "prj_uhfNhPo00nQrcbG0dk2zLWo7UmdK";
          const deleteTargets = new Map(
            [
              ["prj_epukr7P1va5yDPlrpmXBP6PLRcPl", ["metaphilosophy-unpause-build-20260802", 1785653815971]],
              ["prj_vIoTsku5WDMDbCxiHYm43jEujL4u", ["metaphilosophy-unpause-bridge-20260802", 1785653583382]],
              ["prj_21hwRpOxoa8X8nXcrGjP4wS8vqMm", ["metaphilosophy-aliases-probe-project-20260802", 1785653742436]],
              ["prj_YvQp1D6vTzY9Edo7fx4MLFPc4gnK", ["metaphilosophy-unpause-public-bridge-20260802", 1785653697287]],
              ["prj_1TAc39Q84xYdoYfRJEv35giPB0mh", ["metaphilosophy-alias-probe-project-20260802", 1785653547100]],
              ["prj_zbLg9NIe2JpTCw2ZHrRcCFjNCrxh", ["metaphilosophy-public-deploy-probe-20260802", 1785653498743]],
              ["prj_a6TRdTVMKbmhMknBFZETsvU6p1NY", ["metaphilosophy-release-candidate-20260802", 1785653062231]],
              ["prj_Rc3pNJKE054hTzuF9v9JVnu0hbSm", ["metaphilosophy-deploy-diagnostic-20260802", 1785652944871]],
              ["prj_3wM40JkFHO7mhOAcxjcO7zAQXIqT", ["hyperliquid-force-analysis", 1785346861748]],
              ["prj_Ahk1J1POS7aiZUpOyebz5SrzSuD6", ["hl-sqd-proxy-test", 1785343261654]],
            ],
          );

          function apiUrl(path, includeTeam = true) {
            const url = new URL(`https://api.vercel.com${path}`);
            if (includeTeam) url.searchParams.set("teamId", teamId);
            return url;
          }

          async function request(path, { method = "GET", body, allow404 = false, includeTeam = true } = {}) {
            const response = await fetch(apiUrl(path, includeTeam), {
              method,
              headers: {
                Authorization: `Bearer ${token}`,
                Accept: "application/json",
                ...(body ? { "Content-Type": "application/json" } : {}),
              },
              ...(body ? { body: JSON.stringify(body) } : {}),
            });
            if (allow404 && response.status === 404) return null;
            const text = await response.text();
            let parsed = null;
            if (text) {
              try {
                parsed = JSON.parse(text);
              } catch {
                parsed = text;
              }
            }
            if (!response.ok) {
              throw new Error(`${method} ${path} failed with ${response.status}: ${JSON.stringify(parsed)}`);
            }
            return parsed;
          }

          function isVercelDomain(domain) {
            const value = String(domain ?? "").toLowerCase();
            return value === "vercel.app" || value.endsWith(".vercel.app");
          }

          function safeLink(link) {
            if (!link || typeof link !== "object") return null;
            return {
              type: link.type ?? null,
              org: link.org ?? null,
              repo: link.repo ?? null,
              repoId: link.repoId ?? null,
              productionBranch: link.productionBranch ?? null,
            };
          }

          function safeResourceConfig(project) {
            const config = project?.resourceConfig ?? {};
            return {
              buildMachineType: config.buildMachineType ?? null,
              elasticConcurrencyEnabled: Object.hasOwn(config, "elasticConcurrencyEnabled")
                ? config.elasticConcurrencyEnabled
                : null,
              buildQueue: config.buildQueue?.configuration ?? null,
            };
          }

          async function listProjects() {
            const response = await request("/v10/projects?limit=100");
            return response?.projects ?? [];
          }

          async function inspectProject(project) {
            const full = await request(`/v9/projects/${encodeURIComponent(project.id)}`);
            const domainResponse = await request(
              `/v9/projects/${encodeURIComponent(project.id)}/domains?limit=100`,
            );
            const deploymentResponse = await request(
              `/v6/deployments?projectId=${encodeURIComponent(project.id)}&limit=100`,
            );
            const domains = (domainResponse?.domains ?? [])
              .map((entry) => (typeof entry === "string" ? entry : entry?.name))
              .filter(Boolean)
              .sort();
            const deployments = deploymentResponse?.deployments ?? [];
            const thirtyDaysAgo = Date.now() - 30 * 24 * 60 * 60 * 1000;
            const recentDeployments = deployments.filter(
              (deployment) => Number(deployment.createdAt ?? deployment.created ?? 0) >= thirtyDaysAgo,
            );
            return {
              id: full.id,
              name: full.name,
              createdAt: full.createdAt ?? null,
              updatedAt: full.updatedAt ?? null,
              live: full.live ?? null,
              framework: full.framework ?? null,
              link: safeLink(full.link),
              domains,
              customDomains: domains.filter((domain) => !isVercelDomain(domain)),
              resourceConfig: safeResourceConfig(full),
              speedInsightsEnabled: Boolean(full.speedInsights?.enabledAt),
              webAnalyticsEnabled: Boolean(full.webAnalytics?.enabledAt),
              latestDeployment: full.latestDeployments?.[0]
                ? {
                    id: full.latestDeployments[0].id ?? full.latestDeployments[0].uid ?? null,
                    readyState: full.latestDeployments[0].readyState ?? full.latestDeployments[0].state ?? null,
                    target: full.latestDeployments[0].target ?? null,
                    createdAt: full.latestDeployments[0].createdAt ?? full.latestDeployments[0].created ?? null,
                  }
                : null,
              deploymentCountLast30Days: recentDeployments.length,
              deploymentStatesLast30Days: recentDeployments.reduce((counts, deployment) => {
                const key = `${deployment.target ?? "preview"}:${deployment.readyState ?? deployment.state ?? "unknown"}`;
                counts[key] = (counts[key] ?? 0) + 1;
                return counts;
              }, {}),
            };
          }

          async function auditAll() {
            const projects = await listProjects();
            const summaries = [];
            for (const project of projects) summaries.push(await inspectProject(project));
            summaries.sort((a, b) => a.name.localeCompare(b.name));
            const team = await request(`/v2/teams/${encodeURIComponent(teamId)}`, { includeTeam: false });
            const memberResponse = await request(
              `/v3/teams/${encodeURIComponent(teamId)}/members?limit=100`,
              { includeTeam: false },
            );
            const members = (memberResponse?.members ?? [])
              .map((entry) => ({
                uid: entry.uid ?? entry.user?.uid ?? entry.user?.id ?? null,
                username: entry.username ?? entry.user?.username ?? null,
                email: entry.email ?? entry.user?.email ?? null,
                role: entry.role ?? null,
                confirmed: entry.confirmed ?? null,
                teamPermissions: entry.teamPermissions ?? [],
                projectRoleCount: Array.isArray(entry.projects) ? entry.projects.length : null,
              }))
              .sort((a, b) => String(a.email ?? a.username).localeCompare(String(b.email ?? b.username)));
            return {
              checkedAt: new Date().toISOString(),
              team: {
                id: team.id ?? teamId,
                slug: team.slug ?? null,
                name: team.name ?? null,
                defaultBuildMachine: team.resourceConfig?.buildMachine?.default ?? null,
              },
              members,
              projects: summaries,
            };
          }

          function validateDeletionTargets(before) {
            const byId = new Map(before.projects.map((project) => [project.id, project]));
            const validated = [];
            for (const [id, [expectedName, expectedCreatedAt]] of deleteTargets) {
              const project = byId.get(id);
              if (!project) {
                validated.push({ id, name: expectedName, status: "already_absent" });
                continue;
              }
              if (project.name !== expectedName || Number(project.createdAt) !== expectedCreatedAt) {
                throw new Error(
                  `Refusing deletion because identity changed: ${JSON.stringify({
                    expected: { id, name: expectedName, createdAt: expectedCreatedAt },
                    actual: { id: project.id, name: project.name, createdAt: project.createdAt },
                  })}`,
                );
              }
              if (project.customDomains.length > 0) {
                throw new Error(
                  `Refusing deletion because ${project.name} has custom domains: ${project.customDomains.join(", ")}`,
                );
              }
              validated.push({ id, name: expectedName, status: "validated" });
            }
            return validated;
          }

          function assertStandard(project) {
            const config = project.resourceConfig;
            if (config.buildMachineType !== "standard") {
              throw new Error(`${project.name} is not on a Standard build machine: ${JSON.stringify(config)}`);
            }
            if (
              config.elasticConcurrencyEnabled !== false &&
              config.elasticConcurrencyEnabled !== null
            ) {
              throw new Error(`${project.name} still has paid elastic concurrency enabled: ${JSON.stringify(config)}`);
            }
            if (config.buildQueue !== "WAIT_FOR_NAMESPACE_QUEUE") {
              throw new Error(`${project.name} does not use the serialized build queue: ${JSON.stringify(config)}`);
            }
          }

          const before = await auditAll();
          const validation = validateDeletionTargets(before);
          await writeFile(
            "vercel-team-cleanup-before.json",
            `${JSON.stringify({ ...before, deletionValidation: validation }, null, 2)}\n`,
          );

          await request(`/v2/teams/${encodeURIComponent(teamId)}`, {
            method: "PATCH",
            includeTeam: false,
            body: {
              resourceConfig: {
                buildMachine: {
                  default: "standard",
                },
              },
            },
          });

          const patched = [];
          for (const project of before.projects) {
            if (deleteTargets.has(project.id)) continue;
            await request(`/v9/projects/${encodeURIComponent(project.id)}`, {
              method: "PATCH",
              body: {
                resourceConfig: {
                  buildMachineType: "standard",
                  elasticConcurrencyEnabled: false,
                  buildQueue: {
                    configuration: "WAIT_FOR_NAMESPACE_QUEUE",
                  },
                },
              },
            });
            patched.push({ id: project.id, name: project.name });
          }

          const deleted = [];
          for (const [id, [name]] of deleteTargets) {
            const project = before.projects.find((entry) => entry.id === id);
            if (!project) {
              deleted.push({ id, name, status: "already_absent" });
              continue;
            }
            await request(`/v9/projects/${encodeURIComponent(id)}`, { method: "DELETE" });
            deleted.push({ id, name, status: "deleted" });
          }

          const after = await auditAll();
          const afterIds = new Set(after.projects.map((project) => project.id));
          for (const id of deleteTargets.keys()) {
            if (afterIds.has(id)) throw new Error(`Deletion target remains present: ${id}`);
          }
          for (const project of after.projects) assertStandard(project);
          if (after.team.defaultBuildMachine !== "standard") {
            throw new Error(`Team default build machine is not Standard: ${JSON.stringify(after.team)}`);
          }

          const byId = new Map(after.projects.map((project) => [project.id, project]));
          for (const id of [canonicalId, legacyWebsite2Id]) {
            const project = byId.get(id);
            if (!project) throw new Error(`Required retained project is missing: ${id}`);
            if (project.link !== null) {
              throw new Error(`${project.name} is still Git-connected: ${JSON.stringify(project.link)}`);
            }
          }
          const duplicateWebsite2Links = after.projects.filter(
            (project) => project.link?.repo === "Website2",
          );
          if (duplicateWebsite2Links.length > 0) {
            throw new Error(
              `Projects remain connected to Website2: ${JSON.stringify(
                duplicateWebsite2Links.map((project) => ({ id: project.id, name: project.name, link: project.link })),
              )}`,
            );
          }

          const enabledAddOns = after.projects
            .filter((project) => project.speedInsightsEnabled || project.webAnalyticsEnabled)
            .map((project) => ({
              id: project.id,
              name: project.name,
              speedInsightsEnabled: project.speedInsightsEnabled,
              webAnalyticsEnabled: project.webAnalyticsEnabled,
            }));
          const paidMemberCandidates = after.members.filter(
            (member) => member.role && member.role !== "VIEWER",
          );

          const result = {
            checkedAt: new Date().toISOString(),
            patched,
            deleted,
            retainedProjectCount: after.projects.length,
            enabledAddOns,
            paidMemberCandidates,
            verification: {
              teamDefaultBuildMachineStandard: true,
              allRetainedProjectsStandard: true,
              paidElasticConcurrencyDisabledEverywhere: true,
              serializedBuildQueueEverywhere: true,
              canonicalGitDisconnected: true,
              website2GitDisconnected: true,
              noProjectConnectedToWebsite2: true,
              deletionTargetsAbsent: true,
            },
          };
          await writeFile(
            "vercel-team-cleanup-after.json",
            `${JSON.stringify({ ...after, cleanup: result }, null, 2)}\n`,
          );
          await writeFile("vercel-team-cleanup-result.json", `${JSON.stringify(result, null, 2)}\n`);
          console.log(JSON.stringify(result, null, 2));
          NODE

          node /tmp/vercel-team-cleanup.mjs

      - name: Upload redacted cleanup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vercel-team-cleanup-${{ github.run_id }}
          path: |
            vercel-team-cleanup-before.json
            vercel-team-cleanup-after.json
            vercel-team-cleanup-result.json
          if-no-files-found: warn
          retention-days: 30

      - name: Summarize completed cleanup
        if: steps.apply.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '### Team-wide Vercel cleanup'
            echo
            echo "- Projects deleted: \`$(jq '[.deleted[] | select(.status == "deleted")] | length' vercel-team-cleanup-result.json)\`"
            echo "- Retained projects standardized: \`$(jq '.patched | length' vercel-team-cleanup-result.json)\`"
            echo "- Retained project count: \`$(jq '.retainedProjectCount' vercel-team-cleanup-result.json)\`"
            echo "- Enabled analytics add-ons still requiring review: \`$(jq '.enabledAddOns | length' vercel-team-cleanup-result.json)\`"
            echo "- Non-viewer team members: \`$(jq '.paidMemberCandidates | length' vercel-team-cleanup-result.json)\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the one-time controller with verdict
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ '${{ steps.apply.outcome }}' == 'success' ]]; then
            message='Remove one-time Vercel team cleanup controller after PASS'
          else
            message='Remove one-time Vercel team cleanup controller after FAIL'
          fi
          blob_sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/$CONTROLLER_PATH?ref=main" --jq .sha 2>/dev/null || true)"
          if [[ -n "$blob_sha" ]]; then
            jq -n \
              --arg message "$message" \
              --arg sha "$blob_sha" \
              --arg branch main \
              '{message:$message,sha:$sha,branch:$branch}' \
              | gh api --method DELETE "repos/$GITHUB_REPOSITORY/contents/$CONTROLLER_PATH" --input - >/dev/null
          fi

      - name: Enforce cleanup success
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test '${{ steps.apply.outcome }}' = 'success'
