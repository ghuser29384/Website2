name: Trigger institutional QA dispatcher

on:
  push:
    branches:
      - feat/institutional-trade-system
    paths:
      - .github/workflows/trigger-institutional-qa-dispatcher.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  trigger:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: feat/institutional-trade-system
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove trigger and dispatch exact-tree gate
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/trigger-institutional-qa-dispatcher.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove temporary institutional QA trigger"
          git push origin HEAD:"$BRANCH"
          gh workflow run dispatch-institutional-qa.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$BRANCH"
