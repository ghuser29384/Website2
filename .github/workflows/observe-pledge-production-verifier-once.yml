name: Observe pledge production verifier once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/observe-pledge-production-verifier-once.yml

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: observe-pledge-production-verifier-once
  cancel-in-progress: false

env:
  PRODUCT_SHA: 979726c0a479843eca3c727512b477a340ebe9c6
  VERIFIER_SHA: b28c1cabe545d32dc5ad5840cbe88e27d9afa90e
  EXPECTED_DEPLOYMENT_ID: dpl_9P5dYaWwVDpPLEGDrKhKXzviYR46
  CONTROLLER_PATH: .github/workflows/observe-pledge-production-verifier-once.yml

jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out exact observer commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Guard exact repository and tree-neutral observer scope
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'ghuser29384/Website2'
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$GITHUB_ACTOR" = 'ghuser29384'
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$PRODUCT_SHA" HEAD
          changed_commit="$(git diff-tree --no-commit-id --name-only -r HEAD | sed '/^$/d')"
          test "$changed_commit" = "$CONTROLLER_PATH"
          changed_since_product="$(git diff --name-only "$PRODUCT_SHA" HEAD | sed '/^$/d')"
          test "$changed_since_product" = "$CONTROLLER_PATH"

      - name: Read the completed verifier run and validate its artifact
        id: result
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --commit "$VERIFIER_SHA" \
            --event push \
            --limit 100 \
            --json databaseId,workflowName,status,conclusion,url,headSha,createdAt,updatedAt \
            > pledge-verifier-runs.json

          jq -c \
            '[.[] | select(.workflowName == "Verify pledge clarity in current production once")] | sort_by(.databaseId) | last' \
            pledge-verifier-runs.json \
            > pledge-verifier-run.json

          jq -e '. != null' pledge-verifier-run.json >/dev/null
          jq -e --arg sha "$VERIFIER_SHA" '.headSha == $sha' pledge-verifier-run.json >/dev/null
          jq -e '.status == "completed"' pledge-verifier-run.json >/dev/null
          run_id="$(jq -r .databaseId pledge-verifier-run.json)"
          test "$run_id" != 'null'

          artifact_name="pledge-production-verification-${run_id}"
          mkdir -p pledge-verifier-evidence
          gh run download "$run_id" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$artifact_name" \
            --dir pledge-verifier-evidence

          report=pledge-verifier-evidence/pledge-clarity-production-canary/report.json
          deployment=pledge-verifier-evidence/pledge-production-deployment.json
          test -s "$report"
          test -s "$deployment"

          jq -e --arg sha "$PRODUCT_SHA" '.expectedSha == $sha' "$report" >/dev/null
          jq -e --arg id "$EXPECTED_DEPLOYMENT_ID" '.expectedDeploymentId == $id' "$report" >/dev/null
          jq -e '.status == "passed"' "$report" >/dev/null
          jq -e '(.scenarios | length) == 4' "$report" >/dev/null
          jq -e '
            ([.scenarios[].id] | sort) == [
              "moraltrade.org-desktop",
              "moraltrade.org-mobile",
              "www.moraltrade.org-desktop",
              "www.moraltrade.org-mobile"
            ]
          ' "$report" >/dev/null
          jq -e '
            all(.scenarios[];
              .status == "passed" and
              (.pageErrors | length) == 0 and
              (.consoleErrors | length) == 0 and
              (.failedRequests | length) == 0 and
              (.httpErrors | length) == 0
            )
          ' "$report" >/dev/null
          jq -e --arg id "$EXPECTED_DEPLOYMENT_ID" '(.id // .uid) == $id' "$deployment" >/dev/null
          jq -e '(.readyState // .state) == "READY" and .target == "production"' "$deployment" >/dev/null
          jq -e --arg sha "$PRODUCT_SHA" '.meta.githubCommitSha == $sha' "$deployment" >/dev/null

          jq -n \
            --arg verdict passed \
            --argjson run "$(cat pledge-verifier-run.json)" \
            --argjson report "$(cat "$report")" \
            '{verdict:$verdict,run:$run,report:$report}' \
            > pledge-verifier-observer-result.json
          echo 'verdict=passed' >> "$GITHUB_OUTPUT"

      - name: Write a fail-closed observer result when validation failed
        if: steps.result.outcome != 'success'
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            --arg verdict failed \
            --arg verifierSha "$VERIFIER_SHA" \
            --arg note 'The verifier run or its artifact did not satisfy every exact check.' \
            '{verdict:$verdict,verifierSha:$verifierSha,note:$note}' \
            > pledge-verifier-observer-result.json

      - name: Upload observer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pledge-production-observer-${{ github.run_id }}
          path: |
            pledge-verifier-runs.json
            pledge-verifier-run.json
            pledge-verifier-evidence
            pledge-verifier-observer-result.json
          if-no-files-found: warn
          retention-days: 30

      - name: Report the artifact-grounded production verdict to PR 402
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          observer_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          verifier_url="$(jq -r '.url // empty' pledge-verifier-run.json 2>/dev/null || true)"
          verdict="$(jq -r '.verdict // "failed"' pledge-verifier-observer-result.json)"
          if [[ "$verdict" == 'passed' ]]; then
            gh pr comment 402 --repo "$GITHUB_REPOSITORY" --body "Artifact-grounded production verification is complete. Corrected verifier $verifier_url passed all four canonical scenarios on deployment \`$EXPECTED_DEPLOYMENT_ID\` for product SHA \`$PRODUCT_SHA\`: apex and www, desktop and 390x844 mobile. The report confirms \`$35\`, \`$8,165 remains\`, \`0.43% of current gap\`, the non-authorization caveat, no pivotality language, a visible mobile sheet, and zero page, console, same-site request, HTTP, or overflow failures. The earlier failure in run 30826217656 was only module resolution from a script placed outside the repository. Observer evidence: $observer_url"
          else
            gh pr comment 402 --repo "$GITHUB_REPOSITORY" --body "The corrected production verifier could not be certified from its completed artifact. No production-success claim is made. Verifier: ${verifier_url:-unresolved}. Observer evidence: $observer_url"
          fi

      - name: Remove one-time observer with the verdict in the commit message
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          verdict="$(jq -r '.verdict // "failed"' pledge-verifier-observer-result.json 2>/dev/null || echo failed)"
          if [[ "$verdict" == 'passed' ]]; then
            message='Remove one-time pledge verifier observer after PASS'
          else
            message='Remove one-time pledge verifier observer after FAIL'
          fi
          blob_sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/$CONTROLLER_PATH?ref=main" --jq .sha 2>/dev/null || true)"
          if [[ -n "$blob_sha" ]]; then
            jq -n \
              --arg message "$message" \
              --arg sha "$blob_sha" \
              --arg branch main \
              '{message:$message,sha:$sha,branch:$branch}' \
              | gh api --method DELETE "repos/$GITHUB_REPOSITORY/contents/$CONTROLLER_PATH" --input - >/dev/null
          fi

      - name: Enforce artifact-grounded PASS
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(jq -r '.verdict // "failed"' pledge-verifier-observer-result.json)" = 'passed'
