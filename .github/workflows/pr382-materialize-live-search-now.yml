name: Materialize PR 382 live-search repair

on:
  push:
    branches:
      - fix/discover-live-search-runtime-20260731
    paths:
      - ".github/workflows/pr382-materialize-live-search-now.yml"

permissions:
  contents: write

concurrency:
  group: pr382-materialize-live-search-now
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out PR 382 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/discover-live-search-runtime-20260731

      - name: Apply repair once
        run: |
          if grep -q "function ensureLiveListSurface" public/moral-trade-discover-search.js; then
            echo "Repair already materialized."
          else
            python3 scripts/repair-pr382-live-search-boundaries.py
          fi
          node --check public/moral-trade-discover-search.js

      - name: Commit repaired files when needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            public/moral-trade-discover-search.js \
            scripts/discover-live-search-loader-contract.test.mjs \
            src/app/api/discover/search/route.ts \
            src/lib/discover-search.ts \
            src/lib/discover-search.test.ts \
            tests/discover-cofund.spec.ts \
            tests/discover-live-search.spec.ts
          if git diff --cached --quiet; then
            echo "No repair commit needed."
            exit 0
          fi
          git diff --cached --check
          git commit -m "Keep live Co-Funds under Offers and preserve result ownership"
          git push origin HEAD:fix/discover-live-search-runtime-20260731
