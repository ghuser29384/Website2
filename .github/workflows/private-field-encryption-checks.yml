name: Private field encryption checks

on:
  pull_request:
    paths:
      - ".github/workflows/private-field-encryption-checks.yml"

permissions:
  contents: read

jobs:
  complete-profile-404-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f005a51a18f01ed0a93b986c044658d6c9dd8d49
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Identify every production 4xx request from the returning page
        run: |
          mkdir -p .qa complete-profile-404-diagnostic
          cat > .qa/complete-profile-404-diagnostic.mjs <<'SCRIPT'
          import { chromium } from "@playwright/test";
          import { writeFile } from "node:fs/promises";

          const origin = "https://www.moraltrade.org";
          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({ viewport: { width: 1440, height: 1000 } });
          await context.addCookies([
            {
              name: "mt_walkthrough_seen",
              value: "1",
              url: origin,
              httpOnly: true,
              secure: true,
              sameSite: "Lax",
            },
          ]);
          const page = await context.newPage();
          const responses = [];
          const requestsFailed = [];
          const consoleMessages = [];
          const pageErrors = [];

          page.on("response", async (response) => {
            if (response.status() >= 400) {
              const request = response.request();
              responses.push({
                status: response.status(),
                url: response.url(),
                method: request.method(),
                resourceType: request.resourceType(),
                requestHeaders: await request.allHeaders(),
                responseHeaders: await response.allHeaders(),
              });
            }
          });
          page.on("requestfailed", (request) => {
            requestsFailed.push({
              url: request.url(),
              method: request.method(),
              resourceType: request.resourceType(),
              failure: request.failure(),
            });
          });
          page.on("console", (message) => {
            consoleMessages.push({ type: message.type(), text: message.text(), location: message.location() });
          });
          page.on("pageerror", (error) => pageErrors.push(error.message));

          const navigation = await page.goto(`${origin}/complete-profile`, {
            waitUntil: "networkidle",
            timeout: 120_000,
          });
          await page.waitForTimeout(2_000);
          await page.screenshot({
            path: "complete-profile-404-diagnostic/returning-page.png",
            fullPage: true,
          });
          const report = {
            checkedAt: new Date().toISOString(),
            navigationStatus: navigation?.status() ?? null,
            finalUrl: page.url(),
            responses,
            requestsFailed,
            consoleMessages,
            pageErrors,
          };
          console.log(JSON.stringify(report, null, 2));
          await writeFile(
            "complete-profile-404-diagnostic/report.json",
            `${JSON.stringify(report, null, 2)}\n`,
          );
          await browser.close();
          SCRIPT
          node .qa/complete-profile-404-diagnostic.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: complete-profile-production-404-diagnostic
          path: complete-profile-404-diagnostic
          if-no-files-found: error
          retention-days: 2
