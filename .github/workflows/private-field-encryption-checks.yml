name: Private field encryption checks

on:
  pull_request:
    paths:
      - ".github/workflows/private-field-encryption-checks.yml"
      - "src/app/complete-profile/actions.ts"
      - "src/lib/background-field-encryption.ts"
      - "src/lib/background-field-encryption.test.ts"
      - "src/lib/complete-profile-private-preferences.ts"
      - "src/lib/complete-profile-private-preferences.test.ts"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/private-field-encryption-checks.yml"
      - "src/app/complete-profile/actions.ts"
      - "src/lib/background-field-encryption.ts"
      - "src/lib/background-field-encryption.test.ts"
      - "src/lib/complete-profile-private-preferences.ts"
      - "src/lib/complete-profile-private-preferences.test.ts"

permissions:
  contents: read

jobs:
  focused-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run private-field encryption tests
        run: >-
          node --import tsx --test
          src/lib/background-field-encryption.test.ts
          src/lib/complete-profile-private-preferences.test.ts

      - name: Lint private-field encryption files
        run: >-
          npx eslint
          src/app/complete-profile/actions.ts
          src/lib/background-field-encryption.ts
          src/lib/background-field-encryption.test.ts
          src/lib/complete-profile-private-preferences.ts
          src/lib/complete-profile-private-preferences.test.ts
