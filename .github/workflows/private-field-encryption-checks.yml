name: Private field encryption checks

on:
  pull_request:
    paths:
      - ".github/workflows/private-field-encryption-checks.yml"

permissions:
  contents: read

concurrency:
  group: complete-profile-preview-auth-diagnostic
  cancel-in-progress: false

jobs:
  preview-auth-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_SHA: 41994c4a11203cbe7a79e9bb262b938011051379
      PREVIEW_SHARE_URL: https://moraltrade-site-1koy9yv8s-ellen-s.vercel.app/?_vercel_share=AMVFbwA15eaZFX9gK8F0ZVLzwfcXE98c
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Inspect preview authorization handoff
        run: |
          mkdir -p .qa preview-auth-diagnostic
          cat > .qa/preview-auth-diagnostic.mjs <<'SCRIPT'
          import { chromium } from "@playwright/test";
          import { writeFile } from "node:fs/promises";

          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({ viewport: { width: 1440, height: 1000 } });
          const page = await context.newPage();
          const navigations = [];
          page.on("framenavigated", (frame) => {
            if (frame === page.mainFrame()) navigations.push(frame.url());
          });
          const response = await page.goto(process.env.PREVIEW_SHARE_URL, {
            waitUntil: "domcontentloaded",
            timeout: 120_000,
          });
          await page.waitForTimeout(5_000);
          const diagnostic = {
            responseStatus: response?.status() ?? null,
            finalUrl: page.url(),
            title: await page.title(),
            bodyText: (await page.locator("body").innerText()).slice(0, 5000),
            links: await page.locator("a").evaluateAll((nodes) =>
              nodes.slice(0, 30).map((node) => ({ text: node.textContent, href: node.href })),
            ),
            buttons: await page.locator("button").evaluateAll((nodes) =>
              nodes.slice(0, 30).map((node) => ({ text: node.textContent })),
            ),
            cookies: (await context.cookies()).map((cookie) => ({
              name: cookie.name,
              domain: cookie.domain,
              path: cookie.path,
              expires: cookie.expires,
            })),
            navigations,
          };
          console.log(JSON.stringify(diagnostic, null, 2));
          await writeFile("preview-auth-diagnostic/report.json", `${JSON.stringify(diagnostic, null, 2)}\n`);
          await writeFile("preview-auth-diagnostic/page.html", await page.content());
          await page.screenshot({ path: "preview-auth-diagnostic/page.png", fullPage: true });
          await browser.close();
          SCRIPT
          node .qa/preview-auth-diagnostic.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: complete-profile-preview-auth-diagnostic
          path: preview-auth-diagnostic
          if-no-files-found: error
          retention-days: 2
