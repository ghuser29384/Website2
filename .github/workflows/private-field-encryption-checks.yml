name: Private field encryption checks

on:
  pull_request:
    paths:
      - ".github/workflows/private-field-encryption-checks.yml"

permissions:
  contents: read

jobs:
  preview-secret-presence:
    runs-on: ubuntu-latest
    env:
      AUTOMATION_BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      VERCEL_TOKEN_VALUE: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Report available protected-preview authentication methods
        run: |
          if [ -n "$AUTOMATION_BYPASS" ]; then echo "automation_bypass_present=true"; else echo "automation_bypass_present=false"; fi
          if [ -n "$VERCEL_TOKEN_VALUE" ]; then echo "vercel_token_present=true"; else echo "vercel_token_present=false"; fi
