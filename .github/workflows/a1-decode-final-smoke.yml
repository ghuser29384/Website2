name: Decode verified A1 smoke bundle

on:
  pull_request:
    branches:
      - main
    paths:
      - .a1-production-smoke/**

permissions:
  contents: read

jobs:
  decode:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/a1-production-smoke-20260725
          show-progress: false
      - name: Decode and validate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p decoded
          base64 --decode .a1-production-smoke/final.gz.b64 | gzip -d > decoded/a1-production-smoke.mjs
          echo "f82baf39e9af65aac1204416a3e0589f74f8013f30c11ec2eda7b7341d8a2a7f  decoded/a1-production-smoke.mjs" | sha256sum -c -
          node --check decoded/a1-production-smoke.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: decoded-a1-production-smoke-${{ github.run_id }}
          path: decoded/a1-production-smoke.mjs
          if-no-files-found: error
          retention-days: 1
