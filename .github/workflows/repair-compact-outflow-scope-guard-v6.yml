name: Repair Compact outflow scope guard v6

on:
  push:
    branches:
      - feature/compact-authoritative-outflow-ledger-v1-20260816
    paths:
      - .github/workflows/repair-compact-outflow-scope-guard-v6.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch durable QA guard
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/compact-authoritative-outflow-ledger-qa.yml')
          text = path.read_text()
          old1 = '          test ! -e .github/workflows/repair-compact-outflow-qa.yml\n'
          new1 = '''          for controller in \\
            .github/workflows/repair-compact-outflow-qa.yml \\
            .github/workflows/repair-compact-outflow-validation-v2.yml \\
            .github/workflows/repair-compact-outflow-scope-guard-v3.yml \\
            .github/workflows/repair-compact-outflow-scope-guard-v4.yml \\
            .github/workflows/repair-compact-outflow-scope-guard-v5.yml \\
            .github/workflows/repair-compact-outflow-scope-guard-v6.yml; do
            test ! -e "$controller"
          done
'''
          old2 = '''          if grep -R -E "automaticCollectionEnabled[[:space:]]*[:=][[:space:]]*true|moneyMoved[[:space:]]*[:=][[:space:]]*true|activation_execution_enabled[[:space:]]*=[[:space:]]*true" $(cat /tmp/actual-files.txt); then
            echo "An active collection or activation effect was introduced."
            exit 1
          fi
'''
          new2 = '''          if grep -E "automaticCollectionEnabled[[:space:]]*[:=][[:space:]]*true|moneyMoved[[:space:]]*[:=][[:space:]]*true|activation_execution_enabled[[:space:]]*=[[:space:]]*true" \\
            docs/mpgf/compact-authoritative-outflow-ledger-v1.md \\
            src/components/mpgf/mpgf-public-goods-compacts.tsx \\
            src/lib/mpgf/compact-authoritative-outflow.ts \\
            supabase/migrations/2026081614150*_compact_authoritative_outflow_*.sql; then
            echo "An active collection or activation effect was introduced."
            exit 1
          fi
'''
          old3 = '''          if grep -R -E "createServiceClient|SUPABASE_SERVICE_ROLE_KEY|STRIPE_SECRET_KEY|EVERY_ORG" \\
            src/components/mpgf/mpgf-public-goods-compacts.tsx \\
            src/lib/mpgf/compact-authoritative-outflow*.ts; then
            echo "Application/runtime credential or service-role use is forbidden."
            exit 1
          fi
'''
          new3 = '''          if grep -E "createServiceClient|SUPABASE_SERVICE_ROLE_KEY|STRIPE_SECRET_KEY|EVERY_ORG" \\
            src/components/mpgf/mpgf-public-goods-compacts.tsx \\
            src/lib/mpgf/compact-authoritative-outflow.ts; then
            echo "Application/runtime credential or service-role use is forbidden."
            exit 1
          fi
'''
          for old, new in ((old1, new1), (old2, new2), (old3, new3)):
              if text.count(old) != 1:
                  raise SystemExit('Expected exact guard block once')
              text = text.replace(old, new)
          path.write_text(text)
          PY
          git diff --check

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add .github/workflows/compact-authoritative-outflow-ledger-qa.yml
          git rm .github/workflows/repair-compact-outflow-scope-guard-v6.yml
          git commit -m "ci: scope Compact outflow guards to runtime files"
          git push origin HEAD:feature/compact-authoritative-outflow-ledger-v1-20260816
