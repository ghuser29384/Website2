name: Commitments Pro Sprint specification gates

on:
  push:
    branches:
      - docs/commitments-pro-sprint-materialization-v1-20260818
      - main
    paths:
      - .github/workflows/commitments-pro-sprint-specification-gates.yml
      - docs/commitments/pro-sprint-materialization-smoke.txt
      - docs/commitments/pro-sprint-source-of-truth-v1.md
      - docs/commitments/pro-sprint-artifact-precedence-v1.md
      - docs/commitments/pro-sprint-orchestration-v1.md
      - docs/commitments/trust-resolution-v3-contract.v1.json
      - docs/commitments/zero-dollar-pilot-contract.v1.json
      - docs/commitments/qri-orchestration-contract.v1.json
      - docs/commitments/pilot-operations-contract.v1.json
      - docs/commitments/free-rider-portfolio-contract.v1.json
      - docs/commitments/pro-sprint-materialization-manifest.v1.json
      - scripts/commitments/validate-pro-sprint-materialization.mjs
      - scripts/commitments/pro-sprint-materialization.test.mjs
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/commitments-pro-sprint-specification-gates.yml
      - docs/commitments/pro-sprint-materialization-smoke.txt
      - docs/commitments/pro-sprint-source-of-truth-v1.md
      - docs/commitments/pro-sprint-artifact-precedence-v1.md
      - docs/commitments/pro-sprint-orchestration-v1.md
      - docs/commitments/trust-resolution-v3-contract.v1.json
      - docs/commitments/zero-dollar-pilot-contract.v1.json
      - docs/commitments/qri-orchestration-contract.v1.json
      - docs/commitments/pilot-operations-contract.v1.json
      - docs/commitments/free-rider-portfolio-contract.v1.json
      - docs/commitments/pro-sprint-materialization-manifest.v1.json
      - scripts/commitments/validate-pro-sprint-materialization.mjs
      - scripts/commitments/pro-sprint-materialization.test.mjs

permissions:
  contents: read

concurrency:
  group: commitments-pro-sprint-specification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: repository-only specification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Parse JSON and workflow
        run: |
          node - <<'NODE'
          const { readdirSync, readFileSync, statSync } = require('node:fs');
          const { join } = require('node:path');
          function walk(path) {
            for (const name of readdirSync(path)) {
              const child = join(path, name);
              if (statSync(child).isDirectory()) walk(child);
              else if (name.endsWith('.json')) JSON.parse(readFileSync(child, 'utf8'));
            }
          }
          walk('docs/commitments');
          NODE
          ruby -e 'require "yaml"; YAML.load_file(".github/workflows/commitments-pro-sprint-specification-gates.yml", aliases: true)'

      - name: Resolve exact comparison base
        id: comparison-base
        env:
          EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          MATERIALIZATION_BASE_SHA: 7e993158363710e5fe2c3eaa1cbccdb5cd56c235
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            # actions/checkout checks out GitHub's synthetic merge ref for a pull request.
            # Its first parent is the exact target-base commit used to create this test
            # merge, while the event payload's base.sha may be stale after main advances.
            BASE_SHA="$(git rev-parse HEAD^1)"
            CANDIDATE_SHA="$(git rev-parse HEAD^2)"
            if [ -z "$PR_HEAD_SHA" ] || [ "$CANDIDATE_SHA" != "$PR_HEAD_SHA" ]; then
              echo "Pull-request merge identity mismatch: candidate=$CANDIDATE_SHA event_head=$PR_HEAD_SHA" >&2
              exit 1
            fi
          elif [ "$GIT_REF" = "refs/heads/main" ]; then
            BASE_SHA="$PUSH_BEFORE_SHA"
          else
            BASE_SHA="$MATERIALIZATION_BASE_SHA"
          fi
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "Unable to resolve an exact comparison base." >&2
            exit 1
          fi
          git cat-file -e "$BASE_SHA^{commit}"
          echo "sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "Comparison base: $BASE_SHA"

      - name: Validate contracts and exact repository scope
        env:
          BASE_SHA: ${{ steps.comparison-base.outputs.sha }}
        run: |
          set -euo pipefail
          node scripts/commitments/validate-pro-sprint-materialization.mjs \
            --check-diff "$BASE_SHA" \
            --write-evidence "$RUNNER_TEMP/commitments-pro-sprint-materialization-sha256.json"
          node --test scripts/commitments/pro-sprint-materialization.test.mjs
          git diff --check "$BASE_SHA"...HEAD

      - name: Reject production and execution surfaces
        env:
          BASE_SHA: ${{ steps.comparison-base.outputs.sha }}
        run: |
          set -euo pipefail
          if git diff --name-only "$BASE_SHA"...HEAD \
            | grep -E '^(src/|public/|supabase/|package(-lock)?\.json$|next\.config|vercel|\.env|scripts/.*provider|scripts/.*payment)' ; then
            echo 'Runtime, database, dependency, provider, payment, or deployment surface entered the repository-only candidate.' >&2
            exit 1
          fi
          if grep -R -n -E 'learnedRankingMayActivate[[:space:]]*=[[:space:]]*true|public_numeric_score[[:space:]]*:[[:space:]]*[1-9]|participant_specific.*identified[[:space:]]*:[[:space:]]*true' \
            docs/commitments scripts/commitments ; then
            echo 'An activation escape hatch entered the specification candidate.' >&2
            exit 1
          fi

      - name: Upload immutable SHA-256 evidence
        uses: actions/upload-artifact@v4
        with:
          name: commitments-pro-sprint-materialization-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/commitments-pro-sprint-materialization-sha256.json
          if-no-files-found: error
          retention-days: 30
