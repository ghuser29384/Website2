name: Commitments Pro Sprint specification gates

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/commitments-pro-sprint-specification-gates.yml
      - docs/commitments/**
      - scripts/commitments/**
  push:
    branches: [main]
    paths:
      - .github/workflows/commitments-pro-sprint-specification-gates.yml
      - docs/commitments/**
      - scripts/commitments/**

permissions:
  contents: read

concurrency:
  group: commitments-pro-sprint-specification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  specification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Establish immutable source identity
        id: identity
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          actual_head="$(git rev-parse HEAD)"
          test "$actual_head" = "$EXPECTED_HEAD_SHA"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base_sha="$PR_BASE_SHA"
          else
            base_sha="$PUSH_BEFORE_SHA"
          fi
          test -n "$base_sha"
          test "$base_sha" != "0000000000000000000000000000000000000000"
          git cat-file -e "$base_sha^{commit}"
          mkdir -p "$RUNNER_TEMP/commitments-pro-sprint-evidence"
          printf '%s\n' "$base_sha" > "$RUNNER_TEMP/commitments-pro-sprint-evidence/base-sha.txt"
          printf '%s\n' "$actual_head" > "$RUNNER_TEMP/commitments-pro-sprint-evidence/head-sha.txt"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/commitments-pro-sprint-evidence/head-tree.txt"
          git diff --name-only "$base_sha...$actual_head" | LC_ALL=C sort > "$RUNNER_TEMP/commitments-pro-sprint-evidence/changed-files.txt"
          {
            printf 'BASE_SHA=%s\n' "$base_sha"
            printf 'HEAD_SHA=%s\n' "$actual_head"
          } >> "$GITHUB_ENV"

      - name: Parse JSON and workflow YAML
        run: |
          set -euo pipefail
          node <<'NODE'
          const { readFileSync, readdirSync } = require('node:fs');
          const { join } = require('node:path');
          const dir = 'docs/commitments';
          for (const name of readdirSync(dir).filter((value) => value.endsWith('.json'))) {
            JSON.parse(readFileSync(join(dir, name), 'utf8'));
          }
          NODE
          ruby -e 'require "yaml"; YAML.load_file(".github/workflows/commitments-pro-sprint-specification-gates.yml", aliases: true)'

      - name: Validate contracts, exact diff, and SHA-256 bindings
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/commitments-pro-sprint-evidence/commitments-pro-sprint-materialization-sha256.json"
          node scripts/commitments/validate-pro-sprint-materialization.mjs \
            --check-diff "$BASE_SHA" \
            --write-evidence "$evidence" \
            | tee "$RUNNER_TEMP/commitments-pro-sprint-evidence/validator.log"
          node --test scripts/commitments/pro-sprint-materialization.test.mjs \
            | tee "$RUNNER_TEMP/commitments-pro-sprint-evidence/tests.log"

      - name: Enforce repository-only scope and clean patch
        run: |
          set -euo pipefail
          git diff --check "$BASE_SHA...$HEAD_SHA" \
            | tee "$RUNNER_TEMP/commitments-pro-sprint-evidence/diff-check.log"
          if grep -E '^(src/|public/|supabase/|package(-lock)?\.json$|next\.config|vercel|\.env)' \
            "$RUNNER_TEMP/commitments-pro-sprint-evidence/changed-files.txt"; then
            echo "Runtime, database, dependency, provider, or deployment path entered the repository-only candidate." >&2
            exit 1
          fi
          if grep -E '^\.github/(materialization|scripts)/|^\.github/workflows/apply-' \
            "$RUNNER_TEMP/commitments-pro-sprint-evidence/changed-files.txt"; then
            echo "Temporary transport or write-enabled controller entered the permanent candidate." >&2
            exit 1
          fi
          test "$(wc -l < "$RUNNER_TEMP/commitments-pro-sprint-evidence/changed-files.txt" | tr -d ' ')" = "14"

      - name: Record release and epistemic boundary
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/commitments-pro-sprint-evidence/boundary.json" <<JSON
          {
            "schema_version": "moral-trade-commitments-pro-sprint-boundary-v1",
            "base_sha": "$BASE_SHA",
            "head_sha": "$HEAD_SHA",
            "release_class": "repository_only",
            "runtime_effect": false,
            "database_effect": false,
            "provider_or_money_effect": false,
            "participant_or_research_effect": false,
            "qri_implementation_claimed": false,
            "pilot_authorized": false
          }
          JSON

      - name: Upload immutable specification evidence
        uses: actions/upload-artifact@v4
        with:
          name: commitments-pro-sprint-specification-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/commitments-pro-sprint-evidence
          if-no-files-found: error
          retention-days: 30
