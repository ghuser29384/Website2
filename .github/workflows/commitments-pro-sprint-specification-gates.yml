name: Commitments Pro Sprint one-time remediation applicator

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - docs/commitments-pro-sprint-materialization-v1-20260818

permissions:
  contents: write

concurrency:
  group: commitments-pro-sprint-one-time-remediation
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/docs/commitments-pro-sprint-materialization-v1-20260818') ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'docs/commitments-pro-sprint-materialization-v1-20260818')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: docs/commitments-pro-sprint-materialization-v1-20260818

      - name: Verify exact staging identity and archive
        env:
          EXPECTED_PARENT: d30b5d4c1e1c302f1a934facd110c4590479db57
          EXPECTED_ARCHIVE_SHA256: 0e97bbfdda1ce41b808867bab2a608918fa4dc19d8ebe4ca67c3900b1cde6bb0
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(sha256sum .github/materialization/pr767-remediation/part-000.b64 | cut -d' ' -f1)" = "47e62689150924603907190789ed464dfbe651d481e19d11302abc60eafc8246"
          test "$(sha256sum .github/materialization/pr767-remediation/part-001.b64 | cut -d' ' -f1)" = "3f8e8c3aa8f938e40a0f639d4ddc1965eee540656e16b89e6485cbcbb8f9b4b2"
          test "$(sha256sum .github/materialization/pr767-remediation/part-002.b64 | cut -d' ' -f1)" = "c0a63aff2664c1acaed8066fcd43fa3e867d7c1a81808ed7030fcda724de5efa"
          test "$(sha256sum .github/materialization/pr767-remediation/part-003.b64 | cut -d' ' -f1)" = "9850fc06c47f259ba846098fbdfba5a6301ba74fe59c920accbe787cd0cb9fa2"
          cat .github/materialization/pr767-remediation/part-*.b64 | base64 --decode > "$RUNNER_TEMP/pr767-remediation-overlay.tar.gz"
          test "$(sha256sum "$RUNNER_TEMP/pr767-remediation-overlay.tar.gz" | cut -d' ' -f1)" = "$EXPECTED_ARCHIVE_SHA256"

      - name: Apply exact repository-only overlay
        run: |
          set -euo pipefail
          tar -xzf "$RUNNER_TEMP/pr767-remediation-overlay.tar.gz" -C .
          rm -rf .github/materialization/pr767-remediation
          rm -f .github/workflows/apply-pr767-remediation.yml

      - name: Validate final candidate before commit
        run: |
          set -euo pipefail
          node scripts/commitments/validate-pro-sprint-materialization.mjs
          node --test scripts/commitments/pro-sprint-materialization.test.mjs
          ruby -e 'require "yaml"; YAML.load_file(".github/workflows/commitments-pro-sprint-specification-gates.yml", aliases: true)'
          git diff --check
          if git diff --name-only | grep -E '^(src/|public/|supabase/|package(-lock)?\.json$|next\.config|vercel|\.env)' ; then
            echo "Runtime or deployment path entered the remediation." >&2
            exit 1
          fi

      - name: Commit and push exact remediation
        env:
          BRANCH: docs/commitments-pro-sprint-materialization-v1-20260818
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Repair Commitments materialization contracts"
          git push origin "HEAD:$BRANCH"
