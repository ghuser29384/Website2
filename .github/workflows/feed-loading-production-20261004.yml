name: Publish Feed loading recovery 2026-10-04

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/feed-loading-production-20261004.yml

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Verify approved Feed recovery and exact candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'ghuser29384/Website2'
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          import assert from 'node:assert/strict';
          const source = readFileSync('public/moral-trade-live.html', 'utf8');
          assert.ok(source.includes('timeoutMs: 25000, attempts: 2'));
          const route = readFileSync('src/app/api/live-now-a1/route.ts', 'utf8');
          assert.ok(route.includes('getLiveNowRequestContext(request)'));
          // Resume the already-approved runtime release after its stale timeout assertion is repaired.
          const boundedWaitTest = readFileSync('tests/home-bootstrap-resilience.spec.ts', 'utf8');
          assert.ok(boundedWaitTest.includes('expect(attempts).toBe(2)'));
          assert.ok(boundedWaitTest.includes('timeout:55_000'));
          JS
          git diff --check HEAD^
          remote_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$remote_sha" = "$GITHUB_SHA"
      - name: Dispatch existing gated production release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          jq -n --arg sha "$GITHUB_SHA" \
            '{ref:"main",inputs:{ref:"main",target:"production",expected_sha:$sha,synthetic_auth_fixture_url:""}}' \
            | gh api --method POST \
                -H 'Accept: application/vnd.github+json' \
                "repos/$GITHUB_REPOSITORY/actions/workflows/vercel-release.yml/dispatches" \
                --input - >/dev/null
