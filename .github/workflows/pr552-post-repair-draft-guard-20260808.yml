name: PR 552 post-repair draft guard

on:
  push:
    branches:
      - ops/pr552-post-repair-draft-guard-20260808
    paths:
      - .github/workflows/pr552-post-repair-draft-guard-20260808.yml

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr552-post-repair-draft-guard-20260808
  cancel-in-progress: false

env:
  TARGET_BRANCH: hotfix/dashboard-account-security-visible-20260807
  STATUS_DIR: pr552-post-repair-draft-guard

jobs:
  guard:
    name: Keep the newly repaired head draft until exact QA passes
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out the guard controller
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait for the final redirect-backed repair
        id: head
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$STATUS_DIR"
          candidate=''
          pr_node_id=''
          was_draft=''
          for attempt in $(seq 1 240); do
            response="$(curl -fsS \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              'https://api.github.com/repos/ghuser29384/Website2/pulls/552')"
            test "$(jq -r '.state' <<<"$response")" = 'open'
            test "$(jq -r '.head.ref' <<<"$response")" = "$TARGET_BRANCH"
            test "$(jq -r '.head.repo.full_name' <<<"$response")" = 'ghuser29384/Website2'
            test "$(jq -r '.base.ref' <<<"$response")" = 'main'
            sha="$(jq -r '.head.sha' <<<"$response")"
            git fetch --no-tags origin "$sha"
            actions_file="$RUNNER_TEMP/pr552-draft-guard-actions.ts"
            component_file="$RUNNER_TEMP/pr552-draft-guard-panel.tsx"
            git show "${sha}:src/app/background-networking/actions.ts" > "$actions_file"
            git show "${sha}:src/components/dashboard/background-account-security-panel.tsx" > "$component_file"
            if grep -Fq 'redirectWithMessage(returnTo, "message", "MFA verified for this session.");' "$actions_file" \
              && grep -Fq 'data-mfa-verification-refresh="router-refresh"' "$component_file" \
              && grep -Fq 'router.refresh();' "$component_file"; then
              candidate="$sha"
              pr_node_id="$(jq -r '.node_id' <<<"$response")"
              was_draft="$(jq -r '.draft' <<<"$response")"
              break
            fi
            sleep 4
          done
          test -n "$candidate"
          test -n "$pr_node_id"
          printf '%s\n' "$candidate" | tee "$STATUS_DIR/candidate-sha.txt"
          printf '%s\n' "$was_draft" | tee "$STATUS_DIR/was-draft.txt"
          echo "candidate=$candidate" >> "$GITHUB_OUTPUT"
          echo "pr_node_id=$pr_node_id" >> "$GITHUB_OUTPUT"
          echo "was_draft=$was_draft" >> "$GITHUB_OUTPUT"

      - name: Convert the changed PR head back to draft when necessary
        if: ${{ steps.head.outputs.was_draft != 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          jq -n \
            --arg query 'mutation($id:ID!){convertPullRequestToDraft(input:{pullRequestId:$id}){pullRequest{isDraft number headRefOid}}}' \
            --arg id '${{ steps.head.outputs.pr_node_id }}' \
            '{query:$query,variables:{id:$id}}' > "$RUNNER_TEMP/pr552-convert-draft.json"
          curl -fsS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Content-Type: application/json' \
            'https://api.github.com/graphql' \
            --data-binary @"$RUNNER_TEMP/pr552-convert-draft.json" \
            > "$STATUS_DIR/convert-response.json"
          jq -e \
            --arg sha '${{ steps.head.outputs.candidate }}' '
              (.errors // []) | length == 0
              and .data.convertPullRequestToDraft.pullRequest.isDraft == true
              and .data.convertPullRequestToDraft.pullRequest.headRefOid == $sha
            ' "$STATUS_DIR/convert-response.json" >/dev/null

      - name: Prove the live PR is draft at the exact repaired head
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          response="$(curl -fsS \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/ghuser29384/Website2/pulls/552')"
          test "$(jq -r '.state' <<<"$response")" = 'open'
          test "$(jq -r '.draft' <<<"$response")" = 'true'
          test "$(jq -r '.head.sha' <<<"$response")" = '${{ steps.head.outputs.candidate }}'
          test "$(jq -r '.head.ref' <<<"$response")" = "$TARGET_BRANCH"
          jq -n \
            --arg candidateSha '${{ steps.head.outputs.candidate }}' \
            --argjson wasDraft '${{ steps.head.outputs.was_draft }}' \
            '{schemaVersion:1,status:"success",candidateSha:$candidateSha,wasDraft:$wasDraft,isDraft:true,productionChanged:false}' \
            > "$STATUS_DIR/status.json"

      - name: Archive guard evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr552-post-repair-draft-guard-${{ github.run_id }}
          path: pr552-post-repair-draft-guard/
          if-no-files-found: warn
          retention-days: 30
