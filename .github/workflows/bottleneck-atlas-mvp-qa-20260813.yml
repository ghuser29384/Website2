name: Bottleneck Atlas working MVP QA

on:
  push:
    branches:
      - feat/bottleneck-atlas-working-mvp-20260813
    paths:
      - .github/workflows/bottleneck-atlas-mvp-qa-20260813.yml

permissions:
  actions: read
  contents: read

concurrency:
  group: bottleneck-atlas-working-mvp-qa-20260813
  cancel-in-progress: true

env:
  MORAL_TRADE_DISABLE_SUPABASE: "true"
  OPPORTUNITY_SYNTHESIS_ENABLED: "true"
  NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3211
  SITE_URL: http://127.0.0.1:3211
  QA_OUTPUT: bottleneck-atlas-mvp-evidence

jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 75

    steps:
      - name: Check out candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Guard branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'ghuser29384/Website2'
          test "$GITHUB_REF" = 'refs/heads/feat/bottleneck-atlas-working-mvp-20260813'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies and Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium

      - name: Run source, type, build, and browser gates
        shell: bash
        env:
          PLAYWRIGHT_USE_PRODUCTION_SERVER: "1"
        run: |
          set -euo pipefail
          mkdir -p "$QA_OUTPUT"
          npm run lint -- --quiet | tee "$QA_OUTPUT/lint.log"
          npx tsc --noEmit --pretty false | tee "$QA_OUTPUT/typescript.log"
          npm run build | tee "$QA_OUTPUT/build.log"
          npx playwright test tests/bottleneck-atlas.spec.ts --workers=1 --reporter=line \
            | tee "$QA_OUTPUT/playwright.log"

      - name: Capture functional desktop and mobile evidence
        shell: bash
        run: |
          set -euo pipefail
          npm run start -- -H 127.0.0.1 -p 3211 > "$QA_OUTPUT/server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:3211/bottleneck-atlas > /dev/null; then
              break
            fi
            if [[ "$attempt" = 90 ]]; then
              tail -n 200 "$QA_OUTPUT/server.log"
              exit 1
            fi
            sleep 1
          done

          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { writeFile } from 'node:fs/promises';
          import { chromium } from '@playwright/test';

          const output = process.env.QA_OUTPUT;
          const baseURL = 'http://127.0.0.1:3211';
          const browser = await chromium.launch();
          const evidence = { desktop: {}, mobile: {}, errors: [] };

          async function inspect(label, viewport) {
            const context = await browser.newContext({ viewport });
            await context.addCookies([{
              name: 'mt_walkthrough_seen',
              value: '1',
              url: baseURL,
              httpOnly: true,
              secure: false,
              sameSite: 'Lax',
            }]);
            const page = await context.newPage();
            page.on('pageerror', (error) => evidence.errors.push(`${label}: ${error.message}`));
            page.on('console', (message) => {
              if (message.type() === 'error') evidence.errors.push(`${label}: ${message.text()}`);
            });
            await page.goto(`${baseURL}/bottleneck-atlas`, { waitUntil: 'networkidle' });
            await page.locator('[data-atlas-offer]').selectOption('funding');
            await page.locator('[data-atlas-need]').selectOption('talent');
            await page.locator('[data-atlas-actor]').selectOption('funder');
            await page.getByRole('button', { name: 'Find matches' }).click();
            await page.locator('[data-atlas-match-results]').waitFor();

            const metrics = await page.evaluate(() => ({
              width: window.innerWidth,
              scrollWidth: Math.max(document.documentElement.scrollWidth, document.body?.scrollWidth ?? 0),
              resultCount: document.querySelectorAll('[data-atlas-match]').length,
              fieldCount: document.querySelectorAll('[data-atlas-field]').length,
              bodyTextLength: document.querySelector('main')?.innerText.length ?? 0,
            }));
            assert.equal(metrics.resultCount, 3);
            assert.equal(metrics.fieldCount, 18);
            assert.ok(metrics.bodyTextLength < 2600, `Main page is still too word-heavy: ${metrics.bodyTextLength}`);
            assert.ok(metrics.scrollWidth <= metrics.width + 1, `${label} overflow: ${JSON.stringify(metrics)}`);
            await page.screenshot({ path: `${output}/${label}.png`, fullPage: true });
            await context.close();
            return metrics;
          }

          evidence.desktop = await inspect('desktop', { width: 1440, height: 1000 });
          evidence.mobile = await inspect('mobile', { width: 390, height: 844 });
          assert.deepEqual(evidence.errors, []);
          await writeFile(`${output}/evidence.json`, `${JSON.stringify(evidence, null, 2)}\n`);
          await browser.close();
          NODE

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bottleneck-atlas-mvp-qa-${{ github.run_id }}-${{ github.sha }}
          path: ${{ env.QA_OUTPUT }}
          if-no-files-found: error
          retention-days: 30

# One-use QA workflow. Delete before opening the product PR.
