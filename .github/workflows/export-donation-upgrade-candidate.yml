name: Export Donation Upgrade candidate source

on:
  push:
    branches:
      - feature/donation-upgrade-approved-fallbacks-20260731
    paths:
      - .github/workflows/export-donation-upgrade-candidate.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/donation-upgrade-approved-fallbacks-20260731
          fetch-depth: 1
      - name: Package exact tracked tree
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar.gz --prefix=Website2/ HEAD > donation-upgrade-candidate.tar.gz
          sha256sum donation-upgrade-candidate.tar.gz > donation-upgrade-candidate.sha256
          git rev-parse HEAD > donation-upgrade-candidate.ref
      - uses: actions/upload-artifact@v4
        with:
          name: donation-upgrade-candidate-${{ github.run_id }}
          path: |
            donation-upgrade-candidate.tar.gz
            donation-upgrade-candidate.sha256
            donation-upgrade-candidate.ref
          if-no-files-found: error
          retention-days: 7
