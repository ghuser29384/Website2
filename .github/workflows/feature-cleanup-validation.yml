name: Validate remaining prototype retirement
on:
  push:
    branches: [cleanup/retire-prototype-controls-20260923]
    paths: [.github/workflows/feature-cleanup-validation.yml]
permissions:
  contents: write
concurrency:
  group: remaining-prototype-cleanup-20260923
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      BASE_SHA: bd69409104378993037d577e264b61ae2da1059a
      TARGET_BRANCH: cleanup/retire-prototype-controls-20260923
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replay immutable guarded cleanup then apply reviewed repairs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess,textwrap
          old=subprocess.check_output(['git','show','b00b629e77dc26e76e09abc634acc7f0ac409274:.github/workflows/feature-cleanup-validation.yml'],text=True)
          start='        run: |\n'; end='      - uses: actions/setup-node@v4\n'
          code=textwrap.dedent(old.split(start,1)[1].split(end,1)[0])
          assert 'Exact 31-path cleanup applied' in code
          subprocess.run(['bash','-euo','pipefail','-c',code],check=True)
          PY
          gh api repos/ghuser29384/Website2/git/blobs/9a48ad5900bc0fc86a9babe1df8f5149fd1964b3 > "$RUNNER_TEMP/repair-blob.json"
          python - <<'PY'
          import os,json,gzip,base64,hashlib,subprocess
          from pathlib import Path
          root=Path.cwd();temp=Path(os.environ['RUNNER_TEMP'])
          data=base64.b64decode(json.loads((temp/'repair-blob.json').read_text())['content'])
          assert hashlib.sha256(data).hexdigest()=='07785018717fbb727ec22ec021bf57122ce1a32d299dfc8e64c5677bc62cfcf7'
          repair=json.loads(gzip.decompress(data))
          def blob(p):
              b=(root/p).read_bytes();return hashlib.sha1(f'blob {len(b)}\0'.encode()+b).hexdigest()
          for p,want in repair['before'].items(): assert blob(p)==want,(p,blob(p),want)
          exec(compile(repair['script'].replace('/mnt/data/moraltrade-cleanup',str(root)),'<reviewed-render-and-unavailable-repair>','exec'),{})
          for p,want in repair['after'].items(): assert blob(p)==want,(p,blob(p),want)
          scope=json.loads((temp/'feature-evidence'/'scope.json').read_text())
          assert set(repair['after']).issubset(scope['after'])
          scope['after'].update(repair['after'])
          (temp/'feature-evidence'/'scope.json').write_text(json.dumps(scope,indent=2))
          subprocess.run(['git','add','--',*repair['after']],check=True)
          paths=subprocess.check_output(['git','diff','--cached','--name-only',os.environ['BASE_SHA']],text=True).splitlines()
          assert sorted(paths)==sorted(scope['after']) and len(paths)==31
          PY
          git diff --check "$BASE_SHA"
          git diff --stat "$BASE_SHA" | tee "$RUNNER_TEMP/feature-evidence/diff-stat.txt"
          git diff --binary "$BASE_SHA" > "$RUNNER_TEMP/feature-evidence/feature-cleanup.patch"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Focused behavior and source tests
        shell: bash
        run: |
          set -euo pipefail
          node --import tsx --test src/proxy.test.ts src/lib/marketplace-deals.test.ts src/lib/production-feature-cleanup.test.ts src/lib/site.test.ts src/lib/threshold-radar-route-contract.test.ts src/lib/trade-controls-route-contract.test.ts src/lib/live-discover-navigation.test.ts src/lib/retired-home-contract.test.ts 2>&1 | tee "$RUNNER_TEMP/feature-evidence/focused-tests.txt"
      - name: Full repository tests
        shell: bash
        run: |
          set -euo pipefail
          npm test 2>&1 | tee "$RUNNER_TEMP/feature-evidence/unit-tests.txt"
      - name: Repository lint and TypeScript
        shell: bash
        run: |
          set -euo pipefail
          npm run lint -- --quiet 2>&1 | tee "$RUNNER_TEMP/feature-evidence/lint.txt"
          npx tsc --noEmit --pretty false 2>&1 | tee "$RUNNER_TEMP/feature-evidence/typecheck.txt"
      - name: Production build without provider credentials
        shell: bash
        run: |
          set -euo pipefail
          npm run build 2>&1 | tee "$RUNNER_TEMP/feature-evidence/build.txt"
      - name: Focused rendered checks and screenshots
        shell: bash
        run: |
          set -euo pipefail
          npx playwright install --with-deps chromium
          npx playwright test --config=playwright.release.config.ts tests/production-feature-cleanup.spec.ts tests/returning-homepage.spec.ts tests/walkthrough.spec.ts tests/discover-home-visual-alignment.spec.ts --reporter=line --max-failures=5 2>&1 | tee "$RUNNER_TEMP/feature-evidence/focused-browser.txt"
          cp -r test-results "$RUNNER_TEMP/feature-evidence/focused-browser-results"
      - name: Complete configured browser release gate
        shell: bash
        run: |
          set -euo pipefail
          npm run test:e2e:release -- --reporter=line 2>&1 | tee "$RUNNER_TEMP/feature-evidence/full-browser.txt"
      - name: Publish validated product only to cleanup branch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check "$BASE_SHA"
          git diff --exit-code
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE_SHA"
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)" = "$GITHUB_SHA"
          test "$(git diff --cached --name-only "$BASE_SHA" | wc -l)" -eq 31
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Retire prototype controls and preserve real trade actions"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          git rev-parse HEAD > "$RUNNER_TEMP/feature-evidence/product-head.txt"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/feature-evidence/product-tree.txt"
      - name: Preserve checks and rendered evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prototype-cleanup-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/feature-evidence/
            test-results/
          retention-days: 7
          if-no-files-found: warn
