name: PR 212 individual-capacity QA controller

on:
  push:
    branches:
      - ops/pr212-individual-capacity-qa-controller-20260727
    paths:
      - .github/workflows/pr212-individual-capacity-qa-controller.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  pull-requests: read

jobs:
  control:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_BRANCH: feat/institutional-trade-system
      TARGET_WORKFLOW: institutional-trade-qa.yml
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Poll the exact PR head to a terminal QA state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ops

          current_head="$(gh api repos/${GITHUB_REPOSITORY}/pulls/212 --jq .head.sha)"
          run_id=""
          run_status=""
          run_conclusion=""

          for attempt in $(seq 1 100); do
            gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow "$TARGET_WORKFLOW" \
              --branch "$TARGET_BRANCH" \
              --limit 50 \
              --json databaseId,headSha,status,conclusion,createdAt,event,url \
              > /tmp/pr212-runs.json

            run_id="$(jq -r --arg head "$current_head" '[.[] | select(.headSha == $head)] | sort_by(.createdAt) | reverse | .[0].databaseId // empty' /tmp/pr212-runs.json)"
            run_status="$(jq -r --arg head "$current_head" '[.[] | select(.headSha == $head)] | sort_by(.createdAt) | reverse | .[0].status // empty' /tmp/pr212-runs.json)"
            run_conclusion="$(jq -r --arg head "$current_head" '[.[] | select(.headSha == $head)] | sort_by(.createdAt) | reverse | .[0].conclusion // empty' /tmp/pr212-runs.json)"

            if [[ -n "$run_id" && "$run_status" == "completed" ]]; then
              break
            fi
            sleep 12
          done

          if [[ -n "$run_id" ]]; then
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100" > /tmp/pr212-jobs.json
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" > /tmp/pr212-run.json
          else
            printf '%s\n' '{}' > /tmp/pr212-run.json
            printf '%s\n' '{"jobs":[]}' > /tmp/pr212-jobs.json
          fi

          jq -n \
            --arg generated_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg current_head "$current_head" \
            --arg target_branch "$TARGET_BRANCH" \
            --arg target_workflow "$TARGET_WORKFLOW" \
            --arg run_id "$run_id" \
            --arg run_status "$run_status" \
            --arg run_conclusion "$run_conclusion" \
            --slurpfile runs /tmp/pr212-runs.json \
            --slurpfile run /tmp/pr212-run.json \
            --slurpfile jobs /tmp/pr212-jobs.json \
            '{generated_at:$generated_at,current_head:$current_head,target_branch:$target_branch,target_workflow:$target_workflow,selected_run_id:$run_id,selected_run_status:$run_status,selected_run_conclusion:$run_conclusion,runs:$runs[0],run:$run[0],jobs:$jobs[0].jobs}' \
            > ops/pr212-individual-capacity-qa-controller-report.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops/pr212-individual-capacity-qa-controller-report.json
          git commit -m "Record PR 212 exact-head terminal QA state"
          git push origin HEAD:ops/pr212-individual-capacity-qa-controller-20260727

          if [[ -z "$run_id" || "$run_status" != "completed" ]]; then
            echo "Exact-head QA run did not reach a terminal state within the polling window." >&2
            exit 1
          fi

# Poll exact head fa1175ff30e1ccdcba0cb140aeccea3acabee6f6 after parser repair.
