name: PR868 isolated Preview public bindings
on:
  push:
    branches: [ops/pr868-preview-reconcile-20261001]
    paths: [.github/workflows/pr868-preview-qa-bindings-20261001.yml]
permissions:
  contents: read
jobs:
  bind:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Set absent Preview-only public QA defaults; preserve secrets, branch overrides and Production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = ghuser29384/Website2
          mkdir -p /tmp/pr868-bindings
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const project='prj_Em3j7Uj7RatX2R1ZYhla3XSHRde7',team='team_ySu6sF3Uho1E1GnJtCQPVEuJ';
          const base=`https://api.vercel.com/v10/projects/${project}/env?teamId=${team}`;
          const headers={Authorization:`Bearer ${process.env.VERCEL_TOKEN}`,'Content-Type':'application/json'};
          const wanted={NEXT_PUBLIC_SUPABASE_URL:'https://hvmxfjjbdcgjjudmthdz.supabase.co',NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:'sb_publishable_Sai3NlSapbvkmXa3EQrx9A_W9oNEYE8'};
          const read=async()=>{const r=await fetch(base+'&decrypt=false',{headers,signal:AbortSignal.timeout(15000)});if(!r.ok)throw new Error(`Metadata HTTP ${r.status}`);return (await r.json()).envs||[];};
          const before=await read();
          const summarize=v=>({key:v.key,id:v.id,type:v.type,target:v.target,gitBranch:v.gitBranch||null,updatedAt:v.updatedAt,value:v.value});
          const beforeIds=new Set(before.map(v=>v.id));
          const protectedBefore=JSON.stringify(before.map(summarize).sort((a,b)=>a.id.localeCompare(b.id)));
          for(const [key,value] of Object.entries(wanted)){
            const existing=before.filter(v=>v.key===key&&!v.gitBranch&&(v.target||[]).includes('preview'));
            if(existing.length)throw new Error(`Preview default ${key} already exists; refusing replacement`);
            const r=await fetch(base,{method:'POST',headers,body:JSON.stringify({key,value,type:'encrypted',target:['preview'],comment:'Owner-authorized PR868 Preview staging. Existing MoralTrade QA database only; Production and branch overrides unchanged.'}),signal:AbortSignal.timeout(15000)});
            if(!r.ok){
              const body=await r.json();
              const result={key,status:r.status,errorCode:body.error?.code,errorMessage:String(body.error?.message||'').slice(0,600),productionChanged:false};
              fs.writeFileSync('/tmp/pr868-bindings/result.json',JSON.stringify(result,null,2));throw new Error(JSON.stringify(result));
            }
          }
          const after=await read();
          const protectedAfter=JSON.stringify(after.filter(v=>beforeIds.has(v.id)).map(summarize).sort((a,b)=>a.id.localeCompare(b.id)));
          if(protectedBefore!==protectedAfter)throw new Error('An existing configuration entry changed during this operation; inspection required');
          const added=after.filter(v=>!beforeIds.has(v.id));
          if(added.length!==2||added.some(v=>!Object.hasOwn(wanted,v.key)||v.gitBranch||(v.target||[]).join(',')!=='preview'))throw new Error('Unexpected configuration delta; inspection required');
          const result={checkedAt:new Date().toISOString(),scope:'Preview defaults only',reason:'Vercel rejects branch-specific settings without Git integration; that integration remains unchanged.',addedPublicQaKeys:Object.keys(wanted),existingBranchOverridesUnchanged:true,secretValuesChanged:false,productionSettingsUnchanged:true,qaServiceCredentialValidity:'not_yet_verified'};
          fs.writeFileSync('/tmp/pr868-bindings/result.json',JSON.stringify(result,null,2));console.log(JSON.stringify(result,null,2));
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr868-qa-bindings-${{ github.run_id }}
          path: /tmp/pr868-bindings/result.json
          retention-days: 14
