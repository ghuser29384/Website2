name: Observe exact Direct Donation Upgrade preview release once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/observe-direct-upgrade-preview-once.yml

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: observe-direct-upgrade-preview-once
  cancel-in-progress: false

env:
  CONTROLLER_PATH: .github/workflows/observe-direct-upgrade-preview-once.yml
  EXPECTED_SHA: 1d296a3e94ef8a37bca256b266cdbb89ccc5e5bf
  NOT_BEFORE: 2026-08-02T07:10:00Z

jobs:
  observe:
    if: github.repository == 'ghuser29384/Website2' && github.actor == 'ghuser29384'
    runs-on: ubuntu-24.04
    timeout-minutes: 150

    steps:
      - name: Check out observer commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          token: ${{ github.token }}

      - name: Guard and remove one-time observer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          changed="$(git diff-tree --no-commit-id --name-only -r HEAD | sed '/^$/d')"
          test "$changed" = "$CONTROLLER_PATH"
          blob_sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/$CONTROLLER_PATH?ref=main" --jq .sha)"
          jq -n \
            --arg message 'Remove one-time Direct Donation Upgrade preview observer' \
            --arg sha "$blob_sha" \
            --arg branch main \
            '{message:$message,sha:$sha,branch:$branch}' \
            | gh api --method DELETE \
                "repos/$GITHUB_REPOSITORY/contents/$CONTROLLER_PATH" \
                --input - >/dev/null

      - name: Find and wait for the gated preview run
        id: run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_json=''
          for attempt in $(seq 1 120); do
            run_json="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow vercel-release.yml \
              --event workflow_dispatch \
              --limit 30 \
              --json databaseId,createdAt,status,conclusion,headSha,url \
              --jq "map(select(.createdAt >= \"$NOT_BEFORE\")) | sort_by(.createdAt) | last // empty")"
            if [[ -n "$run_json" && "$run_json" != 'null' ]]; then
              break
            fi
            sleep 5
          done
          test -n "$run_json"
          test "$run_json" != 'null'
          run_id="$(jq -r .databaseId <<<"$run_json")"
          run_url="$(jq -r .url <<<"$run_json")"
          test -n "$run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "run_url=$run_url" >> "$GITHUB_OUTPUT"
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status --interval 15

      - name: Record terminal result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id='${{ steps.run.outputs.run_id }}'
          run_url='${{ steps.run.outputs.run_url }}'
          if [[ -z "$run_id" ]]; then
            gh pr comment 418 --repo "$GITHUB_REPOSITORY" --body "No gated Vercel preview run could be resolved after the billing recovery. No preview claim is made. Observer: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            exit 1
          fi
          conclusion="$(gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)"
          if [[ "$conclusion" == 'success' ]]; then
            gh pr comment 418 --repo "$GITHUB_REPOSITORY" --body "The gated Vercel preview workflow completed successfully for exact Direct Donation Upgrade SHA \`$EXPECTED_SHA\`. Run: $run_url. Deployment-level inspection is still required before the preview gate is closed."
          else
            gh pr comment 418 --repo "$GITHUB_REPOSITORY" --body "The gated Vercel preview workflow concluded \`$conclusion\` for exact Direct Donation Upgrade SHA \`$EXPECTED_SHA\`. Run: $run_url. No preview-verified claim is made."
            exit 1
          fi
