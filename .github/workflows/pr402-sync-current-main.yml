name: PR 402 current-main release gates

on:
  push:
    branches:
      - fix/discover-pledge-clarity-20260801

permissions:
  contents: write

concurrency:
  group: pr402-current-main-release
  cancel-in-progress: false

env:
  TARGET_BRANCH: fix/discover-pledge-clarity-20260801
  EXPECTED_PARENT: 33c94d84d92c7cd50dd1766111fb1fd0c5b4e344
  CONTROLLER_PATH: .github/workflows/pr402-sync-current-main.yml

jobs:
  integrate-and-validate:
    if: >-
      github.repository == 'ghuser29384/Website2' &&
      github.ref_name == 'fix/discover-pledge-clarity-20260801'
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out exact feature head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Guard the one-shot controller
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'ghuser29384/Website2'
          test "$(git branch --show-current)" = "$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git diff-tree --no-commit-id --name-only -r HEAD)" = "$CONTROLLER_PATH"

      - name: Merge a pinned current main without committing
        id: base
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          base_sha="$(git rev-parse origin/main)"
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-commit --no-ff "$base_sha"
          rm "$CONTROLLER_PATH"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Repack and verify Discover
        shell: bash
        run: |
          set -euo pipefail
          node scripts/pack-discover-payload.mjs
          npm run verify:discover

      - name: Run focused and complete repository gates
        shell: bash
        env:
          NEXT_PUBLIC_SITE_URL: https://www.moraltrade.org
          VERCEL: '1'
          VERCEL_ENV: preview
        run: |
          set -euo pipefail
          node --import tsx --test src/discover-pledge-clarity.test.ts
          npm test
          npm run lint -- --quiet
          npm run build

      - name: Run rendered desktop and mobile pledge-clarity gates
        shell: bash
        run: |
          set -euo pipefail
          npx playwright install --with-deps chromium
          npx playwright test tests/discover-pledge-clarity.spec.ts --reporter=line
          test -s test-results/discover-pledge-clarity-desktop.png
          test -s test-results/discover-pledge-clarity-mobile.png

      - name: Verify pinned main stayed current
        shell: bash
        env:
          PINNED_BASE: ${{ steps.base.outputs.base_sha }}
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$PINNED_BASE"

      - name: Publish the exact integrated candidate
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          test ! -e "$CONTROLLER_PATH"
          git commit -m 'Merge current main into Discover pledge clarity'
          candidate_sha="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^2)" = "${{ steps.base.outputs.base_sha }}"
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')" = "$GITHUB_SHA"
          git push --force-with-lease="refs/heads/$TARGET_BRANCH:$GITHUB_SHA" origin "HEAD:refs/heads/$TARGET_BRANCH"
          echo "candidate_sha=$candidate_sha" >> "$GITHUB_OUTPUT"

      - name: Upload rendered evidence
        uses: actions/upload-artifact@v4
        with:
          name: pr402-current-main-${{ steps.publish.outputs.candidate_sha }}
          path: |
            test-results/discover-pledge-clarity-desktop.png
            test-results/discover-pledge-clarity-mobile.png
          if-no-files-found: error
          retention-days: 30
