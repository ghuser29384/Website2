name: Commitments live portfolio bootstrap gate

on:
  issue_comment:
    types:
      - created

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: commitments-live-portfolio-bootstrap-pr-395
  cancel-in-progress: false

jobs:
  verify-materialize:
    if: >-
      github.repository == 'ghuser29384/Website2' &&
      github.event.issue.pull_request &&
      github.event.issue.number == 395 &&
      github.event.comment.body == '/materialize-commitments b85cef92a6ed884aa05bf0672c4dff4957f37444'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EXPECTED_HEAD: b85cef92a6ed884aa05bf0672c4dff4957f37444
      HEAD_BRANCH: feature/commitments-live-portfolio-20260731
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/commitments-live-portfolio-20260731
          fetch-depth: 0
          persist-credentials: true

      - name: Guard exact repository and head
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "ghuser29384/Website2"
          test "$(git branch --show-current)" = "$HEAD_BRANCH"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          gh pr comment 395 --body "Commitments bootstrap started for exact head \`$EXPECTED_HEAD\`. Production is unchanged."

      - name: Materialize and validate reviewed source
        run: node scripts/materialize-commitments-portfolio.mjs

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Run focused Commitments contracts
        shell: bash
        run: |
          set -o pipefail
          node --import tsx --test src/commitments-portfolio-wiring.test.ts 2>&1 | tee commitments-focused-tests.log

      - name: Run changed-source ESLint
        shell: bash
        run: |
          set -o pipefail
          npx eslint \
            src/app/commitments/page.tsx \
            src/components/commitments/commitments-local-greeting.tsx \
            src/components/commitments/impact-share-button.tsx \
            src/lib/commitments-portfolio.ts \
            src/commitments-portfolio-wiring.test.ts \
            2>&1 | tee commitments-focused-lint.log

      - name: Run complete repository tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee repository-tests.log

      - name: Run complete repository lint
        shell: bash
        run: |
          set -o pipefail
          npm run lint -- --quiet 2>&1 | tee repository-lint.log

      - name: Run TypeScript check
        shell: bash
        run: |
          set -o pipefail
          npx tsc --noEmit 2>&1 | tee repository-typecheck.log

      - name: Build production application
        shell: bash
        env:
          NEXT_PUBLIC_SITE_URL: https://www.moraltrade.org
          VERCEL: "1"
          VERCEL_ENV: preview
        run: |
          set -o pipefail
          npm run build 2>&1 | tee production-build.log

      - name: Check exact diff and synthetic fixture exclusion
        shell: bash
        run: |
          set -euo pipefail
          git diff --check "$EXPECTED_HEAD" -- 2>&1 | tee diff-check.log
          ! grep -R --line-number -E '\$18,760|Counteroffer received|Salary-gap pool at 81%|Factory-farming redirect' \
            src/app/commitments src/components/commitments src/lib/commitments-portfolio.ts

      - name: Upload gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: commitments-live-portfolio-bootstrap-${{ github.run_id }}
          path: |
            commitments-focused-tests.log
            commitments-focused-lint.log
            repository-tests.log
            repository-lint.log
            repository-typecheck.log
            production-build.log
            diff-check.log
          if-no-files-found: warn
          retention-days: 30

      - name: Publish verified product source only
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/commitments-live-portfolio-payload
          rm -f .github/workflows/commitments-live-portfolio-materialize.yml
          rm -f .github/workflows/commitments-live-portfolio-pr.yml
          rm -f scripts/materialize-commitments-portfolio.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/app/commitments/commitments.module.css \
            src/app/commitments/page.tsx \
            src/components/commitments/commitments-local-greeting.tsx \
            src/components/commitments/impact-share-button.tsx \
            src/lib/commitments-portfolio.ts \
            src/commitments-portfolio-wiring.test.ts
          git add -A -- \
            .github/commitments-live-portfolio-payload \
            .github/workflows/commitments-live-portfolio-materialize.yml \
            .github/workflows/commitments-live-portfolio-pr.yml \
            scripts/materialize-commitments-portfolio.mjs
          while IFS= read -r staged; do
            case "$staged" in
              .github/commitments-live-portfolio-payload/*|\
              .github/workflows/commitments-live-portfolio-materialize.yml|\
              .github/workflows/commitments-live-portfolio-pr.yml|\
              scripts/materialize-commitments-portfolio.mjs|\
              src/app/commitments/commitments.module.css|\
              src/app/commitments/page.tsx|\
              src/components/commitments/commitments-local-greeting.tsx|\
              src/components/commitments/impact-share-button.tsx|\
              src/lib/commitments-portfolio.ts|\
              src/commitments-portfolio-wiring.test.ts) ;;
              *) echo "Unexpected staged file: $staged" >&2; exit 1 ;;
            esac
          done < <(git diff --cached --name-only)
          test -n "$(git diff --cached --name-only)"
          ! git diff --cached --name-only | grep -E '\.log$'
          git diff --cached --check
          git commit -m "Build live Commitments portfolio and impact ledger"
          git push origin HEAD:"$HEAD_BRANCH"
          new_head="$(git rev-parse HEAD)"
          gh pr comment 395 --body "Commitments source materialized and pushed as \`$new_head\`. Focused contracts, complete tests, complete lint, TypeScript, production build, and diff checks passed in this run. This is not a production-deployment claim."

      - name: Report bootstrap failure
        if: failure()
        shell: bash
        run: |
          gh pr comment 395 --body "Commitments bootstrap failed for exact head \`$EXPECTED_HEAD\`. No product source was published by this run, and production is unchanged. Inspect run \`${{ github.run_id }}\` before retrying."
