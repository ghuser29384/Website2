name: Commitments live portfolio bootstrap gate

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - ".github/commitments-live-portfolio-payload/**"
      - ".github/workflows/commitments-live-portfolio-materialize.yml"
      - ".github/workflows/commitments-live-portfolio-pr.yml"
      - "src/app/commitments/**"
      - "src/components/commitments/**"
      - "src/lib/commitments-portfolio.ts"
      - "src/commitments-portfolio-wiring.test.ts"

permissions:
  contents: write

concurrency:
  group: commitments-live-portfolio-bootstrap-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify-materialize:
    if: >-
      github.repository == 'ghuser29384/Website2' &&
      github.event.pull_request.number == 395 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feature/commitments-live-portfolio-20260731'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
    steps:
      - name: Check out exact pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Guard exact repository and head
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "ghuser29384/Website2"
          test "$HEAD_BRANCH" = "feature/commitments-live-portfolio-20260731"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Detect staged payload
        id: staged
        shell: bash
        run: |
          set -euo pipefail
          count="$(find .github/commitments-live-portfolio-payload -maxdepth 1 -type f -name 'part-*' 2>/dev/null | wc -l | tr -d ' ')"
          if [[ "$count" == "5" ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          elif [[ "$count" == "0" ]]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "Expected zero or five payload parts, found $count" >&2
            exit 1
          fi

      - name: Reconstruct and validate reviewed product payload
        if: steps.staged.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t parts < <(find .github/commitments-live-portfolio-payload -maxdepth 1 -type f -name 'part-*' | sort)
          cat "${parts[@]}" | tr -d '\r\n' > /tmp/commitments-live-portfolio.b64
          python3 - <<'PY'
          from pathlib import Path

          path = Path('/tmp/commitments-live-portfolio.b64')
          payload = path.read_text()
          if len(payload) != 25_532:
              raise SystemExit(f'unexpected payload length: {len(payload)}')
          if payload[9745] != 's':
              raise SystemExit(f'unexpected staged character at 9745: {payload[9745]!r}')
          payload = payload[:9745] + 'k' + payload[9746:]
          path.write_text(payload)
          PY
          base64 --decode /tmp/commitments-live-portfolio.b64 > /tmp/commitments-live-portfolio.tar.gz
          echo "a8425f53cc465562a2ddf6c39edc395a3f8417bbc98a876d4e5352ea489a8be8  /tmp/commitments-live-portfolio.tar.gz" | sha256sum --check
          gzip --test /tmp/commitments-live-portfolio.tar.gz
          tar -tzf /tmp/commitments-live-portfolio.tar.gz | sort > /tmp/payload-members.txt
          cat > /tmp/expected-members.txt <<'EOF'
          src/app/commitments/commitments.module.css
          src/app/commitments/page.tsx
          src/components/commitments/commitments-local-greeting.tsx
          src/components/commitments/impact-share-button.tsx
          src/lib/commitments-portfolio.ts
          EOF
          diff -u /tmp/expected-members.txt /tmp/payload-members.txt
          while IFS= read -r member; do
            case "$member" in
              /*|*..*) echo "Unsafe archive member: $member" >&2; exit 1 ;;
            esac
          done < /tmp/payload-members.txt
          tar -xzf /tmp/commitments-live-portfolio.tar.gz -C .

      - name: Repair deterministic and visitor-local date rendering
        if: steps.staged.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/app/commitments/page.tsx')
          text = path.read_text()

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one source match, found {count}: {old[:100]!r}')
              text = text.replace(old, new)

          replace_once(
              'import { SiteTopbar } from "@/components/layout/site-topbar";\n',
              'import { SiteTopbar } from "@/components/layout/site-topbar";\n'
              'import { LocalDateTime } from "@/components/ui/local-date-time";\n',
          )
          replace_once(
              '<time dateTime={event.at}>{new Intl.DateTimeFormat(undefined, { dateStyle: "medium", timeStyle: "short" }).format(new Date(event.at))}</time>',
              '<LocalDateTime value={event.at} fallback="Date unavailable" options={{ dateStyle: "medium", timeStyle: "short" }} />',
          )
          replace_once(
              '''          {items.map((item) => {
            const date = new Date(item.at);
            return (
              <li key={item.id} data-action={item.requiresUserAction ? "true" : "false"}>
                <time dateTime={item.at}><strong>{new Intl.DateTimeFormat(undefined, { month: "short", day: "numeric" }).format(date)}</strong><span>{new Intl.DateTimeFormat(undefined, { year: "numeric" }).format(date)}</span></time>
                <div><strong>{item.label}</strong><p>{item.detail}</p></div>
                <Link href={item.href}>View →</Link>
              </li>
            );
          })}''',
              '''          {items.map((item) => (
            <li key={item.id} data-action={item.requiresUserAction ? "true" : "false"}>
              <LocalDateTime
                value={item.at}
                fallback="Date unavailable"
                options={{ month: "short", day: "numeric", year: "numeric" }}
              />
              <div><strong>{item.label}</strong><p>{item.detail}</p></div>
              <Link href={item.href}>View →</Link>
            </li>
          ))}''',
          )
          replace_once(
              '''  const activatedThisMonth = activeRecords.filter((record) => {
    const created = new Date(record.createdAt);
    const now = new Date(data?.generatedAt ?? Date.now());
    return record.lifecycle !== "conditional" && created.getUTCFullYear() === now.getUTCFullYear() && created.getUTCMonth() === now.getUTCMonth();
  });''',
              '''  const generatedAt = data ? new Date(data.generatedAt) : null;
  const activatedThisMonth = generatedAt
    ? activeRecords.filter((record) => {
        const created = new Date(record.createdAt);
        return (
          record.lifecycle !== "conditional" &&
          created.getUTCFullYear() === generatedAt.getUTCFullYear() &&
          created.getUTCMonth() === generatedAt.getUTCMonth()
        );
      })
    : [];''',
          )
          replace_once(
              '<time dateTime={event.at}>{new Intl.DateTimeFormat(undefined, { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }).format(new Date(event.at))}</time>',
              '''<LocalDateTime
                              value={event.at}
                              fallback="Date unavailable"
                              options={{ month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }}
                            />''',
          )

          if 'Date.now()' in text:
              raise SystemExit('Date.now remained in the Commitments Server Component')
          if 'Intl.DateTimeFormat' in text:
              raise SystemExit('server-side visitor date formatting remained in Commitments')
          if text.count('LocalDateTime') != 4:
              raise SystemExit(f'unexpected LocalDateTime occurrence count: {text.count("LocalDateTime")}')

          path.write_text(text)
          PY

      - name: Write focused source and accounting contracts
        shell: bash
        run: |
          set -euo pipefail
          cat > src/commitments-portfolio-wiring.test.ts <<'EOF'
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          import test from "node:test";

          const page = readFileSync("src/app/commitments/page.tsx", "utf8");
          const model = readFileSync("src/lib/commitments-portfolio.ts", "utf8");
          const share = readFileSync("src/components/commitments/impact-share-button.tsx", "utf8");

          test("Commitments renders a live, cross-mechanism portfolio instead of the visual fixture", () => {
            for (const required of [
              "Additional resources you caused.",
              "Portfolio",
              "Ledger",
              "Completed",
              "Calendar",
              "If everything succeeds",
              "You committed",
              "Total coordinated",
              "Additional resources attributed",
            ]) {
              assert.ok(page.includes(required), `missing required production label: ${required}`);
            }

            for (const synthetic of [
              "$540",
              "$18,760",
              "Counteroffer received",
              "Salary-gap pool at 81%",
              "Factory-farming redirect",
            ]) {
              assert.equal(page.includes(synthetic), false, `visual-fixture value leaked into production source: ${synthetic}`);
            }
          });

          test("Commitments data is participant-scoped, real-record based, and noncustodial", () => {
            for (const required of [
              "listAgreementsForUser",
              "listCartItems",
              "listProfileOffers",
              "loadMpgfParticipantState",
              "donation_offset_matches",
              "attributedAdditionalResources",
              "expectedMarginalEffect",
            ]) {
              assert.ok(model.includes(required), `missing canonical data/accounting integration: ${required}`);
            }

            for (const forbidden of [
              "createServiceClient",
              "SUPABASE_SERVICE_ROLE_KEY",
              "5% wallet bonus",
              "wallet_balance",
              "demo commitments",
            ]) {
              assert.equal(model.includes(forbidden), false, `forbidden production dependency or synthetic fallback: ${forbidden}`);
            }

            assert.ok(share.includes("navigator.share"));
            assert.ok(share.includes("navigator.clipboard"));
          });

          test("Commitments dates are deterministic on the server and local to the visitor", () => {
            assert.ok(page.includes("LocalDateTime"));
            assert.equal(page.includes("Intl.DateTimeFormat"), false);
            assert.equal(page.includes("Date.now()"), false);
          });
          EOF

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Run focused Commitments contracts
        shell: bash
        run: |
          set -o pipefail
          node --import tsx --test src/commitments-portfolio-wiring.test.ts 2>&1 | tee commitments-focused-tests.log

      - name: Run changed-source ESLint
        shell: bash
        run: |
          set -o pipefail
          npx eslint \
            src/app/commitments/page.tsx \
            src/components/commitments/commitments-local-greeting.tsx \
            src/components/commitments/impact-share-button.tsx \
            src/lib/commitments-portfolio.ts \
            src/commitments-portfolio-wiring.test.ts \
            2>&1 | tee commitments-focused-lint.log

      - name: Run complete repository tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee repository-tests.log

      - name: Run complete repository lint
        shell: bash
        run: |
          set -o pipefail
          npm run lint -- --quiet 2>&1 | tee repository-lint.log

      - name: Run TypeScript check
        shell: bash
        run: |
          set -o pipefail
          npx tsc --noEmit 2>&1 | tee repository-typecheck.log

      - name: Build production application
        shell: bash
        env:
          NEXT_PUBLIC_SITE_URL: https://www.moraltrade.org
          VERCEL: "1"
          VERCEL_ENV: preview
        run: |
          set -o pipefail
          npm run build 2>&1 | tee production-build.log

      - name: Check exact diff and synthetic fixture exclusion
        shell: bash
        run: |
          set -euo pipefail
          git diff --check "$EXPECTED_HEAD" -- 2>&1 | tee diff-check.log
          ! grep -R --line-number -E '\$18,760|Counteroffer received|Salary-gap pool at 81%|Factory-farming redirect' \
            src/app/commitments src/components/commitments src/lib/commitments-portfolio.ts

      - name: Publish verified product source and remove staging machinery
        if: steps.staged.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/commitments-live-portfolio-payload
          rm -f .github/workflows/commitments-live-portfolio-materialize.yml
          rm -f .github/workflows/commitments-live-portfolio-pr.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/app/commitments/commitments.module.css \
            src/app/commitments/page.tsx \
            src/components/commitments/commitments-local-greeting.tsx \
            src/components/commitments/impact-share-button.tsx \
            src/lib/commitments-portfolio.ts \
            src/commitments-portfolio-wiring.test.ts
          git add -A -- \
            .github/commitments-live-portfolio-payload \
            .github/workflows/commitments-live-portfolio-materialize.yml \
            .github/workflows/commitments-live-portfolio-pr.yml
          while IFS= read -r staged; do
            case "$staged" in
              .github/commitments-live-portfolio-payload/*|\
              .github/workflows/commitments-live-portfolio-materialize.yml|\
              .github/workflows/commitments-live-portfolio-pr.yml|\
              src/app/commitments/commitments.module.css|\
              src/app/commitments/page.tsx|\
              src/components/commitments/commitments-local-greeting.tsx|\
              src/components/commitments/impact-share-button.tsx|\
              src/lib/commitments-portfolio.ts|\
              src/commitments-portfolio-wiring.test.ts) ;;
              *) echo "Unexpected staged file: $staged" >&2; exit 1 ;;
            esac
          done < <(git diff --cached --name-only)
          test -n "$(git diff --cached --name-only)"
          ! git diff --cached --name-only | grep -E '\.log$'
          git diff --cached --check
          git commit -m "Build live Commitments portfolio and impact ledger"
          git push origin HEAD:"$HEAD_BRANCH"
