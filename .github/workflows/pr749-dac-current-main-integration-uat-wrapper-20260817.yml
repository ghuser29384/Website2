name: PR 749 fresh-current-main DAC integration protected Preview owner UAT wrapper 20260817

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/pr749-dac-current-main-integration-uat-wrapper-20260817.yml"
      - "ops/pr749-run-trusted-controller.py"
      - "ops/pr689-uat702/**"

concurrency:
  group: mpgf-dac-product-lifecycle-shared-qa
  cancel-in-progress: false

permissions:
  contents: read

env:
  CANDIDATE_HEAD_SHA: 0d9c997cee8e251818d74fa96ea8321c6489cac8
  CONTROLLER_BRANCH: ops/pr749-dac-current-main-integration-uat-20260817
  EXPECTED_QA_REF: hvmxfjjbdcgjjudmthdz
  FORBIDDEN_PROD_REF: jnpoxvalyjtdghnperyu

jobs:
  owner-uat:
    name: Exact candidate protected Preview, owner UAT, logs, and zero residue
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Check out the one-use controller
        uses: actions/checkout@v4
        with:
          path: controller
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Check out the exact application candidate
        uses: actions/checkout@v4
        with:
          path: app
          fetch-depth: 0
          ref: ${{ env.CANDIDATE_HEAD_SHA }}

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Prepare the trusted-controller runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence app/test-results
          python3 -m pip install --user --disable-pip-version-check PyYAML==6.0.2
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Reconcile the reviewed terminal schema on exact isolated QA
        shell: bash
        env:
          QA_SUPABASE_DB_URL: ${{ secrets.QA_SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          test -n "$QA_SUPABASE_DB_URL"
          case "$QA_SUPABASE_DB_URL" in
            *"$EXPECTED_QA_REF"*) ;;
            *) echo "QA database URL does not identify the exact isolated-QA project." >&2; exit 1 ;;
          esac
          case "$QA_SUPABASE_DB_URL" in
            *"$FORBIDDEN_PROD_REF"*) echo "Production database reference detected." >&2; exit 1 ;;
            *) ;;
          esac

          ssl_active="$(psql "$QA_SUPABASE_DB_URL" --no-psqlrc --set ON_ERROR_STOP=1 --tuples-only --no-align \
            --command "select coalesce((select ssl::text from pg_stat_ssl where pid = pg_backend_pid()), 'false');")"
          test "$ssl_active" = "true"

          cd app
          echo "a19653e57a20dff8d01e1dd54b4b77304fe0712fe3356820953945e7b9999cd2  supabase/migrations/20260812073000_mpgf_dac_terminal_event_constraint_reconciliation.sql" \
            | sha256sum --check --strict
          echo "d8dc2a55840425357c8859b87d26fba0415bb1a50c8e739518a88b9686142cbb  supabase/migrations/20260812074500_mpgf_dac_terminal_schema_reconciliation.sql" \
            | sha256sum --check --strict

          for migration in \
            supabase/migrations/20260812073000_mpgf_dac_terminal_event_constraint_reconciliation.sql \
            supabase/migrations/20260812074500_mpgf_dac_terminal_schema_reconciliation.sql
          do
            test "$(sed -n '/^[[:space:]]*$/d; p; q' "$migration" | tr '[:upper:]' '[:lower:]')" = "begin;"
            test "$(awk 'NF { line=$0 } END { print line }' "$migration" | tr '[:upper:]' '[:lower:]')" = "commit;"
            psql "$QA_SUPABASE_DB_URL" --no-psqlrc --set ON_ERROR_STOP=1 --file "$migration"
          done

          psql "$QA_SUPABASE_DB_URL" --no-psqlrc --set ON_ERROR_STOP=1 \
            --file ../controller/ops/pr689-uat702/verify-preexisting-dac-schema.sql \
            > ../evidence/wrapper-terminal-schema-reconciliation-verification.txt
          sha256sum \
            supabase/migrations/20260812073000_mpgf_dac_terminal_event_constraint_reconciliation.sql \
            supabase/migrations/20260812074500_mpgf_dac_terminal_schema_reconciliation.sql \
            > ../evidence/wrapper-terminal-schema-reconciliation.sha256
          printf 'target_ref=%s\nproduction_ref_excluded=true\ntls=true\nreconciliation_migrations_applied=2\nresult=passed\n' \
            "$EXPECTED_QA_REF" > ../evidence/wrapper-terminal-schema-reconciliation.txt

      - name: Execute the transformed trusted controller
        id: controller
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          QA_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.QA_SUPABASE_PUBLISHABLE_KEY }}
          QA_SUPABASE_DB_URL: ${{ secrets.QA_SUPABASE_DB_URL }}
          QA_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.QA_SUPABASE_SERVICE_ROLE_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          python3 controller/ops/pr749-run-trusted-controller.py 2>&1 \
            | tee evidence/controller-runner.log

      - name: Upload redacted owner-UAT evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr749-dac-current-main-integration-owner-uat-${{ github.run_id }}-${{ env.CANDIDATE_HEAD_SHA }}
          path: |
            evidence
            app/test-results
          if-no-files-found: error
          retention-days: 30
