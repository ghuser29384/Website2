name: Get Started choice router QA

on:
  push:
    branches: [ops/get-started-choice-router-20260926]
    paths:
      - .github/workflows/get-started-choice-router-qa.yml

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      candidate_sha: ${{ steps.candidate.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d6abac8f641e0e303fe7a9d3498dfb5627f88540
          path: transport
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: a0f79791ff7a439c0f0c85554c428fce65000eb5
          path: candidate
          fetch-depth: 1
      - name: Apply the exact scoped Get Started change
        id: candidate
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = ghuser29384/Website2
          test "$(git rev-parse HEAD)" = a0f79791ff7a439c0f0c85554c428fce65000eb5
          test -z "$(git ls-remote origin refs/heads/fix/get-started-choice-router-20260926)"
          python ../transport/.github/get-started-choice-router-edit.py "$PWD"
          git add -- \
            src/app/start/page.tsx \
            src/app/start/start.module.css \
            src/lib/start-entry-router.test.ts \
            src/lib/action-first-positioning.test.ts \
            src/lib/public-route-smoke.test.ts \
            tests/start-entry-router.spec.ts \
            tests/pilot-copy.spec.ts \
            tests/meta-explanatory-copy.spec.ts \
            tests/sitewide-canonical-visual-fidelity.spec.ts
          test "$(git diff --cached --name-only | wc -l)" -eq 9
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Route Get Started visitors by familiarity'
          git push origin HEAD:refs/heads/fix/get-started-choice-router-20260926
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  qa:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      EXPECTED_SHA: ${{ needs.prepare.outputs.candidate_sha }}
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3210
      SITE_URL: http://127.0.0.1:3210
      VERCEL: '1'
      PLAYWRIGHT_HTML_OPEN: never
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.candidate_sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Record exact source identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          mkdir -p start-choice-evidence
          git rev-parse HEAD > start-choice-evidence/commit.txt
          git rev-parse HEAD^{tree} > start-choice-evidence/tree.txt
          git diff HEAD^ --check
          git diff HEAD^ --stat > start-choice-evidence/diff-stat.txt
          git diff HEAD^ --binary > start-choice-evidence/source.patch
      - name: Install locked dependencies
        run: npm ci
      - name: Focused source contracts
        run: |
          set -euo pipefail
          node --import tsx --test \
            src/lib/start-entry-router.test.ts \
            src/lib/action-first-positioning.test.ts \
            src/lib/public-route-smoke.test.ts \
            | tee start-choice-evidence/focused-unit.log
      - name: Complete repository tests
        run: |
          set -euo pipefail
          npm test | tee start-choice-evidence/unit.log
      - name: Complete lint and typecheck
        run: |
          set -euo pipefail
          npm run lint -- --quiet 2>&1 | tee start-choice-evidence/lint.log
          npx tsc --noEmit 2>&1 | tee start-choice-evidence/types.log
      - name: Production build
        run: |
          set -euo pipefail
          npm run build 2>&1 | tee start-choice-evidence/build.log
      - name: Install locked Chromium
        run: npx playwright install --with-deps chromium
      - name: Render the decision page and affected routes
        run: |
          set -euo pipefail
          npx playwright test \
            tests/start-entry-router.spec.ts \
            tests/sitewide-canonical-visual-fidelity.spec.ts \
            tests/pilot-copy.spec.ts \
            tests/meta-explanatory-copy.spec.ts \
            --workers=1 --reporter=line \
            2>&1 | tee start-choice-evidence/browser.log
          mkdir -p start-choice-evidence/screenshots
          find test-results -name '*.png' -exec cp '{}' start-choice-evidence/screenshots/ ';'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: get-started-choice-${{ needs.prepare.outputs.candidate_sha }}
          path: |
            start-choice-evidence
            test-results
          retention-days: 7
