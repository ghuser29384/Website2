name: Temporary PR 743 root-repaired exact-head QA

on:
  push:
    branches:
      - ops/pr743-protected-preview-20260817
    paths:
      - .github/workflows/pr743-root-repaired-exact-head-qa-20260817.yml

permissions:
  contents: read

concurrency:
  group: pr743-root-repaired-exact-head-qa
  cancel-in-progress: false

jobs:
  exact-head-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      EXPECTED_BASE_SHA: 7e993158363710e5fe2c3eaa1cbccdb5cd56c235
      EXPECTED_HEAD_SHA: 4f2c5d1c251b5a23c16c0a2f7d4760daf29977c0
      EXPECTED_HEAD_TREE: 9d27fd0506c465e738e2d2ed71cda9ab3072f39f
      SITE_URL: https://www.moraltrade.org

    steps:
      - name: Check out immutable repaired candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          fetch-depth: 0

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Prove exact identity and eleven-file scope
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "ghuser29384/Website2"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_HEAD_TREE"
          test "$(git merge-base "$EXPECTED_BASE_SHA" HEAD)" = "$EXPECTED_BASE_SHA"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$EXPECTED_BASE_SHA"
          test "$(git ls-remote origin refs/heads/integration/pr665-current-main-20260817 | awk '{print $1}')" = "$EXPECTED_HEAD_SHA"
          expected="$(printf '%s\n' \
            playwright.auth-resolution.config.ts \
            scripts/auth-resolution-supabase.mjs \
            src/app/profile/page.tsx \
            src/auth-resolution-wiring.test.ts \
            src/components/core-trade/trade-draft-workbench.tsx \
            src/components/marketplace/marketplace-components.tsx \
            src/lib/app-data.ts \
            src/lib/auth-resolution.test.ts \
            src/lib/auth-resolution.ts \
            src/lib/supabase/server.ts \
            tests/auth-resolution-delayed.auth.ts \
            | sort)"
          actual="$(git diff --name-only "$EXPECTED_BASE_SHA"...HEAD | sort)"
          test "$actual" = "$expected"
          {
            printf 'base=%s\n' "$EXPECTED_BASE_SHA"
            printf 'head=%s\n' "$EXPECTED_HEAD_SHA"
            printf 'tree=%s\n' "$EXPECTED_HEAD_TREE"
            printf 'files=%s\n' "$(printf '%s\n' "$actual" | wc -l | tr -d ' ')"
          } | tee pr743-root-repaired-exact-head.txt
          git diff --check "$EXPECTED_BASE_SHA"...HEAD

      - name: Install exact dependencies
        run: npm ci

      - name: Run syntax and focused contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/auth-resolution-supabase.mjs
          node --import tsx --test \
            src/lib/auth-resolution.test.ts \
            src/auth-resolution-wiring.test.ts \
            src/proxy.test.ts \
            src/feed-learned-ranking-release-gate.test.ts \
            src/lib/feed/learned-ranking-readiness.test.ts \
            | tee pr743-focused-tests.log
          npx eslint \
            playwright.auth-resolution.config.ts \
            scripts/auth-resolution-supabase.mjs \
            src/app/profile/page.tsx \
            src/auth-resolution-wiring.test.ts \
            src/components/core-trade/trade-draft-workbench.tsx \
            src/components/marketplace/marketplace-components.tsx \
            src/feed-learned-ranking-release-gate.test.ts \
            src/lib/app-data.ts \
            src/lib/auth-resolution.test.ts \
            src/lib/auth-resolution.ts \
            src/lib/feed/learned-ranking-readiness.test.ts \
            src/lib/feed/learned-ranking-readiness.ts \
            src/lib/supabase/server.ts \
            tests/auth-resolution-delayed.auth.ts \
            | tee pr743-focused-lint.log

      - name: Run complete repository gates without live Supabase
        shell: bash
        run: |
          set -euo pipefail
          test -z "${NEXT_PUBLIC_SUPABASE_URL:-}"
          test -z "${SUPABASE_SERVICE_ROLE_KEY:-}"
          npm test | tee pr743-repository-tests.log
          npm run lint -- --quiet | tee pr743-repository-lint.log
          npx tsc --noEmit --pretty false | tee pr743-typescript.log
          npm run verify:crawlability | tee pr743-crawlability.log
          git diff --check
          git diff --check "$EXPECTED_BASE_SHA"...HEAD

      - name: Build exact candidate against local synthetic Auth target
        shell: bash
        env:
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3211
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: auth-resolution-public-fixture
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:3231
          SUPABASE_SERVICE_ROLE_KEY: auth-resolution-service-fixture
          VERCEL: "1"
          VERCEL_ENV: preview
        run: |
          set -euo pipefail
          npm run build | tee pr743-build.log

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run deterministic Auth desktop and exact-mobile browser QA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p pr743-root-repaired-evidence
          PLAYWRIGHT_JSON_OUTPUT_NAME=pr743-root-repaired-evidence/playwright.json \
            npx playwright test \
              --config=playwright.auth-resolution.config.ts \
              --reporter=line,json \
              | tee pr743-playwright.log

      - name: Scan retained evidence for credential material
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee pr743-privacy-scan.log
          from pathlib import Path
          import re
          roots = [Path("pr743-root-repaired-evidence"), Path("test-results/auth-resolution")]
          files = [path for root in roots if root.exists() for path in root.rglob("*") if path.is_file() and path.stat().st_size <= 25_000_000]
          patterns = {
              "jwt": re.compile(rb"eyJ[A-Za-z0-9_-]{12,}\.[A-Za-z0-9_-]{12,}\.[A-Za-z0-9_-]{8,}"),
              "bearer": re.compile(rb"Bearer\s+[A-Za-z0-9._~+/-]{20,}", re.I),
              "refresh_token": re.compile(rb"refresh[_-]?token[\"'=:\s]+[A-Za-z0-9._~+/-]{16,}", re.I),
              "supabase_cookie": re.compile(rb"sb-[a-z0-9-]+-auth-token", re.I),
              "service_role": re.compile(rb"sb_(?:secret|service_role)_[A-Za-z0-9_-]{12,}", re.I),
              "private_key": re.compile(rb"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"),
              "database_url": re.compile(rb"postgres(?:ql)?://[^\s\"']+", re.I),
          }
          findings = []
          for path in files:
              data = path.read_bytes()
              for label, pattern in patterns.items():
                  if pattern.search(data): findings.append((label, str(path)))
          print({"filesScanned": len(files), "findings": findings})
          if findings: raise SystemExit("Credential-like material found in retained exact-head evidence.")
          PY

      - name: Upload immutable exact-head evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr743-root-repaired-exact-head-${{ env.EXPECTED_HEAD_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            pr743-*.log
            pr743-root-repaired-exact-head.txt
            pr743-root-repaired-evidence
            test-results/auth-resolution
