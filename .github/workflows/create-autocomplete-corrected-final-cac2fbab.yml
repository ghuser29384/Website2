name: Create autocomplete corrected final gates cac2fbab

on:
  pull_request:
    paths:
      - ".github/workflows/create-autocomplete-corrected-final-cac2fbab.yml"

permissions:
  actions: read
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: create-autocomplete-corrected-final-cac2fbab
  cancel-in-progress: true

env:
  BASE_SHA: bb3b0e4608b7282aecc9d1fe11b5cb310c409347
  CANDIDATE_SHA: cac2fbab65854c24c138bb022789fde595d3b703
  PRODUCT_PR: "585"
  CONTROLLER_BRANCH: qa/create-autocomplete-corrected-final-cac2fbab
  CONTROLLER_PATH: .github/workflows/create-autocomplete-corrected-final-cac2fbab.yml
  STATUS_CONTEXT: QA / Create autocomplete corrected exact gates cac2fbab
  EVIDENCE_DIR: create-autocomplete-corrected-final-cac2fbab
  TARGET_TEST: tests/exact-live-autocomplete.spec.ts
  NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3210
  SITE_URL: http://127.0.0.1:3210
  PLAYWRIGHT_HTML_OPEN: never
  CI: "1"

jobs:
  exact-gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 210

    steps:
      - name: Mark immutable candidate pending
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${CANDIDATE_SHA}" \
            -f state=pending \
            -f context="$STATUS_CONTEXT" \
            -f description="Running corrected Create autocomplete exact gates" \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Guard immutable base, controller scope, and product scope
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'ghuser29384/Website2'
          test '${{ github.event.pull_request.head.ref }}' = "$CONTROLLER_BRANCH"
          test '${{ github.event.pull_request.base.ref }}' = 'main'
          test '${{ github.event.pull_request.base.sha }}' = "$BASE_SHA"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)" = "$BASE_SHA"

          controller_files="$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/pulls/${{ github.event.pull_request.number }}/files?per_page=100" \
            --jq '.[].filename' | sort)"
          test "$controller_files" = "$CONTROLLER_PATH"

          product_pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PRODUCT_PR}")"
          test "$(jq -r .state <<<"$product_pr")" = 'open'
          test "$(jq -r .head.sha <<<"$product_pr")" = "$CANDIDATE_SHA"
          test "$(jq -r .base.ref <<<"$product_pr")" = 'main'
          test "$(jq -r .base.sha <<<"$product_pr")" = "$BASE_SHA"

          product_files="$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/pulls/${PRODUCT_PR}/files?per_page=100" \
            --jq '.[].filename' | sort)"
          expected_product_files=$'src/lib/create-interface/common-ground-integration.test.ts\nsrc/lib/create-interface/common-ground-integration.ts\ntests/exact-live-autocomplete.spec.ts'
          test "$product_files" = "$expected_product_files"

      - name: Check out immutable product candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 1

      - name: Prove candidate identity and exact differential
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git fetch --depth=1 origin "$BASE_SHA"
          git diff --name-only "$BASE_SHA" "$CANDIDATE_SHA" | sort > /tmp/candidate-files.txt
          printf '%s\n' \
            'src/lib/create-interface/common-ground-integration.test.ts' \
            'src/lib/create-interface/common-ground-integration.ts' \
            'tests/exact-live-autocomplete.spec.ts' \
            | sort > /tmp/expected-files.txt
          diff -u /tmp/expected-files.txt /tmp/candidate-files.txt
          git diff --check "$BASE_SHA" "$CANDIDATE_SHA"
          mkdir -p "$EVIDENCE_DIR"
          cp /tmp/candidate-files.txt "$EVIDENCE_DIR/candidate-files.txt"
          git diff --stat "$BASE_SHA" "$CANDIDATE_SHA" > "$EVIDENCE_DIR/diff-stat.txt"
          git diff "$BASE_SHA" "$CANDIDATE_SHA" > "$EVIDENCE_DIR/exact.diff"
          printf '%s\n' "$BASE_SHA" > "$EVIDENCE_DIR/base-sha.txt"
          printf '%s\n' "$CANDIDATE_SHA" > "$EVIDENCE_DIR/candidate-sha.txt"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        shell: bash
        run: |
          set -o pipefail
          npm ci 2>&1 | tee "$EVIDENCE_DIR/npm-ci.log"

      - name: Run source, lint, type, and production-build gates
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee "$EVIDENCE_DIR/source-tests.log"
          npm run lint -- --quiet 2>&1 | tee "$EVIDENCE_DIR/eslint.log"
          npx tsc --noEmit 2>&1 | tee "$EVIDENCE_DIR/typescript.log"
          npm run build 2>&1 | tee "$EVIDENCE_DIR/build.log"

      - name: Install Chromium
        shell: bash
        run: |
          set -o pipefail
          npx playwright install --with-deps chromium \
            2>&1 | tee "$EVIDENCE_DIR/chromium.log"

      - name: Repeat focused current autocomplete contract
        shell: bash
        run: |
          set -o pipefail
          rm -rf .next test-results playwright-report
          npx playwright test "$TARGET_TEST" \
            --workers=1 --repeat-each=5 --reporter=line \
            2>&1 | tee "$EVIDENCE_DIR/focused-autocomplete.log"

      - name: Write report normalization tools
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/extract-report.mjs <<'NODE'
          import fs from 'node:fs';

          const [rawPath, reportPath, prefixPath] = process.argv.slice(2);
          const raw = fs.readFileSync(rawPath, 'utf8');
          const offsets = [0];
          for (let start = 0; start < raw.length; ) {
            let cursor = start;
            while (cursor < raw.length && /[ \t\r]/.test(raw[cursor])) cursor += 1;
            if (raw[cursor] === '{') offsets.push(cursor);
            const newline = raw.indexOf('\n', start);
            if (newline === -1) break;
            start = newline + 1;
          }
          for (const offset of [...new Set(offsets)]) {
            try {
              const report = JSON.parse(raw.slice(offset));
              if (report && Array.isArray(report.suites)) {
                fs.writeFileSync(reportPath, `${JSON.stringify(report, null, 2)}\n`);
                fs.writeFileSync(prefixPath, raw.slice(0, offset));
                process.exit(0);
              }
            } catch {}
          }
          throw new Error(`No Playwright JSON report found in ${rawPath}`);
          NODE

          cat > /tmp/normalize-report.mjs <<'NODE'
          import fs from 'node:fs';

          const [reportPath, prefix, exitPath] = process.argv.slice(2);
          const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
          const failures = [];

          function visit(suite, parents = []) {
            const path = suite?.title ? [...parents, suite.title] : parents;
            for (const spec of suite?.specs ?? []) {
              const failedResults = (spec.tests ?? []).flatMap((test) =>
                (test.results ?? []).filter(
                  (result) => !['passed', 'skipped'].includes(result.status),
                ),
              );
              if (spec.ok === false || failedResults.length > 0) {
                const title = [...path, spec.title ?? ''].filter(Boolean).join(' › ');
                const file = String(spec.file ?? '');
                const errors = failedResults
                  .flatMap((result) => result.errors ?? [])
                  .map((error) => String(error?.message ?? error?.stack ?? error ?? ''))
                  .filter(Boolean);
                failures.push({
                  file,
                  title,
                  comparisonKey: `${file} › ${title}`,
                  key: `${file}:${spec.line ?? 0}:${spec.column ?? 0} › ${title}`,
                  errors,
                });
              }
            }
            for (const child of suite?.suites ?? []) visit(child, path);
          }
          for (const suite of report.suites ?? []) visit(suite, []);

          const unique = [];
          const seen = new Set();
          for (const failure of failures) {
            if (seen.has(failure.comparisonKey)) continue;
            seen.add(failure.comparisonKey);
            unique.push(failure);
          }
          unique.sort((a, b) => a.comparisonKey.localeCompare(b.comparisonKey));

          const target = unique.filter((failure) =>
            failure.file.endsWith('exact-live-autocomplete.spec.ts'),
          );
          const hydrationPattern =
            /hydrated but some attributes of the server rendered HTML didn't match|Hydration failed because the server rendered HTML didn't match/;
          const hydration = unique.filter((failure) =>
            failure.errors.some((error) => hydrationPattern.test(error)),
          );
          const summary = {
            exitStatus: Number(fs.readFileSync(exitPath, 'utf8').trim()),
            stats: report.stats ?? null,
            failureCount: unique.length,
            targetFailureCount: target.length,
            targetFailures: target.map((failure) => failure.key),
            hydrationMismatchCount: hydration.length,
            hydrationFailures: hydration.map((failure) => failure.key),
          };
          fs.writeFileSync(`${prefix}-failures.json`, `${JSON.stringify(unique, null, 2)}\n`);
          fs.writeFileSync(`${prefix}-summary.json`, `${JSON.stringify(summary, null, 2)}\n`);
          console.log(JSON.stringify(summary, null, 2));
          NODE

          node --check /tmp/extract-report.mjs
          node --check /tmp/normalize-report.mjs

      - name: Run complete candidate rendered suite
        shell: bash
        run: |
          set -uo pipefail
          rm -rf .next
          set +e
          npx playwright test --reporter=json \
            > "$EVIDENCE_DIR/candidate-raw.log" \
            2> "$EVIDENCE_DIR/candidate.stderr.log"
          status=$?
          set -e
          printf '%s\n' "$status" > "$EVIDENCE_DIR/candidate-exit.txt"
          node /tmp/extract-report.mjs \
            "$EVIDENCE_DIR/candidate-raw.log" \
            "$EVIDENCE_DIR/candidate-report.json" \
            "$EVIDENCE_DIR/candidate-prefix.log"
          node /tmp/normalize-report.mjs \
            "$EVIDENCE_DIR/candidate-report.json" \
            "$EVIDENCE_DIR/candidate" \
            "$EVIDENCE_DIR/candidate-exit.txt"

      - name: Check out and run complete immutable base suite
        shell: bash
        run: |
          set -uo pipefail
          git checkout --force "$BASE_SHA"
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          rm -rf .next
          set +e
          npx playwright test --reporter=json \
            > "$EVIDENCE_DIR/base-raw.log" \
            2> "$EVIDENCE_DIR/base.stderr.log"
          status=$?
          set -e
          printf '%s\n' "$status" > "$EVIDENCE_DIR/base-exit.txt"
          node /tmp/extract-report.mjs \
            "$EVIDENCE_DIR/base-raw.log" \
            "$EVIDENCE_DIR/base-report.json" \
            "$EVIDENCE_DIR/base-prefix.log"
          node /tmp/normalize-report.mjs \
            "$EVIDENCE_DIR/base-report.json" \
            "$EVIDENCE_DIR/base" \
            "$EVIDENCE_DIR/base-exit.txt"

      - name: Enforce fail-closed exact differential
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const dir = process.env.EVIDENCE_DIR;
          const read = (name) => JSON.parse(fs.readFileSync(path.join(dir, name), 'utf8'));
          const base = read('base-summary.json');
          const candidate = read('candidate-summary.json');
          const baseFailures = read('base-failures.json');
          const candidateFailures = read('candidate-failures.json');
          const baseKeys = new Set(baseFailures.map((failure) => failure.comparisonKey));
          const candidateOnly = candidateFailures.filter(
            (failure) => !baseKeys.has(failure.comparisonKey),
          );
          const result = {
            baseSha: process.env.BASE_SHA,
            candidateSha: process.env.CANDIDATE_SHA,
            base,
            candidate,
            candidateOnlyFailureCount: candidateOnly.length,
            candidateOnlyFailures: candidateOnly.map((failure) => failure.key),
            checks: {
              baseHasExactlyThreeTargetFailures: base.targetFailureCount === 3,
              candidateHasNoTargetFailures: candidate.targetFailureCount === 0,
              candidateHasNoHydrationMismatches: candidate.hydrationMismatchCount === 0,
              candidateHasNoNewFailureKeys: candidateOnly.length === 0,
              candidateFailureCountNoGreaterThanBase:
                candidate.failureCount <= base.failureCount,
            },
          };
          result.passed = Object.values(result.checks).every(Boolean);
          fs.writeFileSync(
            path.join(dir, 'exact-differential.json'),
            `${JSON.stringify(result, null, 2)}\n`,
          );
          console.log(JSON.stringify(result, null, 2));
          if (!result.passed) process.exit(1);
          NODE

      - name: Upload immutable evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: create-autocomplete-corrected-final-cac2fbab
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish immutable candidate result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$JOB_STATUS" == 'success' ]]; then
            state=success
            description="Corrected Create autocomplete exact gates passed"
          else
            state=failure
            description="Corrected Create autocomplete exact gates failed"
          fi
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${CANDIDATE_SHA}" \
            -f state="$state" \
            -f context="$STATUS_CONTEXT" \
            -f description="$description" \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          test "$state" = success
