name: Materialize MPGF pool review freeze repair 2026-08-06

on:
  push:
    branches:
      - fix/mpgf-pool-review-freeze-20260806
    paths:
      - ".github/workflows/materialize-mpgf-pool-review-freeze-20260806.yml"

permissions:
  contents: write

concurrency:
  group: materialize-mpgf-pool-review-freeze-20260806
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_PARENT: 8bdc10338121f173a300436a692c04808d56966b
      CONTROLLER_PATH: .github/workflows/materialize-mpgf-pool-review-freeze-20260806.yml
      PAYLOAD_SHA256: 88eb1ee9ace6d02e9b3e7c74a9c60646bcb324c92c0d059206d3ced0f9156776

    steps:
      - name: Check out the exact controller commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          ref: ${{ github.sha }}

      - name: Verify isolation and decode the reviewed repair
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          changed="$(git diff-tree --no-commit-id --name-only -r HEAD | sed '/^$/d')"
          test "$changed" = "$CONTROLLER_PATH"
          cat > /tmp/review-freeze-payload.b64 <<'PAYLOAD'

PAYLOAD
          base64 --decode /tmp/review-freeze-payload.b64 > /tmp/review-freeze-payload.tar.gz
          echo "$PAYLOAD_SHA256  /tmp/review-freeze-payload.tar.gz" | sha256sum --check
          tar -xzf /tmp/review-freeze-payload.tar.gz -C "$GITHUB_WORKSPACE"
          test -f supabase/migrations/20260806110000_mpgf_pool_review_freeze.sql
          test -f supabase/tests/mpgf_pool_review_freeze.sql
          test -f src/lib/mpgf/pool-review-freeze-migration.test.ts
          test -f .github/workflows/mpgf-pool-review-freeze-gates.yml
          rm "$CONTROLLER_PATH"
          git diff --check
          actual="$(git status --short | sed -E 's/^.. //' | sort | tr '\n' ' ')"
          expected=".github/workflows/materialize-mpgf-pool-review-freeze-20260806.yml .github/workflows/mpgf-pool-review-freeze-gates.yml src/lib/mpgf/pool-review-freeze-migration.test.ts supabase/migrations/20260806110000_mpgf_pool_review_freeze.sql supabase/tests/mpgf_pool_review_freeze.sql "
          test "$actual" = "$expected"

      - name: Commit the exact repair and remove this controller
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Enforce MPGF pool review authorization and terms freeze"
          git push origin "HEAD:fix/mpgf-pool-review-freeze-20260806"
