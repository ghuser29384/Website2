name: MPGF pool visibility gates

on:
  pull_request:
    paths:
      - ".github/workflows/mpgf-pool-visibility-gates.yml"
      - "docs/mpgf-pool-visibility-controls.md"
      - "src/lib/mpgf/pool-visibility.ts"
      - "src/lib/mpgf/pool-visibility.test.ts"
      - "supabase/migrations/20260726123500_mpgf_pool_visibility_controls.sql"
      - "supabase/tests/mpgf_pool_visibility_controls.sql"
  push:
    branches:
      - feature/mpgf-pool-visibility-controls-20260726
    paths:
      - ".github/workflows/mpgf-pool-visibility-gates.yml"
      - "docs/mpgf-pool-visibility-controls.md"
      - "src/lib/mpgf/pool-visibility.ts"
      - "src/lib/mpgf/pool-visibility.test.ts"
      - "supabase/migrations/20260726123500_mpgf_pool_visibility_controls.sql"
      - "supabase/tests/mpgf_pool_visibility_controls.sql"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mpgf-pool-visibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gates:
    name: Test, lint, build, and diff check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run focused visibility tests
        run: node --import tsx --test src/lib/mpgf/pool-visibility.test.ts

      - name: Run repository tests
        shell: bash
        run: |
          if ! npm test > repository-tests.log 2>&1; then
            echo "Repository tests failed. Last 240 log lines:"
            tail -n 240 repository-tests.log
            exit 1
          fi
          tail -n 40 repository-tests.log

      - name: Run repository lint
        shell: bash
        run: |
          if ! npm run lint -- --quiet > repository-lint.log 2>&1; then
            echo "Repository lint failed. Last 240 log lines:"
            tail -n 240 repository-lint.log
            exit 1
          fi
          tail -n 40 repository-lint.log

      - name: Build the production application
        shell: bash
        env:
          NEXT_PUBLIC_SITE_URL: https://www.moraltrade.org
          VERCEL: "1"
          VERCEL_ENV: preview
        run: |
          if ! npm run build > production-build.log 2>&1; then
            echo "Production build failed. Last 240 log lines:"
            tail -n 240 production-build.log
            exit 1
          fi
          tail -n 40 production-build.log

      - name: Check whitespace errors
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          base_sha="${PR_BASE_SHA:-${PUSH_BEFORE_SHA:-$(git rev-parse HEAD^)}}"
          git diff --check "$base_sha" "${GITHUB_SHA}"
