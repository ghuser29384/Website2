name: MPGF pool visibility gates

on:
  pull_request:
    paths:
      - ".github/workflows/mpgf-pool-visibility-gates.yml"
      - "docs/mpgf-pool-visibility-controls.md"
      - "src/lib/mpgf/pool-visibility.ts"
      - "src/lib/mpgf/pool-visibility.test.ts"
      - "supabase/migrations/20260726123500_mpgf_pool_visibility_controls.sql"
      - "supabase/tests/mpgf_pool_visibility_controls.sql"
  push:
    branches:
      - feature/mpgf-pool-visibility-controls-20260726
    paths:
      - ".github/workflows/mpgf-pool-visibility-gates.yml"
      - "docs/mpgf-pool-visibility-controls.md"
      - "src/lib/mpgf/pool-visibility.ts"
      - "src/lib/mpgf/pool-visibility.test.ts"
      - "supabase/migrations/20260726123500_mpgf_pool_visibility_controls.sql"
      - "supabase/tests/mpgf_pool_visibility_controls.sql"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mpgf-pool-visibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gates:
    name: Test, lint, build, and diff check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run repository tests
        run: npm test

      - name: Run repository lint
        run: npm run lint -- --quiet

      - name: Build the production application
        env:
          NEXT_PUBLIC_SITE_URL: https://www.moraltrade.org
          VERCEL: "1"
          VERCEL_ENV: preview
        run: npm run build

      - name: Check whitespace errors
        run: git diff --check "${{ github.event.pull_request.base.sha || github.event.before }}" "${{ github.sha }}"
