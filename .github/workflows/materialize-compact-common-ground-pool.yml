# Registered on the preceding commit; this push intentionally triggers the guarded run.
name: Materialize compact Common Ground Pool

on:
  push:
    branches:
      - feature/create-common-ground-pool-compact-20260729

permissions:
  contents: write

concurrency:
  group: materialize-compact-common-ground-pool
  cancel-in-progress: false

jobs:
  materialize-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/create-common-ground-pool-compact-20260729

      - name: Guard branch and reviewed base
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "feature/create-common-ground-pool-compact-20260729"
          git merge-base --is-ancestor d943f68baa47e9b27ef181fa493472015b168954 HEAD
          test -f .github/scripts/materialize-compact-common-ground-pool.py
          test -f .github/workflows/materialize-compact-common-ground-pool.yml

      - name: Materialize compact Create integration
        run: python3 .github/scripts/materialize-compact-common-ground-pool.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify static Create JavaScript syntax
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('public/moral-trade-create/index.html', 'utf8');
          const match = html.match(/<script>([\s\S]*)<\/script>/);
          if (!match) throw new Error('Create interface script was not found.');
          new Function(match[1]);
          NODE

      - name: Run focused Create tests
        run: node --import tsx --test src/lib/create-interface/*.test.ts

      - name: Lint changed implementation
        run: >-
          npx eslint
          src/lib/create-interface/types.ts
          src/lib/create-interface/validation.ts
          src/lib/create-interface/validation.test.ts
          src/lib/create-interface/persistence.ts
          src/lib/create-interface/source-contract.test.ts
          tests/create-common-ground-pool.spec.ts

      - name: Run full repository tests
        run: npm test

      - name: Run full repository lint
        run: npm run lint -- --quiet

      - name: Build production application
        env:
          NEXT_PUBLIC_SITE_URL: https://www.moraltrade.org
          VERCEL: "1"
          VERCEL_ENV: preview
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run desktop and mobile Create browser checks
        run: npx playwright test tests/create-common-ground-pool.spec.ts --reporter=line

      - name: Check whitespace
        run: git diff --check

      - name: Remove one-time materializer
        run: |
          rm .github/scripts/materialize-compact-common-ground-pool.py
          rm .github/workflows/materialize-compact-common-ground-pool.yml

      - name: Commit verified product files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Integrate compact Common Ground Pool into Create"
          git push origin HEAD:feature/create-common-ground-pool-compact-20260729
