name: Read PR 158 bilateral repair failure

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/read-pr158-bilateral-repair-log.yml"
      - ".github/scripts/read-pr158-bilateral-repair-log.py"

permissions:
  actions: read
  contents: read

jobs:
  extract:
    if: >-
      github.event.pull_request.head.repo.full_name == 'ghuser29384/Website2' &&
      github.head_ref == 'ops/fix-pr158-bilateral-confirmation-20260727'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out diagnostic
        uses: actions/checkout@v4
      - name: Capture sanitized failure excerpt
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/read-pr158-bilateral-repair-log.py > bilateral-repair-failure.txt
      - name: Upload sanitized failure excerpt
        uses: actions/upload-artifact@v4
        with:
          name: pr158-bilateral-repair-failure-${{ github.run_id }}
          path: bilateral-repair-failure.txt
          if-no-files-found: error
          retention-days: 1
