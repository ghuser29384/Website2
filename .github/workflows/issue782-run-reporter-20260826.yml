name: Issue 782 production UAT run reporter 20260826

on:
  push:
    branches:
      - ops/dac-production-canonical-uat-26d1fe43-20260824
    paths:
      - ".github/workflows/issue782-run-reporter-20260826.yml"

permissions:
  actions: read
  contents: write
  issues: write

concurrency:
  group: issue782-production-uat-reporter
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 230
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_WORKFLOW: Issue 782 bounded canonical production UAT 20260826
      STATUS_SUCCESS_REF: refs/heads/ops/status-issue782-success
      STATUS_FAILURE_REF: refs/heads/ops/status-issue782-failure
    steps:
      - name: Wait for the latest target run and classify it
        shell: bash
        run: |
          set -euo pipefail
          target_id=""
          for attempt in $(seq 1 120); do
            gh api "repos/$GITHUB_REPOSITORY/actions/runs?branch=ops/dac-production-canonical-uat-26d1fe43-20260824&per_page=100" > "$RUNNER_TEMP/runs.json"
            target_id="$(jq -r --arg name "$TARGET_WORKFLOW" --argjson current "$GITHUB_RUN_ID" '[.workflow_runs[] | select(.name==$name and .id!=$current)] | sort_by(.created_at) | last | .id // empty' "$RUNNER_TEMP/runs.json")"
            if test -n "$target_id"; then
              gh api "repos/$GITHUB_REPOSITORY/actions/runs/$target_id" > "$RUNNER_TEMP/target.json"
              status="$(jq -r .status "$RUNNER_TEMP/target.json")"
              if test "$status" = completed; then break; fi
            fi
            sleep 60
          done
          test -n "$target_id"
          test "$(jq -r .status "$RUNNER_TEMP/target.json")" = completed
          conclusion="$(jq -r .conclusion "$RUNNER_TEMP/target.json")"
          test -n "$conclusion"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$target_id/jobs?per_page=100" > "$RUNNER_TEMP/jobs.json"
          failed_step="$(jq -r '[.jobs[].steps[] | select(.conclusion=="failure")] | first | .number // 0' "$RUNNER_TEMP/jobs.json")"
          failed_name="$(jq -r '[.jobs[].steps[] | select(.conclusion=="failure")] | first | .name // "none"' "$RUNNER_TEMP/jobs.json")"
          artifact_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$target_id/artifacts")"
          artifact_id="$(jq -r '.artifacts[0].id // 0' <<<"$artifact_json")"
          artifact_digest="$(jq -r '.artifacts[0].digest // "none"' <<<"$artifact_json")"
          head_sha="$(jq -r .head_sha "$RUNNER_TEMP/target.json")"

          for ref in "$STATUS_SUCCESS_REF" "$STATUS_FAILURE_REF"; do
            encoded="${ref#refs/}"
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/$encoded" >/dev/null 2>&1 || true
          done
          if test "$conclusion" = success; then status_ref="$STATUS_SUCCESS_REF"; else status_ref="$STATUS_FAILURE_REF"; fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="$status_ref" -f sha="$head_sha" >/dev/null
          if test "$conclusion" != success; then
            step_ref="refs/heads/ops/status-issue782-failure-step-$failed_step"
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/${step_ref#refs/}" >/dev/null 2>&1 || true
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="$step_ref" -f sha="$head_sha" >/dev/null
          fi

          body=$(cat <<EOF
          ## Automated bounded production-UAT run classification

          - run: \`$target_id\`
          - conclusion: \`$conclusion\`
          - controller head: \`$head_sha\`
          - first failed step number: \`$failed_step\`
          - first failed step: \`$failed_name\`
          - artifact: \`$artifact_id\`
          - artifact digest: \`$artifact_digest\`

          This reporter performed no production, database, deployment, alias, environment, identity, provider, or payment mutation.
          EOF
          )
          gh issue comment 782 --repo "$GITHUB_REPOSITORY" --body "$body"
          gh issue comment 783 --repo "$GITHUB_REPOSITORY" --body "$body"
          printf '%s\n' "$body" >> "$GITHUB_STEP_SUMMARY"
