name: Verify Metaphilosophy hotfix Preview once

on:
  push:
    branches:
      - ops/verify-metaphilosophy-hotfix-preview-20260804
    paths:
      - .github/workflows/verify-metaphilosophy-hotfix-preview-once.yml

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: verify-metaphilosophy-hotfix-preview-once
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: team_ySu6sF3Uho1E1GnJtCQPVEuJ
  VERCEL_PROJECT_ID: prj_2Aq2qYbFw85GBMRLXdfyTIwvEXhZ
  DEPLOYMENT_ID: dpl_4MeTJbpZnYx6ffjnzjdtSvnu8pmE
  DEPLOYMENT_URL: https://rlhf-conceptual-reasoning-4hwe193ew-ellen-s.vercel.app
  EXPECTED_SHA: 1a70216fc1a80b048150283ef8cf4b2d42bb4fbd
  CONTROLLER_PATH: .github/workflows/verify-metaphilosophy-hotfix-preview-once.yml
  VERCEL_CLI_VERSION: 58.1.0

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out exact verifier commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Guard exact repository and verifier scope
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'ghuser29384/Website2'
          test "$GITHUB_REF" = 'refs/heads/ops/verify-metaphilosophy-hotfix-preview-20260804'
          test "$GITHUB_ACTOR" = 'ghuser29384'
          test "$(git diff-tree --no-commit-id --name-only -r HEAD | sed '/^$/d')" = "$CONTROLLER_PATH"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify deployment identity and protected Preview routes
        id: verify
        continue-on-error: true
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          mkdir -p .vercel preview-evidence
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json

          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v13/deployments/$DEPLOYMENT_ID?teamId=$VERCEL_ORG_ID&withGitRepoInfo=true" \
            > preview-evidence/deployment.json
          jq -e --arg id "$DEPLOYMENT_ID" --arg project "$VERCEL_PROJECT_ID" --arg sha "$EXPECTED_SHA" '
            (.id // .uid) == $id and
            .projectId == $project and
            (.readyState // .state) == "READY" and
            .target == null and
            .meta.githubCommitSha == $sha and
            .meta.githubCommitRef == "release/vercel-preview"
          ' preview-evidence/deployment.json >/dev/null

          check_route() {
            local name="$1"
            local path="$2"
            local expected_status="$3"
            local body_pattern="$4"
            local headers="preview-evidence/${name}.headers"
            local body="preview-evidence/${name}.body"
            local status
            status="$(npx --yes "vercel@$VERCEL_CLI_VERSION" curl "$path" \
              --deployment "$DEPLOYMENT_URL" \
              --token="$VERCEL_TOKEN" \
              --scope=ellen-s \
              -- -sS -D "$headers" -o "$body" -w '%{http_code}')"
            test "$status" = "$expected_status"
            grep -Eqi "$body_pattern" "$body"
          }

          check_route root / 200 'Metaphilosophy'
          check_route research /research/ 200 'Research|Metaphilosophy'
          check_route arguments /arguments/ 200 'Argument|critique'
          check_route contribute /contribute 200 'reviewer|contribut|closed'
          check_route workspace /workspace 200 'Metaphilosophy|readiness|workspace'
          check_route reference /reference 200 'Metaphilosophy|readiness|reference'

          npx --yes "vercel@$VERCEL_CLI_VERSION" curl /src/assets/LMCA_dataset.pdf \
            --deployment "$DEPLOYMENT_URL" \
            --token="$VERCEL_TOKEN" \
            --scope=ellen-s \
            -- -sS -D preview-evidence/lmca.headers -o preview-evidence/lmca.body -w '%{http_code}' \
            > preview-evidence/lmca.status
          test "$(cat preview-evidence/lmca.status)" = '307'
          grep -Eqi '^location: https://arxiv\.org/pdf/2607\.27499' preview-evidence/lmca.headers

          grep -Eqi '^x-content-type-options: nosniff' preview-evidence/root.headers
          grep -Eqi '^x-frame-options: DENY' preview-evidence/root.headers
          grep -Eqi '^referrer-policy: strict-origin-when-cross-origin' preview-evidence/root.headers
          grep -Eqi '^permissions-policy: camera=\(\), microphone=\(\), geolocation=\(\)' preview-evidence/root.headers

          jq -n \
            --arg status passed \
            --arg deployment "$DEPLOYMENT_ID" \
            --arg sha "$EXPECTED_SHA" \
            '{status:$status,deployment:$deployment,sha:$sha,routes:{root:200,research:200,arguments:200,contribute:200,workspace:200,reference:200,lmcaRedirect:307},securityHeaders:true}' \
            > preview-evidence/result.json

      - name: Upload Preview evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metaphilosophy-hotfix-preview-${{ github.run_id }}
          path: preview-evidence
          if-no-files-found: warn
          retention-days: 30

      - name: Report exact Preview outcome to PR 19
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [[ '${{ steps.verify.outcome }}' == success ]]; then
            gh pr comment 19 --repo ghuser29384/RL-for-Conceptual-Reasoning --body "Exact protected Preview verification passed on \`$DEPLOYMENT_ID\` for head \`$EXPECTED_SHA\`. Root, Research, Arguments, Contribute, Workspace, and Reference returned 200; the LMCA route returned the expected 307 to arXiv; and all four required security headers were present. Evidence: $run_url"
          else
            gh pr comment 19 --repo ghuser29384/RL-for-Conceptual-Reasoning --body "Exact protected Preview verification did not pass all route, redirect, identity, and security-header checks on \`$DEPLOYMENT_ID\`. No Preview-success claim is made. Evidence: $run_url"
          fi

      - name: Remove one-time verifier with verdict
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ '${{ steps.verify.outcome }}' == success ]]; then
            message='Remove one-time Metaphilosophy hotfix Preview verifier after PASS'
          else
            message='Remove one-time Metaphilosophy hotfix Preview verifier after FAIL'
          fi
          sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/$CONTROLLER_PATH?ref=ops/verify-metaphilosophy-hotfix-preview-20260804" --jq .sha 2>/dev/null || true)"
          if [[ -n "$sha" ]]; then
            jq -n --arg message "$message" --arg sha "$sha" --arg branch ops/verify-metaphilosophy-hotfix-preview-20260804 '{message:$message,sha:$sha,branch:$branch}' \
              | gh api --method DELETE "repos/$GITHUB_REPOSITORY/contents/$CONTROLLER_PATH" --input - >/dev/null
          fi

      - name: Enforce Preview verification success
        if: always()
        run: test '${{ steps.verify.outcome }}' = success
