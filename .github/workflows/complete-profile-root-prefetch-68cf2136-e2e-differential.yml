name: Complete Profile root-prefetch full E2E differential

on:
  pull_request:
    paths:
      - ".github/workflows/complete-profile-root-prefetch-68cf2136-e2e-differential.yml"

permissions:
  actions: read
  contents: read
  statuses: write

concurrency:
  group: complete-profile-root-prefetch-68cf2136-e2e-differential
  cancel-in-progress: false

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    env:
      BASE_SHA: eb71dce7990d1476fc6e4731e1bcd7f3afd640f9
      CANDIDATE_SHA: 68cf2136ce62b823024963e83503f7af96f229ee
      CANDIDATE_RELEASE_RUN_ID: "30778634962"
      STATUS_CONTEXT: QA / Complete Profile full E2E differential
      EVIDENCE_DIR: complete-profile-full-e2e-differential

    steps:
      - name: Mark differential gate pending
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${CANDIDATE_SHA}" \
            -f state=pending \
            -f context="$STATUS_CONTEXT" \
            -f description="Comparing every rendered Playwright failure against the exact base" \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Check out exact base
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE_SHA }}
          fetch-depth: 1

      - name: Verify exact base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          mkdir -p "$EVIDENCE_DIR"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact base dependencies
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if npm ci; then exit 0; fi
            if [[ "$attempt" == '3' ]]; then exit 1; fi
            sleep $((attempt * 20))
          done

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run every rendered Playwright test on the exact base
        id: baseline
        env:
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3210
          SITE_URL: http://127.0.0.1:3210
          PLAYWRIGHT_HTML_OPEN: never
        shell: bash
        run: |
          set +e
          npm run test:e2e -- --reporter=line > "$EVIDENCE_DIR/base.log" 2>&1
          status=$?
          set -e
          echo "exit_status=$status" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$status" > "$EVIDENCE_DIR/base-exit-status.txt"
          test -s "$EVIDENCE_DIR/base.log"

      - name: Collect the exact candidate full-browser run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh run view "$CANDIDATE_RELEASE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --json databaseId,status,conclusion,createdAt,updatedAt,headBranch,headSha,url,jobs \
            > "$EVIDENCE_DIR/candidate-run.json"
          test "$(jq -r .conclusion "$EVIDENCE_DIR/candidate-run.json")" = 'failure'
          gh run view "$CANDIDATE_RELEASE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --log-failed \
            > "$EVIDENCE_DIR/candidate.log"
          test -s "$EVIDENCE_DIR/candidate.log"

      - name: Prove no candidate Playwright regression
        env:
          BASE_EXIT_STATUS: ${{ steps.baseline.outputs.exit_status }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          import re
          from pathlib import Path

          output = Path(os.environ["EVIDENCE_DIR"])
          ansi = re.compile(r"\x1b\[[0-?]*[ -/]*[@-~]")
          failure = re.compile(r"\s+\d+\)\s+(tests/.*?\.spec\.ts:\d+:\d+\s+›\s+.*?)\s*$")
          summary = re.compile(r"\b(\d+) failed\b")
          passed = re.compile(r"\b(\d+) passed\b")
          skipped = re.compile(r"\b(\d+) skipped\b")

          def clean(text: str) -> str:
              return ansi.sub("", text)

          def parse(path: Path) -> dict[str, object]:
              text = clean(path.read_text(encoding="utf-8", errors="replace"))
              failures: list[str] = []
              for raw in text.splitlines():
                  match = failure.search(raw)
                  if match:
                      failures.append(match.group(1).strip())
              failure_set = sorted(set(failures))
              failure_counts = [int(match.group(1)) for match in summary.finditer(text)]
              passed_counts = [int(match.group(1)) for match in passed.finditer(text)]
              skipped_counts = [int(match.group(1)) for match in skipped.finditer(text)]
              return {
                  "failureCount": len(failure_set),
                  "failures": failure_set,
                  "reportedFailureCount": failure_counts[-1] if failure_counts else None,
                  "reportedPassedCount": passed_counts[-1] if passed_counts else None,
                  "reportedSkippedCount": skipped_counts[-1] if skipped_counts else 0,
                  "failureDigest": hashlib.sha256("\n".join(failure_set).encode()).hexdigest(),
              }

          base = parse(output / "base.log")
          candidate = parse(output / "candidate.log")
          base_set = set(base["failures"])
          candidate_set = set(candidate["failures"])
          new_failures = sorted(candidate_set - base_set)
          missing_failures = sorted(base_set - candidate_set)

          report = {
              "baseSha": os.environ["BASE_SHA"],
              "candidateSha": os.environ["CANDIDATE_SHA"],
              "candidateReleaseRunId": int(os.environ["CANDIDATE_RELEASE_RUN_ID"]),
              "baseExitStatus": int(os.environ["BASE_EXIT_STATUS"]),
              "base": base,
              "candidate": candidate,
              "newCandidateFailures": new_failures,
              "baseFailuresNotSeenInCandidate": missing_failures,
              "failureSetsEqual": base_set == candidate_set,
          }
          (output / "comparison.json").write_text(json.dumps(report, indent=2) + "\n")
          (output / "base-failures.txt").write_text("\n".join(base["failures"]) + "\n")
          (output / "candidate-failures.txt").write_text("\n".join(candidate["failures"]) + "\n")

          if int(os.environ["BASE_EXIT_STATUS"]) == 0:
              raise SystemExit("Exact base unexpectedly passed; the ordinary full gate should have been used")
          if not base_set or not candidate_set:
              raise SystemExit("Failed to parse one or both failure sets")
          if new_failures:
              raise SystemExit(f"Candidate introduced {len(new_failures)} new rendered failures")
          if base_set != candidate_set:
              raise SystemExit(
                  "Candidate failure set differs from the exact base; inspect comparison evidence"
              )
          if candidate["failureCount"] != candidate["reportedFailureCount"]:
              raise SystemExit("Candidate parsed and reported failure counts disagree")
          if base["failureCount"] != base["reportedFailureCount"]:
              raise SystemExit("Base parsed and reported failure counts disagree")
          PY

      - name: Upload full differential evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: complete-profile-full-e2e-differential-68cf2136
          path: complete-profile-full-e2e-differential
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish differential result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$JOB_STATUS" == 'success' ]]; then
            state=success
            description="Every candidate Playwright failure exactly matches the immutable base"
          else
            state=failure
            description="Full Playwright differential failed; inspect exact-base evidence"
          fi
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${CANDIDATE_SHA}" \
            -f state="$state" \
            -f context="$STATUS_CONTEXT" \
            -f description="$description" \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          test "$state" = success
