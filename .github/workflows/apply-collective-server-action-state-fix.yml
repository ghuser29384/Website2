name: Apply collective server-action runtime fix

on:
  pull_request:
    branches:
      - feature/collective-identity-threshold-commitments-20260726
    paths:
      - ".github/scripts/patch-collective-server-action-state.py"
      - ".github/workflows/apply-collective-server-action-state-fix.yml"

permissions:
  contents: write

concurrency:
  group: apply-collective-server-action-runtime-fix-20260727
  cancel-in-progress: false

jobs:
  patch:
    if: >-
      github.event.pull_request.head.repo.full_name == 'ghuser29384/Website2' &&
      github.head_ref == 'qa/collective-commitments-adversarial-browser-20260727'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_REPOSITORY: ghuser29384/Website2
      EXPECTED_BRANCH: qa/collective-commitments-adversarial-browser-20260727
      EXPECTED_STAGING_PARENT: 50a13f840412884a125c9c33053f6b524d613c26
      ARTIFACT_DIR: ${{ github.workspace }}/collective-server-action-fix-artifacts

    steps:
      - name: Validate exact execution boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY"
          test "$GITHUB_HEAD_REF" = "$EXPECTED_BRANCH"

      - name: Check out exact pull-request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Apply deterministic server-action patch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ARTIFACT_DIR"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_STAGING_PARENT"
          cp .github/scripts/patch-collective-server-action-state.py \
            "$RUNNER_TEMP/patch-collective-server-action-state.py"
          python3 "$RUNNER_TEMP/patch-collective-server-action-state.py"

          grep -Fq '"use server";' src/app/collective-commitments/actions.ts
          if grep -Eq 'export[[:space:]]+(const|let|var|class)[[:space:]]+' \
            src/app/collective-commitments/actions.ts; then
            echo "Non-action runtime export remains in the use-server module." >&2
            exit 1
          fi
          grep -Fq 'collective-commitments/action-state' \
            src/components/collective-commitments/collective-commitment-form.tsx
          grep -Fq 'collective-commitments/action-state' \
            src/components/collective-commitments/collective-signature-controls.tsx
          grep -Fq 'server-action modules export only async actions at runtime' \
            src/collective-commitments-wiring.test.ts

          git config user.name "ghuser29384"
          git config user.email "262476329+ghuser29384@users.noreply.github.com"
          git rm \
            .github/scripts/patch-collective-server-action-state.py \
            .github/workflows/apply-collective-server-action-state-fix.yml
          git add \
            .github/workflows/collective-commitments-adversarial-browser-qa.yml \
            src/app/collective-commitments/actions.ts \
            src/collective-commitments-wiring.test.ts \
            src/components/collective-commitments/collective-commitment-form.tsx \
            src/components/collective-commitments/collective-signature-controls.tsx \
            src/lib/collective-commitments/action-state.ts
          git diff --cached --check
          git commit -m "Fix collective server-action runtime exports"
          git push origin HEAD:"$EXPECTED_BRANCH"

          printf '%s\n' \
            "qa_head=$(git rev-parse HEAD)" \
            "server_action_runtime_fix=APPLIED" \
            "staging_files_removed=PASS" \
            "production_changed=NO" > "$ARTIFACT_DIR/result.txt"

      - name: Upload patch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collective-server-action-runtime-fix-${{ github.run_id }}
          path: collective-server-action-fix-artifacts
          if-no-files-found: warn
          retention-days: 14
