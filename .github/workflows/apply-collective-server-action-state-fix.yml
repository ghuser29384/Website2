name: Export collective server-action runtime repair

on:
  pull_request:
    branches:
      - feature/collective-identity-threshold-commitments-20260726
    paths:
      - ".github/scripts/patch-collective-server-action-state.py"
      - ".github/workflows/apply-collective-server-action-state-fix.yml"

permissions:
  contents: read

concurrency:
  group: export-collective-server-action-runtime-fix-20260727
  cancel-in-progress: false

jobs:
  export:
    if: >-
      github.event.pull_request.head.repo.full_name == 'ghuser29384/Website2' &&
      github.head_ref == 'qa/collective-commitments-adversarial-browser-20260727'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_REPOSITORY: ghuser29384/Website2
      EXPECTED_BRANCH: qa/collective-commitments-adversarial-browser-20260727
      EXPECTED_PRODUCT_BASE: 053ed422da9c5cf8c03b1c24c1bb7f2af81386e8
      ARTIFACT_DIR: ${{ github.workspace }}/collective-server-action-repair-export

    steps:
      - name: Validate exact execution boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY"
          test "$GITHUB_HEAD_REF" = "$EXPECTED_BRANCH"

      - name: Check out exact pull-request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Materialize exact repaired files
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base "$EXPECTED_PRODUCT_BASE" HEAD)" = "$EXPECTED_PRODUCT_BASE"
          python3 .github/scripts/patch-collective-server-action-state.py

          mkdir -p \
            "$ARTIFACT_DIR/.github/workflows" \
            "$ARTIFACT_DIR/src/app/collective-commitments" \
            "$ARTIFACT_DIR/src/components/collective-commitments" \
            "$ARTIFACT_DIR/src/lib/collective-commitments" \
            "$ARTIFACT_DIR/src"
          cp .github/workflows/collective-commitments-adversarial-browser-qa.yml \
            "$ARTIFACT_DIR/.github/workflows/collective-commitments-adversarial-browser-qa.yml"
          cp src/app/collective-commitments/actions.ts \
            "$ARTIFACT_DIR/src/app/collective-commitments/actions.ts"
          cp src/collective-commitments-wiring.test.ts \
            "$ARTIFACT_DIR/src/collective-commitments-wiring.test.ts"
          cp src/components/collective-commitments/collective-commitment-form.tsx \
            "$ARTIFACT_DIR/src/components/collective-commitments/collective-commitment-form.tsx"
          cp src/components/collective-commitments/collective-signature-controls.tsx \
            "$ARTIFACT_DIR/src/components/collective-commitments/collective-signature-controls.tsx"
          cp src/lib/collective-commitments/action-state.ts \
            "$ARTIFACT_DIR/src/lib/collective-commitments/action-state.ts"

          git diff --check
          find "$ARTIFACT_DIR" -type f -print | sort > "$ARTIFACT_DIR/manifest.txt"

      - name: Upload exact repaired files
        uses: actions/upload-artifact@v4
        with:
          name: collective-server-action-runtime-repair-${{ github.run_id }}
          path: collective-server-action-repair-export
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 2
