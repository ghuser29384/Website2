name: Inspect parent synchronization conflicts

on:
  push:
    branches:
      - feature/account-bound-participant-picker-20260805

permissions:
  contents: read

concurrency:
  group: inspect-parent-sync-conflicts
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact child branch
        uses: actions/checkout@v4
        with:
          ref: feature/account-bound-participant-picker-20260805
          fetch-depth: 0

      - name: Reproduce three-way merge and package conflict stages
        shell: bash
        run: |
          git fetch origin feature/co-act-co-fund-create-v3-20260803
          set +e
          git merge --no-commit --no-ff origin/feature/co-act-co-fund-create-v3-20260803
          merge_status=$?
          set -e
          mkdir -p conflict-artifact
          git status --short > conflict-artifact/status.txt
          git diff --name-only --diff-filter=U > conflict-artifact/conflicts.txt
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            safe="${path//\//__}"
            git show ":1:$path" > "conflict-artifact/${safe}.base" 2>/dev/null || true
            git show ":2:$path" > "conflict-artifact/${safe}.child" 2>/dev/null || true
            git show ":3:$path" > "conflict-artifact/${safe}.parent" 2>/dev/null || true
            cp "$path" "conflict-artifact/${safe}.markers" 2>/dev/null || true
          done < conflict-artifact/conflicts.txt
          printf '%s\n' "$merge_status" > conflict-artifact/merge-status.txt
          test -s conflict-artifact/conflicts.txt

      - name: Upload exact conflict evidence
        uses: actions/upload-artifact@v4
        with:
          name: parent-sync-conflicts-${{ github.run_id }}
          path: conflict-artifact
          if-no-files-found: error
          retention-days: 14
