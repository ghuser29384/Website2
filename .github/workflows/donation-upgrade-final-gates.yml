name: Donation Upgrade final engineering gates

on:
  push:
    branches:
      - feature/donation-upgrade-approved-fallbacks-20260731
  pull_request:
    branches:
      - main
    paths:
      - .env.example
      - docs/trade-donation-pooled-settlement-runbook.md
      - src/app/admin/**
      - src/app/api/connectors/every-org/**
      - src/app/api/stripe/webhook/route.ts
      - src/app/trade-donation-actions-base.ts
      - src/app/trade-donation-pool-actions.ts
      - src/components/core-trade/trade-agreement-stage.tsx
      - src/components/core-trade/trade-donation-agreement-stage.tsx
      - src/components/core-trade/trade-donation-pool-agreement-stage.tsx
      - src/lib/payments/trade-donation-pool-webhook.ts
      - src/lib/trade-donation-pool*.ts
      - supabase/migrations/20260725152000_cross_user_pooled_trade_donations.sql
      - .github/workflows/donation-upgrade-final-gates.yml

permissions:
  contents: read
  issues: write

concurrency:
  group: donation-upgrade-final-gates-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Focused pooled-settlement tests
        run: node --import tsx --test src/lib/trade-donation-pool.test.ts src/lib/trade-donation-pool-source-contract.test.ts

      - name: Complete repository tests
        run: npm test

      - name: Absolute TypeScript gate
        run: npx tsc --noEmit

      - name: Absolute ESLint gate
        run: npm run lint

      - name: Production build
        env:
          NEXT_PUBLIC_SITE_URL: https://www.moraltrade.org
          VERCEL: "1"
          VERCEL_ENV: preview
          CONDITIONAL_PAYMENTS_MODE: disabled
          TRADE_DONATION_POOL_MODE: disabled
          TRADE_DONATION_POOL_ENABLED: "false"
        run: npm run build

      - name: Exact diff hygiene
        run: git diff --check

      - name: Package exact candidate tree
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar.gz --prefix=Website2/ HEAD > donation-upgrade-candidate.tar.gz
          sha256sum donation-upgrade-candidate.tar.gz > donation-upgrade-candidate.sha256
          git rev-parse HEAD > donation-upgrade-candidate.ref

      - name: Upload exact candidate tree
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: donation-upgrade-candidate-${{ github.run_id }}
          path: |
            donation-upgrade-candidate.tar.gz
            donation-upgrade-candidate.sha256
            donation-upgrade-candidate.ref
          if-no-files-found: error
          retention-days: 7

      - name: Post run locator
        if: always() && github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/run.md <<EOF
          Exact Donation Upgrade engineering-gate run.

          - Run: $GITHUB_RUN_ID
          - Commit: $GITHUB_SHA
          - Job status before reporting: ${{ job.status }}
          - Artifact: donation-upgrade-candidate-$GITHUB_RUN_ID
          EOF
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "Donation Upgrade engineering gates — run $GITHUB_RUN_ID" \
            --body-file /tmp/run.md
