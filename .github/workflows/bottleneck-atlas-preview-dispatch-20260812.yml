name: Dispatch Bottleneck Atlas exact Preview 2026-08-12

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/bottleneck-atlas-preview-dispatch-20260812.yml

permissions:
  actions: write
  contents: read
  pull-requests: write

concurrency:
  group: bottleneck-atlas-preview-dispatch-20260812
  cancel-in-progress: false

env:
  CONTROLLER_PATH: .github/workflows/bottleneck-atlas-preview-dispatch-20260812.yml
  RELEASE_WORKFLOW: vercel-release.yml
  RELEASE_REF: release/vercel-preview
  RELEASE_TARGET: preview
  EXPECTED_RELEASE_SHA: 6067bae2df1691d2a8153755f4087ca7e8819cfb
  EXPECTED_TRIGGER_PARENT: 0000000000000000000000000000000000000000
  PREVIOUS_RELEASE_RUN_ID: '31557770256'

jobs:
  dispatch:
    if: ${{ false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact controller commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          token: ${{ github.token }}

      - name: Verify exact one-file trigger and Preview target
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'ghuser29384/Website2'
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$(git rev-parse HEAD^)" = "$EXPECTED_TRIGGER_PARENT"
          changed="$(git diff-tree --no-commit-id --name-only -r HEAD | sed '/^$/d')"
          test "$changed" = "$CONTROLLER_PATH"
          test "$RELEASE_TARGET" = 'preview'
          test "$RELEASE_REF" = 'release/vercel-preview'
          [[ "$EXPECTED_RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          remote_sha="$(git ls-remote origin "refs/heads/$RELEASE_REF" | awk '{print $1}')"
          test "$remote_sha" = "$EXPECTED_RELEASE_SHA"
          workflow_state="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$RELEASE_WORKFLOW" --jq .state)"
          test "$workflow_state" = 'active'

      - name: Dispatch and resolve the exact gated Preview run
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            --arg workflow_ref main \
            --arg release_ref "$RELEASE_REF" \
            --arg target "$RELEASE_TARGET" \
            --arg expected_sha "$EXPECTED_RELEASE_SHA" \
            '{ref:$workflow_ref,inputs:{ref:$release_ref,target:$target,expected_sha:$expected_sha}}' \
            | gh api --method POST \
                -H 'Accept: application/vnd.github+json' \
                -H 'X-GitHub-Api-Version: 2022-11-28' \
                "repos/$GITHUB_REPOSITORY/actions/workflows/$RELEASE_WORKFLOW/dispatches" \
                --input - >/dev/null

          run_id=''
          for _ in $(seq 1 30); do
            while IFS= read -r candidate_id; do
              [[ -n "$candidate_id" ]] || continue
              candidate="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$candidate_id")"
              if [[ "$(jq -r '.event' <<<"$candidate")" = 'workflow_dispatch' \
                && "$(jq -r '.head_branch' <<<"$candidate")" = 'main' \
                && "$(jq -r '.inputs.ref // empty' <<<"$candidate")" = "$RELEASE_REF" \
                && "$(jq -r '.inputs.target // empty' <<<"$candidate")" = "$RELEASE_TARGET" \
                && "$(jq -r '.inputs.expected_sha // empty' <<<"$candidate")" = "$EXPECTED_RELEASE_SHA" ]]; then
                run_id="$candidate_id"
                break 2
              fi
            done < <(
              gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$RELEASE_WORKFLOW/runs?event=workflow_dispatch&per_page=20" \
                --jq ".workflow_runs[] | select(.id > $PREVIOUS_RELEASE_RUN_ID) | .id"
            )
            sleep 2
          done

          test -n "$run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "run_url=https://github.com/$GITHUB_REPOSITORY/actions/runs/$run_id" >> "$GITHUB_OUTPUT"

      - name: Record exact Preview dispatch on the draft pull request
        if: steps.release.outputs.run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.release.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          gh pr comment 618 --repo "$GITHUB_REPOSITORY" --body "Re-dispatched the permanent gated Preview for exact candidate \`$EXPECTED_RELEASE_SHA\` after aligning the stale signed-out feed assertion. Run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$RUN_ID. Production was not targeted."

# Registered inertly. A second exact one-file pull request arms this controller.