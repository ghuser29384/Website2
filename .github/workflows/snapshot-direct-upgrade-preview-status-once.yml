name: Snapshot Direct Donation Upgrade preview status once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/snapshot-direct-upgrade-preview-status-once.yml

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  snapshot:
    if: github.repository == 'ghuser29384/Website2' && github.actor == 'ghuser29384'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out snapshot commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          token: ${{ github.token }}

      - name: Remove one-time snapshot and comment current release state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CONTROLLER_PATH: .github/workflows/snapshot-direct-upgrade-preview-status-once.yml
        run: |
          set -euo pipefail
          changed="$(git diff-tree --no-commit-id --name-only -r HEAD | sed '/^$/d')"
          test "$changed" = "$CONTROLLER_PATH"
          blob_sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/$CONTROLLER_PATH?ref=main" --jq .sha)"
          jq -n --arg message 'Remove one-time Direct Donation Upgrade preview status snapshot' --arg sha "$blob_sha" --arg branch main '{message:$message,sha:$sha,branch:$branch}' \
            | gh api --method DELETE "repos/$GITHUB_REPOSITORY/contents/$CONTROLLER_PATH" --input - >/dev/null

          run_json="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow vercel-release.yml \
            --event workflow_dispatch \
            --limit 30 \
            --json databaseId,createdAt,status,conclusion,headSha,url \
            --jq 'sort_by(.createdAt) | last // empty')"
          test -n "$run_json"
          run_id="$(jq -r .databaseId <<<"$run_json")"
          created_at="$(jq -r .createdAt <<<"$run_json")"
          status="$(jq -r .status <<<"$run_json")"
          conclusion="$(jq -r '.conclusion // ""' <<<"$run_json")"
          url="$(jq -r .url <<<"$run_json")"
          jobs="$(gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json jobs --jq '[.jobs[] | {name,status,conclusion}]')"
          gh pr comment 418 --repo "$GITHUB_REPOSITORY" --body "## Gated preview status snapshot\n\n- Run: $url\n- Run ID: \`$run_id\`\n- Created: \`$created_at\`\n- Status: \`$status\`\n- Conclusion: \`${conclusion:-pending}\`\n- Jobs: \`$jobs\`\n\nThis is an observation only; no preview-success claim is made until the release and deployment inspection complete."
