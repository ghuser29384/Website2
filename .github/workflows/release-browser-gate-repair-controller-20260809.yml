name: Repair release browser-gate contract

on:
  push:
    branches:
      - ops/release-browser-gate-contract-20260809
    paths:
      - ".github/workflows/release-browser-gate-repair-controller-20260809.yml"

permissions:
  contents: write

concurrency:
  group: release-browser-gate-repair-controller-20260809
  cancel-in-progress: true

jobs:
  repair-and-prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      EXPECTED_MAIN_SHA: bb3b0e4608b7282aecc9d1fe11b5cb310c409347
      CLEAN_BRANCH: fix/release-browser-gate-contract-20260809

    steps:
      - name: Check out the exact repair branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard current-main ancestry and repair inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse --abbrev-ref HEAD)" = 'ops/release-browser-gate-contract-20260809'
          git merge-base --is-ancestor "$EXPECTED_MAIN_SHA" HEAD
          node --check scripts/apply-release-browser-gate-repair.mjs
          node --check scripts/apply-release-browser-gate-followup.mjs
          node --check scripts/apply-release-browser-gate-focused-fixes.mjs

      - name: Apply the deterministic repair
        shell: bash
        run: |
          set -euo pipefail
          node scripts/apply-release-browser-gate-repair.mjs
          node scripts/apply-release-browser-gate-followup.mjs
          node scripts/apply-release-browser-gate-focused-fixes.mjs
          git diff --check
          git status --short

      - name: Commit the exact local candidate
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            playwright.release.config.ts \
            package.json \
            .github/workflows/vercel-release.yml \
            public/moral-trade-live-create-router.js \
            scripts/vercel-release-workflow.test.mjs \
            src/lib/command-center-handoff.test.ts \
            src/lib/release-browser-gate-contract.test.ts \
            tests/commitments-live-portfolio.spec.ts \
            tests/exact-live-local-time.spec.ts \
            tests/exact-live-route-recommendations.spec.ts \
            tests/exact-live-verification.spec.ts \
            tests/meta-explanatory-copy.spec.ts \
            tests/moral-trade-brand.spec.ts \
            docs/testing/release-browser-gate.md
          git commit -m 'test: repair release browser-gate contract'
          candidate_sha="$(git rev-parse HEAD)"
          echo "sha=$candidate_sha" >> "$GITHUB_OUTPUT"
          printf 'candidate=%s\ntree=%s\nbase=%s\n' \
            "$candidate_sha" \
            "$(git rev-parse HEAD^{tree})" \
            "$EXPECTED_MAIN_SHA" \
            | tee release-gate-candidate.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Run repository tests, lint, TypeScript, and build
        shell: bash
        env:
          NEXT_PUBLIC_SITE_URL: https://www.moraltrade.org
          SITE_URL: https://www.moraltrade.org
          VERCEL: "1"
          VERCEL_ENV: preview
        run: |
          set -euo pipefail
          npm test | tee release-gate-unit.log
          npm run lint -- --quiet | tee release-gate-lint.log
          npx tsc --noEmit | tee release-gate-typescript.log
          npm run build | tee release-gate-build.log

      - name: Install Chromium runtime
        run: npx playwright install --with-deps chromium

      - name: Run focused current-contract browser tests
        shell: bash
        env:
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3210
          SITE_URL: http://127.0.0.1:3210
          PLAYWRIGHT_HTML_OPEN: never
        run: |
          set -euo pipefail
          npm run test:e2e:release -- \
            tests/commitments-live-portfolio.spec.ts \
            tests/create-common-ground-pool.spec.ts \
            tests/create-entry-routing.spec.ts \
            tests/exact-live-command-center.spec.ts \
            tests/exact-live-local-time.spec.ts \
            tests/exact-live-route-recommendations.spec.ts \
            tests/exact-live-verification.spec.ts \
            tests/meta-explanatory-copy.spec.ts \
            tests/moral-trade-brand.spec.ts \
            tests/public-routes.spec.ts \
            tests/trade-controls.spec.ts \
            --reporter=line \
            --workers=1 \
            | tee release-gate-focused-browser.log

      - name: Run complete credential-free release browser gate
        id: browser
        shell: bash
        env:
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3210
          SITE_URL: http://127.0.0.1:3210
          PLAYWRIGHT_HTML_OPEN: never
          PLAYWRIGHT_JSON_OUTPUT_NAME: release-playwright-results.json
        run: |
          set -uo pipefail
          set +e
          npm run test:e2e:release -- --reporter=line,json 2>&1 \
            | tee release-gate-browser.log
          status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$status" | tee release-gate-browser.exit-code
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Build browser-gate summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const lines = ['# Release browser-gate repair', ''];
          const status = fs.existsSync('release-gate-browser.exit-code')
            ? fs.readFileSync('release-gate-browser.exit-code', 'utf8').trim()
            : 'not-run';
          lines.push(`- Candidate: \`${process.env.CANDIDATE_SHA || 'unknown'}\``);
          lines.push(`- Browser exit code: \`${status}\``);
          if (fs.existsSync('release-playwright-results.json')) {
            const report = JSON.parse(fs.readFileSync('release-playwright-results.json', 'utf8'));
            for (const key of ['expected', 'unexpected', 'flaky', 'skipped']) {
              lines.push(`- ${key}: \`${report.stats?.[key] ?? 'unknown'}\``);
            }
          }
          lines.push('');
          fs.writeFileSync('release-gate-summary.md', `${lines.join('\n')}\n`);
          NODE
          cat release-gate-summary.md >> "$GITHUB_STEP_SUMMARY"
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}

      - name: Upload complete repair evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-browser-gate-repair-${{ github.run_id }}
          path: |
            release-gate-candidate.txt
            release-gate-summary.md
            release-gate-*.log
            release-gate-browser.exit-code
            release-playwright-results.json
            test-results
            playwright-report
          if-no-files-found: warn
          retention-days: 30

      - name: Publish a clean candidate branch after every gate passes
        if: ${{ steps.browser.outputs.status == '0' }}
        shell: bash
        run: |
          set -euo pipefail
          candidate_sha="${{ steps.candidate.outputs.sha }}"
          git switch --detach "$EXPECTED_MAIN_SHA"
          git cherry-pick "$candidate_sha"
          git push origin "HEAD:refs/heads/$CLEAN_BRANCH"
          printf 'clean_branch=%s\nclean_sha=%s\n' \
            "$CLEAN_BRANCH" \
            "$(git rev-parse HEAD)" \
            | tee release-gate-clean-branch.txt

      - name: Preserve complete browser-gate status
        if: always()
        shell: bash
        run: |
          status="${{ steps.browser.outputs.status }}"
          if [[ -z "$status" ]]; then status=1; fi
          exit "$status"
