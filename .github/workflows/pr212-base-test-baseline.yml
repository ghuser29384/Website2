name: PR 212 exact-base full-test comparison

on:
  push:
    branches:
      - ops/pr212-individual-capacity-qa-controller-20260727
    paths:
      - .github/workflows/pr212-base-test-baseline.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: pr212-exact-base-full-test-comparison
  cancel-in-progress: false

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      PR_BASE_SHA: bb32b5c5a58442f97bef642be58ed01a57f0d91b
      FEATURE_RUN_ID: "30270105060"
      QA_SUPABASE_DB_URL: ${{ secrets.QA_SUPABASE_DB_URL }}
      NEXT_PUBLIC_SUPABASE_URL: https://hvmxfjjbdcgjjudmthdz.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.QA_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.QA_SUPABASE_SERVICE_ROLE_KEY }}
      QA_TEST_PASSWORD: ${{ secrets.QA_TEST_PASSWORD }}
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      SITE_URL: http://127.0.0.1:3000
      INSTITUTIONAL_TRADES_ENABLED: "true"
      INSTITUTIONAL_POOLS_ENABLED: "true"
      INSTITUTIONAL_ENTERPRISE_API_ENABLED: "true"
      INSTITUTIONAL_WEBHOOKS_ENABLED: "true"
      CRON_SECRET: qa-institutional-cron-not-production

    steps:
      - name: Check out operations branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate comparison inputs and materialize exact PR base
        shell: bash
        run: |
          set -euo pipefail
          test -n "$QA_SUPABASE_DB_URL"
          [[ "$QA_SUPABASE_DB_URL" == *"hvmxfjjbdcgjjudmthdz"* ]]
          [[ "$QA_SUPABASE_DB_URL" != *"jnpoxvalyjtdghnperyu"* ]]
          git cat-file -e "${PR_BASE_SHA}^{commit}"
          rm -rf /tmp/pr212-base
          git worktree add --detach /tmp/pr212-base "$PR_BASE_SHA"
          test "$(git -C /tmp/pr212-base rev-parse HEAD)" = "$PR_BASE_SHA"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: /tmp/pr212-base/package-lock.json

      - name: Install exact-base dependencies
        shell: bash
        working-directory: /tmp/pr212-base
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            if npm ci; then exit 0; fi
            if (( attempt == 4 )); then exit 1; fi
            sleep $((attempt * 20))
          done

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.84.2
          github-token: ${{ github.token }}

      - name: Reproduce the feature QA type-generation environment on the exact base
        shell: bash
        working-directory: /tmp/pr212-base
        run: |
          set -euo pipefail
          supabase gen types typescript --db-url "$QA_SUPABASE_DB_URL" --schema public > /tmp/base-database.types.ts
          test -s /tmp/base-database.types.ts
          cp /tmp/base-database.types.ts src/lib/supabase/database.types.ts
          sha256sum /tmp/base-database.types.ts > /tmp/base-database.types.sha256

      - name: Run the complete exact-base test suite and capture every result
        shell: bash
        working-directory: /tmp/pr212-base
        run: |
          set +e
          npm test > /tmp/base-npm-test.log 2>&1
          status=$?
          set -e
          echo "$status" > /tmp/base-npm-test.status
          cat /tmp/base-npm-test.log

      - name: Fetch the exact feature-run log and compare failing tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ops/pr212-test-baseline
          gh run view "$FEATURE_RUN_ID" --repo "$GITHUB_REPOSITORY" --log > /tmp/feature-run.log

          python - <<'PY'
          from __future__ import annotations

          import json
          import re
          from pathlib import Path

          ansi = re.compile(r"\x1b\[[0-9;]*[A-Za-z]")
          fail_line = re.compile(r"(?:^|\s)✖\s+(.+?)\s+\([0-9.]+ms\)\s*$")
          summary_line = re.compile(r"(?:^|\s)ℹ\s+(tests|pass|fail|cancelled|skipped|todo)\s+(\d+)\s*$", re.I)

          def clean(line: str) -> str:
              return ansi.sub("", line).replace("\ufeff", "")

          def parse(path: str, step_filter: str | None = None) -> tuple[list[str], dict[str, int]]:
              failures: list[str] = []
              summary: dict[str, int] = {}
              for raw in Path(path).read_text(errors="replace").splitlines():
                  line = clean(raw)
                  if step_filter and step_filter not in line:
                      continue
                  match = fail_line.search(line)
                  if match:
                      failures.append(match.group(1).strip())
                  sm = summary_line.search(line)
                  if sm:
                      summary[sm.group(1).lower()] = int(sm.group(2))
              return sorted(set(failures)), summary

          base_failures, base_summary = parse("/tmp/base-npm-test.log")
          feature_failures, feature_summary = parse("/tmp/feature-run.log", "Run complete test suite")

          source_roots = [Path("/tmp/pr212-base/src"), Path("/tmp/pr212-base/scripts"), Path("/tmp/pr212-base/tests")]
          text_files = []
          for root in source_roots:
              if root.exists():
                  text_files.extend(p for p in root.rglob("*") if p.is_file() and p.suffix in {".ts", ".tsx", ".js", ".mjs", ".cjs"})

          def locate(title: str) -> list[str]:
              found = []
              for path in text_files:
                  try:
                      if title in path.read_text(errors="ignore"):
                          found.append(str(path.relative_to("/tmp/pr212-base")))
                  except OSError:
                      continue
              return found

          all_titles = sorted(set(base_failures) | set(feature_failures))
          locations = {title: locate(title) for title in all_titles}
          common = sorted(set(base_failures) & set(feature_failures))
          feature_only = sorted(set(feature_failures) - set(base_failures))
          base_only = sorted(set(base_failures) - set(feature_failures))

          report = {
              "pr_base_sha": "bb32b5c5a58442f97bef642be58ed01a57f0d91b",
              "feature_run_id": 30270105060,
              "feature_head_sha": "2e45845ed5b2c880f1c956f5a75ef578bcc591bf",
              "base_test_exit_status": int(Path("/tmp/base-npm-test.status").read_text().strip()),
              "base_summary": base_summary,
              "feature_summary": feature_summary,
              "base_failure_count": len(base_failures),
              "feature_failure_count": len(feature_failures),
              "common_failure_count": len(common),
              "feature_only_failure_count": len(feature_only),
              "base_only_failure_count": len(base_only),
              "common_failures": common,
              "feature_only_failures": feature_only,
              "base_only_failures": base_only,
              "source_locations": locations,
          }
          Path("ops/pr212-test-baseline/report.json").write_text(json.dumps(report, indent=2, ensure_ascii=False) + "\n")

          lines = [
              f"PR base: {report['pr_base_sha']}",
              f"Feature head: {report['feature_head_sha']}",
              f"Base summary: {base_summary}",
              f"Feature summary: {feature_summary}",
              f"Base unique failures: {len(base_failures)}",
              f"Feature unique failures: {len(feature_failures)}",
              f"Common failures: {len(common)}",
              f"Feature-only failures: {len(feature_only)}",
              f"Base-only failures: {len(base_only)}",
              "",
              "=== FEATURE-ONLY FAILURES ===",
          ]
          lines.extend(feature_only or ["(none)"])
          lines.extend(["", "=== COMMON FAILURES ==="])
          lines.extend(common or ["(none)"])
          lines.extend(["", "=== BASE-ONLY FAILURES ==="])
          lines.extend(base_only or ["(none)"])
          lines.extend(["", "=== SOURCE LOCATIONS ==="])
          for title in all_titles:
              lines.append(f"{title}: {', '.join(locations[title]) if locations[title] else '(not located)'}")
          Path("ops/pr212-test-baseline/report.txt").write_text("\n".join(lines) + "\n")
          PY

          cp /tmp/base-npm-test.status ops/pr212-test-baseline/base-npm-test.status
          cp /tmp/base-database.types.sha256 ops/pr212-test-baseline/base-database.types.sha256
          grep -E '✖|ℹ (tests|pass|fail|cancelled|skipped|todo) ' /tmp/base-npm-test.log > ops/pr212-test-baseline/base-results.txt || true
          grep 'Run complete test suite' /tmp/feature-run.log | grep -E '✖|ℹ (tests|pass|fail|cancelled|skipped|todo) ' > ops/pr212-test-baseline/feature-results.txt || true

      - name: Commit comparison evidence to operations branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops/pr212-test-baseline
          git commit -m "Compare PR 212 full tests with exact base"
          git push origin HEAD:ops/pr212-individual-capacity-qa-controller-20260727
