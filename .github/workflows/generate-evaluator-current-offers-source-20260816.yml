name: Generate corrected evaluator source for current Offers

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/generate-evaluator-current-offers-source-20260816.yml

permissions:
  contents: read

concurrency:
  group: generate-evaluator-current-offers-source-20260816
  cancel-in-progress: true

jobs:
  generate:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'integration/evaluator-core-loop-current-main-20260815'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Generate exact corrected full source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path('tests/evaluator-core-loop-authenticated.source.ts')
          output_path = Path('evaluator-core-loop-authenticated.corrected.ts')
          lines = source_path.read_text().splitlines()

          heading_markers = [
              index
              for index, line in enumerate(lines)
              if line.strip()
              == r'/Evaluator core-loop verification\s*↔\s*Private QA response verification/,'
          ]
          if len(heading_markers) != 1:
              raise SystemExit(
                  f'Expected one stale heading marker, found {len(heading_markers)}'
              )
          marker = heading_markers[0]
          start = marker - 3
          end = marker + 2
          if [line.strip() for line in lines[start:end]] != [
              'await expect(',
              'evaluatorOfferCard.getByRole("heading", { level: 4 }),',
              ').toHaveText(',
              r'/Evaluator core-loop verification\s*↔\s*Private QA response verification/,',
              ');',
          ]:
              raise SystemExit('The stale heading assertion shape changed unexpectedly.')
          indent = lines[start][:-len(lines[start].lstrip())]
          lines[start:end] = [
              f'{indent}const evaluatorHeading = evaluatorOfferCard.getByRole("heading", {{',
              f'{indent}  level: 4,',
              f'{indent}  name: /Evaluator core-loop verification\\s+Private QA response verification/i,',
              f'{indent}}});',
              f'{indent}await expect(evaluatorHeading).toHaveText(',
              f'{indent}  /Evaluator core-loop verification\\s*\\/\\s*Private QA response verification/,',
              f'{indent});',
          ]

          link_markers = [
              index
              for index, line in enumerate(lines)
              if line.strip()
              == '.getByRole("link", { exact: true, name: "Open full terms ↗" })'
          ]
          if len(link_markers) != 1:
              raise SystemExit(
                  f'Expected one stale full-terms marker, found {len(link_markers)}'
              )
          marker = link_markers[0]
          start = marker - 1
          end = marker + 2
          if [line.strip() for line in lines[start:end]] != [
              'await evaluatorOfferCard',
              '.getByRole("link", { exact: true, name: "Open full terms ↗" })',
              '.click();',
          ]:
              raise SystemExit('The stale full-terms assertion shape changed unexpectedly.')
          indent = lines[start][:-len(lines[start].lstrip())]
          lines[start:end] = [
              f'{indent}await evaluatorOfferCard',
              f'{indent}  .getByText("Exact terms & more actions", {{ exact: true }})',
              f'{indent}  .click();',
              f'{indent}await evaluatorOfferCard',
              f'{indent}  .getByRole("link", {{ exact: true, name: "Open full terms" }})',
              f'{indent}  .click();',
          ]

          output_path.write_text('\n'.join(lines) + '\n')
          PY
          test -s evaluator-core-loop-authenticated.corrected.ts
          grep -F 'Exact terms & more actions' evaluator-core-loop-authenticated.corrected.ts
          grep -F 'Open full terms"' evaluator-core-loop-authenticated.corrected.ts
          if grep -Fq 'Open full terms ↗' evaluator-core-loop-authenticated.corrected.ts; then
            echo 'Stale full-terms assertion remains.' >&2
            exit 1
          fi
          if grep -Fq 'verification\s*↔' evaluator-core-loop-authenticated.corrected.ts; then
            echo 'Stale heading assertion remains.' >&2
            exit 1
          fi
          sha256sum evaluator-core-loop-authenticated.corrected.ts | tee corrected-source.sha256

      - name: Upload corrected source
        uses: actions/upload-artifact@v4
        with:
          name: evaluator-core-loop-current-offers-corrected-source-${{ github.event.pull_request.head.sha }}
          retention-days: 7
          if-no-files-found: error
          path: |
            evaluator-core-loop-authenticated.corrected.ts
            corrected-source.sha256
