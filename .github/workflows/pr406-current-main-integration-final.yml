name: PR 406 current-main integration finalizer

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/pr406-current-main-integration-final.yml

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pr406-current-main-integration-finalizer-20260801
  cancel-in-progress: false

env:
  TARGET_BRANCH: feature/pledge-impact-live-foundation-20260801
  EXPECTED_HEAD: a73141c88438cbbecf79cf693109bc460150b70a
  FINALIZER_PATH: .github/workflows/pr406-current-main-integration-final.yml
  STALE_CONTROLLER_PATH: .github/workflows/pr406-current-main-integration-controller.yml
  PR_NUMBER: "406"

jobs:
  integrate:
    if: github.repository == 'ghuser29384/Website2' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out exact feature head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Guard exact feature state
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')" = "$EXPECTED_HEAD"

      - name: Remove temporary controllers and pin clean main
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for path in "$FINALIZER_PATH" "$STALE_CONTROLLER_PATH"; do
            sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/$path?ref=main" --jq .sha 2>/dev/null || true)"
            if [[ -n "$sha" ]]; then
              jq -n \
                --arg message 'Remove temporary PR 406 current-main integration controller' \
                --arg sha "$sha" \
                --arg branch main \
                '{message:$message,sha:$sha,branch:$branch}' \
                | gh api --method DELETE "repos/$GITHUB_REPOSITORY/contents/$path" --input - >/dev/null
            fi
          done
          git fetch origin main
          base_sha="$(git rev-parse origin/main)"
          test -n "$base_sha"
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"

      - name: Merge pinned main and update the branch QA contract
        shell: bash
        env:
          BASE_SHA: ${{ steps.base.outputs.base_sha }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-commit --no-ff "$BASE_SHA"
          test ! -e "$FINALIZER_PATH"
          test ! -e "$STALE_CONTROLLER_PATH"

          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/pledge-impact-live-foundation-gates.yml')
          text = path.read_text(encoding='utf-8')

          env_needle = '''      QA_SUPABASE_DB_URL: ${{ secrets.QA_SUPABASE_DB_URL }}
      EXPECTED_QA_REF: hvmxfjjbdcgjjudmthdz'''
          env_replacement = '''      QA_SUPABASE_DB_URL: ${{ secrets.QA_SUPABASE_DB_URL }}
      EXPECTED_QA_REF: hvmxfjjbdcgjjudmthdz
      MIGRATION_VERSION: "20260801030000"
      MIGRATION_BLOB: c83ab30d7a84b2c97a70181fb5ba909cbebb75f4'''
          if text.count(env_needle) != 1:
              raise SystemExit(f'unexpected QA env inventory: {text.count(env_needle)}')
          text = text.replace(env_needle, env_replacement, 1)

          old = '''      - name: Run migration and live regression in one rollback-only transaction
        shell: bash
        run: |
          set -euo pipefail
          {
            printf '%s\\n' '\\set ON_ERROR_STOP on' 'begin;'
            cat supabase/migrations/20260801030000_mpgf_pledge_impact_live_foundation.sql
            tail -n +2 supabase/tests/mpgf_pledge_impact_live_foundation.sql | sed '$d'
            printf '%s\\n' 'rollback;'
          } > qa-pledge-impact-live-transaction.sql

          psql "$QA_SUPABASE_DB_URL" \\
            --no-psqlrc \\
            --set ON_ERROR_STOP=1 \\
            --file qa-pledge-impact-live-transaction.sql \\
            2>&1 | tee qa-pledge-impact-live.log'''

          new = '''      - name: Run migration or persistent-schema live regression
        shell: bash
        run: |
          set -euo pipefail
          registered="$(psql "$QA_SUPABASE_DB_URL" --no-psqlrc -Atqc \\
            "select count(*) from supabase_migrations.schema_migrations where version = '$MIGRATION_VERSION';")"

          case "$registered" in
            0)
              {
                printf '%s\\n' '\\set ON_ERROR_STOP on' 'begin;'
                cat supabase/migrations/20260801030000_mpgf_pledge_impact_live_foundation.sql
                tail -n +2 supabase/tests/mpgf_pledge_impact_live_foundation.sql | sed '$d'
                printf '%s\\n' 'rollback;'
              } > qa-pledge-impact-live-transaction.sql
              ;;
            1)
              marker="$(psql "$QA_SUPABASE_DB_URL" --no-psqlrc -Atqc \\
                "select coalesce(statements[1], '') from supabase_migrations.schema_migrations where version = '$MIGRATION_VERSION';")"
              [[ "$marker" == *"$MIGRATION_BLOB"* ]] || {
                echo 'Registered migration source does not match this candidate.' >&2
                exit 1
              }
              cp supabase/tests/mpgf_pledge_impact_live_foundation.sql \\
                qa-pledge-impact-live-transaction.sql
              ;;
            *)
              echo "Unexpected migration inventory count: $registered" >&2
              exit 1
              ;;
          esac

          psql "$QA_SUPABASE_DB_URL" \\
            --no-psqlrc \\
            --set ON_ERROR_STOP=1 \\
            --file qa-pledge-impact-live-transaction.sql \\
            2>&1 | tee qa-pledge-impact-live.log'''

          if text.count(old) != 1:
              raise SystemExit(f'unexpected QA regression step inventory: {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          git diff --name-only "$BASE_SHA" | sort > /tmp/actual-files.txt
          cat > /tmp/expected-files.txt <<'EOF'
          .github/workflows/pledge-impact-live-foundation-gates.yml
          src/app/api/mpgf/pledge-impact/route.ts
          src/lib/mpgf/pledge-impact-live-integration.test.ts
          src/lib/mpgf/pledge-impact-live-server.ts
          src/lib/mpgf/pledge-impact-live.test.ts
          src/lib/mpgf/pledge-impact-live.ts
          supabase/migrations/20260801030000_mpgf_pledge_impact_live_foundation.sql
          supabase/tests/mpgf_pledge_impact_live_foundation.sql
          EOF
          sort -o /tmp/expected-files.txt /tmp/expected-files.txt
          diff -u /tmp/expected-files.txt /tmp/actual-files.txt
          git diff --check "$BASE_SHA"

      - name: Verify pinned main stayed current
        shell: bash
        env:
          BASE_SHA: ${{ steps.base.outputs.base_sha }}
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"

      - name: Commit and push the exact integrated candidate
        id: publish
        shell: bash
        env:
          BASE_SHA: ${{ steps.base.outputs.base_sha }}
        run: |
          set -euo pipefail
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')" = "$EXPECTED_HEAD"
          git add -A
          git diff --cached --check
          git commit -m 'Merge current main into pledge-impact live foundation'
          candidate_sha="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^1)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD^2)" = "$BASE_SHA"
          git diff --name-only "$BASE_SHA" HEAD | sort > /tmp/final-files.txt
          diff -u /tmp/expected-files.txt /tmp/final-files.txt
          git push --force-with-lease="refs/heads/$TARGET_BRANCH:$EXPECTED_HEAD" \
            origin "HEAD:refs/heads/$TARGET_BRANCH"
          echo "candidate_sha=$candidate_sha" >> "$GITHUB_OUTPUT"

      - name: Report success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Integrated current clean main into PR #406 and pushed exact candidate \`${{ steps.publish.outputs.candidate_sha }}\` on base \`${{ steps.base.outputs.base_sha }}\`. The diff remains exactly eight files, and the dedicated branch workflow now handles both absent and persistently registered QA migration states. Automatic exact-head code, SQL, and release-classification gates are now authoritative. PR remains draft; production and forecast publication remain unchanged."

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "The final PR #406 current-main integration controller failed in run \`$GITHUB_RUN_ID\`. Both temporary main controllers were removed before branch mutation. No feature push occurred unless every exact-head, eight-file, pinned-base, merge-parent, and force-with-lease guard passed."
