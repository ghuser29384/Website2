name: Gate and preview PR 402 exact head once

on:
  push:
    branches:
      - ops/release-pr402-134d-20260802
    paths:
      - .github/workflows/release-pr402-134d-once.yml

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-pr402-134d-once
  cancel-in-progress: false

jobs:
  gate-preview:
    if: github.repository == 'ghuser29384/Website2'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      OPS_BRANCH: ops/release-pr402-134d-20260802
      WORKFLOW_PATH: .github/workflows/release-pr402-134d-once.yml
      RESULT_PATH: .ops-evidence/pr402-release-134d.json
      TARGET_BRANCH: fix/discover-pledge-clarity-20260801
      EXPECTED_HEAD: 134d89d3ddefcbb96a5f06af99edf95175420985
      EXPECTED_MAIN: 43a791175b34e279adbb4d5a946addb723ed8622
      VERCEL_ORG_ID: team_ySu6sF3Uho1E1GnJtCQPVEuJ
      VERCEL_PROJECT_ID: prj_Em3j7Uj7RatX2R1ZYhla3XSHRde7
      VERCEL_CLI_VERSION: 50.38.1

    steps:
      - name: Check out exact PR 402 head
        uses: actions/checkout@v4
        with:
          ref: fix/discover-pledge-clarity-20260801
          fetch-depth: 0

      - name: Guard exact current-main candidate and diff
        id: guard
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')" = "$EXPECTED_HEAD"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          test "$(git merge-base HEAD origin/main)" = "$EXPECTED_MAIN"
          git diff --check origin/main HEAD
          git diff --name-only origin/main HEAD | sort > /tmp/pr402-actual-files.txt
          printf '%s\n' \
            public/discover/payload/0.txt \
            public/discover/payload/1.txt \
            public/discover/payload/2.txt \
            public/discover/payload/3.txt \
            public/discover/payload/4.txt \
            public/discover/payload/5.txt \
            public/discover/payload/6.txt \
            public/discover/payload/manifest.json \
            src/discover-pledge-clarity.test.ts \
            src/discover/moral-trade-discover.source.html \
            tests/discover-pledge-clarity.spec.ts \
            | sort > /tmp/pr402-expected-files.txt
          diff -u /tmp/pr402-expected-files.txt /tmp/pr402-actual-files.txt

      - name: Use Node 24
        if: steps.guard.outcome == 'success'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        id: install
        if: steps.guard.outcome == 'success'
        continue-on-error: true
        run: npm ci

      - name: Run exact repository and build gates
        id: gates
        if: steps.install.outcome == 'success'
        continue-on-error: true
        env:
          NEXT_PUBLIC_SITE_URL: https://www.moraltrade.org
          SITE_URL: https://www.moraltrade.org
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder
          CONDITIONAL_PAYMENTS_MODE: disabled
          TRADE_DONATION_POOL_ENABLED: 'false'
          TRADE_DONATION_POOL_MODE: disabled
          DIRECT_DONATION_UPGRADES_ENABLED: 'false'
          DIRECT_DONATION_UPGRADE_MODE: disabled
        shell: bash
        run: |
          set -euo pipefail
          npm test 2>&1 | tee /tmp/pr402-repository-tests.log
          npm run lint -- --quiet 2>&1 | tee /tmp/pr402-eslint.log
          npx tsc --noEmit 2>&1 | tee /tmp/pr402-typescript.log
          npm run build 2>&1 | tee /tmp/pr402-build.log

      - name: Run exact local desktop and mobile browser gates
        id: local-browser
        if: steps.gates.outcome == 'success'
        continue-on-error: true
        env:
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3210
          SITE_URL: http://127.0.0.1:3210
          PLAYWRIGHT_HTML_OPEN: never
        shell: bash
        run: |
          set -euo pipefail
          npx playwright install --with-deps chromium
          npx playwright test \
            tests/discover-pledge-clarity.spec.ts \
            tests/discover-live-search.spec.ts \
            --reporter=line 2>&1 | tee /tmp/pr402-local-playwright.log

      - name: Link canonical Vercel project and build on GitHub Actions
        id: vercel-build
        if: steps.local-browser.outcome == 'success'
        continue-on-error: true
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' \
            "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          npx --yes "vercel@$VERCEL_CLI_VERSION" pull \
            --yes \
            --environment=preview \
            --token="$VERCEL_TOKEN" \
            --scope=ellen-s
          npx --yes "vercel@$VERCEL_CLI_VERSION" build \
            --token="$VERCEL_TOKEN" \
            --scope=ellen-s 2>&1 | tee /tmp/pr402-vercel-build.log

      - name: Deploy exact prebuilt Preview and verify identity
        id: deploy
        if: steps.vercel-build.outcome == 'success'
        continue-on-error: true
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          raw="$(npx --yes "vercel@$VERCEL_CLI_VERSION" deploy \
            --prebuilt \
            --token="$VERCEL_TOKEN" \
            --scope=ellen-s 2>&1 | tee /tmp/pr402-vercel-deploy.log)"
          clean="$(printf '%s\n' "$raw" | sed -r 's/\x1B\[[0-9;]*[mK]//g')"
          deployment_url="$(printf '%s\n' "$clean" | grep -Eo 'https://[A-Za-z0-9.-]+\.vercel\.app' | tail -n1)"
          test -n "$deployment_url"
          host="${deployment_url#https://}"
          printf '%s\n' "$deployment_url" > /tmp/pr402-preview-url.txt

          state=''
          for attempt in $(seq 1 120); do
            curl --fail --silent --show-error \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v13/deployments/$host?teamId=$VERCEL_ORG_ID" \
              > /tmp/pr402-deployment.json
            state="$(node -e "const d=require('/tmp/pr402-deployment.json'); process.stdout.write(d.readyState ?? d.state ?? '')")"
            if [[ "$state" == 'READY' ]]; then break; fi
            if [[ "$state" == 'ERROR' || "$state" == 'CANCELED' ]]; then
              echo "Deployment terminal state: $state" >&2
              exit 1
            fi
            sleep 10
          done
          test "$state" = 'READY'

          node - <<'NODE'
          const fs = require('node:fs');
          const deployment = JSON.parse(fs.readFileSync('/tmp/pr402-deployment.json', 'utf8'));
          const state = deployment.readyState ?? deployment.state;
          const sha = deployment.meta?.githubCommitSha;
          if (state !== 'READY') throw new Error(`Deployment state: ${state}`);
          if (deployment.target != null) throw new Error(`Expected Preview target, got ${deployment.target}`);
          if (sha !== process.env.EXPECTED_HEAD) throw new Error(`Wrong deployed SHA: ${sha}`);
          const evidence = {
            deploymentId: deployment.id ?? deployment.uid,
            url: fs.readFileSync('/tmp/pr402-preview-url.txt', 'utf8').trim(),
            commit: sha,
            state,
            target: deployment.target ?? null,
          };
          fs.writeFileSync('/tmp/pr402-deployment-evidence.json', JSON.stringify(evidence, null, 2));
          NODE

      - name: Create temporary Vercel automation bypass
        id: bypass
        if: steps.deploy.outcome == 'success'
        continue-on-error: true
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          secret="$(python3 - <<'PY'
          import secrets, string
          alphabet = string.ascii_letters + string.digits
          print(''.join(secrets.choice(alphabet) for _ in range(32)))
          PY
          )"
          test "${#secret}" -eq 32
          echo "::add-mask::$secret"
          printf '%s' "$secret" > /tmp/pr402-bypass-secret
          jq -n --arg secret "$secret" \
            '{generate:{secret:$secret,note:"Temporary PR 402 current-main Preview QA"}}' \
            > /tmp/pr402-generate-bypass.json
          curl --fail --silent --show-error \
            --request PATCH \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/pr402-generate-bypass.json \
            "https://api.vercel.com/v1/projects/$VERCEL_PROJECT_ID/protection-bypass?teamId=$VERCEL_ORG_ID" \
            > /tmp/pr402-generate-bypass-response.json
          rm -f /tmp/pr402-generate-bypass.json /tmp/pr402-generate-bypass-response.json

      - name: Inspect exact protected Preview on desktop and mobile
        id: remote-browser
        if: steps.bypass.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          secret="$(cat /tmp/pr402-bypass-secret)"
          preview_url="$(cat /tmp/pr402-preview-url.txt)"
          echo "::add-mask::$secret"
          PREVIEW_URL="$preview_url" VERCEL_AUTOMATION_BYPASS_SECRET="$secret" \
            node --input-type=module <<'NODE' 2>&1 | tee /tmp/pr402-remote-playwright.log
          import fs from 'node:fs';
          import { chromium } from '@playwright/test';

          const base = process.env.PREVIEW_URL;
          const secret = process.env.VERCEL_AUTOMATION_BYPASS_SECRET;
          const path = '/discover?domain=pools&view=threshold&query=Find+pools&selected=pool-wild-research&selectedType=pool#discover';
          const target = new URL(path, base).href;
          const origin = new URL(base).origin;
          const evidence = { status: 'running', desktop: null, mobile390x844: null, errors: [] };

          function invariant(condition, message) {
            if (!condition) throw new Error(message);
          }

          async function inspect(viewport, mobile, screenshotPath) {
            const browser = await chromium.launch();
            const context = await browser.newContext({
              viewport,
              extraHTTPHeaders: {
                'x-vercel-protection-bypass': secret,
                'x-vercel-set-bypass-cookie': 'true',
              },
            });
            const page = await context.newPage();
            const pageErrors = [];
            const consoleErrors = [];
            const failedRequests = [];
            const badResponses = [];
            page.on('pageerror', error => pageErrors.push(error.message));
            page.on('console', message => {
              if (message.type() === 'error') consoleErrors.push(message.text());
            });
            page.on('requestfailed', request => {
              if (request.url().startsWith(origin)) {
                failedRequests.push(`${request.method()} ${request.url()} ${request.failure()?.errorText ?? ''}`);
              }
            });
            page.on('response', response => {
              if (response.url().startsWith(origin) && response.status() >= 400) {
                badResponses.push(`${response.status()} ${response.request().method()} ${response.url()}`);
              }
            });

            try {
              const response = await page.goto(target, { waitUntil: 'domcontentloaded', timeout: 45000 });
              invariant(response?.status() === 200, `Navigation status: ${response?.status()}`);
              await page.getByRole('heading', { name: /Wild-animal-suffering priority research pool/i }).waitFor();
              await page.getByRole('heading', { name: 'Preview your conditional pledge' }).waitFor();
              const slider = page.locator('[data-pledge-range][data-pool-id="pool-wild-research"]:visible').last();
              await slider.waitFor();
              await slider.evaluate(element => {
                element.value = '35';
                element.dispatchEvent(new Event('input', { bubbles: true }));
              });
              await page.getByText('0.43% of current gap', { exact: true }).first().waitFor();
              await page.getByText('$8,165 remains', { exact: true }).first().waitFor();
              await page.getByText('This is arithmetic, not a forecast of other contributors.', { exact: true }).first().waitFor();
              await page.getByText('Moving the slider does not save a pledge or authorize payment.', { exact: true }).first().waitFor();
              invariant(await page.getByText(/pivotality/i).count() === 0, 'Pivotality copy remains.');
              invariant(await page.getByText(/How likely am I to be pivotal/i).count() === 0, 'Pivotality question remains.');

              if (mobile) {
                const sheet = page.locator('.inspector.mobile-sheet');
                await sheet.waitFor();
                invariant(await sheet.isVisible(), 'Mobile inspector is hidden.');
                const bounds = await sheet.boundingBox();
                invariant(bounds, 'Mobile inspector has no bounds.');
                invariant(bounds.x >= -1, `Mobile inspector starts outside viewport: ${bounds.x}`);
                invariant(bounds.x + bounds.width <= viewport.width + 1, 'Mobile inspector exceeds viewport.');
                invariant(await sheet.evaluate(el => el.scrollWidth - el.clientWidth) <= 1, 'Mobile sheet overflows horizontally.');
                invariant(await page.locator('html').evaluate(el => el.scrollWidth - el.clientWidth) <= 1, 'Document overflows horizontally.');
              }

              await page.waitForTimeout(750);
              invariant(pageErrors.length === 0, `Page errors: ${pageErrors.join(' | ')}`);
              invariant(consoleErrors.length === 0, `Console errors: ${consoleErrors.join(' | ')}`);
              invariant(failedRequests.length === 0, `Failed same-origin requests: ${failedRequests.join(' | ')}`);
              invariant(badResponses.length === 0, `Bad same-origin responses: ${badResponses.join(' | ')}`);
              await page.screenshot({ path: screenshotPath, fullPage: true });
              return {
                status: 'passed',
                viewport,
                copy: {
                  pledge: '$35',
                  remaining: '$8,165 remains',
                  share: '0.43% of current gap',
                  nonForecast: true,
                  nonAuthorizing: true,
                  pivotalityAbsent: true,
                },
                pageErrors: 0,
                consoleErrors: 0,
                sameOriginRequestFailures: 0,
                sameOriginHttpErrors: 0,
              };
            } finally {
              await context.close();
              await browser.close();
            }
          }

          try {
            evidence.desktop = await inspect({ width: 1440, height: 900 }, false, '/tmp/pr402-preview-desktop.png');
            evidence.mobile390x844 = await inspect({ width: 390, height: 844 }, true, '/tmp/pr402-preview-mobile.png');
            evidence.status = 'passed';
            fs.writeFileSync('/tmp/pr402-remote-evidence.json', JSON.stringify(evidence, null, 2));
          } catch (error) {
            evidence.status = 'failed';
            evidence.errors.push(error instanceof Error ? error.message : String(error));
            fs.writeFileSync('/tmp/pr402-remote-evidence.json', JSON.stringify(evidence, null, 2));
            throw error;
          }
          NODE

      - name: Revoke temporary Vercel automation bypass
        id: revoke
        if: always() && steps.bypass.outcome == 'success'
        continue-on-error: true
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          secret="$(cat /tmp/pr402-bypass-secret)"
          echo "::add-mask::$secret"
          jq -n --arg secret "$secret" \
            '{revoke:{secret:$secret,regenerate:false}}' \
            > /tmp/pr402-revoke-bypass.json
          curl --fail --silent --show-error \
            --request PATCH \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/pr402-revoke-bypass.json \
            "https://api.vercel.com/v1/projects/$VERCEL_PROJECT_ID/protection-bypass?teamId=$VERCEL_ORG_ID" \
            > /tmp/pr402-revoke-bypass-response.json
          rm -f /tmp/pr402-bypass-secret /tmp/pr402-revoke-bypass.json /tmp/pr402-revoke-bypass-response.json

      - name: Upload complete immutable evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr402-current-main-preview-${{ github.run_id }}
          path: |
            /tmp/pr402-actual-files.txt
            /tmp/pr402-repository-tests.log
            /tmp/pr402-eslint.log
            /tmp/pr402-typescript.log
            /tmp/pr402-build.log
            /tmp/pr402-local-playwright.log
            /tmp/pr402-vercel-build.log
            /tmp/pr402-vercel-deploy.log
            /tmp/pr402-deployment-evidence.json
            /tmp/pr402-remote-playwright.log
            /tmp/pr402-remote-evidence.json
            /tmp/pr402-preview-desktop.png
            /tmp/pr402-preview-mobile.png
            test-results/**
          if-no-files-found: warn
          retention-days: 30

      - name: Persist sanitized result, remove controller, and report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GUARD_OUTCOME: ${{ steps.guard.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          GATES_OUTCOME: ${{ steps.gates.outcome }}
          LOCAL_BROWSER_OUTCOME: ${{ steps.local-browser.outcome }}
          VERCEL_BUILD_OUTCOME: ${{ steps.vercel-build.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          BYPASS_OUTCOME: ${{ steps.bypass.outcome }}
          REMOTE_BROWSER_OUTCOME: ${{ steps.remote-browser.outcome }}
          REVOKE_OUTCOME: ${{ steps.revoke.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const result = {
            runId: process.env.GITHUB_RUN_ID,
            runUrl: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            commit: process.env.EXPECTED_HEAD,
            main: process.env.EXPECTED_MAIN,
            outcomes: {
              guard: process.env.GUARD_OUTCOME,
              install: process.env.INSTALL_OUTCOME,
              gates: process.env.GATES_OUTCOME,
              localBrowser: process.env.LOCAL_BROWSER_OUTCOME,
              vercelBuild: process.env.VERCEL_BUILD_OUTCOME,
              deploy: process.env.DEPLOY_OUTCOME,
              bypass: process.env.BYPASS_OUTCOME,
              remoteBrowser: process.env.REMOTE_BROWSER_OUTCOME,
              revoke: process.env.REVOKE_OUTCOME,
            },
          };
          for (const path of ['/tmp/pr402-deployment-evidence.json', '/tmp/pr402-remote-evidence.json']) {
            if (fs.existsSync(path)) Object.assign(result, JSON.parse(fs.readFileSync(path, 'utf8')));
          }
          fs.writeFileSync('/tmp/pr402-final-result.json', JSON.stringify(result, null, 2));
          NODE

          content="$(base64 -w0 /tmp/pr402-final-result.json)"
          jq -n \
            --arg message 'Record PR 402 exact current-main Preview result' \
            --arg content "$content" \
            --arg branch "$OPS_BRANCH" \
            '{message:$message,content:$content,branch:$branch}' \
            > /tmp/pr402-result-create.json
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$RESULT_PATH" \
            --input /tmp/pr402-result-create.json >/dev/null

          workflow_sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/$WORKFLOW_PATH?ref=$OPS_BRANCH" --jq .sha)"
          jq -n \
            --arg message 'Remove one-time PR 402 exact-head release controller' \
            --arg sha "$workflow_sha" \
            --arg branch "$OPS_BRANCH" \
            '{message:$message,sha:$sha,branch:$branch}' \
            > /tmp/pr402-workflow-delete.json
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/contents/$WORKFLOW_PATH" \
            --input /tmp/pr402-workflow-delete.json >/dev/null

          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [[ "$GUARD_OUTCOME" == 'success' && "$INSTALL_OUTCOME" == 'success' && "$GATES_OUTCOME" == 'success' && "$LOCAL_BROWSER_OUTCOME" == 'success' && "$VERCEL_BUILD_OUTCOME" == 'success' && "$DEPLOY_OUTCOME" == 'success' && "$BYPASS_OUTCOME" == 'success' && "$REMOTE_BROWSER_OUTCOME" == 'success' && "$REVOKE_OUTCOME" == 'success' ]]; then
            deployment_id="$(node -e "const d=require('/tmp/pr402-deployment-evidence.json'); process.stdout.write(d.deploymentId)")"
            deployment_url="$(node -e "const d=require('/tmp/pr402-deployment-evidence.json'); process.stdout.write(d.url)")"
            gh pr comment 402 --repo "$GITHUB_REPOSITORY" --body "Exact current-main gates and protected canonical Preview passed for \`$EXPECTED_HEAD\`. Full repository tests, ESLint, TypeScript, optimized build, focused local desktop/mobile Playwright, exact 11-file diff, GitHub-built prebuilt deployment, and protected remote desktop/mobile inspection passed. The exact Preview is \`$deployment_id\` at $deployment_url. It verifies \`$35\`, \`$8,165 remains\`, \`0.43% of current gap\`, both disclosures, absence of pivotality copy, a bounded mobile sheet, and zero monitored browser or same-origin HTTP errors. The temporary bypass was revoked. Evidence: $run_url"
          else
            gh pr comment 402 --repo "$GITHUB_REPOSITORY" --body "Exact current-main release gates did not all pass for \`$EXPECTED_HEAD\`. Outcomes: guard=$GUARD_OUTCOME, install=$INSTALL_OUTCOME, gates=$GATES_OUTCOME, local-browser=$LOCAL_BROWSER_OUTCOME, vercel-build=$VERCEL_BUILD_OUTCOME, deploy=$DEPLOY_OUTCOME, bypass=$BYPASS_OUTCOME, remote-browser=$REMOTE_BROWSER_OUTCOME, revoke=$REVOKE_OUTCOME. PR #402 remains draft and unmerged. Evidence: $run_url"
          fi

      - name: Enforce all exact release gates
        run: |
          test '${{ steps.guard.outcome }}' = 'success'
          test '${{ steps.install.outcome }}' = 'success'
          test '${{ steps.gates.outcome }}' = 'success'
          test '${{ steps.local-browser.outcome }}' = 'success'
          test '${{ steps.vercel-build.outcome }}' = 'success'
          test '${{ steps.deploy.outcome }}' = 'success'
          test '${{ steps.bypass.outcome }}' = 'success'
          test '${{ steps.remote-browser.outcome }}' = 'success'
          test '${{ steps.revoke.outcome }}' = 'success'