name: Canonical masthead post-release smoke
on:
  push:
    branches: [ops/header-source-qa-20260925]
    paths: [.github/workflows/header-canonical-smoke-20260925.yml]
permissions:
  contents: read
  actions: read
jobs:
  canonical:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      EXPECTED_SHA: ef3b1b595f6bddd1e660e3215ca19e57254234f3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6c9882d35ed4d7d2bfc5e11e7a4a96543eaa7257
          path: transport
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ef3b1b595f6bddd1e660e3215ca19e57254234f3
          path: candidate
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: candidate/package-lock.json
      - name: Install locked browser tooling without production credentials
        working-directory: candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          npm ci
          npx playwright install --with-deps chromium
          cp ../transport/.github/header-live-smoke.cjs .header-live-smoke.cjs
          node --check .header-live-smoke.cjs
      - name: Wait for this exact normal gated release, never another deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = ghuser29384/Website2
          for attempt in $(seq 1 100); do
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/36203232384" > /tmp/release.json
            jq -e --arg sha "$EXPECTED_SHA" '.head_sha == $sha and .head_branch == "main" and .path == ".github/workflows/vercel-release.yml" and .event == "workflow_dispatch"' /tmp/release.json >/dev/null
            state="$(jq -r '.status' /tmp/release.json)"
            if [ "$state" = completed ]; then
              test "$(jq -r '.conclusion' /tmp/release.json)" = success
              test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$EXPECTED_SHA"
              mkdir -p candidate/header-live-evidence
              jq '{id,status,conclusion,head_sha,head_branch,path,html_url,run_started_at,updated_at}' /tmp/release.json > candidate/header-live-evidence/release.json
              exit 0
            fi
            echo "Exact release is $state; canonical checks have not run."
            sleep 20
          done
          echo 'The exact release did not finish in the verification window.' >&2
          exit 1
      - name: Real desktop and mobile canonical rendering, assets and guest boundaries
        working-directory: candidate
        run: node .header-live-smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canonical-masthead-ef3b1b595f6bddd1e660e3215ca19e57254234f3
          path: candidate/header-live-evidence
          retention-days: 7
