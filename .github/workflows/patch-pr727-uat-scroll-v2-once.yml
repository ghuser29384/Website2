name: Patch PR 727 desktop UAT scroll contract once

on:
  push:
    branches:
      - ops/pr727-production-create-uat-final-20260817
    paths:
      - .github/workflows/patch-pr727-uat-scroll-v2-once.yml

permissions:
  contents: write

concurrency:
  group: patch-pr727-production-uat-scroll-v2
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact controller
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Guard one-shot parent and patch only the UAT harness
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'ghuser29384/Website2'
          test "$GITHUB_REF_NAME" = 'ops/pr727-production-create-uat-final-20260817'
          test "$(git rev-parse HEAD^)" = '577f05114abb94d06480d362c80afc6f2a18b64f'
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/patch-pr727-uat-scroll-v2-once.yml'
          git diff --check HEAD^ HEAD

          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/scripts/create-production-uat.mjs')
          source = path.read_text(encoding='utf-8')
          start_marker = '  if (state.list.scrollHeight <= state.list.clientHeight || !["auto", "scroll"].includes(state.list.overflowY)) {'
          end_marker = '  if (state.selectedCauseCount !== 1)'
          if source.count(start_marker) != 1:
              raise SystemExit(f'Expected one strict desktop scroll assertion, found {source.count(start_marker)}.')
          start = source.index(start_marker)
          end = source.index(end_marker, start)
          replacement = '''  if (!["auto", "scroll"].includes(state.list.overflowY)) {
            throw new Error(`${cause.name} autocomplete is not configured to scroll internally when necessary.`);
          }
          '''
          replacement = '\n'.join(line[10:] if line.startswith('          ') else line for line in replacement.splitlines()) + '\n'
          updated = source[:start] + replacement + source[end:]
          if updated.count('autocomplete is not configured to scroll internally when necessary.') != 1:
              raise SystemExit('Replacement contract missing or duplicated.')
          if 'autocomplete does not scroll internally.' in updated:
              raise SystemExit('Stale strict desktop scroll assertion remains.')
          path.write_text(updated, encoding='utf-8')
          PY

          node --check .github/scripts/create-production-uat.mjs
          grep -Fq 'autocomplete is not configured to scroll internally when necessary.' .github/scripts/create-production-uat.mjs
          ! grep -Fq 'autocomplete does not scroll internally.' .github/scripts/create-production-uat.mjs
          git diff --check
          test "$(git diff --name-only)" = '.github/scripts/create-production-uat.mjs'

      - name: Commit and push only the corrected UAT harness
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/scripts/create-production-uat.mjs
          test "$(git diff --cached --name-only)" = '.github/scripts/create-production-uat.mjs'
          git diff --cached --check
          git commit -m 'Correct production Create UAT desktop scroll contract'
          git push origin HEAD:ops/pr727-production-create-uat-final-20260817
