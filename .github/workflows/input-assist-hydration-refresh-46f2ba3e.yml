name: Input assist hydration refresh gates 46f2ba3e

on:
  pull_request:
    paths:
      - ".github/workflows/input-assist-hydration-refresh-46f2ba3e.yml"

permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: input-assist-hydration-refresh-46f2ba3e
  cancel-in-progress: false

env:
  BASE_SHA: a37a4337a79b796ba1c0fb6979a1db73a6a798e9
  CANDIDATE_SHA: 46f2ba3e6c5638d3cabec4a5a5204cb40b5e387c
  PRODUCT_PR: "510"
  STATUS_CONTEXT: QA / Input assist hydration refreshed gates
  EVIDENCE_DIR: input-assist-hydration-refresh-46f2ba3e
  NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3210
  SITE_URL: http://127.0.0.1:3210
  PLAYWRIGHT_HTML_OPEN: never

jobs:
  exact-gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Mark the immutable candidate pending
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${CANDIDATE_SHA}" \
            -f state=pending \
            -f context="$STATUS_CONTEXT" \
            -f description="Running refreshed exact gates and current-main Playwright differential" \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Guard product PR identity and exact scope
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'ghuser29384/Website2'

          product_pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PRODUCT_PR}")"
          test "$(jq -r .state <<<"$product_pr")" = 'open'
          test "$(jq -r .draft <<<"$product_pr")" = 'false'
          test "$(jq -r .head.sha <<<"$product_pr")" = "$CANDIDATE_SHA"
          test "$(jq -r .base.ref <<<"$product_pr")" = 'main'
          test "$(jq -r .base.sha <<<"$product_pr")" = "$BASE_SHA"

          actual_files="$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/pulls/${PRODUCT_PR}/files?per_page=100" \
            --jq '.[].filename' | sort)"
          expected_files="$(printf '%s\n' \
            'src/app/layout.tsx' \
            'src/lib/input-assist-hydration.test.ts' \
            'tests/input-assist-hydration.spec.ts' | sort)"
          test "$actual_files" = "$expected_files"

      - name: Check out the immutable refreshed candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 1

      - name: Prove immutable identity and exact current-main differential
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git fetch --depth=1 origin "$BASE_SHA"
          actual_files="$(git diff --name-only "$BASE_SHA" "$CANDIDATE_SHA" | sort)"
          expected_files="$(printf '%s\n' \
            'src/app/layout.tsx' \
            'src/lib/input-assist-hydration.test.ts' \
            'tests/input-assist-hydration.spec.ts' | sort)"
          test "$actual_files" = "$expected_files"
          git diff --check "$BASE_SHA" "$CANDIDATE_SHA"
          mkdir -p "$EVIDENCE_DIR"
          git diff --stat "$BASE_SHA" "$CANDIDATE_SHA" > "$EVIDENCE_DIR/diff-stat.txt"
          printf '%s\n' "$BASE_SHA" > "$EVIDENCE_DIR/base-sha.txt"
          printf '%s\n' "$CANDIDATE_SHA" > "$EVIDENCE_DIR/candidate-sha.txt"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if npm ci 2>&1 | tee "$EVIDENCE_DIR/npm-ci.log"; then exit 0; fi
            if [[ "$attempt" == '3' ]]; then exit 1; fi
            sleep $((attempt * 20))
          done

      - name: Run source, lint, type, and production-build gates
        shell: bash
        run: |
          set -o pipefail
          node --import tsx --test src/lib/input-assist-hydration.test.ts \
            2>&1 | tee "$EVIDENCE_DIR/focused-source-test.log"
          npm test 2>&1 | tee "$EVIDENCE_DIR/source-tests.log"
          npm run lint -- --quiet 2>&1 | tee "$EVIDENCE_DIR/eslint.log"
          npx tsc --noEmit 2>&1 | tee "$EVIDENCE_DIR/typescript.log"
          npm run build 2>&1 | tee "$EVIDENCE_DIR/build.log"

      - name: Install Chromium
        shell: bash
        run: |
          set -o pipefail
          npx playwright install --with-deps chromium \
            2>&1 | tee "$EVIDENCE_DIR/playwright-install.log"

      - name: Repeat the focused hydration regression
        shell: bash
        run: |
          set -o pipefail
          npx playwright test tests/input-assist-hydration.spec.ts \
            --workers=1 --repeat-each=3 --reporter=line \
            2>&1 | tee "$EVIDENCE_DIR/focused-playwright.log"

      - name: Write the Playwright report normalizer
        shell: bash
        run: |
          cat > /tmp/normalize-playwright.cjs <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const [reportPath, statusPath, outputPrefix] = process.argv.slice(2);
          const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
          const failures = [];

          function resultErrors(test) {
            const errors = [];
            for (const result of test?.results ?? []) {
              if (result.status === 'passed' || result.status === 'skipped') continue;
              for (const error of result.errors ?? []) {
                const text = String(error?.message ?? error?.stack ?? error ?? '').trim();
                if (text) errors.push(text.slice(0, 6000));
              }
              if (result.error) {
                const text = String(result.error?.message ?? result.error?.stack ?? result.error).trim();
                if (text) errors.push(text.slice(0, 6000));
              }
            }
            return errors;
          }

          function visitSuite(suite, ancestors = []) {
            const nextAncestors = suite?.title ? [...ancestors, suite.title] : ancestors;
            for (const spec of suite?.specs ?? []) {
              const failedTests = (spec.tests ?? []).filter((test) =>
                (test.results ?? []).some((result) =>
                  !['passed', 'skipped'].includes(result.status),
                ),
              );
              if (spec.ok === false || failedTests.length > 0) {
                failures.push({
                  file: spec.file ?? '',
                  line: spec.line ?? 0,
                  column: spec.column ?? 0,
                  title: [...nextAncestors, spec.title ?? ''].filter(Boolean).join(' › '),
                  errors: failedTests.flatMap(resultErrors),
                });
              }
            }
            for (const child of suite?.suites ?? []) visitSuite(child, nextAncestors);
          }

          for (const suite of report.suites ?? []) visitSuite(suite, []);

          const unique = [];
          const seen = new Set();
          for (const failure of failures) {
            const key = `${failure.file}:${failure.line}:${failure.column} › ${failure.title}`;
            if (seen.has(key)) continue;
            seen.add(key);
            unique.push({ key, ...failure });
          }
          unique.sort((a, b) => a.key.localeCompare(b.key));

          const hydrationPattern = /hydrated but some attributes of the server rendered HTML didn't match|Hydration failed because the server rendered HTML didn't match/;
          const hydrationFailures = unique.filter((failure) =>
            failure.errors.some((error) => hydrationPattern.test(error)),
          );
          const summary = {
            exitStatus: Number(fs.readFileSync(statusPath, 'utf8').trim()),
            stats: report.stats ?? null,
            failureCount: unique.length,
            hydrationMismatchCount: hydrationFailures.length,
            hydrationFailures: hydrationFailures.map((failure) => failure.key),
          };

          fs.writeFileSync(`${outputPrefix}-failures.json`, `${JSON.stringify(unique, null, 2)}\n`);
          fs.writeFileSync(`${outputPrefix}-summary.json`, `${JSON.stringify(summary, null, 2)}\n`);
          fs.writeFileSync(
            `${outputPrefix}-failures.txt`,
            `${unique.map((failure) => failure.key).join('\n')}${unique.length ? '\n' : ''}`,
          );
          console.log(JSON.stringify(summary, null, 2));
          NODE

      - name: Run the complete candidate rendered suite and retain its truthful result
        shell: bash
        run: |
          set -uo pipefail
          rm -rf .next test-results playwright-report
          set +e
          npx playwright test --reporter=json \
            > "$EVIDENCE_DIR/candidate-report.json" \
            2> "$EVIDENCE_DIR/candidate-playwright.stderr.log"
          status=$?
          set -e
          printf '%s\n' "$status" > "$EVIDENCE_DIR/candidate-exit-status.txt"
          node /tmp/normalize-playwright.cjs \
            "$EVIDENCE_DIR/candidate-report.json" \
            "$EVIDENCE_DIR/candidate-exit-status.txt" \
            "$EVIDENCE_DIR/candidate"
          pkill -f '[n]ext dev.*3210' || true

      - name: Run the complete current-main rendered suite under the same conditions
        shell: bash
        run: |
          set -uo pipefail
          git checkout --force "$BASE_SHA"
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          rm -rf .next test-results playwright-report
          set +e
          npx playwright test --reporter=json \
            > "$EVIDENCE_DIR/base-report.json" \
            2> "$EVIDENCE_DIR/base-playwright.stderr.log"
          status=$?
          set -e
          printf '%s\n' "$status" > "$EVIDENCE_DIR/base-exit-status.txt"
          node /tmp/normalize-playwright.cjs \
            "$EVIDENCE_DIR/base-report.json" \
            "$EVIDENCE_DIR/base-exit-status.txt" \
            "$EVIDENCE_DIR/base"
          pkill -f '[n]ext dev.*3210' || true

      - name: Enforce the refreshed current-main differential
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const dir = process.env.EVIDENCE_DIR;
          const baseSummary = JSON.parse(fs.readFileSync(path.join(dir, 'base-summary.json'), 'utf8'));
          const candidateSummary = JSON.parse(
            fs.readFileSync(path.join(dir, 'candidate-summary.json'), 'utf8'),
          );
          const baseFailures = JSON.parse(fs.readFileSync(path.join(dir, 'base-failures.json'), 'utf8'));
          const candidateFailures = JSON.parse(
            fs.readFileSync(path.join(dir, 'candidate-failures.json'), 'utf8'),
          );

          const baseKeys = new Set(baseFailures.map((failure) => failure.key));
          const candidateKeys = new Set(candidateFailures.map((failure) => failure.key));
          const newFailures = candidateFailures
            .filter((failure) => !baseKeys.has(failure.key))
            .map((failure) => failure.key)
            .sort();
          const resolvedBaseFailures = baseFailures
            .filter((failure) => !candidateKeys.has(failure.key))
            .map((failure) => failure.key)
            .sort();

          const comparison = {
            baseSha: process.env.BASE_SHA,
            candidateSha: process.env.CANDIDATE_SHA,
            base: baseSummary,
            candidate: candidateSummary,
            newFailureCount: newFailures.length,
            newFailures,
            resolvedBaseFailureCount: resolvedBaseFailures.length,
            resolvedBaseFailures,
            passed: newFailures.length === 0 && candidateSummary.hydrationMismatchCount === 0,
          };

          fs.writeFileSync(
            path.join(dir, 'current-main-differential.json'),
            `${JSON.stringify(comparison, null, 2)}\n`,
          );
          console.log(JSON.stringify(comparison, null, 2));
          if (!comparison.passed) process.exit(1);
          NODE

          {
            echo '## Refreshed input-assist hydration gates'
            echo
            echo "- Base: \`$BASE_SHA\`"
            echo "- Candidate: \`$CANDIDATE_SHA\`"
            echo "- Base failures: \`$(jq -r '.base.failureCount' "$EVIDENCE_DIR/current-main-differential.json")\`"
            echo "- Candidate failures: \`$(jq -r '.candidate.failureCount' "$EVIDENCE_DIR/current-main-differential.json")\`"
            echo "- Candidate-only failures: \`$(jq -r '.newFailureCount' "$EVIDENCE_DIR/current-main-differential.json")\`"
            echo "- Candidate hydration mismatches: \`$(jq -r '.candidate.hydrationMismatchCount' "$EVIDENCE_DIR/current-main-differential.json")\`"
            echo "- Base failures absent on candidate: \`$(jq -r '.resolvedBaseFailureCount' "$EVIDENCE_DIR/current-main-differential.json")\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload refreshed exact-gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: input-assist-hydration-refresh-46f2ba3e
          path: input-assist-hydration-refresh-46f2ba3e
          if-no-files-found: error
          retention-days: 14

      - name: Publish the immutable candidate result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$JOB_STATUS" == 'success' ]]; then
            state=success
            description="Refreshed exact gates passed with zero candidate-only failures and zero hydration mismatches"
          else
            state=failure
            description="Refreshed input-assist hydration gates failed; inspect exact evidence"
          fi
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${CANDIDATE_SHA}" \
            -f state="$state" \
            -f context="$STATUS_CONTEXT" \
            -f description="$description" \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          test "$state" = success
