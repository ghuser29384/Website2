name: Bootstrap exact Create blocker repair

on:
  push:
    branches:
      - feature/account-bound-participant-picker-20260805

permissions:
  contents: write

concurrency:
  group: bootstrap-resolve-create-blockers
  cancel-in-progress: false

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[resolve-create-blockers]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch
        uses: actions/checkout@v4
        with:
          ref: feature/account-bound-participant-picker-20260805
          fetch-depth: 0

      - name: Normalize the auth handoff and execute the fail-closed patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          index_path = Path("public/moral-trade-create/index.html")
          index = index_path.read_text(encoding="utf-8")
          marker = "if (response.status === 401 && result?.requiresAuth) {"
          if index.count(marker) != 1:
              raise SystemExit(f"Create auth marker count was {index.count(marker)}, expected 1")
          start = index.index(marker)
          line_start = index.rfind("\n", 0, start) + 1
          end_marker = "\n        if (!response.ok || !result?.ok || !result.submission) {"
          end = index.find(end_marker, start)
          if end < 0:
              raise SystemExit("Create auth handoff end marker is missing")
          normalized = '''        if (response.status === 401 && result?.requiresAuth) {
            saveDraftForResume();
            window.top.location.assign(result.loginUrl || "/login?returnTo=%2Ftrades%2Fnew%3Fresume%3Dcreate");
            return;
          }'''
          index_path.write_text(index[:line_start] + normalized + index[end:], encoding="utf-8")

          controller = Path(".github/workflows/resolve-create-resume-blockers.yml")
          lines = controller.read_text(encoding="utf-8").splitlines()
          start_line = next(i for i, line in enumerate(lines) if "python - <<'PY'" in line)
          end_line = next(i for i in range(start_line + 1, len(lines)) if lines[i].strip() == "PY")
          body = lines[start_line + 1:end_line]
          nonempty = [line for line in body if line.strip()]
          indent = min(len(line) - len(line.lstrip(" ")) for line in nonempty)
          script = "\n".join(line[indent:] if line.strip() else "" for line in body) + "\n"
          patch_path = Path("/tmp/resolve-create-blockers.py")
          patch_path.write_text(script, encoding="utf-8")
          subprocess.run(["python", str(patch_path)], check=True)
          PY

      - name: Remove temporary controllers and commit the durable repair
        shell: bash
        run: |
          rm .github/workflows/resolve-create-resume-blockers.yml
          rm .github/workflows/resolve-create-resume-blockers-bootstrap.yml
          git config user.name "ghuser29384"
          git config user.email "262476329+ghuser29384@users.noreply.github.com"
          git add \
            public/moral-trade-create/index.html \
            src/lib/create-interface/group-contribution-client.ts \
            src/lib/create-interface/group-contribution-client-stability.test.ts \
            src/lib/create-interface/source-contract.test.ts \
            .github/workflows/resolve-create-resume-blockers.yml \
            .github/workflows/resolve-create-resume-blockers-bootstrap.yml
          git diff --cached --check
          git commit -m "Resolve Create resume and field stability blockers [resolve-create-blockers]"
          git push origin HEAD:feature/account-bound-participant-picker-20260805
