name: Remove obsolete pre-activation one-time patch workflow

on:
  push:
    branches:
      - database/preactivation-schema-baseline-clean-20260819
    paths:
      - .github/workflows/patch-preactivation-prestate-diagnostics.yml

permissions:
  contents: write

jobs:
  remove:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: database/preactivation-schema-baseline-clean-20260819
          fetch-depth: 2
          token: ${{ github.token }}

      - name: Delete this superseded one-time controller
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "35575ad5c141442e81f4d9a16b188f538f0778e3"
          test "$(git diff --name-only HEAD^..HEAD)" = ".github/workflows/patch-preactivation-prestate-diagnostics.yml"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-preactivation-prestate-diagnostics.yml
          git commit -m "Remove obsolete pre-activation patch controller"
          git push origin HEAD:database/preactivation-schema-baseline-clean-20260819
