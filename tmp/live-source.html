<!doctype html>

<title>Moral Trade — Live</title>
<style>

:root{

}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:var(--sans)}

.brand{display:flex;align-items:center;gap:12px;font-size:18px}.mark{width:32px;height:32px;position:relative;display:block}

.topbar nav{display:flex;justify-content:center;gap:8px}.topbar nav button{border:0;background:transparent;color:#aaa;padding:11px 19px;border-radius:2px;font-size:15px}

.top-actions{display:flex;justify-content:flex-end;align-items:center;gap:12px}.text-btn{border:0;background:transparent;color:#bbb}.avatar{width:39px;height:39px;border:1px solid #666;background:transparent;color:#fff;border-radius:50%}

.subtitle{font-family:var(--mono);font-size:12px;color:#56524c;margin-top:9px}.date{font-size:13px;line-height:1.55;text-align:right;min-width:185px}.date b{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.08em;display:block;color:var(--muted)}
.h{display:flex;align-items:center;gap:10px}.between{display:flex;align-items:center;justify-content:space-between;gap:12px}.stack{display:flex;flex-direction:column;gap:13px}

.btn:hover{transform:translateY(-1px);box-shadow:0 5px 15px rgba(0,0,0,.08)}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.lime{background:var(--lime);border-color:var(--lime)}.btn.orange{background:var(--orange);border-color:var(--orange);color:#fff}.btn.dark{background:#090909;color:#fff}.btn.small{padding:7px 10px;min-height:31px;font-size:12px}.btn.ghost{border-color:transparent;background:transparent}.btn.wide{min-width:210px}

.panel{background:rgba(251,250,246,.88);border:1px solid var(--line)}.pad{padding:17px}.black{background:#050505;color:#fff;border-color:#050505}.blue-panel{background:var(--blue);color:#fff;border-color:var(--blue)}

.serif{font-family:var(--serif)}.mono{font-family:var(--mono)}.big{font-family:var(--serif);font-size:35px;line-height:1}.tag{display:inline-flex;border:1px solid var(--line);padding:4px 7px;background:var(--paper2);font:10px var(--mono);text-transform:uppercase;white-space:nowrap}.tag.ok{color:#28633b;border-color:#a7c6ae;background:#edf5ef}.tag.info{color:var(--blue);border-color:#9cb5ff;background:#f4f7ff}.tag.warn{color:#b85018;border-color:#efb18c;background:#fff1e8}.tag.near{color:#697d00;border-color:#c8dd71;background:#f4f8da}
.status{display:inline-flex;align-items:center;gap:7px;font:10px var(--mono);text-transform:uppercase}.dot{width:8px;height:8px;border-radius:50%;background:#999}.dot.good{background:var(--green)}.dot.live{background:var(--lime)}.dot.warn{background:var(--orange)}.dot.info{background:var(--blue)}

.brief{display:grid;grid-template-columns:1.2fr 1fr 1fr;margin-top:17px}.story{padding:20px;border-right:1px solid var(--line);min-height:315px}.story:last-child{border-right:0}.story h3{font:400 31px/1.04 var(--serif);margin:8px 0}.story p{font:11px/1.6 var(--mono)}

.plan-grid{display:grid;grid-template-columns:205px minmax(0,1fr) 260px;gap:16px;align-items:start}.plan-control{padding:14px;position:sticky;top:80px}.field{padding:12px 0;border-bottom:1px solid var(--line)}.field label{display:block;font:10px var(--mono);text-transform:uppercase;margin-bottom:7px}.field .value{border:1px solid #777;background:var(--paper2);padding:10px;display:flex;justify-content:space-between}
.route{padding:20px;position:relative;overflow:hidden}.route h2{font:400 36px var(--serif);margin:4px 0 18px}.lane{display:grid;grid-template-columns:185px 1fr;gap:10px;align-items:center;margin:20px 0}.lane-label{display:grid;grid-template-columns:37px 1fr;gap:9px;align-items:center}.circleicon{width:36px;height:36px;border:3px solid currentColor;border-radius:50%;display:grid;place-items:center}.lane-label b{font:11px var(--mono);text-transform:uppercase}.lane-label small{display:block;color:var(--muted);font-size:10px;margin-top:3px}
.lane-track{display:grid;grid-template-columns:repeat(3,1fr);position:relative;height:67px}.lane-track:before{content:"";position:absolute;left:0;right:9%;top:15px;height:4px;background:currentColor}.step{position:relative;padding-top:34px;font-size:10px}.step:before{content:"";position:absolute;top:7px;width:13px;height:13px;border:3px solid currentColor;border-radius:50%;background:var(--paper2)}.step.active{border:1px solid currentColor;padding:31px 10px 7px;margin-top:-3px;background:var(--paper2)}.step em{font-style:normal;color:var(--blue);font:9px var(--mono);display:block;margin-top:3px}
.lane.blue-l{color:var(--blue)}.lane.green-l{color:#52942e}.lane.orange-l{color:var(--orange)}.lane.purple-l{color:var(--purple)}.lane.gray-l{color:#555}

.alloc{margin-top:17px}.resourcebar{display:grid;grid-template-columns:repeat(5,1fr);border-bottom:1px solid #777}.resourcebar>div{padding:13px;border-right:1px solid var(--line)}.resourcebar>div:last-child{border-right:0}.resourcebar strong{font:400 31px var(--serif);display:block}.dragchip{display:inline-block;border:1px dashed var(--blue);color:var(--blue);padding:5px 7px;margin-top:6px;font:10px var(--mono);cursor:grab}

/* Trade */

.clause{display:grid;grid-template-columns:44px 1fr 40px;border:1px solid #777;background:rgba(251,250,246,.9);min-height:102px;margin-bottom:9px}.clause-num{background:#080808;color:#fff;display:grid;place-items:start center;padding-top:9px;font:400 27px var(--serif)}.clause-body{padding:12px 18px}.clause-label{font:9px var(--mono);text-transform:uppercase;margin-bottom:9px}.sentence{font:400 26px/1.38 var(--serif)}.token{display:inline-block;border:1px solid var(--line);background:var(--paper2);color:var(--blue);padding:5px 9px;margin:0 3px}.token.fail{color:var(--orange);border-color:#efa175}.clause-tool{padding:8px;text-align:center}
.matchcard{padding:13px}.matchcard h3{font:400 21px var(--serif);margin:7px 0}.score{font:400 29px var(--serif);float:right}

.ex-table{border:1px solid var(--blue);background:rgba(251,250,246,.9)}.ex-head{background:var(--blue);color:#fff;padding:10px 13px;display:flex;justify-content:space-between;font:10px var(--mono)}.pair{display:grid;grid-template-columns:1fr 55px 1fr;border-bottom:1px solid var(--line)}.pair>div{padding:13px}.swap{width:42px;height:42px;border:2px solid #777;border-radius:50%;display:grid;place-items:center;margin:auto}.details{width:100%;border-collapse:collapse}.details td{padding:8px 11px;border-bottom:1px solid var(--line);font-size:11px}.details td:first-child{width:120px;font:9px var(--mono);text-transform:uppercase;color:var(--muted)}
.match-hero{display:grid;grid-template-columns:1fr 65px 1fr;align-items:center}.offer{background:#050505;color:#fff;border:1px solid #111;min-height:430px;display:grid;grid-template-rows:50px 1fr 88px}.offer-head{display:flex;justify-content:space-between;align-items:center;padding:0 14px;border-bottom:1px solid #333}.offer-body{padding:24px;display:grid;grid-template-columns:1fr 115px;gap:14px}.offer h2{font:400 40px/1.04 var(--serif);margin:0}.offer .value{font:400 35px var(--serif)}.range{height:3px;background:#777;position:relative;margin:16px 0}.range span{position:absolute;left:25%;right:25%;top:-1px;height:5px;background:var(--lime)}.offer.orange-off .range span{background:var(--orange)}.range i{position:absolute;left:50%;top:-9px;width:13px;height:21px;background:#fff;transform:translateX(-50%)}.offer-foot{background:var(--paper2);color:#111;display:grid;grid-template-columns:1fr 1fr}.offer-foot>div{padding:13px;border-right:1px solid var(--line)}.offer-foot>div:last-child{border-right:0}.offer-foot strong{font:400 20px var(--serif);display:block}
.why{display:grid;grid-template-columns:135px repeat(6,1fr);border:1px solid var(--line);margin-top:15px}.why>div{padding:12px;border-right:1px solid var(--line);font-size:10px}.why>div:last-child{border-right:0}.why strong{font:400 15px var(--serif);display:block;margin:3px 0}
.deal-layout{display:grid;grid-template-columns:195px minmax(0,1fr);gap:15px}.rooms{border-right:1px solid var(--line);padding-right:13px}.room{padding:12px 2px;border-bottom:1px solid var(--line);position:relative}.room.active:before{content:"";position:absolute;left:-9px;top:11px;bottom:11px;width:4px;background:var(--blue)}.room b{font:400 17px var(--serif)}.room small{display:block;color:var(--muted);font-size:9px}
.dealgrid{display:grid;grid-template-columns:1fr 1.08fr 1fr;gap:10px}.party{border:1px solid var(--line);background:rgba(251,250,246,.9)}.party-title{font:400 28px var(--serif);padding:12px 13px 0}.party-offer{background:#050505;color:#fff;margin:12px;padding:19px;min-height:170px;display:grid;grid-template-columns:1fr 66px;gap:9px}.party-offer h2{font:400 29px/1.06 var(--serif);margin:0}.reliability{display:grid;grid-template-columns:36px 1fr 45px;align-items:center;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:10px 12px}.party-content{padding:12px}.mini{padding:7px 0;border-bottom:1px solid var(--line);font-size:10px}.chat{display:grid;grid-template-columns:24px 1fr;gap:7px;margin:8px 0;font-size:10px}.chat i{width:23px;height:23px;background:#111;color:#fff;border-radius:50%;display:grid;place-items:center;font-style:normal}
.terms-panel{border:1px solid #777;background:rgba(251,250,246,.92)}.live-head{background:#050505;color:#fff;padding:9px 20px;width:max-content;margin:-31px auto 0;font:10px var(--mono)}.termsec{padding:13px;border-bottom:1px solid var(--line)}.termsec h4{text-align:center;font:10px var(--mono);text-transform:uppercase;margin:0 0 9px}.termvals{display:flex;justify-content:space-between;align-items:center;font:400 24px var(--serif)}.termvals small{font:9px var(--mono);color:var(--muted);text-align:center}.mutual{background:var(--blue);color:#fff;text-align:center;padding:15px}.mutual strong{display:block;font:400 27px var(--serif)}
.dealbottom{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:10px;margin-top:10px}.dealbottom>div{padding:12px}

/* Activity */
.activitytabs{display:flex;gap:20px;border-bottom:1px solid #777;margin-bottom:16px}.activitytabs button{border:0;background:transparent;padding:9px 1px 12px;position:relative}.activitytabs button.active:after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;background:var(--blue)}
.port-summary{display:grid;grid-template-columns:1.8fr repeat(3,1fr);border-bottom:1px solid var(--line);padding-bottom:15px}.port-summary>div{padding:9px 15px;border-left:1px solid var(--line)}.port-summary>div:first-child{border-left:0}.lifecycle{display:flex;align-items:center;gap:9px;margin-top:12px}.life{display:flex;align-items:center;gap:6px;font-size:11px}.lifeline{width:50px;height:1px;background:var(--line)}
.port-grid{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:20px;margin-top:17px}.allocrow{display:grid;grid-template-columns:68px 1.45fr repeat(4,.75fr);border-bottom:1px solid var(--line)}.allocrow>div{padding:13px}.allocrow h3{font:400 20px var(--serif);margin:0}.allocrow strong{font:400 22px var(--serif);display:block}.feed{border-left:1px solid var(--line);padding-left:17px}.feedrow{display:grid;grid-template-columns:74px 36px 1fr;gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}.feedicon{width:34px;height:34px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center}.feedrow h4{font:400 18px var(--serif);margin:0 0 3px}.feedrow p{font-size:10px;color:var(--muted);margin:0}
.ledger-summary{grid-template-columns:repeat(4,1fr) 1.3fr;margin-bottom:13px}.verifybar{border:1px solid #ee9b68;padding:11px 14px;display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}
.ledger{width:100%;border-collapse:collapse;border-top:2px solid #111;min-width:930px}.ledger th,.ledger td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}.ledger th{font:9px var(--mono);text-transform:uppercase;text-align:left}.ledger td:not(:last-child),.ledger th:not(:last-child){border-right:1px solid var(--line)}.ledger h3{font:400 19px var(--serif);margin:0 0 4px}

 ]

const O={
 civic:{kind:'Trade opportunity',title:'Replace 8 car trips ↔ Mina funds $20 of civic infrastructure',cause:'Civic infrastructure',mechanism:'Direct reciprocity',amount:'$20',effort:'~40 minutes',trust:'High',a:'6–12 trips',b:'$16–$25',deadline:'Jul 31, 2026',proof:'Miles logged via connected app; receipts and project reports',status:'Verified',counterparty:'Mina Park'},

 factory:{kind:'Mutual redirect',title:'Redirect factory-farming donation spend',cause:'Animal welfare',mechanism:'Donation redirect',amount:'$20 / month',effort:'5 minutes',trust:'Medium',a:'$10–$100',b:'Matched 1:1',deadline:'Jul 25, 2026',proof:'Donation receipts',status:'On track',counterparty:'Taylor Reed'},

 docs:{kind:'Reciprocal trade',title:'Open-civic-infrastructure documentation sprint',cause:'Civic infrastructure',mechanism:'Conditional payment',amount:'$1,360',effort:'4 modules',trust:'High',a:'$800–$1,500',b:'Open documentation',deadline:'Aug 5, 2026',proof:'Repository release and reviewer acceptance',status:'On track',counterparty:'Mina Park'}

const tab=(items,key,attr)=>`<div class="tabs">${items.map(x=>`<button class="${state[key]===x[0]?'active':''}" data-${attr}="${x[0]}">${x[1]}</button>`).join('')}</div>`;

 if(!['now','trade','activity'].includes(state.page))state.page='now';
 $$('.topbar nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===state.page));

 bindDnD();

 return `<div class="focus-layout"><main>

  ${story('Lead story · Counteroffer','Support AI-safety research under $100.','Mina is a verified researcher. She countered your offer with updated terms and a four-week deliverable.',
   [['Work','Frontier bio-risk evaluations'],['Deliverable','Red-team evals + publish results'],['Your funding','$95, one-time'],['Proof','Public harness + review']],'Review counteroffer','dealroom')}

   [['Gap','$580'],['Remaining','$45'],['Contributors','7'],['Start','Aug 17, 2026']],'Pledge $45','select-bio')}
  ${story('Completed trade','You funded open-source eval tooling. Impact delivered.','The researcher delivered as promised. Proof and downstream use were verified.',

 </section>
 <div class="metric-grid stats"><div><strong>$45</strong><small>reserved across 3 commitments</small></div><div><strong>$0</strong><small>charged today</small></div><div><strong>3</strong><small>active commitments</small></div><div><strong>4</strong><small>new saved-field opportunities</small></div></div>

 <div class="verifybar"><div><div class="eyebrow orange">Pending verification</div><b>Verification due—submit transit receipts.</b><br><small class="muted">Due Jul 18, 11:59 PM PT</small></div><button class="btn primary" data-action="verify">Complete verification →</button></div><div class="tablewrap"><table class="ledger"><thead><tr><th>Date & ID</th><th>You put forward</th><th>Exchange</th><th>The other side activated</th><th>Money state</th><th>Counterparty & proof</th></tr></thead><tbody>${rows.map((r,i)=>`<tr><td><b class="mono">${r[0]}</b><br><small>#MT-2026-071${i+2}</small><br>${tag(r[1],r[1]==='RETURNED'?'warn':r[1]==='ACTIVE'?'info':'ok')}</td><td><h3>${r[2]}</h3><a class="blue">View terms</a></td><td><i class="swap">↔</i></td><td><h3>${r[3]}</h3><a class="blue">View terms</a></td><td><div class="eyebrow blue">${r[4]}</div><h3>${r[5]}</h3>${status('Consent recorded')}</td><td><small>Counterparty</small><br><b>${r[6]}</b><br><small>Proof</small><br><a class="green">${r[7]} ↗</a><br><small>Dispute resolution · Frontier Bio Ethics Council</small></td></tr>`).join('')}</tbody></table></div><div class="h" style="margin-top:14px"><button class="btn primary" data-action="verify">Complete verification →</button><button class="btn" data-action="export">Export receipts ↓</button><button class="btn" data-action="repeat">Repeat trade ↻</button><button class="btn" data-action="create">Create offer ＋</button><a class="blue" style="margin-left:auto">View full activity →</a></div>`;

 const outs=[['Priya accepted the more impactful biosecurity role.','Verified competing offers. Salary gap funded. Employment started.','$55,000','3 contributors'],['Civic-infrastructure trade delivered.','Open data pipeline built and live. Performance milestone met.','$15,000','2 contributors'],['Factory-farming donation spend redirected.','$12,000 redirected to higher-impact alternatives.','$12,000','2 contributors'],['Wild-animal-suffering research threshold reached.','Priority research pool activated.','$25,000','7 contributors']];

e class="stack"><section class="panel pad" style="border-color:#ef9b67"><div class="eyebrow orange">Pending action</div><h3 class="serif" style="font-weight:400">Confirm allocation release</h3><p style="font-size:10px">Biosecurity salary-gap pool · Priya · $55,000</p><button class="btn small" data-action="verify">Review and confirm</button></section>${patternPanel('Saved patterns',['Salary gap · early career','Civic trade · fixed milestone','Donation redirect','Research pool threshold'])}${patternPanel('Create from this result',outs.map(x=>x[0]))}<section class="panel pad"><div class="eyebrow">How verification works</div><p style="font-size:10px">Administrators use third-party documents, receipts, and counterparty confirmation.</p><a class="blue">Learn more →</a></section></aside></div>`;
}

function calendarView(){
 return `<div class="calendar-grid"><aside class="panel calrail"><div class="eyebrow blue">Commitment calendar</div><p style="font-size:10px">Stay on your word. Move good deals forward.</p>${['agenda','week','month'].map(m=>`<button class="${state.calendar===m?'active':''}" data-cal="${m}">□ ${m[0].toUpperCase()+m.slice(1)}</button>`).join('')}<div class="fgroup"><h4>Filter by type</h4>${['All types','Trade','Pool','Redirect','Verification'].map((x,i)=>`<div class="check"><span class="box ${i===0?'on':''}">${i===0?'✓':''}</span>${x}</div>`).join('')}</div><div class="fgroup"><h4>Filter by state</h4>${['All states','Upcoming','Due today','Overdue','Completed'].map((x,i)=>`<div class="check"><span class="box ${i===0?'on':''}">${i===0?'✓':''}</span>${x}</div>`).join('')}</div><button class="btn" style="width:100%">＋ Schedule commitment</button></aside><main class="weekwrap"><div class="between" style="margin-bottom:8px"><h2 class="serif" style="font-size:42px;font-weight:400;margin:0">July 13–19, 2026</h2><div class="h"><button class="btn small">‹</button><button class="btn small">Today</button><button class="btn small">›</button></div></div><div class="week"><div></div>${['MON 13','TUE 14','WED 15','THU 16','FRI 17','SAT 18','SUN 19'].map((d,i)=>`<div class="day ${i===3?'blue':''}">${d.split(' ')[0]}<strong>${d.split(' ')[1]}</strong>${i===3?tag('Today','info'):''}</div>`).join('')}<div class="day">All-day</div><div class="event"><b>TRADE</b><br>Counteroffer deadline<br><span class="orange">Today by 5 PM</span></div><div class="event"><b>POOL</b><br>Transit action window<br><span class="orange">Window closes</span></div><div class="event purple-e"><b>REDIRECT</b><br>Scheduled charge<br><span class="green">Conditional</span></div><div class="event orange-e"><b>VERIFICATION</b><br>Verification due<br><span class="orange">Due today</span></div><div class="event"><b>TRADE</b><br>Campaign closes<br>$4,800 gap</div><div></div><div class="event orange-e"><b>VERIFICATION</b><br>Follow-up with Mina<br>4:00 PM</div><div class="eventdetail"><div class="between"><div><div class="eyebrow orange">Verification · Due today by 11:59 PM</div><h2>Verification due</h2><p>Need 200 conditional donors for wild-animal research.</p></div><button class="btn primary" data-action="verify">Complete verification</button></div><div class="eventcols"><div><div class="eyebrow">Terms</div><p>Requirement · 200 donors<br>Your commitment · Verify by Jul 16</p></div><div><div class="eyebrow">Proof</div><p>Public donor list or export<br>CSV or PDF</p></div><div><div class="eyebrow">Money state</div><p>174 / 200 secured<br>Gap · 26<br>At risk · $12,450</p></div><div><div class="eyebrow">Counterparty & trust</div><p>Priya Shah<br>Identity verified<br>28 trades completed</p></div></div></div></div></main><aside class="stack">${sideCard('Next 7 days',['Fri 17 · Conditional campaign closes','Sat 18 · Scheduled charge if threshold met','Sun 19 · Follow-up with Mina','Mon 20 · Verification partner','Tue 21 · Grace window closes'],'<a class="blue">View full calendar →</a>')}${sideCard('Reminders',['Verification due today · 11:59 PM','Transit window closes tomorrow','Campaign closes in 1 day'],'<a class="blue">Manage reminders →</a>')}</aside></div>`;
}

/* Drawer + actions */
function profileDrawer(){
 return `<button class="btn ghost" style="float:right" data-action="close">×</button><div class="eyebrow blue">Account & controls</div><h2>Alex Johnson</h2><p class="muted">Member since Mar 2023 · 23 completed commitments · 96% on time</p>${setting('Currency','USD','Manage')}${setting('Monthly safe cap','$250 · 6h · 12 trips','Edit')}${setting('Escrow account','Connected and verified','✓')}${setting('Notifications','Approvals, reminders, daily brief','On')}${setting('Public trust profile','Visible by consent','On')}${setting('Default privacy','Private until completion','Change')}${setting('Dispute resolution','Frontier Bio Ethics Council','Manage')}${setting('Standard terms','Moral Trade v1.4','View')}<button class="btn dark" style="width:100%;margin-top:18px">Sign out</button>`;
}
function commandDrawer(){
 return `<button class="btn ghost" style="float:right" data-action="close">×</button><div class="eyebrow blue">Command center</div><h2>Create the next commitment.</h2><p class="muted">Describe the value you will offer, the reciprocal outcome, the deadline, and the proof.</p><div class="search control" style="width:100%;margin:18px 0">⌕ <input value="Offer $80 for AI-safety research if 12 transit trips are replaced"></div><button class="btn primary" style="width:100%" data-action="from-command">Build this offer</button><div class="ruleline"></div><div class="eyebrow">Recent commands</div>${['Create a $25 near-threshold pledge','Counter Mina with 8 trips for $20','Repeat the verified civic trade'].map(x=>`<div class="setting"><span>${x}</span><button class="btn ghost small" data-action="from-command">Run</button></div>`).join('')}`;
}
function setting(a,b,c){return `<div class="setting"><div><b>${a}</b><br><small class="muted">${b}</small></div><button class="btn small">${c}</button></div>`}
function openDrawer(html){$('#drawer').innerHTML=html;$('#overlay').classList.add('open')}
function closeDrawer(){$('#overlay').classList.remove('open')}
function toast(t){let n=$('#toast');n.textContent=t;n.classList.add('show');clearTimeout(window.__t);window.__t=setTimeout(()=>n.classList.remove('show'),2400)}
function setPage(p){state.page=p;location.hash=p;render();scrollTo({top:0,behavior:'smooth'})}
function bindDnD(){
 $$('.dragchip').forEach(x=>x.addEventListener('dragstart',e=>e.dataTransfer.setData('res',x.dataset.resource)));
 $$('.drop[data-row]').forEach(x=>{x.addEventListener('dragover',e=>e.preventDefault());x.addEventListener('drop',e=>{e.preventDefault();let type=e.dataTransfer.getData('res'),row=x.dataset.row;if(type&&state.alloc[row]){state.alloc[row][type]+=type==='m'?10:1;toast('Resource allocated.');render()}})});
 $$('.ingredient').forEach(x=>x.addEventListener('dragstart',e=>e.dataTransfer.setData('ingredient',x.dataset.ingredient)));
 ['ingredientDrop','clauseDrop'].forEach(id=>{let x=$('#'+id);if(x){x.addEventListener('dragover',e=>e.preventDefault());x.addEventListener('drop',e=>{e.preventDefault();addClause(e.dataTransfer.getData('ingredient'))})}});
}
function addClause(name){if(!name)return;state.clauses.push([name,`Add exact <span class="token" contenteditable="true">${name.toLowerCase()} terms</span> to this trade.`]);toast(name+' clause added.');render()}
function exportCSV(){
 let rows=[['Date','Type','You put forward','Other side','Money state'],['2026-07-16','Completed','12 transit passes','One tree planted','$18 charged'],['2026-07-15','Active','$100 conditional pledge','Close salary gap','$25 reserved']];
 let csv=rows.map(r=>r.map(x=>`"${x}"`).join(',')).join('\n'),u=URL.createObjectURL(new Blob([csv],{type:'text/csv'})),a=document.createElement('a');a.href=u;a.download='moral-trade-ledger.csv';a.click();URL.revokeObjectURL(u);toast('Ledger CSV exported.');
}
document.addEventListener('click',e=>{
 let x=e.target.closest('[data-page]');if(x){setPage(x.dataset.page);return}
 x=e.target.closest('[data-now]');if(x){state.now=x.dataset.now;render();return}
 x=e.target.closest('[data-trade]');if(x){state.trade=x.dataset.trade;render();return}
 x=e.target.closest('[data-build]');if(x){state.build=x.dataset.build;render();return}
 x=e.target.closest('[data-activity]');if(x){state.activity=x.dataset.activity;render();return}
 x=e.target.closest('[data-cal]');if(x){state.calendar=x.dataset.cal;render();return}
 x=e.target.closest('[data-select]');if(x){state.selected=x.dataset.select;render();return}
 x=e.target.closest('[data-ingredient]');if(x){addClause(x.dataset.ingredient);return}
 x=e.target.closest('[data-remove]');if(x){state.clauses.splice(+x.dataset.remove,1);render();return}
 x=e.target.closest('[data-action]');if(!x)return;let a=x.dataset.action;
 if(a==='profile')openDrawer(profileDrawer()); else if(a==='command')openDrawer(commandDrawer()); else if(a==='close')closeDrawer();
 else if(a==='dealroom'){state.page='trade';state.trade='dealroom';location.hash='trade';render()}
 else if(a==='calendar'){state.page='activity';state.activity='calendar';location.hash='activity';render()}
 else if(a==='select-bio'){state.threshold=Math.min(9990,state.threshold+45);toast('$45 conditionally pledged to the biosecurity salary-gap pool.');render()}
 else if(a==='add-pledge'){state.threshold=Math.min(9990,state.threshold+10);toast('$10 conditionally pledged.');render()}
 else if(a==='verify'){state.verified=true;toast('Verification recorded. Counterparty release is ready.');render()}
 else if(a==='toggle-test'){state.test=!state.test;toast(`Test mode ${state.test?'enabled':'disabled'}.`);render()}
 else if(a==='zoom-in'){state.zoom=Math.min(1.4,state.zoom+.1);render()} else if(a==='zoom-out'){state.zoom=Math.max(.7,state.zoom-.1);render()}
 else if(a==='lock'){state.locked=true;toast('Terms locked by Alex. Mina was asked to confirm.');render()}
 else if(['make-offer','create','publish','from-command','repeat'].includes(a)){closeDrawer();state.page='trade';state.trade='build';location.hash='trade';toast('Draft created with editable exact terms.');render()}
 else if(a==='pledge')toast(`$${state.pledge} conditional pledge reserved.`)
 else if(a==='export')exportCSV()
 else if(a==='confirm')toast('Allocations confirmed. Conditions will be monitored.')
 else if(a==='approve')toast('$20 approved under the standing rule.')
 else if(a==='decline')toast('Approval declined. No funds moved.')
 else if(a==='pause')toast('All standing rules paused.')
 else if(a==='start-route')toast('Route started. $40 reserved and step 1 opened.')
 else if(a==='save')toast('Saved.')
 else if(a==='counter')toast('Counteroffer sent to Mina.')
 else if(a==='pass')toast('Match passed. Next match loaded.')
 else if(a==='test')toast('Terms tested: a mutually acceptable range exists.')
 else if(a==='compare')toast('Compare mode enabled. Select multiple opportunities.')
 else if(a==='invite')toast('Invitation composer opened.')
 else if(a==='watch')toast('Opportunity added to watch list.')
});
document.addEventListener('input',e=>{if(e.target.id==='pledgeSlider'){state.pledge=+e.target.value;let b=$('[data-action="pledge"]');if(b)b.textContent=`Pledge $${state.pledge} conditionally`}});
$('#overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeDrawer()});
addEventListener('hashchange',()=>{state.page=(location.hash||'#now').slice(1);render()});
render();
