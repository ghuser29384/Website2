  if (target.dataset.filter === 'max') {
    const output = document.querySelector('#max-output');
    if (output) output.value = Number(target.value) >= 250 ? '$250+' : `$${target.value}`;
    window.clearTimeout(target._syncTimer);
    target._syncTimer = window.setTimeout(() => {
      store.update((draft) => { draft.constraints.maximumCommitment = Number(target.value); updateQueryFromState(draft); return draft; }, { history: 'replace' });
    }, 120);
  } else if (target.dataset.filter === 'min-return') {
    const output = document.querySelector('#min-return-output');
    if (output) output.value = Number(target.value) ? `$${target.value}` : 'Any';
    window.clearTimeout(target._syncTimer);
    target._syncTimer = window.setTimeout(() => {
      store.update((draft) => { draft.constraints.minimumReturnAmount = Number(target.value); updateQueryFromState(draft); return draft; }, { history: 'replace' });
    }, 120);
  } else if (target.dataset.filter === 'recipient') {
    scheduleTextFilter('recipient');
  } else if (target.dataset.filter === 'evidence') {
    scheduleTextFilter('evidence');
  }
  if (target.matches('[data-pledge-range]')) {
    const id = target.dataset.poolId;
    store.update((draft) => { draft.pledgeAmounts[id] = Number(target.value); return draft; }, { history: 'replace' });
  }
}

function handleSubmit(event) {
  if (event.target.id !== 'command-form') return;
  event.preventDefault();
  const query = new FormData(event.target).get('command')?.trim() || '';
  runSearch(query);
}

function handleTabKey(event, tab) {
  const list = [...tab.closest('[role="tablist"]').querySelectorAll('[role="tab"]')];
  const index = list.indexOf(tab);
  if (!['ArrowLeft','ArrowRight','Home','End'].includes(event.key)) return;
  event.preventDefault();
  let nextIndex = index;
  if (event.key === 'ArrowLeft') nextIndex = (index - 1 + list.length) % list.length;
  if (event.key === 'ArrowRight') nextIndex = (index + 1) % list.length;
  if (event.key === 'Home') nextIndex = 0;
  if (event.key === 'End') nextIndex = list.length - 1;
  list[nextIndex].focus();
  list[nextIndex].click();
}

function nearestGraphNode(current, key) {
  const nodes = [...document.querySelectorAll('[data-graph-node]')].filter((node) => !node.disabled);
  const x = Number(current.dataset.x);
  const y = Number(current.dataset.y);
  const candidates = nodes.filter((node) => node !== current).map((node) => {
    const nx = Number(node.dataset.x); const ny = Number(node.dataset.y);
    const dx = nx - x; const dy = ny - y;
    const directional = key === 'ArrowRight' ? dx > 0 : key === 'ArrowLeft' ? dx < 0 : key === 'ArrowDown' ? dy > 0 : dy < 0;
    return { node, dx, dy, directional, distance: Math.hypot(dx, dy) + (key === 'ArrowRight' || key === 'ArrowLeft' ? Math.abs(dy) * .7 : Math.abs(dx) * .7) };
  }).filter((entry) => entry.directional).sort((a, b) => a.distance - b.distance);
  return candidates[0]?.node;
}

function handleGraphKey(event, node) {
  if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(event.key)) {
    event.preventDefault();
    const next = nearestGraphNode(node, event.key);
    if (next) {
      document.querySelectorAll('[data-graph-node]').forEach((entry) => entry.tabIndex = -1);
      next.tabIndex = 0;
      next.focus();
      store.getState().graphFocusId = next.dataset.nodeId;
    }
  } else if (event.key === 'Home') {
    event.preventDefault();
    const you = document.querySelector('[data-node-id="you"]');
    if (you) { document.querySelectorAll('[data-graph-node]').forEach((entry) => entry.tabIndex = -1); you.tabIndex = 0; you.focus(); }
  } else if (event.key === 'Enter') {
    event.preventDefault();
    activateGraphNode(node);
  } else if (event.key === ' ') {
    event.preventDefault();
    const type = node.dataset.nodeType;
    const id = node.dataset.nodeId;
    if (type === 'offer' || type === 'pool') toggleCompare(id);
    else if (type === 'cause') {
      const result = getOfferResults(store.getState(), { ...store.getState().constraints, causes: [id] })[0];
      if (result) toggleCompare(result.item.id);
    } else if (type === 'person') {
      store.update((draft) => { draft.bookmarked = draft.bookmarked.includes(id) ? draft.bookmarked.filter((value) => value !== id) : [...draft.bookmarked, id]; return draft; }, { history: 'replace' });
    }
  } else if (event.key === 'Escape') closeInspector();
}

function activateGraphNode(node) {
  const type = node.dataset.nodeType;
  const id = node.dataset.nodeId;
  if (type === 'cause') selectCause(id, node);
  else if (['offer','pool','person'].includes(type)) selectItem(type, id, currentView(store.getState()), node);
}

function trapFocus(event) {
  const dialog = overlayRoot.querySelector('.dialog-surface, .mobile-sheet');
  if (!dialog) return;
  if (event.key === 'Escape') {
    event.preventDefault();
    if (store.getState().methodOpen || store.getState().compareOpen) store.update((draft) => { draft.methodOpen = null; draft.compareOpen = false; return draft; }, { history: 'replace' });
    else if (store.getState().compactDrawer) store.update((draft) => { draft.compactDrawer = null; return draft; }, { history: 'replace' });
    else closeInspector();
    return;
  }
  if (event.key !== 'Tab') return;
  const focusable = [...dialog.querySelectorAll('button:not([disabled]), input:not([disabled]), select:not([disabled]), a[href], [tabindex]:not([tabindex="-1"])')].filter((element) => element.offsetParent !== null);
  if (!focusable.length) return;
  const first = focusable[0]; const last = focusable[focusable.length - 1];
  if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
  else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
}

function handleKeydown(event) {
  const exchangeRow = event.target.closest('.offer-row-content[data-action="select-item"]');
  if (exchangeRow && (event.key === 'Enter' || event.key === ' ')) {
    event.preventDefault();
    selectItem(exchangeRow.dataset.type, exchangeRow.dataset.id, exchangeRow.dataset.origin, exchangeRow);
    return;
  }
  const tab = event.target.closest('[role="tab"]');
  if (tab) handleTabKey(event, tab);
  const graphNode = event.target.closest('[data-graph-node]');
  if (graphNode) handleGraphKey(event, graphNode);
  if (overlayRoot.children.length) trapFocus(event);
}

function handleViewScroll(event) {
  if (!isMobileViewport()) return;
  const main = document.querySelector('.discover-main');
  const state = store.getState();
  if (event.currentTarget.scrollTop > 105) {
    state.commandCollapsed = true;
    main?.classList.add('command-collapsed');
  } else if (event.currentTarget.scrollTop < 25) {
    state.commandCollapsed = false;
    main?.classList.remove('command-collapsed');
  }
}

function setupLassoCanvas() {
  const canvas = document.querySelector('[data-lasso-canvas]');
  if (!canvas) return;
  canvas.addEventListener('pointerdown', (event) => {
    const state = store.getState();
    if (!state.lassoMode || event.target.closest('.value-point')) return;
    const rect = canvas.getBoundingClientRect();
    const startX = event.clientX - rect.left + canvas.scrollLeft;
    const startY = event.clientY - rect.top + canvas.scrollTop;
    const box = document.createElement('div');
    box.className = 'lasso-box';
    canvas.append(box);
    lassoSession = { canvas, rect, startX, startY, box, pointerId: event.pointerId };
    canvas.setPointerCapture?.(event.pointerId);
  });
}

function handlePointerMove(event) {
  if (!lassoSession || event.pointerId !== lassoSession.pointerId) return;
  const x = event.clientX - lassoSession.rect.left + lassoSession.canvas.scrollLeft;
  const y = event.clientY - lassoSession.rect.top + lassoSession.canvas.scrollTop;
  const left = Math.min(lassoSession.startX, x); const top = Math.min(lassoSession.startY, y);
  const width = Math.abs(x - lassoSession.startX); const height = Math.abs(y - lassoSession.startY);
  Object.assign(lassoSession.box.style, { left: `${left}px`, top: `${top}px`, width: `${width}px`, height: `${height}px` });
}

function handlePointerUp(event) {
  if (!lassoSession || event.pointerId !== lassoSession.pointerId) return;
  const boxRect = lassoSession.box.getBoundingClientRect();
  const selected = [...lassoSession.canvas.querySelectorAll('.value-point')].filter((point) => {
    const rect = point.getBoundingClientRect();
    const cx = rect.left + rect.width / 2; const cy = rect.top + rect.height / 2;
    return cx >= boxRect.left && cx <= boxRect.right && cy >= boxRect.top && cy <= boxRect.bottom;
  }).map((point) => point.dataset.pointId);
  lassoSession.box.remove();
  lassoSession = null;
  if (selected.length) {
    store.update((draft) => { draft.compareIds = [...new Set([...draft.compareIds, ...selected])]; return draft; }, { history: 'replace' });
    announce(`${selected.length} opportunities added to comparison`);
  }
}

function handleSheetPointerDown(event) {
  const sheet = event.target.closest('.mobile-sheet');
  if (!sheet || event.clientY > sheet.getBoundingClientRect().top + 55) return;
  sheetSwipeStart = { y: event.clientY, pointerId: event.pointerId };
}

function handleSheetPointerUp(event) {
  if (!sheetSwipeStart || event.pointerId !== sheetSwipeStart.pointerId) return;
  if (event.clientY - sheetSwipeStart.y > 80) closeInspector();
  sheetSwipeStart = null;
}

document.addEventListener('click', (event) => {
  const graphNode = event.target.closest('[data-graph-node]');
  if (graphNode && !event.target.closest('[data-action]')) {
    const state = store.getState();
    if (state.lassoMode && ['offer','pool'].includes(graphNode.dataset.nodeType)) toggleCompare(graphNode.dataset.nodeId);
    else activateGraphNode(graphNode);
    return;
  }
  handleClick(event);
});
document.addEventListener('change', handleChange);
document.addEventListener('toggle', (event) => {
  if (event.target.matches?.('[data-details="filters"]')) {
    store.getState().filterOpen = event.target.open;
  }
}, true);
document.addEventListener('input', handleInput);
document.addEventListener('submit', handleSubmit);
document.addEventListener('keydown', handleKeydown);
document.addEventListener('pointermove', handlePointerMove);
document.addEventListener('pointerup', (event) => { handlePointerUp(event); handleSheetPointerUp(event); });
document.addEventListener('pointerdown', handleSheetPointerDown);

window.addEventListener('popstate', (event) => {
  if (event.state?.discover) store.applyHistory(event.state.state);
  else window.location.reload();
});

window.addEventListener('resize', () => {
  const state = store.getState();
  if (isMobileViewport() && !new URLSearchParams(location.search).has('view') && !state.queryActive && state.domain !== 'pools' && currentView(state) !== 'list') {
    store.update((draft) => { draft.viewByDomain[draft.domain] = 'list'; draft.inspectorOpen = false; return draft; }, { history: 'replace' });
  } else render(state, state);
});

store.subscribe(render);
store.syncCurrentUrl();
render(store.getState(), store.getState());
</script></body></html>
