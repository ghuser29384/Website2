function getOfferResults(state, override = {}) {
  const constraints = { ...state.constraints, ...override };
  const matched = offers
    .filter((item) => item.publicationBlockers.length === 0)
    .filter((item) => item.status !== 'expired' || constraints.terms.includes('expired'))
    .map((item) => ({ item, match: offerMatch(item, constraints) }))
    .filter(({ match }) => match.include);
  return sortResults(matched, 'offers', constraints.sort);
}

function getPoolResults(state, override = {}) {
  const constraints = { ...state.constraints, ...override };
  const matched = pools.map((item) => ({ item, match: poolMatch(item, constraints) })).filter(({ match }) => match.include);
  return sortResults(matched, 'pools', constraints.sort);
}

function getPeopleResults(state, override = {}) {
  const constraints = { ...state.constraints, ...override };
  const matched = people.map((item) => ({ item, match: personMatch(item, constraints) })).filter(({ match }) => match.include);
  return sortResults(matched, 'people', constraints.sort);
}

function getResults(state) {
  if (state.domain === 'offers') return getOfferResults(state);
  if (state.domain === 'pools') return getPoolResults(state);
  return getPeopleResults(state);
}

function hasActiveConstraints(state) {
  return activeFilterCount(state.constraints) > 0 || state.constraints.terms.length > 0;

  const tokens = constraintTokens(state.constraints, state.domain).map((token) => token.label);
  if (tokens.length) return tokens.join(' · ');

  if (state.domain === 'pools') return 'Pools · Standalone threshold campaigns';
  if (state.constraints.offerKind === 'co-fund') return 'Offers · Co-Funds';
  if (state.constraints.offerKind === 'individual') return 'Offers · Individual offers';
  return 'Offers · All current opportunities';
}

function buildNaturalCommand(domain, constraints) {
  const parts = ['Find'];
  if (constraints.verifiedOnly) parts.push('verified');
  if (constraints.causes.length) parts.push(constraints.causes.map(causeName).join(' or '));
  if (domain === 'people') parts.push('people');
  else if (domain === 'pools') parts.push('standalone threshold pools');
  else if (constraints.offerKind === 'co-fund') parts.push('Co-Funds');
  else if (constraints.offerKind === 'individual') parts.push('individual offers');
  else parts.push('offers');
  if (constraints.offerTypes.length) parts.push(`where you offer ${constraints.offerTypes.map((type) => offerTypeLabels[type] || type).join(' or ')}`);
  if (constraints.returnTypes.length) parts.push(`and get ${constraints.returnTypes.map((type) => returnTypeLabels[type] || type).join(' or ')}`);
  if (constraints.mechanisms.length) parts.push(`using ${constraints.mechanisms.join(' or ')}`);
  if (constraints.maximumCommitment < 250) parts.push(`with your money commitment under $${constraints.maximumCommitment}`);
  if (constraints.minimumReturnAmount > 0) parts.push(`returning at least $${constraints.minimumReturnAmount}`);
  if (constraints.recipient) parts.push(`for ${constraints.recipient}`);
  if (constraints.evidence) parts.push(`verified by ${constraints.evidence}`);
  if (constraints.flexibilities.length) parts.push(`with ${constraints.flexibilities.map((value) => exchangeFlexibilityLabels[value] || value).join(' or ')}`);
  if (constraints.deadlineBefore) parts.push(`before ${formatDate(constraints.deadlineBefore, { month: 'long', day: 'numeric' })}`);
  if (constraints.availability) parts.push('available now');
  if (constraints.terms.length) parts.push(constraints.terms.join(' '));
  return parts.join(' ');
}

      <div class="full-rail">
        <section class="rail-section"><span class="rail-label">Domains</span>${renderDomainTabs(state)}</section>
        <section class="rail-section"><span class="rail-label">Views</span>${renderViewTabs(state)}</section>
        <details class="rail-details" ${state.filterOpen ? 'open' : ''} data-details="filters">
          <summary>Filters <span>${filterCount ? `· ${filterCount}` : ''}</span></summary>${renderFilters(state)}
        </details>
        <section class="rail-section">${renderSavedSearches(state)}</section>
        <button class="rail-reset" data-action="reset">Reset discovery state →</button>
      </div>
      <div class="compact-rail" aria-label="Compact Discover tools">
        <button data-action="open-compact" data-panel="domains"><span>◉</span>Domains</button>
        <button data-action="open-compact" data-panel="views"><span>⌗</span>Views</button>
        <button data-action="open-compact" data-panel="filters" class="${filterCount ? 'active' : ''}"><span>≡</span>Filters${filterCount ? ` · ${filterCount}` : ''}</button>
        <button data-action="open-compact" data-panel="saved" class="${totalNew ? 'active' : ''}"><span>◇</span>Saved${totalNew ? ` · ${totalNew}` : ''}</button>
      </div>
    </aside>`;
}

function renderMobileTabs(state) {
  const filterCount = activeFilterCount(state.constraints);
  const totalNew = savedSearches.reduce((sum, item) => sum + item.newCount, 0);
  return `<div class="mobile-tabs">
    ${renderDomainTabs(state, 'mobile-tab-row')}
    ${renderViewTabs(state, 'mobile-tab-row')}
    <div class="mobile-utility-row">
      <button data-action="open-mobile-tools" data-panel="filters">Filters${filterCount ? ` · ${filterCount}` : ''}</button>
      <button data-action="open-mobile-tools" data-panel="saved">Saved searches · ${totalNew} new</button>
    </div>
  </div>`;
}

function renderCommandArea(state, results) {
  const tokens = constraintTokens(state.constraints, state.domain);
  const alternative = state.routeNote?.alternative || (currentView(state) === 'list' ? 'value' : 'list');
  return `
    <div class="command-area">
      <div class="discover-heading-row">
        <div class="discover-heading"><h1>Discover where value can move.</h1><p>Explore causes, exact terms, trust routes, and pooled activation without losing the state of your search.</p></div>
        <div class="today-block">TODAY<b>July 17, 2026</b></div>
      </div>
      <form class="command-form" id="command-form">
        <label class="sr-only" for="command-input">Describe what you want to find</label>
        <input id="command-input" name="command" value="${escapeHtml(state.query)}" placeholder="Find verified civic opportunities under $50 before August 1" autocomplete="off" />
        <button type="submit">Run search →</button>
      </form>
      <div class="command-compact"><span>${escapeHtml(buildCommandSummary(state))}</span><button data-action="edit-search">Edit search</button></div>
      ${renderOfferKindSwitcher(state)}
      ${state.queryActive || hasActiveConstraints(state) ? `
        <details class="parsed-wrap">
          <summary>Parsed constraints · ${tokens.length}</summary>
          <div class="token-row">${tokens.length ? tokens.map((token) => `<button class="token" data-action="remove-token" data-token="${token.key}" title="Remove ${escapeHtml(token.label)}"><span>${escapeHtml(token.label)}</span><i>×</i></button>`).join('') : '<span class="result-count">No active constraints</span>'}</div>
        </details>` : ''}
      ${state.parserConfidence === 'low' ? `<div class="parser-warning"><strong>Search interpretation uncertain.</strong> The query was not specific enough to identify a cause, domain, or exact constraint. Review the parsed state before acting.</div>` : ''}
      ${state.routeNote ? `<div class="route-note"><span><strong>${escapeHtml(state.routeNote.text.split(' because ')[0])}</strong>${state.routeNote.text.includes(' because ') ? ` because ${escapeHtml(state.routeNote.text.split(' because ').slice(1).join(' because '))}` : ''}</span><button data-action="set-view" data-view="${alternative}">View in ${domainViews[state.domain].find((view) => view.id === alternative)?.label || alternative} instead</button></div>` : ''}
      <div class="result-toolbar">
        <div class="result-count">${contextualResultCount(state, results)}</div>
        ${renderSortControl(state)}
      </div>
    </div>`;
}

function renderSortControl(state) {
  const selected = validSortForDomain(state);
  return `<div class="sort-control"><label for="sort-select">Sort</label><select id="sort-select" data-filter="sort" aria-label="Sort ${state.domain}">
    ${sortOptions[state.domain].map(([id, label]) => `<option value="${id}" ${selected === id ? 'selected' : ''}>${label}</option>`).join('')}
  </select></div>`;
}

function renderViewHead(title, description, tools = '') {
  return `<div class="view-head"><div class="view-title"><h2>${title}</h2><p>${description}</p></div><div class="view-tools">${tools}</div></div>`;
}

function graphAccessibleListButton() {
  return `<button class="quiet-btn" data-action="accessible-list">View as accessible list →</button>`;
}

function renderConstellation(state) {
  const baseConstraints = { ...state.constraints, causes: [] };
  const counts = Object.fromEntries(causeAreas.map((cause) => [cause.id, offers
    .filter((offer) => offer.status !== 'expired' && offer.causeId === cause.id)
    .filter((offer) => offerMatch(offer, baseConstraints).include).length]));
  const visibleRoutes = Object.values(counts).reduce((sum, count) => sum + count, 0);
  const focusId = state.graphFocusId || 'you';
  const personPins = [
    { id: 'person-mina', label: 'Mina', x: 61, y: 48 },
    { id: 'person-sasha', label: 'Sasha', x: 78, y: 29 },
    { id: 'person-eli', label: 'Eli', x: 51, y: 22 },
    { id: 'person-aisha', label: 'Aisha', x: 31, y: 51 }
  ];
  const lines = causeAreas.map((cause) => `<path d="M 500 305 Q ${(500 + cause.x * 10) / 2} ${(305 + cause.y * 6.1) / 2} ${cause.x * 10} ${cause.y * 6.1}" class="${cause.id === 'civic-infrastructure' ? 'primary' : ''}" />`).join('');
  return `<section class="view-stage" id="discover-view" role="tabpanel" aria-labelledby="view-tab-constellation">
    ${renderViewHead('The cause constellation', `A neutral overview of ${visibleRoutes} routes across nine cause areas. Select a cause to see the ranked recommendation and every current trade.`, graphAccessibleListButton())}
    <div class="constellation-wrap" aria-label="Cause constellation. Use arrow keys to move between nodes.">
      <div class="constellation-canvas">
        <svg class="constellation-lines" viewBox="0 0 1000 610" preserveAspectRatio="none" aria-hidden="true">${lines}<path d="M610 293 Q680 245 750 262" class="primary dashed" /></svg>
        <button class="you-node graph-node" data-graph-node data-node-type="you" data-node-id="you" data-x="50" data-y="50" tabindex="${focusId === 'you' ? 0 : -1}" aria-label="You, center of the constellation"><span><b>You</b><span>${visibleRoutes} reachable routes</span></span></button>
        ${causeAreas.map((cause, index) => {
          const count = counts[cause.id];
          const selected = state.selectedCause === cause.id;
          return `<button id="trigger-cause-${cause.id}" class="cause-node graph-node tone-${cause.tone} ${selected ? 'selected' : ''}" style="left:${cause.x}%;top:${cause.y}%" data-graph-node data-node-type="cause" data-node-id="${cause.id}" data-x="${cause.x}" data-y="${cause.y}" tabindex="${focusId === cause.id ? 0 : -1}" aria-pressed="${selected}" aria-label="${cause.name}: ${count} match your filters, ${cause.totalOffers} total offers">
            ${[2,4,7].includes(index) ? '<span class="signal">2</span>' : ''}
            <span><span class="node-name">${cause.name}</span><span class="node-count"><strong>${count} match filters</strong> · ${cause.totalOffers} total<br>${cause.available} available</span></span>
          </button>`;
        }).join('')}
        ${personPins.map((pin) => `<button id="trigger-${pin.id}" class="person-dot graph-node" style="left:${pin.x}%;top:${pin.y}%" data-graph-node data-node-type="person" data-node-id="${pin.id}" data-x="${pin.x}" data-y="${pin.y}" tabindex="${focusId === pin.id ? 0 : -1}" aria-label="${pin.label}, trusted person">${pin.label}</button>`).join('')}
      </div>
    </div>
    <div class="graph-instruction"><span>Arrow keys move between nodes · Enter opens details · Space adds the best route to comparison · Home returns to You</span>${graphAccessibleListButton()}</div>
  </section>`;
}

function renderValueField(state) {
  const results = state.domain === 'pools' ? getPoolResults(state) : getOfferResults(state);
  if (!results.length) return renderEmptyState(state);
  const tools = `${state.domain === 'offers' ? `<button class="outline-btn" data-action="toggle-lasso" aria-pressed="${Boolean(state.lassoMode)}">${state.lassoMode ? 'Lasso active' : 'Select / lasso'}</button>` : ''}<button class="quiet-btn" data-action="open-method" data-method="value">How this is calculated</button>${graphAccessibleListButton()}`;
  const pointMarkup = results.map(({ item, match }) => {
    const metrics = state.domain === 'offers' ? match.metrics : {
      burden: clamp(match.metrics.gapRatio * 75 + match.metrics.urgency * 25, 0, 100),
      expectedValue: clamp((item.impactEstimate / 5) * item.evidenceConfidence * item.valueAlignment * 100, 0, 100),
      burdenLabel: match.metrics.gapRatio <= .15 ? 'Lower activation gap' : match.metrics.gapRatio <= .4 ? 'Moderate activation gap' : 'Higher activation gap',
      valueLabel: item.evidenceConfidence >= .85 ? 'Stronger evidence' : 'Developing evidence'
    };
    const left = 6 + metrics.burden * .86;
    const bottom = 6 + metrics.expectedValue * .82;
    const selected = state.compareIds.includes(item.id);
    const mechanism = state.domain === 'pools' ? 'trade' : isCoFund(item) ? 'co-fund' : item.mechanism;
    const pointTitle = state.domain === 'offers' ? exchangeGlanceText(item) : item.title;
    const pointMeta = state.domain === 'offers' ? `${item.title} · ${metrics.burdenLabel} · ${metrics.valueLabel}` : `${metrics.burdenLabel} · ${metrics.valueLabel}`;
    return `<button id="trigger-${item.id}" class="value-point ${mechanism} ${selected ? 'selected' : ''} graph-node" style="left:${left}%;bottom:${bottom}%" data-point-id="${item.id}" data-graph-node data-node-type="${state.domain === 'pools' ? 'pool' : 'offer'}" data-node-id="${item.id}" data-x="${left}" data-y="${100-bottom}" tabindex="-1" aria-pressed="${selected}" aria-label="${escapeHtml(pointTitle)}. ${metrics.burdenLabel}. ${metrics.valueLabel}.">
      <span class="mark"></span><span class="point-title">${escapeHtml(pointTitle)}</span><span class="point-meta">${escapeHtml(pointMeta)}</span>
    </button>`;
  }).join('');
  const recommended = results[0];
  const recommendedMetrics = state.domain === 'offers' ? recommended.match.metrics : null;
  return `<section class="view-stage" id="discover-view" role="tabpanel" aria-labelledby="view-tab-value">
    ${renderViewHead('Value field', 'Positions are derived from explicit burden, impact, evidence, and alignment variables—not hand-placed scores.', tools)}
    <div class="value-field-shell">
      <div class="value-canvas" data-lasso-canvas aria-label="Value field. Horizontal position is estimated burden; vertical position is supported expected value.">
        <span class="axis-y-label">More supported expected value ↑</span>
        <span class="axis-x-label"><span>Lower estimated burden</span><span>Higher estimated burden →</span></span>
        ${pointMarkup}
      </div>
      <aside class="field-legend">
        <h3>Interpretation</h3>
        <div class="metric-card"><b>Horizontal · estimated burden</b><span>Money, time, behavioral friction, and verification burden. The index is qualitative and bounded.</span></div>
        <div class="metric-card"><b>Vertical · supported expected value</b><span>Impact estimate × evidence confidence × value alignment. It is a comparison aid, not a probability.</span></div>
        <div class="metric-card"><b>Point shape · mechanism</b><span>Circle: trade · diamond: action or redirect. Selection emphasis is not a recommendation.</span></div>
        ${recommended ? `<div class="compare-summary"><b>Best fit under current sort</b><p>${escapeHtml(state.domain === 'offers' ? exchangeGlanceText(recommended.item) : recommended.item.title)}${recommendedMetrics ? ` · ${recommendedMetrics.burdenLabel} · ${recommendedMetrics.valueLabel}` : ''}</p><button class="primary-btn" data-action="select-item" data-type="${state.domain === 'pools' ? 'pool' : 'offer'}" data-id="${recommended.item.id}" data-origin="value">Full terms</button></div>` : ''}
      </aside>
    </div>
    <div class="graph-instruction"><span>${state.lassoMode ? 'Drag across points to add them to comparison. Click a point to toggle it.' : 'Click a point to inspect exact terms. Turn on Select / lasso for multi-opportunity comparison.'}</span>${graphAccessibleListButton()}</div>
    ${renderCompareDock(state)}
  </section>`;
}

function poolPosition(pool, metrics) {
  const centerX = 360;
  const centerY = 310;
  const radius = 86 + metrics.gapRatio * 205;
  const angleDegrees = -90 + clamp(metrics.urgencyDays / 45, 0, 1) * 300;
  const angle = angleDegrees * Math.PI / 180;
  return { x: centerX + Math.cos(angle) * radius, y: centerY + Math.sin(angle) * radius };
}

function renderThreshold(state) {
  const results = getPoolResults(state);
  if (!results.length) return renderEmptyState(state);
  const selectedPool = state.selectedItem?.type === 'pool' ? pools.find((pool) => pool.id === state.selectedItem.id) : null;
  const active = selectedPool || results[0].item;
  const activeMetrics = derivePoolMetrics(active);
  const pledge = state.pledgeAmounts[active.id] ?? Math.min(10, activeMetrics.gap);
  const afterGap = Math.max(0, activeMetrics.gap - pledge);
  const bubbles = results.map(({ item, match }) => {
    const position = poolPosition(item, match.metrics);
    const size = clamp(82 + Math.log10(item.threshold / 1000) * 25, 92, 132);
    const selected = selectedPool?.id === item.id;
    const extraClass = item.status === 'verification-unavailable' ? 'verification-unavailable' : match.metrics.status;
    return `<button id="trigger-${item.id}" class="pool-bubble graph-node ${extraClass} ${selected ? 'selected' : ''}" style="left:${position.x}px;top:${position.y}px;width:${size}px;height:${size}px" data-graph-node data-node-type="pool" data-node-id="${item.id}" data-x="${position.x}" data-y="${position.y}" tabindex="-1" aria-label="${escapeHtml(item.title)}. ${match.metrics.statusLabel}. ${formatMoney(match.metrics.gap)} remaining. Deadline in ${match.metrics.urgencyDays} days.">
      <span><span class="pool-status">${match.metrics.statusLabel}</span><span class="pool-title">${escapeHtml(item.title)}</span><span class="pool-gap">${formatMoney(match.metrics.gap)} remaining</span></span>
    </button>`;
  }).join('');
  return `<section class="view-stage" id="discover-view" role="tabpanel" aria-labelledby="view-tab-threshold">
    ${renderViewHead('Standalone threshold radar', 'These are moral-public-good campaigns without a reciprocal trade counterparty. Distance from activation, deadline urgency, pool scale, and risk state are derived from current terms.', `<button class="quiet-btn" data-action="open-method" data-method="threshold">How this is calculated</button>${graphAccessibleListButton()}`)}
    <div class="threshold-layout">
      <div class="threshold-canvas">
        <div class="radar-inner">
          <div class="ring r3"></div><div class="ring r2"></div><div class="ring r1"></div>
          <span class="ring-label near">NEAR THRESHOLD</span><span class="ring-label ontrack">ON TRACK</span><span class="ring-label far">LARGER GAP</span>
          ${bubbles}
          <div class="threshold-center">
            <span>PREVIEW YOUR PLEDGE</span><b>${formatMoney(pledge)}</b><input type="range" min="0" max="${Math.max(10, Math.min(250, activeMetrics.gap))}" step="5" value="${pledge}" data-pledge-range data-pool-id="${active.id}" aria-label="Conditional pledge amount for ${escapeHtml(active.title)}" />
            <span>${formatMoney(afterGap)} remains · ${formatGapShare(activeMetrics.gap > 0 ? pledge / activeMetrics.gap : 1)} of current gap</span><button data-action="pledge" data-id="${active.id}">Continue with a conditional pledge →</button>
          </div>
        </div>
      </div>
      <aside class="threshold-side"><h3>Read the radar</h3>
        <div class="threshold-key"><div class="key-row"><span class="key-dot near"></span><span>Near threshold · 10% or less remains</span></div><div class="key-row"><span class="key-dot"></span><span>On track · viable gap and timing</span></div><div class="key-row"><span class="key-dot risk"></span><span>At risk · large gap with urgent deadline</span></div></div>
        <div class="metric-card"><b>Radius</b><span>Remaining gap ÷ total threshold. Smaller gaps sit closer to the centre.</span></div>
        <div class="metric-card"><b>Angle</b><span>Deadline urgency. More urgent pools sit nearer the top; later deadlines move clockwise.</span></div>
        <div class="metric-card"><b>Bubble size</b><span>Total pool scale, shown with a bounded logarithmic scale.</span></div>
      </aside>
    </div>
    <div class="graph-instruction"><span>Select any pool to inspect its current gap, failure conditions, authorization expiry, and exact proof.</span>${graphAccessibleListButton()}</div>
  </section>`;
}

function renderTrustNetwork(state) {
  const results = getPeopleResults(state);
  if (!results.length) return renderEmptyState(state);
  const focusId = state.graphFocusId || 'you';
  const lines = results.map(({ item }) => `<line x1="50%" y1="50%" x2="${item.x}%" y2="${item.y}%" class="${item.trust.includes('Direct') || item.trust.includes('completed') ? 'direct' : 'introduced'}" />`).join('');
  return `<section class="view-stage" id="discover-view" role="tabpanel" aria-labelledby="view-tab-trust">
    ${renderViewHead('Your trust network', 'People are ordered by factual relationship routes, reliability, relevance, and current availability.', graphAccessibleListButton())}
    <div class="trust-canvas" aria-label="Trust network. Use arrow keys to move between people."><div class="trust-inner">
      <svg class="trust-lines" aria-hidden="true">${lines}</svg>
      <button class="trust-you graph-node" data-graph-node data-node-type="you" data-node-id="you" data-x="50" data-y="50" tabindex="${focusId === 'you' ? 0 : -1}"><span><b>You</b><span>Alex Johnson</span></span></button>
      ${results.map(({ item }) => `<button id="trigger-${item.id}" class="trust-person graph-node ${state.selectedItem?.id === item.id ? 'selected' : ''} ${item.verified ? '' : 'warning'}" style="left:${item.x}%;top:${item.y}%" data-graph-node data-node-type="person" data-node-id="${item.id}" data-x="${item.x}" data-y="${item.y}" tabindex="${focusId === item.id ? 0 : -1}" aria-label="${item.name}, ${item.role}, ${item.trust}, ${item.reliability}% on time">
        <span><strong>${escapeHtml(item.name)}</strong><span>${escapeHtml(item.role)}<br>${item.commitments} commitments · ${item.reliability}% on time</span></span>
      </button>`).join('')}
    </div></div>
    <div class="graph-instruction"><span>Arrow keys move through the network · Enter opens person details · Home returns to You · Escape closes details</span>${graphAccessibleListButton()}</div>
  </section>`;
}

function matchReasonText(match) {
  return match.reasons.length ? `Matches ${match.reasons.join(', ')}` : 'Ranked by current fit, evidence, and burden';
}

function isCoFund(item) {
  return item?.listingKind === 'co-fund' && Boolean(item.coFund);
}

function statusLabel(item) {
  if (isCoFund(item)) return derivePoolMetrics({ ...item.coFund, deadline: item.deadline, status: item.status }).statusLabel;
  if (item.status === 'stale') return 'Stale terms';
  if (item.status === 'expired') return 'Expired';
  if (item.status === 'verification-unavailable') return 'Verification unavailable';
  if (item.status === 'at-risk') return 'At risk';
  return item.verified ? 'Verified' : 'Verification pending';
}

function renderExchangeAlternatives(groups) {
  return groups.map((group, index) => `${index ? '<div class="exchange-or" aria-label="or">OR</div>' : ''}<ul class="exchange-obligations">${group.map((term) => `<li>${escapeHtml(term)}</li>`).join('')}</ul>`).join('');
}

function firstExchangeTerm(item, sideName) {
  return item.exchange?.[sideName]?.alternatives?.[0]?.[0] || (sideName === 'offer' ? item.give : item.receive) || '';
}

function exchangeGlanceText(item) {
  const offerLabel = isCoFund(item) ? 'Contributor group provides' : 'You offer';
  const returnLabel = isCoFund(item) ? 'Counterparty provides' : 'You get';
  return `${offerLabel}: ${firstExchangeTerm(item, 'offer')} · ${returnLabel}: ${firstExchangeTerm(item, 'return')}`;
}

function renderExchangeSide(item, sideName) {
  const side = item.exchange[sideName];
  const label = isCoFund(item)
    ? (sideName === 'offer' ? 'You + contributors provide' : 'Counterparty provides')
    : (sideName === 'offer' ? 'You offer' : 'You get');
  const provider = isCoFund(item)
    ? (sideName === 'offer'
      ? `<div class="exchange-provider"><strong>${item.coFund.contributors} contributors</strong> · minimum ${formatMoney(item.coFund.minimumContribution)}</div>`
      : `<div class="exchange-provider">Counterparty <strong>${escapeHtml(item.counterparty)}</strong> · administered by ${escapeHtml(item.requester)}</div>`)
    : (sideName === 'return' ? `<div class="exchange-provider">Provided by <strong>${escapeHtml(item.requester)}</strong> · ${escapeHtml(item.role)}</div>` : '');
  return `<section class="exchange-side" data-exchange-side="${sideName}" aria-label="${label}">
    <div class="exchange-side-head"><span class="exchange-label">${label}</span><span class="exchange-flexibility">${exchangeFlexibilityLabels[side.flexibility]}</span></div>
    ${renderExchangeAlternatives(side.alternatives)}
    ${provider}
  </section>`;
}

function coFundMetrics(item) {
  return derivePoolMetrics({ ...item.coFund, deadline: item.deadline, status: item.status });
}

function renderCoFundProgress(item, compact = false) {
  if (!isCoFund(item)) return '';
  const metrics = coFundMetrics(item);
  const percent = clamp(Math.round((item.coFund.funded / item.coFund.threshold) * 100), 0, 100);
  return `<div class="cofund-funding ${compact ? 'compact' : ''}" data-cofund-progress data-funded="${item.coFund.funded}" data-threshold="${item.coFund.threshold}" data-contributors="${item.coFund.contributors}" data-minimum-contribution="${item.coFund.minimumContribution}" aria-label="${percent}% funded; ${formatMoney(metrics.gap)} remains"><div class="cofund-progress-track"><span class="cofund-progress-fill" style="width:${percent}%"></span></div><div class="cofund-funding-stats"><span><strong>${formatMoney(item.coFund.funded)}</strong> of ${formatMoney(item.coFund.threshold)}</span><span><strong>${item.coFund.contributors}</strong> contributors</span><span>Minimum <strong>${formatMoney(item.coFund.minimumContribution)}</strong></span><span><strong>${formatMoney(metrics.gap)}</strong> remains</span></div></div>`;
}

function exactMatchLabel(item) {
  if (item.status === 'expired') return 'Unavailable';
  return item.exchange.acceptanceMode === 'automatic' ? 'Accept & match' : 'Request exact match';
}

function renderOfferRow(state, result) {
  const { item, match } = result;
  const selected = state.compareIds.includes(item.id);
  const unavailable = item.status === 'expired';
  const coFund = isCoFund(item);
  const primary = coFund
    ? `<button id="trigger-${item.id}" class="primary-btn" data-action="select-item" data-type="offer" data-id="${item.id}" data-origin="join-cofund" data-response-intent="join-cofund" ${unavailable ? 'disabled' : ''}>Join Co-Fund →</button>`
    : `<button id="trigger-${item.id}" class="primary-btn" data-action="select-item" data-type="offer" data-id="${item.id}" data-origin="exact-match" data-response-intent="exact" ${unavailable ? 'disabled' : ''}>${exactMatchLabel(item)} →</button>`;
  const secondary = coFund
    ? `<button class="outline-btn" data-action="select-item" data-type="offer" data-id="${item.id}" data-origin="full-terms" data-response-intent="join-cofund">Terms</button>`
    : `<button class="outline-btn" data-action="select-item" data-type="offer" data-id="${item.id}" data-origin="counteroffer" data-response-intent="counteroffer" ${!item.exchange.counteroffersAllowed || unavailable ? 'disabled' : ''}>Counteroffer</button>`;
  return `<article class="transaction-row offer-transaction-row" data-row-id="${item.id}" data-offer-kind="${item.listingKind}" data-offer-publication="valid">
    <div class="compare-cell"><input type="checkbox" data-action="toggle-compare" data-id="${item.id}" ${selected ? 'checked' : ''} aria-label="Add ${escapeHtml(item.title)} to comparison" /></div>
    <div class="offer-row-content" data-action="select-item" data-type="offer" data-id="${item.id}" data-origin="list" role="button" tabindex="0" aria-label="Open full terms for ${escapeHtml(item.title)}">
      <div class="offer-row-meta"><div class="eyebrow"><span class="status-dot ${item.status}"></span>${causeName(item.causeId)} · ${statusLabel(item)} · ${item.mechanism}${coFund ? '<span class="cofund-badge">Co-Fund</span>' : ''}</div><div class="offer-row-deadline">${coFund ? 'Funding closes' : 'Complete by'} ${formatDate(item.deadline)}<br>${daysUntil(item.deadline)} days · ${escapeHtml(item.activity)}</div></div>
      <div class="exchange-grid">${renderExchangeSide(item, 'offer')}<div class="exchange-arrow" aria-hidden="true">↔</div>${renderExchangeSide(item, 'return')}</div>
      <div class="offer-context"><div class="offer-context-copy"><h3 class="offer-context-title">${escapeHtml(item.title)}</h3><p class="offer-context-description">${escapeHtml(item.description)}</p>${renderCoFundProgress(item)}</div><div class="match-reason">${escapeHtml(matchReasonText(match))}</div></div>
    </div>
    <div class="row-actions">
      ${primary}
      ${secondary}
      ${coFund ? '' : `<button class="quiet-btn" data-action="select-item" data-type="offer" data-id="${item.id}" data-origin="full-terms">Full terms →</button>`}
      <div class="row-action-line"><span class="cell-secondary">${escapeHtml(item.evidenceLevel)}</span><button class="bookmark-btn ${state.bookmarked.includes(item.id) ? 'saved' : ''}" data-action="bookmark" data-id="${item.id}" aria-label="${state.bookmarked.includes(item.id) ? 'Remove saved opportunity' : 'Save opportunity'}">${state.bookmarked.includes(item.id) ? '◆' : '◇'}</button></div>
    </div>
  </article>`;
}

function renderPoolRow(state, result) {
  const { item, match } = result;
  const selected = state.compareIds.includes(item.id);
  return `<article class="transaction-row" data-row-id="${item.id}">
    <div class="compare-cell"><input type="checkbox" data-action="toggle-compare" data-id="${item.id}" ${selected ? 'checked' : ''} aria-label="Add ${escapeHtml(item.title)} to comparison" /></div>
    <div class="row-main"><div class="eyebrow"><span class="status-dot ${match.metrics.status}"></span>${causeName(item.causeId)} · ${match.metrics.statusLabel}</div><h3 class="row-title">${escapeHtml(item.title)}</h3><p class="row-description">${escapeHtml(item.description)}</p><span class="mobile-row-meta" style="display:none">${escapeHtml(item.requester)} · ${formatDate(item.deadline)} · ${formatMoney(match.metrics.gap)} gap</span><div class="match-reason">${escapeHtml(matchReasonText(match))}</div></div>
    <div class="requester-cell"><span class="cell-label">Administrator</span><div class="cell-primary">${escapeHtml(item.requester)}</div><div class="cell-secondary">${item.verified ? 'Verified pool' : 'Verification unavailable'}<br>${item.contributors} contributors</div></div>
    <div class="mechanism-cell"><span class="cell-label">Activation</span><div class="cell-primary">${formatMoney(item.funded)} of ${formatMoney(item.threshold)}</div><div class="cell-secondary">${Math.round((item.funded / item.threshold) * 100)}% funded<br>${formatMoney(match.metrics.gap)} remains</div></div>
    <div class="deadline-cell"><span class="cell-label">Deadline</span><div class="cell-primary">${formatDate(item.deadline)}</div><div class="cell-secondary">${match.metrics.urgencyDays} days<br>${match.metrics.statusLabel}</div></div>
    <div class="row-actions"><button id="trigger-${item.id}" class="primary-btn" data-action="select-item" data-type="pool" data-id="${item.id}" data-origin="list">Pledge →</button><div class="row-action-line"><button class="outline-btn" data-action="select-item" data-type="pool" data-id="${item.id}" data-origin="list">Terms</button><button class="bookmark-btn ${state.bookmarked.includes(item.id) ? 'saved' : ''}" data-action="bookmark" data-id="${item.id}" aria-label="Save pool">${state.bookmarked.includes(item.id) ? '◆' : '◇'}</button></div></div>
  </article>`;
}

function renderPersonRow(state, result) {
  const { item, match } = result;
  return `<article class="transaction-row people-row" data-row-id="${item.id}">
    <div class="row-main"><div class="eyebrow"><span class="status-dot ${item.verified ? '' : 'stale'}"></span>${item.verified ? 'Verified person' : 'Trust changed'}</div><h3 class="row-title">${escapeHtml(item.name)}</h3><p class="row-description">${escapeHtml(item.role)} · ${escapeHtml(item.reciprocal)}</p><span class="mobile-row-meta" style="display:none">${escapeHtml(item.role)} · ${item.reliability}% on time · ${escapeHtml(item.availability)}</span><div class="match-reason">${escapeHtml(matchReasonText(match))}</div></div>
    <div class="requester-cell"><span class="cell-label">Trust route</span><div class="cell-primary">${escapeHtml(item.route)}</div><div class="cell-secondary">${escapeHtml(item.trust)}<br>${item.commitments} completed commitments</div></div>
    <div class="mechanism-cell"><span class="cell-label">Reliability</span><div class="cell-primary">${item.reliability}% on time</div><div class="cell-secondary">Verified ${item.recentlyVerified} days ago</div></div>
    <div class="deadline-cell"><span class="cell-label">Availability</span><div class="cell-primary">${escapeHtml(item.availability)}</div><div class="cell-secondary">${item.causeIds.map(causeName).join(' · ')}</div></div>
    <div class="row-actions"><button id="trigger-${item.id}" class="primary-btn" data-action="select-item" data-type="person" data-id="${item.id}" data-origin="list">View person →</button><div class="row-action-line"><button class="outline-btn" data-action="toast" data-message="Message composer opened for ${escapeHtml(item.name)}">Message</button><button class="bookmark-btn ${state.bookmarked.includes(item.id) ? 'saved' : ''}" data-action="bookmark" data-id="${item.id}" aria-label="Save person">${state.bookmarked.includes(item.id) ? '◆' : '◇'}</button></div></div>
  </article>`;
}

function renderList(state) {
  const results = getResults(state);
  if (state.systemStatus === 'loading') return renderLoadingState(state);
  if (state.systemStatus === 'error') return renderErrorState(state);
  if (!results.length) return renderEmptyState(state);
  const rows = state.domain === 'offers' ? results.map((result) => renderOfferRow(state, result)).join('') : state.domain === 'pools' ? results.map((result) => renderPoolRow(state, result)).join('') : results.map((result) => renderPersonRow(state, result)).join('');
  return `<section class="view-stage list-stage" id="discover-view" role="tabpanel" aria-labelledby="view-tab-list">
    ${renderViewHead(state.domain === 'people' ? 'People you can reach' : state.domain === 'pools' ? 'Standalone threshold pools' : state.constraints.offerKind === 'co-fund' ? 'Current Co-Funds' : state.constraints.offerKind === 'individual' ? 'Current individual offers' : 'Current opportunities', state.domain === 'offers' ? 'Compare what contributors provide and what the counterparty provides—including threshold state, verification, release conditions, deadline, and negotiability—without opening the offer.' : state.domain === 'pools' ? 'Standalone moral-public-good campaigns with no reciprocal counterparty obligation.' : 'Exact terms, evidence, availability, and trust route in one scan-efficient list.')}
    <div class="transaction-list">${rows}</div>
    ${renderCompareDock(state)}
  </section>`;
}

function renderLoadingState(state) {
  return `<section class="view-stage"><div class="state-panel"><div class="state-panel-inner"><h2>Loading current ${state.domain}…</h2><p>Checking terms, evidence, availability, and recent changes.</p><div class="loading-line"></div></div></div></section>`;
}

function renderErrorState(state) {
  return `<section class="view-stage"><div class="state-panel"><div class="state-panel-inner"><h2>Discover could not refresh.</h2><p>The last verified results remain available, but current availability and funding state could not be confirmed.</p><div class="state-suggestions"><button data-action="retry">Retry connection</button><button data-action="use-stale">Use last verified snapshot</button></div></div></div></section>`;
}

function renderEmptyState(state) {
  const cause = state.constraints.causes.length === 1 ? causeName(state.constraints.causes[0]) : '';
  const verified = state.constraints.verifiedOnly ? 'verified ' : '';
  const max = state.constraints.maximumCommitment < 250 ? ` under $${state.constraints.maximumCommitment}` : '';
  const noun = state.domain === 'people'
    ? 'people'
    : state.domain === 'pools'
      ? 'standalone pools'
      : state.constraints.offerKind === 'co-fund'
        ? 'Co-Funds'
        : state.constraints.offerKind === 'individual'
          ? 'individual offers'
          : 'offers';
  let nearCount = 0;
  let unverifiedCount = 0;
  if (state.domain === 'offers') {
    const raised = { ...state.constraints, maximumCommitment: Math.max(35, state.constraints.maximumCommitment + 15) };
    nearCount = offers.filter((item) => item.status !== 'expired' && offerMatch(item, raised).include).length;
    const unverified = { ...state.constraints, verifiedOnly: false };
    unverifiedCount = offers.filter((item) => item.status !== 'expired' && offerMatch(item, unverified).include).length;
  }
  return `<section class="view-stage"><div class="state-panel"><div class="state-panel-inner"><h2>No ${verified}${cause ? `${escapeHtml(cause)} ` : ''}${noun}${max}</h2><p>The current constraints do not produce an actionable result. Nothing has been hidden without explanation.</p><div class="state-suggestions">
    ${state.constraints.maximumCommitment < 250 ? `<button data-action="relax-max" data-value="${Math.min(250, state.constraints.maximumCommitment + 15)}">${nearCount} match if the limit is raised to $${Math.min(250, state.constraints.maximumCommitment + 15)}</button>` : ''}
    ${state.constraints.verifiedOnly ? `<button data-action="relax-verified">${unverifiedCount} match if verification-pending results are included</button>` : ''}
    <button data-action="reset">Clear all constraints</button>
  </div></div></div></section>`;
}

function renderCompareDock(state) {
  const count = state.compareIds.length;
  if (count < 1 || state.domain === 'people') return '';
  return `<div class="compare-dock" role="status"><div><strong>${count} selected</strong><span> · Exact terms remain unchanged</span></div><div><button data-action="clear-compare">Clear</button><button class="primary" data-action="open-compare" ${count < 2 ? 'disabled' : ''}>Compare ${count} ${count === 1 ? 'item' : 'items'} →</button></div></div>`;
}

function renderCurrentView(state) {
  const view = currentView(state);
  if (view === 'constellation') return renderConstellation(state);
  if (view === 'value') return renderValueField(state);
  if (view === 'threshold') return renderThreshold(state);
  if (view === 'trust') return renderTrustNetwork(state);
  return renderList(state);
}

function backLabel(state) {
  if (state.selectionOrigin === 'list') return 'Back to results';
  if (state.selectionOrigin === 'cause' && state.selectedCause) return `Back to ${causeName(state.selectedCause)}`;
  if (state.selectionOrigin === 'threshold') return 'Back to Threshold';
  if (state.selectionOrigin === 'trust') return 'Close person details';
  if (state.selectionOrigin === 'value') return 'Back to Value field';
  if (state.selectionOrigin === 'constellation') return 'Back to constellation';
  return 'Close details';
}

function recommendationWhy(result, state) {
  if (!result) return [];
  const item = result.item;
  const reasons = [
    result.match.reasons[0] ? `Strong match on ${result.match.reasons[0]}` : `Strong cause alignment with ${causeName(item.causeId)}`,
    item.moneyCost <= state.constraints.maximumCommitment ? `Within your current $${state.constraints.maximumCommitment} commitment limit` : 'Requires a larger commitment than your current limit',
    item.trustRoute,
    `${item.evidenceLevel} verification is available`,
    `${daysUntil(item.deadline)} days remain, compatible with the current deadline filter`
  ];
  return reasons;
}

function renderCauseInspector(state, cause) {
  const constraints = { ...state.constraints, causes: [cause.id] };
  const results = getOfferResults(state, constraints);
  const recommended = results[0];
  const verifiedCount = results.filter(({ item }) => item.verified).length;
  const mechanisms = new Set(results.map(({ item }) => item.mechanism)).size;
  const recommendationAction = recommended && isCoFund(recommended.item) ? 'Join Co-Fund' : 'Full terms';
  return `
    <div class="inspector-kicker">Cause area</div><h2>${escapeHtml(cause.name)}</h2><p class="inspector-subtitle">${results.length} match your current filters · ${cause.totalOffers} total marketplace offers · ${verifiedCount} verified · ${mechanisms} mechanisms</p>
    ${recommended ? `<section class="inspector-section"><h3>Recommended route · ranked by ${escapeHtml(sortOptions.offers.find(([id]) => id === validSortForDomain(state, 'offers'))?.[1] || 'Best fit')}</h3>
      <div class="recommendation-card"><div class="route-title">${escapeHtml(recommended.item.title)}</div><div class="inspector-exchange compact ${isCoFund(recommended.item) ? 'cofund-inspector-exchange' : ''}">${renderExchangeSide(recommended.item, 'offer')}<div class="exchange-arrow" aria-hidden="true">${isCoFund(recommended.item) ? '↕' : '↔'}</div>${renderExchangeSide(recommended.item, 'return')}</div>${renderCoFundProgress(recommended.item, true)}<button class="primary-btn" style="width:100%;margin-top:12px" data-action="select-item" data-type="offer" data-id="${recommended.item.id}" data-origin="cause" ${isCoFund(recommended.item) ? 'data-response-intent="join-cofund"' : ''}>${recommendationAction} →</button></div>
    </section>
    <section class="inspector-section"><h3>Why this route</h3><ul class="why-list">${recommendationWhy(recommended, state).map((reason) => `<li>${escapeHtml(reason)}</li>`).join('')}</ul></section>` : ''}
    <section class="inspector-section"><h3>Complete cause inventory</h3><div class="cause-inventory">${results.length ? results.map(({ item, match }) => {
      const offerLabel = isCoFund(item) ? 'Contributor group provides' : 'You offer';
      const returnLabel = isCoFund(item) ? 'Counterparty provides' : 'You get';
      return `<div class="inventory-item"><button data-action="select-item" data-type="offer" data-id="${item.id}" data-origin="cause" ${isCoFund(item) ? 'data-response-intent="join-cofund"' : ''}><strong>${escapeHtml(item.title)}</strong><small><b>${offerLabel}:</b> ${escapeHtml(firstExchangeTerm(item, 'offer'))}<br><b>${returnLabel}:</b> ${escapeHtml(firstExchangeTerm(item, 'return'))}<br>${formatDate(item.deadline)} · ${statusLabel(item)} · ${escapeHtml(matchReasonText(match))}</small></button><button class="mini-action" data-action="select-item" data-type="offer" data-id="${item.id}" data-origin="cause" ${isCoFund(item) ? 'data-response-intent="join-cofund"' : ''}>${isCoFund(item) ? 'Join' : 'Open'} →</button></div>`;
    }).join('') : '<p class="inspector-subtitle">No current offers match the active filters.</p>'}</div></section>
    <div class="inspector-actions"><button class="primary-btn wide" data-action="view-cause-list" data-cause="${cause.id}">View all ${results.length} in List →</button></div>`;
}

function renderIntegrity(item) {
  return `<section class="inspector-section"><h3>Moral-trade integrity review</h3><dl class="integrity-list">
    <div class="integrity-row"><dt>Additionality</dt><dd>${escapeHtml(item.additionality)}</dd></div>
    <div class="integrity-row"><dt>Baseline being changed</dt><dd>${escapeHtml(item.baseline)}</dd></div>
    <div class="integrity-row"><dt>Affected third parties</dt><dd>${escapeHtml(item.thirdParties)}</dd></div>
    <div class="integrity-row"><dt>Verification confidence</dt><dd>${escapeHtml(item.evidenceLevel)} · ${Math.round(item.evidenceConfidence * 100)}% evidence-confidence input, not an acceptance probability.</dd></div>
    <div class="integrity-row"><dt>Adverse-incentive screening</dt><dd>${escapeHtml(item.adverseIncentives)}</dd></div>
    <div class="integrity-row"><dt>Dispute and refund conditions</dt><dd>${escapeHtml(item.disputeTerms)}</dd></div>
  </dl></section>
  <section class="inspector-section"><h3>Recommendation basis</h3><div class="fact-estimate"><div><b>Facts</b><span>${escapeHtml(item.recommendationFacts.join(' · '))}</span></div><div><b>Estimates</b><span>${escapeHtml(item.recommendationEstimates.join(' · '))}</span></div></div></section>`;
}

function renderCoFundInspector(state, item) {
  const metrics = coFundMetrics(item);
  const minimum = item.coFund.minimumContribution;
  const maximum = Math.max(minimum, Math.min(item.coFund.maximumContribution, metrics.gap));
  const contribution = clamp(state.pledgeAmounts[item.id] ?? minimum, minimum, maximum);
  const afterGap = Math.max(0, metrics.gap - contribution);
  const pivotalShare = metrics.gap > 0 ? contribution / metrics.gap : 1;
  const intentNote = state.responseIntent === 'join-cofund'
    ? '<div class="response-intent-note"><strong>Join Co-Fund selected.</strong> Your contribution remains conditional; this interface does not charge or create a payment authorization.</div>'
    : '';
  return `<div class="inspector-kicker">CO-FUND · ${causeName(item.causeId)} · ${metrics.statusLabel}</div><h2>${escapeHtml(item.title)}</h2><p class="inspector-subtitle">${escapeHtml(item.counterparty)} · administered by ${escapeHtml(item.requester)} · ${item.coFund.contributors} contributors</p>${intentNote}
    <div class="cofund-inspector-progress">${renderCoFundProgress(item, true)}</div>
    <section class="inspector-section"><h3>The reciprocal trade</h3><div class="inspector-exchange cofund-inspector-exchange">${renderExchangeSide(item, 'offer')}<div class="exchange-arrow" aria-hidden="true">↕</div>${renderExchangeSide(item, 'return')}</div></section>
    <section class="inspector-section"><h3>Test your contribution</h3><div class="pool-pledge-box"><div class="detail-grid"><div class="detail-stat"><b>${formatMoney(contribution)}</b><span>Your conditional contribution</span></div><div class="detail-stat"><b>${formatMoney(afterGap)}</b><span>Remaining after your contribution</span></div></div><input type="range" min="${minimum}" max="${maximum}" step="5" value="${contribution}" data-pledge-range data-pool-id="${item.id}" aria-label="Conditional contribution amount for ${escapeHtml(item.title)}" /><div class="pledge-result"><span>${Math.round(pivotalShare * 100)}% of the current gap</span><span>${formatMoney(minimum)} minimum · ${formatMoney(item.coFund.maximumContribution)} maximum</span></div></div></section>
    <section class="inspector-section"><h3>Threshold and release conditions</h3><dl class="integrity-list"><div class="integrity-row"><dt>What activates</dt><dd>${escapeHtml(item.coFund.activation)}</dd></div><div class="integrity-row"><dt>Current funding</dt><dd>${formatMoney(item.coFund.funded)} of ${formatMoney(item.coFund.threshold)} · ${item.coFund.contributors} contributors · ${formatMoney(metrics.gap)} remains</dd></div><div class="integrity-row"><dt>If the threshold is missed</dt><dd>${escapeHtml(item.coFund.failure)}</dd></div><div class="integrity-row"><dt>Authorization expiry</dt><dd>${formatDate(item.coFund.authorizationExpires)}. Renewed consent is required after expiry.</dd></div><div class="integrity-row"><dt>Verification</dt><dd>${escapeHtml(item.proof)}</dd></div></dl></section>
    ${renderIntegrity(item)}
    <div class="inspector-actions"><button class="primary-btn wide" data-action="join-cofund" data-id="${item.id}">Join Co-Fund with ${formatMoney(contribution)} →</button><button class="outline-btn" data-action="toggle-compare" data-id="${item.id}">${state.compareIds.includes(item.id) ? 'Remove compare' : 'Add compare'}</button><button class="outline-btn" data-action="bookmark" data-id="${item.id}">${state.bookmarked.includes(item.id) ? 'Saved ◆' : 'Save ◇'}</button></div>`;
}

function renderOfferInspector(state, item) {
  if (isCoFund(item)) return renderCoFundInspector(state, item);
  const metrics = deriveOfferMetrics(item);
  const intentNote = state.responseIntent === 'exact'
    ? '<div class="response-intent-note"><strong>Exact terms selected.</strong> The creator must approve before an agreement forms.</div>'
    : state.responseIntent === 'counteroffer'
      ? '<div class="response-intent-note"><strong>Counteroffer selected.</strong> You may propose changes to either side; the published exchange remains unchanged until both parties agree.</div>'
      : '';
  return `<div class="inspector-kicker">${causeName(item.causeId)} · ${statusLabel(item)}</div><h2>${escapeHtml(item.title)}</h2><p class="inspector-subtitle">with ${escapeHtml(item.requester)} · ${escapeHtml(item.role)}</p>${intentNote}
    <section class="inspector-section"><h3>The exchange</h3><div class="inspector-exchange">${renderExchangeSide(item, 'offer')}<div class="exchange-arrow" aria-hidden="true">↔</div>${renderExchangeSide(item, 'return')}</div></section>
    <section class="inspector-section"><h3>Derived comparison signals</h3><div class="detail-grid"><div class="detail-stat"><b>${metrics.burdenLabel}</b><span>Money + time + behavior + verification</span></div><div class="detail-stat"><b>${metrics.valueLabel}</b><span>Impact × evidence × value alignment</span></div></div><button class="quiet-btn" data-action="open-method" data-method="value">How calculated →</button></section>
    <section class="inspector-section"><h3>Proof, trust, and deadline</h3><dl class="integrity-list"><div class="integrity-row"><dt>Proof</dt><dd>${escapeHtml(item.proof)}</dd></div><div class="integrity-row"><dt>Trust route</dt><dd>${escapeHtml(item.trustRoute)} · ${escapeHtml(item.reliability)}</dd></div><div class="integrity-row"><dt>Deadline</dt><dd>${formatDate(item.deadline)} · ${daysUntil(item.deadline)} days remaining</dd></div></dl></section>
    ${renderIntegrity(item)}
    <div class="inspector-actions"><button class="primary-btn" data-action="toast" data-message="Exact-match request opened for ${escapeHtml(item.title)}">${exactMatchLabel(item)} →</button><button class="outline-btn" data-action="toast" data-message="Counteroffer composer opened for ${escapeHtml(item.title)}" ${!item.exchange.counteroffersAllowed ? 'disabled' : ''}>Counteroffer</button><button class="outline-btn wide" data-action="bookmark" data-id="${item.id}">${state.bookmarked.includes(item.id) ? 'Saved ◆' : 'Save opportunity ◇'}</button></div>`;
}

function renderPoolInspector(state, item) {
  const metrics = derivePoolMetrics(item);
  const pledge = state.pledgeAmounts[item.id] ?? Math.min(10, metrics.gap);
  const afterGap = Math.max(0, metrics.gap - pledge);
  const gapShare = metrics.gap > 0 ? pledge / metrics.gap : 1;
  return `<div class="inspector-kicker">${causeName(item.causeId)} · ${metrics.statusLabel}</div><h2>${escapeHtml(item.title)}</h2><p class="inspector-subtitle">${formatMoney(item.funded)} of ${formatMoney(item.threshold)} conditionally committed · ${item.contributors} contributors</p>
    <section class="inspector-section"><h3>Preview your conditional pledge</h3><div class="pool-pledge-box"><div class="detail-grid"><div class="detail-stat"><b>${formatMoney(pledge)}</b><span>Your proposed conditional pledge</span></div><div class="detail-stat"><b>${formatMoney(afterGap)}</b><span>Remaining after your pledge</span></div></div><input type="range" min="0" max="${Math.max(10, Math.min(250, metrics.gap))}" step="5" value="${pledge}" data-pledge-range data-pool-id="${item.id}" aria-label="Conditional pledge amount for ${escapeHtml(item.title)}" /><div class="pledge-result"><span>${formatGapShare(gapShare)} of current gap</span><span>${formatMoney(afterGap)} remains</span></div><p class="inspector-subtitle">Moving the slider does not save a pledge or authorize payment.</p></div></section>
    <section class="inspector-section"><h3>What your pledge changes</h3><dl class="integrity-list"><div class="integrity-row"><dt>Activation consequence</dt><dd>${escapeHtml(item.changes)}</dd></div><div class="integrity-row"><dt>Share of the current gap</dt><dd>Your pledge would close ${formatGapShare(gapShare)} of the current ${formatMoney(metrics.gap)} gap, leaving ${formatMoney(afterGap)}. This is arithmetic, not a forecast of other contributors.</dd></div><div class="integrity-row"><dt>If the threshold is missed</dt><dd>${escapeHtml(item.failure)}</dd></div><div class="integrity-row"><dt>Authorization expires</dt><dd>${formatDate(item.authorizationExpires)}. No charge occurs after expiry without renewed consent.</dd></div><div class="integrity-row"><dt>Verification</dt><dd>${escapeHtml(item.proof)}</dd></div></dl></section>
    <section class="inspector-section"><h3>Analytical position</h3><p class="inspector-subtitle">${Math.round(metrics.gapRatio * 100)}% of the threshold remains · ${metrics.urgencyDays} days to deadline · ${metrics.statusLabel}. Position is calculated from those terms.</p><button class="quiet-btn" data-action="open-method" data-method="threshold">How calculated →</button></section>
    <div class="inspector-actions"><button class="primary-btn wide" data-action="pledge" data-id="${item.id}">Continue with a conditional ${formatMoney(pledge)} pledge →</button><button class="outline-btn" data-action="toggle-compare" data-id="${item.id}">${state.compareIds.includes(item.id) ? 'Remove compare' : 'Add compare'}</button><button class="outline-btn" data-action="bookmark" data-id="${item.id}">${state.bookmarked.includes(item.id) ? 'Saved ◆' : 'Save ◇'}</button></div>`;
}

function renderPersonInspector(state, item) {
  return `<div class="inspector-kicker">Recommended person</div><h2>${escapeHtml(item.name)}</h2><p class="inspector-subtitle">${escapeHtml(item.role)} · ${escapeHtml(item.availability)}</p>
    <section class="inspector-section"><h3>Why you can trust this route</h3><ul class="why-list"><li>${escapeHtml(item.trust)}</li><li>${item.commitments} completed commitments</li><li>${item.reliability}% on time</li><li>${item.verified ? `Verified ${item.recentlyVerified} days ago` : 'Verification or terms changed'}</li><li>${escapeHtml(item.route)}</li></ul></section>
    <section class="inspector-section"><h3>Reciprocal trade available</h3><div class="recommendation-card"><div class="route-title">${escapeHtml(item.reciprocal)}</div><p class="inspector-subtitle">Exact terms are negotiated only after both parties consent.</p></div></section>
    <section class="inspector-section"><h3>Relevant causes</h3><p class="inspector-subtitle">${item.causeIds.map(causeName).join(' · ')}</p></section>
    <div class="inspector-actions"><button class="primary-btn" data-action="toast" data-message="Offer composer opened for ${escapeHtml(item.name)}">Offer trade →</button><button class="outline-btn" data-action="toast" data-message="Message composer opened for ${escapeHtml(item.name)}">Message</button><button class="outline-btn wide" data-action="bookmark" data-id="${item.id}">${state.bookmarked.includes(item.id) ? 'Saved ◆' : 'Save person ◇'}</button></div>`;
}

function renderInspectorContent(state) {
  if (state.selectedItem) {
    if (state.selectedItem.type === 'offer') {
      const item = offers.find((offer) => offer.id === state.selectedItem.id);
      return item ? renderOfferInspector(state, item) : `<h2>Opportunity unavailable</h2><p class="inspector-subtitle">This opportunity may have been removed or expired. Return to results to refresh the market.</p>`;
    }
    if (state.selectedItem.type === 'pool') {
      const item = pools.find((pool) => pool.id === state.selectedItem.id);
      return item ? renderPoolInspector(state, item) : `<h2>Pool unavailable</h2><p class="inspector-subtitle">The pool may already have activated or expired.</p>`;
    }
    if (state.selectedItem.type === 'person') {
      const item = people.find((person) => person.id === state.selectedItem.id);
      return item ? renderPersonInspector(state, item) : `<h2>Person unavailable</h2><p class="inspector-subtitle">The relationship route is no longer current.</p>`;
    }
  }
  if (state.selectedCause) {
    const cause = causeAreas.find((entry) => entry.id === state.selectedCause);
    return cause ? renderCauseInspector(state, cause) : '';
  }
  return `<div class="inspector-kicker">No selection</div><h2>Select a cause, trade, pool, or person.</h2><p class="inspector-subtitle">The inspector remains closed until you choose an object.</p>`;
}

function renderInspector(state, mobile = false) {
  return `<aside class="inspector ${mobile ? 'mobile-sheet' : ''}" ${mobile ? 'role="dialog" aria-modal="true" aria-label="Selection details"' : 'aria-label="Selection inspector"'}>
    <div class="inspector-inner"><button class="inspector-back sheet-close" data-action="close-inspector">← ${escapeHtml(backLabel(state))}</button>${renderInspectorContent(state)}</div>
  </aside>`;
}

function renderMethodModal(state) {
  const value = state.methodOpen === 'value';
  return `<div class="overlay-scrim" data-action="close-overlay"></div><section class="modal dialog-surface" role="dialog" aria-modal="true" aria-labelledby="method-title">
    <div class="modal-head"><div><h2 id="method-title">${value ? 'How the Value field is calculated' : 'How the Threshold radar is calculated'}</h2><p>Transparent comparison logic. These positions are decision aids, not acceptance or impact probabilities.</p></div><button class="modal-close" data-action="close-overlay" aria-label="Close methodology">×</button></div>
    ${value ? `<div class="method-formula">Estimated burden = money component (35%) + time (25%) + behavioral friction (20%) + verification burden (20%)<br>Supported expected value = impact estimate × evidence confidence × value alignment</div><div class="method-grid"><div><h3>What is factual</h3><p>Money, time, proof requirements, deadline, and verification source come from the listed terms. Each is shown in the opportunity inspector.</p></div><div><h3>What is estimated</h3><p>Impact, evidence confidence, value alignment, and behavioral friction are bounded comparison inputs. Labels such as “Lower burden” avoid implying false precision.</p></div><div><h3>Scale treatment</h3><p>All components are capped before combination so an unusually large money or time term does not erase every other consideration.</p></div><div><h3>What the chart does not claim</h3><p>It does not predict acceptance, guarantee impact, or establish moral permissibility. Integrity and third-party effects remain separate review fields.</p></div></div>` : `<div class="method-formula">Radius = 86px + (remaining gap ÷ threshold) × 205px<br>Angle = deadline urgency mapped clockwise across a 45-day horizon<br>Bubble size = bounded logarithmic scale of total threshold<br>Border state = near threshold, on track, at risk, or verification unavailable</div><div class="method-grid"><div><h3>Near threshold</h3><p>10% or less of the threshold remains. This is a mechanical funding state, not a forecast that activation will occur.</p></div><div><h3>At risk</h3><p>A large remaining share combined with a short deadline. Verification outages are shown separately with a dashed red border.</p></div><div><h3>Share of the current gap</h3><p>Your proposed pledge divided by the current gap. It shows how much of the known gap you close, not how likely other contributors are to act.</p></div><div><h3>Failure semantics</h3><p>Every pool inspector states what happens if the threshold is missed and when authorization expires.</p></div></div>`}
  </section>`;
}

function compareItems(state) {
  const items = state.domain === 'pools' ? pools : offers;
  return state.compareIds.map((id) => items.find((item) => item.id === id)).filter(Boolean);
}

function renderCompareModal(state) {
  const items = compareItems(state);
  const fields = state.domain === 'pools' ? [
    ['You contribute', (item) => formatMoney(state.pledgeAmounts[item.id] ?? 10)],
    ['What activates', (item) => item.changes],
    ['Current gap', (item) => formatMoney(derivePoolMetrics(item).gap)],
    ['Pivotal share', (item) => `${Math.round(((state.pledgeAmounts[item.id] ?? 10) / Math.max(1, derivePoolMetrics(item).gap)) * 100)}% of current gap`],
    ['Verification', (item) => item.proof],
    ['Deadline', (item) => formatDate(item.deadline)],
    ['If threshold is missed', (item) => item.failure],
    ['Authorization expires', (item) => formatDate(item.authorizationExpires)]
  ] : [
    ['Listing type', (item) => isCoFund(item) ? 'Co-Fund — collective fulfillment of one side of a reciprocal trade' : 'Individual offer'],
    ['You / contributor group provide', (item) => item.give],
    ['Counterparty provides', (item) => item.receive],
    ['Funding state', (item) => isCoFund(item) ? `${formatMoney(item.coFund.funded)} of ${formatMoney(item.coFund.threshold)} · ${item.coFund.contributors} contributors` : 'Not threshold-funded'],
    ['Minimum contribution', (item) => isCoFund(item) ? formatMoney(item.coFund.minimumContribution) : (item.moneyCost ? formatMoney(item.moneyCost) : 'No direct payment')],
    ['Time / behavior burden', (item) => isCoFund(item) ? `No contributor action time listed · ${deriveOfferMetrics(item).burdenLabel}` : `${item.timeMinutes} min · ${deriveOfferMetrics(item).burdenLabel}`],
    ['Verification burden', (item) => item.proof],
    ['Additionality', (item) => item.additionality],
    ['Counterparty / administrator', (item) => isCoFund(item) ? `${item.counterparty} · ${item.requester}` : `${item.requester} · ${item.reliability}`],
    ['Deadline', (item) => formatDate(item.deadline)],
    ['Failure / refund', (item) => isCoFund(item) ? item.coFund.failure : item.disputeTerms]
  ];
  return `<div class="overlay-scrim" data-action="close-overlay"></div><section class="modal compare-modal dialog-surface" role="dialog" aria-modal="true" aria-labelledby="compare-title"><div class="modal-head"><div><h2 id="compare-title">Compare exact terms</h2><p>Comparison does not alter either offer. Review integrity, burden, evidence, and failure conditions side by side.</p></div><button class="modal-close" data-action="close-overlay" aria-label="Close comparison">×</button></div><table class="compare-table"><thead><tr><th>Term</th>${items.map((item) => `<th>${escapeHtml(item.title)}</th>`).join('')}</tr></thead><tbody>${fields.map(([label, value]) => `<tr><td>${label}</td>${items.map((item) => `<td>${escapeHtml(value(item))}</td>`).join('')}</tr>`).join('')}</tbody></table></section>`;
}

function renderCompactDrawer(state) {
  if (!state.compactDrawer) return '';
  const title = state.compactDrawer[0].toUpperCase() + state.compactDrawer.slice(1);
  let body = '';
  if (state.compactDrawer === 'domains') body = renderDomainTabs(state);
  if (state.compactDrawer === 'views') body = renderViewTabs(state);
  if (state.compactDrawer === 'filters') body = renderFilters(state);
  if (state.compactDrawer === 'saved') body = renderSavedSearches(state);
  return `<div class="overlay-scrim" data-action="close-compact"></div><aside class="compact-drawer dialog-surface" role="dialog" aria-modal="true" aria-label="${title}"><div class="compact-drawer-head"><h2>${title}</h2><button class="icon-close" data-action="close-compact">×</button></div>${body}</aside>`;
}

function renderOverlay(state) {
  const mobileSheet = isMobileViewport() && state.inspectorOpen && (state.selectedCause || state.selectedItem);
  const modalOpen = Boolean(state.methodOpen || state.compareOpen || state.compactDrawer);
  let html = '';
  if (mobileSheet && !modalOpen) html += `<div class="overlay-scrim" data-action="close-inspector"></div>${renderInspector(state, true)}`;
  if (state.methodOpen) html += renderMethodModal(state);
  if (state.compareOpen) html += renderCompareModal(state);
  if (state.compactDrawer) html += renderCompactDrawer(state);
  overlayRoot.innerHTML = html;
  const dialogOpen = Boolean(html);
  app.inert = dialogOpen;
  if (dialogOpen && !lastDialogOpen) {
    requestAnimationFrame(() => {
      const target = overlayRoot.querySelector('.sheet-close, .modal-close, .dialog-surface button, .dialog-surface [tabindex="0"]');
      target?.focus();
    });
  }
  if (!dialogOpen && lastDialogOpen && focusReturnId) {
    requestAnimationFrame(() => document.getElementById(focusReturnId)?.focus());
  }
  lastDialogOpen = dialogOpen;
}

function renderMobileToolsDrawer(state) {
  // Compact drawer is also used on mobile; CSS positions it as a left drawer. This keeps filter state identical.
  return renderCompactDrawer(state);
}

function render(state, previous = state) {
  const oldScroll = document.querySelector('#view-scroll');
  if (oldScroll) previous.scrollPositions[viewKey(previous)] = oldScroll.scrollTop;
  const results = getResults(state);
  const desktopInspector = !isMobileViewport() && state.inspectorOpen && (state.selectedCause || state.selectedItem);
  const shellClass = desktopInspector ? 'discover-shell has-inspector' : 'discover-shell';
  app.innerHTML = `${renderHeader()}<main class="${shellClass}" id="workspace">
    ${renderLeftRail(state)}
    <section class="discover-main ${state.commandCollapsed ? 'command-collapsed' : ''}">
      ${renderMobileTabs(state)}
      ${renderCommandArea(state, results)}
      <div class="view-scroll" id="view-scroll">${renderCurrentView(state)}</div>
    </section>
    ${desktopInspector ? renderInspector(state) : ''}
    ${!desktopInspector && (state.selectedCause || state.selectedItem) ? `<button class="inspector-edge" data-action="show-inspector" aria-label="Open selection inspector">‹</button>` : ''}
  </main>`;
  renderOverlay(state);
  requestAnimationFrame(() => {
    const viewScroll = document.querySelector('#view-scroll');
    if (viewScroll) {
      viewScroll.scrollTop = state.scrollPositions[viewKey(state)] || 0;
      viewScroll.addEventListener('scroll', handleViewScroll, { passive: true });
    }
    setupLassoCanvas();
  });
}

function updateQueryFromState(draft) {
  draft.query = buildNaturalCommand(draft.domain, draft.constraints);
  draft.queryActive = hasActiveConstraints(draft);
  draft.routeNote = null;
}

function setDomain(domain) {
  store.update((draft) => {
    draft.domain = domain;
    if (domain !== 'offers') draft.constraints.offerKind = 'all';
    if (!domainViews[domain].some((view) => view.id === draft.viewByDomain[domain])) draft.viewByDomain[domain] = domainViews[domain][0].id;
    if (isMobileViewport() && !draft.queryActive && domain !== 'pools') draft.viewByDomain[domain] = 'list';
    if (!sortOptions[domain].some(([id]) => id === draft.constraints.sort)) draft.constraints.sort = 'best-fit';
    draft.selectedCause = null;
    draft.selectedItem = null;
    draft.responseIntent = null;
    draft.inspectorOpen = false;
    draft.compareIds = [];
    draft.compactDrawer = null;
    updateQueryFromState(draft);
    return draft;
  }, { history: 'push' });
}

function setOfferKind(offerKind) {
  if (!['all','individual','co-fund'].includes(offerKind)) return;
  store.update((draft) => {
    draft.domain = 'offers';
    draft.constraints.offerKind = offerKind;
    draft.viewByDomain.offers = 'list';
    draft.constraints.sort = validSortForDomain(draft, 'offers');
    draft.selectedCause = null;
    draft.selectedItem = null;
    draft.responseIntent = null;
    draft.inspectorOpen = false;
    draft.compareIds = [];
    draft.compactDrawer = null;
    updateQueryFromState(draft);
    draft.routeNote = offerKind === 'co-fund'
      ? { text: 'Opened Offers because Co-Funds are collective fulfillment of reciprocal moral trades.', alternative: 'value' }
      : offerKind === 'individual'
        ? { text: 'Opened Offers because individual offers have one direct contribution side.', alternative: 'value' }
        : null;
    return draft;
  }, { history: 'push' });
}

function setView(view) {
  const state = store.getState();
  if (!domainViews[state.domain].some((entry) => entry.id === view)) return;
  store.update((draft) => {
    draft.viewByDomain[draft.domain] = view;
    draft.routeNote = null;
    draft.compactDrawer = null;
    draft.commandCollapsed = false;
    return draft;
  }, { history: 'push' });
}

function runSearch(query) {
  const current = store.getState();
  const parsed = parseCommand(query, current.constraints);
  const alternative = parsed.view === 'list' ? 'value' : parsed.domain === 'people' ? 'list' : 'list';
  store.update((draft) => {
    draft.query = query;
    draft.queryActive = true;
    draft.domain = parsed.domain;
    draft.constraints = parsed.constraints;
    draft.viewByDomain[parsed.domain] = isMobileViewport() && parsed.domain !== 'pools' ? 'list' : parsed.view;
    draft.routeNote = { text: parsed.routeReason, alternative };
    draft.parserConfidence = parsed.parserConfidence;
    draft.selectedCause = null;
    draft.selectedItem = null;
    draft.responseIntent = null;
    draft.inspectorOpen = false;
    draft.compareIds = [];
    draft.commandCollapsed = false;
    draft.compactDrawer = null;
    return draft;
  }, { history: 'push' });
  announce(parsed.routeReason);
}

function selectItem(type, id, origin, trigger) {
  focusReturnId = trigger?.id || `trigger-${id}`;
  if (trigger && !trigger.id) trigger.id = focusReturnId;
  store.update((draft) => {
    draft.selectedItem = { type, id };
    draft.inspectorOpen = true;
    draft.selectionOrigin = origin || currentView(draft);
    draft.responseIntent = type === 'offer' ? (trigger?.dataset.responseIntent || null) : null;
    draft.graphFocusId = id;
    return draft;
  }, { history: 'push' });
  const title = type === 'offer' ? offers.find((item) => item.id === id)?.title : type === 'pool' ? pools.find((item) => item.id === id)?.title : people.find((item) => item.id === id)?.name;
  announce(`${title || 'Selection'} details opened`);
}

function selectCause(id, trigger) {
  focusReturnId = trigger?.id || `trigger-cause-${id}`;
  if (trigger && !trigger.id) trigger.id = focusReturnId;
  store.update((draft) => {
    draft.selectedCause = id;
    draft.selectedItem = null;
    draft.responseIntent = null;
    draft.inspectorOpen = true;
    draft.selectionOrigin = 'constellation';
    draft.graphFocusId = id;
    return draft;
  }, { history: 'push' });
  announce(`${causeName(id)} selected. Cause inspector opened.`);
}

function closeInspector() {
  if (history.state?.discover && Number(history.state?.depth || 0) > 0 && (store.getState().selectedItem || store.getState().selectedCause)) {
    history.back();
    return;
  }
  store.update((draft) => {
    if (draft.selectedItem && draft.selectedCause) draft.selectedItem = null;
    else { draft.selectedItem = null; draft.selectedCause = null; draft.responseIntent = null; draft.inspectorOpen = false; }
    return draft;
  }, { history: 'replace' });
}

function toggleCompare(id) {
  store.update((draft) => {
    draft.compareIds = draft.compareIds.includes(id) ? draft.compareIds.filter((item) => item !== id) : [...draft.compareIds, id];
    return draft;
  }, { history: 'replace' });
}

function showToast(message) {
  document.querySelector('.toast')?.remove();
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.setAttribute('role', 'status');
  toast.textContent = message;
  document.body.append(toast);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.remove(), 3000);
  announce(message);
}

function handleClick(event) {
  const actionTarget = event.target.closest('[data-action]');
  if (!actionTarget) return;
  const action = actionTarget.dataset.action;
  if (action === 'set-domain') setDomain(actionTarget.dataset.domain);
  else if (action === 'set-offer-kind') setOfferKind(actionTarget.dataset.offerKind);
  else if (action === 'set-view') setView(actionTarget.dataset.view);
  else if (action === 'remove-token') {
    store.update((draft) => {
      if (actionTarget.dataset.token === 'domain') draft.domain = 'offers';
      else draft.constraints = removeConstraintToken(draft.constraints, actionTarget.dataset.token);
      updateQueryFromState(draft);
      return draft;
    }, { history: 'push' });
  }
  else if (action === 'toggle-saved') store.update((draft) => { draft.savedOpen = !draft.savedOpen; return draft; }, { history: 'replace' });
  else if (action === 'run-saved') runSearch(actionTarget.dataset.query);
  else if (action === 'reset') store.reset();
  else if (action === 'set-cause' || action === 'select-cause') selectCause(actionTarget.dataset.id || actionTarget.dataset.nodeId, actionTarget);
  else if (action === 'select-item') selectItem(actionTarget.dataset.type, actionTarget.dataset.id, actionTarget.dataset.origin, actionTarget);
  else if (action === 'close-inspector') closeInspector();
  else if (action === 'show-inspector') store.update((draft) => { draft.inspectorOpen = true; return draft; }, { history: 'replace' });
  else if (action === 'hide-inspector') store.update((draft) => { draft.inspectorOpen = false; return draft; }, { history: 'replace' });
  else if (action === 'view-cause-list') {
    store.update((draft) => {
      draft.constraints.causes = [actionTarget.dataset.cause];
      draft.viewByDomain.offers = 'list';
      draft.domain = 'offers';
      draft.inspectorOpen = false;
      draft.queryActive = true;
      draft.query = buildNaturalCommand('offers', draft.constraints);
      draft.routeNote = { text: `Opened List because you requested every current trade in ${causeName(actionTarget.dataset.cause)}.`, alternative: 'constellation' };
      return draft;
    }, { history: 'push' });
  }
  else if (action === 'toggle-compare') toggleCompare(actionTarget.dataset.id);
  else if (action === 'clear-compare') store.update((draft) => { draft.compareIds = []; return draft; }, { history: 'replace' });
  else if (action === 'open-compare' && store.getState().compareIds.length >= 2) store.update((draft) => { draft.compareOpen = true; return draft; }, { history: 'replace' });
  else if (action === 'open-method') store.update((draft) => { draft.methodOpen = actionTarget.dataset.method; return draft; }, { history: 'replace' });
  else if (action === 'close-overlay') store.update((draft) => { draft.methodOpen = null; draft.compareOpen = false; return draft; }, { history: 'replace' });
  else if (action === 'bookmark') {
    store.update((draft) => { draft.bookmarked = draft.bookmarked.includes(actionTarget.dataset.id) ? draft.bookmarked.filter((id) => id !== actionTarget.dataset.id) : [...draft.bookmarked, actionTarget.dataset.id]; return draft; }, { history: 'replace' });
  }
  else if (action === 'pledge') showToast('Conditional pledge reserved. No charge occurs unless the threshold and verification conditions are met.');
  else if (action === 'join-cofund') showToast('Co-Fund contribution staged for review. No charge or payment authorization was created.');
  else if (action === 'toast') showToast(actionTarget.dataset.message || 'Action opened.');
  else if (action === 'accessible-list') setView('list');
  else if (action === 'toggle-lasso') store.update((draft) => { draft.lassoMode = !draft.lassoMode; return draft; }, { history: 'replace' });
  else if (action === 'edit-search') {
    store.getState().commandCollapsed = false;
    document.querySelector('.discover-main')?.classList.remove('command-collapsed');
    requestAnimationFrame(() => document.querySelector('#command-input')?.focus());
  }
  else if (action === 'open-compact') store.update((draft) => { draft.compactDrawer = actionTarget.dataset.panel; return draft; }, { history: 'replace' });
  else if (action === 'open-mobile-tools') store.update((draft) => { draft.compactDrawer = actionTarget.dataset.panel; return draft; }, { history: 'replace' });
  else if (action === 'close-compact') store.update((draft) => { draft.compactDrawer = null; return draft; }, { history: 'replace' });
  else if (action === 'relax-max') store.update((draft) => { draft.constraints.maximumCommitment = Number(actionTarget.dataset.value); updateQueryFromState(draft); return draft; }, { history: 'push' });
  else if (action === 'relax-verified') store.update((draft) => { draft.constraints.verifiedOnly = false; updateQueryFromState(draft); return draft; }, { history: 'push' });
  else if (action === 'retry') {
    store.update((draft) => { draft.systemStatus = 'loading'; return draft; }, { history: 'replace' });
    window.setTimeout(() => store.update((draft) => { draft.systemStatus = 'ready'; return draft; }, { history: 'replace' }), 850);
  }
  else if (action === 'use-stale') store.update((draft) => { draft.systemStatus = 'ready'; return draft; }, { history: 'replace' });
}

function handleChange(event) {
  const target = event.target;
  const toggleArrayFilter = (field) => {
    store.update((draft) => {
      draft.constraints[field] = target.checked
        ? [...new Set([...draft.constraints[field], target.value])]
        : draft.constraints[field].filter((id) => id !== target.value);
      updateQueryFromState(draft);
      return draft;
    }, { history: 'push' });
  };
  if (target.dataset.filter === 'cause') {
    toggleArrayFilter('causes');
  } else if (target.dataset.filter === 'offer-kind') {
    setOfferKind(target.value);
  } else if (target.dataset.filter === 'offer-type') {
    toggleArrayFilter('offerTypes');
  } else if (target.dataset.filter === 'return-type') {
    toggleArrayFilter('returnTypes');
  } else if (target.dataset.filter === 'flexibility') {
    toggleArrayFilter('flexibilities');
  } else if (target.dataset.filter === 'deadline') {
    store.update((draft) => { draft.constraints.deadlineBefore = target.value; updateQueryFromState(draft); return draft; }, { history: 'push' });
  } else if (target.dataset.filter === 'verified') {
    store.update((draft) => { draft.constraints.verifiedOnly = target.checked; updateQueryFromState(draft); return draft; }, { history: 'push' });
  } else if (target.dataset.filter === 'availability') {
    store.update((draft) => { draft.constraints.availability = target.checked ? 'available' : ''; updateQueryFromState(draft); return draft; }, { history: 'push' });
  } else if (target.dataset.filter === 'mechanism') {
    toggleArrayFilter('mechanisms');
  } else if (target.dataset.filter === 'sort') {
    store.update((draft) => { draft.constraints.sort = target.value; return draft; }, { history: 'replace' });
  }
}

function handleInput(event) {
  const target = event.target;
  const scheduleTextFilter = (field) => {
    window.clearTimeout(target._syncTimer);
    target._syncTimer = window.setTimeout(() => {
      const value = target.value.trim();
      store.update((draft) => { draft.constraints[field] = value; updateQueryFromState(draft); return draft; }, { history: 'replace' });
    }, 240);
  };
