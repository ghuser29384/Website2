<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050505"><meta name="description" content="Explore Moral Trade offers, threshold pools, and trusted counterparties through transparent, inspectable discovery views."><link rel="canonical" href="https://moraltrade.org/discover"><title>Moral Trade — Discover</title><style>:root {
  --ink: #0b0b0b;
  --muted: #6f706f;
  --quiet: #979895;
  --paper: #f7f5f0;
  --paper-strong: #fffefa;
  --line: #c9c7c0;
  --line-dark: #8d8c87;
  --blue: #123ff1;
  --blue-soft: #e5ebff;
  --lime: #b7d72d;
  --lime-soft: #f0f6ce;
  --orange: #f07a19;
  --orange-soft: #fff0e3;
  --green: #2f7a2e;
  --green-soft: #e8f1e4;
  --red: #b7372e;
  --red-soft: #fae6e2;
  --violet: #7153bd;
  --shadow: 0 18px 42px rgba(20, 20, 18, .13);
  --ui: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
  --serif: Georgia, "Times New Roman", serif;
  --sans: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --header-h: 64px;
  --rail-w: 206px;
  --inspector-w: 328px;
}

* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; color: var(--ink); background: var(--paper); }
body {
  font-family: var(--sans);
  font-size: 14px;
  overflow: hidden;
  background-image:
    linear-gradient(rgba(25,25,22,.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(25,25,22,.025) 1px, transparent 1px);
  background-size: 24px 24px;
}
button, input, select { font: inherit; }
button { color: inherit; }
a { color: var(--blue); }
button, [role="button"], input, select, summary { outline: none; }
button:focus-visible, [role="button"]:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible {
  box-shadow: 0 0 0 3px rgba(18,63,241,.24);
  border-color: var(--blue) !important;
}
.sr-only {
  position: absolute !important; width: 1px !important; height: 1px !important; padding: 0 !important;
  margin: -1px !important; overflow: hidden !important; clip: rect(0, 0, 0, 0) !important;
  white-space: nowrap !important; border: 0 !important;
}

/* Shell */
.app-header {
  height: var(--header-h);
  background: #050505;
  color: #f7f7f4;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  padding: 0 24px;
  position: relative;
  z-index: 40;
}
.brand {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  font-family: var(--ui);
  font-size: 16px;
  letter-spacing: .01em;
}
.brand-mark {
  width: 28px; height: 28px; position: relative; display: inline-block;
}
.brand-mark::before, .brand-mark::after {
  content: ""; position: absolute; background: #f4f4ef;
}
.brand-mark::before { width: 8px; height: 8px; left: 2px; bottom: 2px; }
.brand-mark::after { width: 20px; height: 5px; left: 6px; top: 13px; transform: rotate(-45deg); transform-origin: center; }
.brand-mark i { width: 7px; height: 7px; position: absolute; right: 2px; top: 1px; background: var(--blue); }
.top-nav { display: flex; height: 100%; align-items: center; gap: 8px; }
.top-nav button, .top-nav a {
  height: 100%; padding: 0 22px; border: 0; background: transparent; color: #8e8f92;
  font-size: 15px; cursor: pointer; position: relative; display: inline-flex; align-items: center; text-decoration: none;
}
.top-nav button:hover, .top-nav a:hover { color: white; }
.top-nav button.active, .top-nav a.active { color: white; }
.top-nav button.active::after, .top-nav a.active::after { content: ""; position: absolute; left: 20px; right: 20px; bottom: 0; height: 2px; background: white; }
.account { justify-self: end; display: flex; align-items: center; gap: 14px; color: #aaa; }
.account a { color: inherit; text-decoration: none; }
.avatar {
  width: 38px; height: 38px; border: 1px solid #555; border-radius: 50%; display: grid; place-items: center; color: white; font-family: var(--ui);
}

.discover-shell {
  height: calc(100vh - var(--header-h));
  display: grid;
  grid-template-columns: var(--rail-w) minmax(0, 1fr);
  min-width: 0;
  overflow: hidden;
}
.discover-shell.has-inspector { grid-template-columns: var(--rail-w) minmax(0, 1fr) var(--inspector-w); }

/* Left rail */
.left-rail {
  border-right: 1px solid var(--line);
  background: rgba(250,249,245,.96);
  overflow-y: auto;
  padding: 22px 18px 18px;
  scrollbar-width: thin;
  position: relative;
  z-index: 10;
}
.rail-section { padding: 0 0 18px; margin: 0 0 18px; border-bottom: 1px solid var(--line); }
.rail-section:last-of-type { border-bottom: 0; }
.rail-label {
  display: block; margin-bottom: 10px; font: 700 10px/1.2 var(--ui); letter-spacing: .11em; text-transform: uppercase; color: #3b3b39;
}
.rail-tabs { display: grid; gap: 3px; }
.rail-tab {
  border: 0; background: transparent; min-height: 38px; padding: 8px 9px; text-align: left; display: flex; align-items: center; gap: 9px; cursor: pointer; position: relative;
}
.rail-tab::before { content: ""; width: 8px; height: 8px; border: 1px solid #8b8c87; border-radius: 50%; flex: 0 0 auto; }
.rail-tab[aria-selected="true"] { color: var(--blue); font-weight: 650; }
.rail-tab[aria-selected="true"]::before { background: var(--blue); border-color: var(--blue); }
.rail-tab[aria-selected="true"]::after { content: ""; position: absolute; left: -18px; top: 5px; bottom: 5px; width: 2px; background: var(--blue); }
.rail-view-tab::before { border-radius: 0; }
.rail-view-tab[data-view="list"]::before { box-shadow: 0 3px 0 #8b8c87, 0 -3px 0 #8b8c87; height: 1px; border: 0; background: #8b8c87; }
.rail-view-tab[aria-selected="true"]::before { box-shadow: 0 3px 0 var(--blue), 0 -3px 0 var(--blue); background: var(--blue); }

.rail-details { border-bottom: 1px solid var(--line); padding-bottom: 15px; margin-bottom: 15px; }
.rail-details summary { list-style: none; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font: 700 10px/1.2 var(--ui); letter-spacing: .09em; text-transform: uppercase; }
.rail-details summary::-webkit-details-marker { display: none; }
.rail-details summary::after { content: "+"; font: 18px/1 var(--sans); color: var(--blue); }
.rail-details[open] summary::after { content: "−"; }
.filter-body { padding-top: 14px; display: grid; gap: 14px; }
.filter-group label.group-title { display: block; margin-bottom: 7px; font: 650 10px var(--ui); text-transform: uppercase; color: var(--muted); }
.check-row { display: flex; gap: 8px; align-items: flex-start; min-height: 27px; font-size: 12px; line-height: 1.35; }
.check-row input { accent-color: var(--blue); margin-top: 2px; }
.range-row { display: grid; grid-template-columns: 1fr auto; gap: 6px 8px; align-items: center; }
.range-row output { font: 600 12px var(--ui); }
.range-row input { grid-column: 1 / -1; width: 100%; accent-color: var(--blue); }
.filter-text-input {
  width: 100%; min-height: 34px; border: 1px solid var(--line-dark); background: #fffefa; color: var(--ink); padding: 7px 9px; font: 11px/1.35 var(--ui);
}
.filter-text-input::placeholder { color: #858680; }
.filter-hint { display: block; margin-top: 5px; color: var(--muted); font: 9.5px/1.4 var(--ui); }
.filter-subgroup { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
.saved-summary {
  display: flex; align-items: baseline; justify-content: space-between; width: 100%; border: 0; background: transparent; padding: 0; cursor: pointer;
  font: 700 10px/1.2 var(--ui); letter-spacing: .09em; text-transform: uppercase;
}
.saved-summary .new-count { color: var(--blue); font-size: 10px; letter-spacing: 0; }
.saved-list { display: grid; gap: 2px; margin-top: 12px; }
.saved-item {
  border: 0; background: transparent; padding: 9px 3px; text-align: left; cursor: pointer; display: grid; grid-template-columns: 1fr auto; gap: 5px; border-top: 1px solid #dfddd7;
}
.saved-item:first-child { border-top: 0; }
.saved-item span:first-child { font-size: 11px; line-height: 1.35; }
.saved-item b { color: var(--blue); font: 700 10px var(--ui); }
.saved-item b.zero { color: var(--quiet); }
.rail-reset { width: 100%; border: 0; background: transparent; color: var(--muted); text-align: left; padding: 8px 0; cursor: pointer; font: 11px var(--ui); }
.rail-reset:hover { color: var(--blue); }

.compact-rail { display: none; }
.compact-drawer {
  position: fixed; top: var(--header-h); left: 54px; bottom: 0; width: 254px; z-index: 81; background: var(--paper-strong); border-right: 1px solid var(--line); box-shadow: var(--shadow); padding: 22px; overflow-y: auto;
}
.compact-drawer-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
.compact-drawer-head h2 { margin: 0; font: 28px var(--serif); }
.icon-close { width: 34px; height: 34px; border: 1px solid var(--line); background: transparent; cursor: pointer; }

/* Main workspace */
.discover-main { min-width: 0; overflow: hidden; display: flex; flex-direction: column; background: rgba(247,245,240,.78); }
.mobile-tabs { display: none; }
.command-area {
  padding: 22px 28px 0;
  background: linear-gradient(to bottom, rgba(250,249,245,.98), rgba(250,249,245,.90));
  position: relative; z-index: 6;
}
.discover-heading-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 22px; margin-bottom: 15px; }
.discover-heading h1 { margin: 0; font: 400 clamp(37px, 4vw, 56px)/.98 var(--serif); letter-spacing: -.028em; }
.discover-heading p { margin: 7px 0 0; max-width: 620px; color: var(--muted); line-height: 1.48; font-size: 13px; }
.today-block { font: 11px/1.5 var(--ui); text-align: right; color: var(--muted); min-width: 150px; }
.today-block b { display: block; color: var(--ink); font: 400 15px var(--serif); }
.command-form {
  display: grid; grid-template-columns: 1fr auto; align-items: stretch; border-top: 1px solid var(--ink); border-bottom: 1px solid var(--ink); background: rgba(255,255,252,.72);
}
.command-form input {
  border: 0; background: transparent; min-width: 0; padding: 14px 14px 13px 0; font: 17px/1.4 var(--ui); color: var(--ink);
}
.command-form input::placeholder { color: #777873; }
.command-form button { border: 0; margin: 5px 0; background: var(--blue); color: white; padding: 0 21px; min-width: 118px; cursor: pointer; font-weight: 650; }
.command-compact { display: none; border-top: 1px solid var(--ink); border-bottom: 1px solid var(--ink); padding: 10px 0; align-items: center; justify-content: space-between; gap: 12px; }
.command-compact span { font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.command-compact button { border: 0; background: transparent; color: var(--blue); cursor: pointer; font-weight: 650; }
.offer-kind-switcher {
  display: flex; align-items: center; flex-wrap: wrap; gap: 7px; padding: 10px 0 1px;
}
.offer-kind-switcher-label {
  margin-right: 2px; color: var(--muted); font: 800 9px/1.2 var(--ui); letter-spacing: .1em; text-transform: uppercase;
}
.offer-kind-switcher button {
  min-height: 31px; border: 1px solid var(--line-dark); background: rgba(255,255,252,.64); color: var(--ink); padding: 6px 10px; cursor: pointer; font: 700 10px/1.2 var(--ui);
}
.offer-kind-switcher button[aria-pressed="true"] { border-color: var(--blue); background: var(--blue); color: #fff; }
.offer-kind-switcher button:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
.parsed-wrap { padding: 8px 0 2px; }
.parsed-wrap summary { list-style: none; cursor: pointer; color: var(--muted); font: 10px var(--ui); text-transform: uppercase; letter-spacing: .08em; display: inline-flex; gap: 8px; align-items: center; }
.parsed-wrap summary::-webkit-details-marker { display: none; }
.parsed-wrap summary::after { content: "▾"; color: var(--blue); }
.parsed-wrap[open] summary::after { content: "▴"; }
.token-row { display: flex; flex-wrap: wrap; gap: 6px; padding: 9px 0 2px; }
.token {
  border: 1px solid #aaa9a4; background: #fffefa; padding: 6px 8px; display: inline-flex; align-items: center; gap: 8px; font: 11px var(--ui); cursor: pointer;
}
.token i { font-style: normal; color: var(--muted); }
.parser-warning { margin-top: 8px; padding: 9px 11px; border-left: 2px solid var(--orange); background: var(--orange-soft); font-size: 11px; line-height: 1.45; }
.route-note {
  margin-top: 10px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 9px 12px; background: #eef1fc; border-left: 2px solid var(--blue); font-size: 11px; line-height: 1.4;
}
.route-note button { border: 0; background: transparent; color: var(--blue); cursor: pointer; font-weight: 650; white-space: nowrap; }
.result-toolbar {
  min-height: 45px; display: flex; align-items: center; justify-content: space-between; gap: 14px; border-bottom: 1px solid var(--line); margin-top: 8px;
}
.result-count { color: var(--muted); font: 11px var(--ui); }
.result-count strong { color: var(--ink); font-weight: 700; }
.sort-control { display: flex; align-items: center; gap: 8px; }
.sort-control label { font: 10px var(--ui); color: var(--muted); text-transform: uppercase; letter-spacing: .07em; }
.sort-control select { border: 0; border-bottom: 1px solid var(--line-dark); background: transparent; padding: 6px 22px 6px 4px; font-size: 11px; }
.inspector-edge {
  position: fixed; right: 0; top: calc(var(--header-h) + 48%); width: 28px; height: 58px; border: 1px solid var(--line); border-right: 0; background: var(--paper-strong); z-index: 22; cursor: pointer; color: var(--blue); box-shadow: -5px 5px 18px rgba(0,0,0,.07);
}

.view-scroll { flex: 1 1 auto; min-height: 0; overflow: auto; scrollbar-width: thin; overscroll-behavior: contain; position: relative; }
.view-stage { min-height: 100%; padding: 22px 28px 48px; }
.view-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; margin-bottom: 18px; }
.view-title h2 { margin: 0; font: 400 36px/1.03 var(--serif); letter-spacing: -.02em; }
.view-title p { margin: 7px 0 0; color: var(--muted); font-size: 12px; line-height: 1.45; max-width: 640px; }
.view-tools { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.quiet-btn, .outline-btn, .primary-btn, .danger-btn {
  min-height: 36px; padding: 8px 13px; cursor: pointer; border: 1px solid var(--line-dark); background: transparent; font-size: 12px;
}
.quiet-btn { border-color: transparent; color: var(--blue); }
.primary-btn { background: var(--blue); color: white; border-color: var(--blue); font-weight: 650; }
.danger-btn { color: var(--red); border-color: #d9a59e; }
.graph-instruction { margin: 14px 0 0; color: var(--muted); font: 11px/1.5 var(--ui); display: flex; justify-content: space-between; gap: 12px; }
.graph-instruction button { border: 0; background: transparent; color: var(--blue); cursor: pointer; padding: 0; }

/* Constellation */
.constellation-wrap { border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); min-height: 610px; position: relative; overflow: auto; background: rgba(255,255,252,.32); }
.constellation-canvas { position: relative; min-width: 920px; min-height: 610px; }
.constellation-lines { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.constellation-lines path { fill: none; stroke: #cbc9c1; stroke-width: 1; }
.constellation-lines path.primary { stroke: var(--blue); stroke-width: 2.5; }
.constellation-lines path.dashed { stroke-dasharray: 4 5; }
.cause-node {
  position: absolute; translate: -50% -50%; width: 132px; height: 132px; border-radius: 50%; background: rgba(255,255,252,.92); border: 1.5px solid #b9b8b1; display: grid; place-items: center; padding: 12px; text-align: center; cursor: pointer; transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease; z-index: 2;
}
.cause-node:hover, .cause-node:focus-visible { transform: scale(1.035); box-shadow: 0 10px 28px rgba(0,0,0,.08); }
.cause-node.selected { border: 2px solid var(--blue); box-shadow: 0 0 0 8px rgba(18,63,241,.08); }
.cause-node .node-name { font: 18px/1.02 var(--serif); }
.cause-node .node-count { margin-top: 5px; color: var(--muted); font: 11px/1.35 var(--ui); }
.cause-node .node-count strong { color: var(--blue); }
.cause-node::before { content: ""; position: absolute; inset: -14px; border-radius: 50%; border: 1px solid transparent; opacity: .85; }
.cause-node.tone-cobalt { border-color: var(--blue); }
.cause-node.tone-cobalt::before { border-color: #b5c3ff; }
.cause-node.tone-blue { border-color: #a9bdd1; }
.cause-node.tone-sage { border-color: #a9b876; }
.cause-node.tone-orange { border-color: #f0a06a; }
.cause-node.tone-violet { border-color: #c5b7e7; }
.cause-node.tone-gold { border-color: #d7be63; }
.cause-node.tone-peach { border-color: #f2bf8a; }
.cause-node.tone-gray { border-color: #a9aaa6; }
.cause-node .signal { position: absolute; right: 1px; top: 8px; width: 23px; height: 23px; border-radius: 50%; background: var(--lime-soft); border: 1px solid #9db51e; display: grid; place-items: center; font: 10px var(--ui); }
.you-node {
  position: absolute; left: 50%; top: 50%; translate: -50% -50%; width: 92px; height: 92px; border-radius: 50%; border: 2px solid var(--blue); background: #fff; display: grid; place-items: center; text-align: center; z-index: 3;
}
.you-node b { display: block; font: 21px var(--serif); }
.you-node span { color: var(--blue); font: 10px var(--ui); }
.person-dot {
  position: absolute; translate: -50% -50%; min-width: 48px; min-height: 48px; border-radius: 50%; border: 1px solid #858680; background: #fff; cursor: pointer; display: grid; place-items: center; padding: 6px; font: 10px var(--serif); z-index: 3;
}

/* Value field */
.value-field-shell { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 18px; align-items: start; }
.value-canvas {
  min-height: 580px; position: relative; border-left: 1px solid var(--line-dark); border-bottom: 1px solid var(--line-dark); background-image: linear-gradient(rgba(0,0,0,.025) 1px, transparent 1px), linear-gradient(90deg, rgba(0,0,0,.025) 1px, transparent 1px); background-size: 40px 40px; overflow: hidden;
}
.axis-y-label { position: absolute; left: 9px; top: 10px; color: var(--muted); font: 10px var(--ui); writing-mode: vertical-rl; transform: rotate(180deg); }
.axis-x-label { position: absolute; left: 15px; right: 14px; bottom: 8px; display: flex; justify-content: space-between; color: var(--muted); font: 10px var(--ui); }
.value-point {
  position: absolute; translate: -50% 50%; border: 0; background: transparent; padding: 0; cursor: pointer; text-align: left; width: 142px; z-index: 2;
}
.value-point .mark { width: 15px; height: 15px; background: var(--blue); border: 2px solid white; box-shadow: 0 0 0 1px var(--blue); display: block; margin-bottom: 5px; }
.value-point.action .mark { transform: rotate(45deg); background: var(--violet); box-shadow: 0 0 0 1px var(--violet); }
.value-point.redirect .mark { transform: rotate(45deg); background: var(--orange); box-shadow: 0 0 0 1px var(--orange); }
.value-point.trade .mark { border-radius: 50%; }
.value-point.co-fund .mark { border-radius: 50%; background: var(--paper-strong); box-shadow: 0 0 0 3px var(--blue), inset 0 0 0 3px var(--paper-strong); }
.value-point.selected .mark { width: 21px; height: 21px; box-shadow: 0 0 0 6px rgba(18,63,241,.15), 0 0 0 1px var(--blue); }
.value-point .point-title { display: inline; background: rgba(247,245,240,.90); box-decoration-break: clone; -webkit-box-decoration-break: clone; font: 11px/1.35 var(--sans); padding: 1px 2px; }
.value-point .point-meta { display: block; color: var(--muted); font: 10.5px/1.35 var(--ui); margin-top: 2px; }
.lasso-box { position: absolute; border: 1px solid var(--blue); background: rgba(18,63,241,.08); pointer-events: none; z-index: 5; }
.field-legend { border-top: 1px solid var(--ink); padding-top: 12px; }
.field-legend h3 { margin: 0 0 10px; font: 22px var(--serif); }
.metric-card { border-top: 1px solid var(--line); padding: 11px 0; }
.metric-card:first-of-type { border-top: 0; }
.metric-card b { display: block; font: 12px var(--ui); }
.metric-card span { display: block; color: var(--muted); font-size: 11px; line-height: 1.45; margin-top: 3px; }
.compare-summary { margin-top: 15px; padding: 13px; border: 1px solid var(--blue); background: #f4f6ff; }
.compare-summary b { font: 13px var(--ui); }
.compare-summary p { margin: 5px 0 10px; font-size: 11px; line-height: 1.4; color: var(--muted); }

/* Threshold */
.threshold-layout { display: grid; grid-template-columns: minmax(720px, 1fr) 280px; gap: 18px; }
.threshold-canvas { position: relative; min-height: 620px; overflow: auto; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); background: rgba(255,255,252,.3); }
.radar-inner { position: relative; min-width: 720px; min-height: 620px; }
.ring { position: absolute; left: 50%; top: 50%; translate: -50% -50%; border: 1px solid #ccd3ee; border-radius: 50%; }
.ring.r1 { width: 190px; height: 190px; border-color: #a9bd3d; }
.ring.r2 { width: 350px; height: 350px; }
.ring.r3 { width: 520px; height: 520px; }
.ring-label { position: absolute; left: 50%; translate: -50% 0; color: var(--muted); font: 9px var(--ui); background: var(--paper); padding: 2px 5px; }
.ring-label.near { top: calc(50% - 102px); color: #718712; }
.ring-label.ontrack { top: calc(50% - 182px); }
.ring-label.far { top: calc(50% - 267px); }
.pool-bubble {
  position: absolute; translate: -50% -50%; border-radius: 50%; background: #fffefa; display: grid; place-items: center; text-align: center; padding: 10px; cursor: pointer; z-index: 3; box-shadow: 0 6px 18px rgba(0,0,0,.05);
}
.pool-bubble.near-threshold { border: 2px solid #8ea914; }
.pool-bubble.on-track { border: 2px solid var(--blue); }
.pool-bubble.at-risk { border: 2px solid var(--orange); }
.pool-bubble.verification-unavailable { border: 2px dashed var(--red); }
.pool-bubble .pool-status { font: 700 9.5px var(--ui); text-transform: uppercase; letter-spacing: .08em; }
.pool-bubble .pool-title { font: 13px/1.05 var(--serif); margin: 4px 0; }
.pool-bubble .pool-gap { font: 10.5px var(--ui); }
.pool-bubble.selected { box-shadow: 0 0 0 7px rgba(18,63,241,.12), 0 10px 28px rgba(0,0,0,.09); }
.threshold-center {
  position: absolute; left: 50%; top: 50%; translate: -50% -50%; width: 180px; min-height: 180px; border-radius: 50%; background: #fff; border: 2px solid var(--ink); z-index: 4; display: grid; align-content: center; text-align: center; padding: 24px 18px;
}
.threshold-center b { font: 23px var(--serif); }
.threshold-center span { font: 9px/1.4 var(--ui); color: var(--muted); }
.threshold-center input { width: 100%; accent-color: var(--blue); margin: 9px 0 4px; }
.threshold-center button { margin-top: 7px; border: 0; color: var(--blue); background: transparent; font: 700 10px var(--ui); cursor: pointer; }
.threshold-side { border-top: 1px solid var(--ink); padding-top: 12px; }
.threshold-side h3 { margin: 0 0 12px; font: 24px var(--serif); }
.threshold-key { display: grid; gap: 8px; font-size: 11px; color: var(--muted); }
.key-row { display: flex; gap: 8px; align-items: center; }
.key-dot { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--blue); }
.key-dot.near { border-color: #8ea914; }
.key-dot.risk { border-color: var(--orange); }

/* Trust network */
.trust-canvas { min-height: 600px; position: relative; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); overflow: auto; background: rgba(255,255,252,.3); }
.trust-inner { position: relative; min-width: 850px; min-height: 600px; }
.trust-lines { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.trust-lines line { stroke: #9d9d98; stroke-width: 1.2; }
.trust-lines line.direct { stroke: var(--blue); stroke-width: 2; }
.trust-lines line.introduced { stroke-dasharray: 5 5; stroke: var(--blue); }
.trust-you { position: absolute; left: 50%; top: 50%; translate: -50% -50%; width: 94px; height: 94px; border-radius: 50%; background: white; border: 2px solid var(--blue); display: grid; place-items: center; text-align: center; z-index: 3; }
.trust-you b { font: 22px var(--serif); }
.trust-person {
  position: absolute; translate: -50% -50%; width: 126px; min-height: 78px; border: 1px solid #999a95; border-radius: 50%; background: #fff; padding: 13px 10px; text-align: center; cursor: pointer; z-index: 3;
}
.trust-person strong { display: block; font: 17px var(--serif); }
.trust-person span { display: block; color: var(--muted); font: 10.5px/1.35 var(--ui); margin-top: 3px; }
.trust-person.selected { border: 2px solid var(--blue); box-shadow: 0 0 0 8px rgba(18,63,241,.09); }
.trust-person.warning { border-color: var(--orange); }

/* Lists */
.list-stage { padding-top: 12px; }
.transaction-list { border-top: 1px solid var(--ink); }
.transaction-row {
  display: grid; grid-template-columns: 34px minmax(260px, 1.6fr) minmax(150px, .7fr) 128px 116px 138px; align-items: stretch; border-bottom: 1px solid var(--ink); background: rgba(255,255,252,.34); min-height: 128px;
}
.transaction-row > * { border-right: 1px solid var(--line); padding: 14px 13px; min-width: 0; }
.transaction-row > *:last-child { border-right: 0; }
.compare-cell { display: grid; place-items: start center; }
.compare-cell input { accent-color: var(--blue); width: 16px; height: 16px; }
.row-main .eyebrow { display: flex; align-items: center; gap: 7px; margin-bottom: 7px; font: 700 9px var(--ui); text-transform: uppercase; letter-spacing: .08em; color: var(--blue); }
.status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); display: inline-block; }
.status-dot.stale { background: var(--orange); }
.status-dot.expired { background: var(--red); }
.row-title { margin: 0 0 7px; font: 22px/1.06 var(--serif); letter-spacing: -.015em; }
.row-description { margin: 0; color: #4c4d49; font-size: 11px; line-height: 1.42; }
.match-reason { margin-top: 9px; color: var(--blue); font: 10px/1.4 var(--ui); }
.cell-label { display: block; margin-bottom: 8px; font: 700 9px var(--ui); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.cell-primary { font: 13px/1.35 var(--serif); }
.cell-secondary { color: var(--muted); font-size: 10px; line-height: 1.45; margin-top: 5px; }
.row-actions { display: grid; align-content: center; gap: 8px; padding: 13px !important; }
.row-actions .primary-btn, .row-actions .outline-btn { width: 100%; }
.row-action-line { display: flex; gap: 8px; }
.bookmark-btn { width: 38px; flex: 0 0 auto; border: 1px solid var(--line-dark); background: transparent; cursor: pointer; font-size: 18px; }
.bookmark-btn.saved { color: var(--blue); border-color: var(--blue); }
.people-row { grid-template-columns: minmax(260px, 1.4fr) minmax(180px, .8fr) 130px 130px 142px; }

.compare-dock {
  position: sticky; bottom: 12px; z-index: 15; margin: 16px auto 0; width: min(680px, calc(100% - 24px)); background: #080808; color: white; display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 12px 14px; box-shadow: var(--shadow);
}
.compare-dock strong { font: 13px var(--ui); }
.compare-dock span { color: #b9b9b5; font-size: 11px; }
.compare-dock button { border: 1px solid #777; background: transparent; color: white; min-height: 34px; padding: 7px 13px; cursor: pointer; }
.compare-dock button.primary { background: var(--blue); border-color: var(--blue); }


/* Two-sided offer rows */
.offer-transaction-row {
  grid-template-columns: 34px minmax(0, 1fr) 178px;
  min-height: 214px;
}
.offer-transaction-row > * { min-width: 0; }
.offer-row-content {
  padding: 0 !important;
  cursor: pointer;
  display: grid;
  align-content: start;
}
.offer-row-content:hover { background: rgba(18,63,241,.025); }
.offer-row-content:focus-visible { box-shadow: inset 0 0 0 2px var(--blue); }
.offer-row-meta {
  min-height: 38px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 9px 14px 8px;
  border-bottom: 1px solid var(--line);
}
.offer-row-meta .eyebrow { margin: 0; }
.offer-row-deadline {
  flex: 0 0 auto;
  color: var(--muted);
  font: 10px/1.35 var(--ui);
  text-align: right;
}
.exchange-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 38px minmax(0, 1fr);
  align-items: stretch;
  min-height: 132px;
}
.exchange-side {
  min-width: 0;
  padding: 14px 16px 12px;
  display: grid;
  align-content: start;
  background: rgba(255,255,252,.26);
}
.exchange-side[data-exchange-side="return"] { background: rgba(18,63,241,.028); }
.exchange-side-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 8px;
}
.exchange-label {
  font: 800 10px/1.2 var(--ui);
  letter-spacing: .105em;
  text-transform: uppercase;
  color: var(--blue);
}
.exchange-flexibility {
  border: 1px solid var(--line-dark);
  background: var(--paper-strong);
  padding: 3px 5px;
  font: 700 8px/1.15 var(--ui);
  letter-spacing: .045em;
  text-transform: uppercase;
  color: var(--muted);
}
.exchange-obligations {
  margin: 0;
  padding-left: 18px;
  display: grid;
  gap: 5px;
}
.exchange-obligations li {
  color: #4a4b47;
  font-size: 11px;
  line-height: 1.36;
  padding-left: 1px;
}
.exchange-obligations li:first-child {
  color: var(--ink);
  font: 19px/1.08 var(--serif);
  letter-spacing: -.012em;
}
.exchange-or {
  display: flex;
  align-items: center;
  gap: 7px;
  margin: 8px 0;
  color: var(--blue);
  font: 800 9px/1 var(--ui);
  letter-spacing: .12em;
}
.exchange-or::before, .exchange-or::after { content: ""; height: 1px; flex: 1 1 auto; background: var(--line); }
.exchange-arrow {
  border-left: 1px solid var(--line);
  border-right: 1px solid var(--line);
  display: grid;
  place-items: center;
  color: var(--blue);
  font: 20px/1 var(--serif);
  background: rgba(255,255,252,.42);
}
.exchange-provider {
  margin-top: 10px;
  color: var(--muted);
  font: 10px/1.35 var(--ui);
}
.exchange-provider strong { color: var(--ink); font-weight: 700; }
.offer-context {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 10px 16px;
  align-items: end;
  padding: 9px 14px 10px;
  border-top: 1px solid var(--line);
}
.offer-context-copy { min-width: 0; }
.offer-context-title {
  margin: 0;
  font: 13px/1.25 var(--serif);
  color: var(--ink);
}
.offer-context-description {
  margin: 3px 0 0;
  color: var(--muted);
  font-size: 10px;
  line-height: 1.35;
}
.offer-context .match-reason { margin: 0; text-align: right; max-width: 230px; }
.cofund-badge {
  display: inline-flex; align-items: center; min-height: 18px; margin-left: 4px; border: 1px solid var(--blue); background: var(--blue-soft); color: var(--blue); padding: 2px 5px; font: 800 8px/1 var(--ui); letter-spacing: .09em; text-transform: uppercase;
}
.cofund-funding { margin-top: 10px; max-width: 640px; }
.cofund-progress-track { height: 6px; border: 1px solid var(--line-dark); background: #fff; overflow: hidden; }
.cofund-progress-fill { display: block; height: 100%; background: var(--blue); }
.cofund-funding-stats { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 5px; color: var(--muted); font: 9px/1.35 var(--ui); }
.cofund-funding-stats strong { color: var(--ink); }
.cofund-inspector-progress { margin: 14px 0 0; border: 1px solid var(--line); padding: 11px; background: rgba(229,235,255,.36); }
.cofund-inspector-progress .cofund-progress-track { height: 8px; }
.offer-transaction-row[data-offer-kind="co-fund"] { box-shadow: inset 3px 0 0 var(--blue); }
.offer-transaction-row[data-offer-kind="co-fund"] .exchange-side[data-exchange-side="offer"] { background: rgba(229,235,255,.22); }
.offer-transaction-row .row-actions {
  align-content: start;
  gap: 7px;
  padding-top: 14px !important;
}
.offer-transaction-row .row-actions .primary-btn,
.offer-transaction-row .row-actions .outline-btn,
.offer-transaction-row .row-actions .quiet-btn {
  width: 100%;
  min-height: 37px;
  white-space: normal;
  line-height: 1.2;
}
.offer-transaction-row .row-actions .quiet-btn {
  text-align: left;
  padding: 7px 0;
  color: var(--blue);
  border: 0;
  border-bottom: 1px solid var(--line);
  background: transparent;
  cursor: pointer;
  font: 700 10px/1.25 var(--ui);
}
.offer-transaction-row .row-action-line { display: grid; grid-template-columns: 1fr 38px; gap: 7px; }
.offer-transaction-row .bookmark-btn { height: 37px; }

/* Empty/status states */
.state-panel { min-height: 370px; display: grid; place-items: center; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); text-align: center; padding: 38px; }
.state-panel-inner { max-width: 520px; }
.state-panel h2 { margin: 0 0 9px; font: 36px/1.05 var(--serif); }
.state-panel p { color: var(--muted); line-height: 1.55; font-size: 12px; }
.state-suggestions { display: grid; gap: 8px; margin-top: 18px; }
.state-suggestions button { border: 1px solid var(--line-dark); background: transparent; padding: 10px; cursor: pointer; }
.loading-line { width: 220px; height: 2px; background: #ddd; overflow: hidden; margin: 20px auto; }
.loading-line::after { content: ""; display: block; width: 50%; height: 100%; background: var(--blue); animation: loading 1.2s infinite ease-in-out; }
@keyframes loading { from { transform: translateX(-100%); } to { transform: translateX(200%); } }

/* Inspector */
.inspector {
  border-left: 1px solid var(--line); background: rgba(250,249,245,.98); overflow-y: auto; min-width: 0; position: relative; z-index: 20; scrollbar-width: thin;
}
.inspector-inner { padding: 21px 18px 110px; }
.inspector-back { border: 0; background: transparent; color: var(--blue); padding: 0; cursor: pointer; font: 11px var(--ui); margin-bottom: 16px; }
.inspector-kicker { font: 700 9px var(--ui); text-transform: uppercase; letter-spacing: .11em; color: var(--blue); margin-bottom: 8px; }
.inspector h2 { margin: 0; font: 34px/1.02 var(--serif); letter-spacing: -.02em; }
.inspector-subtitle { margin: 8px 0 0; color: var(--muted); line-height: 1.45; font-size: 11px; }
.inspector-section { padding: 16px 0; border-top: 1px solid var(--line); }
.inspector-section:first-of-type { margin-top: 18px; }
.inspector-section h3 { margin: 0 0 10px; font: 700 9px var(--ui); letter-spacing: .1em; text-transform: uppercase; }
.recommendation-card { border: 1px solid var(--blue); background: #f5f7ff; padding: 13px; }
.recommendation-card .route-title { font: 21px/1.06 var(--serif); }
.recommendation-card .route-exchange { display: grid; grid-template-columns: 1fr 24px 1fr; gap: 8px; align-items: center; margin-top: 12px; }
.recommendation-card .route-exchange div { font-size: 11px; line-height: 1.4; }
.inspector-exchange { display: grid; grid-template-columns: minmax(0, 1fr) 30px minmax(0, 1fr); border: 1px solid var(--line); }
.inspector-exchange .exchange-side { padding: 11px; }
.inspector-exchange .exchange-obligations li:first-child { font-size: 16px; }
.inspector-exchange.compact .exchange-side { padding: 9px; }
.inspector-exchange.compact .exchange-obligations li { font-size: 10px; }
.inspector-exchange.compact .exchange-obligations li:first-child { font-size: 14px; }
.inspector-exchange.cofund-inspector-exchange { grid-template-columns: minmax(0, 1fr); }
.inspector-exchange.cofund-inspector-exchange .exchange-arrow { min-height: 30px; border-left: 0; border-right: 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.response-intent-note { margin: 14px 0 4px; padding: 10px 12px; border-left: 2px solid var(--blue); background: #eef1fc; font: 11px/1.45 var(--ui); }
.response-intent-note strong { color: var(--ink); }
.why-list, .integrity-list { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.why-list li { display: grid; grid-template-columns: 15px 1fr; gap: 7px; font-size: 11px; line-height: 1.4; }
.why-list li::before { content: "✓"; color: var(--green); font-weight: 800; }
.integrity-row { border-top: 1px solid #dedcd5; padding-top: 9px; }
.integrity-row:first-child { border-top: 0; padding-top: 0; }
.integrity-row dt { font: 700 9px var(--ui); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.integrity-row dd { margin: 4px 0 0; font-size: 11px; line-height: 1.45; }
.fact-estimate { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.fact-estimate > div { border: 1px solid var(--line); padding: 10px; }
.fact-estimate b { display: block; font: 700 9px var(--ui); text-transform: uppercase; }
.fact-estimate span { display: block; margin-top: 5px; color: var(--muted); font-size: 10px; line-height: 1.4; }
.cause-inventory { display: grid; }
.inventory-item { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 11px 0; border-top: 1px solid var(--line); }
.inventory-item:first-child { border-top: 0; }
.inventory-item button { border: 0; background: transparent; padding: 0; text-align: left; cursor: pointer; }
.inventory-item strong { font: 15px/1.1 var(--serif); }
.inventory-item small { display: block; color: var(--muted); margin-top: 4px; font: 9px/1.4 var(--ui); }
.inventory-item .mini-action { color: var(--blue); font: 10px var(--ui); align-self: center; }
.inspector-actions { position: sticky; bottom: 0; background: linear-gradient(to top, var(--paper-strong) 72%, transparent); padding: 22px 0 2px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.inspector-actions .wide { grid-column: 1 / -1; }
.detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.detail-stat b { display: block; font: 19px var(--serif); }
.detail-stat span { display: block; margin-top: 4px; color: var(--muted); font: 9px/1.35 var(--ui); }
.pool-pledge-box { border: 1px solid #9eb024; background: var(--lime-soft); padding: 12px; }
.pool-pledge-box input { width: 100%; accent-color: #819814; margin: 10px 0 4px; }
.pool-pledge-box .pledge-result { display: flex; justify-content: space-between; gap: 8px; font: 10px var(--ui); }

/* Modals / bottom sheet */
.overlay-scrim { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 80; }
.modal {
  position: fixed; left: 50%; top: 50%; translate: -50% -50%; width: min(760px, calc(100vw - 32px)); max-height: min(820px, calc(100vh - 40px)); overflow: auto; background: var(--paper-strong); z-index: 81; border: 1px solid var(--ink); box-shadow: var(--shadow); padding: 22px;
}
.modal-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 18px; border-bottom: 1px solid var(--ink); padding-bottom: 14px; }
.modal-head h2 { margin: 0; font: 34px var(--serif); }
.modal-head p { margin: 5px 0 0; color: var(--muted); font-size: 11px; line-height: 1.45; }
.modal-close { width: 38px; height: 38px; border: 1px solid var(--line-dark); background: transparent; cursor: pointer; }
.method-formula { margin-top: 18px; padding: 16px; background: #f1efe8; border-left: 3px solid var(--blue); font: 12px/1.6 var(--ui); }
.method-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 18px; }
.method-grid h3 { margin: 0 0 8px; font: 20px var(--serif); }
.method-grid p, .method-grid li { font-size: 11px; line-height: 1.5; color: var(--muted); }
.compare-table { width: 100%; border-collapse: collapse; margin-top: 18px; table-layout: fixed; }
.compare-table th, .compare-table td { border-top: 1px solid var(--line); padding: 10px; text-align: left; vertical-align: top; font-size: 10px; line-height: 1.4; }
.compare-table th { font: 700 9px var(--ui); text-transform: uppercase; color: var(--muted); }
.compare-table td:first-child { font-weight: 700; width: 145px; }
.toast { position: fixed; right: 22px; bottom: 22px; z-index: 100; background: #080808; color: white; padding: 12px 16px; font: 11px var(--ui); box-shadow: var(--shadow); }

/* Compact desktop */
@media (max-width: 1200px) and (min-width: 761px) {
  :root { --rail-w: 54px; --inspector-w: 328px; }
  .left-rail { padding: 0; overflow: hidden; }
  .full-rail { display: none; }
  .compact-rail { display: grid; align-content: start; gap: 2px; padding-top: 12px; }
  .compact-rail button { width: 54px; min-height: 54px; border: 0; border-bottom: 1px solid var(--line); background: transparent; cursor: pointer; display: grid; place-items: center; font: 8px/1.1 var(--ui); color: var(--muted); padding: 4px; }
  .compact-rail button span { font-size: 19px; color: var(--ink); }
  .compact-rail button.active { color: var(--blue); }
  .discover-shell.has-inspector { grid-template-columns: var(--rail-w) minmax(0, 1fr); }
  .inspector {
    position: fixed; top: var(--header-h); right: 0; bottom: 0; width: var(--inspector-w); box-shadow: var(--shadow); z-index: 30;
  }
  .command-area { padding-left: 22px; padding-right: 22px; }
  .view-stage { padding-left: 22px; padding-right: 22px; }
  .value-field-shell, .threshold-layout { grid-template-columns: minmax(0, 1fr); }
  .field-legend, .threshold-side { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .field-legend h3, .threshold-side h3 { grid-column: 1 / -1; }
}

/* Mobile */
@media (max-width: 760px) {
  :root { --header-h: 54px; }
  body { overflow: hidden; font-size: 13px; }
  .app-header { height: var(--header-h); padding: 0 14px; grid-template-columns: 1fr auto; }
  .brand { font-size: 14px; }
  .brand-mark { width: 24px; height: 24px; }
  .top-nav { display: none; }
  .account span:first-child { display: none; }
  .avatar { width: 34px; height: 34px; }
  .discover-shell, .discover-shell.has-inspector { display: block; height: calc(100vh - var(--header-h)); }
  .left-rail { display: none; }
  .discover-main { height: 100%; }
  .mobile-tabs { display: block; padding: 8px 12px 0; background: rgba(250,249,245,.98); }
  .mobile-tab-row { display: flex; gap: 5px; overflow-x: auto; scrollbar-width: none; padding-bottom: 6px; }
  .mobile-tab-row::-webkit-scrollbar { display: none; }
  .mobile-tab {
    flex: 0 0 auto; min-height: 34px; border: 1px solid var(--line); background: transparent; padding: 7px 11px; font-size: 11px; cursor: pointer;
  }
  .mobile-tab[aria-selected="true"] { background: #080808; color: white; border-color: #080808; }
  .mobile-utility-row { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--line); padding: 7px 0; }
  .mobile-utility-row button { border: 0; background: transparent; color: var(--blue); font: 11px var(--ui); }
  .command-area { padding: 8px 12px 0; }
  .discover-heading-row { display: none; }
  .command-form input { font-size: 13px; padding: 12px 8px 11px 0; }
  .command-form button { min-width: 74px; padding: 0 10px; font-size: 11px; }
  .parsed-wrap { padding-top: 6px; }
  .token { font-size: 11px; padding: 5px 7px; }
  .route-note { font-size: 11px; align-items: flex-start; }
  .result-toolbar { min-height: 40px; margin-top: 4px; }
  .result-count { font-size: 11px; }
  .sort-control label { display: none; }
  .sort-control select { font-size: 11px; max-width: 150px; }
  .view-scroll { -webkit-overflow-scrolling: touch; }
  .view-stage { padding: 10px 12px 92px; }
  .view-head { display: none; }
  .list-stage { padding-top: 0; }
  .command-collapsed .command-form, .command-collapsed .parsed-wrap, .command-collapsed .route-note { display: none; }

const exchangeFlexibilityLabels = {
  fixed: 'Fixed',
  negotiable: 'Negotiable',
  substitutions: 'Substitutions allowed'
};

const offerTypeLabels = {
  fund: 'Funding',
  action: 'Action or time',
  donation: 'Donation redirect',
  skill: 'Skill or review'
};

const returnTypeLabels = {
  payment: 'Payment to you',
  donation: 'Donation or public good',
  deliverable: 'Deliverable',
  service: 'Service',
  credit: 'Credit or recognition',
  rights: 'Rights or license'
};

function exchangeTypesMatch(selectedTypes, actualTypes, sideName) {
  if (!selectedTypes.length) return true;
  return selectedTypes.some((type) => {
    if (sideName === 'return' && type === 'donation') {
      return actualTypes.includes('donation') || actualTypes.includes('public-good');
    }
    return actualTypes.includes(type);
  });
}

const vagueExchangeTerm = /^(mutual benefit|supported value|meaningful contribution|details to be agreed|tbd|unknown)$/i;

function exchangeGroupsAreConcrete(groups) {
  return Array.isArray(groups) && groups.length > 0 && groups.every((group) =>
    Array.isArray(group) && group.length > 0 && group.every((term) => {
      const value = String(term || '').trim();
      return value.length >= 3 && !vagueExchangeTerm.test(value);
    })
  );
}

function validateOfferExchange(item) {
  const exchange = exchangeProfiles[item.id];
  const blockers = [];
  if (!exchange) blockers.push('missing structured exchange profile');
  if (!exchangeGroupsAreConcrete(exchange?.offer?.alternatives)) blockers.push('missing concrete You offer obligations');
  if (!exchangeGroupsAreConcrete(exchange?.return?.alternatives)) blockers.push('missing concrete You get outcomes');
  if (!exchangeFlexibilityLabels[exchange?.offer?.flexibility]) blockers.push('missing You offer negotiability');
  if (!exchangeFlexibilityLabels[exchange?.return?.flexibility]) blockers.push('missing You get negotiability');
  if (!['automatic', 'approval'].includes(exchange?.acceptanceMode)) blockers.push('missing exact-match acceptance mode');
  if (!item.deadline) blockers.push('missing deadline');
  if (!item.proof || !item.evidenceLevel) blockers.push('missing evidence or verification conditions');
  if (item.listingKind === 'co-fund') {
    const funding = item.coFund;
    if (!item.verified) blockers.push('Co-Fund must pass verification before public discovery');
    if (!item.counterparty) blockers.push('missing Co-Fund counterparty');
    if (!funding || !Number.isFinite(funding.threshold) || funding.threshold <= 0) blockers.push('missing valid Co-Fund threshold');
    if (!funding || !Number.isFinite(funding.funded) || funding.funded < 0 || funding.funded > funding.threshold) blockers.push('missing valid Co-Fund funding state');
    if (!funding || !Number.isFinite(funding.contributors) || funding.contributors < 1) blockers.push('missing Co-Fund contributor count');
    if (!funding || !Number.isFinite(funding.minimumContribution) || funding.minimumContribution <= 0) blockers.push('missing Co-Fund minimum contribution');
    if (!funding || !Number.isFinite(funding.maximumContribution) || funding.maximumContribution < funding.minimumContribution) blockers.push('missing valid Co-Fund maximum contribution');
    if (!funding?.failure || !funding?.activation || !funding?.authorizationExpires) blockers.push('missing Co-Fund activation or failure terms');
  }
  return blockers;
}

for (const offer of offers) {

  offer.publicationBlockers = validateOfferExchange(offer);

  const requestedDomain = ['offers','pools','people'].includes(params.get('domain')) ? params.get('domain') : 'offers';
  const rawSelectedId = params.get('selected');
  const migratedSelection = rawSelectedId ? legacyDiscoverItemMap[rawSelectedId] : null;
  const domain = migratedSelection ? 'offers' : requestedDomain;
  const requestedOfferKind = params.get('offerKind');
  const offerKind = ['all','individual','co-fund'].includes(requestedOfferKind) ? requestedOfferKind : 'all';
  return {
    domain,
    explicitView: migratedSelection ? 'list' : (params.get('view') || ''),
    selectedCause: params.get('cause') || null,
    selectedItem: rawSelectedId ? (migratedSelection || { type: params.get('selectedType') || domain.slice(0, -1), id: rawSelectedId }) : null,
    query: params.get('query') || params.get('q') || '',
    compareIds: parseCsv(params.get('compare')).map((id) => legacyDiscoverItemMap[id]?.id || id),
    constraints: {
      causes: parseCsv(params.get('causeFilter') || params.get('causes')),
      offerKind: migratedSelection ? 'co-fund' : offerKind,
      verifiedOnly: params.get('verified') === '1',
      maximumCommitment: Number(params.get('max') || 250),
      offerTypes: parseCsv(params.get('offerType')),
      returnTypes: parseCsv(params.get('returnType')),
      minimumReturnAmount: Number(params.get('minReturn') || 0),
      recipient: params.get('recipient') || '',
      evidence: params.get('evidence') || '',
      flexibilities: parseCsv(params.get('flexibility')),
      deadlineBefore: params.get('deadline') || '',
      mechanisms: parseCsv(params.get('mechanisms')),
      availability: params.get('availability') || '',
      sort: params.get('sort') || 'best-fit',
      terms: parseCsv(params.get('terms')).flatMap((term) => term.split(/\s+/)).filter(Boolean)
    }
  };
}

function createInitialState() {
  const stored = readStoredPreferences();
  const url = readUrlState();
  const viewByDomain = { ...defaultViewByDomain(), ...(stored.viewByDomain || {}) };
  if (url?.explicitView) viewByDomain[url.domain] = url.explicitView;
  const constraints = { ...baseConstraints(), ...(stored.constraints || {}), ...(url?.constraints || {}) };
  if (!['all','individual','co-fund'].includes(constraints.offerKind)) constraints.offerKind = 'all';
  // Mobile always starts in List unless a URL explicitly requests a graphic.
  if (isMobileViewport() && !url?.explicitView) {
    viewByDomain.offers = 'list';
    viewByDomain.people = 'list';
  }
  return {
    domain: url?.domain || stored.domain || 'offers',
    viewByDomain,
    constraints,
    query: url?.query || '',
    queryActive: Boolean(url?.query),
    parserConfidence: 'high',
    routeNote: null,
    selectedCause: url?.selectedCause || null,
    selectedItem: url?.selectedItem || null,
    selectionOrigin: 'list',
    responseIntent: null,
    inspectorOpen: Boolean(url?.selectedItem || url?.selectedCause),
    compareIds: url?.compareIds || [],
    compareOpen: false,
    savedOpen: false,
    filterOpen: false,
    methodOpen: null,
    railCollapsed: Boolean(stored.railCollapsed),
    compactDrawer: null,
    commandCollapsed: false,
    bookmarked: migrateLegacyDiscoverIds(stored.bookmarked),
    scrollPositions: {},
    pledgeAmounts: migrateLegacyPledgeAmounts(stored.pledgeAmounts),
    systemStatus: new URLSearchParams(window.location.search).get('status') || 'ready'
  };
}

function serializeToUrl(state) {
  const params = new URLSearchParams();
  params.set('domain', state.domain);
  params.set('view', state.viewByDomain[state.domain]);
  if (state.selectedCause) params.set('cause', state.selectedCause);
  if (state.constraints.causes.length) params.set('causeFilter', state.constraints.causes.join(','));
  if (state.constraints.offerKind !== 'all') params.set('offerKind', state.constraints.offerKind);
  if (state.constraints.verifiedOnly) params.set('verified', '1');
  if (state.constraints.maximumCommitment !== 250) params.set('max', String(state.constraints.maximumCommitment));
  if (state.constraints.offerTypes.length) params.set('offerType', state.constraints.offerTypes.join(','));
  if (state.constraints.returnTypes.length) params.set('returnType', state.constraints.returnTypes.join(','));
  if (state.constraints.minimumReturnAmount > 0) params.set('minReturn', String(state.constraints.minimumReturnAmount));
  if (state.constraints.recipient) params.set('recipient', state.constraints.recipient);
  if (state.constraints.evidence) params.set('evidence', state.constraints.evidence);
  if (state.constraints.flexibilities.length) params.set('flexibility', state.constraints.flexibilities.join(','));
  if (state.constraints.deadlineBefore) params.set('deadline', state.constraints.deadlineBefore);
  if (state.constraints.mechanisms.length) params.set('mechanisms', state.constraints.mechanisms.join(','));
  if (state.constraints.availability) params.set('availability', state.constraints.availability);
  if (state.constraints.sort !== 'best-fit') params.set('sort', state.constraints.sort);
  if (state.constraints.terms.length) params.set('terms', state.constraints.terms.join(','));
  if (state.query) params.set('query', state.query);
  if (state.selectedItem) {
    params.set('selected', state.selectedItem.id);
    params.set('selectedType', state.selectedItem.type);
  }
  if (state.compareIds.length) params.set('compare', state.compareIds.join(','));
  if (state.systemStatus !== 'ready') params.set('status', state.systemStatus);
  return `${window.location.pathname}?${params.toString()}#discover`;
}

function persistPreferences(state) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      domain: state.domain,
      viewByDomain: state.viewByDomain,
      constraints: {
        offerKind: state.constraints.offerKind,
        verifiedOnly: state.constraints.verifiedOnly,
        maximumCommitment: state.constraints.maximumCommitment,
        offerTypes: state.constraints.offerTypes,
        returnTypes: state.constraints.returnTypes,
        minimumReturnAmount: state.constraints.minimumReturnAmount,
        recipient: state.constraints.recipient,
        evidence: state.constraints.evidence,
        flexibilities: state.constraints.flexibilities,
        sort: state.constraints.sort
      },
      railCollapsed: state.railCollapsed,
      bookmarked: state.bookmarked,
      pledgeAmounts: state.pledgeAmounts
    }));
  } catch {
    // Persistence is optional; the URL remains authoritative.
  }
}

class DiscoverStore {
  constructor(initialState = createInitialState()) {
    this.state = initialState;
    this.listeners = new Set();
    this.isApplyingHistory = false;
  }

  subscribe(listener) {
    this.listeners.add(listener);
    return () => this.listeners.delete(listener);
  }

  getState() {
    return this.state;
  }

  update(updater, options = {}) {
    const previous = this.state;
    const next = typeof updater === 'function' ? updater(structuredClone(previous)) : { ...previous, ...updater };
    this.state = next;
    persistPreferences(next);
    if (!this.isApplyingHistory && options.history !== 'none') {
      const url = serializeToUrl(next);
      const currentDepth = Number(history.state?.depth || 0);
      const depth = options.history === 'push' ? currentDepth + 1 : currentDepth;
      const payload = { discover: true, depth, state: this.historySnapshot(next) };
      if (options.history === 'push') history.pushState(payload, '', url);
      else history.replaceState(payload, '', url);
    }
    this.listeners.forEach((listener) => listener(next, previous));
  }

  historySnapshot(state = this.state) {
    return {
      domain: state.domain,
      viewByDomain: state.viewByDomain,
      constraints: state.constraints,
      query: state.query,
      queryActive: state.queryActive,
      routeNote: state.routeNote,
      selectedCause: state.selectedCause,
      selectedItem: state.selectedItem,
      selectionOrigin: state.selectionOrigin,
      responseIntent: state.responseIntent,
      inspectorOpen: state.inspectorOpen,
      compareIds: state.compareIds,
      bookmarked: state.bookmarked
    };
  }

  applyHistory(snapshot) {
    if (!snapshot) return;
    this.isApplyingHistory = true;
    this.state = { ...this.state, ...snapshot, compareOpen: false, methodOpen: null, compactDrawer: null };
    this.listeners.forEach((listener) => listener(this.state, this.state));
    this.isApplyingHistory = false;
  }

  syncCurrentUrl() {
    history.replaceState({ discover: true, depth: Number(history.state?.depth || 0), state: this.historySnapshot() }, '', serializeToUrl(this.state));
  }

  reset() {
    const fresh = createInitialState();
    fresh.viewByDomain = defaultViewByDomain();
    fresh.constraints = baseConstraints();
    fresh.domain = 'offers';
    fresh.selectedCause = null;
    fresh.selectedItem = null;
    fresh.inspectorOpen = false;
    this.update(fresh, { history: 'push' });
  }
}



/* src/search.js */
const causeAliases = new Map([
  ['civic infrastructure', 'civic-infrastructure'],
  ['civic', 'civic-infrastructure'],
  ['ai safety', 'ai-safety'],
  ['alignment', 'ai-safety'],
  ['biosecurity', 'biosecurity'],
  ['factory farming', 'factory-farming'],
  ['animal welfare', 'factory-farming'],
  ['wild animal', 'wild-animal-suffering'],
  ['global poverty', 'global-poverty'],
  ['global health', 'global-poverty'],
  ['priorities research', 'priorities-research'],
  ['concentration of power', 'concentration-of-power'],
  ['governance', 'concentration-of-power'],
  ['future flourishing', 'future-flourishing']
]);

const mechanismAliases = new Map([
  ['redirect', 'redirect'],
  ['review', 'action'],
  ['audit', 'action'],
  ['behavior', 'trade'],
  ['reciprocal', 'trade'],
  ['trade', 'trade']
]);

function parseDatePhrase(text) {
  const iso = text.match(/(?:before|by)\s+(20\d{2}-\d{2}-\d{2})/i);
  if (iso) return iso[1];
  const named = text.match(/(?:before|by)\s+(january|february|march|april|may|june|july|august|september|october|november|december)\s+(\d{1,2})/i);
  if (!named) return '';
  const months = ['january','february','march','april','may','june','july','august','september','october','november','december'];
  const month = String(months.indexOf(named[1].toLowerCase()) + 1).padStart(2, '0');
  return `2026-${month}-${String(Number(named[2])).padStart(2, '0')}`;
}

function extractTerms(text) {
  const stop = new Set(['find','show','me','a','an','the','for','with','and','or','under','below','before','by','verified','people','person','offers','offer','pools','pool','co-fund','co-funds','cofund','cofunds','group-buying','group','buying','collective','collectively','fund','funding','moral','dominant','assurance','contract','contracts','near','threshold','available','trade','trades','opportunities','opportunity','within','of','to','in']);
  return text.toLowerCase().replace(/[^a-z0-9\s-]/g, ' ').split(/\s+/).filter((word) => word.length > 2 && !stop.has(word) && !/^\d+$/.test(word)).slice(0, 8);
}

function parseCommand(text, currentConstraints) {
  const lower = text.toLowerCase().trim();
  const constraints = {
    causes: [],
    offerKind: 'all',
    verifiedOnly: /\bverified\b/.test(lower),
    maximumCommitment: currentConstraints.maximumCommitment ?? 250,
    offerTypes: [],
    returnTypes: [],
    minimumReturnAmount: 0,
    recipient: '',
    evidence: '',
    flexibilities: [],
    deadlineBefore: parseDatePhrase(lower),
    mechanisms: [],
    availability: /\bavailable\b|\bopen to trade\b/.test(lower) ? 'available' : '',
    sort: 'best-fit',
    terms: []
  };

  const asksForCoFund = /\bco[- ]?funds?\b|\bgroup[- ]buy(?:ing)?\b|\bcollective(?:ly)? fund(?:ing)? (?:an? )?(?:offer|trade)\b/.test(lower);
  const asksForIndividualOffers = /\bindividual offers?\b|\bone[- ]to[- ]one offers?\b/.test(lower);
  let domain = 'offers';
  if (asksForCoFund) constraints.offerKind = 'co-fund';
  else if (asksForIndividualOffers) constraints.offerKind = 'individual';
  if (!asksForCoFund && /\bpeople\b|\bperson\b|\bwho\b|\bmember\b|\bresearcher\b|\bengineer\b/.test(lower)) domain = 'people';
  if (!asksForCoFund && /\bpool\b|\bpools\b|\bthreshold pool\b|\bstandalone threshold\b|\bdominant[- ]assurance contracts?\b|\bassurance contracts?\b|\bnear[- ]activation\b|\bnear[- ]threshold\b/.test(lower)) domain = 'pools';

  for (const [phrase, id] of causeAliases.entries()) {
    if (lower.includes(phrase) && !constraints.causes.includes(id)) constraints.causes.push(id);
  }
  for (const [phrase, id] of mechanismAliases.entries()) {
    if (lower.includes(phrase) && !constraints.mechanisms.includes(id)) constraints.mechanisms.push(id);
  }

  const [offerClause, ...returnParts] = lower.split(/\s+for\s+/);
  const returnClause = returnParts.length ? returnParts.join(' for ') : lower;
  const addType = (collection, type) => {
    if (!collection.includes(type)) collection.push(type);
  };

  if (/\b(fund|funding|pay|payment|pledge|cash)\b/.test(offerClause)) addType(constraints.offerTypes, 'fund');
  if (/\b(redirect|cancel(?:led|ing)? donation|donation offset)\b/.test(offerClause)) addType(constraints.offerTypes, 'donation');
  if (/\b(skill|software|engineering|design|research|review|audit|writing|facilitat\w*|interview\w*|verif\w*)\b/.test(offerClause)) addType(constraints.offerTypes, 'skill');
  if (/\b(action|hour|hours|meal|trip|volunteer|read|watch|replace|abstain|conduct|complete|work)\b/.test(offerClause)) addType(constraints.offerTypes, 'action');

  if (/\b(pay|paid|payment|stipend|reimburs\w*|cash)\b/.test(returnClause)) addType(constraints.returnTypes, 'payment');
  if (/\b(donat\w*|charity|public good|public-good|fund)\b/.test(returnClause)) addType(constraints.returnTypes, 'donation');
  if (/\b(deliverable|report|memo|repository|harness|benchmark|materials|publication|documentation)\b/.test(returnClause)) addType(constraints.returnTypes, 'deliverable');
  if (/\b(service|review of your|security review)\b/.test(returnClause)) addType(constraints.returnTypes, 'service');
  if (/\b(credit|recognition|attribution)\b/.test(returnClause)) addType(constraints.returnTypes, 'credit');
  if (/\b(rights|licen[cs]e|reuse)\b/.test(returnClause)) addType(constraints.returnTypes, 'rights');

  const max = lower.match(/(?:under|below|≤|max(?:imum)?(?: of)?)\s*\$?\s*([\d,]+)/i);
  if (max) constraints.maximumCommitment = Number(max[1].replace(/,/g, ''));
  else if (/\bunder one hundred\b/.test(lower)) constraints.maximumCommitment = 100;

  const minimumReturn = lower.match(/(?:at least|min(?:imum)?(?: of)?|≥)\s*\$?\s*([\d,]+)/i);
  if (minimumReturn) constraints.minimumReturnAmount = Number(minimumReturn[1].replace(/,/g, ''));

  const evidencePhrase = lower.match(/\b(third-party confirmation|public link|audit|benchmark|receipt|screenshot|photograph|photo|certificate|test run)\b/i);
  if (evidencePhrase) constraints.evidence = evidencePhrase[1].toLowerCase();

  if (/\bfixed(?: terms?)?\b/.test(lower)) constraints.flexibilities.push('fixed');
  if (/\bnegotiable\b|\bcounteroffers? allowed\b/.test(lower)) constraints.flexibilities.push('negotiable');
  if (/\bsubstitutions? allowed\b|\balternative action\b|\balternative evidence\b/.test(lower)) constraints.flexibilities.push('substitutions');

  if (/\bstrongest evidence\b/.test(lower)) constraints.sort = 'strongest-evidence';
  else if (/\blowest burden\b|\beasiest\b/.test(lower)) constraints.sort = 'lowest-burden';
  else if (/\bdeadline\b|\burgent\b/.test(lower)) constraints.sort = 'deadline';
  else if (/\bnewest\b|\brecent\b/.test(lower)) constraints.sort = 'newest';
  else if (/\bhighest value\b|\bmost impact\b/.test(lower)) constraints.sort = 'highest-value';
  else if (/\bclosest\b|\bnear threshold\b|\bnear-threshold\b/.test(lower)) constraints.sort = 'closest-activation';
  else if (/\bmost contributors\b/.test(lower)) constraints.sort = 'most-contributors';
  else if (/\breliab/.test(lower)) constraints.sort = 'reliability';

  constraints.terms = extractTerms(lower).filter((term) => ![...causeAliases.keys()].some((phrase) => phrase.split(' ').includes(term)));

  const exactConstraintCount = [
    constraints.causes.length > 0,
    constraints.offerKind !== 'all',
    constraints.verifiedOnly,
    constraints.maximumCommitment < 250,
    constraints.offerTypes.length > 0,
    constraints.returnTypes.length > 0,
    constraints.minimumReturnAmount > 0,
    Boolean(constraints.recipient),
    Boolean(constraints.evidence),
    constraints.flexibilities.length > 0,
    Boolean(constraints.deadlineBefore),
    constraints.mechanisms.length > 0,
    Boolean(constraints.availability)
  ].filter(Boolean).length;

  const view = domain === 'people' ? 'trust' : domain === 'pools' ? 'threshold' : constraints.offerKind !== 'all' || exactConstraintCount >= 2 ? 'list' : 'value';
  const routeReason = domain === 'people'
    ? 'Opened Trust network because the query is looking for a person or relationship.'
    : domain === 'pools'
      ? 'Opened Threshold because the query concerns a standalone threshold-funded moral public good.'
      : constraints.offerKind === 'co-fund'
        ? 'Opened Offers because Co-Funds are collective fulfillment of one side of a reciprocal moral trade.'
        : constraints.offerKind === 'individual'
          ? 'Opened Offers because the query asks for individual reciprocal opportunities.'
          : exactConstraintCount >= 2
            ? `Opened List because this query contains ${exactConstraintCount} exact constraints across the exchange.`
            : 'Opened Value field because this is a broad opportunity search.';

  const parserConfidence = lower.length < 4 ? 'low' : constraints.causes.length || constraints.terms.length ? 'high' : 'medium';
  return { domain, view, constraints, exactConstraintCount, routeReason, parserConfidence };
}

function constraintTokens(constraints, domain) {
  const tokens = [];
  if (domain !== 'offers') tokens.push({ key: 'domain', label: domain[0].toUpperCase() + domain.slice(1) });
  constraints.causes.forEach((id) => tokens.push({ key: `cause:${id}`, label: causeAreas.find((cause) => cause.id === id)?.name || id }));
  if (constraints.offerKind === 'co-fund') tokens.push({ key: 'offerKind', label: 'Co-Funds' });
  if (constraints.offerKind === 'individual') tokens.push({ key: 'offerKind', label: 'Individual offers' });
  if (constraints.verifiedOnly) tokens.push({ key: 'verified', label: 'Verified only' });
  if (constraints.maximumCommitment < 250) tokens.push({ key: 'max', label: `You offer ≤ $${constraints.maximumCommitment}` });
  constraints.offerTypes.forEach((value) => tokens.push({ key: `offerType:${value}`, label: `You offer · ${offerTypeLabels[value] || value}` }));
  constraints.returnTypes.forEach((value) => tokens.push({ key: `returnType:${value}`, label: `You get · ${returnTypeLabels[value] || value}` }));
  if (constraints.minimumReturnAmount > 0) tokens.push({ key: 'minReturn', label: `You get ≥ $${constraints.minimumReturnAmount}` });
  if (constraints.recipient) tokens.push({ key: 'recipient', label: `Recipient · ${constraints.recipient}` });
  if (constraints.evidence) tokens.push({ key: 'evidence', label: `Evidence · ${constraints.evidence}` });
  constraints.flexibilities.forEach((value) => tokens.push({ key: `flexibility:${value}`, label: exchangeFlexibilityLabels[value] || value }));
  if (constraints.deadlineBefore) tokens.push({ key: 'deadline', label: `Before ${formatDate(constraints.deadlineBefore, { month: 'short', day: 'numeric' })}` });
  constraints.mechanisms.forEach((value) => tokens.push({ key: `mechanism:${value}`, label: value[0].toUpperCase() + value.slice(1) }));
  if (constraints.availability) tokens.push({ key: 'availability', label: 'Available' });
  constraints.terms.forEach((value) => tokens.push({ key: `term:${value}`, label: value }));
  return tokens;
}

function removeConstraintToken(constraints, key) {
  const next = structuredClone(constraints);
  if (key === 'offerKind') next.offerKind = 'all';
  else if (key === 'verified') next.verifiedOnly = false;
  else if (key === 'max') next.maximumCommitment = 250;
  else if (key === 'minReturn') next.minimumReturnAmount = 0;
  else if (key === 'recipient') next.recipient = '';
  else if (key === 'evidence') next.evidence = '';
  else if (key === 'deadline') next.deadlineBefore = '';
  else if (key === 'availability') next.availability = '';
  else if (key.startsWith('cause:')) next.causes = next.causes.filter((id) => id !== key.slice(6));
  else if (key.startsWith('offerType:')) next.offerTypes = next.offerTypes.filter((id) => id !== key.slice(10));
  else if (key.startsWith('returnType:')) next.returnTypes = next.returnTypes.filter((id) => id !== key.slice(11));
  else if (key.startsWith('flexibility:')) next.flexibilities = next.flexibilities.filter((id) => id !== key.slice(12));
  else if (key.startsWith('mechanism:')) next.mechanisms = next.mechanisms.filter((id) => id !== key.slice(10));
  else if (key.startsWith('term:')) next.terms = next.terms.filter((term) => term !== key.slice(5));
  return next;
}

function daysUntil(date) {
  return Math.max(0, Math.ceil((new Date(`${date}T23:59:59`) - today) / 86400000));
}

function formatDate(date, options = { month: 'short', day: 'numeric' }) {
  if (!date) return 'No deadline';
  return new Intl.DateTimeFormat('en-US', { ...options, timeZone: 'UTC' }).format(new Date(`${date}T12:00:00Z`));
}

function deriveOfferMetrics(offer) {
  // Burden is a transparent, bounded index. The weights are visible in the methodology panel.
  const moneyComponent = Math.min(35, (offer.moneyCost / 250) * 35);
  const timeComponent = Math.min(25, (offer.timeMinutes / 180) * 25);
  const behaviorComponent = Math.min(20, (offer.behaviorFriction / 5) * 20);
  const verificationComponent = Math.min(20, (offer.verificationBurden / 5) * 20);
  const burden = Math.min(100, moneyComponent + timeComponent + behaviorComponent + verificationComponent);
  const expectedValue = Math.min(100, (offer.impactEstimate / 5) * offer.evidenceConfidence * offer.valueAlignment * 100);
  const evidence = offer.evidenceConfidence * 100;
  return {
    burden,
    expectedValue,
    evidence,
    components: { moneyComponent, timeComponent, behaviorComponent, verificationComponent },
    burdenLabel: burden <= 30 ? 'Lower burden' : burden <= 60 ? 'Moderate burden' : 'Higher burden',
    valueLabel: expectedValue >= 68 ? 'Stronger supported value' : expectedValue >= 45 ? 'Moderate supported value' : 'Early evidence'
  };
}

function derivePoolMetrics(pool) {
  const gap = Math.max(0, pool.threshold - pool.funded);
  const gapRatio = gap / pool.threshold;
  const urgencyDays = Math.max(1, daysUntil(pool.deadline));
  const urgency = Math.max(0, Math.min(1, 1 - urgencyDays / 45));
  const status = pool.status === 'at-risk' || (gapRatio > 0.45 && urgencyDays <= 14)
    ? 'at-risk'
    : gapRatio <= 0.1
      ? 'near-threshold'
      : 'on-track';
  const activationLeverage = pool.threshold / Math.max(gap, 1);
  return {
    gap,
    gapRatio,
    urgency,
    urgencyDays,
    activationLeverage,
    status,
    statusLabel: status === 'near-threshold' ? 'Near threshold' : status === 'at-risk' ? 'At risk' : 'On track'
  };
}

function textScore(item, terms) {
  if (!terms.length) return 0;
  const exchangeText = item.exchange ? [...item.exchange.offer.alternatives.flat(), ...item.exchange.return.alternatives.flat(), item.exchange.offer.recipient, item.exchange.return.recipient, item.proof, item.evidenceLevel, item.disputeTerms].join(' ') : '';
  const haystack = `${item.title || item.name} ${item.description || ''} ${(item.tags || []).join(' ')} ${item.requester || ''} ${item.role || ''} ${item.give || ''} ${item.receive || ''} ${exchangeText}`.toLowerCase();
  return terms.reduce((score, term) => score + (haystack.includes(term) ? 8 : 0), 0);
}

function offerMatch(offer, constraints) {
  const metrics = deriveOfferMetrics(offer);
  const reasons = [];
  const exchange = offer.exchange;
  let score = 20;
  if (!exchange) return { include: false, score: 0, reasons: [] };
  if (constraints.offerKind !== 'all' && offer.listingKind !== constraints.offerKind) return { include: false, score: 0, reasons: [] };
  if (constraints.offerKind === 'co-fund') reasons.push('Co-Fund');
  if (constraints.offerKind === 'individual') reasons.push('individual offer');
  if (constraints.causes.length) {
    if (!constraints.causes.includes(offer.causeId)) return { include: false, score: 0, reasons: [] };
    score += 30;
    reasons.push(causeAreas.find((cause) => cause.id === offer.causeId)?.name || offer.causeId);
  }
  if (constraints.verifiedOnly) {
    if (!offer.verified) return { include: false, score: 0, reasons: [] };
    score += 14;
    reasons.push('verified-only');
  }
  if (offer.moneyCost > constraints.maximumCommitment) return { include: false, score: 0, reasons: [] };
  if (constraints.maximumCommitment < 250) {
    score += 10;
    reasons.push(`you offer under $${constraints.maximumCommitment}`);
  }
  if (!exchangeTypesMatch(constraints.offerTypes, exchange.offer.types, 'offer')) return { include: false, score: 0, reasons: [] };
  if (constraints.offerTypes.length) reasons.push('what you offer');
  if (!exchangeTypesMatch(constraints.returnTypes, exchange.return.types, 'return')) return { include: false, score: 0, reasons: [] };
  if (constraints.returnTypes.length) reasons.push('what you get');
  if (Number(exchange.return.amount || 0) < constraints.minimumReturnAmount) return { include: false, score: 0, reasons: [] };
  if (constraints.minimumReturnAmount > 0) reasons.push(`you get at least $${constraints.minimumReturnAmount}`);
  if (constraints.recipient) {
    const recipientText = `${exchange.return.recipient} ${exchange.return.alternatives.flat().join(' ')}`.toLowerCase();
    if (!recipientText.includes(constraints.recipient.toLowerCase())) return { include: false, score: 0, reasons: [] };
    reasons.push('recipient or destination');
  }
  if (constraints.evidence) {
    const evidenceText = `${offer.evidenceLevel} ${offer.proof} ${offer.disputeTerms} ${exchange.offer.alternatives.flat().join(' ')} ${exchange.return.alternatives.flat().join(' ')}`.toLowerCase();
    if (!evidenceText.includes(constraints.evidence.toLowerCase())) return { include: false, score: 0, reasons: [] };
    reasons.push('evidence method');
  }
  if (constraints.flexibilities.length && !constraints.flexibilities.some((value) => [exchange.offer.flexibility, exchange.return.flexibility].includes(value))) {
    return { include: false, score: 0, reasons: [] };
  }
  if (constraints.flexibilities.length) reasons.push('negotiability');
  if (constraints.deadlineBefore && offer.deadline > constraints.deadlineBefore) return { include: false, score: 0, reasons: [] };
  if (constraints.deadlineBefore) reasons.push(`before ${formatDate(constraints.deadlineBefore, { month: 'short', day: 'numeric' })}`);
  if (constraints.mechanisms.length && !constraints.mechanisms.includes(offer.mechanism)) return { include: false, score: 0, reasons: [] };
  if (constraints.mechanisms.length) reasons.push(offer.mechanism);
  const termPoints = textScore(offer, constraints.terms);
  score += termPoints;
  if (termPoints) reasons.push('query terms');
  if (userPreferences.causes.includes(offer.causeId)) {
    score += 8;
    reasons.push('your saved causes');
  }
  if (offer.tags?.some((tag) => userPreferences.preferredTags.includes(tag))) {
    score += 6;
    reasons.push('your stated preferences');
  }
  score += metrics.expectedValue * 0.12;
  score += (100 - metrics.burden) * 0.07;
  score += offer.evidenceConfidence * 8;
  if (offer.status === 'expired') score -= 80;
  if (offer.status === 'stale') score -= 15;
  return { include: true, score, reasons: [...new Set(reasons)].slice(0, 4), metrics };
}

function poolMatch(pool, constraints) {
  const metrics = derivePoolMetrics(pool);
  const reasons = [];
  if (constraints.causes.length && !constraints.causes.includes(pool.causeId)) return { include: false, score: 0, reasons: [] };
  if (constraints.causes.length) reasons.push(causeAreas.find((cause) => cause.id === pool.causeId)?.name || pool.causeId);
  if (constraints.verifiedOnly && !pool.verified) return { include: false, score: 0, reasons: [] };
  if (constraints.verifiedOnly) reasons.push('verified-only');
  const searchText = `${pool.title} ${pool.description} ${pool.requester}`.toLowerCase();
  const termScore = constraints.terms.reduce((sum, term) => sum + (searchText.includes(term) ? 8 : 0), 0);
  if (termScore) reasons.push('query terms');
  let score = 30 + (1 - metrics.gapRatio) * 35 + pool.evidenceConfidence * 20 + termScore;
  if (metrics.status === 'near-threshold') reasons.push('near threshold');
  return { include: true, score, reasons: [...new Set(reasons)].slice(0, 4), metrics };
}

function personMatch(person, constraints) {
  const reasons = [];
  if (constraints.causes.length && !person.causeIds.some((id) => constraints.causes.includes(id))) return { include: false, score: 0, reasons: [] };
  if (constraints.causes.length) reasons.push('cause alignment');
  if (constraints.verifiedOnly && !person.verified) return { include: false, score: 0, reasons: [] };
  if (constraints.verifiedOnly) reasons.push('verified-only');
  if (constraints.availability && !/available|open/i.test(person.availability)) return { include: false, score: 0, reasons: [] };
  if (constraints.availability) reasons.push('available');
  const searchText = `${person.name} ${person.role} ${person.reciprocal} ${person.causeIds.join(' ')}`.toLowerCase();
  const termScore = constraints.terms.reduce((sum, term) => sum + (searchText.includes(term) ? 8 : 0), 0);
  if (termScore) reasons.push('query terms');
  let score = 20 + person.reliability * 0.35 + Math.min(20, person.commitments) + termScore;
  if (person.trust.includes('Direct') || person.trust.includes('completed')) {
    score += 14;
    reasons.push('strong trust route');
  }
  return { include: true, score, reasons: [...new Set(reasons)].slice(0, 4) };
}

function sortResults(items, domain, sort) {
  const list = [...items];
  const compareDate = (a, b) => new Date(a.item.deadline || a.item.created || 0) - new Date(b.item.deadline || b.item.created || 0);
  const offerSorters = {
    'best-fit': (a, b) => b.match.score - a.match.score,
    'lowest-burden': (a, b) => a.match.metrics.burden - b.match.metrics.burden,
    'strongest-evidence': (a, b) => b.item.evidenceConfidence - a.item.evidenceConfidence,
    'deadline': compareDate,
    'highest-value': (a, b) => b.match.metrics.expectedValue - a.match.metrics.expectedValue,
    'newest': (a, b) => new Date(b.item.created || b.item.deadline || 0) - new Date(a.item.created || a.item.deadline || 0)
  };
  const poolSorters = {
    'best-fit': (a, b) => b.match.score - a.match.score,
    'closest-activation': (a, b) => a.match.metrics.gapRatio - b.match.metrics.gapRatio,
    'greatest-leverage': (a, b) => b.match.metrics.activationLeverage - a.match.metrics.activationLeverage,
    'deadline-risk': (a, b) => a.match.metrics.urgencyDays - b.match.metrics.urgencyDays,
    'smallest-gap': (a, b) => a.match.metrics.gap - b.match.metrics.gap,
    'most-contributors': (a, b) => b.item.contributors - a.item.contributors
  };
  const peopleSorters = {
    'best-fit': (a, b) => b.match.score - a.match.score,
    'trust-route': (a, b) => (a.item.route.split('→').length - b.item.route.split('→').length) || b.item.commitments - a.item.commitments,
    'reciprocal': (a, b) => b.match.score - a.match.score,
    'availability': (a, b) => Number(/available|open/i.test(b.item.availability)) - Number(/available|open/i.test(a.item.availability)),
    'reliability': (a, b) => b.item.reliability - a.item.reliability,
    'recently-verified': (a, b) => a.item.recentlyVerified - b.item.recentlyVerified
  };
  const sorter = domain === 'offers' ? offerSorters[sort] : domain === 'pools' ? poolSorters[sort] : peopleSorters[sort];
  return list.sort(sorter || ((a, b) => b.match.score - a.match.score));
}

function activeFilterCount(constraints) {
  return constraints.causes.length
    + Number(constraints.offerKind !== 'all')
    + Number(constraints.verifiedOnly)
    + Number(constraints.maximumCommitment < 250)
    + constraints.offerTypes.length
    + constraints.returnTypes.length
    + Number(constraints.minimumReturnAmount > 0)
    + Number(Boolean(constraints.recipient))
    + Number(Boolean(constraints.evidence))
    + constraints.flexibilities.length
    + Number(Boolean(constraints.deadlineBefore))
    + constraints.mechanisms.length
    + Number(Boolean(constraints.availability));
}
